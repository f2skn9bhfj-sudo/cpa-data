      "Un élément probant doit être SUFFISANT (quantité, fonction du risque) et APPROPRIÉ (qualité = pertinence + fiabilité).",
      { ul: [
        "Hiérarchie de fiabilité : externe > interne · obtenu directement par l'auditeur > fourni par le client · écrit > oral · original > copie/scan.",
        "IPE (Information Produced by the Entity) : TOUT rapport ou extraction du client que tu utilises comme élément probant (balance âgée, liste de stock, état de paie…) doit lui-même être testé.",
        "Tester un IPE = exhaustivité (le rapport concorde-t-il au GL/TB ? totaux refaits ?) + exactitude (paramètres d'extraction vérifiés, échantillon de lignes pointé vers la source).",
      ]},
      { note: "Réflexe avant d'utiliser n'importe quel fichier client : « D'où sort-il, et qu'est-ce qui me prouve qu'il est complet et juste ? » Une procédure bâtie sur un IPE non testé ne vaut rien en review." },
    ]},
    { t: "card", ref: "I.2", title: "Échantillonnage (ISA 530)", body: [
      { ul: [
        "Étape 1 — key items : éléments > TE ou atypiques (montants ronds, contreparties liées, fin de période) testés à 100 %.",
        "Étape 2 — échantillon représentatif sur la population restante (statistique ou non).",
        "MUS (Monetary Unit Sampling) : probabilité de sélection proportionnelle au montant — efficace contre la SURÉVALUATION (actifs, produits).",
        "Taille d'échantillon ↑ si : risque ↑, TE ↓, erreur attendue ↑, peu d'assurance issue d'autres procédures.",
        "Erreur trouvée → la PROJETER sur la population (sauf erreur isolée démontrée et documentée), puis comparer à la TE.",
      ]},
      { note: "Interdit : remplacer un élément sélectionné parce que la pièce est « difficile à obtenir ». C'est un biais de sélection — l'élément introuvable se traite comme une exception." },

        "Fixer le seuil d'écart acceptable AVANT la comparaison (en lien avec la TE).",
        "Comparer l'attente au montant comptabilisé.",
        "Investiguer tout écart > seuil : explication corroborée par des pièces — jamais la seule parole du client.",
      ]},
      "Exemple paie : effectif moyen mensuel × salaire moyen par catégorie + charges sociales au taux légal → attente vs charge comptabilisée. Plus l'attente est précise, plus la SAP apporte d'assurance.",

    { t: "card", ref: "I.4", title: "Ratios — ta revue analytique en 60 secondes", body: [
      { table: { head: ["Ratio", "Formule", "Lecture d'auditeur"], rows: [

        ["Rotation stock (DIO)", "Stock ÷ CMV × 360", "S'allonge → obsolescence, surévaluation ?"],

        "Réponses obligatoires sur tout audit : JE testing, revue du biais dans les estimations, examen des transactions inhabituelles significatives.",

      { ul: [
        "Component = entité ou business unit du groupe ; la component materiality est INFÉRIEURE à la matérialité groupe.",

        "Si tu audites la filiale suisse d'un groupe : tes deadlines de reporting groupe sont SACRÉES — un retard de composant bloque l'opinion groupe.",
        "Les questions de l'équipe groupe passent par ton senior — réponses écrites, précises, dans le format demandé.",

        "Vérifier : période couverte (recoupe l'exercice audité ?), périmètre, opinion de l'auditeur du prestataire, exceptions relevées.",

        ["Ajustant", "Condition qui EXISTAIT à la clôture", "Faillite d'un client sur créance existante, issue d'un litige en cours, prix de vente d'un stock déjà détenu", "Corriger les comptes"],

        "CO 959b : compte de résultat par nature OU par fonction.",
        "CO 959c : contenu minimal de l'annexe — dont la dissolution NETTE de réserves latentes si le résultat en est sensiblement plus favorable.",

      { note: "Esprit du CO : protection des créanciers et prudence (souvent guidée par le fiscal). Une « sous-évaluation » volontaire y est légale — alors qu'elle serait une anomalie en RPC ou IFRS. Toujours savoir sous quel référentiel tu conclus." },

    { t: "card", ref: "K.2", title: "Swiss GAAP RPC — vue staff", body: [
      { ul: [
        "Objectif : image fidèle (true & fair view) — réserves latentes interdites.",
        "Architecture : cadre conceptuel + RPC fondamentales (1–6) pour petites organisations ; ensemble des RPC au-delà ; RPC 31 en plus pour les cotées.",
        "RPC 16 prévoyance : engagement ou bénéfice ÉCONOMIQUE déterminé depuis les comptes (RPC 26) de la caisse LPP — pas de calcul actuariel à la IAS 19.",
        "RPC 23 provisions : obligation existante, sortie probable, estimable — pas de provisions de pure prudence.",
        "RPC 30 consolidation : goodwill activé et amorti (5 ans en règle générale, 20 max si justifié) OU imputé aux fonds propres avec présentation de l'effet théorique en annexe.",

    { t: "card", ref: "K.3", title: "IFRS — les 6 standards qui dominent les dossiers", tag: "IFRS", body: [
      { ul: [
        "IFRS 15 (revenu) : 5 étapes — contrat → obligations de prestation → prix de transaction → allocation → comptabilisation (à un moment ou progressivement). Teste : identification des OP, variable consideration, principal vs agent.",
        "IFRS 16 (preneur) : actif au titre du droit d'utilisation (ROU) + dette de location actualisée ; exemptions ≤ 12 mois / faible valeur ; charge front-loaded (amortissement + intérêts). Teste : exhaustivité des contrats, taux d'actualisation (IBR).",
        "IFRS 9 : classification coût amorti / FVOCI / FVTPL (business model + test SPPI) ; dépréciation ECL en 3 stades ; approche SIMPLIFIÉE pour créances commerciales : pertes attendues à vie via matrice de provision.",
        "IAS 36 : valeur recouvrable = max(valeur d'utilité ; juste valeur − coûts de sortie), au niveau de la CGU ; goodwill testé chaque année ; reprise de dépréciation interdite sur goodwill. Teste : hypothèses des DCF (croissance, WACC), sensibilités.",
        "IAS 12 : impôts différés sur différences temporelles (valeur comptable vs base fiscale) ; DTA seulement si bénéfices imposables futurs probables — scepticisme maximal sur l'activation de pertes reportables.",
        "IAS 19 : engagement (DBO) par méthode actuarielle (projected unit credit), écarts actuariels en OCI. Les plans LPP suisses sont généralement des plans à prestations définies sous IAS 19 → un engagement apparaît là où RPC/CO n'affichent rien.",

        ["Stocks", "Coût ; abattement fiscal d'un tiers toléré", "Plus bas du coût et de la VNR", "Plus bas du coût et de la VNR (IAS 2)"],
        ["Provisions", "Larges, charges futures admises", "Obligation existante uniquement (RPC 23)", "Obligation + actualisation si significatif (IAS 37)"],

        ["Prévoyance LPP", "Cotisations en charge", "RPC 16 : engagement/bénéfice économique via comptes de la caisse", "IAS 19 : DBO actuarielle, écarts en OCI"],
        ["Goodwill (conso)", "Conso selon principes reconnus", "RPC 30 : amorti ≤ 5 ans (20 max) ou imputé aux FP", "IFRS 3 : non amorti, test annuel IAS 36"],

    { t: "card", ref: "K.5", title: "Réserves latentes — le réflexe d'audit CO", body: [
      { ul: [
        "Vérifier le suivi : la plupart des fiduciaires tiennent un tableau des réserves latentes (constitution/dissolution par poste) — demande-le.",
        "Constitution : libre dans le cadre légal (amortissements supplémentaires, provisions de charges futures, sous-évaluation de stock).",
        "Dissolution nette → mention en annexe (959c al. 1 ch. 3) si le résultat en est sensiblement plus favorable — point d'audit classique.",
        "Passage CO → RPC/IFRS : les réserves latentes se retraitent intégralement. Si ton client publie en RPC et tient ses livres en CO, la table de passage est un workpaper central.",

        "Méthode indirecte : résultat net + éléments non monétaires (amortissements, provisions) ± variations du BFR = flux d'exploitation ; puis investissement ; puis financement.",
        "Le tie-out sacré : la variation de trésorerie du tableau = la variation des comptes de trésorerie au bilan, au franc près.",
        "Piège n°1 : les transactions non monétaires (nouveau leasing IFRS 16, conversion de dette en capital) ne passent PAS dans les flux — annexe seulement.",

  { w: "VE (valeur d'entreprise)", d: "Valeur de l'actif économique = valeur des fonds propres + dette nette. Les multiples d'EBITDA donnent la VE ; le vendeur encaisse la VFP." },
  { w: "WACC", d: "Coût moyen pondéré du capital : taux d'actualisation du DCF, mélange du coût des fonds propres et de la dette après impôt. Aussi le taux que tu challenges en test d'impairment." },
  { w: "FCF", d: "Free Cash Flow : flux de trésorerie disponible après investissements — la matière première du DCF et du désendettement d'un LBO." },
  { w: "Locked box", d: "Mécanisme de prix M&A : prix fixé sur un bilan de référence verrouillé, sans ajustement post-closing ; le vendeur garantit l'absence de fuites (leakage)." },
  { w: "SPA", d: "Share Purchase Agreement : le contrat de cession d'actions — prix, mécanisme d'ajustement, garanties actif-passif, conditions suspensives." },
  { w: "Garanties actif-passif", d: "Reps & warranties : déclarations du vendeur adossées aux comptes ; toute inexactitude révélée déclenche une indemnisation — l'audit devient contractuel." },
  { w: "Carried interest", d: "Intéressement de l'équipe du fonds de private equity : ≈ 20 % des gains au-delà d'un rendement minimal (hurdle)." },
  { w: "Drag / tag along", d: "Clauses de pacte d'actionnaires : drag = le majoritaire force la sortie de tous ; tag = le minoritaire a le droit de sortir aux mêmes conditions." },

const QUIZ = [
  { q: "Le « search for unrecorded liabilities » teste avant tout quelle assertion ?", opts: ["Existence des dettes", "Exhaustivité des dettes", "Classification des dettes", "Droits et obligations"], a: 1, why: "On cherche des dettes MANQUANTES : paiements post-clôture, factures reçues après clôture, GR/IR → exhaustivité." },
  { q: "Vouching (de la comptabilité vers la pièce) teste principalement…", opts: ["L'exhaustivité", "L'existence / occurrence", "Le cut-off", "La présentation"], a: 1, why: "On part d'un montant comptabilisé et on vérifie qu'il repose sur une transaction réelle. Le sens inverse (trace) teste l'exhaustivité." },
  { q: "Seuils du contrôle ordinaire (CO 727) :", opts: ["10 M bilan / 20 M CA / 50 ETP", "20 M bilan / 40 M CA / 250 ETP — 2 des 3, sur 2 exercices", "40 M bilan / 80 M CA / 500 ETP", "Uniquement les sociétés cotées"], a: 1, why: "Deux des trois seuils (20 M total bilan, 40 M CA, 250 ETP) dépassés sur deux exercices successifs — plus les cotées et les groupes tenus de consolider." },
  { q: "La TE (tolerable error / performance materiality) représente typiquement…", opts: ["5 % de la PM", "100 % de la PM", "50–75 % de la PM", "Le double de la PM"], a: 2, why: "La TE crée une marge de sécurité sous la PM pour absorber les anomalies non détectées. Le SAD nominal, lui, tourne autour de 5 % de la PM." },
  { q: "Présomption de risque de fraude selon ISA 240 :", opts: ["Sur la trésorerie", "Sur la reconnaissance du revenu", "Sur les immobilisations", "Sur la paie"], a: 1, why: "ISA 240 présume un risque de fraude sur le revenu, plus le risque de contournement des contrôles par la direction." },
  { q: "À l'inventaire, le test « rayon → liste » (floor-to-sheet) vise…", opts: ["L'existence", "L'exhaustivité", "La valorisation", "Le cut-off"], a: 1, why: "Un article présent physiquement doit figurer sur la liste : on teste que rien ne manque → exhaustivité. Liste → rayon teste l'existence." },
  { q: "Taux TVA hébergement en Suisse (2026) :", opts: ["2.6 %", "3.8 %", "8.1 %", "7.7 %"], a: 1, why: "Depuis le 1.1.2024 : 8.1 % normal, 2.6 % réduit, 3.8 % hébergement." },
  { q: "Impôt anticipé sur les dividendes suisses :", opts: ["15 %", "25 %", "35 %", "53.8 %"], a: 2, why: "35 %, à déclarer dans les 30 jours suivant l'échéance. (53.8 % est le brutage quand l'IA n'est pas répercuté au bénéficiaire.)" },
  { q: "CO 725b — en cas de raisons sérieuses de craindre un surendettement, le CA établit…", opts: ["Un seul bilan aux valeurs de liquidation", "Des bilans intermédiaires aux valeurs d'exploitation ET de liquidation", "Un budget de trésorerie uniquement", "Rien tant que l'AG n'a pas statué"], a: 1, why: "Deux bilans intermédiaires (exploitation + liquidation), audités ; avis au juge sauf postpositions suffisantes ou perspectives d'assainissement (sursis bref)." },
  { q: "Un client circularisé ne répond pas. Tu fais quoi ?", opts: ["Tu considères le solde confirmé", "Tu retires le client de l'échantillon", "Procédures alternatives : encaissements postérieurs, facture + BL", "Tu demandes au client d'appeler son client"], a: 2, why: "ISA 505 : non-réponse → procédures alternatives. Et l'envoi/la réception des confirmations restent sous contrôle de l'auditeur, jamais du client." },
  { q: "Rotation du réviseur responsable en contrôle ordinaire :", opts: ["5 ans", "7 ans, puis pause de 3 ans", "10 ans", "Pas de rotation en Suisse"], a: 1, why: "CO 730a : 7 ans au maximum, reprise possible après une interruption de 3 ans. Pas de rotation légale en contrôle restreint." },
  { q: "Un écart détecté de CHF 18'000, SAD nominal du mandat à CHF 15'000 :", opts: ["On l'ignore, c'est sous la PM", "On le reporte au Summary of Audit Differences", "On émet une réserve immédiatement", "On le corrige nous-mêmes dans la compta du client"], a: 1, why: "Au-dessus du SAD nominal → consigné au SUM/SAD ; c'est l'agrégat en fin d'audit qui est comparé à la matérialité. L'auditeur ne passe jamais d'écritures lui-même." },
  { q: "Le JE testing (ISA 240) cible en priorité…", opts: ["Les écritures automatiques récurrentes", "Les écritures manuelles inhabituelles : top-side, week-end, montants ronds, comptes sensibles", "Uniquement les écritures > PM", "Les écritures de TVA"], a: 1, why: "Le contournement des contrôles par la direction passe par des écritures manuelles atypiques — exactement ce que filtrent les analyzers Helix." },
  { q: "La NCR 2022 s'applique…", opts: ["Au contrôle ordinaire", "Au contrôle restreint", "Aux audits IFRS uniquement", "Aux sociétés cotées"], a: 1, why: "Norme suisse relative au contrôle restreint. Le contrôle ordinaire suit les NAS-CH (alignées ISA)." },
  { q: "Tester les derniers bons de livraison avant clôture et les premiers après vise…", opts: ["L'existence", "La séparation des exercices (cut-off)", "Les droits et obligations", "La classification"], a: 1, why: "On vérifie que la vente/charge est rattachée à la bonne période — le cut-off, double sens : ni trop tôt, ni trop tard." },
  { q: "Conditions de l'opting-out (CO 727a al. 2) :", opts: ["≤ 50 ETP, décision du CA", "≤ 10 ETP en moyenne annuelle + consentement de tous les actionnaires", "CA < 1 M uniquement", "Impossible en Suisse"], a: 1, why: "Les deux conditions sont cumulatives. La renonciation vaut aussi pour les années suivantes, révocable par tout actionnaire." },
  { q: "Première chose à faire avant de travailler sur un nouveau mandat :", opts: ["Demander la TB", "Confirmer ton indépendance vis-à-vis du client", "Envoyer la liste PBC", "Lire les workpapers de l'an passé"], a: 1, why: "Indépendance d'abord — confirmation par mandat + portefeuille de titres à jour. Ensuite seulement, le travail commence." },
  { q: "Une provision « de confort » volontairement excessive pour lisser le résultat est…", opts: ["Prudente, donc acceptable", "Une anomalie (surévaluation) à traiter comme les autres", "Un sujet purement fiscal", "Acceptable si le client insiste"], a: 1, why: "Le scepticisme joue dans les deux sens : une provision injustifiée fausse le résultat, même « par prudence ». IAS 37 / CO 960e exigent une obligation et une estimation fondée." },
  { q: "Tu utilises la balance âgée fournie par le client pour tester la provision créances. Avant tout, tu dois…", opts: ["La mettre en forme", "Tester son exhaustivité et son exactitude (IPE)", "L'envoyer au manager", "La comparer au budget"], a: 1, why: "C'est un IPE : concordance au GL/TB, totaux refaits, paramètres d'extraction vérifiés, lignes pointées vers la source. Sans ça, tout le test qui suit ne vaut rien." },
  { q: "Le MUS (Monetary Unit Sampling) est particulièrement efficace pour détecter…", opts: ["Les sous-évaluations", "Les surévaluations", "Les erreurs de classification", "Les fraudes informatiques"], a: 1, why: "La probabilité de sélection est proportionnelle au montant : les gros soldes (où se cachent les surévaluations d'actifs/produits) sont quasi sûrs d'être testés." },
  { q: "Première étape d'une procédure analytique substantive (ISA 520) :", opts: ["Demander l'explication du client", "Construire une attente indépendante", "Calculer l'écart", "Fixer la matérialité"], a: 1, why: "Attente indépendante d'abord (données fiables, désagrégées), seuil ensuite, comparaison, puis investigation corroborée des écarts." },
  { q: "Laquelle n'est PAS une approche de test d'une estimation selon ISA 540 ?", opts: ["Événements jusqu'à la date du rapport", "Tester méthode, données et hypothèses du management", "Développer sa propre estimation", "Accepter l'estimation si elle est prudente"], a: 3, why: "La « prudence » excessive est un biais comme un autre : une provision gonflée fausse aussi le résultat. Les trois vraies approches sont les options A, B et C." },
  { q: "Le triangle de la fraude :", opts: ["Pression, opportunité, rationalisation", "Motif, moyen, mobile", "Risque, contrôle, anomalie", "Direction, employés, tiers"], a: 0, why: "ISA 240 : incitation/pression + opportunité (contrôles faibles) + rationalisation. Supprimer un côté réduit le risque." },
  { q: "Les trois domaines des ITGC :", opts: ["Hardware, software, réseau", "Accès, gestion des changements, exploitation", "ERP, cloud, sauvegardes", "Conception, implémentation, efficacité"], a: 1, why: "Access to programs and data, program changes, computer operations. S'ils tombent, contrôles automatisés et IPE perdent leur fiabilité." },
  { q: "Anomalie significative ET généralisée (pervasive) dans les comptes → opinion :", opts: ["Avec réserve", "Défavorable", "Impossibilité d'exprimer une opinion", "Non modifiée avec paragraphe EOM"], a: 1, why: "Désaccord + caractère généralisé = opinion défavorable. La réserve suffit quand l'anomalie est significative mais circonscrite." },
  { q: "Impossibilité d'obtenir des éléments probants, à effet potentiellement généralisé → opinion :", opts: ["Défavorable", "Avec réserve", "Impossibilité d'exprimer une opinion", "Non modifiée"], a: 2, why: "Limitation de l'étendue généralisée = disclaimer. Si elle est circonscrite : réserve. La nature du problème (anomalie vs limitation) croisée avec son étendue donne la matrice des opinions." },
  { q: "Sous IFRS 16, le preneur comptabilise…", opts: ["Une charge de loyer linéaire", "Un actif ROU et une dette de location actualisée", "Uniquement une annexe", "Un actif seulement si option d'achat"], a: 1, why: "Quasi tous les contrats vont au bilan (sauf ≤ 12 mois / faible valeur) : ROU amorti + dette portant intérêts → charge front-loaded." },
  { q: "Dépréciation des créances commerciales sous IFRS 9 :", opts: ["Provision quand la créance est échue à 90 jours", "Approche simplifiée : pertes attendues à vie (matrice de provision)", "Stade 1 uniquement : pertes à 12 mois", "Aucune dépréciation avant défaut avéré"], a: 1, why: "Pour les créances commerciales, l'approche simplifiée impose d'emblée les lifetime ECL, typiquement via une matrice de taux par tranche d'ancienneté." },
  { q: "Goodwill en consolidation Swiss GAAP RPC 30 :", opts: ["Jamais activé", "Activé sans amortissement, test annuel", "Activé et amorti (5 ans en règle, 20 max) OU imputé aux fonds propres", "Toujours imputé au résultat"], a: 2, why: "Deux options RPC 30 — avec, en cas d'imputation aux fonds propres, présentation de l'effet théorique en annexe. IFRS 3, lui, interdit l'amortissement et impose le test annuel." },
  { q: "Une société CO dissout (en net) des réserves latentes et améliore sensiblement son résultat. Conséquence :", opts: ["Interdit par le CO", "Mention de la dissolution nette dans l'annexe (CO 959c)", "Retraitement obligatoire du bilan", "Communication à la FINMA"], a: 1, why: "Les réserves latentes sont licites sous CO ; seule la dissolution nette « sensiblement favorable » doit être mentionnée en annexe — point d'audit classique." },
  { q: "Tu trouves une erreur de CHF 2'000 dans ton échantillon représentatif de 25 factures. Réflexe :", opts: ["L'ignorer, c'est sous le SAD nominal", "La corriger et conclure", "La projeter sur la population et comparer à la TE", "Élargir l'échantillon à 50 d'office"], a: 2, why: "ISA 530 : toute erreur d'échantillon se projette (sauf erreur isolée démontrée). C'est l'erreur PROJETÉE qui se compare à la TE et part au SAD le cas échéant." },
  { q: "Le client refuse de corriger une anomalie documentée de 35'000 (PM 120'000). Elle devient…", opts: ["Sans objet, le client a tranché", "Une PAJE au SAD, agrégée en conclusion et listée dans la rep letter", "Une réserve automatique dans le rapport", "Un point de la management letter uniquement"], a: 1, why: "Le client peut refuser ; l'anomalie reste une anomalie non corrigée, agrégée (quantitatif ET qualitatif) à la matérialité en conclusion. La rep letter confirme que la direction la juge immatérielle." },
  { q: "Le CFO t'explique oralement un écart de manière convaincante. Cette explication est…", opts: ["Un élément probant suffisant si elle est plausible", "Un élément probant si tu la notes au workpaper", "Une piste — pas une preuve tant qu'une pièce ne la corrobore pas", "Suffisante si le senior est d'accord"], a: 2, why: "Une explication de la direction, aussi plausible soit-elle, doit être corroborée (pièce, recalcul, source externe). Réflexe N.6 : « quelle pièce corrobore cette explication ? »" },
  { q: "Premier audit d'un nouveau client (ISA 510) : ta préoccupation spécifique ?", opts: ["La rotation du réviseur", "Les soldes d'ouverture et la permanence des méthodes", "Le budget de l'an passé", "Les KAM du prédécesseur"], a: 1, why: "Une anomalie dans l'ouverture fausse le résultat de l'exercice audité : revue du dossier du prédécesseur ou procédures propres, et vérification de la permanence des méthodes." },
  { q: "Le client paie un loyer à la société immobilière de son actionnaire. Réflexe ?", opts: ["RAS si le contrat existe", "Partie liée (ISA 550) : conditions de marché, autorisation, annexe — et radar prestations appréciables", "Uniquement un sujet TVA", "Hors périmètre d'audit"], a: 1, why: "Transaction avec partie liée : substance, prix de marché, autorisation et information en annexe. Hors marché → prestation appréciable en argent (E.4) avec conséquences fiscales." },
  { q: "Dans un TFT en méthode indirecte, la signature d'un nouveau leasing IFRS 16 important apparaît…", opts: ["En flux d'investissement", "En flux de financement", "Nulle part dans les flux : transaction non monétaire, annexe seulement", "En flux d'exploitation"], a: 2, why: "À la signature, ROU contre dette : aucun mouvement de trésorerie. Seuls les paiements ultérieurs passent dans les flux (financement pour le principal). Piège classique du tie-out de TFT." },
  { q: "La provision de stock du client est calculée dans un Excel maison de 14 onglets. C'est…", opts: ["Un détail d'organisation", "Un EUC : formules, versions et recalcul à tester proportionnellement à l'enjeu", "Automatiquement fiable si le CFO l'a validé", "À refaire systématiquement par l'auditeur"], a: 1, why: "Un EUC matériel se teste : revue des formules clés, recalcul indépendant, contrôle de version — et souvent une recommandation en management letter." },
  { q: "Sous CO, une perte latente sur un forward EUR/CHF ouvert au 31.12 est…", opts: ["Ignorée jusqu'au dénouement", "Provisionnée (prudence), avec information en annexe", "Comptabilisée en OCI", "Compensée avec les gains latents"], a: 1, why: "Prudence CO : les pertes latentes sur positions ouvertes se provisionnent ; les gains latents ne sont en général pas reconnus. Et la confirmation bancaire liste les dérivés — croise-la." },
  { q: "Provision de restructuration au 31.12 : condition indispensable (IAS 37) ?", opts: ["Le budget N+1 prévoit la restructuration", "Un plan détaillé formalisé ET une attente fondée (annonce ou début d'exécution) avant la clôture", "L'accord oral du conseil d'administration", "La constitution d'une réserve équivalente"], a: 1, why: "Sans annonce ni début d'exécution avant la clôture, pas d'obligation actuelle → pas de provision. Et les pertes opérationnelles futures ne se provisionnent jamais." },
  { q: "Factoring « sans recours » : les créances cédées…", opts: ["Restent au bilan avec une dette en face", "Sortent du bilan (décomptabilisation) si le factor porte réellement le risque", "Passent en engagements hors bilan", "Sont reclassées en autres créances"], a: 1, why: "Sans recours = transfert du risque d'insolvabilité → décomptabilisation. Avec recours = financement, les créances restent. On lit le contrat, pas son titre." },
  { q: "Le client loge des charges de maintenance récurrentes dans le poste « exceptionnel » (CO 959b). Effet recherché ?", opts: ["Réduire l'impôt", "Embellir l'EBIT « opérationnel » présenté aux banques", "Simplifier l'annexe", "Aucun, c'est neutre"], a: 1, why: "Le classement ne change pas le résultat net mais maquille la performance récurrente — covenants et valorisations s'appuient sur l'EBIT. Le classement s'audite aussi (assertion classification)." },
  { q: "À la consolidation, l'écart de conversion de ta filiale allemande va…", opts: ["Au compte de résultat (charges financières)", "Directement dans les fonds propres (CTA / OCI)", "En provision", "En annexe uniquement"], a: 1, why: "Translation → fonds propres, jamais le P&L. Bilan au cours de clôture, P&L au cours moyen, l'écart en CTA — recyclé au résultat seulement à la cession (IFRS)." },
  { q: "Covenant brisé au 31.12 ; la banque signe un waiver le 25 janvier. Sous IFRS, la dette est…", opts: ["À long terme, le waiver règle tout", "Reclassée en court terme : le waiver est postérieur à la clôture", "Sortie du bilan", "Présentée à long terme avec une simple annexe"], a: 1, why: "IAS 1 : sans droit inconditionnel de différer le remboursement À la date de clôture, la dette est courante. Le waiver post-clôture compte pour le going concern, pas pour la classification." },
  { q: "Pour convertir le compte de résultat d'une filiale étrangère, on utilise…", opts: ["Le cours de clôture", "Le cours historique de chaque transaction", "Le cours moyen de la période", "Le cours budgété"], a: 2, why: "Méthode du cours de clôture : bilan au cours de clôture, P&L au cours moyen, capitaux propres aux cours historiques — la différence forme le CTA en fonds propres." },
  { q: "La direction veut provisionner les pertes d'exploitation attendues de N+1 (« prudence »). Réponse ?", opts: ["OK, la prudence est un principe du CO", "Non : pas d'obligation actuelle née d'un événement passé → pas de provision", "OK si l'AG l'approuve", "OK mais à 50 % seulement"], a: 1, why: "Arbre T.3, question 1 : les pertes futures ne résultent d'aucune obligation actuelle. Ni IAS 37, ni RPC 23 — et même sous CO, ce serait une réserve latente à suivre comme telle, pas une « provision » innocente." },
  { q: "Remplacement du moteur d'une machine (+5 ans de durée de vie) vs peinture de l'atelier :", opts: ["Les deux en charges", "Les deux à l'actif", "Moteur activé (améliore la capacité/durée), peinture en charge (entretien)", "Moteur en charge, peinture activée"], a: 2, why: "Arbre T.2 : l'amélioration qui augmente capacité ou durée s'active (composante) ; l'entretien qui remet en état reste en charge." },
  { q: "Un prêt actionnaire postposé (725b) devient-il des fonds propres ?", opts: ["Oui, c'est le but de la postposition", "Non : il reste une dette — la postposition protège du surendettement, elle ne convertit rien", "Oui si l'AG le décide", "Seulement sous IFRS"], a: 1, why: "Arbre T.8 : l'obligation de rembourser subsiste (simplement subordonnée). Pour créer des fonds propres, il faut un abandon de créance ou un versement à fonds perdus (P.5)." },
  { q: "L'actif économique (capitaux employés) d'une entreprise, c'est…", opts: ["Le total du bilan", "Actifs immobilisés + besoin en fonds de roulement", "Les fonds propres + la trésorerie", "Les actifs circulants uniquement"], a: 1, why: "AE = immobilisations + BFR, financé en miroir par capitaux propres + dette financière nette. Sur Exemplum : 9'500 + 4'010 = 13'510 (U.1)." },
  { q: "Une entreprise rentable peut-elle faire faillite ?", opts: ["Non, la rentabilité protège", "Oui : la LIQUIDITÉ (payer à tout moment) peut se rompre même avec une bonne solvabilité", "Seulement si elle est surendettée", "Uniquement en cas de fraude"], a: 1, why: "Liquidité ≠ solvabilité (U.2). Un BFR qui explose ou un mur de dette bullet peut tuer une société rentable — d'où le going concern centré sur le plan de TRÉSORERIE à 12 mois." },
  { q: "Une dette « bullet » de 5'000 arrive à échéance dans 8 mois, sans refinancement signé. Réflexe ?", opts: ["RAS, elle est encore à long terme", "Reclassement en court terme + question going concern : comment sera-t-elle remboursée ?", "On attend le refinancement", "On la provisionne"], a: 1, why: "Exigible à moins de 12 mois → court terme (T.7) ; et un mur de refinancement sans accord signé à la clôture est un sujet ISA 570 immédiat." },
  { q: "EBITDA 10, multiple 8×, dette nette 25. Le vendeur encaisse…", opts: ["80 (la valeur d'entreprise)", "55 : VE 80 − dette nette 25 = valeur des fonds propres", "105", "80 + la trésorerie"], a: 1, why: "Les multiples d'EBITDA donnent la VE ; le chèque du vendeur = VFP = VE − dette nette. Et chaque ligne de la « dette nette » se négocie dans le SPA (U.9)." },
  { q: "Mécanisme « locked box » dans un SPA :", opts: ["Le prix s'ajuste sur la dette nette réelle au closing", "Prix fixé sur un bilan de référence verrouillé, sans ajustement — avec clause de leakage", "Le prix est séquestré chez un notaire", "Un earn-out obligatoire"], a: 1, why: "Locked box = certitude de prix dès le signing ; l'alternative (completion accounts) ajuste sur les comptes de closing — souvent audités. Deux philosophies, deux types de travaux pour l'auditeur (U.11)." },
  { q: "Les 3 leviers de création de valeur d'un LBO :", opts: ["Dividendes, rachats d'actions, fusion", "Croissance de l'EBITDA, désendettement, expansion du multiple", "Synergies, dilution, relution", "Taux, change, inflation"], a: 1, why: "Teste-les dans le simulateur (U.14) : croissance à 0 + dette à 80 % = pur effet de levier ; le multiple de sortie est le levier le moins contrôlable." },

// COMPOSANTS

function BodyItem({ it }) {
  if (typeof it === "string") return <p>{it}</p>;
  if (it.ul) return <ul className="fm-ul">{it.ul.map((x, i) => <li key={i}>{x}</li>)}</ul>;
  if (it.ol) return <ol className="fm-ol">{it.ol.map((x, i) => <li key={i}>{x}</li>)}</ol>;
  if (it.note) return <div className="fm-note">{it.note}</div>;
  if (it.table) {
    return (
      <div className="fm-twrap">
        <table className="fm-t">
          <thead><tr>{it.table.head.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
          <tbody>
            {it.table.rows.map((r, i) => (
              <tr key={i}>{r.map((c, j) => <td key={j}>{c}</td>)}</tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }
  return null;
}

function Card({ b }) {
  return (
    <div className="fm-card" id={"wp-" + b.ref}>
      <div className="fm-card-h">
        <span className="ref">{b.ref}</span>
        <h3>{b.title}</h3>
        {b.tag && <span className="tag">{b.tag}</span>}
      </div>
      <div className="fm-card-b">
        {b.body.map((it, i) => <BodyItem key={i} it={it} />)}
      </div>
    </div>
  );
}

function Callout({ b }) {
  const ic = b.kind === "warn" ? "STOP" : b.kind === "gold" ? "CLÉ" : "TIP";
  return (
    <div className={"fm-call " + b.kind}>
      <span className="ic">{ic}</span>
      <div>{b.x}</div>
    </div>
  );
}

function CaseCard({ b }) {
  const [show, setShow] = useState(false);
  return (
    <div className="fm-card" id={"wp-" + b.ref}>
      <div className="fm-card-h">
        <span className="ref">{b.ref}</span>
        <h3>{b.title}</h3>
        {b.tag && <span className="tag">{b.tag}</span>}
      </div>
      <div className="fm-card-b">
        {b.enonce.map((it, i) => <BodyItem key={i} it={it} />)}
        <button className="fm-btn y" onClick={() => setShow(!show)} style={{ marginTop: 8 }}>
          {show ? "Masquer le corrigé" : "Voir le corrigé"}
        </button>
        {show && (
          <div className="fm-corrige">
            <div className="fm-corrige-label">Corrigé</div>
            {b.corrige.map((it, i) => <BodyItem key={i} it={it} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function Checklist({ b }) {
  const [done, setDone] = useState(() => new Set());
  const toggle = (i) => {
    setDone((prev) => {
      const n = new Set(prev);
      n.has(i) ? n.delete(i) : n.add(i);
      return n;
    });
  };
  return (
    <div className="fm-checkcard" id={"wp-" + b.ref}>
      <div className="fm-card-h">
        <span className="ref">{b.ref}</span>
        <h3>{b.title}</h3>
        <span className="tag fm-progress">{done.size}/{b.items.length}{" "}
          {done.size > 0 && (
            <button className="fm-reset" onClick={() => setDone(new Set())}>reset</button>
          )}
        </span>
      </div>
      {b.items.map((x, i) => (
        <div key={i} className={"fm-checkitem" + (done.has(i) ? " done" : "")} onClick={() => toggle(i)}>
          <span className="fm-box">{done.has(i) ? "✓" : ""}</span>
          <span>{x}</span>
        </div>
      ))}
    </div>
  );
}

function Quiz() {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [over, setOver] = useState(false);
  const q = QUIZ[idx];

  const pick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    if (i === q.a) setScore((s) => s + 1);
  };
  const next = () => {
    if (idx + 1 >= QUIZ.length) { setOver(true); return; }
    setIdx(idx + 1); setPicked(null);
  };
  const restart = () => { setIdx(0); setPicked(null); setScore(0); setOver(false); };

  if (over) {
    const pct = Math.round((score / QUIZ.length) * 100);
    return (
      <div className="fm-card">
        <div className="fm-card-b" style={{ textAlign: "center", padding: "28px 16px" }}>
          <div className="fm-result-src">Résultat</div>
          <div className="fm-score">{score}/{QUIZ.length}</div>
          <p style={{ color: "#6E6E64" }}>
            {pct === 100 ? "Sans-faute. Tu es prêt pour le terrain." :
             pct >= 75 ? "Solide. Revois les explications des questions ratées et refais-le." :
             "Bonne base — relis les sections C et D, puis recommence."}
          </p>
          <button className="fm-btn y" onClick={restart}>Recommencer</button>
        </div>
      </div>
    );
  }

  return (
    <div className="fm-card">
      <div className="fm-card-h">
        <span className="ref">{idx + 1}/{QUIZ.length}</span>
        <h3>Quiz — fondamentaux du staff</h3>
        <span className="tag">score {score}</span>
      </div>
      <div className="fm-card-b">
        <div className="fm-quiz-q">{q.q}</div>
        {q.opts.map((o, i) => {
          let cls = "fm-opt";
          if (picked !== null) {
            if (i === q.a) cls += " ok";
            else if (i === picked) cls += " ko";
          }
          return (
            <button key={i} className={cls} onClick={() => pick(i)}>
              <span style={{ fontFamily: "'IBM Plex Mono',monospace", fontSize: 11, marginRight: 8 }}>
                {String.fromCharCode(65 + i)}
              </span>
              {o}
            </button>
          );
        })}
        {picked !== null && (
          <div>
            <div className="fm-note">{q.why}</div>
            <button className="fm-btn" onClick={next}>
              {idx + 1 >= QUIZ.length ? "Voir le résultat" : "Question suivante"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function LboSim() {
  const [eb, setEb] = useState("10");
  const [m0, setM0] = useState("8");
  const [dp, setDp] = useState("60");
  const [g, setG] = useState("5");
  const [m1, setM1] = useState("8");
  const [rp, setRp] = useState("50");
  const num = (x) => { const n = parseFloat(String(x).replace(",", ".")); return isNaN(n) ? 0 : n; };
  const f1 = (n) => (Math.round(n * 10) / 10).toLocaleString("fr-CH");
  const EV0 = num(eb) * num(m0);
  const D0 = EV0 * num(dp) / 100;
  const Eq0 = EV0 - D0;
  const EB5 = num(eb) * Math.pow(1 + num(g) / 100, 5);
  const EV5 = EB5 * num(m1);
  const D5 = D0 * (1 - num(rp) / 100);
  const Eq5 = EV5 - D5;
  const gr = (EB5 - num(eb)) * num(m0);
  const mu = EB5 * (num(m1) - num(m0));
  const de = D0 - D5;
  const ok = Eq0 > 0;
  const mom = ok ? Eq5 / Eq0 : 0;
  const irr = ok && mom > 0 ? (Math.pow(mom, 1 / 5) - 1) * 100 : 0;
  const maxAbs = Math.max(Math.abs(gr), Math.abs(mu), Math.abs(de), 1);
  const Bar = ({ label, v }) => (
    <div className="fm-bar-row">
      <span className="lb">{label}</span>
      <div className="fm-bar-wrap"><div className={"fm-bar " + (v >= 0 ? "pos" : "neg")} style={{ width: Math.min(100, Math.abs(v) / maxAbs * 100) + "%" }} /></div>
      <span className="fm-bar-val">{v >= 0 ? "+" : "−"}{f1(Math.abs(v))}</span>
    </div>
  );
  return (
    <div className="fm-card">
      <div className="fm-card-h"><span className="ref">TOOL</span><h3>Simulateur LBO — les 3 leviers de création de valeur</h3><span className="tag">joue !</span></div>
      <div className="fm-card-b">
        <div className="fm-mc">
          <label>EBITDA (M)<input value={eb} onChange={(e) => setEb(e.target.value)} inputMode="decimal" /></label>
          <label>Multiple d'entrée (×)<input value={m0} onChange={(e) => setM0(e.target.value)} inputMode="decimal" /></label>
          <label>Dette à l'entrée (%)<input value={dp} onChange={(e) => setDp(e.target.value)} inputMode="decimal" /></label>
          <label>Croissance EBITDA (%/an)<input value={g} onChange={(e) => setG(e.target.value)} inputMode="decimal" /></label>
          <label>Multiple de sortie (×)<input value={m1} onChange={(e) => setM1(e.target.value)} inputMode="decimal" /></label>
          <label>Dette remboursée en 5 ans (%)<input value={rp} onChange={(e) => setRp(e.target.value)} inputMode="decimal" /></label>
        </div>
        {!ok ? (
          <div className="fm-note">Structure impossible : la dette dépasse la valeur d'entreprise (equity initial ≤ 0). Baisse le % de dette.</div>
        ) : (
          <div>
            <div className="fm-twrap"><table className="fm-t"><thead><tr><th></th><th>Entrée</th><th>Sortie (an 5)</th></tr></thead><tbody>
              <tr><td>Valeur d'entreprise</td><td>{f1(EV0)}</td><td>{f1(EV5)}</td></tr>
              <tr><td>Dette</td><td>{f1(D0)}</td><td>{f1(D5)}</td></tr>
              <tr><td>Equity (fonds propres)</td><td>{f1(Eq0)}</td><td>{f1(Eq5)}</td></tr>
            </tbody></table></div>
            <p style={{ margin: "8px 0 4px" }}><b>Multiple : ×{f1(mom)}</b> · TRI ≈ {f1(irr)} %/an</p>
            <div className="fm-fsx-lbl">Le pont de création de valeur (Eq sortie − Eq entrée = {f1(Eq5 - Eq0)})</div>
            <Bar label="Croissance de l'EBITDA" v={gr} />
            <Bar label="Expansion du multiple" v={mu} />
            <Bar label="Désendettement" v={de} />
            <div className="fm-note">Essaie : mets la croissance à 0 et la dette à 80 % — le rendement vient alors du seul désendettement, c'est l'effet de levier pur. Puis passe le multiple de sortie de 8 à 10 : l'expansion de multiple, le levier le moins contrôlable.</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- recherche ----------
function buildIndex() {
  const out = [];
  for (const s of SECTIONS) {
    for (const b of s.blocks) {
      if (b.t === "card" || b.t === "case") {
        let txt = b.title + " ";
        const items = b.t === "case" ? [...b.enonce, ...b.corrige] : b.body;
        for (const it of items) {
          if (typeof it === "string") txt += it + " ";
          else if (it.ul) txt += it.ul.join(" ") + " ";
          else if (it.ol) txt += it.ol.join(" ") + " ";
          else if (it.note) txt += it.note + " ";
          else if (it.table) txt += it.table.rows.flat().join(" ") + " ";
        }
        out.push({ kind: b.t, sec: s, b, txt: norm(txt) });
      } else if (b.t === "check") {
        out.push({ kind: "check", sec: s, b, txt: norm(b.title + " " + b.items.join(" ")) });
      }
    }
  }
  for (const d of FS_DATA) {
    for (const g of d.groups) for (const l of g.lines) {
      out.push({ kind: "fsline", d, l, txt: norm(l.name + " " + (l.a || "") + " " + (l.e || []).join(" ") + " " + (l.proc || []).join(" ")) });
    }
  }
  for (const g of GLOSSARY) {
    out.push({ kind: "term", g, txt: norm(g.w + " " + g.d) });
  }
  return out;
}
const INDEX = buildIndex();

  const nq = norm(q);
  const hits = INDEX.filter((e) => e.txt.includes(nq)).slice(0, 24);
  if (hits.length === 0) {

  return (
    <div>

              <div className="fm-result-src">Glossaire</div>
              <b>{h.g.w}</b>
              <p>{h.g.d}</p>
            </div>
          );
        }
        return (
          <div key={i} onClick={() => go(h.sec.id)} style={{ cursor: "pointer" }}>
            <div className="fm-result-src" style={{ marginTop: 12 }}>
              Section {h.sec.id} — {h.sec.label}
            </div>
            {h.kind === "card" ? <Card b={h.b} /> : h.kind === "case" ? <CaseCard b={h.b} /> : <Checklist b={h.b} />}
          </div>
        );
      })}
    </div>
  );
}

// ---------- App ----------
function App() {
  const [tab, setTab] = useState("A");
  const [q, setQ] = useState("");
  const searching = q.trim().length >= 2;
  const tabs = [{ id: "SOS", label: "SOS terrain" }, ...SECTIONS.map((s) => ({ id: s.id, label: s.label })),
    { id: "V", label: "Glossaire" }, { id: "W", label: "Quiz" }];
  const sec = SECTIONS.find((s) => s.id === tab);
  const go = (id, ref) => {
    setQ(""); setTab(id); window.scrollTo({ top: 0 });
    if (ref) setTimeout(() => {
      const el = document.getElementById("wp-" + ref);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 120);
  };

  return (
    <div className="fm-root">
      <style>{css}</style>
      <div className="fm-topbar" />
      <div className="fm-wrap">
        <header className="fm-head">
          <div className="fm-eyebrow">
            <span>EY Assurance · Lausanne-Malley</span>
            <span>Réf. VM/FY27/001</span>
          </div>
          <h1 className="fm-title">Field Manual<br /><em>Staff 1 · Audit</em></h1>
          <div className="fm-meta">
            <div><b>Préparé par</b><span>Vincent — Staff 1</span></div>
            <div><b>Période</b><span>dès le 01.10.2026</span></div>
            <div><b>Objectif</b><span>Meilleur junior du bureau</span></div>
            <div><b>Statut</b><span style={{ color: "#1F7A45" }}>En cours ✓</span></div>
          </div>
        </header>

        <div className="fm-search">
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="Rechercher dans tout le manuel… (ex. cut-off, 725b, TVA, tickmark, PBC)"
            aria-label="Recherche"
          />
        </div>

        {!searching && (
          <nav className="fm-tabs">
            {tabs.map((t) => (
              <button key={t.id} className={"fm-tab" + (tab === t.id ? " on" : "")} onClick={() => go(t.id)}>
                <span className="ix">{t.id}</span>{t.label}
              </button>
            ))}
          </nav>
        )}

        {searching ? (
          <SearchResults q={q} go={go} />
        ) : tab === "SOS" ? (
          <SosPanel go={go} />
        ) : tab === "V" ? (
          <section>
            <h2 className="fm-sec-title"><span className="ix">V</span>Glossaire — le jargon décodé</h2>
            <p className="fm-sec-sub">{GLOSSARY.length} termes que tu entendras dès la première semaine.</p>
            {GLOSSARY.map((g, i) => (
              <div key={i} className="fm-term"><b>{g.w}</b><p>{g.d}</p></div>
            ))}
          </section>
        ) : tab === "W" ? (
          <section>
            <h2 className="fm-sec-title"><span className="ix">W</span>Quiz d'entraînement</h2>
            <p className="fm-sec-sub">{QUIZ.length} questions. Objectif : le sans-faute avant le 1er octobre.</p>
            <Quiz />
          </section>
        ) : (
          <section>
            <h2 className="fm-sec-title"><span className="ix">{sec.id}</span>{sec.title}</h2>
            <p className="fm-sec-sub">{sec.sub}</p>
            {sec.blocks.map((b, i) =>
              b.t === "p" ? <p key={i} className="fm-p">{b.x}</p> :
              b.t === "card" ? <Card key={i} b={b} /> :
              b.t === "case" ? <CaseCard key={i} b={b} /> :
              b.t === "matcalc" ? <MatCalc key={i} /> :
              b.t === "fsx" ? <FsExplorer key={i} go={go} /> :
              b.t === "diagram" ? <Diagram key={i} kind={b.kind} /> :
              b.t === "lbosim" ? <LboSim key={i} /> :
              b.t === "check" ? <Checklist key={i} b={b} /> :
              b.t === "callout" ? <Callout key={i} b={b} /> : null
            )}
          </section>
        )}

        <footer className="fm-foot">
          Synthèse pédagogique préparée pour ton démarrage — en mission, la référence reste la méthodologie EY (Atlas / EY GAM), les normes officielles (NAS-CH, NCR, ISA) et les textes légaux. Taux et seuils à l'état de juin 2026.
        </footer>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
