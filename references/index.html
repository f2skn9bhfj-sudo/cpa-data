  window.__REFS__ = {"courses_ifrs": [{"title": "IAS 1 — Présentation des états financiers", "subtitle": "Jeu complet, principes, OCI", "sections": [{"t": "Contenu", "c": "Bilan + CR + OCI + Variations FP + TFT + Notes. Principes : image fidèle, continuité, comptabilité d'engagement, importance relative, permanence, non-compensation."}]}, {"title": "IAS 2 — Stocks", "subtitle": "Évaluation, VNR, méthodes", "sections": [{"t": "Contenu", "c": "Plus bas entre coût et VNR. FIFO ou moyenne pondérée. LIFO interdit. Coûts complets. VNR = prix vente - coûts achèvement - coûts vente."}]}, {"title": "IAS 8 — Méthodes, estimations, erreurs", "subtitle": "Rétrospectif vs prospectif", "sections": [{"t": "Contenu", "c": "Changement méthode = rétrospectif. Changement estimation = prospectif. Erreur = rétrospectif. Piège : durée amortissement = estimation."}]}, {"title": "IAS 10 — Événements postérieurs", "subtitle": "Type 1 vs Type 2", "sections": [{"t": "Contenu", "c": "Type 1 ajustable (conditions existantes). Type 2 non ajustable (conditions nouvelles). Going concern = toujours ajuster."}]}, {"title": "IAS 16 — Immobilisations corporelles", "subtitle": "Coût, réévaluation, composants", "sections": [{"t": "Contenu", "c": "Initiale au coût. Subséquente : modèle coût OU réévaluation (par catégorie). Composants obligatoire. Amortissement dès disponibilité."}]}, {"title": "IAS 19 — Avantages du personnel", "subtitle": "Cotisations définies vs prestations définies", "sections": [{"t": "Contenu", "c": "CD : charge au résultat, risque employé. PD : obligation actuarielle, risque employeur. Écarts actuariels en OCI non recyclable."}]}, {"title": "IAS 36 — Dépréciation d'actifs", "subtitle": "VIU, FVLCD, UGT, goodwill", "sections": [{"t": "Contenu", "c": "Valeur recouvrable = max(FVLCD, VIU). Test annuel goodwill + incorporelles durée indéterminée. Reprise possible sauf goodwill."}]}, {"title": "IAS 37 — Provisions", "subtitle": "3 critères, passif éventuel", "sections": [{"t": "Contenu", "c": "Obligation actuelle + probable >50% + fiable. Passif éventuel = annexe. Actualisation si temps significatif. Restructuration : plan + attente créée."}]}, {"title": "IAS 38 — Incorporelles", "subtitle": "Recherche vs développement, durée", "sections": [{"t": "Contenu", "c": "Recherche = jamais. Développement = 6 critères. Durée déterminée = amortir. Durée indéterminée = test annuel, pas d'amortissement."}]}, {"title": "IFRS 9 — Instruments financiers", "subtitle": "Classification, ECL, couverture", "sections": [{"t": "Contenu", "c": "3 catégories : coût amorti, FVOCI, FVTPL. Test SPPI + business model. ECL 3 stades. Actions = FVTPL (sauf choix irrévocable OCI)."}]}, {"title": "IFRS 13 — Juste valeur", "subtitle": "Hiérarchie 3 niveaux", "sections": [{"t": "Contenu", "c": "N1 : prix cotés identiques. N2 : données observables. N3 : données non observables. Prix de sortie, marché principal."}]}, {"title": "IFRS 16 — Contrats de location", "subtitle": "ROU + dette, preneur vs bailleur", "sections": [{"t": "Contenu", "c": "Preneur : tout au bilan (ROU + dette). Exemptions : <12 mois, <5k. Bailleur : distinction maintenue. Taux implicite ou marginal."}]}, {"title": "OCI — Autres éléments du résultat global", "subtitle": "Recyclable vs non recyclable", "sections": [{"t": "Contenu", "c": "Recyclable : conversion IAS 21, CF hedge, obligations FVOCI. Non recyclable : écarts actuariels IAS 19, actions FVOCI, réévaluations IAS 16."}]}], "courses_rpc": [{"title": "RPC 2 — Évaluation", "subtitle": "Principes d'évaluation", "sections": [{"t": "Contenu", "c": "Coût historique. Stocks au plus bas. Créances à la VN - pertes. IC au coût - amortissements. Titres AC à la JV. Monnaies au cours clôture."}]}, {"title": "RPC 3 — Présentation et structure", "subtitle": "Bilan, CR, structure minimum", "sections": [{"t": "Contenu", "c": "5 éléments : bilan + CR + TFT + tableau FP + annexe. CR par nature ou par fonction. Sous-totaux obligatoires."}]}, {"title": "RPC 5 — Opérations hors bilan", "subtitle": "Engagements conditionnels", "sections": [{"t": "Contenu", "c": "Créances/dettes conditionnelles en annexe. Leasing opérationnel, cautionnements, gages."}]}, {"title": "RPC 6 — Annexe", "subtitle": "Informations minimales", "sections": [{"t": "Contenu", "c": "Bases d'évaluation, créances cédées, engagements conditionnels, incertitudes significatives."}]}, {"title": "RPC 10 — Valeurs incorporelles", "subtitle": "Acquises vs créées, amortissement", "sections": [{"t": "Contenu", "c": "Acquises = activer. Créées = 4 conditions cumulatives. Recherche jamais. Amortissement 5 ans (max 20). Liées à personnes = max 5."}]}, {"title": "RPC 11 — Impôts sur les bénéfices", "subtitle": "Impôts différés", "sections": [{"t": "Contenu", "c": "Report variable, vue bilan. DTL dans provisions. DTA dans immobilisations financières. Pas d'ID sur goodwill initial."}]}, {"title": "RPC 13 — Transactions de leasing", "subtitle": "Financier vs opérationnel", "sections": [{"t": "Contenu", "c": "Financier = au bilan. Opérationnel = hors bilan (annexe). Sale-and-lease-back : bénéfice différé, perte immédiate."}]}, {"title": "RPC 15 — Parties liées", "subtitle": "Publication si conditions anormales", "sections": [{"t": "Contenu", "c": "Transactions à conditions anormales → montants et nature en annexe. Actionnaires, dirigeants, apparentées, CP."}]}, {"title": "RPC 16 — Engagements de prévoyance", "subtitle": "Approche économique suisse", "sections": [{"t": "Contenu", "c": "Comptes statutaires de la CP. RCE = actif. Engagement = provision si conditions. Pas de calcul actuariel (≠ IAS 19)."}]}, {"title": "RPC 17 — Stocks", "subtitle": "Coûts complets, FIFO/moyenne", "sections": [{"t": "Contenu", "c": "Plus bas entre coût complet et VN marché. FIFO ou moyenne. LIFO interdit. Escomptes déduits du prix."}]}, {"title": "RPC 18 — Immobilisations corporelles", "subtitle": "Coût, amortissement, rendement", "sections": [{"t": "Contenu", "c": "Coût - amortissements - dépréciations. Terrains pas amortis. IC rendement = JV possible. Tableau des IC obligatoire."}]}, {"title": "RPC 20 — Dépréciations d'actifs", "subtitle": "Indices, CGU, reprise", "sections": [{"t": "Contenu", "c": "Test si indices. Valeur réalisable = max(VN marché, VIU). Reprise possible. Pas de test annuel obligatoire (≠ IAS 36)."}]}, {"title": "RPC 22 — Contrats de construction", "subtitle": "POC, CC, POC modifiée", "sections": [{"t": "Contenu", "c": "POC si 4 conditions cumulatives. Sinon CC ou POC modifiée (sans bénéfice). Acomptes sans incidence résultat."}]}, {"title": "RPC 24 — Fonds propres", "subtitle": "Propres actions, structure", "sections": [{"t": "Contenu", "c": "Propres actions = négatif dans FP, au coût, PV/MV jamais au résultat → réserves de capital."}]}, {"title": "RPC 27 — Instruments financiers dérivés", "subtitle": "Couverture et spéculation", "sections": [{"t": "Contenu", "c": "FV hedge = résultat. CF hedge = FP. Sans couverture = résultat. État des dérivés ouverts en annexe."}]}, {"title": "RPC 28 — Subventions publiques", "subtitle": "Actifs vs résultat", "sections": [{"t": "Contenu", "c": "Liées aux actifs : net ou brut. Liées au résultat : périodes des charges. Entrée en vigueur 2024."}]}, {"title": "Seuils — Récapitulatif", "subtitle": "CO, RPC, TVA, LPP", "sections": [{"t": "Contenu", "c": "RPC fondamentales : 10M/20M/50. Contrôle ordinaire : 20M/40M/250. Opting-out : ≤10 ETP + tous actionnaires. TVA : 100k CA."}]}], "memo_co": [{"norm": "Art. 957-963 — Obligation de tenir une comptabilité", "items": [{"t": "Qui doit tenir une comptabilité complète ?", "c": "→ Entreprises individuelles et sociétés de personnes avec CA ≥ CHF 500'000\n→ Personnes morales (SA, Sàrl, etc.) → TOUJOURS\n→ < CHF 500'000 → comptabilité simplifiée (recettes, dépenses, patrimoine)"}, {"t": "Comptes annuels (art. 958 CO)", "c": "= Bilan + Compte de résultat + Annexe\n⚠️ Pas de TFT ni tableau des FP en droit minimum CO (requis sous RPC)"}, {"t": "Monnaie et langue (art. 957a CO)", "c": "Monnaie : CHF ou monnaie la plus importante pour les activités\nLangue : langue nationale ou anglais"}, {"t": "Conservation (art. 958f CO)", "c": "Livres et pièces comptables : 10 ANS"}]}, {"norm": "Art. 959-959c — Structure du bilan et de l'annexe", "items": [{"t": "Structure minimum du bilan (art. 959a CO)", "c": "ACTIF : Actif circulant (liquidités, créances CT, stocks, actifs de régularisation) + Actif immobilisé (immobilisations financières, corporelles, incorporelles)\nPASSIF : Dettes CT + Dettes LT + Capitaux propres (capital, réserve légale capital, réserve légale bénéfice, réserves facultatives, bénéfice/perte reporté, propres parts en négatif)"}, {"t": "Structure minimum du CR (art. 959b CO)", "c": "Deux méthodes autorisées :\n→ Par NATURE : produits nets, variation stocks, charges matières, charges personnel, autres charges, amortissements, résultat financier, résultat hors exploitation, charges fiscales, bénéfice/perte\n→ Par FONCTION : produits nets, coût des produits vendus, charges admin, charges commerciales, résultat financier, hors exploitation, fiscales, bénéfice/perte"}, {"t": "Contenu de l'annexe (art. 959c CO)", "c": "Obligatoire :\n→ Principes comptables et structure des comptes\n→ Dissolution nette des réserves latentes (si résultat sensiblement amélioré)\n→ Cautionnements, garanties, gages en faveur de tiers\n→ Engagements envers institutions de prévoyance\n→ Montant des dettes de leasing non inscrites au bilan\n→ Rémunérations des organes dirigeants et nombre d'ETP\n→ Événements importants après la date du bilan\n→ Raisons de la démission de l'organe de révision"}]}, {"norm": "Art. 960-960e — Évaluation", "items": [{"t": "Principe (art. 960 CO)", "c": "Les actifs et dettes sont évalués INDIVIDUELLEMENT. Pas de compensation.\n⚠️ Les réserves latentes sont explicitement AUTORISÉES (art. 960e al. 3-4)."}, {"t": "Actifs (art. 960a CO)", "c": "→ Première comptabilisation : au plus au coût d'acquisition ou coût de revient\n→ Subséquente : pas supérieur au coût (sauf exceptions)\n→ Amortissements et corrections de valeur sur CHAQUE actif"}, {"t": "Actifs cotés (art. 960b CO)", "c": "Les actifs avec un prix courant OBSERVABLE peuvent être évalués à ce prix, même s'il dépasse le coût d'acquisition.\n⚠️ C'est la seule exception permettant d'aller AU-DESSUS du coût sous CO."}, {"t": "Stocks (art. 960c CO)", "c": "Si valeur de marché < VC → ajuster. Si la valeur remonte → obligation de réévaluer MAIS jamais au-dessus du coût."}, {"t": "Dettes (art. 960e CO)", "c": "Valeur nominale.\nProvisions pour charges et risques probables → autorisées.\n⚠️ Art. 960e al. 3 : possibilité de constituer des provisions SUPPLÉMENTAIRES pour assurer la prospérité de l'entreprise (= réserves latentes autorisées !)\nAl. 4 : dissolution dans l'annexe si amélioration sensible du résultat."}, {"t": "🔑 Comparaison CO vs RPC vs IFRS", "c": "CO : réserves latentes AUTORISÉES, prudence maximale\nRPC : image fidèle, réserves latentes TOLÉRÉES mais pas encouragées\nIFRS : réserves latentes INTERDITES, true & fair view strict"}]}, {"norm": "Réserves latentes — Détail complet", "items": [{"t": "Définition", "c": "= Différence entre la valeur comptable (bilan) et la valeur réelle supérieure.\nElles n'apparaissent PAS au bilan. Elles font partie des FP (sous réserve d'impôts différés)."}, {"t": "3 types de réserves latentes", "c": "① OBLIGATOIRES (automatiques) : créées par le plafond du coût d'acquisition (art. 960a)\n② DISCRÉTIONNAIRES : créées volontairement par sous-évaluation d'actifs ou surévaluation de passifs\n③ ADMINISTRATIVES : décidées par le CA pour la politique d'entreprise (dividende constant, couverture risques)"}, {"t": "Création", "c": "→ Sous-évaluation des actifs (ex : stock évalué à 60% au lieu de 100%)\n→ Surévaluation des dettes (provisions excessives)\n→ Amortissements accélérés au-delà de l'usure réelle"}, {"t": "Dissolution", "c": "→ Remise à niveau de la valeur des actifs\n→ Dissolution de provisions excessives\n→ IMPACT : augmente le bénéfice comptable\n→ ANNEXE : publier le montant NET si dissolution > création ET si résultat sensiblement amélioré"}, {"t": "⚠️ Piège examen", "c": "Réserves latentes sous CO = AUTORISÉES\nRéserves latentes sous RPC = TOLÉRÉES\nRéserves latentes sous IFRS = INTERDITES\n\nL'auditeur doit les vérifier (contrôle ordinaire/restreint)."}]}, {"norm": "SA — Capital et réserves", "items": [{"t": "Capital-actions minimum", "c": "CHF 100'000 (art. 621 CO). Libération : min 20% par action ET min CHF 50'000."}, {"t": "3 types d'augmentation", "c": "① Ordinaire : AG décide, CA exécute dans 3 mois (art. 650)\n② Marge de fluctuation : statuts, max 1,5× et min 0,5× le capital, durée max 5 ans (art. 653s)\n③ Conditionnelle : obligations convertibles, max 50% du capital existant (art. 653a)"}, {"t": "Réserve légale issue du bénéfice (art. 672 CO)", "c": "5% du bénéfice annuel → jusqu'à 50% du capital-actions. Utilisation : uniquement pour couvrir des pertes tant que < 50%."}, {"t": "Réserve légale issue du capital (art. 671 CO)", "c": "Reçoit : agio + paiements libératoires sur actions annulées. Dissolution très restrictive."}, {"t": "Réserve de réévaluation (art. 725c CO)", "c": "UNIQUEMENT pour résorber une perte de capital. Conditions : immeuble/participations dont JV > coût. Attestation réviseur. Ne peut être dissoute que par conversion en capital, correction de valeur ou aliénation."}, {"t": "Propres actions (art. 659 CO)", "c": "Max 10% du capital-actions (20% pour les sociétés cotées).\nCondition : FP librement disponibles à hauteur du coût.\nAu bilan : en diminution des FP (art. 959a al. 2 ch. 3 let. e)."}, {"t": "Distribution de dividendes (art. 675 CO)", "c": "Sur le bénéfice net + réserves libres disponibles.\nAprès attribution réserve légale.\n⚠️ Soumise à l'impôt anticipé de 35%."}]}, {"norm": "SA — Gouvernance et protection", "items": [{"t": "Organes de la SA", "c": "① Assemblée générale (organe suprême)\n② Conseil d'administration (gestion et surveillance)\n③ Organe de révision (contrôle)"}, {"t": "Art. 725a CO — Perte de capital", "c": "FP < 50% du capital-actions → CA prend des mesures d'assainissement."}, {"t": "Art. 725b CO — Surendettement", "c": "Dettes > actifs (valeurs continuation ET liquidation) → CA avise le JUGE.\nException : créanciers acceptent un rang postérieur à hauteur du découvert.\nOrgane de révision avise le juge si le CA ne le fait pas."}, {"t": "Art. 725c CO — Réévaluation", "c": "Autorisée uniquement pour résorber une perte de capital. Immeubles et participations. Attestation réviseur."}]}, {"norm": "Sàrl vs SA — Comparaison", "items": [{"t": "Capital minimum", "c": "SA : CHF 100'000 (libération partielle possible)\nSàrl : CHF 20'000 (entièrement libéré)"}, {"t": "Parts", "c": "SA : actions (porteur ou nominatives)\nSàrl : parts sociales NOMINATIVES uniquement"}, {"t": "Transfert", "c": "SA : libre (porteur) ou avec restrictions (nominatives liées)\nSàrl : consentement AG nécessaire (sauf statuts)"}, {"t": "Bourse", "c": "SA : possible | Sàrl : impossible"}, {"t": "Révision", "c": "Mêmes seuils pour les deux (ordinaire, restreint, opting-out)"}]}, {"norm": "Art. 961-961d — Grandes entreprises", "items": [{"t": "Comptes complémentaires (art. 961 CO)", "c": "Grandes entreprises (seuils contrôle ordinaire) doivent fournir :\n→ Un rapport de gestion\n→ Des informations complémentaires dans l'annexe"}, {"t": "Rapport de gestion (art. 961c CO)", "c": "Contenu :\n→ Marche des affaires et situation économique\n→ Effectif en ETP (moyenne annuelle)\n→ Évaluation des risques\n→ Commandes passées et investissements"}, {"t": "Comptes consolidés (art. 963 CO)", "c": "Obligatoires si l'entreprise contrôle une ou plusieurs autres entreprises.\nExceptions : si le groupe NE dépasse PAS 2/3 des seuils du contrôle ordinaire.\nRéférentiel : Swiss GAAP RPC ou IFRS (ou autre norme reconnue)."}]}], "memo_rpc": [{"norm": "Cadre conceptuel", "items": [{"t": "Principe fondateur", "c": "Image fidèle (True & Fair View) — art. 962 CO"}, {"t": "RPC fondamentales", "c": "RPC 1 (Principes), 2 (Évaluation), 3 (Présentation), 4 (TFT), 5 (Hors bilan), 6 (Annexe)"}, {"t": "Seuils petites entités", "c": "2/3 sur 2 exercices : bilan 10M · CA 20M · 50 ETP → peut se limiter aux RPC fondamentales"}, {"t": "⚠️ Sociétés cotées", "c": "JAMAIS limitées aux RPC fondamentales, même si sous les seuils"}, {"t": "Continuité d'exploitation", "c": "Doutes → publier en annexe. Dissolution → valeurs de LIQUIDATION + explication"}, {"t": "Première application", "c": "Retraiter le bilan de l'exercice PRÉCÉDENT. Cotées : rétroactif + rapprochement FP"}]}, {"norm": "RPC 2 — Évaluation", "items": [{"t": "Stocks (RPC 17)", "c": "Plus bas entre coût (complet) et valeur nette de marché. FIFO ou moyenne pondérée. ⚠️ LIFO INTERDIT"}, {"t": "Créances", "c": "Valeur nominale – pertes de valeur. Importantes = individuelle. Autres = forfaitaire (empirique, publié en annexe)"}, {"t": "IC d'exploitation", "c": "Coût – amortissements – dépréciations. PAS de réévaluation au-dessus du coût"}, {"t": "IC de rendement (hors exploitation)", "c": "Juste valeur POSSIBLE → variation au RÉSULTAT. Peuvent être en immobilisations financières"}, {"t": "Terrains/sols", "c": "PAS d'amortissement planifié (durée illimitée)"}, {"t": "Titres actif circulant", "c": "Juste valeur. Sans JV → max coût – pertes de valeur"}, {"t": "Titres actif immobilisé", "c": "Coût d'acquisition – pertes de valeur"}, {"t": "Dettes/engagements", "c": "Valeur NOMINALE"}, {"t": "Monnaies étrangères", "c": "Postes monétaires → cours clôture. Transactions → cours du jour/moyen. Écarts → résultat"}, {"t": "Intérêts sur constructions", "c": "Activés comme coûts d'acquisition (max : valeur moyenne × taux moyen)"}, {"t": "Frais constitution/organisation", "c": "⚠️ JAMAIS activables (ne sont PAS des incorporelles)"}, {"t": "Principe évaluation individuelle", "c": "Chaque actif/passif évalué séparément, pas de compensation plus-values/moins-values"}, {"t": "🔑 Vocabulaire : Dépréciation vs Amortissement", "c": "AMORTISSEMENT = répartition systématique du coût sur la durée d'utilité (usure normale)\nDÉPRÉCIATION = perte de valeur imprévisible (impairment), quand VC > valeur réalisable"}, {"t": "🔑 Vocabulaire : Provision vs Correction de valeur", "c": "PROVISION = obligation actuelle estimée (passif)\nCORRECTION DE VALEUR = réduction de la valeur d'un actif (vient en déduction)"}]}, {"norm": "RPC 10 — Valeurs incorporelles", "items": [{"t": "Incorporelles acquises", "c": "Obligatoirement au bilan si profit mesurable sur plusieurs années"}, {"t": "Incorporelles créées en interne", "c": "4 conditions CUMULATIVES : identifiable + profit mesurable + dépenses traçables + fonds disponibles"}, {"t": "⚠️ Recherche", "c": "JAMAIS activable (toujours en charges)"}, {"t": "⚠️ Développement", "c": "Activable SI les 4 conditions sont remplies"}, {"t": "Amortissement", "c": "Systématique, durée estimée avec prudence. Par défaut 5 ans, max 20 ans si justifié"}, {"t": "Incorporelles liées à des personnes", "c": "Max 5 ANS (jamais plus)"}, {"t": "Catégories", "c": "Licences · Brevets/savoir-faire · Marques · Logiciels · Frais de développement · Autres"}, {"t": "Tableau des incorporelles", "c": "Valeurs brutes (début→fin) + corrections cumulées (amortissements, dépréciations) + VC nettes"}, {"t": "Changement durée d'utilisation", "c": "Publier en annexe + quantifier l'impact → traitement PROSPECTIF"}]}, {"norm": "RPC 11 — Impôts sur les bénéfices", "items": [{"t": "Méthode", "c": "Report variable (comprehensive liability) — vue orientée BILAN"}, {"t": "Base", "c": "Différences entre valeurs True & Fair View et valeurs FISCALES"}, {"t": "Impôts différés passifs", "c": "Dans les PROVISIONS pour impôts"}, {"t": "Impôts différés actifs", "c": "Dans les IMMOBILISATIONS FINANCIÈRES"}, {"t": "⚠️ Goodwill", "c": "Pas d'impôt différé sur le goodwill initial (RPC 30/31)"}]}, {"norm": "RPC 13 — Leasing", "items": [{"t": "Distinction clé", "c": "Financier (risques/avantages transférés) → AU BILAN\nOpérationnel (pas de transfert) → HORS BILAN"}, {"t": "Leasing financier au bilan", "c": "Actif (VC nette) + passif (dette), présentés séparément"}, {"t": "Leasing opérationnel en annexe", "c": "Valeur totale des versements futurs + échéances (engagements non résiliables dans l'année)"}, {"t": "Sale-and-Lease-Back", "c": "⚠️ Bénéfice = DIFFÉRÉ sur la durée. Perte = IMMÉDIATE au résultat"}, {"t": "⚠️ vs IFRS 16", "c": "RPC maintient la distinction financier/opérationnel. IFRS 16 = quasi tout au bilan du preneur"}]}, {"norm": "RPC 16 — Engagements de prévoyance", "items": [{"t": "Approche", "c": "Économique, basée sur les comptes STATUTAIRES de la caisse de pension"}, {"t": "Avantage (RCE)", "c": "Réserves de cotisations employeur → comptabilisées comme ACTIF"}, {"t": "Engagement", "c": "Si conditions de provision remplies → PASSIF"}, {"t": "Excédent de couverture CP", "c": "Activation très restrictive (conditions rarement remplies)"}, {"t": "⚠️ vs IAS 19", "c": "RPC = comptes statutaires CP (pragmatique). IAS 19 = calcul actuariel complet (PBO, écarts en OCI)"}]}, {"norm": "RPC 17 — Stocks", "items": [{"t": "Évaluation", "c": "Plus bas entre coût d'acquisition/revient et valeur nette de marché"}, {"t": "Coût complet", "c": "Toutes dépenses directes ET indirectes pour amener le stock au lieu/état actuel"}, {"t": "Méthodes autorisées", "c": "Prix moyen pondéré · FIFO"}, {"t": "⚠️ LIFO", "c": "INTERDIT sous RPC (et IFRS). Admis uniquement sous CO"}, {"t": "Escomptes", "c": "Déduits du prix d'acquisition"}, {"t": "🔑 On DÉPRÉCIE les stocks", "c": "Si VN marché < coût → dépréciation (write-down). On ne dit PAS « amortir » un stock."}]}, {"norm": "RPC 18 — Immobilisations corporelles", "items": [{"t": "Évaluation initiale", "c": "Coût d'acquisition ou de revient (y.c. intérêts sur construction si applicable)"}, {"t": "Évaluation subséquente", "c": "Coût – amortissements cumulés – dépréciations"}, {"t": "Amortissement", "c": "Dès utilisation effective, selon un plan (linéaire privilégié), sur la durée d'utilisation"}, {"t": "IC de rendement", "c": "Juste valeur autorisée → variation au résultat. Peuvent être en immo financières"}, {"t": "Tableau des IC", "c": "Par catégorie : valeurs brutes + corrections cumulées + VC nettes (début et fin)"}, {"t": "🔑 On AMORTIT les IC", "c": "Amortissement = répartition systématique du coût. On dit « amortir une machine », pas « déprécier »"}, {"t": "🔑 On DÉPRÉCIE si perte de valeur", "c": "Si indices que VC > valeur réalisable → dépréciation (impairment) en plus de l'amortissement"}]}, {"norm": "RPC 20 — Dépréciation d'actifs", "items": [{"t": "Quand tester ?", "c": "À chaque date du bilan SI INDICES de perte de valeur"}, {"t": "⚠️ Pas de test annuel obligatoire", "c": "Contrairement à IAS 36 (goodwill = test annuel). Sous RPC = uniquement si indices"}, {"t": "Valeur réalisable", "c": "= MAX (valeur de marché nette, valeur d'utilité)"}, {"t": "Perte de valeur", "c": "Si VC > valeur réalisable → réduire VC → charge au résultat + explication annexe"}, {"t": "CGU (groupe d'actifs)", "c": "Si pas de flux indépendants → plus petit groupe possible. Perte proportionnelle aux VC"}, {"t": "Si perte > VC de l'actif", "c": "Actif à 0 + PROVISION pour la différence restante"}, {"t": "Reprise", "c": "Si facteurs changent → reprise au résultat. Nouvelle VC ≤ VC sans dépréciation"}, {"t": "Taux d'actualisation (VIU)", "c": "Approprié, conditions marché, risques spécifiques, AVANT impôts, sans structure capital"}]}, {"norm": "RPC 22 — Contrats de construction", "items": [{"t": "Méthode POC (% avancement)", "c": "4 conditions CUMULATIVES : base contractuelle + probabilité + organisation + fiabilité"}, {"t": "POC modifiée", "c": "Produits proportionnels à l'avancement SANS part de bénéfice (uniquement coûts)"}, {"t": "Completed Contract", "c": "Bénéfice reconnu uniquement à l'ACHÈVEMENT"}, {"t": "Acomptes reçus", "c": "Au bilan SANS incidence sur le résultat"}, {"t": "Provisions", "c": "Toujours constituer les provisions nécessaires, quelle que soit la méthode"}]}, {"norm": "RPC 23 — Provisions", "items": [{"t": "3 conditions", "c": "Obligation actuelle (événement passé) + sortie de fonds probable + estimation fiable"}, {"t": "Dissolution", "c": "Provisions devenues inutiles → dissolution obligatoire par le résultat"}, {"t": "Catégories au bilan/annexe", "c": "Impôts · Prévoyance · Restructurations · Autres"}, {"t": "Tableau de variation", "c": "Début → constitution → utilisation → dissolution → fin. + Explication provisions importantes"}, {"t": "🔑 Provision vs Dette", "c": "DETTE = montant certain, échéance connue\nPROVISION = montant estimé et/ou échéance incertaine"}, {"t": "⚠️ vs IAS 37", "c": "RPC tolère certaines réserves latentes. IAS 37 = critères stricts, pas de réserves latentes"}]}, {"norm": "RPC 24 — Fonds propres", "items": [{"t": "Propres actions", "c": "Coût d'acquisition → poste NÉGATIF dans les FP. Pas d'évaluation ultérieure"}, {"t": "Plus/moins-values sur vente propres actions", "c": "⚠️ JAMAIS au résultat → réserves de capital (agio)"}, {"t": "Structure des FP", "c": "Capital-actions + Réserves de capital + Propres actions (négatif) + Réserves de bénéfices + Minoritaires"}]}, {"norm": "RPC 27 — Instruments financiers dérivés", "items": [{"t": "FV Hedge", "c": "Juste valeur → variations au RÉSULTAT"}, {"t": "Cash Flow Hedge", "c": "Fonds propres SANS incidence résultat → publié en annexe"}, {"t": "Sans couverture", "c": "Juste valeur → variations au RÉSULTAT"}, {"t": "Annexe", "c": "État des dérivés ouverts par sous-jacent + objectif de détention"}]}, {"norm": "RPC 30 — Comptes consolidés", "items": [{"t": "Intégration globale", "c": "> 50% droits de vote (ou contrôle de fait)"}, {"t": "Consolidation proportionnelle", "c": "50% contrôle conjoint (ou mise en équivalence)"}, {"t": "Mise en équivalence", "c": "20-50% influence notable. FP et résultat proportionnels, séparés au CR"}, {"t": "< 20%", "c": "Coût ou juste valeur (sauf si influence notable → quand même MEQ)"}, {"t": "Goodwill", "c": "① Activation + amortissement (5 ans, max 20) OU ② Compensation directe avec FP"}, {"t": "⚠️ Choix uniforme", "c": "Le choix (activation vs compensation) doit être le même pour TOUTES les acquisitions"}, {"t": "Si goodwill compensé → annexe", "c": "Effets capitalisation théorique obligatoires (VC, amortissement, dépréciation, etc.)"}, {"t": "Goodwill négatif", "c": "Même traitement que goodwill positif (activation ou compensation)"}, {"t": "Recyclage du goodwill", "c": "Lors de la cession → reprendre le goodwill initial dans le calcul du gain/perte"}, {"t": "Acquisition par étapes", "c": "Goodwill par étape. À la prise de contrôle → actifs nets à JV totale, diff sur anciennes parts → FP"}, {"t": "Éliminations", "c": "Actifs/passifs, charges/produits, bénéfices internes → tous éliminés"}, {"t": "Minoritaires", "c": "Part au capital (FP séparés) + part au résultat (CR séparé)"}, {"t": "Délai max", "c": "3 mois entre clôture filiale et clôture groupe"}, {"t": "Organisations ad hoc (SPV)", "c": "Consolidées si avantage économique profite au groupe (critère économique, pas juridique)"}, {"t": "Conversion monnaies (filiales étrangères)", "c": "Actifs/passifs = clôture. FP = historique. CR/TFT = moyen. Prêts LT intragroupe = FP"}]}, {"norm": "RPC 28 — Subventions publiques", "items": [{"t": "Liées à des actifs", "c": "Au net (déduction de l'actif) OU au brut (passif → amortir sur durée d'utilité)"}, {"t": "Liées au résultat", "c": "Au résultat dans les périodes des charges correspondantes"}, {"t": "Conditions", "c": "Assurance raisonnable + estimation fiable"}, {"t": "Entrée en vigueur", "c": "1er janvier 2024"}]}, {"norm": "RPC 31 — Sociétés cotées", "items": [{"t": "Rémunérations en actions", "c": "JV à l'attribution → charges de personnel sur la période d'acquisition des droits"}, {"t": "Branches abandonnées", "c": "Produit net + résultat d'exploitation → séparément en annexe"}, {"t": "Information sectorielle", "c": "Produits nets par région géographique + par secteur d'activité"}]}, {"norm": "Seuils CO — Révision", "items": [{"t": "Contrôle ordinaire", "c": "2/3 seuils sur 2 exercices : bilan 20M · CA 40M · 250 ETP + sociétés cotées + comptes consolidés"}, {"t": "Contrôle restreint", "c": "Ne remplit pas les seuils du contrôle ordinaire"}, {"t": "Opting-out", "c": "≤ 10 ETP + accord de TOUS les actionnaires"}, {"t": "⚠️ Ne pas confondre !", "c": "Seuils RPC fondamentales : 10M/20M/50 ETP\nSeuils contrôle ordinaire CO : 20M/40M/250 ETP\nOpting-out : ≤ 10 ETP + unanimité actionnaires"}]}], "memo_ifrs": [{"norm": "IAS 1 — Présentation des états financiers", "items": [{"t": "États financiers obligatoires", "c": "Bilan + Résultat et OCI + Variations FP + TFT + Notes"}, {"t": "OCI (Other Comprehensive Income)", "c": "Éléments hors P&L : réévaluations IAS 16/38, écarts actuariels IAS 19, conversion IAS 21, FVOCI, cash flow hedges"}, {"t": "OCI recyclable", "c": "Conversion IAS 21, cash flow hedges → reclassés en P&L ultérieurement"}, {"t": "OCI non recyclable", "c": "Écarts actuariels IAS 19, réévaluations IAS 16 (sauf si cédé), FVOCI actions"}]}, {"norm": "IAS 2 — Stocks", "items": [{"t": "Évaluation", "c": "Plus bas entre COÛT et VNR"}, {"t": "🔑 VNR ≠ Juste valeur", "c": "VNR = prix vente – coûts achèvement – coûts vente (spécifique à l'entité)\nJV = prix de marché (IFRS 13). IAS 2 utilise la VNR, PAS la JV."}, {"t": "Méthodes", "c": "FIFO ou coût moyen pondéré. ⚠️ LIFO INTERDIT."}, {"t": "Coût de production", "c": "Coûts directs + quote-part raisonnable des frais généraux de production"}, {"t": "🔑 On DÉPRÉCIE les stocks (write-down)", "c": "Si VNR < coût → dépréciation (provision pour dépréciation). Reprise possible si VNR remonte."}, {"t": "Exception", "c": "Courtiers-négociants en marchandises → JV – coûts de vente"}]}, {"norm": "IAS 8 — Méthodes comptables, estimations, erreurs", "items": [{"t": "Changement de MÉTHODE", "c": "Application RÉTROSPECTIVE (retraitement des comparatifs)"}, {"t": "Changement d'ESTIMATION", "c": "Application PROSPECTIVE (à partir de la période en cours)"}, {"t": "Correction d'ERREUR", "c": "Application RÉTROSPECTIVE"}, {"t": "⚠️ Piège classique", "c": "Changer la durée d'amortissement = ESTIMATION (prospectif)\nChanger FIFO → moyenne = MÉTHODE (rétrospectif)"}]}, {"norm": "IAS 10 — Événements postérieurs à la clôture", "items": [{"t": "Type 1 — Ajustables", "c": "Preuves de conditions EXISTANTES à la clôture → AJUSTER les états financiers"}, {"t": "Type 2 — Non ajustables", "c": "Conditions APPARUES après → NE PAS ajuster, publier si significatif"}, {"t": "⚠️ Exception", "c": "Continuité d'exploitation remise en cause → TOUJOURS ajuster"}, {"t": "Exemple Type 1", "c": "Faillite d'un client dont la créance était DÉJÀ douteuse à la clôture"}, {"t": "Exemple Type 2", "c": "Catastrophe naturelle, annonce de restructuration APRÈS la clôture"}]}, {"norm": "IAS 16 — Immobilisations corporelles", "items": [{"t": "Coût initial", "c": "Prix d'achat + droits de douane + coûts directs + démantèlement + intérêts (IAS 23)"}, {"t": "Modèle du COÛT", "c": "Coût – amortissements cumulés – dépréciations"}, {"t": "Modèle de RÉÉVALUATION", "c": "JV – amortissements – dépréciations subséquentes. Plus-value → OCI. Moins-value → P&L (sauf réserve)"}, {"t": "⚠️ Réévaluation = par CATÉGORIE", "c": "Si on réévalue un terrain, TOUS les terrains doivent être réévalués"}, {"t": "Approche par composants", "c": "Composants significatifs avec durées différentes → amortis SÉPARÉMENT"}, {"t": "🔑 On AMORTIT les IC", "c": "Amortissement = répartition systématique sur la durée d'utilité"}, {"t": "🔑 On DÉPRÉCIE si perte de valeur", "c": "Dépréciation (impairment) = perte imprévue quand VC > valeur recouvrable (IAS 36)"}, {"t": "🔑 Réévaluation ≠ Dépréciation", "c": "Réévaluation = remise à JV (peut être à la hausse → OCI)\nDépréciation = perte de valeur (toujours à la baisse → P&L)"}, {"t": "⚠️ vs RPC 18", "c": "RPC ne permet PAS la réévaluation pour IC d'exploitation. RPC ne requiert pas l'approche par composants."}]}, {"norm": "IAS 36 — Dépréciation d'actifs", "items": [{"t": "Valeur recouvrable", "c": "= MAX (FVLCD, VIU)"}, {"t": "FVLCD", "c": "Fair Value Less Costs of Disposal = prix de marché – coûts de sortie"}, {"t": "VIU (Value in Use)", "c": "VA des flux de trésorerie futurs. Max 5 ans + valeur terminale. Taux = WACC avant impôts"}, {"t": "Quand tester ?", "c": "Tous actifs : si INDICES. Goodwill + incorporelles durée indéterminée : ANNUELLEMENT + si indices"}, {"t": "UGT (Cash Generating Unit)", "c": "Plus petit groupe d'actifs générant des flux indépendants"}, {"t": "Ordre d'imputation dans UGT", "c": "D'abord le GOODWILL, puis les autres actifs proportionnellement à leur VC"}, {"t": "Reprise", "c": "OUI pour tous SAUF le goodwill. Nouvelle VC ≤ VC sans dépréciation (après amortissement normal)"}, {"t": "⚠️ JAMAIS de reprise sur goodwill", "c": "C'est une règle ABSOLUE en IFRS. Piège n°1 à l'examen."}, {"t": "⚠️ vs RPC 20", "c": "RPC : test seulement si indices (pas de test annuel obligatoire, même pour goodwill)"}]}, {"norm": "IAS 37 — Provisions, passifs éventuels, actifs éventuels", "items": [{"t": "3 critères provision", "c": "Obligation actuelle + sortie probable (> 50%) + estimation fiable"}, {"t": "Passif éventuel", "c": "Probable < 50% OU non estimable → PAS de provision, mention en ANNEXE uniquement"}, {"t": "Actif éventuel", "c": "JAMAIS comptabilisé. Mention si probable."}, {"t": "Provision restructuration", "c": "Plan détaillé + attente fondée créée (annonce ou début d'exécution). ⚠️ Simple décision CA ≠ suffisant"}, {"t": "Contrat déficitaire", "c": "Coûts inévitables > avantages attendus → provision pour la perte"}, {"t": "🔑 Provision vs Passif éventuel", "c": "PROVISION = comptabilisée au bilan (probable)\nPASSIF ÉVENTUEL = mention annexe uniquement (possible mais pas probable)"}]}, {"norm": "IAS 38 — Immobilisations incorporelles", "items": [{"t": "Critères généraux", "c": "Identifiable + contrôle + avantages économiques futurs"}, {"t": "Recherche", "c": "⚠️ TOUJOURS en charges, JAMAIS activable"}, {"t": "Développement", "c": "6 critères CUMULATIFS : faisabilité technique + intention + capacité + avantages probables + ressources + fiabilité"}, {"t": "Durée déterminée", "c": "Amortissement systématique. Test si indices."}, {"t": "Durée indéterminée", "c": "PAS d'amortissement. Test ANNUEL + si indices. Réévaluer chaque année."}, {"t": "⚠️ Indéterminée ≠ Infinie", "c": "Pas de limite PRÉVISIBLE à la période de flux"}, {"t": "⚠️ vs RPC 10", "c": "RPC : 4 conditions (plus souples). Amortissement par défaut 5 ans, max 20 ans."}]}, {"norm": "IAS 40 — Immeubles de placement", "items": [{"t": "Définition", "c": "Détenus pour percevoir des loyers et/ou appréciation du capital"}, {"t": "Modèle du COÛT", "c": "Comme IAS 16 (coût – amortissements – dépréciations)"}, {"t": "Modèle de JUSTE VALEUR", "c": "JV à chaque clôture → variations au RÉSULTAT. PAS d'amortissement"}, {"t": "⚠️ JV IAS 40 → P&L", "c": "Contrairement à IAS 16 réévaluation → OCI. Grande différence !"}, {"t": "Transfert IAS 16 → IAS 40 (JV)", "c": "Réévaluer à JV, différence → OCI (comme réévaluation IAS 16). Seul cas de OCI"}, {"t": "Transfert IAS 40 → IAS 16", "c": "JV au transfert = nouveau « coût ». Pas d'OCI."}, {"t": "Distinction placement vs exploitation", "c": "Portions séparables → comptabiliser séparément. Sinon → IAS 40 si occupation propre insignifiante"}]}, {"norm": "IFRS 3 — Regroupements d'entreprises", "items": [{"t": "Goodwill", "c": "Prix + Minoritaires JV – JV actifs nets identifiables"}, {"t": "Full vs Partial goodwill", "c": "Full = minoritaires à JV. Partial = minoritaires = part des actifs nets"}, {"t": "⚠️ Goodwill JAMAIS amorti", "c": "Test annuel IAS 36. Dépréciation uniquement (jamais de reprise)"}, {"t": "Goodwill négatif (bargain purchase)", "c": "Immédiatement au RÉSULTAT (après re-vérification JV)"}, {"t": "⚠️ Coûts de transaction", "c": "EN CHARGES sous IFRS 3 (due diligence, avocats, etc.)"}, {"t": "⚠️ vs RPC 30", "c": "RPC : coûts de transaction INCLUS dans le prix d'achat. RPC : amortissement possible. RPC : compensation FP possible"}]}, {"norm": "IFRS 9 — Instruments financiers", "items": [{"t": "3 catégories", "c": "Coût amorti (collecter + SPPI) · FVOCI (collecter/vendre + SPPI) · FVTPL (tout le reste)"}, {"t": "Test SPPI", "c": "Solely Payments of Principal and Interest. Échoué → FVTPL obligatoire"}, {"t": "⚠️ Actions", "c": "TOUJOURS FVTPL. Sauf choix irrévocable OCI (dividendes en P&L, variations JV en OCI, JAMAIS recyclé)"}, {"t": "Modèle ECL", "c": "Stade 1 : ECL 12 mois. Stade 2 : ECL durée de vie. Stade 3 : ECL durée de vie (intérêts sur net)"}, {"t": "Créances clients", "c": "Approche simplifiée → TOUJOURS ECL durée de vie (matrice de provisions)"}, {"t": "Couverture FV Hedge", "c": "Instrument + élément couvert → les deux au P&L (compensation)"}, {"t": "Couverture Cash Flow Hedge", "c": "Part efficace → OCI. Part inefficace → P&L. Recyclé en P&L quand le flux se réalise"}, {"t": "🔑 On DÉPRÉCIE les instruments financiers", "c": "Via le modèle ECL (Expected Credit Loss). Ce n'est pas un amortissement."}, {"t": "⚠️ vs RPC 27", "c": "RPC : simplifié, pas de modèle ECL à 3 stades"}]}, {"norm": "IFRS 13 — Évaluation de la juste valeur", "items": [{"t": "Hiérarchie 3 niveaux", "c": "N1 : prix cotés marché actif (identiques). N2 : données observables. N3 : données non observables"}, {"t": "N1 = plus fiable", "c": "Non ajustable. Prix côté pour actif/passif identique sur marché actif"}, {"t": "N3 = moins fiable", "c": "Modèles internes, projections → plus de disclosures requis"}, {"t": "Définition JV", "c": "Prix de sortie dans une transaction ordonnée entre participants de marché"}]}, {"norm": "IFRS 15 — Produits des activités ordinaires", "items": [{"t": "Modèle en 5 étapes", "c": "① Identifier contrat ② Identifier OP distinctes ③ Prix de transaction ④ Répartir ⑤ Comptabiliser"}, {"t": "OP distincte", "c": "Client peut en bénéficier isolément + engagement distinct dans le contrat"}, {"t": "Over time (3 critères, 1 suffit)", "c": "① Client consomme simultanément ② Client contrôle l'actif au fur et à mesure ③ Pas d'utilisation alternative + droit au paiement"}, {"t": "Point in time", "c": "Si AUCUN critère over time → transfert de contrôle à un moment précis"}, {"t": "Répartition du prix", "c": "Sur la base des prix de vente INDIVIDUELS RELATIFS de chaque OP"}, {"t": "Contrepartie variable", "c": "Incluse si hautement probable qu'il n'y aura pas de reprise significative"}]}, {"norm": "IFRS 16 — Contrats de location", "items": [{"t": "Preneur (lessee)", "c": "ACTIF (ROU = VA paiements + coûts directs) + PASSIF (dette = VA paiements futurs)"}, {"t": "Amortissement ROU", "c": "Linéaire (charge d'exploitation)"}, {"t": "Intérêts dette", "c": "Charge financière DÉCROISSANTE"}, {"t": "Exemptions", "c": "≤ 12 mois ET actifs < USD 5'000 neufs"}, {"t": "Bailleur (lessor)", "c": "Distinction MAINTENUE : financement vs opérationnel"}, {"t": "Taux d'actualisation", "c": "Taux implicite du contrat (priorité) ou taux d'emprunt marginal du preneur"}, {"t": "Composantes dette", "c": "Loyers fixes + variables indexés + garanties VR + option achat (si raisonnablement certain)"}, {"t": "⚠️ Loyers variables sur performance", "c": "PAS dans la dette → en CHARGES quand encourues"}, {"t": "⚠️ vs RPC 13", "c": "RPC maintient la distinction financier/opérationnel pour le preneur"}]}, {"norm": "IAS 12 — Impôts sur le résultat", "items": [{"t": "Différence temporelle", "c": "Écart base fiscale vs VC → DTA ou DTL"}, {"t": "DTA (actif d'impôt différé)", "c": "Différence temporelle déductible. Condition : bénéfices futurs imposables PROBABLES"}, {"t": "DTL (passif d'impôt différé)", "c": "Différence temporelle imposable. Comptabilisation OBLIGATOIRE (sauf exceptions)"}, {"t": "Différence permanente", "c": "PAS d'impôt différé (ex : amendes non déductibles)"}, {"t": "⚠️ Goodwill initial", "c": "PAS d'impôt différé sur le goodwill initial"}, {"t": "⚠️ Actualisation", "c": "INTERDITE pour les DTA/DTL"}, {"t": "⚠️ vs RPC 11", "c": "IAS 12 = complet et obligatoire. RPC 11 = allégé et optionnel pour PME"}]}, {"norm": "IAS 19 — Avantages du personnel", "items": [{"t": "Cotisations définies", "c": "Cotisation fixe → charge au résultat. Risque sur EMPLOYÉ. Pas d'obligation au bilan"}, {"t": "Prestations définies", "c": "Niveau garanti → obligation actuarielle. Risque sur EMPLOYEUR"}, {"t": "Coût des services", "c": "Au P&L"}, {"t": "Intérêts nets", "c": "Au P&L (taux d'actualisation × obligation nette)"}, {"t": "Écarts actuariels", "c": "En OCI (NON recyclable). ⚠️ Méthode du corridor = PLUS possible depuis 2011"}, {"t": "⚠️ vs RPC 16", "c": "RPC = comptes statutaires CP (pragmatique). IAS 19 = calcul actuariel (PBO, DBO)"}]}, {"norm": "IAS 21 — Effets des variations de change", "items": [{"t": "Transactions en devises", "c": "Monétaires = clôture (écarts au résultat). Non monétaires coût = historique. Non monétaires JV = cours à date JV"}, {"t": "Conversion filiale étrangère", "c": "Actifs/passifs = clôture. Produits/charges = moyen. FP = historique. Écarts → OCI (recyclé à la cession)"}]}, {"norm": "IAS 23 — Coûts d'emprunt", "items": [{"t": "Actif qualifié", "c": "Actif nécessitant une longue période de préparation"}, {"t": "Règle", "c": "Coûts d'emprunt directement attribuables → INCORPORÉS (obligation, pas choix)"}, {"t": "Autres coûts d'emprunt", "c": "En CHARGES de la période"}]}, {"norm": "Récap : vocabulaire qui prête à confusion", "items": [{"t": "AMORTIR", "c": "Répartir le coût sur la durée d'utilité → IC corporelles, IC incorporelles à durée déterminée, ROU IFRS 16"}, {"t": "DÉPRÉCIER (impairment)", "c": "Constater une perte de valeur imprévue → TOUS les actifs (y.c. stocks, créances, goodwill)"}, {"t": "DÉVALUER / Write-down", "c": "Réduire la valeur comptable des stocks quand VNR < coût. C'est une forme de dépréciation."}, {"t": "RÉÉVALUER", "c": "Remettre un actif à sa juste valeur (IAS 16/38 modèle réévaluation). Peut être à la HAUSSE → OCI"}, {"t": "PROVISIONNER", "c": "Constituer un passif estimé (IAS 37, RPC 23). ≠ Déprécier un actif"}, {"t": "CORRECTION DE VALEUR", "c": "Réduction de la valeur d'un actif au bilan (ducroire sur créances, provision pour dépréciation stocks)"}, {"t": "RÉSERVE LATENTE", "c": "Sous-évaluation d'actifs ou sur-évaluation de passifs → interdit IFRS, toléré RPC, encouragé CO"}, {"t": "GOODWILL", "c": "IFRS : activé, jamais amorti, test annuel. RPC : activé OU compensé avec FP, amorti si activé (max 20 ans)"}, {"t": "VNR vs JV", "c": "VNR = prix vente – coûts achèvement – coûts vente (spécifique entité, IAS 2)\nJV = prix de marché (IFRS 13)"}, {"t": "OCI vs P&L", "c": "OCI = variations ne passant pas par le résultat courant (réévaluations, écarts actuariels, conversion, hedges)"}]}, {"norm": "📊 Comparatif : Immobilisations corporelles", "items": [{"t": "Évaluation initiale", "c": "IFRS (IAS 16) : Coût (y.c. démantèlement, coûts d'emprunt IAS 23)\nRPC (RPC 18) : Coût (y.c. intérêts sur construction)\nCO : Coût d'acquisition au maximum (art. 960a)"}, {"t": "Évaluation subséquente", "c": "IFRS : Modèle du coût OU réévaluation (au choix par catégorie)\nRPC : Coût UNIQUEMENT pour exploitation. JV possible pour rendement\nCO : Coût – amortissements. Réserves latentes autorisées"}, {"t": "Amortissement", "c": "IFRS : Approche par composants obligatoire. Durée révisée annuellement.\nRPC : Approche par composants non requise. Durée estimée avec prudence.\nCO : Selon usage commercial. Amortissement accéléré possible."}, {"t": "Dépréciation", "c": "IFRS (IAS 36) : Si indices → test. Valeur recouvrable = max(FVLCD, VIU)\nRPC (RPC 20) : Si indices → test. Même logique de valeur réalisable.\nCO : Corrections de valeur si valeur réelle < VC (art. 960a)"}, {"t": "Réévaluation", "c": "IFRS : OUI (modèle réévaluation IAS 16). Plus-value → OCI\nRPC : NON pour exploitation. OUI pour rendement → au résultat\nCO : NON au-dessus du coût (sauf exceptions art. 670)"}]}, {"norm": "📊 Comparatif : Stocks", "items": [{"t": "Évaluation", "c": "IFRS (IAS 2) : Plus bas entre coût et VNR\nRPC (RPC 17) : Plus bas entre coût et valeur nette de marché\nCO (art. 960a) : Coût d'acquisition/revient au maximum. Pas d'évaluation ≥"}, {"t": "Méthodes", "c": "IFRS : FIFO ou moyenne pondérée. LIFO INTERDIT.\nRPC : FIFO ou moyenne pondérée. LIFO INTERDIT.\nCO : FIFO, moyenne, LIFO toutes AUTORISÉES."}, {"t": "Coût de production", "c": "IFRS : Coûts complets (directs + part raisonnable frais généraux production)\nRPC : Coûts complets (toutes dépenses directes et indirectes)\nCO : Pas de prescription détaillée"}, {"t": "Dépréciation", "c": "IFRS : Write-down si VNR < coût. Reprise possible.\nRPC : Write-down si VN marché < coût.\nCO : Corrections de valeur possibles. Réserves latentes sur stocks fréquentes."}]}, {"norm": "📊 Comparatif : Incorporelles", "items": [{"t": "Acquises", "c": "IFRS (IAS 38) : Activées si critères remplis (identifiable, contrôle, avantages)\nRPC (RPC 10) : Activées si profit mesurable sur plusieurs années\nCO : Activables (art. 959a)"}, {"t": "Créées en interne (développement)", "c": "IFRS : 6 critères cumulatifs stricts. Recherche = jamais.\nRPC : 4 critères cumulatifs (plus souples). Recherche = jamais.\nCO : Pas de distinction recherche/développement. Activation possible."}, {"t": "Amortissement", "c": "IFRS : Durée déterminée = amortir. Durée indéterminée = PAS amortir (test annuel)\nRPC : Toujours amortir. Par défaut 5 ans, max 20 ans. Liées à personnes = max 5 ans\nCO : Amortissement sur la durée d'utilisation, max 5 ans sauf justification"}, {"t": "Goodwill", "c": "IFRS : Activé, JAMAIS amorti, test annuel. Négatif → résultat immédiat\nRPC : Activé + amorti OU compensé avec FP. Négatif = même traitement\nCO : Activé, amorti max 5 ans"}]}, {"norm": "📊 Comparatif : Leasing", "items": [{"t": "Preneur — Classification", "c": "IFRS 16 : PAS de distinction (quasi tout au bilan)\nRPC 13 : Financier (au bilan) vs Opérationnel (hors bilan)\nCO : Pas de norme spécifique"}, {"t": "Preneur — Au bilan", "c": "IFRS 16 : ROU asset + dette de location (VA des paiements)\nRPC 13 : Seulement leasing financier au bilan\nCO : Selon les principes généraux"}, {"t": "Preneur — Au résultat", "c": "IFRS 16 : Amortissement (linéaire) + intérêts (décroissant) = charge front-loaded\nRPC 13 financier : Amortissement + intérêts\nRPC 13 opérationnel : Loyers en charges (linéaire)"}, {"t": "Bailleur", "c": "IFRS 16 : Distinction maintenue (financement vs opérationnel)\nRPC 13 : Idem\nCO : Pas de norme spécifique"}, {"t": "Impact sur ratios", "c": "IFRS 16 : Augmente l'actif ET la dette → ratio d'endettement plus élevé, EBITDA plus élevé\nRPC 13 opérationnel : Pas d'impact bilan → ratios plus « légers »"}]}, {"norm": "📊 Comparatif : Provisions", "items": [{"t": "Critères", "c": "IFRS (IAS 37) : Obligation actuelle + probable (>50%) + fiable. Strict.\nRPC (RPC 23) : Idem mais tolérance pratique\nCO : Charges et risques probables. Réserves latentes autorisées."}, {"t": "Actualisation", "c": "IFRS : Obligatoire si effet temps significatif\nRPC : Non obligatoire (taux publié si actualisée)\nCO : Pas de prescription"}, {"t": "Réserves latentes", "c": "IFRS : INTERDITES\nRPC : TOLÉRÉES dans une certaine mesure\nCO : Explicitement AUTORISÉES (art. 960e al. 4)"}, {"t": "Restructuration", "c": "IFRS : Plan détaillé + attente fondée créée\nRPC : Conditions similaires mais moins prescriptives\nCO : Selon l'art. 960e"}]}, {"norm": "📊 Comparatif : Impôts différés", "items": [{"t": "Méthode", "c": "IFRS (IAS 12) : Comprehensive liability, vue bilan\nRPC (RPC 11) : Comprehensive liability, vue bilan (similaire)\nCO : PAS d'impôts différés dans les comptes individuels CO"}, {"t": "DTA", "c": "IFRS : Comptabilisé si bénéfices futurs probables\nRPC : Sous immobilisations financières\nCO : N/A"}, {"t": "DTL", "c": "IFRS : Comptabilisation obligatoire (sauf exceptions)\nRPC : Sous provisions pour impôts\nCO : N/A"}, {"t": "Actualisation", "c": "IFRS : INTERDITE\nRPC : Pas de prescription\nCO : N/A"}, {"t": "Goodwill", "c": "IFRS : Pas d'impôt différé sur goodwill initial\nRPC : Idem (RPC 30/31)\nCO : N/A"}]}, {"norm": "📊 Comparatif : Revenus", "items": [{"t": "Modèle", "c": "IFRS (IFRS 15) : 5 étapes (contrat, OP, prix, répartition, reconnaissance)\nRPC : Transfert des risques et avantages (plus simple)\nCO : Principe de réalisation (art. 958b)"}, {"t": "Contrats de construction", "c": "IFRS 15 : Over time si critères remplis (3 critères, 1 suffit)\nRPC 22 : POC si 4 conditions cumulatives, sinon CC ou POC modifiée\nCO : Pas de norme spécifique"}, {"t": "Contrepartie variable", "c": "IFRS : Incluse si hautement probable (pas de reprise significative)\nRPC : Pas de guidance spécifique\nCO : Principe de prudence"}]}, {"norm": "📊 Comparatif : Instruments financiers", "items": [{"t": "Classification", "c": "IFRS 9 : 3 catégories (coût amorti, FVOCI, FVTPL) basées sur business model + SPPI\nRPC 27 : Simplifié. Coût ou juste valeur selon le type.\nCO : Évaluation au coût ou cours du marché selon l'actif"}, {"t": "Dépréciation", "c": "IFRS 9 : Modèle ECL à 3 stades (12 mois → durée de vie → défaut)\nRPC : Évaluation individuelle ou forfaitaire des pertes\nCO : Corrections de valeur si nécessaire"}, {"t": "Couverture", "c": "IFRS 9 : FV hedge (P&L) / CF hedge (OCI) / Net investment hedge\nRPC 27 : FV hedge (résultat) / CF hedge (FP sans résultat)\nCO : Pas de norme spécifique"}]}, {"norm": "📊 Comparatif : Prévoyance", "items": [{"t": "Approche", "c": "IFRS (IAS 19) : Calcul ACTUARIEL (PBO/DBO). Complexe.\nRPC (RPC 16) : Comptes STATUTAIRES de la CP. Pragmatique.\nCO : Engagements de prévoyance en annexe (art. 959c)"}, {"t": "Écarts actuariels", "c": "IFRS : En OCI (non recyclable)\nRPC : N/A (pas de calcul actuariel)\nCO : N/A"}, {"t": "Risque", "c": "IFRS (cotisations définies) : sur l'EMPLOYÉ\nIFRS (prestations définies) : sur l'EMPLOYEUR\nRPC/CO : Dépend du type de plan suisse (CP autonome vs assurance complète)"}]}, {"norm": "📊 Comparatif : Consolidation", "items": [{"t": "Contrôle", "c": "IFRS 10 : 3 éléments (pouvoir + rendements variables + capacité d'influer)\nRPC 30 : >50% droits de vote ou contrôle de fait\nCO (art. 963) : Contrôle des voix ou autre moyen de contrôle"}, {"t": "Méthode d'acquisition", "c": "IFRS 3 : Purchase method. Actifs nets à JV. Coûts de transaction en CHARGES.\nRPC 30 : Purchase method. Actifs nets à JV. Coûts de transaction dans le PRIX.\nCO : Pas de norme détaillée"}, {"t": "Goodwill", "c": "IFRS : Activé, jamais amorti, test annuel IAS 36\nRPC : Activé + amorti OU compensé avec FP\nCO : Art. 963b — goodwill traité selon la norme choisie"}, {"t": "Méthodes de consolidation", "c": "IFRS : Filiales → intégration globale. Associées → MEQ. JV → IFRS 11 (opérations conjointes ou MEQ)\nRPC : Filiales → intégration globale. JV → proportionnelle ou MEQ. Associées → MEQ\nCO : Selon la norme choisie (RPC ou IFRS)"}]}, {"norm": "📐 Reconnaissance / Évaluation / Présentation — par norme", "items": [{"t": "IAS 16 — Immobilisations corporelles", "c": "RECONNAISSANCE : coût probable + mesurable de manière fiable. Pièces de rechange majeures = IC si > 1 exercice.\nÉVALUATION : initiale au coût. Subséquente = coût OU réévaluation. Amortissement par composants.\nPRÉSENTATION : au bilan dans les actifs non courants. Tableau des IC en annexe. Méthodes + durées publiées."}, {"t": "IAS 2 — Stocks", "c": "RECONNAISSANCE : quand l'entité contrôle les avantages économiques. Pas de seuil spécifique.\nÉVALUATION : plus bas entre coût (FIFO/moyenne) et VNR. Coûts complets de production.\nPRÉSENTATION : actif courant. Publier VC par catégorie, montant des dépréciations, méthode de coût."}, {"t": "IAS 36 — Dépréciation", "c": "RECONNAISSANCE : si indices (ou test annuel pour goodwill/incorporelles durée indéterminée). VC > valeur recouvrable = perte.\nÉVALUATION : valeur recouvrable = max(FVLCD, VIU). VIU = DCF max 5 ans + valeur terminale, taux avant impôts.\nPRÉSENTATION : perte au P&L (ou OCI si réévaluation). Publier montant, événement, UGT concernée, hypothèses clés."}, {"t": "IAS 37 — Provisions", "c": "RECONNAISSANCE : obligation actuelle + probable (>50%) + fiable. Passif éventuel = pas de reconnaissance, juste annexe.\nÉVALUATION : meilleure estimation. Actualisation si effet temps significatif. Provisions restructuration = critères stricts.\nPRÉSENTATION : au bilan (passif). Tableau de variation (début, constitution, utilisation, dissolution, fin). Nature + incertitudes."}, {"t": "IAS 38 — Incorporelles", "c": "RECONNAISSANCE : identifiable + contrôle + avantages futurs. Développement = 6 critères. Recherche = jamais.\nÉVALUATION : coût OU réévaluation (rare). Durée déterminée = amortir. Durée indéterminée = pas d'amortissement, test annuel.\nPRÉSENTATION : actif non courant. Tableau des incorporelles. Publier si durée déterminée ou indéterminée + justification."}, {"t": "IAS 40 — Immeubles de placement", "c": "RECONNAISSANCE : mêmes critères qu'IAS 16 (coût probable + mesurable). Distinction exploitation vs placement.\nÉVALUATION : modèle du coût (comme IAS 16) OU modèle de la juste valeur (variations au P&L, PAS d'amortissement).\nPRÉSENTATION : actif non courant séparé. Si JV → publier méthode JV. Si coût → publier JV quand même en annexe."}, {"t": "IFRS 3 — Regroupements", "c": "RECONNAISSANCE : actifs/passifs identifiables à JV à la date d'acquisition. Incorporelles séparées du goodwill.\nÉVALUATION : goodwill = prix + minoritaires – JV actifs nets. Goodwill négatif = gain immédiat au P&L.\nPRÉSENTATION : goodwill en actif non courant (séparé). Publier description, JV contrepartie, actifs nets, goodwill, facteurs."}, {"t": "IFRS 9 — Instruments financiers", "c": "RECONNAISSANCE : quand l'entité devient partie aux dispositions contractuelles.\nÉVALUATION : initiale à JV (+ coûts de transaction sauf FVTPL). Subséquente = coût amorti, FVOCI, ou FVTPL selon classification.\nPRÉSENTATION : IFRS 7 = informations étendues sur risques (crédit, liquidité, marché), sensibilités, réconciliations ECL."}, {"t": "IFRS 15 — Revenus", "c": "RECONNAISSANCE : quand (ou au fur et à mesure que) l'OP est satisfaite. Over time (3 critères) ou point in time.\nÉVALUATION : prix de transaction = montant attendu (y.c. variable si hautement probable). Répartition par prix individuel relatif.\nPRÉSENTATION : produits désagrégés (par type, géographie, timing). Actifs/passifs sur contrat. Soldes de créances."}, {"t": "IFRS 16 — Leasing", "c": "RECONNAISSANCE : contrat = location si contrôle d'un actif identifié. Exemptions : ≤12 mois, < USD 5'000.\nÉVALUATION : ROU = VA paiements + coûts directs. Dette = VA paiements futurs. Réévaluation si changement de durée/indexation.\nPRÉSENTATION : ROU dans les actifs (séparé ou dans IC). Dette dans les passifs. Charges au CR = amortissement + intérêts. Tableau de maturité."}, {"t": "IAS 12 — Impôts différés", "c": "RECONNAISSANCE : DTL = toujours (sauf exceptions). DTA = si bénéfices futurs probables.\nÉVALUATION : taux adopté à la clôture. PAS d'actualisation. Réévaluer DTA à chaque clôture.\nPRÉSENTATION : DTA/DTL = non courant. Rapprochement charge théorique/effective (tax proof). Publier différences temporelles par nature."}, {"t": "IAS 19 — Avantages du personnel", "c": "RECONNAISSANCE : obligation de prestations définies = obligation nette (ou actif net) au bilan.\nÉVALUATION : PBO actualisée – JV des actifs du régime. Coût des services et intérêts nets au P&L. Écarts actuariels en OCI.\nPRÉSENTATION : obligation nette au bilan. Décomposition de la charge en 3 (services, intérêts nets, réévaluations OCI). Hypothèses actuarielles."}]}, {"norm": "🔍 Point de vue auditeur — par norme", "items": [{"t": "IAS 16 / RPC 18 — IC corporelles", "c": "ASSERTIONS : Existence · Évaluation · Droits\nBIAIS DIRECTION : capitaliser des charges, allonger les durées, ignorer l'impairment\nPROCÉDURES : inspection physique, PV d'acquisition, recalcul amortissements, revue indices dépréciation"}, {"t": "IAS 2 / RPC 17 — Stocks", "c": "ASSERTIONS : Existence · Évaluation · Exhaustivité\nBIAIS DIRECTION : ne pas déprécier l'obsolète, gonfler les quantités, inclure des coûts inappropriés\nPROCÉDURES : observation inventaire (ISA 501), tests de valorisation, aging, cut-off réceptions/expéditions"}, {"t": "IAS 36 / RPC 20 — Dépréciation", "c": "ASSERTIONS : Évaluation\nBIAIS DIRECTION : flux trop optimistes, taux trop bas, croissance terminale trop élevée\nPROCÉDURES : tester les hypothèses clés, analyse de sensibilité, track record, recalcul DCF, spécialiste évaluation"}, {"t": "IAS 37 / RPC 23 — Provisions", "c": "ASSERTIONS : Exhaustivité · Évaluation\nBIAIS DIRECTION : sous-estimer (gonfler résultat) ou surestimer (cookie jar)\nPROCÉDURES : lettre avocat (ISA 501), PV du CA, tester les hypothèses, comparer dénouement N-1"}, {"t": "IFRS 15 / RPC Revenus", "c": "ASSERTIONS : Survenance · Cut-off · Exactitude\nBIAIS DIRECTION : reconnaissance prématurée, ventes fictives, channel stuffing, side agreements\nPROCÉDURES : cut-off, confirmations clients, avoirs post-clôture, analytiques, écritures manuelles (ISA 240)\n⚠️ ISA 240 présume un risque de fraude sur les revenus"}, {"t": "IFRS 9 / RPC 27 — Instruments financiers", "c": "ASSERTIONS : Exhaustivité · Évaluation · Classification\nBIAIS DIRECTION : sous-estimer ECL, mauvaise classification (coût amorti vs FVTPL), cacher des dérivés\nPROCÉDURES : confirmation dépositaire, recalcul ECL, tester le staging, back-testing, vérifier SPPI"}, {"t": "IFRS 16 / RPC 13 — Leasing", "c": "ASSERTIONS : Exhaustivité · Évaluation\nBIAIS DIRECTION : ne pas identifier tous les contrats, durée de bail sous-estimée, taux inapproprié\nPROCÉDURES : registre des baux, lecture des contrats, recalcul ROU/dette, vérifier les exemptions"}, {"t": "IAS 12 / RPC 11 — Impôts différés", "c": "ASSERTIONS : Évaluation · Exhaustivité\nBIAIS DIRECTION : activer des DTA sans bénéfices futurs probables, taux incorrect\nPROCÉDURES : tax proof, vérifier le taux, revue des différences temporelles, évaluer recouvrabilité DTA"}, {"t": "IFRS 3 / RPC 30 — Regroupements", "c": "ASSERTIONS : Évaluation · Exhaustivité · Classification\nBIAIS DIRECTION : JV des actifs nets gonflée (réduire le goodwill), incorporelles non identifiées, passifs éventuels omis\nPROCÉDURES : revue du PPA (Purchase Price Allocation), tester les JV, spécialiste évaluation, vérifier la période d'évaluation (12 mois)"}, {"t": "IAS 19 / RPC 16 — Prévoyance", "c": "ASSERTIONS : Évaluation · Exhaustivité\nBIAIS DIRECTION : taux d'actualisation trop élevé (réduit l'obligation), hypothèses actuarielles favorables\nPROCÉDURES : obtenir le rapport de l'actuaire, tester les hypothèses (taux, espérance de vie, inflation), vérifier les données de base (effectif, salaires)"}]}, {"norm": "🎯 Normes additionnelles — Résumés clés", "items": [{"t": "IFRS 5 — Actifs détenus en vue de la vente", "c": "Critères : disponible immédiatement + vente hautement probable (12 mois). Évaluation : plus bas entre VC et JV – coûts de vente. Amortissement CESSE. Présentation : ligne SÉPARÉE actif courant. Activité abandonnée → ligne unique après résultat des activités poursuivies."}, {"t": "IAS 7 — Tableau des flux de trésorerie", "c": "3 catégories : opérationnel (direct ou indirect), investissement, financement. Intérêts et dividendes : choix de classification (constant). Transactions non monétaires (ex: IFRS 16 initial) → exclues du TFT, publiées en annexe."}, {"t": "IAS 24 — Parties liées", "c": "Publication OBLIGATOIRE de toutes les transactions (pas seulement anormales comme RPC 15). Rémunération KMP par catégorie. Nom de la société mère ultime."}, {"t": "IAS 28 — Mise en équivalence", "c": "Initiale au coût → ajustée pour quote-part résultat. Dividendes = réduction VC (pas au résultat). Goodwill inclus dans la VC. Pertes > VC → stop sauf engagements/prêts LT."}, {"t": "IFRS 11 — Partenariats", "c": "Joint Operation = droits sur actifs/obligations sur passifs → comptabiliser sa part directement. Joint Venture = droits sur l'actif net → mise en équivalence. ⚠️ Consolidation proportionnelle INTERDITE pour les JV sous IFRS."}, {"t": "IAS 32 — Présentation instruments financiers", "c": "Distinction dette/FP basée sur l'OBLIGATION contractuelle, pas la forme juridique. Actions rachetables = dette. Obligations convertibles = split accounting (dette + FP)."}, {"t": "IAS 33 — Résultat par action", "c": "Base = résultat / nombre moyen pondéré d'actions. Dilué = ajusté pour options, convertibles. Instruments antidilutifs exclus. Obligatoire pour entités COTÉES uniquement."}]}], "anglais": [{"cat": "📊 États financiers", "terms": [["Bilan", "Balance sheet / Statement of financial position"], ["Compte de résultat", "Income statement / Profit & Loss (P&L)"], ["Tableau de flux de trésorerie", "Cash flow statement"], ["Annexe", "Notes to the financial statements"], ["Capitaux propres", "Equity / Shareholders' equity"], ["Résultat net", "Net income / Net profit"], ["Chiffre d'affaires", "Revenue / Turnover / Net sales"], ["Bénéfice avant impôts", "Profit before tax (PBT)"], ["EBIT", "Earnings before interest and taxes"], ["EBITDA", "Earnings before interest, taxes, depreciation & amortization"], ["Fonds propres", "Equity / Net assets"], ["Fonds étrangers", "Liabilities / Debt"], ["Actif circulant", "Current assets"], ["Actif immobilisé", "Non-current assets / Fixed assets"], ["Dettes à court terme", "Current liabilities"], ["Dettes à long terme", "Non-current liabilities / Long-term debt"]]}, {"cat": "🏦 Postes du bilan", "terms": [["Liquidités", "Cash and cash equivalents"], ["Créances clients", "Trade receivables / Accounts receivable"], ["Stocks", "Inventories"], ["Actifs de régularisation", "Prepaid expenses / Accrued income"], ["Immobilisations corporelles", "Property, plant and equipment (PP&E)"], ["Immobilisations incorporelles", "Intangible assets"] t professionnel", "Professional judgment"], ["Risque inhérent", "Inherent risk"], ["Risque de contrôle", "Control risk"], ["Risque de non-détection", "Detection risk"], ["Contrôle interne (SCI)", "Internal control system (ICS)"], ["Risque significatif", "Significant risk"], ["Fraude", "Fraud"], ["Erreur", "Error / Misstatement"], ["Anomalie", "Misstatement"], ["Réserves latentes", "Hidden reserves"], ["Principe de prudence", "Prudence principle / Conservatism"], ["Indépendance", "Independence"], ["Secret professionnel", "Professional secrecy / Confidentiality"]]}, {"cat": "💬 Expressions de réunion", "terms": [["Pouvez-vous nous fournir...", "Could you provide us with..."], ["Nous avons identifié une anomalie", "We have identified a misstatement"], ["Pourriez-vous confirmer que...", "Could you confirm that..."], ["Selon notre compréhension...", "Based on our understanding..."], ["Nous souhaitons discuter de...", "We would like to discuss..."], ["Y a-t-il eu des changements depuis...", "Have there been any changes since..."], ["Nous avons besoin d'une explication", "We need an explanation for..."], ["Le seuil de signification est de...", "The materiality threshold is..."], ["L'écart est en dessous du seuil", "The variance is below materiality"], ["Nous proposons un ajustement", "We propose an adjustment"], ["La direction a-t-elle connaissance de...", "Is management aware of..."], ["Nous devons escalader ce point", "We need to escalate this matter"]]}], "seuils": [{"cat": "📏 Seuils CO — Révision", "items": [{"label": "Contrôle ORDINAIRE (art. 727 CO)", "val": "2/3 sur 2 exercices : bilan 20M · CA 40M · 250 ETP", "extra": "+ sociétés cotées + comptes consolidés obligatoires", "star": 1, "mnemo": "20-40-250"}, {"label": "Contrôle RESTREINT (art. 727a CO)", "val": "Ne remplit PAS les seuils du contrôle ordinaire", "extra": "Revue limitée (pas ISA complet)"}, {"label": "OPTING-OUT (art. 727a al. 2 CO)", "val": "≤ 10 ETP + accord de TOUS les actionnaires", "extra": "Renonciation totale au contrôle", "star": 1, "mnemo": "U-10-T"}, {"label": "Obligation comptabilité complète", "val": "CA ≥ CHF 500'000 (art. 957 CO)", "extra": "< 500k → comptabilité simplifiée"}, {"label": "Conservation des pièces comptables", "val": "10 ans", "extra": "Livres, pièces, rapport de gestion & de révision (art. 958f CO). Sous forme papier ou électronique."}, {"label": "Assemblée générale ordinaire", "val": "Dans les 6 mois après la clôture", "extra": "Art. 699 al. 2 CO. Approuve les comptes, décharge, affectation du bénéfice."}, {"label": "Prescription — action en responsabilité", "val": "5 ans dès connaissance · 10 ans absolue", "extra": "Art. 760 CO. Délai pénal plus long si l'acte est punissable (action contre administrateurs/réviseur)."}]}, {"cat": "📏 Seuils Swiss GAAP RPC", "items": [{"label": "RPC fondamentales (petites entités)", "val": "2/3 sur 2 exercices : bilan 10M · CA 20M · 50 ETP", "extra": "⚠️ Sociétés cotées = JAMAIS limitées aux fondamentales", "star": 1, "mnemo": "10-20-50"}, {"label": "RPC 30 pour petits groupes", "val": "S'applique EN SUS des RPC fondamentales", "extra": ""}, {"label": "Goodwill — durée amortissement", "val": "Par défaut 5 ans · Maximum 20 ans si justifié", "extra": "Si compensé avec FP → pas d'amortissement, mais annexe obligatoire"}, {"label": "Incorporelles — durée amortissement", "val": "Par défaut 5 ans · Max 20 ans · Liées à personnes = max 5 ans", "extra": ""}]}, {"cat": "💰 TVA — Taux et seuils", "items": [{"label": "Taux NORMAL (dès 01.01.2024)", "val": "8,1%", "extra": "Ancien : 7,7%", "star": 1}, {"label": "Taux RÉDUIT", "val": "2,6%", "extra": "Alimentaire, médicaments, livres, hygiène menstruelle"}, {"label": "Taux SPÉCIAL hébergement", "val": "3,8%", "extra": "Ancien : 3,7%"}, {"label": "Seuil assujettissement", "val": "CHF 100'000 CA mondial", "extra": "Sportives/culturelles non lucratives : CHF 250'000", "star": 1}, {"label": "Impôt sur les acquisitions — assujetti", "val": "Dès le 1er franc", "extra": ""},
