]}, {"cat": "⚠️ Art. 725 CO — Surendettement", "items": [{"label": "Perte de la moitié du capital (art. 725a CO)", "val": "FP < 50% du capital-actions", "extra": "CA doit prendre des mesures d'assainissement"}, {"label": "Surendettement (art. 725b CO)", "val": "Dettes > actifs (évaluation aux valeurs de continuation ET de liquidation)", "extra": "Avis au juge si pas de perspective d'assainissement", "star": 1}, {"label": "Rôle de l'organe de révision", "val": "Avise le juge si le CA omet de le faire", "extra": "Art. 728c al. 3 CO / art. 729c CO"}, {"label": "Going concern en audit", "val": "ISA 570 — évaluer la continuité sur 12 mois", "extra": "Si doutes → emphasis of matter ou modification d'opinion"}]}, {"cat": "📐 Matérialité — Benchmarks", "items": [{"label": "Base : Total des actifs", "val": "1 – 2%", "extra": "Entités stables, bilan solide"}, {"label": "Base : Bénéfice avant impôts", "val": "5 – 10%", "extra": "Si BAI stable et significatif", "star": 1}, {"label": "Base : Chiffre d'affaires", "val": "0,5 – 1%", "extra": "PME, entités en croissance"}, {"label": "Base : Fonds propres", "val": "1 – 5%", "extra": "Entités financières, holdings"}, {"label": "Matérialité d'exécution", "val": "50 – 75% de la matérialité globale", "extra": "Plus bas si risque élevé (50%), plus haut si risque faible (75%)"}, {"label": "SUD (seuil de remontée)", "val": "~5% de la matérialité globale", "extra": "En dessous = clairement trivial (pas de documentation)"}]}, {"cat": "🏢 Société anonyme — Chiffres clés", "items": [{"label": "Capital-actions minimum SA", "val": "CHF 100'000", "extra": "Libération min 20% (et au moins CHF 50'000)", "star": 1}, {"label": "Capital social minimum Sàrl", "val": "CHF 20'000", "extra": "Entièrement libéré à la constitution", "star": 1}, {"label": "Réserve légale issue du bénéfice", "val": "5% du bénéfice annuel jusqu'à 50% du capital", "extra": "Art. 672 CO (ancien droit) / dispositions révisées"}, {"label": "Durée mandat organe de révision", "val": "1 à 3 exercices, renouvelable", "extra": ""}, {"label": "Rotation associé d'audit (CH)", "val": "7 ans max + cooling-off 2 ans", "extra": "EXPERTsuisse / LSR", "star": 1, "mnemo": "7+2"}]}], "consolidation": [{"cat": "🏢 IFRS 10 — Contrôle et périmètre", "items": [{"t": "Définition du contrôle (3 éléments cumulatifs)", "c": "① POUVOIR sur l'entité (droits existants de diriger les activités pertinentes)\n② EXPOSITION à des rendements variables\n③ CAPACITÉ d'utiliser le pouvoir pour influer sur les rendements\n\n⚠️ Le contrôle peut exister SANS majorité de vote (contrôle de fait, droits de vote potentiels, accords contractuels)."}, {"t": "Activités pertinentes", "c": "= Activités qui affectent significativement les rendements de l'entité.\nExemples : politique commerciale, décisions d'investissement, politique de financement.\nL'investisseur qui dirige ces activités a le POUVOIR."}, {"t": "Agent vs Principal", "c": "PRINCIPAL → contrôle pour son propre compte → CONSOLIDE\nAGENT → contrôle pour le compte d'un tiers → NE consolide PAS\n\nIndicateurs d'agent : pouvoir limité, révocable, rémunération liée au service, faible exposition aux rendements variables."}, {"t": "Entités ad hoc (SPV/SIV)", "c": "Même sans détention de parts → consolider si contrôle économique.\nFréquent dans : titrisation, leasing, R&D, financement structuré."}, {"t": "Exemption de consolidation", "c": "IFRS 10 autorise l'exemption si :\n→ L'entité est elle-même une filiale entièrement détenue\n→ La société mère ultime publie des comptes consolidés IFRS\n→ Les instruments de l'entité ne sont pas cotés"}]}, {"cat": "💰 IFRS 3 — Regroupements d'entreprises (PPA)", "items": [{"t": "Méthode de l'acquisition (purchase method)", "c": "Étapes :\n① Identifier l'ACQUÉREUR\n② Déterminer la DATE d'acquisition (= date de prise de contrôle)\n③ Évaluer la CONTREPARTIE transférée (à la JV)\n④ Comptabiliser les actifs identifiables et passifs repris à la JV\n⑤ Calculer le GOODWILL (ou gain sur acquisition avantageuse)"}, {"t": "Contrepartie transférée", "c": "À la JV à la date d'acquisition :\n→ Trésorerie\n→ Actions émises (JV au cours du jour)\n→ Contrepartie conditionnelle (earnout) → à la JV estimée\n\n⚠️ Coûts de transaction (due diligence, avocats, banquiers) = EN CHARGES (pas dans le goodwill sous IFRS)."}, {"t": "Actifs identifiables acquis", "c": "TOUS les actifs et passifs de l'acquise sont évalués à la JV, y compris :\n→ Incorporelles NON comptabilisées chez l'acquise (marques, relations clients, carnet de commandes, technologie)\n→ Passifs éventuels (si JV mesurable)\n→ Impôts différés sur les réévaluations\n\n⚠️ Condition d'identification : séparable OU résulte de droits contractuels/légaux."}, {"t": "Goodwill = formule", "c": "Goodwill = Contrepartie transférée + JV des minoritaires – JV des actifs nets identifiables\n\n2 méthodes pour les minoritaires :\n→ FULL goodwill : minoritaires à la JV (inclut leur part de goodwill)\n→ PARTIAL goodwill : minoritaires = quote-part des actifs nets (goodwill = part acquéreur uniquement)\n\nChoix : par REGROUPEMENT (pas politique uniforme)."}, {"t": "Goodwill négatif (bargain purchase)", "c": "Si JV des actifs nets > contrepartie → gain.\nÉtape obligatoire : REVOIR les évaluations (erreur ?)\nSi confirmé → gain IMMÉDIAT au résultat.\n\n⚠️ Sous RPC 30 : même traitement que goodwill positif (activation ou compensation FP)."}, {"t": "Période d'évaluation (measurement period)", "c": "12 MOIS max après la date d'acquisition.\nPendant cette période : ajustements RÉTROSPECTIFS (comme si connus à la date d'acquisition) → ajustent le goodwill.\nAprès 12 mois : ajustements au RÉSULTAT."}, {"t": "Contrepartie conditionnelle (earnout)", "c": "Comptabilisée à la JV à la date d'acquisition.\nClassification : dette OU capitaux propres selon IAS 32.\nSi DETTE → réévaluée à chaque clôture, variations au P&L.\nSi FP → pas de réévaluation."}, {"t": "Acquisition par étapes (step acquisition)", "c": "Quand le contrôle est obtenu en plusieurs tranches :\n→ La participation ANTÉRIEURE est réévaluée à la JV à la date de prise de contrôle\n→ Le gain/perte sur la réévaluation → au P&L\n→ Le goodwill est calculé sur la base de TOUTE la participation (pas par tranches)"}]}, {"cat": "📊 IAS 28 / IFRS 11 — Associées et partenariats", "items": [{"t": "Mise en équivalence (IAS 28)", "c": "① Initiale : au COÛT\n② Quote-part du résultat → P&L (ligne séparée)\n③ Dividendes → réduisent la VC (PAS un produit)\n④ Quote-part des OCI → OCI\n⑤ Goodwill implicite inclus dans la VC\n⑥ Test de dépréciation sur la VC TOTALE (y.c. goodwill)"}, {"t": "Perte d'influence notable", "c": "→ Décomptabiliser la participation\n→ Gain/perte = prix de cession – VC de la participation\n→ Si participation résiduelle → comptabiliser à la JV (IFRS 9)\n→ OCI cumulés recyclés au P&L"}, {"t": "IFRS 11 — Joint Operation vs Joint Venture", "c": "Joint OPERATION : droits sur les actifs, obligations sur les passifs\n→ Comptabiliser sa part directement (actifs, passifs, produits, charges)\n\nJoint VENTURE : droits sur l'actif net\n→ Mise en ÉQUIVALENCE (IAS 28)\n\n⚠️ Consolidation proportionnelle INTERDITE sous IFRS (autorisée sous RPC 30)."}]}, {"cat": "🇨🇭 RPC 30 — Comptes consolidés (spécificités suisses)", "items": [{"t": "Périmètre", "c": "> 50% droits de vote (ou contrôle de fait) → intégration GLOBALE\n50% contrôle conjoint → proportionnelle OU mise en équivalence\n20-50% influence notable → mise en ÉQUIVALENCE\n< 20% → coût ou JV\n\n⚠️ La consolidation proportionnelle est AUTORISÉE sous RPC (interdite sous IFRS)."}, {"t": "Goodwill — 2 méthodes", "c": "① ACTIVATION + amortissement (5 ans par défaut, max 20 ans)\n② COMPENSATION directe avec les FP\n\nChoix UNIFORME pour toutes les acquisitions.\n\nSi compensation → annexe : effets d'une capitalisation théorique (VC, amortissement, dépréciation, etc.)."}, {"t": "Coûts de transaction", "c": "INCLUS dans le prix d'achat → font partie du goodwill.\n\n⚠️ Grande différence avec IFRS 3 où ils sont en CHARGES."}, {"t": "Identification des incorporelles", "c": "Si goodwill COMPENSÉ avec FP → obligation d'identifier et inscrire au bilan les incorporelles importantes pour la prise de contrôle.\nSi goodwill ACTIVÉ → PAS obligatoire.\n\n⚠️ C'est inversé par rapport à la logique intuitive !"}, {"t": "Recyclage du goodwill à la cession", "c": "Si goodwill compensé avec FP → lors de la cession de la filiale, reprendre le goodwill initial dans le calcul du gain/perte.\n= On « recycle » le goodwill comme s'il n'avait jamais été compensé.\n\nCessation d'activité et liquidation = assimilées à une aliénation."}, {"t": "Acquisition par étapes (RPC 30)", "c": "→ Goodwill calculé SÉPARÉMENT pour chaque étape\n→ À la prise de contrôle : actifs nets réévalués à JV totale\n→ Différences sur anciennes quotes-parts → FP\n→ Achat de minoritaires : goodwill = coût – VC proportionnelle des minoritaires"}, {"t": "Éliminations obligatoires", "c": "→ Actifs et passifs intragroupes\n→ Charges et produits des transactions internes\n→ Bénéfices internes (ex : marge sur vente intragroupe de stocks non revendus)\n→ Dividendes intragroupes"}, {"t": "Conversion des filiales étrangères", "c": "Méthode du cours de clôture :\n→ Actifs/passifs : cours clôture\n→ FP : cours historique\n→ CR et TFT : cours moyen annuel\n→ Écarts de conversion → FP\n→ Prêts LT intragroupe (nature FP) → écarts en FP aussi\n→ Perte de contrôle → écarts cumulés recyclés au résultat"}]}, {"cat": "📊 Tableau comparatif : Consolidation IFRS vs RPC vs CO", "items": [{"t": "Critère de contrôle", "c": "IFRS 10 : 3 éléments (pouvoir + rendements variables + capacité)\nRPC 30 : >50% droits de vote ou contrôle de fait\nCO 963 : contrôle des voix ou autre moyen"}, {"t": "Méthode d'acquisition", "c": "IFRS 3 : purchase method, actifs nets à JV, coûts transaction en CHARGES\nRPC 30 : purchase method, actifs nets à JV, coûts transaction dans le PRIX\nCO : selon la norme choisie (RPC ou IFRS)"}, {"t": "Goodwill", "c": "IFRS : activé, JAMAIS amorti, test annuel IAS 36, reprise interdite\nRPC : activé + amorti (5-20 ans) OU compensé avec FP\nCO (art. 963b) : selon la norme choisie"}, {"t": "Goodwill négatif", "c": "IFRS : gain IMMÉDIAT au résultat (après re-vérification)\nRPC : même traitement que goodwill positif\nCO : selon la norme choisie"}, {"t": "Joint-ventures", "c": "IFRS 11 : JV = mise en équivalence UNIQUEMENT (proportionnelle interdite)\nRPC 30 : proportionnelle OU mise en équivalence (choix)\nCO : selon la norme choisie"}, {"t": "Associées", "c": "IAS 28 : mise en équivalence. Dividendes = réduction VC\nRPC 30 : mise en équivalence. Même traitement\nCO : selon la norme choisie"}, {"t": "Minoritaires", "c": "IFRS : full goodwill OU partial goodwill (choix par regroupement)\nRPC : part au capital + part au résultat séparément\nCO : selon la norme choisie"}, {"t": "Impôts différés à l'acquisition", "c": "IFRS : DTA/DTL sur les réévaluations (sauf goodwill initial)\nRPC : idem (RPC 30/31)\nCO : N/A dans les comptes individuels"}]}, {"cat": "🔄 Fusion / Restructuration — Aspects comptables", "items": [{"t": "Fusion par absorption — Comptabilisation (acquéreur)", "c": "L'acquéreur :\n→ Reprend TOUS les actifs et passifs de la société absorbée\n→ Les évalue à la JV (IFRS 3) ou à la VC (si neutralité fiscale art. 61 LIFD)\n→ Émet des actions nouvelles aux actionnaires de l'absorbée\n→ Calcule le goodwill (prix – actifs nets JV)\n\n⚠️ Sous CO/RPC : si restructuration fiscalement neutre → reprise aux valeurs COMPTABLES."}, {"t": "Rapport d'échange", "c": "= Nombre d'actions nouvelles reçues par les actionnaires de l'absorbée.\n\nCalcul : basé sur les VALEURS RÉELLES des deux sociétés (pas les valeurs nominales).\n\nExemple : A vaut CHF 900k (300 actions), B vaut CHF 300k (100 actions)\n→ Ratio = 1:1 (chaque actionnaire de B reçoit 1 action A pour 1 action B)\n→ Ou 100 nouvelles actions A émises pour les 100 actionnaires de B"}, {"t": "Soulte (LFus art. 7)", "c": "= Compensation en espèces si le rapport d'échange ne tombe pas « juste ».\nMax 10% de la VN des parts attribuées.\n⚠️ Soulte > 10% → fusion INVALIDE."}, {"t": "Consolidation inversée (reverse acquisition)", "c": "Quand la société juridiquement acquise est en réalité l'ACQUÉREUR comptable (IFRS 3).\nExemple : petite société cotée absorbe une grande société → la grande est l'acquéreur comptable.\n\nRare mais piège d'examen classique."}]}, {"cat": "🎯 Questions types examen — Consolidation", "items": [{"t": "Question type 1 : Calcul du goodwill", "c": "Données : prix d'achat, actifs nets à la JV, coûts de transaction.\nAttendus : calculer le goodwill sous IFRS ET sous RPC.\n→ IFRS : exclure les coûts de transaction\n→ RPC : inclure les coûts de transaction\n→ Identifier les incorporelles séparables"}, {"t": "Question type 2 : Éliminations intragroupes", "c": "Données : vente intragroupe de stocks avec marge, créance/dette intragroupe.\nAttendus : montrer les écritures d'élimination.\n→ Éliminer la créance/dette\n→ Éliminer le CA et le coût des ventes internes\n→ Éliminer le bénéfice interne sur le stock non revendu"}, {"t": "Question type 3 : Mise en équivalence", "c": "Données : % de participation, résultat de l'associée, dividendes.\nAttendus : calculer la VC de la participation.\n→ VC initiale + quote-part résultat – quote-part dividendes\n⚠️ Dividendes = réduction VC, PAS un produit"}, {"t": "Question type 4 : Conversion filiale étrangère", "c": "Données : bilan et CR en devise, cours début/fin/moyen.\nAttendus : convertir en CHF + calculer l'écart de conversion.\n→ Bilan au cours de clôture (sauf FP = historique)\n→ CR au cours moyen\n→ Écart = bouclage → en FP (OCI)"}, {"t": "Question type 5 : Goodwill RPC — activation vs compensation", "c": "Données : acquisition, goodwill calculé.\nAttendus : montrer les deux traitements possibles.\n→ Activation : actif au bilan + amortissement\n→ Compensation : écriture de compensation FP + annexe obligatoire\n→ Impact sur le résultat et les ratios dans les deux cas"}]}], "cas_chiffres": [{"id": 1, "cat": "Consolidation", "title": "Calcul du goodwill (RPC 30)", "enonce": "Société A achète 100% de Société B.\nPrix d'achat : CHF 500'000 (y.c. CHF 20'000 de frais de due diligence).\nActifs nets de B à la juste valeur : CHF 350'000.\n\nCalcule le goodwill sous RPC 30.", "fields": [{"label": "Goodwill (CHF)", "answer": 170000, "tolerance": 0}], "correction": "Sous RPC 30, les coûts de transaction sont INCLUS dans le prix :\nPrix total = 500'000 (y.c. 20'000 frais)\nGoodwill = 500'000 – 350'000 = CHF 170'000\n\n⚠️ Sous IFRS 3, les frais (20'000) seraient en CHARGES :\nGoodwill IFRS = 480'000 – 350'000 = CHF 130'000"}, {"id": 2, "cat": "Consolidation", "title": "Calcul du goodwill (IFRS 3)", "enonce": "Même données que le cas précédent :\nPrix payé : CHF 500'000 dont CHF 20'000 de frais.\nActifs nets JV : CHF 350'000.\n\nCalcule le goodwill sous IFRS 3.", "fields": [{"label": "Goodwill (CHF)", "answer": 130000, "tolerance": 0}], "correction": "Sous IFRS 3, frais de transaction = CHARGES :\nPrix d'acquisition = 500'000 – 20'000 = CHF 480'000\nGoodwill = 480'000 – 350'000 = CHF 130'000\nFrais due diligence : CHF 20'000 en charges au P&L"}, {"id": 3, "cat": "Matérialité", "title": "Calcul de la matérialité (ISA 320)", "enonce": "PME industrielle :\n• Total des actifs : CHF 8'000'000\n• CA : CHF 12'000'000\n• Bénéfice avant impôts : CHF 600'000\n\nBase retenue : 5% du BAI.\nCalcule la matérialité globale, d'exécution (60%) et le SUD (5%).", "fields": [{"label": "Matérialité globale", "answer": 30000, "tolerance": 0}, {"label": "Matérialité d'exécution", "answer": 18000, "tolerance": 0}, {"label": "SUD", "answer": 1500, "tolerance": 0}], "correction": "Matérialité globale = 600'000 × 5% = CHF 30'000\nMatérialité d'exécution = 30'000 × 60% = CHF 18'000\nSUD = 30'000 × 5% = CHF 1'500\n\nAlternatives possibles :\n• 1% des actifs = 80'000\n• 0,5% du CA = 60'000\n• Le choix de la base dépend du profil de l'entité."}, {"id": 4, "cat": "IFRS 16", "title": "Dette de location initiale (IFRS 16)", "enonce": "Bail commercial : 5 ans, loyer annuel CHF 50'000 payé en fin d'année.\nTaux d'emprunt marginal : 4%.\nPas d'option d'achat.\n\nFacteurs d'actualisation à 4% :\nAnnée 1: 0.9615 | Année 2: 0.9246 | Année 3: 0.8890\nAnnée 4: 0.8548 | Année 5: 0.8219\n\nCalcule la dette de location initiale.", "fields": [{"label": "Dette de location (CHF)", "answer": 222591, "tolerance": 100}], "correction": "VA = 50'000 × (0.9615 + 0.9246 + 0.8890 + 0.8548 + 0.8219)\nVA = 50'000 × 4.4518\nVA = CHF 222'590 (arrondi 222'591)\n\nÉcritures initiales :\nDt Droit d'utilisation (ROU)  222'591\n  Ct Dette de location         222'591\n\nAnnée 1 :\nDt Amortissement ROU     44'518 (222'591/5)\nDt Intérêts financiers       8'904 (222'591 × 4%)\n  Ct Amort. cumulé ROU      44'518\n  Ct Dette de location        41'096 (50'000 – 8'904)"}, {"id": 5, "cat": "TVA", "title": "Décompte TVA — méthode effective", "enonce": "Restaurant (taux normal 8,1%) :\n• CA HT du trimestre : CHF 200'000\n• Achats de marchandises TTC : CHF 86'480 (TVA 8,1% incluse)\n• Loyer (exclu TVA, pas d'option) : CHF 15'000\n\nCalcule la TVA due.", "fields": [{"label": "TVA sur le CA", "answer": 16200, "tolerance": 0}, {"label": "Impôt préalable déductible", "answer": 6480, "tolerance": 0}, {"label": "TVA nette due", "answer": 9720, "tolerance": 0}], "correction": "TVA sur CA = 200'000 × 8,1% = CHF 16'200\n\nImpôt préalable :\n• Achats : 86'480 / 1.081 = 80'000 HT → TVA = 6'480 ✓\n• Loyer : EXCLU du champ → PAS de DIP = 0\n\nTVA nette = 16'200 – 6'480 = CHF 9'720\n\n⚠️ Le loyer est exclu du champ de l'impôt (art. 21 LTVA) → pas de récupération de TVA."}, {"id": 6, "cat": "TVA", "title": "TDFN vs méthode effective", "enonce": "Fiduciaire (TDFN = 6,2%) :\n• CA TTC du trimestre : CHF 108'100\n\nCalcule la TVA due avec la méthode des TDFN.", "fields": [{"label": "TVA due (TDFN)", "answer": 6702, "tolerance": 10}], "correction": "CA TTC = CHF 108'100\nTVA due = 108'100 × 6,2% = CHF 6'702.20\n\n⚠️ Avec la méthode effective :\nCA HT = 108'100 / 1.081 = CHF 100'000\nTVA brute = 100'000 × 8,1% = CHF 8'100\nMoins IP sur charges → souvent plus avantageux que TDFN pour les fiduciaires (peu de charges avec TVA)."}, {"id": 7, "cat": "Prévoyance", "title": "Imposition prestation en capital (art. 38 LIFD)", "enonce": "M. Müller retire CHF 800'000 de son 2e pilier.\nLe barème art. 36 LIFD donne un taux de 10,5% pour ce montant.\n\nCalcule l'impôt fédéral direct.", "fields": [{"label": "Impôt fédéral (CHF)", "answer": 16800, "tolerance": 0}], "correction": "Art. 38 LIFD : taux = 1/5 du barème\n\nImpôt = 800'000 × 10,5% / 5 = CHF 16'800\n\n⚠️ Imposition SÉPARÉE (pas ajouté aux autres revenus).\nPas de déductions sociales autorisées (art. 38 al. 3)."}, {"id": 8, "cat": "Prévoyance", "title": "Déduction pilier 3A", "enonce": "Tiffanie est salariée affiliée à une CP (2e pilier).\nMontant-limite supérieur LPP : CHF 88'200.\n\nQuel est le montant maximum déductible pour le 3e pilier A ?", "fields": [{"label": "Maximum 3A (CHF)", "answer": 7056, "tolerance": 0}], "correction": "Avec 2e pilier : 8% du montant-limite supérieur LPP\n= 88'200 × 8% = CHF 7'056\n\n⚠️ Sans 2e pilier : 20% du revenu, max CHF 35'280 (40% × 88'200)."}, {"id": 9, "cat": "Dépréciation", "title": "Test de dépréciation (IAS 36 / RPC 20)", "enonce": "Machine industrielle :\n• Valeur comptable : CHF 300'000\n• Juste valeur moins coûts de sortie : CHF 220'000\n• Valeur d'utilité (VA des flux futurs) : CHF 260'000\n\nY a-t-il une dépréciation ? Si oui, de combien ?", "fields": [{"label": "Valeur recouvrable (CHF)", "answer": 260000, "tolerance": 0}, {"label": "Perte de valeur (CHF)", "answer": 40000, "tolerance": 0}], "correction": "Valeur recouvrable = MAX(FVLCD, VIU)\n= MAX(220'000, 260'000) = CHF 260'000\n\nVC (300'000) > Valeur recouvrable (260'000)\n→ Perte de valeur = 300'000 – 260'000 = CHF 40'000\n\nÉcriture :\nDt Perte de valeur (résultat)  40'000\n  Ct Correction de valeur IC     40'000"}, {"id": 10, "cat": "Consolidation", "title": "Mise en équivalence (IAS 28 / RPC 30)", "enonce": "Société M détient 30% de Société A.\nCoût d'acquisition : CHF 150'000.\nRésultat de A en année 1 : CHF 80'000.\nDividendes versés par A : CHF 20'000.\n\nCalcule la VC de la participation à la fin de l'année 1.", "fields": [{"label": "Quote-part résultat (CHF)", "answer": 24000, "tolerance": 0}, {"label": "Quote-part dividendes (CHF)", "answer": 6000, "tolerance": 0}, {"label": "VC fin année 1 (CHF)", "answer": 168000, "tolerance": 0}], "correction": "Quote-part résultat = 80'000 × 30% = CHF 24'000 → au P&L\nQuote-part dividendes = 20'000 × 30% = CHF 6'000 → réduit la VC\n\nVC = 150'000 + 24'000 – 6'000 = CHF 168'000\n\n⚠️ Les dividendes ne sont PAS un produit ! Ils réduisent la VC de la participation."}, {"id": 11, "cat": "POC", "title": "Méthode POC (RPC 22 / IFRS 15)", "enonce": "Contrat de construction : prix fixe CHF 1'000'000.\nCoûts totaux estimés : CHF 750'000.\nCoûts engagés à la clôture : CHF 450'000.\n\nCalcule le degré d'avancement, le CA reconnu et le bénéfice reconnu.", "fields": [{"label": "Degré d'avancement (%)", "answer": 60, "tolerance": 0}, {"label": "CA reconnu (CHF)", "answer": 600000, "tolerance": 0}, {"label": "Bénéfice reconnu (CHF)", "answer": 150000, "tolerance": 0}], "correction": "Degré d'avancement = 450'000 / 750'000 = 60%\nCA reconnu = 1'000'000 × 60% = CHF 600'000\nBénéfice reconnu = (1'000'000 – 750'000) × 60% = CHF 150'000\n\nOU : CA 600'000 – Coûts 450'000 = CHF 150'000\n\n⚠️ Si conditions POC non remplies → Completed Contract : bénéfice reconnu uniquement à l'achèvement."}, {"id": 12, "cat": "Impôts différés", "title": "Calcul impôt différé (IAS 12 / RPC 11)", "enonce": "Machine :\n• VC comptable : CHF 400'000\n• Base fiscale : CHF 500'000\n• Taux d'imposition : 20%\n\nS'agit-il d'un DTA ou DTL ? Quel montant ?", "fields": [{"label": "Montant impôt différé (CHF)", "answer": 20000, "tolerance": 0}], "correction": "Différence temporelle = 500'000 – 400'000 = CHF 100'000\n\nVC (400'000) < Base fiscale (500'000)\n→ Différence temporelle DÉDUCTIBLE → DTA\n\nExplication : la charge fiscale future sera moindre (amortissement fiscal encore disponible).\n\nDTA = 100'000 × 20% = CHF 20'000\n\n⚠️ Si VC > Base fiscale → DTL (passif d'impôt différé)."}, {"id": 13, "cat": "Stocks", "title": "Évaluation des stocks (IAS 2 / RPC 17)", "enonce": "Stock de 500 unités :\n• Coût unitaire : CHF 120\n• Prix de vente estimé : CHF 150\n• Coûts de vente estimés : CHF 40/unité\n\nÀ quelle valeur comptabiliser le stock total ?", "fields": [{"label": "VNR unitaire (CHF)", "answer": 110, "tolerance": 0}, {"label": "Valeur totale du stock (CHF)", "answer": 55000, "tolerance": 0}], "correction": "VNR = Prix de vente – Coûts de vente = 150 – 40 = CHF 110\nCoût = CHF 120\n\nPlus bas entre coût et VNR = CHF 110\n\nValeur totale = 500 × 110 = CHF 55'000\nDépréciation = 500 × (120 – 110) = CHF 5'000\n\n⚠️ On déprécie les stocks, on ne les « amortit » pas."}, {"id": 14, "cat": "ECL", "title": "Provision ECL simplifiée (IFRS 9)", "enonce": "Créances clients au 31.12 :\n• 0-30 jours : CHF 500'000 (taux de perte 0,5%)\n• 31-60 jours : CHF 200'000 (taux 2%)\n• 61-90 jours : CHF 80'000 (taux 5%)\n• > 90 jours : CHF 30'000 (taux 20%)\n\nCalcule la provision ECL totale.", "fields": [{"label": "ECL totale (CHF)", "answer": 16500, "tolerance": 0}], "correction": "ECL par tranche :\n• 0-30j : 500'000 × 0,5% = 2'500\n• 31-60j : 200'000 × 2% = 4'000\n• 61-90j : 80'000 × 5% = 4'000\n• >90j : 30'000 × 20% = 6'000\n\nTotal ECL = 2'500 + 4'000 + 4'000 + 6'000 = CHF 16'500\n\n⚠️ Approche simplifiée IFRS 9 pour créances clients = toujours ECL durée de vie (matrice de provisions)."}, {"id": 15, "cat": "TVA", "title": "Impôt sur les acquisitions", "enonce": "Entreprise suisse assujettie reçoit une facture de CHF 10'000 d'un consultant allemand (prestation de conseil, lieu du destinataire).\n\nCalcule l'impôt sur les acquisitions et la TVA nette.", "fields": [{"label": "Impôt sur acquisitions (CHF)", "answer": 810, "tolerance": 0}, {"label": "Impôt préalable déductible (CHF)", "answer": 810, "tolerance": 0}, {"label": "TVA nette due (CHF)", "answer": 0, "tolerance": 0}], "correction": "PS au lieu du destinataire (art. 8 al. 1 LTVA) → Suisse.\nAssujetti → impôt sur les acquisitions dès le 1er franc.\n\nImpôt = 10'000 × 8,1% = CHF 810\nDIP = CHF 810 (si activité donnant droit)\n\nTVA nette = 810 – 810 = CHF 0\n\n⚠️ L'opération est neutre en trésorerie pour un assujetti qui a droit à la DIP complète. Mais il faut quand même DÉCLARER les deux montants dans le décompte."}], "arbres_decision": [{"id": "activer", "title": "Faut-il activer une dépense ?", "color": "#3182ce", "steps": [{"q": "Est-ce un actif corporel avec une durée > 1 exercice ?", "oui": "Activer en IC (IAS 16 / RPC 18). Amortir sur la durée d'utilité.", "non": "Passer à la question suivante ↓"}, {"q": "Est-ce une incorporelle ACQUISE auprès d'un tiers ?", "oui": "Activer (IAS 38 / RPC 10) si profit mesurable sur plusieurs années.", "non": "Passer à la question suivante ↓"}, {"q": "Est-ce une dépense de DÉVELOPPEMENT (pas recherche) ?", "oui": "IFRS : activer si 6 critères cumulatifs. RPC : activer si 4 conditions.", "non": "Passer à la question suivante ↓"}, {"q": "Est-ce un coût d'emprunt sur un actif qualifié ?", "oui": "Incorporer obligatoirement (IAS 23). Activer sous RPC aussi.", "non": "Passer à la question suivante ↓"}, {"q": "Est-ce un coût de démantèlement/restauration obligatoire ?", "oui": "Activer + constituer une provision (IAS 16 + IAS 37).", "non": "EN CHARGES. Exemples : recherche, publicité, formation, constitution, frais admin, réparations courantes."}]}, {"id": "provision", "title": "Faut-il comptabiliser une provision ?", "color": "#805ad5", "steps": [{"q": "Y a-t-il une obligation actuelle (juridique ou implicite) ?", "oui": "Passer à la question suivante ↓", "non": "PAS de provision. Vérifier si passif ÉVENTUEL → mention annexe uniquement."}, {"q": "La sortie de ressources est-elle PROBABLE (> 50%) ?", "oui": "Passer à la question suivante ↓", "non": "Passif ÉVENTUEL → PAS de provision, juste mention en annexe (IAS 37 / RPC 23)."}, {"q": "Le montant peut-il être estimé de manière FIABLE ?", "oui": "COMPTABILISER UNE PROVISION.\n→ Meilleure estimation du montant\n→ Actualiser si effet temps significatif (IAS 37)\n→ Revoir à chaque clôture", "non": "En théorie pas de provision, mais IAS 37 dit que l'estimation est presque toujours possible → provisionner dans le doute."}]}, {"id": "poc", "title": "POC ou Completed Contract ? (RPC 22)", "color": "#dd6b20", "steps": [{"q": "Y a-t-il une base CONTRACTUELLE ?", "oui": "Passer à la question suivante ↓", "non": "→ Completed Contract (ou POC modifiée sans marge)."}, {"q": "La probabilité d'exécution des prestations est-elle ÉLEVÉE ?", "oui": "Passer à la question suivante ↓", "non": "→ Completed Contract."}, {"q": "L'organisation de mandat est-elle APPROPRIÉE ?", "oui": "Passer à la question suivante ↓", "non": "→ Completed Contract."}, {"q": "Les produits, charges et degré d'avancement sont-ils déterminables de manière FIABLE ?", "oui": "✅ MÉTHODE POC → reconnaissance proportionnelle du bénéfice.", "non": "→ Completed Contract ou POC modifiée (sans part de bénéfice)."}]}, {"id": "ifrs9", "title": "Classification d'un actif financier (IFRS 9)", "color": "#38a169", "steps": [{"q": "L'instrument passe-t-il le test SPPI ? (flux = uniquement principal + intérêts)", "oui": "Passer à la question suivante ↓", "non": "→ FVTPL obligatoirement. Pas de choix."}, {"q": "Quel est le business model ?", "oui": "", "non": ""}, {"q": "→ Collecter les flux contractuels uniquement ?", "oui": "→ COÛT AMORTI", "non": "Passer à la question suivante ↓"}, {"q": "→ Collecter ET vendre ?", "oui": "→ FVOCI (recyclable pour instruments de dette)", "non": "→ FVTPL"}, {"q": "⚠️ CAS SPÉCIAL : est-ce une ACTION (instrument de capitaux propres) ?", "oui": "→ FVTPL par défaut. Choix irrévocable possible : FVOCI non recyclable (dividendes en P&L, variations JV en OCI, JAMAIS recyclé).", "non": "Appliquer les règles ci-dessus."}]}, {"id": "opinion", "title": "Quel type d'opinion d'audit ?", "color": "#e11d48", "steps": [{"q": "Les états financiers sont-ils conformes en tous points ?", "oui": "→ OPINION SANS RÉSERVE (clean opinion).", "non": "Passer à la question suivante ↓"}, {"q": "Y a-t-il un DÉSACCORD avec la direction (traitement incorrect) ?", "oui": "Passer à : le désaccord est-il significatif ET généralisé ? ↓↓", "non": "Passer à : y a-t-il une LIMITATION de portée ? ↓"}, {"q": "Y a-t-il une LIMITATION de portée (impossibilité d'obtenir des preuves) ?", "oui": "Passer à : la limitation est-elle significative ET généralisée ? ↓↓", "non": "→ Opinion sans réserve (situation normale)."}, {"q": "Le problème est-il significatif mais PAS généralisé ?", "oui": "→ OPINION AVEC RÉSERVE (qualified). « Sous réserve de... »", "non": "Passer à la question suivante ↓"}, {"q": "Le problème est-il significatif ET généralisé ?", "oui": "Si DÉSACCORD → OPINION DÉFAVORABLE (adverse).\nSi LIMITATION → IMPOSSIBILITÉ d'exprimer une opinion (disclaimer).", "non": "→ Revenir au début de l'analyse."}]}, {"id": "restructuration", "title": "Neutralité fiscale d'une restructuration (art. 19/61 LIFD)", "color": "#7c3aed", "steps": [{"q": "L'opération est-elle une fusion, scission, transformation ou transfert d'exploitation ?", "oui": "Passer à la question suivante ↓", "non": "→ PAS de neutralité fiscale. Imposition ordinaire."}, {"q": "Les éléments sont-ils repris à la VALEUR COMPTABLE (pas valeur vénale) ?", "oui": "Passer à la question suivante ↓", "non": "→ PAS de neutralité fiscale. Réalisation des réserves latentes → imposable."}, {"q": "L'assujettissement fiscal en SUISSE est-il maintenu ?", "oui": "Passer à la question suivante ↓", "non": "→ PAS de neutralité fiscale. Imposition de sortie."}, {"q": "Pour une scission : s'agit-il du transfert d'une EXPLOITATION (pas d'actifs isolés) ?", "oui": "Passer à la question suivante ↓", "non": "→ PAS de neutralité fiscale pour une scission d'actifs isolés."}, {"q": "Le délai d'attente de 5 ANS sera-t-il respecté (pas de revente) ?", "oui": "✅ NEUTRALITÉ FISCALE accordée (art. 19 ou 61 LIFD).", "non": "→ Rappel d'impôt possible. Les réserves latentes transférées deviennent imposables."}]}], "restructuration": [{"cat": "🔄 Fusion (LFus art. 3-28)", "items": [{"t": "Définition", "c": "Réunion de deux ou plusieurs sociétés en une seule. Succession UNIVERSELLE (tous les actifs et passifs transférés de plein droit)."}, {"t": "Fusion par absorption", "c": "Société A absorbe Société B → B est dissoute SANS liquidation. Les actionnaires de B reçoivent des parts/actions de A (+ soulte éventuelle)."}, {"t": "Fusion par combinaison", "c": "A et B sont dissoutes → création d'une nouvelle Société C. Plus rare en pratique."}, {"t": "Soulte", "c": "Compensation en espèces limitée à 10% de la valeur nominale des parts attribuées (art. 7 al. 2 LFus).\n⚠️ Soulte > 10% → fusion INVALIDE."}, {"t": "Rapport de fusion", "c": "Le CA rédige un rapport de fusion écrit expliquant le rapport d'échange. Vérification par un réviseur agréé (sauf renonciation unanime PME)."}, {"t": "Protection des créanciers", "c": "Publication 3× dans la FOSC. Les créanciers peuvent exiger des sûretés dans les 3 mois."}, {"t": "Responsabilité solidaire", "c": "Les associés de la société transférante restent solidairement responsables pendant 3 ANS."}]}, {"cat": "✂️ Scission (LFus art. 29-52)", "items": [{"t": "Scission par division (totale)", "c": "A se divise en B et C. A est dissoute."}, {"t": "Scission par séparation (partielle)", "c": "A transfère une partie de son patrimoine à B (existante ou nouvelle). A subsiste."}, {"t": "Scission asymétrique", "c": "Les parts ne sont pas attribuées proportionnellement → certains actionnaires vont dans B, d'autres restent dans A."}, {"t": "Condition fiscale clé", "c": "Pour la neutralité fiscale (art. 61 al. 1 let. b LIFD) : il faut transférer une EXPLOITATION entière, pas des actifs isolés.\n⚠️ Actifs isolés = imposable ! C'est LE piège fiscal de la scission."}]}, {"cat": "🔁 Transformation (LFus art. 53-68)", "items": [{"t": "Définition", "c": "Changement de forme juridique SANS dissolution ni liquidation."}, {"t": "Transformations autorisées", "c": "SA → Sàrl ✓ | Sàrl → SA ✓ | SNC → SA/Sàrl ✓\n⚠️ Une SA ne peut PAS se transformer en société de personnes (SNC)."}, {"t": "Cas RI → SA (art. 19 al. 1 let. b LIFD)", "c": "Fiscalement neutre si :\n→ Exploitation ENTIÈRE transférée\n→ Valeur COMPTABLE maintenue\n→ Assujettissement CH maintenu\n→ Délai 5 ANS respecté"}, {"t": "⚠️ Piège : immeuble dans la RI", "c": "Si l'immeuble est transféré dans la fortune PRIVÉE au lieu de la SA → IMPOSABLE (réalisation des réserves latentes)."}]}, {"cat": "💀 Liquidation (CO art. 736 ss)", "items": [{"t": "5 causes de dissolution (art. 736 CO)", "c": "① Selon les statuts\n② Décision AG (forme authentique)\n③ Ouverture de la faillite\n④ Décision judiciaire (justes motifs)\n⑤ Autres causes légales"}, {"t": "Procédure", "c": "① Décision de dissolution → inscription RC\n② Nomination liquidateur(s)\n③ Publication 3× FOSC (appel aux créanciers)\n④ Réalisation des actifs, paiement des dettes\n⑤ Établissement du bilan de liquidation\n⑥ Répartition du solde aux actionnaires\n⑦ Radiation au RC"}, {"t": "Délai de répartition", "c": "1 AN après le 3e appel aux créanciers.\nException : 3 MOIS si attestation d'un réviseur agréé confirmant que les dettes sont éteintes."}, {"t": "Impôt anticipé (IA)", "c": "L'excédent de liquidation = soumis à IA de 35% (art. 5 al. 1 let. a LIA).\nExcédent = actifs distribués – capital nominal.\n⚠️ Les remboursements de capital nominal (RAC) ne sont PAS soumis à l'IA."}]}, {"cat": "⚖️ Aspects fiscaux — Récapitulatif", "items": [{"t": "Art. 19 LIFD (personnes physiques)", "c": "Neutralité pour : transfert d'exploitation RI → PM, quasi-fusion, scission.\nConditions : valeur comptable, Suisse, exploitation, 5 ans."}, {"t": "Art. 61 LIFD (personnes morales)", "c": "Neutralité pour : fusion, scission, transformation, transfert d'exploitation entre PM.\nMêmes conditions + soulte ≤ 10%."}, {"t": "Délai d'attente 5 ans", "c": "Si les éléments transférés sont aliénés dans les 5 ans → rappel d'impôt sur les réserves latentes transférées."}, {"t": "TVA (art. 38 LTVA)", "c": "Procédure de déclaration (pas de décompte TVA) si :\n→ Les DEUX parties sont assujetties\n→ Formulaire 764 de l'AFC"}, {"t": "Impôt anticipé", "c": "Fusion : pas de distribution → pas d'IA en principe.\nLiquidation : excédent soumis à 35% IA.\nScission : attention si distribution dissimulée."}, {"t": "Imposition privilégiée art. 37b LIFD", "c": "Pour les indépendants qui cessent leur activité :\n→ 55 ans OU invalidité\n→ Cessation DÉFINITIVE\n→ Bénéfices de liquidation imposés SÉPARÉMENT à un taux réduit"}]}, {"cat": "📊 Tableau — Neutralité fiscale", "items": [{"t": "RI → SA/Sàrl", "c": "Base : Art. 19 al. 1 let. b LIFD\nConditions : exploitation entière, valeur comptable, Suisse, 5 ans\n⚠️ Immeuble en fortune privée = imposable"}, {"t": "SA fusionne SA", "c": "Base : Art. 61 al. 1 let. a LIFD + LFus\nConditions : valeur comptable, Suisse, soulte ≤ 10%\n⚠️ Soulte > 10% = fusion invalide"}, {"t": "Scission SA", "c": "Base : Art. 61 al. 1 let. b LIFD\nConditions : exploitation (pas actifs isolés), 5 ans\n⚠️ Actifs isolés = imposable"}, {"t": "Quasi-fusion", "c": "Base : Art. 61 al. 1 let. c LIFD\nÉchange d'actions → B devient filiale 100% de A\n⚠️ Pas de succession universelle (pas LFus au sens strict)"}, {"t": "Transfert d'exploitation", "c": "Base : Art. 61 al. 3 LIFD\nExploitation complète, valeur comptable, Suisse, 5 ans"}]}], "terrain": [{"cat": "🎒 Avant le premier jour", "items": [{"t": "Documents à préparer", "c": "→ Pièce d'identité + permis de travail\n→ Diplômes + certificats (originaux)\n→ Extrait casier judiciaire (souvent demandé)\n→ Coordonnées bancaires pour le salaire\n→ Numéro AVS"}, {"t": "Installer sur ton laptop", "c": "→ Microsoft Office (surtout Excel, Word, Outlook)\n→ VPN du cabinet\n→ Teams / Skype for Business\n→ Adobe Acrobat\n→ TeamMate+ (outil d'audit EY — formation prévue)\n→ SAP accès viewer (si clients SAP)"}, {"t": "Dress code Big 4 Suisse", "c": "En MISSION chez le client :\n→ Business formal (costume/tailleur, cravate optionnelle)\n→ Chaussures de ville propres\n\nAu BUREAU :\n→ Smart casual (chino + chemise, pas de baskets)\n\n⚠️ Adapte-toi au client : banque = formel. Start-up = plus relax.\nEn cas de doute → overdressed plutôt que underdressed."}]}, {"cat": "🏢 Hiérarchie EY", "items": [{"t": "Structure type", "c": "PARTNER (Associé) → signe le rapport, relation client\nSENIOR MANAGER / DIRECTOR → supervision, revue qualité\nMANAGER → planification, budget, revue des WP\nSENIOR (Chef de mission) → terrain, coaching junior, revue 1ère ligne\nSTAFF / JUNIOR (toi) → exécution des tests, documentation"}, {"t": "Qui est ton interlocuteur ?", "c": "Au quotidien → le SENIOR (ton coach terrain)\nPour les questions techniques → le MANAGER\nPour ta carrière / évaluation → le COUNSELOR (mentor attitré)\n\n⚠️ Ne bypasse JAMAIS la hiérarchie. Question → d'abord au senior, puis escalade si besoin."}, {"t": "Évaluation de performance", "c": "→ Feedback après CHAQUE mission (engagement review)\n→ Évaluation annuelle (year-end review)\n→ Critères : qualité technique, respect des deadlines, communication, initiative\n→ Les premières missions comptent BEAUCOUP pour ta réputation"}]}, {"cat": "🛠️ Outils du junior", "items": [{"t": "TeamMate+ (EY Canvas)", "c": "= Outil de documentation d'audit électronique\n→ Structure le dossier de travail\n→ Chaque WP est lié à un risque / assertion\n→ Sign-off électronique (preparer + reviewer)\n→ Archive automatique du dossier\n\n⚠️ TOUT doit être dans TeamMate. Un WP hors outil = n'existe pas."}, {"t": "Excel — Les MUST du junior", "c": "Fonctions critiques e : avancement + blocages"}]}, {"cat": "⚠️ 13 erreurs du junior à éviter", "items": [{"t": "1. Ne pas comprendre POURQUOI on fait le test", "c": "Chaque test répond à un RISQUE et une ASSERTION. Si tu ne sais pas pourquoi → demande."}, {"t": "2. Copier-coller le WP de l'année passée sans réfléchir", "c": "Les montants changent, les risques évoluent. ADAPTE chaque année."}, {"t": "3. Oublier de documenter", "c": "« Si ce n'est pas documenté, ce n'est pas fait. » Pas de shortcut."}, {"t": "4. Ne pas tester le CUT-OFF", "c": "Toujours vérifier les dernières transactions avant/après la clôture."}, {"t": "5. Accepter les explications du client sans vérifier", "c": "Scepticisme professionnel ≠ méfiance. Mais vérifie TOUJOURS avec un document."}, {"t": "6. Travailler en silo", "c": "Communique avec l'équipe. Un problème sur les créances peut impacter les produits."}, {"t": "7. Attendre la dernière minute pour remonter un problème", "c": "Dès que tu vois une anomalie → informe le senior. Pas la veille du rapport."}, {"t": "8. Mal gérer son temps", "c": "Si un test prend plus longtemps que prévu → signale-le. Le budget existe pour une raison."}, {"t": "9. Ne pas numéroter / référencer ses WP", "c": "Chaque feuille a un numéro. Chaque montant renvoie à une source. Cross-referencing = vital."}, {"t": "10. Accepter un cadeau du client", "c": "Même un café offert → réfléchis. En principe, petits gestes OK. Invitations / cadeaux significatifs = REFUSER."}, {"t": "11. Parler du client à l'extérieur", "c": "Secret professionnel ABSOLU. Pas dans le train, pas au restaurant, pas sur les réseaux."}, {"t": "12. Ne pas prendre de notes pendant les réunions", "c": "Tu oublieras. Note TOUT. Tes notes peuvent servir de preuve d'audit."}, {"t": "13. Avoir peur de poser des questions", "c": "Un junior qui demande = un junior qui apprend. Un junior qui se tait et fait faux = un problème."}]}, {"cat": "💡 Tips pour impressionner", "items": [{"t": "Montre de l'initiative", "c": "→ Propose des améliorations aux templates\n→ Identifie des anomalies que personne n'avait vues\n→ Prépare un résumé synthétique de tes findings"}, {"t": "Comprends le business du client", "c": "→ Lis le rapport annuel AVANT d'arriver\n→ Pose des questions intelligentes sur l'activité\n→ Fais le lien entre les risques business et les risques d'anomalie"}, {"t": "Sois fiable sur les deadlines", "c": "→ Si tu promets un WP pour vendredi → livre-le vendredi\n→ Mieux vaut sous-promettre et sur-livrer\n→ Communique PROACTIVEMENT si tu vas être en retard"}, {"t": "Networking interne", "c": "→ Participe aux events du bureau (apéros, formations)\n→ Fais-toi connaître auprès de différents managers\n→ Demande du feedback après chaque mission"}]}], "seuils_regime": {"intro": "Le régime de révision ne dépend pas QUE des seuils : opting-out, droit des 10%, opting-in volontaire et forme juridique entrent en jeu. Vue d'ensemble (CO 727–727a, 906 ; CC 69b, 83b).", "ordinaire": {"titre": "Contrôle ORDINAIRE", "sous": "Obligatoire dès qu'UN de ces cas est rempli", "ref": "art. 727 CO", "triggers": [{"t": "Société ouverte au public", "d": "Actions cotées en bourse · **ou** emprunts par obligations en cours · **ou** contribue pour ≥ 20 % aux actifs ou au CA des comptes consolidés d'une telle société.", "ref": "727 al.1 ch.1"}, {"t": "Dépassement de seuils", "d": "**2 des 3** valeurs dépassées durant **2 exercices** successifs : total bilan **20 mio** · CA **40 mio** · **250 EPT** (moyenne annuelle).", "ref": "727 al.1 ch.2", "mnemo": "20-40-250"}, {"t": "Comptes de groupe", "d": "Société tenue d'établir des **comptes consolidés**.", "ref": "727 al.1 ch.3"}, {"t": "Droit des 10 % (minorité)", "d": "Des actionnaires représentant ensemble **≥ 10 % du capital-actions** peuvent **exiger** un contrôle ordinaire — même si aucun seuil n'est atteint.", "ref": "727 al.2", "mnemo": "10 %"}, {"t": "Opting-up (statuts / AG)", "d": "À défaut d'obligation légale, le contrôle ordinaire peut être **prévu par les statuts** ou **décidé par l'assemblée générale**.", "ref": "727 al.3"}]}, "restreint": {"titre": "Contrôle RESTREINT (review)", "sous": "Régime par défaut si le contrôle ordinaire n'est pas requis", "ref": "art. 727a al.1 CO", "points": ["Assurance **négative** (« nous n'avons pas relevé d'éléments… ») — pas une opinion positive.", "Travaux : **interrogations + procédures analytiques**, contrôles détaillés au besoin (≠ ISA complet).", "Indépendance allégée (CO 729) : l'organe peut tenir la compta / aider, mais pas décider."]}, "opting_out": {"titre": "OPTING-OUT — renoncer à TOUTE révision", "ref": "art. 727a al.2 CO", "conditions": ["La société **n'est pas** soumise au contrôle ordinaire.", "**≤ 10 EPT** en moyenne annuelle.", "**Consentement de TOUS** les actionnaires (unanimité)."], "notes": ["La renonciation **reste valable** pour les exercices suivants (pas à reconfirmer chaque année).", "Le CA peut requérir le consentement **par écrit** : délai de 20 jours, le **silence vaut consentement**.", "Chaque actionnaire peut **exiger le rétablissement** d'un contrôle restreint au plus tard **10 jours avant l'AG**.", "⚠️ À ne pas confondre : opting-**OUT** = renoncer · opting-**IN / UP** = imposer un contrôle (plus élevé)."], "mnemo": "U-10-T"}, "formes": [{"forme": "🏢 SA", "regle": "Régime ci-dessus (référence).", "ref": "727 ss CO"}, {"forme": "🏬 Sàrl", "regle": "Dispositions de la SA **par analogie** (même régime, mêmes seuils, opting-out possible).", "ref": "818 al.1 CO"}, {"forme": "🤝 Coopérative", "regle": "Dispositions SA **par analogie**. Contrôle ordinaire **exigible** par : 10 % des coopérateurs · coopérateurs à **responsabilité personnelle** ou tenus à des **versements supplémentaires** · coopérateurs représentant **≥ 10 % du capital social**.", "ref": "906 CO"}, {"forme": "👥 Association", "regle": "Contrôle **ordinaire** si 2/3 seuils sur 2 ans : bilan **10 mio** · CA **20 mio** · **50 EPT**. Contrôle **restreint** si un membre à responsabilité personnelle ou ten <script type="text/babel" data-type="module" data-presets="react">
import React from "react";
import { useState, useEffect, useMemo } from "react";
import { createRoot } from "react-dom/client";
import { BookOpen, GraduationCap, FileText, Languages, Ruler, Network, Calculator, GitBranch, Recycle, ClipboardCheck, Search, ChevronDown, RotateCcw, Check } from "lucide-react";

/* ============================================================
   Références — app React (même template que Conso / Audit / Podcasts).
   Données inlinées par build_references.py dans window.__REFS__
   (= data/references.json complet : 12 collections).

   Restaure les 4 sections qui n'étaient plus routées (Leçons, Mémos,
   Consolidation, Restructuration) en plus des 5 existantes, et
   persiste la progression des checklists Terrain (localStorage).

   Cross-références : les codes de normes (RPC 16, IAS 36, art. 727 CO…)
   restent cliquables → popover avec saut interne (Mémos / Leçons) ou
   postMessage au parent (Flashcards liées).
   ============================================================ */

const R_DATA = (typeof window !== "undefined" && window.__REFS__) || {};
const R_LS = "swisscpa_refs_v1";

function rLoad() { try { return JSON.parse(localStorage.getItem(R_LS) || "{}") || {}; } catch (e) { return {}; } }
function rSave(st) { try { localStorage.setItem(R_LS, JSON.stringify(st)); } catch (e) {} }

/* ── Couleurs par catégorie (port fidèle de app.js getColor) ── */
const R_COLORS = {
  "Swiss GAAP RPC": { accent: "#3182ce" }, "IFRS / IAS": { accent: "#38a169" },
  "Audit / ISA": { accent: "#805ad5" }, "Fiscalité": { accent: "#dd6b20" },
  "CO": { accent: "#b45309" }, "Consolidation": { accent: "#3b82f6" },
  "Restructuration": { accent: "#10b981" }, "Droit": { accent: "#9333ea" },
  "TVA": { accent: "#ca8a04" }, "IT": { accent: "#06b6d4" },
};
const rColor = (cat) => (R_COLORS[cat] || { accent: "#64748b" }).accent;
/* Les catégories de données embarquent souvent un emoji ("📏 Seuils CO — Révision") :
   on hash la chaîne vers une couleur stable si pas de correspondance exacte. */
const R_PALETTE = ["#3182ce", "#38a169", "#805ad5", "#dd6b20", "#b45309", "#3b82f6", "#10b981", "#9333ea", "#ca8a04", "#06b6d4", "#e11d48", "#0d9488"];
function rCatColor(cat) {
  if (R_COLORS[cat]) return R_COLORS[cat].accent;
  let h = 0; const s = String(cat || "");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return R_PALETTE[h % R_PALETTE.length];
}

/* ── Formatage texte (port fidèle de crossref.js formatAnswer) ── */
function rEsc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
const NORM_PATTERNS = [
  /\b(RPC\s*\d+(?:\/\d+)?)\b/gi, /\b(IAS\s*\d+)\b/gi, /\b(IFRS\s*\d+)\b/gi, /\b(ISA\s*\d+)\b/gi,
  /\b(art\.?\s*\d+(?:\s*(?:al\.?\s*\d+)?)?(?:\s*CO)?)\b/gi,
  /\b(art\.?\s*\d+\s*LIFD)\b/gi, /\b(art\.?\s*\d+\s*LTVA)\b/gi, /\b(art\.?\s*\d+\s*LFus)\b/gi,
];
function normalizeNormId(ref) { return ref.toLowerCase().replace(/\s+/g, "").replace(/art\.?/g, "art").replace(/al\.?/g, "al"); }
function addCrossRefs(text) {
  if (!text) return "";
  let html = rEsc(text);
  for (const pattern of NORM_PATTERNS) {
    html = html.replace(pattern, (match) =>
      '<span class="cross-ref" data-norm="' + rEsc(normalizeNormId(match)) + '" data-label="' + rEsc(match) + '">' + match + "</span>");
  }
  return html;
}
function formatLine(line) {
  let html = addCrossRefs(line);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  if (html.includes("⚠️")) html = '<span style="color:#b45309">' + html + "</span>";
  if (html.includes("💡")) html = '<span style="color:#15803d">' + html + "</span>";
  if (/^[①②③④⑤⑥⑦⑧⑨⑩🅰🅱🅲]/.test(html.trim())) html = '<span style="color:#2563eb">' + html + "</span>";
  return html;
}
function renderPipeTable(lines) {
  const rows = lines.filter((l) => !l.match(/^\s*\|[-: |]+\|\s*$/));
  if (!rows.length) return "";
  let html = '<div style="overflow-x:auto;margin:8px 0"><table style="border-collapse:collapse;width:100%;font-size:12px">';
  rows.forEach((row, ri) => {
    const cells = row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|");
    const tag = ri === 0 ? "th" : "td";
    const style = ri === 0
      ? "background:#eef2ff;color:#4338ca;font-weight:600;padding:6px 10px;border:1px solid #e0e7ff;text-align:left;white-space:nowrap"
      : "padding:5px 10px;border:1px solid #e2e8f0;color:#334155;vertical-align:top";
    html += "<tr>" + cells.map((c) => "<" + tag + ' style="' + style + '">' + formatLine(c.trim()) + "</" + tag + ">").join("") + "</tr>";
  });
  return html + "</table></div>";
}
function formatLines(text) {
  const lines = String(text).split("\n");
  let result = "", i = 0;
  while (i < lines.length) {
    if (lines[i].trim().startsWith("|")) {
      const tbl = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { tbl.push(lines[i]); i++; }
      result += renderPipeTable(tbl);
      continue;
    }
    if (lines[i].trim() === "" && result.endsWith("<br>")) { i++; continue; }
    result += formatLine(lines[i]) + "<br>";
    i++;
  }
  return result.replace(/<br>$/, "");
}
function formatAnswer(text) {
  if (!text) return "";
  if (String(text).includes("```")) {
    return String(text).split("```").map((part, i) => {
      if (i % 2 === 1) {
        let content = part;
        const nl = content.indexOf("\n");
        if (nl !== -1) {
          const hint = content.substring(0, nl).trim();
          if (!hint || /^[a-z]*$/.test(hint)) content = content.substring(nl + 1);
        }
        return '<pre style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px 14px;font-family:Consolas,monospace;font-size:11.5px;overflow-x:auto;line-height:1.55;margin:6px 0;color:#475569;white-space:pre">'
          + content.trim().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</pre>";
      }
      return formatLines(part);
    }).join("");
  }
  return formatLines(text);
}
/* Bloc de texte formaté ; les .cross-ref sont gérés par délégation dans App. */
function Fmt({ text, className }) {
  return <div className={className || "text-[13.5px] leading-relaxed text-slate-600"} dangerouslySetInnerHTML={{ __html: formatAnswer(text) }} />;
}

const rNorm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

/* ── Petits composants partagés ── */
function RChip({ active, color, onClick, children }) {
  return (
    <button onClick={onClick}
      className={"px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors " +
        (active ? "text-white" : "bg-white text-slate-600 hover:text-slate-900 border-slate-300")}
      style={active ? { background: color || "#4f46e5", borderColor: color || "#4f46e5" } : {}}>
      {children}
    </button>
  );
}
function RSearch({ value, onChange, placeholder }) {
  return (
    <div className="relative flex-1 max-w-md">
      <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
        className="w-full bg-white border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:border-indigo-500 outline-none" />
    </div>
  );
}
function RExpandable({ title, accent, children, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div className="border-t border-slate-100">
      <button onClick={() => setOpen(!open)}
        className="w-full flex items-center justify-between gap-3 px-4 py-2.5 text-left hover:bg-slate-50 transition-colors">
        <span className="text-sm font-medium text-slate-700">{title}</span>
        <ChevronDown size={15} className={"text-slate-400 shrink-0 transition-transform " + (open ? "rotate-180" : "")} />
      </button>
      {open && <div className="px-4 pb-3">{children}</div>}
    </div>
  );
}

/* ════════ Sections ════════ */

/* 1. Leçons (courses_ifrs / courses_rpc) — restaurées */
function CoursesSection() {
  const [tab, setTab] = useState("ifrs");
  const list = (tab === "ifrs" ? R_DATA.courses_ifrs : R_DATA.courses_rpc) || [];

  return (
    <div>
      <div className="flex gap-2 mb-4">

      </div>
      <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3 items-start">
        {list.map((course, ci) => (
          <div key={tab + ci} className="bg-white rounded-xl border border-slate-200 p-4" style={{ borderLeft: "3px solid " + accent }}>
            <div className="font-semibold text-[15px] text-slate-800 leading-snug">{course.title}</div>
            {course.subtitle && <div className="text-xs text-slate-500 mt-0.5">{course.subtitle}</div>}

/* 2. Mémos (memo_co / memo_rpc / memo_ifrs) — restaurés */
function MemosSection({ initialQuery }) {
  const [tab, setTab] = useState("ifrs");
  const [q, setQ] = useState(initialQuery || "");
  useEffect(() => { if (initialQuery) setQ(initialQuery); }, [initialQuery]);
  const SETS = {
    co: { label: "CO (droit comptable)", data: R_DATA.memo_co || [], color: rColor("CO") },
    rpc: { label: "Swiss GAAP RPC", data: R_DATA.memo_rpc || [], color: rColor("Swiss GAAP RPC") },
    ifrs: { label: "IFRS / IAS", data: R_DATA.memo_ifrs || [], color: rColor("IFRS / IAS") },
  };
  const cur = SETS[tab];
  const nq = rNorm(q.trim());
  const filtered = cur.data
    .map((m) => {
      if (!nq) return m;
      const inNorm = rNorm(m.norm).includes(nq);
      const items = (m.items || []).filter((it) => inNorm || rNorm(it.t + " " + it.c).includes(nq));
      return items.length ? { ...m, items } : null;
    })
    .filter(Boolean);
  return (
    <div>
      <div className="flex gap-2 mb-3 flex-wrap items-center">
        {Object.entries(SETS).map(([k, s]) => (
          <RChip key={k} active={tab === k} color={s.color} onClick={() => setTab(k)}>{s.label} ({s.data.length})</RChip>
        ))}
        <div className="ml-auto"><RSearch value={q} onChange={setQ} placeholder="Filtrer les mémos (norme, mot-clé)…" /></div>
      </div>
      {filtered.length === 0 && <div className="text-center py-10 text-slate-400 text-sm">Aucun mémo ne correspond.</div>}
      <div className="lg:columns-2 gap-3">
        {filtered.map((m, mi) => (
          <div key={tab + mi + (m.norm || "")} className="bg-white rounded-xl border border-slate-200 mb-3 overflow-hidden break-inside-avoid" style={{ borderLeft: "3px solid " + cur.color }}>
            <div className="px-4 py-3 font-semibold text-[14px]" style={{ color: cur.color }}>{m.norm}</div>
            {(m.items || []).map((it, ii) => (
              <RExpandable key={ii} title={it.t} accent={cur.color} defaultOpen={!!nq}><Fmt text={it.c} /></RExpandable>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

/* 4. Seuils — bandeau réflexes + régimes + recherche + cartes à valeur colorée */
function SeuilsSection() {
  const sections = R_DATA.seuils || [];
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();
  const stripLabel = (s) => String(s || "").replace(/\s*\((?:art|RPC|LIFD|LTVA)[^)]*\)\s*$/i, "").trim();
  const starred = [];
  sections.forEach((sec) => (sec.items || []).forEach((it) => { if (it.star) starred.push({ ...it, _col: rCatColor(sec.cat) }); }));
  const match = (it) => !query || ((it.label || "") + " " + (it.val || "") + " " + (it.extra || "") + " " + (it.mnemo || "")).toLowerCase().includes(query);
  const anyHit = sections.some((s) => (s.items || []).some(match));

  return (
    <div>
      {!query && starred.length > 0 && (
        <div className="mb-6">
          <div className="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2.5">⭐ Réflexes chiffrés à connaître par cœur</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
            {starred.map((it, i) => (
              <div key={i} className="rounded-2xl border bg-white p-3.5 shadow-sm" style={{ borderColor: it._col + "33" }}>
                <div className="text-[17px] font-extrabold leading-none" style={{ color: it._col }}>{it.mnemo || it.val}</div>
                <div className="text-[11px] text-slate-500 leading-snug mt-1.5">{stripLabel(it.label)}</div>
                {it.mnemo && <div className="text-[10px] text-slate-400 mt-1 leading-snug">{it.val}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {!query && <RegimeRevision />}

      <div className="mb-4 max-w-md"><RSearch value={q} onChange={setQ} placeholder="Rechercher un seuil (TVA, capital, prescription, matérialité…)" /></div>

      <div className="lg:columns-2 gap-3">
        {sections.map((section, si) => {
          const col = rCatColor(section.cat);
          const items = (section.items || []).filter(match);
          if (!items.length) return null;
          return (
            <div key={si} className="bg-white rounded-2xl border border-slate-200 mb-3 overflow-hidden break-inside-avoid shadow-sm">
              <div className="flex items-center gap-2 px-4 py-3 border-b border-slate-100" style={{ background: col + "0e" }}>
                <span className="font-bold text-sm" style={{ color: col }}>{section.cat}</span>
                <span className="ml-auto text-[11px] font-medium text-slate-400">{items.length}</span>
              </div>
              <div className="divide-y divide-slate-50">
                {items.map((item, ii) => {
                  const piege = /⚠️/.test(item.extra || "");
                  return (
                    <div key={ii} className="px-4 py-3">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-[13.5px] font-semibold text-slate-800 leading-snug">{item.star ? "⭐ " : ""}{item.label}</span>
                        {item.mnemo && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded" style={{ background: col + "16", color: col }}>🧠 {item.mnemo}</span>}
                      </div>
                      <div className="text-[13.5px] font-bold mt-1 leading-snug" style={{ color: col }}>{item.val}</div>
                      {item.extra && (
                        <div className={"text-xs mt-1.5 leading-relaxed " + (piege ? "text-amber-800 bg-amber-50 border border-amber-100 rounded-lg px-2.5 py-1.5" : "text-slate-400")}>{item.extra}</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      {query && !anyHit && <div className="text-sm text-slate-400 text-center py-8">Aucun seuil ne correspond à « {q} ».</div>}
    </div>
  );
}

/* 6. Cas chiffrés — exercices interactifs */
function CasSection() {
  const exercises = R_DATA.cas_chiffres || [];
  const [st, setSt] = useState({});   // {ei: {checked, answers:{fi:val}}}
  const get = (ei) => st[ei] || { checked: false, answers: {} };
  const upd = (ei, patch) => setSt((p) => ({ ...p, [ei]: { ...get(ei), ...patch } }));
  return (
    <div className="max-w-3xl mx-auto">
      {exercises.map((ex, ei) => {
        const col = rCatColor(ex.cat || "Audit / ISA");
        const state = get(ei);
        return (
          <div key={ei} className="bg-white rounded-xl border border-slate-200 mb-4 p-4" style={{ borderLeft: "3px solid " + col }}>
            <div className="font-semibold text-[15px] text-slate-800">{ex.title}</div>
            <div className="text-xs font-medium mb-2" style={{ color: col }}>{ex.cat || ""}</div>
            <Fmt text={ex.enonce} className="text-sm leading-relaxed text-slate-600 mb-4" />
            <div className="flex flex-col gap-3">
              {(ex.fields || []).map((field, fi) => {
                const userVal = state.answers[fi] || "";
                let verdict = null;
                if (state.checked) {
                  const expected = parseFloat(String(field.answer).replace(/['\s]/g, ""));
                  const got = parseFloat(String(userVal).replace(/['\s]/g, ""));
                  const tol = field.tolerance || 0;
                  verdict = !isNaN(got) && Math.abs(got - expected) <= tol;
                }
                return (
                  <div key={fi}>
                    <label className="block text-xs text-slate-500 mb-1">{field.label}</label>
                    <input type="text" value={userVal} disabled={state.checked} placeholder="Ta réponse"
                      onChange={(e) => upd(ei, { answers: { ...state.answers, [fi]: e.target.value } })}
                      className="w-full max-w-xs bg-white border border-slate-300 rounded-md px-3 py-2 text-sm focus:border-indigo-500 outline-none disabled:bg-slate-50 disabled:text-slate-500" />
                    {verdict !== null && (
                      <div className={"mt-1.5 inline-block text-xs px-2.5 py-1 rounded-md font-medium " + (verdict ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-red-50 text-red-700 border border-red-200")}>
                        {verdict ? "✓ Correct" : "✗ Réponse attendue : " + field.answer}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="mt-4 flex gap-2">
              {!state.checked
                ? <button onClick={() => upd(ei, { checked: true })} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-500">Vérifier</button>
                : <button onClick={() => upd(ei, { checked: false, answers: {} })} className="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 text-sm font-medium hover:bg-slate-50"><RotateCcw size={13} className="inline -mt-0.5 mr-1" />Recommencer</button>}
            </div>
            {state.checked && ex.correction && (
              <div className="mt-4 bg-slate-50 border border-slate-200 rounded-lg p-3.5">
                <div className="text-xs font-semibold text-amber-600 mb-2">Correction</div>
                <Fmt text={ex.correction} />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* 7. Arbres de décision */
function ArbresSection() {
  const trees = R_DATA.arbres_decision || [];
  const [st, setSt] = useState({});   // {ti: null | stepIdx | 'result:...'}
  return (
    <div className="grid lg:grid-cols-2 gap-4 items-start">
      {trees.map((tree, ti) => {
        const color = tree.color || "#3b82f6";
        const state = st[ti] === undefined ? null : st[ti];
        const steps = tree.steps || [];
        let body;
        if (state === null) {
          body = (
            <div className="text-center py-6">
              <button onClick={() => setSt((p) => ({ ...p, [ti]: 0 }))}
                className="px-5 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-500">Commencer</button>
            </div>
          );
        } else if (typeof state === "string" && state.startsWith("result:")) {
          body = (
            <div className="p-4 text-center">
              <div className="text-xs font-semibold text-amber-600 mb-2 uppercase tracking-wide">Résultat</div>
              <div className="bg-slate-50 rounded-lg p-3.5 text-left" style={{ border: "1px solid " + color + "40" }}>
                <Fmt text={state.substring(7)} className="text-sm leading-relaxed text-slate-700" />
              </div>
              <button onClick={() => setSt((p) => ({ ...p, [ti]: null }))}
                className="mt-4 px-4 py-2 rounded-lg border border-slate-300 text-slate-600 text-sm hover:bg-slate-50"><RotateCcw size={13} className="inline -mt-0.5 mr-1" />Recommencer</button>
            </div>
          );
        } else {
          const step = steps[state];
          const answer = (choice) => {
            const next = choice === "oui" ? step.oui : step.non;
            setSt((p) => ({ ...p, [ti]: (typeof next === "number" && steps[next]) ? next : "result:" + (typeof next === "string" ? next : "Fin du parcours.") }));
          };
          body = step ? (
            <div className="p-4 text-center">
              <div className="text-xs text-slate-400 mb-2">Étape {state + 1} / {steps.length}</div>
              <div className="bg-slate-50 rounded-lg p-3.5 mb-4 text-left"><Fmt text={step.q} className="text-sm leading-relaxed text-slate-700" /></div>
              <div className="flex gap-3 justify-center">
                <button onClick={() => answer("oui")} className="min-w-[100px] px-4 py-2 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-300 text-sm font-semibold hover:bg-emerald-100">Oui</button>
                <button onClick={() => answer("non")} className="min-w-[100px] px-4 py-2 rounded-lg bg-red-50 text-red-700 border border-red-300 text-sm font-semibold hover:bg-red-100">Non</button>
              </div>
            </div>
          ) : null;
        }
        return (
          <div key={ti} className="bg-white rounded-xl border border-slate-200 overflow-hidden" style={{ borderLeft: "3px solid " + color }}>
            <div className="px-4 py-3 font-semibold text-[15px] text-slate-800 border-b border-slate-100">{tree.title}</div>
            {body}
          </div>
        );
      })}
    </div>
  );
}

/* 9. Terrain EY — checklists avec progression PERSISTÉE */
function TerrainSection({ checked, onToggle }) {
  const sections = R_DATA.terrain || [];
  let total = 0, done = 0;
  sections.forEach((s, si) => (s.items || []).forEach((_, ii) => { total++; if (checked[si + "-" + ii]) done++; }));
  const pct = total ? Math.round((100 * done) / total) : 0;
  return (
    <div>
      <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4">
        <div className="flex justify-between items-center mb-2">
          <span className="text-sm text-slate-500">Progression (sauvegardée)</span>
          <span className="text-sm font-semibold text-amber-600">{done} / {total} ({pct}%)</span>
        </div>
        <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full bg-amber-400 rounded-full transition-all" style={{ width: pct + "%" }} /></div>
      </div>
      <div className="lg:columns-2 gap-3">
      {sections.map((section, si) => {
        const col = rCatColor(section.cat || "Audit / ISA");
        return (
          <div key={si} className="bg-white rounded-xl border border-slate-200 mb-3 overflow-hidden break-inside-avoid" style={{ borderLeft: "3px solid " + col }}>
            <div className="px-4 py-3 text-sm font-semibold border-b border-slate-100" style={{ color: col }}>{section.cat}</div>
            {(section.items || []).map((item, ii) => {
              const key = si + "-" + ii;
              const isDone = !!checked[key];
              return (
                <div key={ii} onClick={() => onToggle(key)}
                  className={"flex items-start gap-3 px-4 py-2.5 border-b border-slate-50 cursor-pointer hover:bg-slate-50 " + (isDone ? "opacity-60" : "")}>
                  <span className={"w-5 h-5 rounded border-2 flex items-center justify-center shrink-0 mt-0.5 transition-colors " + (isDone ? "bg-emerald-500 border-emerald-500" : "border-slate-300")}>
                    {isDone && <Check size={13} className="text-white" />}
                  </span>
                  <div className="min-w-0">
                    <div className={"text-sm font-medium " + (isDone ? "line-through text-slate-400" : "text-slate-700")}>{item.t}</div>
                    {item.c && <Fmt text={item.c} className={"text-[12.5px] leading-relaxed mt-1 " + (isDone ? "text-slate-300" : "text-slate-500")} />}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
      </div>
    </div>
  );
}

/* ════════ App ════════ */
function ReferencesApp() {
  const persisted = useMemo(rLoad, []);
  const hashSection = (typeof location !== "undefined" && location.hash || "").replace("#", "");
  const VALID = ["courses", "memos", "glossary", "seuils", "conso", "cas", "arbres", "restruct", "terrain"];
  const [section, setSection] = useState(VALID.includes(hashSection) ? hashSection : (VALID.includes(persisted.section) ? persisted.section : "courses"));
  const [terrain, setTerrain] = useState(persisted.terrain || {});
  const [memoQuery, setMemoQuery] = useState("");
  const [pop, setPop] = useState(null);   // {x, y, normId, label}

  useEffect(() => { rSave({ section, terrain }); }, [section, terrain]);
  useEffect(() => {
    const onHash = () => {
      const h = (location.hash || "").replace("#", "");
      if (VALID.includes(h)) { setSection(h); window.scrollTo(0, 0); }
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const D = R_DATA;
  const counts = {
    courses: (D.courses_ifrs || []).length + (D.courses_rpc || []).length,
    memos: (D.memo_co || []).length + (D.memo_rpc || []).length + (D.memo_ifrs || []).length,
    glossary: (D.anglais || []).reduce((s, e) => s + (e.terms || []).length, 0),
    seuils: (D.seuils || []).reduce((s, e) => s + (e.items || []).length, 0),
    conso: (D.consolidation || []).length,
    cas: (D.cas_chiffres || []).length,
    arbres: (D.arbres_decision || []).length,
    restruct: (D.restructuration || []).length,
    terrain: (D.terrain || []).reduce((s, e) => s + (e.items || []).length, 0),
  };
  const sections = [
    { id: "courses", label: "Leçons", icon: <GraduationCap size={16} />, n: counts.courses },
    { id: "memos", label: "Mémos", icon: <FileText size={16} />, n: counts.memos },
    { id: "glossary", label: "Vocabulaire", icon: <Languages size={16} />, n: counts.glossary },
    { id: "seuils", label: "Seuils", icon: <Ruler size={16} />, n: counts.seuils },
    { id: "conso", label: "Consolidation", icon: <Network size={16} />, n: counts.conso },
    { id: "cas", label: "Cas chiffrés", icon: <Calculator size={16} />, n: counts.cas },
    { id: "arbres", label: "Arbres", icon: <GitBranch size={16} />, n: counts.arbres },
    { id: "restruct", label: "Restructuration", icon: <Recycle size={16} />, n: counts.restruct },
    { id: "terrain", label: "Terrain EY", icon: <ClipboardCheck size={16} />, n: counts.terrain },
  ];

  /* Délégation des clics cross-ref (les spans viennent de dangerouslySetInnerHTML) */
  const onMainClick = (e) => {
    const span = e.target.closest && e.target.closest(".cross-ref");
    if (!span) { if (pop) setPop(null); return; }
    e.stopPropagation();
    const rect = span.getBoundingClientRect();
    setPop({
      x: Math.min(rect.left, window.innerWidth - 290),
      y: rect.bottom + window.scrollY + 6,
      normId: span.getAttribute("data-norm") || "",
      label: span.getAttribute("data-label") || span.textContent || "",
    });
  };
  const popAction = (action) => {
    if (!pop) return;
    if (action === "memo") { setMemoQuery(pop.label); setSection("memos"); window.scrollTo(0, 0); }
    else if (action === "course") { setSection("courses"); window.scrollTo(0, 0); }
    else if (action === "flashcards") {
      try { (window.parent || window).postMessage({ type: "refsCrossRef", target: "flashcards", q: pop.label }, "*"); } catch (e) {}
    }
    setPop(null);
  };

  useEffect(() => {
    const close = (e) => { if (!(e.target.closest && e.target.closest(".cross-ref, .ref-popover"))) setPop(null); };
    const esc = (e) => { if (e.key === "Escape") setPop(null); };
    document.addEventListener("click", close);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("click", close); document.removeEventListener("keydown", esc); };
  }, []);

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      <header className="bg-gradient-to-r from-slate-900 to-indigo-900 text-white">
        <div className="max-w-5xl mx-auto px-4 py-5 flex items-center gap-3 flex-wrap">
          <BookOpen size={26} className="text-indigo-300" />
          <div className="flex-1 min-w-[220px]">
            <h1 className="text-lg font-bold">Références — bibliothèque de révision</h1>
            <p className="text-xs text-indigo-200">Leçons · mémos · vocabulaire · seuils · cas chiffrés · arbres · checklists EY</p>
          </div>
          <div className="flex items-center gap-2 text-xs flex-wrap">
            <span className="bg-white/10 rounded-lg px-3 py-1.5 font-medium">{counts.courses} leçons</span>
            <span className="bg-white/10 rounded-lg px-3 py-1.5 font-medium">{counts.memos} mémos</span>
            <span className="bg-white/10 rounded-lg px-3 py-1.5 font-medium">{counts.glossary} termes EN</span>
            <span className="bg-white/10 rounded-lg px-3 py-1.5 font-medium">{counts.cas} cas · {counts.arbres} arbres</span>
          </div>
        </div>
      </header>

      <nav className="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div className="max-w-5xl mx-auto px-2 flex gap-1 overflow-x-auto">
          {sections.map((s) => (
            <button key={s.id} onClick={() => { setSection(s.id); if (s.id !== "memos") setMemoQuery(""); window.scrollTo(0, 0); }}
              className={"flex items-center gap-2 px-3 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition-colors " +
                (section === s.id ? "border-indigo-600 text-indigo-700" : "border-transparent text-slate-500 hover:text-slate-800")}>
              {s.icon}{s.label}
              <span className={"text-[10px] rounded-full px-1.5 py-0.5 " + (section === s.id ? "bg-indigo-50 text-indigo-600" : "bg-slate-100 text-slate-400")}>{s.n}</span>
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-5xl mx-auto px-4 py-6" onClick={onMainClick}>
        {section === "courses" && <CoursesSection />}
        {section === "memos" && <MemosSection initialQuery={memoQuery} />}
        {section === "glossary" && <GlossarySection />}
        {section === "seuils" && <SeuilsSection />}
        {section === "conso" && <CatItemsSection data={R_DATA.consolidation} />}
        {section === "cas" && <CasSection />}
        {section === "arbres" && <ArbresSection />}
        {section === "restruct" && <CatItemsSection data={R_DATA.restructuration} />}
        {section === "terrain" && <TerrainSection checked={terrain} onToggle={(k) => setTerrain((p) => ({ ...p, [k]: !p[k] }))} />}
      </main>

      {pop && (
        <div className="ref-popover fixed z-50 bg-white border border-slate-300 rounded-xl shadow-xl p-2 w-[270px]" style={{ left: pop.x, top: pop.y - window.scrollY }}>
          <div className="px-2 py-1.5 text-sm font-semibold text-slate-800 border-b border-slate-100 mb-1">{pop.label}</div>
          <button onClick={() => popAction("memo")} className="w-full text-left px-2 py-1.5 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 rounded-md">📘 Voir le mémo</button>
          <button onClick={() => popAction("course")} className="w-full text-left px-2 py-1.5 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 rounded-md">📚 Voir le cours</button>
          <button onClick={() => popAction("flashcards")} className="w-full text-left px-2 py-1.5 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 rounded-md">🃏 Flashcards liées</button>
        </div>
      )}

      <footer className="max-w-5xl mx-auto px-4 py-6 text-center text-xs text-slate-400">
        Codes de normes cliquables (RPC, IAS/IFRS, ISA, art. CO) — progression Terrain sauvegardée localement.
      </footer>
    </div>
  );
}


createRoot(document.getElementById("root")).render(<ReferencesApp />);

</script>
</body>
</html>
