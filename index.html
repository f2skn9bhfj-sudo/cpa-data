<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss CPA — Mobile</title>
    <!--
        style.css : styles existants (dominant pour l'instant).
        tailwind.css : utilitaires Tailwind v4 chargés en parallèle.
        Migration progressive : chaque écran refait en Tailwind remplace
        ses règles dans style.css (Phase 4b).
    -->
    <link rel="stylesheet" href="css/style.css?v=1781785009">
    <link rel="stylesheet" href="css/pdf_export.css?v=1781785009">
    <link rel="stylesheet" href="css/audit_cours.css?v=1781785009">
</head>
<body>
    <!-- ARIA live region for page changes (assertive nav announcements) -->
    <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Tab Bar -->
    <nav class="tab-bar" id="tabBar" role="navigation" aria-label="Navigation principale">
        <span class="logo" aria-hidden="true">Swiss CPA</span>
        <div class="nav-menu" id="navMenu">
            <div class="nav-scroll" id="navScroll">
                <button class="tab active" data-tab="dashboard" onclick="navigate('dashboard')" aria-current="page" aria-label="Accueil"><span class="tab-emoji" aria-hidden="true">🏠</span>Accueil</button>
                <button class="tab" data-tab="modules" onclick="navigate('modules')" aria-label="Modules"><span class="tab-emoji" aria-hidden="true">📚</span>Modules</button>
                <button class="tab" data-tab="trainer" onclick="navigate('trainer')" aria-label="Entraînement"><span class="tab-emoji" aria-hidden="true">🎯</span>Entraînement</button>
                <button class="tab" data-tab="qcm" onclick="navigate('qcm')" aria-label="Module QCM"><span class="tab-emoji" aria-hidden="true">❓</span>QCM</button>
                <button class="tab" data-tab="fcdb" onclick="navigate('fcdb')" aria-label="Base de flashcards"><span class="tab-emoji" aria-hidden="true">🃏</span>Flashcards</button>
                <button class="tab" data-tab="compare" onclick="navigate('compare')" aria-label="Comparaisons"><span class="tab-emoji" aria-hidden="true">⚖️</span>Comparaisons</button>
                <button class="tab" data-tab="progress" onclick="navigate('progress')" aria-label="Statistiques"><span class="tab-emoji" aria-hidden="true">📈</span>Stats</button>
                <button class="tab" data-tab="fs" onclick="navigate('fs')" aria-label="États financiers"><span class="tab-emoji" aria-hidden="true">📑</span>États financiers</button>
                <button class="tab" data-tab="references" onclick="navigate('references')" aria-label="Références"><span class="tab-emoji" aria-hidden="true">📖</span>Références</button>
                <button class="tab" data-tab="audit" onclick="navigate('audit')" aria-label="Module Audit"><span class="tab-emoji" aria-hidden="true">🔍</span>Audit</button>
                <button class="tab" data-tab="podcasts" onclick="navigate('podcasts')" aria-label="Podcasts"><span class="tab-emoji" aria-hidden="true">🎧</span>Podcasts</button>
                <button class="tab" data-tab="english" onclick="navigate('english')" aria-label="Module Anglais"><span class="tab-emoji" aria-hidden="true">🇬🇧</span>Anglais</button>
                <button class="tab" data-tab="hec" onclick="navigate('hec')" aria-label="Cours HEC"><span class="tab-emoji" aria-hidden="true">🎓</span>HEC</button>
                <button class="tab" data-tab="oral" onclick="navigate('oral')" aria-label="Examen oral"><span class="tab-emoji" aria-hidden="true">🎤</span>Oral</button>
                <button class="tab" data-tab="conso" onclick="navigate('conso')" aria-label="Consolidation, IFRS et Swiss GAAP"><span class="tab-emoji" aria-hidden="true">📊</span>Conso</button>
                <button class="tab" data-tab="social" onclick="navigate('social')" aria-label="Droit du travail, assurances sociales et paie"><span class="tab-emoji" aria-hidden="true">🤝</span>Social</button>
            </div>
            <div class="nav-right">
                <div class="search-box" role="search">
                    <label for="globalSearch" class="sr-only">Rechercher dans toute l'application</label>
                    <input type="text" id="globalSearch" placeholder="Rechercher..." oninput="handleSearch(this.value)" onfocus="showSearchResults()" aria-describedby="searchHint" autocomplete="off" />
                    <span id="searchHint" class="sr-only">Ctrl+K pour activer · Échap pour fermer</span>
                    <div class="search-results" id="searchResults" role="listbox" aria-label="Résultats de recherche"></div>
                </div>
                <button class="theme-toggle" id="pdfExportBtn" onclick="pdfExportOpen()" aria-label="Exporter des cours en PDF" title="Exporter des cours en PDF"><span aria-hidden="true">📄</span></button>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Basculer thème clair/sombre" title="Basculer thème clair/sombre"><span aria-hidden="true">☀️</span></button>
            </div>
        </div>
        <button class="nav-burger" id="navBurger" onclick="toggleNavMenu()" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="navMenu">
            <span class="nav-burger-bars" aria-hidden="true"></span>
        </button>
    </nav>

    <!-- PDF Export Modal (built dynamically by pdf_export.js) -->
    <div id="pdfExportModal" class="pdf-modal hidden" role="dialog" aria-modal="true" aria-label="Export PDF"></div>

    <!-- PDF Print Container (caché en mode normal, visible en print) -->
    <div id="pdfPrintContainer" class="pdf-print-container"></div>

    <!-- Sub-tab bar (for references) -->
    <div class="sub-tab-bar hidden" id="subTabBar" role="tablist" aria-label="Sous-sections"></div>

    <!-- Main content -->
    <main class="main-content fade-in" id="mainContent" role="main" tabindex="-1" aria-live="polite" aria-busy="true">
        <div class="text-center" style="padding-top: 100px;">
            <div class="page-title">Chargement...</div>
        </div>
    </main>

    <!-- Hôte PERSISTANT du lecteur de podcasts : l'iframe y est créée une
         seule fois et n'est jamais détruite → l'audio continue quand on
         change d'onglet (on masque juste cet hôte). -->
    <div class="main-content full-width" id="podcastHost" style="display:none"></div>

    <!-- Barre de zoom globale (bas-droite, fixe). Visible sur tous les onglets. -->
    <div class="app-zoom-bar" id="appZoomBar" role="group" aria-label="Zoom global" style="display:flex">
        <button class="app-zoom-btn" id="appZoomMinus" onclick="appZoomTabStep(-1)" aria-label="Réduire" title="Réduire">−</button>
        <button class="app-zoom-level" id="appZoomLevel" onclick="appZoomTabReset()" aria-label="Réinitialiser le zoom" title="Réinitialiser">100%</button>
        <button class="app-zoom-btn" id="appZoomPlus" onclick="appZoomTabStep(1)" aria-label="Agrandir" title="Agrandir">+</button>
        <button class="app-zoom-btn" id="appZoomReset" onclick="appZoomTabReset()" aria-label="Réinitialiser" title="Réinitialiser">↻</button>
    </div>

    <!-- Scripts -->
    <!-- api-client.js DOIT être chargé en premier : il installe window.pywebview.api
         en mode web (no-op en mode desktop). Cf. commentaire dans le fichier. -->
    <script src="js/api-client-static.js?v=1781785009"></script>
    <script src="js/crossref.js?v=1781785009"></script>
    <script src="js/search.js?v=1781785009"></script>
    <script src="js/dashboard.js?v=1781785009"></script>
    <script src="js/translator.js?v=1781785009"></script>
    <script src="js/modules.js?v=1781785009"></script>
    <script src="js/flashcards.js?v=1781785009"></script>
    <script src="js/fcdb.js?v=1781785009"></script>
    <script src="js/free_recall.js?v=1781785009"></script>
    <script src="js/exam_mode.js?v=1781785009"></script>
    <script src="js/references.js?v=1781785009"></script>
    <script src="js/comparisons.js?v=1781785009"></script>
    <script src="js/fs_explorer.js?v=1781785009"></script>
    <script src="js/progress.js?v=1781785009"></script>
    <script src="js/qcm.js?v=1781785009"></script>
    <script src="js/trainer.js?v=1781785009"></script>
    <script src="js/audit.js?v=1781785009"></script>
    <script src="js/audit_cours.js?v=1781785009"></script>
    <script src="js/hec.js?v=1781785009"></script>
    <script src="js/social.js?v=1781785009"></script>
    <script src="js/oral.js?v=1781785009"></script>
    <script src="js/conso.js?v=1781785009"></script>
    <script src="js/mission.js?v=1781785009"></script>
    <script src="js/audit_seuils.js?v=1781785009"></script>
    <script src="js/canvas.js?v=1781785009"></script>
    <script src="js/english.js?v=1781785009"></script>
    <script src="js/podcasts.js?v=1781785009"></script>
    <script src="js/ai_explain.js?v=1781785009"></script>
    <script src="js/pdf_export.js?v=1781785009"></script>
    <script src="js/mindmap.js?v=1781785009"></script>
    <script src="js/app.js?v=1781785009"></script>
</body>
</html>
