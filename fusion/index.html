function LJournalMoteurNonUtilise({ title, note, lines = [] }) {
  const norm = lines.map((l) => ({ compte: l.compte, debit: l.debit || 0, credit: l.credit || 0 }));
  return <div className="my-3"><Journal n={"✍"} title={title || "Écriture comptable"} note={note} lines={norm} /></div>;
}

function LExample({ title = "Exemple chiffré", statement, solution }) {
  const [show, setShow] = useState(false);
  return (
    <div className="my-3 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <div className="bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 flex items-center gap-2 border-b border-slate-100">
        <Calculator size={15} className="text-indigo-500" />{title}
      </div>
      <div className="p-4">
        <div className="text-sm text-slate-700"><MdBlock text={statement} /></div>
        {solution && (
          <div className="mt-3">
            <button onClick={() => setShow(!show)} className="flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800">
              <ChevronDown size={14} className={`transition-transform ${show ? "rotate-180" : ""}`} />{show ? "Masquer le corrigé" : "Voir le corrigé"}
            </button>
            {show && <div className="mt-2 pt-3 border-t border-dashed border-slate-200 text-sm text-slate-700"><MdBlock text={solution} /></div>}
          </div>
        )}
      </div>
    </div>
  );
}

function LQuiz({ title = "Quiz express", questions = [] }) {
  const [ans, setAns] = useState({});
  const answered = Object.keys(ans).length;
  const score = questions.reduce((s, q, i) => s + (ans[i] === q.answer ? 1 : 0), 0);
  return (
    <div className="my-3 rounded-xl border border-slate-200 bg-white">
      <div className="bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 flex items-center justify-between border-b border-slate-100">
        <span className="flex items-center gap-2"><GraduationCap size={15} className="text-indigo-500" />{title}</span>
        {answered > 0 && <span className="text-xs font-medium text-slate-500">Score {score}/{questions.length}</span>}
      </div>
      <div className="p-4 space-y-4">
        {questions.map((q, qi) => {
          const chosen = ans[qi]; const done = chosen != null;
          return (
            <div key={qi}>
              <div className="text-sm font-medium text-slate-800 mb-2">{qi + 1}. <MdInline text={q.q} /></div>
              <div className="grid gap-1.5">
                {q.options.map((opt, oi) => {
                  let cls = "border-slate-200 hover:border-indigo-300 text-slate-700";
                  if (done) {
                    if (oi === q.answer) cls = "border-emerald-300 bg-emerald-50 text-emerald-800";
                    else if (oi === chosen) cls = "border-rose-300 bg-rose-50 text-rose-700";
                    else cls = "border-slate-200 text-slate-400";
                  }
                  return (
                    <button key={oi} disabled={done} onClick={() => setAns((p) => ({ ...p, [qi]: oi }))}
                      className={`text-left text-sm border rounded-lg px-3 py-2 transition-colors flex items-center gap-2 ${cls}`}>
                      <span className="shrink-0 w-5 h-5 rounded-full border border-slate-300 text-xs flex items-center justify-center font-medium">{"ABCD"[oi]}</span>
                      <span className="flex-1"><MdInline text={opt} /></span>
                      {done && oi === q.answer && <CheckCircle2 size={15} className="text-emerald-500" />}
                    </button>
                  );
                })}
              </div>
              {done && q.explain && <div className="mt-2 text-xs text-slate-500 bg-slate-50 rounded-lg px-3 py-2"><MdInline text={q.explain} /></div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LMnemo({ code, items = [], phrase }) {
  return (
    <div className="my-3 rounded-xl border border-violet-200 bg-violet-50 p-4">
      <div className="text-sm font-bold text-violet-700 mb-2">🧠 Mnémotechnique — {code}</div>
      <ul className="space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm text-slate-700"><span className="font-bold text-violet-700">{it.l}</span> — <MdInline text={it.t} /></li>
        ))}
      </ul>
      {phrase && <div className="mt-2 text-xs italic text-violet-600">« {phrase} »</div>}
    </div>
  );
}

/* ===================== Schémas / graphiques ===================== */
const DHEX = {
  slate: "#94a3b8", gray: "#9ca3af", indigo: "#6366f1", violet: "#8b5cf6", blue: "#3b82f6",
  cyan: "#06b6d4", teal: "#14b8a6", emerald: "#10b981", green: "#22c55e", amber: "#f59e0b",
  orange: "#f97316", rose: "#f43f5e", red: "#ef4444",
};
const dhex = (c) => DHEX[c] || DHEX.indigo;

function DCaption({ text }) {
  if (!text) return null;
  return <div className="text-xs text-slate-400 mt-2 text-center italic"><MdInline text={text} /></div>;
}

/* Spectre 0→100 % avec bandes colorées + légende — LE visuel contrôle/influence */
function DSpectrum({ title, bands = [], caption }) {
  const ticks = Array.from(new Set([0, 100, ...bands.flatMap((b) => [b.from, b.to])])).sort((a, b) => a - b);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex h-10 rounded-xl overflow-hidden shadow-inner">
        {bands.map((b, i) => (
          <div key={i} style={{ width: `${b.to - b.from}%`, background: dhex(b.color) }}
            className="h-full flex items-center justify-center text-[10px] font-bold text-white text-center px-1 leading-tight">
            {b.short || ""}
          </div>
        ))}
      </div>
      <div className="relative h-4 mt-1">
        {ticks.map((p) => (
          <span key={p} style={{ left: `${p}%` }} className="absolute -translate-x-1/2 text-[10px] font-medium text-slate-400">{p}%</span>
        ))}
      </div>
      <div className="grid sm:grid-cols-3 gap-2 mt-2">
        {bands.map((b, i) => (
          <div key={i} className="flex items-start gap-2 text-xs">
            <span className="w-3 h-3 rounded mt-0.5 shrink-0" style={{ background: dhex(b.color) }}></span>
            <span className="text-slate-600 leading-snug"><MdInline text={b.label} /></span>
          </div>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Cascade (goodwill bridge) : + / − / = avec barres proportionnelles */
function DWaterfall({ title, items = [], caption }) {
  const max = Math.max(1, ...items.map((i) => Math.abs(i.value || 0)));
  const col = { add: "#6366f1", sub: "#f43f5e", total: "#10b981" };
  const sign = { add: "+", sub: "−", total: "=" };
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="space-y-1.5">
        {items.map((it, i) => (
          <div key={i} className="flex items-center gap-2">
            <div className="w-36 sm:w-44 text-xs text-slate-600 text-right shrink-0 leading-snug"><MdInline text={it.label} /></div>
            <div className="flex-1 h-7 bg-slate-50 rounded-md overflow-hidden">
              <div style={{ width: `${(Math.abs(it.value) / max) * 100}%`, background: col[it.kind] || col.add }}
                className={`h-full ${it.kind === "total" ? "rounded-md" : ""}`}></div>
            </div>
            <div className={`w-20 text-sm font-bold text-right shrink-0 tabular-nums ${it.kind === "total" ? "text-emerald-700" : it.kind === "sub" ? "text-rose-600" : "text-indigo-700"}`}>
              {sign[it.kind] || ""}{fmt(Math.abs(it.value))}
            </div>
          </div>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Structure de groupe (mère → filiale %, + minoritaires) en SVG */
function DGroup({ parent = {}, pct = 100, child = {}, nci, method, caption }) {
  const minor = nci != null ? nci : (100 - pct);
  const pcol = dhex(parent.color || "indigo");
  const ccol = dhex(child.color || "slate");
  return (
    <div className="my-4">
      <svg viewBox="0 0 440 220" className="w-full max-w-md mx-auto">
        <rect x="160" y="8" width="120" height="48" rx="10" fill={pcol} />
        <text x="220" y="30" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">{parent.label || "Société mère"}</text>
        <text x="220" y="46" textAnchor="middle" fill="#e0e7ff" fontSize="10">{parent.sub || "Consolidante"}</text>
        <line x1="220" y1="56" x2="220" y2="150" stroke="#cbd5e1" strokeWidth="2" />
        <rect x="186" y="92" width="68" height="22" rx="6" fill="#fff" stroke={pcol} />
        <text x="220" y="107" textAnchor="middle" fill={pcol} fontSize="12" fontWeight="800">{pct} %</text>
        <rect x="160" y="150" width="120" height="56" rx="10" fill={ccol} />
        <text x="220" y="173" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">{child.label || "Filiale"}</text>
        <text x="220" y="190" textAnchor="middle" fill="#e2e8f0" fontSize="9.5">{method || child.sub || ""}</text>
        {minor > 0 && (<>
          <rect x="312" y="150" width="118" height="56" rx="10" fill="#fffbeb" stroke="#fcd34d" strokeDasharray="4" />
          <text x="371" y="173" textAnchor="middle" fill="#92400e" fontSize="11" fontWeight="700">Minoritaires</text>
          <text x="371" y="190" textAnchor="middle" fill="#b45309" fontSize="12" fontWeight="800">{minor} %</text>
          <line x1="312" y1="178" x2="280" y2="178" stroke="#fbbf24" strokeWidth="2" strokeDasharray="4" />
        </>)}
      </svg>
      <DCaption text={caption} />
    </div>
  );
}

/* Colonnes IFRS / RPC / CO (ou n colonnes) — comparatif visuel */
function DColumns({ cols = [], caption }) {
  return (
    <div className="my-4">
      <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(cols.length, 3)}, minmax(0,1fr))` }}>
        {cols.map((c, i) => {
          const a = lacc(c.color);
          return (
            <div key={i} className={`rounded-xl border ${a.ring} overflow-hidden`}>
              <div className={`${a.bar} text-white text-sm font-bold px-3 py-2 text-center`}>{c.title}</div>
              <ul className={`${a.soft} p-3 space-y-1.5`}>
                {(c.items || []).map((it, j) => (
                  <li key={j} className="text-xs text-slate-700 flex gap-1.5 leading-snug"><span className={`${a.text} font-bold`}>›</span><span><MdInline text={it} /></span></li>
                ))}
              </ul>
            </div>
          );
        })}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Flux d'étapes : boîtes + flèches */
function DFlow({ title, steps = [], accent = "indigo", caption }) {
  const a = lacc(accent);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex items-stretch gap-1 overflow-x-auto pb-1">
        {steps.map((s, i) => (
          <React.Fragment key={i}>
            <div className={`shrink-0 rounded-xl border ${a.ring} ${a.soft} p-3 w-40`}>
              <div className={`text-xs font-bold ${a.text} mb-0.5`}>{i + 1}. <MdInline text={s.label} /></div>
              {s.sub && <div className="text-[11px] text-slate-500 leading-snug"><MdInline text={s.sub} /></div>}
            </div>
            {i < steps.length - 1 && <div className="flex items-center text-slate-300 shrink-0"><ArrowRight size={18} /></div>}
          </React.Fragment>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Pyramide (niveaux décroissants) */
function DPyramid({ title, levels = [], accent = "indigo", caption }) {
  const base = dhex(accent);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2 text-center">{title}</div>}
      <div className="flex flex-col items-center gap-1">
        {levels.map((l, i) => {
          const w = 100 - i * (55 / Math.max(levels.length - 1, 1));
          return (
            <div key={i} style={{ width: `${w}%`, background: base, opacity: 1 - i * 0.13 }}
              className="rounded-lg text-white text-center px-3 py-2 shadow-sm">
              <div className="text-xs font-bold"><MdInline text={l.t} /></div>
              {l.d && <div className="text-[10px] opacity-90 leading-snug"><MdInline text={l.d} /></div>}
            </div>
          );
        })}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Répartition (barre %) — ex. groupe vs minoritaires */
function DSplit({ title, parts = [], caption }) {
  const tot = parts.reduce((s, p) => s + (p.value || 0), 0) || 1;
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex h-10 rounded-lg overflow-hidden">
        {parts.map((p, i) => (
          <div key={i} style={{ width: `${(p.value / tot) * 100}%`, background: dhex(p.color) }}
            className="flex items-center justify-center text-white text-xs font-bold">{p.value}%</div>
        ))}
      </div>
      <div className="flex flex-wrap gap-3 mt-2 text-xs">
        {parts.map((p, i) => (
          <span key={i} className="flex items-center gap-1.5 text-slate-600"><span className="w-3 h-3 rounded" style={{ background: dhex(p.color) }}></span><MdInline text={p.label} /></span>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

function LDiagram({ b }) {
  switch (b.kind) {
    case "spectrum": return <DSpectrum title={b.title} bands={b.bands} caption={b.caption} />;
    case "waterfall": return <DWaterfall title={b.title} items={b.items} caption={b.caption} />;
    case "group": return <DGroup parent={b.parent} pct={b.pct} child={b.child} nci={b.nci} method={b.method} caption={b.caption} />;
    case "columns": return <DColumns cols={b.cols} caption={b.caption} />;
    case "flow": return <DFlow title={b.title} steps={b.steps} accent={b.accent} caption={b.caption} />;
    case "pyramid": return <DPyramid title={b.title} levels={b.levels} accent={b.accent} caption={b.caption} />;
    case "split": return <DSplit title={b.title} parts={b.parts} caption={b.caption} />;
    default: return null;
  }
}

function LessonBlock({ b }) {
  if (!b || !b.type) return null;
  switch (b.type) {
    case "intro": return <div className="text-[15px] text-slate-700 my-2"><MdBlock text={b.text} /></div>;
    case "heading": return <h3 className="text-base font-bold text-slate-800 mt-5 mb-1"><MdInline text={b.text} /></h3>;
    case "keypoints": return <LKeypoints title={b.title} items={b.items} accent={b.accent} />;
    case "callout": return <LCallout tone={b.tone} title={b.title} text={b.text} />;
    case "table": return <LTable title={b.title} headers={b.headers} rows={b.rows} />;
    case "compare": return <LCompare title={b.title} rows={b.rows} />;
    case "steps": return <LSteps title={b.title} steps={b.steps} accent={b.accent} />;
    case "journal": return <LJournal title={b.title} note={b.note} lines={b.lines} />;
    case "example": return <LExample title={b.title} statement={b.statement} solution={b.solution} />;
    case "quiz": return <LQuiz title={b.title} questions={b.questions} />;
    case "mnemo": return <LMnemo code={b.code} items={b.items} phrase={b.phrase} />;
    case "diagram": return <LDiagram b={b} />;
    default: return null;
  }
}

function LessonSection({ sec, accent = "indigo", defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  const a = lacc(accent);
  if (!sec.title) return <div className="mb-2">{(sec.blocks || []).map((b, i) => <LessonBlock key={i} b={b} />)}</div>;
  return (
    <div className="mb-3 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center gap-2.5 px-4 py-3 text-left hover:bg-slate-50">
        <span className={`w-1.5 h-5 rounded ${a.bar}`}></span>
        <span className="font-semibold text-slate-800 flex-1">{sec.title}</span>
        <ChevronDown size={17} className={`text-slate-400 transition-transform ${open ? "rotate-180" : ""}`} />
      </button>
      {open && <div className="px-4 pb-4 pt-1">{(sec.blocks || []).map((b, i) => <LessonBlock key={i} b={b} />)}</div>}
    </div>
  );
}

function LessonView({ lesson, accent = "indigo", onBack }) {
  const a = lacc(lesson.color || accent);
  const secs = lesson.sections || [{ title: null, blocks: lesson.blocks || [] }];
  return (
    <div>
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-slate-500 hover:text-indigo-600 mb-3"><ArrowLeft size={15} /> Retour à la liste</button>
      <div className={`rounded-2xl border ${a.ring} ${a.soft} p-5 mb-4`}>
        <div className="flex items-center gap-2 mb-1">
          <span className="text-2xl">{lesson.icon}</span>
          <span className={`text-lg font-bold ${a.text}`}>{lesson.code}</span>
        </div>
        <h2 className="text-xl font-bold text-slate-800">{lesson.title}</h2>
        {lesson.tagline && <p className="text-sm text-slate-600 mt-1"><MdInline text={lesson.tagline} /></p>}
      </div>
      {secs.map((s, si) => <LessonSection key={si} sec={s} accent={lesson.color || accent} defaultOpen={si === 0} />)}
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-slate-500 hover:text-indigo-600 mt-4"><ArrowLeft size={15} /> Retour à la liste</button>
    </div>
  );
}

function LessonHub({ pack = {}, domain = "", accent = "indigo", open = null, onOpen }) {
  const setOpen = onOpen || (() => {});
  const lessons = pack.lessons || [];
  if (!lessons.length) return <div className="text-sm text-slate-500 p-8 text-center">Contenu {domain} en préparation…</div>;
  if (open != null) {
    const lesson = lessons.find((l) => l.code === open);
    if (lesson) return <LessonView lesson={lesson} accent={accent} onBack={() => setOpen(null)} />;
  }
  return (
    <div>
      {pack.overview && (
        <div className={`rounded-2xl border ${lacc(accent).ring} ${lacc(accent).soft} p-5 mb-5`}>
          {pack.overview.title && <h2 className="text-lg font-bold text-slate-800 mb-1">{pack.overview.title}</h2>}
          {pack.overview.intro && <div className="text-sm text-slate-600"><MdBlock text={pack.overview.intro} /></div>}
        </div>
      )}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {lessons.map((l) => {
          const a = lacc(l.color || accent);
          return (
            <button key={l.code} onClick={() => setOpen(l.code)}
              className="text-left bg-white border border-slate-200 rounded-xl p-4 hover:shadow-md hover:-translate-y-0.5 transition-all flex flex-col gap-2">
              <div className="flex items-center gap-2">
                <span className="text-xl">{l.icon}</span>
                <span className={`font-bold text-sm ${a.text}`}>{l.code}</span>
              </div>
              <div className="font-semibold text-sm text-slate-800 leading-snug">{l.title}</div>
              {l.tagline && <div className="text-xs text-slate-500 leading-relaxed"><MdInline text={l.tagline} /></div>}
              <span className={`mt-auto text-xs font-semibold ${a.text} flex items-center gap-1 pt-1`}>Ouvrir le cours <ArrowRight size={13} /></span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ===================== Recherche globale dans les cours ===================== */
function LessonSearch({ lessons = {}, onOpen }) {
  const [q, setQ] = useState("");
  const all = [
    ...(((lessons.ifrs || {}).lessons) || []).map((l) => ({ ...l, domain: "IFRS" })),

      }).map((s) => s.title);
      const titleHit = ((l.code || "") + " " + (l.title || "") + " " + (l.tagline || "")).toLowerCase().includes(query);

      </div>

          {results.length === 0 && <div className="p-3 text-sm text-slate-400">Aucun résultat pour « {q} ».</div>}
          {results.map(({ l, secHits }) => (
            <button key={l.domain + l.code} onClick={() => onOpen && onOpen(l.code)} className="w-full text-left p-3 hover:bg-slate-50 flex items-start gap-2.5">

}

/* ---------- Journal comptable (utilisé par le bloc "journal") ---------- */
const _fmt = (n) => (n === 0 || n == null || n === "") ? "" :

/* Surcharge du bloc "journal" du moteur partagé : sa version d'origine ne
   conserve que compte/débit/crédit et PERD le libellé. En fusion, le libellé
   (« Prime de fusion », « Société absorbée, compte d'apport ») fait partie de
   la réponse attendue à l'examen : on le garde. */
function LJournal({ title, note, lines = [] }) {
  return <div className="my-3"><Journal n="✍" title={title || "Écriture comptable"} note={note} lines={lines} /></div>;
}

/* ===================== Calculateur de fusion ===================== */
const _n = (v) => { const x = parseFloat(String(v).replace(/[^\d.,-]/g, "").replace(",", ".")); return isNaN(x) ? 0 : x; };
function pgcd(a, b) { a = Math.round(Math.abs(a)); b = Math.round(Math.abs(b)); while (b) { const t = b; b = a % b; a = t; } return a || 1; }

function FusionCalc() {
  const [f, setF] = useState({
    nomA: "Absorbante", nomB: "Absorbée",
    nA: "10000", vnA: "100", vrA: "300",
    nB: "6000", vrB: "200",
    apport: "1200000",          // valeur globale d'apport retenue (comptable OU réelle)
    partA: "0",                 // titres de B déjà détenus par A
    vcTitres: "0",              // valeur comptable nette de ces titres chez A
    soulteUnit: "0",            // soulte par action B échangée
  });
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

  const r = useMemo(() => {
    const nA = _n(f.nA), vnA = _n(f.vnA), vrA = _n(f.vrA);
    const nB = _n(f.nB), vrB = _n(f.vrB), apport = _n(f.apport);
    const partA = _n(f.partA), vcTitres = _n(f.vcTitres), soulteUnit = _n(f.soulteUnit);
    if (!vrA || !nB) return null;
    const parite = vrB / vrA;                              // actions A pour 1 action B
    const g = pgcd(Math.round(vrB), Math.round(vrA));
    const fracN = Math.round(vrB) / g, fracD = Math.round(vrA) / g;
    const titresARemunerer = Math.max(0, nB - partA);      // fusion-renonciation
    const titresCrees = titresARemunerer * parite;
    const augCapital = titresCrees * vnA;
    const quotePart = nB ? titresARemunerer / nB : 0;
    const remuneration = apport * quotePart;               // apport rémunéré par titres
    const soulte = soulteUnit * titresARemunerer;
    const prime = remuneration - augCapital - soulte;
    // boni / mali sur la participation détenue antérieurement
    const qpPart = nB ? partA / nB : 0;
    const apportPart = apport * qpPart;
    const boniMali = partA > 0 ? apportPart - vcTitres : 0;
    // contrôle post-fusion → sens de l'opération
    const pctExB = (nA + titresCrees) ? titresCrees / (nA + titresCrees) : 0;
    return { nA, vnA, vrA, nB, vrB, apport, partA, parite, fracN, fracD, titresARemunerer,
      titresCrees, augCapital, remuneration, soulte, prime, boniMali, apportPart, vcTitres, pctExB };
  }, [f]);

  const F = (x, d = 2) => x == null ? "—" : x.toLocaleString("fr-CH", { minimumFractionDigits: d, maximumFractionDigits: d });
  const inp = "w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-sm focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none tabular-nums";
  const lab = "block text-[11px] font-semibold text-slate-500 mb-1";

  return (
    <div className="space-y-4">
      <div className="rounded-2xl border border-teal-200 bg-white overflow-hidden shadow-sm">
        <div className="px-5 py-3 bg-gradient-to-r from-teal-50 to-cyan-50 border-b border-teal-100">
          <span className="font-bold text-teal-900">🧮 Calculateur de fusion</span>
          <span className="text-[11px] text-teal-600 ml-2">parité · titres à créer · prime · boni/mali · sens de l'opération</span>
        </div>
        <div className="p-5 grid md:grid-cols-2 gap-5">
          <div>
            <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Société absorbante</div>
            <div className="grid grid-cols-3 gap-2">
              <div className="col-span-3"><label className={lab}>Nom</label><input className={inp} value={f.nomA} onChange={set("nomA")} /></div>
              <div><label className={lab}>Nb titres</label><input className={inp} value={f.nA} onChange={set("nA")} /></div>
              <div><label className={lab}>Valeur nominale</label><input className={inp} value={f.vnA} onChange={set("vnA")} /></div>
              <div><label className={lab}>Valeur réelle / titre</label><input className={inp} value={f.vrA} onChange={set("vrA")} /></div>
            </div>
          </div>
          <div>
            <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Société absorbée</div>
            <div className="grid grid-cols-3 gap-2">
              <div className="col-span-3"><label className={lab}>Nom</label><input className={inp} value={f.nomB} onChange={set("nomB")} /></div>
              <div><label className={lab}>Nb titres</label><input className={inp} value={f.nB} onChange={set("nB")} /></div>
              <div><label className={lab}>Valeur réelle / titre</label><input className={inp} value={f.vrB} onChange={set("vrB")} /></div>
              <div><label className={lab}>Valeur d'apport globale</label><input className={inp} value={f.apport} onChange={set("apport")} /></div>
            </div>
          </div>
          <div className="md:col-span-2">
            <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Participation préalable & soulte (facultatif)</div>
            <div className="grid sm:grid-cols-3 gap-2">
              <div><label className={lab}>Titres de {f.nomB} détenus par {f.nomA}</label><input className={inp} value={f.partA} onChange={set("partA")} /></div>
              <div><label className={lab}>Valeur comptable nette de ces titres</label><input className={inp} value={f.vcTitres} onChange={set("vcTitres")} /></div>
              <div><label className={lab}>Soulte par action échangée</label><input className={inp} value={f.soulteUnit} onChange={set("soulteUnit")} /></div>
            </div>
          </div>
        </div>
      </div>

      {r && (
        <div className="grid md:grid-cols-2 gap-3">
          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Rapport d'échange</div>
            <div className="text-3xl font-bold text-teal-700 tabular-nums">{F(r.parite, 4)}</div>
            <div className="text-sm text-slate-500 mt-1">action{r.parite > 1 ? "s" : ""} {f.nomA} pour 1 action {f.nomB}</div>
            <div className="mt-2 inline-block rounded-lg bg-teal-50 border border-teal-200 px-3 py-1.5 text-sm font-semibold text-teal-800">
              soit {F(r.fracN, 0)} pour {F(r.fracD, 0)}
            </div>
            <div className="mt-3 text-xs text-slate-500 leading-relaxed">
              Parité = valeur réelle du titre absorbé ÷ valeur réelle du titre absorbant = {F(r.vrB, 2)} ÷ {F(r.vrA, 2)}.
            </div>
          </div>

          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Titres à créer</div>
            <div className="text-3xl font-bold text-teal-700 tabular-nums">{F(r.titresCrees, 0)}</div>
            <div className="text-sm text-slate-500 mt-1">
              {F(r.titresARemunerer, 0)} titre(s) à rémunérer × {F(r.parite, 4)}
              {r.partA > 0 && <span className="block text-amber-700 mt-1">Fusion-renonciation : {F(r.partA, 0)} titre(s) déjà détenu(s) ne sont pas rémunérés.</span>}
            </div>
            {Math.abs(r.titresCrees - Math.round(r.titresCrees)) > 0.001 && (
              <div className="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5">
                Nombre non entier : à l'examen, prévoir des rompus (achat/vente de titres) ou une soulte.
              </div>
            )}
          </div>

          <div className="md:col-span-2 rounded-2xl border border-slate-200 bg-white overflow-hidden shadow-sm">
            <div className="px-5 py-2.5 bg-slate-50 border-b border-slate-100 text-xs font-bold uppercase tracking-wide text-slate-400">
              Décomposition de la rémunération des apports
            </div>
            <table className="w-full text-sm">
              <tbody>
                {[
                  ["Valeur d'apport retenue (globale)", r.apport, "Selon la règle de valorisation : valeur comptable ou valeur réelle."],
                  ["Fraction rémunérée par des titres", r.remuneration, r.partA > 0 ? `${F(r.titresARemunerer, 0)}/${F(r.nB, 0)} de l'apport` : "totalité de l'apport"],
                  ["− Augmentation de capital", -r.augCapital, `${F(r.titresCrees, 0)} titres × ${F(r.vnA, 2)} de nominal`],
                  ...(r.soulte ? [["− Soulte versée", -r.soulte, "Doit rester ≤ 10 % du nominal des titres émis pour conserver le régime fiscal de faveur."]] : []),
                  ["= Prime de fusion", r.prime, "Compte 1042."],
                ].map((row, i) => (
                  <tr key={i} className={`border-t border-slate-100 ${String(row[0]).startsWith("=") ? "bg-teal-50/60 font-bold" : ""}`}>
                    <td className="px-5 py-2 text-slate-700">{row[0]}</td>
                    <td className="px-3 py-2 text-right tabular-nums font-semibold text-slate-800 whitespace-nowrap">{F(row[1])}</td>
                    <td className="px-5 py-2 text-xs text-slate-400">{row[2]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {r.partA > 0 && (
            <div className="md:col-span-2 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <div className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Boni / mali de fusion sur la participation préalable</div>
              <div className="text-sm text-slate-600 mb-2">
                Quote-part d'apport correspondant aux {F(r.partA, 0)} titres détenus : <b className="tabular-nums">{F(r.apportPart)}</b>
                {" − "}valeur comptable nette des titres : <b className="tabular-nums">{F(r.vcTitres)}</b>
              </div>
              <div className={`text-2xl font-bold tabular-nums ${r.boniMali >= 0 ? "text-emerald-700" : "text-rose-700"}`}>
                {r.boniMali >= 0 ? "Boni de fusion " : "Mali de fusion "}{F(Math.abs(r.boniMali))}
              </div>
              <div className="mt-2 text-xs text-slate-500 leading-relaxed">
                {r.boniMali >= 0
                  ? "Le boni est comptabilisé en produit financier (compte 758 ou 768 selon la nature) à hauteur de la quote-part de résultats accumulés non distribués, le surplus en prime de fusion (1042)."
                  : "Distinguer le mali technique (contrepartie des plus-values latentes et du fonds commercial de l'absorbée : il s'inscrit à l'actif) du vrai mali (perte : charge financière, compte 668)."}

          <div className="md:col-span-2 rounded-2xl border p-5 shadow-sm" style={{ borderColor: r.pctExB > 0.5 ? "#fbbf24" : "#99f6e4", background: r.pctExB > 0.5 ? "#fffbeb" : "#f0fdfa" }}>

              Après la fusion, les anciens actionnaires de <b>{f.nomB}</b> détiennent{" "}
              <b className="tabular-nums">{F(r.pctExB * 100, 2)} %</b> du capital de {f.nomA}
              {" "}({F(r.titresCrees, 0)} titres créés sur {F(r.nA + r.titresCrees, 0)} au total).

            <div className={`mt-2 text-base font-bold ${r.pctExB > 0.5 ? "text-amber-800" : "text-teal-800"}`}>
              {r.pctExB > 0.5
                ? "→ Fusion à l'ENVERS : la cible prend le contrôle de l'absorbante."
                : "→ Fusion à l'ENDROIT : l'absorbante (ou ses actionnaires) conserve le contrôle."}
            </div>
            <div className="mt-1 text-xs text-slate-500">
              Ce test conditionne la valeur d'apport lorsque les sociétés sont sous contrôle distinct.
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ===================== Coque de l'application ===================== */
const FUSION_VIEWS = [
  { id: "home", label: "Accueil", icon: "🏠" },
  { id: "cours", label: "Cours", icon: "📘" },
  { id: "methode", label: "Méthode", icon: "🧭" },
  { id: "calc", label: "Calculateur", icon: "🧮" },
  { id: "cas", label: "Cas DSCG", icon: "⚖️" },
  { id: "comptes", label: "Mémo comptes", icon: "📇" },
  { id: "quiz", label: "Quiz", icon: "🎯" },
];

function FusionHero() {
  return (
    <div className="rounded-2xl bg-gradient-to-r from-teal-600 to-cyan-600 text-white p-5 shadow mb-4">
      <h2 className="text-xl font-bold">Fusions & opérations assimilées</h2>
      <p className="text-sm text-teal-50 mt-1">
        Fusion-absorption, apport partiel d'actif, scission : évaluation des apports, parité d'échange,
        prime, boni et mali, écritures des deux côtés. Règlement ANC 2017-01, illustré par les annales du DSCG.
      </p>
    </div>
  );
}

function ChapterCard({ ch, onOpen }) {
  return (
    <button onClick={onOpen}
      className="text-left rounded-2xl border border-slate-200 bg-white p-4 hover:border-teal-400 hover:-translate-y-0.5 transition-all shadow-sm w-full">
      <div className="flex items-start gap-3">
        <span className="shrink-0 w-11 h-11 rounded-xl bg-teal-50 border border-teal-100 flex items-center justify-center text-xl">{ch.icon || "📄"}</span>
        <span className="min-w-0 flex-1">
          <span className="block text-[11px] font-mono font-bold text-teal-600">{ch.code}</span>
          <span className="block font-bold text-slate-800 leading-snug">{ch.title}</span>
          {ch.tagline && <span className="block text-xs text-slate-500 mt-1 leading-relaxed"><MdInline text={ch.tagline} /></span>}
          <span className="block text-[11px] text-slate-400 mt-1.5">{(ch.sections || []).length} sections</span>
        </span>
      </div>
    </button>
  );
}

function FusionCours({ pack, open, onOpen }) {
  const lessons = pack.lessons || [];
  const [q, setQ] = useState("");
  const cur = open != null ? lessons[open] : null;
  if (cur) return <LessonView lesson={cur} accent={cur.color || "teal"} onBack={() => onOpen(null)} />;
  const query = q.trim().toLowerCase();
  const shown = query.length < 2 ? lessons : lessons.filter((l) =>
    (l.title + " " + (l.tagline || "") + " " + (l.code || "") + " " +
      (l.sections || []).map((s) => s.title + " " + JSON.stringify(s.blocks || [])).join(" ")).toLowerCase().includes(query));
  return (
    <div>
      <div className="relative mb-4">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Search size={15} /></span>
        <input value={q} onChange={(e) => setQ(e.target.value)}
          placeholder="Rechercher dans le cours (mali technique, parité, scission, contrôle commun…)"
          className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none" />
      </div>
      {query.length >= 2 && <div className="text-xs text-slate-400 mb-2">{shown.length} chapitre(s)</div>}
      <div className="grid sm:grid-cols-2 gap-3">
        {shown.map((l) => <ChapterCard key={l.code} ch={l} onOpen={() => onOpen(lessons.indexOf(l))} />)}
      </div>
    </div>
  );
}

function FusionMethode({ methode }) {
  if (!methode || !methode.length) return null;
  return (
    <div className="space-y-4">
      <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div className="text-sm text-slate-600 leading-relaxed">
          La même séquence résout n'importe quel énoncé de fusion. Déroule-la dans l'ordre : chaque étape
          produit le chiffre dont la suivante a besoin.
        </div>
      </div>
      {methode.map((m, i) => (
        <div key={i} className="rounded-2xl border border-slate-200 bg-white overflow-hidden shadow-sm">
          <div className="px-5 py-3 bg-slate-50 border-b border-slate-100 flex items-center gap-3">
            <span className="w-7 h-7 rounded-lg bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">{i + 1}</span>
            <span className="font-bold text-slate-800">{m.titre}</span>
          </div>
          <div className="p-5">
            {(m.blocks || []).map((b, j) => <LessonBlock key={j} b={b} />)}
          </div>
        </div>
      ))}
    </div>
  );
}

function CasDSCG({ cas }) {
  const [open, setOpen] = useState(0);
  if (!cas || !cas.length) return <div className="text-sm text-slate-400 p-6 text-center">Cas en préparation.</div>;
  return (
    <div>
      <div className="flex flex-wrap gap-1.5 mb-4">
        {cas.map((c, i) => (
          <button key={i} onClick={() => setOpen(i)}
            className={`px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors ${open === i ? "bg-teal-600 text-white border-teal-600" : "bg-white text-slate-600 border-slate-200 hover:border-teal-300"}`}>
            {c.session} · {c.titre}
          </button>
        ))}
      </div>
      {cas[open] && (
        <div className="rounded-2xl border border-slate-200 bg-white overflow-hidden shadow-sm">
          <div className="px-5 py-4 bg-gradient-to-r from-teal-50 to-cyan-50 border-b border-teal-100">
            <div className="text-[11px] font-bold uppercase tracking-wide text-teal-600">DSCG {cas[open].session} — épreuve UE4</div>
            <div className="font-bold text-slate-800 text-lg">{cas[open].titre}</div>
            {cas[open].themes && <div className="text-xs text-slate-500 mt-1">{cas[open].themes.join(" · ")}</div>}
          </div>
          <div className="p-5">
            {(cas[open].blocks || []).map((b, j) => <LessonBlock key={j} b={b} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function MemoComptes({ comptes }) {
  const [q, setQ] = useState("");
  const list = comptes || [];
  const query = q.trim().toLowerCase();
  const shown = query ? list.filter((c) => (c.num + " " + c.nom + " " + (c.usage || "")).toLowerCase().includes(query)) : list;
  return (
    <div>
      <div className="relative mb-4">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Search size={15} /></span>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Chercher un compte (mali, prime, 1042…)"
          className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none" />
      </div>
      <div className="rounded-2xl border border-slate-200 bg-white overflow-hidden shadow-sm">
        <table className="w-full text-sm">
          <thead><tr className="bg-slate-50 text-[11px] uppercase tracking-wide text-slate-400">
            <th className="text-left px-4 py-2 font-semibold">Compte</th>
            <th className="text-left px-3 py-2 font-semibold">Intitulé</th>
            <th className="text-left px-4 py-2 font-semibold">Quand l'utiliser</th>
          </tr></thead>
          <tbody>
            {shown.map((c, i) => (
              <tr key={i} className={`border-t border-slate-100 align-top ${i % 2 ? "bg-slate-50/40" : ""}`}>
                <td className="px-4 py-2 font-mono font-bold text-teal-700 whitespace-nowrap">{c.num}</td>
                <td className="px-3 py-2 text-slate-700 font-medium">{c.nom}</td>
                <td className="px-4 py-2 text-slate-500 text-[13px]"><MdInline text={c.usage || ""} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function FusionHome({ pack, onGo, onOpenLesson }) {
  const lessons = pack.lessons || [];
  return (
    <div>
      <FusionHero />
      <div className="grid sm:grid-cols-3 gap-3 mb-5">
        {[
          { id: "methode", ic: "🧭", t: "La méthode en étapes", d: "La séquence qui résout tout énoncé de fusion." },
          { id: "calc", ic: "🧮", t: "Calculateur", d: "Parité, titres à créer, prime, boni/mali, sens de l'opération." },
          { id: "cas", ic: "⚖️", t: "Cas DSCG corrigés", d: "Les annales décortiquées pas à pas." },
        ].map((c) => (
          <button key={c.id} onClick={() => onGo(c.id)}
            className="text-left rounded-2xl border border-slate-200 bg-white p-4 hover:border-teal-400 hover:-translate-y-0.5 transition-all shadow-sm">
            <div className="text-2xl mb-1">{c.ic}</div>
            <div className="font-bold text-slate-800">{c.t}</div>
            <div className="text-xs text-slate-500 mt-1 leading-relaxed">{c.d}</div>
          </button>
        ))}
      </div>
      <div className="text-sm font-bold text-slate-700 mb-2">📘 Le cours — {lessons.length} chapitres</div>
      <div className="grid sm:grid-cols-2 gap-3">
        {lessons.map((l, i) => <ChapterCard key={l.code} ch={l} onOpen={() => onOpenLesson(i)} />)}
      </div>
    </div>
  );
}

function App() {
  const pack = (typeof window !== "undefined" && window.__FUSION__) || {};
  const [view, setView] = useState("home");
  const [lesson, setLesson] = useState(null);
  const go = (v) => { setView(v); setLesson(null); window.scrollTo(0, 0); };
  const openLesson = (i) => { setView("cours"); setLesson(i); window.scrollTo(0, 0); };

  return (
    <div className="min-h-screen bg-slate-100">
      <div className="sticky top-0 z-20 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="max-w-[980px] mx-auto px-4 py-2 flex gap-1.5 overflow-x-auto">
          {FUSION_VIEWS.map((v) => (
            <button key={v.id} onClick={() => go(v.id)}
              className={`shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors ${view === v.id ? "bg-teal-600 text-white border-teal-600" : "bg-white text-slate-600 border-slate-200 hover:border-teal-300"}`}>
              <span className="mr-1">{v.icon}</span>{v.label}
            </button>
          ))}
        </div>
      </div>
      <div className="max-w-[980px] mx-auto px-4 py-5">
        {view === "home" && <FusionHome pack={pack} onGo={go} onOpenLesson={openLesson} />}
        {view === "cours" && <FusionCours pack={pack} open={lesson} onOpen={setLesson} />}
        {view === "methode" && <FusionMethode methode={pack.methode} />}
        {view === "calc" && <FusionCalc />}
        {view === "cas" && <CasDSCG cas={pack.cas} />}
        {view === "comptes" && <MemoComptes comptes={pack.comptes} />}
        {view === "quiz" && <LQuiz title="Quiz — fusions" questions={pack.quiz || []} />}
      </div>
    </div>
  );
}

</script>
<script>
(function(){
  var root = document.getElementById('root');
  try {
    var src = document.getElementById('fusion-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
    ReactDOM.createRoot(root).render(React.createElement(App));
  } catch (e) {
    if (root) root.innerHTML = '<div style="padding:40px;font-family:system-ui,sans-serif;color:#b91c1c">Erreur de chargement du module Fusion : ' + (e && e.message ? e.message : e) + '</div>';
    console.error('fusion bootstrap:', e);
  }
})();
</script>
</body>
</html>
