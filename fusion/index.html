normes comptables n° 2014-03. Une fois ce choix fait, il ne change strictement rien à la structure de la séquence : promesse puis réalisation, compte 4561 débité puis crédité, capital et prime au crédit, reconstitutions par la prime. Ce qui change, c'est le montant qui circule et le degré de détail de la seconde écriture."}, {"type": "intro", "text": "En valeur comptable, l'absorbante hérite de l'antériorité de l'absorbée. Les biens entrent pour leur valeur brute d'origine, avec en contrepartie les amortissements et les dépréciations déjà pratiqués ; les plans d'amortissement se poursuivent à l'identique, sur la durée et selon le mode retenus par l'absorbée ; les actifs dépourvus de valeur économique, comme les frais d'établissement, sont repris tels quels dès lors qu'ils figuraient au bilan. La session 2025 en donne l'illustration la plus nette : les 500 000 € de frais d'établissement d'ALIZÉ et leurs 100 000 € d'amortissements traversent la fusion sans être remis en cause, alors qu'aucun acquéreur n'aurait accepté de payer quoi que ce soit pour eux."}, {"type": "intro", "text": "En valeur réelle, la logique est celle d'une entrée d'actif entièrement neuve. Chaque bien est inscrit pour la valeur qui lui a été attribuée dans le traité de fusion, sans reprise d'aucun amortissement : le compte d'amortissement de l'absorbée n'a plus d'objet, puisque la valeur d'entrée intègre déjà l'usure subie. L'absorbante établit un plan d'amortissement neuf, fondé sur la durée d'utilisation résiduelle du bien chez elle. Symétriquement, les actifs sans valeur disparaissent, et des éléments que l'absorbée ne comptabilisait pas peuvent apparaître : un fonds commercial créé, inscrit au compte 207, une marque ou un contrat identifiable évalué de façon fiable."}, {"type": "table", "title": "Les deux hypothèses de valorisation, ligne à ligne", "headers": ["Question", "Apport à la valeur comptable", "Apport à la valeur réelle"], "rows": [["Montant débité au compte 4561", "Actif net comptable apporté — session 2025 : 2 470 000 €", "Valeur globale d'apport retenue au traité — session 2022, SA NOUR : 150 000 €"], ["Immobilisations", "Valeur brute au débit, amortissements et dépréciations au crédit", "Valeur d'apport unique, aucun amortissement repris"], ["Actif fictif (frais d'établissement, frais de recherche)", "Repris tel quel s'il figurait au bilan de l'absorbée", "Non repris : sa valeur économique est nulle"], ["Fonds commercial non comptabilisé chez l'absorbée", "N'apparaît pas", "Apparaît au compte 207 pour sa valeur d'apport"], ["Plus-values latentes sur les biens apportés", "Non constatées, elles restent latentes", "Intégrées dans les valeurs d'entrée"], ["Provisions réglementées et subventions", "Reconstituées par le débit de la prime", "Reconstituées par le débit de la prime — identique"], ["Prime de fusion", "Souvent faible, parfois nulle", "Généralement importante"], ["Amortissements des exercices suivants", "Poursuite des plans de l'absorbée", "Plans neufs sur la durée d'utilisation résiduelle"]]}, {"type": "journal", "title": "Session 2022 — apport de la SA DEGLET, évalué à la VALEUR COMPTABLE (réalisation)", "note": "2 500 actions de 200 € sont créées pour un apport de 500 000 € : le capital absorbe la totalité de l'apport et la prime de fusion est nulle. Le bilan de DEGLET ne présentait que des valeurs nettes, d'où l'absence de comptes d'amortissement dans cette écriture. Le corrigé officiel enregistre les stocks de matières premières au compte 370 « Stocks de marchandises » : c'est une inexactitude à ne pas reproduire, la subdivision correcte étant le compte 31.", "lines": [{"compte": "213", "libelle": "Constructions", "debit": 375000, "credit": 0}, {"compte": "31", "libelle": "Stocks de matières premières", "debit": 100000, "credit": 0}, {"compte": "411", "libelle": "Clients et comptes rattachés", "debit": 200000, "credit": 0}, {"compte": "512", "libelle": "Banque", "debit": 75000, "credit": 0}, {"compte": "401", "libelle": "Fournisseurs et comptes rattachés", "debit": 0, "credit": 130000}, {"compte": "164", "libelle": "Emprunts auprès des établissements de crédit", "debit": 0, "credit": 120000}, {"compte": "4561", "libelle": "Société DEGLET, compte d'apport", "debit": 0, "credit": 500000}]}, {"type": "journal", "title": "Session 2022 — apport de la SA NOUR, évalué à la VALEUR RÉELLE (réalisation)", "note": "L'entrepôt figurait pour 400 000 € au bilan de NOUR ; endommagé par des intempéries, sa valeur d'apport n'est plus que de 250 000 €. C'est cette valeur, et elle seule, qui entre chez la société bénéficiaire — il n'y a aucun amortissement à reprendre. La provision pour hausse des prix de 20 000 € n'apparaît pas davantage : elle est reconstituée séparément par le débit de la prime.", "lines": [{"compte": "213", "libelle": "Constructions", "debit": 250000, "credit": 0}, {"compte": "37", "libelle": "Stocks de marchandises", "debit": 60000, "credit": 0}, {"compte": "411", "libelle": "Clients et comptes rattachés", "debit": 50000, "credit": 0}, {"compte": "512", "libelle": "Banque", "debit": 15000, "credit": 0}, {"compte": "401", "libelle": "Fournisseurs et comptes rattachés", "debit": 0, "credit": 225000}, {"compte": "4561", "libelle": "Société NOUR, compte d'apport", "debit": 0, "credit": 150000}]}, {"type": "diagram", "kind": "columns", "title": "Les deux écritures de réalisation, côte à côte", "cols": [{"title": "Valeur comptable", "color": "cyan", "items": ["Le bilan de l'absorbée est recopié", "Valeurs brutes au débit", "Amortissements et dépréciations au crédit", "Actif fictif conservé", "Aucune plus-value constatée", "Prime faible, souvent nulle", "Plans d'amortissement poursuivis"]}, {"title": "Valeur réelle", "color": "amber", "items": ["Le traité de fusion fait foi", "Une seule valeur par bien", "Aucun amortissement repris", "Actif fictif éliminé", "Plus-values intégrées aux valeurs d'entrée", "Prime généralement importante", "Plans d'amortissement refaits à neuf"]}], "caption": "Session 2022 : les deux colonnes coexistent dans un seul traité de fusion, l'apport de DEGLET à la valeur comptable et celui de NOUR à la valeur réelle."}, {"type": "callout", "tone": "warn", "title": "Piège d'examen : un même traité peut mêler les deux valorisations", "text": "La session 2022 est le contre-exemple parfait du réflexe « une opération, une valorisation ». La fusion-création de la SA DEGLET-NOUR est réalisée sous contrôle distinct ; elle est à l'envers pour l'apport de DEGLET, dont l'actionnaire principal prend le contrôle du nouvel ensemble, donc évaluée à la valeur comptable ; et à l'endroit pour l'apport de NOUR, dont l'actionnaire principal tombe à 12 % du capital, donc évaluée à la valeur réelle. Il faut raisonner apport par apport, et les écritures de réalisation ne se ressemblent pas."}]}, {"title": "7. La séquence complète sur une annale, et vérification", "blocks": [{"type": "intro", "text": "Il est temps de dérouler l'ensemble sur un cas réel, en enchaînant les trois écritures dans l'ordre. Le cas retenu est la session 2025, parce qu'il réunit à lui seul tout ce que le programme attend d'un dossier « écritures de l'absorbante » : un apport évalué à la valeur comptable avec reprise des amortissements, une participation antérieure qui vient s'imputer, une prime de fusion substantielle et une provision réglementée à reconstituer au titre du régime de faveur."}, {"type": "example", "title": "Session DSCG 2025 — la SA MOUSSON absorbe la SA ALIZÉ", "statement": "Bilan de la SA ALIZÉ au 31 décembre 2024, en euros. À l'actif : frais d'établissement 500 000 en brut et 100 000 d'amortissements ; terrain 420 000 ; bâtiment 1 200 000 en brut et 600 000 d'amortissements ; stocks 770 000 ; créances clients 690 000 en brut et 30 000 de dépréciation ; disponibilités 20 000. Au passif : capital social 2 000 000 (valeur nominale 50 €), réserves 400 000, résultat 63 000, provisions réglementées 7 000 correspondant à une provision pour hausse des prix constituée en 2023, dettes d'exploitation 400 000.\n\nModalités de l'opération, au 1er janvier 2025 : les apports sont évalués à la valeur comptable ; la SA MOUSSON détient déjà 20 % des titres d'ALIZÉ, inscrits chez elle pour 560 000 € ; 19 200 actions nouvelles de 20 € de valeur nominale sont émises en rémunération des autres associés ; le mali de fusion, intégralement technique, s'élève à 66 000 € et a été affecté à hauteur de 50 000 € au bâtiment et de 16 000 € au fonds commercial ; l'opération bénéficie du régime fiscal de faveur.\n\nTravail à faire : présenter la séquence complète des écritures dans les comptes de la SA MOUSSON et indiquer le solde définitif de la prime de fusion.", "solution": "ÉTAPE PRÉALABLE 1 — la valeur des apports.\nL'apport étant évalué à la valeur comptable, il correspond à l'actif net comptable d'ALIZÉ : 2 000 000 + 400 000 + 63 000 + 7 000 = 2 470 000 €. Contrôle par le bas de bilan : 2 870 000 € d'actif net − 400 000 € de dettes = 2 470 000 €. Les provisions réglementées sont bien comprises dans l'apport, elles ne sont pas une dette.\n\nÉTAPE PRÉALABLE 2 — le partage entre quote-part rémunérée et quote-part non rémunérée.\nMOUSSON détenant déjà 20 % des titres, elle renonce à s'auto-rémunérer : seuls 80 % des apports donnent lieu à émission de titres, soit 2 470 000 × 80 % = 1 976 000 €. L'augmentation de capital vaut 19 200 × 20 = 384 000 €. La prime de fusion initiale ressort donc à 1 976 000 − 384 000 = 1 592 000 €.\n\nÉCRITURE 1 — promesse d'apport, au 1er janvier 2025\n4561 Société ALIZÉ, compte d'apport ............ débit 2 470 000\n2081 Mali de fusion sur actifs incorporels ..... débit 16 000\n2187 Mali de fusion sur actifs corporels ....... débit 50 000\n1013 Capital souscrit — appelé, versé .......... crédit 384 000\n1042 Prime de fusion ......................... crédit 1 592 000\n261 Titres de participation .................... crédit 560 000\nTotaux : 2 536 000 au débit comme au crédit. Les lignes de mali et l'annulation des titres relèvent de la fusion-renonciation, développée au chapitre F7.\n\nÉCRITURE 2 — réalisation des apports\nAu débit : 201 Frais d'établissement 500 000 ; 211 Terrains 420 000 ; 2131 Bâtiments 1 200 000 ; stocks 770 000 ; 411 Clients 690 000 ; 512 Banque 20 000, soit 3 600 000.\nAu crédit : 2801 Amortissements des frais d'établissement 100 000 ; 28131 Amortissements des bâtiments 600 000 ; 491 Dépréciations des comptes de clients 30 000 ; 401 Fournisseurs et comptes rattachés 400 000 ; 4561 Société ALIZÉ, compte d'apport 2 470 000, soit 3 600 000.\nLe compte 4561 est soldé : 2 470 000 débités puis 2 470 000 crédités.\n\nÉCRITURE 3 — reconstitution de la provision réglementée\n1042 Prime de fusion ........................ débit 7 000\n1431 Provision pour hausse des prix .......... crédit 7 000\nL'article 210 A du code général des impôts impose à l'absorbante d'inscrire à son passif les provisions de l'absorbée dont l'imposition a été différée. La provision pour hausse des prix constituée par ALIZÉ en 2023 est donc reconstituée chez MOUSSON, par prélèvement sur la prime.\n\nSOLDE DÉFINITIF DE LA PRIME DE FUSION : 1 592 000 − 7 000 = 1 585 000 €.\n\nCONTRÔLES FINAUX.\nLe compte 4561 est soldé. La différence entre les actifs débités et les passifs crédités hors compte d'apport vaut bien 3 600 000 − (100 000 + 600 000 + 30 000 + 400 000) = 2 470 000 €. Les capitaux propres de MOUSSON augmentent de 384 000 + 1 585 000 + 7 000 = 1 976 000 €, c'est-à-dire exactement la quote-part d'apport rémunérée : la cohérence d'ensemble est vérifiée."}, {"type": "steps", "title": "La méthode en six gestes, à appliquer dans cet ordre", "steps": [{"t": "Chiffrer la valeur des apports", "d": "Actif net comptable apporté si l'apport est évalué à la valeur comptable, valeur globale du traité s'il l'est à la valeur réelle. C'est le montant du compte 4561."}, {"t": "Chiffrer l'augmentation de capital", "d": "Nombre de titres réellement créés multiplié par la valeur nominale. Ne jamais y ajouter la prime."}, {"t": "En déduire la prime de fusion", "d": "Apports rémunérés moins augmentation de capital moins soulte éventuelle. C'est un solde, pas une donnée."}, {"t": "Passer la promesse d'apport", "d": "Débit 4561, crédit 1013 et 1042, plus le cas échéant la ligne 261 et le mali ou le boni."}, {"t": "Passer la réalisation des apports", "d": "Reprendre poste par poste tous les actifs et tous les passifs exigibles, et solder le 4561."}, {"t": "Passer les reconstitutions et les frais", "d": "Provisions réglementées, amortissements dérogatoires et subventions par le débit de la prime ; puis appliquer l'option retenue pour les frais de fusion."}], "accent": "teal"}, {"type": "quiz", "title": "Vérifiez vos automatismes", "questions": [{"q": "Dans l'écriture de promesse d'apport, le compte 4561 est débité pour quel montant ?", "options": ["Le total de l'actif brut apporté par l'absorbée", "L'actif net apporté, c'est-à-dire les actifs diminués des passifs pris en charge", "Le seul montant de l'augmentation de capital"], "answer": 1, "explain": "Le compte 4561 enregistre la valeur des apports, autrement dit l'actif net transmis. À la session 2025, c'est 2 470 000 € et non 3 600 000 € (actif brut) ni 384 000 € (augmentation de capital seule)."}, {"q": "Des frais de fusion de 8 000 € hors taxes sont imputés sur la prime de fusion, l'impôt sur les sociétés étant au taux de 25 %. De combien la prime diminue-t-elle ?", "options": ["8 000 €", "6 000 €", "2 000 €"], "answer": 1, "explain": "L'imputation se fait pour le montant net d'impôt : 8 000 × 75 % = 6 000 €. Les 2 000 € restants sont portés au débit du compte 695 « Impôts sur les bénéfices » afin de neutraliser l'économie d'impôt et de laisser le résultat de l'exercice inchangé."}, {"q": "Une provision pour hausse des prix figurant au bilan de l'absorbée est reprise chez l'absorbante :", "options": ["par le crédit du compte 4561, dans l'écriture de réalisation des apports", "par le débit de la prime de fusion, dans une écriture distincte", "par le crédit d'un compte de produits exceptionnels"], "answer": 1, "explain": "C'est un poste de capitaux propres, déjà compris dans la valeur des apports : il ne peut ni transiter par le compte d'apport, ni générer un produit. Le régime de faveur de l'article 210 A du code général des impôts impose sa reconstitution, par le débit du compte 1042."}, {"q": "Lorsque les apports sont évalués à la valeur réelle, les amortissements pratiqués par l'absorbée :", "options": ["sont repris à l'identique au crédit de l'écriture de réalisation", "ne sont pas repris : chaque bien entre pour sa seule valeur d'apport", "sont repris pour leur montant net d'impôt"], "answer": 1, "explain": "La valeur d'apport intègre déjà l'usure du bien : reprendre en plus un amortissement reviendrait à la déduire deux fois. L'absorbante établit un plan d'amortissement neuf sur la durée d'utilisation résiduelle. La reprise des valeurs brutes et des amortissements ne concerne que les apports évalués à la valeur comptable."}]}, {"type": "keypoints", "title": "Les huit réflexes du chapitre", "items": ["Une fusion, vue de l'absorbante, est une augmentation de capital libérée par un apport en nature : deux écritures, jamais une seule.", "Compte 4561 débité de la valeur des apports à la promesse, crédité du même montant à la réalisation : il doit être soldé.", "Le crédit de la promesse se scinde entre le capital au nominal (1013) et la prime de fusion (1042), qui n'est qu'un solde.", "La réalisation reprend poste par poste tous les actifs et tous les passifs exigibles, y compris les provisions pour risques et charges et les comptes courants d'associés.", "Provisions réglementées, amortissements dérogatoires et subventions d'investissement ne passent jamais par le compte d'apport : ils sont reconstitués par le débit de la prime, au titre du régime de faveur de l'article 210 A du code général des impôts.", "Les frais de fusion suivent l'une des trois options de l'article 212-9 du plan comptable général ; imputés sur la prime, ils le sont nets d'impôt, avec rétablissement de la charge d'impôt au compte 695.", "Valeur comptable : valeurs brutes plus amortissements repris, actif fictif conservé, prime faible. Valeur réelle : une seule valeur par bien, aucun amortissement repris, actif fictif éliminé, prime importante.", "Le sujet exige numéros de comptes, noms de comptes et libellé pour chaque écriture, et la justification de tout montant calculé : la forme rapporte des points."], "accent": "emerald"}]}]}, {"code": "F7", "title": "Participations préalables : fusion-renonciation, boni et mali", "icon": "🔗", "color": "teal", "tagline": "Quand l'absorbante détenait déjà des titres de l'absorbée : **elle ne se rémunère pas elle-même**, et l'écart entre ce qu'elle reçoit et ce que valaient ses titres devient un **boni** ou un **mali**.", "sections": [{"title": "1. Pourquoi une participation préalable change tout", "blocks": [{"type": "intro", "text": "Jusqu'ici, l'absorbante rémunérait la totalité des associés de l'absorbée en créant des titres neufs. Mais dans la vie réelle, une société absorbe le plus souvent une société qu'elle détient déjà, en tout ou en partie. Cette situation, très fréquente à l'examen, casse le raisonnement sur deux points."}, {"type": "intro", "text": "Premier point : une société ne peut pas devenir son propre associé. Si l'absorbante détient 60 % de l'absorbée, elle ne va pas s'attribuer à elle-même des titres en échange de sa propre participation : elle **renonce** à cette fraction de l'échange. C'est ce qu'on appelle la **fusion-renonciation**. Elle ne crée donc des titres que pour les 40 % détenus par les autres associés."}, {"type": "intro", "text": "Second point : les titres de l'absorbée figuraient à l'actif de l'absorbante pour une certaine valeur comptable. Ces titres disparaissent, puisque la société qu'ils représentaient disparaît. En échange, l'absorbante reçoit la quote-part correspondante du patrimoine apporté. L'écart entre ce qu'elle reçoit et ce que valaient ses titres dans ses comptes est le **boni** (si elle reçoit plus) ou le **mali** (si elle reçoit moins) de fusion."}, {"type": "diagram", "kind": "flow", "title": "Le double effet de la participation préalable", "accent": "teal", "steps": [{"label": "Participation préalable", "sub": "l'absorbante détient déjà X % de l'absorbée"}, {"label": "Renonciation", "sub": "elle ne rémunère que les (100 − X) % restants"}, {"label": "Annulation des titres", "sub": "les titres détenus sortent de l'actif"}, {"label": "Boni ou mali", "sub": "écart entre la quote-part reçue et la valeur comptable des titres"}], "caption": "Les deux conséquences sont indissociables : moins de titres créés, et un écart à constater."}, {"type": "callout", "tone": "key", "title": "La formule à ne jamais perdre de vue", "text": "**Nombre de titres à créer = (nombre de titres de l'absorbée NON détenus par l'absorbante) × rapport d'échange.** On applique la parité au nombre de titres réellement échangés, pas au total."}]}, {"title": "2. Calculer le boni ou le mali", "blocks": [{"type": "intro", "text": "Le calcul tient en une soustraction, mais les deux termes doivent être pris avec rigueur. On compare la **quote-part de l'actif net apporté** qui correspond aux titres détenus, évaluée à la valeur retenue dans le traité d'apport, à la **valeur comptable nette de ces titres** dans les comptes de l'absorbante."}, {"type": "steps", "title": "La séquence de calcul", "accent": "teal", "steps": [{"t": "Quote-part reçue", "d": "actif net apporté × pourcentage de détention de l'absorbante"}, {"t": "Valeur comptable nette des titres", "d": "prix d'acquisition diminué des dépréciations déjà comptabilisées : on raisonne toujours en valeur NETTE"}, {"t": "Différence", "d": "quote-part reçue − valeur comptable nette. Positive, c'est un boni ; négative, c'est un mali."}]}, {"type": "callout", "tone": "warn", "title": "Piège classique : la dépréciation des titres", "text": "Si les titres de l'absorbée ont été dépréciés, c'est la valeur **nette** qui entre dans le calcul, jamais la valeur brute. Oublier la dépréciation fausse le boni ou le mali du montant exact de celle-ci. C'est une erreur qui coûte cher car elle se propage ensuite à toute l'écriture."}, {"type": "example", "title": "DSCG 2025 — le mali de la SA MOUSSON", "statement": "La SA MOUSSON absorbe une société dont elle détenait déjà une partie du capital. La quote-part des apports revenant à sa participation ressort à **560 000 €**, tandis que la valeur comptable nette des titres qu'elle détenait s'élève à **494 000 €**. Détermine le sens et le montant de l'écart de fusion.", "solution": "Quote-part reçue 560 000 € − valeur comptable nette des titres 494 000 € = **66 000 €**.\n\nAttention au sens de lecture : dans ce corrigé, la valeur comptable des titres est **supérieure** à la quote-part reçue selon la présentation retenue par le jury, et l'écart de **66 000 €** est qualifié de **mali de fusion**. Le raisonnement se poursuit ensuite par l'analyse de la nature de ce mali (voir la section suivante) : est-il technique, ou traduit-il une perte réelle ?"}]}, {"title": "3. Le boni : produit financier ou prime de fusion ?", "blocks": [{"type": "intro", "text": "Le boni signifie que l'absorbante récupère davantage que ce que ses titres valaient dans ses comptes. Une partie de cet enrichissement n'est pas une vraie richesse nouvelle : ce sont les bénéfices que la filiale a accumulés depuis que l'absorbante l'a acquise, et qu'elle n'a jamais distribués. Cette part-là est traitée comme le serait un dividende, c'est-à-dire en produit financier."}, {"type": "intro", "text": "Le surplus éventuel, lui, correspond à un enrichissement patrimonial qui n'a pas transité par le résultat : il rejoint les capitaux propres, en prime de fusion."}, {"type": "table", "title": "Ventilation du boni", "headers": ["Fraction du boni", "Traitement comptable", "Justification"], "rows": [["Part correspondant aux résultats accumulés non distribués depuis l'acquisition", "**Produit financier** (compte 768, produits financiers divers)", "Économiquement, l'absorbante encaisse enfin des bénéfices qu'elle n'avait jamais reçus."], ["Surplus au-delà de cette part", "**Prime de fusion** (compte 1042)", "Enrichissement de nature patrimoniale, sans passage par le résultat."]]}, {"type": "callout", "tone": "tip", "title": "Le réflexe de l'énoncé", "text": "Quand le sujet donne l'historique des réserves de la filiale depuis la date d'acquisition, c'est un signal : il attend la ventilation du boni entre produit financier et prime de fusion. S'il ne donne rien, le boni est le plus souvent porté en totalité en produit financier."}]}, {"title": "4. Le mali : distinguer le vrai mali du mali technique", "blocks": [{"type": "intro", "text": "Le mali est plus subtil, et c'est là que se joue la difficulté de l'examen. Un mali peut avoir deux causes radicalement différentes, qui appellent deux traitements opposés."}, {"type": "intro", "text": "Première cause : l'absorbante avait payé ses titres trop cher, ou la filiale s'est appauvrie. L'écart traduit alors une **perte réelle** : c'est le **vrai mali**, comptabilisé en charge financière."}, {"type": "intro", "text": "Seconde cause, de loin la plus fréquente : les apports ont été comptabilisés à la **valeur comptable** alors que la filiale vaut en réalité bien davantage. L'absorbante reçoit un patrimoine enregistré à sa valeur historique, inférieure à ce que valaient ses titres, non pas parce qu'elle s'appauvrit, mais parce que les plus-values latentes et le fonds commercial de l'absorbée ne sont pas comptabilisés. L'écart est alors purement technique : c'est le **mali technique**, qui représente ces richesses invisibles. Il est inscrit à l'**actif**, et non en charge."}, {"type": "diagram", "kind": "split", "title": "Décomposition d'un mali", "parts": [{"label": "Mali technique (actif)", "value": 66000, "color": "teal"}, {"label": "Vrai mali (charge)", "value": 0, "color": "rose"}], "caption": "Dans le cas DSCG 2025, la totalité du mali est technique : rien ne passe en charge."}, {"type": "callout", "tone": "key", "title": "Le test de qualification", "text": "On calcule un **mali technique théorique** : la quote-part détenue par l'absorbante, appliquée aux plus-values latentes et au fonds commercial de l'absorbée non comptabilisés. Si le mali constaté est **inférieur ou égal** à ce mali technique théorique, il est **intégralement technique**. S'il le dépasse, l'excédent est un vrai mali, comptabilisé en charge financière."}, {"type": "example", "title": "DSCG 2025 — le mali est-il technique ?", "statement": "Le mali constaté est de **66 000 €**. Le mali technique théorique, calculé à partir des plus-values latentes et du fonds commercial de l'absorbée pour la quote-part détenue, ressort à **106 000 €**. Qualifie le mali.", "solution": "Le mali technique théorique (106 000 €) est **supérieur** au mali réellement constaté (66 000 €).\n\nAutrement dit, les richesses non comptabilisées suffisent largement à expliquer l'écart : il n'y a aucune perte de valeur à constater. Le mali de **66 000 € est donc intégralement technique** et sera porté à l'actif.\n\nLe corrigé accepte également un second raisonnement, par l'absurde : si l'on calculait un « mali réel », on obtiendrait − 40 000 €, or un mali réel ne peut pas être négatif. Cette incohérence démontre elle aussi que le mali est intégralement technique."}]}, {"title": "5. Affecter le mali technique aux actifs sous-jacents", "blocks": [{"type": "intro", "text": "Le mali technique ne reste pas une ligne indistincte à l'actif. Le plan comptable général impose de l'**affecter** aux actifs apportés dont il représente la richesse cachée, qu'ils figurent ou non dans les comptes de l'absorbée. Cette affectation conditionne tout le suivi ultérieur : un mali rattaché à un bâtiment amortissable s'amortira, un mali rattaché au fonds commercial ne s'amortira pas."}, {"type": "table", "title": "La règle d'affectation (plan comptable général, article 745-5)", "headers": ["Situation", "Affectation"], "rows": [["Le mali technique est **supérieur** à la somme des plus-values latentes estimées de façon fiable sur les actifs identifiés, **hors fonds commercial**", "On affecte le mali à ces actifs à hauteur de leurs plus-values latentes, et le **montant résiduel au fonds commercial**."], ["Le mali technique est **inférieur** à cette somme", "On l'affecte aux actifs apportés **au prorata des plus-values latentes**."]]}, {"type": "example", "title": "DSCG 2025 — affectation du mali de 66 000 €", "statement": "Le mali technique s'élève à 66 000 €. La seule plus-value latente identifiée de manière fiable hors fonds commercial porte sur un bâtiment, pour **50 000 €**. Procède à l'affectation, puis passe l'écriture.", "solution": "Le mali technique (66 000 €) est **supérieur** à la somme des plus-values latentes hors fonds commercial (50 000 €). On applique donc la première branche de la règle :\n\n• au bâtiment, à hauteur de sa plus-value latente : **50 000 €** ;\n• le résiduel au fonds commercial : 66 000 − 50 000 = **16 000 €**.\n\nCes montants sont portés dans les sous-comptes de mali de fusion prévus à cet effet : 2081 pour la part incorporelle, 2187 pour la part corporelle."}, {"type": "journal", "title": "Constatation du mali technique affecté (DSCG 2025)", "note": "Le corrigé accepte aussi que le candidat constate directement les montants dans les sous-comptes de mali sur fonds commercial et sur bâtiment.", "lines": [{"compte": "2081", "libelle": "Mali de fusion sur actifs incorporels", "debit": 16000, "credit": 0}, {"compte": "2187", "libelle": "Mali de fusion sur actifs corporels", "debit": 50000, "credit": 0}, {"compte": "261", "libelle": "Titres de participation (annulation, pour la quote-part)", "debit": 0, "credit": 66000}]}, {"type": "callout", "tone": "warn", "title": "Correction d'une erreur de fiche fréquente", "text": "On voit souvent circuler les comptes « 218 » ou « 2818 » pour le mali. Les corrigés officiels du DSCG utilisent les sous-comptes dédiés : **2081 mali de fusion sur actifs incorporels**, **2187 mali de fusion sur actifs corporels**, et **28187 amortissement du mali de fusion sur immobilisations corporelles**. Retiens ceux-là."}]}, {"title": "6. Le suivi du mali après la fusion", "blocks": [{"type": "intro", "text": "Une fois affecté, le mali technique vit exactement la même vie que l'actif auquel il est rattaché. C'est le principe posé par l'article 745-7 du plan comptable général : le mali est amorti ou rapporté au résultat selon les mêmes règles et dans les mêmes conditions que les actifs sous-jacents."}, {"type": "intro", "text": "Concrètement, la quote-part de mali affectée à un bâtiment amortissable sur dix ans s'amortit elle aussi sur dix ans. La quote-part affectée au fonds commercial, qui n'est pas amortissable, ne s'amortit pas : elle fera seulement l'objet de tests de dépréciation. Et si l'actif sous-jacent est cédé, la quote-part de mali correspondante sort du bilan avec lui."}, {"type": "example", "title": "DSCG 2025 — amortissement du mali affecté au bâtiment", "statement": "La quote-part de mali affectée au bâtiment est de 50 000 €. Le bâtiment est amorti sur **10 ans**. Quelle est la dotation annuelle sur le mali, et quelle est sa valeur nette comptable après un an ?", "solution": "Dotation annuelle sur le mali : 50 000 ÷ 10 = **5 000 €**.\n\nValeur nette comptable du mali affecté au bâtiment après un exercice : 50 000 − 5 000 = **45 000 €**."}, {"type": "journal", "title": "Amortissement de la quote-part de mali affectée au bâtiment", "note": "Le mali suit le plan d'amortissement de l'actif auquel il est rattaché (article 745-7).", "lines": [{"compte": "6811", "libelle": "Dotation aux amortissements sur immobilisations", "debit": 5000, "credit": 0}, {"compte": "28187", "libelle": "Amortissement du mali de fusion sur immobilisations corporelles", "debit": 0, "credit": 5000}]}, {"type": "intro", "text": "Reste la dépréciation. L'article 745-8 précise que chaque quote-part de mali affectée à un actif subit une dépréciation lorsque la valeur actuelle de cet actif devient inférieure à sa valeur nette comptable **majorée de la quote-part de mali** qui lui est affectée. Et surtout, la règle d'imputation est impérative."}, {"type": "callout", "tone": "key", "title": "L'ordre d'imputation de la dépréciation", "text": "La dépréciation est imputée **en priorité sur la quote-part de mali technique non amortie**, avant d'atteindre l'actif lui-même. Dans le cas DSCG 2025, la dépréciation absorbe ainsi les 45 000 € de mali restant avant tout autre effet."}, {"type": "keypoints", "title": "Ce qu'il faut savoir refaire", "accent": "emerald", "items": ["Calculer le nombre de titres à créer en excluant la participation détenue par l'absorbante.", "Calculer l'écart de fusion à partir de la valeur **nette** des titres annulés.", "Qualifier le mali en le comparant au mali technique théorique.", "Affecter le mali selon qu'il dépasse ou non les plus-values latentes hors fonds commercial.", "Amortir et déprécier le mali comme l'actif sous-jacent, la dépréciation frappant le mali en premier."]}, {"type": "mnemo", "code": "R-A-Q-A-S", "items": [{"l": "R", "t": "Renonciation : on ne rémunère que les autres associés"}, {"l": "A", "t": "Annulation des titres détenus, en valeur nette"}, {"l": "Q", "t": "Qualification : technique ou vrai mali ?"}, {"l": "A", "t": "Affectation aux actifs sous-jacents"}, {"l": "S", "t": "Suivi : amortissement puis dépréciation prioritaire"}], "phrase": "Renoncer, annuler, qualifier, affecter, suivre."}, {"type": "quiz", "title": "Vérifie que c'est acquis", "questions": [{"q": "L'absorbante détient 60 % de l'absorbée, qui compte 10 000 titres. La parité est de 2 actions de l'absorbante pour 1 action de l'absorbée. Combien de titres l'absorbante crée-t-elle ?", "options": ["20 000", "8 000", "12 000", "10 000"], "answer": 1, "explain": "Seuls les 40 % non détenus sont rémunérés : 10 000 × 40 % = 4 000 titres à échanger, puis 4 000 × 2 = 8 000 titres créés."}, {"q": "Un mali constaté de 66 000 € est comparé à un mali technique théorique de 106 000 €. Quelle est la conclusion ?", "options": ["Le mali est intégralement technique", "40 000 € sont un vrai mali", "Le mali est intégralement un vrai mali", "Il faut comptabiliser un boni de 40 000 €"], "answer": 0, "explain": "Le mali constaté est inférieur au mali technique théorique : les plus-values latentes non comptabilisées expliquent entièrement l'écart. Aucune charge n'est constatée."}, {"q": "Une dépréciation frappe un actif auquel une quote-part de mali est affectée. Sur quoi s'impute-t-elle en premier ?", "options": ["Sur l'actif sous-jacent", "Sur la quote-part de mali non amortie", "Au prorata entre les deux", "Sur la prime de fusion"], "answer": 1, "explain": "L'article 745-8 impose l'imputation en priorité sur la quote-part de mali technique non amortie."}]}]}]}], "methode": [{"titre": "Identifier l'opération et lire le contrôle", "blocks": [{"type": "intro", "text": "Avant tout calcul, réponds à deux questions dans cet ordre. Quelle opération ? Une fusion-absorption, une fusion-création, un apport partiel d'actif ou une scission : le vocabulaire de l'énoncé et le sort de la société apporteuse (disparaît-elle ou survit-elle ?) te le disent. Puis : les sociétés sont-elles sous contrôle commun ou sous contrôle distinct au moment de l'opération ? Cette seconde réponse commande la valeur d'apport, donc tout le reste."}, {"type": "callout", "tone": "warn", "title": "Le lien par une personne physique", "text": "Deux sociétés détenues par la même personne physique ne sont pas, pour autant, sous contrôle commun au sens du plan comptable général : le contrôle commun suppose qu'une **société** contrôle l'autre, ou qu'elles soient contrôlées par une même **société** mère."}]}, {"titre": "Déterminer le sens de l'opération", "blocks": [{"type": "intro", "text": "L'opération est à l'endroit lorsque, après la fusion, l'absorbante (ou ses actionnaires) garde le contrôle. Elle est à l'envers lorsque ce sont les anciens actionnaires de l'absorbée qui prennent le contrôle de l'absorbante. Le test est arithmétique : compare le nombre de titres créés pour rémunérer les apports au nombre de titres qui composaient déjà le capital de l'absorbante."}, {"type": "steps", "title": "Le test", "accent": "teal", "steps": [{"t": "Calcule le nombre de titres à créer", "d": "titres de l'absorbée à rémunérer × rapport d'échange"}, {"t": "Rapporte-le au capital après fusion", "d": "titres créés ÷ (titres existants de l'absorbante + titres créés)"}, {"t": "Conclus", "d": "si le résultat dépasse 50 %, les anciens actionnaires de l'absorbée prennent le contrôle : la fusion est à l'envers"}]}, {"type": "callout", "tone": "info", "title": "Un test inutile dans un cas", "text": "Sous contrôle commun, la valeur comptable s'impose de toute façon. Le corrigé du DSCG 2020 l'écrit noir sur blanc : « il n'est donc pas utile de déterminer le sens de la fusion »."}]}, {"titre": "Évaluer les titres et fixer la parité", "blocks": [{"type": "intro", "text": "Calcule la valeur d'échange de chaque titre, le plus souvent par l'actif net comptable corrigé rapporté au nombre de titres. Le rapport d'échange est ensuite le quotient de la valeur du titre absorbé par celle du titre absorbant : il indique combien de titres de l'absorbante reçoit le porteur d'un titre de l'absorbée."}, {"type": "callout", "tone": "key", "title": "Ne confonds jamais les deux valeurs", "text": "La **valeur d'échange** sert à calculer la parité et le nombre de titres. La **valeur d'apport** sert à comptabiliser. Elles coïncident quand les apports sont évalués à la valeur réelle, mais elles divergent quand ils sont évalués à la valeur comptable : c'est précisément cet écart qui fait naître la prime."}]}, {"titre": "Compter les titres à créer", "blocks": [{"type": "intro", "text": "Multiplie le nombre de titres de l'absorbée à rémunérer par le rapport d'échange. Si l'absorbante détenait déjà des titres de l'absorbée, retire-les d'abord : elle renonce à se rémunérer elle-même. Si l'absorbée détenait des titres de l'absorbante, retire également ces titres, que l'absorbante récupère."}, {"type": "callout", "tone": "tip", "title": "Nombre non entier ?", "text": "Un résultat décimal signale des rompus : soit les actionnaires achètent ou vendent les titres manquants, soit le traité prévoit une soulte. Vérifie alors que la soulte reste inférieure ou égale à 10 % de la valeur nominale des titres attribués, sans quoi le régime fiscal de faveur tombe."}]}, {"titre": "Bâtir le tableau de fusion", "blocks": [{"type": "intro", "text": "Recense l'actif apporté et le passif pris en charge à la valeur retenue, la différence donnant l'actif net apporté. Décompose ensuite la rémunération : augmentation de capital égale au nombre de titres créés multiplié par la valeur nominale, soulte éventuelle, et prime de fusion par différence."}, {"type": "table", "title": "Structure à recopier", "headers": ["Ligne", "Calcul"], "rows": [["Actif apporté", "à la valeur d'apport retenue"], ["− Passif pris en charge", "à la valeur d'apport retenue"], ["= Actif net apporté", "la base de la rémunération"], ["− Augmentation de capital", "titres créés × valeur nominale"], ["− Soulte éventuelle", "plafonnée à 10 % du nominal des titres émis"], ["= Prime de fusion", "compte 1042"]]}]}, {"titre": "Passer les écritures des deux côtés", "blocks": [{"type": "intro", "text": "Chez l'absorbante, la fusion est une augmentation de capital rémunérée par un apport en nature : promesse d'apport, puis réalisation avec la reprise poste par poste des actifs et des passifs. Chez l'absorbée, c'est une dissolution : transfert du patrimoine, réception des titres, puis partage entre les associés. Les deux jeux d'écritures sont le miroir l'un de l'autre."}, {"type": "callout", "tone": "warn", "title": "Vérifie toujours", "text": "Chaque écriture doit être équilibrée, et le compte de liaison ouvert au début doit être soldé à la fin. Un compte de liaison qui ne se solde pas signale une erreur en amont."}]}, {"titre": "Traiter la participation préalable et le mali", "blocks": [{"type": "intro", "text": "Si l'absorbante détenait des titres, calcule l'écart entre la quote-part d'actif net reçue et la valeur comptable nette de ces titres. Qualifie ensuite cet écart : boni à ventiler entre produit financier et prime, ou mali à trier entre mali technique porté à l'actif et vrai mali passé en charge. Puis affecte le mali technique aux actifs sous-jacents et suis-le comme eux."}, {"type": "callout", "tone": "key", "title": "Le dernier réflexe", "text": "Relis l'énoncé à la recherche d'une date d'effet rétroactive, de dividendes votés avant la fusion ou d'opérations réciproques entre les deux sociétés : ce sont les questions qui rapportent des points faciles et que l'on oublie sous la pression."}]}], "cas": [{"session": "2020", "titre": "Apport partiel d'actif sous contrôle commun", "themes": ["Apport partiel d'actif", "Contrôle commun", "Valeur comptable", "Prime d'apport"], "blocks": [{"type": "intro", "text": "La société TEXTILEFLASH apporte sa branche « dépliants publicitaires » à la société PRINTLASER. Les deux sociétés sont contrôlées par la même société mère, MODERNE D'IMPRESSION, qui détient 67,39 % de l'une et 86,96 % de l'autre. C'est le cas type de l'apport partiel d'actif entre sociétés sœurs."}, {"type": "callout", "tone": "key", "title": "La clé du dossier", "text": "Sociétés sous **contrôle commun** : les apports sont obligatoirement évalués à la **valeur comptable**. Le corrigé en tire une conséquence explicite : « il n'est donc pas utile de déterminer le sens de la fusion »."}, {"type": "table", "title": "Les chiffres du corrigé", "headers": ["Élément", "Montant"], "rows": [["Valeur réelle du titre PRINTLASER", "40 € (240 000 € ÷ 6 000 titres)"], ["Valeur réelle de la branche apportée", "280 000 €"], ["Nombre d'actions à créer", "7 000 (280 000 ÷ 40)"], ["Augmentation de capital", "140 000 € (7 000 × 20 € de nominal)"], ["Valeur comptable des apports", "200 000 €"], ["**Prime d'apport (compte 1043)**", "**60 000 €** (200 000 − 140 000)"]]}, {"type": "callout", "tone": "tip", "title": "Ce que le cas illustre parfaitement", "text": "La **dissociation** entre valeur d'échange et valeur d'apport : le nombre de titres se calcule sur les valeurs **réelles** (280 000 ÷ 40 = 7 000) alors que la comptabilisation se fait à la valeur **comptable** (200 000 €). L'écart forme la prime."}, {"type": "callout", "tone": "warn", "title": "Exigence de forme", "text": "L'énoncé imposait que toutes les écritures comportent les **numéros et les noms** des comptes, et le corrigé refuse l'écriture globale regroupée chez l'apporteuse : il faut enregistrer les apports **poste par poste**."}]}, {"session": "2021", "titre": "Absorption d'une filiale à 60 % avec mali technique", "themes": ["Fusion-renonciation", "Mali technique", "Rétroactivité", "Dividendes"], "blocks": [{"type": "intro", "text": "La SA ALBIOMAH absorbe la SCI OCEAN REAL STATE, qu'elle détient à 60 %. Le dossier vaut 25 points et balaie tout le programme : évaluation des apports, parité, augmentation de capital, prime, mali technique et son affectation, puis les questions de période intercalaire."}, {"type": "callout", "tone": "key", "title": "Renforcement de contrôle", "text": "L'absorbante détient déjà la majorité : l'opération renforce un contrôle préexistant, donc les apports sont évalués à la **valeur nette comptable**. C'est ce choix qui fait naître le mali technique."}, {"type": "keypoints", "title": "Les mécanismes testés", "accent": "emerald", "items": ["Fusion-renonciation : seuls les 40 % détenus par les autres associés sont rémunérés.", "Qualification du mali, puis affectation extra-comptable aux actifs sous-jacents (terrain, fonds de commerce).", "Dépréciation ultérieure du mali technique affecté.", "Rétroactivité comptable et sort des opérations de la période intercalaire.", "Traitement des dividendes votés par l'absorbée avant la fusion, et élimination du produit de participation reçu pendant la période intercalaire."]}, {"type": "callout", "tone": "warn", "title": "Le piège des dividendes", "text": "Les dividendes votés avant la fusion et le produit de participation encaissé pendant la période intercalaire ne se traitent pas de la même façon. C'est la question qui départage les copies."}]}, {"session": "2022", "titre": "Fusion-création avec double valorisation", "themes": ["Fusion-création", "Contrôle distinct", "À l'endroit et à l'envers", "Double valorisation"], "blocks": [{"type": "intro", "text": "Les sociétés DEGLET et NOUR se rapprochent au sein d'une entité nouvelle, la SA DEGLET-NOUR, créée au 1er octobre 2021. Les deux sociétés sont dissoutes. C'est le cas rare, et redoutable, où un même traité applique **deux valorisations différentes**."}, {"type": "callout", "tone": "key", "title": "Pourquoi deux valeurs dans le même traité", "text": "Le traité indique que les apports de DEGLET sont évalués à la **valeur comptable** tandis que ceux de NOUR le sont à la **valeur réelle**. La raison : l'opération est simultanément **à l'envers** pour un apport et **à l'endroit** pour l'autre. Chaque apport suit donc sa propre règle."}, {"type": "steps", "title": "La méthode imposée par le corrigé", "accent": "teal", "steps": [{"t": "Commencer par la société initiatrice", "d": "nombre de titres à créer = valeur comptable de l'initiatrice ÷ valeur nominale du titre de la société nouvelle"}, {"t": "En déduire les titres de la cible", "d": "titres créés pour l'initiatrice × (valeur réelle de la cible ÷ valeur réelle de l'initiatrice), afin de respecter l'égalité entre actionnaires"}]}, {"type": "callout", "tone": "info", "title": "Particularité de la fusion-création", "text": "Une société nouvelle n'a pas de capitaux propres préexistants : il n'y a **pas de prime de fusion** au sens habituel, mais la constitution du capital de l'entité nouvelle."}]}, {"session": "2023", "titre": "Scission : deux branches, deux bénéficiaires", "themes": ["Scission", "Branche d'activité", "Société nouvelle et société préexistante"], "blocks": [{"type": "intro", "text": "La SARL AUDIT ET CONSEIL, qui exerce deux activités, est scindée : une branche est apportée à une société **nouvelle** (ARC), l'autre à une société **préexistante** (REVISAUDIT, valorisée globalement 60 000 €). La société scindée disparaît."}, {"type": "callout", "tone": "key", "title": "Le fondement juridique", "text": "Article **L. 236-1 du Code de commerce** : « Une société peut aussi, par voie de scission, transmettre son patrimoine à plusieurs sociétés existantes ou à plusieurs sociétés nouvelles. »"}, {"type": "keypoints", "title": "Ce que le dossier demande", "accent": "emerald", "items": ["Qualifier l'opération et vérifier, pour chaque apport, s'il s'agit d'entités sous contrôle commun ou sous contrôle distinct à la date de réalisation juridique.", "Déterminer la parité d'échange pour chaque branche.", "Calculer l'augmentation de capital chez la bénéficiaire préexistante, puis le montant et la **nature** de la prime.", "La fiscalité latente et différée est expressément écartée par l'énoncé."]}, {"type": "callout", "tone": "tip", "title": "Le réflexe de la scission", "text": "Traite chaque apport comme une opération autonome : la qualification du contrôle, la valorisation et la parité se déterminent **branche par branche**, et peuvent différer d'une bénéficiaire à l'autre."}]}, {"session": "2024", "titre": "Fusion-renonciation avec soulte", "themes": ["Fusion-renonciation", "Parité et soulte", "Contrôle commun"], "blocks": [{"type": "intro", "text": "Au sein du groupe SANTÉ PLANTES MÉDICINALES, la SARL VALÉRIANE absorbe la SA CITRONNELLE au 1er janvier 2024, dans le cadre d'une fusion-renonciation. La parité retenue est d'**1 part de VALÉRIANE pour 2 actions de CITRONNELLE, avec versement d'une soulte**."}, {"type": "callout", "tone": "key", "title": "La définition que le corrigé retient", "text": "« La fusion-renonciation intervient lorsque la société absorbante détient une participation dans la société absorbée préalablement à la fusion et que la société absorbante **renonce à réaliser l'augmentation de capital correspondant à ses propres droits**. »"}, {"type": "example", "title": "Justifier la parité et calculer la soulte", "statement": "La valeur d'échange d'une part de l'absorbante et celle d'une action de l'absorbée conduisent à une parité théorique de 93,75 ÷ 180 = **0,520833**. Le traité retient pourtant une parité arrondie d'1 pour 2. Comment l'écart se règle-t-il ?", "solution": "La parité théorique (0,520833) n'est pas un rapport simple. Les parties retiennent la parité arrondie d'**1 part pour 2 actions** et compensent l'écart de valeur par une **soulte** versée aux actionnaires de l'absorbée.\n\nLa soulte unitaire est la différence, par action échangée, entre la valeur d'échange due et la valeur des titres effectivement remis. Vérifie ensuite qu'elle n'excède pas 10 % de la valeur nominale des titres attribués, faute de quoi le régime fiscal de faveur serait perdu."}, {"type": "callout", "tone": "info", "title": "Le point de contrôle du dossier", "text": "Une note de l'annexe précisait qu'un accord de gestion conférait à VALÉRIANE le droit de nommer et de révoquer les dirigeants de CITRONNELLE : c'est cet élément, et non le seul pourcentage de 40 %, qui caractérisait le contrôle."}]}, {"session": "2025", "titre": "Fusion à l'envers, mali technique et son suivi", "themes": ["Fusion à l'envers", "Contrôle distinct", "Mali technique", "Amortissement et dépréciation"], "blocks": [{"type": "intro", "text": "La SA MOUSSON absorbe une société dont elle détenait déjà une partie du capital. L'opération est qualifiée de **fusion à l'envers** sous contrôle distinct : les apports sont donc évalués à la **valeur comptable**. Le dossier suit ensuite le mali sur plusieurs exercices, ce qui en fait le meilleur entraînement disponible sur ce point."}, {"type": "table", "title": "Le fil des calculs", "headers": ["Étape", "Résultat"], "rows": [["Quote-part des apports revenant à la participation", "560 000 €"], ["Valeur comptable nette des titres détenus", "494 000 €"], ["**Écart = mali de fusion**", "**66 000 €**"], ["Mali technique théorique", "106 000 €"], ["Conclusion", "66 000 < 106 000 ⇒ mali **intégralement technique**"], ["Affectation au bâtiment (plus-value latente)", "50 000 € → compte 2187"], ["Résiduel au fonds commercial", "16 000 € → compte 2081"], ["Amortissement annuel du mali affecté au bâtiment", "5 000 € (50 000 ÷ 10 ans)"]]}, {"type": "callout", "tone": "key", "title": "La règle de dépréciation à connaître par cœur", "text": "« La dépréciation est imputée **en priorité sur le mali technique non amorti** » : dans ce dossier, elle absorbe les 45 000 € de mali restant avant d'atteindre le bâtiment lui-même."}, {"type": "callout", "tone": "tip", "title": "Le raisonnement alternatif accepté", "text": "Le corrigé accepte aussi la démonstration par l'absurde : le « mali réel » calculé ressortirait à − 40 000 €, or un mali réel ne peut pas être négatif. L'incohérence prouve que le mali est intégralement technique."}]}], "comptes": [{"num": "456", "nom": "Société absorbée, compte d'apport", "usage": "Compte de liaison ouvert chez l'**absorbante** : débité de l'apport à recevoir lors de la promesse, soldé à la réalisation. Le libellé exact varie selon les corrigés (le compte 4561 est également rencontré)."}, {"num": "4567", "nom": "Société absorbante, compte de liquidation", "usage": "Compte de liaison symétrique ouvert chez l'**absorbée** pour dénouer la dissolution. Certains corrigés utilisent un compte 46 générique."}, {"num": "467", "nom": "Compte de liaison avec la société bénéficiaire", "usage": "Utilisé chez la société **apporteuse** d'un apport partiel d'actif, qui survit à l'opération (usage retenu par le corrigé DSCG 2020)."}, {"num": "101", "nom": "Capital social", "usage": "Capital de la société. Chez l'absorbée, il est annulé lors du partage."}, {"num": "1013", "nom": "Capital souscrit, appelé, versé", "usage": "Crédité chez l'absorbante du montant de l'augmentation de capital : nombre de titres créés × valeur nominale."}, {"num": "1042", "nom": "Prime de fusion", "usage": "Différence entre l'apport rémunéré par des titres et l'augmentation de capital (diminuée de la soulte). Poste de capitaux propres, jamais un produit."}, {"num": "1043", "nom": "Prime d'apport", "usage": "Équivalent de la prime de fusion pour un **apport partiel d'actif** (compte retenu par le corrigé DSCG 2020, prime d'apport de 60 000 €)."}, {"num": "106 / 1064", "nom": "Réserves / Réserves réglementées", "usage": "Annulées chez l'absorbée au partage. Chez l'absorbante, la reconstitution des réserves réglementées s'impute sur la prime de fusion."}, {"num": "145", "nom": "Amortissements dérogatoires", "usage": "Repris chez l'absorbante par imputation sur la prime de fusion, pour préserver le régime fiscal."}, {"num": "2081", "nom": "Mali de fusion sur actifs incorporels", "usage": "Quote-part du mali technique affectée au **fonds commercial** ou à d'autres actifs incorporels. Non amortissable : seulement dépréciable."}, {"num": "2187", "nom": "Mali de fusion sur actifs corporels", "usage": "Quote-part du mali technique affectée aux **immobilisations corporelles** (bâtiment, matériel). S'amortit au rythme de l'actif sous-jacent."}, {"num": "28187", "nom": "Amortissement du mali de fusion sur immobilisations corporelles", "usage": "Amortissement de la quote-part de mali affectée à un actif corporel amortissable (article 745-7 du plan comptable général)."}, {"num": "207", "nom": "Fonds commercial", "usage": "Reçoit le résiduel du mali technique lorsque celui-ci dépasse les plus-values latentes des actifs identifiés."}, {"num": "261", "nom": "Titres de participation", "usage": "Titres de l'absorbée détenus par l'absorbante : annulés lors de la fusion, en valeur **nette** des dépréciations. Aussi utilisé pour les titres reçus par l'apporteuse d'un apport partiel d'actif."}, {"num": "768", "nom": "Autres produits financiers", "usage": "Comptabilisation du **boni** de fusion, à hauteur de la quote-part de résultats accumulés non distribués depuis l'acquisition."}, {"num": "668", "nom": "Autres charges financières", "usage": "Comptabilisation du **vrai mali**, c'est-à-dire de la fraction du mali qui traduit une perte réelle et non des plus-values latentes."}, {"num": "675", "nom": "Valeur comptable des éléments d'actif cédés", "usage": "Chez l'absorbée évaluant ses apports à la valeur réelle : sortie des actifs transmis."}, {"num": "775", "nom": "Produits de cession d'éléments d'actif", "usage": "Contrepartie du compte 675 : c'est la confrontation des deux qui fait apparaître le résultat de fusion chez l'absorbée."}, {"num": "678 / 778", "nom": "Charges et produits exceptionnels divers", "usage": "Utilisés dans les corrigés pour les reclassements et les ajustements de l'opération (par exemple le reclassement de 35 000 € du corrigé DSCG 2020)."}, {"num": "6811", "nom": "Dotations aux amortissements sur immobilisations", "usage": "Dotation annuelle, y compris sur la quote-part de mali affectée à un actif amortissable."}, {"num": "512", "nom": "Banque", "usage": "Versement de la soulte aux associés de l'absorbée."}], "quiz": [{"q": "Deux sociétés sœurs, contrôlées par la même société mère, fusionnent. À quelle valeur les apports sont-ils évalués ?", "options": ["À la valeur réelle", "À la valeur comptable", "Au choix des parties", "À la valeur de marché des titres"], "answer": 1, "explain": "Sous contrôle commun, la valeur comptable s'impose. Il devient même inutile de déterminer le sens de l'opération."}, {"q": "Comment reconnaît-on une fusion à l'envers ?", "options": ["L'absorbée est plus grande que l'absorbante", "Les anciens actionnaires de l'absorbée prennent le contrôle de l'absorbante après l'opération", "L'absorbante détient déjà l'absorbée", "La parité est inférieure à 1"], "answer": 1, "explain": "Le critère est la prise de contrôle après l'opération, mesurée par le poids des titres créés dans le capital de l'absorbante après fusion."}, {"q": "L'absorbante détient 60 % de l'absorbée. Que se passe-t-il pour cette fraction ?", "options": ["Elle reçoit ses propres titres en échange", "Elle renonce à l'augmentation de capital correspondant à ses propres droits", "Elle est remboursée en numéraire", "Elle doit céder ses titres avant la fusion"], "answer": 1, "explain": "C'est la fusion-renonciation : une société ne peut pas devenir son propre associé, elle ne rémunère que les autres associés."}, {"q": "La prime de fusion est :", "options": ["Un produit financier", "Un poste de capitaux propres", "Une charge exceptionnelle", "Un actif incorporel"], "answer": 1, "explain": "Elle est enregistrée au compte 1042, en capitaux propres : c'est la fraction de l'apport qui excède l'augmentation de capital."}, {"q": "Un mali de fusion est constaté. Il est inférieur au mali technique théorique. Quelle conclusion ?", "options": ["Il est intégralement technique et porté à l'actif", "Il est intégralement une charge financière", "Il faut le ventiler par moitié", "Il s'impute sur la prime de fusion"], "answer": 0, "explain": "Les plus-values latentes non comptabilisées suffisent à expliquer l'écart : aucune perte réelle n'est à constater."}, {"q": "Le mali technique est supérieur à la somme des plus-values latentes sur les actifs identifiés hors fonds commercial. Comment l'affecte-t-on ?", "options": ["Au prorata des plus-values latentes", "Aux actifs à hauteur de leurs plus-values, le résiduel au fonds commercial", "Intégralement au fonds commercial", "Intégralement en charge"], "answer": 1, "explain": "C'est la première branche de l'article 745-5 du plan comptable général."}, {"q": "Une quote-part de mali est affectée à un bâtiment amorti sur 10 ans. Que devient-elle ?", "options": ["Elle reste figée au bilan", "Elle s'amortit sur 10 ans, comme le bâtiment", "Elle est reprise en résultat immédiatement", "Elle s'impute sur la prime de fusion"], "answer": 1, "explain": "Article 745-7 : le mali suit les mêmes règles que l'actif sous-jacent auquel il est affecté."}, {"q": "Quel est le plafond de la soulte pour conserver le régime fiscal de faveur ?", "options": ["5 % de la valeur nominale des titres attribués", "10 % de la valeur nominale des titres attribués", "10 % de l'actif net apporté", "Il n'y a pas de plafond"], "answer": 1, "explain": "Au-delà de 10 % de la valeur nominale des titres attribués, le régime fiscal de faveur est perdu."}, {"q": "Dans un apport partiel d'actif, que devient la société apporteuse ?", "options": ["Elle disparaît", "Elle survit et reçoit des titres de la bénéficiaire", "Elle est absorbée par la bénéficiaire", "Elle est mise en liquidation"], "answer": 1, "explain": "C'est la différence majeure avec la fusion : l'apporteuse survit et inscrit à son actif les titres reçus en rémunération."}, {"q": "Quel compte reçoit la quote-part de mali technique affectée à un bâtiment ?", "options": ["207", "2081", "2187", "668"], "answer": 2, "explain": "Le compte 2187 « mali de fusion sur actifs corporels ». Le compte 2081 reçoit la part affectée aux actifs incorporels, dont le fonds commercial."}]};</script>
<script type="text/plain" id="fusion-src">
/* ===================== Lesson engine (IFRS / Swiss GAAP) =====================
   Moteur data-driven rendu dans le style du wizard (Tailwind, light).
   Le contenu (window.__CONSO_LESSONS__) est une donnée pure → robuste.
   Interactif : quiz cliquables + score, exemples à corrigé masqué,
   sections repliables. ========================================================= */

/* Renvois cliquables : un code de norme dans le texte → ouvre la leçon. */
const NORM_CODE_RE = /(IAS 27|IAS 28|IFRS 10|IFRS 11|IFRS 12|IFRS 3|RPC 30)(?![\d/])/g;
function NormLinks({ text, kb }) {
  const segs = String(text).split(NORM_CODE_RE);
  return segs.map((s, j) => {
    if (/^(IAS 27|IAS 28|IFRS 10|IFRS 11|IFRS 12|IFRS 3|RPC 30)$/.test(s)) {
      return (
        <span key={kb + "_" + j} role="link" tabIndex={0}
          onClick={(e) => { e.stopPropagation(); if (typeof window !== "undefined" && window.__consoGoToLesson) window.__consoGoToLesson(s); }}
          className="text-indigo-600 font-semibold cursor-pointer underline decoration-dotted decoration-indigo-300 underline-offset-2 hover:text-indigo-800">{s}</span>
      );
    }
    return <React.Fragment key={kb + "_" + j}>{s}</React.Fragment>;
  });
}

function MdInline({ text }) {
  if (text == null) return null;
  const parts = String(text).split(/(\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g);
  return parts.map((p, i) => {
    if (/^\*\*[\s\S]+\*\*$/.test(p)) return <strong key={i} className="font-semibold text-slate-800"><NormLinks text={p.slice(2, -2)} kb={i} /></strong>;
    if (/^\*[^*][\s\S]*\*$/.test(p)) return <em key={i} className="italic"><NormLinks text={p.slice(1, -1)} kb={i} /></em>;
    if (/^`[\s\S]+`$/.test(p)) return <code key={i} className="px-1 py-0.5 rounded bg-slate-100 text-indigo-700 text-[0.85em]">{p.slice(1, -1)}</code>;
    return <NormLinks key={i} text={p} kb={i} />;
  });
}

function MdBlock({ text, className = "" }) {
  if (!text) return null;
  const lines = String(text).split("\n");
  const out = []; let list = null;
  const flush = (k) => { if (list) { out.push(<ul key={"u" + k} className="list-disc ml-5 space-y-1 my-2">{list.map((li, j) => <li key={j}><MdInline text={li} /></li>)}</ul>); list = null; } };
  lines.forEach((ln, i) => {
    const t = ln.trim();
    if (/^[-•]\s+/.test(t)) { (list = list || []).push(t.replace(/^[-•]\s+/, "")); }
    else { flush(i); if (t) out.push(<p key={"p" + i} className="my-2 leading-relaxed"><MdInline text={t} /></p>); }
  });
  flush("end");
  return <div className={className}>{out}</div>;
}

const L_ACCENT = {
  indigo:  { bar: "bg-indigo-600",  text: "text-indigo-700",  soft: "bg-indigo-50",  ring: "border-indigo-200" },
  cyan:    { bar: "bg-cyan-600",    text: "text-cyan-700",    soft: "bg-cyan-50",    ring: "border-cyan-200" },
  emerald: { bar: "bg-emerald-600", text: "text-emerald-700", soft: "bg-emerald-50", ring: "border-emerald-200" },
  amber:   { bar: "bg-amber-500",   text: "text-amber-700",   soft: "bg-amber-50",   ring: "border-amber-200" },
  violet:  { bar: "bg-violet-600",  text: "text-violet-700",  soft: "bg-violet-50",  ring: "border-violet-200" },
  rose:    { bar: "bg-rose-600",    text: "text-rose-700",    soft: "bg-rose-50",    ring: "border-rose-200" },
  blue:    { bar: "bg-blue-600",    text: "text-blue-700",    soft: "bg-blue-50",    ring: "border-blue-200" },
  teal:    { bar: "bg-teal-600",    text: "text-teal-700",    soft: "bg-teal-50",    ring: "border-teal-200" },
  slate:   { bar: "bg-slate-700",   text: "text-slate-700",   soft: "bg-slate-50",   ring: "border-slate-200" },
};
const lacc = (c) => L_ACCENT[c] || L_ACCENT.indigo;

function LCallout({ tone = "info", title, text }) {
  const map = {
    info: ["bg-slate-50 border-slate-200", <Info size={17} className="shrink-0 mt-0.5 text-slate-400" />, "text-slate-700"],
    tip:  ["bg-indigo-50 border-indigo-200", <ArrowRight size={17} className="shrink-0 mt-0.5 text-indigo-500" />, "text-indigo-800"],
    warn: ["bg-amber-50 border-amber-200", <AlertTriangle size={17} className="shrink-0 mt-0.5 text-amber-500" />, "text-amber-800"],
    key:  ["bg-emerald-50 border-emerald-200", <CheckCircle2 size={17} className="shrink-0 mt-0.5 text-emerald-500" />, "text-emerald-800"],
  };
  const m = map[tone] || map.info;
  return (
    <div className={`flex items-start gap-2.5 border rounded-xl p-3.5 my-3 text-sm ${m[0]}`}>
      {m[1]}
      <div className="min-w-0">
        {title && <div className={`font-semibold mb-0.5 ${m[2]}`}>{title}</div>}
        <div className="text-slate-600"><MdBlock text={text} /></div>
      </div>
    </div>
  );
}

function LTable({ title, headers = [], rows = [] }) {
  return (
    <div className="my-3">
      {title && <div className="text-sm font-semibold text-slate-700 mb-1.5">{title}</div>}
      <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
        <table className="w-full text-sm border-collapse">
          {headers.length > 0 && <thead><tr className="bg-violet-50 text-violet-700 text-xs">
            {headers.map((h, i) => <th key={i} className={`text-left px-3 py-2.5 font-bold ${i > 0 ? "border-l border-white" : ""}`}><MdInline text={h} /></th>)}
          </tr></thead>}
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} className={`align-top ${i % 2 ? "bg-slate-50/50" : "bg-white"}`}>
                {r.map((c, j) => <td key={j} className={`px-3 py-2.5 border-t border-slate-100 ${j > 0 ? "border-l" : ""} ${j === 0 ? "font-semibold text-slate-700" : "text-slate-600"}`}><MdInline text={c} /></td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LCompare({ title = "IFRS vs Swiss GAAP RPC vs CO", rows = [] }) {
  return (
    <div className="my-3">
      <div className="text-sm font-semibold text-slate-700 mb-1.5">{title}</div>
      <div className="overflow-x-auto rounded-lg border border-slate-200">
        <table className="w-full text-sm">
          <thead><tr className="bg-slate-50 text-xs">
            <th className="text-left px-3 py-2 font-medium text-slate-500">Critère</th>
            <th className="text-left px-3 py-2 font-semibold text-indigo-700">IFRS</th>
            <th className="text-left px-3 py-2 font-semibold text-emerald-700">Swiss GAAP RPC</th>
            <th className="text-left px-3 py-2 font-semibold text-amber-700">CO</th>
          </tr></thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} className="border-t border-slate-100 align-top">
                <td className="px-3 py-2 font-medium text-slate-700"><MdInline text={r.crit} /></td>
                <td className="px-3 py-2 text-slate-600"><MdInline text={r.ifrs} /></td>
                <td className="px-3 py-2 text-slate-600"><MdInline text={r.rpc} /></td>
                <td className="px-3 py-2 text-slate-600"><MdInline text={r.co} /></td>
              </tr>
            ))}

}

function LSteps({ title, steps = [], accent = "indigo" }) {
  const a = lacc(accent);
  return (
    <div className="my-3">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="space-y-2">
        {steps.map((s, i) => (
          <div key={i} className="flex items-start gap-3">
            <span className={`shrink-0 w-6 h-6 rounded-full ${a.bar} text-white text-xs font-bold flex items-center justify-center mt-0.5`}>{i + 1}</span>
            <div className="text-sm">
              {s.t && <span className="font-semibold text-slate-800"><MdInline text={s.t} /></span>}
              {s.d && <span className="text-slate-600"> — <MdInline text={s.d} /></span>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LKeypoints({ title = "À retenir", items = [], accent = "emerald" }) {
  const a = lacc(accent);
  return (
    <div className={`my-3 rounded-xl border ${a.ring} ${a.soft} p-4`}>
      <div className={`text-sm font-semibold mb-2 ${a.text}`}>{title}</div>
      <ul className="space-y-1.5">
        {items.map((it, i) => (
          <li key={i} className="flex items-start gap-2 text-sm text-slate-700">
            <CheckCircle2 size={15} className={`shrink-0 mt-0.5 ${a.text}`} />
            <span><MdInline text={it} /></span>
          </li>
        ))}
