<script>window.__FUSION__ = {"overview": {"title": "Fusions & operations assimilees", "intro": "Fusion-absorption, fusion-creation, apport partiel d'actif et scission : evaluation des apports, parite d'echange, prime, boni et mali, ecritures des deux cotes. Programme DSCG UE4, illustre par les annales 2020 a 2025."}, "lessons": [{"code": "F2", "title": "Valeur comptable ou valeur réelle : la règle qui commande tout", "icon": "🧭", "color": "indigo", "tagline": "La valeur d'apport ne se négocie pas : elle se **déduit** de deux questions posées dans l'ordre — **contrôle commun ou contrôle distinct**, puis **opération à l'endroit ou à l'envers**.", "sections": [{"title": "1. Deux valeurs dans le même dossier : l'échange et l'apport", "blocks": [{"type": "intro", "text": "Toute opération de fusion met en jeu deux valeurs différentes pour un même patrimoine, et l'essentiel des erreurs de copie vient de leur confusion. La première est la valeur d'échange : c'est la valeur attribuée à un titre pour déterminer combien de titres de la société bénéficiaire devront être remis en échange d'un titre de la société qui disparaît. Elle est nécessairement une valeur économique, actuelle, réelle — on ne peut pas demander à un actionnaire d'accepter un échange calculé sur des valeurs historiques qui ne représentent plus rien. La seconde est la valeur d'apport : c'est la valeur à laquelle les actifs et les dettes transmis vont être inscrits au bilan de la société qui les reçoit. Celle-là, le plan comptable général ne laisse à personne le soin de la fixer librement."}, {"type": "intro", "text": "La conséquence pratique est déroutante la première fois qu'on la rencontre : on peut parfaitement calculer une parité sur une valeur réelle de 280 000 euros, puis comptabiliser les mêmes apports pour 200 000 euros. Il n'y a là aucune incohérence, parce que les deux calculs ne répondent pas à la même question. L'échange règle un problème d'équité entre les actionnaires : chacun doit recevoir, en titres nouveaux, l'équivalent économique de ce qu'il abandonne. La comptabilisation règle un problème de représentation du patrimoine dans les comptes de la société bénéficiaire. Le règlement de l'Autorité des normes comptables (ANC) n° 2014-03 modifié par le règlement n° 2017-01, qui constitue le plan comptable général, traite ces deux sujets dans deux séries d'articles distinctes et n'établit entre eux aucun lien automatique."}, {"type": "intro", "text": "Pourquoi le plan comptable général impose-t-il la valeur d'apport au lieu de laisser les parties la négocier dans le traité de fusion ? Parce que ce choix détermine mécaniquement les résultats futurs de la société bénéficiaire. Réévaluer les actifs, c'est se créer une base amortissable plus élevée et donc des charges supplémentaires pendant des années ; les reprendre à leur valeur comptable, c'est conserver intactes les plus-values latentes et l'antériorité fiscale. Laisser le choix reviendrait à autoriser un groupe à fabriquer ses résultats en organisant des restructurations purement internes. La règle retenue est donc une règle de substance économique : lorsque l'opération ne fait que déplacer des biens à l'intérieur d'un ensemble déjà contrôlé, rien de nouveau ne s'est produit et l'on ne réévalue pas ; lorsque l'opération fait réellement changer de mains le contrôle d'une entreprise, il y a acquisition et les actifs peuvent être inscrits à leur valeur d'acquisition."}, {"type": "table", "title": "Deux valeurs, deux usages : ne jamais les intervertir", "headers": ["", "Valeur d'échange", "Valeur d'apport"], "rows": [["À quoi elle sert", "Calculer la parité et le nombre de titres à émettre", "Inscrire les actifs et les dettes au bilan de la société bénéficiaire"], ["Nature", "Toujours une valeur réelle ou économique (valeur mathématique intrinsèque, valeur de rendement, moyenne de plusieurs critères)", "Valeur comptable ou valeur réelle, selon la règle du plan comptable général"], ["Qui la fixe", "Les parties, sous le contrôle du commissaire à la fusion, dans le traité de fusion", "Le plan comptable général : le traité ne fait que constater le résultat de la règle"], ["Où on la lit dans le sujet", "« valeur globale d'échange », « les titres sont estimés à la valeur mathématique intrinsèque »", "Nulle part directement : elle se déduit de l'analyse du contrôle"], ["Erreur classique", "Calculer la parité sur la valeur comptable", "Comptabiliser les apports pour le montant qui a servi à la parité"]]}, {"type": "callout", "tone": "key", "title": "La phrase à écrire sur la copie", "text": "La valeur d'échange sert à déterminer combien de titres seront créés ; la valeur d'apport sert à déterminer pour quel montant le patrimoine reçu entre au bilan. Les deux peuvent différer, et l'écart entre le montant comptabilisé et l'augmentation de capital constitue précisément la prime de fusion ou d'apport."}, {"type": "example", "title": "DSCG 2020 — la dissociation en chiffres", "statement": "La SA MODERNE D'IMPRESSION contrôle la SA TEXTILEFLASH (67,39 % des droits de vote) et la SA PRINTLASER (86,96 %). Le 1er janvier 2019, TEXTILEFLASH apporte à PRINTLASER sa branche d'activité « dépliants publicitaires », dans le cadre d'un apport partiel d'actif (APA). La valeur réelle de la branche apportée s'élève à 280 000 euros ; la valeur comptable des éléments apportés (matériel industriel 240 000 brut moins 42 000 d'amortissements, stocks 35 000, moins emprunts 18 000 et dettes fournisseurs 15 000) s'élève à 200 000 euros. Une action PRINTLASER vaut réellement 40 euros pour une valeur nominale de 20 euros. Combien de titres sont créés, et pour quel montant les apports entrent-ils au bilan de PRINTLASER ?", "solution": "Nombre de titres : il se calcule sur les valeurs réelles, parce qu'il s'agit de rémunérer équitablement l'apporteuse. 280 000 / 40 = 7 000 actions PRINTLASER remises à TEXTILEFLASH.\n\nValeur d'apport : les deux sociétés sont sous le contrôle commun de MODERNE D'IMPRESSION avant l'opération. Le corrigé officiel précise qu'il n'est alors même pas utile de déterminer le sens de l'opération : les apports sont obligatoirement évalués à la valeur comptable, soit 200 000 euros.\n\nConséquences chiffrées :\n— augmentation de capital : 7 000 × 20 = 140 000 euros ;\n— valeur des apports comptabilisée : 200 000 euros ;\n— prime d'apport, par différence : 200 000 − 140 000 = 60 000 euros.\n\nLes 280 000 euros n'apparaissent nulle part dans les écritures. Ils ont servi une seule fois, pour compter les titres. Le candidat qui comptabilise 280 000 euros fait sauter la prime d'apport et toutes les écritures suivantes : c'est le piège central du sujet 2020."}, {"type": "diagram", "kind": "split", "title": "DSCG 2020 — décomposition des 200 000 euros comptabilisés", "parts": [{"label": "Augmentation de capital (7 000 × 20 €)", "value": 140000, "color": "indigo"}, {"label": "Prime d'apport (par différence)", "value": 60000, "color": "amber"}], "caption": "La prime n'est jamais un montant que l'on calcule directement : c'est l'écart entre la valeur d'apport retenue et le nominal des titres émis."}, {"type": "keypoints", "title": "À retenir de la section 1", "items": ["La parité se calcule toujours sur des valeurs réelles ; la valeur d'apport, elle, est imposée par le plan comptable général.", "Valeur d'apport et valeur d'échange peuvent différer : c'est normal, et c'est même le cas le plus fréquent sous contrôle commun.", "Prime de fusion ou d'apport = valeur d'apport retenue − augmentation de capital − soulte éventuelle.", "Sous-jacent économique de la règle : on ne réévalue pas ce qui ne change pas de mains."], "accent": "emerald"}]}, {"title": "2. Première question : contrôle commun ou contrôle distinct ?", "blocks": [{"type": "intro", "text": "La première question à poser, et il faut la poser avant toute autre, est celle de la situation de contrôle des sociétés qui participent à l'opération, appréciée à la date de réalisation juridique de l'opération. Le plan comptable général distingue deux situations et deux seulement. Il y a contrôle commun lorsque l'une des entités participant à l'opération contrôle préalablement l'autre de manière exclusive, ou lorsque les deux entités sont préalablement placées sous le contrôle commun d'une même entité mère. Il y a contrôle distinct dans tous les autres cas, c'est-à-dire lorsque aucune des entités ne contrôle l'autre de façon exclusive et qu'elles ne dépendent pas non plus d'une même mère."}, {"type": "callout", "tone": "info", "title": "Le texte, article 741-1 du plan comptable général", "text": "Les opérations sous contrôle commun sont celles où « une des entités participant à l'opération contrôle préalablement l'autre de manière exclusive ou les deux entités sont préalablement sous le contrôle commun d'une même entité mère ». Le même article ajoute la phrase décisive : « La notion de contrôle commun s'apprécie au niveau des personnes morales, mêmes si elles sont détenues par la ou les mêmes personnes physiques. »"}, {"type": "table", "title": "Les trois configurations à savoir reconnaître dans un énoncé", "headers": ["Configuration", "Illustration en annales", "Qualification", "Suite du raisonnement"], "rows": [["L'une des deux sociétés contrôle l'autre avant l'opération", "DSCG 2021 : la SA ALBIOMAH détient 60 % de la SCI OCEAN REAL STATE qu'elle absorbe", "Contrôle commun", "Valeur comptable — on ne cherche pas le sens"], ["Les deux sociétés dépendent d'une même société mère", "DSCG 2020 : MODERNE D'IMPRESSION contrôle TEXTILEFLASH (67,39 %) et PRINTLASER (86,96 %)", "Contrôle commun", "Valeur comptable — on ne cherche pas le sens"], ["Aucune ne contrôle l'autre et les mères sont différentes", "DSCG 2025 : MOUSSON, filiale de SIROCCO, absorbe ALIZÉ, filiale de LOMBARDE", "Contrôle distinct", "Il faut déterminer le sens de l'opération"]]}, {"type": "intro", "text": "Une précision qui coûte cher chaque année : le contrôle ne se lit pas seulement dans un pourcentage de droits de vote. Le contrôle exclusif peut résulter de la détention de la majorité des droits de vote, mais aussi de la désignation, pendant deux exercices successifs, de la majorité des organes de direction, ou encore d'un contrat ou de clauses statutaires qui donnent le pouvoir de diriger les activités pertinentes. Un énoncé qui prend la peine de vous décrire un accord de gestion ne le fait jamais par hasard."}, {"type": "example", "title": "DSCG 2024 — 40 % et pourtant contrôle commun", "statement": "La SARL VALÉRIANE détient 40 % du capital et des droits de vote de la SA CITRONNELLE. Une note d'annexe précise qu'« un accord de gestion lui confère le droit de nommer, de réaffecter ou de révoquer les principaux dirigeants de la SA CITRONNELLE qui ont la capacité de diriger les activités pertinentes ». VALÉRIANE absorbe CITRONNELLE au 1er janvier 2024, dans le cadre d'une fusion-renonciation. À quelle valeur les apports doivent-ils être évalués ?", "solution": "Le réflexe erroné consiste à raisonner ainsi : 40 % seulement, donc pas de contrôle, donc contrôle distinct, donc valeur réelle. C'est exactement ce que le sujet cherche à sanctionner.\n\nL'accord de gestion confère à VALÉRIANE le pouvoir de nommer et de révoquer les dirigeants qui dirigent les activités pertinentes : elle exerce donc un contrôle exclusif de fait sur CITRONNELLE, ce que confirme d'ailleurs le tableau de périmètre de consolidation du même sujet, où CITRONNELLE est consolidée par intégration globale.\n\nUne des entités participant à l'opération contrôle donc préalablement l'autre de manière exclusive : l'opération est réalisée entre entités sous contrôle commun. Les apports sont évalués à la valeur comptable, soit 100 000 euros, montant des capitaux propres de CITRONNELLE. Aucune recherche du sens de l'opération n'est nécessaire.\n\nRetenir la démarche : on ne conclut jamais au contrôle à partir du seul pourcentage tant qu'on n'a pas lu toutes les notes d'annexe."}, {"type": "callout", "tone": "tip", "title": "Contrôle commun : le raccourci autorisé", "text": "Dès que la réponse à la première question est « contrôle commun », le raisonnement s'arrête : les apports sont évalués à la valeur comptable et il ne faut surtout pas développer une analyse endroit / envers. Le corrigé 2020 l'écrit noir sur blanc : « il n'est donc pas utile de déterminer le sens de la fusion ». L'explication figure à l'article 743-1 du plan comptable général : l'opération correspond à un renforcement ou à un maintien de contrôle et, dans la logique des comptes consolidés, il n'y a pas lieu de réévaluer les actifs et passifs apportés."}, {"type": "intro", "text": "Reste un cas intermédiaire, moins fréquent mais déjà tombé : celui du contrôle conjoint. Lorsque des sociétés placées jusque-là sous des contrôles exclusifs distincts se retrouvent, à l'issue de l'opération, sous le contrôle conjoint de plusieurs associés qui décident ensemble, le plan comptable général raisonne au changement de contrôle : les apports sont évalués à la valeur comptable s'il n'y a aucun changement de contrôle, et à la valeur réelle s'il y a changement de contrôle. Dans la seconde partie du dossier fusion de la session 2021, deux sociétés unipersonnelles contrôlées par deux personnes différentes se rapprochent pour travailler en coopération : il y a bien changement de contrôle, donc apports en valeur réelle."}, {"type": "keypoints", "title": "À retenir de la section 2", "items": ["Le contrôle s'apprécie AVANT l'opération, à la date de réalisation juridique.", "Contrôle commun = l'une contrôle l'autre, OU les deux ont la même mère.", "Contrôle commun ⇒ valeur comptable, sans jamais chercher le sens de l'opération.", "Le contrôle exclusif peut résulter d'un accord de gestion et non d'une majorité de droits de vote (DSCG 2024).", "Contrôle conjoint : la valeur dépend de l'existence ou non d'un changement de contrôle (article 743-2)."], "accent": "indigo"}]}, {"title": "3. Le piège de la personne physique", "blocks": [{"type": "intro", "text": "Voici la règle la plus contre-intuitive du chapitre, et celle que les sujets adorent tester. Lorsqu'une même personne physique détient, directement ou indirectement, les deux sociétés qui fusionnent, on est spontanément tenté de conclure au contrôle commun : après tout, économiquement, c'est bien le même patrimoine familial qui se réorganise. Le plan comptable général en décide autrement. La notion de contrôle commun s'apprécie exclusivement au niveau des personnes morales, même lorsque celles-ci sont détenues par les mêmes personnes physiques. Le contrôle ultime exercé par une ou plusieurs personnes physiques n'est pas pris en considération."}, {"type": "intro", "text": "Il faut comprendre la logique du texte pour ne plus l'oublier. La règle de la valeur comptable sous contrôle commun est empruntée à la logique des comptes consolidés : on ne réévalue pas parce que, dans les comptes du groupe, l'opération serait sans effet. Or une personne physique ne consolide pas. Il n'existe aucun jeu de comptes consolidés au niveau de monsieur X ou de madame Y, donc aucune logique de continuité comptable à préserver. Le texte tire la conséquence de cette absence : là où il n'y a pas de société mère, il n'y a pas de contrôle commun au sens du plan comptable général."}, {"type": "callout", "tone": "warn", "title": "Piège d'examen n° 1", "text": "Un énoncé qui vous présente un organigramme familial est presque toujours un piège. Le raisonnement attendu n'est pas « monsieur NAMUR contrôle les deux, donc contrôle commun, donc valeur comptable partout » : c'est l'inverse. On écarte la personne physique, on regarde les seules personnes morales, et l'on conclut au contrôle distinct — ce qui oblige ensuite à chercher le sens de l'opération. Le candidat qui rate ce point rate mécaniquement toutes les questions suivantes du dossier."}, {"type": "example", "title": "DSCG 2022 et DSCG 2023 — deux façons de tomber dans le piège", "statement": "Cas A (session 2022). Monsieur NAMUR, personne physique, détient 80 % de la SA NAMUR et 65 % de la SA DOYEN. La SA NAMUR détient 70 % de la SA DEGLET ; la SA DOYEN détient 60 % de la SA NOUR. DEGLET et NOUR fusionnent au sein d'une société nouvelle.\n\nCas B (session 2023). La société AUDIT ET CONSEIL est détenue par quatre personnes physiques : Alban (400 parts), Barbara, Cédric et Dimitri (200 parts chacun). Elle se scinde ; la branche commissariat aux comptes est apportée à la société REVISAUDIT, dont Alban est l'associé unique. Alban est donc présent des deux côtés de l'opération.\n\nDans chaque cas, l'opération est-elle sous contrôle commun ?", "solution": "Cas A. On écarte monsieur NAMUR : le contrôle s'apprécie au niveau des personnes morales. Restent la SA NAMUR, actionnaire principal de DEGLET, et la SA DOYEN, actionnaire principal de NOUR. Aucune des deux ne contrôle l'autre et elles ne sont pas sous le contrôle d'une même personne morale. L'opération est donc réalisée sous CONTRÔLE DISTINCT, et il faut déterminer le sens de l'opération pour chaque apport. C'est le pivot de tout le dossier 2022.\n\nCas B. Aucune personne morale ne contrôle quoi que ce soit : seules des personnes physiques détiennent les titres, y compris Alban qui est pourtant présent des deux côtés. Le corrigé conclut que lorsque seules des personnes physiques détiennent les titres des sociétés concernées, c'est la valeur réelle des apports qui doit être retenue — la branche commissariat aux comptes est apportée pour 150 000 euros, sa valeur réelle.\n\nLa nuance à ne pas manquer dans le cas B : le corrigé ajoute que la recherche du sens de l'opération n'a pas lieu d'être. En effet, les articles 742-1 et 742-2 définissent l'opération à l'endroit et à l'envers par référence à « la personne morale, actionnaire principal ». S'il n'existe aucune personne morale actionnaire principal, le test est impossible à conduire : on reste sur la valeur réelle."}, {"type": "callout", "tone": "key", "title": "La séquence complète, y compris le cas dégénéré", "text": "Contrôle commun ⇒ valeur comptable, point final. Contrôle distinct ⇒ on cherche le sens. Mais si le contrôle distinct vient de ce que seules des personnes physiques détiennent les titres, il n'y a pas d'actionnaire principal personne morale à suivre : le test du sens n'a pas d'objet et l'on retient la valeur réelle."}]}, {"title": "4. Deuxième question : à l'endroit ou à l'envers ?", "blocks": [{"type": "intro", "text": "La deuxième question ne se pose que si la première a conclu au contrôle distinct. Elle consiste à identifier qui, économiquement, prend le contrôle de l'ensemble à l'issue de l'opération. Dans le vocabulaire du plan comptable général, on cherche l'entité initiatrice, définie à l'article 730-1 comme celle qui, d'un point de vue économique, prend l'initiative des opérations et prend le contrôle du capital d'une autre entité ou renforce son contrôle sur celui-ci. L'autre entité est la cible."}, {"type": "callout", "tone": "info", "title": "Les deux définitions à connaître par cœur", "text": "Article 742-1 — fusion à l'endroit : fusion à l'issue de laquelle la personne morale, actionnaire principal de l'entité absorbante avant l'opération, conserve, bien que dilué le cas échéant, son pouvoir de contrôle sur l'absorbante. L'initiatrice est l'absorbante, la cible est l'absorbée. Article 742-2 — fusion à l'envers : fusion à l'issue de laquelle la personne morale, actionnaire principal de l'entité absorbée avant l'opération, prend le contrôle de l'entité absorbante, appelée cible. L'initiatrice est alors l'absorbée ou sa maison mère."}, {"type": "intro", "text": "L'idée à retenir est celle d'un renversement juridique. Dans une fusion à l'envers, c'est juridiquement la petite qui absorbe la grosse, ou du moins celle dont l'actionnariat va se retrouver minoritaire qui absorbe celle dont l'actionnariat va prendre le pouvoir. La société absorbante survit juridiquement, mais son actionnaire de contrôle historique se retrouve dilué au profit de l'actionnaire de l'absorbée, qui reçoit tellement de titres nouveaux qu'il prend la majorité. Économiquement, c'est donc l'absorbée qui a acheté l'absorbante, alors que le droit dit le contraire. Le plan comptable général en tire la conséquence : puisque l'initiatrice, l'absorbée, n'est pas réévaluée — elle disparaît juridiquement et ses actifs sont repris —, on maintient ses valeurs comptables."}, {"type": "steps", "title": "Le test du sens de l'opération, en quatre temps", "steps": [{"t": "1. Identifier les actionnaires principaux AVANT", "d": "Repérer, de chaque côté, la personne morale actionnaire principal de l'absorbante et celle de l'absorbée, avec son pourcentage et son nombre de titres. Les personnes physiques sont hors jeu."}, {"t": "2. Compter les titres créés", "d": "Appliquer la parité au nombre de titres à rémunérer. Attention à la fusion-renonciation : si l'absorbante détient déjà une fraction de l'absorbée, seuls les titres détenus par les autres associés sont rémunérés."}, {"t": "3. Reconstituer le capital après l'opération", "d": "Capital après = nombre de titres de l'absorbante avant + nombre de titres créés. C'est le dénominateur commun de tous les pourcentages qui suivent."}, {"t": "4. Recalculer les pourcentages APRÈS", "d": "Pourcentage de l'actionnaire principal de l'absorbante : ses titres inchangés divisés par le capital après. Pourcentage de l'actionnaire principal de l'absorbée : les titres reçus divisés par le même total. S'il conserve le contrôle, l'opération est à l'endroit ; s'il le perd au profit de l'autre, elle est à l'envers."}], "accent": "indigo"}, {"type": "example", "title": "DSCG 2025 — fusion à l'envers sous contrôle distinct", "statement": "La SA MOUSSON (capital 300 000 euros, valeur nominale 20 euros, détenue à 70 % par la SA SIROCCO) absorbe la SA ALIZÉ (capital 2 000 000 euros, valeur nominale 50 euros) au 1er janvier 2025. La SA ALIZÉ est contrôlée à 80 % par la SA LOMBARDE, société totalement extérieure au groupe ; les 20 % restants sont détenus par MOUSSON elle-même, ce qui fait de l'opération une fusion-renonciation. La parité retenue est de 3 titres MOUSSON pour 5 titres ALIZÉ, sans soulte. La valeur réelle d'ALIZÉ ressort à 3 000 000 euros et ses capitaux propres comptables à 2 470 000 euros. Déterminer le mode de valorisation des apports et le montant des apports.", "solution": "Étape 1 — situation de contrôle. MOUSSON ne détient que 20 % d'ALIZÉ : aucune des deux ne contrôle l'autre de manière exclusive. Elles ne sont pas davantage sous le contrôle d'une même mère, MOUSSON étant filiale de SIROCCO et ALIZÉ filiale de LOMBARDE, extérieure au groupe. Le contrôle est donc DISTINCT, et il faut chercher le sens.\n\nÉtape 2 — titres créés. Nombre d'actions ALIZÉ : 2 000 000 / 50 = 40 000. MOUSSON en détient déjà 20 %, soit 8 000, qu'elle ne se rémunère pas à elle-même. Titres à rémunérer : 40 000 − 8 000 = 32 000. Titres créés : 32 000 / 5 × 3 = 19 200 actions.\n\nÉtape 3 — capital après. MOUSSON comptait 300 000 / 20 = 15 000 actions. Après l'opération : 15 000 + 19 200 = 34 200 actions.\n\nÉtape 4 — pourcentages après.\n— SIROCCO conserve ses 10 500 titres (70 % × 15 000) : 10 500 / 34 200 = 30,70 %.\n— LOMBARDE, qui détenait les 32 000 titres ALIZÉ rémunérés, reçoit les 19 200 titres créés : 19 200 / 34 200 = 56,14 %.\n\nConclusion. L'actionnaire principal de l'absorbante perd le contrôle au profit de l'actionnaire principal de l'absorbée : l'initiatrice est ALIZÉ, l'opération est une FUSION À L'ENVERS.\n\nValorisation. Contrôle distinct combiné à une fusion à l'envers : les apports sont évalués à la VALEUR COMPTABLE. Montant des apports = capitaux propres comptables d'ALIZÉ = 2 000 000 (capital) + 400 000 (réserves) + 63 000 (résultat) + 7 000 (provisions réglementées) = 2 470 000 euros. Surtout pas 3 000 000 euros, qui n'est que la valeur d'échange."}, {"type": "callout", "tone": "warn", "title": "Piège d'examen n° 2 : le bon dénominateur", "text": "Dans le cas 2025, le capital après opération est de 34 200 actions et non de 39 000. Un candidat qui oublie la renonciation crée 40 000 / 5 × 3 = 24 000 titres au lieu de 19 200 : les pourcentages deviennent faux, la conclusion sur le sens peut basculer, et tout le dossier suit. Comptez toujours les titres créés AVANT de calculer les pourcentages, et vérifiez que la fraction déjà détenue par l'absorbante a bien été retirée."}, {"type": "example", "title": "Trois cas d'entraînement sur le sens de l'opération", "statement": "Cas 1. La SA ALPHA (10 000 actions, valeur d'échange 300 euros par action, actionnaire principal la société M1 à 80 %) absorbe la SA BÊTA (6 000 actions, valeur d'échange 200 euros, actionnaire principal la société M2 à 90 %). Contrôle distinct.\n\nCas 2. La SA GAMMA (5 000 actions, valeur d'échange 200 euros, actionnaire principal la société M3 à 60 %) absorbe la SA DELTA (8 000 actions, valeur d'échange 250 euros, actionnaire principal la société M4 à 80 %). Contrôle distinct.\n\nCas 3. Mêmes chiffres qu'au cas 2, mais M3 et M4 sont une seule et même société mère qui contrôle GAMMA et DELTA depuis plusieurs années.\n\nDéterminer dans chaque cas la valeur d'apport à retenir.", "solution": "Cas 1. Parité : 200 / 300 = 2/3, soit 2 actions ALPHA pour 3 actions BÊTA. Titres créés : 6 000 × 2/3 = 4 000. Capital après : 10 000 + 4 000 = 14 000 actions. M1 conserve ses 8 000 titres (80 % × 10 000) : 8 000 / 14 000 = 57,14 %, soit toujours la majorité absolue. M2 reçoit 90 % × 4 000 = 3 600 titres : 3 600 / 14 000 = 25,71 %. L'actionnaire principal de l'absorbante conserve son pouvoir de contrôle : FUSION À L'ENDROIT, sous contrôle distinct, donc apports en VALEUR RÉELLE.\n\nCas 2. Parité : 250 / 200 = 5/4, soit 5 actions GAMMA pour 4 actions DELTA. Titres créés : 8 000 × 5/4 = 10 000. Capital après : 5 000 + 10 000 = 15 000 actions. M3 conserve 60 % × 5 000 = 3 000 titres, soit 3 000 / 15 000 = 20 %. M4 reçoit 80 % × 10 000 = 8 000 titres, soit 8 000 / 15 000 = 53,33 %. L'actionnaire de l'absorbante perd le contrôle au profit de celui de l'absorbée : FUSION À L'ENVERS, sous contrôle distinct, donc apports en VALEUR COMPTABLE.\n\nCas 3. Les deux sociétés sont sous le contrôle commun d'une même mère : on s'arrête à la première question. Apports en VALEUR COMPTABLE, sans aucun calcul de pourcentage. Le résultat est le même qu'au cas 2, mais la justification attendue est radicalement différente — et sur une copie, c'est la justification qui est notée, pas le mot « comptable »."}, {"type": "mnemo", "code": "PMA", "items": [{"l": "P", "t": "Personne morale : on ne regarde que les actionnaires personnes morales, jamais les personnes physiques."}, {"l": "M", "t": "Majoritaire avant : identifier l'actionnaire principal de chaque société AVANT l'opération, avec son nombre de titres."}, {"l": "A", "t": "Après : recalculer son pourcentage APRÈS, sur le capital augmenté des titres créés."}], "phrase": "PMA : Personne Morale, avant puis Après. Celui qui garde le contrôle donne le sens de l'opération."}, {"type": "callout", "tone": "tip", "title": "Un filtre rapide, mais qui ne remplace pas le test", "text": "Si le nombre de titres créés reste très inférieur au nombre de titres déjà existants chez l'absorbante, l'ensemble des anciens actionnaires de l'absorbée sera minoritaire et l'opération ne peut pas être à l'envers : au cas 1 ci-dessus, 4 000 titres créés sur 14 000 donnent 28,57 % à l'ensemble des ex-actionnaires de BÊTA. Ce filtre fait gagner du temps, mais il ne suffit jamais à justifier une réponse : le test officiel porte sur l'actionnaire principal nommément désigné, pas sur l'ensemble des anciens actionnaires. Écrivez les deux pourcentages sur la copie."}]}, {"title": "5. L'arbre de décision à quatre branches", "blocks": [{"type": "intro", "text": "Tout ce qui précède se résume à un enchaînement de deux questions, dans un ordre qui n'est jamais interchangeable. La question du contrôle est un aiguillage : selon la réponse, la question du sens se pose ou ne se pose pas. C'est pour cela qu'un candidat qui commence par calculer des pourcentages post-fusion sans avoir qualifié le contrôle perd du temps dans la moitié des sujets, et perd des points dans l'autre moitié."}, {"type": "diagram", "kind": "pyramid", "title": "L'ordre des questions ne se discute pas", "levels": [{"t": "1. Quelle est la situation de contrôle avant l'opération ?", "d": "Commun ou distinct, en ne regardant que les personnes morales. C'est la question qui commande."}, {"t": "2. Si et seulement si le contrôle est distinct : quel est le sens ?", "d": "À l'endroit ou à l'envers, en suivant l'actionnaire principal de l'absorbante."}, {"t": "3. On en déduit la valeur d'apport", "d": "Valeur comptable ou valeur réelle. Ce n'est jamais un choix, toujours une conséquence."}], "caption": "Sous contrôle commun, le niveau 2 est purement et simplement supprimé du raisonnement."}, {"type": "diagram", "kind": "flow", "title": "L'arbre de décision complet", "accent": "indigo", "steps": [{"label": "Les deux sociétés sont-elles sous contrôle commun ?", "sub": "L'une contrôle l'autre, ou même mère. Personnes morales uniquement."}, {"label": "OUI → valeur comptable", "sub": "On s'arrête là. Ne pas chercher le sens : DSCG 2020, 2021, 2024."}, {"label": "NON → contrôle distinct : quel est le sens ?", "sub": "L'actionnaire principal de l'absorbante conserve-t-il le contrôle après ?"}, {"label": "Il le conserve → à l'endroit → valeur réelle", "sub": "Vraie acquisition : les actifs entrent à leur valeur d'acquisition. DSCG 2022 pour l'apport NOUR."}, {"label": "Il le perd → à l'envers → valeur comptable", "sub": "L'absorbée est l'initiatrice : on ne réévalue pas l'initiatrice. DSCG 2025, DSCG 2022 pour l'apport DEGLET."}, {"label": "Contrôle-t-on la libération du capital ?", "sub": "Si la valeur comptable des apports est inférieure au capital à libérer, on bascule en valeur réelle."}], "caption": "Trois branches sur quatre conduisent à la valeur comptable ; une seule conduit à la valeur réelle, à laquelle s'ajoutent les cas où seules des personnes physiques sont actionnaires."}, {"type": "table", "title": "Les quatre branches et leurs annales de référence", "headers": ["Situation de contrôle", "Sens de l'opération", "Valeur d'apport", "Session de référence"], "rows": [["Contrôle commun", "Sans objet — ne pas le rechercher", "Valeur comptable", "DSCG 2020 (apport partiel d'actif), DSCG 2021, DSCG 2024"], ["Contrôle distinct", "À l'endroit", "Valeur réelle", "DSCG 2022, apport de la SA NOUR"], ["Contrôle distinct", "À l'envers", "Valeur comptable", "DSCG 2025 (MOUSSON / ALIZÉ), DSCG 2022, apport de la SA DEGLET"], ["Contrôle distinct parce que seules des personnes physiques détiennent les titres", "Test impossible, sans objet", "Valeur réelle", "DSCG 2023 (scission AUDIT ET CONSEIL)"]]}, {"type": "diagram", "kind": "columns", "title": "Deux mondes, deux logiques", "cols": [{"title": "Valeur comptable", "color": "indigo", "items": ["Contrôle commun, quel que soit le sens", "Contrôle distinct + opération à l'envers", "Justification : continuité, renforcement ou maintien de contrôle", "Les actifs sont repris avec leur antériorité, valeurs brutes et amortissements", "Les actifs fictifs de l'absorbée, tels les frais d'établissement, sont repris eux aussi", "Prime souvent faible, mali fréquemment technique"]}, {"title": "Valeur réelle", "color": "amber", "items": ["Contrôle distinct + opération à l'endroit", "Actionnariat exclusivement composé de personnes physiques", "Contrôle conjoint avec changement de contrôle", "Justification : véritable acquisition, prix payé", "Les actifs entrent réévalués, sans reprise des amortissements antérieurs", "Prime généralement élevée, boni possible"]}], "caption": "La valeur comptable est le régime de droit commun des opérations intra-groupe ; la valeur réelle est celle des acquisitions véritables."}, {"type": "callout", "tone": "key", "title": "Le point le plus contre-intuitif du programme", "text": "Contrôle distinct ne signifie pas valeur réelle. Contrôle distinct signifie seulement qu'il faut chercher le sens. C'est la combinaison contrôle distinct + opération à l'endroit qui conduit à la valeur réelle ; la combinaison contrôle distinct + opération à l'envers ramène à la valeur comptable. Le corrigé 2025 insiste explicitement sur ce point, qui constituait le cœur du dossier."}, {"type": "mnemo", "code": "CODE", "items": [{"l": "C", "t": "Contrôle : commun ou distinct ? Toujours la première question, et elle s'apprécie avant l'opération, entre personnes morales."}, {"l": "O", "t": "Où va le contrôle ? Seulement si le contrôle est distinct : on suit l'actionnaire principal de l'absorbante."}, {"l": "D", "t": "Distinct et à l'enDroit : c'est le seul couple qui donne la valeur réelle."}, {"l": "E", "t": "Exception : si la valeur comptable ne suffit pas à libérer le capital, on retient malgré tout la valeur réelle."}], "phrase": "Le CODE de la valeur d'apport : Contrôle, Où va le contrôle, Distinct-endroit, Exception."}]}, {"title": "6. Quand une même fusion est à l'envers pour l'un et à l'endroit pour l'autre", "blocks": [{"type": "intro", "text": "On croit souvent qu'une opération reçoit une qualification unique et que le traité de fusion retient une seule valeur d'apport. C'est faux, et la session 2022 l'a montré de la manière la plus spectaculaire. Dans une fusion-création, deux sociétés sont dissoutes et une société nouvelle reçoit deux patrimoines. Il y a donc deux apports distincts, chacun venant d'une société différente, avec un actionnaire principal différent. Rien n'oblige les deux à recevoir le même traitement : le sens de l'opération s'apprécie apport par apport, en regardant à chaque fois si l'actionnaire principal de la société dissoute prend ou non le contrôle du nouvel ensemble."}, {"type": "example", "title": "DSCG 2022 — deux valorisations dans un seul traité de fusion", "statement": "Monsieur NAMUR détient 80 % de la SA NAMUR et 65 % de la SA DOYEN. La SA NAMUR détient 70 % de la SA DEGLET (4 000 actions de 100 euros de nominal, actif net comptable 500 000 euros, valeur réelle globale 600 000 euros). La SA DOYEN détient 60 % de la SA NOUR (2 000 actions, valeur réelle globale 150 000 euros). Le 1er octobre 2021, DEGLET et NOUR sont dissoutes et la SA DEGLET-NOUR est créée ; ses actions ont une valeur nominale de 200 euros. Justifier le mode de valorisation retenu pour chacun des deux apports, puis en déduire le nombre de titres à créer.", "solution": "Étape 1 — situation de contrôle. Monsieur NAMUR est une personne physique : on l'écarte. Les actionnaires principaux personnes morales sont la SA NAMUR côté DEGLET et la SA DOYEN côté NOUR. Aucune ne contrôle l'autre : CONTRÔLE DISTINCT. Il faut donc chercher le sens, apport par apport.\n\nÉtape 2 — poids relatif, calculé sur les valeurs réelles. 600 000 / 200 = 3 000 titres pour DEGLET et 150 000 / 200 = 750 titres pour NOUR, soit 3 750 titres au total. Ce comptage provisoire sert à mesurer les pourcentages post-opération.\n\nÉtape 3 — qui prend le contrôle ?\n— SA NAMUR : 70 % × 3 000 = 2 100 titres, soit 2 100 / 3 750 = 56 %. Elle contrôle la société nouvelle. Son actionnaire principal étant celui d'une société dissoute, l'apport de DEGLET est réalisé À L'ENVERS : contrôle distinct + à l'envers ⇒ VALEUR COMPTABLE, soit 500 000 euros.\n— SA DOYEN : 60 % × 750 = 450 titres, soit 450 / 3 750 = 12 %. Elle ne contrôle rien. L'apport de NOUR est réalisé À L'ENDROIT : contrôle distinct + à l'endroit ⇒ VALEUR RÉELLE, soit 150 000 euros.\n\nÉtape 4 — conséquence sur le nombre de titres. Puisque l'apport de l'initiatrice DEGLET n'est comptabilisé que pour 500 000 euros et non 600 000, on ne peut plus émettre 3 000 titres : il n'y aurait pas de quoi libérer le capital. Le traité applique alors la mécanique de rétablissement de l'égalité entre actionnaires : titres de l'initiatrice = valeur comptable de l'initiatrice / valeur nominale = 500 000 / 200 = 2 500 titres ; titres de la cible = titres de l'initiatrice × (valeur réelle de la cible / valeur réelle de l'initiatrice) = 2 500 × (150 000 / 600 000) = 625 titres. Total : 3 125 titres, capital 625 000 euros.\n\nVérification que l'égalité est bien préservée : 2 500 / 3 125 = 80 % pour les anciens actionnaires de DEGLET et 625 / 3 125 = 20 % pour ceux de NOUR ; SA NAMUR 1 750 / 3 125 = 56 % et SA DOYEN 375 / 3 125 = 12 %, soit exactement les pourcentages calculés à l'étape 3.\n\nÉtape 5 — primes. Apport DEGLET : 500 000 euros d'apport pour 2 500 × 200 = 500 000 euros de capital, donc AUCUNE prime. Apport NOUR : 150 000 euros d'apport pour 625 × 200 = 125 000 euros de capital, donc une prime de fusion de 25 000 euros."}, {"type": "table", "title": "DSCG 2022 — la synthèse en une ligne par apport", "headers": ["Apport", "Actionnaire principal", "% après opération", "Sens", "Valeur d'apport", "Prime"], "rows": [["SA DEGLET (initiatrice)", "SA NAMUR", "56 %", "À l'envers", "Valeur comptable : 500 000 €", "Néant"], ["SA NOUR (cible)", "SA DOYEN", "12 %", "À l'endroit", "Valeur réelle : 150 000 €", "25 000 €"]]}, {"type": "callout", "tone": "warn", "title": "Piège d'examen n° 3 : ne pas confondre les deux comptages de titres", "text": "Le sujet 2022 fait calculer deux fois le nombre de titres. Le premier comptage, sur les valeurs réelles, donne 3 750 titres et un capital de 750 000 euros : il ne sert qu'à mesurer les pourcentages de contrôle et à qualifier le sens. Le second, après application de la règle de valorisation, donne 3 125 titres et un capital de 625 000 euros : c'est celui-là, et lui seul, qui alimente les écritures. Un candidat qui repasse en écritures avec 3 000 et 750 titres perd l'intégralité des points de comptabilisation."}, {"type": "intro", "text": "Il faut voir pourquoi cette double valorisation est logique plutôt que bizarre. Du point de vue de la SA NAMUR, rien de nouveau ne s'est produit : elle contrôlait DEGLET, elle contrôle désormais l'ensemble fusionné. Sa position s'est maintenue, donc le patrimoine de DEGLET reste inscrit à ses valeurs historiques. Du point de vue de la SA NAMUR toujours, en revanche, le patrimoine de NOUR est une véritable acquisition : elle met la main sur une société qu'elle ne contrôlait pas, et elle la paie en titres de la société nouvelle. Cette acquisition est donc enregistrée pour ce qu'elle vaut, c'est-à-dire à la valeur réelle. Le traité ne contient pas deux règles contradictoires : il applique deux fois la même règle, à deux apports dont la situation économique diffère."}, {"type": "keypoints", "title": "À retenir de la section 6", "items": ["Le sens s'apprécie apport par apport, jamais globalement, dès qu'une opération met en jeu plusieurs patrimoines.", "Une fusion-création peut donc porter deux valeurs d'apport différentes dans un seul traité.", "L'apport de l'initiatrice n'engendre pas de prime lorsqu'il est retenu en valeur comptable et intégralement absorbé par le capital.", "La mécanique de rétablissement de l'égalité préserve les pourcentages de détention et ne modifie que le nombre de titres."], "accent": "amber"}]}, {"title": "7. L'exception : quand la valeur comptable ne suffit pas à libérer le capital", "blocks": [{"type": "intro", "text": "Reste un garde-fou juridique qui peut renverser le résultat de tout le raisonnement précédent. Le droit des sociétés interdit qu'une augmentation de capital soit rémunérée par des apports d'une valeur inférieure au nominal des titres émis : la société créerait sinon du capital fictif, non couvert par un patrimoine réel. Or la parité, elle, se calcule sur les valeurs d'échange, qui sont des valeurs réelles souvent bien supérieures aux valeurs comptables. Il peut donc arriver que le nombre de titres à émettre, multiplié par leur valeur nominale, dépasse la valeur comptable des apports. Dans ce cas, l'application de la règle de la valeur comptable est matériellement impossible."}, {"type": "intro", "text": "Le plan comptable général prévoit expressément cette hypothèse en marge de la règle d'évaluation à la valeur comptable : lorsque l'actif net comptable apporté est insuffisant pour permettre la libération du capital, les valeurs réelles des éléments apportés doivent être retenues. Il ne s'agit pas d'une option ni d'un arbitrage : c'est une dérogation obligatoire, dont le déclenchement se vérifie par un simple calcul. Attention à ne pas la confondre avec une règle d'évaluation autonome : on ne bascule en valeur réelle que parce que la valeur comptable produirait une situation illicite."}, {"type": "steps", "title": "Comment vérifier l'exception, dans l'ordre", "steps": [{"t": "1. Appliquer la règle normale", "d": "Qualifier le contrôle, puis le cas échéant le sens, et conclure provisoirement à la valeur comptable."}, {"t": "2. Compter les titres et le capital", "d": "Nombre de titres émis, calculé sur les valeurs d'échange, multiplié par la valeur nominale des titres de la société bénéficiaire."}, {"t": "3. Comparer", "d": "Valeur comptable des apports contre montant de l'augmentation de capital. Si la première est supérieure ou égale au second, on en reste à la valeur comptable et l'écart forme la prime."}, {"t": "4. Basculer si nécessaire", "d": "Si la valeur comptable est inférieure au capital à libérer, elle est écartée : les apports sont retenus pour leur valeur réelle, et la prime se recalcule sur cette nouvelle base."}], "accent": "amber"}, {"type": "example", "title": "L'exception en chiffres, et son contre-exemple", "statement": "La SA ORION et la SA VÉGA sont toutes deux contrôlées par la même société mère : l'opération est réalisée sous contrôle commun, donc en principe à la valeur comptable. ORION absorbe VÉGA. Les capitaux propres comptables de VÉGA s'élèvent à 180 000 euros (capital 100 000 euros représenté par 1 000 actions de 100 euros de nominal, réserves 60 000 euros, résultat 20 000 euros). La valeur nominale d'une action ORION est également de 100 euros et sa valeur d'échange de 300 euros.\n\nHypothèse A : la valeur d'échange de VÉGA ressort à 600 000 euros. Hypothèse B : elle ressort à 300 000 euros. Déterminer dans chaque hypothèse la valeur d'apport et la prime de fusion.", "solution": "Hypothèse A.\nValeur d'échange d'une action VÉGA : 600 000 / 1 000 = 600 euros. Parité : 600 / 300 = 2, soit 2 actions ORION pour 1 action VÉGA. Titres à créer : 1 000 × 2 = 2 000 actions. Augmentation de capital : 2 000 × 100 = 200 000 euros.\nComparaison : la valeur comptable des apports, 180 000 euros, est INFÉRIEURE aux 200 000 euros de capital à libérer. La règle du contrôle commun est donc écartée : les apports sont retenus pour leur VALEUR RÉELLE, soit 600 000 euros.\nPrime de fusion : 600 000 − 200 000 = 400 000 euros.\n\nHypothèse B.\nValeur d'échange d'une action VÉGA : 300 000 / 1 000 = 300 euros. Parité : 300 / 300 = 1, soit 1 action ORION pour 1 action VÉGA. Titres à créer : 1 000 actions. Augmentation de capital : 1 000 × 100 = 100 000 euros.\nComparaison : la valeur comptable des apports, 180 000 euros, est SUPÉRIEURE aux 100 000 euros de capital à libérer. Aucune difficulté de libération : on applique la règle normale du contrôle commun et les apports sont retenus pour leur VALEUR COMPTABLE, soit 180 000 euros.\nPrime de fusion : 180 000 − 100 000 = 80 000 euros.\n\nCe qu'il faut voir : le patrimoine de VÉGA est rigoureusement le même dans les deux hypothèses, et la situation de contrôle aussi. Ce qui change, c'est la parité, donc le nombre de titres émis, donc le capital à libérer. L'exception ne dépend pas de l'ampleur des plus-values latentes en soi, mais du rapport entre la valeur comptable des apports et le nominal des titres créés."}, {"type": "callout", "tone": "warn", "title": "Piège d'examen n° 4", "text": "L'exception se vérifie APRÈS avoir compté les titres, jamais avant. Le réflexe à installer : dès qu'un énoncé conduit à la valeur comptable et que l'écart entre valeur réelle et valeur comptable est important, poser la soustraction valeur comptable des apports moins augmentation de capital. Si le résultat est négatif, il ne faut surtout pas comptabiliser une prime négative ni un mali : c'est le signal du basculement en valeur réelle. À l'inverse, ne mentionnez pas l'exception dans un dossier où elle n'a pas lieu de jouer — dans les six sessions étudiées, elle n'a jamais été déclenchée."}, {"type": "callout", "tone": "tip", "title": "Deux réflexes de vérification à conserver", "text": "Premier réflexe : dans une fusion-création, il n'y a normalement pas de prime de fusion sur l'apport de l'initiatrice évalué en valeur comptable, puisque le nombre de titres est précisément calculé pour absorber cet apport. Second réflexe : une prime négative n'existe pas. Si votre calcul en produit une, vous avez soit confondu les deux valeurs, soit oublié une soulte, soit manqué le déclenchement de l'exception de libération du capital."}]}, {"title": "8. Vérification et méthode de copie", "blocks": [{"type": "quiz", "title": "Cinq questions pour verrouiller le chapitre", "questions": [{"q": "Deux sociétés sœurs, contrôlées à 70 % et à 60 % par la même société mère, fusionnent. L'absorbée est trois fois plus grosse que l'absorbante et ses anciens actionnaires détiendront 75 % du nouvel ensemble. À quelle valeur les apports sont-ils évalués ?", "options": ["À la valeur réelle, puisque l'opération est manifestement à l'envers", "À la valeur comptable, sans qu'il y ait lieu de rechercher le sens de l'opération", "À la valeur comptable pour l'absorbante et à la valeur réelle pour l'absorbée"], "answer": 1, "explain": "Les deux sociétés sont sous le contrôle commun d'une même mère : la première question suffit. Le corrigé 2020 précise expressément qu'il n'est pas utile de déterminer le sens de la fusion. Développer une analyse endroit / envers fait perdre du temps et n'apporte aucun point."}, {"q": "Monsieur Martin détient 80 % de la SA A et 70 % de la SA B, qui n'ont aucun lien capitalistique entre elles. La SA A absorbe la SA B. Quelle est la situation de contrôle ?", "options": ["Contrôle commun : les apports sont obligatoirement évalués à la valeur comptable", "Contrôle distinct : il faut déterminer le sens de l'opération avant de conclure", "Contrôle conjoint : les apports sont évalués à la valeur réelle"], "answer": 1, "explain": "Le contrôle commun s'apprécie uniquement au niveau des personnes morales, même lorsque celles-ci sont détenues par la ou les mêmes personnes physiques (article 741-1 du plan comptable général). C'est le pivot du dossier 2022, construit autour de monsieur NAMUR."}, {"q": "Sous contrôle distinct, l'absorbante compte 15 000 actions dont 70 % détenues par la société SIROCCO. Elle émet 19 200 titres nouveaux, intégralement remis à la société LOMBARDE, actionnaire à 80 % de l'absorbée. Quel est le sens de l'opération et la valeur d'apport ?", "options": ["À l'endroit, valeur réelle : SIROCCO reste le premier actionnaire historique", "À l'envers, valeur comptable : SIROCCO tombe à 30,70 % tandis que LOMBARDE atteint 56,14 %", "À l'envers, valeur réelle : le contrôle change donc il y a acquisition"], "answer": 1, "explain": "Capital après opération : 15 000 + 19 200 = 34 200 titres. SIROCCO conserve 10 500 titres soit 30,70 % ; LOMBARDE reçoit 19 200 titres soit 56,14 %. L'actionnaire principal de l'absorbante perd le contrôle : fusion à l'envers. Contrôle distinct combiné à une fusion à l'envers conduit à la valeur comptable, et non à la valeur réelle. C'est le cœur du dossier 2025."}, {"q": "Le raisonnement conduit à la valeur comptable. Les apports ressortent à 180 000 euros en valeur comptable, l'augmentation de capital à 200 000 euros. Que faut-il faire ?", "options": ["Comptabiliser les apports pour 180 000 euros et inscrire l'écart de 20 000 euros en mali de fusion", "Retenir la valeur réelle des apports, la valeur comptable étant insuffisante pour libérer le capital", "Réduire le nombre de titres émis jusqu'à ce que le capital soit couvert"], "answer": 1, "explain": "On ne peut pas émettre du capital non couvert par des apports. Le plan comptable général impose alors de retenir les valeurs réelles des éléments apportés. Le mali de fusion est une notion tout à fait différente : il naît de la comparaison entre la quote-part d'actif net non rémunérée et la valeur comptable des titres de participation détenus par l'absorbante."}, {"q": "Sur quelle base se calcule la parité d'échange ?", "options": ["Sur la valeur d'apport finalement retenue, pour rester cohérent avec les écritures", "Sur la valeur d'échange, c'est-à-dire une valeur réelle, quelle que soit la valeur d'apport retenue", "Sur la valeur nominale des titres des deux sociétés"], "answer": 1, "explain": "La parité protège l'équité entre actionnaires et se calcule donc toujours sur des valeurs économiques. Dans l'apport partiel d'actif de la session 2020, les 7 000 titres sont déterminés sur une valeur réelle de 280 000 euros alors que les apports sont comptabilisés pour 200 000 euros, l'écart de 60 000 euros formant la prime d'apport."}]}, {"type": "steps", "title": "La trame de réponse type, à recopier en trois minutes", "steps": [{"t": "1. Qualifier le contrôle", "d": "Citer l'article 741-1 du plan comptable général, écarter les personnes physiques, indiquer les pourcentages de contrôle des personnes morales avant l'opération, puis conclure : contrôle commun ou contrôle distinct."}, {"t": "2. Si contrôle commun : conclure immédiatement", "d": "Valeur comptable, en visant l'article 743-1 et la logique de renforcement ou de maintien de contrôle. Préciser qu'il n'y a pas lieu de rechercher le sens de l'opération."}, {"t": "3. Si contrôle distinct : chiffrer le sens", "d": "Citer les articles 742-1 et 742-2, poser le nombre de titres créés, le capital après opération, et les deux pourcentages post-opération. Conclure : à l'endroit ou à l'envers."}, {"t": "4. Énoncer la valeur d'apport et la chiffrer", "d": "Valeur réelle si à l'endroit, valeur comptable si à l'envers. Donner le montant : capitaux propres comptables de l'apporteuse pour la valeur comptable, actif net réévalué pour la valeur réelle."}, {"t": "5. Vérifier la libération du capital", "d": "Comparer la valeur d'apport retenue à l'augmentation de capital. Basculer en valeur réelle si la couverture n'est pas assurée, sinon en déduire la prime."}], "accent": "emerald"}, {"type": "callout", "tone": "tip", "title": "Ce que le correcteur note réellement", "text": "Dans tous les corrigés étudiés, les points ne sont pas attribués au mot « comptable » ou « réelle », mais à la démonstration : les pourcentages de contrôle avant, le nombre de titres créés, les pourcentages après, la citation de l'article. Les consignes des sujets sont explicites — « toute information calculée devra être justifiée ». Une réponse juste sans justification chiffrée vaut à peu près zéro ; une réponse fausse avec une démarche entièrement chiffrée récupère souvent l'essentiel des points."}, {"type": "keypoints", "title": "Les huit phrases du chapitre", "items": ["La valeur d'échange sert à la parité, la valeur d'apport sert à la comptabilisation, et elles diffèrent souvent.", "Première question : contrôle commun ou contrôle distinct, apprécié avant l'opération et entre personnes morales uniquement.", "Contrôle commun ⇒ valeur comptable, sans jamais rechercher le sens de l'opération.", "Une personne physique au sommet de l'organigramme ne crée pas de contrôle commun.", "Deuxième question, sous contrôle distinct seulement : l'actionnaire principal de l'absorbante conserve-t-il le contrôle après l'opération ?", "À l'endroit ⇒ valeur réelle ; à l'envers ⇒ valeur comptable, ce qui est le point le plus contre-intuitif du programme.", "Le sens s'apprécie apport par apport : une fusion-création peut porter deux valorisations différentes.", "Exception : si la valeur comptable des apports ne permet pas de libérer le capital, on retient la valeur réelle."], "accent": "indigo"}]}]}, {"code": "F5", "title": "Les écritures chez la société absorbante", "icon": "📥", "color": "teal", "tagline": "Chez l'absorbante, une fusion n'est jamais un achat : c'est une **augmentation de capital libérée par un apport en nature**, enregistrée en deux temps — la promesse d'apport, puis sa réalisation.", "sections": [{"title": "1. La bonne grille de lecture : une augmentation de capital, pas un achat", "blocks": [{"type": "intro", "text": "Quand une société en absorbe une autre, la tentation est de raisonner comme pour une acquisition : je paie un prix, je reçois des actifs. Le raisonnement comptable français est exactement inverse. L'absorbante ne décaisse rien et n'achète rien : elle émet des titres nouveaux et les remet aux associés de la société absorbée. Autrement dit, elle réalise une augmentation de capital dont la libération se fait non pas en numéraire mais par la transmission d'un patrimoine entier, c'est-à-dire par un apport en nature. Toute la séquence d'écritures découle de cette qualification, et de rien d'autre. Si vous gardez ce fil, vous ne vous tromperez ni de compte, ni de sens, ni de montant."}, {"type": "intro", "text": "Le droit des sociétés confirme cette lecture. L'article L. 236-3 du code de commerce prévoit que la fusion entraîne la dissolution sans liquidation de la société absorbée et la transmission universelle de son patrimoine à la société absorbante. Celle-ci reçoit donc, d'un seul mouvement juridique, l'ensemble des éléments d'actif et de passif : elle n'a ni à racheter les biens un par un, ni à faire novation des dettes. La contrepartie de cette transmission est l'attribution de titres nouveaux aux associés de l'absorbée, éventuellement complétée d'une soulte en espèces qui, en application de l'article L. 236-1 du même code, ne peut excéder 10 % de la valeur nominale des titres attribués sous peine de perdre le régime fiscal de faveur."}, {"type": "intro", "text": "De là vient le découpage en deux écritures, qui est celui de toute augmentation de capital. Le premier temps constate l'engagement : l'apporteur souscrit à l'augmentation de capital, et l'absorbante enregistre à son actif une créance sur cet apporteur. Le second temps constate l'exécution de cet engagement : les biens et les dettes entrent réellement dans les comptes, et la créance disparaît. Notez ce que cette mécanique ne comporte pas : aucun compte de charges ni de produits. La fusion ne transite pas par le résultat de l'absorbante, sauf sur deux points marginaux que ce chapitre traitera — le vrai mali, renvoyé au chapitre F7, et le traitement des frais de fusion."}, {"type": "diagram", "kind": "flow", "title": "La séquence complète chez l'absorbante", "accent": "teal", "steps": [{"label": "Traité de fusion", "sub": "Il arrête la valeur des apports, la parité et le nombre de titres à créer"}, {"label": "Promesse d'apport", "sub": "Compte 4561 au débit ; capital 1013 et prime 1042 au crédit"}, {"label": "Réalisation des apports", "sub": "Actifs au débit, passifs pris en charge et compte 4561 au crédit"}, {"label": "Reconstitutions fiscales", "sub": "Provisions réglementées, amortissements dérogatoires et subventions, par le débit de la prime"}, {"label": "Frais de fusion", "sub": "En charges, imputés sur la prime nette d'impôt, ou en frais d'établissement"}], "caption": "Les deux premières étapes sont indissociables : la seconde solde exactement ce que la première a ouvert."}, {"type": "mnemo", "code": "PRIME", "items": [{"l": "P", "t": "Promesse d'apport : le compte 4561 est débité de la valeur des apports"}, {"l": "R", "t": "Réalisation : on solde le 4561 en reprenant poste par poste actifs et passifs"}, {"l": "I", "t": "Imputations sur la prime : provisions réglementées, amortissements dérogatoires, subventions d'investissement"}, {"l": "M", "t": "Mali ou boni : lignes supplémentaires si l'absorbante détenait déjà des titres (chapitre F7)"}, {"l": "E", "t": "Écritures de frais : charges, prime nette d'impôt, ou frais d'établissement"}], "phrase": "La PRIME donne l'ordre des écritures de l'absorbante — et c'est aussi le compte qui absorbe tout ce qui ne rentre nulle part ailleurs."}, {"type": "callout", "tone": "key", "title": "Le compte 456 est un compte de passage, il doit être soldé", "text": "Débité pour la valeur totale des apports au moment de la promesse, il est crédité pour exactement le même montant lors de la réalisation. À la fin de la séquence, son solde doit être nul. Un compte 456 qui ne se solde pas est le symptôme le plus fréquent d'une copie fausse : il signale presque toujours un poste d'actif ou de passif oublié dans la seconde écriture."}]}, {"title": "2. Premier temps : la promesse d'apport", "blocks": [{"type": "intro", "text": "L'absorbante ouvre la séquence en débitant le compte 4561 « Associés — comptes d'apport en société », que les traités et les corrigés intitulent en pratique « Société X, compte d'apport ». Le montant porté à son débit n'est ni le total de l'actif apporté ni le seul montant de l'augmentation de capital : c'est la valeur des apports, c'est-à-dire l'actif net transmis, actifs apportés diminués des passifs pris en charge. À la session 2025, où la SA MOUSSON absorbe la SA ALIZÉ, l'apport évalué à la valeur comptable ressort ainsi à 2 470 000 €, que l'on retrouve par deux chemins : les capitaux propres de l'absorbée (2 000 000 de capital + 400 000 de réserves + 63 000 de résultat + 7 000 de provisions réglementées) ou l'actif net de 2 870 000 € diminué des 400 000 € de dettes d'exploitation."}, {"type": "intro", "text": "En face, le crédit se scinde toujours en deux blocs. Le premier est l'augmentation de capital proprement dite : nombre de titres créés multiplié par leur valeur nominale, et rien d'autre. Elle est portée au compte 1013 « Capital souscrit — appelé, versé », et non aux comptes 1011 ou 1012, parce qu'un apport en nature est par construction intégralement libéré dès la réalisation de la fusion : il n'existe pas d'apport en nature appelé et non versé. Beaucoup de corrigés officiels se contentent d'écrire 101 « Capital social », ce qui est admis en épreuve ; le compte 1013 reste néanmoins la subdivision exacte."}, {"type": "intro", "text": "Le second bloc du crédit est la prime de fusion, compte 1042. Elle n'est pas un profit et n'a jamais rien à voir avec un enrichissement : c'est mécaniquement le surplus de la valeur des apports rémunérés sur la valeur nominale des titres émis. Les associés de l'absorbée reçoivent des titres dont le nominal est inférieur à ce qu'ils apportent, tout simplement parce qu'une action de l'absorbante vaut en réalité davantage que sa valeur nominale ; l'écart est logé dans les capitaux propres au lieu d'être capitalisé, ce qui évite d'avoir à modifier le nominal de toutes les actions existantes. À la session 2025, la quote-part d'apport effectivement rémunérée s'élève à 1 976 000 € (2 470 000 × 80 %, l'absorbante détenant déjà 20 % de l'absorbée) pour une augmentation de capital de 384 000 € (19 200 titres × 20 €) : la prime de fusion initiale est donc de 1 592 000 €."}, {"type": "table", "title": "Anatomie de l'écriture de promesse d'apport", "headers": ["Ligne", "Compte", "Sens", "Montant"], "rows": [["Valeur des apports", "4561 Société absorbée, compte d'apport", "Débit", "Actifs apportés − passifs pris en charge"], ["Augmentation de capital", "1013 Capital souscrit — appelé, versé", "Crédit", "Nombre de titres créés × valeur nominale"], ["Prime de fusion", "1042 Prime de fusion", "Crédit", "Apports rémunérés − augmentation de capital − soulte"], ["Soulte éventuelle", "512 Banque (ou un compte de tiers si elle n'est pas versée immédiatement)", "Crédit", "Au maximum 10 % de la valeur nominale des titres attribués"], ["Annulation de la participation antérieure", "261 Titres de participation", "Crédit", "Valeur nette des titres de l'absorbée déjà détenus — chapitre F7"], ["Mali ou boni de fusion", "2081, 2187, 668 ou 1042 / 768", "Débit ou crédit", "Écart entre la quote-part reçue et le coût des titres — chapitre F7"]]}, {"type": "journal", "title": "Session 2022 — promesse d'apport de la SA NOUR à la SA DEGLET-NOUR", "note": "625 actions de 200 € de valeur nominale sont créées en rémunération d'un apport évalué à sa valeur réelle de 150 000 € : le capital n'en absorbe que 125 000 €, l'écart de 25 000 € constitue la prime de fusion. Aucune ligne de titres ni de mali ici, la société bénéficiaire étant une société nouvelle qui ne détenait aucune participation. Le corrigé officiel note « 456 » à la première ligne et « 4561 » partout ailleurs : retenir 4561.", "lines": [{"compte": "4561", "libelle": "Société NOUR, compte d'apport", "debit": 150000, "credit": 0}, {"compte": "1013", "libelle": "Capital souscrit — appelé, versé", "debit": 0, "credit": 125000}, {"compte": "1042", "libelle": "Prime de fusion", "debit": 0, "credit": 25000}]}, {"type": "callout", "tone": "warn", "title": "Piège d'examen : le montant porté au compte 456", "text": "Ce n'est jamais le total du bilan de l'absorbée. À la session 2025, débiter le compte 456 de 3 600 000 € (total de l'actif brut) ou de 2 870 000 € (total de l'actif net) déséquilibre tout le dossier et fait perdre les points d'écritures en cascade. Le bon montant est l'actif NET apporté, 2 470 000 €. Contrôle rapide : lorsque l'apport est évalué à la valeur comptable, le montant du 456 doit être égal aux capitaux propres apportés ; lorsqu'il est évalué à la valeur réelle, il doit être égal à la valeur globale d'apport retenue au traité."}, {"type": "callout", "tone": "info", "title": "Si l'absorbante détenait déjà des titres de l'absorbée", "text": "L'écriture de promesse s'enrichit alors de deux lignes : le crédit du compte 261 pour solder les titres détenus, et le débit ou le crédit de l'écart qui en résulte, c'est-à-dire le mali ou le boni de fusion. La logique de fusion-renonciation, le partage entre quote-part rémunérée et quote-part non rémunérée, ainsi que le calcul et l'affectation du mali technique font l'objet du chapitre F7. Retenez simplement ici que ces lignes s'insèrent dans l'écriture de promesse, jamais dans celle de réalisation."}]}, {"title": "3. Second temps : la réalisation des apports, poste par poste", "blocks": [{"type": "intro", "text": "La seconde écriture est celle qui donne corps à la transmission universelle du patrimoine. L'absorbante n'inscrit pas un bloc indistinct « patrimoine reçu » : elle reconstitue dans sa propre comptabilité chacun des postes de l'absorbée, en débitant les comptes d'actif et en créditant les comptes de passif exigible. La contrepartie est le compte 4561, qui se trouve ainsi soldé. C'est cette écriture qui fait entrer les terrains, les constructions, les stocks, les créances, la trésorerie, mais aussi les emprunts, les dettes fournisseurs, les dettes fiscales et sociales, les comptes courants d'associés et les provisions pour risques et charges."}, {"type": "intro", "text": "Cette écriture est nécessairement plus longue que la première, et son total n'a aucune raison de coïncider avec la valeur des apports. Le total au débit correspond aux actifs reçus, le total au crédit aux passifs repris augmentés du solde du compte d'apport. À la session 2025, elle s'équilibre à 3 600 000 € — le total de l'actif brut d'ALIZÉ — alors que l'apport ne valait que 2 470 000 €, tout simplement parce que les amortissements et la dépréciation des créances sont repris au crédit et viennent en déduction. Ce décalage est normal ; s'en inquiéter fait perdre du temps."}, {"type": "journal", "title": "Session 2025 — réalisation des apports de la SA ALIZÉ chez la SA MOUSSON (valeur comptable)", "note": "Le compte 4561, débité de 2 470 000 € à l'écriture précédente, est ici crédité du même montant : il est soldé. Les frais d'établissement d'ALIZÉ traversent la fusion parce que l'apport est évalué à la valeur comptable. Le corrigé officiel laisse les stocks au niveau « 3.. » et les dettes d'exploitation au niveau « 4… » sans imposer de subdivision.", "lines": [{"compte": "201", "libelle": "Frais d'établissement", "debit": 500000, "credit": 0}, {"compte": "211", "libelle": "Terrains", "debit": 420000, "credit": 0}, {"compte": "2131", "libelle": "Bâtiments", "debit": 1200000, "credit": 0}, {"compte": "3…", "libelle": "Stocks", "debit": 770000, "credit": 0}, {"compte": "411", "libelle": "Clients et comptes rattachés", "debit": 690000, "credit": 0}, {"compte": "512", "libelle": "Banque", "debit": 20000, "credit": 0}, {"compte": "2801", "libelle": "Amortissements des frais d'établissement", "debit": 0, "credit": 100000}, {"compte": "28131", "libelle": "Amortissements des bâtiments", "debit": 0, "credit": 600000}, {"compte": "491", "libelle": "Dépréciations des comptes de clients", "debit": 0, "credit": 30000}, {"compte": "401", "libelle": "Fournisseurs et comptes rattachés", "debit": 0, "credit": 400000}, {"compte": "4561", "libelle": "Société ALIZÉ, compte d'apport", "debit": 0, "credit": 2470000}]}, {"type": "table", "title": "Ce qui entre — et ce qui n'entre pas — dans l'écriture de réalisation", "headers": ["Poste du bilan de l'absorbée", "Dans l'écriture de réalisation ?", "Pourquoi"], "rows": [["Immobilisations, stocks, créances, trésorerie", "Oui, au débit", "Ce sont les actifs effectivement transmis"], ["Amortissements et dépréciations de ces actifs", "Oui, au crédit, si l'apport est évalué à la valeur comptable", "L'absorbante reprend l'antériorité comptable et fiscale de l'absorbée"], ["Emprunts, fournisseurs, dettes fiscales et sociales, comptes courants d'associés", "Oui, au crédit", "Passifs pris en charge, déjà déduits de la valeur des apports"], ["Provisions pour risques et charges", "Oui, au crédit", "Ce sont de véritables passifs probables — session 2021 : 18 000 € pour un litige avec un locataire"], ["Provisions réglementées et amortissements dérogatoires", "Non", "Postes de capitaux propres : ils sont reconstitués par la prime de fusion (section 4)"], ["Subventions d'investissement", "Non", "Idem : capitaux propres, reconstitués par la prime"], ["Capital, réserves, report à nouveau, résultat de l'absorbée", "Non", "Ils sont remplacés par les titres émis et la prime, ils ne sont jamais repris à l'identique"]]}, {"type": "callout", "tone": "warn", "title": "Valeurs brutes ou valeurs nettes ? Les corrigés eux-mêmes divergent", "text": "À la session 2021, l'écriture de libération des apports reprend les immobilisations pour leur valeur NETTE (constructions 1 000 000 € et non 1 750 000 €, clients 10 000 € et non 17 250 €), au motif qu'un actif entre au bilan pour sa valeur d'apport. À la session 2025, la même écriture reprend les valeurs BRUTES avec les amortissements en contrepartie. Les deux présentations sont acceptées, mais pour un apport évalué à la valeur comptable sous régime de faveur, la présentation en brut et amortissements est la plus sûre : l'administration fiscale l'exige pour le suivi des amortissements différés et pour le calcul des plus-values ultérieures d'après la valeur fiscale que les biens avaient chez l'absorbée. Si vous choisissez la présentation nette, indiquez-le dans le libellé."}, {"type": "callout", "tone": "tip", "title": "Deux contrôles à faire systématiquement", "text": "D'abord vérifier que le montant crédité au compte 4561 dans la seconde écriture est identique au montant débité dans la première : c'est la garantie que la valeur des apports a été correctement décomposée. Ensuite vérifier que la différence entre le total des actifs débités et le total des passifs crédités (hors compte d'apport) est bien égale à la valeur des apports. À la session 2025 : 3 600 000 − (100 000 + 600 000 + 30 000 + 400 000) = 2 470 000 €."}]}, {"title": "4. Les postes que la prime de fusion doit reconstituer", "blocks": [{"type": "intro", "text": "Trois familles de postes figurant au passif de l'absorbée ne sont ni des dettes ni des réserves ordinaires : les provisions réglementées du compte 14, dont les amortissements dérogatoires du compte 145 sont la variété la plus fréquente, et les subventions d'investissement du compte 13. Elles ont en commun de n'exister que pour des raisons fiscales : elles logent en capitaux propres un avantage d'impôt dont l'imposition est simplement différée dans le temps. Une provision pour hausse des prix, un amortissement dérogatoire ou une subvention d'équipement non encore intégralement rapportée au résultat représentent tous une dette d'impôt future, pas une dette actuelle."}, {"type": "intro", "text": "Leur sort en fusion est commandé par le régime fiscal de faveur de l'article 210 A du code général des impôts. En contrepartie de l'exonération immédiate des plus-values d'apport, l'absorbante prend un ensemble d'engagements, dont celui d'inscrire à son passif les provisions de l'absorbée dont l'imposition a été différée et celui de se substituer à elle pour la réintégration ultérieure des résultats. Si l'absorbante omettait ces reconstitutions, l'impôt différé deviendrait immédiatement exigible : l'enjeu n'est pas cosmétique, il est financier. C'est pourquoi le correcteur attend l'écriture même lorsque la question ne la mentionne pas explicitement."}, {"type": "intro", "text": "Reste à trouver la contrepartie. Ce ne peut pas être un produit : on ferait apparaître un profit là où il n'y a qu'un transfert au sein des capitaux propres. Ce ne peut pas davantage être le compte 4561 : ces postes ont déjà été pris en compte, à la hausse, dans la valeur des apports, puisque le calcul de l'actif net apporté ne les retranche pas comme il retranche une dette. À la session 2025, les 7 000 € de provision pour hausse des prix sont bel et bien inclus dans les 2 470 000 € d'apport, et donc dans la prime. La contrepartie logique est par conséquent la prime de fusion elle-même : la reconstitution ne fait que replacer ce montant là où il doit figurer, en le sortant de la prime pour le remettre en provision réglementée."}, {"type": "journal", "title": "Session 2025 — reconstitution de la provision réglementée d'ALIZÉ", "note": "Le corrigé officiel crédite le compte 143 ; la subdivision exacte du plan comptable général pour une provision pour hausse des prix est 1431. La prime de fusion passe ainsi de 1 592 000 € à 1 585 000 € : c'est ce solde, et non la prime initiale, que la question demandait. À la session 2022, la même écriture ramène la prime de 25 000 € à 5 000 € pour une provision pour hausse des prix de 20 000 €.", "lines": [{"compte": "1042", "libelle": "Prime de fusion", "debit": 7000, "credit": 0}, {"compte": "1431", "libelle": "Provision pour hausse des prix", "debit": 0, "credit": 7000}]}, {"type": "table", "title": "Les reconstitutions par le débit de la prime de fusion", "headers": ["Poste figurant chez l'absorbée", "Compte crédité chez l'absorbante", "Observation"], "rows": [["Provision pour hausse des prix", "1431 Provision pour hausse des prix", "Session 2025 : 7 000 € ; session 2022 : 20 000 €"], ["Amortissements dérogatoires", "145 Amortissements dérogatoires", "L'absorbante poursuit ensuite les reprises selon le plan d'origine"], ["Autres provisions réglementées (immobilisations, investissement, provision spéciale de réévaluation)", "142 à 148 selon la nature", "Même mécanique, quelle que soit la subdivision"], ["Réserve réglementée des plus-values à long terme", "1064 Réserves réglementées", "Ce n'est pas une réserve libre : elle est reconstituée à l'identique"], ["Subvention d'investissement non encore intégralement reprise", "131 Subventions d'équipement, pour le montant net restant à rapporter au résultat", "L'absorbante continue ensuite d'en virer chaque année une quote-part au compte 777"]]}, {"type": "callout", "tone": "warn", "title": "Piège d'examen : et si la prime de fusion ne suffit pas ?", "text": "La prime n'est pas un compte extensible. Lorsque le total des imputations dépasse son montant, on ne la rend pas débitrice : on poursuit l'imputation sur les autres réserves disponibles puis sur le report à nouveau. La session 2021 en donne l'illustration : la prime n'était que de 200 €, une imputation de 14 000 € devait être pratiquée, et le corrigé porte donc 13 800 € en report à nouveau débiteur. Retenez le principe ici ; le cas particulier des dividendes qui a produit cette situation relève de la période intercalaire, traitée au chapitre suivant."}, {"type": "keypoints", "title": "À retenir sur les reconstitutions", "items": ["Provisions réglementées, amortissements dérogatoires et subventions d'investissement ne transitent jamais par le compte 456 : ils sont déjà compris dans la valeur des apports.", "Ils ne transitent jamais non plus par un compte de produits : ce serait créer un profit fictif.", "La contrepartie est toujours le débit du compte 1042 « Prime de fusion ».", "Le fondement est l'engagement pris par l'absorbante au titre du régime de faveur de l'article 210 A du code général des impôts.", "La question qui demande « le solde de la prime de fusion » attend le montant APRÈS ces imputations, pas la prime initiale."], "accent": "emerald"}]}, {"title": "5. Les frais de fusion : trois options, une seule subtilité", "blocks": [{"type": "intro", "text": "Les honoraires du commissaire à la fusion, ceux des conseils juridiques, les frais d'annonces légales et les frais d'actes forment ce que l'on appelle les frais de fusion. L'article 212-9 du plan comptable général ouvre trois traitements possibles, sans qu'aucun ne constitue une méthode de référence : la comptabilisation directe en charges, l'imputation sur la prime de fusion, ou l'inscription à l'actif en frais d'établissement amortis sur cinq ans au maximum. Le choix relève de l'entité et doit être appliqué de manière permanente. En épreuve, l'énoncé impose presque toujours l'option retenue : la repérer est le premier réflexe, avant même de commencer l'écriture."}, {"type": "intro", "text": "La première option est sans difficulté. À la session 2022, l'énoncé indiquait que les 3 000 € hors taxes de frais d'actes étaient enregistrés en charges et payés au comptant : l'écriture se limite au débit d'un compte 622 et à la constatation de la taxe sur la valeur ajoutée déductible. Les frais viennent alors diminuer le résultat de l'exercice de la fusion, ce qui est acceptable pour des montants modestes mais devient discutable lorsque l'opération est lourde."}, {"type": "journal", "title": "Session 2022 — frais de fusion comptabilisés en charges", "note": "Taxe sur la valeur ajoutée : 3 000 × 20 % = 600 €. Elle est déductible et n'a donc pas à être supportée par l'entreprise ; elle ne sera jamais imputée sur la prime, quelle que soit l'option retenue pour les frais.", "lines": [{"compte": "6227", "libelle": "Frais d'actes et de contentieux", "debit": 3000, "credit": 0}, {"compte": "44566", "libelle": "État — taxe sur la valeur ajoutée déductible sur autres biens et services", "debit": 600, "credit": 0}, {"compte": "512", "libelle": "Banque", "debit": 0, "credit": 3600}]}, {"type": "intro", "text": "La deuxième option, l'imputation sur la prime de fusion, demande un raisonnement supplémentaire qui est le vrai point technique du chapitre. Les frais de fusion restent fiscalement déductibles du résultat imposable quelle que soit l'option comptable retenue : les engager procure donc une économie d'impôt sur les sociétés. Si l'on se contentait de virer la charge brute sur la prime, cette économie resterait acquise au résultat de l'exercice, qui se trouverait artificiellement amélioré sans qu'aucune charge n'y figure plus. C'est incohérent. On impute donc la prime pour le montant net d'impôt seulement, et l'on rétablit en contrepartie la charge d'impôt correspondante au compte 695 « Impôts sur les bénéfices ». Le compte de charges d'origine est soldé pour son montant brut, le résultat de l'exercice est intégralement neutralisé, et seule la prime supporte le coût de l'opération."}, {"type": "journal", "title": "Variante — imputation des mêmes frais sur la prime de fusion, nets d'impôt", "note": "Base : les 3 000 € hors taxes de la session 2022 et un taux d'impôt sur les sociétés de 25 %. Montant net imputé : 3 000 × (1 − 25 %) = 2 250 € ; rétablissement de la charge d'impôt : 3 000 × 25 % = 750 €. Certains corrigés créditent, au lieu du compte de charges lui-même, un compte 791 « Transferts de charges d'exploitation » : la logique et les montants sont identiques.", "lines": [{"compte": "1042", "libelle": "Prime de fusion", "debit": 2250, "credit": 0}, {"compte": "695", "libelle": "Impôts sur les bénéfices", "debit": 750, "credit": 0}, {"compte": "6227", "libelle": "Frais d'actes et de contentieux", "debit": 0, "credit": 3000}]}, {"type": "callout", "tone": "warn", "title": "Piège d'examen : trois erreurs classiques sur les frais", "text": "Première erreur, imputer le montant BRUT sur la prime : le résultat de l'exercice se trouve alors gonflé de l'économie d'impôt, et la ligne 695 manque. Deuxième erreur, faire transiter la taxe sur la valeur ajoutée déductible par la prime : elle n'est pas une charge, elle se récupère auprès du Trésor par le compte 44566. Troisième erreur, imputer sur une prime insuffisante ou inexistante : lorsque la prime ne couvre pas les frais nets, l'option n'est tout simplement pas praticable et il faut basculer sur l'un des deux autres traitements."}, {"type": "example", "title": "Les trois traitements chiffrés sur un même cas", "statement": "Reprenons la session 2022 : les frais de fusion s'élèvent à 3 000 € hors taxes, taxe sur la valeur ajoutée au taux de 20 %, taux d'impôt sur les sociétés de 25 %. La prime de fusion dégagée sur l'apport de la SA NOUR est de 25 000 €, et une provision pour hausse des prix de 20 000 € doit être reconstituée. Chiffrer, pour chacune des trois options de l'article 212-9 du plan comptable général, l'incidence sur le résultat de l'exercice et le solde final de la prime de fusion.", "solution": "Option 1 — comptabilisation en charges (option imposée par l'énoncé 2022).\nLe compte 6227 est débité de 3 000 € et le compte 44566 de 600 €, pour un décaissement de 3 600 €. Le résultat avant impôt diminue de 3 000 € ; l'économie d'impôt étant de 3 000 × 25 % = 750 €, l'incidence nette sur le résultat de l'exercice est de − 2 250 €. La prime de fusion n'est pas touchée par les frais : elle reste à 25 000 €, puis tombe à 25 000 − 20 000 = 5 000 € après reconstitution de la provision pour hausse des prix.\n\nOption 2 — imputation sur la prime de fusion, nette d'impôt.\nOn passe d'abord la même écriture de constatation des frais, puis l'écriture de transfert : débit 1042 pour 2 250 €, débit 695 pour 750 €, crédit 6227 pour 3 000 €. L'incidence nette sur le résultat de l'exercice est nulle : la charge de 3 000 € est annulée et la charge d'impôt est majorée de 750 €, soit + 3 000 − 750 = + 2 250 € qui compensent exactement les − 2 250 € de l'option 1. La prime de fusion devient 25 000 − 2 250 = 22 750 €, puis 22 750 − 20 000 = 2 750 € après reconstitution de la provision.\n\nOption 3 — inscription en frais d'établissement.\nLe compte 201 est débité de 3 000 €, amortis linéairement sur cinq ans au maximum, soit une dotation annuelle de 3 000 / 5 = 600 €. L'incidence sur le résultat est étalée : − 600 € avant impôt chaque année, soit − 450 € nets d'impôt par exercice pendant cinq ans. La prime de fusion n'est pas affectée : elle reste à 25 000 €, puis 5 000 € après la reconstitution.\n\nContrôle de cohérence : le coût économique total est identique dans les trois cas (2 250 € nets d'impôt) ; seuls diffèrent le support qui l'absorbe (résultat ou capitaux propres) et son étalement dans le temps."}]}, {"title": "6. Valeur comptable ou valeur réelle : ce qui change dans les écritures", "blocks": [{"type": "intro", "text": "Le choix entre valeur comptable et valeur réelle est arrêté en amont des écritures, par l'analyse de la situation de contrôle puis, le cas échéant, du sens de l'opération, en application des articles 743-1 et 743-2 du règlement de l'Autorité des
