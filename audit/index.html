<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audit — NAS / ISA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react?external=react"

  html,body{margin:0;padding:0;background:#f8fafc}
  #cw-loading{font-family:system-ui,-apple-system,sans-serif;color:#64748b;padding:48px;text-align:center;font-size:14px}
  #cw-error{font-family:ui-monospace,monospace;color:#b91c1c;padding:20px;font-size:12px;white-space:pre-wrap;background:#fff1f2;border-top:1px solid #fecaca}

<body>
<div id="root"><div id="cw-loading">Chargement du module Audit…</div></div>
<div id="cw-error" hidden></div>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('cw-error');
    if (el) { el.hidden = false; el.textContent = 'Erreur : ' + (e.message || e); }
  });
</script>
<script type="text/babel" data-type="module" data-presets="react">
import React from "react";
import { useState, useEffect } from "react";
import { createRoot } from "react-dom/client";
import { Info, AlertTriangle, CheckCircle2, ArrowRight, ArrowLeft, ChevronDown, Calculator, GraduationCap, Search } from "lucide-react";
const fmt = (n) => { if (n === null || n === undefined || isNaN(n)) return '–'; return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'"); };

/* ===================== Lesson engine (IFRS / Swiss GAAP) =====================
   Moteur data-driven rendu dans le style du wizard (Tailwind, light).
   Le contenu (window.__CONSO_LESSONS__) est une donnée pure → robuste.
   Interactif : quiz cliquables + score, exemples à corrigé masqué,
   sections repliables. ========================================================= */

/* Renvois cliquables : un code de norme dans le texte → ouvre la leçon. */
const NORM_CODE_RE = /(IAS 27|IAS 28|IFRS 10|IFRS 11|IFRS 12|IFRS 3|RPC 30)(?![\d/])/g;
function NormLinks({ text, kb }) {
  const segs = String(text).split(NORM_CODE_RE);
  return segs.map((s, j) => {
    if (/^(IAS 27|IAS 28|IFRS 10|IFRS 11|IFRS 12|IFRS 3|RPC 30)$/.test(s)) {
      return (
        <span key={kb + "_" + j} role="link" tabIndex={0}
          onClick={(e) => { e.stopPropagation(); if (typeof window !== "undefined" && window.__consoGoToLesson) window.__consoGoToLesson(s); }}
          className="text-indigo-600 font-semibold cursor-pointer underline decoration-dotted decoration-indigo-300 underline-offset-2 hover:text-indigo-800">{s}</span>
      );
    }
    return <React.Fragment key={kb + "_" + j}>{s}</React.Fragment>;
  });
}

function MdInline({ text }) {
  if (text == null) return null;
  const parts = String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  return parts.map((p, i) => {
    if (/^\*\*[\s\S]+\*\*$/.test(p)) return <strong key={i} className="font-semibold text-slate-800"><NormLinks text={p.slice(2, -2)} kb={i} /></strong>;
    if (/^`[\s\S]+`$/.test(p)) return <code key={i} className="px-1 py-0.5 rounded bg-slate-100 text-indigo-700 text-[0.85em]">{p.slice(1, -1)}</code>;
    return <NormLinks key={i} text={p} kb={i} />;
  });
}

function MdBlock({ text, className = "" }) {
  if (!text) return null;
  const lines = String(text).split("\n");
  const out = []; let list = null;
  const flush = (k) => { if (list) { out.push(<ul key={"u" + k} className="list-disc ml-5 space-y-1 my-2">{list.map((li, j) => <li key={j}><MdInline text={li} /></li>)}</ul>); list = null; } };
  lines.forEach((ln, i) => {
    const t = ln.trim();
    if (/^[-•]\s+/.test(t)) { (list = list || []).push(t.replace(/^[-•]\s+/, "")); }
    else { flush(i); if (t) out.push(<p key={"p" + i} className="my-2 leading-relaxed"><MdInline text={t} /></p>); }
  });
  flush("end");
  return <div className={className}>{out}</div>;
}

const L_ACCENT = {
  indigo:  { bar: "bg-indigo-600",  text: "text-indigo-700",  soft: "bg-indigo-50",  ring: "border-indigo-200" },
  cyan:    { bar: "bg-cyan-600",    text: "text-cyan-700",    soft: "bg-cyan-50",    ring: "border-cyan-200" },
  emerald: { bar: "bg-emerald-600", text: "text-emerald-700", soft: "bg-emerald-50", ring: "border-emerald-200" },
  amber:   { bar: "bg-amber-500",   text: "text-amber-700",   soft: "bg-amber-50",   ring: "border-amber-200" },
  violet:  { bar: "bg-violet-600",  text: "text-violet-700",  soft: "bg-violet-50",  ring: "border-violet-200" },
  rose:    { bar: "bg-rose-600",    text: "text-rose-700",    soft: "bg-rose-50",    ring: "border-rose-200" },
  blue:    { bar: "bg-blue-600",    text: "text-blue-700",    soft: "bg-blue-50",    ring: "border-blue-200" },
  teal:    { bar: "bg-teal-600",    text: "text-teal-700",    soft: "bg-teal-50",    ring: "border-teal-200" },
  slate:   { bar: "bg-slate-700",   text: "text-slate-700",   soft: "bg-slate-50",   ring: "border-slate-200" },
};
const lacc = (c) => L_ACCENT[c] || L_ACCENT.indigo;

function LCallout({ tone = "info", title, text }) {
  const map = {
    info: ["bg-slate-50 border-slate-200", <Info size={17} className="shrink-0 mt-0.5 text-slate-400" />, "text-slate-700"],
    tip:  ["bg-indigo-50 border-indigo-200", <ArrowRight size={17} className="shrink-0 mt-0.5 text-indigo-500" />, "text-indigo-800"],
    warn: ["bg-amber-50 border-amber-200", <AlertTriangle size={17} className="shrink-0 mt-0.5 text-amber-500" />, "text-amber-800"],
    key:  ["bg-emerald-50 border-emerald-200", <CheckCircle2 size={17} className="shrink-0 mt-0.5 text-emerald-500" />, "text-emerald-800"],
  };
  const m = map[tone] || map.info;
  return (
    <div className={`flex items-start gap-2.5 border rounded-xl p-3.5 my-3 text-sm ${m[0]}`}>
      {m[1]}
      <div className="min-w-0">
        {title && <div className={`font-semibold mb-0.5 ${m[2]}`}>{title}</div>}
        <div className="text-slate-600"><MdBlock text={text} /></div>
      </div>
    </div>
  );
}

function LTable({ title, headers = [], rows = [] }) {
  return (
    <div className="my-3">
      {title && <div className="text-sm font-semibold text-slate-700 mb-1.5">{title}</div>}
      <div className="overflow-x-auto rounded-lg border border-slate-200">
        <table className="w-full text-sm">
          {headers.length > 0 && <thead><tr className="bg-slate-50 text-slate-500 text-xs">
            {headers.map((h, i) => <th key={i} className="text-left px-3 py-2 font-medium"><MdInline text={h} /></th>)}
          </tr></thead>}
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} className="border-t border-slate-100 align-top">
                {r.map((c, j) => <td key={j} className={`px-3 py-2 ${j === 0 ? "font-medium text-slate-700" : "text-slate-600"}`}><MdInline text={c} /></td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LCompare({ title = "IFRS vs Swiss GAAP RPC vs CO", rows = [] }) {
  return (
    <div className="my-3">
      <div className="text-sm font-semibold text-slate-700 mb-1.5">{title}</div>
      <div className="overflow-x-auto rounded-lg border border-slate-200">
        <table className="w-full text-sm">
          <thead><tr className="bg-slate-50 text-xs">
            <th className="text-left px-3 py-2 font-medium text-slate-500">Critère</th>
            <th className="text-left px-3 py-2 font-semibold text-indigo-700">IFRS</th>
            <th className="text-left px-3 py-2 font-semibold text-emerald-700">Swiss GAAP RPC</th>
            <th className="text-left px-3 py-2 font-semibold text-amber-700">CO</th>
          </tr></thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} className="border-t border-slate-100 align-top">
                <td className="px-3 py-2 font-medium text-slate-700"><MdInline text={r.crit} /></td>
                <td className="px-3 py-2 text-slate-600"><MdInline text={r.ifrs} /></td>
                <td className="px-3 py-2 text-slate-600"><MdInline text={r.rpc} /></td>
                <td className="px-3 py-2 text-slate-600"><MdInline text={r.co} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LSteps({ title, steps = [], accent = "indigo" }) {
  const a = lacc(accent);
  return (
    <div className="my-3">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="space-y-2">
        {steps.map((s, i) => (
          <div key={i} className="flex items-start gap-3">
            <span className={`shrink-0 w-6 h-6 rounded-full ${a.bar} text-white text-xs font-bold flex items-center justify-center mt-0.5`}>{i + 1}</span>
            <div className="text-sm">
              {s.t && <span className="font-semibold text-slate-800"><MdInline text={s.t} /></span>}
              {s.d && <span className="text-slate-600"> — <MdInline text={s.d} /></span>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LKeypoints({ title = "À retenir", items = [], accent = "emerald" }) {
  const a = lacc(accent);
  return (
    <div className={`my-3 rounded-xl border ${a.ring} ${a.soft} p-4`}>
      <div className={`text-sm font-semibold mb-2 ${a.text}`}>{title}</div>
      <ul className="space-y-1.5">
        {items.map((it, i) => (
          <li key={i} className="flex items-start gap-2 text-sm text-slate-700">
            <CheckCircle2 size={15} className={`shrink-0 mt-0.5 ${a.text}`} />
            <span><MdInline text={it} /></span>
          </li>
        ))}
      </ul>
    </div>
  );
}

function LJournal({ title, note, lines = [] }) {
  const norm = lines.map((l) => ({ compte: l.compte, debit: l.debit || 0, credit: l.credit || 0 }));
  return <div className="my-3"><Journal n={"✍"} title={title || "Écriture comptable"} note={note} lines={norm} /></div>;
}

function LExample({ title = "Exemple chiffré", statement, solution }) {
  const [show, setShow] = useState(false);
  return (
    <div className="my-3 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <div className="bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 flex items-center gap-2 border-b border-slate-100">
        <Calculator size={15} className="text-indigo-500" />{title}
      </div>
      <div className="p-4">
        <div className="text-sm text-slate-700"><MdBlock text={statement} /></div>
        {solution && (
          <div className="mt-3">
            <button onClick={() => setShow(!show)} className="flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800">
              <ChevronDown size={14} className={`transition-transform ${show ? "rotate-180" : ""}`} />{show ? "Masquer le corrigé" : "Voir le corrigé"}
            </button>
            {show && <div className="mt-2 pt-3 border-t border-dashed border-slate-200 text-sm text-slate-700"><MdBlock text={solution} /></div>}
          </div>
        )}
      </div>
    </div>
  );
}

function LQuiz({ title = "Quiz express", questions = [] }) {
  const [ans, setAns] = useState({});
  const answered = Object.keys(ans).length;
  const score = questions.reduce((s, q, i) => s + (ans[i] === q.answer ? 1 : 0), 0);
  return (
    <div className="my-3 rounded-xl border border-slate-200 bg-white">
      <div className="bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 flex items-center justify-between border-b border-slate-100">
        <span className="flex items-center gap-2"><GraduationCap size={15} className="text-indigo-500" />{title}</span>
        {answered > 0 && <span className="text-xs font-medium text-slate-500">Score {score}/{questions.length}</span>}
      </div>
      <div className="p-4 space-y-4">
        {questions.map((q, qi) => {
          const chosen = ans[qi]; const done = chosen != null;
          return (
            <div key={qi}>
              <div className="text-sm font-medium text-slate-800 mb-2">{qi + 1}. <MdInline text={q.q} /></div>
              <div className="grid gap-1.5">
                {q.options.map((opt, oi) => {
                  let cls = "border-slate-200 hover:border-indigo-300 text-slate-700";
                  if (done) {
                    if (oi === q.answer) cls = "border-emerald-300 bg-emerald-50 text-emerald-800";
                    else if (oi === chosen) cls = "border-rose-300 bg-rose-50 text-rose-700";
                    else cls = "border-slate-200 text-slate-400";
                  }
                  return (
                    <button key={oi} disabled={done} onClick={() => setAns((p) => ({ ...p, [qi]: oi }))}
                      className={`text-left text-sm border rounded-lg px-3 py-2 transition-colors flex items-center gap-2 ${cls}`}>
                      <span className="shrink-0 w-5 h-5 rounded-full border border-slate-300 text-xs flex items-center justify-center font-medium">{"ABCD"[oi]}</span>
                      <span className="flex-1"><MdInline text={opt} /></span>
                      {done && oi === q.answer && <CheckCircle2 size={15} className="text-emerald-500" />}
                    </button>
                  );
                })}
              </div>
              {done && q.explain && <div className="mt-2 text-xs text-slate-500 bg-slate-50 rounded-lg px-3 py-2"><MdInline text={q.explain} /></div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LMnemo({ code, items = [], phrase }) {
  return (
    <div className="my-3 rounded-xl border border-violet-200 bg-violet-50 p-4">
      <div className="text-sm font-bold text-violet-700 mb-2">🧠 Mnémotechnique — {code}</div>
      <ul className="space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm text-slate-700"><span className="font-bold text-violet-700">{it.l}</span> — <MdInline text={it.t} /></li>
        ))}
      </ul>
      {phrase && <div className="mt-2 text-xs italic text-violet-600">« {phrase} »</div>}
    </div>
  );
}

/* ===================== Schémas / graphiques ===================== */
const DHEX = {
  slate: "#94a3b8", gray: "#9ca3af", indigo: "#6366f1", violet: "#8b5cf6", blue: "#3b82f6",
  cyan: "#06b6d4", teal: "#14b8a6", emerald: "#10b981", green: "#22c55e", amber: "#f59e0b",
  orange: "#f97316", rose: "#f43f5e", red: "#ef4444",
};
const dhex = (c) => DHEX[c] || DHEX.indigo;

function DCaption({ text }) {
  if (!text) return null;
  return <div className="text-xs text-slate-400 mt-2 text-center italic"><MdInline text={text} /></div>;
}

/* Spectre 0→100 % avec bandes colorées + légende — LE visuel contrôle/influence */
function DSpectrum({ title, bands = [], caption }) {
  const ticks = Array.from(new Set([0, 100, ...bands.flatMap((b) => [b.from, b.to])])).sort((a, b) => a - b);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex h-10 rounded-xl overflow-hidden shadow-inner">
        {bands.map((b, i) => (
          <div key={i} style={{ width: `${b.to - b.from}%`, background: dhex(b.color) }}
            className="h-full flex items-center justify-center text-[10px] font-bold text-white text-center px-1 leading-tight">
            {b.short || ""}
          </div>
        ))}
      </div>
      <div className="relative h-4 mt-1">
        {ticks.map((p) => (
          <span key={p} style={{ left: `${p}%` }} className="absolute -translate-x-1/2 text-[10px] font-medium text-slate-400">{p}%</span>
        ))}
      </div>
      <div className="grid sm:grid-cols-3 gap-2 mt-2">
        {bands.map((b, i) => (
          <div key={i} className="flex items-start gap-2 text-xs">
            <span className="w-3 h-3 rounded mt-0.5 shrink-0" style={{ background: dhex(b.color) }}></span>
            <span className="text-slate-600 leading-snug"><MdInline text={b.label} /></span>
          </div>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Cascade (goodwill bridge) : + / − / = avec barres proportionnelles */
function DWaterfall({ title, items = [], caption }) {
  const max = Math.max(1, ...items.map((i) => Math.abs(i.value || 0)));
  const col = { add: "#6366f1", sub: "#f43f5e", total: "#10b981" };
  const sign = { add: "+", sub: "−", total: "=" };
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="space-y-1.5">
        {items.map((it, i) => (
          <div key={i} className="flex items-center gap-2">
            <div className="w-36 sm:w-44 text-xs text-slate-600 text-right shrink-0 leading-snug"><MdInline text={it.label} /></div>
            <div className="flex-1 h-7 bg-slate-50 rounded-md overflow-hidden">
              <div style={{ width: `${(Math.abs(it.value) / max) * 100}%`, background: col[it.kind] || col.add }}
                className={`h-full ${it.kind === "total" ? "rounded-md" : ""}`}></div>
            </div>
            <div className={`w-20 text-sm font-bold text-right shrink-0 tabular-nums ${it.kind === "total" ? "text-emerald-700" : it.kind === "sub" ? "text-rose-600" : "text-indigo-700"}`}>
              {sign[it.kind] || ""}{fmt(Math.abs(it.value))}
            </div>
          </div>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Structure de groupe (mère → filiale %, + minoritaires) en SVG */
function DGroup({ parent = {}, pct = 100, child = {}, nci, method, caption }) {
  const minor = nci != null ? nci : (100 - pct);
  const pcol = dhex(parent.color || "indigo");
  const ccol = dhex(child.color || "slate");
  return (
    <div className="my-4">
      <svg viewBox="0 0 440 220" className="w-full max-w-md mx-auto">
        <rect x="160" y="8" width="120" height="48" rx="10" fill={pcol} />
        <text x="220" y="30" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">{parent.label || "Société mère"}</text>
        <text x="220" y="46" textAnchor="middle" fill="#e0e7ff" fontSize="10">{parent.sub || "Consolidante"}</text>
        <line x1="220" y1="56" x2="220" y2="150" stroke="#cbd5e1" strokeWidth="2" />
        <rect x="186" y="92" width="68" height="22" rx="6" fill="#fff" stroke={pcol} />
        <text x="220" y="107" textAnchor="middle" fill={pcol} fontSize="12" fontWeight="800">{pct} %</text>
        <rect x="160" y="150" width="120" height="56" rx="10" fill={ccol} />
        <text x="220" y="173" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">{child.label || "Filiale"}</text>
        <text x="220" y="190" textAnchor="middle" fill="#e2e8f0" fontSize="9.5">{method || child.sub || ""}</text>
        {minor > 0 && (<>
          <rect x="312" y="150" width="118" height="56" rx="10" fill="#fffbeb" stroke="#fcd34d" strokeDasharray="4" />
          <text x="371" y="173" textAnchor="middle" fill="#92400e" fontSize="11" fontWeight="700">Minoritaires</text>
          <text x="371" y="190" textAnchor="middle" fill="#b45309" fontSize="12" fontWeight="800">{minor} %</text>
          <line x1="312" y1="178" x2="280" y2="178" stroke="#fbbf24" strokeWidth="2" strokeDasharray="4" />
        </>)}
      </svg>
      <DCaption text={caption} />
    </div>
  );
}

/* Colonnes IFRS / RPC / CO (ou n colonnes) — comparatif visuel */
function DColumns({ cols = [], caption }) {
  return (
    <div className="my-4">
      <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(cols.length, 3)}, minmax(0,1fr))` }}>
        {cols.map((c, i) => {
          const a = lacc(c.color);
          return (
            <div key={i} className={`rounded-xl border ${a.ring} overflow-hidden`}>
              <div className={`${a.bar} text-white text-sm font-bold px-3 py-2 text-center`}>{c.title}</div>
              <ul className={`${a.soft} p-3 space-y-1.5`}>
                {(c.items || []).map((it, j) => (
                  <li key={j} className="text-xs text-slate-700 flex gap-1.5 leading-snug"><span className={`${a.text} font-bold`}>›</span><span><MdInline text={it} /></span></li>
                ))}
              </ul>
            </div>
          );
        })}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Flux d'étapes : boîtes + flèches */
function DFlow({ title, steps = [], accent = "indigo", caption }) {
  const a = lacc(accent);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex items-stretch gap-1 overflow-x-auto pb-1">
        {steps.map((s, i) => (
          <React.Fragment key={i}>
            <div className={`shrink-0 rounded-xl border ${a.ring} ${a.soft} p-3 w-40`}>
              <div className={`text-xs font-bold ${a.text} mb-0.5`}>{i + 1}. <MdInline text={s.label} /></div>
              {s.sub && <div className="text-[11px] text-slate-500 leading-snug"><MdInline text={s.sub} /></div>}
            </div>
            {i < steps.length - 1 && <div className="flex items-center text-slate-300 shrink-0"><ArrowRight size={18} /></div>}
          </React.Fragment>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Pyramide (niveaux décroissants) */
function DPyramid({ title, levels = [], accent = "indigo", caption }) {
  const base = dhex(accent);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2 text-center">{title}</div>}
      <div className="flex flex-col items-center gap-1">
        {levels.map((l, i) => {
          const w = 100 - i * (55 / Math.max(levels.length - 1, 1));
          return (
            <div key={i} style={{ width: `${w}%`, background: base, opacity: 1 - i * 0.13 }}
              className="rounded-lg text-white text-center px-3 py-2 shadow-sm">
              <div className="text-xs font-bold"><MdInline text={l.t} /></div>
              {l.d && <div className="text-[10px] opacity-90 leading-snug"><MdInline text={l.d} /></div>}
            </div>
          );
        })}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Répartition (barre %) — ex. groupe vs minoritaires */
function DSplit({ title, parts = [], caption }) {
  const tot = parts.reduce((s, p) => s + (p.value || 0), 0) || 1;
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex h-10 rounded-lg overflow-hidden">
        {parts.map((p, i) => (
          <div key={i} style={{ width: `${(p.value / tot) * 100}%`, background: dhex(p.color) }}
            className="flex items-center justify-center text-white text-xs font-bold">{p.value}%</div>
        ))}
      </div>
      <div className="flex flex-wrap gap-3 mt-2 text-xs">
        {parts.map((p, i) => (
          <span key={i} className="flex items-center gap-1.5 text-slate-600"><span className="w-3 h-3 rounded" style={{ background: dhex(p.color) }}></span><MdInline text={p.label} /></span>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

function LDiagram({ b }) {
  switch (b.kind) {
    case "spectrum": return <DSpectrum title={b.title} bands={b.bands} caption={b.caption} />;
    case "waterfall": return <DWaterfall title={b.title} items={b.items} caption={b.caption} />;
    case "group": return <DGroup parent={b.parent} pct={b.pct} child={b.child} nci={b.nci} method={b.method} caption={b.caption} />;
    case "columns": return <DColumns cols={b.cols} caption={b.caption} />;
    case "flow": return <DFlow title={b.title} steps={b.steps} accent={b.accent} caption={b.caption} />;
    case "pyramid": return <DPyramid title={b.title} levels={b.levels} accent={b.accent} caption={b.caption} />;
    case "split": return <DSplit title={b.title} parts={b.parts} caption={b.caption} />;
    default: return null;
  }
}

function LessonBlock({ b }) {
  if (!b || !b.type) return null;
  switch (b.type) {
    case "intro": return <div className="text-[15px] text-slate-700 my-2"><MdBlock text={b.text} /></div>;
    case "heading": return <h3 className="text-base font-bold text-slate-800 mt-5 mb-1"><MdInline text={b.text} /></h3>;
    case "keypoints": return <LKeypoints title={b.title} items={b.items} accent={b.accent} />;
    case "callout": return <LCallout tone={b.tone} title={b.title} text={b.text} />;
    case "table": return <LTable title={b.title} headers={b.headers} rows={b.rows} />;
    case "compare": return <LCompare title={b.title} rows={b.rows} />;
    case "steps": return <LSteps title={b.title} steps={b.steps} accent={b.accent} />;
    case "journal": return <LJournal title={b.title} note={b.note} lines={b.lines} />;
    case "example": return <LExample title={b.title} statement={b.statement} solution={b.solution} />;
    case "quiz": return <LQuiz title={b.title} questions={b.questions} />;
    case "mnemo": return <LMnemo code={b.code} items={b.items} phrase={b.phrase} />;
    case "diagram": return <LDiagram b={b} />;
    default: return null;
  }
}

function LessonSection({ sec, accent = "indigo", defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  const a = lacc(accent);
  if (!sec.title) return <div className="mb-2">{(sec.blocks || []).map((b, i) => <LessonBlock key={i} b={b} />)}</div>;
  return (
    <div className="mb-3 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center gap-2.5 px-4 py-3 text-left hover:bg-slate-50">

}

/* ===================== Recherche globale dans les cours ===================== */
function LessonSearch({ lessons = {}, onOpen }) {
  const [q, setQ] = useState("");
  const all = [
    ...(((lessons.ifrs || {}).lessons) || []).map((l) => ({ ...l, domain: "IFRS" })),
    ...(((lessons.swissgaap || {}).lessons) || []).map((l) => ({ ...l, domain: "Swiss GAAP" })),
  ];
  const query = q.trim().toLowerCase();
  let results = [];
  if (query.length >= 2) {
    all.forEach((l) => {
      const secHits = (l.sections || []).filter((s) => {
        const txt = (s.title || "") + " " + JSON.stringify(s.blocks || "");
        return txt.toLowerCase().includes(query);
      }).map((s) => s.title);
      const titleHit = ((l.code || "") + " " + (l.title || "") + " " + (l.tagline || "")).toLowerCase().includes(query);
      if (titleHit || secHits.length) results.push({ l, secHits: secHits.slice(0, 3) });
    });
  }
  return (
    <div>
      <div className="relative">
        <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
        <input value={q} onChange={(e) => setQ(e.target.value)}
          placeholder="Rechercher dans les cours IFRS & Swiss GAAP (goodwill, NCI, mise en équivalence…)"
          className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
        {q && <button onClick={() => setQ("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">✕</button>}
      </div>
      {query.length >= 2 && (
        <div className="mt-2 rounded-xl border border-slate-200 bg-white divide-y divide-slate-100 max-h-80 overflow-auto shadow-sm">
          {results.length === 0 && <div className="p-3 text-sm text-slate-400">Aucun résultat pour « {q} ».</div>}
          {results.map(({ l, secHits }) => (
            <button key={l.domain + l.code} onClick={() => onOpen && onOpen(l.code)} className="w-full text-left p-3 hover:bg-slate-50 flex items-start gap-2.5">
              <span className="text-lg shrink-0">{l.icon}</span>
              <div className="min-w-0">
                <div className="text-sm font-semibold text-slate-800">{l.code} — {l.title}</div>
                {secHits.length > 0 && <div className="text-xs text-slate-500 truncate">↳ {secHits.join(" · ")}</div>}
                <div className="text-[10px] uppercase tracking-wide text-slate-400 mt-0.5">{l.domain}</div>
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Audit — app React (même thème que Conso). Charge data/audit.json
   (fetch) et le rend avec le moteur de leçon partagé + composants
   spécifiques (annuaire des 47 normes ISA, QCM interactifs, schémas).
   ============================================================ */

const A_TONE = { key: "key", warn: "warn", info: "info", tip: "tip", example: "tip", legal: "info" };
const ahx = (c) => (typeof c === "string" && c[0] === "#") ? c : "#7c3aed";
const META_KEYS = ["_label", "_icon", "_description", "id", "icon", "color", "num", "code"];

/* Schéma audit (pyramid / flow / matrix) → composant graphique / tableau */
function SchemaView({ schema }) {
  if (!schema || typeof schema !== "object") return null;
  const t = schema.type;
  if (t === "pyramid") return <DPyramid title={schema.title} levels={schema.levels || []} />;
  if (t === "flow") return <DFlow title={schema.title} steps={(schema.levels || schema.steps || []).map((l) => ({ label: l.t || l.label || "", sub: l.d || l.sub || "" }))} />;
  if (t === "matrix") {
    const xs = schema.xlabels || [], ys = schema.ylabels || [], cells = schema.cells || [];
    const cell = (c) => (c && typeof c === "object") ? (c.t || c.v || "") : (c || "");
    return <LTable title={schema.title} headers={["", ...xs]} rows={ys.map((y, i) => [y, ...xs.map((_, j) => cell((cells[i] || [])[j]))])} />;
  }
  return null;
}

/* Callouts audit → LCallout */
function AuditCallouts({ callouts = [] }) {
  return callouts.map((co, i) => <LCallout key={i} tone={A_TONE[co.type] || "info"} title={co.label} text={co.text} />);
}

/* QCM interactif (mcq / questions audit) */
function isMcq(arr) { return Array.isArray(arr) && arr.length > 0 && arr[0] && Array.isArray(arr[0].options) && (arr[0].answer != null); }
function AuditMcq({ items = [], title = "QCM" }) {
  const qs = items.map((m) => ({ q: m.question || m.q, options: m.options, answer: typeof m.answer === "number" ? m.answer : 0, explain: m.explanation || m.explain }));
  return <LQuiz title={title} questions={qs} />;
}

/* Q/R simple (quiz {q,a}) avec révélation */
function QAList({ items = [], title }) {
  return <div className="my-2">{title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}{items.map((qa, i) => <LExample key={i} title={`Q${i + 1}. ${qa.q || ""}`} statement="" solution={qa.a} />)}</div>;
}

/* Rendu générique pour les sous-sections de forme variable */
function AnyAudit({ data, depth = 0 }) {
  if (data == null) return null;
  if (typeof data === "string") return <MdBlock text={data} className="text-sm text-slate-700" />;
  if (typeof data === "number" || typeof data === "boolean") return <span className="text-sm text-slate-700">{String(data)}</span>;
  if (Array.isArray(data)) {
    if (!data.length) return null;
    if (isMcq(data)) return <AuditMcq items={data} />;
    if (data.every((x) => typeof x === "string")) return <ul className="list-disc ml-5 space-y-1 my-2 text-sm text-slate-700">{data.map((x, i) => <li key={i}><MdInline text={x} /></li>)}</ul>;
    return <div className="space-y-2.5 my-2">{data.map((x, i) => {
      const head = x && (x.title || x.label || x.nom || x.q || x.question || x.ref || x.role || x.titre);
      return <div key={i} className="rounded-xl border border-slate-200 bg-white p-3.5">{head ? <div className="text-sm font-semibold text-slate-800 mb-1.5">{<MdInline text={head} />}</div> : null}<AnyAudit data={omitKeys(x, ["title", "label", "nom", "q", "question", "ref", "role", "titre"])} depth={depth + 1} /></div>;
    })}</div>;
  }
  // objet : clés connues d'abord (callouts, schema, body…), puis le reste
  const o = data;
  const parts = [];
  if (o.body) parts.push(<MdBlock key="body" text={o.body} className="text-sm text-slate-700 my-1" />);
  if (o.detail) parts.push(<MdBlock key="detail" text={o.detail} className="text-sm text-slate-700 my-1" />);
  if (o.intro) parts.push(<MdBlock key="intro" text={o.intro} className="text-sm text-slate-700 my-1" />);
  if (o.text && !o.body) parts.push(<MdBlock key="text" text={o.text} className="text-sm text-slate-700 my-1" />);
  if (Array.isArray(o.callouts)) parts.push(<AuditCallouts key="co" callouts={o.callouts} />);
  if (o.schema) parts.push(<SchemaView key="sc" schema={o.schema} />);
  Object.entries(o).forEach(([k, v]) => {
    if (META_KEYS.indexOf(k) >= 0 || ["body", "detail", "intro", "text", "callouts", "schema", "title", "label"].indexOf(k) >= 0) return;
    if (v == null || (Array.isArray(v) && !v.length)) return;
    parts.push(
      <div key={k} className="mt-2.5">
        <div className="text-[11px] font-bold text-violet-500 uppercase tracking-wide mb-1">{k.replace(/_/g, " ")}</div>
        <AnyAudit data={v} depth={depth + 1} />
      </div>
    );
  });
  return <div className="space-y-1">{parts}</div>;
}
function omitKeys(o, keys) { if (!o || typeof o !== "object" || Array.isArray(o)) return o; const r = {}; Object.keys(o).forEach((k) => { if (keys.indexOf(k) < 0) r[k] = o[k]; }); return r; }

/* Section repliable générique */
function ACollapse({ title, accent = "violet", defaultOpen = false, children }) {
  const [open, setOpen] = useState(defaultOpen);
  const a = lacc(accent);
  return (
    <div className="mb-3 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center gap-2.5 px-4 py-3 text-left hover:bg-slate-50">
        <span className={`w-1.5 h-5 rounded ${a.bar}`}></span><span className="font-semibold text-slate-800 flex-1">{title}</span>
        <ChevronDown size={17} className={`text-slate-400 transition-transform ${open ? "rotate-180" : ""}`} />
      </button>
      {open && <div className="px-4 pb-4 pt-1">{children}</div>}
    </div>
  );
}

      {course.mnemo && course.mnemo.items && <LMnemo code={course.mnemo.code} items={course.mnemo.items} phrase={course.mnemo.phrase} />}
      {course.synthese && course.synthese.length > 0 && <LKeypoints title="✅ Synthèse" items={course.synthese} accent="emerald" />}
      {course.pieges && course.pieges.length > 0 && <LKeypoints title="⚠️ Pièges d'examen" items={course.pieges} accent="amber" />}
      {course.quiz && course.quiz.length > 0 && <ACollapse title={`🧪 Quiz (${course.quiz.length})`}><QAList items={course.quiz} /></ACollapse>}
      {course.mcq && course.mcq.length > 0 && <ACollapse title={`❓ QCM (${course.mcq.length})`} defaultOpen={false}><AuditMcq items={course.mcq} title="" /></ACollapse>}
    </div>
  );
}

/* ── Annuaire : 7 séries → standards → cours, + recherche ── */
function AuditAnnuaire({ annuaire, cours, onOpen }) {
  const [q, setQ] = useState("");
  const series = (annuaire && annuaire.series) || [];
  const allStd = series.flatMap((s) => (s.standards || []).map((st) => ({ ...st, color: s.color })));
  const query = q.trim().toLowerCase();
  let results = [];
  if (query.length >= 2) {
    results = allStd.filter((st) => {
      const c = cours[st.num] || {};
      const hay = (st.code + " " + st.title_fr + " " + (st.title_en || "") + " " + (c.tldr || "") + " " + (c.intro || "")).toLowerCase();
      return hay.includes(query);
    });
  }
  return (
    <div>
      <div className="relative mb-4">
        <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher une norme ISA (fraude, échantillonnage, opinion, NCI…)" className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
      </div>
      {query.length >= 2 ? (
        <div className="space-y-1.5">
          <div className="text-xs text-slate-400 mb-1">{results.length} résultat(s)</div>
          {results.map((st) => <StdRow key={st.num} st={st} onOpen={onOpen} hasCourse={!!cours[st.num]} />)}
        </div>
      ) : (
        series.map((s) => (
          <div key={s.id} className="mb-5">
            <div className="flex items-center gap-2 mb-2">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: s.color || "#7c3aed" }}></span>
              <h3 className="text-sm font-bold text-slate-800">{s.label} <span className="text-slate-400 font-normal">({s.range})</span></h3>
            </div>
            {s.intro && <p className="text-xs text-slate-500 mb-2 leading-relaxed"><MdInline text={s.intro} /></p>}
            <div className="grid sm:grid-cols-2 gap-1.5">
              {(s.standards || []).map((st) => <StdRow key={st.num} st={{ ...st, color: s.color }} onOpen={onOpen} hasCourse={!!cours[st.num]} />)}
            </div>
          </div>
        ))
      )}
    </div>
  );
}
function StdRow({ st, onOpen, hasCourse }) {
  return (
    <button onClick={() => hasCourse && onOpen(st)} disabled={!hasCourse}
      className={`text-left rounded-xl border p-3 transition-all flex items-start gap-2.5 ${hasCourse ? "bg-white border-slate-200 hover:shadow-md hover:-translate-y-0.5 cursor-pointer" : "bg-slate-50 border-slate-100 opacity-60"}`}>
      <span className="text-white text-[11px] font-bold px-2 py-0.5 rounded shrink-0 mt-0.5" style={{ background: st.color || "#7c3aed" }}>{st.code}</span>
      <span className="min-w-0">
        <span className="block text-sm font-medium text-slate-800 leading-snug">{st.title_fr}</span>
        {st.status && <span className="text-[10px] text-slate-400">{st.status}</span>}
      </span>
    </button>
  );
}

/* ── Une sous-section générique (cadre légal, cycles, terrain, outils…) ── */
function AuditGeneric({ section, onBack }) {
  return (
    <div>
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-slate-500 hover:text-indigo-600 mb-3"><ArrowLeft size={15} /> Accueil Audit</button>
      <div className="rounded-2xl border border-violet-200 bg-violet-50/50 p-5 mb-4">
        <div className="flex items-center gap-2"><span className="text-2xl">{section._icon || "📋"}</span><h2 className="text-xl font-bold text-slate-800">{section._label}</h2></div>
        {section._description && <p className="text-sm text-slate-600 mt-1"><MdInline text={section._description} /></p>}
      </div>
      <AnyAudit data={omitKeys(section, ["_label", "_icon", "_description"])} />
    </div>
  );
}

/* ── Accueil Audit (hub) ── */
const AUDIT_ORDER = ["annuaire", "nas", "cadre_legal", "cycles", "procedures_assertions", "quiz", "cas_pratiques", "examens_blancs", "arbres", "comparatifs", "lexique", "outils", "modeles", "terrain", "independance", "fraude", "goingconcern", "timeline", "actualites"];
function AuditHome({ data, onSection }) {
  const keys = AUDIT_ORDER.filter((k) => data[k]);
  Object.keys(data).forEach((k) => { if (k[0] !== "_" && k !== "annuaire_cours" && AUDIT_ORDER.indexOf(k) < 0) keys.push(k); });
  return (
    <div className="space-y-5">
      <div className="rounded-2xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white p-5 shadow">
        <h2 className="text-xl font-bold">Module Audit — NAS / ISA</h2>
        <p className="text-sm text-violet-100 mt-1">Les 47 normes ISA en cours complets, le cadre légal suisse, les cycles, les QCM et tous les outils du réviseur.</p>
      </div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
        {keys.map((k) => { const s = data[k]; return (
          <button key={k} onClick={() => onSection(k)} className="text-left bg-white border border-slate-200 rounded-xl p-4 hover:shadow-md hover:-translate-y-0.5 transition-all flex flex-col gap-1.5">
            <div className="flex items-center gap-2"><span className="text-xl">{s._icon || "📋"}</span><span className="font-bold text-sm text-violet-700">{s._label || k}</span></div>
            {s._description && <div className="text-xs text-slate-500 leading-snug"><MdInline text={s._description} /></div>}
            {k === "annuaire" && <div className="text-xs text-slate-400 mt-auto pt-1">47 normes · cours complets</div>}
          </button>
        ); })}
      </div>
    </div>
  );
}

function AuditApp() {
  const [data, setData] = useState(null);
  const [loadErr, setLoadErr] = useState(null);
  const [view, setView] = useState({ k: "home" });
  useEffect(() => {
    let dead = false;
    (async () => {
      for (const p of ["../data/audit.json", "data/audit.json", "/data/audit.json"]) {
        try { const r = await fetch(p); if (r.ok) { const j = await r.json(); if (!dead) setData(j); return; } } catch (e) {}
      }
      if (!dead) setLoadErr("Impossible de charger les données du module Audit.");
    })();
    return () => { dead = true; };
  }, []);
  const go = (v) => { setView(v); try { window.scrollTo(0, 0); } catch (e) {} };
  if (loadErr) return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-8 text-center text-rose-600 text-sm">{loadErr}</div>;
  if (!data) return <div className="min-h-screen bg-slate-100 flex items-center justify-center p-8 text-center text-slate-400 text-sm">Chargement du module Audit…</div>;
  const cours = data.annuaire_cours || {};
  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      <header className="bg-gradient-to-r from-slate-900 to-violet-900 text-white">
        <div className="max-w-5xl mx-auto px-4 py-4 flex items-center gap-3">
          <Search size={22} className="text-violet-300" />
          <div><h1 className="text-lg font-bold">Audit — NAS / ISA</h1><p className="text-xs text-violet-200">47 normes ISA · cadre suisse · cycles · QCM · outils</p></div>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-4 py-6">
        {view.k === "home" && <AuditHome data={data} onSection={(k) => go(k === "annuaire" ? { k: "annuaire" } : { k: "section", key: k })} />}
        {view.k === "annuaire" && (
          <div>
            <button onClick={() => go({ k: "home" })} className="flex items-center gap-1.5 text-sm text-slate-500 hover:text-indigo-600 mb-3"><ArrowLeft size={15} /> Accueil Audit</button>
            <AuditAnnuaire annuaire={data.annuaire} cours={cours} onOpen={(st) => go({ k: "course", std: st })} />
          </div>
        )}
        {view.k === "course" && <AuditCourse std={view.std} course={cours[view.std.num] || {}} onBack={() => go({ k: "annuaire" })} />}
        {view.k === "section" && <AuditGeneric section={data[view.key] || {}} onBack={() => go({ k: "home" })} />}
      </main>
      <footer className="max-w-5xl mx-auto px-4 py-6 text-center text-xs text-slate-400">Outil pédagogique — NAS suisses alignées sur les ISA.</footer>
    </div>
  );
}


createRoot(document.getElementById("root")).render(<AuditApp />);

</script>
</body>
</html>
