s au CO, interdites en RPC, interdites en IFRS", "Interdites au CO, permises en RPC, permises en IFRS", "Permises partout", "Interdites partout"], "answer": 0, "explain": "Les réserves latentes arbitraires sont permises au CO (prudence), mais interdites en RPC et en IFRS, qui visent tous deux l'image fidèle. C'est le contraste central de la question d'évaluation."}]}]}]}, {"code": "RPC 30", "title": "Comptes consolidés (Swiss GAAP RPC 30)", "icon": "🏢", "color": "rose", "tagline": "La **consolidation à la suisse** : périmètre par le **contrôle**, **méthode de l'acquisition**, et surtout un **goodwill** qu'on peut **amortir (≤ 20 ans)** *ou* **imputer directement aux fonds propres** — la grande divergence avec IFRS 3.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "**Swiss GAAP RPC 30** (en allemand *Swiss GAAP FER 30*) est **LA** recommandation suisse sur les **comptes consolidés**. Elle décrit comment une **société mère** agrège ses filiales pour donner une **image fidèle** (*true and fair view*) du **groupe** comme s'il formait une **seule entité économique**.\n\nLa logique d'ensemble est très proche du monde IFRS : on délimite un **périmètre de consolidation** à partir du **contrôle**, on intègre les filiales contrôlées en **intégration globale**, on traite les acquisitions par la **méthode de l'acquisition** (*purchase method*), on **élimine** les opérations internes au groupe, on présente les **intérêts minoritaires** (NCI) dans les fonds propres et on **convertit** les filiales étrangères. Jusque-là, RPC 30 et IFRS 10/3/11/IAS 28 se ressemblent.\n\nMais deux **spécificités suisses** font toute la différence à l'examen : (1) **le goodwill** peut, **au choix**, être **activé puis amorti** (durée d'utilité, en règle **5 ans**, **max 20 ans**) **OU** **imputé directement aux fonds propres** dès l'acquisition (avec, dans ce cas, une **mention en annexe** de l'effet théorique d'une activation — un *shadow accounting* du goodwill) ; (2) pour le **contrôle conjoint**, RPC 30 **admet encore l'intégration proportionnelle**, là où **IFRS 11** l'a **supprimée** au profit de la seule mise en équivalence."}, {"type": "keypoints", "title": "Les 7 réflexes à ancrer", "accent": "rose", "items": ["**Périmètre = contrôle** : généralement **> 50 %** des droits de vote → **intégration globale** (ligne à ligne, 100 % des actifs/passifs).", "**Méthode de l'acquisition** : actifs et passifs à la **valeur actuelle** à la **date d'acquisition** ; **goodwill = prix d'achat − actif net réévalué**.", "**Goodwill — DEUX options suisses** : (1) **activation + amortissement** (en règle 5 ans, **max 20 ans**) avec test de dépréciation, **OU** (2) **imputation directe aux fonds propres** + **annexe** (effet théorique d'une activation).", "**Contrôle conjoint** : **intégration proportionnelle OU mise en équivalence** (RPC 30 **admet** la proportionnelle, **contrairement à IFRS 11**).", "**Influence notable (20–50 %)** → **mise en équivalence** (*equity method*), comme IAS 28.", "**NCI** présentés **dans les fonds propres** consolidés ; **éliminations** intragroupes systématiques (créances/dettes, résultats internes, dividendes).", "**Obligation de consolider** : **CO art. 963** (contrôle) ; **dispense art. 963a** (seuils 20/40/250) ; consolidation selon un **référentiel reconnu** (RPC 30 en est un)."]}, {"type": "callout", "tone": "key", "title": "La phrase qui résume tout", "text": "**RPC 30 = consolidation par le contrôle, méthode de l'acquisition — mais goodwill amortissable (≤ 20 ans) OU imputable aux fonds propres, et intégration proportionnelle encore admise pour le contrôle conjoint.**\n\nAutrement dit : la mécanique ressemble à IFRS, mais sur **deux points** la Suisse garde sa **liberté de choix** (goodwill ; coentreprises) là où l'IFRS impose une **règle unique**."}, {"type": "callout", "tone": "info", "title": "Le décor légal : pourquoi consolider ?", "text": "Le **Code des obligations** impose des **comptes de groupe** dès qu'une société **contrôle** une ou plusieurs entreprises (**CO art. 963**). Une **dispense** existe pour les petits groupes (**CO art. 963a**, seuils de taille), mais **jamais** pour les sociétés **cotées**, celles qui émettent des emprunts, ni les **grandes** structures. Lorsque la consolidation est requise, elle doit suivre un **référentiel reconnu** (*anerkannter Standard*) — et **Swiss GAAP RPC** (donc RPC 30) **en est un**, au même titre qu'IFRS ou US GAAP. RPC 30 fournit donc le **\"comment\"** que le CO ne détaille pas."}, {"type": "diagram", "kind": "group", "parent": {"label": "Société mère M"}, "pct": 80, "child": {"label": "Filiale F"}, "nci": 20, "method": "Intégration globale (contrôle)", "caption": "Le **contrôle** (> 50 %) déclenche l'**intégration globale** : on cumule **100 %** de F, on élimine la participation, on isole les **NCI** (ici 20 %, dans les fonds propres)."}]}, {"title": "📐 Périmètre & vocabulaire", "blocks": [{"type": "intro", "text": "Tout commence par une question : **qui entre dans le périmètre, et avec quelle méthode ?** La réponse dépend du **degré d'influence** que la mère exerce sur l'entité détenue. RPC 30 distingue trois grands niveaux — **contrôle**, **contrôle conjoint**, **influence notable** — auxquels correspondent des méthodes de consolidation différentes. Le réflexe d'examen est de **qualifier d'abord le lien**, puis d'en **déduire** la méthode."}, {"type": "table", "title": "Le degré d'influence commande la méthode (RPC 30)", "headers": ["Lien avec l'entité détenue", "Indice usuel", "Méthode de consolidation"], "rows": [["**Contrôle**", "En règle **> 50 %** des droits de vote (ou contrôle de fait : pacte, majorité au conseil, pouvoir de diriger les politiques financière et opérationnelle)", "**Intégration globale** (*Vollkonsolidierung*) : 100 % des actifs/passifs/charges/produits, **NCI** isolés."], ["**Contrôle conjoint**", "Direction **partagée** par convention entre partenaires (joint-venture)", "**Intégration proportionnelle** (quote-part ligne à ligne) **OU** **mise en équivalence** — **au choix** en RPC 30."], ["**Influence notable**", "En règle **20 % à 50 %** des droits de vote (sièges au conseil, transactions significatives, échanges de dirigeants)", "**Mise en équivalence** (*equity method*) : une seule ligne « participation », réévaluée de la quote-part de résultat."], ["**Simple placement**", "**< 20 %**, sans influence notable", "**Pas de consolidation** : titre à sa valeur (coût / valeur actuelle selon le poste)."]]}, {"type": "table", "title": "Le vocabulaire à manier", "headers": ["Terme", "Définition opérationnelle"], "rows": [["**Société mère** (*Muttergesellschaft*)", "Entité qui **contrôle** une ou plusieurs autres et qui établit les comptes consolidés."], ["**Périmètre de consolidation**", "Ensemble des entités intégrées dans les comptes du groupe (filiales, coentreprises, sociétés associées)."], ["**Intégration globale**", "On reprend **100 %** des actifs et passifs de la filiale, on **élimine la participation**, on **isole les NCI**. La mère contrôle, donc on agrège **tout**."], ["**Intégration proportionnelle**", "On reprend la **quote-part** (ex. 50 %) de chaque ligne d'une **coentreprise**. **Admise** en RPC 30, **supprimée** en IFRS 11."], ["**Mise en équivalence** (MEE)", "La participation figure sur **une seule ligne**, ajustée chaque année de la **quote-part de résultat** (et des dividendes reçus, qui la **réduisent**)."], ["**Goodwill** (*écart d'acquisition*)", "**Prix d'acquisition − actif net réévalué** acquis. Surplus payé pour les synergies, la part de marché, l'équipe — éléments **non identifiables**."], ["**Intérêts minoritaires** (NCI)", "Part des fonds propres et du résultat d'une filiale **non** détenue par la mère. Présentés **dans les fonds propres** consolidés."], ["**Écart de conversion**", "Différence née de la **conversion** d'une filiale étrangère (cours de clôture vs cours historique), portée en **fonds propres** (et non au résultat)."]]}, {"type": "callout", "tone": "tip", "title": "Substance plutôt que pourcentage", "text": "Les seuils **> 50 %** et **20–50 %** sont des **présomptions**, pas des automatismes. Ce qui compte, c'est le **pouvoir réel** : on peut **contrôler avec moins de 50 %** (contrôle de fait via un pacte d'actionnaires, une majorité au conseil, un actionnariat dispersé) ou n'avoir **aucune influence** malgré 25 % (droits purement protectifs). **Raisonne en substance économique**, exactement comme IFRS 10 le demande pour le contrôle."}, {"type": "diagram", "kind": "spectrum", "title": "Le degré d'influence commande la méthode (RPC 30)", "bands": [{"from": 0, "to": 20, "color": "slate", "short": "Placement", "label": "**< 20 %** — simple placement, **pas de consolidation** (titre à sa valeur)"}, {"from": 20, "to": 50, "color": "emerald", "short": "MEE", "label": "**20–50 %** — influence notable → **mise en équivalence** (une ligne)"}, {"from": 50, "to": 100, "color": "rose", "short": "Contrôle", "label": "**> 50 %** — contrôle → **intégration globale** (100 % ligne à ligne, NCI isolés)"}], "caption": "Et au milieu, à part : le **contrôle conjoint** (coentreprise) → **intégration proportionnelle OU MEE**, au choix en RPC 30. Les seuils sont des **présomptions** : raisonne en **substance** (contrôle de fait possible sous 50 %)."}, {"type": "diagram", "kind": "pyramid", "title": "Du lien le plus fort au plus faible", "levels": [{"t": "Contrôle (> 50 %)", "d": "Intégration globale — 100 % des actifs/passifs, NCI isolés"}, {"t": "Contrôle conjoint", "d": "Intégration proportionnelle (quote-part) OU mise en équivalence"}, {"t": "Influence notable (20–50 %)", "d": "Mise en équivalence — une seule ligne « participation »"}, {"t": "Simple placement (< 20 %)", "d": "Pas de consolidation — titre à sa valeur"}], "accent": "rose", "caption": "Qualifier d'abord le **lien**, puis **en déduire** la méthode — le réflexe d'examen RPC 30."}]}, {"title": "⚖️ Méthode de l'acquisition & goodwill", "blocks": [{"type": "intro", "text": "Lorsqu'une entité **prend le contrôle** d'une filiale, RPC 30 applique la **méthode de l'acquisition** (*purchase method*), qui se déroule en trois temps. **Un** — à la **date d'acquisition**, on **réévalue** les actifs et passifs identifiables de la cible à leur **valeur actuelle** (et non à leur valeur comptable historique). **Deux** — on compare le **prix d'acquisition** à cet **actif net réévalué** : la différence est le **goodwill**. **Trois** — on décide du **sort du goodwill**, et c'est ici que la Suisse offre une **liberté de choix** unique."}, {"type": "callout", "tone": "key", "title": "L'équation du goodwill (RPC 30)", "text": "**Goodwill = Prix d'acquisition − Actif net identifiable réévalué (à la valeur actuelle) acquis.**\n\nSi le résultat est **positif** ⇒ **goodwill** (écart d'acquisition actif). S'il est **négatif** ⇒ **badwill** (*écart d'acquisition négatif*), traité avec prudence : on **réexamine** d'abord les valeurs, puis l'excédent est en principe porté en **fonds propres** ou différé/repris au résultat selon sa nature."}, {"type": "heading", "text": "Le goodwill : la spécificité suisse (deux options)"}, {"type": "intro", "text": "C'est **le** point qui distingue RPC 30 de tout le reste. Une fois le goodwill calculé, l'entité **choisit** entre deux traitements — et ce choix doit être **appliqué de façon constante** (permanence des méthodes) :"}, {"type": "table", "title": "Goodwill RPC 30 — les deux options au choix", "headers": ["Option", "Mécanique", "Suivi & annexe"], "rows": [["**① Activation + amortissement**", "Le goodwill est porté à l'**actif** (immobilisation incorporelle) puis **amorti systématiquement** sur sa **durée d'utilité** — **en règle 5 ans**, **maximum 20 ans** si une durée plus longue se justifie.", "**Amortissement** au résultat chaque année **+ test de dépréciation** (*impairment*) dès qu'un indice apparaît. L'amortissement **pèse sur le résultat** du groupe."], ["**② Imputation directe aux fonds propres**", "Le goodwill est **soustrait des fonds propres** consolidés **dès l'acquisition** : il **n'apparaît jamais à l'actif** et n'est **jamais amorti**.", "**Mention obligatoire en annexe** de l'**effet théorique** d'une activation : montant brut, amortissements cumulés théoriques, valeur nette théorique et l'impact sur le résultat (*\"shadow accounting\"* du goodwill). Le **résultat n'est pas grevé** d'amortissement, mais les **fonds propres** sont **immédiatement réduits**."]]}, {"type": "callout", "tone": "warn", "title": "La divergence MAJEURE avec IFRS 3 / IAS 36", "text": "En **IFRS**, le goodwill **n'est JAMAIS amorti** et **JAMAIS** imputé aux fonds propres : il reste à l'actif et subit un **test de dépréciation annuel** (IAS 36). En **RPC 30**, **les deux options** sont **interdites** côté IFRS : on **amortit** (≤ 20 ans) **ou** on **impute aux fonds propres**. C'est l'un des contrastes **les plus testés** à l'examen suisse. Réflexe : si l'énoncé parle de **goodwill imputé aux fonds propres** ou **amorti sur 5 ans**, on est en **RPC 30**, pas en IFRS."}, {"type": "callout", "tone": "info", "title": "Pourquoi cette liberté \"fonds propres\" ?", "text": "Historiquement, beaucoup de groupes suisses jugeaient le goodwill **incertain** et préféraient **l'effacer immédiatement** des fonds propres (prudence patrimoniale) plutôt que de porter à l'actif une valeur fragile. RPC 30 a **maintenu** cette possibilité, **à condition** d'en montrer l'effet théorique en **annexe** pour préserver la **comparabilité** : le lecteur peut ainsi reconstituer ce qu'aurait donné une activation. C'est tout l'objet du *shadow accounting* du goodwill."}, {"type": "diagram", "kind": "waterfall", "title": "Pont du goodwill (exemple Helvetia → Léman, 80 %)", "items": [{"label": "Prix d'acquisition", "value": 1000, "kind": "add"}, {"label": "− Quote-part actif net réévalué (80 % × 1 000)", "value": 800, "kind": "sub"}, {"label": "= Goodwill", "value": 200, "kind": "total"}], "caption": "**Goodwill = prix − actif net identifiable réévalué acquis** = 1 000 − 800 = **200**. Calculé sur la **part du groupe** (80 %) en RPC 30. Si négatif ⇒ **badwill** (réexamen, traitement prudent)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Swiss GAAP RPC 30", "color": "rose", "items": ["**AU CHOIX** des deux traitements", "① **Activé + amorti** : durée d'utilité, en règle **5 ans**, **max 20 ans**", "② **OU imputé aux fonds propres** dès l'acquisition (+ **annexe** : effet théorique)", "Test de dépréciation si indice (option ①)"]}, {"title": "IFRS 3 / IAS 36", "color": "indigo", "items": ["**JAMAIS amorti**", "Reste à l'**actif**", "**Test de dépréciation annuel** (IAS 36)", "Imputation aux fonds propres **interdite**"]}, {"title": "CO (art. 963 ss)", "color": "amber", "items": ["Pas de méthode détaillée prescrite", "Renvoi au **référentiel reconnu** choisi", "(RPC 30 ou IFRS)", "Prudence patrimoniale dominante"]}], "caption": "**LA spécificité suisse** du goodwill : *amorti ≤ 20 ans OU imputé aux FP* (RPC) **vs** *non amorti, test annuel* (IFRS) — l'un des contrastes **les plus testés** à l'examen."}]}, {"title": "🧮 Étapes de consolidation & écritures", "blocks": [{"type": "steps", "title": "La consolidation par intégration globale, pas à pas", "accent": "rose", "steps": [{"t": "① Délimiter le périmètre", "d": "Identifier les entités **contrôlées** (intégration globale), sous **contrôle conjoint** (proportionnelle ou MEE) et sous **influence notable** (MEE). **Qualifier le lien** avant tout calcul."}, {"t": "② Homogénéiser", "d": "Retraiter les comptes individuels pour appliquer des **méthodes d'évaluation uniformes** (RPC) et une **date de clôture** commune ; **convertir** les filiales étrangères dans la monnaie de présentation."}, {"t": "③ Cumuler ligne à ligne", "d": "Additionner **100 %** des actifs, passifs, charges et produits de chaque filiale intégrée globalement (quote-part pour la proportionnelle)."}, {"t": "④ Éliminer la participation & dégager le goodwill", "d": "Compenser la **valeur de la participation** chez la mère contre la **quote-part d'actif net réévalué** acquise. L'écart résiduel = **goodwill** → **activer/amortir** OU **imputer aux fonds propres**."}, {"t": "⑤ Isoler les intérêts minoritaires (NCI)", "d": "Attribuer aux **minoritaires** leur quote-part de l'**actif net** et du **résultat** des filiales non détenues à 100 %. Les NCI sont présentés **dans les fonds propres** consolidés."}, {"t": "⑥ Éliminer les opérations intragroupes", "d": "Supprimer **créances/dettes** réciproques, **produits/charges** internes, **résultats internes** non réalisés (sur **stocks** et **immobilisations** vendus dans le groupe) et **dividendes** intragroupes."}]}, {"type": "journal", "title": "Écriture — élimination de la participation & goodwill (acquisition 80 %)", "note": "Consolidation : la mère a payé 1 000 pour 80 % d'une filiale dont l'actif net réévalué vaut 1 000 (capital + réserves). On élimine 100 % des fonds propres de la filiale, on inscrit la quote-part NCI (20 % × 1 000 = 200), et le résiduel est le goodwill : 1 000 − 80 % × 1 000 = 200.", "lines": [{"compte": "Capital & réserves de la filiale (actif net réévalué, 100 %)", "debit": 1000}, {"compte": "Goodwill (écart d'acquisition résiduel)", "debit": 200}, {"compte": "Participation dans la filiale (chez la mère, éliminée)", "credit": 1000}, {"compte": "Intérêts minoritaires — NCI (20 % de l'actif net)", "credit": 200}]}, {"type": "journal", "title": "Écriture — option ① : amortissement annuel du goodwill (5 ans)", "note": "Goodwill activé de 200, durée d'utilité 5 ans, amortissement linéaire → 200 / 5 = 40 par an. L'amortissement grève le résultat consolidé.", "lines": [{"compte": "Charge d'amortissement du goodwill (résultat)", "debit": 40}, {"compte": "Goodwill (ou amortissements cumulés)", "credit": 40}]}, {"type": "journal", "title": "Écriture — option ② : imputation directe du goodwill aux fonds propres", "note": "À l'acquisition, le goodwill de 200 est immédiatement soustrait des fonds propres consolidés : il ne figure jamais à l'actif et n'est jamais amorti. En contrepartie, l'annexe mentionnera l'effet théorique d'une activation (shadow accounting).", "lines": [{"compte": "Fonds propres consolidés (réserves)", "debit": 200}, {"compte": "Goodwill (compensé, jamais porté à l'actif)", "credit": 200}]}, {"type": "journal", "title": "Écriture — élimination d'un résultat interne sur stock", "note": "La filiale A a vendu à la filiale B des marchandises ; B les détient encore en stock à la clôture. La marge interne incluse dans ce stock (ici 30) n'est pas réalisée vis-à-vis de tiers : on l'élimine pour ne pas gonfler le résultat et l'actif du groupe.", "lines": [{"compte": "Résultat consolidé (marge interne non réalisée)", "debit": 30}, {"compte": "Stocks (ramenés au coût pour le groupe)", "credit": 30}]}, {"type": "journal", "title": "Écriture — élimination d'un dividende intragroupe", "note": "La filiale a distribué un dividende de 50 à la mère, comptabilisé en produit financier chez la mère. Au niveau du groupe, ce n'est qu'un transfert interne : on l'élimine (sinon double comptage avec le résultat déjà consolidé de la filiale).", "lines": [{"compte": "Produit de dividende (chez la mère, éliminé)", "debit": 50}, {"compte": "Réserves / résultat consolidé", "credit": 50}]}, {"type": "callout", "tone": "warn", "title": "Ne pas oublier les résultats internes \"dormants\"", "text": "Les **créances/dettes** et **produits/charges** réciproques sont les éliminations **évidentes**. Les plus oubliées sont les **résultats internes non réalisés** logés dans un **actif encore détenu** par le groupe : marge sur **stock** invendu, plus-value sur une **immobilisation** cédée d'une filiale à une autre. Tant que l'actif n'est **pas sorti** vers un **tiers**, ce profit **n'existe pas** pour le groupe et doit être **neutralisé**."}, {"type": "diagram", "kind": "flow", "title": "La consolidation par intégration globale, pas à pas", "steps": [{"label": "① Délimiter le périmètre", "sub": "Qualifier le lien : contrôle / conjoint / influence notable"}, {"label": "② Homogénéiser", "sub": "Méthodes uniformes, date commune, conversion des filiales étrangères"}, {"label": "③ Cumuler ligne à ligne", "sub": "100 % des actifs/passifs/charges/produits (quote-part si proportionnelle)"}, {"label": "④ Éliminer la participation", "sub": "Contre l'actif net réévalué → dégager le goodwill"}, {"label": "⑤ Isoler les NCI", "sub": "Quote-part minoritaire d'actif net & de résultat (dans les FP)"}, {"label": "⑥ Éliminer l'intragroupe", "sub": "Créances/dettes, résultats internes (stocks/immos), dividendes"}], "accent": "rose", "caption": "Mnémo **PAGNEC** : Périmètre · Acquisition · Goodwill · NCI · Éliminations · Conversion."}]}, {"title": "🌍 Filiales étrangères & minoritaires", "blocks": [{"type": "heading", "text": "Conversion des filiales étrangères"}, {"type": "intro", "text": "Une filiale qui tient ses comptes en **monnaie étrangère** doit être **convertie** dans la **monnaie de présentation** du groupe avant d'être cumulée. RPC 30 retient la méthode du **cours de clôture** (proche de la méthode IFRS pour une activité autonome) : les **postes du bilan** sont convertis au **cours de clôture**, alors que les **capitaux propres historiques** restent au **cours historique** (celui de leur date d'origine). La différence qui en résulte est l'**écart de conversion**.\n\nPoint capital : cet **écart de conversion** n'est **pas** un résultat — il ne traverse **pas** le compte de résultat, mais est porté **directement dans les fonds propres** consolidés (une réserve de conversion). Il ne sera **recyclé** au résultat qu'au moment de la **cession** de la filiale étrangère."}, {"type": "table", "title": "Conversion d'une filiale étrangère — quel cours pour quoi ?", "headers": ["Élément converti", "Cours appliqué", "Logique"], "rows": [["**Actifs & passifs** (postes du bilan)", "**Cours de clôture** (date du bilan)", "Photographie de la situation patrimoniale à la date de clôture."], ["**Capitaux propres** d'origine (capital, réserves à l'acquisition)", "**Cours historique** (date d'apport/acquisition)", "Figés à leur valeur d'entrée ; ne suivent pas le change."], ["**Charges & produits** (compte de résultat)", "**Cours moyen** de la période (ou cours de transaction)", "Approxime le change au fil de l'exercice."], ["**Écart de conversion** (résiduel)", "Solde porté **en fonds propres** (réserve de conversion)", "Pas un résultat : recyclé au résultat **seulement à la cession** de la filiale."]]}, {"type": "callout", "tone": "tip", "title": "Le réflexe \"où va l'écart de conversion ?\"", "text": "L'erreur classique est de faire **passer l'écart de conversion au résultat**. En consolidation (RPC 30 comme IFRS), pour une filiale **autonome** convertie au **cours de clôture**, l'écart va **en fonds propres** (réserve de conversion), **pas** au compte de résultat. Il n'**impacte le résultat** qu'au moment où la filiale est **vendue** (recyclage)."}, {"type": "heading", "text": "Intérêts minoritaires (NCI)"}, {"type": "intro", "text": "Quand la mère contrôle une filiale **sans la détenir à 100 %**, la part des **autres actionnaires** s'appelle les **intérêts minoritaires** (*non-controlling interests*, NCI). En **intégration globale**, on cumule **100 %** des actifs et passifs de la filiale ; il faut donc **isoler** la quote-part qui revient aux minoritaires, **au bilan** (quote-part d'actif net) **et au compte de résultat** (quote-part du résultat de la période).\n\nEn RPC 30, les NCI sont présentés **dans les fonds propres** consolidés (comme une composante distincte des capitaux propres du groupe), et la quote-part de résultat des minoritaires est **isolée** au sein du résultat consolidé. C'est cohérent avec IFRS 10, qui classe également les NCI **en capitaux propres** (et non en dette ni en poste intermédiaire)."}, {"type": "callout", "tone": "key", "title": "NCI : dans les fonds propres, jamais en dette", "text": "Les **intérêts minoritaires** font partie des **fonds propres consolidés** : ce sont des **propriétaires** de filiales, pas des **créanciers** du groupe. On les présente sur une **ligne distincte** des capitaux propres (et leur quote-part de résultat sur une ligne distincte du résultat). En RPC 30, le goodwill est généralement calculé sur la **seule part du groupe** (la quote-part minoritaire de goodwill n'est pas mise en avant), alors qu'IFRS 3 **ouvre l'option** du goodwill **complet** (NCI à la juste valeur)."}]}, {"title": "🔢 Exemple chiffré — consolider une filiale à 80 %", "blocks": [{"type": "intro", "text": "Rien ne vaut un cas chiffré pour fixer **goodwill**, **NCI** et surtout le **choix amortissement vs imputation aux fonds propres**. On traite la **même acquisition** sous **les deux options** de goodwill de RPC 30, puis on regarde l'**effet sur le résultat et les fonds propres**."}, {"type": "example", "title": "Le groupe Helvetia SA acquiert 80 % de Léman SA", "statement": "Le 1er janvier, **Helvetia SA** acquiert **80 %** des actions de **Léman SA** pour **1 000** (CHF k), réglés en trésorerie. À la date d'acquisition :\n- Valeur comptable de l'**actif net** de Léman = **900** ; après **réévaluation à la valeur actuelle** des actifs/passifs identifiables, l'**actif net réévalué = 1 000**.\n- Helvetia ne détenait **aucune** participation antérieure dans Léman.\n- Le goodwill est calculé sur la **part du groupe** (80 %).\n\n**Travail demandé :**\n1) Calculez le **goodwill** et les **intérêts minoritaires (NCI)** à l'acquisition.\n2) Passez l'écriture d'**élimination de la participation**.\n3) Montrez l'effet sur le **résultat** et les **fonds propres** de l'année 1 selon **l'option ① (amortissement sur 5 ans)** puis **l'option ② (imputation aux fonds propres)**.\n4) Que dit l'**annexe** dans l'option ② ?", "solution": "**1) Goodwill et NCI**\n- Quote-part d'actif net réévalué acquise = **80 % × 1 000 = 800**.\n- **Goodwill = Prix − quote-part d'actif net réévalué = 1 000 − 800 = 200.**\n- **NCI = 20 % × 1 000 (actif net réévalué) = 200**, présentés **dans les fonds propres** consolidés.\n- Vérification : Participation 1 000 = quote-part groupe 800 + goodwill 200. ✔️\n\n**2) Écriture d'élimination de la participation**\n*Dr Capital & réserves de Léman (actif net réévalué, 100 %) 1 000 · Dr Goodwill 200 · Cr Participation dans Léman 1 000 · Cr NCI 200.*\nLes débits (1 200) égalent les crédits (1 200). ✔️\n\n---\n\n**3) Effet année 1 selon l'option de goodwill**\n\n**Option ① — Activation + amortissement (5 ans)**\n- Goodwill **à l'actif = 200** au 1er janvier.\n- Amortissement de l'année = **200 / 5 = 40** → **charge au résultat consolidé : −40**.\n- Fin d'année 1 : goodwill net à l'actif = **160** ; les fonds propres ne sont réduits que **progressivement** (via l'amortissement annuel).\n\n**Option ② — Imputation directe aux fonds propres**\n- Le goodwill **200** est **soustrait des fonds propres** dès l'acquisition : **aucun actif**, **aucun amortissement**.\n- Résultat de l'année 1 : **non grevé** d'amortissement (**+40** de résultat par rapport à l'option ①).\n- Mais les **fonds propres** sont **immédiatement** plus bas de **200** (au lieu de la baisse progressive de l'option ①).\n\n---\n\n**Réconciliation des deux options (fin année 1)**\n- **Résultat** : option ② est **supérieure de 40** (pas d'amortissement).\n- **Fonds propres** : option ② est **inférieure** — réduits de **200** dès le départ, contre une réduction cumulée de **40** seulement en option ① (goodwill net 160 encore à l'actif). Écart de fonds propres ≈ **200 − 40 = 160** en faveur de l'option ① à la fin de l'année 1.\n- Sur **5 ans**, l'option ① aura **totalement amorti** les 200 ; les deux options **convergent** alors sur les fonds propres (à 200 de réduction cumulée), mais le **profil temporel** du résultat diffère.\n\n**4) Annexe (option ②) — le \"shadow accounting\" du goodwill**\nL'entreprise doit indiquer l'**effet théorique d'une activation** : goodwill **brut 200**, amortissement théorique de l'année **40**, **amortissements cumulés théoriques 40**, **valeur nette théorique 160**, et l'**impact sur le résultat** (−40) qu'aurait eu une activation. Le lecteur peut ainsi **reconstituer** un bilan/résultat comparable à l'option ①.\n\n**Réflexe IFRS** : en **IFRS 3**, **aucune** de ces deux options n'est permise — le goodwill de 200 resterait **à l'actif**, **non amorti**, et ne serait réduit qu'en cas de **dépréciation** (test annuel IAS 36)."}, {"type": "table", "title": "Synthèse — les deux options de goodwill (année 1)", "headers": ["Poste", "Option ① Activation + amort. (5 ans)", "Option ② Imputation FP"], "rows": [["Goodwill à l'actif (1er janvier)", "200", "0 (jamais activé)"], ["Charge au résultat (année 1)", "−40 (amortissement)", "0"], ["Goodwill net à l'actif (fin année 1)", "160", "0"], ["Réduction des fonds propres (cumulée, fin année 1)", "40", "200 (dès l'acquisition)"], ["NCI (fonds propres)", "200", "200"], ["Annexe spécifique", "Amortissement & test de dépréciation", "**Effet théorique d'une activation (shadow accounting)**"]]}, {"type": "diagram", "kind": "split", "title": "Répartition de l'actif net réévalué de Léman (1 000)", "parts": [{"label": "Part du groupe Helvetia (80 %)", "value": 80, "color": "rose"}, {"label": "Intérêts minoritaires NCI (20 %)", "value": 20, "color": "amber"}], "caption": "Quote-part groupe = **800**, NCI = **200** (20 % × 1 000), présentés **dans les fonds propres** consolidés. La participation payée (1 000) = part groupe 800 **+ goodwill 200**. ✔️"}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Option ① Activation + amort. (5 ans)", "color": "rose", "items": ["Goodwill à l'actif (1er janv.) : **200**", "Amortissement année 1 : **−40** au résultat", "Goodwill net fin année 1 : **160**", "Réduction cumulée des FP : **40**"]}, {"title": "Option ② Imputation aux fonds propres", "color": "violet", "items": ["Goodwill à l'actif : **0** (jamais activé)", "Charge au résultat : **0** (+40 vs option ①)", "FP réduits de **200** dès l'acquisition", "Annexe : **effet théorique** (shadow accounting)"]}], "caption": "Même goodwill de 200, deux profils : l'option ② **épargne le résultat** (+40) mais **réduit les FP immédiatement** de 200. Sur 5 ans, les deux **convergent** (200 de réduction cumulée)."}]}, {"title": "🗂️ RPC 30 vs IFRS 10/3/11/IAS 28 vs CO 963", "blocks": [{"type": "intro", "text": "Le tableau **incontournable**. On confronte la consolidation suisse (**RPC 30**) au bloc consolidation **IFRS** (**IFRS 10** contrôle, **IFRS 3** regroupements, **IFRS 11** partenariats, **IAS 28** mise en équivalence) et au socle **légal** du **Code des obligations** (**art. 963–963b**). Les deux lignes qui rapportent le plus de points : **goodwill** et **intégration proportionnelle**."}, {"type": "compare", "title": "Consolidation : IFRS (10/3/11/IAS 28) vs Swiss GAAP RPC 30 vs CO (art. 963 ss)", "rows": [{"crit": "Obligation de consolider", "ifrs": "Oui dès le **contrôle** (**IFRS 10**)", "rpc": "Oui dès le **contrôle** (référentiel reconnu)", "co": "Oui si **contrôle** (**art. 963**) ; **dispense** de taille (**art. 963a**, seuils 20/40/250), **jamais** pour cotées/grandes structures"}, {"crit": "Définition du contrôle", "ifrs": "**Pouvoir + exposition aux rendements variables + capacité d'influer** (IFRS 10)", "rpc": "**Contrôle** (en règle **> 50 %** des voix ou contrôle de fait)", "co": "**Contrôle** (majorité des voix ou pouvoir de fait, art. 963 al. 2)"}, {"crit": "Filiale contrôlée", "ifrs": "**Intégration globale** (IFRS 10)", "rpc": "**Intégration globale**", "co": "Intégration selon le **référentiel reconnu** choisi"}, {"crit": "Contrôle conjoint (coentreprise)", "ifrs": "**Mise en équivalence UNIQUEMENT** (IFRS 11 a **supprimé** la proportionnelle)", "rpc": "**Intégration proportionnelle OU mise en équivalence** (**au choix** — proportionnelle ADMISE)", "co": "Non détaillé ; suit le référentiel reconnu"}, {"crit": "Influence notable (20–50 %)", "ifrs": "**Mise en équivalence** (**IAS 28**)", "rpc": "**Mise en équivalence**", "co": "Selon le référentiel reconnu"}, {"crit": "Méthode du regroupement", "ifrs": "**Méthode de l'acquisition** imposée (IFRS 3)", "rpc": "**Méthode de l'acquisition** (*purchase method*)", "co": "Pas de méthode prescrite en détail ; renvoi au référentiel"}, {"crit": "Réévaluation des actifs/passifs (PPA)", "ifrs": "**Juste valeur** obligatoire (IFRS 3 / IFRS 13)", "rpc": "**Valeur actuelle** à la date d'acquisition (actif net réévalué)", "co": "Non spécifié (renvoi au référentiel)"}, {"crit": "Goodwill — traitement", "ifrs": "**Activé, NON amorti**, **test de dépréciation annuel** (IAS 36) ; imputation aux FP **interdite**", "rpc": "**Au choix** : **activé + amorti** (en règle 5 ans, **max 20 ans**) + test **OU** **imputé directement aux fonds propres** (+ **annexe** de l'effet théorique)", "co": "Selon le référentiel reconnu (RPC ou IFRS)"}, {"crit": "Badwill (goodwill négatif)", "ifrs": "**Profit en résultat** après réexamen (IFRS 3)", "rpc": "Approche **prudente** : réexamen, puis fonds propres / différé selon nature", "co": "Non codifié"}, {"crit": "NCI (intérêts minoritaires)", "ifrs": "**En capitaux propres** ; **option** JV (goodwill **complet**) ou quote-part (IFRS 3/10)", "rpc": "**Dans les fonds propres** ; goodwill en règle sur la **part du groupe**", "co": "Minoritaires présentés ; pas d'option JV codifiée"}, {"crit": "Conversion des filiales étrangères", "ifrs": "**Cours de clôture** ; écart de conversion en **OCI / capitaux propres** (IAS 21)", "rpc": "**Cours de clôture** ; écart de conversion **en fonds propres**", "co": "Selon le référentiel reconnu"}, {"crit": "Informations à fournir", "ifrs": "**Très étendues** (IFRS 12 notamment)", "rpc": "**Annexe RPC** (plus légère ; + effet théorique du goodwill si option FP)", "co": "**Minimales** (exigences légales de base)"}]}, {"type": "keypoints", "title": "Les 3 divergences qui rapportent des points", "accent": "amber", "items": ["**Goodwill** : *amorti (≤ 20 ans) OU imputé aux fonds propres* (RPC 30) **vs** *non amorti, test annuel IAS 36* (IFRS 3) **vs** *selon le référentiel choisi* (CO). **LE** contraste central.", "**Contrôle conjoint** : *intégration proportionnelle ADMISE* (RPC 30) **vs** *mise en équivalence UNIQUEMENT* (IFRS 11). Deuxième grande divergence.", "**Obligation/dispense** : le **CO 963/963a** déclenche l'obligation et fixe les **seuils de dispense** (20/40/250), puis renvoie à un **référentiel reconnu** — dont **RPC 30** fait partie."]}, {"type": "callout", "tone": "info", "title": "Articulation CO ↔ RPC 30 ↔ IFRS en une phrase", "text": "**CO** dit *\"tu DOIS consolider (sauf petits groupes) et selon un référentiel reconnu\"* · **RPC 30** fournit *\"le COMMENT à la suisse, avec liberté sur le goodwill et les coentreprises\"* · **IFRS 10/3/11/IAS 28** fournit *\"le COMMENT international, avec règle UNIQUE (goodwill non amorti, MEE seule pour les JV)\"*. Le CO est le **déclencheur** ; RPC 30 et IFRS sont deux **modes d'emploi** concurrents reconnus."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Swiss GAAP RPC 30", "color": "rose", "items": ["Goodwill **amorti ≤ 20 ans OU imputé aux FP** (+ annexe)", "Contrôle conjoint : **proportionnelle OU MEE**", "Conso par le **contrôle**, méthode de l'acquisition", "NCI en FP (goodwill sur part du groupe)"]}, {"title": "IFRS 10/3/11/IAS 28", "color": "indigo", "items": ["Goodwill **non amorti**, test annuel (IAS 36)", "Contrôle conjoint : **MEE UNIQUEMENT** (IFRS 11)", "Contrôle = pouvoir + rendements variables (IFRS 10)", "NCI en CP : **option JV** (goodwill complet)"]}, {"title": "CO (art. 963 ss)", "color": "amber", "items": ["**Déclencheur** : obligation si contrôle (art. 963)", "**Dispense** de taille (art. 963a, seuils 20/40/250)", "Jamais pour cotées / grandes structures", "Renvoi à un **référentiel reconnu** (RPC ou IFRS)"]}], "caption": "Le **CO** est le **déclencheur** ; **RPC 30** et **IFRS** sont deux **modes d'emploi** reconnus. Les 2 lignes qui rapportent : **goodwill** et **intégration proportionnelle**."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Plaquer le \"goodwill non amorti\" d'IFRS sur RPC 30", "text": "Erreur n°1. En **RPC 30**, le goodwill **n'est pas** laissé à l'actif sans amortissement : on **amortit** (en règle 5 ans, **max 20 ans**) **ou** on **impute aux fonds propres**. Le **test de dépréciation annuel sans amortissement** d'IAS 36 est une **règle IFRS**, pas RPC. Inversement, parler d'**imputation du goodwill aux fonds propres** en IFRS est une **faute** : IFRS l'**interdit**."}, {"type": "callout", "tone": "warn", "title": "Oublier l'annexe \"shadow accounting\" en option fonds propres", "text": "Choisir l'**imputation directe aux fonds propres** **sans** mentionner en **annexe** l'**effet théorique d'une activation** (goodwill brut, amortissements cumulés théoriques, valeur nette théorique, impact résultat) **viole RPC 30**. Cette information est la **contrepartie obligatoire** de l'option ② — elle préserve la comparabilité."}, {"type": "callout", "tone": "warn", "title": "Croire que la proportionnelle est interdite (confusion IFRS 11)", "text": "En **IFRS 11**, l'intégration **proportionnelle** des coentreprises a été **supprimée** (mise en équivalence obligatoire). Mais en **RPC 30**, elle reste **admise** au choix. Ne transpose **pas** la règle IFRS 11 à une question RPC : pour un **contrôle conjoint** en RPC, **les deux** méthodes (proportionnelle **ou** MEE) sont **valables**."}, {"type": "callout", "tone": "warn", "title": "Faire passer l'écart de conversion au résultat", "text": "Pour une filiale étrangère **autonome** convertie au **cours de clôture**, l'**écart de conversion** va **en fonds propres** (réserve de conversion), **pas** au compte de résultat. Il n'est **recyclé** au résultat qu'à la **cession** de la filiale. Le faire transiter par le résultat chaque année **fausse** le bénéfice consolidé."}, {"type": "keypoints", "title": "Autres pièges classiques", "accent": "rose", "items": ["**Confondre les méthodes** : intégration **globale** (contrôle, 100 % ligne à ligne) ≠ **proportionnelle** (contrôle conjoint, quote-part) ≠ **mise en équivalence** (influence notable, une seule ligne). Qualifier le **lien** d'abord.", "**NCI en dette** : les intérêts minoritaires sont **dans les fonds propres**, **jamais** une dette du groupe.", "**Oublier les résultats internes non réalisés** : marge sur **stock** invendu ou plus-value sur **immobilisation** cédée entre filiales → à **éliminer** tant que l'actif n'est pas sorti vers un **tiers**.", "**Oublier d'éliminer les dividendes intragroupes** : double comptage du résultat de la filiale si on les laisse en produit chez la mère.", "**Dispense de consolidation mal appliquée** : la dispense **CO 963a** (seuils 20/40/250) **ne joue pas** pour les sociétés **cotées**, émettrices d'emprunts ou **grandes** — vérifier la qualité de l'entité avant de conclure à la dispense.", "**Réévaluation à l'acquisition oubliée** : la méthode de l'acquisition impose la **valeur actuelle** des actifs/passifs identifiables ; partir des **valeurs comptables** historiques **fausse** le goodwill."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "PAGNEC", "phrase": "« **P**érimètre par le contrôle, méthode de l'**A**cquisition, **G**oodwill (amorti OU fonds propres), **N**CI dans les fonds propres, **E**liminations intragroupes, **C**onversion des filiales étrangères » — la consolidation RPC 30 tient dans PAGNEC.", "items": [{"l": "P", "t": "**Périmètre** — contrôle (> 50 %) → globale ; conjoint → proportionnelle **ou** MEE ; influence notable (20–50 %) → MEE."}, {"l": "A", "t": "**Acquisition** — méthode de l'acquisition : actifs/passifs à la **valeur actuelle** à la date d'acquisition."}, {"l": "G", "t": "**Goodwill** = prix − actif net réévalué → **amorti (≤ 20 ans) OU imputé aux fonds propres** (+ annexe)."}, {"l": "N", "t": "**NCI** — intérêts minoritaires présentés **dans les fonds propres** consolidés."}, {"l": "E", "t": "**Eliminations** — créances/dettes, résultats internes (stocks/immos), dividendes intragroupes."}, {"l": "C", "t": "**Conversion** — filiales étrangères au **cours de clôture** ; écart de conversion **en fonds propres**."}]}, {"type": "keypoints", "title": "Structurer une réponse \"consolidation RPC 30\" (ce qui paie)", "accent": "emerald", "items": ["**Annoncer le déclencheur légal** : CO art. 963 (obligation dès le contrôle), vérifier la **dispense** 963a (seuils 20/40/250 ; pas pour cotées/grandes structures), puis « consolidation selon RPC 30, **référentiel reconnu** ».", "**Qualifier le lien et choisir la méthode** : contrôle → **globale** ; conjoint → **proportionnelle ou MEE** ; influence notable → **MEE**.", "**Dérouler la méthode de l'acquisition** : réévaluation à la **valeur actuelle**, puis **goodwill = prix − actif net réévalué**.", "**Trancher le goodwill** : présenter **les deux options** (amortissement ≤ 20 ans **vs** imputation aux fonds propres + **annexe**) et leur **effet** sur résultat/fonds propres.", "**Isoler les NCI** (dans les fonds propres) et **éliminer** systématiquement les opérations intragroupes (dont **résultats internes** et **dividendes**).", "**Conclure par le triple contraste** : RPC 30 (goodwill au choix, proportionnelle admise) **vs** IFRS 3/10/11/IAS 28 (goodwill non amorti, MEE seule) **vs** CO 963 (déclencheur + dispense)."]}, {"type": "callout", "tone": "key", "title": "Citations & repères sûrs", "text": "**Swiss GAAP RPC 30** : comptes consolidés (périmètre par le contrôle, méthode de l'acquisition, goodwill **amorti ≤ 20 ans OU imputé aux fonds propres** + annexe, NCI en fonds propres, éliminations, conversion).\n**IFRS** : **IFRS 10** (contrôle, intégration globale) · **IFRS 3** (regroupements, goodwill non amorti, NCI) · **IFRS 11** (partenariats : MEE **seule** pour les coentreprises) · **IAS 28** (mise en équivalence) · **IAS 36** (dépréciation du goodwill) · **IAS 21** (conversion).\n**CO** : **art. 963** (obligation de consolider — contrôle) · **art. 963a** (dispense, seuils **20 / 40 / 250** ; exceptions cotées/grandes structures) · référentiel **reconnu** exigé.\n*(Si un numéro précis de paragraphe RPC est incertain, citer la notion sans le numéro.)*"}, {"type": "callout", "tone": "tip", "title": "Le réflexe \"RPC ou IFRS ?\" en 2 secondes", "text": "Deux **marqueurs** trahissent immédiatement le référentiel : si l'énoncé **amortit le goodwill** ou l'**impute aux fonds propres** → **RPC 30**. S'il **intègre proportionnellement** une coentreprise → **RPC 30** (impossible en IFRS 11). À l'inverse, **goodwill non amorti + test annuel** ou **coentreprise en MEE obligatoire** → **IFRS**."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste ta maîtrise de RPC 30 (8 questions)", "questions": [{"q": "En RPC 30, quelle méthode applique-t-on à une filiale CONTRÔLÉE (en règle > 50 % des voix) ?", "options": ["La mise en équivalence", "L'intégration proportionnelle", "L'intégration globale (100 % des actifs/passifs, NCI isolés)", "Aucune : on garde le titre à sa valeur d'acquisition"], "answer": 2, "explain": "Le contrôle déclenche l'intégration globale : on cumule 100 % des actifs, passifs, charges et produits de la filiale, on élimine la participation et on isole les intérêts minoritaires (NCI)."}, {"q": "Comment RPC 30 traite-t-il un CONTRÔLE CONJOINT (coentreprise), et en quoi diffère-t-il d'IFRS 11 ?", "options": ["Intégration globale obligatoire, comme IFRS 11", "Intégration proportionnelle OU mise en équivalence au choix ; IFRS 11 n'autorise plus que la mise en équivalence", "Mise en équivalence obligatoire, identique à IFRS 11", "Pas de consolidation du tout"], "answer": 1, "explain": "RPC 30 ADMET l'intégration proportionnelle (ou la mise en équivalence, au choix) pour les coentreprises. IFRS 11 a supprimé la proportionnelle et impose la seule mise en équivalence : c'est une divergence majeure."}, {"q": "Quelle est la formule du goodwill en RPC 30 (méthode de l'acquisition) ?", "options": ["Prix d'acquisition − valeur comptable historique de l'actif net", "% acquis × capitaux propres comptables de la filiale", "Prix d'acquisition − actif net identifiable réévalué (à la valeur actuelle) acquis", "Actif net réévalué − prix d'acquisition"], "answer": 2, "explain": "On réévalue d'abord les actifs/passifs identifiables à la valeur actuelle à la date d'acquisition, puis goodwill = prix d'acquisition − actif net réévalué acquis. Un résultat négatif donne un badwill (réexamen, puis traitement prudent)."}, {"q": "Quelles sont les DEUX options de traitement du goodwill propres à RPC 30 ?", "options": ["Activation sans amortissement (test annuel) OU passage immédiat en charges", "Activation + amortissement (en règle 5 ans, max 20 ans) OU imputation directe aux fonds propres (avec annexe)", "Amortissement sur 40 ans OU réévaluation annuelle", "Maintien au coût OU juste valeur par le résultat"], "answer": 1, "explain": "RPC 30 laisse le choix : (1) activer puis amortir le goodwill sur sa durée d'utilité (en règle 5 ans, max 20 ans) avec test de dépréciation, OU (2) l'imputer directement aux fonds propres à l'acquisition, en mentionnant en annexe l'effet théorique d'une activation (shadow accounting)."}, {"q": "En quoi le traitement du goodwill diffère-t-il fondamentalement entre RPC 30 et IFRS 3 ?", "options": ["Aucune différence : les deux amortissent sur 5 ans", "IFRS 3 amortit le goodwill, RPC 30 ne l'amortit jamais", "RPC 30 permet de l'amortir (≤ 20 ans) ou de l'imputer aux fonds propres ; IFRS 3 le laisse à l'actif, NON amorti, avec test de dépréciation annuel (IAS 36)", "RPC 30 passe le goodwill en charges immédiatement ; IFRS 3 l'ignore"], "answer": 2, "explain": "C'est LE contraste central : en IFRS 3, le goodwill n'est jamais amorti ni imputé aux fonds propres (test de dépréciation annuel, IAS 36). RPC 30 autorise l'amortissement (≤ 20 ans) OU l'imputation directe aux fonds propres."}, {"q": "Si une entreprise choisit d'imputer le goodwill directement aux fonds propres en RPC 30, que doit-elle faire en plus ?", "options": ["Rien de particulier : l'imputation suffit", "Mentionner en annexe l'effet théorique d'une activation (goodwill brut, amortissements cumulés théoriques, valeur nette théorique, impact résultat)", "Réintégrer le goodwill à l'actif l'année suivante", "Le passer intégralement en charges au compte de résultat"], "answer": 1, "explain": "L'imputation aux fonds propres a pour contrepartie obligatoire une mention en annexe de l'effet théorique d'une activation (shadow accounting du goodwill), pour préserver la comparabilité avec l'option d'activation/amortissement."}, {"q": "Où sont présentés les intérêts minoritaires (NCI) dans les comptes consolidés selon RPC 30 ?", "options": ["Dans les dettes à long terme", "Dans les fonds propres consolidés, sur une ligne distincte", "Au compte de résultat uniquement", "Hors bilan, en annexe seulement"], "answer": 1, "explain": "Les NCI sont des propriétaires de filiales (pas des créanciers) : ils figurent dans les fonds propres consolidés, sur une ligne distincte, et leur quote-part de résultat est isolée au sein du résultat consolidé. Cohérent avec IFRS 10."}, {"q": "Une filiale étrangère est convertie au cours de clôture. Où va l'écart de conversion qui en résulte ?", "options": ["Au compte de résultat de l'année, en produit ou charge financière", "En fonds propres (réserve de conversion), recyclé au résultat seulement à la cession de la filiale", "Dans le goodwill", "Il est purement et simplement ignoré"], "answer": 1, "explain": "Pour une filiale autonome convertie au cours de clôture, l'écart de conversion est porté en fonds propres (réserve de conversion), pas au résultat. Il n'impacte le résultat qu'au moment de la cession de la filiale (recyclage). Le faire transiter par le résultat chaque année est une erreur classique."}]}]}]}, {"code": "RPC 23/11/27", "title": "Provisions, impôts différés & instruments (Swiss GAAP RPC)", "icon": "📦", "color": "amber", "tagline": "Trois passifs qui font peur et trois réflexes simples : une **provision** (RPC 23) seulement si l'obligation est **probable et estimable** (jamais de lissage), des **impôts différés** (RPC 11) calculés sur les **différences temporelles** par une approche **bilancielle**, et des **dérivés** (RPC 27) à la **valeur de marché**.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "Cette leçon réunit **trois thèmes** que l'examen aime croiser parce qu'ils touchent tous au **passif** et au **résultat**, et parce que c'est là que **RPC**, **CO** et **IFRS** divergent le plus :\n\n- **Provisions (RPC 23)** : quand transformer une incertitude en **dette comptabilisée** plutôt qu'en simple **passif éventuel** mentionné en annexe.\n- **Impôts différés (RPC 11)** : comment l'écart entre la **valeur comptable RPC** et la **valeur fiscale** d'un poste crée un **impôt à payer (ou à récupérer) plus tard**.\n- **Instruments financiers dérivés (RPC 27)** : pourquoi un *forward*, une *option* ou un *swap* s'évalue à la **valeur de marché**, et ce qu'est la **comptabilité de couverture** simplifiée.\n\nLe fil rouge des RPC reste l'**image fidèle** (*true and fair view*) : on comptabilise la **réalité économique**, **sans** matelas de prudence caché. Une provision ne sert **jamais** à lisser le résultat (≠ les **réserves latentes** tolérées par le CO), les impôts différés rendent **visible** une charge fiscale future, et les dérivés apparaissent au bilan à leur **vraie valeur** au lieu de rester hors-bilan."}, {"type": "keypoints", "title": "Les 7 réflexes à ancrer", "accent": "emerald", "items": ["**Provision (RPC 23)** = obligation (**juridique OU de fait**) née d'un **événement passé**, **sortie probable** de ressources, **estimation fiable** → on **comptabilise** un passif.", "**Pas les trois critères ?** → **passif éventuel** (mention en **annexe**), pas d'écriture au bilan.", "**Aucune provision de réserve / de lissage** en RPC : ce serait une **réserve latente** (admise au CO, **proscrite** en RPC).", "**Impôts différés (RPC 11)** : **approche bilancielle** sur les **différences temporelles** entre valeur comptable RPC et **valeur fiscale**.", "**Impôts différés passifs : obligatoires** ; **actifs : seulement si le recouvrement est probable** (bénéfices futurs / reports de pertes utilisables).", "**Dérivés (RPC 27)** : évaluation à la **valeur de marché** ; variations au **résultat**, **sauf** comptabilité de **couverture** (alors symétrie avec l'élément couvert).", "**Triple contraste** : le **CO** ignore le plus souvent les impôts différés et tolère les réserves latentes ; les **IFRS** (IAS 37, IAS 12, IFRS 9) sont plus complets et prescriptifs ; la **RPC** est **au milieu**."]}, {"type": "callout", "tone": "key", "title": "La phrase qui résume tout", "text": "**Une provision si l'obligation est probable et chiffrable (jamais pour lisser) · des impôts différés sur les différences temporelles bilan RPC ↔ bilan fiscal · des dérivés à la valeur de marché.**\n\nDans les trois cas, la RPC applique le même principe : **montrer la réalité économique**, ni plus (pas de juste valeur généralisée comme IFRS), ni moins (pas de réserve cachée comme au CO)."}, {"type": "callout", "tone": "info", "title": "Pourquoi regrouper ces trois sujets ?", "text": "Ce sont les **trois grands postes de passif/charge où l'estimation et le référentiel font la différence**. Une question d'examen typique présente un bilan, demande de **décider** s'il faut provisionner, de **chiffrer** l'impôt différé qui en découle, et de **comparer** le traitement RPC à celui du CO (souvent rien d'impôt différé) et des IFRS (mécanique complète). Les maîtriser ensemble, c'est gagner sur un cas transversal."}]}, {"title": "📐 Le vocabulaire qui sépare provision, passif éventuel & charge à payer", "blocks": [{"type": "intro", "text": "La moitié des erreurs sur ce thème vient d'un **mot mal placé**. Trois notions voisines mais **distinctes** doivent être maniées avec précision : la **provision**, le **passif éventuel** (*contingent liability*) et la **charge à payer** (*accrual*). La différence se joue sur **deux axes** : le **degré d'incertitude** (probable ? possible ?) et la **précision de l'estimation** (montant et échéance connus ?)."}, {"type": "table", "title": "Provision vs passif éventuel vs charge à payer", "headers": ["Notion", "Obligation ?", "Sortie de ressources", "Estimation", "Traitement comptable"], "rows": [["**Provision** (RPC 23)", "Oui — **juridique ou de fait**, née d'un **événement passé**", "**Probable** (plus probable qu'improbable)", "**Montant et/ou échéance incertains** mais **estimables de façon fiable**", "**Comptabilisée** : passif au bilan + charge au résultat"], ["**Passif éventuel** (*contingent*)", "Obligation **possible** (dépend d'un événement futur incertain) **ou** obligation présente non fiable", "**Seulement possible** (pas probable)", "Souvent **non estimable de façon fiable**", "**Pas** comptabilisé : **mention en annexe** uniquement"], ["**Charge à payer** (*accrual*)", "Oui — obligation **certaine ou quasi certaine**", "**Quasi certaine**", "Montant et échéance **bien connus** (faible incertitude)", "Comptabilisée en **dettes** (passifs de régularisation), pas en « provisions »"]]}, {"type": "callout", "tone": "tip", "title": "Le test de décision en 3 questions", "text": "Pour trancher provision vs passif éventuel, posez **dans l'ordre** :\n1. **Y a-t-il une obligation actuelle** (juridique ou de fait) résultant d'un **événement passé** ? — *Non → ni provision ni passif éventuel (au plus, mention si engagement futur).*\n2. **La sortie de ressources est-elle probable ?** — *Non, seulement possible → passif éventuel (annexe).*\n3. **Peut-on l'estimer de façon fiable ?** — *Non → passif éventuel (annexe). Oui aux trois → **provision** comptabilisée.*"}, {"type": "callout", "tone": "warn", "title": "Obligation « de fait » : ne pas la rater", "text": "Une **obligation de fait** (*constructive obligation*) naît du **comportement** de l'entité, même sans contrat : pratique passée constante, déclaration publique, politique annoncée (ex. garantie commerciale habituelle au-delà du contrat, plan de restructuration **annoncé** et engagé). Elle **crée une attente légitime** chez les tiers et peut **obliger à provisionner** au même titre qu'une obligation juridique. Beaucoup de candidats ne provisionnent que les obligations **légales** : c'est une erreur."}, {"type": "keypoints", "title": "Exemples de provisions classiques", "accent": "indigo", "items": ["**Garanties** données aux clients (coûts de réparation/remplacement probables sur les ventes déjà réalisées).", "**Litiges** en cours dont la perte est **probable** et **estimable** (un litige seulement **possible** = passif éventuel).", "**Restructuration** : provision si un **plan détaillé** existe **et** a été **communiqué/engagé** (attente légitime créée).", "**Remise en état / démantèlement** : obligation de dépollution ou de démantèlement liée à une installation existante.", "**Contrats déficitaires** (*onerous contracts*) : coûts inévitables du contrat **supérieurs** aux avantages attendus."]}, {"type": "diagram", "kind": "flow", "title": "Arbre de décision — faut-il provisionner ?", "steps": [{"label": "Obligation actuelle ?", "sub": "Juridique OU de fait, née d'un événement PASSÉ"}, {"label": "Sortie de ressources probable ?", "sub": "Plus probable qu'improbable (≠ simplement possible)"}, {"label": "Estimation fiable ?", "sub": "Montant chiffrable (fourchette / espérance / meilleure estimation)"}, {"label": "→ PROVISION comptabilisée", "sub": "Passif au bilan + charge au résultat. Un seul NON ⇒ passif éventuel (annexe), pas d'écriture"}], "accent": "emerald", "caption": "Les 3 critères de RPC 23 sont cumulatifs : il faut OUI aux trois pour comptabiliser. Un seul NON renvoie en passif éventuel (mention en annexe)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Provision (RPC 23)", "color": "emerald", "items": ["Obligation juridique OU de fait (événement passé)", "Sortie PROBABLE de ressources", "Montant/échéance incertains mais ESTIMABLES", "→ Passif au bilan + charge au résultat"]}, {"title": "Passif éventuel", "color": "amber", "items": ["Obligation seulement POSSIBLE (événement futur)", "Sortie possible, pas probable", "Souvent non estimable de façon fiable", "→ Mention en ANNEXE, aucune écriture"]}, {"title": "Charge à payer", "color": "indigo", "items": ["Obligation certaine / quasi certaine", "Sortie quasi certaine", "Montant et échéance BIEN connus", "→ Dettes (régularisations), pas « provision »"]}], "caption": "Deux axes séparent les trois notions : le degré d'incertitude (probable / possible / certain) et la précision de l'estimation."}]}, {"title": "⚖️ Provisions (RPC 23) — règles de reconnaissance & évaluation", "blocks": [{"type": "intro", "text": "La recommandation dédiée aux **provisions** pose des conditions **cumulatives** strictes. On ne comptabilise une provision **que si les trois** sont réunies — c'est ce qui empêche d'en faire un outil de **lissage du résultat**."}, {"type": "steps", "title": "Les 3 conditions cumulatives d'une provision", "accent": "emerald", "steps": [{"t": "① Obligation actuelle issue d'un événement passé", "d": "Il existe, à la date du bilan, une **obligation** (juridique **ou** de fait) qui **résulte d'un événement déjà survenu**. Pas d'obligation issue du passé ⇒ pas de provision (on ne provisionne **pas** des charges d'exploitation futures liées à l'activité à venir)."}, {"t": "② Sortie de ressources probable", "d": "Le règlement de l'obligation **entraînera probablement** une sortie de ressources (trésorerie, autres actifs). **Probable** = plus probable qu'improbable. Si la sortie n'est que **possible**, c'est un **passif éventuel** (annexe)."}, {"t": "③ Estimation fiable", "d": "Le montant peut être **estimé de manière fiable** (au besoin par une fourchette, une espérance ou la meilleure estimation). Une incertitude **raisonnable** n'empêche pas la provision ; une **impossibilité** d'estimer la renvoie en passif éventuel."}]}, {"type": "heading", "text": "Évaluation : la meilleure estimation"}, {"type": "intro", "text": "La provision est évaluée à la **meilleure estimation** de la dépense nécessaire pour **éteindre l'obligation** à la date du bilan. Concrètement :\n- pour une **obligation unique** (ex. un litige), on retient le **montant le plus probable** ;\n- pour une **population d'éléments** (ex. garanties sur des milliers de ventes), on retient l'**espérance** (somme des montants pondérés par leurs probabilités) ;\n- lorsque l'**effet temps est significatif** (échéance lointaine, ex. démantèlement), l'**actualisation** de la provision est admise/recommandée afin de refléter la valeur économique de l'engagement.\n\nÀ chaque clôture, la provision est **revue** : **augmentée**, **réduite** ou **reprise** (dissoute) si l'obligation a évolué ou disparu. La **reprise** d'une provision devenue sans objet est portée au **résultat** (produit)."}, {"type": "keypoints", "title": "Provisions RPC — points qui rapportent", "accent": "indigo", "items": ["**Meilleure estimation** de la sortie de ressources ; **espérance** pour les grandes populations (garanties).", "**Actualisation** admise quand l'effet du temps est **significatif** (engagements à long terme).", "**Réexamen à chaque clôture** : ajustement à la hausse/baisse, **reprise** si l'obligation disparaît.", "**Pas de provisions générales de réserve** (lissage, « gros entretien futur » non engagé, risques généraux d'exploitation) : ce serait une **réserve latente** proscrite.", "**Remboursement attendu d'un tiers** (assurance, recours) : comptabilisé **séparément** à l'actif **seulement si quasi certain**, sans compenser la provision au passif."]}, {"type": "callout", "tone": "warn", "title": "LE piège : la provision de lissage / de réserve", "text": "En **CO**, on peut constituer des **provisions surévaluées** ou des **provisions pour risques généraux** afin de **lisser le résultat** et de constituer des **réserves latentes** (art. 960e CO admet des provisions au-delà du strict nécessaire à des fins de prudence). En **RPC**, c'est **interdit** : une provision qui ne correspond **pas** à une obligation réelle, probable et estimable **viole l'image fidèle**. Pas de provision « au cas où », pas de matelas pour absorber un futur mauvais exercice."}, {"type": "callout", "tone": "info", "title": "Provision ≠ amortissement ≠ correction de valeur", "text": "Ne confondez pas une **provision** (passif : obligation envers un **tiers**) avec une **correction de valeur d'actif** (dépréciation d'un stock, d'une créance, d'une immobilisation — qui **réduit un actif**, ne crée pas de dette). Le **provisioning** d'une créance douteuse est en réalité une **dépréciation d'actif**, pas une provision au sens de RPC 23, même si le langage courant mélange les deux."}, {"type": "diagram", "kind": "flow", "title": "Cycle de vie d'une provision", "steps": [{"label": "Constitution", "sub": "Dr Charge / Cr Provision — on crée la dette"}, {"label": "Réexamen à chaque clôture", "sub": "Ajustement à la hausse ou à la baisse"}, {"label": "Utilisation", "sub": "Dr Provision / Cr Trésorerie — l'obligation se réalise (n'affecte pas le résultat)"}, {"label": "Reprise si sans objet", "sub": "Dr Provision / Cr Produit — l'obligation disparaît"}], "accent": "indigo", "caption": "Charge à la constitution, produit à la reprise ; entre les deux, l'utilisation consomme la provision sans toucher le résultat."}]}, {"title": "🧮 Écritures de provisions (constitution, ajustement, reprise)", "blocks": [{"type": "intro", "text": "Le cycle de vie d'une provision tient en trois écritures : **constitution** (on crée la dette par une charge), **utilisation** (l'obligation se réalise et consomme la provision), **reprise** (l'obligation disparaît → on dissout la provision en produit). Voici les schémas Dr/Cr de référence."}, {"type": "journal", "title": "Écriture — constitution d'une provision (garantie)", "note": "À la clôture, l'entité estime à 60 le coût probable des garanties à honorer sur les ventes de l'exercice. On crée le passif par une charge de l'exercice (rattachement à l'activité qui a généré l'obligation).", "lines": [{"compte": "Charge de garantie (résultat)", "debit": 60}, {"compte": "Provision pour garanties (passif)", "credit": 60}]}, {"type": "journal", "title": "Écriture — utilisation de la provision (la garantie joue)", "note": "Un client fait jouer la garantie ; la réparation coûte 25, payée en trésorerie. On impute la dépense sur la provision déjà constituée (pas de nouvelle charge tant que la provision suffit).", "lines": [{"compte": "Provision pour garanties (passif)", "debit": 25}, {"compte": "Trésorerie", "credit": 25}]}, {"type": "journal", "title": "Écriture — reprise d'une provision devenue sans objet", "note": "Un litige provisionné à 40 se solde finalement en faveur de l'entité : l'obligation disparaît. On dissout la provision ; la reprise est un produit de l'exercice.", "lines": [{"compte": "Provision pour litige (passif)", "debit": 40}, {"compte": "Reprise de provision (produit, résultat)", "credit": 40}]}, {"type": "callout", "tone": "tip", "title": "Le réflexe « charge à la constitution, produit à la reprise »", "text": "**Constituer** une provision **charge** le résultat (on anticipe la sortie). **Reprendre** une provision **crédite** le résultat (l'obligation s'est éteinte sans coûter le montant prévu). Entre les deux, **l'utilisation** ne touche normalement pas le résultat : elle **consomme** la provision déjà dotée. Si la dépense réelle **dépasse** la provision, l'excédent passe en **charge complémentaire** ; si elle est **inférieure**, le **reliquat** est **repris** en produit."}]}, {"title": "💸 Impôts différés (RPC 11) — la mécanique bilancielle", "blocks": [{"type": "intro", "text": "Les **impôts différés** existent parce que la **comptabilité** et le **fisc** ne calculent pas le résultat de la même façon. Un même poste peut avoir une **valeur comptable RPC** différente de sa **valeur fiscale** (la valeur retenue par l'administration). Cet écart se résorbera un jour — et générera alors un **impôt à payer en plus** ou une **économie d'impôt**. La RPC impose de **rendre cet effet visible** dès maintenant, via une **approche bilancielle**."}, {"type": "heading", "text": "Différence temporelle = moteur de l'impôt différé"}, {"type": "intro", "text": "On compare, poste par poste, la **valeur comptable RPC** et la **valeur fiscale**. L'écart est une **différence temporelle** (*temporary difference*) car il **s'inversera** dans le futur :\n- **Différence temporelle imposable** → quand elle s'inversera, elle **augmentera** l'impôt → **impôt différé PASSIF** (une dette d'impôt future). Cas typique : un actif dont la **valeur comptable > valeur fiscale** (ex. amortissements comptables plus lents que fiscaux, réévaluation d'un actif non reconnue fiscalement).\n- **Différence temporelle déductible** → quand elle s'inversera, elle **réduira** l'impôt → **impôt différé ACTIF** (une créance d'impôt future). Cas typique : un passif (provision) **reconnu en RPC mais pas encore déductible fiscalement**, ou un actif dont la **valeur comptable < valeur fiscale**.\n\nLe montant d'impôt différé = **différence temporelle × taux d'impôt** attendu lors de l'inversion."}, {"type": "table", "title": "Lire le sens de l'impôt différé", "headers": ["Situation", "Différence", "Effet futur sur l'impôt", "Impôt différé"], "rows": [["Actif : **VC comptable > valeur fiscale** (ex. amortissement comptable plus lent que fiscal)", "**Imposable**", "Impôt **plus élevé** plus tard", "**Passif** (obligatoire)"], ["Actif réévalué en RPC, non reconnu fiscalement", "**Imposable**", "Impôt **plus élevé** à la cession/réalisation", "**Passif** (obligatoire)"], ["Passif : **provision RPC non encore déductible** fiscalement", "**Déductible**", "Impôt **plus faible** quand la charge deviendra déductible", "**Actif** (si recouvrement probable)"], ["**Report de pertes fiscales** (*tax loss carryforward*)", "**Déductible**", "Impôt **réduit** sur bénéfices futurs", "**Actif** (si bénéfices futurs probables)"]]}, {"type": "keypoints", "title": "Impôts différés RPC — l'essentiel à graver", "accent": "emerald", "items": ["**Méthode bilancielle** : on part des **différences temporelles** (bilan RPC vs bilan fiscal), pas des écarts de charge dans le compte de résultat.", "**Impôts différés passifs : obligatoires** — toute différence temporelle imposable génère une dette d'impôt différé.", "**Impôts différés actifs : reconnus seulement si le recouvrement est probable** (bénéfices imposables futurs suffisants).", "**Reports de pertes** : un actif d'impôt différé est reconnu **si et dans la mesure où** des bénéfices futurs permettront de les utiliser (prudence sur la probabilité).", "**Taux** : on applique le **taux d'impôt attendu** au moment de l'inversion (taux en vigueur ou voté).", "**Variation** de l'impôt différé d'un exercice à l'autre = **charge ou produit d'impôt différé** au résultat (sauf rattachement direct aux capitaux propres pour certaines opérations)."]}, {"type": "callout", "tone": "warn", "title": "Le contraste majeur avec le CO", "text": "Dans les **comptes statutaires au CO**, on ne comptabilise **généralement pas** d'impôts différés : la charge d'impôt correspond à l'**impôt effectivement dû** (impôt courant), et les divergences comptabilité/fisc sont **souvent absorbées par les réserves latentes** (la comptabilité statutaire suit largement la base fiscale). En **RPC**, l'image fidèle **exige** d'isoler l'effet fiscal **futur** des différences temporelles → des **impôts différés actifs/passifs** apparaissent au bilan, **absents** des comptes CO. C'est un point d'examen récurrent."}, {"type": "callout", "tone": "info", "title": "RPC vs IFRS (IAS 12) — même esprit, version simplifiée", "text": "La RPC reprend la **logique bilancielle** d'**IAS 12** (différences temporelles, passifs obligatoires, actifs si recouvrables, reports de pertes). Les IFRS sont toutefois **plus détaillés** : règles précises sur les exceptions (comptabilisation initiale, *outside basis differences* sur participations), l'absence d'actualisation des impôts différés, la présentation. À l'examen, retenez : **RPC = IAS 12 allégé**, **CO = en principe rien d'impôt différé**."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Impôt différé PASSIF", "color": "rose", "items": ["Différence temporelle IMPOSABLE", "Actif : VC comptable > valeur fiscale", "Impôt PLUS ÉLEVÉ plus tard", "TOUJOURS obligatoire"]}, {"title": "Impôt différé ACTIF", "color": "emerald", "items": ["Différence temporelle DÉDUCTIBLE", "Provision non encore déductible / report de pertes", "Impôt PLUS FAIBLE plus tard", "Seulement si recouvrement PROBABLE"]}], "caption": "Asymétrie de prudence : le passif d'impôt différé est toujours comptabilisé ; l'actif seulement si des bénéfices futurs rendent sa récupération probable."}]}, {"title": "🔢 Exemple chiffré — impôt différé sur une différence temporelle", "blocks": [{"type": "intro", "text": "Le calcul classique : une **différence d'amortissement** entre la comptabilité RPC et le fisc crée un **impôt différé passif**. On déroule le raisonnement bilanciel, puis l'écriture."}, {"type": "example", "title": "La société HelvaMec — impôt différé sur une machine", "statement": "**HelvaMec** acquiert une machine pour **400** (CHF k) au début de l'exercice. \n- **En RPC**, elle l'amortit **linéairement sur 8 ans** → amortissement **50/an**, valeur comptable fin d'année 1 = **350**. \n- **Fiscalement**, l'administration admet un amortissement **accéléré** : **100** la première année → valeur fiscale fin d'année 1 = **300**. \n- **Taux d'impôt** sur le bénéfice attendu : **25 %**. \n\n**Travail demandé :** (a) identifiez la **différence temporelle** à la fin de l'année 1 et son **sens** ; (b) calculez l'**impôt différé** et dites s'il est **actif ou passif** ; (c) passez l'**écriture** ; (d) expliquez ce qui se passe en **année 2** (sens de la variation) et dites pourquoi le **CO** n'enregistrerait, lui, **rien** de différé.", "solution": "**(a) Différence temporelle (fin année 1)**\n- Valeur comptable RPC = **350** ; valeur fiscale = **300**.\n- Différence temporelle = 350 − 300 = **50**.\n- L'actif a une **valeur comptable (350) > valeur fiscale (300)** → différence **imposable** : à terme, l'administration aura « déjà » déduit plus d'amortissement, donc les exercices futurs supporteront un impôt **plus élevé**.\n\n**(b) Impôt différé**\n- Montant = différence temporelle × taux = **50 × 25 % = 12,5**.\n- Différence imposable ⇒ **impôt différé PASSIF de 12,5** (dette d'impôt future, **obligatoire** en RPC).\n\n**(c) Écriture (fin année 1)**\n- Débit **Charge d'impôt différé (résultat) 12,5**\n- Crédit **Impôts différés passifs (bilan) 12,5**\n\n**(d) Année 2 et années suivantes — l'inversion**\n- En RPC, l'amortissement reste **50/an** ; fiscalement, l'accéléré étant « consommé », l'amortissement fiscal devient **plus faible** que le comptable. La différence temporelle **se résorbe** progressivement : la valeur fiscale **rattrape** la valeur comptable.\n- À mesure que la différence diminue, l'**impôt différé passif est repris** (Débit *Impôts différés passifs* / Crédit *Produit d'impôt différé*). Sur la durée de vie de la machine, le **cumul s'annule** : l'impôt différé ne fait que **redistribuer** la charge fiscale dans le temps pour **coller à la réalité économique**.\n\n**Pourquoi le CO n'enregistre rien de différé ?**\n- Dans les **comptes statutaires au CO**, on suit largement la **base fiscale** : la charge d'impôt = **impôt courant** réellement dû, et l'écart d'amortissement comptable/fiscal se traduit par une **réserve latente** (sur-amortissement fiscal admis), **pas** par un impôt différé. Aucune écriture d'impôt différé n'est passée. C'est **précisément** ce que la RPC corrige pour donner l'**image fidèle** : elle **montre** la dette d'impôt future de **12,5**."}, {"type": "journal", "title": "Écriture — comptabilisation de l'impôt différé passif (fin année 1)", "note": "Différence temporelle imposable de 50 × taux 25 % = 12,5. La variation de l'impôt différé passe au résultat (charge d'impôt différé), distincte de l'impôt courant.", "lines": [{"compte": "Charge d'impôt différé (résultat)", "debit": 12.5}, {"compte": "Impôts différés passifs (bilan)", "credit": 12.5}]}, {"type": "callout", "tone": "key", "title": "Lecture de l'exemple", "text": "L'impôt différé ne **crée pas** d'impôt en plus : il **replace** dans le bon exercice la charge fiscale liée à une différence **temporaire**. Ici, l'amortissement fiscal accéléré **avance** une économie d'impôt → la RPC reconnaît la **dette d'impôt future** (passif 12,5) pour ne pas **surévaluer** le résultat de l'année 1. Le **CO**, lui, laisse cet effet dans les **réserves latentes** et n'affiche **rien** de différé."}, {"type": "diagram", "kind": "waterfall", "title": "HelvaMec — de la différence temporelle à l'impôt différé", "items": [{"label": "Valeur comptable RPC", "value": 350, "kind": "add"}, {"label": "− Valeur fiscale", "value": 300, "kind": "sub"}, {"label": "= Différence temporelle (imposable)", "value": 50, "kind": "total"}, {"label": "× Taux d'impôt 25 %", "value": 12.5, "kind": "total"}], "caption": "VC RPC 350 − valeur fiscale 300 = différence temporelle imposable de 50 ; × 25 % = impôt différé PASSIF de 12,5 (obligatoire en RPC)."}]}, {"title": "📉 Instruments financiers dérivés (RPC 27)", "blocks": [{"type": "intro", "text": "Un **instrument financier dérivé** est un contrat dont la **valeur dépend d'un sous-jacent** (cours de change, taux d'intérêt, prix d'une matière première, cours d'une action) et qui **ne requiert pas (ou peu) d'investissement initial**, avec un **règlement futur**. Exemples : *forward* de change, *future*, **option**, **swap** de taux. Économiquement, un dérivé peut servir à **spéculer** ou à **se couvrir** (*hedging*) contre un risque.\n\nLa logique RPC : un dérivé représente un **droit ou une obligation** dont la valeur évolue — il doit donc **figurer au bilan** à sa **valeur de marché** (*fair value*), et non rester **hors-bilan**. C'est un net rapprochement de la réalité économique par rapport au CO, où les dérivés sont souvent traités **hors-bilan** (simple engagement conditionnel en annexe)."}, {"type": "keypoints", "title": "Dérivés RPC 27 — l'essentiel", "accent": "indigo", "items": ["**Évaluation à la valeur de marché** (*fair value*) : un dérivé positif = **actif**, un dérivé négatif = **passif**.", "**Variations de valeur au résultat** dans le cas général (dérivé de **trading / spéculation**).", "**Comptabilité de couverture** (*hedge accounting*) : si le dérivé couvre **efficacement** un risque identifié, on **synchronise** son effet avec celui de l'élément couvert pour neutraliser la **volatilité** du résultat.", "**Documentation** de la relation de couverture (risque couvert, instrument, efficacité) requise pour appliquer la comptabilité de couverture.", "**Annexe** : nature et objectif des dérivés (couverture vs négoce), valeurs de marché, risques — l'information complète prime."]}, {"type": "heading", "text": "Comptabilité de couverture (hedge) — version simplifiée"}, {"type": "intro", "text": "Sans comptabilité de couverture, un dérivé de couverture serait réévalué au **résultat** alors que l'élément couvert (ex. une dette en devise, un achat futur) ne l'est **pas encore** : on verrait apparaître une **volatilité artificielle**. La **comptabilité de couverture** corrige cela en **appariant** les deux effets dans le temps :\n- la **variation du dérivé** est reconnue **en même temps** (et en sens inverse) que la variation de l'élément couvert, ou **différée** jusqu'à ce que l'élément couvert affecte le résultat.\n\nLa RPC en propose une version **pragmatique et simplifiée** : elle demande surtout une **désignation** claire et une **efficacité** raisonnable de la couverture, sans la lourdeur de la mécanique d'IFRS 9 (tests d'efficacité détaillés, *hedge ratio*, rééquilibrage, etc.)."}, {"type": "journal", "title": "Écriture — dérivé de négoce réévalué à la valeur de marché (gain)", "note": "Un forward de change détenu à des fins de négoce a une valeur de marché de +18 à la clôture (le contrat est « dans la monnaie »). On comptabilise l'actif dérivé et le gain au résultat.", "lines": [{"compte": "Instrument financier dérivé (actif)", "debit": 18}, {"compte": "Gain sur dérivés (résultat)", "credit": 18}]}, {"type": "callout", "tone": "info", "title": "RPC 27 vs IFRS 9 — le grand écart de complexité", "text": "Les **IFRS** sur les instruments financiers (**IFRS 9**) sont **beaucoup plus étendus** : classification en catégories (coût amorti / FVOCI / FVPL), **dépréciation par pertes de crédit attendues** (*Expected Credit Losses*, **ECL** — modèle prospectif sur 12 mois / à maturité), comptabilité de couverture **détaillée**. La **RPC 27** se concentre sur les **dérivés** et la **valeur de marché**, avec une **couverture simplifiée** et **sans** modèle ECL généralisé. À l'examen : si l'on vous parle d'**ECL** ou de **trois *stages* de dépréciation**, on est en **IFRS 9**, pas en RPC."}, {"type": "callout", "tone": "warn", "title": "Piège : laisser un dérivé hors-bilan", "text": "Sous l'angle **CO**, un dérivé est souvent un **engagement conditionnel** mentionné **hors-bilan** (en annexe), surtout s'il n'a pas (encore) de valeur réalisée. En **RPC 27**, ce raisonnement **ne suffit pas** : le dérivé a une **valeur de marché** qui doit **figurer au bilan** (actif ou passif). Oublier de le porter au bilan, c'est masquer une **exposition réelle** — contraire à l'image fidèle."}]}, {"title": "🗂️ RPC vs CO vs IFRS — la grande comparaison", "blocks": [{"type": "intro", "text": "Le tableau **incontournable** : on lit les trois thèmes (provisions, impôts différés, dérivés) sur les **trois référentiels**, du plus prudent (**CO**) au plus complet en juste valeur (**IFRS**), avec la **RPC au milieu**."}, {"type": "compare", "title": "Provisions, impôts différés & instruments : IFRS vs Swiss GAAP RPC vs CO", "rows": [{"crit": "Critères d'une provision", "ifrs": "**IAS 37** : obligation actuelle (juridique/implicite) + sortie probable + estimation fiable", "rpc": "**RPC 23** : obligation (juridique **ou de fait**) + sortie **probable** + estimation **fiable**", "co": "Provisions **justifiées** par l'usage commercial (art. 960e) **+ provisions de prudence/réserve tolérées**"}, {"crit": "Provisions de réserve / lissage", "ifrs": "**Interdites** (image fidèle)", "rpc": "**Interdites** (pas de réserve latente arbitraire)", "co": "**Permises** : provisions au-delà du nécessaire, risques généraux (réserves latentes)"}, {"crit": "Passif éventuel (contingent)", "ifrs": "**Non comptabilisé** ; information en annexe (IAS 37)", "rpc": "**Non comptabilisé** ; **mention en annexe**", "co": "Engagements conditionnels **mentionnés** (hors-bilan / annexe, art. 959c)"}, {"crit": "Impôts différés — principe", "ifrs": "**IAS 12** : approche bilancielle complète, différences temporelles", "rpc": "**RPC 11** : approche **bilancielle** sur différences temporelles (version allégée)", "co": "**En principe aucun** impôt différé : charge = **impôt courant** dû"}, {"crit": "Impôts différés passifs / actifs", "ifrs": "Passifs **obligatoires** ; actifs si **probable** ; reports de pertes encadrés", "rpc": "Passifs **obligatoires** ; actifs **si recouvrement probable** ; reports de pertes si bénéfices futurs probables", "co"
