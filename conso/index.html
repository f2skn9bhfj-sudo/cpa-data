tructure → autres faits → termes contractuels", "Structure → forme juridique → termes contractuels → autres faits & circonstances", "Termes contractuels → forme juridique → structure → fiscalité", "Pourcentage de détention → forme juridique → vote → gouvernance"], "answer": 1, "explain": "La cascade : (1) structure (pas de véhicule → joint operation), (2) forme juridique, (3) termes de l'accord contractuel, (4) autres faits & circonstances. Les facteurs 3 et 4 peuvent RENVERSER la présomption issue de la forme juridique."}, {"q": "Le partenariat vend TOUTE sa production aux seules parties, à un prix couvrant ses coûts. Quel impact ?", "options": ["Aucun : la forme juridique (SARL) impose une coentreprise", "« Autres faits & circonstances » → les parties absorbent flux et passifs → joint operation, malgré le véhicule à responsabilité limitée", "Cela déclenche une intégration globale (IFRS 10)", "Cela bascule le partenariat hors consolidation"], "answer": 1, "explain": "C'est le facteur « autres faits & circonstances » (piège n°1). La dépendance économique quasi-totale (achat de toute la production, financement par les achats) fait que les parties assument en substance les passifs → joint operation, QUELLE QUE SOIT la forme juridique du véhicule."}, {"q": "Pour une MÊME participation de 50 %, qu'est-ce qui RESTE identique entre joint operation et joint venture ?", "options": ["Le total de bilan et le chiffre d'affaires publiés", "L'endettement affiché", "Le résultat net (identique) ; bilan, CA et dettes diffèrent", "Tout est identique : seule la présentation change de libellé"], "answer": 2, "explain": "Le RÉSULTAT NET est le même (+100 dans l'exemple). En revanche, la joint operation gonfle le total de bilan (+450 vs +300), le CA (+500 vs 0) et les dettes (+150 vs 0), que la MEE comprime en une ligne nette. La classification change la lecture des ratios sans changer le résultat."}, {"q": "Quelle norme régit les INFORMATIONS À FOURNIR sur les partenariats ?", "options": ["IFRS 11 elle-même", "IFRS 12 (et non IFRS 11, qui traite qualification + comptabilisation)", "IAS 28 exclusivement", "IFRS 7"], "answer": 1, "explain": "IFRS 11 traite la qualification (contrôle conjoint) et la comptabilisation (joint operation vs joint venture). Les informations à fournir (intérêts, risques, données financières résumées) relèvent d'IFRS 12. Une question sur les disclosures renvoie donc à IFRS 12."}, {"q": "Principale divergence avec Swiss GAAP RPC 30 sur les coentreprises ?", "options": ["RPC 30 impose la MEE, IFRS 11 l'interdit", "RPC 30 AUTORISE l'intégration proportionnelle des coentreprises, là où IFRS 11 l'INTERDIT (MEE imposée)", "RPC 30 interdit toute consolidation des coentreprises", "Aucune divergence : les deux référentiels sont alignés"], "answer": 1, "explain": "Divergence majeure : RPC 30 autorise encore l'intégration proportionnelle des coentreprises (ou la MEE), tandis qu'IFRS 11 l'INTERDIT et impose la MEE (IAS 28). D'où des ratios d'endettement et de CA très différents pour un même groupe selon le référentiel."}]}]}]}, {"code": "IFRS 12", "title": "Informations à fournir sur les intérêts détenus dans d'autres entités", "icon": "📋", "color": "emerald", "tagline": "La norme **UNIQUE d'annexe** du paquet consolidation : **NATURE — RISQUES — EFFETS** des intérêts. Elle **informe**, elle ne **mesure** rien.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "**IFRS 12** est la norme **UNIQUE et transverse d'informations à fournir** (*disclosures*) de la famille consolidation. Elle rassemble dans **une seule annexe** les informations sur **tous** les intérêts qu'une entité détient dans d'autres entités :\n- **filiales** (IFRS 10) ;\n- **partenariats** — *joint operations* & *joint ventures* (IFRS 11) ;\n- **entreprises associées** (IAS 28) ;\n- **entités structurées NON consolidées** (le grand apport de la norme).\n\nPoint capital : IFRS 12 ne traite **NI reconnaissance NI évaluation** — cela relève d'IFRS 10/11, IAS 28 et IFRS 9. Elle **informe** seulement sur ce qui en résulte. Publiée en **mai 2011**, applicable au **1ᵉʳ janvier 2013**, elle a **centralisé** des obligations jadis éparpillées dans IAS 27, IAS 28 et IAS 31, et les a **étendues** aux entités structurées non consolidées (l'ancien angle mort « hors bilan »)."}, {"type": "callout", "tone": "key", "title": "Le triptyque fondateur : NATURE — RISQUES — EFFETS (IFRS 12.1)", "text": "L'**objectif** d'IFRS 12 est de permettre aux utilisateurs d'évaluer :\n- (a) la **NATURE** des intérêts dans d'autres entités et les **RISQUES** qui leur sont associés ;\n- (b) les **EFFETS** de ces intérêts sur la **situation financière**, la **performance** et les **flux de trésorerie**.\n\nToute information exigée par la norme sert l'un de ces **trois axes** : c'est la grille de lecture de tout IFRS 12."}, {"type": "keypoints", "title": "Les 5 réflexes à ancrer", "accent": "emerald", "items": ["**Norme d'INFORMATION pure** : elle ne change **aucun** chiffre comptabilisé (≠ IFRS 10/11, IAS 28, IFRS 3).", "**Triptyque NATURE — RISQUES — EFFETS** (IFRS 12.1) = grille de toute la norme.", "**Champ** : filiales, partenariats, associées, et **entités structurées NON consolidées**.", "**Divulguer les jugements importants** (contrôle, contrôle conjoint, influence notable, type de partenariat) — surtout les cas **contre-intuitifs**.", "**Réflexe suisse** : IFRS 12 exige **BEAUCOUP PLUS** que RPC 30 et le CO art. 963b."]}, {"type": "callout", "tone": "info", "title": "Place dans la trilogie du périmètre", "text": "IFRS 12 est la **couche « information »** de la famille consolidation : **IFRS 10/11 + IAS 28** régissent le **classement et la mesure**, **IFRS 12** régit **l'annexe**. Un placement sans contrôle ni influence (IFRS 9) relève, lui, des *disclosures* d'**IFRS 7**, pas d'IFRS 12."}, {"type": "diagram", "kind": "flow", "title": "L'objectif unique d'IFRS 12 (IFRS 12.1)", "steps": [{"label": "① NATURE", "sub": "Quelle est la nature des intérêts détenus dans d'autres entités ?"}, {"label": "② RISQUES", "sub": "Quels risques sont associés à ces intérêts ?"}, {"label": "③ EFFETS", "sub": "Quels effets sur la situation financière, la performance et les flux de trésorerie ?"}, {"label": "= toute disclosure", "sub": "Chaque information exigée sert l'un de ces trois axes : la grille de lecture de la norme"}], "accent": "emerald", "caption": "Mnémo **NRE** : Nature — Risques — Effets. IFRS 12 **informe** sur ce que produisent IFRS 10/11, IAS 28 et IFRS 3 ; elle ne **mesure** rien."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Filiales & partenariats", "color": "indigo", "items": ["**Filiales** (IFRS 10) — contrôle", "**Joint operations** (IFRS 11)", "**Joint ventures** (IFRS 11 → IAS 28)"]}, {"title": "Associées", "color": "teal", "items": ["**Entreprises associées** (IAS 28)", "Influence notable", "Mise en équivalence (MEE)"]}, {"title": "Structurées non conso.", "color": "amber", "items": ["**Entités structurées NON consolidées**", "Ex-« hors bilan » (titrisation, garanties)", "**Risque de perte maximal** — l'apport phare"]}], "caption": "Les **4 catégories d'intérêts** couvertes par l'annexe unique d'IFRS 12 : filiales, partenariats, associées et **entités structurées non consolidées** — le grand apport de la norme."}]}, {"title": "📐 Définitions clés & architecture des informations", "blocks": [{"type": "intro", "text": "IFRS 12 **mobilise les définitions** des autres normes du paquet (filiale, partenariat, associée, NCI) et en **ajoute** quelques-unes propres aux *disclosures*. Le tableau ci-dessous resitue chaque lien dans la trilogie : la norme de **mesure** diffère, mais la norme d'**information** est presque toujours **IFRS 12**."}, {"type": "table", "title": "Du lien exercé à la norme d'information", "headers": ["Lien exercé", "Norme de classement / mesure", "Norme d'information"], "rows": [["**Contrôle** (filiale)", "IFRS 10 (intégration globale) + IFRS 3", "**IFRS 12**"], ["**Contrôle conjoint** → *joint operation*", "IFRS 11 (comptabilisation directe)", "**IFRS 12**"], ["**Contrôle conjoint** → *joint venture*", "IFRS 11 → IAS 28 (MEE)", "**IFRS 12**"], ["**Influence notable** (associée)", "IAS 28 (MEE)", "**IFRS 12**"], ["**Entité structurée NON consolidée**", "selon exposition (IFRS 9)", "**IFRS 12**"], ["Aucune influence (placement)", "IFRS 9", "**IFRS 7** (instruments financiers)"]]}, {"type": "heading", "text": "Notions structurantes propres à IFRS 12"}, {"type": "intro", "text": "**Entité structurée (*structured entity*) — Annexe A.** Entité conçue de telle sorte que les **droits de vote ne sont PAS le facteur déterminant** pour établir qui la contrôle ; son activité est « pilotée » par des **accords contractuels**. Exemples : véhicules de **titrisation**, structures de **financement d'actifs** (*asset-backed*), certains fonds. Elle peut être **consolidée** (si contrôle au sens d'IFRS 10) ou **NON consolidée**.\n\n**Entité structurée NON consolidée.** Entité structurée que l'entité **ne contrôle pas**, mais dans laquelle elle détient un **intérêt** (sponsoring, financement, garantie, parts…). → C'est le **cœur de l'innovation** d'IFRS 12 : exposer les **risques résiduels** d'entités jadis « hors bilan ».\n\n**Intérêt dans une autre entité.** Implication **contractuelle ou non** exposant à des **rendements variables** liés à la performance de l'autre entité. C'est le **fait générateur** de l'obligation d'information.\n\n**Informations financières résumées (*summarised financial information*).** Données chiffrées condensées à fournir pour chaque **filiale à NCI importantes**, chaque **joint venture** et associée **importante**. La **pierre angulaire** des tableaux d'annexe.\n\n**Entité d'investissement (*investment entity*) — IFRS 10.27.** Entité qui obtient des fonds pour fournir des **services de gestion d'investissement**, investit **uniquement** pour la plus-value en capital et/ou des revenus de placement, et mesure sa performance à la **juste valeur**. Conséquence : elle **NE consolide PAS** ses filiales (JV par résultat, IFRS 9) → *disclosures* **spécifiques**."}, {"type": "callout", "tone": "warn", "title": "« Intérêt » ≠ simple relation commerciale", "text": "Une relation **fournisseur/client** ordinaire, un **mandat d'agent**, ou la détention d'instruments **sans exposition aux rendements** ne créent **pas** un « intérêt » au sens d'IFRS 12. Il faut une **exposition aux rendements variables** liés à la **performance** de l'autre entité."}, {"type": "table", "title": "Architecture d'ensemble — les 5 sections de la norme", "headers": ["#", "Section IFRS 12", "Contenu central"], "rows": [["**1**", "**Jugements & hypothèses importants**", "Comment a-t-on conclu au contrôle / contrôle conjoint / influence notable / type de partenariat / statut d'entité d'investissement"], ["**2**", "**Intérêts dans des FILIALES**", "Composition du groupe ; **NCI importantes** ; **restrictions** ; entités structurées **consolidées** ; effets des **variations de %**"], ["**3**", "**PARTENARIATS & ASSOCIÉES**", "Infos financières **résumées**, JV si cotée, engagements & risques"], ["**4**", "**Entités structurées NON consolidées**", "Nature, ampleur, **risque de perte maximal**, soutien financier"], ["**5**", "**ENTITÉS D'INVESTISSEMENT**", "Statut, motifs, filiales non consolidées, soutien, restrictions"]]}, {"type": "callout", "tone": "info", "title": "Ce qu'IFRS 12 NE régit PAS (hors champ — IFRS 12.6)", "text": "- la **reconnaissance** et l'**évaluation** des intérêts (IFRS 10/11, IAS 28, IFRS 9) ;\n- les **régimes d'avantages du personnel** (IAS 19) ;\n- les **états séparés** d'une entité (IAS 27) — **SAUF** intérêts dans des entités structurées non consolidées, ou entité d'investissement ne présentant que des états séparés ;\n- un intérêt **sans** contrôle / contrôle conjoint / influence notable → **IFRS 9 + IFRS 7** ;\n- les **regroupements d'entreprises** (la transaction d'acquisition) → **IFRS 3**."}, {"type": "diagram", "kind": "pyramid", "title": "Les 5 sections de la norme (architecture des disclosures)", "levels": [{"t": "1 · Jugements & hypothèses importants", "d": "Comment a-t-on conclu au contrôle / contrôle conjoint / influence notable / type de partenariat / statut d'entité d'investissement"}, {"t": "2 · Intérêts dans des FILIALES", "d": "Composition du groupe, NCI importantes, restrictions, entités structurées consolidées, variations de %"}, {"t": "3 · PARTENARIATS & ASSOCIÉES", "d": "Infos financières résumées, JV si cotée, engagements & risques"}, {"t": "4 · Entités structurées NON consolidées", "d": "Nature, ampleur, risque de perte maximal, soutien financier"}, {"t": "5 · ENTITÉS D'INVESTISSEMENT", "d": "Statut, motifs, filiales non consolidées, soutien, restrictions"}], "accent": "emerald", "caption": "Cinq blocs de disclosures, tous au service du triptyque **NATURE — RISQUES — EFFETS**."}]}, {"title": "⚖️ Pilier 1 — Jugements & hypothèses importants", "blocks": [{"type": "intro", "text": "IFRS 12 impose de **divulguer les jugements et hypothèses SIGNIFICATIFS** (et leurs modifications) ayant servi à **qualifier** chaque intérêt. C'est le pendant « transparence du raisonnement » des conclusions d'IFRS 10/11 et IAS 28 : non pas *quel* traitement, mais **POURQUOI** ce traitement (IFRS 12.7-9)."}, {"type": "keypoints", "title": "Jugements à expliciter quand ils sont importants (IFRS 12.7-9)", "accent": "indigo", "items": ["Comment l'entité a déterminé qu'elle **CONTRÔLE** une autre entité (et donc la consolide).", "Comment elle a déterminé qu'elle exerce un **CONTRÔLE CONJOINT** ou une **INFLUENCE NOTABLE**.", "Comment elle a déterminé le **TYPE de partenariat** (*joint operation* vs *joint venture*) via un véhicule distinct.", "Les **cas contre-intuitifs** qui exigent une justification renforcée (voir ci-dessous)."]}, {"type": "table", "title": "Cas « contre-intuitifs » à divulguer (les plus testés à l'examen)", "headers": ["Situation", "Pourquoi contre-intuitif", "À justifier au titre d'IFRS 12"], "rows": [["**Contrôle SANS majorité** des droits de vote", "On consolide à **< 50 %** (contrôle de fait : 45 % face à un actionnariat dispersé ; droits de vote potentiels ; accords contractuels)", "**Pourquoi** on consolide malgré < 50 %"], ["**Absence de contrôle MALGRÉ > 50 %**", "On **ne** consolide **pas** à **> 50 %** (droits de tiers, statut d'**agent**, **droits protecteurs** seulement, blocage par contrôle conjoint)", "**Pourquoi** on ne consolide pas malgré > 50 %"], ["**Influence notable < 20 %**", "MEE sous le seuil (siège au conseil, dépendance technologique)", "**Réfutation** de la présomption d'IAS 28"], ["**Pas d'influence notable ≥ 20 %**", "Un majoritaire verrouille tout malgré ≥ 20 %", "**Réfutation** de la présomption d'IAS 28"], ["***Joint operation* via véhicule à resp. limitée**", "Qualifié en JO malgré une structure distincte (termes contractuels, dépendance économique)", "**Pourquoi** ce n'est pas une *joint venture*"]]}, {"type": "callout", "tone": "tip", "title": "Entité d'investissement (IFRS 12.9A-9B)", "text": "Lorsqu'une entité conclut qu'elle **est (ou cesse d'être)** une entité d'investissement **sans réunir tous les critères types**, elle divulgue les **jugements et hypothèses importants** ayant conduit à cette conclusion. En cas de **changement de statut**, elle en indique les **raisons** et l'**effet**."}, {"type": "callout", "tone": "key", "title": "Le réflexe « seuil franchi à rebours »", "text": "Dès qu'un **seuil est franchi à rebours** — consolider **sous 50 %**, **ne pas** consolider **au-dessus de 50 %**, MEE **sous 20 %**, JO malgré un véhicule distinct — le candidat doit **mentionner l'obligation de justifier le jugement** au titre d'IFRS 12. Ces *disclosures* rendent **auditables** les conclusions des normes de mesure."}, {"type": "diagram", "kind": "flow", "title": "Le réflexe « seuil franchi à rebours » → divulguer le jugement", "steps": [{"label": "Contrôle < 50 %", "sub": "Consolider sous 50 % (contrôle de fait, droits de vote potentiels) → justifier POURQUOI on consolide"}, {"label": "Pas de contrôle > 50 %", "sub": "Ne PAS consolider au-dessus de 50 % (agent, droits protecteurs) → justifier POURQUOI on ne consolide pas"}, {"label": "Influence notable < 20 %", "sub": "MEE sous le seuil (siège au conseil) → réfuter la présomption IAS 28"}, {"label": "JO via véhicule distinct", "sub": "Joint operation malgré une structure à resp. limitée → justifier que ce n'est pas une JV"}], "accent": "indigo", "caption": "Dès qu'une conclusion est **contre-intuitive**, IFRS 12.7-9 impose de **divulguer le raisonnement** : ces disclosures rendent **auditables** les conclusions des normes de mesure."}]}, {"title": "🗂️ Pilier 2 — Intérêts dans des filiales (groupe, NCI, restrictions)", "blocks": [{"type": "intro", "text": "C'est la section la **plus dense** d'IFRS 12 (IFRS 12.10-19). Elle éclaire la **composition du groupe**, le **poids des minoritaires**, les **restrictions** internes, les **risques** spécifiques et les **conséquences des mouvements de capital**."}, {"type": "table", "title": "Les disclosures « filiales » par sous-pilier", "headers": ["Sous-pilier (§)", "À divulguer"], "rows": [["**(a) Composition du groupe** (12.10)", "Structure du groupe : filiales importantes, **pays** de constitution/exploitation, **% d'intérêt** et, s'il diffère, **% de droits de vote**"], ["**(b) NCI importantes** (12.10, 12.12)", "Pour **chaque filiale à NCI importantes** : nom & lieu, **% NCI** (et droits de vote), **résultat attribué aux NCI**, **NCI cumulés** (bilan), **dividendes versés aux NCI**, **infos financières résumées** (avant éliminations)"], ["**(c) Restrictions** (12.13)", "Restrictions importantes (statutaires, contractuelles, réglementaires) sur l'accès aux **actifs** du groupe et le règlement des **passifs** : transfert de trésorerie/dividendes, contrôles des changes, protections des NCI, filiales **supervisées** (banques, assurances)"], ["**(d) Entités structurées consolidées** (12.14-17)", "Modalités pouvant **obliger** à un **soutien financier** ; soutien fourni **sans obligation** (montant, raison) ; **intention** d'en fournir"], ["**(e) Variations de %** (12.18-19)", "Effets des changements de pourcentage **avec** ou **sans** perte de contrôle (voir tableau dédié)"]]}, {"type": "heading", "text": "La distinction-clé : variations du pourcentage de détention (IFRS 12.18-19)"}, {"type": "table", "title": "Variation du % de détention — avec vs sans perte de contrôle", "headers": ["Type de variation", "Perte de contrôle ?", "Traitement (IFRS 10)", "Information (IFRS 12)"], "rows": [["Cession/achat de titres en **conservant** le contrôle", "**NON**", "Transaction **entre actionnaires** (*equity transaction*) : **aucun** résultat, écart en **capitaux propres** ; NCI réajustés", "**Tableau** des effets sur les **capitaux propres attribuables à la mère**"], ["Cession entraînant la **perte** de contrôle", "**OUI**", "**Décomptabilisation** des actifs/passifs et NCI ; résidu **réévalué à la JV** ; **gain/perte en RÉSULTAT**", "Le **gain/perte** comptabilisé et la **ligne** du compte de résultat où il figure"]]}, {"type": "callout", "tone": "warn", "title": "Le piège récurrent", "text": "**Sans** perte de contrôle → **capitaux propres** (pas de P&L) ; **avec** perte de contrôle → **résultat** + réévaluation du résidu à la **JV**. IFRS 12 exige d'**informer** sur ces effets ; **IFRS 10** en fixe le **traitement**. Ne pas confondre la norme d'information et la norme de mesure."}]}, {"title": "🔢 Exemple chiffré résolu — tableau d'annexe « NCI importantes »", "blocks": [{"type": "intro", "text": "IFRS 12 étant une norme d'**information** (pas d'écritures Dr/Cr), l'« exemple résolu » prend la forme du **tableau d'annexe** type. Objectif : montrer **ce qu'il faut publier** pour une **filiale à NCI importantes**, puis **réconcilier** les NCI résumées avec les NCI portés au bilan consolidé."}, {"type": "example", "title": "Annexe NCI importantes + infos financières résumées (chiffres)", "statement": "Le groupe **M** détient **70 %** de **F** (NCI = **30 %**). À l'acquisition (début N), pas de goodwill attribué aux NCI (option « goodwill partiel » : NCI à la **quote-part d'actif net identifiable**).\n\nSur l'exercice N, **F** présente (chiffres **avant éliminations intragroupes**, conformément à IFRS 12), en **CHF k** :\n- Actifs courants : **600** ; Actifs non courants : **1 400**\n- Passifs courants : **(300)** ; Passifs non courants : **(700)**\n- → **Actif net = 1 000**\n- Produits : **2 000** ; **Résultat net de la période : 300** ; dont **OCI : 40** → **Résultat global : 340**\n- **Dividendes versés aux NCI** durant N : **18**\n- Flux de trésorerie nets : **+120**\n\n**Travail demandé :** calculer les montants à publier au titre des NCI (30 %), réconcilier les NCI cumulés, et préciser ce qui figure dans l'**annexe IFRS 12** (et non au bilan/CR directement).", "solution": "**1) Montants à publier au titre des NCI (30 %) — IFRS 12.12**\n- **Résultat attribué aux NCI** (P&L) : 30 % × 300 = **90**\n- Quote-part d'**OCI** attribuée aux NCI : 30 % × 40 = **12**\n- **Résultat global** attribué aux NCI : 30 % × 340 = **102**\n- **Dividendes versés aux NCI** : (donnée) = **18**\n- **NCI cumulés** au bilan (clôture N) : 30 % × actif net 1 000 = **300**\n\n**2) Réconciliation des NCI cumulés (preuve du chiffre du bilan)**\n- NCI à l'ouverture (30 % × actif net initial ~760) : **228**\n- + Résultat global attribué aux NCI : **+102**\n- − Dividendes versés aux NCI : **−18**\n- **= NCI cumulés à la clôture ≈ 312**\n\n*La mécanique pédagogique est : **ouverture + résultat global attribué − dividendes NCI**. Le petit écart 300 vs 312 vient des hypothèses sur la distribution totale et le résultat conservé ; à l'examen, c'est la **mécanique** qui compte, pas le bouclage parfait.*\n\n**3) Ce qui figure dans l'annexe IFRS 12 (et NON au bilan/CR directement)**\n- une **ligne par filiale à NCI importantes** : nom, lieu, **% NCI (30 %)**, **résultat attribué (90)**, **NCI cumulés (≈ 300-312)**, **dividendes aux NCI (18)** ;\n- un **bloc d'informations financières résumées** de F (actifs/passifs courants & non courants, produits, résultat, résultat global, flux de trésorerie) **avant éliminations** ;\n- **aucune écriture** : la valeur ajoutée est de **rendre lisible le poids des minoritaires** et la **substance financière** de la filiale — exactement le triptyque **NATURE — RISQUES — EFFETS** appliqué aux NCI."}, {"type": "table", "title": "Synthèse — montants NCI à publier (30 % de F)", "headers": ["Élément exigé (IFRS 12.12)", "Calcul", "Montant publié"], "rows": [["Résultat attribué aux NCI (P&L)", "30 % × 300", "**90**"], ["Quote-part d'OCI attribuée aux NCI", "30 % × 40", "**12**"], ["Résultat global attribué aux NCI", "30 % × 340", "**102**"], ["Dividendes versés aux NCI", "donnée", "**18**"], ["NCI cumulés au bilan (clôture N)", "30 % × 1 000", "**300**"]]}, {"type": "callout", "tone": "warn", "title": "Avant éliminations, pas après", "text": "Les infos financières résumées des **NCI importantes** se présentent en principe **avant éliminations** intragroupes (vision de l'entité détenue), ajustées aux méthodes du groupe. Livrer un chiffre déjà **retraité de l'intragroupe** est une erreur classique."}, {"type": "diagram", "kind": "split", "title": "Filiale F — actif net 1 000 : poids du groupe vs minoritaires", "parts": [{"label": "Groupe M (70 %)", "value": 70, "color": "indigo"}, {"label": "NCI / minoritaires (30 %)", "value": 30, "color": "amber"}], "caption": "M détient **70 %** de F, NCI **30 %**. NCI cumulés au bilan = 30 % × actif net 1 000 = **300**. IFRS 12 rend **lisible le poids des minoritaires** : résultat attribué **90**, OCI **12**, résultat global **102**, dividendes NCI **18**."}, {"type": "diagram", "kind": "waterfall", "title": "Réconciliation des NCI cumulés (preuve du chiffre du bilan)", "items": [{"label": "NCI à l'ouverture (30 % × 760)", "value": 228, "kind": "add"}, {"label": "+ Résultat global attribué aux NCI", "value": 102, "kind": "add"}, {"label": "− Dividendes versés aux NCI", "value": 18, "kind": "sub"}, {"label": "= NCI cumulés à la clôture (≈)", "value": 312, "kind": "total"}], "caption": "Mécanique pédagogique : **ouverture + résultat global attribué − dividendes NCI**. 228 + 102 − 18 ≈ **312** (le petit écart avec les 300 du bilan vient des hypothèses de distribution ; à l'examen, c'est la **mécanique** qui compte)."}]}, {"title": "🧩 Piliers 3-5 — Partenariats/associées, entités structurées, entité d'investissement", "blocks": [{"type": "heading", "text": "Pilier 3 — Partenariats (JV) & entreprises associées (IFRS 12.20-23)"}, {"type": "keypoints", "title": "Pour la NATURE, l'ÉTENDUE et les EFFETS de ces intérêts", "accent": "teal", "items": ["Pour chaque **JV / associée importante** : **nom**, **lieu**, **nature de la relation**, **% d'intérêt** (et de vote), **méthode** (MEE — ou JVPL pour une entité d'investissement).", "La **juste valeur** de la participation **si elle est cotée** (cours coté).", "**Infos financières résumées** d'une JV/associée importante en MEE (actifs/passifs courants & non courants, produits, résultat, OCI, résultat global ; pour les **JV** en plus : **trésorerie**, **passifs financiers** courants/non courants, **amortissements**, **intérêts**, **charge d'impôt**).", "Pour les JV/associées **individuellement non importantes** : montants **agrégés** (VC, quote-part de résultat et d'OCI).", "**Engagements** (*commitments*) non comptabilisés relatifs aux JV et **passifs éventuels** liés aux JV et associées.", "**Restrictions** importantes sur la capacité des JV/associées à **transférer des fonds** (dividendes, remboursements de prêts)."]}, {"type": "heading", "text": "Pilier 4 — Entités structurées NON consolidées (IFRS 12.24-31) — l'apport phare"}, {"type": "intro", "text": "Les anciennes structures « hors bilan » deviennent **visibles**. C'est le **cœur de l'innovation** d'IFRS 12 : exposer les **risques résiduels** d'entités que l'entité **ne contrôle pas** mais où elle détient un **intérêt** (sponsoring, financement, garantie, parts)."}, {"type": "table", "title": "Disclosures sur les entités structurées non consolidées", "headers": ["Axe", "À divulguer"], "rows": [["**NATURE & ÉTENDUE**", "Type, objet, **taille**, activités, **mode de financement** de l'entité structurée"], ["**Actifs/passifs comptabilisés**", "**Valeurs comptables** des actifs et passifs relatifs à ces entités, et la **ligne** des états où ils figurent"], ["**RISQUE DE PERTE MAXIMAL**", "Le montant **le plus élevé** que l'entité pourrait supporter (ex. VC + garanties + engagements de liquidité), avec la **méthode**, ou la mention qu'il **ne peut être quantifié**"], ["**Comparaison**", "Entre valeurs comptables, risque de perte maximal et **pertes effectivement subies**"], ["**Soutien financier**", "Soutien fourni **sans obligation contractuelle** (montant, type, raisons) et l'**intention** d'en fournir"], ["**Sponsor sans intérêt résiduel**", "Si l'entité **sponsorise** sans détenir d'intérêt à la clôture : **produits** tirés de ces entités et **VC des actifs transférés** durant la période"]]}, {"type": "callout", "tone": "key", "title": "Le concept-vedette : risque de perte maximal (*maximum exposure to loss*)", "text": "C'est **LE** chiffre que l'examinateur attend pour une entité structurée non consolidée : le **montant maximal** que le groupe pourrait perdre du fait de son intérêt. S'il ne peut être **quantifié**, il faut le **dire** et l'expliquer. C'est le triptyque **RISQUES** appliqué au « hors bilan » d'antan."}, {"type": "heading", "text": "Pilier 5 — Entité d'investissement (IFRS 12.19A-19G)"}, {"type": "keypoints", "title": "Une entité d'investissement ne consolide pas (JVPL — IFRS 9) ; elle divulgue", "accent": "amber", "items": ["Le **fait** qu'elle est une entité d'investissement.", "Les **jugements importants** si elle conclut au statut **sans réunir tous les critères** types (cf. Pilier 1).", "Pour chaque **filiale non consolidée** : nom, lieu, **% d'intérêt**.", "Les **restrictions** (transfert de fonds, remboursement de prêts/avances) imposées par ces filiales non consolidées.", "Tout **soutien financier** fourni à une filiale non consolidée **sans obligation** (et l'intention), ainsi que les **engagements / passifs éventuels** envers elles."]}]}, {"title": "🇨🇭 IFRS 12 vs Swiss GAAP RPC 30 vs CO 963b", "blocks": [{"type": "intro", "text": "IFRS 12 étant une norme d'**information**, la comparaison porte sur **l'étendue de l'annexe exigée** — et c'est ici que la **divergence est la plus spectaculaire** : le référentiel suisse demande **infiniment moins** de détails. Un même groupe produira une **annexe IFRS très volumineuse** là où la version **RPC/CO** tiendra en quelques lignes."}, {"type": "compare", "title": "IFRS 12 vs Swiss GAAP RPC 30 vs CO art. 963-963b", "rows": [{"crit": "Statut de la norme", "ifrs": "Norme **dédiée et unique** aux *disclosures* sur les intérêts", "rpc": "Dispositions d'annexe **intégrées** à RPC 30 (consolidation)", "co": "**Annexe** aux comptes consolidés (art. **963b**)"}, {"crit": "Jugements importants (contrôle, contrôle conjoint, influence notable, type de partenariat, entité d'investissement)", "ifrs": "**Obligation explicite** de divulguer les **jugements & hypothèses**", "rpc": "**Non exigé** de façon comparable", "co": "**Non exigé**"}, {"crit": "Liste des sociétés du périmètre", "ifrs": "Composition du groupe, **% d'intérêt** et **de vote**", "rpc": "**Liste des sociétés consolidées** (raison sociale, siège, **% de détention**, méthode)", "co": "**Liste** des entités consolidées (nom, siège, **part de capital**)"}, {"crit": "NCI importantes (résultat attribué, NCI cumulés, infos résumées, dividendes)", "ifrs": "**Détaillé**, filiale par filiale", "rpc": "**Non exigé** à ce niveau de détail", "co": "**Non exigé**"}, {"crit": "Restrictions d'accès aux actifs / règlement des passifs", "ifrs": "**Exigées** (nature & étendue)", "rpc": "Non détaillé", "co": "Non exigé"}, {"crit": "Infos financières résumées des JV / associées", "ifrs": "**Exigées** (JV/associées importantes)", "rpc": "Bien plus **succinctes**", "co": "**Non exigé**"}, {"crit": "Entités structurées NON consolidées (nature, ampleur, risque de perte maximal, soutien)", "ifrs": "**Exigées** (section dédiée)", "rpc": "**Pas d'équivalent** structuré", "co": "**Pas d'équivalent**"}, {"crit": "Entité d'investissement", "ifrs": "*Disclosures* **spécifiques** (filiales non consolidées, soutien)", "rpc": "**Pas d'équivalent** (notion inexistante)", "co": "**Pas d'équivalent**"}, {"crit": "Effets des variations de % (avec/sans perte de contrôle)", "ifrs": "**Exigés** (tableau capitaux propres / gain en résultat)", "rpc": "Non détaillé", "co": "Non exigé"}, {"crit": "Méthode de consolidation appliquée", "ifrs": "Découle d'IFRS 10/11/IAS 28 ; mention dans la composition", "rpc": "**Indiquée** (intégr. globale, proportionnelle, MEE)", "co": "Selon **référentiel reconnu** retenu"}]}, {"type": "callout", "tone": "key", "title": "LA divergence à retenir", "text": "**IFRS 12 est de loin la plus exigeante** : transparence des **jugements**, **NCI détaillées**, **infos financières résumées** par entité importante, et surtout exposition des **entités structurées non consolidées** (**risque de perte maximal**). **RPC 30** se limite pour l'essentiel à la **liste des sociétés consolidées** (siège, % de détention, méthode) ; le **CO art. 963b** ne pose que le **principe** d'une annexe consolidée et **renvoie à la norme reconnue** choisie. Citer cet écart **dès qu'une question oppose les référentiels sur l'INFORMATION** (et non la mesure)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "IFRS 12", "color": "indigo", "items": ["**Jugements importants** à divulguer (contrôle, influence…)", "**NCI détaillées** : résultat, cumuls, dividendes, infos résumées", "**Infos financières résumées** par JV/associée importante", "**Entités structurées non consolidées** : risque de perte maximal", "**Entité d'investissement** : disclosures spécifiques"]}, {"title": "Swiss GAAP RPC 30", "color": "emerald", "items": ["Jugements **non exigés** de façon comparable", "**Liste des sociétés consolidées** (siège, %, méthode)", "Infos résumées bien plus **succinctes**", "Entités structurées : **pas d'équivalent**", "Entité d'investissement : **notion inexistante**"]}, {"title": "CO art. 963–963b", "color": "amber", "items": ["Jugements **non exigés**", "**Liste** des entités (nom, siège, part de capital)", "Infos résumées **non exigées**", "Entités structurées : **pas d'équivalent**", "Pose le **principe** d'une annexe + renvoie au référentiel reconnu"]}], "caption": "**LA** divergence : IFRS 12 exige **BEAUCOUP PLUS** que RPC 30 et le CO art. 963b. Même groupe → annexe IFRS très volumineuse vs quelques lignes côté suisse. À citer dès qu'une question oppose les référentiels sur l'**INFORMATION** (et non la mesure)."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Erreur n°1 — croire qu'IFRS 12 traite reconnaissance/évaluation", "text": "**NON** : c'est une norme **purement d'information**. La consolidation, la MEE, le goodwill, les NCI au bilan relèvent d'**IFRS 10/11, IAS 28, IFRS 3**. IFRS 12 **informe** sur leurs résultats et les risques ; elle ne change **aucun** chiffre comptabilisé."}, {"type": "callout", "tone": "warn", "title": "Oublier les entités structurées NON consolidées", "text": "C'est l'**angle mort** historique et l'**apport phare** de la norme. Une exposition « hors bilan » (sponsoring, garantie, liquidité) **sans contrôle** doit être divulguée — avec le **risque de perte maximal**. Point souvent testé."}, {"type": "callout", "tone": "warn", "title": "Négliger les jugements importants", "text": "Dès qu'une conclusion est **contre-intuitive** (consolider à **< 50 %** ; **ne pas** consolider à **> 50 %** ; MEE sous **20 %** ; *joint operation* malgré un véhicule à resp. limitée), IFRS 12 impose de **divulguer le raisonnement**. L'omettre fait perdre des points."}, {"type": "callout", "tone": "warn", "title": "Confondre les deux types de variation de %", "text": "**Sans** perte de contrôle → transaction **entre actionnaires**, écart en **capitaux propres**, **aucun** résultat ; **avec** perte de contrôle → **gain/perte en résultat** + réévaluation du résidu à la **JV**. IFRS 12 **informe** ; le traitement vient d'IFRS 10."}, {"type": "callout", "tone": "warn", "title": "Donner les infos résumées APRÈS éliminations", "text": "Les montants des **NCI importantes** et des filiales se présentent en principe **avant éliminations** intragroupes (vision de l'entité détenue), avec ajustement aux méthodes du groupe — ne pas livrer un chiffre déjà retraité de l'intragroupe."}, {"type": "callout", "tone": "warn", "title": "Mal calibrer l'agrégation (IFRS 12.4)", "text": "Le **niveau d'agrégation** est un **jugement** : regrouper les intérêts **similaires** sans **noyer** l'information utile, ni la **fragmenter** à l'excès. Trop agréger **masque** le risque ; trop détailler le **dilue**."}, {"type": "callout", "tone": "info", "title": "Ne pas limiter IFRS 12 aux comptes consolidés", "text": "En principe oui, **mais** une entité détenant des intérêts dans des **entités structurées non consolidées** (et ne préparant que des états **séparés**) reste tenue des *disclosures* correspondantes — tout comme une **entité d'investissement** en états séparés."}, {"type": "callout", "tone": "info", "title": "Ne pas mélanger IFRS 12 et IFRS 7", "text": "Un **placement** sans contrôle/influence (IFRS 9) relève des *disclosures* d'**IFRS 7** (instruments financiers), **pas** d'IFRS 12. IFRS 12 commence là où il y a **contrôle, contrôle conjoint, influence notable**, ou **intérêt dans une entité structurée**."}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "NRE", "items": [{"l": "N", "t": "**Nature** des intérêts dans d'autres entités."}, {"l": "R", "t": "**Risques** associés à ces intérêts."}, {"l": "E", "t": "**Effets** sur situation financière, performance et flux de trésorerie."}], "phrase": "« **N**ature — **R**isques — **E**ffets » (IFRS 12.1) : l'objectif unique qui sous-tend chaque disclosure. À réciter d'emblée."}, {"type": "keypoints", "title": "Structurer une réponse IFRS 12 — les 5 ancrages qui rapportent les points", "accent": "emerald", "items": ["**Poser la nature de la norme** : IFRS 12 est la norme **UNIQUE d'INFORMATIONS À FOURNIR** ; elle **n'affecte ni la reconnaissance ni l'évaluation**. Citer l'objectif **NATURE — RISQUES — EFFETS** (IFRS 12.1).", "**Identifier le type d'intérêt** et aiguiller : **filiale** (composition, NCI, restrictions, variations de %) / **partenariat ou associée** (infos résumées, JV si cotée, engagements) / **entité structurée NON consolidée** (nature, **risque de perte maximal**, soutien) / **entité d'investissement** (filiales non consolidées).", "**Dégainer les jugements importants** si la situation est contre-intuitive : contrôle **< 50 %**, non-contrôle **> 50 %**, influence notable **< 20 %**, JO malgré un véhicule distinct → IFRS 12 exige de **divulguer le raisonnement**.", "**Filiales — lister les NCI** : **% NCI**, **résultat attribué**, **NCI cumulés**, **dividendes versés aux NCI**, **infos financières résumées** (avant éliminations). Distinguer les deux variations de % (capitaux propres vs résultat).", "**Réflexe suisse** : IFRS 12 exige **BEAUCOUP PLUS** que **RPC 30** (liste des sociétés consolidées : siège, %, méthode) et le **CO art. 963b** (principe d'une annexe + renvoi au référentiel reconnu) ; jugements et entités structurées non consolidées **sans équivalent** suisse."]}, {"type": "callout", "tone": "key", "title": "Phrase-réflexe à placer", "text": "« *IFRS 12 ne change aucun chiffre : c'est la norme d'**information** qui éclaire la **nature**, les **risques** et les **effets** des intérêts dans les filiales, partenariats, associées et **entités structurées non consolidées** — bien au-delà de ce qu'exigent RPC 30 et le CO art. 963b.* »"}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste ta maîtrise d'IFRS 12", "questions": [{"q": "Quel est l'objet d'IFRS 12, et que ne traite-t-elle PAS ?", "options": ["Elle fixe la méthode de consolidation des filiales et le calcul du goodwill", "Elle est la norme UNIQUE d'informations à fournir sur les intérêts ; elle ne traite NI reconnaissance NI évaluation", "Elle régit l'évaluation à la juste valeur des entités structurées", "Elle remplace IFRS 10, IFRS 11 et IAS 28"], "answer": 1, "explain": "IFRS 12 est la norme transverse d'INFORMATIONS À FOURNIR sur les intérêts dans d'autres entités. La reconnaissance et l'évaluation relèvent d'IFRS 10/11, IAS 28 et IFRS 9 ; IFRS 12 ne fait qu'informer sur ce qui en résulte."}, {"q": "Quels TROIS axes l'objectif d'IFRS 12 (IFRS 12.1) impose-t-il d'éclairer ?", "options": ["Reconnaissance, évaluation, présentation", "Actifs, passifs, capitaux propres", "Nature des intérêts, risques associés, effets sur situation financière / performance / flux de trésorerie", "Contrôle, contrôle conjoint, influence notable"], "answer": 2, "explain": "Le triptyque fondateur est NATURE — RISQUES — EFFETS : la nature des intérêts, les risques associés, et les effets sur la situation financière, la performance et les flux de trésorerie. C'est la grille de lecture de toute la norme."}, {"q": "Quels types d'intérêts entrent dans le champ d'IFRS 12 ?", "options": ["Uniquement les filiales contrôlées (IFRS 10)", "Filiales, partenariats (joint operations & joint ventures), entreprises associées et entités structurées NON consolidées", "Uniquement les placements financiers relevant d'IFRS 9", "Les filiales et les regroupements d'entreprises (IFRS 3)"], "answer": 1, "explain": "IFRS 12 couvre les filiales (IFRS 10), les partenariats — joint operations & joint ventures (IFRS 11), les entreprises associées (IAS 28) et les entités structurées NON consolidées (le grand apport de la norme)."}, {"q": "Une entité consolide une filiale alors qu'elle ne détient que 45 % des droits de vote (contrôle de fait). Qu'exige IFRS 12 ?", "options": ["Rien de particulier : la consolidation suffit", "De reclasser la participation en associée (IAS 28)", "De divulguer les jugements et hypothèses importants justifiant le contrôle malgré moins de 50 %", "De réévaluer la filiale à la juste valeur"], "answer": 2, "explain": "Dès qu'une conclusion est contre-intuitive — ici consolider sous 50 % via contrôle de fait — IFRS 12 (12.7-9) impose de DIVULGUER le raisonnement : pourquoi l'entité a conclu au contrôle. Cela rend la conclusion d'IFRS 10 auditable."}, {"q": "Pour une filiale à NCI importantes, lequel de ces éléments n'est PAS exigé par IFRS 12.12 ?", "options": ["Le résultat attribué aux NCI et les NCI cumulés au bilan", "Les dividendes versés aux NCI", "Des informations financières résumées (avant éliminations)", "L'écriture comptable Dr/Cr de constatation des NCI"], "answer": 3, "explain": "IFRS 12 est une norme d'information : elle n'exige AUCUNE écriture comptable. Pour une filiale à NCI importantes, on publie le % NCI, le résultat attribué, les NCI cumulés, les dividendes versés aux NCI et des infos financières résumées (avant éliminations)."}, {"q": "Variation du % de détention : quelle différence d'information entre AVEC et SANS perte de contrôle ?", "options": ["Aucune : les deux passent en résultat", "Sans perte de contrôle → écart en capitaux propres (transaction entre actionnaires) ; avec perte → gain/perte en RÉSULTAT + résidu réévalué à la JV", "Sans perte de contrôle → en résultat ; avec perte → en capitaux propres", "Les deux sont portées en OCI"], "answer": 1, "explain": "Sans perte de contrôle, c'est une transaction entre actionnaires : l'écart va en capitaux propres, aucun résultat. Avec perte de contrôle : gain/perte en résultat et réévaluation de l'intérêt résiduel à la juste valeur. IFRS 12 informe, IFRS 10 fixe le traitement."}, {"q": "Que faut-il divulguer pour une entité structurée NON consolidée ?", "options": ["Uniquement le pourcentage de détention", "La nature et l'ampleur de l'intérêt, le RISQUE DE PERTE MAXIMAL, les actifs/passifs comptabilisés (et leur ligne), et tout soutien financier fourni", "Le goodwill et les NCI cumulés", "Rien : ces entités sont hors champ d'IFRS 12"], "answer": 1, "explain": "C'est l'apport phare de la norme : pour une entité structurée non consolidée, on divulgue la nature et l'ampleur de l'intérêt, le risque de perte maximal (maximum exposure to loss), les actifs/passifs comptabilisés et leur ligne, et tout soutien financier fourni même sans obligation."}, {"q": "Un investisseur détient 8 % d'une société, sans contrôle ni influence notable, et le mesure à la juste valeur (IFRS 9). Quelle norme régit ses informations à fournir ?", "options": ["IFRS 12, comme tout intérêt dans une autre entité", "IFRS 7 (instruments financiers) — IFRS 12 ne s'applique pas à un simple placement", "IAS 28, par prudence", "IFRS 10, car il s'agit d'une participation"], "answer": 1, "explain": "IFRS 12 commence là où il y a contrôle, contrôle conjoint, influence notable, ou intérêt dans une entité structurée. Un simple placement sans influence (IFRS 9) relève des disclosures d'IFRS 7, pas d'IFRS 12."}, {"q": "Comparé aux référentiels suisses, le volume d'informations exigé par IFRS 12 est :", "options": ["Plus faible : RPC 30 est plus détaillé", "Identique : convergence totale avec le CO", "Beaucoup plus élevé : RPC 30 se limite pour l'essentiel à la liste des sociétés consolidées, et le CO art. 963b ne pose que le principe d'une annexe", "Sans objet : le CO interdit la consolidation"], "answer": 2, "explain": "IFRS 12 est de loin la plus exigeante : transparence des jugements, NCI détaillées, infos financières résumées, entités structurées non consolidées. RPC 30 se limite pour l'essentiel à la liste des sociétés consolidées (siège, %, méthode) ; le CO art. 963b ne fixe que le principe d'une annexe et renvoie au référentiel reconnu."}]}]}]}]}, "swissgaap": {"overview": {"title": "Swiss GAAP RPC — l'essentiel pour l'examen", "intro": "Les **Swiss GAAP RPC** visent l'**image fidèle (true & fair view)** — entre le **CO** (prudence, réserves latentes) et les **IFRS** (juste valeur étendue). Du cadre conceptuel à **RPC 30 (consolidation)**, chaque cours est interactif : quiz, exemples à corrigé masqué, écritures, et comparatif **RPC vs IFRS vs CO**."}, "lessons": [{"code": "Cadre RPC", "title": "Cadre conceptuel & architecture Swiss GAAP RPC", "icon": "🏗️", "color": "blue", "tagline": "Les Swiss GAAP RPC visent une **image fidèle** (*true & fair view*) — l'exact contraire du **CO** qui tolère les **réserves latentes**. Un référentiel **« IFRS light suisse »**, à deux niveaux.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "Les **Swiss GAAP RPC** (*Recommandations relatives à la présentation des comptes* ; en allemand **Swiss GAAP FER**, *Fachempfehlungen zur Rechnungslegung*) sont le **référentiel comptable suisse** de présentation des comptes. Leur but tient en trois mots : donner une **image fidèle** (*true & fair view*) du **patrimoine**, de la **situation financière** et des **résultats** d'une entité.\n\nC'est **LA** rupture philosophique avec le **Code des obligations (CO)** : le CO est gouverné par la **prudence** et autorise les **réserves latentes** (*hidden reserves*) — on a le droit de **sous-évaluer** ses actifs et de **surévaluer** ses passifs. Les RPC **interdisent** cette logique : pas de réserves latentes arbitraires, on vise la réalité économique.\n\nLes RPC se positionnent **entre le CO et les IFRS** : **plus exigeantes que le CO** (image fidèle, annexe étoffée, conso obligatoire) mais **nettement plus simples qu'IFRS** — d'où le surnom **« IFRS light suisse »**. Elles s'organisent en **deux niveaux** (RPC fondamentales pour PME vs RPC complet) avec un **cadre conceptuel** chapeautant l'ensemble."}, {"type": "keypoints", "title": "À retenir", "accent": "blue", "items": ["**Objectif = image fidèle** (*true & fair view*) du patrimoine, de la situation financière et des résultats.", "**Différence majeure avec le CO** : les RPC **interdisent les réserves latentes** ; le CO les **autorise** (prudence).", "**Deux niveaux** : RPC **fondamentales** (*core*, PME) **vs** Swiss GAAP RPC **complet** (toutes les normes, dont **RPC 30** conso et **RPC 31** sociétés cotées).", "**Positionnement** : plus exigeant que le CO, plus simple qu'IFRS ⇒ **« IFRS light suisse »**.", "**Référentiel reconnu** exigé par le **CO art. 962** pour cotées, grandes coopératives (>2 000 membres) et fondations en contrôle ordinaire ; le **SIX** exige RPC **ou** IFRS.", "**Seuils RPC complet (RPC 1)** : bilan **10 mio** / CA **20 mio** / **50 EPT** = la **moitié** des seuils de révision ordinaire du CO (20 / 40 / 250)."]}, {"type": "callout", "tone": "key", "title": "La phrase à graver", "text": "**Image fidèle vs réserves latentes** = le clivage fondateur.\n\n- **Swiss GAAP RPC / IFRS** : on **interdit** les réserves latentes ⇒ image fidèle.\n- **CO** : on **autorise** les réserves latentes ⇒ prudence, protection du créancier, lissage du résultat.\n\nUn même bilan peut donc afficher un patrimoine **très différent** selon qu'il est établi au CO (potentiellement sous-évalué) ou en RPC (réalité économique)."}, {"type": "diagram", "kind": "spectrum", "title": "Axe d'exigence : du plus simple au plus lourd", "bands": [{"from": 0, "to": 33, "color": "amber", "short": "CO", "label": "**CO** — prudence, **réserves latentes autorisées** ; socle légal minimal"}, {"from": 33, "to": 66, "color": "emerald", "short": "RPC", "label": "**Swiss GAAP RPC** — **image fidèle** pragmatique ; « IFRS light suisse »"}, {"from": 66, "to": 100, "color": "indigo", "short": "IFRS", "label": "**IFRS** — image fidèle très poussée ; normes + annexes massives"}], "caption": "Les RPC se logent ENTRE le CO et IFRS : plus exigeantes que le CO (image fidèle), plus simples qu'IFRS."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["**Réserves latentes AUTORISÉES**", "Prudence, protection du créancier", "Sous-évaluation d'actifs / surévaluation de passifs", "Patrimoine potentiellement sous-évalué"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["**Image fidèle** (*true & fair view*)", "Réserves latentes **INTERDITES**", "Réalité économique, prudence raisonnable", "« IFRS light suisse »"]}, {"title": "IFRS", "color": "indigo", "items": ["**Image fidèle** très détaillée", "Réserves latentes **INTERDITES**", "Recours à la **juste valeur**", "Investisseur mondial"]}], "caption": "Le clivage fondateur : le CO autorise les réserves latentes ; RPC et IFRS les interdisent au nom de l'image fidèle."}]}, {"title": "📐 Définitions & vocabulaire", "blocks": [{"type": "intro", "text": "Avant d'entrer dans l'architecture, fixons le vocabulaire que l'examinateur attend. La confusion classique : croire que « RPC » désigne une seule norme. **« Swiss GAAP RPC » est un RÉFÉRENTIEL** (un corps de normes), pas une norme isolée."}, {"type": "table", "title": "Le vocabulaire à manier", "headers": ["Terme", "Définition opérationnelle"], "rows": [["**Swiss GAAP RPC / FER**", "Le **référentiel** comptable suisse de présentation des comptes (RPC = français, FER = allemand : *Fachempfehlungen zur Rechnungslegung*). Édicté par une **commission privée** (la Commission Swiss GAAP RPC), **pas** par l'État."], ["**Image fidèle** (*true & fair view*)", "Principe directeur : les comptes doivent refléter la **réalité économique** du patrimoine, de la situation financière et des résultats — **sans** réserves latentes arbitraires."], ["**Réserve latente** (*hidden reserve*)", "Écart créé en **sous-évaluant un actif** ou **surévaluant un passif** par rapport à sa valeur réelle. **Autorisée au CO** (prudence), **interdite** en RPC."], ["**Cadre conceptuel** (*Framework*)", "Le socle de principes (image fidèle, continuité, importance relative, permanence des méthodes, comparabilité…) qui **chapeaute** toutes les normes RPC."], ["**RPC fondamentales** (*core / Kern-FER*)", "Le **noyau** simplifié, conçu pour les **PME** : un jeu réduit de recommandations couvrant l'essentiel."], ["**Swiss GAAP RPC complet**", "L'**ensemble** des normes (cadre + fondamentales + normes spécialisées), dont **RPC 30** (conso) et **RPC 31** (cotées)."], ["**Référentiel reconnu** (*normes reconnues*)", "Au sens du **CO art. 962 / 962a**, un corps de normes admis : **Swiss GAAP RPC**, **IFRS**, **IFRS for SMEs**, **US GAAP**. Imposé à certaines entités."], ["**EPT** (*FTE*)", "**Emploi à plein temps** (équivalent temps plein) — unité de mesure de l'effectif dans les seuils."]]}, {"type": "callout", "tone": "info", "title": "RPC, ce n'est pas l'État", "text": "Contrairement au **CO** (droit fédéral voté par le Parlement), les **Swiss GAAP RPC** sont émises par une **fondation/commission privée**. Elles n'ont **force obligatoire** que **lorsqu'un texte y renvoie** : le **CO art. 962** (entités tenues à un référentiel reconnu), le **règlement de cotation du SIX**, des statuts, ou un contrat. En dehors de ces renvois, l'application est **volontaire**."}]}, {"title": "🏛️ Architecture en 2 niveaux", "blocks": [{"type": "intro", "text": "Les Swiss GAAP RPC sont **modulaires**. Au sommet, un **cadre conceptuel** pose les principes. En dessous, deux niveaux d'application coexistent : un **noyau pour PME** (RPC fondamentales) et le **référentiel complet** pour les entités plus grandes ou cotées. C'est l'architecture qu'il faut savoir **dessiner** à l'examen."}, {"type": "steps", "title": "Les couches du référentiel, de haut en bas", "accent": "blue", "steps": [{"t": "① Cadre conceptuel (Framework)", "d": "Le socle : objectif d'**image fidèle**, hypothèses de base (**continuité d'exploitation**, comptabilité d'**engagement**), principes (**importance relative**, **permanence des méthodes**, **comparabilité**, **prudence raisonnable** mais sans réserves latentes). Il **chapeaute** toutes les normes."}, {"t": "② Swiss GAAP RPC fondamentales (core, PME)", "d": "Le **noyau** simplifié : un jeu **réduit** de recommandations suffisant pour la majorité des **PME**. Couvre bilan, compte de résultat, annexe, principes d'évaluation de base. **Effort proportionné** à la taille."}, {"t": "③ Swiss GAAP RPC complet", "d": "L'**ensemble** des normes : le cadre + les fondamentales + **toutes** les recommandations spécialisées (tableau de financement, instruments dérivés, impôts différés, immobilier de placement, etc.)."}, {"t": "④ Normes spécifiques (dont 30 & 31)", "d": "Des recommandations ciblées : **RPC 30 — comptes consolidés** (le périmètre, la conso, le goodwill), **RPC 31 — complément pour sociétés cotées** (résultat par action, paiements en actions, information sectorielle, impôts différés détaillés…)."}]}, {"type": "table", "title": "Deux niveaux, deux cibles", "headers": ["", "RPC fondamentales (core)", "Swiss GAAP RPC complet"], "rows": [["**Cible**", "PME en dessous des seuils RPC 1", "Grandes entités, groupes, cotées"], ["**Étendue**", "Noyau réduit de recommandations", "Toutes les normes (cadre + spécialisées)"], ["**Consolidation (RPC 30)**", "Non exigée à ce niveau", "**Exigée** si groupe (sous réserve d'exemptions)"], ["**Module cotées (RPC 31)**", "Non concerné", "**Applicable** aux sociétés cotées"], ["**Esprit**", "Effort proportionné à la PME", "Image fidèle complète, comparabilité"]]}, {"type": "callout", "tone": "tip", "title": "Où se loge RPC 30 ?", "text": "**RPC 30 (comptes consolidés)** fait partie du **référentiel complet** : c'est la norme qui régit le **périmètre de consolidation**, la **méthode** (intégration globale dès le contrôle, mise en équivalence pour les sociétés associées), le **goodwill** (amorti sur ≤ 5 ans, max **20 ans** si justifié, **OU** imputé aux capitaux propres) et les **NCI**. Une PME au niveau *core* sans filiales ne la mobilise pas ; un **groupe** au complet, oui."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "RPC fondamentales (core)", "color": "teal", "items": ["Cible : **PME** sous les seuils RPC 1", "Noyau **réduit** de recommandations", "Bilan, compte de résultat, annexe de base", "**RPC 30 (conso) non exigée** à ce niveau", "Effort proportionné à la taille"]}, {"title": "Swiss GAAP RPC complet", "color": "indigo", "items": ["Cible : **grandes entités, groupes, cotées**", "**Toutes** les normes (cadre + spécialisées)", "Tableau de financement, dérivés, impôts différés…", "**RPC 30** si groupe · **RPC 31** si cotée", "Image fidèle complète, comparabilité"]}], "caption": "Architecture modulaire à 2 niveaux, chapeautée par le cadre conceptuel : noyau PME vs référentiel complet."}]}, {"title": "⚖️ Qui doit / peut appliquer un référentiel reconnu", "blocks": [{"type": "intro", "text": "Le droit comptable suisse (CO, titre 32, **art. 957 ss**) impose à **toutes** les entités tenues de comptabilité un socle minimal. Mais pour certaines, il exige **EN PLUS** des comptes établis selon un **référentiel reconnu** (**CO art. 962**). Swiss GAAP RPC est l'un de ces référentiels — au choix avec IFRS, IFRS for SMEs ou US GAAP."}, {"type": "keypoints", "title": "Qui DOIT établir des comptes selon un référentiel reconnu (CO art. 962)", "accent": "amber", "items": ["Les **sociétés cotées** (titres de capital ou d'emprunt cotés en bourse), **si la bourse l'exige** — et le **SIX l'exige** (RPC ou IFRS).", "Les **grandes coopératives** comptant **au moins 2 000 membres**.", "Les **fondations** légalement soumises au **contrôle ordinaire** (révision ordinaire).", "À la **demande** : actionnaires représentant **≥ 20 %** du capital, **10 %** des membres d'une coopérative / d'une association, ou tout associé/membre à **responsabilité personnelle** peuvent **exiger** des comptes selon un référentiel reconnu (CO art. 962 al. 2)."]}, {"type": "callout", "tone": "info", "title": "RPC ou IFRS ? Le choix du référentiel", "text": "Lorsqu'un référentiel reconnu est requis, l'entité **choisit** : **Swiss GAAP RPC**, **IFRS**, **IFRS for SMEs** ou **US GAAP** (CO art. 962a + ordonnance ORC).\n\n- **SIX Swiss Exchange** : selon le segment, exige **RPC ou IFRS** (US GAAP admis dans certains cas). Beaucoup de PME cotées choisissent **RPC** (plus simple, ancrage suisse) ; les grands groupes internationaux préfèrent souvent **IFRS** (comparabilité mondiale, accès aux marchés étrangers).\n- Une fois le référentiel choisi, **permanence** : on l'applique **intégralement** et de façon **constante**."}, {"type": "callout", "tone": "tip", "title": "Obligation de consolider (CO art. 963 / 963a)", "text": "Indépendamment du référentiel, le **CO art. 963** impose des **comptes de groupe** à toute entité qui **contrôle** une ou plusieurs autres. Le **CO art. 963a** en **dispense** les petits groupes : exemption si, sur deux exercices, le groupe **ne dépasse pas deux** des seuils **bilan 20 mio / CA 40 mio / 250 EPT** (sauf cotation, emprunt obligataire, ou demande d'associés qualifiés). Quand la conso est faite **en RPC**, c'est **RPC 30** qui s'applique."}]}, {"title": "📏 Seuils d'application des RPC complètes (RPC 1)", "blocks": [{"type": "intro", "text": "La **RPC 1 (Bases)** fixe le seuil de bascule entre **RPC fondamentales** (*core*) et **Swiss GAAP RPC complet**. Une entité doit appliquer le **référentiel complet** si elle **dépasse deux** des trois critères suivants pendant **deux exercices consécutifs**."}, {"type": "table", "title": "Seuils RPC 1 — bascule vers le référentiel complet", "headers": ["Critère", "Seuil"], "rows": [["**Total du bilan**", "**10 millions** CHF"], ["**Chiffre d'affaires**", "**20 millions** CHF"], ["**Effectif**", "**50 EPT** (emplois à plein temps en moyenne annuelle)"], ["**Règle de déclenchement**", "**Dépassement de 2 critères sur 2 années** consécutives"]]}, {"type": "callout", "tone": "warn", "title": "⚠️ LE piège : 10 / 20 / 50 (RPC) ≠ 20 / 40 / 250 (CO)", "text": "Ne **jamais** confondre les deux jeux de seuils, c'est un grand classique d'examen :\n\n- **Seuils RPC 1** (core → complet) : **bilan 10 mio / CA 20 mio / 50 EPT**.\n- **Seuils de révision ORDINAIRE du CO (art. 727)** : **bilan 20 mio / CA 40 mio / 250 EPT**.\n\nLes seuils RPC sont **exactement la MOITIÉ** des seuils CO sur le bilan (10 vs 20) et le CA (20 vs 40), et **un cinquième** sur l'effectif (50 vs 250). Mémo : **« RPC = moitié du CO »** (vrai pour bilan et CA). Dans les deux cas : **2 critères sur 2 ans**."}, {"type": "table", "title": "Les deux jeux de seuils à ne pas mélanger", "headers": ["Critère", "Seuils RPC 1 (core → complet)", "Seuils révision ordinaire CO (art. 727)"], "rows": [["Total du bilan", "**10 mio**", "**20 mio**"], ["Chiffre d'affaires", "**20 mio**", "**40 mio**"], ["Effectif", "**50 EPT**", "**250 EPT**"], ["Déclenchement", "2 critères / 2 ans", "2 critères / 2 ans"], ["Effet", "Passage au **RPC complet**", "**Révision ordinaire** obligatoire"]]}, {"type": "callout", "tone": "info", "title": "Et les seuils de l'art. 963a (conso) ?", "text": "Troisième jeu à distinguer ! L'exemption de **consolidation** (CO art. 963a) reprend les **mêmes chiffres que la révision ordinaire** : **bilan 20 mio / CA 40 mio / 250 EPT**. Donc : **20 / 40 / 250** sert **à la fois** pour la révision ordinaire (art. 727) **et** pour la dispense de comptes de groupe (art. 963a) ; **10 / 20 / 50** est propre aux **RPC** (bascule core → complet)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Seuils RPC 1 (core → complet)", "color": "emerald", "items": ["Total du bilan : **10 mio**", "Chiffre d'affaires : **20 mio**", "Effectif : **50 EPT**", "Déclenchement : 2 critères / 2 ans", "Effet : passage au **RPC complet**"]}, {"title": "Seuils CO 20 / 40 / 250", "color": "amber", "items": ["Total du bilan : **20 mio**", "Chiffre d'affaires : **40 mio**", "Effectif : **250 EPT**", "Déclenchement : 2 critères / 2 ans", "Effet : **révision ordinaire** (art. 727) **&** exemption de conso (art. 963a)"]}], "caption": "LE piège : 10/20/50 (RPC) = exactement la MOITIÉ du bilan et du CA des seuils CO 20/40/250 (et 1/5 sur l'effectif)."}, {"type": "diagram", "kind": "split", "title": "« RPC = moitié du CO » — illustration sur le bilan", "parts": [{"label": "Seuil RPC 1 — bilan 10 mio", "value": 50, "color": "emerald"}, {"label": "Marge jusqu'au seuil CO — bilan 20 mio", "value": 50, "color": "amber"}], "caption": "Le seuil de bascule RPC (10 mio) occupe pile la moitié du chemin vers le seuil CO (20 mio) — même logique pour le CA (20 vs 40)."}]}, {"title": "🧭 Positionnement RPC entre CO et IFRS", "blocks": [{"type": "intro", "text": "Pour situer les RPC, place-les sur un **axe d'exigence** croissant : **CO → Swiss GAAP RPC → IFRS**. Le CO protège le créancier (prudence, réserves latentes) ; IFRS sert l'investisseur international (image fidèle très détaillée) ; les RPC visent **l'image fidèle**, mais avec un **volume de normes et d'annexes bien moindre** qu'IFRS — d'où **« IFRS light suisse »**."}, {"type": "table", "title": "L'axe d'exigence : du plus simple au plus lourd", "headers": ["Référentiel", "Logique", "Image fidèle ?", "Volume / complexité"], "rows": [["**CO** (art. 957 ss)", "Prudence, protection du créancier", "**Non** : réserves latentes autorisées", "Faible (socle légal minimal)"], ["**Swiss GAAP RPC**", "Réalité économique, ancrage suisse", "**Oui**, mais pragmatique", "**Moyen** (« IFRS light »)"], ["**IFRS**", "Information de l'investisseur mondial", "**Oui**, très poussée", "Élevé (normes + annexes massives)"]]}, {"type": "keypoints", "title": "Pourquoi « IFRS light suisse » ?", "accent": "indigo", "items": ["**Même objectif** qu'IFRS : l'**image fidèle** (pas de réserves latentes), à la différence du CO.", "**Moins de normes** : un référentiel **compact** (quelques dizaines de recommandations) vs des **milliers de pages** IFRS.", "**Annexes plus légères** : informations à fournir **proportionnées**, loin du niveau de détail IFRS.", "**Options plus simples** : p. ex. le **goodwill** peut être **amorti** ou **imputé aux fonds propres** (RPC), là où IFRS impose le **non-amortissement + test de dépréciation annuel** (IAS 36).", "**Ancrage national** : pensé pour le tissu économique **suisse** (PME, coopératives, fondations, cotées de taille moyenne)."]}, {"type": "callout", "tone": "key", "title": "Le bon réflexe de positionnement", "text": "À l'examen, sache resituer une règle : **« Plus exigeant que le CO (image fidèle, conso, annexe), plus simple qu'IFRS (moins de normes, annexes allégées, options pragmatiques). »** Cette phrase, bien placée, rapporte des points et montre que tu **maîtrises le paysage** réglementaire suisse."}, {"type": "diagram", "kind": "pyramid", "title": "Positionnement : du moins exigeant au plus exigeant", "levels": [{"t": "CO (art. 957 ss)", "d": "Le plus simple : prudence, **réserves latentes autorisées**, socle légal minimal, annexe minimale (art. 959c)."}, {"t": "Swiss GAAP RPC", "d": "Niveau intermédiaire : **image fidèle** pragmatique, conso (RPC 30), annexe allégée — « IFRS light suisse »."}, {"t": "IFRS", "d": "Le plus exigeant : image fidèle **très poussée**, milliers de pages, annexes massives, juste valeur, IAS 36."}], "accent": "indigo", "caption": "Axe d'exigence croissant CO → RPC → IFRS : sache resituer toute règle sur cette échelle."}]}, {"title": "🔢 Exemple — quel référentiel pour quelle société ?", "blocks": [{"type": "example", "title": "Trois sociétés, trois situations", "statement": "Détermine, pour chacune, **si** un référentiel reconnu est exigé, **lequel** est envisageable, et **quel niveau RPC** (core vs complet) s'applique le cas échéant. Justifie avec les seuils.\n\n**A — « AlpTech SA »** : start-up **non cotée**, pas de filiale. Bilan **6 mio**, CA **8 mio**, **30 EPT** (stables sur 2 ans). Aucun actionnaire ne demande de référentiel reconnu.\n\n**B — « Helvetia Coop »** : grande **coopérative** de consommation, **3 500 membres**, non cotée. Bilan **150 mio**, CA **400 mio**, **900 EPT**. Contrôle deux filiales logistiques.\n\n**C — « MountView Holding SA »** : société **cotée au SIX**, tête d'un groupe de 4 sociétés. Bilan consolidé **80 mio**, CA **120 mio**, **400 EPT**.", "solution": "**A — AlpTech SA** : non cotée, pas une grande coopérative, pas une fondation en contrôle ordinaire, aucune demande qualifiée ⇒ **AUCUN référentiel reconnu exigé** (CO art. 962). Elle tient sa comptabilité au **CO** (socle légal). Si elle **choisit volontairement** les RPC (p. ex. pour rassurer un investisseur), elle reste **sous les seuils RPC 1** (6 < 10, 8 < 20, 30 < 50) ⇒ **RPC fondamentales (core)** suffisent. Pas de filiale ⇒ **pas de RPC 30**.\n\n---\n\n**B — Helvetia Coop** : **grande coopérative ≥ 2 000 membres** (3 500) ⇒ **référentiel reconnu OBLIGATOIRE** (CO art. 962). Choix **RPC ou IFRS** ; en pratique une coopérative suisse prendra souvent **Swiss GAAP RPC**. Taille très au-dessus des seuils RPC 1 (150 > 10, 400 > 20, 900 > 50) ⇒ **RPC complet**. Elle **contrôle des filiales** et dépasse largement 20 / 40 / 250 ⇒ **comptes de groupe obligatoires** (CO art. 963), donc **RPC 30**.\n\n---\n\n**C — MountView Holding SA** : **cotée au SIX** ⇒ le règlement de cotation **exige un référentiel reconnu** (**RPC ou IFRS**). En RPC : largement au-dessus des seuils RPC 1 ⇒ **RPC complet**, **+ RPC 31** (module sociétés cotées : information sectorielle, résultat par action, etc.). Tête de groupe ⇒ **comptes consolidés RPC 30**. Choix possible d'IFRS à la place — fréquent pour un groupe visant l'international.\n\n---\n\n**Synthèse** : seul le **statut** (cotée / grande coopérative / fondation contrôle ordinaire) ou une **demande qualifiée** **déclenche** l'obligation (art. 962). Une fois en RPC, ce sont les **seuils 10 / 20 / 50** (RPC 1) qui disent **core vs complet**, et le **contrôle** qui déclenche **RPC 30**."}, {"type": "callout", "tone": "warn", "title": "Ne pas sauter une étape de raisonnement", "text": "Le réflexe gagnant en deux temps : **(1)** *Un référentiel reconnu est-il exigé ?* → critère **statut/demande** (CO art. 962). **(2)** *Si oui, lequel et à quel niveau ?* → **choix** RPC/IFRS, puis **seuils RPC 1 (10/20/50)** pour core vs complet, et **contrôle** pour RPC 30. Mélanger ces deux questions (ou appliquer 20/40/250 au lieu de 10/20/50) fait perdre des points."}]}, {"title": "🗂️ Swiss GAAP RPC vs CO vs IFRS", "blocks": [{"type": "compare", "title": "Image fidèle, réserves latentes & seuils : RPC vs CO vs IFRS", "rows": [{"crit": "Objectif premier", "ifrs": "**Image fidèle** détaillée pour l'investisseur mondial", "rpc": "**Image fidèle** pragmatique, ancrage suisse", "co": "**Prudence**, protection du créancier"}, {"crit": "Réserves latentes (hidden reserves)", "ifrs": "**Interdites**", "rpc": "**Interdites**", "co": "**Autorisées** (sous-évaluation d'actifs / surévaluation de passifs)"}, {"crit": "Volume / complexité du référentiel", "ifrs": "**Très élevé** (milliers de pages)", "rpc": "**Moyen** — « IFRS light suisse »", "co": "**Faible** (socle légal minimal)"}, {"crit": "Source du droit", "ifrs": "IASB (normalisateur international)", "rpc": "Commission privée Swiss GAAP RPC (renvoi via CO 962 / SIX)", "co": "**Loi fédérale** (titre 32 du CO)"}, {"crit": "Annexe (informations à fournir)", "ifrs": "**Très étendue**", "rpc": "**Allégée**, proportionnée", "co": "**Minimale** (art. 959c)"}, {"crit": "Consolidation", "ifrs": "**Obligatoire** dès le contrôle (IFRS 10)", "rpc": "**Obligatoire** dès le contrôle (**RPC 30**)", "co": "Obligatoire si contrôle (art. 963), **exemptions de taille** (963a)"}, {"crit": "Goodwill (suivi)", "ifrs": "**Non amorti** + test annuel (IAS 36)", "rpc": "**Amorti** ≤ 5 ans (max **20 ans**) **OU** imputé aux **fonds propres**", "co": "Généralement **amorti** ; prudence, pas de standard détaillé"}, {"crit": "Seuils déclencheurs propres", "ifrs": "Selon cotation / marché visé", "rpc": "**RPC 1 : 10 / 20 / 50** (core → complet)", "co": "**727 : 20 / 40 / 250** (révision ord.) ; **963a : 20 / 40 / 250** (conso)"}, {"crit": "Qui l'utilise typiquement", "ifrs": "Grands groupes internationaux, multinationales", "rpc": "PME, coopératives, fondations, **cotées suisses** de taille moyenne", "co": "**Toutes** les entités (socle obligatoire) ; PME non soumises à un référentiel reconnu"}]}, {"type": "keypoints", "title": "Les 3 contrastes qui rapportent des points", "accent": "rose", "items": ["**Réserves latentes** : *autorisées au CO* **vs** *interdites en RPC et IFRS*. **LE** clivage philosophique.", "**Seuils** : *RPC 10 / 20 / 50* (core→complet) **vs** *CO 20 / 40 / 250* (révision ordinaire & exemption de conso). **« RPC = moitié du CO »**.", "**Goodwill** : *amorti ≤ 20 ans ou imputé aux fonds propres* (RPC) **vs** *non amorti + test annuel* (IFRS) **vs** *amorti/prudence* (CO)."]}]}, {"title": "⚠️ Pièges & confusions classiques", "blocks": [{"type": "callout", "tone": "warn", "title": "Piège n°1 — confondre les jeux de seuils", "text": "**10 / 20 / 50** = **RPC 1** (bascule core → complet). **20 / 40 / 250** = **CO** (révision ordinaire art. 727 **ET** exemption de conso art. 963a). Trois usages, deux jeux de chiffres : ne **jamais** appliquer 20/40/250 pour décider du niveau RPC, ni 10/20/50 pour la révision ou la conso."}, {"type": "callout", "tone": "warn", "title": "Piège n°2 — « RPC = une norme »", "text": "**Faux.** « Swiss GAAP RPC » est un **référentiel** (un corpus de normes), structuré en cadre conceptuel + fondamentales + normes spécialisées. **RPC 30**, **RPC 31** sont des **normes** À L'INTÉRIEUR du référentiel."}, {"type": "callout", "tone": "warn", "title": "Piège n°3 — croire que RPC est imposé par défaut", "text": "Les RPC ne s'imposent **que** par renvoi : **CO art. 962** (cotées, grandes coopératives >2 000 membres, fondations en contrôle ordinaire, demande qualifiée), **règlement SIX**, statuts ou contrat. Une PME ordinaire reste au **CO** ; elle peut adopter les RPC **volontairement**, mais n'y est pas tenue."}, {"type": "callout", "tone": "warn", "title": "Piège n°4 — penser que RPC = IFRS", "text": "Même **objectif** (image fidèle), mais **pas** la même **profondeur**. Les RPC sont **« IFRS light »** : moins de normes, annexes plus légères, options plus simples (ex. goodwill amortissable **ou** imputable aux fonds propres). Ne **transpose pas** mécaniquement une règle IFRS détaillée en RPC."}, {"type": "keypoints", "title": "Autres confusions à éviter", "accent": "rose", "items": ["**RPC ≠ CO** : le **CO reste obligatoire** comme socle (comptes individuels statutaires, base fiscale) ; les RPC s'**ajoutent** pour l'image fidèle, elles ne **remplacent pas** le bilan fiscal/CO.", "**Image fidèle ≠ zéro prudence** : les RPC gardent une **prudence raisonnable**, mais **sans** réserves latentes **arbitraires**.", "**>2 000 membres** vise les **coopératives** (pas les associations) au titre du référentiel reconnu (art. 962).", "**SIX exige RPC OU IFRS** : pas « RPC obligatoirement » — l'émetteur **choisit** (et IFRS est fréquent pour l'international).", "**Core vs complet** se décide aux **seuils RPC 1**, **pas** au fait d'être coté (une cotée est de toute façon au **complet + RPC 31**)."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "FIDÈLE", "phrase": "« Les RPC veulent qu'on soit FIDÈLE à la réalité » — un moyen de retenir que l'image fidèle (sans réserves latentes) est le cœur du référentiel.", "items": [{"l": "F", "t": "**Fidèle** : objectif = **image fidèle** (*true & fair view*), l'opposé du CO"}, {"l": "I", "t": "**Interdiction** des réserves latentes (vs CO qui les autorise)"}, {"l": "D", "t": "**Deux niveaux** : fondamentales (PME) vs complet (dont RPC 30 / 31)"}, {"l": "È", "t": "**Échelle** d'exigence : entre le CO et IFRS (« IFRS light »)"}, {"l": "L", "t": "**Loi (CO 962)** : qui doit un référentiel reconnu (cotées, gdes coopératives, fondations)"}, {"l": "E", "t": "**Effectifs & seuils** : RPC 1 = **10 / 20 / 50** (≠ CO 20 / 40 / 250)"}]}, {"type": "callout", "tone": "tip", "title": "Mémo-chiffres : « la moitié »", "text": "**RPC 1 = 10 / 20 / 50.** Pour le retenir : **le bilan et le CA sont la MOITIÉ** des seuils CO de révision ordinaire (**20 / 40**), et l'effectif est **50** (le cinquième de 250). Donc : **« RPC, c'est moitié-bilan, moitié-CA, et 50 personnes. »**"}, {"type": "keypoints", "title": "Réflexes d'examen (très payant)", "accent": "emerald", "items": ["**Annoncer le clivage** : « Les RPC visent l'**image fidèle** ; le CO **autorise les réserves latentes** » — phrase d'ouverture qui pose le décor.", "**Raisonner en deux temps** : (1) référentiel reconnu **exigé** ? (statut/demande, art. 962) → (2) **lequel** + **quel niveau** (seuils RPC 1) + **conso** (contrôle → RPC 30).", "**Ne jamais mélanger** 10 / 20 / 50 (RPC 1) et 20 / 40 / 250 (CO 727 & 963a).", "**Citer le bon module** : groupe ⇒ **RPC 30** ; cotée ⇒ **RPC 31** en plus.", "**Positionner** : « plus exigeant que le CO, plus simple qu'IFRS — *IFRS light suisse* ».", "**Rappeler le choix SIX** : référentiel reconnu = **RPC ou IFRS** (US GAAP dans certains cas)."]}, {"type": "callout", "tone": "key", "title": "Citations sûres", "text": "**CO art. 957 ss** (tenue de comptabilité, socle) · **CO art. 962 / 962a** (comptes selon un **référentiel reconnu** : cotées, grandes coopératives >2 000 membres, fondations en contrôle ordinaire, demande qualifiée ; choix RPC/IFRS/US GAAP) · **CO art. 963 / 963a** (comptes de groupe + exemptions 20/40/250) · **CO art. 727** (révision ordinaire 20/40/250) · **Swiss GAAP RPC — Cadre conceptuel** · **RPC 1** (seuils 10/20/50) · **RPC 30** (comptes consolidés) · **RPC 31** (sociétés cotées)."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste-toi (8 questions)", "questions": [{"q": "Quelle est LA différence philosophique majeure entre les Swiss GAAP RPC et le CO ?", "options": ["Les RPC sont un droit fédéral, le CO une recommandation privée", "Les RPC visent l'image fidèle et interdisent les réserves latentes ; le CO les autorise", "Le CO interdit la consolidation, les RPC l'imposent toujours", "Les RPC n'autorisent pas l'amortissement du goodwill, le CO si"], "answer": 1, "explain": "Le clivage fondateur : les **RPC** cherchent l'**image fidèle** (*true & fair view*) et **interdisent les réserves latentes** ; le **CO**, gouverné par la prudence, **autorise** les réserves latentes (sous-évaluation d'actifs, surévaluation de passifs)."}, {"q": "Quels sont les seuils de la RPC 1 pour basculer des RPC fondamentales vers le référentiel complet ?", "options": ["Bilan 20 mio / CA 40 mio / 250 EPT", "Bilan 10 mio / CA 20 mio / 50 EPT", "Bilan 5 mio / CA 10 mio / 25 EPT", "Bilan 40 mio / CA 80 mio / 500 EPT"], "answer": 1, "explain": "**RPC 1 : bilan 10 mio / CA 20 mio / 50 EPT** (2 critères dépassés sur 2 ans). C'est **la moitié** des seuils de révision ordinaire du CO (20 / 40 / 250) sur le bilan et le CA — un piège fréquent."}, {"q": "Comment se positionnent les Swiss GAAP RPC entre le CO et les IFRS ?", "options": ["Plus simples que le CO et plus exigeantes qu'IFRS", "Plus exigeantes que le CO et plus simples qu'IFRS (« IFRS light suisse »)", "Exactement identiques aux IFRS", "Identiques au CO mais avec une annexe plus courte"], "answer": 1, "explain": "Sur l'axe d'exigence **CO → RPC → IFRS**, les RPC sont **plus exigeantes que le CO** (image fidèle, conso, annexe) mais **plus simples qu'IFRS** (moins de normes, annexes allégées, options pragmatiques) — d'où **« IFRS light suisse »**."}, {"q": "Selon le CO art. 962, quelle entité doit établir des comptes selon un référentiel reconnu ?", "options": ["Toute SàRL réalisant un bénéfice", "Une grande coopérative d'au moins 2 000 membres", "Toute PME de plus de 10 employés", "Une raison individuelle au-dessus de 100 000 CHF de CA"], "answer": 1, "explain": "Le **CO art. 962** vise notamment les **sociétés cotées** (si la bourse l'exige), les **grandes coopératives ≥ 2 000 membres**, et les **fondations soumises au contrôle ordinaire** — ainsi que les cas de **demande qualifiée** (20 % du capital, etc.)."}, {"q": "Une société cotée au SIX doit appliquer…", "options": ["Obligatoirement les Swiss GAAP RPC, jamais autre chose", "Le CO uniquement", "Un référentiel reconnu : RPC ou IFRS (au choix)", "Obligatoirement les IFRS"], "answer": 2, "explain": "Le règlement de cotation du **SIX** exige un **référentiel reconnu** : l'émetteur **choisit RPC ou IFRS** (US GAAP admis dans certains segments). Beaucoup de cotées suisses de taille moyenne optent pour **RPC**."}, {"q": "Quelle norme régit les comptes consolidés en Swiss GAAP RPC, et à quel niveau du référentiel se situe-t-elle ?", "options": ["RPC 31, au niveau des fondamentales (core)", "RPC 30, au niveau du référentiel complet", "RPC 1, au niveau du cadre conceptuel", "IFRS 10, transposée telle quelle"], "answer": 1, "explain": "Les **comptes consolidés** relèvent de **RPC 30**, qui fait partie du **référentiel complet** (et non du noyau *core* destiné aux PME). **RPC 31** est, elle, le complément pour les **sociétés cotées**."}, {"q": "Quels sont les seuils de la révision ordinaire du CO (art. 727) — à ne pas confondre avec ceux des RPC ?", "options": ["10 mio / 20 mio / 50 EPT", "20 mio / 40 mio / 250 EPT", "5 mio / 10 mio / 50 EPT", "50 mio / 100 mio / 500 EPT"], "answer": 1, "explain": "La **révision ordinaire** (CO art. 727) se déclenche à **bilan 20 mio / CA 40 mio / 250 EPT** (2 sur 2 ans). Ces mêmes 20 / 40 / 250 servent aussi à l'**exemption de consolidation** (art. 963a). À distinguer des seuils **RPC 1 (10 / 20 / 50)**."}, {"q": "Les réserves latentes (hidden reserves) sont…", "options": ["Autorisées en RPC mais interdites au CO", "Autorisées au CO mais interdites en RPC et en IFRS", "Interdites partout, y compris au CO", "Une notion propre aux IFRS uniquement"], "answer": 1, "explain": "Les **réserves latentes** sont **autorisées au CO** (logique de prudence) mais **interdites** en **Swiss GAAP RPC** comme en **IFRS**, car elles contredisent l'**image fidèle**. C'est le cœur de la divergence philosophique."}]}]}]}, {"code": "RPC 3/6", "title": "Présentation des comptes (Swiss GAAP RPC)", "icon": "📑", "color": "teal", "tagline": "Les **états financiers RPC** : bilan, compte de résultat, **tableau de financement (RPC 4)**, annexe (RPC 6) et — pour le comptes complets — **tableau de variation des capitaux propres (RPC 24)**.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "Présenter des comptes en **Swiss GAAP RPC** (Recommandations relatives à la présentation des comptes / *Swiss GAAP FER*), c'est répondre à une exigence simple mais structurante : donner une **image fidèle** (*true and fair view*) du patrimoine, de la situation financière et des résultats.\n\nLe jeu d'états financiers RPC comporte **cinq composantes** quand l'entité applique le référentiel **complet** (*Swiss GAAP RPC entiers*) :\n- le **bilan** (*Bilanz*) ;\n- le **compte de résultat** (*Erfolgsrechnung*) ;\n- le **tableau de financement** = tableau des **flux de trésorerie** (*Geldflussrechnung*) ;\n- l'**annexe** (*Anhang*) ;\n- le **tableau de variation des capitaux propres** (*Eigenkapitalnachweis*).\n\nLes entités plus petites qui n'appliquent que le **socle (RPC fondamentales / *Kern-FER*)** présentent un jeu **réduit** : bilan, compte de résultat et annexe, sans tableau de financement ni tableau des capitaux propres obligatoires.\n\nDeux marqueurs à graver d'emblée : RPC raisonne en **image fidèle** (au-dessus du simple respect formel de la loi) et impose un **tableau de financement à 3 catégories**, là où le **Code des obligations (CO)** se contente d'un minimum léga
