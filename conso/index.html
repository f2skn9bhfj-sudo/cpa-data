                    <table className="w-full text-sm min-w-max">
                      <thead><tr className="bg-slate-100 text-slate-600 text-xs">
                        <th className="px-3 py-1.5 text-left">Année</th><th className="px-3 py-1.5 text-right">Ouverture</th><th className="px-3 py-1.5 text-right">Dotation</th><th className="px-3 py-1.5 text-right">VNC clôture</th>
                      </tr></thead>
                      <tbody>
                        {Array.from({ length: opt.amort }, (_, i) => {
                          const ouv = c.gw - i * c.amortAnnual;
                          return (<tr key={i} className="border-t border-slate-100">
                            <td className="px-3 py-1.5">{i + 1}</td><td className="px-3 py-1.5 text-right tabular-nums">{fmt(ouv)}</td><td className="px-3 py-1.5 text-right tabular-nums">{fmt(c.amortAnnual)}</td><td className="px-3 py-1.5 text-right tabular-nums">{fmt(ouv - c.amortAnnual)}</td>
                          </tr>);
                        })}
                      </tbody>
                    </table>
                  </div>
                  <Note type="info">RPC 30 : durée d'utilité, <strong>usuellement 5 ans, maximum 20</strong>, avec test de dépréciation complémentaire.</Note>
                </>
              ) : (
                <>
                  <Journal n="5" title="Compensation du goodwill avec les capitaux propres (à l'acquisition)"
                    lines={[{ compte: "Réserves consolidées", debit: c.gw }, { compte: "Goodwill (jamais inscrit à l'actif)", credit: c.gw }]}
                    note="Le goodwill est imputé directement sur les fonds propres ; il n'apparaît pas au bilan et n'est pas amorti." />
                  <Note type="warn">L'<strong>annexe doit indiquer l'effet théorique</strong> d'une activation/amortissement (impact sur capitaux propres et résultat).</Note>
                </>
              )}
            </Card>
          )}
        </div>
      );
      case 6: return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-3 flex flex-wrap gap-4 items-center justify-between"><MethodSwitch /><RefSwitch /></div>
          <Note type="tip">Les bilans côte à côte : la <strong>Mère</strong> et la <strong>Filiale</strong> ci-dessous, combinées par les écritures de consolidation, donnent le <strong>bilan du groupe</strong> juste en dessous. Repère ce qui change : les titres disparaissent, le goodwill apparaît, le capital se réduit à celui de la mère, et les minoritaires surgissent au passif.</Note>
          <div className="grid sm:grid-cols-2 gap-4">
            <BilanView title="Mère" accent="indigo"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Titres de participation", v: num(d.prix) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves", v: num(d.mRes) }, { l: "Dettes", v: num(d.mDettes) }]} />
            <BilanView title="Filiale" accent="slate"
              actifs={[{ l: "Actifs", v: num(d.fActifs) }]}
              passifs={[{ l: "Capital", v: num(d.fCap) }, { l: "Réserves (clôture)", v: num(d.fResClot) }, { l: "Dettes", v: num(d.fDettes) }]} />
          </div>
          <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div className="bg-slate-800 text-white px-4 py-2.5 flex items-center justify-between">
              <span className="font-semibold flex items-center gap-2"><Banknote size={16} /> Bilan consolidé (Groupe)</span>
              <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${c.okBilan ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>{c.okBilan ? <CheckCircle2 size={12} /> : <AlertTriangle size={12} />}{c.okBilan ? "équilibré" : "déséquilibré"}</span>
            </div>
            <div className="grid sm:grid-cols-2 divide-y sm:divide-y-0 sm:divide-x divide-slate-100">
              <div className="p-4">
                <div className="text-xs font-semibold uppercase text-slate-400 mb-2">Actif</div>
                {[["Goodwill", c.gwActif], ["Autres actifs (cumul + écart − intragroupe − marge)", c.cActifs]].map((r, i) => (
                  <div key={i} className="flex justify-between py-1.5 text-sm text-slate-700"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
                ))}
                <div className="flex justify-between py-2 mt-1 border-t-2 border-slate-300 font-bold text-slate-900"><span>Total</span><span className="tabular-nums">{fmt(c.totActif)}</span></div>
              </div>
              <div className="p-4">
                <div className="text-xs font-semibold uppercase text-slate-400 mb-2">Passif</div>
                {[["Capital (groupe)", num(d.mCap)], ["Réserves consolidées", c.resConsoFinal], ["Intérêts minoritaires", c.nci], ...(c.DTL > 0 ? [["Impôt différé passif", c.DTL]] : []), ["Dettes (cumul − intragroupe)", num(d.mDettes) + num(d.fDettes) - c.ic]].map((r, i) => (
                  <div key={i} className="flex justify-between py-1.5 text-sm text-slate-700"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
                ))}
                <div className="flex justify-between py-2 mt-1 border-t-2 border-slate-300 font-bold text-slate-900"><span>Total</span><span className="tabular-nums">{fmt(c.totPassif)}</span></div>
              </div>
            </div>
          </div>
          <Note type="tip">Capital = <strong>celui de la mère seule</strong> ; réserves consolidées = réserves mère + part groupe des résultats post-acquisition − marges internes{c.compense ? " − goodwill compensé" : ""} ; minoritaires = leur quote-part de la filiale à la clôture.</Note>
          <Note type="info">Le goodwill est présenté à sa <strong>valeur d'acquisition</strong> (première consolidation) ; son amortissement éventuel (Swiss GAAP) est traité à l'étape précédente. {c.gw < 0 ? "Ici le goodwill est négatif (badwill) : il n'est pas inscrit à l'actif mais comptabilisé en produit, donc logé dans les réserves consolidées." : ""}</Note>
        </div>
      );
      default: return null;
    }
  };

  const notable = () => {
    switch (step) {
      case 0: return (
        <div className="grid lg:grid-cols-2 gap-5">
          <Card title="Structure" icon={<Network size={18} className="text-emerald-600" />} accent="emerald">
            <GroupSchema pct={num(d.pctMere)} kind="notable" />
            <Note type="tip">Influence notable : aucun actif/passif repris, une seule ligne « participations mises en équivalence ».</Note>
          </Card>
          <Card title="Données de la participation" icon={<Calculator size={18} className="text-emerald-600" />}>
            <Field label="Pourcentage détenu" value={d.pctMere} onChange={u("pctMere")} suffix="%" />
            <Field label="Coût d'acquisition des titres" value={d.prix} onChange={u("prix")} />
            <Field label="Capital de l'entité" value={d.fCap} onChange={u("fCap")} />
            <Field label="Réserves à l'acquisition" value={d.fResAcq} onChange={u("fResAcq")} />
            <Field label="Réserves à la clôture" value={d.fResClot} onChange={u("fResClot")} />
            <Field label="Écart d'évaluation" value={d.ecart} onChange={u("ecart")} />
          </Card>
        </div>
      );
      case 1: return (
        <Card title="Valeur d'équivalence à l'acquisition" icon={<Coins size={18} className="text-emerald-600" />} accent="emerald">
          <div className="space-y-1 text-sm">
            {[["Coût d'acquisition", c.prix], [`Quote-part d'actif net acquise (${d.pctMere} %)`, c.qpGroupe], ["Goodwill (inclus dans la valeur des titres)", c.gwEmbeddedME]].map((r, i) => (
              <div key={i} className="flex justify-between py-1.5 text-slate-600"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
            ))}
          </div>
          <Note type="info">En mise en équivalence, le goodwill <strong>n'est pas isolé</strong> : il est compris dans la valeur comptable des titres (jamais amorti en IFRS).</Note>
        </Card>
      );
      case 2: return (
        <div className="space-y-4">
          <Card title="Évolution depuis l'acquisition" icon={<TrendingDown size={18} className="text-emerald-600" />} accent="emerald">
            <div className="space-y-1 text-sm">
              {[["Valeur initiale (coût)", c.prix], [`Quote-part du résultat accumulé (${d.pctMere} % × ${fmt(c.deltaR)})`, c.pct * c.deltaR], ["Valeur d'équivalence à la clôture", c.valME]].map((r, i) => (
                <div key={i} className={`flex justify-between py-1.5 ${i === 2 ? "font-semibold text-emerald-700 border-t border-emerald-100 mt-1 pt-2" : "text-slate-600"}`}><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
              ))}
            </div>
          </Card>
          <Journal n="1" title="Réévaluation des titres mis en équivalence"
            lines={[{ compte: "Titres mis en équivalence", debit: c.pct * c.deltaR }, { compte: "Réserves consolidées (quote-part de résultat)", credit: c.pct * c.deltaR }]}
            note="Chaque exercice, la valeur des titres augmente de la quote-part du résultat (et diminue des dividendes reçus, ici nuls)." />
        </div>
      );
      case 3: return (
        <div className="space-y-4">
          <Card title="Présentation dans les comptes consolidés" icon={<FileText size={18} className="text-emerald-600" />} accent="emerald">
            <div className="rounded-lg border border-slate-200 overflow-hidden">
              <div className="bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">Au bilan (une seule ligne)</div>
              <div className="flex justify-between px-3 py-2 text-sm"><span className="text-slate-700">Participations mises en équivalence</span><span className="tabular-nums font-semibold">{fmt(c.valME)}</span></div>
            </div>
            <div className="rounded-lg border border-slate-200 overflow-hidden mt-3">
              <div className="bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">Au compte de résultat</div>
              <div className="flex justify-between px-3 py-2 text-sm"><span className="text-slate-700">Quote-part du résultat des entreprises associées</span><span className="tabular-nums font-semibold">{fmt(c.pct * c.deltaR)}</span></div>
            </div>
          </Card>
          <Note type="tip">Le bilan du groupe = celui de la mère, où les <strong>titres au coût</strong> ({fmt(num(d.prix))}) deviennent une <strong>participation mise en équivalence</strong> ({fmt(c.valME)}). Aucun actif/passif de l'associée n'y entre.</Note>
          <div className="grid md:grid-cols-2 gap-4">
            <BilanView title="Bilan individuel — Mère" accent="slate"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Titres de participation", v: num(d.prix) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves", v: num(d.mRes) }, { l: "Dettes", v: num(d.mDettes) }]} />
            <BilanView title="Bilan consolidé (mise en équivalence)" accent="emerald"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Participations mises en équivalence", v: c.valME }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves consolidées", v: num(d.mRes) + c.pct * c.deltaR }, { l: "Dettes", v: num(d.mDettes) }]} />
          </div>
        </div>
      );
      default: return null;
    }
  };

  const conjoint = () => {
    switch (step) {
      case 0: return (
        <div className="grid lg:grid-cols-2 gap-5">
          <Card title="Structure" icon={<GitBranch size={18} className="text-amber-600" />} accent="amber">
            <GroupSchema pct={num(d.pctMere)} kind="conjoint" />
            <Note type="tip">Contrôle conjoint : le traitement diffère fortement entre IFRS et Swiss GAAP.</Note>
          </Card>
          <Card title="Données de la coentreprise" icon={<Calculator size={18} className="text-amber-600" />}>
            <Field label="Quote-part détenue" value={d.pctMere} onChange={u("pctMere")} suffix="%" />
            <Field label="Coût des titres" value={d.prix} onChange={u("prix")} />
            <Field label="Capital" value={d.fCap} onChange={u("fCap")} />
            <Field label="Réserves à l'acquisition" value={d.fResAcq} onChange={u("fResAcq")} />
            <Field label="Réserves à la clôture" value={d.fResClot} onChange={u("fResClot")} />
            <Field label="Actifs de la coentreprise" value={d.fActifs} onChange={u("fActifs")} />
            <Field label="Dettes de la coentreprise" value={d.fDettes} onChange={u("fDettes")} />
            <Field label="Écart d'évaluation" value={d.ecart} onChange={u("ecart")} />
          </Card>
        </div>
      );
      case 1: return (
        <div className="grid md:grid-cols-2 gap-4">
          <Card title="IFRS (IFRS 11 / IAS 28)" icon={<Scale size={18} className="text-indigo-600" />} accent="indigo">
            <p className="text-sm text-slate-600">Une <strong>coentreprise</strong> (droits sur l'actif net) est traitée par <strong>mise en équivalence</strong>. L'intégration proportionnelle est <strong>interdite</strong> pour les coentreprises.</p>
            <div className="mt-3 rounded-lg bg-indigo-50 p-3 text-sm"><div className="flex justify-between"><span className="text-indigo-700">Valeur d'équivalence à la clôture</span><span className="tabular-nums font-semibold text-indigo-800">{fmt(c.valME)}</span></div></div>
            <Note type="info">Si c'est une « activité conjointe » (droits sur les actifs, obligations sur les passifs), on reprend directement sa quote-part d'actifs/passifs.</Note>
          </Card>
          <Card title="Swiss GAAP RPC 30" icon={<Scale size={18} className="text-red-600" />} accent="red">
            <p className="text-sm text-slate-600">L'<strong>intégration proportionnelle est autorisée</strong> : on reprend la quote-part ({d.pctMere} %) de chaque actif et passif. La mise en équivalence reste possible.</p>
            <div className="mt-3 rounded-lg bg-red-50 p-3 text-sm space-y-1">
              <div className="flex justify-between"><span className="text-red-700">Quote-part des actifs repris</span><span className="tabular-nums font-semibold text-red-800">{fmt(c.pct * num(d.fActifs))}</span></div>
              <div className="flex justify-between"><span className="text-red-700">Goodwill (sur la quote-part)</span><span className="tabular-nums font-semibold text-red-800">{fmt(c.gwEmbeddedME)}</span></div>
            </div>
          </Card>
        </div>
      );
      case 2: return (
        <div className="space-y-4">
          <Card title="Intégration proportionnelle — principe" icon={<Layers size={18} className="text-amber-600" />} accent="amber">
            <p className="text-sm text-slate-600 mb-3">On additionne au bilan de la mère la <strong>quote-part</strong> de chaque poste de la coentreprise ({d.pctMere} %), sans intérêts minoritaires.</p>
            <div className="space-y-1 text-sm">
              {[[`Quote-part des actifs (${d.pctMere} %)`, c.pct * num(d.fActifs)], ["Quote-part de l'écart d'évaluation", c.pct * c.ecart], ["Goodwill", c.gwEmbeddedME]].map((r, i) => (
                <div key={i} className="flex justify-between py-1.5 text-slate-600"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
              ))}
            </div>
            <Note type="warn">Méthode <strong>spécifique à Swiss GAAP</strong> pour les coentreprises : interdite en IFRS, où la mise en équivalence s'impose.</Note>
          </Card>
          <Note type="tip">Les bilans : la <strong>coentreprise à 100 %</strong>, puis le <strong>consolidé proportionnel</strong> qui n'en reprend que la quote-part ({d.pctMere} %), sans minoritaires.</Note>
          <div className="grid md:grid-cols-3 gap-4">
            <BilanView title="Mère" accent="slate"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Titres", v: num(d.prix) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves", v: num(d.mRes) }, { l: "Dettes", v: num(d.mDettes) }]} />
            <BilanView title="Coentreprise (100 %)" accent="amber"
              actifs={[{ l: "Actifs", v: num(d.fActifs) }]}
              passifs={[{ l: "Capital", v: num(d.fCap) }, { l: "Réserves (clôture)", v: num(d.fResClot) }, { l: "Dettes", v: num(d.fDettes) }]} />
            <BilanView title="Consolidé (proportionnel)" accent="emerald"
              actifs={[{ l: "Goodwill", v: c.gwEmbeddedME }, { l: "Autres actifs (+ quote-part)", v: num(d.mActifs) + c.pct * num(d.fActifs) + c.pct * num(d.ecart) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves consolidées", v: num(d.mRes) + c.pct * c.deltaR }, { l: "Dettes (+ quote-part)", v: num(d.mDettes) + c.pct * num(d.fDettes) }]} />
          </div>
        </div>
      );
      default: return null;
    }
  };

  /* ===================== Vu UE4 — présentation type DSCG ===================== */
  const ue4Exclusif = () => {
    const p = num(d.pctMere), minor = 100 - p;
    const capG = num(d.fCap) * c.pct, capN = num(d.fCap) * (1 - c.pct);
    const resClotRetr = num(d.fResClot) + c.ecartNet;
    const resG = resClotRetr * c.pct, resN = resClotRetr * (1 - c.pct);
    const coutTitresJV = c.qpGroupe;
    const contribG = capG + resG - coutTitresJV;
    const partageNCI = capN + resN;
    const gwGroupe = c.gwPartial;
    const gwNci = c.full ? (num(d.jvNci) - c.qpNci) : 0;
    switch (step) {
      case 0: return (
        <UE4Cols title="Périmètre de consolidation (Dossier 1 — DSCG)"
          cols={["Société", "% contrôle", "Nature du contrôle", "Méthode", "% d'intérêt", "% NCI"]}
          rows={[{ label: "Filiale", vals: [`${d.pctMere} %`, "Contrôle exclusif", "Intégration globale", `${d.pctMere} %`, `${fmt(minor)} %`] }]}
          note="Au DSCG, le dossier conso s'ouvre toujours par ce tableau : pour chaque société, le % de contrôle (→ choix de la méthode) et le % d'intérêt (→ part économique). En contrôle exclusif sans chaîne, contrôle = intérêt." />
      );
      case 1: return (
        <div className="space-y-4">
          <UE4Cols title="Juste valeur des actifs identifiables et passifs repris (à la date d'acquisition)"
            cols={["Détermination de la juste valeur", "Montant"]}
            rows={[
              { label: "Capitaux propres à la date d'acquisition (capital + réserves)", vals: [num(d.fCap) + num(d.fResAcq)], calc: `capital filiale ${fmt(num(d.fCap))} + réserves à l'acquisition ${fmt(num(d.fResAcq))} = ${fmt(num(d.fCap) + num(d.fResAcq))}` },
              { label: "+ Plus-value latente (écart d'évaluation brut)", vals: [c.ecart], calc: "donnée d'entrée : écart d'évaluation brut (plus-value latente sur les actifs réévalués)" },
              { label: `− Impôt différé (${d.taux} %)`, vals: [-c.DTL], calc: `écart brut ${fmt(c.ecart)} × taux ${d.taux} % = ${fmt(c.DTL)}` },
              { label: "= Juste valeur des actifs identifiables (actif net retraité)", vals: [c.X], bold: true, calc: `${fmt(num(d.fCap) + num(d.fResAcq))} + ${fmt(c.ecart)} − ${fmt(c.DTL)} = ${fmt(c.X)}` },
            ]}
            note="Présentation DSCG type « SAS CAMOMILLE / SA TULIPE » : on part des capitaux propres comptables, on ajoute les plus-values latentes nettes d'impôt différé. Avec un taux à 0 %, l'ID est nul — mets ~14 % pour voir l'effet." />
          <Journal n="UE4" title="Constatation de l'écart d'évaluation à la juste valeur"
            lines={[{ compte: "Actifs identifiables réévalués", debit: c.ecart }, { compte: "Impôt différé passif (IAS 12)", credit: c.DTL }, { compte: "Réserves filiale (plus-value nette)", credit: c.ecartNet }]}
            note="Écriture au journal de consolidation — bilan. La contrepartie de la plus-value nette est portée en réserves de la filiale (date d'acquisition)." />
        </div>
      );
      case 2: return (
        <div className="space-y-4">
          <div className="flex flex-wrap gap-4 items-center justify-between bg-white rounded-xl border border-slate-200 p-3"><MethodSwitch /><RefSwitch /></div>
          <UE4Cols title={`Calcul du goodwill — méthode ${c.full ? "complète" : "partielle"}`}
            cols={["", `Part propriétaires (${p} %)`, `Part. NCI (${fmt(minor)} %)`, "Total (100 %)"]}
            rows={[
              { label: "Coût des titres / valeur transférée", vals: [num(d.prix), c.full ? num(d.jvNci) : c.qpNci, num(d.prix) + (c.full ? num(d.jvNci) : c.qpNci)], calc: `groupe : coût payé ${fmt(num(d.prix))} (donnée) ; NCI : ${c.full ? `juste valeur des minoritaires ${fmt(num(d.jvNci))} (donnée)` : `quote-part d'actif net = ${fmt(c.X)} × ${fmt(minor)} % = ${fmt(c.qpNci)}`}` },
              { label: "Quote-part de juste valeur de la société", vals: [c.qpGroupe, c.qpNci, c.X], calc: `actif net ${fmt(c.X)} réparti : × ${p} % = ${fmt(c.qpGroupe)} (groupe) ; × ${fmt(minor)} % = ${fmt(c.qpNci)} (NCI)` },
              { label: "= Goodwill", vals: [gwGroupe, gwNci, c.full ? c.gwFull : c.gwPartial], bold: true, calc: `groupe : ${fmt(num(d.prix))} − ${fmt(c.qpGroupe)} = ${fmt(gwGroupe)}${c.full ? ` ; NCI : ${fmt(num(d.jvNci))} − ${fmt(c.qpNci)} = ${fmt(gwNci)}` : " ; NCI : aucun goodwill (méthode partielle)"}` },
            ]}
            note={c.full ? "Méthode complète (option IFRS) : les NCI sont à leur juste valeur, le goodwill inclut leur quote-part." : "Méthode partielle (usuelle Swiss GAAP / fréquente DSCG) : les NCI sont à la quote-part d'actif net, aucun goodwill sur les NCI."} />
          {c.gw >= 0 ? (
            <Journal n="UE4" title="Comptabilisation du goodwill"
              lines={[{ compte: "Goodwill", debit: c.full ? c.gwFull : c.gwPartial }, { compte: "Titres de participation", credit: gwGroupe }, ...(gwNci > 0 ? [{ compte: "Participation ne donnant pas le contrôle", credit: gwNci }] : [])]}
              note="Écriture au bilan. On isole d'abord la composante goodwill ; le reste des titres sera soldé dans l'écriture de partage des capitaux propres." />
          ) : (
            <Note type="warn"><strong>Goodwill négatif (badwill)</strong> : prix &lt; quote-part de JV acquise. En IFRS, après réexamen, l'écart est comptabilisé en <strong>produit</strong> (et non en goodwill).</Note>
          )}
        </div>
      );
      case 3: return (
        <div className="space-y-4">
          <UE4Cols title="Tableau de partage des capitaux propres de la filiale"
            cols={["", "TOTAL (100 %)", `Part propriétaires (${p} %)`, `Part. NCI (${fmt(minor)} %)`]}
            rows={[
              { label: "Capital", vals: [num(d.fCap), capG, capN], calc: `donnée : capital de la filiale ${fmt(num(d.fCap))}. Partage : × ${p} % = ${fmt(capG)} (groupe) ; × ${fmt(minor)} % = ${fmt(capN)} (NCI)` },
              { label: "Réserves retraitées à la clôture (réserves + écart net)", vals: [resClotRetr, resG, resN], calc: `réserves à la clôture ${fmt(num(d.fResClot))} (donnée) + écart d'évaluation net ${fmt(c.ecartNet)} = ${fmt(resClotRetr)}. L'écart net = écart brut ${fmt(c.ecart)} − impôt différé ${fmt(c.DTL)} (cf. étape Retraitements). Partage : × ${p} % = ${fmt(resG)} ; × ${fmt(minor)} % = ${fmt(resN)}` },
              { label: "− Coût des titres à la juste valeur (coût − goodwill groupe)", vals: [-coutTitresJV, -coutTitresJV, ""], calc: `coût d'acquisition ${fmt(num(d.prix))} − goodwill du groupe ${fmt(gwGroupe)} = ${fmt(coutTitresJV)} (= quote-part groupe de l'actif net ; le goodwill a déjà été isolé à l'étape Goodwill)` },
              { label: "= Contribution aux réserves consolidées (groupe)", vals: ["", contribG, ""], bold: true, calc: `capital groupe ${fmt(capG)} + réserves groupe ${fmt(resG)} − coût des titres ${fmt(coutTitresJV)} = ${fmt(contribG)}` },
              { label: "Part ne donnant pas le contrôle (NCI)", vals: ["", "", partageNCI], bold: true, calc: `capital NCI ${fmt(capN)} + réserves NCI ${fmt(resN)} = ${fmt(partageNCI)}` },
            ]}
            note={`Cœur de l'épreuve DSCG. Le goodwill (${fmt(gwGroupe)}) ayant déjà été isolé à l'étape précédente, on solde ici le reste des titres (${fmt(coutTitresJV)}). Réserves consolidées finales = réserves mère (${fmt(num(d.mRes))}) + contribution filiale (${fmt(contribG)}) − marge interne (${fmt(c.marge)}). Ici résultat et réserves sont regroupés ; au DSCG le résultat aurait sa propre ligne.`} />
          <Journal n="UE4" title="Partage des capitaux propres — écriture au bilan"
            lines={[
              { compte: "Capital social (filiale)", debit: num(d.fCap) },
              { compte: "Réserves filiale (retraitées)", debit: resClotRetr },
              { compte: "Titres de participation", credit: coutTitresJV },
              { compte: "Réserves consolidées (groupe)", credit: contribG },
              { compte: "Participation ne donnant pas le contrôle", credit: partageNCI },
            ]}
            note="Combinée à l'écriture de goodwill, les titres sont totalement soldés (coût d'acquisition d'origine)." />
        </div>
      );
      case 4: return (
        <div className="space-y-4">
          <UE4Cols title="Élimination de la marge interne sur stock"
            cols={["Vente descendante (mère → filiale)", "Montant"]}
            rows={[
              { label: "Marge interne non réalisée incluse dans le stock", vals: [c.marge], calc: "donnée : marge réalisée par la mère sur le stock encore détenu par la filiale" },
              { label: "Impôt différé", vals: ["—"], calc: "non modélisé dans cet outil (le taux d'impôt n'est pas appliqué à la marge)" },
              { label: "= Net éliminé des réserves/résultat", vals: [c.marge], bold: true, calc: `marge ${fmt(c.marge)} − impôt différé 0 = ${fmt(c.marge)}` },
            ]}
            note="Au DSCG, la marge interne est présentée nette d'impôt différé (cf. tableaux « à l'ouverture / variation / clôture » des annales). Cet outil omet volontairement l'ID sur la marge pour garder le bilan bouclé — c'est une piste d'extension assumée." />
          <Journal n="UE4" title="Élimination de la marge interne — écriture au bilan"
            lines={[{ compte: "Réserves consolidées / Résultat", debit: c.marge }, { compte: "Stocks", credit: c.marge }]}
            note="Le profit interne disparaît tant que le bien n'est pas revendu hors du groupe." />
          <Journal n="UE4" title="Élimination des comptes réciproques — écriture au bilan"
            lines={[{ compte: "Dettes fournisseurs (intragroupe)", debit: c.ic }, { compte: "Créances clients (intragroupe)", credit: c.ic }]}
            note="Au compte de gestion, on élimine aussi les ventes/achats réciproques (montant non saisi dans cet exemple) : Dr Ventes / Cr Achats." />
        </div>
      );
      case 5: return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-3"><RefSwitch /></div>
          {opt.ref === "ifrs" ? (
            <>
              <Note type="info"><strong>IFRS</strong> : le goodwill ({fmt(c.gw)}) <strong>n'est pas amorti</strong> ; il fait l'objet d'un <strong>test de dépréciation annuel</strong> (IAS 36) au niveau de l'UGT, sans reprise possible.</Note>
              <Journal n="UE4" title="Dépréciation du goodwill (seulement si test négatif)"
                lines={[{ compte: "Perte de valeur (résultat)", debit: 0 }, { compte: "Goodwill", credit: 0 }]}
                note="Comptabilisée uniquement si la valeur recouvrable < valeur comptable." />
            </>
          ) : opt.gwTreat === "compense" ? (
            <>
              <Note type="warn"><strong>Swiss GAAP — compensation</strong> : le goodwill est imputé sur les fonds propres, n'apparaît pas à l'actif et n'est pas amorti. L'annexe doit indiquer l'effet théorique d'une activation.</Note>
              <Journal n="UE4" title="Compensation du goodwill avec les fonds propres"
                lines={[{ compte: "Réserves consolidées", debit: c.gw }, { compte: "Goodwill (jamais inscrit à l'actif)", credit: c.gw }]} />
            </>
          ) : (
            <>
              <UE4Cols title={`Amortissement du goodwill (${opt.amort} ans) — année 1`}
                cols={["", "À l'ouverture", "Variation (dotation)", "À la clôture"]}
                rows={[
                  { label: "Goodwill (valeur brute)", vals: [c.gw, "", c.gw], calc: `montant calculé à l'étape Goodwill = ${fmt(c.gw)}` },
                  { label: "Amortissement cumulé", vals: [0, c.amortAnnual, c.amortAnnual], calc: `dotation = goodwill ${fmt(c.gw)} ÷ ${opt.amort} ans = ${fmt(c.amortAnnual)}` },
                  { label: "= Valeur nette comptable", vals: [c.gw, -c.amortAnnual, c.gw - c.amortAnnual], bold: true, calc: `${fmt(c.gw)} − ${fmt(c.amortAnnual)} = ${fmt(c.gw - c.amortAnnual)}` },
                ]}
                note={`Présentation DSCG « à l'ouverture / variation / clôture ». Goodwill ${fmt(c.gw)} ÷ ${opt.amort} ans = ${fmt(c.amortAnnual)} de dotation annuelle.`} />
              <Journal n="UE4" title="Dotation annuelle aux amortissements du goodwill"
                lines={[{ compte: "Charge d'amortissement (résultat)", debit: c.amortAnnual }, { compte: "Goodwill (amort. cumulés)", credit: c.amortAnnual }]} />
            </>
          )}
        </div>
      );
      case 6: return (
        <div className="space-y-4">
          <UE4Cols title="Détermination des réserves consolidées (part du groupe)"
            cols={["", "Montant"]}
            rows={[
              { label: "Réserves de la société mère", vals: [num(d.mRes)], calc: "donnée : réserves propres de la mère" },
              { label: "+ Contribution de la filiale (part groupe)", vals: [contribG], calc: `= ${p} % × résultats post-acquisition ${fmt(c.deltaR)} = ${fmt(contribG)} (résultats post-acq = réserves clôture ${fmt(num(d.fResClot))} − réserves acquisition ${fmt(num(d.fResAcq))})` },
              { label: "− Élimination de la marge interne", vals: [-c.marge], calc: "marge interne éliminée (cf. étape Éliminations)" },
              ...(c.compense ? [{ label: "− Goodwill compensé avec les fonds propres", vals: [-c.gw], calc: `goodwill ${fmt(c.gw)} imputé directement sur les fonds propres` }] : []),
              ...(c.gw < 0 ? [{ label: "+ Produit de badwill logé en réserves", vals: [-c.gw], calc: `goodwill négatif ${fmt(c.gw)} comptabilisé en produit` }] : []),
              { label: "= Réserves consolidées (groupe, résultat inclus)", vals: [c.resConsoFinal], bold: true, calc: `${fmt(num(d.mRes))} + ${fmt(contribG)} − ${fmt(c.marge)}${(c.compense || c.gw < 0) ? ` ${c.gw >= 0 ? "−" : "+"} ${fmt(Math.abs(c.gw))}` : ""} = ${fmt(c.resConsoFinal)}` },
            ]}
            note={`Au DSCG, on conclut par la réconciliation des réserves et du résultat consolidés (et non par un bilan complet). Capital consolidé = capital de la mère seule (${fmt(num(d.mCap))}) ; NCI total = ${fmt(c.nci)} ; goodwill à l'actif = ${fmt(c.gwActif)}.`} />
          <Note type="tip">Bascule sur « Vue guidée » pour voir le <strong>bilan consolidé chiffré complet</strong> qui boucle à {fmt(c.totActif)}.</Note>
        </div>
      );
      default: return null;
    }
  };

  const ue4Notable = () => {
    const p = num(d.pctMere), minor = 100 - p;
    const qpCP = c.pct * (num(d.fCap) + num(d.fResClot) + c.ecartNet);
    switch (step) {
      case 0: return (
        <UE4Cols title="Périmètre de consolidation (Dossier 1 — DSCG)"
          cols={["Société", "% contrôle", "Nature du contrôle", "Méthode", "% d'intérêt", "% NCI"]}
          rows={[{ label: "Entité associée", vals: [`${d.pctMere} %`, "Influence notable", "Mise en équivalence", `${d.pctMere} %`, `${fmt(minor)} %`] }]}
          note="Présentation DSCG type « SAS THYM ». Influence notable présumée dès 20 % (ou présence au conseil) → mise en équivalence." />
      );
      case 1: return (
        <UE4Cols title="Décomposition de la valeur des titres (goodwill inclus)"
          cols={["", "Montant"]}
          rows={[
            { label: "Coût d'acquisition des titres", vals: [c.prix], calc: "donnée : prix payé pour la participation" },
            { label: `− Quote-part d'actif net acquise (${p} %)`, vals: [-c.qpGroupe], calc: `actif net à l'acquisition ${fmt(c.X)} × ${p} % = ${fmt(c.qpGroupe)} (actif net = capital ${fmt(num(d.fCap))} + réserves acq. ${fmt(num(d.fResAcq))} + écart net ${fmt(c.ecartNet)})` },
            { label: "= Goodwill inclus dans la valeur des titres", vals: [c.gwEmbeddedME], bold: true, calc: `${fmt(c.prix)} − ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
          ]}
          note="En mise en équivalence, le goodwill n'est jamais isolé au bilan : il reste fondu dans la valeur comptable des titres (non amorti en IFRS)." />
      );
      case 2: return (
        <div className="space-y-4">
          <UE4Cols title="Valeur d'équivalence à la clôture"
            cols={["", "Montant"]}
            rows={[
              { label: `Quote-part des capitaux propres retraités à la clôture (${p} %)`, vals: [qpCP], calc: `${p} % × (capital ${fmt(num(d.fCap))} + réserves clôture ${fmt(num(d.fResClot))} + écart net ${fmt(c.ecartNet)}) = ${p} % × ${fmt(num(d.fCap) + num(d.fResClot) + c.ecartNet)} = ${fmt(qpCP)}` },
              { label: "+ Goodwill inclus dans les titres", vals: [c.gwEmbeddedME], calc: `cf. tableau précédent : coût ${fmt(c.prix)} − quote-part d'actif net à l'acquisition ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
              { label: "= Valeur comptable des titres mis en équivalence", vals: [c.valME], bold: true, calc: `${fmt(qpCP)} + ${fmt(c.gwEmbeddedME)} = ${fmt(c.valME)}` },
            ]}
            note="Méthode DSCG (cf. SAS THYM) : valeur d'équivalence = quote-part des capitaux propres à la clôture, goodwill compris." />
          <UE4Cols title="Vérification par l'évolution depuis l'acquisition"
            cols={["", "Montant"]}
            rows={[
              { label: "Valeur initiale (coût d'acquisition)", vals: [c.prix], calc: "donnée : prix payé" },
              { label: `+ Quote-part de résultat post-acquisition (${p} % × ${fmt(c.deltaR)})`, vals: [c.pct * c.deltaR], calc: `résultats post-acq = réserves clôture ${fmt(num(d.fResClot))} − réserves acq. ${fmt(num(d.fResAcq))} = ${fmt(c.deltaR)} ; × ${p} % = ${fmt(c.pct * c.deltaR)}` },
              { label: "= Valeur d'équivalence", vals: [c.valME], bold: true, calc: `${fmt(c.prix)} + ${fmt(c.pct * c.deltaR)} = ${fmt(c.valME)} (identique au tableau ci-dessus)` },
            ]} />
          <Journal n="UE4" title="Mise en équivalence — écriture au bilan"
            lines={[{ compte: "Titres mis en équivalence", debit: c.valME }, { compte: "Titres de participation", credit: c.prix }, { compte: "Réserves consolidées (groupe)", credit: c.pct * c.deltaR }]}
            note="On remplace les titres au coût par leur valeur d'équivalence ; la quote-part de résultat accumulée alimente les réserves consolidées." />
        </div>
      );
      case 3: return (
        <div className="space-y-4">
          <UE4Cols title="Détermination des réserves consolidées (part du groupe)"
            cols={["", "Montant"]}
            rows={[
              { label: "Réserves de la société mère", vals: [num(d.mRes)], calc: "donnée : réserves propres de la mère" },
              { label: `+ Quote-part de résultat de l'associée (${p} % × ${fmt(c.deltaR)})`, vals: [c.pct * c.deltaR], calc: `${p} % × résultats post-acquisition ${fmt(c.deltaR)} = ${fmt(c.pct * c.deltaR)}` },
              { label: "= Réserves consolidées (groupe)", vals: [num(d.mRes) + c.pct * c.deltaR], bold: true, calc: `${fmt(num(d.mRes))} + ${fmt(c.pct * c.deltaR)} = ${fmt(num(d.mRes) + c.pct * c.deltaR)}` },
            ]} />
          <UE4Cols title="Présentation dans les comptes consolidés"
            cols={["Poste", "Montant"]}
            rows={[
              { label: "Bilan — Participations mises en équivalence", vals: [c.valME], calc: `= valeur d'équivalence calculée ci-dessus = ${fmt(c.valME)}` },
              { label: "Compte de résultat — Quote-part de résultat des entreprises associées", vals: [c.pct * c.deltaR], calc: `${p} % × ${fmt(c.deltaR)} = ${fmt(c.pct * c.deltaR)}` },
            ]}
            note="La MEE ne fait apparaître aucun actif/passif de l'associée : une seule ligne au bilan, une seule ligne au compte de résultat." />
        </div>
      );
      default: return null;
    }
  };

  const ue4Conjoint = () => {
    const p = num(d.pctMere), minor = 100 - p;
    const qpCP = c.pct * (num(d.fCap) + num(d.fResClot) + c.ecartNet);
    switch (step) {
      case 0: return (
        <UE4Cols title="Périmètre de consolidation (Dossier 1 — DSCG)"
          cols={["Société", "% contrôle", "Nature du contrôle", "Méthode (DSCG / IFRS)", "% d'intérêt", "% NCI"]}
          rows={[{ label: "Coentreprise", vals: [`${d.pctMere} %`, "Contrôle conjoint", "Mise en équivalence", `${d.pctMere} %`, "0 %"] }]}
          note="Au DSCG (référentiel IFRS/PCG), une coentreprise (droits sur l'actif net) est mise en équivalence — cf. SA CREX (2022), FIGUIER (2023). L'intégration proportionnelle n'existe pas en IFRS." />
      );
      case 1: return (
        <div className="space-y-4">
          <Note type="tip">Angle DSCG : la coentreprise est traitée par <strong>mise en équivalence</strong>. L'intégration proportionnelle ci-dessous est <strong>spécifique à Swiss GAAP</strong> et n'est pas au programme du DSCG.</Note>
          <UE4Cols title="Décomposition de la valeur des titres (mise en équivalence — IFRS/DSCG)"
            cols={["", "Montant"]}
            rows={[
              { label: "Coût d'acquisition des titres", vals: [c.prix], calc: "donnée : prix payé pour la quote-part" },
              { label: `− Quote-part d'actif net acquise (${p} %)`, vals: [-c.qpGroupe], calc: `actif net à l'acquisition ${fmt(c.X)} × ${p} % = ${fmt(c.qpGroupe)}` },
              { label: "= Goodwill inclus dans les titres", vals: [c.gwEmbeddedME], bold: true, calc: `${fmt(c.prix)} − ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
            ]} />
        </div>
      );
      case 2: return (
        <div className="space-y-4">
          <UE4Cols title="Valeur d'équivalence (angle DSCG / IFRS)"
            cols={["", "Montant"]}
            rows={[
              { label: `Quote-part des capitaux propres retraités (${p} %)`, vals: [qpCP], calc: `${p} % × (capital ${fmt(num(d.fCap))} + réserves clôture ${fmt(num(d.fResClot))} + écart net ${fmt(c.ecartNet)}) = ${fmt(qpCP)}` },
              { label: "+ Goodwill inclus", vals: [c.gwEmbeddedME], calc: `coût ${fmt(c.prix)} − quote-part d'actif net à l'acquisition ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
              { label: "= Valeur d'équivalence à la clôture", vals: [c.valME], bold: true, calc: `${fmt(qpCP)} + ${fmt(c.gwEmbeddedME)} = ${fmt(c.valME)}` },
            ]}
            note="Ce que retiendrait une copie DSCG : la coentreprise est mise en équivalence, exactement comme une entité associée." />
          <UE4Cols title="Intégration proportionnelle (angle Swiss GAAP — hors DSCG)"
            cols={["", "100 %", `Quote-part (${p} %)`]}
            rows={[
              { label: "Actifs", vals: [num(d.fActifs), c.pct * num(d.fActifs)], calc: `${fmt(num(d.fActifs))} × ${p} % = ${fmt(c.pct * num(d.fActifs))}` },
              { label: "Écart d'évaluation", vals: [c.ecart, c.pct * c.ecart], calc: `${fmt(c.ecart)} × ${p} % = ${fmt(c.pct * c.ecart)}` },
              { label: "Dettes", vals: [num(d.fDettes), c.pct * num(d.fDettes)], calc: `${fmt(num(d.fDettes))} × ${p} % = ${fmt(c.pct * num(d.fDettes))}` },
              { label: "Goodwill", vals: ["—", c.gwEmbeddedME], calc: `coût ${fmt(c.prix)} − quote-part d'actif net ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
            ]}
            note="Reprise de la seule quote-part de chaque poste, sans intérêts minoritaires. Autorisée en Swiss GAAP RPC 30, interdite en IFRS." />
        </div>
      );
      default: return null;
    }
  };

  const ue4View = () => path === "exclusif" ? ue4Exclusif() : path === "notable" ? ue4Notable() : ue4Conjoint();

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      <header className="bg-gradient-to-r from-slate-900 to-indigo-900 text-white">
        <div className="max-w-5xl mx-auto px-4 py-5 flex items-center gap-3">
          <Layers size={26} className="text-indigo-300" />
          <div className="flex-1"><h1 className="text-lg font-bold">La consolidation, de A à Z</h1><p className="text-xs text-indigo-200">Théorie · calculs · écritures · multi-sociétés · IFRS & Swiss GAAP RPC 30</p></div>
        </div>
      </header>

      <nav className="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div className="max-w-5xl mx-auto px-2 flex gap-1 overflow-x-auto">
          {sections.map((sct) => (
            <button key={sct.id} onClick={() => setSection(sct.id)}
              className={`flex items-center gap-2 px-3 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition-colors ${section === sct.id ? "border-indigo-600 text-indigo-700" : "border-transparent text-slate-500 hover:text-slate-800"}`}>
              {sct.icon}{sct.label}
            </button>
          ))}
        </div>
      </nav>

      {section === "wizard" && path && (
        <div className="bg-white border-b border-slate-200">
          <div className="max-w-5xl mx-auto px-4 py-3 flex items-center gap-2 overflow-x-auto">
            <button onClick={() => { setPath(null); setStep(0); }} className="text-xs text-slate-500 hover:text-indigo-600 shrink-0 mr-1">← Changer</button>
            {STEPS[path].map((s, i) => (
              <button key={i} onClick={() => setStep(i)} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${i === step ? "bg-indigo-600 text-white" : i < step ? "bg-indigo-50 text-indigo-600" : "bg-slate-100 text-slate-400"}`}>
                <span className={`w-4 h-4 rounded-full flex items-center justify-center text-xs ${i === step ? "bg-white text-indigo-600" : ""}`}>{i + 1}</span>{s}
              </button>
            ))}
          </div>
        </div>
      )}

      <main className="max-w-5xl mx-auto px-4 py-6">
        {section === "overview" && <Overview goWizard={(p) => { setSection("wizard"); if (p) { setPath(p); setStep(0); } }} />}
        {section === "cours" && <CoursTab />}
        {section === "chain" && <ChainTab />}
        {section === "multi" && <MultiTab />}
        {section === "perimetrebuilder" && <PerimetreBuilder />}
        {section === "glossary" && <Glossary />}
        {section === "compare" && <Comparison />}
        {section === "process" && <Process8 />}
        {section === "goodwill" && <GoodwillQuick />}
        {section === "resultat" && <ResultatTab />}
        {section === "feuille" && <FeuilleTab d={d} c={c} />}
        {section === "conversion" && <ConversionTab />}
        {section === "perimetre" && <PerimetreTab />}
        {section === "impairment" && <ImpairmentTab />}
        {section === "casparticuliers" && <CasParticuliersTab />}
        {section === "quiz" && <QuizTab />}
        {section === "wizard" && (!path ? <Chooser onPick={(p) => { setPath(p); setStep(0); }} /> : (
          <>
            <div className="flex items-center gap-2 mb-4">
              <div className="flex rounded-lg border border-slate-300 overflow-hidden text-sm">
                <button onClick={() => setUe4(false)} className={`flex items-center gap-1.5 px-3 py-1.5 ${!ue4 ? "bg-indigo-600 text-white" : "bg-white text-slate-600 hover:text-slate-800"}`}><Compass size={14} /> Vue guidée</button>
                <button onClick={() => setUe4(true)} className={`flex items-center gap-1.5 px-3 py-1.5 ${ue4 ? "bg-slate-800 text-white" : "bg-white text-slate-600 hover:text-slate-800"}`}><GraduationCap size={14} /> Vu UE4</button>
              </div>
              <span className="text-xs text-slate-400">{ue4 ? "Présentation type épreuve DSCG (tableaux & écritures)" : "Schémas, barres et explications pas à pas"}</span>
            </div>
            {ue4 ? ue4View() : (
              <div className="space-y-5">
                {STEP_NOTES[path] && STEP_NOTES[path][step] && <WhyCard why={STEP_NOTES[path][step].why} impact={STEP_NOTES[path][step].impact} />}
                {path === "exclusif" ? exclusif() : path === "notable" ? notable() : conjoint()}
                {STEP_NOTES[path] && STEP_NOTES[path][step] && <RefDiff rows={STEP_NOTES[path][step].diff} />}
              </div>
            )}
            <div className="flex items-center justify-between mt-6">
              <button disabled={step === 0} onClick={() => setStep(step - 1)} className={`flex items-center gap-2 text-sm px-4 py-2 rounded-lg ${step === 0 ? "text-slate-300" : "text-slate-600 hover:bg-white border border-slate-200"}`}><ArrowLeft size={16} /> Précédent</button>
              <button onClick={() => setD(PRESET)} className="flex items-center gap-1.5 text-xs text-slate-400 hover:text-indigo-600"><RotateCcw size={13} /> Réinitialiser</button>
              {step < last ? (
                <button onClick={() => setStep(step + 1)} className="flex items-center gap-2 text-sm px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Suivant <ArrowRight size={16} /></button>
              ) : (
                <span className="flex items-center gap-2 text-sm px-4 py-2 rounded-lg bg-emerald-100 text-emerald-700 font-medium"><CheckCircle2 size={16} /> Terminé</span>
              )}
            </div>
          </>
        ))}
      </main>

      <footer className="max-w-5xl mx-auto px-4 py-6 text-center text-xs text-slate-400">Outil pédagogique — vérifie toujours seuils et options avec la version en vigueur des normes IFRS / Swiss GAAP RPC.</footer>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
