ux propres", "Illimitée tant que l'information est nouvelle"], "answer": 1, "explain": "La **période d'évaluation** est plafonnée à **12 mois**. Les corrections de valeurs provisoires sont **rétrospectives** (contrepartie du goodwill), **sans** passer par le résultat courant. Au-delà ⇒ **IAS 8**."}]}]}]}, {"code": "IFRS 10", "title": "États financiers consolidés", "icon": "🏛️", "color": "indigo", "tagline": "Le **modèle UNIQUE du contrôle** à 3 éléments (pouvoir + rendements variables + lien) : il décide **qui consolide quoi**, puis impose l'**intégration globale** (100 %, NCI séparée).", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "**IFRS 10** pose **un seul critère** pour déclencher la **consolidation par intégration globale** : le **CONTRÔLE**. C'est la norme **moteur** des comptes de groupe — elle répond à la question *« QUI doit consolider QUOI ? »* et présente le groupe (mère + filiales) comme **une entité économique unique**.\n\nLe contrôle, c'est **trois éléments CUMULATIFS** (IFRS 10.7) : (a) le **pouvoir** sur les **activités pertinentes**, (b) une **exposition à des rendements variables**, (c) la **capacité d'utiliser ce pouvoir pour influer sur ces rendements** (le *lien*). Il **suffit qu'un seul manque** pour qu'il n'y ait **pas** de contrôle.\n\nDeux marqueurs à graver : le pouvoir vient **souvent** de la majorité des voix, mais peut naître d'un **contrôle de fait**, de **droits de vote potentiels** ou de **contrats** ; et un décideur **agent** (ex. gérant de fonds) a le pouvoir **sans** contrôler. Une fois le contrôle établi, on intègre **100 %** et on isole la part des minoritaires en **NCI**, présentée en capitaux propres."}, {"type": "keypoints", "title": "À retenir", "accent": "indigo", "items": ["**Modèle unique du contrôle** (IFRS 10.7) : pouvoir **+** rendements variables **+** lien — **cumulatifs**.", "**Pouvoir** = droits **existants** donnant la capacité **actuelle** de diriger les **activités pertinentes** (IFRS 10.10) — pas besoin de l'avoir exercé.", "**Principal vs agent** : un décideur qui agit **pour autrui** a le pouvoir mais **ne contrôle pas**.", "**Intégration globale** : **100 %** des actifs/passifs/produits/charges, **NCI** en capitaux propres distincte (IFRS 10.22).", "Résultat & OCI **attribués à la mère ET aux NCI** — **même si la NCI devient déficitaire** (IFRS 10.B94).", "Exception **« entité d'investissement »** : pas de consolidation → **JV par résultat (IFRS 9)** (IFRS 10.27-31).", "IFRS 10 **déclenche** ; le **goodwill / la PPA** relèvent d'**IFRS 3**."]}, {"type": "callout", "tone": "info", "title": "IFRS 10 dans la famille « comptes de groupe »", "text": "- **IFRS 10** = le **moteur** : il dit *quand* il y a **contrôle** (intégration globale).\n- **IFRS 3** : *comment* comptabiliser l'opération **à l'acquisition** (PPA, goodwill, NCI initiale).\n- **IFRS 11 / IAS 28** : contrôle **conjoint** / **influence notable** → MEE.\n- **IFRS 9** : ni contrôle ni influence → juste valeur.\n- **IFRS 12** : informations à fournir ; **IAS 27 (2011)** : comptes **individuels** de la mère.\n\nIFRS 10 forme avec IFRS 11, IFRS 12, IAS 27 (2011) et IAS 28 (2011) le **« paquet consolidation »** de mai 2011 (applicable 1ᵉʳ janvier 2013). Elle a **remplacé** la partie conso de l'ancienne IAS 27 **et** l'interprétation **SIC-12** (entités ad hoc)."}]}, {"title": "📐 Définitions clés", "blocks": [{"type": "intro", "text": "**Contrôle d'une entité émettrice** (*control of an investee*, IFRS 10.6-7) — un investisseur contrôle **si et seulement si** il réunit **les trois éléments à la fois** : (1) le **POUVOIR** ; (2) une **exposition / des droits à des RENDEMENTS VARIABLES** ; (3) la **CAPACITÉ d'utiliser le pouvoir pour influer sur ces rendements** (le *lien*). Le 3ᵉ élément distingue un **principal** (contrôle) d'un **agent** (pas de contrôle)."}, {"type": "table", "title": "Le vocabulaire à manier", "headers": ["Terme", "Définition opérationnelle"], "rows": [["**Pouvoir** (*power*, 10.10)", "Droits **existants** donnant la **capacité actuelle** de diriger les **activités pertinentes**. Résulte de **droits** (pas d'une intention), **substantiel**, **non purement protecteur**. Inutile de l'avoir **exercé**."], ["**Activités pertinentes** (10.B11-B13)", "Activités qui **affectent le plus les rendements** : politique opérationnelle/financière, ventes/achats, gestion des actifs, R&D, financement, nomination/rémunération des dirigeants clés. Ce sont **elles** qu'il faut diriger."], ["**Droits substantiels** (B22-B25)", "Exerçables **en pratique**, au moment des décisions (pas de barrière). → **comptent** pour le pouvoir."], ["**Droits protecteurs** (B26-B28)", "Protègent l'intérêt du titulaire **sans** donner le pouvoir (veto d'un prêteur, approbation de dépenses **exceptionnelles**). → **ne confèrent pas** le contrôle."], ["**Droits de vote potentiels** (B47-B50)", "Options / convertibles : pris en compte **s'ils sont substantiels** (« dans la monnaie », exerçables **maintenant**). Peuvent conférer le pouvoir **avec < 50 %**."], ["**Contrôle de fait** (*de facto*, B41-B46)", "Pouvoir avec **< 50 %** des voix, suffisant en pratique vu la **dispersion** des autres actionnaires (ex. 45 % face à un flottant atomisé)."], ["**Rendements variables** (10.15-16)", "Rendements qui **varient** : positifs, négatifs ou les deux (dividendes, JV, intérêts, honoraires, synergies). La **substance** prime."], ["**Filiale / Groupe**", "**Filiale** = entité **contrôlée** par la mère. **Groupe** = mère + filiales. **États consolidés** = ceux du groupe comme **entité économique unique**."], ["**NCI** (10.22)", "*Non-controlling interest* (ex-minoritaires) : capitaux propres de la filiale **non** attribuables à la mère. **Présentée en capitaux propres, distinctement.**"], ["**Entité structurée**", "Entité où les **droits de vote ne sont pas** le facteur déterminant (pilotée par **contrats**) : titrisation, financement d'actifs. Contrôle apprécié via les **droits contractuels**."], ["**Entité d'investissement** (10.27-28)", "Lève des fonds pour fournir des **services de gestion**, investit **pour des rendements** (plus-value / revenus), mesure la performance à la **JV**. → ne consolide pas, **JV par résultat**."]]}, {"type": "callout", "tone": "warn", "title": "Trois conditions CUMULATIVES — pas « > 50 % »", "text": "L'erreur n°1 : réduire le contrôle à la majorité des voix. Le contrôle exige **les trois** éléments. À l'inverse, une **majorité des voix SANS pouvoir effectif** sur les activités pertinentes (ex. activités dirigées par contrat au profit d'un tiers) **ne** donne **pas** le contrôle. Le **3ᵉ élément** (lien pouvoir↔rendements) est le **juge de paix** : il sépare le **principal** de l'**agent**."}]}, {"title": "⚖️ Le test du contrôle (3 éléments)", "blocks": [{"type": "intro", "text": "Le cœur d'IFRS 10 n'est pas une règle d'évaluation monétaire, mais un **test d'inclusion dans le périmètre** : *y a-t-il contrôle ?* Si **oui** → **intégration globale** (NCI séparée) ; si **non** → **IFRS 11 / IAS 28 / IFRS 9** selon le degré d'influence. On déroule **toujours** ce test dans l'ordre."}, {"type": "steps", "title": "Dérouler le test du contrôle, pas à pas", "accent": "indigo", "steps": [{"t": "① Identifier les ACTIVITÉS PERTINENTES (10.B5-B13)", "d": "Quelles activités affectent **le plus** les rendements ? **Qui** les décide, et **comment** (vote en AG ? organe de direction ? contrats ?). Étape qui **conditionne tout** : on ne cherche le pouvoir que **sur ces activités**. Mal la cadrer fausse tout le test."}, {"t": "② Élément (a) — apprécier le POUVOIR", "d": "Sources, par fréquence : **majorité des voix substantielles** (B35, cas standard) ; **contrôle de fait** (< 50 % + actionnariat dispersé, B41-B46) ; **droits de vote potentiels** substantiels (B47-B50) ; **accords contractuels** (typique des entités structurées, B38-B40) ; ou une **combinaison**. ⚠️ On **écarte** les droits **protecteurs**."}, {"t": "③ Élément (b) — RENDEMENTS VARIABLES (10.15-16)", "d": "L'investisseur est-il exposé à des rendements qui **varient** (dividendes, JV, intérêts, honoraires, synergies…) ? Le **signe** importe peu (gain **ou** perte). Quasi toujours rempli dès qu'il y a une participation économique réelle — **rarement** le point bloquant."}, {"t": "④ Élément (c) — LIEN pouvoir↔rendements : principal ou agent ? (10.17-18 / B58-B72)", "d": "L'investisseur peut-il **utiliser son pouvoir pour influer sur SES rendements** ? Un décideur qui agit en **agent** (pour autrui) a le pouvoir mais **ne contrôle pas**. On pèse : **droits de révocation** (*kick-out rights*) d'un tiers, **rémunération** (de marché ? proportionnée ?), **autres intérêts** détenus (exposition), **étendue** du pouvoir discrétionnaire."}, {"t": "⑤ Conclure — et réévaluer en continu (10.8 / B80-B85)", "d": "**(a) ET (b) ET (c)** → **CONTRÔLE** → intégration globale. Une seule absence → pas de contrôle. Le contrôle se **réévalue à chaque fois** qu'un fait change un des trois éléments (expiration d'options, modification d'un pacte, concentration/dispersion de l'actionnariat) : il se **gagne** et se **perd** dans le temps."}]}, {"type": "callout", "tone": "key", "title": "L'équation du contrôle", "text": "**CONTRÔLE = Pouvoir (sur activités pertinentes) ✕ Rendements variables ✕ Lien (capacité d'utiliser le pouvoir pour influer sur les rendements).**\n\nC'est un **ET logique** : si **un** facteur est nul, le produit est nul → **pas de contrôle**, donc **pas d'intégration globale**."}, {"type": "callout", "tone": "warn", "title": "Contrôle de FAIT (de facto) — < 50 % peut suffire", "text": "Ne pas consolider une entité détenue à **45 %** face à un flottant **atomisé** (milliers d'actionnaires < 1 % chacun, absentéisme aux AG, historique de votes favorables) est une faute fréquente. Si les droits de vote, bien qu'**< 50 % en valeur absolue**, suffisent **en pratique** à diriger unilatéralement les activités pertinentes → **contrôle de fait** → **consolidation** (IFRS 10.B41-B46)."}, {"type": "callout", "tone": "warn", "title": "Principal vs AGENT — pouvoir n'est pas contrôle", "text": "Un *fund manager* / *asset manager* peut détenir le **pouvoir de décision** sans **contrôler** s'il agit en **agent** : rémunération **de marché** et proportionnée, **kick-out rights** détenus par un seul tiers exerçables sans motif, **faible exposition** aux rendements via d'autres intérêts. Consolider un fonds géré « pour le compte d'autrui » est une erreur classique. Seul un **principal** (qui exerce le pouvoir pour son **propre** compte) consolide (IFRS 10.17-18 / B58-B72)."}, {"type": "diagram", "kind": "flow", "title": "Le test du contrôle — 3 éléments cumulatifs (IFRS 10.7)", "steps": [{"label": "① Pouvoir", "sub": "Droits existants de diriger les activités pertinentes (10.10) — substantiels, non protecteurs"}, {"label": "② Rendements variables", "sub": "Exposition à des rendements qui varient : + ou − (10.15-16)"}, {"label": "③ Lien", "sub": "Capacité d'utiliser le pouvoir pour influer sur ces rendements → principal, pas agent (10.17-18)"}, {"label": "= CONTRÔLE", "sub": "(a) ET (b) ET (c) → intégration globale. Un seul manque → pas de contrôle"}], "accent": "indigo", "caption": "Un ET logique : si un seul élément est nul, pas de contrôle, donc pas d'intégration globale."}, {"type": "diagram", "kind": "spectrum", "title": "Le seuil du contrôle — au-delà du simple « > 50 % »", "bands": [{"from": 0, "to": 20, "color": "slate", "short": "Aucune", "label": "**< 20 %** — en principe pas d'influence notable (IFRS 9, juste valeur)"}, {"from": 20, "to": 50, "color": "emerald", "short": "MEE", "label": "**20–50 %** — influence notable présumée → mise en équivalence (IAS 28)"}, {"from": 50, "to": 100, "color": "indigo", "short": "Contrôle", "label": "**> 50 %** — majorité des voix → contrôle présumé → intégration globale"}], "caption": "Repère utile mais trompeur : le contrôle de FAIT permet de consolider avec < 50 % (ex. 45 % face à un flottant atomisé, IFRS 10.B41-B46), et une majorité SANS pouvoir effectif ne donne pas le contrôle. Le test des 3 éléments prime toujours sur le seuil."}]}, {"title": "🧮 Procédures de consolidation & écritures", "blocks": [{"type": "intro", "text": "Une fois le contrôle établi, IFRS 10 (Annexe B, B86-B93) impose l'**intégration globale** : la mère **agrège ligne à ligne 100 %** des actifs, passifs, capitaux propres, produits, charges et flux de la filiale — **même si elle détient moins de 100 %** — puis isole la part des minoritaires via la **NCI**."}, {"type": "steps", "title": "Les 6 étapes de l'intégration globale", "accent": "indigo", "steps": [{"t": "A · Uniformisation préalable (10.19 / B87)", "d": "**Méthodes comptables uniformes** dans tout le groupe (retraiter la filiale) ; **même date de clôture** — si elle diffère, écart **≤ 3 mois** avec ajustement des transactions significatives de l'intervalle (sinon : états intermédiaires)."}, {"t": "B · Agrégation + élimination de la participation (B86)", "d": "On additionne les postes, puis on **élimine la valeur comptable de la participation de la mère contre sa quote-part dans les capitaux propres de la filiale** ; le résiduel est le **goodwill** (mécanique IFRS 3 à la date d'acquisition)."}, {"t": "C · Élimination des SOLDES & TRANSACTIONS intragroupes (B86(c))", "d": "« Comme si » le groupe était une seule entité, on élimine **intégralement** : créances/dettes réciproques, ventes/achats intragroupes, dividendes intragroupes, et **résultats internes non réalisés** dans les actifs restant **dans le groupe** (stocks, immobilisations)."}, {"t": "D · Attribution du RÉSULTAT et de l'OCI à la NCI (10.22-24 / B94-B95)", "d": "Le **résultat net** et **chaque composante d'OCI** sont attribués à la **mère ET aux NCI** selon les **% de participation actuels** — **même si cela rend la NCI négative (déficitaire)**."}, {"t": "E · Variation de % SANS perte de contrôle (10.23 / B96)", "d": "Rachat de NCI / cession partielle **conservant le contrôle** = **transaction de capitaux propres** : **aucun goodwill** nouveau, **aucun P&L** ; l'écart va **directement en capitaux propres** (part du groupe)."}, {"t": "F · PERTE de contrôle (10.25 / B97-B99)", "d": "Décomptabiliser actifs/passifs/**goodwill** et **NCI** ; comptabiliser la **JV de la contrepartie reçue** ; **réévaluer la part conservée à la JV** (nouveau coût IFRS 9 / IAS 28) ; recycler/transférer l'OCI ; **écart résiduel en résultat** (gain/perte de cession)."}]}, {"type": "journal", "title": "Écriture — élimination de la participation (à l'acquisition)", "note": "Étape B : on élimine la valeur comptable de la participation de la mère contre sa quote-part de capitaux propres de la filiale ; le résiduel est le goodwill (option NCI = quote-part de l'actif net, goodwill partiel). Chiffres de l'exemple : participation 1 000, actif net JV 900, NCI 20 % × 900 = 180, goodwill 280.", "lines": [{"compte": "Actifs nets identifiables de F (à la JV)", "debit": 900}, {"compte": "Goodwill (résiduel, IFRS 3)", "debit": 280}, {"compte": "Participation dans F (chez la mère)", "credit": 1000}, {"compte": "NCI (20 % × 900)", "credit": 180}]}, {"type": "journal", "title": "Écriture — élimination du chiffre d'affaires intragroupe", "note": "Étape C : on neutralise produits ET charges réciproques (ici ventes de F à M = 300). Aucun effet sur le résultat (autant en moins des deux côtés), mais le CA consolidé est ramené à la réalité externe.", "lines": [{"compte": "Produits (CA intragroupe)", "debit": 300}, {"compte": "Coût des ventes (achats de M auprès de F)", "credit": 300}]}, {"type": "journal", "title": "Écriture — élimination du PROFIT INTERNE sur stocks", "note": "Étape C : la marge incluse dans les stocks encore détenus dans le groupe n'est pas réalisée vis-à-vis de l'extérieur. On ramène les stocks au coût pour le groupe (profit interne = 30). Vente upstream → l'effet sera réparti mère/NCI au prorata.", "lines": [{"compte": "Coût des ventes (profit interne)", "debit": 30}, {"compte": "Stocks (ramenés au coût groupe)", "credit": 30}]}, {"type": "journal", "title": "Écriture — attribution du résultat aux NCI", "note": "Étape D : la quote-part minoritaire du résultat de la filiale (ajusté du profit interne upstream) est portée en NCI. Ici 20 % × (250 − 30) = 44.", "lines": [{"compte": "Résultat attribuable aux NCI (état du résultat global)", "debit": 44}, {"compte": "NCI (capitaux propres)", "credit": 44}]}, {"type": "callout", "tone": "warn", "title": "100 % du résultat interne — pas la quote-part (réflexe MEE)", "text": "En **intégration globale**, on élimine **100 %** du résultat interne non réalisé (contrairement à la **MEE / IAS 28**, où l'on élimine à hauteur de la **quote-part**). En vente **ascendante** (*upstream*, filiale→mère) avec NCI, seule la **RÉPARTITION** de l'effet (les 30) entre mère et NCI suit le **pourcentage** (80 % / 20 %)."}, {"type": "callout", "tone": "warn", "title": "NCI DÉFICITAIRE — on attribue quand même", "text": "Le résultat global est attribué à la mère **ET** aux NCI **même si le solde de la NCI devient négatif** (IFRS 10.B94). On ne « plafonne » **plus** la NCI à zéro — **changement vs l'ancien IAS 27**. Attribuer le résultat aux NCI « seulement si positif » est une faute."}, {"type": "diagram", "kind": "flow", "title": "Les 6 étapes de l'intégration globale (IFRS 10.B86-B96)", "steps": [{"label": "A · Uniformiser", "sub": "Méthodes comptables uniformes + même date de clôture (écart ≤ 3 mois)"}, {"label": "B · Agréger & éliminer la participation", "sub": "Participation de la mère ↔ quote-part de CP de la filiale ; résiduel = goodwill (IFRS 3)"}, {"label": "C · Éliminer l'intragroupe", "sub": "Soldes, transactions et résultats internes non réalisés — à 100 %"}, {"label": "D · Attribuer à la NCI", "sub": "Résultat & OCI partagés mère / NCI — même si la NCI devient déficitaire (B94)"}, {"label": "E · Variation SANS perte de contrôle", "sub": "Transaction de capitaux propres : aucun goodwill, aucun P&L (10.23)"}, {"label": "F · Perte de contrôle", "sub": "Décomptabiliser + JV de la part conservée + résultat de cession en P&L (10.25)"}], "accent": "indigo", "caption": "Du retraitement préalable à la sortie du périmètre : la suite de vie d'une filiale consolidée."}]}, {"title": "🔢 Exemple chiffré — intégration globale avec NCI", "blocks": [{"type": "example", "title": "M acquiert 80 % de F — élimination intragroupe + profit interne", "statement": "Le **01.01.N**, **M** acquiert **80 %** de **F** pour **1 000** (trésorerie). À la date d'acquisition, la **JV des actifs nets identifiables de F = 900** ; M retient l'option **NCI = quote-part de l'actif net** (goodwill **partiel**). Données de l'exercice N (CHF k) :\n\n- **CA** : M = 5 000 ; F = 2 000 — dont **ventes de F à M (intragroupe) = 300**.\n- **Résultat net N** : M = 800 ; F = 250.\n- **Actifs nets (CP)** : M = 4 000 ; F = 1 150.\n\nEn N, F a vendu à M des marchandises pour **300**, marge **60** ; à la clôture, **la moitié** est encore en stock chez M → **profit interne non réalisé = 60 × ½ = 30** (vente **upstream**).\n\n**Questions** : (1) goodwill à l'acquisition ; (2) CA consolidé ; (3) résultat net consolidé et sa **répartition** mère/NCI ; (4) **NCI au bilan** au 31.12.N.", "solution": "**1) Goodwill (IFRS 3, rappel)**\nContrepartie 1 000 + NCI (20 % × 900 = **180**) − actif net identifiable 900 = **Goodwill = 280** (partiel : part du groupe seulement).\n*Écriture* : Dr Actifs nets identifiables 900 · Dr Goodwill 280 · Cr Participation 1 000 · Cr NCI 180.\n\n---\n\n**2) CA consolidé**\n5 000 + 2 000 − **300** (intragroupe) = **6 700**.\n*Écriture* : Dr Produits 300 · Cr Coût des ventes 300.\n\n---\n\n**3) Résultat net consolidé & répartition**\n| Élément | Montant |\n|---|---|\n| Résultat M | 800 |\n| Résultat F | 250 |\n| − Élimination profit interne (upstream) | (30) |\n| **= Résultat net consolidé** | **1 020** |\n\nLe profit interne grève un résultat **de F** → **résultat de F ajusté = 250 − 30 = 220**.\n- **Part NCI** = 20 % × 220 = **44**.\n- **Part du groupe (M)** = 800 + 80 % × 220 = 800 + 176 = **976**.\n- **Vérification** : 976 + 44 = **1 020** ✅.\n*Écriture* : Dr Résultat attribuable aux NCI 44 · Cr NCI 44.\n\n---\n\n**4) NCI au bilan au 31.12.N**\n| Mouvement | Montant |\n|---|---|\n| NCI à l'acquisition (20 % × 900) | 180 |\n| + QP de résultat N (20 % × 220) | +44 |\n| **= NCI au 31.12.N** | **224** |\n*(Aucun dividende versé par F en N ; un dividende aux minoritaires réduirait d'autant la NCI.)*\n\n---\n\n**Impact états financiers consolidés** :\n- **Résultat** : CA = **6 700** ; résultat net = **1 020**, réparti en **« propriétaires de la mère » 976** et **« NCI » 44** (IFRS 10.22).\n- **Bilan** : 100 % des actifs/passifs de F intégrés + **goodwill 280** ; **stocks − 30** (profit interne éliminé) ; la **participation (1 000) disparaît** ; **NCI = 224** présentée **séparément**.\n\n💡 **Variante « goodwill complet »** : si M avait retenu l'option NCI **à la JV** (ex. NCI = 230), goodwill = 1 000 + 230 − 900 = **330** et NCI initiale = **230** (écart **50** = goodwill des minoritaires) — l'attribution du résultat N (**44**) resterait **identique**."}, {"type": "table", "title": "Synthèse chiffrée", "headers": ["Indicateur", "Calcul", "Résultat"], "rows": [["Goodwill (partiel)", "1 000 + 180 − 900", "**280**"], ["CA consolidé", "5 000 + 2 000 − 300", "**6 700**"], ["Résultat net consolidé", "800 + 250 − 30", "**1 020**"], ["Part du groupe", "800 + 80 % × 220", "**976**"], ["Part NCI (résultat)", "20 % × 220", "**44**"], ["NCI au bilan 31.12.N", "180 + 44", "**224**"]]}, {"type": "diagram", "kind": "group", "parent": {"label": "Mère M"}, "pct": 80, "child": {"label": "Filiale F"}, "nci": 20, "method": "Intégration globale", "caption": "M acquiert 80 % de F pour 1 000 (JV actif net 900). Intégration globale : 100 % des actifs/passifs de F + goodwill 280 ; la part des minoritaires (20 %) est isolée en NCI, présentée distinctement en capitaux propres."}, {"type": "diagram", "kind": "split", "title": "Répartition du résultat net consolidé N (1 020)", "parts": [{"label": "Propriétaires de la mère (976)", "value": 976, "color": "indigo"}, {"label": "NCI / minoritaires (44)", "value": 44, "color": "amber"}], "caption": "Résultat net consolidé 1 020 = part du groupe 976 (800 + 80 % × 220) + part NCI 44 (20 % × 220), après élimination du profit interne upstream de 30 sur le résultat de F (IFRS 10.22)."}]}, {"title": "🔄 Variations de % & perte de contrôle", "blocks": [{"type": "intro", "text": "IFRS 10 distingue **trois événements** de pourcentage — à ne **jamais** confondre. C'est un piège d'examen majeur : le traitement comptable est radicalement différent selon que l'on **franchit**, **conserve** ou **perd** le contrôle."}, {"type": "table", "title": "Les trois événements de pourcentage", "headers": ["Événement", "Traitement", "Goodwill / P&L"], "rows": [["**Acquisition / step** franchissant le contrôle", "Méthode de l'acquisition (**IFRS 3**) ; part antérieure réévaluée à la JV en résultat", "**Goodwill** ; réévaluation **en P&L**"], ["**Variation SANS perte de contrôle** (10.23)", "**Transaction de capitaux propres** (entre actionnaires)", "**Aucun** goodwill nouveau, **aucun** P&L"], ["**Perte de contrôle** (10.25)", "Décomptabilisation + JV de la part conservée + résultat de cession", "Possible goodwill décomptabilisé ; **résultat de cession en P&L**"]]}, {"type": "journal", "title": "Écriture — rachat de NCI SANS perte de contrôle (10.23)", "note": "Transaction de capitaux propres : l'écart entre le prix payé et la part de NCI décomptabilisée va DIRECTEMENT en capitaux propres (part du groupe). Aucun goodwill, aucun résultat. Ici : rachat d'une part de NCI de VC 100 pour 130.", "lines": [{"compte": "NCI (part rachetée, décomptabilisée)", "debit": 100}, {"compte": "Capitaux propres — part du groupe (écart)", "debit": 30}, {"compte": "Trésorerie", "credit": 130}]}, {"type": "journal", "title": "Écriture — schéma général de PERTE de contrôle (10.25)", "note": "On décomptabilise tout (actifs, passifs, goodwill, NCI), on comptabilise la contrepartie reçue à la JV ET la part conservée réévaluée à la JV ; le solde est le résultat de cession (ici un gain, au crédit). Montants illustratifs.", "lines": [{"compte": "Trésorerie / contrepartie reçue (à la JV)", "debit": 700}, {"compte": "Participation conservée (réévaluée à la JV)", "debit": 200}, {"compte": "NCI (décomptabilisée)", "debit": 180}, {"compte": "Passifs de la filiale (décomptabilisés)", "debit": 400}, {"compte": "Actifs de la filiale, dont goodwill (décomptabilisés)", "credit": 1380}, {"compte": "Résultat de cession (P&L) — gain", "credit": 100}]}, {"type": "callout", "tone": "warn", "title": "PERTE de contrôle — réévaluer la part CONSERVÉE", "text": "À la perte de contrôle (IFRS 10.25), la participation **résiduelle** est **remise à la JV** : cette JV devient le **nouveau coût** d'une comptabilisation ultérieure (IFRS 9 ou IAS 28 si influence notable subsiste), avec impact **en résultat**. Souvent omis. Et l'on **recycle ou transfère** l'OCI cumulé **comme si** les actifs/passifs avaient été directement cédés."}]}, {"title": "🏦 Entité d'investissement (exception)", "blocks": [{"type": "intro", "text": "**Exception majeure (IFRS 10.27-33).** Une **entité d'investissement** qui contrôle des filiales **NE les consolide PAS** : elle les évalue à la **juste valeur par résultat (IFRS 9)**. C'est l'unique dérogation au principe « contrôle ⇒ intégration globale »."}, {"type": "keypoints", "title": "Les 3 critères de l'entité d'investissement (10.27-28)", "accent": "indigo", "items": ["Obtient des **fonds d'investisseurs** pour leur fournir des **services de gestion d'investissement** ;", "S'engage à investir **uniquement pour des rendements** issus de la **plus-value en capital**, de **revenus de placement**, ou des deux ;", "**Mesure et apprécie la performance** de la quasi-totalité de ses placements sur la base de la **juste valeur**."]}, {"type": "callout", "tone": "warn", "title": "Les deux pièges « investment entity »", "text": "- **Exception à l'exception** : une filiale dont l'**objet est de fournir des services liés aux activités d'investissement** de la mère (conseil, gestion immobilière interne) est **consolidée** normalement.\n- **Pas de propagation vers le haut** : une **mère qui n'est pas elle-même** une entité d'investissement mais dont la filiale en est une **ne reproduit pas** l'évaluation à la JV — elle **consolide**. L'exception ne « remonte » pas la chaîne."}, {"type": "callout", "tone": "info", "title": "Angle suisse", "text": "Ni **Swiss GAAP RPC 30** ni le **CO** ne prévoient d'exception comparable : une société d'investissement suisse **consoliderait** ses filiales (ou suivrait son référentiel reconnu), là où en IFRS elle les porte à la **JV par résultat**. C'est une **divergence qui rapporte des points** dès qu'un fonds / holding de placement apparaît dans l'énoncé."}]}, {"title": "🗂️ IFRS 10 vs RPC 30 vs CO", "blocks": [{"type": "compare", "title": "IFRS 10 vs Swiss GAAP RPC 30 vs CO (art. 963-963a)", "rows": [{"crit": "Critère de consolidation", "ifrs": "**Contrôle** = modèle **unique à 3 éléments** (pouvoir + rendements variables + lien)", "rpc": "**Contrôle** (direct/indirect ; majorité des voix **ou** pouvoir de fait)", "co": "**Contrôle** : majorité des voix **ou** droit de désigner la majorité de l'organe supérieur **ou** influence dominante (statuts/contrat) — art. 963 al. 2"}, {"crit": "Obligation de consolider", "ifrs": "Oui dès le contrôle ; **dispense** sous-mère (IFRS 10.4)", "rpc": "Oui dès le contrôle ; sous-groupes possibles", "co": "Oui dès le contrôle, **sauf dispenses** : sous-consolidation (963 al. 3) **et** seuils de taille (963a)"}, {"crit": "Seuils de dispense (taille)", "ifrs": "**Pas de seuils chiffrés** (critère coté/non coté + mère publiant en IFRS)", "rpc": "Dispense petits groupes (renvoi aux seuils du CO)", "co": "**Exonération 963a** si, sur **2 exercices**, le groupe ne dépasse pas **2 des 3** seuils : bilan **20 mio**, CA **40 mio**, **250 emplois** (moyenne annuelle)"}, {"crit": "Méthode pour les filiales", "ifrs": "**Intégration globale** (100 %, NCI séparée)", "rpc": "**Intégration globale**", "co": "Renvoi à un **référentiel reconnu** ou aux « principes ordinaires » ; intégration globale en pratique"}, {"crit": "NCI (minoritaires)", "ifrs": "**Capitaux propres**, ligne **distincte** ; évaluation initiale **option JV / quote-part** (IFRS 3)", "rpc": "**Séparément** dans les capitaux propres ; pas d'option « goodwill complet »", "co": "Part des minoritaires présentée ; pas d'option JV codifiée"}, {"crit": "NCI déficitaire", "ifrs": "Résultat attribué **même si solde négatif** (10.B94)", "rpc": "Attribution également (logique économique)", "co": "Non spécifié en détail"}, {"crit": "Réévaluation à la JV à l'acquisition (PPA)", "ifrs": "**Obligatoire** (via IFRS 3 / IFRS 13)", "rpc": "PPA à la JV des actifs nets identifiables", "co": "**Non requise** : consolidation possible au **coût**"}, {"crit": "Goodwill", "ifrs": "**Non amorti**, test de dépréciation **annuel** (IAS 36) — via IFRS 3", "rpc": "**Amorti** (≤ 5 ans, max **20 ans** si justifié) **OU** imputé aux **fonds propres**", "co": "Amorti / prudence ; pas de standard détaillé"}, {"crit": "Élimination intragroupe", "ifrs": "**Intégrale** (soldes, transactions, **résultats internes**)", "rpc": "**Intégrale**", "co": "Exigée (opérations et résultats internes éliminés)"}, {"crit": "Méthodes uniformes / même date", "ifrs": "**Obligatoires** (écart de clôture **≤ 3 mois**)", "rpc": "Requises", "co": "Cohérence requise ; cadre plus souple"}, {"crit": "Exception « entité d'investissement »", "ifrs": "**OUI** : pas de consolidation → **JV par résultat (IFRS 9)**", "rpc": "**Aucune** exception comparable", "co": "**Aucune** exception comparable"}, {"crit": "Perte de contrôle", "ifrs": "Réévaluation de la part conservée à la **JV** + résultat de cession en P&L", "rpc": "Déconsolidation ; cadre moins formalisé", "co": "Selon référentiel choisi"}, {"crit": "Informations à fournir", "ifrs": "**Très étendues** (renvoi à **IFRS 12** : filiales, NCI, entités structurées, jugements)", "rpc": "Annexe RPC, plus légère", "co": "**Minimales** (exigences légales)"}]}, {"type": "keypoints", "title": "Les contrastes qui rapportent des points", "accent": "amber", "items": ["**CO = obligation LÉGALE** de consolider dès le contrôle (art. 963), avec **dispense de taille chiffrée** propre au droit suisse : **20 mio / 40 mio / 250 emplois** (2 des 3 sur 2 ans, art. 963a). IFRS 10 **ne connaît pas** de seuils chiffrés.", "**Exception « investment entity »** : **spécifique IFRS 10**, **absente** de RPC 30 et du CO — une société d'investissement suisse **consoliderait**.", "**Réévaluation à la JV** à la prise de contrôle **obligatoire** en IFRS (IFRS 3) / RPC **vs** consolidation possible au **coût** au CO.", "**Goodwill** : non amorti (IFRS, IAS 36) **vs** amorti ≤ 20 ans ou imputé aux fonds propres (RPC) — divergence « famille » classique."]}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Réduire le contrôle à « > 50 % des voix »", "text": "Erreur n°1. Le contrôle exige **les trois** éléments (pouvoir **+** rendements variables **+** lien). À l'inverse, une **majorité des voix sans pouvoir effectif** sur les activités pertinentes (activités dirigées par contrat au profit d'un tiers) **ne** donne **pas** le contrôle."}, {"type": "keypoints", "title": "Pièges classiques à éviter", "accent": "rose", "items": ["**Oublier le contrôle de FAIT** : < 50 % peut suffire si le flottant résiduel est **dispersé** (ex. 45 % face à un actionnariat atomisé).", "**Négliger les droits de vote POTENTIELS substantiels** : options/convertibles « dans la monnaie » et exerçables **maintenant** peuvent conférer le pouvoir avec une participation minoritaire. Inversement, des droits **non substantiels** (hors de la monnaie) ne comptent pas.", "**Confondre droits SUBSTANTIELS et PROTECTEURS** : un veto de prêteur sur un endettement majeur, ou l'approbation de dépenses **exceptionnelles**, est **protecteur** → ne donne pas le contrôle et n'empêche pas un tiers de l'exercer.", "**Ignorer principal / AGENT** : un *fund manager* peut avoir le pouvoir **sans** contrôler (rémunération de marché, kick-out rights d'un tiers, faible exposition).", "**Identifier les mauvaises ACTIVITÉS PERTINENTES** : c'est celle qui dirige les activités **affectant le plus les rendements** qui a le pouvoir. Mal cadrer fausse tout le test.", "**Traiter une variation SANS perte de contrôle comme un résultat** : c'est une **transaction de capitaux propres** (10.23) — aucun goodwill, aucun P&L. À distinguer de la **perte de contrôle**.", "**Oublier de RÉÉVALUER la part conservée** à la perte de contrôle (nouveau coût IFRS 9 / IAS 28, impact en résultat).", "**Attribuer le résultat aux NCI « seulement si positif »** : faux — attribution **même si NCI déficitaire** (10.B94).", "**Éliminer le résultat interne à hauteur de la quote-part** (réflexe MEE) : en intégration globale on élimine **100 %** ; seule la **répartition** (upstream) suit le %.", "**Oublier l'UNIFORMISATION** : méthodes non alignées ou dates écartées de **> 3 mois** sans ajustement = consolidation non conforme.", "**Mal appliquer l'« entité d'investissement »** : une filiale **fournissant des services d'investissement** est **consolidée** ; l'évaluation à la JV **ne se propage pas** à une mère non-« investment entity ».", "**Croire qu'IFRS 10 calcule le goodwill** : non — goodwill, PPA et NCI initiale relèvent d'**IFRS 3**. IFRS 10 **déclenche** la consolidation et gère la **suite**."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "PRL", "phrase": "« **P**ouvoir × **R**endements variables × **L**ien » — le contrôle, c'est PRL, un produit logique : si un facteur est nul, pas de contrôle.", "items": [{"l": "P", "t": "**Pouvoir** sur les **activités pertinentes** (droits existants, substantiels, non protecteurs — IFRS 10.10)"}, {"l": "R", "t": "**Rendements variables** auxquels on est exposé (positifs, négatifs ou les deux — IFRS 10.15-16)"}, {"l": "L", "t": "**Lien** : capacité d'utiliser le pouvoir pour **influer** sur ces rendements → principal, pas agent (IFRS 10.17-18)"}]}, {"type": "keypoints", "title": "Le fil conducteur d'examen (très payant)", "accent": "emerald", "items": ["**Annoncer le modèle unique (IFRS 10.7)** : contrôle **si et seulement si** les **trois** éléments cumulatifs sont réunis — citez les trois.", "**Identifier les activités pertinentes** et **qui** les dirige (vote ? contrat ? organe de direction ?).", "**Qualifier la source du pouvoir** : majorité substantielle / contrôle de fait / droits potentiels / contrats. **Écarter** explicitement les droits **protecteurs**.", "**Trancher principal vs agent** si un décideur agit pour autrui : rémunération de marché, kick-out rights, exposition.", "**Conclure le test** : (a)·(b)·(c) → intégration globale ; sinon → IFRS 11 / IAS 28 / IFRS 9.", "**Dérouler les procédures** : méthodes uniformes + même date, élimination **intégrale**, **NCI distincte**, résultat & OCI attribués à la mère **ET** aux NCI (même déficitaires).", "**Distinguer les 3 événements de %** : step (IFRS 3) / variation sans perte de contrôle (capitaux propres) / perte de contrôle (JV part conservée + P&L).", "**Mentionner l'« entité d'investissement »** dès qu'un fonds/holding apparaît : pas de conso → JV par résultat.", "**Réflexe suisse** : CO art. 963 (obligation), dispense 963a (**20 / 40 / 250**), méthode **RPC 30** ; ni RPC ni CO ne connaissent l'« investment entity », et le CO n'impose pas la JV."]}, {"type": "callout", "tone": "key", "title": "Citations sûres", "text": "**IFRS 10.7** (3 éléments) · **10.10** (pouvoir / activités pertinentes) · **10.15-16** (rendements variables) · **10.17-18** (principal/agent) · **10.22** (NCI en capitaux propres) · **10.23** (variation sans perte de contrôle) · **10.25** (perte de contrôle) · **10.27** (entité d'investissement) · **10.B94** (attribution même si NCI déficitaire) · **CO 963 / 963a** (obligation et dispenses 20/40/250) · **RPC 30** (méthode)."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste-toi (8 questions)", "questions": [{"q": "Quels sont les trois éléments CUMULATIFS du contrôle (IFRS 10.7) ?", "options": ["Détenir > 50 % du capital, nommer le dirigeant et financer l'entité", "Pouvoir sur les activités pertinentes, exposition à des rendements variables, capacité d'utiliser le pouvoir pour influer sur ces rendements", "Influence notable, contrôle conjoint et détention durable", "Majorité des voix, même date de clôture et méthodes uniformes"], "answer": 1, "explain": "IFRS 10.7 : contrôle **si et seulement si** (a) **pouvoir** sur les activités pertinentes, (b) **exposition à des rendements variables**, (c) **capacité d'utiliser le pouvoir pour influer** sur ces rendements. Les trois sont **cumulatifs** : un seul manquant = pas de contrôle."}, {"q": "Une société détient 45 % d'une entité dont le reste du capital est réparti entre des milliers d'actionnaires détenant chacun < 1 %. Que conclure ?", "options": ["Pas de contrôle : il faut impérativement > 50 % des voix", "Contrôle conjoint, à mettre en équivalence (IAS 28)", "Contrôle de FAIT (de facto) possible vu la dispersion : consolidation", "Influence notable seulement, donc mise en équivalence"], "answer": 2, "explain": "C'est le **contrôle de fait** (IFRS 10.B41-B46) : < 50 % en valeur absolue mais suffisant **en pratique** car l'actionnariat résiduel est **dispersé**. → pouvoir → **intégration globale**. Ne pas consolider serait une faute fréquente."}, {"q": "Un gestionnaire de fonds détient le pouvoir de décision sur un fonds. Doit-il toujours le consolider ?", "options": ["Oui, le pouvoir de décision suffit toujours", "Non : s'il agit en AGENT (rémunération de marché, kick-out rights d'un tiers, faible exposition), il ne contrôle pas", "Oui, dès qu'il perçoit des honoraires de gestion", "Non, un gérant de fonds ne contrôle jamais une entité"], "answer": 1, "explain": "Le **lien** (élément c) distingue principal et agent (IFRS 10.17-18). Un **agent** a le pouvoir mais agit **pour autrui** → **ne contrôle pas**. Indices : rémunération **de marché**, **kick-out rights** d'un tiers, **faible exposition** aux rendements. Seul un **principal** consolide."}, {"q": "Quelle est la différence entre droits substantiels et droits protecteurs ?", "options": ["Les protecteurs valent plus que les substantiels pour apprécier le pouvoir", "Les substantiels sont exerçables en pratique et comptent ; les protecteurs (veto sur opérations exceptionnelles) ne confèrent pas le contrôle", "Aucune différence : tous deux confèrent le pouvoir", "Les substantiels concernent les minoritaires, les protecteurs la mère"], "answer": 1, "explain": "**Substantiels** (B22-B25) : exerçables **en pratique** au moment des décisions → **comptent** pour le pouvoir. **Protecteurs** (B26-B28) : protègent le titulaire (veto d'un prêteur, approbation de dépenses exceptionnelles) **sans** donner le pouvoir → **ne confèrent pas** le contrôle."}, {"q": "En intégration globale, dans quelle mesure élimine-t-on un profit interne non réalisé sur stocks ?", "options": ["À hauteur de la quote-part de la mère uniquement", "À 100 %, l'effet d'une vente upstream étant ensuite réparti entre mère et NCI au prorata", "On ne l'élimine pas, c'est un profit réalisé", "Seulement la part des minoritaires"], "answer": 1, "explain": "L'intégration globale élimine **100 %** du résultat interne non réalisé (≠ MEE qui élimine la quote-part). En vente **upstream** (filiale→mère) avec NCI, seule la **répartition** de l'effet entre mère et NCI suit le pourcentage (IFRS 10.B86)."}, {"q": "Le résultat de la filiale est attribué aux NCI même si leur solde devient négatif. Vrai ou faux ?", "options": ["Faux : on plafonne la NCI à zéro", "Vrai : l'attribution se fait même si la NCI devient déficitaire (IFRS 10.B94)", "Faux : seul le résultat positif est attribué aux NCI", "Vrai, mais seulement avec l'accord des minoritaires"], "answer": 1, "explain": "IFRS 10.B94 : le résultat global est attribué à la mère **ET** aux NCI **même si le solde de la NCI devient négatif (déficitaire)**. On ne « plafonne » **plus** à zéro — **changement vs l'ancien IAS 27**."}, {"q": "La mère rachète 10 % de NCI sans perdre le contrôle. Quel traitement ?", "options": ["Nouveau goodwill égal à l'écart de prix", "Profit ou perte en résultat", "Transaction de capitaux propres : aucun goodwill, aucun P&L, écart en capitaux propres (part du groupe)", "Réévaluation de toute la filiale à la juste valeur"], "answer": 2, "explain": "IFRS 10.23 : une variation de % **sans perte de contrôle** est une **transaction entre actionnaires** → **aucun goodwill** nouveau, **aucun résultat** ; l'écart entre le prix et la part de NCI ajustée va **directement en capitaux propres** (part du groupe)."}, {"q": "Que fait une entité d'investissement (IFRS 10.27-31) de ses filiales contrôlées ?", "options": ["Elle les consolide normalement par intégration globale", "Elle les met en équivalence (IAS 28)", "Elle ne les consolide pas : évaluation à la JV par résultat (IFRS 9), sauf filiale fournissant des services d'investissement", "Elle les présente au coût d'acquisition"], "answer": 2, "explain": "Exception IFRS 10.27-31 : l'entité d'investissement **ne consolide pas** ses filiales → **JV par résultat (IFRS 9)**. Exception à l'exception : une filiale **fournissant des services liés aux activités d'investissement** est **consolidée**. Ni RPC 30 ni le CO ne connaissent cette exception."}]}]}]}, {"code": "IFRS 11", "title": "Partenariats", "icon": "⚖️", "color": "amber", "tagline": "La **substance prime la forme** : *joint operation* (droits sur **actifs**/passifs, ligne à ligne) **vs** *joint venture* (droits sur l'**actif net**, MEE). L'intégration proportionnelle est **supprimée**.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "**IFRS 11 « Partenariats » (*Joint Arrangements*)** régit les accords sous **contrôle conjoint** — un partage **contractuel** du contrôle où les décisions sur les **activités pertinentes** exigent le **consentement UNANIME** des parties. La norme a **remplacé IAS 31** et **SIC-13** au **1ᵉʳ janvier 2013**.\n\nElle distingue **deux types** de partenariats selon les **droits & obligations** réels des parties :\n- l'**activité conjointe (*joint operation*)** — les parties ont des **droits sur les actifs** et des **obligations au titre des passifs** → chaque coparticipant comptabilise **directement** sa quote-part d'actifs, passifs, produits et charges (**ligne à ligne**, **pas** de mise en équivalence) ;\n- la **coentreprise (*joint venture*)** — droits sur l'**actif NET** seulement → **mise en équivalence (IAS 28)**.\n\n**Le grand virage vs IAS 31 :** la classification suit la **substance** (droits/obligations) et **non** la simple **forme juridique** ; le **libre choix** intégration proportionnelle *ou* MEE **disparaît**. L'**intégration proportionnelle** des coentreprises est **supprimée** sous IFRS — alors que **RPC 30 l'autorise encore** (divergence majeure)."}, {"type": "keypoints", "title": "Les 5 réflexes à ancrer", "accent": "amber", "items": ["**Porte d'entrée = contrôle conjoint** : (1) accord **contractuel** + (2) décisions sur les activités pertinentes à **consentement UNANIME** (chacun peut **bloquer**).", "**Deux types** : *joint operation* (droits sur **actifs** + obligations sur **passifs**) vs *joint venture* (droits sur l'**actif net**). Tout en découle.", "**Joint operation** → comptabilisation **directe ligne à ligne**, **identique** en comptes individuels et consolidés. **Pas** de MEE.", "**Joint venture** → **mise en équivalence (IAS 28)**. **Intégration proportionnelle INTERDITE** (fin d'IAS 31).", "**Sans véhicule distinct → TOUJOURS une *joint operation*** (impossible d'avoir un « actif net » sans entité support)."]}, {"type": "callout", "tone": "key", "title": "La phrase-réflexe à placer en examen", "text": "« *La **substance prime la forme** : on classe selon les **droits sur les actifs et obligations au titre des passifs** (*joint operation*) ou les **droits sur l'actif net** (*joint venture*), et l'**intégration proportionnelle des coentreprises est supprimée** depuis IFRS 11.* »"}, {"type": "callout", "tone": "warn", "title": "Contrôle conjoint ≠ contrôle d'un majoritaire", "text": "Le contrôle conjoint exige le **consentement UNANIME** sur les activités pertinentes : **aucune partie seule** ne peut décider, chacune dispose d'un **veto de fait**. Si une partie peut trancher à la **majorité simple**, il n'y a **pas** de contrôle conjoint → on tombe sous **IFRS 10** (contrôle) ou **IAS 28** (influence notable), **pas** IFRS 11."}, {"type": "diagram", "kind": "spectrum", "title": "La place d'IFRS 11 sur l'axe du pouvoir", "bands": [{"from": 0, "to": 33, "color": "slate", "short": "Influence", "label": "**Influence notable (IAS 28)** — participer sans diriger → **MEE**"}, {"from": 33, "to": 66, "color": "amber", "short": "Conjoint", "label": "**Contrôle conjoint (IFRS 11)** — partage contractuel, **consentement UNANIME** → *joint operation* (compta directe) **ou** *joint venture* (MEE)"}, {"from": 66, "to": 100, "color": "indigo", "short": "Exclusif", "label": "**Contrôle exclusif (IFRS 10)** — un majoritaire dirige seul → **intégration globale**"}], "caption": "IFRS 11 occupe l'étage du **milieu** : ni un simple détenteur d'influence (IAS 28), ni un majoritaire qui tranche seul (IFRS 10). Le marqueur **unique** = le **consentement unanime** sur les activités pertinentes (chacun dispose d'un **veto de fait**)."}]}, {"title": "📐 Définitions clés & place dans le périmètre", "blocks": [{"type": "intro", "text": "IFRS 11 occupe la case « contrôle conjoint » de la **trilogie du périmètre** de consolidation. Selon le **lien exercé**, la norme de classement et la méthode changent radicalement."}, {"type": "table", "title": "La famille « comptes de groupe » — du lien à la méthode", "headers": ["Lien exercé", "Norme de classement", "Traitement"], "rows": [["**Contrôle** (filiale)", "IFRS 10", "Intégration **globale**"], ["**Contrôle conjoint** → *joint operation*", "**IFRS 11**", "Comptabilisation **directe** des actifs/passifs/produits/charges (quote-part, ligne à ligne)"], ["**Contrôle conjoint** → *joint venture*", "**IFRS 11** → **IAS 28**", "**Mise en équivalence**"], ["**Influence notable** (associée)", "IAS 28", "**Mise en équivalence**"], ["Aucune influence", "IFRS 9", "Juste valeur (FVPL / FVOCI)"], ["**Informations à fournir** sur tous ces intérêts", "**IFRS 12**", "Annexe (*disclosures*)"]]}, {"type": "callout", "tone": "key", "title": "L'opposition-clé de tout l'examen", "text": "**Droits sur les *actifs* & obligations sur les *passifs*** (*joint operation*) **vs droits sur l'*actif net*** (*joint venture*). C'est la racine de toute la norme : la qualification du lien (droits/obligations) **détermine mécaniquement** la comptabilisation."}, {"type": "heading", "text": "Les définitions à connaître par cœur"}, {"type": "intro", "text": "**Partenariat (*joint arrangement*)** — accord dont **deux parties ou plus** exercent un **contrôle conjoint**. Deux caractéristiques **cumulatives** : (1) les parties sont liées par un **accord contractuel** ; (2) cet accord confère le **contrôle conjoint** à deux parties ou plus.\n\n**Contrôle conjoint (*joint control*)** — **partage contractuellement convenu** du contrôle, qui n'existe **que** lorsque les décisions sur les **activités pertinentes** requièrent le **consentement UNANIME** des parties partageant le contrôle. C'est **le** critère d'entrée dans IFRS 11.\n\n**Activités pertinentes (*relevant activities*)** — activités qui **influent de façon importante sur les rendements** de l'accord (notion empruntée à IFRS 10 : politique financière et opérationnelle, budgets, nominations clés, investissements significatifs).\n\n**Activité conjointe (*joint operation*)** — partenariat où les parties exerçant le contrôle conjoint (les **coparticipants**) ont des **droits sur les actifs** et des **obligations au titre des passifs**.\n\n**Coentreprise (*joint venture*)** — partenariat où les parties exerçant le contrôle conjoint (les **coentrepreneurs**) ont des **droits sur l'actif NET** de l'accord.\n\n**Véhicule distinct (*separate vehicle*)** — structure financière distincte (y compris une **entité juridique** distincte), **indépendamment** de sa personnalité juridique propre. Sa présence est **nécessaire mais non suffisante** pour conclure à une coentreprise."}, {"type": "callout", "tone": "info", "title": "Démarche d'analyse du contrôle conjoint (2 étapes)", "text": "- **Étape 1** — Les parties (toutes ou un sous-groupe) **contrôlent-elles collectivement** l'accord (au sens d'IFRS 10 : exposition à des rendements variables + pouvoir de les influencer) ? Sinon → **pas** de partenariat.\n- **Étape 2** — Les décisions sur les activités pertinentes exigent-elles le **consentement unanime** de ces parties ? **Oui** → **contrôle conjoint** (chacune peut **bloquer**)."}, {"type": "callout", "tone": "tip", "title": "Partie vs partie exerçant le contrôle conjoint", "text": "Une **partie** participe à l'accord, qu'elle exerce ou non le contrôle conjoint. Une partie **sans** contrôle conjoint mais ayant tout de même des **droits sur les actifs / obligations sur les passifs** comptabilise **comme** un coparticipant (logique *joint operation*). Sans ces droits, elle relève d'**IAS 28** (influence notable) ou d'**IFRS 9**."}, {"type": "callout", "tone": "info", "title": "Ce qu'IFRS 11 N'aborde PAS (aiguillages)", "text": "- la **mécanique de la MEE** (dépréciation, pertes, éliminations) → **IAS 28** (IFRS 11 ne fait qu'**aiguiller** la JV vers IAS 28) ;\n- les **informations à fournir** sur les partenariats → **IFRS 12** ;\n- la comptabilisation dans les **comptes individuels (séparés)** → **IAS 27** (coût, IFRS 9, ou MEE — option), **sauf** la quote-part d'une *joint operation*, comptabilisée **identiquement** dans les comptes individuels **et** consolidés."}, {"type": "diagram", "kind": "pyramid", "title": "Les degrés de pouvoir — du contrôle exclusif au simple intérêt", "levels": [{"t": "Contrôle exclusif (IFRS 10)", "d": "Une partie dirige seule les activités pertinentes → intégration **globale** (filiale)."}, {"t": "Contrôle conjoint (IFRS 11)", "d": "Partage **contractuel**, décisions à l'**unanimité** → *joint operation* : compta **directe** ; *joint venture* : **MEE**."}, {"t": "Influence notable (IAS 28)", "d": "Participer aux décisions sans diriger (≥ 20 % présumé) → **MEE**."}, {"t": "Simple intérêt (IFRS 9)", "d": "Aucun pouvoir de participation → **juste valeur** (FVPL / FVOCI)."}], "accent": "amber", "caption": "IFRS 11 est le **deuxième étage** de la trilogie du périmètre : **plus** qu'une influence notable, **moins** qu'un contrôle exclusif. C'est le seul niveau qui se **dédouble** ensuite en deux comptabilisations opposées selon les droits/obligations."}]}, {"title": "⚖️ Classification : la cascade des facteurs", "blocks": [{"type": "intro", "text": "La classification est **le** cœur de la norme et le **principal enjeu d'examen**. Elle dépend des **droits et obligations** des parties, appréciés via une **séquence en cascade**. Dès qu'un niveau conduit à *joint operation*, on **s'arrête**."}, {"type": "callout", "tone": "key", "title": "Niveau 0 — Pas de véhicule distinct → TOUJOURS joint operation", "text": "Si le partenariat **n'est pas structuré via un véhicule distinct**, les actifs et passifs sont détenus/assumés **directement** par les parties → c'est **nécessairement une *joint operation*** (impossible d'avoir des droits sur un « actif net » sans entité support). On ne va **pas** plus loin dans la cascade."}, {"type": "steps", "title": "Si un véhicule distinct existe → cascade des 4 facteurs", "accent": "amber", "steps": [{"t": "Facteur 1 — Structure : véhicule distinct ou non ?", "d": "**Pas de véhicule distinct → *joint operation* (point final).** Un véhicule distinct est la **condition nécessaire** (mais **non suffisante**) pour une coentreprise. S'il existe, on poursuit avec les facteurs 2 à 4."}, {"t": "Facteur 2 — Forme juridique du véhicule", "d": "La forme confère-t-elle des droits sur les **actifs** et obligations sur les **passifs** (structure **transparente**, ex. certaines sociétés de personnes / *partnerships*) → indice de *joint operation* ; ou seulement des droits sur l'**actif net** (**séparation patrimoniale**, ex. SA/SARL à responsabilité limitée) → **présomption** de *joint venture*."}, {"t": "Facteur 3 — Termes de l'accord contractuel", "d": "Ils peuvent **RENVERSER** la présomption issue de la forme. Indices de *joint operation* **même** avec véhicule à responsabilité limitée : le contrat attribue aux parties des **droits sur les actifs** et une **obligation aux passifs**, les parties **garantissent** les dettes, ou se répartissent **directement** produits et charges (et non un simple résultat net)."}, {"t": "Facteur 4 — Autres faits & circonstances", "d": "**L'indice favori des examinateurs.** Cas emblématique : le partenariat **dépend quasi-exclusivement des parties** — elles achètent **toute** la production à un prix couvrant les coûts, et/ou financent les passifs au fil de l'eau via leurs achats. En **substance** les parties **assument les passifs** et **absorbent les flux** → ***joint operation***, **quelle que soit** la forme juridique du véhicule."}]}, {"type": "callout", "tone": "warn", "title": "Le piège n°1 : la dépendance économique", "text": "Si les parties achètent **la quasi-totalité de la production** (prix couvrant les coûts) et/ou financent le véhicule par leurs achats, la qualification **bascule en *joint operation*** **malgré** un véhicule distinct à responsabilité limitée. **À l'inverse**, si le véhicule peut **vendre à des tiers**, supporter ses **propres passifs** et lever ses **propres financements**, les parties n'ont de droits que sur l'**actif net** → ***joint venture***."}, {"type": "table", "title": "Synthèse décisionnelle", "headers": ["Droits/obligations des parties", "Type", "Comptabilisation"], "rows": [["Droits sur **actifs** + obligations sur **passifs**", "***Joint operation***", "**Directe**, ligne à ligne (quote-part / droits réels)"], ["Droits sur l'**actif net** uniquement", "***Joint venture***", "**MEE (IAS 28)**"], ["*(rappel)*", "**Aucun des deux**", "**Aucune intégration proportionnelle** admise — pour aucun type"]]}, {"type": "callout", "tone": "info", "title": "La quote-part ligne à ligne n'est PAS une intégration proportionnelle", "text": "La comptabilisation directe d'une *joint operation* repose sur des **droits/obligations directs** définis par le **contrat** — qui peuvent **différer** du % de détention (ex. 50 % du capital mais 60 % des coûts assumés). On reprend les **droits réels**, ligne à ligne. Ce **n'est pas** une intégration proportionnelle d'un actif net (technique réservée, sous IFRS, à... **personne** — elle est supprimée)."}, {"type": "diagram", "kind": "flow", "title": "La cascade de classification SFTA — on s'arrête dès « joint operation »", "steps": [{"label": "S · Structure", "sub": "Véhicule distinct ? **Non → joint operation (point final).** Oui → poursuivre (condition nécessaire, non suffisante d'une JV)."}, {"label": "F · Forme juridique", "sub": "Responsabilité limitée (SA/SARL) → **présume joint venture** ; structure transparente (partnership) → indice joint operation."}, {"label": "T · Termes contractuels", "sub": "Peuvent **RENVERSER** la forme : droits sur actifs, garanties des dettes, partage direct produits/charges → joint operation."}, {"label": "A · Autres faits & circonstances", "sub": "**Piège n°1** : dépendance économique (achat de toute la production, financement par les achats) → joint operation, malgré le véhicule."}, {"label": "= Type → méthode", "sub": "Droits sur actifs/passifs → ***joint operation*** (ligne à ligne) · droits sur l'actif net → ***joint venture*** (MEE)."}], "accent": "amber", "caption": "Séquence en cascade : dès qu'un facteur conduit à *joint operation*, on **s'arrête**. Les facteurs **T** et **A** peuvent **réfuter** la présomption issue de la forme juridique (**F**)."}]}, {"title": "🧮 Méthode & écritures (par type)", "blocks": [{"type": "intro", "text": "La comptabilisation **découle mécaniquement de la classification**. Deux mondes : la *joint operation* éclate tout **ligne à ligne** ; la *joint venture* condense tout en **une seule ligne** (MEE)."}, {"type": "heading", "text": "A. Activité conjointe (joint operation) — comptabilisation directe"}, {"type": "intro", "text": "Le **coparticipant** comptabilise, en relation avec sa participation, et **de façon identique dans ses comptes individuels et consolidés** :\n- ses **actifs**, y compris sa **quote-part des actifs détenus conjointement** ;\n- ses **passifs**, y compris sa **quote-part des passifs assumés conjointement** ;\n- ses **produits** tirés de la vente de **sa quote-part de production**, et sa **quote-part des produits** de la vente par l'activité conjointe ;\n- ses **charges**, y compris sa **quote-part des charges communes**.\n\n→ **Aucun compte unique « participation »** : tout est **éclaté ligne à ligne** au bilan et au compte de résultat, selon les **droits/obligations** définis par le contrat."}, {"type": "journal", "title": "Écriture — apport initial de trésorerie à une joint operation (part 50 %)", "note": "La quote-part d'actifs de la JO entre directement au bilan du coparticipant — pas de ligne « participation ». Exemple : apport de 200 contre une quote-part d'actifs de 200.", "lines": [{"compte": "Actifs de la joint operation (quote-part, ligne à ligne)", "debit": 200}, {"compte": "Trésorerie", "credit": 200}]}, {"type": "callout", "tone": "warn", "title": "Transactions avec l'accord (apport / achat / vente)", "text": "À l'**apport d'un actif non monétaire** ou à la **vente** à la *joint operation*, le coparticipant ne comptabilise le **profit/perte** qu'à hauteur des **intérêts des AUTRES parties** : sa propre part n'est **pas réalisée** (différée). Symétriquement, un **achat** auprès de la *joint operation* ne fait pas reconnaître la quote-part de profit/perte tant que l'actif n'est pas **revendu à un tiers**."}, {"type": "heading", "text": "B. Coentreprise (joint venture) — mise en équivalence (IAS 28)"}, {"type": "intro", "text": "Le **coentrepreneur** comptabilise un **intérêt unique** « Participation dans une coentreprise » et applique la **MEE** : amorçage **au coût**, puis **roulement**."}, {"type": "callout", "tone": "key", "title": "Formule de roulement de la valeur comptable (VC)", "text": "**VC = coût + QP du résultat net ± QP d'OCI − dividendes reçus − dépréciation − amortissement des plus-values de JV** *(mécanique détaillée : voir IAS 28).*"}, {"type": "journal", "title": "Écriture — Étape 1 : comptabilisation initiale (au coût)", "note": "Acquisition / apport. Exemple : coût de 200.", "lines": [{"compte": "Participation dans la coentreprise (MEE)", "debit": 200}, {"compte": "Trésorerie", "credit": 200}]}, {"type": "journal", "title": "Écriture — Étape 2 : quote-part de résultat (bénéfice)", "note": "Produit au compte de résultat. En cas de perte : écriture inverse. Exemple : 50 % × 200 = 100.", "lines": [{"compte": "Participation dans la coentreprise", "debit": 100}, {"compte": "Quote-part de résultat des coentreprises (CR)", "credit": 100}]}, {"type": "journal", "title": "Écriture — Étape 3 : dividende reçu", "note": "Le dividende RÉDUIT la VC — ce n'est PAS un produit (le produit est la quote-part de résultat). Exemple : 50 % × 40 = 20.", "lines": [{"compte": "Trésorerie", "debit": 20}, {"compte": "Participation dans la coentreprise", "credit": 20}]}, {"type": "callout", "tone": "info", "title": "Le reste de la mécanique MEE relève d'IAS 28", "text": "Quote-part d'**OCI**, **déroulé** des plus-values de JV, **dépréciation IAS 36** sur la VC totale, **arrêt** de la MEE en cas de pertes (plancher 0), **éliminations** amont/aval à hauteur de la quote-part : IFRS 11 **aiguille** vers **IAS 28**, qui en détaille les modalités."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Activité conjointe (joint operation)", "color": "indigo", "items": ["**Droits sur les actifs + obligations sur les passifs**", "Comptabilisation **directe**, **ligne à ligne**", "Actifs, passifs, produits, charges (quote-part / droits réels)", "**Identique** comptes individuels ET consolidés", "**Pas** de compte « participation » · **pas** de MEE", "Profit sur apport/vente reconnu **seulement** à hauteur des autres parties"]}, {"title": "Coentreprise (joint venture)", "color": "emerald", "items": ["**Droits sur l'actif NET** seulement", "**Mise en équivalence (IAS 28)**", "**Une seule ligne** « Participation dans une coentreprise »", "VC = coût + QP résultat ± QP OCI − dividendes − dépréciation", "**Intégration proportionnelle INTERDITE** (fin d'IAS 31)", "Goodwill **noyé** dans la VC, **non amorti** (test IAS 36 global)"]}], "caption": "La comptabilisation **découle mécaniquement** de la classification : la *joint operation* **éclate tout** ligne à ligne ; la *joint venture* **condense tout** en une ligne nette (MEE)."}]}, {"title": "🔢 Exemple chiffré — même 50 %, deux classifications", "blocks": [{"type": "intro", "text": "Le but : montrer l'**impact comptable radicalement différent** d'une **même** participation de **50 %** selon qu'elle est qualifiée d'**activité conjointe** ou de **coentreprise**. **Surprise pédagogique :** le **résultat net est identique**, mais **bilan, chiffre d'affaires et dettes affichés diffèrent fortement**."}, {"type": "example", "title": "Quote-part ligne à ligne (joint operation) vs MEE (joint venture)", "statement": "**A** et **B** détiennent **50 %** chacune d'un partenariat **P** sous **contrôle conjoint** (consentement unanime requis). À la **création**, chacune apporte **200** de trésorerie (P dispose de **400**). Durant l'exercice N, **P** présente (CHF k) :\n\n**Compte de résultat de P**\n- Chiffre d'affaires : **1 000**\n- Charges d'exploitation : **(800)**\n- **Résultat net : 200**\n\n**Bilan de P (fin N)**\n- Actifs (immobilisations + créances + trésorerie) : **900**\n- Passifs (dettes fournisseurs + emprunt) : **(300)**\n- **Actif net : 600**\n\nAucune distribution sur N. On regarde l'impact dans les comptes de **A** (quote-part **50 %**).\n\n**Travail demandé :** traiter P (a) comme une ***joint operation***, puis (b) comme une ***joint venture*** (MEE), et **comparer** l'effet sur le **résultat net**, le **total de bilan**, les **dettes** et le **chiffre d'affaires** publiés par A.", "solution": "**HYPOTHÈSE 1 — P est une *joint operation*** (droits sur actifs, obligations sur passifs). A reprend **sa quote-part ligne à ligne**, **directement** dans ses propres états :\n- Quote-part d'**actifs** : 50 % × 900 = **+450** (répartis par nature)\n- Quote-part de **passifs** : 50 % × 300 = **+150** (répartis par nature)\n- Quote-part de **chiffre d'affaires** : 50 % × 1 000 = **+500** au CR\n- Quote-part de **charges** : 50 % × 800 = **−400** au CR\n- **Effet sur le résultat de A = +100**\n\n→ **Bilan de A :** +450 d'actifs et +150 de passifs **éclatés par nature** (pas de ligne « participation »). **Total de bilan gonflé** de 450 ; **dettes** +150.\n→ **CR de A :** +500 de produits et −400 de charges **dans les agrégats** → le **CA publié par A inclut sa part du CA de P**.\n\n---\n**HYPOTHÈSE 2 — P est une *joint venture*** (droits sur l'actif net) → **MEE**. A comptabilise **une seule ligne** :\n- Coût initial (apport) : 200\n- + Quote-part de résultat (50 % × 200) : **+100**\n- − Dividendes : 0\n- **= Valeur comptable (fin N) = 300**\n\n*Vérification : 50 % × actif net 600 = **300** — cohérent (P créée à la JV, sans goodwill).*\n\n→ **Bilan de A :** **une ligne** « Participation MEE » de **300** ; **aucun** actif/passif de P éclaté, **aucune dette** de P remontée.\n→ **CR de A :** **une seule ligne** « quote-part de résultat des coentreprises » de **+100** ; le **CA de A n'inclut PAS** le CA de P.\n\n---\n**CONCLUSION — comparaison (même 50 %, même résultat +100) :**\n\n| Indicateur chez A | Joint operation | Joint venture (MEE) |\n|---|---|---|\n| Résultat net | **+100** | **+100** *(identique)* |\n| Total de bilan | **+450** | **+300** |\n| Dettes affichées | **+150** | **0** |\n| CA publié | **+500** | **0** |\n\n**Le résultat net est le MÊME**, mais la *joint operation* **gonfle le total de bilan, le CA et l'endettement affichés**, tandis que la MEE les **comprime en une ligne nette**. D'où l'enjeu des **ratios** (taux d'endettement, marge sur CA, rotation de l'actif) : la classification **change la lecture** de la structure financière **sans** changer le résultat — c'est exactement ce qu'IFRS 11 a voulu **discipliner** en supprimant le **libre choix** de l'intégration proportionnelle."}, {"type": "journal", "title": "Écritures de l'hypothèse 2 (joint venture / MEE) chez A", "note": "Apport initial au coût, puis quote-part de résultat. VC finale = 200 + 100 = 300.", "lines": [{"compte": "Participation dans la coentreprise (initial)", "debit": 200}, {"compte": "Trésorerie", "credit": 200}, {"compte": "Participation dans la coentreprise (QP résultat)", "debit": 100}, {"compte": "Quote-part de résultat des coentreprises (CR)", "credit": 100}]}, {"type": "callout", "tone": "tip", "title": "Le réflexe chiffré qui rapporte les points", "text": "Sur une question chiffrée, **conclure systématiquement sur les trois effets** de la classification : **total de bilan**, **CA / charges affichés** et **endettement** — en **soulignant** que le **résultat net reste identique** entre *joint operation* et *joint venture*, mais que bilan, CA et dettes **diffèrent fortement**."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Joint operation (50 %, ligne à ligne)", "color": "indigo", "items": ["Quote-part **actifs** : 50 % × 900 = **+450**", "Quote-part **passifs / dettes** : 50 % × 300 = **+150**", "Quote-part **CA** : 50 % × 1 000 = **+500**", "Quote-part **charges** : 50 % × 800 = **−400**", "**Résultat net : +100**", "→ Total de bilan **gonflé**, dettes et CA **remontés**"]}, {"title": "Joint venture (50 %, MEE)", "color": "emerald", "items": ["**Une ligne** « Participation MEE » : 200 + 100 = **300**", "Dettes de P remontées : **0**", "CA de P inclus : **0**", "QP de résultat (une ligne au CR) : **+100**", "**Résultat net : +100** *(identique)*", "→ Bilan, CA et dettes **comprimés** en une ligne nette"]}], "caption": "**Même 50 %, même résultat net (+100)** — mais la *joint operation* affiche **+450** de bilan, **+150** de dettes et **+500** de CA, là où la MEE n'affiche **qu'une ligne nette de 300**. C'est exactement la lecture des **ratios** (endettement, marge, rotation) qu'IFRS 11 a voulu **discipliner**."}]}, {"title": "🗂️ IFRS 11 vs Swiss GAAP RPC 30 vs CO", "blocks": [{"type": "compare", "title": "IFRS 11 vs Swiss GAAP RPC 30 vs CO art. 963-963b", "rows": [{"crit": "Notion d'entrée", "ifrs": "**Contrôle conjoint** (consentement **unanime** sur les activités pertinentes)", "rpc": "**Contrôle commun** / direction conjointe d'une coentreprise", "co": "Pas de définition ; renvoi au **référentiel reconnu** (art. 963b)"}, {"crit": "Typologie", "ifrs": "**Deux types** : *joint operation* (actifs/passifs) vs *joint venture* (actif net)", "rpc": "Notion de **coentreprise** (sans la dichotomie systématique)", "co": "—"}, {"crit": "Coentreprise — méthode", "ifrs": "**MEE obligatoire (IAS 28)** ; **intégration proportionnelle INTERDITE**", "rpc": "**Intégration proportionnelle AUTORISÉE** (méthode admise) **ou** MEE", "co": "Selon référentiel choisi"}, {"crit": "Activité conjointe", "ifrs": "Comptabilisation **directe** (droits/obligations, ligne à ligne)", "rpc": "Approche par **quote-part** également possible", "co": "Selon référentiel choisi"}, {"crit": "Critère de classement", "ifrs": "**Substance** : droits & obligations (forme juridique **réfutable** par contrat + faits)", "rpc": "Plus **souple**, accent sur la **direction conjointe**", "co": "—"}, {"crit": "Goodwill (coentreprise)", "ifrs": "Inclus dans la VC de la MEE, **non amorti**, test de dépréciation global (IAS 36)", "rpc": "Goodwill **amortissable** **ou** imputable aux **fonds propres**", "co": "Selon référentiel choisi"}, {"crit": "Apports / transactions avec l'accord", "ifrs": "Profit reconnu **seulement** à hauteur des **autres parties**", "rpc": "Élimination des résultats internes (proportion)", "co": "Selon référentiel choisi"}, {"crit": "Informations à fournir", "ifrs": "**IFRS 12** (intérêts, risques, données financières résumées)", "rpc": "Annexe RPC (moins détaillée)", "co": "Annexe légale"}, {"crit": "Obligation de consolider", "ifrs": "Via **IFRS 10** (groupe)", "rpc": "Selon **seuils** RPC ; exemptions", "co": "**Obligation légale** (art. 963), **exemptions** (art. 963a), comptes selon **norme reconnue** (art. 963b)"}]}, {"type": "callout", "tone": "key", "title": "LA divergence à retenir absolument", "text": "Pour les **coentreprises**, **IFRS 11 INTERDIT** l'intégration proportionnelle (**MEE imposée**), tandis que **RPC 30 l'AUTORISE encore**. Un même groupe à 50 % d'une JV affichera donc, sous **IFRS**, une **ligne nette unique** (MEE), mais pourra remonter sous **RPC** **50 % de chaque actif, passif, produit et charge** (intégration proportionnelle) → des **ratios d'endettement et de CA très différents**. Le **CO** ne tranche **aucune** méthode : il **impose la consolidation** (art. 963) et **renvoie au référentiel reconnu** retenu (art. 963b)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "IFRS 11", "color": "indigo", "items": ["**Deux types** : *joint operation* vs *joint venture*", "Coentreprise → **MEE obligatoire (IAS 28)**", "**Intégration proportionnelle INTERDITE**", "Classement par **substance** (droits/obligations)", "*Disclosures* → **IFRS 12**"]}, {"title": "Swiss GAAP RPC 30", "color": "emerald", "items": ["Notion de **coentreprise** (sans dichotomie systématique)", "**Intégration proportionnelle AUTORISÉE** ou MEE", "Accent sur la **direction conjointe** (plus souple)", "Goodwill **amortissable** ou imputable aux fonds propres", "Annexe RPC (moins détaillée)"]}, {"title": "CO art. 963-963b", "color": "amber", "items": ["**Aucune** méthode imposée", "Renvoi au **référentiel reconnu** (art. 963b)", "**Consolidation obligatoire** (art. 963)", "**Exemptions** de seuils (art. 963a)", "Annexe légale"]}], "caption": "**LA divergence à retenir** : pour les coentreprises, **IFRS 11 INTERDIT** l'intégration proportionnelle (MEE imposée) là où **RPC 30 l'AUTORISE encore** → ratios d'endettement et de CA **très différents**. Le **CO** ne tranche aucune méthode : il **impose** la consolidation et **renvoie** au référentiel reconnu."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Confondre contrôle conjoint et contrôle d'un majoritaire", "text": "Le contrôle conjoint exige le **consentement UNANIME** sur les activités pertinentes. Si **une** partie peut décider seule (majorité simple suffit), il n'y a **pas** de contrôle conjoint → **contrôle (IFRS 10)** ou **influence notable (IAS 28)**, **pas** IFRS 11."}, {"type": "callout", "tone": "warn", "title": "Classer d'après la forme juridique seule", "text": "La **forme** (SA, SARL, *partnership*) n'est qu'**un facteur**, **réfutable** par les **termes contractuels** et les **autres faits & circonstances**. Une entité à responsabilité limitée peut être une ***joint operation*** si le contrat attribue les droits/obligations aux parties."}, {"type": "callout", "tone": "warn", "title": "Oublier le facteur « autres faits & circonstances »", "text": "La **dépendance quasi-totale** du partenariat envers les parties (achat de **toute** la production, financement par les achats) bascule la qualification en ***joint operation*** **malgré** un véhicule distinct. **Piège n°1 de l'examen.**"}, {"type": "callout", "tone": "warn", "title": "Appliquer encore l'intégration proportionnelle aux coentreprises", "text": "**Supprimée depuis 2013** (fin d'IAS 31). Une **JV** se comptabilise **obligatoirement en MEE** sous IFRS. (L'intégration proportionnelle survit en **RPC 30**, pas en IFRS — ne pas mélanger les référentiels.)"}, {"type": "callout", "tone": "warn", "title": "Croire que la joint operation est une « intégration proportionnelle »", "text": "Non — c'est une **comptabilisation directe de droits et obligations** définis par le **contrat**, qui peuvent **différer** du % de détention (ex. 50 % du capital mais 60 % des coûts assumés). On reprend les **droits réels**, pas mécaniquement un pourcentage."}, {"type": "callout", "tone": "warn", "title": "Penser que sans véhicule on peut avoir une coentreprise", "text": "**Impossible.** **Sans véhicule distinct → toujours une *joint operation*** (pas d'« actif net » sans entité support). Inutile de dérouler les facteurs 2 à 4."}, {"type": "callout", "tone": "warn", "title": "Négliger les transactions avec l'accord", "text": "À l'**apport** d'un actif non monétaire ou à la **vente** à la *joint operation*, le profit n'est reconnu qu'à hauteur des **intérêts des autres parties** ; la **part propre est différée** jusqu'à revente à un tiers."}, {"type": "callout", "tone": "info", "title": "Ne pas mélanger IFRS 11 et IFRS 12", "text": "IFRS 11 traite la **qualification et la comptabilisation** ; **IFRS 12** traite les **informations à fournir** (annexe). Une question sur les *disclosures* renvoie à **IFRS 12**. Et pour la *joint operation*, ne pas oublier la **cohérence** comptes individuels / consolidés (même traitement)."}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "SFTA", "items": [{"l": "S", "t": "**Structure** — pas de véhicule distinct → *joint operation* (point final)."}, {"l": "F", "t": "**Forme juridique** — responsabilité limitée (SA/SARL) → présume *joint venture* ; transparence → *joint operation*."}, {"l": "T", "t": "**Termes contractuels** — peuvent **renverser** la forme (droits sur actifs / garanties de dettes → *joint operation*)."}, {"l": "A", "t": "**Autres faits & circonstances** — dépendance économique (achat de toute la production) → *joint operation*, le piège n°1."}], "phrase": "« **S**tructure → **F**orme → **T**ermes → **A**utres faits » — la cascade de classification, dans l'ordre. Les facteurs **T** et **A** peuvent **renverser** la forme juridique."}, {"type": "keypoints", "title": "Structurer une réponse IFRS 11 (les 4 ancrages qui rapportent les points)", "accent": "emerald", "items": ["**Qualifier le contrôle conjoint d'abord** : (a) accord **contractuel** + (b) **consentement UNANIME** sur les activités pertinentes (chacun peut **bloquer**). Si une seule partie décide → **IFRS 10** ou **IAS 28**.", "**Classifier via la cascade** : (1) structure → (2) forme juridique → (3) termes contractuels → (4) autres faits & circonstances. **Toujours** rappeler que la forme est **réfutable** et **citer** la **dépendance économique** (→ *joint operation*).", "**Déduire la comptabilisation** : *joint operation* → **directe** (actifs/passifs/produits/charges, **identique** indiv./conso, **pas** de MEE) ; *joint venture* → **MEE (IAS 28)**, `VC = coût + QP résultat ± QP OCI − dividendes − dépréciation`. **Intégration proportionnelle interdite.**", "**Réflexe suisse + impacts** : opposer **RPC 30** (intégration proportionnelle des JV **autorisée** — divergence majeure) et **CO art. 963-963b** (consolidation obligatoire, exemptions 963a, norme reconnue). Si chiffré, **conclure sur les trois effets** : **total de bilan**, **CA/charges affichés**, **endettement** — **résultat net identique**."]}, {"type": "callout", "tone": "key", "title": "Toujours conclure sur l'impact de la classification", "text": "Même 50 %, même **résultat net** — mais **total de bilan**, **chiffre d'affaires/charges** et **endettement** **diffèrent** : gonflés en *joint operation* (ligne à ligne), comprimés en **une ligne nette** en MEE (*joint venture*)."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste ta maîtrise d'IFRS 11", "questions": [{"q": "Quelle condition UNIQUE caractérise le contrôle conjoint ?", "options": ["Détenir au moins 50 % des droits de vote du partenariat", "Les décisions sur les activités pertinentes exigent le consentement UNANIME des parties partageant le contrôle", "Exercer une influence notable présumée dès 20 %", "Disposer de la majorité simple au conseil du véhicule"], "answer": 1, "explain": "Le contrôle conjoint n'existe que lorsque les décisions sur les activités pertinentes requièrent le consentement UNANIME des parties partageant le contrôle : aucune ne peut décider seule, chacune peut bloquer (veto de fait). Ce n'est ni une question de seuil de % ni d'influence notable."}, {"q": "Quels sont les deux types de partenariats et le critère qui les sépare ?", "options": ["Filiale (contrôle) vs associée (influence notable)", "Activité conjointe (droits sur l'actif net) vs coentreprise (droits sur actifs/passifs)", "Activité conjointe (droits sur les actifs + obligations sur les passifs) vs coentreprise (droits sur l'actif NET)", "Intégration globale vs intégration proportionnelle"], "answer": 2, "explain": "Activité conjointe (*joint operation*) = droits sur les actifs ET obligations au titre des passifs. Coentreprise (*joint venture*) = droits sur l'actif NET seulement. C'est l'opposition-clé d'où découle toute la comptabilisation. (L'option 2 inverse les définitions : piège classique.)"}, {"q": "Comment un coparticipant comptabilise-t-il une activité conjointe (joint operation) ?", "options": ["Par mise en équivalence, une seule ligne « participation » au bilan", "Par intégration globale avec intérêts minoritaires", "Directement : ses actifs, passifs, produits et charges (quote-part), ligne à ligne, sans MEE", "À la juste valeur par résultat (IFRS 9)"], "answer": 2, "explain": "Le coparticipant comptabilise DIRECTEMENT ses actifs, passifs, produits et charges (y compris sa quote-part des éléments communs), ligne à ligne, et de façon IDENTIQUE dans ses comptes individuels et consolidés. Pas de compte unique « participation », pas de MEE."}, {"q": "Quelle méthode s'applique à une coentreprise (joint venture), et qu'est-il INTERDIT ?", "options": ["Intégration proportionnelle ; la MEE est interdite", "Mise en équivalence (IAS 28) ; l'intégration proportionnelle (ex-IAS 31) est interdite", "Intégration globale ; la juste valeur est interdite", "Au choix MEE ou intégration proportionnelle, comme sous IAS 31"], "answer": 1, "explain": "Une coentreprise (droits sur l'actif net) se comptabilise par mise en équivalence (IAS 28). L'intégration proportionnelle, jadis admise sous IAS 31, est désormais INTERDITE sous IFRS depuis 2013 — c'est l'innovation majeure d'IFRS 11. (Elle reste tolérée en RPC 30.)"}, {"q": "Un partenariat SANS véhicule distinct : quel type, nécessairement ?", "options": ["Une coentreprise, par défaut", "Indéterminé tant qu'on n'a pas examiné la forme juridique", "Toujours une activité conjointe (joint operation)", "Hors champ d'IFRS 11"], "answer": 2, "explain": "Sans véhicule distinct, les actifs et passifs sont détenus/assumés directement par les parties : c'est NÉCESSAIREMENT une joint operation. Impossible d'avoir des droits sur un « actif net » sans entité support. On ne déroule pas les facteurs 2 à 4."}, {"q": "Dans quel ordre examine-t-on les facteurs pour classer un partenariat AVEC véhicule distinct ?", "options": ["Forme juridique → s
