l sans flux de trésorerie obligatoire."}, {"type": "keypoints", "title": "À retenir", "accent": "teal", "items": ["**5 états en RPC complet** : bilan · compte de résultat · **tableau de financement** · annexe · **tableau de variation des CP**.", "**Image fidèle** (*true and fair view*) — pas seulement la conformité légale : c'est l'**objectif supérieur** des RPC.", "**Tableau de financement = 3 catégories** : exploitation · investissement · financement (méthode **directe ou indirecte**).", "**Bilan** : actif **circulant / immobilisé** ; passif **fonds étrangers / capitaux propres**, par **liquidité / exigibilité** décroissante.", "**Compte de résultat** : par **nature** (production) **ou** par **fonction** (coût des ventes) — au choix.", "**Annexe** : principes comptables, méthodes, et toutes les informations nécessaires à la compréhension.", "**Comparatif obligatoire** : chiffres de l'**exercice précédent** sur tous les états."]}, {"type": "callout", "tone": "info", "title": "Deux niveaux d'application RPC", "text": "- **RPC fondamentales (Kern-FER / socle)** : pour les PME. Cadre + RPC 1 à 6 (env.). Jeu d'états **réduit** (pas de tableau de financement obligatoire).\n- **Swiss GAAP RPC entiers (complet)** : on ajoute les modules thématiques (consolidation, impôts différés, instruments, etc.). Jeu d'états **complet** avec **tableau de financement** et **tableau de variation des capitaux propres**.\n\nUn **groupe** qui consolide (RPC 30) applique nécessairement le référentiel **complet**."}, {"type": "diagram", "kind": "flow", "title": "Les 5 états d'un jeu Swiss GAAP RPC complet", "steps": [{"label": "① Bilan", "sub": "Actif circulant / immobilisé · fonds étrangers / propres (liquidité ⇣)"}, {"label": "② Compte de résultat", "sub": "Par nature ou par fonction → résultat de l'exercice"}, {"label": "③ Tableau de financement", "sub": "RPC 4 — flux de trésorerie en 3 catégories (E·I·F)"}, {"label": "④ Annexe", "sub": "RPC 6 — principes, méthodes, détails, engagements, parties liées"}, {"label": "⑤ Variation des CP", "sub": "RPC 24 — capital, agio, réserves, actions propres en déduction"}], "accent": "teal", "caption": "Mnémo **BC-TAV** : Bilan · Compte de résultat · Tableau de financement · Annexe · Variation des CP. Le **socle (Kern-FER)** s'arrête aux 3 premiers (sans ③ ni ⑤)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "RPC fondamentales (Kern-FER / socle)", "color": "amber", "items": ["Pour les **PME**", "Cadre conceptuel + RPC 1 à 6", "Jeu **réduit** : bilan · résultat · annexe", "**Pas** de tableau de financement obligatoire", "**Pas** de tableau de variation des CP"]}, {"title": "Swiss GAAP RPC entiers (complet)", "color": "teal", "items": ["PME, groupes, entités cherchant la comparabilité", "Socle **+** modules (conso, impôts différés, instruments…)", "Jeu **complet : 5 états**", "**Tableau de financement** obligatoire (RPC 4)", "**Variation des CP** obligatoire (RPC 24)"]}], "caption": "Un **groupe** qui consolide (RPC 30) applique nécessairement le référentiel **complet** — donc les 5 états."}]}, {"title": "🧱 Le bilan — structure", "blocks": [{"type": "intro", "text": "Le **bilan** RPC oppose, à l'actif, les éléments selon leur **degré de liquidité** et, au passif, selon leur **degré d'exigibilité**. Le grand partage est :\n- **Actif** : actif **circulant** (réalisable/consommé dans le cycle d'exploitation ou ≤ 12 mois) vs actif **immobilisé** (destiné durablement à l'activité).\n- **Passif** : **capitaux étrangers** (*fonds étrangers* = dettes) vs **capitaux propres** (*fonds propres*).\n\nLes capitaux étrangers se subdivisent en **dettes à court terme** (exigibles ≤ 12 mois) et **dettes à long terme** (> 12 mois), provisions comprises. La présentation et les principales rubriques sont très proches de celles du **CO (art. 959a)**, ce qui n'est pas un hasard : RPC s'aligne sur la logique de classement légale, mais ajoute l'exigence d'**image fidèle** (réévaluations, dépréciations, pas de réserves latentes arbitraires)."}, {"type": "table", "title": "Structure type du bilan RPC", "headers": ["ACTIF", "PASSIF"], "rows": [["**ACTIF CIRCULANT**", "**CAPITAUX ÉTRANGERS À COURT TERME**"], ["Liquidités (caisse, postaux, banques, dépôts ≤ 90 j)", "Dettes financières à court terme"], ["Créances résultant de ventes & prestations", "Dettes résultant d'achats & prestations"], ["Autres créances à court terme", "Autres dettes à court terme · passifs de régularisation"], ["Stocks & prestations non facturées", "Provisions à court terme"], ["Actifs de régularisation (comptes de régul.)", "**CAPITAUX ÉTRANGERS À LONG TERME**"], ["**ACTIF IMMOBILISÉ**", "Dettes financières à long terme"], ["Immobilisations financières · participations", "Provisions à long terme"], ["Immobilisations corporelles", "**CAPITAUX PROPRES**"], ["Immobilisations incorporelles (dont goodwill)", "Capital · réserves de capital (agio) · réserves de bénéfices · (actions propres en déduction)"]]}, {"type": "callout", "tone": "key", "title": "Le critère du classement : 12 mois (ou cycle d'exploitation)", "text": "Un élément est **court terme / circulant** s'il est réalisé, consommé ou exigible dans le **cycle normal d'exploitation** ou, à défaut, dans les **12 mois** suivant la date de clôture. Sinon il est **long terme / immobilisé**. C'est exactement la logique d'**IAS 1** (*current vs non-current*), mais présentée en **ordre de liquidité décroissante** côté actif (liquidités en haut), comme au **CO**."}, {"type": "callout", "tone": "warn", "title": "Piège : pas de réserves latentes \"libres\" en RPC", "text": "Au **CO**, on peut constituer des **réserves latentes arbitraires** (sous-évaluation prudente d'actifs, sur-provisionnement). En **RPC**, l'objectif d'**image fidèle** les **proscrit** : un actif est évalué à sa valeur économique, une provision répond à une obligation réelle. C'est **la** différence de philosophie entre le bilan RPC et le bilan fiscal/CO."}]}, {"title": "📊 Le compte de résultat — nature ou fonction", "blocks": [{"type": "intro", "text": "RPC laisse le **choix** de la présentation du compte de résultat, exactement comme le **CO (art. 959b)** et **IAS 1** :\n- **Par nature** (*Gesamtkostenverfahren*, « méthode de la production totale ») : on liste les **produits** puis les **charges classées par nature** (matières, personnel, amortissements, autres charges). La **variation des stocks** de produits finis et en-cours et les **travaux portés à l'actif** apparaissent en correction.\n- **Par fonction** (*Umsatzkostenverfahren*, « méthode du coût des ventes ») : on déduit du chiffre d'affaires le **coût des prestations vendues**, puis les charges par **destination** (administration, distribution, R&D).\n\nDans les deux cas on aboutit au même **résultat de l'exercice**. Si l'entité choisit le format **par fonction**, RPC (comme IAS 1) demande de fournir en **annexe** une ventilation des **charges par nature** (notamment **personnel** et **amortissements**), sans quoi l'information serait perdue."}, {"type": "table", "title": "Compte de résultat par NATURE vs par FONCTION", "headers": ["Par NATURE (production totale)", "Par FONCTION (coût des ventes)"], "rows": [["Produits nets des ventes & prestations", "Produits nets des ventes & prestations"], ["± Variation des stocks de produits finis / en-cours", "− Coût des prestations / produits vendus"], ["+ Prestations propres activées (travaux à l'actif)", "**= Marge brute**"], ["− Charges de matières & marchandises", "− Charges de distribution"], ["− Charges de personnel", "− Charges d'administration"], ["− Amortissements & corrections de valeur", "− (Recherche & développement)"], ["− Autres charges d'exploitation", "± Autres produits / charges d'exploitation"], ["**= Résultat d'exploitation (EBIT)**", "**= Résultat d'exploitation (EBIT)**"], ["± Résultat financier · ± résultat hors exploitation", "± Résultat financier · ± résultat hors exploitation"], ["− Impôts → **= Résultat de l'exercice**", "− Impôts → **= Résultat de l'exercice**"]]}, {"type": "keypoints", "title": "Réflexes compte de résultat", "accent": "indigo", "items": ["**Par nature** : la **variation de stocks** et les **prestations activées** sont des **postes correcteurs** (sinon les charges seraient surévaluées).", "**Par fonction** : information **par nature** des charges (personnel, amortissements) **obligatoire en annexe**.", "On distingue **résultat d'exploitation**, **résultat financier** et **résultat hors exploitation / exceptionnel** pour la lisibilité.", "Comme partout en RPC : **colonne comparative N-1** obligatoire."]}, {"type": "callout", "tone": "tip", "title": "Mémo nature vs fonction", "text": "**NATURE = QUOI** on a dépensé (salaires, matières, amortissements). **FONCTION = POUR QUOI** (production vendue, distribution, administration). La méthode par **fonction** colle mieux au reporting de gestion mais exige une **comptabilité analytique** pour ventiler le coût des ventes."}]}, {"title": "💧 RPC 4 — Tableau de financement (flux de trésorerie)", "blocks": [{"type": "intro", "text": "Le **tableau de financement** (= **tableau des flux de trésorerie**, *Geldflussrechnung*) est régi par **RPC 4**. Il explique **comment** la trésorerie a varié sur l'exercice, en répartissant les flux en **trois catégories** — exactement la logique d'**IAS 7** :\n- **Flux d'exploitation** (*operating*) : flux générés par l'activité courante (encaissements clients, décaissements fournisseurs et personnel, impôts).\n- **Flux d'investissement** (*investing*) : acquisitions et cessions d'**immobilisations** (corporelles, incorporelles, financières), prises de participations.\n- **Flux de financement** (*financing*) : mouvements sur **emprunts**, **capital** (augmentation/réduction), **dividendes** versés.\n\nLa **somme des trois** = variation nette des **liquidités** sur la période. RPC définit les **liquidités** (*fonds* du tableau) comme la **caisse, les avoirs postaux et bancaires, et les placements à très court terme** (échéance ≤ **90 jours**, facilement convertibles, risque négligeable)."}, {"type": "steps", "title": "Construire le tableau de financement", "accent": "teal", "steps": [{"t": "① Définir le \"fonds\" = liquidités", "d": "Caisse + avoirs postaux/bancaires + placements à court terme **≤ 90 jours**. On explique la **variation** de ce fonds entre l'ouverture et la clôture."}, {"t": "② Flux d'EXPLOITATION (direct ou indirect)", "d": "**Méthode directe** : encaissements clients − décaissements (fournisseurs, personnel, impôts). **Méthode indirecte** : on part du **résultat**, on **neutralise les charges/produits sans effet de trésorerie** (amortissements, provisions) et on ajuste la **variation du besoin en fonds de roulement** (créances, stocks, dettes)."}, {"t": "③ Flux d'INVESTISSEMENT", "d": "− Acquisitions d'immobilisations (corporelles, incorporelles, financières), de participations ; + produits de cessions. **Signe** : sorties négatives, entrées positives."}, {"t": "④ Flux de FINANCEMENT", "d": "± Variation des dettes financières (emprunts contractés / remboursés) ; + augmentations de capital ; − dividendes versés ; − rachats d'actions propres."}, {"t": "⑤ Réconcilier", "d": "Exploitation + Investissement + Financement = **variation nette des liquidités**. On la rapproche de la **différence des soldes de liquidités** au bilan (ouverture → clôture). Si ça ne boucle pas, il y a une erreur."}]}, {"type": "table", "title": "Méthode DIRECTE vs INDIRECTE (flux d'exploitation)", "headers": ["Aspect", "Méthode DIRECTE", "Méthode INDIRECTE"], "rows": [["Point de départ", "Encaissements / décaissements bruts", "**Résultat** de la période"], ["Logique", "Flux de trésorerie réels poste par poste", "Résultat **retraité** des éléments sans cash + Δ BFR"], ["Lisibilité", "Très intuitive (vrais flux)", "Montre le **lien résultat ⇆ cash**"], ["En pratique", "Plus rare (données détaillées requises)", "**Très majoritaire**"], ["Investissement & financement", "Toujours en **méthode directe**", "Toujours en **méthode directe**"]]}, {"type": "callout", "tone": "key", "title": "Les 3 catégories — la règle d'or du classement", "text": "**EXPLOITATION** = l'activité qui crée le résultat (*operating*). **INVESTISSEMENT** = ce qui modifie l'outil de production long terme (immobilisations, participations). **FINANCEMENT** = ce qui modifie la structure de financement (dettes financières, capital, dividendes).\n\n**Mnémo : E-I-F** (Exploitation, Investissement, Financement) — toujours dans cet ordre."}, {"type": "callout", "tone": "warn", "title": "Pièges de classement fréquents", "text": "- **Intérêts versés / reçus** et **dividendes reçus** : classement à préciser et **constant** d'un exercice à l'autre (souvent en exploitation ; les **dividendes versés** vont en **financement**).\n- **Acquisition d'une filiale** : le prix payé **net de la trésorerie acquise** est un flux d'**investissement** — pas d'exploitation.\n- Une **augmentation de capital par incorporation de réserves** ou une **conversion de dette en capital** sont des opérations **sans flux de trésorerie** : à mentionner hors tableau (ou en annexe), pas dans les trois catégories.\n- Les **amortissements ne sont PAS un flux** : en méthode indirecte on les **rajoute** au résultat, c'est tout."}, {"type": "diagram", "kind": "flow", "title": "Tableau de financement RPC 4 — les 3 catégories (mnémo E-I-F)", "steps": [{"label": "Flux d'EXPLOITATION", "sub": "Activité courante : encaissements clients − fournisseurs / personnel / impôts (méthode directe ou indirecte)"}, {"label": "Flux d'INVESTISSEMENT", "sub": "Outil de production : ± immobilisations corporelles / incorporelles / financières, participations"}, {"label": "Flux de FINANCEMENT", "sub": "Structure de financement : ± emprunts, + augmentation de capital, − dividendes, − actions propres"}, {"label": "= VARIATION des liquidités", "sub": "Somme E+I+F = Δ trésorerie (fonds ≤ 90 j) ; à réconcilier avec les soldes de liquidités au bilan"}], "accent": "teal", "caption": "Logique d'**IAS 7**. Toujours dans l'ordre **E → I → F**, dont la somme explique la variation nette des liquidités de l'exercice."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "Méthode DIRECTE", "color": "cyan", "items": ["Part des **encaissements / décaissements bruts**", "Flux de trésorerie réels, poste par poste", "Très **intuitive** (vrais flux)", "Plus **rare** (données détaillées requises)"]}, {"title": "Méthode INDIRECTE", "color": "indigo", "items": ["Part du **résultat** de la période", "**+** charges sans cash (amortissements, provisions)", "**±** variation du BFR (créances, stocks, dettes)", "Montre le **lien résultat ⇆ cash** · **très majoritaire**"]}, {"title": "Investissement & financement", "color": "slate", "items": ["**Toujours** présentés en **méthode directe**", "Le choix direct / indirect ne concerne que l'**exploitation**", "Mouvements bruts d'immobilisations, d'emprunts, de capital"]}], "caption": "Le choix **direct vs indirect** ne porte que sur le **flux d'exploitation** ; investissement et financement sont toujours en flux directs."}]}, {"title": "📝 RPC 6 — L'annexe", "blocks": [{"type": "intro", "text": "L'**annexe** (*Anhang*) — cadre **RPC 6** — complète le bilan, le compte de résultat et le tableau de financement par les informations nécessaires à une **appréciation correcte** de la situation. Sans l'annexe, les chiffres ne sont pas interprétables : c'est elle qui dit **selon quelles règles** ils ont été établis et **ce qui se cache** derrière les postes.\n\nElle comprend typiquement :\n- les **principes régissant l'établissement des comptes** (référentiel RPC appliqué : socle ou complet) ;\n- les **principes comptables et méthodes d'évaluation** retenus (amortissements, stocks, provisions, conversion de monnaies, etc.) et tout **changement** de méthode ;\n- les **explications des postes** du bilan et du compte de résultat (détails, ventilations, mouvements) ;\n- les **engagements conditionnels** (cautionnements, garanties), engagements de leasing, **dettes envers institutions de prévoyance** ;\n- les **événements postérieurs** à la date de clôture (logique proche d'IAS 10) ;\n- les **transactions avec des parties liées** significatives."}, {"type": "keypoints", "title": "Contenu clé de l'annexe RPC", "accent": "emerald", "items": ["**Référentiel & principes** : socle ou complet ; base d'évaluation.", "**Méthodes d'évaluation** : amortissements, stocks, provisions, conversion de devises — et **changements** de méthode.", "**Détail des postes** : ventilations et **tableaux de mouvements** (immobilisations, provisions).", "**Engagements conditionnels** et hors bilan (cautions, garanties, leasing).", "**Parties liées** : nature et montant des transactions significatives.", "**Événements postérieurs** à la clôture (ajustables / non ajustables — cf. RPC 6, esprit d'IAS 10)."]}, {"type": "callout", "tone": "info", "title": "Annexe RPC vs annexe CO vs annexe IFRS", "text": "L'annexe **CO (art. 959c)** fixe un **contenu minimal** (raison sociale, nombre d'EPT, sûretés, engagements conditionnels, participations, dettes de prévoyance, événements postérieurs…). L'annexe **RPC** va **plus loin** (méthodes, mouvements, parties liées) au nom de l'image fidèle. L'annexe **IFRS** est **nettement plus volumineuse** (chaque norme a ses propres *disclosures*)."}]}, {"title": "🏛️ RPC 24 — Capitaux propres & actions propres", "blocks": [{"type": "intro", "text": "Le **tableau de variation des capitaux propres** (*Eigenkapitalnachweis*) — cadre **RPC 24** — retrace, **poste par poste**, les mouvements des capitaux propres entre l'ouverture et la clôture. Il rend visibles des opérations qui n'apparaissent ni au bilan (qui ne montre que les soldes) ni totalement au compte de résultat (les mouvements directs en capitaux propres lui échappent).\n\nLes **composantes** des capitaux propres en RPC :\n- le **capital** (capital-actions / capital social) ;\n- les **réserves de capital** (*agio* = prime d'émission, apports) ;\n- les **réserves de bénéfices** (réserves issues du résultat, bénéfice reporté) ;\n- les **actions propres** (*treasury shares*), portées **en déduction** des capitaux propres ;\n- le cas échéant, des **réserves de réévaluation / écarts de conversion** (groupes).\n\n**Actions propres** : RPC 24 impose de les présenter en **déduction** des capitaux propres (et **non** comme un actif). Leur acquisition **réduit** les capitaux propres ; leur revente les **augmente** ; **aucun résultat** n'est dégagé sur ces transactions (le gain/la perte transite par les capitaux propres). C'est la même logique qu'**IAS 32**, et l'**opposé** du vieux réflexe CO qui pouvait les inscrire à l'actif."}, {"type": "table", "title": "Tableau de variation des CP — squelette (RPC 24)", "headers": ["", "Capital", "Réserves de capital (agio)", "Réserves de bénéfices", "Actions propres", "Total CP"], "rows": [["**Solde au 1.1**", "1 000", "200", "850", "(50)", "2 000"], ["Résultat de l'exercice", "—", "—", "+300", "—", "+300"], ["Distribution de dividende", "—", "—", "(120)", "—", "(120)"], ["Augmentation de capital", "+200", "+40", "—", "—", "+240"], ["Achat d'actions propres", "—", "—", "—", "(80)", "(80)"], ["**Solde au 31.12**", "**1 200**", "**240**", "**1 030**", "**(130)**", "**2 340**"]]}, {"type": "callout", "tone": "warn", "title": "Actions propres : jamais un actif, jamais de résultat", "text": "En **RPC 24** (comme **IAS 32**), les **actions propres** sont **soustraites** des capitaux propres. Acheter ses propres actions = **réduire les CP** ; les revendre = **augmenter les CP** ; **aucun gain/perte au compte de résultat**. Inscrire les actions propres à l'**actif** ou comptabiliser un **profit de revente** = **faute** récurrente."}, {"type": "callout", "tone": "tip", "title": "Pourquoi ce tableau existe", "text": "Le bilan ne montre que des **soldes**. Or des opérations majeures (augmentation de capital, dividende, rachat d'actions, écarts de conversion) **traversent directement** les capitaux propres sans passer par le résultat. Le **tableau de variation** est le **seul** état qui les rend toutes visibles d'un coup d'œil — d'où son caractère **obligatoire en RPC complet**."}]}, {"title": "🔢 Exemple — classer les flux (tableau de financement)", "blocks": [{"type": "example", "title": "Ranger 12 opérations dans Exploitation / Investissement / Financement", "statement": "La société **Helvetia SA** (Swiss GAAP RPC complet) présente les opérations de trésorerie suivantes sur l'exercice. **Classez chaque flux** dans la bonne catégorie du tableau de financement RPC 4 (**E** = exploitation, **I** = investissement, **F** = financement, **HORS** = sans effet sur la trésorerie), avec le **signe** (+ entrée / − sortie), puis calculez la **variation nette des liquidités**.\n\n1. Encaissements des clients : **+4 200**\n2. Paiements aux fournisseurs et au personnel : **−3 100**\n3. Impôts sur le bénéfice payés : **−180**\n4. Achat d'une machine de production : **−900**\n5. Cession d'un ancien véhicule : **+60**\n6. Acquisition de 100 % d'une filiale, prix net de trésorerie acquise : **−500**\n7. Nouvel emprunt bancaire long terme : **+700**\n8. Remboursement d'une tranche d'emprunt : **−250**\n9. Augmentation de capital en numéraire (capital +200, agio +40) : **+240**\n10. Dividende versé aux actionnaires : **−120**\n11. Rachat d'actions propres : **−80**\n12. Conversion d'un emprunt de **300** en capital-actions : **0 cash**\n\nLiquidités à l'ouverture : **600**. Bouclez avec le solde de clôture.", "solution": "**① FLUX D'EXPLOITATION (E)**\n- (1) Encaissements clients : **+4 200**\n- (2) Fournisseurs & personnel : **−3 100**\n- (3) Impôts payés : **−180**\n- **Sous-total exploitation = +920**\n\n**② FLUX D'INVESTISSEMENT (I)**\n- (4) Achat machine : **−900**\n- (5) Cession véhicule : **+60**\n- (6) Acquisition filiale (nette de trésorerie acquise) : **−500**\n- **Sous-total investissement = −1 340**\n\n**③ FLUX DE FINANCEMENT (F)**\n- (7) Nouvel emprunt : **+700**\n- (8) Remboursement emprunt : **−250**\n- (9) Augmentation de capital en numéraire : **+240**\n- (10) Dividende versé : **−120**\n- (11) Rachat d'actions propres : **−80**\n- **Sous-total financement = +490**\n\n**④ HORS TABLEAU (sans flux de trésorerie)**\n- (12) Conversion de dette en capital : **0** → opération **non monétaire**, **mentionnée en annexe**, hors des 3 catégories. (Elle modifie pourtant les CP de +300 et les dettes de −300 : on la retrouvera au **tableau de variation des CP**.)\n\n---\n\n**⑤ VARIATION NETTE DES LIQUIDITÉS**\n= Exploitation + Investissement + Financement\n= **+920 − 1 340 + 490 = +70**\n\n**Réconciliation** : Liquidités ouverture **600** + variation **70** = **Liquidités clôture 670**. ✔️\n\n---\n\n**Pièges testés ici :**\n- (6) L'**acquisition de filiale** est un flux d'**investissement** (prix **net** de la trésorerie acquise), pas d'exploitation.\n- (9) vs (10) : l'**augmentation de capital** et le **dividende** sont tous deux en **financement** (mouvements sur les CP/financement), pas en exploitation.\n- (11) Le **rachat d'actions propres** est un flux de **financement** (et réduit les CP au tableau RPC 24).\n- (12) La **conversion dette → capital** est **non monétaire** : 0 dans le tableau de financement, mais bien réelle au **tableau de variation des CP**. Confondre les deux états est l'erreur classique.\n- Les **amortissements** de la machine n'apparaissent **pas** ici en méthode directe ; en méthode **indirecte**, ils seraient **rajoutés** au résultat dans la section exploitation."}, {"type": "table", "title": "Corrigé en une grille", "headers": ["Opération", "Catégorie", "Montant"], "rows": [["Encaissements clients", "Exploitation", "+4 200"], ["Fournisseurs & personnel", "Exploitation", "−3 100"], ["Impôts payés", "Exploitation", "−180"], ["Achat machine", "Investissement", "−900"], ["Cession véhicule", "Investissement", "+60"], ["Acquisition filiale (nette)", "Investissement", "−500"], ["Nouvel emprunt", "Financement", "+700"], ["Remboursement emprunt", "Financement", "−250"], ["Augmentation de capital", "Financement", "+240"], ["Dividende versé", "Financement", "−120"], ["Rachat d'actions propres", "Financement", "−80"], ["Conversion dette → capital", "**HORS** (non monétaire)", "0"], ["**Variation nette des liquidités**", "**E + I + F**", "**+70**"]]}, {"type": "diagram", "kind": "waterfall", "title": "Helvetia SA — variation nette des liquidités (RPC 4)", "items": [{"label": "Liquidités ouverture", "value": 600, "kind": "add"}, {"label": "Flux d'exploitation", "value": 920, "kind": "add"}, {"label": "Flux d'investissement", "value": 1340, "kind": "sub"}, {"label": "Flux de financement", "value": 490, "kind": "add"}, {"label": "= Liquidités clôture", "value": 670, "kind": "total"}], "caption": "600 + 920 − 1 340 + 490 = **670**. La variation nette = **+920 − 1 340 + 490 = +70** ; ouverture 600 + 70 = clôture **670**. ✔️ La conversion dette → capital (300) est **non monétaire** : hors tableau."}]}, {"title": "🗂️ Présentation : RPC vs CO vs IFRS", "blocks": [{"type": "compare", "title": "Présentation des comptes — Swiss GAAP RPC vs CO vs IFRS", "rows": [{"crit": "Objectif primordial", "ifrs": "**Image fidèle** (*fair presentation*, IAS 1) ; *substance over form*", "rpc": "**Image fidèle** (*true and fair view*) ; au-dessus du minimum légal", "co": "Comptes **conformes à la loi** ; **principe de prudence** dominant"}, {"crit": "États obligatoires", "ifrs": "Bilan · résultat & **OCI** · variation des CP · **flux de trésorerie** · notes (IAS 1.10)", "rpc": "Bilan · résultat · **tableau de financement** · annexe · **variation des CP** (complet)", "co": "Bilan · compte de résultat · **annexe** (art. 958)"}, {"crit": "Tableau de flux de trésorerie", "ifrs": "**Obligatoire** (IAS 7), 3 catégories", "rpc": "**Obligatoire en complet** (RPC 4), 3 catégories", "co": "**Non requis** pour la majorité ; exigé surtout pour les **grandes entreprises** (art. 961)"}, {"crit": "Tableau de variation des CP", "ifrs": "**Obligatoire** (IAS 1)", "rpc": "**Obligatoire en complet** (RPC 24)", "co": "**Non requis**"}, {"crit": "Format du compte de résultat", "ifrs": "Par **nature** ou par **fonction** (IAS 1)", "rpc": "Par **nature** ou par **fonction**", "co": "Par **nature** ou par **fonction** (art. 959b)"}, {"crit": "Structure du bilan", "ifrs": "Circulant / non circulant (12 mois) ; *current* en bas", "rpc": "Circulant / immobilisé ; **liquidité décroissante**", "co": "Structure **prescrite** (art. 959a), liquidité décroissante"}, {"crit": "Réserves latentes", "ifrs": "**Interdites**", "rpc": "**Interdites** (image fidèle)", "co": "**Autorisées** (prudence, optimisation fiscale)"}, {"crit": "Volume de l'annexe", "ifrs": "**Très étendu** (disclosures par norme)", "rpc": "Étendu mais **proportionné** (RPC 6)", "co": "**Minimal** (contenu de l'art. 959c)"}, {"crit": "Comparatif N-1", "ifrs": "Obligatoire (parfois 3 bilans)", "rpc": "**Obligatoire**", "co": "**Obligatoire** (art. 958d)"}, {"crit": "Champ d'application", "ifrs": "Sociétés cotées / international", "rpc": "PME & groupes suisses cherchant la **comparabilité**", "co": "**Toutes** les entités tenant une comptabilité"}]}, {"type": "keypoints", "title": "Les contrastes qui rapportent des points", "accent": "amber", "items": ["**Tableau de financement** : **obligatoire** en RPC complet et IFRS ; **généralement absent** au CO (sauf grandes entreprises, art. 961).", "**Réserves latentes** : la grande ligne de fracture — **autorisées au CO**, **interdites** en RPC et IFRS (image fidèle).", "**Tableau de variation des CP** : exigé en RPC complet (RPC 24) et IFRS, **non requis** au CO.", "**Disclosures** : IFRS **>** RPC **>** CO en volume — toujours.", "**Socle commun** : les **trois** acceptent le résultat **par nature ou par fonction** et la **liquidité décroissante** au bilan."]}, {"type": "diagram", "kind": "columns", "cols": [{"title": "IFRS", "color": "indigo", "items": ["**Image fidèle** (*fair presentation*, IAS 1)", "5 états dont **résultat & OCI** et flux de trésorerie", "Flux de trésorerie **obligatoires** (IAS 7)", "Réserves latentes **interdites**", "Annexe **très étendue** (disclosures par norme)"]}, {"title": "Swiss GAAP RPC", "color": "teal", "items": ["**Image fidèle** (*true and fair view*)", "5 états en complet (bilan · résultat · **flux** · annexe · **CP**)", "Flux de trésorerie **obligatoires en complet** (RPC 4)", "Réserves latentes **interdites**", "Annexe étendue mais **proportionnée** (RPC 6)"]}, {"title": "CO (Code des obligations)", "color": "amber", "items": ["Comptes **conformes à la loi** · **prudence** dominante", "3 états : bilan · résultat · **annexe** (art. 958)", "Flux **non requis** (sauf grandes entreprises, art. 961)", "Réserves latentes **autorisées** (optimisation fiscale)", "Annexe **minimale** (art. 959c)"]}], "caption": "Lignes de fracture : **réserves latentes** autorisées au CO mais interdites en RPC/IFRS, et **tableau de financement + variation des CP** obligatoires en RPC complet/IFRS mais absents du CO ordinaire."}]}, {"title": "⚠️ Pièges & réflexes d'examen", "blocks": [{"type": "callout", "tone": "warn", "title": "Ne pas confondre les deux tableaux \"de mouvement\"", "text": "Le **tableau de financement (RPC 4)** explique la variation des **liquidités** (cash). Le **tableau de variation des capitaux propres (RPC 24)** explique la variation des **fonds propres**. Une **conversion de dette en capital** ou une **augmentation de capital par incorporation de réserves** apparaît dans le **second** (mouvement de CP) mais **pas** dans le premier (pas de cash)."}, {"type": "callout", "tone": "warn", "title": "Amortissements & provisions ≠ flux de trésorerie", "text": "En méthode **indirecte**, on **rajoute** les amortissements et **dotations aux provisions** au résultat parce qu'ils l'ont **diminué sans sortie de cash**. Les traiter comme une sortie de trésorerie (ou les oublier) **fausse** tout le flux d'exploitation."}, {"type": "keypoints", "title": "Autres pièges classiques", "accent": "rose", "items": ["**Acquisition de filiale** : flux d'**investissement**, **net** de la trésorerie acquise — jamais en exploitation.", "**Dividendes versés** : flux de **financement** (les **dividendes reçus** peuvent être en exploitation — à classer de façon **constante**).", "**Actions propres** : en **déduction** des CP (RPC 24), **jamais à l'actif**, **aucun résultat** sur l'achat/revente.", "**Par fonction** : ne pas oublier la ventilation des **charges par nature en annexe** (personnel, amortissements).", "**Réserves latentes** : réflexe **CO**, **interdit** en RPC — l'examinateur teste souvent ce contraste.", "**\"Fonds\" du tableau** : ce sont les **liquidités** (≤ 90 jours), pas le fonds de roulement net.", "**Comparatif N-1** : l'oublier sur un état RPC est une erreur de présentation pure et simple."]}]}, {"title": "🧠 Mnémo & citations sûres", "blocks": [{"type": "mnemo", "code": "BC-TAV", "phrase": "« **B**ilan, **C**ompte de résultat, **T**ableau de financement, **A**nnexe, **V**ariation des capitaux propres » — les 5 états du RPC complet tiennent dans **BC-TAV**.", "items": [{"l": "B", "t": "**Bilan** — actif circulant/immobilisé · fonds étrangers/propres (liquidité ⇣)"}, {"l": "C", "t": "**Compte de résultat** — par **nature** ou par **fonction**"}, {"l": "T", "t": "**Tableau de financement** (RPC 4) — 3 catégories : **E**xploitation, **I**nvestissement, **F**inancement"}, {"l": "A", "t": "**Annexe** (RPC 6) — principes, méthodes, détails, engagements, parties liées"}, {"l": "V", "t": "**Variation des capitaux propres** (RPC 24) — capital, agio, réserves, **actions propres en déduction**"}]}, {"type": "keypoints", "title": "Réflexes d'examen (très payant)", "accent": "emerald", "items": ["**Annoncer le jeu complet** : « En RPC entiers, 5 états : bilan, résultat, tableau de financement, annexe, variation des CP. »", "**Tableau de financement** : citer les **3 catégories E-I-F** et préciser **méthode directe ou indirecte** (exploitation).", "**Classer un flux** : se demander d'abord — touche-t-il l'**activité** (E), l'**outil** (I) ou le **financement** (F) ? Sinon **non monétaire** → hors tableau.", "**Compte de résultat** : préciser **nature vs fonction** et, si fonction, **rappeler l'annexe** des charges par nature.", "**Réflexe suisse** : opposer **image fidèle (RPC/IFRS)** vs **prudence & réserves latentes (CO)**.", "**Actions propres** : toujours **en déduction des CP**, **aucun résultat** — réflexe RPC 24 / IAS 32.", "**Citer les numéros sûrs** : RPC 4 (flux), RPC 6 (annexe), RPC 24 (CP) ; CO art. 958–959c ; IAS 1 / IAS 7."]}, {"type": "callout", "tone": "key", "title": "Citations sûres", "text": "**RPC / Swiss GAAP FER** : **RPC 4** (tableau de financement / flux de trésorerie) · **RPC 6** (annexe) · **RPC 24** (capitaux propres) · **RPC 30** (comptes consolidés). **CO** : art. **958** (états & annexe), **959a** (bilan), **959b** (compte de résultat), **959c** (annexe), **961** (tableau de flux pour grandes entreprises). **IFRS** : **IAS 1** (présentation) · **IAS 7** (flux de trésorerie). *(Pour les RPC dont le numéro n'est pas certain, on parle de la notion sans l'attribuer à un numéro précis.)*"}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste-toi (8 questions)", "questions": [{"q": "Quels sont les états financiers d'un jeu Swiss GAAP RPC COMPLET ?", "options": ["Bilan et compte de résultat uniquement", "Bilan, compte de résultat et annexe", "Bilan, compte de résultat, tableau de financement, annexe et tableau de variation des capitaux propres", "Bilan, compte de résultat, OCI et tableau de financement"], "answer": 2, "explain": "En RPC **complet**, le jeu comporte **5 états** : bilan, compte de résultat, **tableau de financement** (RPC 4), **annexe** (RPC 6) et **tableau de variation des capitaux propres** (RPC 24). Le socle (Kern-FER) se limite à bilan + résultat + annexe."}, {"q": "Combien de catégories le tableau de financement (RPC 4) comporte-t-il, et lesquelles ?", "options": ["2 : court terme et long terme", "3 : exploitation, investissement, financement", "4 : exploitation, investissement, financement, exceptionnel", "3 : produits, charges, résultat"], "answer": 1, "explain": "**Trois** catégories — **E**xploitation, **I**nvestissement, **F**inancement — comme IAS 7. Leur somme = la variation nette des **liquidités** (fonds ≤ 90 jours)."}, {"q": "En méthode INDIRECTE, comment traite-t-on les amortissements dans le flux d'exploitation ?", "options": ["On les soustrait du résultat comme une sortie de trésorerie", "On les rajoute au résultat car ils l'ont diminué sans sortie de cash", "On les classe en flux d'investissement", "On les ignore totalement"], "answer": 1, "explain": "Les amortissements (et dotations aux provisions) sont des charges **sans effet de trésorerie** : en méthode indirecte on les **rajoute** au résultat pour reconstituer le cash d'exploitation."}, {"q": "Une société rachète ses propres actions. Comment les présente-t-on en RPC 24 ?", "options": ["À l'actif du bilan, comme un placement", "En déduction des capitaux propres, sans résultat sur la transaction", "En charge au compte de résultat", "En produit financier lors de la revente"], "answer": 1, "explain": "Les **actions propres** sont portées **en déduction** des capitaux propres (RPC 24, comme IAS 32). L'achat **réduit** les CP, la revente les **augmente** ; **aucun gain/perte** ne transite par le résultat."}, {"q": "Dans le tableau de financement, où classe-t-on l'acquisition d'une filiale ?", "options": ["En flux d'exploitation, pour son montant brut", "En flux d'investissement, pour le prix net de la trésorerie acquise", "En flux de financement", "Hors tableau, car non monétaire"], "answer": 1, "explain": "L'achat de participation est un flux d'**investissement**, comptabilisé **net de la trésorerie acquise** dans la filiale. Le confondre avec un flux d'exploitation est un piège classique."}, {"q": "Quelle est LA grande différence de philosophie entre le bilan RPC et le bilan CO ?", "options": ["Le CO interdit les amortissements", "RPC vise l'image fidèle et proscrit les réserves latentes, que le CO autorise", "Le CO impose le tableau de financement, pas RPC", "RPC présente l'actif par exigibilité croissante"], "answer": 1, "explain": "RPC poursuit l'**image fidèle** et **interdit** les réserves latentes ; le **CO**, gouverné par la **prudence**, les **autorise** (sous-évaluation d'actifs, sur-provisions). C'est le contraste central."}, {"q": "Une entreprise convertit un emprunt de 300 en capital-actions. Dans quel(s) état(s) cela apparaît-il ?", "options": ["Dans le tableau de financement, en flux de financement", "Dans le tableau de financement, en flux d'exploitation", "Pas dans le tableau de financement (non monétaire), mais dans le tableau de variation des capitaux propres", "Nulle part, car cela n'a aucun effet"], "answer": 2, "explain": "La conversion dette → capital est une opération **sans flux de trésorerie** : **hors** des 3 catégories du tableau de financement (mention en annexe), mais bien visible au **tableau de variation des CP** (+ capital, − dette)."}, {"q": "Si le compte de résultat est présenté PAR FONCTION, que demande RPC (comme IAS 1) en complément ?", "options": ["Rien de particulier", "Une ventilation des charges PAR NATURE en annexe (personnel, amortissements)", "Un second compte de résultat par nature", "De renoncer au tableau de financement"], "answer": 1, "explain": "Le format **par fonction** masque la nature des charges. RPC (et IAS 1) exigent donc de **ventiler les charges par nature en annexe** — notamment **charges de personnel** et **amortissements**."}]}]}]}, {"code": "RPC 2", "title": "Évaluation (Swiss GAAP RPC)", "icon": "⚖️", "color": "emerald", "tagline": "L'**image fidèle** plutôt que la prudence : on évalue au **coût** mais on **interdit les réserves latentes arbitraires** ; pour certains postes (titres cotés, immeubles de placement), la **valeur actuelle** est admise.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "Les **Swiss GAAP RPC** (en allemand *Swiss GAAP FER*) forment le référentiel comptable suisse de **l'image fidèle** (*true and fair view*). Le **cadre conceptuel** et la **RPC fondamentale** posent le socle de l'évaluation ; quelques recommandations spécialisées en précisent l'application aux **stocks**, aux **immobilisations corporelles**, aux **immeubles**, aux **titres** et aux **engagements de prévoyance**.\n\nL'idée maîtresse à graver : **les RPC cherchent une image fidèle**, ce qui **interdit la sous-évaluation volontaire** (les fameuses *réserves latentes arbitraires* permises par le **Code des obligations**). On évalue **par principe au coût** (acquisition ou production) — mais, pour des postes où une **valeur de marché fiable** existe (titres cotés, immeubles de placement), les RPC **admettent la valeur actuelle** (*valeur réelle*), ce qui rapproche le bilan RPC de la réalité économique.\n\nLes RPC se situent ainsi **entre** le **CO** (prudence, coût maximum, réserves latentes tolérées) et les **IFRS** (juste valeur largement étendue, modèle de réévaluation IAS 16). C'est exactement ce positionnement « du milieu » qui tombe à l'examen."}, {"type": "keypoints", "title": "Les 6 réflexes à ancrer", "accent": "emerald", "items": ["**But = image fidèle** (*true and fair view*) : la sous-évaluation volontaire est **proscrite**.", "**Évaluation de base au coût** : coût d'**acquisition** ou de **production**, diminué des amortissements/dépréciations.", "**Valeurs actuelles admises** pour certains postes : **titres cotés** (cours de bourse) et **immeubles de placement** (valeur de marché).", "**Stocks** : au **plus faible** du coût et de la **valeur nette de réalisation** (*lower of cost or market*).", "**Dépréciation** (*impairment*) : dès qu'il existe des **indices**, comparer la valeur comptable à la **valeur recouvrable**.", "**Prévoyance (RPC 16)** : approche **suisse spécifique** (≠ IAS 19) — on comptabilise la **situation économique** de l'employeur vis-à-vis de l'institution de prévoyance."]}, {"type": "callout", "tone": "key", "title": "La phrase qui résume tout", "text": "**RPC = coût, mais sans réserves latentes arbitraires, avec valeurs actuelles là où c'est pertinent.**\n\nAutrement dit : on garde le **coût** comme ancrage prudent, on **supprime la sur-prudence** du CO (pas de matelas caché), et on **ouvre la porte à la valeur actuelle** pour les actifs dont le marché donne un prix fiable."}, {"type": "callout", "tone": "info", "title": "Pourquoi ce positionnement « du milieu » ?", "text": "Les RPC s'adressent surtout à des **PME, ONG, caisses de pension, associations et groupes non cotés** qui veulent une comptabilité **crédible et lisible** sans la **lourdeur** des IFRS. D'où un compromis : **fiabilité** (coût) **+ pertinence** (valeur actuelle ciblée) **− complexité** (pas de juste valeur généralisée, pas de modèle de réévaluation systématique)."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["Objectif : **prudence** / protection des créanciers", "**Coût d'acquisition au maximum** (art. 960a)", "**Réserves latentes** arbitraires **tolérées**"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["Objectif : **image fidèle** (*true and fair view*)", "Coût, **mais sans réserves latentes** arbitraires", "**Valeur actuelle ciblée** : titres cotés, immeubles de placement"]}, {"title": "IFRS", "color": "indigo", "items": ["Objectif : image fidèle / **pertinence**", "**Juste valeur largement étendue**", "**Modèle de réévaluation** (IAS 16) admis"]}], "caption": "Le positionnement « du milieu » de la RPC : ni la sur-prudence du CO, ni la juste valeur généralisée des IFRS."}]}, {"title": "📐 Notions d'évaluation à manier", "blocks": [{"type": "intro", "text": "Avant les règles, le vocabulaire. L'évaluation RPC se joue sur **trois bases** : le **coût historique**, la **valeur actuelle** (*valeur de marché / valeur réelle*) et la **valeur nette de réalisation**. Bien les distinguer évite la moitié des erreurs."}, {"type": "table", "title": "Le vocabulaire de l'évaluation", "headers": ["Notion", "Définition opérationnelle"], "rows": [["**Coût d'acquisition**", "Prix d'achat **+ frais accessoires** d'acquisition et de mise en service (transport, douane, montage), **diminué** des rabais/escomptes obtenus."], ["**Coût de production**", "Coûts **directs** (matières, main-d'œuvre) **+ part des frais généraux de production** (*overheads*) raisonnablement imputable. **Exclut** les frais d'administration générale et de distribution."], ["**Valeur actuelle / valeur réelle**", "Montant qu'on obtiendrait (ou qu'il faudrait payer) **aujourd'hui**, dans des conditions normales — typiquement un **cours de bourse** (titres cotés) ou une **valeur de marché** (immeubles de placement)."], ["**Valeur nette de réalisation** (VNR)", "Prix de vente **estimé** dans le cours normal des affaires **− coûts** d'achèvement et de vente restant à engager. C'est le **plafond** des stocks."], ["**Valeur recouvrable**", "La **plus élevée** de la valeur d'utilité (flux futurs actualisés générés par l'actif) et de la valeur de cession nette. Sert au **test de dépréciation**."], ["**Réserve latente**", "Écart entre la **valeur réelle** d'un actif et sa **valeur comptable** plus basse (ou un passif surévalué). **Permise et même fréquente au CO** ; **proscrite comme moyen arbitraire** en RPC."]]}, {"type": "callout", "tone": "warn", "title": "Réserve latente : le grand clivage CO ↔ RPC", "text": "Au **CO (art. 960a)**, on évalue au **coût d'acquisition au maximum**, et le législateur **autorise expressément** la constitution de **réserves latentes** (sous-évaluation d'actifs, sur-amortissements, provisions excédentaires) à des fins de **prudence** — voire de lissage du résultat.\n\nEn **RPC**, l'**image fidèle interdit** cette sous-évaluation **volontaire** : les amortissements et dépréciations doivent refléter la **réalité économique**, pas constituer un **matelas caché**. Constituer ou dissoudre des réserves latentes arbitraires pour piloter le résultat est **incompatible** avec les RPC."}, {"type": "callout", "tone": "tip", "title": "Réserve latente ≠ provision justifiée", "text": "Attention au vocabulaire : une **dépréciation économiquement justifiée** (un stock vraiment invendable, une machine obsolète) **n'est pas** une réserve latente arbitraire — elle est **obligatoire** dans les deux référentiels. Ce que la RPC bannit, c'est la **marge de manœuvre** utilisée pour **cacher de la valeur** sans justification économique."}]}, {"title": "⚖️ Principes d'évaluation RPC", "blocks": [{"type": "intro", "text": "Le cadre conceptuel RPC retient un **double étage** d'évaluation. **Étage 1 — le coût** : la règle générale. Tout actif entre au bilan à son **coût d'acquisition ou de production**, puis est suivi **net** des amortissements et des dépréciations. **Étage 2 — la valeur actuelle** : pour des postes **ciblés** où un marché donne un prix **fiable**, les RPC **autorisent** (et parfois **recommandent**) l'évaluation à la **valeur de marché**, plus proche de la réalité que le coût figé du CO."}, {"type": "heading", "text": "Étage 1 — La règle générale : le coût"}, {"type": "keypoints", "title": "Évaluation au coût — l'ossature", "accent": "indigo", "items": ["**Entrée au bilan** = coût d'**acquisition** ou de **production** (frais accessoires inclus).", "**Suivi** = coût **− amortissements systématiques** (sur la durée d'utilité) **− dépréciations** éventuelles.", "**Continuité (going concern)** : les actifs sont évalués comme l'entité **poursuit** son activité (sauf abandon avéré).", "**Permanence des méthodes** : on ne change pas de base d'évaluation d'un exercice à l'autre sans justification (comparabilité).", "**Pas de sur-prudence** : les amortissements/dépréciations sont **économiquement fondés**, ni excessifs (réserve cachée) ni insuffisants."]}, {"type": "heading", "text": "Étage 2 — Les valeurs actuelles admises"}, {"type": "intro", "text": "Les RPC **ne généralisent pas** la juste valeur (à la différence des IFRS), mais l'**admettent pour des postes précis** où un marché actif fournit un prix **objectif et fiable** :"}, {"type": "table", "title": "Où la valeur actuelle est admise", "headers": ["Poste", "Base d'évaluation admise", "Logique"], "rows": [["**Titres cotés** (actifs de la trésorerie / placements)", "**Valeur actuelle = cours de bourse** à la date du bilan", "Marché liquide → prix **fiable et observable** ; le coût serait une information **moins pertinente**."], ["**Immeubles de placement** (détenus pour le rendement/plus-value)", "**Valeur de marché** possible (au lieu du coût amorti)", "Logique **patrimoniale** : l'immeuble n'est pas un outil d'exploitation mais un **placement**, mieux mesuré à sa valeur réelle."], ["**Immobilisations corporelles d'exploitation**", "**Coût amorti** (règle), **pas** de modèle de réévaluation généralisé", "L'outil de production se mesure à son **coût d'usage** ; la réévaluation systématique relève des IFRS (IAS 16)."], ["**Stocks**", "**Plus faible** du coût et de la **VNR** (jamais au-dessus du coût)", "Prudence **résiduelle** : on ne reconnaît pas de profit non réalisé sur stock, mais on **acte la perte** si la VNR chute."]]}, {"type": "callout", "tone": "key", "title": "Le réflexe à retenir sur la valeur actuelle", "text": "La valeur actuelle (réelle) en RPC est **ciblée**, pas généralisée :\n- **Oui** pour les **titres cotés** (cours de bourse) et les **immeubles de placement** (valeur de marché) ;\n- **Non** comme modèle systématique pour l'**outil d'exploitation** (qui reste au **coût amorti**).\n\nLorsqu'un poste est évalué à la valeur actuelle, les **variations** (hausses **comme** baisses) sont en principe portées **au résultat** — ce qui peut faire apparaître des **gains non réalisés**, impensables au CO."}, {"type": "callout", "tone": "warn", "title": "Piège : la valeur actuelle peut DÉPASSER le coût", "text": "Pour un **titre coté** ou un **immeuble de placement** évalué à la valeur de marché, la valeur au bilan peut être **supérieure au coût d'acquisition** : on reconnaît alors une **plus-value latente en résultat**. C'est **impossible au CO** (plafond du coût) et c'est l'un des contrastes les plus testés. En revanche, un **stock** reste **plafonné au coût** : pas de réévaluation au-dessus du coût."}]}, {"title": "📦 Stocks & immobilisations corporelles", "blocks": [{"type": "heading", "text": "Stocks — lower of cost or market"}, {"type": "intro", "text": "Les **stocks** (matières, en-cours, produits finis, marchandises) sont évalués au **plus faible** entre :\n- le **coût** (acquisition pour les marchandises, **production** pour les produits fabriqués), et\n- la **valeur nette de réalisation (VNR)** = prix de vente estimé **− coûts d'achèvement et de vente** restant à engager.\n\nC'est la règle anglo-saxonne du *lower of cost or net realisable value*. Si la VNR **passe sous le coût**, on **déprécie** le stock jusqu'à la VNR (la perte est **immédiate** au résultat). Si la VNR **remonte** ensuite, la dépréciation antérieure peut être **reprise** (dans la limite du coût d'origine)."}, {"type": "keypoints", "title": "Stocks RPC — points qui rapportent", "accent": "emerald", "items": ["**Coût de production** = matières + main-d'œuvre directe + **part raisonnable des frais généraux de production** ; **exclut** administration et distribution.", "**Méthodes de flux** admises : **FIFO**, **coût moyen pondéré** (CMP), ou coûts standards si proches du réel. **LIFO interdit** (comme en IFRS).", "**Plafond = VNR** : on n'inscrit **jamais** un stock au-dessus du **plus faible** du coût et de la VNR.", "**Reprise** de dépréciation possible si la VNR se redresse, **plafonnée au coût** d'origine.", "**Pas de réserve latente** : on ne sous-évalue **pas** le stock « par prudence » au-delà de la baisse de VNR réellement constatée."]}, {"type": "callout", "tone": "warn", "title": "Le piège « tiers / quart » du CO sur les stocks", "text": "Le **CO (art. 960c, abattement, et pratique fiscale)** tolère un **abattement forfaitaire** (souvent **1/3 « Warendrittel »**) sur la valeur des stocks à des fins de prudence/fiscalité — une **réserve latente** typiquement suisse. En **RPC**, cet abattement forfaitaire **arbitraire est proscrit** : la dépréciation doit correspondre à une **baisse réelle** de la VNR, justifiée article par article (ou par catégorie homogène)."}, {"type": "heading", "text": "Immobilisations corporelles — coût amorti"}, {"type": "intro", "text": "Les **immobilisations corporelles d'exploitation** (terrains, bâtiments d'exploitation, machines, mobilier, véhicules) sont portées au **coût d'acquisition ou de production**, puis **amorties systématiquement** sur leur **durée d'utilité** selon un plan reflétant la **consommation des avantages économiques** (linéaire, dégressif, par unités d'œuvre).\n\nLes **terrains** ne s'amortissent pas (durée illimitée). Les **immeubles de placement**, eux, peuvent **déroger** au coût amorti et être évalués à la **valeur de marché** (voir section précédente). Une **dépréciation** s'ajoute aux amortissements dès qu'un **indice** de perte de valeur apparaît."}, {"type": "table", "title": "Immobilisations corporelles — règles d'évaluation", "headers": ["Catégorie", "Évaluation RPC"], "rows": [["**Machines, mobilier, véhicules** (outil d'exploitation)", "**Coût amorti** : coût − amortissements − dépréciations."], ["**Bâtiments d'exploitation**", "**Coût amorti** (séparer le terrain, non amorti, du bâtiment, amorti)."], ["**Terrains d'exploitation**", "**Coût** (pas d'amortissement ; dépréciation si indice de perte durable)."], ["**Immeubles de placement**", "**Coût amorti OU valeur de marché** (option ; la valeur de marché reflète mieux la nature de placement)."], ["**Réévaluation au-dessus du coût (outil d'exploitation)**", "**Non prévue** comme modèle systématique (≠ IAS 16) ; relève des IFRS."]]}, {"type": "journal", "title": "Écriture — amortissement annuel d'une machine", "note": "Machine acquise 120, durée d'utilité 8 ans, valeur résiduelle nulle, amortissement linéaire → 120 / 8 = 15 par an. L'amortissement est une charge qui reflète la consommation réelle, pas un outil de réserve latente.", "lines": [{"compte": "Charge d'amortissement (machines)", "debit": 15}, {"compte": "Amortissements cumulés / Machines", "credit": 15}]}, {"type": "journal", "title": "Écriture — immeuble de placement évalué à la valeur de marché (hausse)", "note": "Immeuble de placement au bilan 1 000 ; valeur de marché à la clôture 1 080 → réévaluation +80 portée au résultat (gain de réévaluation). Impossible au CO (plafond du coût).", "lines": [{"compte": "Immeubles de placement", "debit": 80}, {"compte": "Produit de réévaluation (résultat)", "credit": 80}]}]}, {"title": "📉 Dépréciation (impairment) & prévoyance (RPC 16)", "blocks": [{"type": "heading", "text": "Dépréciation — le test quand il y a des indices"}, {"type": "intro", "text": "À chaque clôture, l'entité apprécie s'il existe des **indices** qu'un actif a perdu de la valeur (chute des prix, obsolescence technique, baisse d'activité, dégradation de marché, sous-performance avérée). **S'il y a un indice**, on réalise un **test de dépréciation** : on compare la **valeur comptable** à la **valeur recouvrable**.\n\n**Valeur recouvrable = la plus élevée** de (a) la **valeur d'utilité** (flux de trésorerie futurs **actualisés** que l'actif générera) et (b) la **valeur de cession nette** (prix de vente − coûts de cession). Si la **valeur comptable > valeur recouvrable**, on **déprécie** l'actif à hauteur de l'écart (charge au résultat). Si les raisons de la dépréciation **disparaissent**, une **reprise** est possible (plafonnée au coût amorti qu'on aurait eu sans dépréciation)."}, {"type": "steps", "title": "Le test de dépréciation, pas à pas", "accent": "emerald", "steps": [{"t": "① Détecter un indice", "d": "Sources **externes** (marché, technologie, taux, contexte) ou **internes** (obsolescence, dommage, sous-performance, plan d'abandon). **Pas d'indice ⇒ pas de test obligatoire** (sauf cas spécifiques)."}, {"t": "② Estimer la valeur recouvrable", "d": "Calculer **valeur d'utilité** (flux futurs actualisés) **et** **valeur de cession nette** ; retenir **la plus élevée** des deux."}, {"t": "③ Comparer à la valeur comptable", "d": "Si **VC > valeur recouvrable** → **dépréciation** = VC − valeur recouvrable, comptabilisée **en charge**."}, {"t": "④ Suivre et, le cas échéant, reprendre", "d": "Si l'indice disparaît et la valeur se redresse → **reprise** de la dépréciation, **plafonnée** à la valeur comptable amortie qu'on aurait eue **sans** dépréciation antérieure."}]}, {"type": "journal", "title": "Écriture — dépréciation d'une immobilisation", "note": "Machine de valeur comptable 90 ; après un choc de marché, valeur recouvrable estimée 65 → dépréciation de 25 au résultat.", "lines": [{"compte": "Charge de dépréciation (impairment)", "debit": 25}, {"compte": "Machines (ou dépréciations cumulées)", "credit": 25}]}, {"type": "callout", "tone": "info", "title": "Dépréciation RPC vs IFRS (IAS 36) — proche, mais plus simple", "text": "La logique RPC (indice → valeur recouvrable = max(valeur d'utilité ; cession nette) → reprise possible) est **très proche d'IAS 36**. Différences principales : les RPC sont **moins prescriptives** sur les UGT (*cash-generating units*), l'allocation du goodwill et la mécanique d'actualisation. L'esprit est identique : **acter la perte de valeur réelle**, **sans** s'en servir pour cacher de la valeur."}, {"type": "heading", "text": "Engagements de prévoyance — l'approche suisse (RPC 16)"}, {"type": "intro", "text": "La recommandation dédiée à la **prévoyance professionnelle** (2ᵉ pilier) consacre une **approche suisse spécifique**, **différente d'IAS 19**. Plutôt que de modéliser actuariellement l'obligation comme en IFRS, elle part de la **situation économique** de l'employeur **vis-à-vis de l'institution de prévoyance** (caisse de pension).\n\nLe raisonnement : l'entité examine si, à la clôture, il existe pour elle un **avantage économique** (ex. participation à un **excédent / réserve de cotisations d'employeur** utilisable) ou un **engagement économique** (ex. **découvert** de la caisse qu'elle s'est engagée à combler, contribution d'assainissement). Cet **actif** ou ce **passif** économique est comptabilisé, et sa **variation** d'une année à l'autre passe au **résultat** (charge ou produit de prévoyance), en plus des **cotisations** de la période."}, {"type": "keypoints", "title": "Prévoyance RPC 16 — l'essentiel", "accent": "indigo", "items": ["**Point de départ** : la **situation économique** de l'employeur envers l'institution de prévoyance, **pas** un calcul actuariel d'obligation à la IAS 19.", "**Avantage économique** (ex. **réserve de cotisations d'employeur**, part d'excédent disponible) → **actif** au bilan de l'employeur.", "**Engagement économique** (ex. quote-part d'un **découvert** que l'employeur doit financer) → **passif**.", "**Variation** de l'actif/passif économique **+ cotisations** de la période = **charge (ou produit) de prévoyance** au résultat.", "**Annexe** détaillée : nature des plans, réserves de cotisations, situation de couverture, hypothèses retenues.", "**Divergence clé avec IAS 19** : pas de comptabilisation systématique d'une **obligation actuarielle brute** ni d'écarts actuariels en **OCI** ; l'approche est **plus pragmatique** et centrée sur l'employeur."]}, {"type": "callout", "tone": "warn", "title": "Ne pas plaquer IAS 19 sur la prévoyance suisse", "text": "Erreur classique à l'examen : appliquer la mécanique **IAS 19** (DBO, *projected unit credit*, écarts actuariels en OCI, rendement attendu des actifs) à une question **RPC**. La RPC raisonne en **situation économique nette** de l'employeur vis-à-vis de la caisse ; les **excédents/découverts** se traduisent en **actif/passif économique** dont la **variation va au résultat**. Annonce explicitement le **référentiel** avant de dérouler la méthode."}, {"type": "journal", "title": "Écriture — engagement de prévoyance (constitution d'un passif économique)", "note": "La caisse de pension est en découvert ; l'employeur s'engage à verser une contribution d'assainissement et reconnaît un engagement économique de 40 (variation de l'année), en sus des cotisations courantes.", "lines": [{"compte": "Charge de prévoyance (résultat)", "debit": 40}, {"compte": "Engagement de prévoyance (passif)", "credit": 40}]}, {"type": "diagram", "kind": "flow", "title": "Le test de dépréciation RPC, pas à pas", "steps": [{"label": "① Indice de perte", "sub": "Sources externes (marché, technologie, taux) ou internes (obsolescence, sous-performance). Pas d'indice ⇒ pas de test."}, {"label": "② Valeur recouvrable", "sub": "= **max** ( valeur d'utilité ; valeur de cession nette )"}, {"label": "③ Comparer à la VC", "sub": "Valeur comptable **>** valeur recouvrable ?"}, {"label": "④ Dépréciation", "sub": "Charge = VC − valeur recouvrable (reprise possible, plafonnée au coût amorti)."}], "accent": "emerald", "caption": "Logique très proche d'IAS 36 : acter la perte de valeur réelle, sans s'en servir pour cacher de la valeur."}]}, {"title": "🔢 Exemple chiffré — CO vs RPC sur un même bilan", "blocks": [{"type": "intro", "text": "Rien ne fixe mieux le contraste que de traiter **les mêmes faits** sous **CO** puis sous **RPC**. On suit trois postes : un **stock**, un **titre coté** et l'**effet réserves latentes** sur les fonds propres."}, {"type": "example", "title": "La société NovaTech — stock, titre coté, réserves latentes", "statement": "À la clôture, la société **NovaTech** dispose de trois éléments (CHF k) :\n\n**1) Stock de composants** — coût d'acquisition **200**. La demande s'est effondrée : la **valeur nette de réalisation** estimée n'est plus que de **150**. Par ailleurs, le comptable « prudent » envisageait au CO un **abattement forfaitaire d'un tiers** (« Warendrittel ») sur le coût.\n\n**2) Portefeuille de titres cotés** — coût d'acquisition **100**. Le **cours de bourse** à la clôture vaut **130**.\n\n**3) Une machine** — valeur comptable nette **90** ; aucun indice de dépréciation (valeur recouvrable ≈ 95).\n\n**Travail demandé :** déterminez la valeur au bilan de chaque poste **sous CO** puis **sous RPC**, identifiez les **réserves latentes** créées par le CO, et chiffrez l'écart de **fonds propres** entre les deux référentiels (ignorez la fiscalité).", "solution": "**1) Stock (coût 200, VNR 150)**\n- **RPC** — *lower of cost or market* : on retient le **plus faible** = **VNR 150**. Dépréciation **−50** au résultat (perte **réelle**). L'**abattement forfaitaire d'un tiers est proscrit** : pas de sous-évaluation supplémentaire.\n- **CO** — on doit **aussi** déprécier à 150 (la VNR est sous le coût, art. 960c). **Mais** le CO **autorise** en plus l'abattement « Warendrittel » : 1/3 × 150 ≈ **50** de réserve latente → stock affiché à **≈ 100**.\n- **Écart** : RPC **150** vs CO **≈ 100** → **réserve latente CO ≈ 50** (le stock est sous-évalué de 50 au CO).\n\n**2) Titres cotés (coût 100, cours 130)**\n- **RPC** — **valeur actuelle admise** = **cours de bourse 130**. On reconnaît une **plus-value latente +30 au résultat**.\n- **CO** — plafond du **coût d'acquisition** (art. 960b autorise le cours pour titres cotés, mais beaucoup d'entités restent au coût par prudence ; au minimum, **pas obligatoire** de réévaluer) → souvent **100**. Si l'on reste au coût : **réserve latente +30**.\n- **Écart** (cas « CO au coût ») : RPC **130** vs CO **100** → **réserve latente 30**.\n\n**3) Machine (VC 90, valeur recouvrable 95)**\n- **RPC** — **aucun indice** de dépréciation et valeur recouvrable (95) **> VC** (90) → **aucune dépréciation** ; reste à **90** (coût amorti). Pas de réévaluation au-dessus du coût pour l'outil d'exploitation.\n- **CO** — idem **90** (pas de réévaluation à la hausse de l'outil d'exploitation).\n- **Écart** : **0**.\n\n**Synthèse — réserves latentes et fonds propres**\n- Stock : réserve latente CO ≈ **50**\n- Titres : réserve latente CO **30**\n- Machine : **0**\n- **Total réserves latentes au CO ≈ 80**\n\n**Conclusion :** sous **RPC**, les actifs valent **80 de plus** qu'au **CO** (stock +50, titres +30). Les **fonds propres RPC** sont donc supérieurs d'environ **80** : l'image fidèle **fait remonter** la valeur cachée par les réserves latentes du CO. Le **résultat RPC** intègre la **plus-value latente sur titres (+30)** — impensable au CO — et la **vraie dépréciation de stock (−50)**, sans l'abattement arbitraire supplémentaire."}, {"type": "table", "title": "Bilan comparé CO vs RPC (extrait, CHF k)", "headers": ["Poste", "CO (prudence)", "RPC (image fidèle)", "Réserve latente CO"], "rows": [["Stock (coût 200, VNR 150)", "≈ 100 (VNR 150 − 1/3)", "150 (VNR)", "≈ 50"], ["Titres cotés (coût 100, cours 130)", "100 (coût)", "130 (cours)", "30"], ["Machine (VC 90, val. recouvrable 95)", "90", "90", "0"], ["**Total actifs concernés**", "**≈ 290**", "**370**", "**≈ 80**"], ["**Effet sur fonds propres**", "—", "**+80 vs CO**", "—"]]}, {"type": "callout", "tone": "key", "title": "Lecture de l'exemple", "text": "Deux contrastes structurants apparaissent : (1) **la valeur actuelle des titres cotés** crée un **gain non réalisé** en RPC, **interdit** au CO ; (2) **l'abattement forfaitaire de stock** du CO est une **réserve latente** que la RPC **refuse**. Résultat : un bilan RPC **plus proche de la valeur réelle**, des fonds propres **plus élevés**, un résultat **moins lissé**."}, {"type": "diagram", "kind": "waterfall", "title": "Pont des actifs CO → RPC (NovaTech, CHF k)", "items": [{"label": "Total actifs CO", "value": 290, "kind": "total"}, {"label": "+ Réserve latente stock", "value": 50, "kind": "add"}, {"label": "+ Réserve latente titres", "value": 30, "kind": "add"}, {"label": "= Total actifs RPC", "value": 370, "kind": "total"}], "caption": "L'image fidèle RPC fait remonter les 80 de valeur cachée par les réserves latentes du CO → fonds propres RPC +80."}, {"type": "diagram", "kind": "split", "title": "Composition des réserves latentes CO supprimées (CHF k)", "parts": [{"label": "Stock (abattement 1/3)", "value": 50, "color": "amber"}, {"label": "Titres cotés (coût vs cours)", "value": 30, "color": "indigo"}], "caption": "Les 80 d'écart de fonds propres se décomposent en 50 (stock sous-évalué) + 30 (plus-value latente sur titres). La machine n'apporte aucun écart."}]}, {"title": "🗂️ Évaluation — CO vs Swiss GAAP RPC vs IFRS", "blocks": [{"type": "intro", "text": "Le tableau **incontournable**. On lit l'évaluation sur les **trois référentiels** suisses/internationaux, du plus prudent (**CO**) au plus orienté juste valeur (**IFRS**), avec la RPC **au milieu**."}, {"type": "compare", "title": "Principes d'évaluation : IFRS vs Swiss GAAP RPC vs CO (art. 960 ss)", "rows": [{"crit": "Objectif de l'évaluation", "ifrs": "**Image fidèle**, pertinence ; **juste valeur** largement étendue", "rpc": "**Image fidèle** (*true and fair view*) ; coût + valeurs actuelles ciblées", "co": "**Prudence** ; protection des créanciers ; coût **maximum**"}, {"crit": "Base générale des actifs", "ifrs": "Coût **ou** réévaluation / juste valeur selon la norme", "rpc": "**Coût** (acquisition/production), amorti et déprécié", "co": "**Coût d'acquisition au maximum** (art. 960a)"}, {"crit": "Réserves latentes arbitraires", "ifrs": "**Interdites** (image fidèle)", "rpc": "**Interdites** (sous-évaluation volontaire proscrite)", "co": "**Permises** (sous-éval. d'actifs, sur-amortissements, art. 960a al. 4)"}, {"crit": "Stocks", "ifrs": "Plus faible du **coût** et de la **VNR** (IAS 2) ; LIFO interdit", "rpc": "Plus faible du **coût** et de la **VNR** (*lower of cost or market*)", "co": "Coût ou VNR si plus basse **+ abattement** prudentiel toléré (1/3)"}, {"crit": "Immobilisations corporelles d'exploitation", "ifrs": "**Coût amorti OU modèle de réévaluation** (IAS 16)", "rpc": "**Coût amorti** (pas de réévaluation systématique)", "co": "**Coût amorti** ; réévaluation très restreinte (immeubles/participations, art. 670)"}, {"crit": "Titres cotés / placements", "ifrs": "**Juste valeur** (IFRS 9 : FVPL ou FVOCI)", "rpc": "**Valeur actuelle = cours de bourse** admise (gains/pertes au résultat)", "co": "Cours **autorisé** pour titres cotés (art. 960b), sinon coût ; souvent au coût par prudence"}, {"crit": "Immeubles de placement", "ifrs": "**Juste valeur** ou coût (IAS 40, au choix)", "rpc": "**Valeur de marché** possible (ou coût amorti)", "co": "**Coût amorti** ; pas de modèle juste valeur"}, {"crit": "Dépréciation (impairment)", "ifrs": "**IAS 36** : indice → valeur recouvrable ; UGT, reprise (sauf goodwill)", "rpc": "Indice → **valeur recouvrable** (max valeur d'utilité / cession) ; **reprise** possible", "co": "Correction de valeur si la valeur réelle est **durablement** inférieure (art. 960a al. 3)"}, {"crit": "Réévaluation au-DESSUS du coût", "ifrs": "**Possible** (IAS 16 réévaluation en OCI ; IAS 40/IFRS 9 en résultat)", "rpc": "**Limitée** : titres cotés / immeubles de placement (au résultat)", "co": "**Exceptionnelle** : immeubles & participations pour combler un découvert (art. 670), réserve de réévaluation"}, {"crit": "Engagements de prévoyance", "ifrs": "**IAS 19** : DBO actuarielle, *projected unit credit*, écarts en OCI", "rpc": "**RPC 16** : **situation économique** de l'employeur (actif/passif économique)", "co": "Charge = **cotisations** ; provision si engagement ferme ; pas d'actuariat imposé"}, {"crit": "Effet net sur le bilan", "ifrs": "Le **plus proche** de la valeur de marché (juste valeur étendue)", "rpc": "**Proche de la réalité**, sans réserves cachées ; valeur actuelle ciblée", "co": "**Conservateur** : valeur souvent **inférieure** à la réalité (réserves latentes)"}]}, {"type": "keypoints", "title": "Les 3 contrastes qui rapportent des points", "accent": "amber", "items": ["**Réserves latentes** : *permises au CO* (prudence) **vs** *interdites en RPC et IFRS* (image fidèle). **LE** clivage central.", "**Valeur actuelle** : *ciblée en RPC* (titres cotés, immeubles de placement) **vs** *généralisée en IFRS* (juste valeur) **vs** *plafond du coût au CO*.", "**Prévoyance** : *situation économique de l'employeur (RPC 16)* **vs** *obligation actuarielle DBO (IAS 19)* **vs** *cotisations + provision (CO)*."]}, {"type": "callout", "tone": "info", "title": "Comment se repérer en une phrase", "text": "**CO = je cache de la valeur (prudence)** · **RPC = je montre la valeur réelle sans matelas (image fidèle, valeur actuelle ciblée)** · **IFRS = je vais le plus loin dans la juste valeur (réévaluation étendue)**. Place toujours la RPC **entre** les deux."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["**Réserves latentes** : permises (art. 960a al. 4)", "**Valeur actuelle** : plafond du coût ; cours admis pour titres cotés (960b) mais souvent coût", "**Réévaluation au-dessus du coût** : exceptionnelle (art. 670, découvert)"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["**Réserves latentes** : interdites (sous-éval. volontaire proscrite)", "**Valeur actuelle ciblée** : titres cotés (cours), immeubles de placement (marché)", "**Réévaluation** : limitée à ces postes, variations **au résultat**"]}, {"title": "IFRS", "color": "indigo", "items": ["**Réserves latentes** : interdites (image fidèle)", "**Juste valeur généralisée** (IFRS 9, IAS 40)", "**Modèle de réévaluation** IAS 16 (OCI) admis"]}], "caption": "Les 3 contrastes qui rapportent des points : réserves latentes, étendue de la valeur actuelle, et réévaluation au-dessus du coût."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Constituer des réserves latentes « par prudence » en RPC", "text": "C'est **l'erreur n°1**. En RPC, la sous-évaluation **volontaire** (sur-amortissement, abattement forfaitaire de stock, provision excédentaire) **viole l'image fidèle**. La prudence du CO **ne se transpose pas** en RPC : on ne déprécie que ce qui a **réellement** perdu de la valeur."}, {"type": "callout", "tone": "warn", "title": "Croire que la RPC évalue tout à la juste valeur", "text": "Faux. La règle générale reste le **coût**. La **valeur actuelle** est **ciblée** : titres cotés (cours), immeubles de placement (marché). L'**outil d'exploitation** demeure au **coût amorti** ; il n'y a **pas** de modèle de réévaluation généralisé comme IAS 16."}, {"type": "callout", "tone": "warn", "title": "Inscrire un stock au-dessus du coût", "text": "Le stock est plafonné au **plus faible** du coût et de la VNR. Même si la VNR explose, on **ne dépasse jamais le coût** : pas de profit non réalisé sur stock (≠ titres cotés, où la plus-value latente est, elle, reconnue)."}, {"type": "callout", "tone": "warn", "title": "Oublier le test de dépréciation faute d'« indice »", "text": "Le test n'est obligatoire **qu'en présence d'indices** — mais encore faut-il les **chercher** activement (sources externes ET internes) à chaque clôture. Ignorer un signal de marché évident, puis ne pas déprécier, **surévalue** l'actif et **fausse** l'image fidèle."}, {"type": "callout", "tone": "warn", "title": "Plaquer IAS 19 sur la prévoyance suisse (RPC 16)", "text": "La RPC raisonne en **situation économique** de l'employeur (excédent → actif ; découvert à financer → passif), **pas** en **DBO actuarielle** avec écarts en OCI. Mélanger les deux méthodes coûte des points : **annonce le référentiel** d'abord."}, {"type": "keypoints", "title": "Autres pièges classiques", "accent": "rose", "items": ["**Coût de production** : y inclure l'**administration** ou la **distribution** (interdit) ou **oublier** la part de frais généraux **de production** (obligatoire).", "**LIFO** : l'utiliser pour les stocks — **interdit** (RPC comme IFRS) ; n'admettre que **FIFO / CMP / standards**.", "**Reprise de dépréciation** : oublier qu'elle est **possible** (sauf situations où la valeur ne se redresse pas) et **plafonnée** au coût amorti d'origine.", "**Permanence des méthodes** : changer de base d'évaluation (coût ↔ valeur actuelle) sans **justification ni information** en annexe.", "**Variations de valeur actuelle** : ne pas savoir où elles vont — en RPC, hausses **et** baisses des titres cotés / immeubles de placement passent en principe **au résultat**.", "**Confondre dépréciation justifiée et réserve latente** : la première est **obligatoire**, la seconde **interdite** en RPC."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "CIVRP", "phrase": "« **C**oût d'abord, **I**mage fidèle (pas de réserves latentes), **V**aleur actuelle ciblée, **R**ecouvrable pour la dépréciation, **P**révoyance à la suisse » — l'évaluation RPC tient dans CIVRP.", "items": [{"l": "C", "t": "**Coût** — règle générale : acquisition / production, amorti et déprécié."}, {"l": "I", "t": "**Image fidèle** — **pas** de réserves latentes arbitraires (≠ CO)."}, {"l": "V", "t": "**Valeur actuelle** — admise pour **titres cotés** (cours) et **immeubles de placement** (marché)."}, {"l": "R", "t": "**Recouvrable** — dépréciation dès qu'il y a un **indice** : VC vs valeur recouvrable."}, {"l": "P", "t": "**Prévoyance** — RPC 16 : **situation économique** de l'employeur (≠ IAS 19)."}]}, {"type": "keypoints", "title": "Structurer une réponse « évaluation RPC » (ce qui paie)", "accent": "emerald", "items": ["**Annoncer le référentiel et l'objectif** : RPC = **image fidèle**, donc **pas de réserves latentes** (contraste immédiat avec le CO).", "**Poser la base** : coût d'acquisition/production, **amorti et déprécié** ; préciser quand la **valeur actuelle** s'applique (titres cotés, immeubles de placement).", "**Stocks** : énoncer *lower of cost or market* et **chiffrer** la dépréciation à la VNR.", "**Dépréciation** : indice → **valeur recouvrable** = max(valeur d'utilité ; cession nette) → écart en charge ; reprise possible.", "**Prévoyance** : raisonner **situation économique** (RPC 16), surtout **ne pas** dérouler IAS 19.", "**Conclure par le triple contraste** CO (prudence/réserves latentes) vs RPC (image fidèle) vs IFRS (juste valeur étendue, IAS 16)."]}, {"type": "callout", "tone": "key", "title": "Citations & repères sûrs", "text": "**Swiss GAAP RPC** : cadre conceptuel + RPC fondamentale (évaluation au coût, image fidèle), recommandations dédiées aux **stocks**, **immobilisations corporelles**, **immeubles**, **titres**, et **RPC 16 prévoyance**. \n**CO** : art. **960a** (coût max, réserves latentes), **960b** (titres cotés au cours), **960c** (stocks/VNR), **670** (réévaluation immeubles/participations). \n**IFRS** : **IAS 2** (stocks), **IAS 16** (corporelles + réévaluation), **IAS 36** (dépréciation), **IAS 40** (immeubles de placement), **IFRS 9** (titres), **IAS 19** (prévoyance). \n*(Si un numéro de RPC est incertain, citer la notion sans le numéro.)*"}, {"type": "callout", "tone": "tip", "title": "Le réflexe « où va la variation de valeur ? »", "text": "À chaque poste évalué à la valeur actuelle, pose-toi la question : **où passe la variation ?** En RPC, pour les **titres cotés** et **immeubles de placement**, hausses comme baisses vont **au résultat** — d'où des **gains/pertes non réalisés** que le CO ignore."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste ta maîtrise de l'évaluation RPC (8 questions)", "questions": [{"q": "Quel est l'objectif central des Swiss GAAP RPC en matière d'évaluation ?", "options": ["La prudence maximale et la protection des créanciers", "L'image fidèle (true and fair view), qui interdit la sous-évaluation volontaire", "La juste valeur généralisée de tous les actifs", "La minimisation de l'impôt sur le bénéfice"], "answer": 1, "explain": "Les RPC visent l'image fidèle. Cela proscrit les réserves latentes arbitraires (sous-évaluation volontaire) tolérées par le CO, sans pour autant généraliser la juste valeur comme les IFRS."}, {"q": "Comment évalue-t-on un stock en RPC ?", "options": ["Au coût d'acquisition, augmenté d'une marge", "À la valeur nette de réalisation, toujours", "Au plus faible du coût et de la valeur nette de réalisation (lower of cost or market)", "Au coût diminué d'un abattement forfaitaire d'un tiers"], "answer": 2, "explain": "Règle du lower of cost or market : on retient le plus faible entre le coût (acquisition/production) et la VNR. L'abattement forfaitaire d'un tiers (Warendrittel) du CO est une réserve latente proscrite en RPC."}, {"q": "Un titre coté acquis à 100 cote 130 à la clôture. Quel traitement en RPC ?", "options": ["Maintien à 100 : plafond du coût d'acquisition", "Évaluation à la valeur actuelle 130, plus-value latente de +30 au résultat", "Évaluation à 130, mais l'écart de +30 va directement en réserves sans toucher le résultat", "Dépréciation interdite, réévaluation interdite : on garde 115 (moyenne)"], "answer": 1, "explain": "Pour les titres cotés, la RPC admet la valeur actuelle (cours de bourse) : 130, avec un gain latent de +30 porté au résultat. C'est impossible au CO, plafonné au coût d'acquisition."}, {"q": "Comment sont évaluées les immobilisations corporelles d'exploitation en RPC ?", "options": ["Au coût amorti (coût − amortissements − dépréciations), sans modèle de réévaluation systématique", "À la juste valeur réévaluée chaque année comme sous IAS 16", "Au coût d'acquisition figé, sans amortissement", "À la valeur de marché obligatoire"], "answer": 0, "explain": "L'outil d'exploitation reste au coût amorti. La RPC ne prévoit pas de modèle de réévaluation généralisé (contrairement au modèle de réévaluation d'IAS 16). Seuls les immeubles de placement peuvent passer à la valeur de marché."}, {"q": "Quand un test de dépréciation est-il requis en RPC, et à quoi compare-t-on la valeur comptable ?", "options": ["Chaque année systématiquement, comparé à la juste valeur", "Uniquement à la vente de l'actif, comparé au prix de vente", "Dès qu'il existe des indices de perte de valeur, comparé à la valeur recouvrable", "Jamais : la RPC ne connaît pas la dépréciation"], "answer": 2, "explain": "Le test intervient en présence d'indices (externes ou internes). On compare la valeur comptable à la valeur recouvrable = la plus élevée de la valeur d'utilité (flux futurs actualisés) et de la valeur de cession nette."}, {"q": "Quelle est la valeur recouvrable utilisée pour le test de dépréciation ?", "options": ["La plus faible de la valeur d'utilité et de la valeur de cession nette", "La plus élevée de la valeur d'utilité et de la valeur de cession nette", "Toujours la valeur de marché brute", "Le coût d'acquisition d'origine"], "answer": 1, "explain": "La valeur recouvrable est la plus élevée des deux : valeur d'utilité (flux de trésorerie futurs actualisés) ou valeur de cession nette. On ne déprécie que si la valeur comptable dépasse ce montant."}, {"q": "Comment la RPC (RPC 16) traite-t-elle les engagements de prévoyance, par rapport à IAS 19 ?", "options": ["Identique à IAS 19 : obligation actuarielle (DBO) et écarts actuariels en OCI", "Par une approche suisse spécifique : situation économique de l'employeur vis-à-vis de l'institution de prévoyance", "En ne comptabilisant que les cotisations, sans jamais d'actif ni de passif", "À la juste valeur des actifs de la caisse uniquement"], "answer": 1, "explain": "La RPC 16 retient une approche propre à la Suisse : on comptabilise la situation économique nette de l'employeur (avantage économique = actif ; engagement économique, ex. découvert à financer = passif), dont la variation passe au résultat. C'est distinct du modèle actuariel DBO d'IAS 19."}, {"q": "Sur le traitement des réserves latentes, quel classement est correct ?", "options": ["Permise
