                </tbody>
              </table>
            </div>
          </Card>
          <Card title="Les cinq états financiers consolidés" icon={<FileText size={18} className="text-slate-600" />}>
            <div className="grid sm:grid-cols-5 gap-2">
              {["Bilan", "Compte de résultat", "Flux de trésorerie", "Variation des fonds propres", "Annexe"].map((x, i) => (<div key={i} className="rounded-lg bg-slate-50 border border-slate-200 p-2 text-xs text-slate-600 font-medium text-center">{x}</div>))}
            </div>
            <Section>Tableau de variation des fonds propres</Section>
            <p className="text-sm text-slate-600">Il relie les fonds propres de début et de fin de période (colonnes : capital-actions, réserves issues du capital, réserves issues du bénéfice, total holding, minoritaires) en justifiant chaque variation : augmentation de capital, dividendes, bénéfice, variations du périmètre, compensation de goodwill, écarts de conversion, actions propres.</p>
            <Section>Annexe (Notes)</Section>
            <p className="text-sm text-slate-600">Contient notamment : la norme appliquée et les options retenues (traitement du goodwill, méthode des coentreprises) ; le <strong>périmètre de consolidation</strong> (liste des sociétés, % de capital/voix, méthode) ; le détail des postes (instruments financiers, stocks, impôts différés, tableau des immobilisations, provisions) ; l'<strong>information sectorielle</strong> ; le capital-actions et les actions propres ; les opérations hors bilan ; les transactions avec parties liées ; les <strong>événements postérieurs à la clôture</strong> (avec ou sans ajustement).</p>

      case "theorie": return (
        <div className="space-y-4">
          <Card title="Cadre conceptuel & principes" icon={<BookOpen size={18} className="text-indigo-600" />} accent="indigo">
            <p className="text-sm text-slate-600">Avant les écritures, il y a une <strong>logique</strong>. Les comptes consolidés ont un objectif : donner une <strong>image fidèle</strong> (true &amp; fair view) du patrimoine, de la situation financière et du résultat du groupe, pour éclairer les décisions des investisseurs et des bailleurs de fonds.</p>

            <p className="text-sm text-slate-600"><strong>Continuité d'exploitation</strong> (going concern) et <strong>comptabilité d'engagement</strong> (accrual : on rattache produits et charges à l'exercice, indépendamment des flux de trésorerie).</p>
            <Section>Caractéristiques qualitatives de l'information</Section>
            <div className="grid sm:grid-cols-2 gap-2">
              <div className="rounded-lg border border-indigo-100 bg-indigo-50 p-3"><div className="text-xs font-semibold text-indigo-700 mb-1">Fondamentales</div><p className="text-xs text-slate-600"><strong>Pertinence</strong> (utile à la décision, valeur prédictive/confirmative) et <strong>fidélité / fiabilité</strong> (représentation complète, neutre, exempte d'erreur).</p></div>
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700 mb-1">Auxiliaires</div><p className="text-xs text-slate-500"><strong>Comparabilité</strong>, <strong>vérifiabilité</strong>, <strong>rapidité</strong> (timeliness) et <strong>intelligibilité</strong>.</p></div>
            </div>

            <Note type="tip"><strong>Deux philosophies</strong> : le CO privilégie la <strong>prudence</strong> et la protection du créancier (réserves latentes admises) ; les Swiss GAAP RPC et les IFRS privilégient la <strong>sincérité</strong> et l'utilité pour l'investisseur (pas de réserves latentes arbitraires). La consolidation selon une norme reconnue relève de la seconde logique.</Note>
          </Card>

          <Card title="Les trois théories de la consolidation" icon={<Compass size={18} className="text-indigo-600" />}>
            <p className="text-sm text-slate-600">Pourquoi présenter les minoritaires dans les fonds propres ? Pourquoi tel calcul du goodwill ? La réponse dépend de la <strong>conception du groupe</strong> que l'on adopte. Trois théories s'opposent.</p>
            <div className="overflow-x-auto mt-3">
              <table className="w-full text-xs min-w-max">
                <thead><tr className="bg-slate-100 text-slate-600"><th className="px-2 py-2 text-left font-medium">Critère</th><th className="px-2 py-2 text-left font-medium">Théorie de l'entité</th><th className="px-2 py-2 text-left font-medium">Théorie de la maison-mère</th><th className="px-2 py-2 text-left font-medium">Théorie du propriétaire</th></tr></thead>
                <tbody>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Vision du groupe</td><td className="px-2 py-2 text-slate-600">Une entité économique unique, pour <strong>tous</strong> les actionnaires (maj. + min.)</td><td className="px-2 py-2 text-slate-600">Une <strong>extension de la mère</strong>, pour ses seuls actionnaires</td><td className="px-2 py-2 text-slate-600">La mère ne possède que sa <strong>quote-part</strong> des actifs/passifs</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Intérêts minoritaires</td><td className="px-2 py-2 text-slate-600">Dans les <strong>fonds propres</strong> du groupe</td><td className="px-2 py-2 text-slate-600">Poste <strong>distinct</strong> (mezzanine), hors FP au sens strict</td><td className="px-2 py-2 text-slate-600"><strong>Inexistants</strong> (on ne prend que sa part)</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Goodwill</td><td className="px-2 py-2 text-slate-600"><strong>Complet</strong> (y c. part des minoritaires)</td><td className="px-2 py-2 text-slate-600"><strong>Partiel</strong> (part du groupe seulement)</td><td className="px-2 py-2 text-slate-600">Quote-part uniquement</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Bénéfices internes</td><td className="px-2 py-2 text-slate-600">Éliminés à <strong>100 %</strong>, répartis maj. / min.</td><td className="px-2 py-2 text-slate-600"><strong>Aval</strong> : 100 % ; <strong>amont</strong> : quote-part du groupe</td><td className="px-2 py-2 text-slate-600">Au <strong>prorata</strong> de la participation</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Méthode associée</td><td className="px-2 py-2 text-slate-600">Intégration globale (moderne)</td><td className="px-2 py-2 text-slate-600">Intégration globale (classique)</td><td className="px-2 py-2 text-slate-600">Intégration proportionnelle</td></tr>
                </tbody>
              </table>
            </div>
            <Note type="tip">Où se situent les normes ? <strong>IFRS</strong> : théorie de l'<strong>entité</strong> — minoritaires en fonds propres, et <strong>choix</strong> goodwill complet ou partiel par acquisition. <strong>Swiss GAAP RPC</strong> : minoritaires en fonds propres mais goodwill <strong>partiel</strong> et élimination des marges « orientée bilan » → une <strong>entité « modifiée »</strong>. L'<strong>intégration proportionnelle</strong> est l'héritière de la théorie du propriétaire (supprimée en IFRS).</Note>
          </Card>

          <Card title="Goodwill : méthode complète vs partielle" icon={<Coins size={18} className="text-indigo-600" />}>
            <p className="text-sm text-slate-600">Le goodwill est un <strong>écart résiduel</strong> : la part du prix qui ne s'explique par aucun actif identifiable. Le goodwill <strong>généré en interne n'est jamais comptabilisé</strong> — seul le goodwill <strong>acquis</strong> lors d'un regroupement l'est.</p>
            <div className="grid sm:grid-cols-2 gap-3 mt-3">
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700 mb-1">Méthode partielle (Swiss GAAP ; option IFRS)</div><p className="text-xs text-slate-500">Minoritaires évalués à leur <strong>quote-part de l'actif net réévalué</strong>. Goodwill = prix payé − part du groupe dans l'actif net. On ne reconnaît <strong>que le goodwill du groupe</strong>.</p></div>
              <div className="rounded-lg border border-indigo-100 bg-indigo-50 p-3"><div className="text-xs font-semibold text-indigo-700 mb-1">Méthode complète / full (option IFRS)</div><p className="text-xs text-slate-600">Minoritaires évalués à leur <strong>juste valeur</strong> (goodwill des minoritaires inclus). Goodwill = (contrepartie + JV des minoritaires) − actif net identifiable.</p></div>
            </div>
            <Section>Illustration — acquisition de 80 %</Section>
            <div className="overflow-x-auto">
              <table className="w-full text-sm min-w-max">
                <thead><tr className="bg-slate-100 text-slate-500 text-xs"><th className="px-3 py-1.5 text-left font-medium">Élément</th><th className="px-3 py-1.5 text-right font-medium">Méthode partielle</th><th className="px-3 py-1.5 text-right font-medium">Méthode complète</th></tr></thead>
                <tbody>
                  <tr className="border-t border-slate-100"><td className="px-3 py-1.5 text-slate-600">Actif net identifiable (juste valeur)</td><td className="px-3 py-1.5 text-right tabular-nums">1 000</td><td className="px-3 py-1.5 text-right tabular-nums">1 000</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-3 py-1.5 text-slate-600">Contrepartie versée (80 %)</td><td className="px-3 py-1.5 text-right tabular-nums">900</td><td className="px-3 py-1.5 text-right tabular-nums">900</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-3 py-1.5 text-slate-600">Intérêts minoritaires (20 %)</td><td className="px-3 py-1.5 text-right tabular-nums">200 <span className="text-slate-400">(20 % × 1 000)</span></td><td className="px-3 py-1.5 text-right tabular-nums">230 <span className="text-slate-400">(juste valeur)</span></td></tr>
                  <tr className="border-t border-slate-100 font-semibold text-slate-800 bg-indigo-50"><td className="px-3 py-1.5">Goodwill</td><td className="px-3 py-1.5 text-right tabular-nums">100</td><td className="px-3 py-1.5 text-right tabular-nums">130</td></tr>
                </tbody>
              </table>
            </div>
            <Note type="info">Les <strong>30</strong> d'écart = le goodwill attribué aux minoritaires. Ils gonflent <strong>à la fois</strong> le goodwill (actif) et les minoritaires (fonds propres) : l'actif net du groupe hors goodwill est inchangé, mais le bilan est « brut » des deux côtés.</Note>
          </Card>

          <Card title="La notion de contrôle, en profondeur" icon={<GitBranch size={18} className="text-indigo-600" />}>
            <p className="text-sm text-slate-600">Le contrôle est le <strong>fait générateur</strong> de l'intégration globale. Les IFRS (IFRS 10) en donnent un <strong>modèle unique</strong> : il y a contrôle quand on réunit (1) le <strong>pouvoir</strong> sur l'entité, (2) une <strong>exposition aux rendements variables</strong>, et (3) la <strong>capacité d'utiliser ce pouvoir pour influer</strong> sur ces rendements.</p>
            <div className="grid sm:grid-cols-3 gap-2 mt-3">
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Contrôle de droit</div><p className="text-xs text-slate-500 mt-1">Majorité des droits de vote (&gt; 50 %), directement ou indirectement.</p></div>
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Contrôle de fait</div><p className="text-xs text-slate-500 mt-1">Moins de 50 % mais contrôle effectif : actionnariat dispersé, accords avec d'autres actionnaires, droits de vote potentiels exerçables.</p></div>
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Entités structurées</div><p className="text-xs text-slate-500 mt-1">Véhicules ad hoc (SPE) : le contrôle découle de la <strong>conception</strong> et des <strong>risques / avantages</strong>, même sans droits de vote.</p></div>
            </div>
            <Note type="info">Les <strong>Swiss GAAP RPC 30</strong> retiennent une définition voisine : contrôle = majorité directe ou indirecte des voix, <strong>ou</strong> toute autre possibilité d'exercer une influence dominante.</Note>
          </Card>

          <Card title="Principe de réalisation & opérations amont / aval" icon={<TrendingDown size={18} className="text-indigo-600" />}>
            <p className="text-sm text-slate-600">Fondement de l'élimination des marges internes : pour le groupe, un bénéfice n'est <strong>réalisé</strong> qu'au moment où le bien <strong>quitte le périmètre</strong> (vente à un tiers). Tant qu'il circule en interne, c'est un simple déplacement.</p>
            <div className="grid sm:grid-cols-2 gap-2 mt-3">
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Aval (downstream)</div><p className="text-xs text-slate-500 mt-1">Mère → filiale. Le vendeur est la mère : la marge non réalisée concerne en principe les seuls actionnaires du groupe.</p></div>
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Amont (upstream)</div><p className="text-xs text-slate-500 mt-1">Filiale → mère. Le vendeur est une filiale : si elle a des minoritaires, ceux-ci supportent leur part de l'élimination.</p></div>
            </div>
            <Note type="tip">Le manuel applique l'<strong>approche orientée bilan</strong> : la marge est éliminée selon l'<strong>actionnariat de la société qui détient le bien</strong> en stock (d'où le partage 80 % / 20 % du chapitre 9), ce qui revient au même résultat que le raisonnement amont / aval.</Note>
            <Note type="info">En toute rigueur, l'élimination d'un bénéfice interne fait naître un <strong>impôt différé</strong> (le fisc local a déjà imposé le bénéfice, pas encore réalisé pour le groupe) — un raffinement traité séparément.</Note>
          </Card>
        </div>
      );

      case "exo": return (
        <div className="space-y-4">
          <Card title="Entraînement — pose la bonne écriture" icon={<GraduationCap size={18} className="text-indigo-600" />} accent="indigo">

          </Card>
          <Card title="Quiz des écritures de consolidation" icon={<ListChecks size={18} className="text-slate-600" />}>
            <EcritureExercice />
          </Card>
        </div>
      );

      default: return null;
    }
  };

  const idx = COURS_CHAPITRES.findIndex(x => x.id === sub);

  return (
    <div className="space-y-4">
      <div className="rounded-xl border border-indigo-100 bg-gradient-to-r from-indigo-50 to-white p-5">
        <div className="flex items-center gap-2 text-indigo-800 font-semibold text-lg"><GraduationCap size={22} /> Cours complet — Consolidation (Swiss GAAP RPC)</div>
        <p className="text-sm text-slate-600 mt-1">Tout le cours, du groupe à l'annexe, expliqué pas à pas avec les écritures et le « pourquoi débit / pourquoi crédit ». Navigue par chapitre ci-dessous.</p>
      </div>
      <div className="flex flex-wrap gap-1.5">
        {COURS_CHAPITRES.map(c => (
          <button key={c.id} onClick={() => setSub(c.id)} className={`text-xs px-3 py-1.5 rounded-lg border transition-colors ${sub === c.id ? "border-indigo-500 bg-indigo-600 text-white" : "border-slate-200 text-slate-600 hover:bg-slate-50"}`}>{c.label}</button>

        <span className="text-xs text-slate-400 shrink-0">Chapitre {idx + 1} / {COURS_CHAPITRES.length}</span>
      </div>
      {render()}
      <div className="flex items-center justify-between gap-2 pt-2">
        <button disabled={idx <= 0} onClick={() => idx > 0 && setSub(COURS_CHAPITRES[idx - 1].id)} className={`inline-flex items-center gap-1.5 text-sm px-4 py-2 rounded-lg border ${idx <= 0 ? "border-slate-100 text-slate-300 cursor-not-allowed" : "border-slate-300 text-slate-600 hover:bg-slate-50"}`}><ArrowLeft size={15} /> {idx > 0 ? COURS_CHAPITRES[idx - 1].label.replace(/^\d+ · /, "") : "Précédent"}</button>
        <button disabled={idx >= COURS_CHAPITRES.length - 1} onClick={() => idx < COURS_CHAPITRES.length - 1 && setSub(COURS_CHAPITRES[idx + 1].id)} className={`inline-flex items-center gap-1.5 text-sm px-4 py-2 rounded-lg border ${idx >= COURS_CHAPITRES.length - 1 ? "border-slate-100 text-slate-300 cursor-not-allowed" : "border-indigo-500 bg-indigo-600 text-white hover:bg-indigo-700"}`}>{idx < COURS_CHAPITRES.length - 1 ? COURS_CHAPITRES[idx + 1].label.replace(/^\d+ · /, "") : "Fin"} <ArrowRight size={15} /></button>

}

                    <span className="text-xs text-slate-500 leading-relaxed">{it[1]}</span>
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      );
      case 2: return (
        <div className="space-y-5">
          <div className="flex flex-wrap gap-4 items-center justify-between bg-white rounded-xl border border-slate-200 p-3"><MethodSwitch /><RefSwitch /></div>
          <Card title="Du prix payé au goodwill" icon={<Coins size={18} className="text-indigo-600" />} accent="indigo">
            <div className="space-y-1 text-sm">
              {[["JV de l'actif net identifiable (Cap. + Rés. + Écart net)", c.X], [`Quote-part du groupe (${d.pctMere} %)`, c.qpGroupe], ["Coût d'acquisition", c.prix]].map((r, i) => (
                <div key={i} className="flex justify-between py-1 text-slate-600"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
              ))}
            </div>
            <div className="my-4">
              <SplitBar left={c.qpGroupe} right={Math.max(0, c.gwPartial)} lLabel="Quote-part d'actif net acquise" rLabel="Goodwill" lColor="indigo" rColor="amber" />
              <p className="text-center text-xs text-slate-400 mt-1">Coût d'acquisition = {fmt(c.prix)}</p>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div className={`rounded-lg border p-3 ${!c.full ? "border-indigo-300 bg-indigo-50" : "border-slate-200"}`}>
                <div className="text-xs font-semibold text-indigo-600">Goodwill partiel</div>
                <div className="text-2xl font-bold text-indigo-700 tabular-nums">{fmt(c.gwPartial)}</div>
                <div className="text-xs text-slate-500">NCI = quote-part d'actif net = {fmt(c.qpNci)}</div>
              </div>
              <div className={`rounded-lg border p-3 ${c.full ? "border-emerald-300 bg-emerald-50" : "border-slate-200"}`}>
                <div className="text-xs font-semibold text-emerald-600">Goodwill complet</div>
                <div className="text-2xl font-bold text-emerald-700 tabular-nums">{fmt(c.gwFull)}</div>
                <div className="text-xs text-slate-500">NCI à la JV = {fmt(num(d.jvNci))} (dont {fmt(c.gwFull - c.gwPartial)} de goodwill)</div>
              </div>
            </div>
          </Card>
          {c.gw < 0 && <Note type="warn"><strong>Goodwill négatif (badwill)</strong> : prix &lt; JV acquise. En IFRS, après réexamen, l'écart est un <strong>produit immédiat</strong>.</Note>}
        </div>
      );
      case 3: return (
        <div className="space-y-5">
          <Card title="Répartition des capitaux propres de la filiale" icon={<GitBranch size={18} className="text-indigo-600" />} accent="indigo">
            <p className="text-xs text-slate-500 mb-2">À l'acquisition — capitaux propres à la JV = {fmt(c.X)}</p>
            <SplitBar left={c.full ? c.X - c.qpNci : c.qpGroupe} right={c.qpNci} lLabel={`Part groupe (${d.pctMere} %) → éliminée vs titres`} rLabel={`Minoritaires (${fmt(100 - num(d.pctMere))} %)`} />
            <p className="text-xs text-slate-500 mt-4 mb-2">Résultats accumulés depuis l'acquisition = {fmt(c.deltaR)}</p>
            <SplitBar left={c.pct * c.deltaR} right={(1 - c.pct) * c.deltaR} lLabel="Réserves consolidées (groupe)" rLabel="Minoritaires" lColor="indigo" rColor="amber" />
          </Card>
          <div className="space-y-3">
            <Journal n="1" title="Élimination des titres & goodwill (à l'acquisition)"
              lines={[
                { compte: "Capital social (filiale)", debit: num(d.fCap) },
                { compte: "Réserves (à l'acquisition)", debit: num(d.fResAcq) },
                { compte: "Écart d'évaluation", debit: c.ecartNet },
                ...(c.gw >= 0 ? [{ compte: c.compense ? "Réserves consolidées (goodwill compensé)" : "Goodwill", debit: c.gw }] : []),
                { compte: "Titres de participation", credit: c.prix },
                { compte: "Intérêts minoritaires", credit: c.nciAcq },
                ...(c.gw < 0 ? [{ compte: "Produit (badwill)", credit: -c.gw }] : []),
              ]}
              note="On solde les capitaux propres de la filiale à la date d'acquisition contre les titres de la mère ; l'écart résiduel est le goodwill, et la quote-part des autres actionnaires devient l'intérêt minoritaire." />
            <Journal n="2" title="Partage des réserves accumulées depuis l'acquisition"
              lines={[{ compte: "Réserves (filiale, post-acquisition)", debit: c.deltaR }, { compte: "Réserves consolidées (part groupe)", credit: c.pct * c.deltaR }, { compte: "Intérêts minoritaires (quote-part)", credit: (1 - c.pct) * c.deltaR }]}
              note={`Écriture de partage des capitaux propres : les ${fmt(c.deltaR)} de résultats générés depuis la prise de contrôle reviennent au groupe pour ${fmt(c.pct * c.deltaR)} et aux minoritaires pour ${fmt((1 - c.pct) * c.deltaR)}.`} />
          </div>
          {c.compense && <Note type="info">Option Swiss GAAP « compensation » active : le goodwill ({fmt(c.gw)}) est porté en diminution des capitaux propres au lieu de l'actif.</Note>}
        </div>
      );
      case 4: return (
        <div className="space-y-4">
          <Note type="info">Après le cumul, les opérations internes sont comptées en double. On les neutralise pour ne garder que les flux avec l'extérieur.</Note>
          <Journal n="3" title="Élimination des créances / dettes réciproques"
            lines={[{ compte: "Dettes (fournisseur intragroupe)", debit: c.ic }, { compte: "Créances (client intragroupe)", credit: c.ic }]}
            note={`Les ${fmt(c.ic)} de créances et de dettes réciproques disparaissent du bilan consolidé.`} />
          <Journal n="4" title="Élimination de la marge interne sur stock (vente descendante)"
            lines={[{ compte: "Réserves consolidées / Résultat", debit: c.marge }, { compte: "Stocks", credit: c.marge }]}
            note={`La mère a vendu à la filiale avec une marge de ${fmt(c.marge)} ; tant que le stock n'est pas revendu hors groupe, ce profit n'est pas réalisé. Vente ascendante : la marge serait partagée avec les minoritaires.`} />
          <Card title="Autres éliminations classiques" icon={<ListChecks size={18} className="text-slate-600" />}>
            <ul className="text-sm text-slate-600 space-y-1.5">
              {[["Produits / charges réciproques", "Ventes/achats, intérêts, loyers, redevances internes."], ["Dividendes intragroupe", "Le produit chez la mère est éliminé (déjà dans les réserves de la filiale)."], ["Plus-value interne sur immobilisation", "Annulée, avec correction des amortissements ultérieurs."], ["Provisions internes", "Dépréciation de créance ou de titres intragroupe neutralisée."]].map((x, i) => (
                <li key={i} className="flex gap-2"><CheckCircle2 size={16} className="text-slate-300 shrink-0 mt-0.5" /><span><strong className="text-slate-700">{x[0]}</strong> — {x[1]}</span></li>
              ))}
            </ul>
          </Card>
        </div>
      );
      case 5: return (
        <div className="space-y-5">
          <div className="bg-white rounded-xl border border-slate-200 p-3"><RefSwitch /></div>
          {opt.ref === "ifrs" ? (
            <Card title="Traitement IFRS — goodwill non amorti" icon={<FileText size={18} className="text-indigo-600" />} accent="indigo">
              <p className="text-sm text-slate-600">En IFRS, le goodwill ({fmt(c.gw)}) <strong>reste à l'actif sans amortissement</strong>, avec un <strong>test de dépréciation annuel</strong> (IAS 36) au niveau de l'unité génératrice de trésorerie.</p>
              <Journal n="5" title="Dépréciation du goodwill (uniquement si test négatif)"
                lines={[{ compte: "Perte de valeur (résultat)", debit: 0 }, { compte: "Goodwill", credit: 0 }]}
                note="Comptabilisée seulement si la valeur recouvrable devient inférieure à la valeur comptable. Irréversible pour le goodwill." />
            </Card>
          ) : (
            <Card title="Option Swiss GAAP RPC 30" icon={<FileText size={18} className="text-red-600" />} accent="red">
              <div className="flex items-center gap-2 mb-3 flex-wrap">
                <span className="text-xs text-slate-500">Méthode :</span>
                <div className="flex rounded-lg border border-slate-300 overflow-hidden text-xs">
                  <button onClick={() => setOpt({ ...opt, gwTreat: "capitalise" })} className={`px-3 py-1 ${opt.gwTreat === "capitalise" ? "bg-red-600 text-white" : "bg-white text-slate-600"}`}>Activé + amorti</button>
                  <button onClick={() => setOpt({ ...opt, gwTreat: "compense" })} className={`px-3 py-1 ${opt.gwTreat === "compense" ? "bg-red-600 text-white" : "bg-white text-slate-600"}`}>Compensé avec fonds propres</button>
                </div>
              </div>
              {opt.gwTreat === "capitalise" ? (
                <>
                  <div className="flex items-center gap-2 mb-3 flex-wrap">
                    <span className="text-sm text-slate-600">Durée</span>
                    <div className="flex rounded-lg border border-slate-300 overflow-hidden text-xs">
                      {[3, 5, 10, 20].map((y) => (<button key={y} onClick={() => setOpt({ ...opt, amort: y })} className={`px-2.5 py-1 ${opt.amort === y ? "bg-indigo-600 text-white" : "bg-white text-slate-600"}`}>{y} ans</button>))}
                    </div>
                  </div>
                  <Journal n="5" title={`Amortissement annuel du goodwill (${opt.amort} ans)`}
                    lines={[{ compte: "Charge d'amortissement (résultat)", debit: c.amortAnnual }, { compte: "Goodwill (amort. cumulés)", credit: c.amortAnnual }]}
                    note={`Goodwill ${fmt(c.gw)} ÷ ${opt.amort} ans = ${fmt(c.amortAnnual)} par an.`} />
                  <div className="mt-3 rounded-lg border border-slate-200 overflow-hidden overflow-x-auto">
                    <table className="w-full text-sm min-w-max">
                      <thead><tr className="bg-slate-100 text-slate-600 text-xs">
                        <th className="px-3 py-1.5 text-left">Année</th><th className="px-3 py-1.5 text-right">Ouverture</th><th className="px-3 py-1.5 text-right">Dotation</th><th className="px-3 py-1.5 text-right">VNC clôture</th>
                      </tr></thead>
                      <tbody>
                        {Array.from({ length: opt.amort }, (_, i) => {
                          const ouv = c.gw - i * c.amortAnnual;
                          return (<tr key={i} className="border-t border-slate-100">
                            <td className="px-3 py-1.5">{i + 1}</td><td className="px-3 py-1.5 text-right tabular-nums">{fmt(ouv)}</td><td className="px-3 py-1.5 text-right tabular-nums">{fmt(c.amortAnnual)}</td><td className="px-3 py-1.5 text-right tabular-nums">{fmt(ouv - c.amortAnnual)}</td>
                          </tr>);
                        })}
                      </tbody>
                    </table>
                  </div>
                  <Note type="info">RPC 30 : durée d'utilité, <strong>usuellement 5 ans, maximum 20</strong>, avec test de dépréciation complémentaire.</Note>
                </>
              ) : (
                <>
                  <Journal n="5" title="Compensation du goodwill avec les capitaux propres (à l'acquisition)"
                    lines={[{ compte: "Réserves consolidées", debit: c.gw }, { compte: "Goodwill (jamais inscrit à l'actif)", credit: c.gw }]}
                    note="Le goodwill est imputé directement sur les fonds propres ; il n'apparaît pas au bilan et n'est pas amorti." />
                  <Note type="warn">L'<strong>annexe doit indiquer l'effet théorique</strong> d'une activation/amortissement (impact sur capitaux propres et résultat).</Note>
                </>
              )}
            </Card>
          )}
        </div>
      );
      case 6: return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-3 flex flex-wrap gap-4 items-center justify-between"><MethodSwitch /><RefSwitch /></div>
          <Note type="tip">Les bilans côte à côte : la <strong>Mère</strong> et la <strong>Filiale</strong> ci-dessous, combinées par les écritures de consolidation, donnent le <strong>bilan du groupe</strong> juste en dessous. Repère ce qui change : les titres disparaissent, le goodwill apparaît, le capital se réduit à celui de la mère, et les minoritaires surgissent au passif.</Note>
          <div className="grid sm:grid-cols-2 gap-4">
            <BilanView title="Mère" accent="indigo"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Titres de participation", v: num(d.prix) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves", v: num(d.mRes) }, { l: "Dettes", v: num(d.mDettes) }]} />
            <BilanView title="Filiale" accent="slate"
              actifs={[{ l: "Actifs", v: num(d.fActifs) }]}
              passifs={[{ l: "Capital", v: num(d.fCap) }, { l: "Réserves (clôture)", v: num(d.fResClot) }, { l: "Dettes", v: num(d.fDettes) }]} />
          </div>
          <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div className="bg-slate-800 text-white px-4 py-2.5 flex items-center justify-between">
              <span className="font-semibold flex items-center gap-2"><Banknote size={16} /> Bilan consolidé (Groupe)</span>
              <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${c.okBilan ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>{c.okBilan ? <CheckCircle2 size={12} /> : <AlertTriangle size={12} />}{c.okBilan ? "équilibré" : "déséquilibré"}</span>
            </div>
            <div className="grid sm:grid-cols-2 divide-y sm:divide-y-0 sm:divide-x divide-slate-100">
              <div className="p-4">
                <div className="text-xs font-semibold uppercase text-slate-400 mb-2">Actif</div>
                {[["Goodwill", c.gwActif], ["Autres actifs (cumul + écart − intragroupe − marge)", c.cActifs]].map((r, i) => (
                  <div key={i} className="flex justify-between py-1.5 text-sm text-slate-700"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
                ))}
                <div className="flex justify-between py-2 mt-1 border-t-2 border-slate-300 font-bold text-slate-900"><span>Total</span><span className="tabular-nums">{fmt(c.totActif)}</span></div>
              </div>
              <div className="p-4">
                <div className="text-xs font-semibold uppercase text-slate-400 mb-2">Passif</div>
                {[["Capital (groupe)", num(d.mCap)], ["Réserves consolidées", c.resConsoFinal], ["Intérêts minoritaires", c.nci], ...(c.DTL > 0 ? [["Impôt différé passif", c.DTL]] : []), ["Dettes (cumul − intragroupe)", num(d.mDettes) + num(d.fDettes) - c.ic]].map((r, i) => (
                  <div key={i} className="flex justify-between py-1.5 text-sm text-slate-700"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
                ))}
                <div className="flex justify-between py-2 mt-1 border-t-2 border-slate-300 font-bold text-slate-900"><span>Total</span><span className="tabular-nums">{fmt(c.totPassif)}</span></div>
              </div>
            </div>
          </div>
          <Note type="tip">Capital = <strong>celui de la mère seule</strong> ; réserves consolidées = réserves mère + part groupe des résultats post-acquisition − marges internes{c.compense ? " − goodwill compensé" : ""} ; minoritaires = leur quote-part de la filiale à la clôture.</Note>
          <Note type="info">Le goodwill est présenté à sa <strong>valeur d'acquisition</strong> (première consolidation) ; son amortissement éventuel (Swiss GAAP) est traité à l'étape précédente. {c.gw < 0 ? "Ici le goodwill est négatif (badwill) : il n'est pas inscrit à l'actif mais comptabilisé en produit, donc logé dans les réserves consolidées." : ""}</Note>
        </div>
      );
      default: return null;
    }
  };

  const notable = () => {
    switch (step) {
      case 0: return (
        <div className="grid lg:grid-cols-2 gap-5">
          <Card title="Structure" icon={<Network size={18} className="text-emerald-600" />} accent="emerald">
            <GroupSchema pct={num(d.pctMere)} kind="notable" />
            <Note type="tip">Influence notable : aucun actif/passif repris, une seule ligne « participations mises en équivalence ».</Note>
          </Card>
          <Card title="Données de la participation" icon={<Calculator size={18} className="text-emerald-600" />}>
            <Field label="Pourcentage détenu" value={d.pctMere} onChange={u("pctMere")} suffix="%" />
            <Field label="Coût d'acquisition des titres" value={d.prix} onChange={u("prix")} />
            <Field label="Capital de l'entité" value={d.fCap} onChange={u("fCap")} />
            <Field label="Réserves à l'acquisition" value={d.fResAcq} onChange={u("fResAcq")} />
            <Field label="Réserves à la clôture" value={d.fResClot} onChange={u("fResClot")} />
            <Field label="Écart d'évaluation" value={d.ecart} onChange={u("ecart")} />
          </Card>
        </div>
      );
      case 1: return (
        <Card title="Valeur d'équivalence à l'acquisition" icon={<Coins size={18} className="text-emerald-600" />} accent="emerald">
          <div className="space-y-1 text-sm">
            {[["Coût d'acquisition", c.prix], [`Quote-part d'actif net acquise (${d.pctMere} %)`, c.qpGroupe], ["Goodwill (inclus dans la valeur des titres)", c.gwEmbeddedME]].map((r, i) => (
              <div key={i} className="flex justify-between py-1.5 text-slate-600"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
            ))}
          </div>
          <Note type="info">En mise en équivalence, le goodwill <strong>n'est pas isolé</strong> : il est compris dans la valeur comptable des titres (jamais amorti en IFRS).</Note>
        </Card>
      );
      case 2: return (
        <div className="space-y-4">
          <Card title="Évolution depuis l'acquisition" icon={<TrendingDown size={18} className="text-emerald-600" />} accent="emerald">
            <div className="space-y-1 text-sm">
              {[["Valeur initiale (coût)", c.prix], [`Quote-part du résultat accumulé (${d.pctMere} % × ${fmt(c.deltaR)})`, c.pct * c.deltaR], ["Valeur d'équivalence à la clôture", c.valME]].map((r, i) => (
                <div key={i} className={`flex justify-between py-1.5 ${i === 2 ? "font-semibold text-emerald-700 border-t border-emerald-100 mt-1 pt-2" : "text-slate-600"}`}><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
              ))}
            </div>
          </Card>
          <Journal n="1" title="Réévaluation des titres mis en équivalence"
            lines={[{ compte: "Titres mis en équivalence", debit: c.pct * c.deltaR }, { compte: "Réserves consolidées (quote-part de résultat)", credit: c.pct * c.deltaR }]}
            note="Chaque exercice, la valeur des titres augmente de la quote-part du résultat (et diminue des dividendes reçus, ici nuls)." />
        </div>
      );
      case 3: return (
        <div className="space-y-4">
          <Card title="Présentation dans les comptes consolidés" icon={<FileText size={18} className="text-emerald-600" />} accent="emerald">
            <div className="rounded-lg border border-slate-200 overflow-hidden">
              <div className="bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">Au bilan (une seule ligne)</div>
              <div className="flex justify-between px-3 py-2 text-sm"><span className="text-slate-700">Participations mises en équivalence</span><span className="tabular-nums font-semibold">{fmt(c.valME)}</span></div>
            </div>
            <div className="rounded-lg border border-slate-200 overflow-hidden mt-3">
              <div className="bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600">Au compte de résultat</div>
              <div className="flex justify-between px-3 py-2 text-sm"><span className="text-slate-700">Quote-part du résultat des entreprises associées</span><span className="tabular-nums font-semibold">{fmt(c.pct * c.deltaR)}</span></div>
            </div>
          </Card>
          <Note type="tip">Le bilan du groupe = celui de la mère, où les <strong>titres au coût</strong> ({fmt(num(d.prix))}) deviennent une <strong>participation mise en équivalence</strong> ({fmt(c.valME)}). Aucun actif/passif de l'associée n'y entre.</Note>
          <div className="grid md:grid-cols-2 gap-4">
            <BilanView title="Bilan individuel — Mère" accent="slate"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Titres de participation", v: num(d.prix) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves", v: num(d.mRes) }, { l: "Dettes", v: num(d.mDettes) }]} />
            <BilanView title="Bilan consolidé (mise en équivalence)" accent="emerald"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Participations mises en équivalence", v: c.valME }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves consolidées", v: num(d.mRes) + c.pct * c.deltaR }, { l: "Dettes", v: num(d.mDettes) }]} />
          </div>
        </div>
      );
      default: return null;
    }
  };

  const conjoint = () => {
    switch (step) {
      case 0: return (
        <div className="grid lg:grid-cols-2 gap-5">
          <Card title="Structure" icon={<GitBranch size={18} className="text-amber-600" />} accent="amber">
            <GroupSchema pct={num(d.pctMere)} kind="conjoint" />
            <Note type="tip">Contrôle conjoint : le traitement diffère fortement entre IFRS et Swiss GAAP.</Note>
          </Card>
          <Card title="Données de la coentreprise" icon={<Calculator size={18} className="text-amber-600" />}>
            <Field label="Quote-part détenue" value={d.pctMere} onChange={u("pctMere")} suffix="%" />
            <Field label="Coût des titres" value={d.prix} onChange={u("prix")} />
            <Field label="Capital" value={d.fCap} onChange={u("fCap")} />
            <Field label="Réserves à l'acquisition" value={d.fResAcq} onChange={u("fResAcq")} />
            <Field label="Réserves à la clôture" value={d.fResClot} onChange={u("fResClot")} />
            <Field label="Actifs de la coentreprise" value={d.fActifs} onChange={u("fActifs")} />
            <Field label="Dettes de la coentreprise" value={d.fDettes} onChange={u("fDettes")} />
            <Field label="Écart d'évaluation" value={d.ecart} onChange={u("ecart")} />
          </Card>
        </div>
      );
      case 1: return (
        <div className="grid md:grid-cols-2 gap-4">
          <Card title="IFRS (IFRS 11 / IAS 28)" icon={<Scale size={18} className="text-indigo-600" />} accent="indigo">
            <p className="text-sm text-slate-600">Une <strong>coentreprise</strong> (droits sur l'actif net) est traitée par <strong>mise en équivalence</strong>. L'intégration proportionnelle est <strong>interdite</strong> pour les coentreprises.</p>
            <div className="mt-3 rounded-lg bg-indigo-50 p-3 text-sm"><div className="flex justify-between"><span className="text-indigo-700">Valeur d'équivalence à la clôture</span><span className="tabular-nums font-semibold text-indigo-800">{fmt(c.valME)}</span></div></div>
            <Note type="info">Si c'est une « activité conjointe » (droits sur les actifs, obligations sur les passifs), on reprend directement sa quote-part d'actifs/passifs.</Note>
          </Card>
          <Card title="Swiss GAAP RPC 30" icon={<Scale size={18} className="text-red-600" />} accent="red">
            <p className="text-sm text-slate-600">L'<strong>intégration proportionnelle est autorisée</strong> : on reprend la quote-part ({d.pctMere} %) de chaque actif et passif. La mise en équivalence reste possible.</p>
            <div className="mt-3 rounded-lg bg-red-50 p-3 text-sm space-y-1">
              <div className="flex justify-between"><span className="text-red-700">Quote-part des actifs repris</span><span className="tabular-nums font-semibold text-red-800">{fmt(c.pct * num(d.fActifs))}</span></div>
              <div className="flex justify-between"><span className="text-red-700">Goodwill (sur la quote-part)</span><span className="tabular-nums font-semibold text-red-800">{fmt(c.gwEmbeddedME)}</span></div>
            </div>
          </Card>
        </div>
      );
      case 2: return (
        <div className="space-y-4">
          <Card title="Intégration proportionnelle — principe" icon={<Layers size={18} className="text-amber-600" />} accent="amber">
            <p className="text-sm text-slate-600 mb-3">On additionne au bilan de la mère la <strong>quote-part</strong> de chaque poste de la coentreprise ({d.pctMere} %), sans intérêts minoritaires.</p>
            <div className="space-y-1 text-sm">
              {[[`Quote-part des actifs (${d.pctMere} %)`, c.pct * num(d.fActifs)], ["Quote-part de l'écart d'évaluation", c.pct * c.ecart], ["Goodwill", c.gwEmbeddedME]].map((r, i) => (
                <div key={i} className="flex justify-between py-1.5 text-slate-600"><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
              ))}
            </div>
            <Note type="warn">Méthode <strong>spécifique à Swiss GAAP</strong> pour les coentreprises : interdite en IFRS, où la mise en équivalence s'impose.</Note>
          </Card>
          <Note type="tip">Les bilans : la <strong>coentreprise à 100 %</strong>, puis le <strong>consolidé proportionnel</strong> qui n'en reprend que la quote-part ({d.pctMere} %), sans minoritaires.</Note>
          <div className="grid md:grid-cols-3 gap-4">
            <BilanView title="Mère" accent="slate"
              actifs={[{ l: "Autres actifs", v: num(d.mActifs) }, { l: "Titres", v: num(d.prix) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves", v: num(d.mRes) }, { l: "Dettes", v: num(d.mDettes) }]} />
            <BilanView title="Coentreprise (100 %)" accent="amber"
              actifs={[{ l: "Actifs", v: num(d.fActifs) }]}
              passifs={[{ l: "Capital", v: num(d.fCap) }, { l: "Réserves (clôture)", v: num(d.fResClot) }, { l: "Dettes", v: num(d.fDettes) }]} />
            <BilanView title="Consolidé (proportionnel)" accent="emerald"
              actifs={[{ l: "Goodwill", v: c.gwEmbeddedME }, { l: "Autres actifs (+ quote-part)", v: num(d.mActifs) + c.pct * num(d.fActifs) + c.pct * num(d.ecart) }]}
              passifs={[{ l: "Capital", v: num(d.mCap) }, { l: "Réserves consolidées", v: num(d.mRes) + c.pct * c.deltaR }, { l: "Dettes (+ quote-part)", v: num(d.mDettes) + c.pct * num(d.fDettes) }]} />
          </div>
        </div>
      );
      default: return null;
    }
  };

  /* ===================== Vu UE4 — présentation type DSCG ===================== */
  const ue4Exclusif = () => {
    const p = num(d.pctMere), minor = 100 - p;
    const capG = num(d.fCap) * c.pct, capN = num(d.fCap) * (1 - c.pct);
    const resClotRetr = num(d.fResClot) + c.ecartNet;
    const resG = resClotRetr * c.pct, resN = resClotRetr * (1 - c.pct);
    const coutTitresJV = c.qpGroupe;
    const contribG = capG + resG - coutTitresJV;
    const partageNCI = capN + resN;
    const gwGroupe = c.gwPartial;
    const gwNci = c.full ? (num(d.jvNci) - c.qpNci) : 0;
    switch (step) {
      case 0: return (
        <UE4Cols title="Périmètre de consolidation (Dossier 1 — DSCG)"
          cols={["Société", "% contrôle", "Nature du contrôle", "Méthode", "% d'intérêt", "% NCI"]}
          rows={[{ label: "Filiale", vals: [`${d.pctMere} %`, "Contrôle exclusif", "Intégration globale", `${d.pctMere} %`, `${fmt(minor)} %`] }]}
          note="Au DSCG, le dossier conso s'ouvre toujours par ce tableau : pour chaque société, le % de contrôle (→ choix de la méthode) et le % d'intérêt (→ part économique). En contrôle exclusif sans chaîne, contrôle = intérêt." />
      );
      case 1: return (
        <div className="space-y-4">
          <UE4Cols title="Juste valeur des actifs identifiables et passifs repris (à la date d'acquisition)"
            cols={["Détermination de la juste valeur", "Montant"]}
            rows={[
              { label: "Capitaux propres à la date d'acquisition (capital + réserves)", vals: [num(d.fCap) + num(d.fResAcq)], calc: `capital filiale ${fmt(num(d.fCap))} + réserves à l'acquisition ${fmt(num(d.fResAcq))} = ${fmt(num(d.fCap) + num(d.fResAcq))}` },
              { label: "+ Plus-value latente (écart d'évaluation brut)", vals: [c.ecart], calc: "donnée d'entrée : écart d'évaluation brut (plus-value latente sur les actifs réévalués)" },
              { label: `− Impôt différé (${d.taux} %)`, vals: [-c.DTL], calc: `écart brut ${fmt(c.ecart)} × taux ${d.taux} % = ${fmt(c.DTL)}` },
              { label: "= Juste valeur des actifs identifiables (actif net retraité)", vals: [c.X], bold: true, calc: `${fmt(num(d.fCap) + num(d.fResAcq))} + ${fmt(c.ecart)} − ${fmt(c.DTL)} = ${fmt(c.X)}` },
            ]}
            note="Présentation DSCG type « SAS CAMOMILLE / SA TULIPE » : on part des capitaux propres comptables, on ajoute les plus-values latentes nettes d'impôt différé. Avec un taux à 0 %, l'ID est nul — mets ~14 % pour voir l'effet." />
          <Journal n="UE4" title="Constatation de l'écart d'évaluation à la juste valeur"
            lines={[{ compte: "Actifs identifiables réévalués", debit: c.ecart }, { compte: "Impôt différé passif (IAS 12)", credit: c.DTL }, { compte: "Réserves filiale (plus-value nette)", credit: c.ecartNet }]}
            note="Écriture au journal de consolidation — bilan. La contrepartie de la plus-value nette est portée en réserves de la filiale (date d'acquisition)." />
        </div>
      );
      case 2: return (
        <div className="space-y-4">
          <div className="flex flex-wrap gap-4 items-center justify-between bg-white rounded-xl border border-slate-200 p-3"><MethodSwitch /><RefSwitch /></div>
          <UE4Cols title={`Calcul du goodwill — méthode ${c.full ? "complète" : "partielle"}`}
            cols={["", `Part propriétaires (${p} %)`, `Part. NCI (${fmt(minor)} %)`, "Total (100 %)"]}
            rows={[
              { label: "Coût des titres / valeur transférée", vals: [num(d.prix), c.full ? num(d.jvNci) : c.qpNci, num(d.prix) + (c.full ? num(d.jvNci) : c.qpNci)], calc: `groupe : coût payé ${fmt(num(d.prix))} (donnée) ; NCI : ${c.full ? `juste valeur des minoritaires ${fmt(num(d.jvNci))} (donnée)` : `quote-part d'actif net = ${fmt(c.X)} × ${fmt(minor)} % = ${fmt(c.qpNci)}`}` },
              { label: "Quote-part de juste valeur de la société", vals: [c.qpGroupe, c.qpNci, c.X], calc: `actif net ${fmt(c.X)} réparti : × ${p} % = ${fmt(c.qpGroupe)} (groupe) ; × ${fmt(minor)} % = ${fmt(c.qpNci)} (NCI)` },
              { label: "= Goodwill", vals: [gwGroupe, gwNci, c.full ? c.gwFull : c.gwPartial], bold: true, calc: `groupe : ${fmt(num(d.prix))} − ${fmt(c.qpGroupe)} = ${fmt(gwGroupe)}${c.full ? ` ; NCI : ${fmt(num(d.jvNci))} − ${fmt(c.qpNci)} = ${fmt(gwNci)}` : " ; NCI : aucun goodwill (méthode partielle)"}` },
            ]}
            note={c.full ? "Méthode complète (option IFRS) : les NCI sont à leur juste valeur, le goodwill inclut leur quote-part." : "Méthode partielle (usuelle Swiss GAAP / fréquente DSCG) : les NCI sont à la quote-part d'actif net, aucun goodwill sur les NCI."} />
          {c.gw >= 0 ? (
            <Journal n="UE4" title="Comptabilisation du goodwill"
              lines={[{ compte: "Goodwill", debit: c.full ? c.gwFull : c.gwPartial }, { compte: "Titres de participation", credit: gwGroupe }, ...(gwNci > 0 ? [{ compte: "Participation ne donnant pas le contrôle", credit: gwNci }] : [])]}
              note="Écriture au bilan. On isole d'abord la composante goodwill ; le reste des titres sera soldé dans l'écriture de partage des capitaux propres." />
          ) : (
            <Note type="warn"><strong>Goodwill négatif (badwill)</strong> : prix &lt; quote-part de JV acquise. En IFRS, après réexamen, l'écart est comptabilisé en <strong>produit</strong> (et non en goodwill).</Note>
          )}
        </div>
      );
      case 3: return (
        <div className="space-y-4">
          <UE4Cols title="Tableau de partage des capitaux propres de la filiale"
            cols={["", "TOTAL (100 %)", `Part propriétaires (${p} %)`, `Part. NCI (${fmt(minor)} %)`]}
            rows={[
              { label: "Capital", vals: [num(d.fCap), capG, capN], calc: `donnée : capital de la filiale ${fmt(num(d.fCap))}. Partage : × ${p} % = ${fmt(capG)} (groupe) ; × ${fmt(minor)} % = ${fmt(capN)} (NCI)` },
              { label: "Réserves retraitées à la clôture (réserves + écart net)", vals: [resClotRetr, resG, resN], calc: `réserves à la clôture ${fmt(num(d.fResClot))} (donnée) + écart d'évaluation net ${fmt(c.ecartNet)} = ${fmt(resClotRetr)}. L'écart net = écart brut ${fmt(c.ecart)} − impôt différé ${fmt(c.DTL)} (cf. étape Retraitements). Partage : × ${p} % = ${fmt(resG)} ; × ${fmt(minor)} % = ${fmt(resN)}` },
              { label: "− Coût des titres à la juste valeur (coût − goodwill groupe)", vals: [-coutTitresJV, -coutTitresJV, ""], calc: `coût d'acquisition ${fmt(num(d.prix))} − goodwill du groupe ${fmt(gwGroupe)} = ${fmt(coutTitresJV)} (= quote-part groupe de l'actif net ; le goodwill a déjà été isolé à l'étape Goodwill)` },
              { label: "= Contribution aux réserves consolidées (groupe)", vals: ["", contribG, ""], bold: true, calc: `capital groupe ${fmt(capG)} + réserves groupe ${fmt(resG)} − coût des titres ${fmt(coutTitresJV)} = ${fmt(contribG)}` },
              { label: "Part ne donnant pas le contrôle (NCI)", vals: ["", "", partageNCI], bold: true, calc: `capital NCI ${fmt(capN)} + réserves NCI ${fmt(resN)} = ${fmt(partageNCI)}` },
            ]}
            note={`Cœur de l'épreuve DSCG. Le goodwill (${fmt(gwGroupe)}) ayant déjà été isolé à l'étape précédente, on solde ici le reste des titres (${fmt(coutTitresJV)}). Réserves consolidées finales = réserves mère (${fmt(num(d.mRes))}) + contribution filiale (${fmt(contribG)}) − marge interne (${fmt(c.marge)}). Ici résultat et réserves sont regroupés ; au DSCG le résultat aurait sa propre ligne.`} />
          <Journal n="UE4" title="Partage des capitaux propres — écriture au bilan"
            lines={[
              { compte: "Capital social (filiale)", debit: num(d.fCap) },
              { compte: "Réserves filiale (retraitées)", debit: resClotRetr },
              { compte: "Titres de participation", credit: coutTitresJV },
              { compte: "Réserves consolidées (groupe)", credit: contribG },
              { compte: "Participation ne donnant pas le contrôle", credit: partageNCI },
            ]}
            note="Combinée à l'écriture de goodwill, les titres sont totalement soldés (coût d'acquisition d'origine)." />
        </div>
      );
      case 4: return (
        <div className="space-y-4">
          <UE4Cols title="Élimination de la marge interne sur stock"
            cols={["Vente descendante (mère → filiale)", "Montant"]}
            rows={[
              { label: "Marge interne non réalisée incluse dans le stock", vals: [c.marge], calc: "donnée : marge réalisée par la mère sur le stock encore détenu par la filiale" },
              { label: "Impôt différé", vals: ["—"], calc: "non modélisé dans cet outil (le taux d'impôt n'est pas appliqué à la marge)" },
              { label: "= Net éliminé des réserves/résultat", vals: [c.marge], bold: true, calc: `marge ${fmt(c.marge)} − impôt différé 0 = ${fmt(c.marge)}` },
            ]}
            note="Au DSCG, la marge interne est présentée nette d'impôt différé (cf. tableaux « à l'ouverture / variation / clôture » des annales). Cet outil omet volontairement l'ID sur la marge pour garder le bilan bouclé — c'est une piste d'extension assumée." />
          <Journal n="UE4" title="Élimination de la marge interne — écriture au bilan"
            lines={[{ compte: "Réserves consolidées / Résultat", debit: c.marge }, { compte: "Stocks", credit: c.marge }]}
            note="Le profit interne disparaît tant que le bien n'est pas revendu hors du groupe." />
          <Journal n="UE4" title="Élimination des comptes réciproques — écriture au bilan"
            lines={[{ compte: "Dettes fournisseurs (intragroupe)", debit: c.ic }, { compte: "Créances clients (intragroupe)", credit: c.ic }]}
            note="Au compte de gestion, on élimine aussi les ventes/achats réciproques (montant non saisi dans cet exemple) : Dr Ventes / Cr Achats." />
        </div>
      );
      case 5: return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-slate-200 p-3"><RefSwitch /></div>
          {opt.ref === "ifrs" ? (
            <>
              <Note type="info"><strong>IFRS</strong> : le goodwill ({fmt(c.gw)}) <strong>n'est pas amorti</strong> ; il fait l'objet d'un <strong>test de dépréciation annuel</strong> (IAS 36) au niveau de l'UGT, sans reprise possible.</Note>
              <Journal n="UE4" title="Dépréciation du goodwill (seulement si test négatif)"
                lines={[{ compte: "Perte de valeur (résultat)", debit: 0 }, { compte: "Goodwill", credit: 0 }]}
                note="Comptabilisée uniquement si la valeur recouvrable < valeur comptable." />
            </>
          ) : opt.gwTreat === "compense" ? (
            <>
              <Note type="warn"><strong>Swiss GAAP — compensation</strong> : le goodwill est imputé sur les fonds propres, n'apparaît pas à l'actif et n'est pas amorti. L'annexe doit indiquer l'effet théorique d'une activation.</Note>
              <Journal n="UE4" title="Compensation du goodwill avec les fonds propres"
                lines={[{ compte: "Réserves consolidées", debit: c.gw }, { compte: "Goodwill (jamais inscrit à l'actif)", credit: c.gw }]} />
            </>
          ) : (
            <>
              <UE4Cols title={`Amortissement du goodwill (${opt.amort} ans) — année 1`}
                cols={["", "À l'ouverture", "Variation (dotation)", "À la clôture"]}
                rows={[
                  { label: "Goodwill (valeur brute)", vals: [c.gw, "", c.gw], calc: `montant calculé à l'étape Goodwill = ${fmt(c.gw)}` },
                  { label: "Amortissement cumulé", vals: [0, c.amortAnnual, c.amortAnnual], calc: `dotation = goodwill ${fmt(c.gw)} ÷ ${opt.amort} ans = ${fmt(c.amortAnnual)}` },
                  { label: "= Valeur nette comptable", vals: [c.gw, -c.amortAnnual, c.gw - c.amortAnnual], bold: true, calc: `${fmt(c.gw)} − ${fmt(c.amortAnnual)} = ${fmt(c.gw - c.amortAnnual)}` },
                ]}
                note={`Présentation DSCG « à l'ouverture / variation / clôture ». Goodwill ${fmt(c.gw)} ÷ ${opt.amort} ans = ${fmt(c.amortAnnual)} de dotation annuelle.`} />
              <Journal n="UE4" title="Dotation annuelle aux amortissements du goodwill"
                lines={[{ compte: "Charge d'amortissement (résultat)", debit: c.amortAnnual }, { compte: "Goodwill (amort. cumulés)", credit: c.amortAnnual }]} />
            </>
          )}
        </div>
      );
      case 6: return (
        <div className="space-y-4">
          <UE4Cols title="Détermination des réserves consolidées (part du groupe)"
            cols={["", "Montant"]}
            rows={[
              { label: "Réserves de la société mère", vals: [num(d.mRes)], calc: "donnée : réserves propres de la mère" },
              { label: "+ Contribution de la filiale (part groupe)", vals: [contribG], calc: `= ${p} % × résultats post-acquisition ${fmt(c.deltaR)} = ${fmt(contribG)} (résultats post-acq = réserves clôture ${fmt(num(d.fResClot))} − réserves acquisition ${fmt(num(d.fResAcq))})` },
              { label: "− Élimination de la marge interne", vals: [-c.marge], calc: "marge interne éliminée (cf. étape Éliminations)" },
              ...(c.compense ? [{ label: "− Goodwill compensé avec les fonds propres", vals: [-c.gw], calc: `goodwill ${fmt(c.gw)} imputé directement sur les fonds propres` }] : []),
              ...(c.gw < 0 ? [{ label: "+ Produit de badwill logé en réserves", vals: [-c.gw], calc: `goodwill négatif ${fmt(c.gw)} comptabilisé en produit` }] : []),
              { label: "= Réserves consolidées (groupe, résultat inclus)", vals: [c.resConsoFinal], bold: true, calc: `${fmt(num(d.mRes))} + ${fmt(contribG)} − ${fmt(c.marge)}${(c.compense || c.gw < 0) ? ` ${c.gw >= 0 ? "−" : "+"} ${fmt(Math.abs(c.gw))}` : ""} = ${fmt(c.resConsoFinal)}` },
            ]}
            note={`Au DSCG, on conclut par la réconciliation des réserves et du résultat consolidés (et non par un bilan complet). Capital consolidé = capital de la mère seule (${fmt(num(d.mCap))}) ; NCI total = ${fmt(c.nci)} ; goodwill à l'actif = ${fmt(c.gwActif)}.`} />
          <Note type="tip">Bascule sur « Vue guidée » pour voir le <strong>bilan consolidé chiffré complet</strong> qui boucle à {fmt(c.totActif)}.</Note>
        </div>
      );
      default: return null;
    }
  };

  const ue4Notable = () => {
    const p = num(d.pctMere), minor = 100 - p;
    const qpCP = c.pct * (num(d.fCap) + num(d.fResClot) + c.ecartNet);
    switch (step) {
      case 0: return (
        <UE4Cols title="Périmètre de consolidation (Dossier 1 — DSCG)"
          cols={["Société", "% contrôle", "Nature du contrôle", "Méthode", "% d'intérêt", "% NCI"]}
          rows={[{ label: "Entité associée", vals: [`${d.pctMere} %`, "Influence notable", "Mise en équivalence", `${d.pctMere} %`, `${fmt(minor)} %`] }]}
          note="Présentation DSCG type « SAS THYM ». Influence notable présumée dès 20 % (ou présence au conseil) → mise en équivalence." />
      );
      case 1: return (
        <UE4Cols title="Décomposition de la valeur des titres (goodwill inclus)"
          cols={["", "Montant"]}
          rows={[
            { label: "Coût d'acquisition des titres", vals: [c.prix], calc: "donnée : prix payé pour la participation" },
            { label: `− Quote-part d'actif net acquise (${p} %)`, vals: [-c.qpGroupe], calc: `actif net à l'acquisition ${fmt(c.X)} × ${p} % = ${fmt(c.qpGroupe)} (actif net = capital ${fmt(num(d.fCap))} + réserves acq. ${fmt(num(d.fResAcq))} + écart net ${fmt(c.ecartNet)})` },
            { label: "= Goodwill inclus dans la valeur des titres", vals: [c.gwEmbeddedME], bold: true, calc: `${fmt(c.prix)} − ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
          ]}
          note="En mise en équivalence, le goodwill n'est jamais isolé au bilan : il reste fondu dans la valeur comptable des titres (non amorti en IFRS)." />
      );
      case 2: return (
        <div className="space-y-4">
          <UE4Cols title="Valeur d'équivalence à la clôture"
            cols={["", "Montant"]}
            rows={[
              { label: `Quote-part des capitaux propres retraités à la clôture (${p} %)`, vals: [qpCP], calc: `${p} % × (capital ${fmt(num(d.fCap))} + réserves clôture ${fmt(num(d.fResClot))} + écart net ${fmt(c.ecartNet)}) = ${p} % × ${fmt(num(d.fCap) + num(d.fResClot) + c.ecartNet)} = ${fmt(qpCP)}` },
              { label: "+ Goodwill inclus dans les titres", vals: [c.gwEmbeddedME], calc: `cf. tableau précédent : coût ${fmt(c.prix)} − quote-part d'actif net à l'acquisition ${fmt(c.qpGroupe)} = ${fmt(c.gwEmbeddedME)}` },
              { label: "= Valeur comptable des titres mis en équivalence", vals: [c.valME], bold: true, calc: `${fmt(qpCP)} + ${fmt(c.gwEmbeddedME)} = ${fmt(c.valME)}` },
            ]}
            note="Méthode DSCG (cf. SAS THYM) : valeur d'équivalence = quote-part des capitaux propres à la clôture, goodwill compris." />
          <UE4Cols title="Vérification par l'évolution depuis l'acquisition"
            cols={["", "Montant"]}
            rows={[
              { label: "Valeur initiale (coût d'acquisition)", vals: [c.prix], calc: "donnée : prix payé" },
              { label: `+ Quote-part de résultat post-acquisition (${p} % × ${fmt(c.deltaR)})`, vals: [c.pct * c.deltaR], calc: `résultats post-acq = réserves clôture ${fmt(num(d.fResClot))} − réserves acq. ${fmt(num(d.fResAcq))} = ${fmt(c.deltaR)} ; × ${p} % = ${fmt(c.pct * c.deltaR)}` },
              { label: "= Valeur d'équivalence", vals: [c.valME], bold: true, calc: `${fmt(c.prix)} + ${fmt(c.pct * c.deltaR)} = ${fmt(c.valME)} (identique au tableau ci-dessus)` },
            ]} />
          <Journal n="UE4" title="Mise en équivalence — écriture au bilan"
            lines={[{ compte: "Titres mis en équivalence", debit: c.valME }, { compte: "Titres de participation", credit: c.prix }, { compte: "Réserves consolidées (groupe)", credit: c.pct * c.deltaR }]}

/* ===================== Lesson engine (IFRS / Swiss GAAP) =====================
   Moteur data-driven rendu dans le style du wizard (Tailwind, light).
   Le contenu (window.__CONSO_LESSONS__) est une donnée pure → robuste.
   Interactif : quiz cliquables + score, exemples à corrigé masqué,
   sections repliables. ========================================================= */

/* Renvois cliquables : un code de norme dans le texte → ouvre la leçon. */
const NORM_CODE_RE = /(IAS 27|IAS 28|IFRS 10|IFRS 11|IFRS 12|IFRS 3|RPC 30)(?![\d/])/g;
function NormLinks({ text, kb }) {
  const segs = String(text).split(NORM_CODE_RE);
  return segs.map((s, j) => {
    if (/^(IAS 27|IAS 28|IFRS 10|IFRS 11|IFRS 12|IFRS 3|RPC 30)$/.test(s)) {
      return (
        <span key={kb + "_" + j} role="link" tabIndex={0}
          onClick={(e) => { e.stopPropagation(); if (typeof window !== "undefined" && window.__consoGoToLesson) window.__consoGoToLesson(s); }}
          className="text-indigo-600 font-semibold cursor-pointer underline decoration-dotted decoration-indigo-300 underline-offset-2 hover:text-indigo-800">{s}</span>
      );
    }
    return <React.Fragment key={kb + "_" + j}>{s}</React.Fragment>;
  });
}

function MdInline({ text }) {
  if (text == null) return null;
  const parts = String(text).split(/(\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g);
  return parts.map((p, i) => {
    if (/^\*\*[\s\S]+\*\*$/.test(p)) return <strong key={i} className="font-semibold text-slate-800"><NormLinks text={p.slice(2, -2)} kb={i} /></strong>;
    if (/^\*[^*][\s\S]*\*$/.test(p)) return <em key={i} className="italic"><NormLinks text={p.slice(1, -1)} kb={i} /></em>;
    if (/^`[\s\S]+`$/.test(p)) return <code key={i} className="px-1 py-0.5 rounded bg-slate-100 text-indigo-700 text-[0.85em]">{p.slice(1, -1)}</code>;
    return <NormLinks key={i} text={p} kb={i} />;
  });
}

function MdBlock({ text, className = "" }) {
  if (!text) return null;
  const lines = String(text).split("\n");
  const out = []; let list = null;
  const flush = (k) => { if (list) { out.push(<ul key={"u" + k} className="list-disc ml-5 space-y-1 my-2">{list.map((li, j) => <li key={j}><MdInline text={li} /></li>)}</ul>); list = null; } };
  lines.forEach((ln, i) => {
    const t = ln.trim();
    if (/^[-•]\s+/.test(t)) { (list = list || []).push(t.replace(/^[-•]\s+/, "")); }
    else { flush(i); if (t) out.push(<p key={"p" + i} className="my-2 leading-relaxed"><MdInline text={t} /></p>); }
  });
  flush("end");
  return <div className={className}>{out}</div>;
}

  const [ans, setAns] = useState({});
  const answered = Object.keys(ans).length;
  const score = questions.reduce((s, q, i) => s + (ans[i] === q.answer ? 1 : 0), 0);
  return (
    <div className="my-3 rounded-xl border border-slate-200 bg-white">
      <div className="bg-slate-50 px-4 py-2 text-sm font-semibold text-slate-700 flex items-center justify-between border-b border-slate-100">
        <span className="flex items-center gap-2"><GraduationCap size={15} className="text-indigo-500" />{title}</span>
        {answered > 0 && <span className="text-xs font-medium text-slate-500">Score {score}/{questions.length}</span>}
      </div>
      <div className="p-4 space-y-4">
        {questions.map((q, qi) => {
          const chosen = ans[qi]; const done = chosen != null;
          return (
            <div key={qi}>
              <div className="text-sm font-medium text-slate-800 mb-2">{qi + 1}. <MdInline text={q.q} /></div>
              <div className="grid gap-1.5">
                {q.options.map((opt, oi) => {
                  let cls = "border-slate-200 hover:border-indigo-300 text-slate-700";
                  if (done) {
                    if (oi === q.answer) cls = "border-emerald-300 bg-emerald-50 text-emerald-800";
                    else if (oi === chosen) cls = "border-rose-300 bg-rose-50 text-rose-700";
                    else cls = "border-slate-200 text-slate-400";
                  }
                  return (
                    <button key={oi} disabled={done} onClick={() => setAns((p) => ({ ...p, [qi]: oi }))}
                      className={`text-left text-sm border rounded-lg px-3 py-2 transition-colors flex items-center gap-2 ${cls}`}>
                      <span className="shrink-0 w-5 h-5 rounded-full border border-slate-300 text-xs flex items-center justify-center font-medium">{"ABCD"[oi]}</span>
                      <span className="flex-1"><MdInline text={opt} /></span>
                      {done && oi === q.answer && <CheckCircle2 size={15} className="text-emerald-500" />}
                    </button>
                  );
                })}
              </div>
              {done && q.explain && <div className="mt-2 text-xs text-slate-500 bg-slate-50 rounded-lg px-3 py-2"><MdInline text={q.explain} /></div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LMnemo({ code, items = [], phrase }) {
  return (
    <div className="my-3 rounded-xl border border-violet-200 bg-violet-50 p-4">
      <div className="text-sm font-bold text-violet-700 mb-2">🧠 Mnémotechnique — {code}</div>
      <ul className="space-y-1">
        {items.map((it, i) => (
          <li key={i} className="text-sm text-slate-700"><span className="font-bold text-violet-700">{it.l}</span> — <MdInline text={it.t} /></li>
        ))}
      </ul>
      {phrase && <div className="mt-2 text-xs italic text-violet-600">« {phrase} »</div>}
    </div>
  );
}

/* ===================== Schémas / graphiques ===================== */
const DHEX = {
  slate: "#94a3b8", gray: "#9ca3af", indigo: "#6366f1", violet: "#8b5cf6", blue: "#3b82f6",
  cyan: "#06b6d4", teal: "#14b8a6", emerald: "#10b981", green: "#22c55e", amber: "#f59e0b",
  orange: "#f97316", rose: "#f43f5e", red: "#ef4444",
};
const dhex = (c) => DHEX[c] || DHEX.indigo;

function DCaption({ text }) {
  if (!text) return null;
  return <div className="text-xs text-slate-400 mt-2 text-center italic"><MdInline text={text} /></div>;
}

/* Spectre 0→100 % avec bandes colorées + légende — LE visuel contrôle/influence */
function DSpectrum({ title, bands = [], caption }) {
  const ticks = Array.from(new Set([0, 100, ...bands.flatMap((b) => [b.from, b.to])])).sort((a, b) => a - b);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex h-10 rounded-xl overflow-hidden shadow-inner">
        {bands.map((b, i) => (
          <div key={i} style={{ width: `${b.to - b.from}%`, background: dhex(b.color) }}
            className="h-full flex items-center justify-center text-[10px] font-bold text-white text-center px-1 leading-tight">
            {b.short || ""}
          </div>
        ))}
      </div>
      <div className="relative h-4 mt-1">
        {ticks.map((p) => (
          <span key={p} style={{ left: `${p}%` }} className="absolute -translate-x-1/2 text-[10px] font-medium text-slate-400">{p}%</span>
        ))}
      </div>
      <div className="grid sm:grid-cols-3 gap-2 mt-2">
        {bands.map((b, i) => (
          <div key={i} className="flex items-start gap-2 text-xs">
            <span className="w-3 h-3 rounded mt-0.5 shrink-0" style={{ background: dhex(b.color) }}></span>
            <span className="text-slate-600 leading-snug"><MdInline text={b.label} /></span>
          </div>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Cascade (goodwill bridge) : + / − / = avec barres proportionnelles */
function DWaterfall({ title, items = [], caption }) {
  const max = Math.max(1, ...items.map((i) => Math.abs(i.value || 0)));
  const col = { add: "#6366f1", sub: "#f43f5e", total: "#10b981" };
  const sign = { add: "+", sub: "−", total: "=" };
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="space-y-1.5">
        {items.map((it, i) => (
          <div key={i} className="flex items-center gap-2">
            <div className="w-36 sm:w-44 text-xs text-slate-600 text-right shrink-0 leading-snug"><MdInline text={it.label} /></div>
            <div className="flex-1 h-7 bg-slate-50 rounded-md overflow-hidden">
              <div style={{ width: `${(Math.abs(it.value) / max) * 100}%`, background: col[it.kind] || col.add }}
                className={`h-full ${it.kind === "total" ? "rounded-md" : ""}`}></div>
            </div>
            <div className={`w-20 text-sm font-bold text-right shrink-0 tabular-nums ${it.kind === "total" ? "text-emerald-700" : it.kind === "sub" ? "text-rose-600" : "text-indigo-700"}`}>
              {sign[it.kind] || ""}{fmt(Math.abs(it.value))}
            </div>
          </div>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Structure de groupe (mère → filiale %, + minoritaires) en SVG */
function DGroup({ parent = {}, pct = 100, child = {}, nci, method, caption }) {
  const minor = nci != null ? nci : (100 - pct);
  const pcol = dhex(parent.color || "indigo");
  const ccol = dhex(child.color || "slate");
  return (
    <div className="my-4">
      <svg viewBox="0 0 440 220" className="w-full max-w-md mx-auto">
        <rect x="160" y="8" width="120" height="48" rx="10" fill={pcol} />
        <text x="220" y="30" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">{parent.label || "Société mère"}</text>
        <text x="220" y="46" textAnchor="middle" fill="#e0e7ff" fontSize="10">{parent.sub || "Consolidante"}</text>
        <line x1="220" y1="56" x2="220" y2="150" stroke="#cbd5e1" strokeWidth="2" />
        <rect x="186" y="92" width="68" height="22" rx="6" fill="#fff" stroke={pcol} />
        <text x="220" y="107" textAnchor="middle" fill={pcol} fontSize="12" fontWeight="800">{pct} %</text>
        <rect x="160" y="150" width="120" height="56" rx="10" fill={ccol} />
        <text x="220" y="173" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">{child.label || "Filiale"}</text>
        <text x="220" y="190" textAnchor="middle" fill="#e2e8f0" fontSize="9.5">{method || child.sub || ""}</text>
        {minor > 0 && (<>
          <rect x="312" y="150" width="118" height="56" rx="10" fill="#fffbeb" stroke="#fcd34d" strokeDasharray="4" />
          <text x="371" y="173" textAnchor="middle" fill="#92400e" fontSize="11" fontWeight="700">Minoritaires</text>
          <text x="371" y="190" textAnchor="middle" fill="#b45309" fontSize="12" fontWeight="800">{minor} %</text>
          <line x1="312" y1="178" x2="280" y2="178" stroke="#fbbf24" strokeWidth="2" strokeDasharray="4" />
        </>)}
      </svg>
      <DCaption text={caption} />
    </div>
  );
}

/* Colonnes IFRS / RPC / CO (ou n colonnes) — comparatif visuel */
function DColumns({ cols = [], caption }) {
  return (
    <div className="my-4">
      <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${Math.min(cols.length, 3)}, minmax(0,1fr))` }}>
        {cols.map((c, i) => {
          const a = lacc(c.color);
          return (
            <div key={i} className={`rounded-xl border ${a.ring} overflow-hidden`}>
              <div className={`${a.bar} text-white text-sm font-bold px-3 py-2 text-center`}>{c.title}</div>
              <ul className={`${a.soft} p-3 space-y-1.5`}>
                {(c.items || []).map((it, j) => (
                  <li key={j} className="text-xs text-slate-700 flex gap-1.5 leading-snug"><span className={`${a.text} font-bold`}>›</span><span><MdInline text={it} /></span></li>
                ))}
              </ul>
            </div>
          );
        })}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Flux d'étapes : boîtes + flèches */
function DFlow({ title, steps = [], accent = "indigo", caption }) {
  const a = lacc(accent);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex items-stretch gap-1 overflow-x-auto pb-1">
        {steps.map((s, i) => (
          <React.Fragment key={i}>
            <div className={`shrink-0 rounded-xl border ${a.ring} ${a.soft} p-3 w-40`}>
              <div className={`text-xs font-bold ${a.text} mb-0.5`}>{i + 1}. <MdInline text={s.label} /></div>
              {s.sub && <div className="text-[11px] text-slate-500 leading-snug"><MdInline text={s.sub} /></div>}
            </div>
            {i < steps.length - 1 && <div className="flex items-center text-slate-300 shrink-0"><ArrowRight size={18} /></div>}
          </React.Fragment>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Pyramide (niveaux décroissants) */
function DPyramid({ title, levels = [], accent = "indigo", caption }) {
  const base = dhex(accent);
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2 text-center">{title}</div>}
      <div className="flex flex-col items-center gap-1">
        {levels.map((l, i) => {
          const w = 100 - i * (55 / Math.max(levels.length - 1, 1));
          return (
            <div key={i} style={{ width: `${w}%`, background: base, opacity: 1 - i * 0.13 }}
              className="rounded-lg text-white text-center px-3 py-2 shadow-sm">
              <div className="text-xs font-bold"><MdInline text={l.t} /></div>
              {l.d && <div className="text-[10px] opacity-90 leading-snug"><MdInline text={l.d} /></div>}
            </div>
          );
        })}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

/* Répartition (barre %) — ex. groupe vs minoritaires */
function DSplit({ title, parts = [], caption }) {
  const tot = parts.reduce((s, p) => s + (p.value || 0), 0) || 1;
  return (
    <div className="my-4">
      {title && <div className="text-sm font-semibold text-slate-700 mb-2">{title}</div>}
      <div className="flex h-10 rounded-lg overflow-hidden">
        {parts.map((p, i) => (
          <div key={i} style={{ width: `${(p.value / tot) * 100}%`, background: dhex(p.color) }}
            className="flex items-center justify-center text-white text-xs font-bold">{p.value}%</div>
        ))}
      </div>
      <div className="flex flex-wrap gap-3 mt-2 text-xs">
        {parts.map((p, i) => (
          <span key={i} className="flex items-center gap-1.5 text-slate-600"><span className="w-3 h-3 rounded" style={{ background: dhex(p.color) }}></span><MdInline text={p.label} /></span>
        ))}
      </div>
      <DCaption text={caption} />
    </div>
  );
}

function LDiagram({ b }) {
  switch (b.kind) {
    case "spectrum": return <DSpectrum title={b.title} bands={b.bands} caption={b.caption} />;
    case "waterfall": return <DWaterfall title={b.title} items={b.items} caption={b.caption} />;
    case "group": return <DGroup parent={b.parent} pct={b.pct} child={b.child} nci={b.nci} method={b.method} caption={b.caption} />;
    case "columns": return <DColumns cols={b.cols} caption={b.caption} />;
    case "flow": return <DFlow title={b.title} steps={b.steps} accent={b.accent} caption={b.caption} />;
    case "pyramid": return <DPyramid title={b.title} levels={b.levels} accent={b.accent} caption={b.caption} />;
    case "split": return <DSplit title={b.title} parts={b.parts} caption={b.caption} />;
    default: return null;
  }
}

function LessonBlock({ b }) {
  if (!b || !b.type) return null;
  switch (b.type) {
    case "intro": return <div className="text-[15px] text-slate-700 my-2"><MdBlock text={b.text} /></div>;
    case "heading": return <h3 className="text-base font-bold text-slate-800 mt-5 mb-1"><MdInline text={b.text} /></h3>;
    case "keypoints": return <LKeypoints title={b.title} items={b.items} accent={b.accent} />;
    case "callout": return <LCallout tone={b.tone} title={b.title} text={b.text} />;
    case "table": return <LTable title={b.title} headers={b.headers} rows={b.rows} />;
    case "compare": return <LCompare title={b.title} rows={b.rows} />;
    case "steps": return <LSteps title={b.title} steps={b.steps} accent={b.accent} />;
    case "journal": return <LJournal title={b.title} note={b.note} lines={b.lines} />;
    case "example": return <LExample title={b.title} statement={b.statement} solution={b.solution} />;
    case "quiz": return <LQuiz title={b.title} questions={b.questions} />;
    case "mnemo": return <LMnemo code={b.code} items={b.items} phrase={b.phrase} />;
    case "diagram": return <LDiagram b={b} />;
    default: return null;
  }
}

function LessonSection({ sec, accent = "indigo", defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  const a = lacc(accent);
  if (!sec.title) return <div className="mb-2">{(sec.blocks || []).map((b, i) => <LessonBlock key={i} b={b} />)}</div>;
  return (
    <div className="mb-3 rounded-xl border border-slate-200 bg-white overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center gap-2.5 px-4 py-3 text-left hover:bg-slate-50">
        <span className={`w-1.5 h-5 rounded ${a.bar}`}></span>
        <span className="font-semibold text-slate-800 flex-1">{sec.title}</span>
        <ChevronDown size={17} className={`text-slate-400 transition-transform ${open ? "rotate-180" : ""}`} />
      </button>
      {open && <div className="px-4 pb-4 pt-1">{(sec.blocks || []).map((b, i) => <LessonBlock key={i} b={b} />)}</div>}
    </div>
  );
}

function LessonView({ lesson, accent = "indigo", onBack }) {

function LessonHub({ pack = {}, domain = "", accent = "indigo", open = null, onOpen }) {

  if (!lessons.length) return <div className="text-sm text-slate-500 p-8 text-center">Contenu {domain} en préparation…</div>;
