nt 2011, une seule IAS 27 couvrait consolidé ET individuel. Depuis, l'individuel est tout ce qui reste dans IAS 27."}, {"type": "diagram", "kind": "flow", "title": "Des comptes consolidés sont-ils exigés ? (et quel est le rôle d'IAS 27 ?)", "steps": [{"label": "L'entité a-t-elle le contrôle ?", "sub": "IFRS 10 — pouvoir + exposition aux rendements"}, {"label": "Si NON", "sub": "Pas de consolidation : associée (IAS 28) ou simple placement (IFRS 9)"}, {"label": "Si OUI → consolidation requise", "sub": "IFRS 10, sauf dispense (sous-mère 100 % couverte par une mère ultime IFRS) ou entité d'investissement (JV par résultat)"}, {"label": "Des comptes INDIVIDUELS en plus ?", "sub": "Non imposés par IAS 27 — seulement si choix ou obligation légale locale (p. ex. CO)"}, {"label": "Alors IAS 27 dit COMMENT", "sub": "Participations au coût / IFRS 9 / MEE, en une seule ligne"}], "accent": "blue", "caption": "IAS 27 ne déclenche JAMAIS l'obligation de consolider (IFRS 10) ni celle de produire des comptes individuels : elle régit uniquement leur contenu lorsqu'ils existent (IAS 27.2-3)."}]}, {"title": "📐 Définitions clés", "blocks": [{"type": "heading", "text": "États financiers individuels (Separate financial statements) — IAS 27.4 / .6"}, {"type": "intro", "text": "États **présentés par une entité-mère** (ou par un investisseur exerçant le contrôle conjoint ou une influence notable) dans lesquels les **participations** sont comptabilisées **au coût**, **selon IFRS 9**, ou **par mise en équivalence (IAS 28)**, et **NON** sur la base des résultats et de l'actif net des entités détenues (= **pas** de consolidation ligne à ligne). La participation apparaît **« en une seule ligne »** (*investee presented in one line*) à l'actif du bilan."}, {"type": "callout", "tone": "info", "title": "Par contraste — États consolidés (IFRS 10 / IAS 27.4)", "text": "États du **groupe** présentés comme ceux d'une **entité économique unique** : intégration globale actif par actif, passif par passif, produit par produit, **avec NCI**. → **Hors champ d'IAS 27.**"}, {"type": "table", "title": "Les trois catégories de participations visées", "headers": ["Notion", "Définition (source)", "Lien de pouvoir"], "rows": [["**Filiale** *(subsidiary)*", "Entité **contrôlée** par une autre (IFRS 10)", "**Contrôle**"], ["**Entreprise associée** *(associate)*", "**Influence notable** (IAS 28), présomption ≥ **20 %**", "**Influence notable**"], ["**Coentreprise** *(joint venture)*", "Partenariat sous **contrôle conjoint** donnant droit à l'**actif net** (IFRS 11)", "**Contrôle conjoint**"]]}, {"type": "callout", "tone": "key", "title": "Mise en équivalence (equity method) — renvoi IAS 28.10", "text": "La participation est inscrite **au coût** à l'origine, puis **ajustée** de la **quote-part** de l'investisseur dans le **résultat et les OCI** post-acquisition de l'entité détenue ; **les dividendes reçus en réduisent la valeur comptable**."}, {"type": "callout", "tone": "tip", "title": "Entité d'investissement (Investment entity) — IFRS 10.27, renvoi IAS 27.11B", "text": "Entité qui (i) obtient des fonds pour fournir des services de gestion d'investissement, (ii) s'engage à valoriser/sortir ses placements et (iii) en mesure la performance à la **juste valeur**.\n\n**Particularité** : elle **NE consolide PAS** ses filiales mais les évalue à la **juste valeur par résultat (FVTPL)** selon IFRS 9 — y compris, en règle générale, dans ses **états individuels** (IAS 27.11B)."}, {"type": "diagram", "kind": "columns", "title": "États INDIVIDUELS (IAS 27) vs États CONSOLIDÉS (IFRS 10)", "cols": [{"title": "Individuels (IAS 27)", "color": "blue", "items": ["Participation **en une seule ligne** à l'actif", "Coût / IFRS 9 / MEE (IAS 27.10)", "**Ni goodwill, ni NCI, ni élimination** intragroupe", "Présentés EN PLUS du consolidé (IAS 27.6)"]}, {"title": "Consolidés (IFRS 10)", "color": "violet", "items": ["Intégration globale **actif par actif, passif par passif**", "Entité économique unique", "* e": "Écriture — IFRS 9 : profit de juste valeur (JV 1 000 → 1 200)", "note": "Réévaluation à chaque clôture. Profit en RÉSULTAT (ou en OCI si option FVOCI).", "lines": [{"compte": "Participation dans F", "debit": 200}, {"compte": "Profit de juste valeur — résultat (ou OCI si FVOCI)", "credit": 200}]}, {"type": "journal", "title": "Écriture — Mise en équivalence : quote-part de résultat (F gagne 300, QP 80 % = 240)", "note": "La quote-part de résultat augmente la participation. Le dividende reçu (cf. B) la réduira ensuite.", "lines": [{"compte": "Participation dans F", "debit": 240}, {"compte": "Quote-part de résultat des entités mises en équivalence", "credit": 240}]}, {"type": "callout", "tone": "key", "title": "D) Présentation (IAS 27.10)", "text": "La participation figure à l'**actif non courant** sur une ligne dédiée ; le résultat associé (dividendes, JV ou quote-part) sur une ligne du compte de résultat.\n\n**Aucune NCI, aucun goodwill, aucune élimination intragroupe** n'apparaissent dans les comptes **individuels** — ces notions sont propres aux comptes **consolidés (IFRS 10 / IFRS 3)**."}]}, {"title": "🔢 Exemple chiffré résolu", "blocks": [{"type": "example", "title": "Une acquisition, trois bilans : M détient 80 % de F", "statement": "Le **01.01.N**, **M** acquiert **80 %** de **F** pour **1 000** (trésorerie). En N, **F** réalise un **résultat net de 300** et distribue un **dividende total de 100** (donc **80** pour M). Au 31.12.N, la **juste valeur** de la participation de M est estimée à **1 150**.\n\n**Question :** quel est, dans les états **INDIVIDUELS de M**, le montant de la participation au 31.12.N et l'impact sur le résultat de N, selon **chacune des trois méthodes** d'IAS 27.10 ?", "solution": "**① Méthode du COÛT**\n- Participation au bilan : **1 000** (inchangée).\n- Dividende **80** → **produit en résultat** (IAS 27.12).\n- *Résultat individuel de M lié à F = **+80**.*\n\n**② Méthode IFRS 9 (juste valeur par résultat — FVTPL)**\n- Participation réévaluée à **1 150** → profit de JV **+150** en résultat.\n- Dividende **80** → **produit en résultat** (IAS 27.12).\n- *Résultat individuel de M lié à F = 150 + 80 = **+230** ; participation = **1 150**.*\n\n**③ Méthode de la MISE EN ÉQUIVALENCE (IAS 28)**\n- Quote-part de résultat = 80 % × 300 = **+240** → participation portée à 1 000 + 240 = 1 240.\n- Dividende **80** → **réduit la participation** (IAS 27.12) → 1 240 − 80 = **1 160**.\n- *Résultat individuel de M lié à F = **+240** ; participation = **1 160**.*\n\n**Synthèse :**\n- Participation au 31.12.N → Coût **1 000** | IFRS 9 **1 150** | Mise en équiv. **1 160**\n- Impact résultat N → Coût **+80** | IFRS 9 **+230** | Mise en équiv. **+240**\n\n**Conclusion.** Le **même fait économique** produit **trois bilans et trois résultats individuels différents** selon l'option d'IAS 27.10 — d'où l'importance de **l'information à fournir (IAS 27.16-17)** précisant la méthode retenue. ⚠️ **Aucun goodwill ni NCI** ici : dans le consolidé, M intégrerait **100 %** des actifs/passifs de F, reconnaîtrait le **goodwill** et une **NCI de 20 %** — ce qui sort du périmètre d'IAS 27."}, {"type": "table", "title": "Tableau de synthèse des trois méthodes", "headers": ["", "Coût", "IFRS 9 (FVTPL)", "Mise en équivalence"], "rows": [["**Participation au 31.12.N**", "**1 000**", "**1 150**", "**1 160**"], ["Dividende reçu (80)", "+ résultat", "+ résultat", "− participation"], ["**Impact résultat N**", "**+80**", "**+230**", "**+240**"]]}, {"type": "diagram", "kind": "columns", "title": "M détient 80 % de F : un fait, trois bilans individuels (au 31.12.N)", "cols": [{"title": "Coût", "color": "slate", "items": ["Participation : **1 000** (inchangée)", "Dividende 80 → **+ résultat**", "Impact résultat N : **+80**"]}, {"title": "IFRS 9 (FVTPL)", "color": "indigo", "items": ["Participation à la JV : **1 150**", "Profit de JV +150 → résultat", "Dividende 80 → **+ résultat**", "Impact résultat N : **+230**"]}, {"title": "Mise en équivalence", "color": "emerald", "items": ["1 000 + QP 240 − div. 80 = **1 160**", "QP de résultat 80 %×300 = +240", "Dividende 80 → **− participation**", "Impact résultat N : **+240**"]}], "caption": "Même opération économique, trois valeurs au bilan (1 000 / 1 150 / 1 160) et trois résultats (+80 / +230 / +240) — d'où l'information à fournir sur la méthode (IAS 27.16-17). Aucun goodwill ni NCI : ils n'existent que dans le consolidé."}]}, {"title": "🗂️ IFRS vs Swiss GAAP RPC vs CO", "blocks": [{"type": "intro", "text": "**Cadrage.** IAS 27 (2011) porte sur les **comptes individuels** ; l'**obligation de consolider** relève d'IFRS 10. En Suisse, l'obligation d'établir des **comptes de groupe** est fixée par le **CO (art. 963-963b)**, et la **méthode** par **Swiss GAAP RPC 30** (ou IFRS/US GAAP si normes reconnues)."}, {"type": "compare", "title": "IFRS vs Swiss GAAP RPC vs CO", "rows": [{"crit": "Obligation de consolider", "ifrs": "**IFRS 10** : si **contrôle**. IAS 27 ne crée aucune obligation de comptes individuels.", "rpc": "**RPC 30** : comptes consolidés si contrôle (notion proche d'IFRS 10).", "co": "**Art. 963** : comptes de groupe si **contrôle**. **Dispenses** (art. 963a) selon la **taille**."}, {"crit": "Participations dans les comptes individuels", "ifrs": "**IAS 27.10** : **coût**, **IFRS 9 (JV)** **ou** **mise en équivalence** (au choix, par catégorie).", "rpc": "En général **au coût diminué des dépréciations** (immobilisations financières, RPC 2).", "co": "**Art. 960d / 960** : à l'**actif immobilisé**, **coût** sous déduction des **corrections de valeur** ; réserves latentes possibles."}, {"crit": "Dividendes (comptes individuels)", "ifrs": "**Produit en résultat** (coût/IFRS 9) **ou** réduction de la participation (mise en équiv.) — **IAS 27.12**.", "rpc": "**Produit financier** au compte de résultat.", "co": "**Produit** (produit des participations) au compte de résultat."}, {"crit": "Méthodes de consolidation admises", "ifrs": "Intégration **globale** (IFRS 10) ; **mise en équivalence** (IAS 28) ; **pas** de proportionnelle.", "rpc": "**Globale**, **mise en équivalence**, intégration **proportionnelle tolérée** pour le contrôle conjoint.", "co": "**Ne prescrit pas** de méthode : renvoi à un **référentiel reconnu** ou « principes ordinaires »."}, {"crit": "Goodwill (consolidé)", "ifrs": "**IFRS 3** : à l'actif, **non amorti**, **test de dépréciation annuel** (IAS 36).", "rpc": "**Activation puis amortissement** (≤ 5 ans, except. 20) **OU** compensation directe avec les CP.", "co": "Non régi en détail ; suit le référentiel choisi."}, {"crit": "NCI (intérêts minoritaires)", "ifrs": "**IFRS 3.19** : au choix **JV (goodwill complet)** ou **quote-part de l'actif net identifiable**.", "rpc": "Présentés séparément dans les capitaux propres ; **pas** de goodwill complet.", "co": "Selon référentiel."}, {"crit": "Juste valeur", "ifrs": "Large recours (IFRS 9, IFRS 13).", "rpc": "Recours **limité** ; primauté du coût.", "co": "**Coût** ; JV très restreinte (principe de **prudence**)."}, {"crit": "Informations à fournir", "ifrs": "**Très étendues** : IAS 27.16-17 (méthode, liste des participations) + **IFRS 12**.", "rpc": "Étendues mais **plus légères** qu'en IFRS.", "co": "**Minimales** (annexe, art. 959c)."}]}, {"type": "callout", "tone": "key", "title": "À retenir pour l'examen", "text": "En **CO**, les participations des **comptes statutaires** sont presque toujours au **coût – corrections de valeur** ; l'option **JV / mise en équivalence** d'IAS 27 **n'existe pas** en CO. La **mise en équivalence** et la **JV** en individuel sont des **spécificités IFRS** (primauté de la **prudence** en CO)."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Piège n°1 — « IAS 27 = consolidation »", "text": "**FAUX depuis 2011.** La consolidation est dans **IFRS 10** ; IAS 27 (2011) ne couvre **que les états INDIVIDUELS**. Citer une « obligation de consolider selon IAS 27 » = erreur de référentiel."}, {"type": "keypoints", "title": "Les autres pièges classiques", "accent": "rose", "items": ["**Confondre** états individuels et états d'une entité **sans filiale** : ces derniers ne sont PAS des « états individuels » au sens d'IAS 27.6 (ce sont ses états tout court).", "**Croire qu'IAS 27 oblige** à produire des comptes individuels : NON — seulement **si** l'entité en établit (choix ou obligation légale locale, p. ex. le CO).", "**Inverser le dividende** : coût/IFRS 9 → **résultat** ; mise en équivalence → **réduction de la participation** (IAS 27.12). L'erreur la plus fréquente.", "**Oublier l'option mise en équivalence** : ajoutée par l'amendement **août 2014**, applicable **2016** ; avant, seuls coût et IFRS 9.", "**Mélanger les méthodes dans une même catégorie** : interdit — une seule méthode par catégorie (la méthode peut différer d'une catégorie à l'autre).", "**Calculer un goodwill / des NCI en individuel** : non-sens — ils n'existent que dans le **consolidé**. En individuel : une seule ligne.", "**Ignorer la dispense (IFRS 10.4)** : une sous-mère détenue à 100 % dont la mère ultime publie des comptes consolidés IFRS n'est pas tenue de consolider ; ses états individuels peuvent être ses seuls états présentés.", "**Entité d'investissement** (IFRS 10.27) : si elle en est une, filiales à la **JV par résultat** y compris en individuel (IAS 27.11B) — sauf filiale fournissant des services d'investissement.", "**« Détenu en vue de la vente »** : bascule sous **IFRS 5** (IAS 27.10), **sauf** participations déjà évaluées selon IFRS 9 (elles le restent)."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "CIM", "phrase": "« CIM : Coût, IFRS 9, Mise en équivalence — les 3 options d'IAS 27.10 pour porter une participation EN UNE SEULE LIGNE. »", "items": [{"l": "C", "t": "**Coût** — participation au coût, dépréciée si besoin (IAS 36)."}, {"l": "I", "t": "**IFRS 9** — juste valeur (FVTPL ou FVOCI)."}, {"l": "M", "t": "**Mise en équivalence** (IAS 28) — coût + quote-part de résultat − dividendes ; option depuis 2016."}]}, {"type": "steps", "title": "Structurer une réponse IAS 27 (pour maximiser les points)", "accent": "indigo", "steps": [{"t": "Poser le bon référentiel", "d": "« Depuis 2011, IAS 27 ne traite QUE les états INDIVIDUELS ; la consolidation relève d'IFRS 10. » → montre que le piège est identifié."}, {"t": "Qualifier la participation", "d": "Filiale (contrôle, IFRS 10) / associée (influence notable, IAS 28) / coentreprise (contrôle conjoint, IFRS 11) — la catégorie conditionne la méthode."}, {"t": "Énoncer les 3 options (IAS 27.10)", "d": "Coût | IFRS 9 (JV) | mise en équivalence (IAS 28, depuis 2016), avec la cohérence par catégorie."}, {"t": "Traiter le dividende (IAS 27.12)", "d": "Résultat (coût/IFRS 9) vs réduction de la participation (mise en équiv.). Presque toujours testé."}, {"t": "Distinguer reconnaissance / évaluation / présentation", "d": "Reconnue à l'acquisition, évaluée selon l'option, présentée « en une seule ligne » à l'actif non courant."}, {"t": "Mentionner les exceptions", "d": "IFRS 5 (détenu pour la vente), entité d'investissement (JV par résultat, IAS 27.11B), réorganisation (coût = VC des CP, IAS 27.13)."}, {"t": "Réflexe suisse", "d": "Rapprocher du CO art. 960d (coût – corrections de valeur) et de RPC 30 / CO 963-963b ; JV et mise en équivalence en individuel = spécificités IFRS."}, {"t": "Informations à fournir (IAS 27.16-17)", "d": "Préciser la méthode, lister les participations significatives (%, siège) ; renvoyer à IFRS 12."}]}, {"type": "callout", "tone": "key", "title": "Phrase-réflexe à placer dans la copie", "text": "*« Dans les états individuels, la participation est portée **en une seule ligne** (coût / IFRS 9 / mise en équivalence) ; **goodwill et NCI n'apparaissent que dans les comptes consolidés** (IFRS 3 / IFRS 10). »*"}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste-toi sur IAS 27", "questions": [{"q": "Depuis quelle révision IAS 27 ne traite-t-elle PLUS que des états individuels, et où est passée la consolidation ?", "options": ["Révision 2005 ; consolidation toujours dans IAS 27", "Révision 2011 ; consolidation passée à IFRS 10", "Révision 2014 ; consolidation passée à IAS 28", "Révision 2018 ; consolidation passée à IFRS 3"], "answer": 1, "explain": "C'est la révision de 2011 (paquet IFRS 10/11/12, applicable au 01.01.2013) : la consolidation est désormais régie par IFRS 10. C'est LE piège central de la norme."}, {"q": "Quelles sont les trois méthodes d'évaluation des participations dans les comptes individuels (IAS 27.10) ?", "options": ["Coût, juste valeur (IFRS 9), mise en équivalence (IAS 28)", "Coût, intégration globale, intégration proportionnelle", "Juste valeur, goodwill complet, NCI", "Coût historique, réévaluation, amortissement linéaire"], "answer": 0, "explain": "IAS 27.10 : coût | IFRS 9 (juste valeur) | mise en équivalence (IAS 28). La mise en équivalence en individuel a été ajoutée par l'amendement d'août 2014, applicable au 01.01.2016. L'intégration globale/proportionnelle relève de la consolidation (IFRS 10), pas des comptes individuels."}, {"q": "Un dividende reçu d'une filiale portée AU COÛT dans les comptes individuels : quel traitement ?", "options": ["Il réduit la valeur comptable de la participation", "Il est porté directement en capitaux propres", "Il est comptabilisé en produit (résultat) dès que le droit à percevoir est établi", "Il est différé jusqu'à la cession de la participation"], "answer": 2, "explain": "En méthode du coût (comme en IFRS 9), le dividende est un PRODUIT en résultat dès que le droit à percevoir est établi (IAS 27.12). Penser aussi à vérifier l'indice de dépréciation (IAS 36)."}, {"q": "Même situation, mais la participation est en MISE EN ÉQUIVALENCE : quel traitement du dividende ?", "options": ["Produit en résultat, comme au coût", "Il réduit la valeur comptable de la participation (pas de produit)", "Il est comptabilisé en OCI", "Il augmente la valeur comptable de la participation"], "answer": 1, "explain": "En mise en équivalence, le dividende RÉDUIT la valeur comptable de la participation, il n'est PAS un produit (IAS 27.12). Inverser ce traitement avec celui du coût est l'erreur classique de l'examen."}, {"q": "IAS 27 oblige-t-elle une entité à produire des comptes individuels ?", "options": ["Oui, toujours, dès qu'elle détient une filiale", "Oui, mais uniquement pour les entités cotées", "Non : elle s'applique seulement SI l'entité en établit (par choix ou obligation légale locale)", "Non, IAS 27 ne s'applique qu'aux comptes consolidés"], "answer": 2, "explain": "IAS 27.2-3 : la norme ne crée aucune obligation de produire des états individuels ; elle dit COMMENT les faire si l'entité en établit (par choix ou obligation légale locale, p. ex. le CO en Suisse)."}, {"q": "Peut-on calculer un goodwill et des NCI dans les comptes INDIVIDUELS de la mère ?", "options": ["Oui, le goodwill apparaît mais pas les NCI", "Oui, les deux, comme dans le consolidé", "Non : goodwill (IFRS 3) et NCI n'existent que dans le consolidé ; en individuel, une seule ligne", "Oui, mais seulement si la participation est en mise en équivalence"], "answer": 2, "explain": "Non-sens en individuel : le goodwill (IFRS 3) et les NCI n'existent que dans les comptes consolidés (IFRS 10). Dans les comptes individuels, la participation est portée EN UNE SEULE LIGNE à l'actif non courant."}, {"q": "Comment une ENTITÉ D'INVESTISSEMENT porte-t-elle ses filiales dans ses comptes individuels ?", "options": ["Elle les consolide systématiquement (intégration globale)", "Au coût historique uniquement", "À la juste valeur par résultat (IFRS 9) — elle ne consolide pas (IAS 27.11B), sauf filiale de services d'investissement", "Par mise en équivalence obligatoire"], "answer": 2, "explain": "Une entité d'investissement NE consolide PAS ses filiales (IFRS 10.27) et les évalue à la juste valeur par résultat (FVTPL), y compris en individuel (IAS 27.11B). Exception : une filiale qui fournit des services liés à l'investissement est, elle, consolidée."}, {"q": "En droit suisse (CO), comment sont évaluées les participations des comptes statutaires, et qu'est-ce qui diffère d'IAS 27 ?", "options": ["À la juste valeur ; identique à IAS 27", "Au coût sous déduction des corrections de valeur ; les options JV et mise en équivalence d'IAS 27 n'existent pas en CO", "Par mise en équivalence obligatoire ; comme l'option IAS 28", "Au coût plus réévaluation annuelle imposée"], "answer": 1, "explain": "En CO (art. 960d / 960), les participations figurent à l'actif immobilisé au coût sous déduction des corrections de valeur nécessaires (primauté de la prudence). Les options juste valeur et mise en équivalence d'IAS 27 sont des spécificités IFRS, inexistantes en CO."}]}]}]}, {"code": "IAS 28", "title": "Participations dans des entreprises associées et coentreprises", "icon": "🤝", "color": "teal", "tagline": "La **mise en équivalence** : coût → quote-part de résultat/OCI → dividendes réducteurs → dépréciation. Une **seule ligne** au bilan.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "**IAS 28** impose la **méthode de la mise en équivalence (MEE / *equity method*)** dans les comptes consolidés pour deux familles de participations :\n- les **entreprises associées** — celles sur lesquelles l'investisseur exerce une **influence notable** (présumée dès **≥ 20 %** des droits de vote) ;\n- les **coentreprises** (*joint ventures* au sens d'**IFRS 11**) — où les coentrepreneurs ont des droits sur l'**actif net** de l'accord.\n\nLe principe : la participation est inscrite **au coût**, puis ajustée de la **quote-part de résultat** et d'**OCI** post-acquisition, **réduite des dividendes** reçus et des **dépréciations**. Le **goodwill implicite** est noyé dans la valeur comptable — ni séparé, ni amorti."}, {"type": "keypoints", "title": "Les 5 réflexes à ancrer", "accent": "teal", "items": ["**Qualifier le lien** : contrôle (IFRS 10) ? contrôle conjoint (IFRS 11) ? **influence notable** (IAS 28) ?", "**Influence notable** présumée à **≥ 20 %** des droits de vote — présomption **réfutable** dans les deux sens.", "**MEE** : `VC = coût + QP résultat ± QP OCI − dividendes − dépréciation − amort. plus-values JV`.", "**Dividende** reçu = **réduction de la VC**, jamais un produit (le produit est la quote-part de résultat).", "**Goodwill implicite** inclus dans la VC, **non amorti**, testé sur la **participation entière** (IAS 36)."]}, {"type": "callout", "tone": "key", "title": "Une seule ligne au bilan", "text": "La MEE produit **une ligne unique** « Participations mises en équivalence » à l'actif. On ne consolide **pas** ligne à ligne les actifs/passifs de l'associée (≠ intégration globale d'IFRS 10). Toujours conclure une réponse d'examen sur les **trois impacts** : **bilan** (la ligne MEE), **résultat** (quote-part + dépréciation), **OCI/capitaux propres** (quote-part d'OCI)."}, {"type": "diagram", "kind": "spectrum", "title": "Du % de détention à la méthode", "bands": [{"from": 0, "to": 20, "color": "slate", "short": "IFRS 9", "label": "**< 20 %** — pas d'influence notable → **juste valeur (IFRS 9)**"}, {"from": 20, "to": 50, "color": "teal", "short": "MEE", "label": "**20–50 %** — influence notable présumée → **mise en équivalence (IAS 28)**"}, {"from": 50, "to": 100, "color": "indigo", "short": "Contrôle", "label": "**> 50 %** — contrôle → **intégration globale (IFRS 10)**"}], "caption": "Le cœur d'IAS 28 = la zone **20–50 %** (influence notable → MEE). Présomption **réfutable** dans les deux sens : on peut avoir l'influence sous 20 % (siège au CA) et ne pas l'avoir au-dessus."}]}, {"title": "📐 Définitions clés & place dans le périmètre", "blocks": [{"type": "intro", "text": "IAS 28 est le pendant « influence / contrôle conjoint » de la trilogie du périmètre de consolidation. Selon le **lien de capital**, la méthode change radicalement."}, {"type": "table", "title": "Du lien de capital à la méthode", "headers": ["Lien de capital", "Norme de classement", "Méthode"], "rows": [["**Contrôle** (filiale)", "IFRS 10", "Intégration **globale**"], ["**Contrôle conjoint** → *joint venture*", "IFRS 11", "**MEE (IAS 28)**"], ["**Contrôle conjoint** → *joint operation*", "IFRS 11", "Comptabilisation **directe** des actifs/passifs/produits/charges (**pas** IAS 28)"], ["**Influence notable** (associée)", "**IAS 28**", "**MEE**"], ["Aucune influence notable", "IFRS 9", "Juste valeur (FVPL / FVOCI)"]]}, {"type": "callout", "tone": "warn", "title": "Le piège joint venture vs joint operation", "text": "Contrôle conjoint **ne suffit pas** pour appliquer la MEE. Seule la ***joint venture*** (droits sur l'**actif net**) passe en MEE. La ***joint operation*** (droits sur des **actifs** / obligations sur des **passifs**) relève de la comptabilisation **directe** d'IFRS 11 — **jamais** la MEE."}, {"type": "callout", "tone": "info", "title": "Ce qu'IAS 28 EXCLUT", "text": "- les **joint operations** (IFRS 11, comptabilisation directe) ;\n- les participations de **capital-risque, fonds communs, sociétés d'investissement, fonds d'assurance avec participation** : option pour la **JV par résultat (IFRS 9)** au lieu de la MEE — **à la comptabilisation initiale** et par participation ;\n- les participations **détenues en vue de la vente** → basculent sous **IFRS 5** ;\n- les **comptes individuels (séparés)** de l'investisseur → relèvent d'**IAS 27** (coût, IFRS 9, ou MEE en option)."}, {"type": "callout", "tone": "tip", "title": "Exemption de la MEE", "text": "Un investisseur **n'applique pas** la MEE s'il remplit les conditions d'exemption de présentation d'états consolidés (filiale détenue à ~100 %, autres propriétaires non opposés, mère ultime publiant des comptes IFRS consolidés, titres non cotés). Par ailleurs, une **entité d'investissement** (IFRS 10) évalue ses associées/coentreprises à la **JV par résultat**."}, {"type": "heading", "text": "Influence notable — le critère central"}, {"type": "intro", "text": "**Influence notable** — *pouvoir de participer aux décisions de politique financière et opérationnelle* de l'entité détenue, **sans** exercer de **contrôle** ni de **contrôle conjoint**. C'est le critère central : ni le simple intérêt patrimonial (sinon IFRS 9), ni le pouvoir de diriger (sinon IFRS 10/11)."}, {"type": "callout", "tone": "key", "title": "La présomption des 20 % joue dans les DEUX sens", "text": "- **≥ 20 %** des droits de vote → influence notable **présumée**, sauf démonstration claire du contraire ;\n- **< 20 %** → **absence** d'influence notable présumée, sauf démonstration claire du contraire.\n\n→ La présomption est **réfutable** et peut être **renversée par les faits**."}, {"type": "keypoints", "title": "Indices d'influence notable (un seul peut suffire)", "accent": "indigo", "items": ["**Représentation au conseil d'administration** (ou organe équivalent).", "**Participation au processus décisionnel**, y compris aux décisions de **dividendes**.", "**Transactions significatives** entre l'investisseur et l'entité.", "**Échange de personnel de direction**.", "Fourniture d'**informations techniques essentielles**."]}, {"type": "callout", "tone": "info", "title": "Droits de vote potentiels", "text": "Options, bons, instruments convertibles **actuellement exerçables ou convertibles** : à **prendre en compte** pour apprécier l'influence notable. Mais la **quote-part** comptabilisée en MEE reste fondée sur la participation **actuelle** détenue — **sans** anticiper l'exercice de ces droits."}, {"type": "table", "title": "Coentreprise vs joint operation (IFRS 11, mobilisé par IAS 28)", "headers": ["Notion", "Droits des parties", "Traitement"], "rows": [["**Coentreprise** (*joint venture*)", "Droits sur l'**actif net** de l'accord", "**MEE (IAS 28)**"], ["**Joint operation**", "Droits sur des **actifs** / obligations sur des **passifs**", "Comptabilisation **directe** (IFRS 11)"], ["**Contrôle conjoint**", "Partage **contractuel** du contrôle ; décisions à **consentement unanime**", "Condition préalable, définie par IFRS 11"]]}, {"type": "intro", "text": "**Mise en équivalence (*equity method*)** — méthode où la participation est **initialement comptabilisée au coût**, puis **ajustée** pour refléter la **quote-part de l'investisseur dans l'actif net** de l'entité détenue **après** l'acquisition ; le **résultat** de l'investisseur intègre sa **quote-part de résultat** de l'entité détenue."}, {"type": "diagram", "kind": "pyramid", "title": "Les degrés de pouvoir sur une entité détenue", "levels": [{"t": "Contrôle (IFRS 10)", "d": "Pouvoir de diriger les activités pertinentes → intégration **globale**."}, {"t": "Contrôle conjoint (IFRS 11)", "d": "Partage contractuel, décisions à l'unanimité → **JV : MEE** ; **JO : compta directe**."}, {"t": "Influence notable (IAS 28)", "d": "Participer aux décisions sans diriger (≥ 20 % présumé) → **MEE**."}, {"t": "Simple intérêt (IFRS 9)", "d": "Aucun pouvoir de participation → **juste valeur** (FVPL / FVOCI)."}], "accent": "teal", "caption": "IAS 28 occupe l'étage intermédiaire : **plus** qu'un simple intérêt patrimonial, **moins** qu'un contrôle. C'est le pendant « influence / contrôle conjoint » de la trilogie du périmètre."}, {"type": "diagram", "kind": "group", "parent": {"label": "Investisseur M"}, "pct": 30, "child": {"label": "Associée A"}, "method": "Mise en équivalence (IAS 28)", "caption": "M détient **30 %** de A et exerce une **influence notable** : A n'est **pas** consolidée ligne à ligne. Une **seule ligne** « Participations mises en équivalence » apparaît à l'actif de M."}]}, {"title": "⚖️ Reconnaissance & évaluation", "blocks": [{"type": "steps", "title": "Le cycle de vie d'une participation MEE", "accent": "teal", "steps": [{"t": "1. Comptabilisation initiale — au COÛT", "d": "La participation est inscrite à son **coût d'acquisition** à la date où l'influence notable / le contrôle conjoint est obtenu."}, {"t": "2. Goodwill implicite & ajustements de JV", "d": "Différence entre le **coût** et la **quote-part de JV des actifs nets identifiables** = **goodwill implicite**, inclus dans la VC, **ni présenté séparément, ni amorti**. Un **excédent** (« badwill », coût < QP de JV) est un **produit** de la période d'acquisition."}, {"t": "3. Dérouler les plus-values de JV", "d": "Les ajustements de JV à l'acquisition (immobilisations, immatériels, stocks…) sont ensuite **« déroulés »** : amortissement complémentaire, décomptabilisation des stocks vendus → ils **réduisent** la quote-part de résultat des périodes suivantes."}, {"t": "4. Ajustements postérieurs", "d": "**+** quote-part du **résultat net** (au CR) ; **±** quote-part des **OCI** (en OCI) ; **−** **dividendes** reçus (réduisent la VC) ; **−** **dépréciations**."}, {"t": "5. Acquisition par étapes / changement de statut", "d": "Passage IFRS 9 → MEE : réévaluation de l'intérêt antérieur à la **JV**. Perte d'influence : la MEE **cesse**, le résidu est réévalué à la **JV** (impact en résultat). Devenir une filiale : **IFRS 3** (regroupement par étapes)."}]}, {"type": "callout", "tone": "tip", "title": "Conditions d'une MEE correcte", "text": "- **Uniformiser les méthodes comptables** de l'entité détenue avec celles de l'investisseur ;\n- utiliser des **états financiers récents** ; si la **date de clôture diffère**, l'écart doit être **≤ 3 mois**, avec ajustement des **transactions/événements significatifs** de l'intervalle ;\n- tenir compte des **actions de préférence cumulatives** détenues par des tiers (quote-part calculée **après** dividendes préférentiels, déclarés ou non)."}, {"type": "callout", "tone": "warn", "title": "Arrêt sur pertes — le plancher à 0", "text": "Lorsque les **pertes** absorbent l'**intérêt net** (VC + créances à long terme assimilées à la participation), la MEE **s'arrête** (VC plancher à **0**). Les pertes au-delà ne sont **pas** comptabilisées, **sauf** obligation **légale ou implicite** ou paiements effectués pour le compte de l'entité. On **suit** les pertes **non comptabilisées** pour les imputer aux **bénéfices futurs** avant de réaugmenter la VC."}, {"type": "diagram", "kind": "flow", "title": "Le cycle de vie d'une participation MEE", "steps": [{"label": "1 · Au coût", "sub": "Comptabilisation initiale à la date d'obtention de l'influence notable."}, {"label": "2 · Goodwill implicite", "sub": "Coût − QP de JV des actifs nets : noyé dans la VC, non amorti."}, {"label": "3 · Dérouler la JV", "sub": "Amortir / décomptabiliser les plus-values de JV à l'acquisition."}, {"label": "4 · Ajuster", "sub": "+ QP résultat · ± QP OCI · − dividendes · − dépréciation."}, {"label": "5 · Changement de statut", "sub": "Perte d'influence → réévaluation à la JV ; devenir filiale → IFRS 3."}], "accent": "teal", "caption": "De l'entrée au coût jusqu'à la sortie : à chaque clôture, la valeur comptable « roule » avec la quote-part d'actif net post-acquisition."}]}, {"title": "🧮 Méthode & écritures (MEE pas à pas)", "blocks": [{"type": "callout", "tone": "key", "title": "La formule de roulement de la valeur comptable (VC)", "text": "**VCₙ = VCₙ₋₁ + (QP % × résultat net) ± (QP % × OCI) − dividendes reçus − dépréciation − amortissement des plus-values de JV**"}, {"type": "journal", "title": "Écriture — Étape 1 : comptabilisation initiale (au coût)", "note": "Acquisition de la participation. Exemple : coût d'acquisition de 400.", "lines": [{"compte": "Participation MEE (associée)", "debit": 400}, {"compte": "Trésorerie", "credit": 400}]}, {"type": "journal", "title": "Écriture — Étape 2 : quote-part de résultat (bénéfice)", "note": "Produit au compte de résultat « quote-part dans le résultat des associées ». En cas de PERTE : écriture inverse (on crédite la Participation MEE et on débite la quote-part de perte au CR). Exemple : 30 % × 300 = 90.", "lines": [{"compte": "Participation MEE", "debit": 90}, {"compte": "Quote-part de résultat des associées (CR)", "credit": 90}]}, {"type": "journal", "title": "Écriture — Étape 3 : dividende reçu", "note": "Le dividende RÉDUIT la valeur comptable — ce n'est PAS un produit. Exemple : 30 % × 80 = 24.", "lines": [{"compte": "Trésorerie", "debit": 24}, {"compte": "Participation MEE", "credit": 24}]}, {"type": "journal", "title": "Écriture — Étape 4 : quote-part d'OCI", "note": "Réévaluation, écarts de conversion de l'associée… comptabilisés en OCI de l'investisseur. Exemple : 30 % × 100 = 30.", "lines": [{"compte": "Participation MEE", "debit": 30}, {"compte": "OCI — quote-part des associées (capitaux propres)", "credit": 30}]}, {"type": "journal", "title": "Écriture — Étape 5 : amortissement des ajustements de JV", "note": "Plus-value de JV à l'acquisition sur un actif AMORTISSABLE (ex. machine) → diminue la quote-part de résultat. Exemple : machine sous-évaluée de 200, amortie sur 10 ans → 30 % × 200/10 = 6 par an.", "lines": [{"compte": "Quote-part de résultat des associées (CR)", "debit": 6}, {"compte": "Participation MEE", "credit": 6}]}, {"type": "journal", "title": "Écriture — Étape 6 : dépréciation", "note": "Indice IAS 28 / IAS 36 ; test sur la valeur comptable TOTALE. Exemple : dépréciation de 26.", "lines": [{"compte": "Perte de valeur — participation MEE (CR)", "debit": 26}, {"compte": "Participation MEE", "credit": 26}]}, {"type": "heading", "text": "Étape 7 — Élimination des résultats internes (upstream / downstream)"}, {"type": "intro", "text": "On élimine à hauteur de la **quote-part** de l'investisseur, tant que l'actif est conservé dans le groupe. Les profits **non réalisés** sont éliminés puis **repris** lorsque l'actif sort du groupe (vente à un tiers, consommation, amortissement)."}, {"type": "journal", "title": "Écriture — Étape 7a : downstream (l'investisseur VEND à l'associée)", "note": "On élimine la quote-part du profit interne non réalisé. Exemple : profit interne de 50, détention 30 % → 30 % × 50 = 15.", "lines": [{"compte": "Produit / résultat de cession (CR)", "debit": 15}, {"compte": "Participation MEE", "credit": 15}]}, {"type": "callout", "tone": "info", "title": "Upstream (l'associée VEND à l'investisseur)", "text": "On **réduit** la quote-part de résultat **et** la valeur de l'actif (ou des stocks) acquis, du montant du profit interne **non réalisé × QP**. Symétrique du downstream, mais l'impact porte sur l'actif détenu par l'investisseur."}]}, {"title": "🔢 Exemple chiffré résolu", "blocks": [{"type": "example", "title": "Mise en équivalence complète : du coût à la VC finale", "statement": "Le **01.01.N**, **M** acquiert **30 %** de **A** pour **400** (CHF k).\n\nÀ cette date :\n- **capitaux propres comptables** de A = **1 000** ;\n- un **terrain** de A a une **JV supérieure de 200** à sa valeur comptable (le reste = JV).\n\nDurant N, A :\n- réalise un **résultat net de 300** ;\n- comptabilise **+100 d'OCI** (réévaluation) ;\n- **distribue 80** de dividendes.\n\nIndice de dépréciation **fin N** : valeur recouvrable de la participation = **470**.\n\n**Travail demandé :** goodwill implicite à l'acquisition, roulement de la valeur comptable, test de dépréciation, et les trois impacts sur les états financiers de M.", "solution": "**1) Goodwill implicite à l'acquisition**\n- JV des actifs nets identifiables de A = 1 000 + 200 (terrain) = **1 200**\n- Quote-part de M = 30 % × 1 200 = **360**\n- Coût payé = **400** → **Goodwill implicite = 400 − 360 = 40** (inclus dans la VC, **non amorti**)\n\n**2) Quote-part de résultat post-acquisition**\n- 30 % × 300 = **+90** au compte de résultat.\n- Le **terrain ne s'amortit pas** → aucun « déroulé » de plus-value à imputer. *(Si la plus-value avait porté sur une machine amortissable sur 10 ans, on retrancherait 30 % × 200/10 = 6 par an.)*\n\n**3) Quote-part d'OCI**\n- 30 % × 100 = **+30** en OCI de M.\n\n**4) Dividendes reçus**\n- 30 % × 80 = **−24** sur la VC (**pas** un produit).\n\n**5) Valeur comptable avant test de dépréciation**\n- Coût initial : 400\n- + Quote-part de résultat (30 % × 300) : +90\n- + Quote-part d'OCI (30 % × 100) : +30\n- − Dividendes (30 % × 80) : −24\n- **= VC avant dépréciation = 496**\n\n**6) Test de dépréciation (IAS 28 / IAS 36, sur la VC totale)**\n- VC = **496** > valeur recouvrable = **470** → **dépréciation = 26**\n- **VC finale au bilan = 470**\n\n**Conclusion — les trois impacts (exercice N) :**\n- **Bilan** — « Participations mises en équivalence » : **470**.\n- **Compte de résultat** — quote-part de résultat **+90**, perte de valeur **−26** → **effet net +64**.\n- **OCI / capitaux propres** — quote-part d'OCI **+30**.\n- Le **goodwill implicite (40)** reste **noyé** dans la VC ; non présenté séparément, non amorti, mais **couvert** par le test de dépréciation global."}, {"type": "table", "title": "Roulement de la valeur comptable (synthèse)", "headers": ["Mouvement", "Calcul", "Montant"], "rows": [["Coût initial (01.01.N)", "—", "400"], ["+ Quote-part de résultat", "30 % × 300", "+90"], ["+ Quote-part d'OCI", "30 % × 100", "+30"], ["− Dividendes", "30 % × 80", "−24"], ["**= VC avant dépréciation**", "—", "**496**"], ["− Dépréciation", "496 − 470", "−26"], ["**= VC finale au bilan**", "—", "**470**"]]}, {"type": "diagram", "kind": "waterfall", "title": "Pont du goodwill implicite à l'acquisition", "items": [{"label": "Coût payé", "value": 400, "kind": "add"}, {"label": "− QP actif net id. (30 % × 1 200)", "value": 360, "kind": "sub"}, {"label": "= Goodwill implicite", "value": 40, "kind": "total"}], "caption": "JV des actifs nets de A = 1 000 + 200 (terrain) = **1 200** ; QP de M = 30 % × 1 200 = **360**. Coût 400 − 360 = **goodwill implicite 40**, inclus dans la VC et **non amorti**."}, {"type": "diagram", "kind": "waterfall", "title": "Roulement de la valeur comptable (exercice N)", "items": [{"label": "Coût initial (01.01.N)", "value": 400, "kind": "add"}, {"label": "+ QP résultat (30 % × 300)", "value": 90, "kind": "add"}, {"label": "+ QP OCI (30 % × 100)", "value": 30, "kind": "add"}, {"label": "− Dividendes (30 % × 80)", "value": 24, "kind": "sub"}, {"label": "− Dépréciation (496 − 470)", "value": 26, "kind": "sub"}, {"label": "= VC finale au bilan", "value": 470, "kind": "total"}], "caption": "Coût + quote-part de résultat + OCI − dividendes − dépréciation. VC avant test = **496** ; valeur recouvrable **470** → dépréciation **26** → **VC finale 470**. Le terrain n'étant pas amortissable, aucun déroulé de plus-value n'est imputé."}, {"type": "diagram", "kind": "split", "title": "Les trois impacts sur les états financiers de M (exercice N)", "parts": [{"label": "Bilan — ligne MEE : 470", "value": 470, "color": "teal"}, {"label": "Résultat — net : +64", "value": 64, "color": "emerald"}, {"label": "OCI — QP : +30", "value": 30, "color": "violet"}], "caption": "Toujours conclure sur les **trois impacts** : **bilan** (VC 470) · **résultat** (QP +90 − dépréciation 26 = **+64**) · **OCI** (QP +30). Le goodwill implicite (40) reste noyé dans la VC."}]}, {"title": "🗂️ IFRS vs Swiss GAAP RPC vs CO", "blocks": [{"type": "compare", "title": "IAS 28 / IFRS 11 vs Swiss GAAP RPC 30 vs CO art. 963-963b", "rows": [{"crit": "Associées (influence notable)", "ifrs": "**MEE obligatoire** ; présomption **≥ 20 %**", "rpc": "**MEE** (méthode requise pour les sociétés associées)", "co": "Pas de règle de méthode ; renvoi au **référentiel reconnu** choisi (art. 963b)"}, {"crit": "Coentreprises (JV)", "ifrs": "**MEE** ; intégration proportionnelle **interdite**", "rpc": "**Intégration proportionnelle autorisée**, ou MEE", "co": "Selon référentiel choisi"}, {"crit": "Goodwill implicite", "ifrs": "Inclus dans la VC, **non amorti**, test de dépréciation **global**", "rpc": "Possibilité d'**amortir** le goodwill **ou** imputation aux **capitaux propres**", "co": "Selon référentiel choisi"}, {"crit": "Ajustements de JV à l'acquisition", "ifrs": "Oui (logique IFRS 3) : plus-values **déroulées**", "rpc": "Approche JV également, cadre plus **souple**", "co": "Selon référentiel choisi"}, {"crit": "Dividendes reçus", "ifrs": "**Réduisent** la VC (jamais un produit)", "rpc": "Même logique (réduisent la VC)", "co": "Selon référentiel choisi"}, {"crit": "Pertes au-delà de l'intérêt net", "ifrs": "MEE **stoppée** (plancher 0, sauf engagement)", "rpc": "Logique comparable", "co": "—"}, {"crit": "Élimination résultats internes", "ifrs": "À hauteur de la **quote-part** (upstream/downstream)", "rpc": "Élimination requise (proportion de détention)", "co": "Selon référentiel choisi"}, {"crit": "Option JV (capital-risque/fonds)", "ifrs": "Possible : **FVPL (IFRS 9)** au lieu de la MEE", "rpc": "Non prévue de façon comparable", "co": "—"}, {"crit": "Held for sale", "ifrs": "Bascule sous **IFRS 5**", "rpc": "Pas d'équivalent strict", "co": "—"}, {"crit": "Obligation de consolider", "ifrs": "Via IFRS 10 (groupe)", "rpc": "Selon seuils RPC ; exemptions", "co": "**Obligation légale** (art. 963), **exemptions** (art. 963a), comptes selon **norme reconnue** (art. 963b)"}]}, {"type": "callout", "tone": "key", "title": "Convergence et divergences", "text": "La **MEE pour les associées** est un **point de convergence** IFRS / RPC. Les **divergences** se logent surtout dans : (1) le **goodwill** (non amorti en IFRS, **amortissable ou imputable aux FP** en RPC) et (2) les **coentreprises** (intégration proportionnelle **interdite** en IFRS, **tolérée** en RPC 30). Le **CO** ne tranche pas la méthode : il **impose la consolidation** et **renvoie au référentiel reconnu** retenu."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Confondre influence notable et contrôle conjoint", "text": "Influence notable → IAS 28 (MEE) ; contrôle conjoint ***joint venture*** → IAS 28 (MEE) **aussi** ; mais contrôle conjoint ***joint operation*** → **comptabilisation directe** (IFRS 11), **jamais** la MEE."}, {"type": "callout", "tone": "warn", "title": "Appliquer mécaniquement le seuil de 20 %", "text": "La présomption est **réfutable**. On peut avoir l'influence notable **sous** 20 % (siège au CA, dépendance technologique) et **ne pas** l'avoir **au-dessus** (un actionnaire majoritaire verrouille toutes les décisions)."}, {"type": "callout", "tone": "warn", "title": "Traiter le dividende comme un produit", "text": "En MEE, le dividende **réduit la valeur comptable** ; le **produit** est la **quote-part de résultat**. Le comptabiliser deux fois (résultat + dividende) **surévalue** le résultat."}, {"type": "callout", "tone": "warn", "title": "Amortir le goodwill implicite / le tester séparément", "text": "Interdit en IFRS : le goodwill implicite est **inclus** dans la VC et **non amorti**. Seul un **test de dépréciation** sur la VC **totale** (un seul actif, pas d'UGT distincte pour le goodwill) peut le réduire."}, {"type": "callout", "tone": "warn", "title": "Oublier de dérouler les ajustements de JV", "text": "Une plus-value de JV sur un actif **amortissable** doit **réduire** la quote-part de résultat des exercices suivants (amortissement complémentaire) ; l'ignorer **surévalue** la quote-part."}, {"type": "callout", "tone": "warn", "title": "Faire passer la VC en négatif", "text": "Quand les **pertes** absorbent l'intérêt net (VC + créances LT assimilées à la participation), la MEE **s'arrête** ; les pertes au-delà ne sont **pas** comptabilisées, **sauf** obligation légale/implicite ou paiements pour le compte de l'entité. Suivre les pertes **non comptabilisées** pour les imputer aux bénéfices futurs."}, {"type": "callout", "tone": "warn", "title": "Mal traiter la perte d'influence notable", "text": "À la sortie de la MEE, l'intérêt **résiduel** est **réévalué à la JV** (nouveau coût IFRS 9), avec gain/perte en **résultat** — ce n'est **pas** un simple gel de la valeur comptable."}, {"type": "callout", "tone": "info", "title": "Dates de clôture & méthodes comptables", "text": "Écart de clôture **> 3 mois** non admis ; il faut **uniformiser les méthodes** de l'associée et **ajuster** les événements significatifs de l'intervalle."}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "CRODA", "items": [{"l": "C", "t": "**Coût** initial — point de départ de la VC."}, {"l": "R", "t": "**Résultat** — + quote-part du résultat net (au CR)."}, {"l": "O", "t": "**OCI** — ± quote-part des autres éléments du résultat global."}, {"l": "D", "t": "**Dividendes** — − ils réduisent la VC (jamais un produit)."}, {"l": "A", "t": "**Amortissement / dépréciation** — − déroulé des plus-values de JV et test IAS 36."}], "phrase": "« **C**oût **R**ésultat **O**CI **D**ividendes **A**mortissement » — le roulement de la VC dans l'ordre."}, {"type": "keypoints", "title": "Structurer une réponse IAS 28 (ce qui rapporte les points)", "accent": "emerald", "items": ["**Qualifier le lien** : contrôle (IFRS 10) ? conjoint (IFRS 11 → JV vs JO) ? **influence notable** (IAS 28) ? Citer la présomption **≥ 20 %**, réfutable.", "**Nommer la méthode** : MEE, amorçage **au coût**, puis roulement `VC = coût + QP résultat ± QP OCI − dividendes − dépréciation − amort. JV`.", "**Goodwill implicite** : coût − (QP × JV actifs nets), inclus dans la VC, non amorti, test sur la VC **totale**. Badwill → produit.", "**Cas particuliers** : pertes (arrêt MEE), amont/aval (quote-part), option JV capital-risque (IFRS 9), IFRS 5, perte d'influence (réévaluation à la JV).", "**Réflexe suisse** : RPC 30 (convergence MEE ; mais intég. proportionnelle des JV tolérée, goodwill amortissable) et CO art. 963-963b (consolidation obligatoire, exemptions, norme reconnue)."]}, {"type": "callout", "tone": "key", "title": "Toujours conclure sur les trois impacts", "text": "**Bilan** (ligne unique « participations MEE ») · **Résultat** (quote-part + dépréciation) · **OCI / capitaux propres** (quote-part d'OCI)."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste ta maîtrise d'IAS 28", "questions": [{"q": "À partir de quel seuil l'influence notable est-elle présumée, et cette présomption est-elle absolue ?", "options": ["≥ 50 % des droits de vote ; présomption absolue (contrôle)", "≥ 20 % des droits de vote ; présomption réfutable, dans les deux sens", "≥ 20 % du capital ; présomption irréfragable", "≥ 10 % des droits de vote ; présomption réfutable"], "answer": 1, "explain": "L'influence notable est présumée dès ≥ 20 % des droits de vote, mais la présomption est réfutable : elle peut être renversée par les faits dans les deux sens (influence sous 20 %, absence d'influence au-dessus)."}, {"q": "Quelle méthode IAS 28 impose-t-elle pour une coentreprise (joint venture) ?", "options": ["L'intégration proportionnelle, au choix de l'investisseur", "L'intégration globale comme pour une filiale", "La mise en équivalence ; l'intégration proportionnelle est interdite sous IFRS", "La juste valeur par résultat (IFRS 9)"], "answer": 2, "explain": "Pour une joint venture (droits sur l'actif net), IAS 28 impose la MEE. L'intégration proportionnelle, autrefois admise, est désormais interdite sous IFRS (mais tolérée en RPC 30)."}, {"q": "Comment traite-t-on un dividende reçu d'une associée mise en équivalence ?", "options": ["Comme un produit financier au compte de résultat", "Comme une réduction de la valeur comptable de la participation", "Comme une augmentation de la valeur comptable", "Comme un élément d'OCI"], "answer": 1, "explain": "En MEE, le dividende réduit la valeur comptable (il représente une distribution de l'actif net déjà reflété). Le produit reconnu est la quote-part de résultat, pas le dividende — sinon on le compte deux fois."}, {"q": "Le goodwill implicite d'une participation MEE est-il amorti ? Comment est-il testé ?", "options": ["Amorti sur 10 ans ; testé séparément comme une UGT distincte", "Non amorti ; testé via une dépréciation portant sur la participation totale (IAS 36)", "Amorti sur la durée d'utilité ; pas de test de dépréciation", "Non amorti ; jamais soumis à un test de dépréciation"], "answer": 1, "explain": "Le goodwill implicite est inclus dans la VC, non présenté séparément et non amorti. Il n'a pas d'UGT propre : la dépréciation (IAS 36) porte sur la participation entière, considérée comme un seul actif."}, {"q": "Que se passe-t-il quand la quote-part de pertes dépasse la valeur comptable (intérêt net) ?", "options": ["On comptabilise une dette pour le solde négatif", "On poursuit la MEE en valeur négative", "La MEE est arrêtée (plancher 0) ; les pertes au-delà ne sont pas comptabilisées, sauf engagement légal/implicite", "On bascule automatiquement en IFRS 9"], "answer": 2, "explain": "La MEE s'arrête quand l'intérêt net est absorbé (VC plancher à 0). Les pertes excédentaires ne sont pas comptabilisées, sauf obligation légale/implicite ou paiements pour le compte de l'entité ; on les suit pour les imputer aux bénéfices futurs."}, {"q": "Comment éliminer un profit interne sur une transaction amont (upstream) avec une associée détenue à 25 % ?", "options": ["Éliminer 100 % du profit non réalisé", "Éliminer 25 % du profit non réalisé (réduction de la quote-part de résultat et de la valeur de l'actif/stock), jusqu'à réalisation", "Ne rien éliminer car l'associée n'est pas consolidée globalement", "Éliminer 75 % du profit (part des autres actionnaires)"], "answer": 1, "explain": "On n'élimine que la quote-part de l'investisseur dans le profit interne non réalisé, soit 25 %, en réduisant la quote-part de résultat et la valeur de l'actif/stock concerné. Le profit est repris quand l'actif quitte le groupe."}, {"q": "Que devient l'intérêt résiduel lorsqu'on perd l'influence notable ?", "options": ["Sa valeur comptable est simplement gelée", "Il est réévalué à la juste valeur (nouveau coût IFRS 9), gain/perte en résultat ; la MEE cesse", "Il est transféré en OCI sans impact sur le résultat", "Il reste évalué selon la MEE indéfiniment"], "answer": 1, "explain": "À la perte de l'influence notable, la MEE cesse et l'intérêt résiduel conservé est réévalué à la juste valeur, qui devient son nouveau coût sous IFRS 9. Le gain ou la perte de réévaluation passe en résultat — ce n'est pas un simple gel."}, {"q": "Une participation MEE classée « détenue en vue de la vente » reste-t-elle sous IAS 28 ?", "options": ["Oui, IAS 28 continue de s'appliquer jusqu'à la cession", "Non : elle bascule sous IFRS 5 (plus bas de la VC et de la JV diminuée des coûts de vente)", "Non : elle bascule sous IFRS 9 à la juste valeur par résultat", "Oui, mais en figeant la quote-part de résultat à zéro"], "answer": 1, "explain": "Une participation détenue en vue de la vente sort du champ de la MEE et relève d'IFRS 5 : elle est évaluée au plus bas de sa valeur comptable et de sa juste valeur diminuée des coûts de la vente."}]}]}]}, {"code": "IFRS 3", "title": "Regroupements d'entreprises", "icon": "🏢", "color": "violet", "tagline": "La **méthode de l'acquisition** : on évalue actifs, passifs et NCI à la **juste valeur**, puis on dégage le **goodwill** (résiduel) — non amorti.", "sections": [{"title": "🎯 L'essentiel", "blocks": [{"type": "intro", "text": "**IFRS 3** impose **une seule** façon de comptabiliser un **regroupement d'entreprises** (*business combination*) : la **méthode de l'acquisition** (*acquisition method*).\n\nLe scénario type : l'acquéreur **prend le contrôle** d'une entreprise. À la **date d'acquisition**, il réévalue tout ce qu'il acquiert (actifs identifiables, passifs repris, NCI) à la **juste valeur**, puis il calcule le **goodwill** comme un **résiduel** : ce qu'il a payé *en plus* de la juste valeur de l'actif net identifiable.\n\nDeux marqueurs IFRS à graver : le **goodwill n'est jamais amorti** (seul un test de dépréciation IAS 36 peut le réduire) et les **frais d'acquisition partent en charges**. Ce sont deux divergences fortes avec le monde suisse."}, {"type": "keypoints", "title": "À retenir", "accent": "violet", "items": ["**Méthode unique** : la méthode de l'acquisition, en **4 étapes**.", "**Goodwill = résiduel** : Contrepartie + NCI + JV part antérieure − JV actif net identifiable.", "**NCI au choix** : juste valeur (goodwill **complet**) **ou** quote-part de l'actif net (goodwill **partiel**) — option par opération.", "**Goodwill non amorti** → test de dépréciation **annuel** (IAS 36).", "**Frais d'acquisition en charges** (honoraires, *due diligence*) — jamais dans le goodwill.", "IFRS 3 ne traite que **la date d'acquisition** ; la conso récurrente relève d'**IFRS 10**."]}, {"type": "callout", "tone": "info", "title": "IFRS 3 ne travaille jamais seule", "text": "- **IFRS 10** dit *quand* il y a **contrôle** (le déclencheur).\n- **IFRS 3** dit *comment* comptabiliser l'opération **à la date d'acquisition** (PPA, goodwill, NCI).\n- **IFRS 13** fournit la mécanique de la **juste valeur**.\n- **IAS 36** régit ensuite le **suivi du goodwill** (dépréciation, pas d'amortissement)."}, {"type": "diagram", "kind": "group", "parent": {"label": "Acquéreur M"}, "pct": 80, "child": {"label": "Cible F"}, "nci": 20, "method": "Méthode de l'acquisition (IFRS 3)", "caption": "M obtient le **contrôle** de F (IFRS 10) ⇒ IFRS 3 s'applique. La part non détenue par M = **NCI** (20 %)."}]}, {"title": "📐 Définitions clés", "blocks": [{"type": "intro", "text": "**Regroupement d'entreprises** (*business combination*) — transaction par laquelle un **acquéreur obtient le CONTRÔLE** d'une ou plusieurs **entreprises**. Le contrôle se lit selon **IFRS 10** (pouvoir + exposition à des rendements variables + capacité d'influer). **Pas de contrôle ⇒ pas d'IFRS 3.**"}, {"type": "table", "title": "Le vocabulaire à manier", "headers": ["Terme", "Définition opérationnelle"], "rows": [["**Entreprise** (*business*)", "Ensemble intégré d'**activités et d'actifs** géré pour fournir des biens/services. Minimum : un **input** **et** un **processus substantiel** créant des outputs."], ["**Acquéreur**", "L'entité qui **obtient le contrôle**. Il y a **toujours** un acquéreur identifiable, même dans une « fusion entre égaux »."], ["**Date d'acquisition**", "Date de **prise de contrôle effective** (en général le *closing*). C'est la **date d'évaluation** de tous les éléments."], ["**Contrepartie transférée**", "JV, à la date d'acquisition, des actifs remis + passifs assumés + **instruments de capitaux propres émis** par l'acquéreur."], ["**NCI**", "*Non-controlling interest* (ex-« minoritaires ») : part des capitaux propres de la filiale **non** attribuable à la mère."], ["**Goodwill**", "Actif résiduel : **avantages futurs** d'éléments **non identifiables** (synergies, équipe, part de marché)."], ["***Bargain purchase***", "JV de l'actif net identifiable **> total payé** ⇒ **profit en résultat** (après réexamen obligatoire)."], ["**Période d'évaluation**", "Fenêtre **≤ 12 mois** pour ajuster rétrospectivement les valeurs provisoires."]]}, {"type": "callout", "tone": "warn", "title": "Frontière décisive : business OU simple groupe d'actifs ?", "text": "Un **portefeuille d'actifs** (ex. un **immeuble loué** sans organisation ni personnel) **n'est PAS** une *business*. On répartit alors le coût sur les actifs/passifs au prorata de leur JV : **pas de goodwill**, frais **capitalisés**, pas d'impôt différé « day-1 ».\n\n**Test de concentration** (*optional concentration test*, amendement 2018, applicable dès 2020) : raccourci facultatif — si **la quasi-totalité de la JV des actifs bruts** est concentrée dans **un seul actif** (ou des actifs similaires), ce n'est **pas** une business. Sinon, on évalue input / processus / output."}]}, {"title": "⚖️ Reconnaissance & évaluation", "blocks": [{"type": "intro", "text": "La **méthode de l'acquisition** évalue les actifs identifiables acquis, les passifs repris et la NCI **à la JUSTE VALEUR** à la date d'acquisition (principe **IFRS 13**). Quelques règles structurantes méritent d'être connues par cœur."}, {"type": "keypoints", "title": "Règles de reconnaissance qui rapportent des points", "accent": "indigo", "items": ["**Incorporels** : on reconnaît **séparément du goodwill** tout incorporel **identifiable** = **séparable** (cessible/licenciable) **OU** issu de **droits contractuels/légaux** (marques, relations clients, carnet de commandes, technologie) — **même s'il n'était pas** au bilan de l'acquise.", "**Passifs éventuels** : **exception à IAS 37** — comptabilisés **même si la sortie n'est pas probable**, dès qu'il y a obligation **actuelle** à JV fiable.", "**Critère de reconnaissance** : les éléments doivent répondre à la définition d'actif/passif **à la date d'acquisition** et faire partie de l'échange (pas des transactions distinctes)."]}, {"type": "table", "title": "Exceptions au principe de juste valeur (à connaître)", "headers": ["Élément", "Évaluation"], "rows": [["**Impôts différés** (IAS 12)", "Selon IAS 12, **non actualisés**"], ["**Avantages du personnel** (IAS 19)", "Selon IAS 19"], ["**Paiements en actions** (IFRS 2)", "Méthode IFRS 2"], ["**Actifs détenus en vue de la vente** (IFRS 5)", "JV **diminuée des coûts de vente**"], ["**Droits réacquis**", "Sur la **durée contractuelle résiduelle**"]]}, {"type": "callout", "tone": "key", "title": "L'équation du goodwill", "text": "**Goodwill = (a) Contrepartie transférée + (b) Montant de la NCI + (c) JV de la participation antérieurement détenue − (d) JV nette des actifs identifiables acquis & passifs repris.**\n\nSi le résultat est **négatif** ⇒ ***bargain purchase*** : on **réexamine d'abord** (a)–(d) ; si l'écart subsiste, **gain en résultat**, **aucun goodwill**."}, {"type": "callout", "tone": "info", "title": "NCI : une option par opération", "text": "- **Méthode 1 — JV (goodwill « complet »)** : NCI à sa **juste valeur** ⇒ le goodwill **inclut la quote-part des minoritaires**.\n- **Méthode 2 — quote-part (goodwill « partiel »)** : NCI = **% minoritaire × JV de l'actif net identifiable** ⇒ seul le goodwill **du groupe** est comptabilisé.\n\nLe **choix est libre, transaction par transaction.**"}, {"type": "callout", "tone": "warn", "title": "Contrepartie éventuelle (earn-out) : le classement fait tout", "text": "Incluse dans la contrepartie à sa **JV à la date d'acquisition**. Ensuite, le **classement** détermine le suivi :\n- **Passif** (trésorerie/actifs ou **nombre variable** d'actions) ⇒ **réévalué à la JV à chaque clôture, variations en RÉSULTAT**.\n- **Capitaux propres** (**nombre fixe** d'actions) ⇒ **non réévalué** ; règlement imputé en capitaux propres."}]}, {"title": "🧮 Méthode en 4 étapes & écritures", "blocks": [{"type": "steps", "title": "La méthode de l'acquisition, pas à pas", "accent": "violet", "steps": [{"t": "① Identifier l'acquéreur", "d": "L'entité qui **obtient le contrôle** (IFRS 10). Indices si ambigu : qui paie en trésorerie, qui est le plus grand, qui émet les titres, qui domine la gouvernance. ⚠️ **Acquisition inversée** : l'émetteur juridique des titres peut être l'**acquise comptable**."}, {"t": "② Déterminer la date d'acquisition", "d": "Date de **prise de contrôle effective** (en général le *closing*). **Toutes les JV sont figées** à cette date."}, {"t": "③ Évaluer actifs, passifs et NCI à la juste valeur", "d": "Actifs identifiables acquis, passifs repris et NCI **à la JV** (IFRS 13). On **isole les incorporels** identifiables ; on comptabilise les **passifs éventuels** (exception IAS 37) ; on applique les **exceptions** (IAS 12, 19, IFRS 2/5)."}, {"t": "④ Comptabiliser le goodwill (ou le bargain purchase)", "d": "Appliquer l'équation : **Contrepartie + NCI + JV part antérieure − JV actif net identifiable**. Résultat positif ⇒ **goodwill** (non amorti) ; négatif ⇒ **profit de bargain purchase** après réexamen."}]}, {"type": "journal", "title": "Écriture — acquisition 100 % en trésorerie, avec goodwill", "note": "Comptes consolidés, à la date d'acquisition. Les actifs/passifs de l'acquise sont déjà réévalués à la JV. L'impôt différé passif sur les réévaluations augmente le goodwill résiduel.", "lines": [{"compte": "Actifs identifiables acquis (à la JV)", "debit": 800}, {"compte": "Immobilisations incorporelles identifiées (marque, relations clients)", "debit": 150}, {"compte": "Goodwill (résiduel)", "debit": 200}, {"compte": "Passifs repris (à la JV)", "credit": 100}, {"compte": "Impôt différé passif (IAS 12, sur réévaluations)", "credit": 50}, {"compte": "Trésorerie (contrepartie versée)", "credit": 1000}]}, {"type": "journal", "title": "Écriture — frais liés à l'acquisition (honoraires, due diligence)", "note": "Toujours en CHARGES de la période — jamais dans le coût du regroupement ni dans le goodwill. Seuls les coûts d'émission de titres suivent IFRS 9 / IAS 32.", "lines": [{"compte": "Charges (honoraires, due diligence, banquiers)", "debit": 40}, {"compte": "Trésorerie", "credit": 40}]}, {"type": "journal", "title": "Écriture — step acquisition : réévaluation de la participation antérieure", "note": "Acquisition par étapes : à la prise de contrôle, l'acquéreur réévalue sa part déjà détenue à la JV ; l'écart passe EN RÉSULTAT. Cette JV réévaluée entre dans le terme (c) de l'équation du goodwill.", "lines": [{"compte": "Participation antérieure (réévaluée à la JV)", "debit": 60}, {"compte": "Profit de réévaluation (résultat)", "credit": 60}]}, {"type": "callout", "tone": "warn", "title": "Variation de % POSTÉRIEURE sans perte/gain de contrôle", "text": "Si la mère **rachète une partie des NCI** alors qu'elle a **déjà le contrôle** : c'est une **transaction entre actionnaires (IFRS 10)**, traitée **en capitaux propres** — **aucun goodwill nouveau**, **aucun** impact résultat. À **ne pas confondre** avec un *step acquisition* qui, lui, **franchit le seuil du contrôle**."}, {"type": "callout", "tone": "tip", "title": "Période d'évaluation (≤ 12 mois)", "text": "Corrections **rétrospectives** des valeurs provisoires (en contrepartie du **goodwill**), **sans** passer par le résultat courant. Au-delà de 12 mois ⇒ **erreur (IAS 8)** ou changement d'estimation selon le cas."}, {"type": "diagram", "kind": "flow", "title": "La méthode de l'acquisition en 4 étapes", "steps": [{"label": "① Acquéreur", "sub": "Qui obtient le contrôle (IFRS 10)"}, {"label": "② Date d'acquisition", "sub": "Prise de contrôle — JV figées"}, {"label": "③ JV actifs / passifs / NCI", "sub": "Réévaluation IFRS 13, incorporels isolés"}, {"label": "④ Goodwill résiduel", "sub": "Ou bargain purchase si négatif"}], "accent": "violet", "caption": "Mnémo **IDÉE-G** : Identifier → Date → Évaluer → Goodwill. IFRS 3 ne traite que la **date d'acquisition** ; la conso récurrente relève d'IFRS 10."}]}, {"title": "🔢 Exemple chiffré — goodwill plein vs partiel", "blocks": [{"type": "example", "title": "M acquiert 80 % de F", "statement": "Le 1er juillet, la société **M** acquiert **80 %** des actions de **F** pour **1 000** (réglés en trésorerie). À la date d'acquisition :\n- **JV des actifs identifiables acquis et passifs repris de F = 900** (actif net identifiable réévalué).\n- **JV de la NCI (20 %) = 230** (déduite, p. ex., du cours de l'action de F).\n- M ne détenait **aucune** participation antérieure (pas de *step acquisition*).\n- Honoraires de conseil et *due diligence* : **40**.\n\n**Question** : calculez le goodwill selon les **deux options** d'évaluation de la NCI, passez les écritures, et réconciliez l'écart. Où passent les honoraires ?", "solution": "**Méthode 1 — Goodwill COMPLET (NCI à la JV)**\n- (a) Contrepartie = **1 000**\n- (b) NCI à la JV = **230**\n- (c) Participation antérieure = **0**\n- Sous-total (a+b+c) = **1 230**\n- (d) − JV actif net identifiable = **(900)**\n- **= Goodwill complet = 330** (inclut la quote-part du groupe ET des minoritaires)\n\nÉcriture : *Dr Actifs nets identifiables 900 · Dr Goodwill 330 · Cr Trésorerie 1 000 · Cr NCI (JV) 230.*\n\n---\n\n**Méthode 2 — Goodwill PARTIEL (NCI = quote-part)**\nNCI = **20 % × 900 = 180**.\n- Sous-total (a+b+c) = 1 000 + 180 + 0 = **1 180**\n- (d) − JV actif net identifiable = **(900)**\n- **= Goodwill partiel = 280** (ne reflète que la part du groupe, 80 %)\n\nÉcriture : *Dr Actifs nets identifiables 900 · Dr Goodwill 280 · Cr Trésorerie 1 000 · Cr NCI (quote-part) 180.*\n\n---\n\n**Réconciliation de l'écart** : Goodwill complet − partiel = **330 − 280 = 50** = goodwill **attribué aux minoritaires**. On le retrouve dans la NCI : **230 − 180 = 50**. ✔️ L'option « JV » gonfle **simultanément** le goodwill **et** la NCI du même montant.\n\n**Honoraires (40)** — dans les **deux** méthodes : *Dr Charges 40 / Cr Trésorerie 40*. Ils n'entrent **jamais** dans le goodwill.\n\n**Variante — bargain purchase** : si la contrepartie n'était que de **700** (NCI partielle 180, actifs nets 900), alors **700 + 180 − 900 = −20**. Après réexamen, **profit de 20 en résultat**, **aucun goodwill**.\n\n**Impact états financiers** : actif = actifs nets 900 + goodwill (330 ou 280) ; CP = NCI (230 ou 180) distincte ; trésorerie −1 000 ; résultat = **−40** (honoraires), goodwill **non amorti**."}, {"type": "table", "title": "Synthèse des deux options", "headers": ["Poste", "Méthode 1 — JV (complet)", "Méthode 2 — quote-part (partiel)"], "rows": [["(a) Contrepartie", "1 000", "1 000"], ["(b) NCI", "230 (JV)", "180 (20 % × 900)"], ["(c) Part antérieure", "0", "0"], ["(d) − Actif net identifiable", "(900)", "(900)"], ["**Goodwill**", "**330**", "**280**"], ["Écart de goodwill", "+50 (part minoritaires)", "—"]]}, {"type": "diagram", "kind": "waterfall", "title": "Pont du goodwill — Méthode 1 : NCI à la JV (goodwill COMPLET)", "items": [{"label": "Contrepartie", "value": 1000, "kind": "add"}, {"label": "+ NCI (JV)", "value": 230, "kind": "add"}, {"label": "+ JV part antérieure", "value": 0, "kind": "add"}, {"label": "− Actif net identifiable", "value": 900, "kind": "sub"}, {"label": "= Goodwill complet", "value": 330, "kind": "total"}], "caption": "1 000 + 230 + 0 − 900 = **330**. Le goodwill complet inclut la quote-part des **minoritaires**."}, {"type": "diagram", "kind": "waterfall", "title": "Pont du goodwill — Méthode 2 : NCI en quote-part (goodwill PARTIEL)", "items": [{"label": "Contrepartie", "value": 1000, "kind": "add"}, {"label": "+ NCI (20 % × 900)", "value": 180, "kind": "add"}, {"label": "+ JV part antérieure", "value": 0, "kind": "add"}, {"label": "− Actif net identifiable", "value": 900, "kind": "sub"}, {"label": "= Goodwill partiel", "value": 280, "kind": "total"}], "caption": "1 000 + 180 + 0 − 900 = **280**. Écart avec le complet : **330 − 280 = 50** = goodwill des minoritaires (et **230 − 180 = 50** côté NCI). ✔️"}, {"type": "diagram", "kind": "group", "parent": {"label": "M paie 1 000"}, "pct": 80, "child": {"label": "F — actif net id. 900"}, "nci": 20, "method": "Intégration globale (IFRS 10)", "caption": "M acquiert **80 %** de F pour **1 000** ; NCI **20 %**. Actif net identifiable réévalué = **900**, NCI à la JV = **230**."}]}, {"title": "🗂️ IFRS 3 vs Swiss GAAP RPC 30 vs CO", "blocks": [{"type": "compare", "title": "IFRS 3 / IFRS 10 vs Swiss GAAP RPC 30 vs CO (art. 963–963b)", "rows": [{"crit": "Obligation de consolider", "ifrs": "Oui, dès le **contrôle** (IFRS 10)", "rpc": "Oui, dès le **contrôle** ; sous-groupes possibles", "co": "Oui si **contrôle**, sauf exemptions de taille (art. 963a)"}, {"crit": "Méthode du regroupement", "ifrs": "**Méthode de l'acquisition** imposée", "rpc": "**Méthode de l'acquisition** ; *pooling* exceptionnel possible", "co": "Pas de méthode prescrite en détail ; cadre de principes"}, {"crit": "Réévaluation des actifs/passifs à la JV (PPA)", "ifrs": "**Obligatoire** (PPA à la JV, IFRS 13)", "rpc": "Réévaluation à la JV de l'actif net identifiable (PPA)", "co": "**Non requise** : consolidation au **coût d'acquisition**"}, {"crit": "Incorporels isolés du goodwill", "ifrs": "**Oui**, largement (marques, relations clients…)", "rpc": "Possible mais moins développé qu'en IFRS", "co": "Non spécifié"}, {"crit": "Goodwill — suivi", "ifrs": "**Non amorti**, **test de dépréciation annuel** (IAS 36)", "rpc": "**Amorti** (≤ 5 ans, max **20 ans** si justifié) **OU** imputé aux **fonds propres** (*shadow accounting*)", "co": "Généralement **amorti** ; prudence, pas de standard détaillé"}, {"crit": "NCI — évaluation initiale", "ifrs": "**Option** : JV (complet) **ou** quote-part (partiel)", "rpc": "Quote-part de l'actif net (goodwill complet rare)", "co": "Minoritaires présentés ; pas d'option JV codifiée"}, {"crit": "Contrepartie éventuelle (earn-out)", "ifrs": "À la **JV** ; passif **réévalué en résultat**", "rpc": "Estimée et intégrée ; réévaluation moins formalisée", "co": "Non spécifié"}, {"crit": "Coûts liés à l'acquisition", "ifrs": "**Charges** de la période", "rpc": "Généralement en **charges**", "co": "Selon prudence ; souvent en charges"}, {"crit": "Bargain purchase (badwill)", "ifrs": "**Profit en résultat** après réexamen", "rpc": "Souvent en produit/réserve ; approche prudente", "co": "Non codifié"}, {"crit": "Informations à fournir", "ifrs": "**Très étendues** (IFRS 3.B64)", "rpc": "Annexe RPC, plus légères", "co": "**Minimales** (exigences légales de base)"}]}, {"type": "keypoints", "title": "Les 3 divergences qui rapportent des points", "accent": "amber", "items": ["**Goodwill** : *non amorti* (IFRS, test IAS 36) **vs** *amorti 5–20 ans ou imputé aux fonds propres* (RPC) **vs** *amorti / prudence* (CO). **LE** contraste central.", "**Juste valeur** : PPA à la JV **obligatoire** en IFRS/RPC **vs** consolidation au **coût** sans réévaluation au CO.", "**NCI** : **option JV / goodwill complet** propre à **IFRS 3** — **absente** du référentiel suisse."]}, {"type": "diagram", "kind": "columns", "cols": [{"title": "IFRS 3", "color": "indigo", "items": ["Goodwill **non amorti**", "Test de dépréciation **annuel** (IAS 36)", "PPA à la JV obligatoire", "NCI : option JV / quote-part"]}, {"title": "Swiss GAAP RPC 30", "color": "emerald", "items": ["Goodwill **amorti** ≤ 5 ans (max **20 ans**)", "**OU** imputé aux fonds propres", "PPA à la JV de l'actif net", "NCI en quote-part"]}, {"title": "CO (art. 963–963b)", "color": "amber", "items": ["Goodwill généralement **amorti** (prudence)", "Pas de standard détaillé", "Conso au **coût**, sans réévaluation JV", "Pas d'option NCI codifiée"]}], "caption": "**LE** contraste central : goodwill *non amorti* (IFRS) **vs** *amorti ≤ 20 ans ou imputé aux FP* (RPC) **vs** *amorti / prudence* (CO)."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Frais d'acquisition en charges", "text": "Les **capitaliser** dans le coût/goodwill est une **faute** récurrente. Honoraires, *due diligence*, banquiers, évaluateurs ⇒ **charges**. Seuls les **coûts d'émission de titres** suivent IAS 32 / IFRS 9."}, {"type": "callout", "tone": "warn", "title": "Contrepartie éventuelle — passif vs capitaux propres", "text": "Le **classement** détermine si la réévaluation passe **en résultat** (passif) ou **non** (capitaux propres). Se tromper de case **fausse tous les exercices suivants**."}, {"type": "callout", "tone": "warn", "title": "Step acquisition ≠ rachat de minoritaires", "text": "**Franchir le contrôle** ⇒ **réévaluation de l'ancienne part en résultat** + nouveau goodwill. **Rachat de NCI déjà sous contrôle** ⇒ **transaction en capitaux propres**, **aucun** résultat, **aucun** goodwill."}, {"type": "keypoints", "title": "Autres pièges classiques", "accent": "rose", "items": ["**Actif vs business** : oublier le test input/processus/output (ou le test de concentration 2018). Acquisition d'**actifs** ⇒ **pas de goodwill**, frais **capitalisés**.", "**Incorporels noyés dans le goodwill** : ne pas isoler marques, relations clients, technologie, carnet de commandes alors qu'ils sont **identifiables**. Sur-goodwill = sous-amortissement futur.", "**Impôt différé de la PPA** : les réévaluations créent des différences temporelles ⇒ **IAS 12** (IDP), ce qui **augmente le goodwill**. Souvent oublié.", "**Passifs éventuels** : exception IAS 37 — comptabilisés **même si la sortie n'est pas probable**. Contre-intuitif.", "**Période d'évaluation** : ajuster le goodwill **rétrospectivement** ≠ passer en résultat ; au-delà de 12 mois ⇒ IAS 8.", "**Bargain purchase trop vite** : un badwill **exige d'abord un réexamen** complet avant de reconnaître un profit.", "**Acquisition inversée** : l'acquéreur **comptable** ≠ émetteur **juridique** des titres.", "**Contrôle commun** : opération **hors champ** d'IFRS 3 — ne pas y appliquer mécaniquement la méthode."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "IDÉE-G", "phrase": "« IDentifier l'acquéreur, Établir la date, Évaluer à la JV, dégager le Goodwill » — la méthode de l'acquisition tient dans IDÉE-G.", "items": [{"l": "I", "t": "**Identifier** l'acquéreur (celui qui obtient le contrôle, IFRS 10)"}, {"l": "D", "t": "**Date** d'acquisition = prise de contrôle (les JV sont figées ici)"}, {"l": "É", "t": "**Évaluer** actifs, passifs et NCI à la **juste valeur** (IFRS 13)"}, {"l": "G", "t": "**Goodwill** résiduel = Contrepartie + NCI + JV part antérieure − JV actif net"}]}, {"type": "keypoints", "title": "Réflexes d'examen (très payant)", "accent": "emerald", "items": ["**Qualifier d'abord** : contrôle (IFRS 10) + business (input + processus) ? Sinon ⇒ acquisition d'actifs, **pas de goodwill**.", "**Annoncer la méthode** : « méthode de l'acquisition en 4 étapes (IFRS 3) » et **citer les 4 étapes**.", "**Poser l'équation explicitement** avant les chiffres.", "**Traiter la NCI selon l'option** (JV vs quote-part) et **montrer l'effet** sur goodwill ET NCI.", "**Réflexes charges** : honoraires/*due diligence* ⇒ résultat ; *earn-out* ⇒ JV, passif réévalué en résultat.", "**Conclure sur les états financiers** : bilan (actifs JV, goodwill, NCI), résultat (frais ; goodwill non amorti), CP (NCI distincte).", "**Réflexe suisse** : « En RPC 30 le goodwill serait amorti (≤ 20 ans) ou imputé aux fonds propres ; au CO, consolidation au coût, sans réévaluation à la JV. »"]}, {"type": "callout", "tone": "key", "title": "Citations sûres", "text": "**IFRS 3** (méthode de l'acquisition, goodwill, NCI option) · **IFRS 10** (contrôle) · **IFRS 13** (juste valeur) · **IAS 36** (dépréciation du goodwill — **pas** d'amortissement) · **IAS 12** (impôt différé de la PPA) · **RPC 30** (conso suisse) · **CO art. 963–963b** (comptes de groupe)."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste-toi (8 questions)", "questions": [{"q": "Quelle est la condition de déclenchement d'IFRS 3 ?", "options": ["Détenir au moins 20 % du capital", "Obtenir le CONTRÔLE d'une entreprise (au sens IFRS 10)", "Exercer une influence notable", "Acquérir n'importe quel groupe d'actifs"], "answer": 1, "explain": "IFRS 3 s'applique dès qu'un acquéreur obtient le **contrôle** d'une *business* (IFRS 10). Pas de contrôle, ou simple groupe d'actifs sans processus, ⇒ pas d'IFRS 3."}, {"q": "Quelle est la formule du goodwill ?", "options": ["Contrepartie − Trésorerie acquise", "% acquis × Capitaux propres comptables de l'acquise", "Contrepartie + NCI + JV part antérieurement détenue − JV des actifs nets identifiables", "JV des actifs nets identifiables − Contrepartie"], "answer": 2, "explain": "Le goodwill est un **résiduel** : (a) Contrepartie + (b) NCI + (c) JV part antérieure − (d) JV de l'actif net identifiable. Négatif ⇒ *bargain purchase* après réexamen."}, {"q": "Où passent les honoraires de due diligence et de conseil ?", "options": ["Capitalisés dans le coût du regroupement", "Ajoutés au goodwill", "En charges de la période où ils sont encourus", "Déduits des capitaux propres"], "answer": 2, "explain": "Les **coûts liés à l'acquisition** sont des **charges** de la période, **jamais** dans le goodwill. Seuls les **coûts d'émission de titres** suivent IAS 32 / IFRS 9."}, {"q": "NCI à la JV = 230, NCI en quote-part = 180. Que vaut l'écart et où le retrouve-t-on ?", "options": ["50, qui réduit la trésorerie", "50, goodwill des minoritaires, qui augmente simultanément le goodwill ET la NCI", "410, le total des deux NCI", "50, comptabilisé en résultat"], "answer": 1, "explain": "L'option « JV » (goodwill complet) gonfle **simultanément** le goodwill (+50) **et** la NCI (+50). On passe ainsi d'un goodwill de 280 à 330."}, {"q": "Une contrepartie éventuelle (earn-out) classée en PASSIF se suit comment après la date d'acquisition ?", "options": ["Elle n'est jamais réévaluée", "Réévaluée à la JV à chaque clôture, variations en RÉSULTAT", "Réévaluée, variations imputées au goodwill", "Réévaluée, variations en capitaux propres"], "answer": 1, "explain": "Earn-out **passif** ⇒ réévaluation à la JV à chaque clôture, variations **en résultat**. Earn-out **capitaux propres** (nombre fixe d'actions) ⇒ **non réévalué**."}, {"q": "Lors d'une step acquisition, que devient la participation antérieurement détenue ?", "options": ["Elle reste à son coût historique", "Elle est réévaluée à la JV, écart en résultat, et cette JV entre dans l'équation du goodwill", "Elle est éliminée sans impact", "Elle est réévaluée, écart directement en capitaux propres"], "answer": 1, "explain": "À la prise de contrôle, l'ancienne part est **réévaluée à la JV**, l'écart passe **en résultat**, et cette JV alimente le terme (c) du goodwill. À distinguer du **rachat de NCI déjà sous contrôle** (capitaux propres, aucun résultat)."}, {"q": "Le goodwill issu d'un regroupement IFRS est-il amorti ?", "options": ["Oui, sur 5 ans", "Oui, sur 20 ans maximum", "Non : il n'est pas amorti, mais soumis à un test de dépréciation annuel (IAS 36)", "Non : il est immédiatement passé en charges"], "answer": 2, "explain": "En IFRS, le goodwill **n'est pas amorti** ; seul un **test de dépréciation annuel** (IAS 36) peut le réduire. En **RPC 30**, il serait **amorti (≤ 20 ans) ou imputé aux fonds propres** — divergence majeure."}, {"q": "Durée maximale de la période d'évaluation et nature des ajustements ?", "options": ["6 mois ; ajustements en résultat", "12 mois ; ajustements rétrospectifs (en contrepartie du goodwill), au-delà ⇒ IAS 8", "24 mois ; ajustements en capita
