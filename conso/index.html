const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "–";
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
};

function SplitBar({ left, right, lLabel, rLabel, lColor = "indigo", rColor = "amber" }) {

  const cl = { indigo: "bg-indigo-500", amber: "bg-amber-400", emerald: "bg-emerald-500", slate: "bg-slate-400" };
  return (
    <div>

/* ===================== data & compute ===================== */
const PRESET = {
  pctMere: "80", prix: "800", fCap: "500", fResAcq: "300", ecart: "100", jvNci: "190",
  fActifs: "1400", fResClot: "450", fDettes: "450", mActifs: "1700", mCap: "1000", mRes: "700", mDettes: "800",
  creanceIG: "120", margeStock: "20", taux: "0",
};
function compute(d, opt) {
  const pct = num(d.pctMere) / 100;
  const t = num(d.taux) / 100;
  const ecart = num(d.ecart);
  const DTL = ecart * t;
  const ecartNet = ecart - DTL;
  const prix = num(d.prix);
  const X = num(d.fCap) + num(d.fResAcq) + ecartNet;
  const deltaR = num(d.fResClot) - num(d.fResAcq);
  const qpGroupe = X * pct;
  const qpNci = X * (1 - pct);
  const gwPartial = prix - qpGroupe;
  const gwFull = prix + num(d.jvNci) - X;
  const full = opt.method === "full";
  const gw = full ? gwFull : gwPartial;
  const gwEmbeddedME = prix - qpGroupe;
  const nciAcq = full ? num(d.jvNci) : qpNci;
  const nci = nciAcq + (1 - pct) * deltaR;
  const marge = num(d.margeStock);
  const resConso = num(d.mRes) + pct * deltaR - marge;
  const ic = num(d.creanceIG);
  const compense = opt.ref === "swissgaap" && opt.gwTreat === "compense";
  const badwill = gw < 0;
  const gwActif = (compense || badwill) ? 0 : gw;
  const resConsoFinal = (compense || badwill) ? resConso - gw : resConso;
  const cActifs = num(d.mActifs) + num(d.fActifs) + ecart - ic - marge;
  const totActif = gwActif + cActifs;
  const totPassif = num(d.mCap) + resConsoFinal + nci + (num(d.mDettes) + num(d.fDettes) - ic) + DTL;
  const okBilan = Math.abs(totActif - totPassif) < 0.5;
  const amortAnnual = opt.amort > 0 ? gw / opt.amort : 0;
  const valME = prix + pct * deltaR;
  return { pct, t, DTL, ecart, ecartNet, prix, X, deltaR, qpGroupe, qpNci, gwPartial, gwFull, full, gw, gwEmbeddedME, nciAcq, nci, marge, resConso, ic, compense, gwActif, resConsoFinal, cActifs, totActif, totPassif, okBilan, amortAnnual, valME };
}

const GLOSSARY = [
  { t: "Périmètre de consolidation", en: "Scope of consolidation", d: "Ensemble des sociétés retenues dans les comptes consolidés et la méthode appliquée à chacune." },
  { t: "Société mère / consolidante", en: "Parent company", d: "Société qui établit les comptes consolidés et contrôle les autres entités du groupe." },
  { t: "Contrôle exclusif", en: "Control", d: "Pouvoir de diriger les politiques financières et opérationnelles. IFRS 10 : pouvoir + rendements variables + lien entre les deux. → Intégration globale." },
  { t: "Contrôle conjoint", en: "Joint control", d: "Partage contractuel du contrôle ; décisions clés à l'unanimité. → Mise en équivalence (IFRS) ou intégration proportionnelle (Swiss GAAP)." },
  { t: "Influence notable", en: "Significant influence", d: "Pouvoir de participer aux décisions sans les contrôler (présumé dès 20 %). → Mise en équivalence." },
  { t: "Intégration globale", en: "Full consolidation", d: "Reprise de 100 % des actifs et passifs de la filiale ; les minoritaires sont isolés au passif." },
  { t: "Intégration proportionnelle", en: "Proportional consolidation", d: "Reprise de la seule quote-part des actifs/passifs. Autorisée en Swiss GAAP, supprimée en IFRS pour les coentreprises." },
  { t: "Mise en équivalence", en: "Equity method", d: "Les titres figurent en une ligne, valorisés à la quote-part de l'actif net, ajustée du résultat de l'entité." },
  { t: "Goodwill / Écart d'acquisition", en: "Goodwill", d: "Excédent du prix payé sur la juste valeur de la quote-part d'actif net identifiable acquise (synergies, capital humain…)." },
  { t: "Goodwill négatif / Badwill", en: "Bargain purchase", d: "Prix payé inférieur à la JV de l'actif net acquis. IFRS : comptabilisé immédiatement en produit après réexamen." },
  { t: "Goodwill complet", en: "Full goodwill method", d: "Minoritaires évalués à la juste valeur ; le goodwill inclut leur part. Option IFRS." },
  { t: "Goodwill partiel", en: "Partial goodwill method", d: "Minoritaires évalués à leur quote-part d'actif net ; le goodwill ne porte que sur le groupe. Usuel en Swiss GAAP." },
  { t: "Intérêts minoritaires", en: "Non-controlling interests (NCI)", d: "Part des capitaux propres de la filiale détenue par des actionnaires hors groupe." },
  { t: "Juste valeur", en: "Fair value", d: "Prix de transfert d'un actif/passif entre intervenants de marché. Base de l'allocation du prix (PPA)." },

        </div>
        <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-4">
          <div className="text-xs font-semibold uppercase text-emerald-600">Méthode complète (option IFRS)</div>
          <div className="flex justify-between items-baseline mt-1"><span className="text-sm text-emerald-800">Goodwill</span><span className="text-2xl font-bold tabular-nums text-emerald-700">{fmt(gwFull)}</span></div>
          <div className="flex justify-between text-xs text-emerald-700 mt-1"><span>Minoritaires (JV)</span><span className="tabular-nums font-semibold">{fmt(num(s.nci))}</span></div>

                <tr key={i} className="border-t border-slate-100">
                  <td className="px-3 py-2 font-medium text-slate-700">{r.e}</td>
                  <td className="px-3 py-2 text-right tabular-nums">{fmt(r.ctrl)} %</td>
                  <td className="px-3 py-2"><span className={`text-xs px-2 py-0.5 rounded ${mColor(r.ctrl)}`}>{method(r.ctrl)}</span></td>
                  <td className="px-3 py-2 text-right tabular-nums">{fmt(r.int)} %</td>
                  <td className="px-3 py-2 text-right tabular-nums text-slate-400">{fmt(100 - r.int)} %</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {!broken && diverge && <Note type="tip">Pour <strong>PF</strong> : % de contrôle = <strong>{fmt(ctrlPF)} %</strong> mais % d'intérêt = <strong>{fmt(intPF)} %</strong>. La <strong>méthode</strong> ({method(ctrlPF).toLowerCase()}) suit le contrôle ; le <strong>partage des capitaux propres</strong> (groupe {fmt(intPF)} % / minoritaires {fmt(100 - intPF)} %) suit l'intérêt.</Note>}
        {broken && <Note type="warn"><strong>Rupture de chaîne</strong> : M ne contrôle pas F ({fmt(mf)} % ≤ 50 %). Les {fmt(fpf)} % détenus par F dans PF ne s'ajoutent donc <strong>pas</strong> au contrôle de M sur PF. M ne conserve qu'un intérêt économique de {fmt(intPF)} % dans PF.</Note>}
        <Note type="info">On consolide les sous-groupes du bas vers le haut. Le contrôle peut exister avec un intérêt &lt; 50 % (ici {fmt(ctrlPF)} % de contrôle pour {fmt(intPF)} % d'intérêt) : d'où des intérêts minoritaires importants.</Note>
      </div>
    </div>
  );
}

/* ===================== compte de résultat consolidé ===================== */
const RES_PRESET = { pct: "80", caM: "2000", chargesM: "1700", caF: "1200", chargesF: "1050", vi: "400", marge: "20", amort: "16" };

          <Field label="Charges" value={s.chargesM} onChange={u("chargesM")} />

          <Field label="Marge interne sur stock" hint="profit non réalisé" value={s.marge} onChange={u("marge")} />

      <div className="space-y-4">
        <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

          <div className="p-4 text-sm space-y-1">
            <div className="flex justify-between py-1"><span className="text-slate-700">Produits (CA)</span><span className="tabular-nums font-medium">{fmt(caConso)}</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont élimination des ventes internes</span><span className="tabular-nums">−{fmt(vi)}</span></div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Charges</span><span className="tabular-nums font-medium">({fmt(chargesConso)})</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont élimination des ventes internes</span><span className="tabular-nums">−{fmt(vi)}</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont marge interne sur stock</span><span className="tabular-nums">+{fmt(marge)}</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont amortissement du goodwill</span><span className="tabular-nums">+{fmt(amort)}</span></div>
            <div className="flex justify-between py-2 mt-1 border-t-2 border-slate-300 font-bold text-slate-900"><span>Résultat net consolidé</span><span className="tabular-nums">{fmt(resNet)}</span></div>
          </div>
        </div>
        <Card title="Partage du résultat net" icon={<GitBranch size={18} className="text-indigo-600" />} accent="indigo">
          <SplitBar left={resGroupe} right={resMino} lLabel="Part du groupe" rLabel="Part des minoritaires" lColor="indigo" rColor="amber" />
          <div className="grid grid-cols-2 gap-3 mt-3">
            <div className="rounded-lg bg-indigo-50 p-3"><div className="text-xs text-indigo-600 font-medium">Attribuable aux propriétaires de la mère</div><div className="text-xl font-bold text-indigo-700 tabular-nums">{fmt(resGroupe)}</div></div>
            <div className="rounded-lg bg-amber-50 p-3"><div className="text-xs text-amber-700 font-medium">Attribuable aux minoritaires</div><div className="text-xl font-bold text-amber-700 tabular-nums">{fmt(resMino)}</div></div>
          </div>
        </Card>
        <Journal n="1" title="Élimination des ventes internes"
          lines={[{ compte: "Produits (ventes intragroupe)", debit: vi }, { compte: "Charges (achats intragroupe)", credit: vi }]}
          note="Sans impact sur le résultat, sauf la marge restant en stock, neutralisée séparément." />
        <Journal n="2" title="Affectation du résultat aux minoritaires"

      </div>
    </div>
  );
}

/* ===================== feuille de consolidation ===================== */
function FeuilleTab({ d, c }) {
  const mActifs = num(d.mActifs), prix = num(d.prix), mCap = num(d.mCap), mRes = num(d.mRes), mDettes = num(d.mDettes);
  const fActifs = num(d.fActifs), fCap = num(d.fCap), fResClot = num(d.fResClot), fDettes = num(d.fDettes);
  const rows = [
    { lib: "Goodwill", m: 0, f: 0, r: c.gwActif, sec: "Actif" },
    { lib: "Titres de participation", m: prix, f: 0, r: -prix, sec: "Actif" },
    { lib: "Immo. — écart d'évaluation", m: 0, f: 0, r: c.ecart, sec: "Actif" },
    { lib: "Autres actifs", m: mActifs, f: fActifs, r: -c.ic - c.marge, sec: "Actif" },
    { lib: "Capital", m: mCap, f: fCap, r: -fCap, sec: "Passif" },
    { lib: "Réserves", m: mRes, f: fResClot, r: c.resConsoFinal - (mRes + fResClot), sec: "Passif" },
    { lib: "Intérêts minoritaires", m: 0, f: 0, r: c.nci, sec: "Passif" },
    ...(c.DTL > 0 ? [{ lib: "Impôt différé passif", m: 0, f: 0, r: c.DTL, sec: "Passif" }] : []),
    { lib: "Dettes", m: mDettes, f: fDettes, r: -c.ic, sec: "Passif" },
  ];
  const actif = rows.filter((x) => x.sec === "Actif");
  const passif = rows.filter((x) => x.sec === "Passif");
  const sum = (arr, k) => arr.reduce((a, x) => a + (k === "cumul" ? x.m + x.f : k === "conso" ? x.m + x.f + x.r : x[k]), 0);
  const sgn = (n) => (Math.round(n) === 0 ? "—" : n > 0 ? "+" + fmt(n) : fmt(n));
  const sgnCls = (n) => (Math.round(n) === 0 ? "text-slate-300" : n > 0 ? "text-emerald-600" : "text-rose-600");
  const Section = ({ title, list }) => (
    <>
      <tr className="bg-slate-100"><td colSpan={6} className="px-3 py-1 text-xs font-bold uppercase text-slate-500">{title}</td></tr>
      {list.map((x, i) => (
        <tr key={i} className="border-t border-slate-100">
          <td className="px-3 py-1.5 text-slate-700">{x.lib}</td>
          <td className="px-3 py-1.5 text-right tabular-nums text-slate-500">{x.m ? fmt(x.m) : "—"}</td>
          <td className="px-3 py-1.5 text-right tabular-nums text-slate-500">{x.f ? fmt(x.f) : "—"}</td>
          <td className="px-3 py-1.5 text-right tabular-nums text-slate-600">{fmt(x.m + x.f)}</td>
          <td className={`px-3 py-1.5 text-right tabular-nums font-medium ${sgnCls(x.r)}`}>{sgn(x.r)}</td>
          <td className="px-3 py-1.5 text-right tabular-nums font-semibold text-slate-900">{fmt(x.m + x.f + x.r)}</td>
        </tr>
      ))}
      <tr className="bg-slate-50 font-bold text-slate-800 border-t border-slate-200">
        <td className="px-3 py-1.5">Total {title.toLowerCase()}</td>
        <td className="px-3 py-1.5 text-right tabular-nums">{fmt(sum(list, "m"))}</td>
        <td className="px-3 py-1.5 text-right tabular-nums">{fmt(sum(list, "f"))}</td>
        <td className="px-3 py-1.5 text-right tabular-nums">{fmt(sum(list, "cumul"))}</td>
        <td className="px-3 py-1.5 text-right tabular-nums">{sgn(sum(list, "r"))}</td>
        <td className="px-3 py-1.5 text-right tabular-nums">{fmt(sum(list, "conso"))}</td>
      </tr>
    </>
  );
  return (
    <div className="space-y-4">
      <Note type="info">La <strong>feuille de consolidation</strong> reprend l'exemple de l'assistant. Lis-la de gauche à droite : comptes individuels → <strong>cumul</strong> (Mère + Filiale) → <strong>retraitements & éliminations</strong> (écart d'évaluation, élimination des titres, partage des capitaux propres, créances/dettes et marge internes) → <strong>bilan consolidé</strong>.</Note>
      <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-x-auto">
        <table className="w-full text-sm min-w-max">
          <thead>
            <tr className="bg-slate-800 text-white text-xs">
              <th className="px-3 py-2 text-left">Compte</th>
              <th className="px-3 py-2 text-right">Mère</th>
              <th className="px-3 py-2 text-right">Filiale</th>
              <th className="px-3 py-2 text-right">Cumul</th>
              <th className="px-3 py-2 text-right">Retr. & élim.</th>
              <th className="px-3 py-2 text-right">Consolidé</th>
            </tr>
          </thead>
          <tbody>
            <Section title="Actif" list={actif} />
            <Section title="Passif" list={passif} />
          </tbody>
        </table>
      </div>
      <div className="flex items-center justify-between flex-wrap gap-2 bg-white rounded-xl border border-slate-200 p-3">
        <span className="text-sm text-slate-600">Équilibre du bilan consolidé</span>
        <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${c.okBilan ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>{c.okBilan ? <CheckCircle2 size={12} /> : <AlertTriangle size={12} />}Actif {fmt(c.totActif)} = Passif {fmt(c.totPassif)}</span>
      </div>
      <Note type="tip">La colonne « Retr. & élim. » est un ensemble d'<strong>écritures équilibrées</strong> (total des débits = total des crédits). Change les données dans l'onglet « Assistant pas à pas » ou ses options (goodwill complet, compensation, impôt différé) : cette feuille se met à jour automatiquement.</Note>
    </div>
  );
}

      </StepCard>

      <StepCard n="2" title="Étape 2 — Distinguer % de contrôle et % d'intérêt">
        <p className="text-sm text-slate-600">Le <strong>contrôle</strong> (binaire à chaque maillon) fixe la méthode ; l'<strong>intérêt</strong> (multiplicatif) fixe la quote-part du groupe. Le cas le plus subtil est la petite-fille PF, détenue indirectement.</p>
        <div className="mt-3 rounded-lg bg-slate-50 p-3 text-sm">
          <div className="flex justify-between py-1"><span className="text-slate-600">PF — % de contrôle</span><span className="tabular-nums font-semibold">{ctrlF1 ? fmt(pf) : 0} %</span></div>
          <div className="flex justify-between py-1"><span className="text-slate-600">PF — % d'intérêt</span><span className="tabular-nums font-semibold">{fmt(intPF)} %</span></div>
          <div className="text-xs text-slate-500 mt-1">{ctrlF1 ? `M contrôle F1 (${fmt(f1)} %), donc contrôle PF via F1 → intégration globale. Mais le groupe n'en détient économiquement que ${fmt(f1)} % × ${fmt(pf)} % = ${fmt(intPF)} %.` : `M ne contrôle pas F1 : la chaîne se rompt et PF n'est pas intégrée via F1.`}</div>
        </div>
      </StepCard>

      <StepCard n="3" title="Étape 3 — Consolider du bas vers le haut">
        <ol className="text-sm text-slate-600 space-y-2">
          <li className="flex gap-2"><span className="font-bold text-indigo-500">a.</span><span>Intégrer d'abord <strong>PF dans F1</strong> (sous-groupe), en isolant les minoritaires de PF.</span></li>
          <li className="flex gap-2"><span className="font-bold text-indigo-500">b.</span><span>Intégrer <strong>F1 (incluant PF) dans M</strong>, en dégageant le goodwill et les minoritaires de F1.</span></li>
          <li className="flex gap-2"><span className="font-bold text-indigo-500">c.</span><span>Traiter <strong>F2</strong> par {methodF2.toLowerCase()} et <strong>F3</strong> par mise en équivalence.</span></li>
          <li className="flex gap-2"><span className="font-bold text-indigo-500">d.</span><span>Éliminer toutes les <strong>opérations intragroupe</strong> entre M, F1 et PF.</span></li>
        </ol>
      </StepCard>

      <StepCard n="4" title="Étape 4 — Lire le bilan du groupe">
        <ul className="text-sm text-slate-600 space-y-1.5">
          <li className="flex gap-2"><CheckCircle2 size={16} className="text-indigo-400 shrink-0 mt-0.5" /><span><strong>F1 et PF</strong> apportent <strong>100 %</strong> de leurs actifs et passifs ; la part des autres actionnaires forme les <strong>intérêts minoritaires</strong>.</span></li>
          <li className="flex gap-2"><CheckCircle2 size={16} className="text-emerald-400 shrink-0 mt-0.5" /><span><strong>F3</strong> apparaît en <strong>une seule ligne</strong> (participations mises en équivalence).</span></li>
          <li className="flex gap-2"><CheckCircle2 size={16} className="text-amber-400 shrink-0 mt-0.5" /><span><strong>F2</strong> → {ref === "ifrs" ? "une seule ligne (mise en équivalence)" : `sa quote-part (${fmt(f2)} %) de chaque actif/passif, sans minoritaires`}.</span></li>
        </ul>
      </StepCard>
    </div>
  );
}

/* ===================== conversion en devises ===================== */
const CONV_PRESET = { actifs: "2500", dettes: "900", capital: "1000", reserves: "400", resultat: "200", histo: "0.90", moyen: "0.92", cloture: "0.95" };
function ConversionTab() {
  const [s, setS] = useState(CONV_PRESET);
  const u = (k) => (v) => setS((p) => ({ ...p, [k]: v }));
  const A = num(s.actifs), D = num(s.dettes), K = num(s.capital), R = num(s.reserves), Re = num(s.resultat);
  const histo = num(s.histo), moyen = num(s.moyen), clot = num(s.cloture);
  const netFC = A - D;
  const Ac = A * clot, Dc = D * clot, Kc = K * histo, Rc = R * histo, Rec = Re * moyen;
  const cta = netFC * clot - (Kc + Rc + Rec);
  const okFC = Math.abs(netFC - (K + R + Re)) < 0.5;
  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <div className="space-y-4">
        <Card title="Filiale étrangère (en devise locale)" icon={<Globe size={18} className="text-indigo-600" />}>
          <Field label="Actifs" value={s.actifs} onChange={u("actifs")} suffix="USD" />
          <Field label="Dettes" value={s.dettes} onChange={u("dettes")} suffix="USD" />
          <Field label="Capital" value={s.capital} onChange={u("capital")} suffix="USD" />
          <Field label="Réserves (ouverture)" value={s.reserves} onChange={u("reserves")} suffix="USD" />
          <Field label="Résultat de l'exercice" value={s.resultat} onChange={u("resultat")} suffix="USD" />
          {!okFC && <Note type="warn">Le bilan local ne boucle pas : Actifs − Dettes ({fmt(netFC)}) doit égaler Capital + Réserves + Résultat ({fmt(K + R + Re)}).</Note>}
        </Card>
        <Card title="Cours de change (1 USD = ? CHF)" icon={<Coins size={18} className="text-indigo-600" />}>
          <Field label="Cours historique (capital, réserves)" value={s.histo} onChange={u("histo")} suffix="CHF" />
          <Field label="Cours moyen (résultat)" value={s.moyen} onChange={u("moyen")} suffix="CHF" />
          <Field label="Cours de clôture (bilan)" value={s.cloture} onChange={u("cloture")} suffix="CHF" />
          <button onClick={() => setS(CONV_PRESET)} className="flex items-center gap-2 text-xs text-slate-500 hover:text-indigo-600 mt-3"><RotateCcw size={13} /> Réinitialiser</button>
        </Card>
      </div>
      <div className="space-y-4">
        <Note type="info">Règle : le <strong>bilan</strong> est converti au <strong>cours de clôture</strong>, le <strong>résultat</strong> au <strong>cours moyen</strong>, et les apports (<strong>capital</strong>) au cours historique. L'ajustement résiduel est l'<strong>écart de conversion</strong>, porté en capitaux propres (OCI), sans passer par le résultat.</Note>
        <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <div className="bg-slate-800 text-white px-4 py-2.5 font-semibold flex items-center gap-2"><Globe size={16} /> Bilan converti (en CHF)</div>
          <div className="p-4 text-sm">
            <div className="text-xs font-semibold uppercase text-slate-400 mb-1">Actif</div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Actifs (× clôture {s.cloture})</span><span className="tabular-nums">{fmt(Ac)}</span></div>
            <div className="flex justify-between py-1.5 border-t border-slate-200 font-bold text-slate-900"><span>Total actif</span><span className="tabular-nums">{fmt(Ac)}</span></div>
            <div className="text-xs font-semibold uppercase text-slate-400 mb-1 mt-3">Passif</div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Capital (× histo {s.histo})</span><span className="tabular-nums">{fmt(Kc)}</span></div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Réserves (× histo {s.histo})</span><span className="tabular-nums">{fmt(Rc)}</span></div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Résultat (× moyen {s.moyen})</span><span className="tabular-nums">{fmt(Rec)}</span></div>
            <div className="flex justify-between py-1"><span className="text-indigo-700 font-medium">Écart de conversion (OCI)</span><span className={`tabular-nums font-semibold ${cta < 0 ? "text-rose-600" : "text-indigo-700"}`}>{fmt(cta)}</span></div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Dettes (× clôture {s.cloture})</span><span className="tabular-nums">{fmt(Dc)}</span></div>
            <div className="flex justify-between py-1.5 border-t border-slate-200 font-bold text-slate-900"><span>Total passif</span><span className="tabular-nums">{fmt(Kc + Rc + Rec + cta + Dc)}</span></div>
          </div>
        </div>
        <Note type="tip">L'écart de conversion ({fmt(cta)}) vient du décalage : les actifs nets sont convertis au cours de clôture ({fmt(netFC * clot)}) alors que les capitaux propres le sont à des cours différents ({fmt(Kc + Rc + Rec)}). Il s'accumule en capitaux propres et n'affecte le résultat qu'au moment de la cession de la filiale.</Note>
      </div>
    </div>
  );
}

/* ===================== dépréciation IAS 36 ===================== */
const IMP_PRESET = { vc: "1200", goodwill: "200", viu: "1050", fvlcd: "1000" };
function ImpairmentTab() {
  const [s, setS] = useState(IMP_PRESET);
  const u = (k) => (v) => setS((p) => ({ ...p, [k]: v }));
  const vc = num(s.vc), gw = num(s.goodwill), viu = num(s.viu), fvlcd = num(s.fvlcd);
  const recup = Math.max(viu, fvlcd);
  const perte = Math.max(0, vc - recup);
  const surGoodwill = Math.min(perte, gw);
  const surAutres = perte - surGoodwill;
  const deprec = perte > 0;
  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <Card title="Unité génératrice de trésorerie (UGT)" icon={<TrendingDown size={18} className="text-indigo-600" />}>
        <Field label="Valeur comptable de l'UGT" hint="goodwill inclus" value={s.vc} onChange={u("vc")} />
        <Field label="dont goodwill" value={s.goodwill} onChange={u("goodwill")} />
        <Field label="Valeur d'utilité (VIU)" hint="flux futurs actualisés" value={s.viu} onChange={u("viu")} />
        <Field label="Juste valeur nette des coûts (FVLCD)" value={s.fvlcd} onChange={u("fvlcd")} />
        <button onClick={() => setS(IMP_PRESET)} className="flex items-center gap-2 text-xs text-slate-500 hover:text-indigo-600 mt-3"><RotateCcw size={13} /> Réinitialiser</button>
      </Card>
      <div className="space-y-4">
        <Card title="Test de dépréciation (IAS 36)" icon={<AlertTriangle size={18} className="text-indigo-600" />} accent="indigo">
          {[["Valeur recouvrable = max(VIU ; FVLCD)", recup], ["Valeur comptable", vc], ["Perte de valeur = max(0 ; VC − recouvrable)", perte]].map((r, i) => (
            <div key={i} className={`flex justify-between py-1.5 text-sm ${i === 2 ? "font-semibold border-t border-indigo-100 mt-1 pt-2 " + (deprec ? "text-rose-600" : "text-emerald-600") : "text-slate-600"}`}><span>{r[0]}</span><span className="tabular-nums">{fmt(r[1])}</span></div>
          ))}
        </Card>
        {deprec ? (
          <>
            <Card title="Affectation de la perte" icon={<Layers size={18} className="text-indigo-600" />}>
              <div className="flex justify-between py-1.5 text-sm text-slate-600"><span>1. Au goodwill (en priorité)</span><span className="tabular-nums">{fmt(surGoodwill)}</span></div>
              <div className="flex justify-between py-1.5 text-sm text-slate-600"><span>2. Au prorata des autres actifs</span><span className="tabular-nums">{fmt(surAutres)}</span></div>
              <div className="flex justify-between py-1.5 text-sm text-slate-700 border-t border-slate-100 mt-1 pt-2"><span>Goodwill après dépréciation</span><span className="tabular-nums font-semibold">{fmt(gw - surGoodwill)}</span></div>
            </Card>
            <Journal n="1" title="Comptabilisation de la dépréciation"
              lines={[{ compte: "Perte de valeur (résultat)", debit: perte }, { compte: "Goodwill", credit: surGoodwill }, ...(surAutres > 0 ? [{ compte: "Autres actifs de l'UGT", credit: surAutres }] : [])]}
              note="La perte s'impute d'abord sur le goodwill (jamais repris ensuite), puis au prorata des autres actifs de l'UGT." />
          </>
        ) : (
          <Note type="info">Pas de dépréciation : la valeur recouvrable ({fmt(recup)}) couvre la valeur comptable ({fmt(vc)}).</Note>
        )}
      </div>
    </div>
  );
}

function QuizTab() {
  const [ans, setAns] = useState({});
  const score = QUIZ.reduce((n, q, i) => n + (ans[i] === q.a ? 1 : 0), 0);
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between bg-white rounded-xl border border-slate-200 p-3">
        <span className="text-sm text-slate-600 flex items-center gap-2"><GraduationCap size={18} className="text-indigo-600" /> Score</span>
        <span className="text-lg font-bold text-indigo-700 tabular-nums">{score} / {QUIZ.length}</span>
      </div>
      {QUIZ.map((q, i) => (
        <Card key={i}>
          <div className="font-medium text-slate-800 text-sm mb-2"><span className="text-indigo-500 font-bold mr-1">{i + 1}.</span>{q.q}</div>
          <div className="space-y-1.5">
            {q.o.map((o, j) => {
              const chosen = ans[i] === j;
              const reveal = ans[i] !== undefined;
              const correct = j === q.a;
              let cls = "border-slate-200 hover:bg-slate-50 text-slate-700";
              if (reveal && correct) cls = "border-emerald-300 bg-emerald-50 text-emerald-800";
              else if (reveal && chosen && !correct) cls = "border-rose-300 bg-rose-50 text-rose-800";
              return (
                <button key={j} disabled={reveal} onClick={() => setAns((p) => ({ ...p, [i]: j }))} className={`w-full text-left text-sm rounded-lg border px-3 py-2 transition-colors ${cls}`}>
                  {o}{reveal && correct ? " ✓" : reveal && chosen && !correct ? " ✗" : ""}
                </button>
              );
            })}
          </div>
          {ans[i] !== undefined && <div className="mt-2 text-xs text-slate-500 bg-slate-50 rounded-lg p-2.5">{q.e}</div>}
        </Card>
      ))}
      <button onClick={() => setAns({})} className="flex items-center gap-2 text-xs text-slate-500 hover:text-indigo-600"><RotateCcw size={13} /> Recommencer le quiz</button>
    </div>
  );
}

  { v: "conjoint_act", l: "Contrôle conjoint — activité conjointe (→ intégration partielle)" },

  const interest = {};

  for (let i = 0; i < entities.length * entities.length + 10; i++) {
    let maxd = 0;
    for (const e of entities) {
      if (e.id === headId) continue;

              <span className="text-xs text-slate-400 pb-1.5">détient</span>
              <div className="flex flex-col"><span className="text-xs text-slate-400 mb-0.5">Détenue</span>
                <select value={h.to} onChange={e => updHolding(h.id, "to", e.target.value)} className="w-36 rounded-md border border-slate-300 px-2 py-1 text-sm bg-white"><option value="">—</option>{entities.map(e => <option key={e.id} value={e.id}>{e.name || "(sans nom)"}</option>)}</select></div>
              <div className="flex flex-col"><span className="text-xs text-slate-400 mb-0.5">% capital</span><input type="number" value={h.cap} onChange={e => updHolding(h.id, "cap", e.target.value)} className="w-20 rounded-md border border-slate-300 px-2 py-1 text-sm text-right tabular-nums" /></div>
              <div className="flex flex-col"><span className="text-xs text-slate-400 mb-0.5">% droits de vote</span><input type="number" value={h.vote} onChange={e => updHolding(h.id, "vote", e.target.value)} className="w-20 rounded-md border border-slate-300 px-2 py-1 text-sm text-right tabular-nums" /></div>
              <div className="flex flex-col"><span className="text-xs text-slate-400 mb-0.5">Spécificité</span><select value={h.special} onChange={e => updHolding(h.id, "special", e.target.value)} className="w-56 rounded-md border border-slate-300 px-2 py-1 text-sm bg-white">{PERIM_SPECIALS.map(s => <option key={s.v} value={s.v}>{s.l}</option>)}</select></div>
              <button onClick={() => removeHolding(h.id)} className="text-slate-300 hover:text-red-500 pb-1.5"><Trash2 size={16} /></button>
            </div>
            <Note type="info"><strong>% capital</strong> → % d'intérêt, <strong>% droits de vote</strong> → % de contrôle. Vote double : votes &gt; capital ; certificat sans droit de vote : l'inverse ; actions auto-détenues : saisis les % nets.</Note>
          </Card>
        );
      })()}

      {!selected && <Note type="info">Clique une <strong>société</strong> ou une <strong>flèche</strong> du schéma pour la modifier. « + Société » ajoute une boîte ; « Relier deux sociétés » crée un lien en cliquant la détentrice puis la détenue.</Note>}

      <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <div className="bg-slate-800 text-white px-4 py-2.5 text-sm font-semibold flex items-center gap-2"><Table size={16} /> Tableau du périmètre de consolidation — IFRS</div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm min-w-max">
            <thead><tr className="bg-slate-100 text-slate-600 text-xs">
              <th className="px-3 py-2 text-left font-medium">Société</th>

              <th className="px-3 py-2 text-left font-medium">Méthode</th>
              <th className="px-3 py-2 text-right font-medium">% d'intérêt</th>
              <th className="px-3 py-2 text-right font-medium">% NCI</th>
            </tr></thead>
            <tbody>
              {rows.length === 0 && <tr><td colSpan={6} className="px-3 py-4 text-center text-slate-400 text-sm">Ajoute des sociétés et des liens pour voir le périmètre.</td></tr>}
              {rows.map(r => (
                <tr key={r.id} className={`border-t border-slate-100 ${r.inPerim ? "" : "text-slate-400"}`}>
                  <td className="px-3 py-2 font-medium text-slate-700">{r.name}{r.brokenChain && !r.controlled && <span className="block text-xs font-normal text-amber-600">⚠ droits via une société non contrôlée exclus (chaîne rompue)</span>}</td>
                  <td className="px-3 py-2 text-right tabular-nums">{pctFmt(r.vote)}</td>
                  <td className="px-3 py-2">{r.nature}</td>
                  <td className="px-3 py-2"><span className={`inline-block rounded px-2 py-0.5 text-xs font-medium ${methodColor(r.methode)}`}>{r.methode}</span></td>
                  <td className="px-3 py-2 text-right tabular-nums">{r.interest === null ? "—" : pctFmt(r.interest)}</td>
                  <td className="px-3 py-2 text-right tabular-nums">{r.nci === null ? "—" : pctFmt(r.nci)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="px-4 py-3 text-xs text-slate-500 border-t border-slate-100 space-y-1">
          <p><strong>% de contrôle</strong> = votes directs + votes des sociétés contrôlées (100 % par maillon contrôlé, 0 sinon). <strong>% d'intérêt</strong> = produit des % de capital, uniquement à travers des sociétés contrôlées (règle IFRS).</p>
          <p><strong>% NCI</strong> = 100 % − % d'intérêt (intégration globale) ; = % de contrôle − % d'intérêt (mise en équivalence).</p>
        </div>
      </div>
      {reciprocal && <Note type="warn">Une société détient des titres de la mère (<strong>liaison réciproque / auto-contrôle</strong>). Le % d'intérêt « externe » se calcule alors par la technique de la <strong>mère fictive</strong> (non automatisée ici) : 100 % − part auto-détenue = X, puis on rapporte les participations à X.</Note>}
    </div>
  );
}

  { id: "groupe", label: "1 · Notion de groupe" },

  { id: "capital", label: "3 · Consolidation du capital" },
  { id: "fp", label: "4 · Fonds propres" },
  { id: "recip", label: "5 · Opérations réciproques" },
  { id: "benef", label: "6 · Bénéfices internes" },
  { id: "subseq", label: "7 · Années suivantes" },
  { id: "apur", label: "8 · Apurement (BC1→BC2)" },
  { id: "mino", label: "9 · Intérêts minoritaires" },
  { id: "prop", label: "10 · Intégration proportionnelle" },
  { id: "mee", label: "11 · Mise en équivalence" },

];

    <div className="rounded-lg border border-indigo-100 bg-indigo-50 p-3 mt-2">
      <div className="text-xs font-semibold text-indigo-700 mb-2 flex items-center gap-1.5"><Info size={14} /> Pourquoi ce débit / ce crédit ?</div>
      <ul className="space-y-1.5">
        {lines.map((l, i) => (
          <li key={i} className="text-xs text-slate-700 flex gap-2 items-start">

            <span><strong>{l.compte}</strong> — {l.why}</span>

        ))}

}

function NumIn({ label, value, set, suffix }) {
  return (
    <label className="flex flex-col">
      <span className="text-xs text-slate-500 mb-0.5">{label}</span>

        {suffix && <span className="text-xs text-slate-400">{suffix}</span>}
      </div>

}

function CapitalConsoWidget() {
  const [prix, setPrix] = useState("150");
  const [capital, setCapital] = useState("100");
  const [reserves, setReserves] = useState("30");
  const [tr, setTr] = useState("benchmark");
  const fp = num(capital) + num(reserves);
  const diff = num(prix) - fp;
  const gw = diff > 0 ? diff : 0;
  const bw = diff < 0 ? -diff : 0;
  const cas = diff > 0 ? "goodwill" : diff < 0 ? "badwill" : "aucune";
  const casColor = cas === "goodwill" ? "bg-indigo-600" : cas === "badwill" ? "bg-amber-500" : "bg-emerald-600";
  const casLabel = cas === "goodwill" ? "Goodwill (prix > fonds propres)" : cas === "badwill" ? "Goodwill négatif / badwill (prix < fonds propres)" : "Aucune différence (prix = fonds propres)";

  let lines, why;
  if (cas === "aucune") {
    lines = [{ compte: "Fonds propres de F (capital + réserves)", debit: fp }, { compte: "Participation à F", credit: fp }];
    why = [
      { sens: "D", compte: "Fonds propres de F", why: "on annule les capitaux propres de la filiale : ses actifs et passifs sont déjà repris ligne à ligne, les FP feraient double emploi." },
      { sens: "C", compte: "Participation à F", why: "on supprime le titre de participation chez la mère, qui représentait justement cette filiale (élimination du double comptage)." },
    ];
  } else if (cas === "goodwill") {
    lines = [{ compte: "Fonds propres de F (capital + réserves)", debit: fp }, { compte: "Goodwill", debit: gw }, { compte: "Participation à F", credit: num(prix) }];
    why = [
      { sens: "D", compte: "Fonds propres de F", why: "on annule les capitaux propres repris de la filiale (déjà représentés par ses actifs/passifs)." },
      { sens: "D", compte: "Goodwill", why: `c'est un actif (immobilisation incorporelle) : le surplus payé ${fmt(gw)} au-delà des fonds propres = synergies, savoir-faire, position de marché.` },
      { sens: "C", compte: "Participation à F", why: `on solde le titre pour son coût total ${fmt(num(prix))} ; FP ${fmt(fp)} + goodwill ${fmt(gw)} = prix payé.` },
    ];
  } else {
    if (tr === "ifrs") {
      lines = [{ compte: "Fonds propres de F (capital + réserves)", debit: fp }, { compte: "Participation à F", credit: num(prix) }, { compte: "Bénéfice (gain d'acquisition)", credit: bw }];
      why = [
        { sens: "D", compte: "Fonds propres de F", why: "on annule les capitaux propres repris." },
        { sens: "C", compte: "Participation à F", why: `on solde le titre pour son coût ${fmt(num(prix))}.` },
        { sens: "C", compte: "Bénéfice (gain)", why: `IFRS : la bonne affaire (${fmt(bw)}) est un produit immédiat (bargain purchase).` },
      ];
    } else {
      lines = [{ compte: "Fonds propres de F (capital + réserves)", debit: fp }, { compte: "Participation à F", credit: num(prix) }, { compte: "Goodwill négatif (passif)", credit: bw }];
      why = [
        { sens: "D", compte: "Fonds propres de F", why: "on annule les capitaux propres repris." },
        { sens: "C", compte: "Participation à F", why: `on solde le titre pour son coût ${fmt(num(prix))}.` },
        { sens: "C", compte: "Goodwill négatif", why: `Swiss GAAP : l'excédent de FP sur le prix (${fmt(bw)}) devient un poste au passif (réserve de badwill).` },
      ];
    }
  }

  return (
    <div className="space-y-3">
      <div className="flex flex-wrap gap-4 items-end p-3 rounded-lg bg-slate-50 border border-slate-200">
        <NumIn label="Prix d'achat payé par M" value={prix} set={setPrix} />
        <NumIn label="Capital-actions de F" value={capital} set={setCapital} />
        <NumIn label="Réserves de F (à l'acquisition)" value={reserves} set={setReserves} />
      </div>
      <div className={`rounded-lg px-4 py-2.5 text-white text-sm font-semibold flex flex-wrap items-center gap-x-3 ${casColor}`}>
        <span>{casLabel}</span>
        <span className="text-white/80 font-normal">Prix {fmt(num(prix))} − fonds propres {fmt(fp)} = {fmt(diff)}</span>
      </div>
      <Journal n="C" title="Écriture de consolidation du capital" lines={lines} />
      <CoursPourquoi lines={why} />

      {cas !== "aucune" && (
        <div>
          <div className="flex flex-wrap gap-2 mt-3 mb-2">
            {[["benchmark", "Swiss GAAP — Benchmark"], ["alternative", "Swiss GAAP — Alternative"], ["ifrs", "IFRS"]].map(([v, l]) => (
              <button key={v} onClick={() => setTr(v)} className={`text-xs px-3 py-1.5 rounded-lg border ${tr === v ? "border-indigo-500 bg-indigo-600 text-white" : "border-slate-300 text-slate-600 hover:bg-slate-50"}`}>{l}</button>
            ))}
          </div>
          {cas === "goodwill" && tr === "benchmark" && (<>
            <Journal n="A" title="Puis chaque année : amortissement du goodwill (sur 5 ans)" lines={[{ compte: "Amortissement du goodwill (charge)", debit: gw / 5 }, { compte: "Goodwill", credit: gw / 5 }]} note={`Dotation annuelle = ${fmt(gw)} ÷ 5 ans = ${fmt(gw / 5)}. Le goodwill est activé puis amorti linéairement (usuel 5 ans, max 20), avec test de dépréciation en complément.`} />
            <Note type="info">Variante principale suisse : le résultat supporte une charge récurrente, donc une rentabilité affichée plus prudente.</Note>
          </>)}
          {cas === "goodwill" && tr === "alternative" && (<>
            <Journal n="A" title="Variante : goodwill compensé avec les fonds propres" lines={[{ compte: "Réserves issues du bénéfice (fonds propres)", debit: gw }, { compte: "Goodwill", credit: gw }]} note="Le goodwill ne figure jamais à l'actif : il est imputé directement sur les fonds propres dès l'acquisition. L'annexe doit indiquer l'effet théorique d'une activation + amortissement." />
            <Note type="info">Pas de charge d'amortissement ultérieure, mais des fonds propres plus faibles dès le départ.</Note>
          </>)}
          {cas === "goodwill" && tr === "ifrs" && (
            <Note type="tip"><strong>IFRS</strong> : le goodwill est activé mais <strong>jamais amorti</strong>. On teste sa valeur chaque année (test de dépréciation, IAS 36) ; en cas d'échec, une perte — irréversible — est constatée. Pas de charge récurrente, mais risque de dépréciation brutale.</Note>
          )}
          {cas === "badwill" && tr === "benchmark" && (<>
            <Journal n="D" title="Puis : dissolution du goodwill négatif (sur 5 ans max)" lines={[{ compte: "Goodwill négatif (passif)", debit: bw / 5 }, { compte: "Produit (dissolution du badwill)", credit: bw / 5 }]} note={`Reprise annuelle = ${fmt(bw)} ÷ 5 = ${fmt(bw / 5)}. Le badwill, inscrit au passif, est dissous sur 5 ans au plus, en améliorant le résultat.`} />
          </>)}
          {cas === "badwill" && tr === "alternative" && (
            <Note type="info"><strong>Alternative suisse</strong> : le badwill est compensé directement avec les capitaux propres (pas de poste au passif). L'annexe indique les conséquences de ce choix.</Note>
          )}
          {cas === "badwill" && tr === "ifrs" && (
            <Note type="tip"><strong>IFRS</strong> : après revérification des justes valeurs, le badwill est comptabilisé <strong>immédiatement en produit</strong> (déjà inclus dans l'écriture ci-dessus).</Note>
          )}
        </div>
      )}
    </div>
  );
}

  );

function MinoWidget() {
  const [pct, setPct] = useState("75");
  const [capital, setCapital] = useState("100");
  const [reserves, setReserves] = useState("80");
  const [benefice, setBenefice] = useState("20");
  const [prix, setPrix] = useState("145");
  const p = num(pct), mino = Math.max(0, 100 - p);
  const fpAcq = num(capital) + num(reserves);
  const capM = num(capital) * p / 100, resM = num(reserves) * p / 100;
  const capN = num(capital) * mino / 100, resN = num(reserves) * mino / 100;
  const gw = Math.round((num(prix) - fpAcq * p / 100) * 100) / 100;
  const pmf = Math.round((capN + resN) * 100) / 100;
  const pmb = Math.round(num(benefice) * mino / 100 * 100) / 100;
  const capLines = gw >= 0
    ? [{ compte: `Capital-actions (${p} %)`, debit: capM }, { compte: `Réserves issues du capital (${p} %)`, debit: resM }, { compte: "Goodwill", debit: gw }, { compte: "Participation à F", credit: num(prix) }]
    : [{ compte: `Capital-actions (${p} %)`, debit: capM }, { compte: `Réserves issues du capital (${p} %)`, debit: resM }, { compte: "Participation à F", credit: num(prix) }, { compte: "Goodwill négatif", credit: -gw }];
  return (
    <div className="space-y-3">
      <div className="flex flex-wrap gap-4 items-end p-3 rounded-lg bg-slate-50 border border-slate-200">
        <NumIn label="% détenu par la mère" value={pct} set={setPct} suffix="%" />
        <NumIn label="Capital-actions de F" value={capital} set={setCapital} />
        <NumIn label="Réserves de F (acquisition)" value={reserves} set={setReserves} />
        <NumIn label="Bénéfice de F (année)" value={benefice} set={setBenefice} />
        <NumIn label="Prix payé par M" value={prix} set={setPrix} />
      </div>
      <div className="rounded-lg px-4 py-2.5 bg-indigo-600 text-white text-sm flex flex-wrap gap-x-3 items-center">
        <span className="font-semibold">Minoritaires : {fmt(mino)} %</span>
        <span className="text-white/80">{gw >= 0 ? `Goodwill ${fmt(gw)}` : `Goodwill négatif ${fmt(-gw)}`} = prix {fmt(num(prix))} − {fmt(p)} % × FP {fmt(fpAcq)}</span>
      </div>
      <Journal n="1" title={`Consolidation du capital (part mère ${p} %)`} lines={capLines} />
      <Journal n="2" title={`Parts des minoritaires aux fonds propres (${fmt(mino)} %)`} lines={[{ compte: `Capital-actions (${fmt(mino)} %)`, debit: capN }, { compte: `Réserves issues du capital (${fmt(mino)} %)`, debit: resN }, { compte: "PMF (parts minoritaires aux FP)", credit: pmf }]} />
      <Journal n="3" title={`Parts des minoritaires au résultat (${fmt(mino)} %)`} lines={[{ compte: "Bénéfice Bilan", debit: pmb }, { compte: "PMB Bilan", credit: pmb }]} note={`${fmt(mino)} % du bénéfice de F (${fmt(num(benefice))}) = ${fmt(pmb)} reviennent aux minoritaires. Côté résultat : Débit PMB CR / Crédit Bénéfice CR.`} />
      <CoursPourquoi lines={[
        { sens: "D", compte: "Capital + Réserves (part mère)", why: `on ne compense que la quote-part de la mère (${p} %) des fonds propres de la filiale contre le prix payé.` },
        { sens: "C", compte: "PMF", why: `la quote-part des minoritaires (${fmt(mino)} %) des fonds propres devient un poste distinct dans les fonds propres du groupe.` },
        { sens: "C", compte: "PMB", why: "la part des minoritaires dans le bénéfice est retirée du résultat attribuable à la holding." },
      ]} />
    </div>
  );
}

function LiasseWidget() {
  const [on, setOn] = useState({ e1: false, e2: false, e3: false });
  const toggle = k => setOn(p => ({ ...p, [k]: !p[k] }));
  const ROWS = [
    { id: "act", nom: "Actifs divers", nat: "actif", m: 640, f: 250 },
    { id: "stock", nom: "Stock de marchandises", nat: "actif", m: 0, f: 60 },
    { id: "ccf", nom: "Compte courant avec F", nat: "actif", m: 40, f: 0 },
    { id: "part", nom: "Participation à F", nat: "actif", m: 170, f: 0 },
    { id: "gw", nom: "Goodwill", nat: "actif", m: 0, f: 0 },
    { id: "fe", nom: "Fonds étrangers", nat: "passif", m: 300, f: 100 },
    { id: "ccm", nom: "Compte courant avec M", nat: "passif", m: 0, f: 40 },
    { id: "cap", nom: "Capital-actions", nat: "passif", m: 400, f: 100 },
    { id: "res", nom: "Réserves", nat: "passif", m: 130, f: 50 },
    { id: "ben", nom: "Bénéfice", nat: "passif", m: 20, f: 20 },
  ];
  const ECR = {
    e1: { cap: { d: 100 }, res: { d: 50 }, gw: { d: 20 }, part: { c: 170 } },
    e2: { ccm: { d: 40 }, ccf: { c: 40 } },
    e3: { ben: { d: 10 }, stock: { c: 10 } },
  };
  const dc = (rowId) => { let d = 0, c = 0; Object.keys(ECR).forEach(k => { if (on[k] && ECR[k][rowId]) { d += ECR[k][rowId].d || 0; c += ECR[k][rowId].c || 0; } }); return { d, c }; };
  const grp = (r) => { const { d, c } = dc(r.id); return r.nat === "actif" ? r.m + r.f + d - c : r.m + r.f + c - d; };
  const totActif = ROWS.filter(r => r.nat === "actif").reduce((s, r) => s + grp(r), 0);
  const totPassif = ROWS.filter(r => r.nat === "passif").reduce((s, r) => s + grp(r), 0);
  const cumA = ROWS.filter(r => r.nat === "actif").reduce((s, r) => s + r.m + r.f, 0);
  const cumP = ROWS.filter(r => r.nat === "passif").reduce((s, r) => s + r.m + r.f, 0);
  const eq = Math.abs(totActif - totPassif) < 0.001;
  const ecrItems = [["e1", "① Consolidation du capital"], ["e2", "② Comptes courants réciproques"], ["e3", "③ Marge interne dans le stock"]];
  const Row = ({ r }) => {
    const { d, c } = dc(r.id);
    return (
      <tr className="border-b border-slate-50">
        <td className={`px-2 py-1 ${r.nat === "passif" ? "text-slate-500" : "text-slate-700"}`}>{r.nom}</td>
        <td className="px-2 py-1 text-right tabular-nums text-slate-400">{r.m ? fmt(r.m) : ""}</td>
        <td className="px-2 py-1 text-right tabular-nums text-slate-400">{r.f ? fmt(r.f) : ""}</td>
        <td className="px-2 py-1 text-right tabular-nums">{fmt(r.m + r.f)}</td>
        <td className="px-2 py-1 text-right tabular-nums text-indigo-600">{d ? fmt(d) : ""}</td>
        <td className="px-2 py-1 text-right tabular-nums text-emerald-600">{c ? fmt(c) : ""}</td>
        <td className="px-2 py-1 text-right tabular-nums font-semibold text-slate-800">{fmt(grp(r))}</td>
      </tr>
    );
  };
  return (
    <div className="space-y-3">
      <div className="flex flex-wrap gap-2">
        {ecrItems.map(([k, l]) => (<button key={k} onClick={() => toggle(k)} className={`text-xs px-3 py-1.5 rounded-lg border ${on[k] ? "border-indigo-500 bg-indigo-600 text-white" : "border-slate-300 text-slate-600 hover:bg-slate-50"}`}>{on[k] ? "✓ " : ""}{l}</button>))}
      </div>
      <div className="overflow-x-auto rounded-lg border border-slate-200">
        <table className="w-full text-xs min-w-max">
          <thead><tr className="bg-slate-100 text-slate-500">
            <th className="px-2 py-1.5 text-left font-medium">Poste</th>
            <th className="px-2 py-1.5 text-right font-medium">Comptes M</th>
            <th className="px-2 py-1.5 text-right font-medium">Comptes F</th>
            <th className="px-2 py-1.5 text-right font-medium">Bilan cumulé</th>
            <th className="px-2 py-1.5 text-right font-medium text-indigo-600">Écr. Débit</th>
            <th className="px-2 py-1.5 text-right font-medium text-emerald-600">Écr. Crédit</th>
            <th className="px-2 py-1.5 text-right font-medium">Groupe</th>
          </tr></thead>
          <tbody>
            {ROWS.filter(r => r.nat === "actif").map(r => <Row key={r.id} r={r} />)}
            <tr className="bg-slate-50 font-semibold text-slate-700"><td className="px-2 py-1">Total actif</td><td /><td /><td className="px-2 py-1 text-right tabular-nums">{fmt(cumA)}</td><td /><td /><td className="px-2 py-1 text-right tabular-nums">{fmt(totActif)}</td></tr>
            {ROWS.filter(r => r.nat === "passif").map(r => <Row key={r.id} r={r} />)}
            <tr className="bg-slate-50 font-semibold text-slate-700"><td className="px-2 py-1">Total passif</td><td /><td /><td className="px-2 py-1 text-right tabular-nums">{fmt(cumP)}</td><td /><td /><td className="px-2 py-1 text-right tabular-nums">{fmt(totPassif)}</td></tr>
          </tbody>
        </table>
      </div>
      <div className={`rounded-lg px-4 py-2 text-sm font-medium ${eq ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-amber-50 text-amber-700 border border-amber-200"}`}>
        {eq ? `Bilan équilibré : actif = passif = ${fmt(totActif)}` : `Écart actif / passif : ${fmt(totActif - totPassif)} — il reste des écritures à activer.`}
      </div>
      <Note type="tip">Active les écritures une à une : la colonne <strong>Groupe</strong> se construit sous tes yeux. Sans aucune écriture, le cumulé compte deux fois la participation et les opérations internes ({fmt(cumA)}). Avec les trois, la participation et le compte courant disparaissent, le goodwill apparaît, la marge interne sort du bénéfice — et le bilan du groupe est équilibré.</Note>
    </div>
  );
}

function EcritureExercice() {
  const [i, setI] = useState(0);
  const [d, setD] = useState("");
  const [c, setC] = useState("");
  const [checked, setChecked] = useState(false);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const q = EXO_QUESTIONS[i];
  const ok = d === q.debit && c === q.credit;
  const verifier = () => { if (checked) return; setChecked(true); if (ok) setScore(s => s + 1); };
  const suivant = () => { if (i + 1 >= EXO_QUESTIONS.length) { setDone(true); return; } setI(i + 1); setD(""); setC(""); setChecked(false); };
  const restart = () => { setI(0); setD(""); setC(""); setChecked(false); setScore(0); setDone(false); };
  if (done) return (
    <div className="text-center py-6">
      <div className="text-3xl font-bold text-indigo-700">{score} / {EXO_QUESTIONS.length}</div>
      <p className="text-sm text-slate-500 mt-1">{score === EXO_QUESTIONS.length ? "Parfait — tu maîtrises les écritures !" : score >= EXO_QUESTIONS.length * 0.6 ? "Bien joué ! Revois les écritures manquées." : "Reprends les chapitres concernés, puis réessaie."}</p>
      <button onClick={restart} className="mt-3 inline-flex items-center gap-1.5 text-sm px-4 py-2 rounded-lg border border-indigo-500 bg-indigo-600 text-white hover:bg-indigo-700"><RotateCcw size={15} /> Recommencer</button>
    </div>
  );
  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between text-xs text-slate-400"><span>Question {i + 1} / {EXO_QUESTIONS.length}</span><span>Score : {score}</span></div>
      <div className="rounded-lg border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700">{q.situation}</div>
      <div className="grid sm:grid-cols-2 gap-3">
        <label className="flex flex-col"><span className="text-xs text-indigo-700 font-semibold mb-1">Compte à débiter</span>
          <select value={d} onChange={e => setD(e.target.value)} disabled={checked} className="rounded-md border border-slate-300 px-2 py-1.5 text-sm bg-white"><option value="">— choisir —</option>{q.options.map(o => <option key={o} value={o}>{o}</option>)}</select></label>
        <label className="flex flex-col"><span className="text-xs text-emerald-700 font-semibold mb-1">Compte à créditer</span>
          <select value={c} onChange={e => setC(e.target.value)} disabled={checked} className="rounded-md border border-slate-300 px-2 py-1.5 text-sm bg-white"><option value="">— choisir —</option>{q.options.map(o => <option key={o} value={o}>{o}</option>)}</select></label>
      </div>
      {!checked && <button onClick={verifier} disabled={!d || !c} className={`text-sm px-4 py-2 rounded-lg border ${(!d || !c) ? "border-slate-200 text-slate-300 cursor-not-allowed" : "border-indigo-500 bg-indigo-600 text-white hover:bg-indigo-700"}`}>Vérifier</button>}
      {checked && (
        <div className={`rounded-lg p-3 text-sm border ${ok ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-amber-50 border-amber-200 text-amber-800"}`}>
          <div className="font-semibold flex items-center gap-1.5">{ok ? <><CheckCircle2 size={16} /> Correct !</> : <><AlertTriangle size={16} /> Pas tout à fait.</>}</div>
          {!ok && <p className="mt-1">Réponse : <strong>Débit</strong> {q.debit} / <strong>Crédit</strong> {q.credit}.</p>}
          <p className="mt-1 text-slate-600">{q.why}</p>
          <button onClick={suivant} className="mt-2 inline-flex items-center gap-1.5 text-sm px-4 py-2 rounded-lg border border-indigo-500 bg-indigo-600 text-white hover:bg-indigo-700">{i + 1 >= EXO_QUESTIONS.length ? "Voir le score" : "Question suivante"} <ArrowRight size={15} /></button>
        </div>
      )}
    </div>
  );
}

          </Card>
        </div>

      case "benef": return (

            <p className="text-sm text-slate-600">Une livraison interne se fait au prix du marché, donc avec une marge. Pour le groupe, ce bénéfice n'est <strong>réalisé</strong> que lorsque le bien quitte le périmètre (revente à un tiers). Tant que le bien dort dans un stock interne, sa marge est un <strong>bénéfice intermédiaire non réalisé</strong> à éliminer : le stock doit être ramené au <strong>coût de production du groupe</strong>.</p>

          <Card title="Atelier interactif — marge dans le stock" icon={<Calculator size={18} className="text-slate-600" />}>
            <ICProfitWidget />
          </Card>
          <Card title="Trois situations" icon={<Package size={18} className="text-slate-600" />}>
            <div className="space-y-3">

            <div className="grid sm:grid-cols-2 gap-3 mt-3">
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Bilan commercial 1 (BC1)</div><p className="text-xs text-slate-500 mt-1">Comptes locaux / fiscaux ; servent à la distribution du bénéfice.</p></div>

            <div className="space-y-2">

            </div>

      case "prop": return (

            <p className="text-sm text-slate-600">Une <strong>coentreprise</strong> (joint venture) est une entité sous <strong>contrôle conjoint</strong> : plusieurs partenaires la dirigent ensemble par contrat, aucun ne la contrôle seul. Les Swiss GAAP RPC permettent de l'intégrer par <strong>consolidation proportionnelle</strong> ou par mise en équivalence (chapitre suivant).</p>
            <Section>Règle de la consolidation proportionnelle</Section>

                  <tr className="border-t border-slate-100"><td className="px-3 py-2 font-medium text-slate-700">Entreprise associée</td><td className="px-3 py-2 text-slate-600">Influence notable (20–50 %)</td><td className="px-3 py-2"><span className="inline-block rounded px-2 py-0.5 text-xs font-medium text-emerald-700 bg-emerald-50">Mise en équivalence</span></td></tr>

          </Card>

            <div className="grid sm:grid-cols-5 gap-2">

      case "theorie": return (

            <p className="text-sm text-slate-600">Avant les écritures, il y a une <strong>logique</strong>. Les comptes consolidés ont un objectif : donner une <strong>image fidèle</strong> (true &amp; fair view) du patrimoine, de la situation financière et du résultat du groupe, pour éclairer les décisions des investisseurs et des bailleurs de fonds.</p>

            <p className="text-sm text-slate-600"><strong>Continuité d'exploitation</strong> (going concern) et <strong>comptabilité d'engagement</strong> (accrual : on rattache produits et charges à l'exercice, indépendamment des flux de trésorerie).</p>

            <div className="grid sm:grid-cols-2 gap-2">
              <div className="rounded-lg border border-indigo-100 bg-indigo-50 p-3"><div className="text-xs font-semibold text-indigo-700 mb-1">Fondamentales</div><p className="text-xs text-slate-600"><strong>Pertinence</strong> (utile à la décision, valeur prédictive/confirmative) et <strong>fidélité / fiabilité</strong> (représentation complète, neutre, exempte d'erreur).</p></div>

            <p className="text-sm text-slate-600">Pourquoi présenter les minoritaires dans les fonds propres ? Pourquoi tel calcul du goodwill ? La réponse dépend de la <strong>conception du groupe</strong> que l'on adopte. Trois théories s'opposent.</p>

                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Vision du groupe</td><td className="px-2 py-2 text-slate-600">Une entité économique unique, pour <strong>tous</strong> les actionnaires (maj. + min.)</td><td className="px-2 py-2 text-slate-600">Une <strong>extension de la mère</strong>, pour ses seuls actionnaires</td><td className="px-2 py-2 text-slate-600">La mère ne possède que sa <strong>quote-part</strong> des actifs/passifs</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Intérêts minoritaires</td><td className="px-2 py-2 text-slate-600">Dans les <strong>fonds propres</strong> du groupe</td><td className="px-2 py-2 text-slate-600">Poste <strong>distinct</strong> (mezzanine), hors FP au sens strict</td><td className="px-2 py-2 text-slate-600"><strong>Inexistants</strong> (on ne prend que sa part)</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Goodwill</td><td className="px-2 py-2 text-slate-600"><strong>Complet</strong> (y c. part des minoritaires)</td><td className="px-2 py-2 text-slate-600"><strong>Partiel</strong> (part du groupe seulement)</td><td className="px-2 py-2 text-slate-600">Quote-part uniquement</td></tr>

                  <tr className="border-t border-slate-100"><td className="px-2 py-2 font-medium text-slate-700">Méthode associée</td><td className="px-2 py-2 text-slate-600">Intégration globale (moderne)</td><td className="px-2 py-2 text-slate-600">Intégration globale (classique)</td><td className="px-2 py-2 text-slate-600">Intégration proportionnelle</td></tr>

                  <tr className="border-t border-slate-100"><td className="px-3 py-1.5 text-slate-600">Contrepartie versée (80 %)</td><td className="px-3 py-1.5 text-right tabular-nums">900</td><td className="px-3 py-1.5 text-right tabular-nums">900</td></tr>
                  <tr className="border-t border-slate-100"><td className="px-3 py-1.5 text-slate-600">Intérêts minoritaires (20 %)</td><td className="px-3 py-1.5 text-right tabular-nums">200 <span className="text-slate-400">(20 % × 1 000)</span></td><td className="px-3 py-1.5 text-right tabular-nums">230 <span className="text-slate-400">(juste valeur)</span></td></tr>
                  <tr className="border-t border-slate-100 font-semibold text-slate-800 bg-indigo-50"><td className="px-3 py-1.5">Goodwill</td><td className="px-3 py-1.5 text-right tabular-nums">100</td><td className="px-3 py-1.5 text-right tabular-nums">130</td></tr>

              </table>
            </div>

          </Card>

          <Card title="La notion de contrôle, en profondeur" icon={<GitBranch size={18} className="text-indigo-600" />}>
            <p className="text-sm text-slate-600">Le contrôle est le <strong>fait générateur</strong> de l'intégration globale. Les IFRS (IFRS 10) en donnent un <strong>modèle unique</strong> : il y a contrôle quand on réunit (1) le <strong>pouvoir</strong> sur l'entité, (2) une <strong>exposition aux rendements variables</strong>, et (3) la <strong>capacité d'utiliser ce pouvoir pour influer</strong> sur ces rendements.</p>
            <div className="grid sm:grid-cols-3 gap-2 mt-3">
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Contrôle de droit</div><p className="text-xs text-slate-500 mt-1">Majorité des droits de vote (&gt; 50 %), directement ou indirectement.</p></div>

            </div>

            <p className="text-sm text-slate-600">Fondement de l'élimination des marges internes : pour le groupe, un bénéfice n'est <strong>réalisé</strong> qu'au moment où le bien <strong>quitte le périmètre</strong> (vente à un tiers). Tant qu'il circule en interne, c'est un simple déplacement.</p>
            <div className="grid sm:grid-cols-2 gap-2 mt-3">
              <div className="rounded-lg border border-slate-200 p-3"><div className="text-xs font-semibold text-slate-700">Aval (downstream)</div><p className="text-xs text-slate-500 mt-1">Mère → filiale. Le vendeur est la mère : la marge non réalisée concerne en principe les seuls actionnaires du groupe.</p></div>

            </div>

            <Note type="info">En toute rigueur, l'élimination d'un bénéfice interne fait naître un <strong>impôt différé</strong> (le fisc local a déjà imposé le bénéfice, pas encore réalisé pour le groupe) — un raffinement traité séparément.</Note>
          </Card>
        </div>
      );

      case "exo": return (
        <div className="space-y-4">
          <Card title="Entraînement — pose la bonne écriture" icon={<GraduationCap size={18} className="text-indigo-600" />} accent="indigo">

  const idx = COURS_CHAPITRES.findIndex(x => x.id === sub);

      </div>

        <button disabled={idx >= COURS_CHAPITRES.length - 1} onClick={() => idx < COURS_CHAPITRES.length - 1 && setSub(COURS_CHAPITRES[idx + 1].id)} className={`inline-flex items-center gap-1.5 text-sm px-4 py-2 rounded-lg border ${idx >= COURS_CHAPITRES.length - 1 ? "border-slate-100 text-slate-300 cursor-not-allowed" : "border-indigo-500 bg-indigo-600 text-white hover:bg-indigo-700"}`}>{idx < COURS_CHAPITRES.length - 1 ? COURS_CHAPITRES[idx + 1].label.replace(/^\d+ · /, "") : "Fin"} <ArrowRight size={15} /></button>

  const RefSwitch = () => (
    <div className="flex items-center gap-2 flex-wrap">
      <span className="text-xs text-slate-500">Référentiel :</span>
      <div className="flex rounded-lg border border-slate-300 overflow-hidden text-xs">
        <button onClick={() => setOpt({ ...opt, ref: "ifrs", gwTreat: "capitalise" })} className={`px-3 py-1 ${opt.ref === "ifrs" ? "bg-indigo-600 text-white" : "bg-white text-slate-600"}`}>IFRS</button>
        <button onClick={() => setOpt({ ...opt, ref: "swissgaap" })} className={`px-3 py-1 ${opt.ref === "swissgaap" ? "bg-red-600 text-white" : "bg-white text-slate-600"}`}>Swiss GAAP</button>
      </div>
    </div>
  );
  const MethodSwitch = () => (
    <div className="flex items-center gap-2 flex-wrap">
      <span className="text-xs text-slate-500">Goodwill :</span>

        <button onClick={() => setOpt({ ...opt, method: "full" })} className={`px-3 py-1 ${opt.method === "full" ? "bg-emerald-600 text-white" : "bg-white text-slate-600"}`}>Complet</button>
      </div>
    </div>
  );

      case 0: return (

          <div className="grid lg:grid-cols-2 gap-5">

            <div className="space-y-4">
              <Card title="Acquisition" icon={<Calculator size={18} className="text-indigo-600" />}>

                <Field label="Coût des titres" value={d.prix} onChange={u("prix")} />
                <Field label="Taux d'impôt (différé)" hint="sur l'écart d'évaluation" value={d.taux} onChange={u("taux")} suffix="%" />
              </Card>
              <Card title="Filiale à l'acquisition" icon={<Building2 size={18} className="text-slate-600" />}>
                <Field label="Capital social" value={d.fCap} onChange={u("fCap")} />
                <Field label="Réserves (à l'acquisition)" value={d.fResAcq} onChange={u("fResAcq")} />

              <Field label="Capital" value={d.mCap} onChange={u("mCap")} />
              <Field label="Réserves" value={d.mRes} onChange={u("mRes")} />
              <Field label="Dettes" value={d.mDettes} onChange={u("mDettes")} />

              <Field label="Réserves (à la clôture)" value={d.fResClot} onChange={u("fResClot")} />
              <Field label="Dettes" value={d.fDettes} onChange={u("fDettes")} />

            <BilanView title="Bilan individuel — Filiale" accent="slate"

              passifs={[{ l: "Capital", v: num(d.fCap) }, { l: "Réserves (clôture)", v: num(d.fResClot) }, { l: "Dettes", v: num(d.fDettes) }]} />
          </div>
        </div>
      );
      case 1: return (
        <div className="space-y-4">
          <Note type="info">Avant tout calcul, on retraite les comptes des filiales. Voici la <strong>liste exhaustive</strong> par famille. Le retraitement utilisé ici est l'<strong>écart d'évaluation</strong> (famille B).</Note>
          <Card title="Écart d'évaluation appliqué dans cet exemple" icon={<Scale size={18} className="text-emerald-600" />} accent="emerald">
            <Journal n="0" title="Réévaluation des actifs identifiables à la juste valeur"
              lines={[{ compte: "Immobilisations (actif réévalué)", debit: c.ecart }, { compte: "Impôt différé passif (IAS 12)", credit: c.DTL }, { compte: "Écart d'évaluation (capitaux propres)", credit: c.ecartNet }]}
              note={c.DTL > 0 ? `Taux ${d.taux} % → impôt différé passif ${fmt(c.DTL)} ; écart net en capitaux propres ${fmt(c.ecartNet)}.` : "Taux à 0 % : pas d'impôt différé. Mets ~14 % (Genève) pour voir l'effet sur le goodwill."} />
          </Card>
          <Note type="warn">Hypothèses simplificatrices de l'exemple : l'écart d'évaluation porte sur un actif <strong>non amortissable</strong> (sinon son amortissement réduirait les réserves consolidées post-acquisition), et <strong>aucun dividende intragroupe</strong> n'est versé. Ces choix gardent l'exemple lisible sans en fausser la mécanique.</Note>
          {RETRAITEMENTS.map((g) => (
            <div key={g.cat} className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
              <div className={`px-4 py-2.5 text-sm font-semibold ${{ indigo: "bg-indigo-50 text-indigo-800", emerald: "bg-emerald-50 text-emerald-800", amber: "bg-amber-50 text-amber-800", red: "bg-red-50 text-red-800", slate: "bg-slate-50 text-slate-700" }[g.color]}`}>{g.cat}</div>
              <ul className="divide-y divide-slate-50">

              </ul>
            </div>

        </div>

            <div className="grid sm:grid-cols-2 gap-3">

                <div className="text-2xl font-bold text-indigo-700 tabular-nums">{fmt(c.gwPartial)}</div>

            </div>
          </Card>
          {c.gw < 0 && <Note type="warn"><strong>Goodwill négatif (badwill)</strong> : prix &lt; JV acquise. En IFRS, après réexamen, l'écart est un <strong>produit immédiat</strong>.</Note>}

      case 3: return (
        <div className="space-y-5">
          <Card title="Répartition des capitaux propres de la filiale" icon={<GitBranch size={18} className="text-indigo-600" />} accent="indigo">

            <SplitBar left={c.full ? c.X - c.qpNci : c.qpGroupe} right={c.qpNci} lLabel={`Part groupe (${d.pctMere} %) → éliminée vs titres`} rLabel={`Minoritaires (${fmt(100 - num(d.pctMere))} %)`} />

          <div className="space-y-3">
            <Journal n="1" title="Élimination des titres & goodwill (à l'acquisition)"
              lines={[
                { compte: "Capital social (filiale)", debit: num(d.fCap) },
                { compte: "Réserves (à l'acquisition)", debit: num(d.fResAcq) },
                { compte: "Écart d'évaluation", debit: c.ecartNet },
                ...(c.gw >= 0 ? [{ compte: c.compense ? "Réserves consolidées (goodwill compensé)" : "Goodwill", debit: c.gw }] : []),
                { compte: "Titres de participation", credit: c.prix },
                { compte: "Intérêts minoritaires", credit: c.nciAcq },
                ...(c.gw < 0 ? [{ compte: "Produit (badwill)", credit: -c.gw }] : []),
              ]}
              note="On solde les capitaux propres de la filiale à la date d'acquisition contre les titres de la mère ; l'écart résiduel est le goodwill, et la quote-part des autres actionnaires devient l'intérêt minoritaire." />
            <Journal n="2" title="Partage des réserves accumulées depuis l'acquisition"
              lines={[{ compte: "Réserves (filiale, post-acquisition)", debit: c.deltaR }, { compte: "Réserves consolidées (part groupe)", credit: c.pct * c.deltaR }, { compte: "Intérêts minoritaires (quote-part)", credit: (1 - c.pct) * c.deltaR }]}
              note={`Écriture de partage des capitaux propres : les ${fmt(c.deltaR)} de résultats générés depuis la prise de contrôle reviennent au groupe pour ${fmt(c.pct * c.deltaR)} et aux minoritaires pour ${fmt((1 - c.pct) * c.deltaR)}.`} />
          </div>
          {c.compense && <Note type="info">Option Swiss GAAP « compensation » active : le goodwill ({fmt(c.gw)}) est porté en diminution des capitaux propres au lieu de l'actif.</Note>}
        </div>
      );
      case 4: return (
        <div className="space-y-4">
          <Note type="info">Après le cumul, les opérations internes sont comptées en double. On les neutralise pour ne garder que les flux avec l'extérieur.</Note>
          <Journal n="3" title="Élimination des créances / dettes réciproques"
            lines={[{ compte: "Dettes (fournisseur intragroupe)", debit: c.ic }, { compte: "Créances (client intragroupe)", credit: c.ic }]}
            note={`Les ${fmt(c.ic)} de créances et de dettes réciproques disparaissent du bilan consolidé.`} />
          <Journal n="4" title="Élimination de la marge interne sur stock (vente descendante)"
            lines={[{ compte: "Réserves consolidées / Résultat", debit: c.marge }, { compte: "Stocks", credit: c.marge }]}
            note={`La mère a vendu à la filiale avec une marge de ${fmt(c.marge)} ; tant que le stock n'est pas revendu hors groupe, ce profit n'est pas réalisé. Vente ascendante : la marge serait partagée avec les minoritaires.`} />
          <Card title="Autres éliminations classiques" icon={<ListChecks size={18} className="text-slate-600" />}>
            <ul className="text-sm text-slate-600 space-y-1.5">
              {[["Produits / charges réciproques", "Ventes/achats, intérêts, loyers, redevances internes."], ["Dividendes intragroupe", "Le produit chez la mère est éliminé (déjà dans les réserves de la filiale)."], ["Plus-value interne sur immobilisation", "Annulée, avec correction des amortissements ultérieurs."], ["Provisions internes", "Dépréciation de créance ou de titres intragroupe neutralisée."]].map((x, i) => (
                <li key={i} className="flex gap-2"><CheckCircle2 size={16} className="text-slate-300 shrink-0 mt-0.5" /><span><strong className="text-slate-700">{x[0]}</strong> — {x[1]}</span></li>

            </ul>

      case 5: return (
        <div className="space-y-5">

            <Card title="Traitement IFRS — goodwill non amorti" icon={<FileText size={18} className="text-indigo-600" />} accent="indigo">
              <p className="text-sm text-slate-600">En IFRS, le goodwill ({fmt(c.gw)}) <strong>reste à l'actif sans amortissement</strong>, avec un <strong>test de dépréciation annuel</strong> (IAS 36) au niveau de l'unité génératrice de trésorerie.</p>
              <Journal n="5" title="Dépréciation du goodwill (uniquement si test négatif)"
                lines={[{ compte: "Perte de valeur (résultat)", debit: 0 }, { compte: "Goodwill", credit: 0 }]}
                note="Comptabilisée seulement si la valeur recouvrable devient inférieure à la valeur comptable. Irréversible pour le goodwill." />
            </Card>
          ) : (
            <Card title="Option Swiss GAAP RPC 30" icon={<FileText size={18} className="text-red-600" />} accent="red">
              <div className="flex items-center gap-2 mb-3 flex-wrap">
                <span className="text-xs text-slate-500">Méthode :</span>
                <div className="flex rounded-lg border border-slate-300 overflow-hidden text-xs">
                  <button onClick={() => setOpt({ ...opt, gwTreat: "capitalise" })} className={`px-3 py-1 ${opt.gwTreat === "capitalise" ? "bg-red-600 text-white" : "bg-white text-slate-600"}`}>Activé + amorti</button>
                  <button onClick={() => setOpt({ ...opt, gwTreat: "compense" })} className={`px-3 py-1 ${opt.gwTreat === "compense" ? "bg-red-600 text-white" : "bg-white text-slate-600"}`}>Compensé avec fonds propres</button>
                </div>
              </div>
              {opt.gwTreat === "capitalise" ? (
                <>
                  <div className="flex items-center gap-2 mb-3 flex-wrap">
                    <span className="text-sm text-slate-600">Durée</span>
                    <div className="flex rounded-lg border border-slate-300 overflow-hidden text-xs">
                      {[3, 5, 10, 20].map((y) => (<button key={y} onClick={() => setOpt({ ...opt, amort: y })} className={`px-2.5 py-1 ${opt.amort === y ? "bg-indigo-600 text-white" : "bg-white text-slate-600"}`}>{y} ans</button>))}
                    </div>
                  </div>
                  <Journal n="5" title={`Amortissement annuel du goodwill (${opt.amort} ans)`}
                    lines={[{ compte: "Charge d'amortissement (résultat)", debit: c.amortAnnual }, { compte: "Goodwill (amort. cumulés)", credit: c.amortAnnual }]}
                    note={`Goodwill ${fmt(c.gw)} ÷ ${opt.amort} ans = ${fmt(c.amortAnnual)} par an.`} />
