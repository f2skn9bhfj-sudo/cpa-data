: "Effet logé dans les **réserves latentes** ; pas d'actif/passif d'impôt différé affiché"}, {"crit": "Actualisation des impôts différés", "ifrs": "**Interdite** (IAS 12)", "rpc": "Non requise (pratique : non actualisés)", "co": "Sans objet (pas d'impôts différés)"}, {"crit": "Dérivés — évaluation", "ifrs": "**IFRS 9** : juste valeur (FVPL) ; couverture **détaillée**", "rpc": "**RPC 27** : **valeur de marché** ; variations au résultat ; **bilan** (pas hors-bilan)", "co": "Souvent **hors-bilan** (engagement conditionnel) ; au bilan seulement si valeur réalisée/perte probable"}, {"crit": "Comptabilité de couverture", "ifrs": "**IFRS 9** : désignation, tests d'efficacité, *hedge ratio*, rééquilibrage", "rpc": "Couverture **simplifiée** : désignation + efficacité raisonnable, appariement des effets", "co": "Pas de cadre formel ; prudence et annexe"}, {"crit": "Dépréciation des actifs financiers", "ifrs": "**Pertes de crédit attendues (ECL)** — modèle prospectif (IFRS 9)", "rpc": "Dépréciation sur **indices** / pertes avérées ; **pas** de modèle ECL généralisé", "co": "Correction de valeur si valeur **durablement** inférieure (prudence)"}, {"crit": "Objectif d'ensemble", "ifrs": "**Image fidèle**, juste valeur étendue, modèles prospectifs", "rpc": "**Image fidèle** sans réserves cachées ; réalité économique, version pragmatique", "co": "**Prudence** / protection des créanciers ; réserves latentes tolérées"}]}, {"type": "keypoints", "title": "Les 3 contrastes qui rapportent des points", "accent": "amber", "items": ["**Provision de lissage** : *permise au CO* (réserve latente) **vs** *interdite en RPC et IFRS* (image fidèle).", "**Impôts différés** : *généralement absents au CO* (impôt courant + réserves latentes) **vs** *bilanciels en RPC (RPC 11)* **vs** *bilanciels complets en IFRS (IAS 12)*.", "**Dérivés** : *souvent hors-bilan au CO* **vs** *à la valeur de marché au bilan en RPC (RPC 27)* **vs** *juste valeur + ECL + couverture détaillée en IFRS (IFRS 9)*."]}, {"type": "callout", "tone": "info", "title": "Comment se repérer en une phrase", "text": "**CO = je provisionne large, j'ignore l'impôt différé, je laisse les dérivés hors-bilan (prudence + réserves latentes)** · **RPC = je provisionne juste, je montre l'impôt différé, je mets les dérivés au bilan à la valeur de marché (image fidèle)** · **IFRS = je vais le plus loin : IAS 37 / IAS 12 complet / IFRS 9 avec ECL et couverture détaillée.** Placez toujours la RPC **entre** les deux."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["Provisions de réserve / lissage TOLÉRÉES (réserves latentes)", "Impôts différés : EN PRINCIPE AUCUN (impôt courant)", "Dérivés souvent HORS-BILAN (engagement conditionnel)", "Logique : prudence, protection des créanciers"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["Provision JUSTE : 3 critères, pas de lissage", "Impôts différés BILANCIELS (RPC 11), version allégée", "Dérivés au BILAN à la valeur de marché (RPC 27)", "Logique : image fidèle, réalité économique"]}, {"title": "IFRS", "color": "indigo", "items": ["IAS 37 : provisions, lissage interdit", "IAS 12 : impôts différés bilanciels complets", "IFRS 9 : juste valeur + ECL + couverture détaillée", "Logique : image fidèle, modèles prospectifs"]}], "caption": "Placez toujours la RPC ENTRE les deux : plus complète que le CO (qui ignore l'impôt différé et tolère les réserves latentes), plus pragmatique que les IFRS (ECL, couverture détaillée)."}]}, {"title": "⚠️ Pièges & zones de jugement", "blocks": [{"type": "callout", "tone": "warn", "title": "Constituer une provision « de réserve » en RPC", "text": "**Erreur n°1.** Une provision pour **risques généraux**, un **gros entretien futur** non engagé, ou une provision **surévaluée** pour lisser le résultat sont des **réserves latentes** — **interdites** en RPC. On ne provisionne **que** ce qui satisfait les **trois critères** (obligation passée + sortie probable + estimation fiable)."}, {"type": "callout", "tone": "warn", "title": "Confondre provision et passif éventuel", "text": "Si la sortie n'est que **possible** (pas probable) ou si le montant est **non estimable de façon fiable**, ce n'est **pas** une provision mais un **passif éventuel** → **annexe**, pas de passif au bilan. Inversement, un litige dont la perte est **probable et chiffrable** **doit** être provisionné : ne pas se cacher derrière l'« incertitude » pour ne rien comptabiliser."}, {"type": "callout", "tone": "warn", "title": "Oublier l'obligation « de fait »", "text": "Une garantie commerciale **habituelle**, un plan de restructuration **annoncé**, une pratique passée constante créent une **obligation de fait** qui **oblige à provisionner** même sans contrat. Ne provisionner que les obligations **juridiques** sous-évalue le passif."}, {"type": "callout", "tone": "warn", "title": "Reconnaître un impôt différé ACTIF sans recouvrement probable", "text": "Un **impôt différé actif** (différence déductible, **report de pertes**) ne se comptabilise **que si** des **bénéfices imposables futurs** rendent sa récupération **probable**. Inscrire un actif d'impôt différé sur des pertes alors que la société est durablement déficitaire **surévalue** l'actif. À l'inverse, le **passif** d'impôt différé est, lui, **toujours** obligatoire."}, {"type": "callout", "tone": "warn", "title": "Croire que le CO comptabilise des impôts différés", "text": "Dans les **comptes statutaires CO**, il n'y a **en principe pas** d'impôts différés : la charge est l'**impôt courant** dû, et l'écart comptabilité/fisc loge dans les **réserves latentes**. C'est **la RPC** (et les IFRS) qui font apparaître des **impôts différés actifs/passifs**. Confondre les deux est une erreur fréquente sur les cas multi-référentiels."}, {"type": "keypoints", "title": "Autres pièges classiques", "accent": "rose", "items": ["**Compenser** une provision (passif) avec un **remboursement attendu** d'un tiers : le remboursement va à l'**actif** (si quasi certain), **séparément**, sans réduire la provision.", "**Laisser un dérivé hors-bilan** en RPC : non — il s'évalue à la **valeur de marché** et figure au **bilan** (actif/passif).", "**Plaquer le modèle ECL d'IFRS 9** sur une question RPC : la RPC 27 **n'a pas** de modèle de pertes de crédit attendues généralisé.", "**Différence permanente vs temporelle** : seule la différence **temporelle** (qui s'inverse) génère un impôt différé ; une différence **permanente** (charge jamais déductible, produit jamais imposable) **n'en génère pas**.", "**Taux d'impôt** : utiliser le taux **attendu à l'inversion** (en vigueur/voté), pas un taux arbitraire.", "**Reprise de provision** : oublier de **reprendre** (en produit) une provision devenue **sans objet** → surévalue le passif et sous-évalue le résultat."]}]}, {"title": "🧠 Mnémo & réflexes d'examen", "blocks": [{"type": "mnemo", "code": "POIRE", "phrase": "« **P**robable, **O**bligation passée, **I**mpôt différé bilanciel, **R**éalité (valeur de marché des dérivés), **E**stimation fiable » — pour ne rien oublier, croquez la POIRE.", "items": [{"l": "P", "t": "**Probable** — la sortie de ressources doit être **probable** pour provisionner (sinon passif éventuel)."}, {"l": "O", "t": "**Obligation passée** — juridique **ou de fait**, issue d'un **événement déjà survenu** (pas de provision pour charges futures d'exploitation)."}, {"l": "I", "t": "**Impôt différé bilanciel** — sur les **différences temporelles** (bilan RPC vs bilan fiscal) ; **passif obligatoire**, **actif si recouvrable**."}, {"l": "R", "t": "**Réalité** — les **dérivés** au **bilan** à leur **valeur de marché** (pas de hors-bilan caché)."}, {"l": "E", "t": "**Estimation fiable** — sans estimation fiable, pas de provision ; et **jamais** de provision de **lissage** (réserve latente proscrite)."}]}, {"type": "keypoints", "title": "Structurer une réponse sur ce thème (ce qui paie)", "accent": "emerald", "items": ["**Provisions** : dérouler les **3 critères cumulatifs**, trancher provision vs **passif éventuel**, rappeler l'**interdiction du lissage** (≠ CO).", "**Évaluation** : meilleure estimation (espérance pour les populations), **actualisation** si effet temps significatif, **reprise** si l'obligation disparaît.", "**Impôts différés** : annoncer la **méthode bilancielle**, identifier la **différence temporelle** et son **sens**, **chiffrer** (différence × taux), classer **actif/passif** (actif **si recouvrable**).", "**Dérivés** : **valeur de marché** au **bilan**, variations au résultat, **couverture simplifiée** si désignée ; éviter le hors-bilan.", "**Conclure par le triple contraste** CO (réserves latentes, pas d'impôt différé, dérivés hors-bilan) vs RPC (image fidèle) vs IFRS (IAS 37 / IAS 12 / IFRS 9 avec ECL)."]}, {"type": "callout", "tone": "key", "title": "Citations & repères sûrs", "text": "**Swiss GAAP RPC** : **RPC 23** (provisions), **RPC 11** (impôts sur le résultat / impôts différés), **RPC 27** (instruments financiers dérivés). \n**CO** : art. **960e** (dettes/provisions, provisions de prudence tolérées), **959c** (annexe : engagements conditionnels), principe de l'**impôt courant** (pas d'impôt différé statutaire). \n**IFRS** : **IAS 37** (provisions & passifs éventuels), **IAS 12** (impôts sur le résultat / impôts différés), **IFRS 9** (instruments financiers, ECL, couverture). \n*(Si un numéro de RPC est incertain, citez la notion sans le numéro.)*"}, {"type": "callout", "tone": "tip", "title": "Le réflexe « temporelle ou permanente ? »", "text": "Avant de calculer un impôt différé, demandez-vous si la différence **s'inversera** un jour. **Temporelle** (amortissements, provision non encore déductible, réévaluation) → **impôt différé**. **Permanente** (amende non déductible, produit définitivement non imposable) → **pas** d'impôt différé. Cette question évite la moitié des erreurs de calcul."}]}, {"title": "🧪 Quiz express", "blocks": [{"type": "quiz", "title": "Teste ta maîtrise (8 questions)", "questions": [{"q": "Quelles conditions doivent être réunies pour comptabiliser une provision selon la RPC ?", "options": ["Une obligation juridique uniquement, un montant exact connu et une échéance fixée", "Une obligation (juridique ou de fait) née d'un événement passé, une sortie de ressources probable et une estimation fiable", "Une simple intention de la direction de constituer une réserve de prudence", "Une obligation possible et un montant non estimable, mentionnés en annexe"], "answer": 1, "explain": "Les trois critères cumulatifs de RPC 23 : obligation actuelle (juridique OU de fait) résultant d'un événement passé, sortie de ressources probable, estimation fiable. L'obligation de fait compte autant que l'obligation juridique."}, {"q": "Un litige dont la perte n'est que possible (pas probable) et difficilement chiffrable doit être :", "options": ["Comptabilisé en provision pour le montant maximal possible", "Comptabilisé en provision pour un montant prudent forfaitaire", "Traité comme un passif éventuel, mentionné en annexe sans écriture au bilan", "Ignoré totalement, y compris en annexe"], "answer": 2, "explain": "Sortie seulement possible (pas probable) et/ou estimation non fiable → passif éventuel : information en annexe, pas de passif comptabilisé. On ne provisionne que si les trois critères sont réunis."}, {"q": "Une « provision pour risques généraux » destinée à lisser le résultat est, en RPC :", "options": ["Autorisée, comme au Code des obligations, par prudence", "Interdite : elle constitue une réserve latente arbitraire contraire à l'image fidèle", "Obligatoire chaque année à hauteur de 10 % du bénéfice", "Autorisée seulement si elle est mentionnée en annexe"], "answer": 1, "explain": "La RPC vise l'image fidèle : pas de provision de réserve ou de lissage. Ces réserves latentes arbitraires, tolérées par le CO (art. 960e), sont proscrites en RPC car elles ne correspondent à aucune obligation réelle."}, {"q": "Sur quelle base la RPC (RPC 11) calcule-t-elle les impôts différés ?", "options": ["Sur les écarts de charges et produits dans le compte de résultat uniquement", "Sur l'impôt effectivement payé durant l'exercice", "Sur les différences temporelles entre la valeur comptable RPC et la valeur fiscale des postes du bilan (approche bilancielle)", "Sur la différence entre le bénéfice comptable et le chiffre d'affaires"], "answer": 2, "explain": "Approche bilancielle : on compare valeur comptable RPC et valeur fiscale poste par poste. Les différences temporelles (qui s'inverseront) génèrent des impôts différés = différence × taux attendu."}, {"q": "Un actif a une valeur comptable RPC de 350 et une valeur fiscale de 300 ; le taux d'impôt est de 25 %. Quel impôt différé en résulte ?", "options": ["Un impôt différé actif de 12,5", "Un impôt différé passif de 12,5", "Un impôt différé passif de 50", "Aucun, car la différence est permanente"], "answer": 1, "explain": "Différence temporelle imposable de 50 (VC 350 > valeur fiscale 300) → impôt différé PASSIF = 50 × 25 % = 12,5. Valeur comptable supérieure à la valeur fiscale d'un actif = différence imposable = passif obligatoire."}, {"q": "Quand un impôt différé ACTIF (ex. sur report de pertes fiscales) peut-il être comptabilisé en RPC ?", "options": ["Toujours et obligatoirement, comme l'impôt différé passif", "Seulement si la récupération est probable, c'est-à-dire si des bénéfices imposables futurs suffisants sont attendus", "Jamais : la RPC interdit les impôts différés actifs", "Uniquement s'il est compensé par un impôt différé passif du même montant"], "answer": 1, "explain": "L'impôt différé actif n'est reconnu que si son recouvrement est probable (bénéfices futurs ou différences imposables suffisantes). Le passif, lui, est toujours obligatoire. C'est une asymétrie de prudence."}, {"q": "Dans les comptes statutaires établis selon le Code des obligations, les impôts différés sont :", "options": ["Calculés exactement comme en RPC", "En principe non comptabilisés : la charge est l'impôt courant dû, l'écart logeant dans les réserves latentes", "Toujours comptabilisés en impôts différés actifs", "Calculés sur les différences permanentes"], "answer": 1, "explain": "Le CO ne prévoit en principe pas d'impôts différés : la charge d'impôt = impôt courant, et la divergence comptabilité/fisc se traduit par des réserves latentes. C'est la RPC (et les IFRS) qui isolent l'effet fiscal futur."}, {"q": "Comment un instrument financier dérivé (ex. forward de change) est-il évalué en RPC 27, et comment IFRS 9 va-t-il plus loin ?", "options": ["À la valeur de marché au bilan en RPC ; IFRS 9 ajoute notamment la dépréciation par pertes de crédit attendues (ECL) et une couverture détaillée", "Au coût historique en RPC ; IFRS 9 l'évalue aussi au coût", "Hors-bilan en RPC ; IFRS 9 le laisse également hors-bilan", "À la valeur nominale en RPC ; IFRS 9 ne traite pas les dérivés"], "answer": 0, "explain": "RPC 27 évalue les dérivés à la valeur de marché au bilan (variations au résultat, couverture simplifiée). IFRS 9 est plus complet : classification, comptabilité de couverture détaillée et modèle des pertes de crédit attendues (ECL) pour les actifs financiers."}]}]}]}, {"code": "RPC ⇄ IFRS ⇄ CO", "title": "Synthèse : Swiss GAAP RPC vs IFRS vs CO", "icon": "🧭", "color": "violet", "tagline": "La leçon **capstone** : un **axe unique** relie les trois référentiels suisses/internationaux. **CO** = prudence & réserves latentes · **RPC** = image fidèle pragmatique · **IFRS** = image fidèle + juste valeur étendue. Maîtrise ce continuum et tu réponds à 80 % des questions transversales.", "sections": [{"title": "🎯 L'essentiel — un seul axe à mémoriser", "blocks": [{"type": "intro", "text": "Cette leçon **relie tout** : elle ne réexplique pas chaque norme, elle pose **la grille de lecture** qui permet de positionner n'importe quelle question sur un **axe d'exigence croissant** — **CO → Swiss GAAP RPC → IFRS**.\n\nLe ressort unique : **comment chaque référentiel arbitre entre PRUDENCE et IMAGE FIDÈLE**.\n- Le **Code des obligations (CO)** privilégie la **prudence** et la **protection des créanciers** : il évalue au **coût maximum** et **tolère les réserves latentes** (on a le droit de se sous-évaluer).\n- Les **Swiss GAAP RPC** visent l'**image fidèle** (*true & fair view*) de façon **pragmatique** : pas de réserves latentes arbitraires, coût + **valeurs actuelles ciblées**, annexe proportionnée — d'où le surnom **« IFRS light suisse »**.\n- Les **IFRS** poussent l'**image fidèle** au service de la **décision utile à l'investisseur** : **juste valeur étendue**, annexes massives, normalisation internationale.\n\nUne fois cet axe en tête, chaque thème (consolidation, goodwill, réévaluation, impôts différés, leasing, instruments financiers, présentation) se lit comme une **variation du même curseur**."}, {"type": "keypoints", "title": "Les 6 réflexes capstone à ancrer", "accent": "violet", "items": ["**Un seul axe** : *CO (prudence) → RPC (image fidèle pragmatique) → IFRS (image fidèle + juste valeur étendue)*. Place toujours la RPC **au milieu**.", "**Réserves latentes** = le clivage fondateur : **permises au CO**, **interdites en RPC et IFRS**.", "**Juste valeur** : *plafond du coût au CO* → *valeur actuelle ciblée en RPC* (titres cotés, immeubles de placement) → *juste valeur généralisée en IFRS*.", "**Goodwill** : *pas de standard au CO* → *amorti ≤ 5 ans (max 20) OU imputé aux fonds propres en RPC* → *non amorti + test annuel (IAS 36) en IFRS*.", "**Consolidation** : *CO 963/963a (obligation + dispenses de taille)* → *RPC 30 (globale, proportionnelle, MEE)* → *IFRS 10/3/11/IAS 28 (pas de proportionnelle)*.", "**Annexe / transparence** : *minimale au CO* → *allégée en RPC* → *très étendue en IFRS*. Le volume d'information **croît** avec l'axe."]}, {"type": "callout", "tone": "key", "title": "La phrase qui ouvre n'importe quelle réponse comparative", "text": "**« CO = je protège le créancier (prudence, réserves latentes) · RPC = je montre la valeur réelle sans matelas (image fidèle, valeur actuelle ciblée) · IFRS = je vais le plus loin dans la juste valeur (décision utile à l'investisseur). »**\n\nCette phrase, placée en ouverture, **structure** l'examinateur et te fait gagner des points avant même d'entrer dans le détail technique."}, {"type": "callout", "tone": "info", "title": "Pourquoi trois référentiels coexistent en Suisse", "text": "Le **CO** est la **loi** (titre 32, art. 957 ss) : un **socle obligatoire** pour toutes les entités, qui sert aussi de **base fiscale** (le bénéfice imposable part du résultat statutaire CO). Les **Swiss GAAP RPC** et les **IFRS** sont des **référentiels reconnus** (CO art. 962/962a) qui **s'ajoutent** pour donner une image fidèle aux cotées, grandes coopératives et fondations en contrôle ordinaire. Une cotée suisse publie donc souvent **deux jeux de comptes** : statutaires (CO, base de l'impôt et du dividende) **et** consolidés (RPC ou IFRS, image fidèle pour le marché)."}, {"type": "diagram", "kind": "spectrum", "title": "L'axe unique : prudence → juste valeur", "bands": [{"from": 0, "to": 33, "color": "amber", "short": "CO", "label": "**CO** — prudence, **coût max**, réserves latentes permises (créancier + fisc)"}, {"from": 33, "to": 66, "color": "emerald", "short": "RPC", "label": "**Swiss GAAP RPC** — image fidèle pragmatique, **valeur actuelle ciblée** (« IFRS light »)"}, {"from": 66, "to": 100, "color": "indigo", "short": "IFRS", "label": "**IFRS** — image fidèle + **juste valeur étendue**, décision investisseur"}], "caption": "Un seul curseur d'exigence et de juste valeur croissantes. Place toujours la RPC AU MILIEU : c'est la grille de lecture capstone."}]}, {"title": "🧠 Philosophie — prudence vs image fidèle vs juste valeur", "blocks": [{"type": "intro", "text": "Tout part de la **finalité** que chaque référentiel assigne aux comptes. Le **destinataire** privilégié n'est pas le même, et c'est lui qui détermine la logique d'évaluation.\n\n- **CO → le créancier (et le fisc).** La comptabilité doit garantir qu'on **ne distribue pas** un patrimoine qu'on n'a pas. D'où la **prudence asymétrique** : on anticipe les pertes, on **diffère** les profits, on **plafonne au coût**, on **tolère les réserves latentes** comme coussin de sécurité.\n- **RPC → le lecteur des comptes (associés, banques, donateurs).** La comptabilité doit refléter la **réalité économique** sans excès de complexité : **image fidèle**, donc **fin des réserves latentes arbitraires**, mais une **prudence raisonnable** subsiste (stocks plafonnés au coût, dépréciations).\n- **IFRS → l'investisseur sur les marchés de capitaux.** La comptabilité doit fournir une **information utile à la décision** d'achat/vente : on privilégie la **pertinence** (juste valeur, actualisation) parfois au détriment de la simplicité et de la prudence."}, {"type": "compare", "title": "Philosophie & finalité : CO vs RPC vs IFRS", "rows": [{"crit": "Principe directeur", "ifrs": "**Image fidèle** poussée + **décision utile** à l'investisseur", "rpc": "**Image fidèle** (*true & fair view*) pragmatique", "co": "**Prudence** & protection des créanciers"}, {"crit": "Destinataire privilégié", "ifrs": "**Investisseur** sur les marchés de capitaux", "rpc": "Lecteur des comptes (associés, banques, donateurs)", "co": "**Créancier** (et le **fisc** : base imposable)"}, {"crit": "Arbitrage pertinence ↔ fiabilité", "ifrs": "Penche vers la **pertinence** (juste valeur, actualisation)", "rpc": "**Équilibre** fiabilité (coût) + pertinence (valeur actuelle ciblée)", "co": "Penche vers la **fiabilité/prudence** (coût, réserves latentes)"}, {"crit": "Réserves latentes (hidden reserves)", "ifrs": "**Interdites**", "rpc": "**Interdites** (sous-évaluation volontaire proscrite)", "co": "**Permises** (art. 960a al. 4) : coussin de prudence"}, {"crit": "Prudence", "ifrs": "**Neutralité** ; prudence non asymétrique", "rpc": "**Prudence raisonnable**, sans matelas caché", "co": "**Prudence asymétrique** (pertes anticipées, profits différés)"}, {"crit": "Nature du texte", "ifrs": "Normes privées **IASB** (référentiel reconnu)", "rpc": "Normes d'une **commission privée** suisse (référentiel reconnu)", "co": "**Loi fédérale** (titre 32 du CO)"}, {"crit": "Lien avec la fiscalité", "ifrs": "**Aucun** (déconnecté du bilan fiscal)", "rpc": "**Aucun direct** (l'impôt part du CO statutaire)", "co": "**Base de l'impôt** (principe de déterminance / *Massgeblichkeit*)"}]}, {"type": "callout", "tone": "tip", "title": "Le mot-clé qui révèle le référentiel", "text": "Dans un énoncé, repère le **vocabulaire** : « **réserves latentes / prudence / créanciers / coût maximum** » ⇒ **CO**. « **image fidèle / valeur actuelle / annexe proportionnée / IFRS light** » ⇒ **RPC**. « **juste valeur / OCI / actualisation / décision utile / UGT / IAS-IFRS** » ⇒ **IFRS**. Le lexique trahit presque toujours le référentiel attendu."}, {"type": "callout", "tone": "warn", "title": "Piège de comparaison : « image fidèle » n'est pas synonyme de « juste valeur »", "text": "RPC **et** IFRS visent l'**image fidèle**, mais cela **ne veut pas dire** « tout à la juste valeur ». La RPC atteint l'image fidèle **principalement par le coût** (en supprimant simplement les réserves latentes), avec la valeur actuelle **seulement** sur quelques postes. Confondre « image fidèle » et « juste valeur généralisée » est l'erreur conceptuelle n°1 sur ce continuum."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["Prudence & protection du **créancier**", "Destinataire : créancier + **fisc** (déterminance)", "Réserves latentes **permises** (art. 960a al. 4)", "Prudence **asymétrique** : pertes anticipées, profits différés"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["**Image fidèle** pragmatique (*true & fair*)", "Destinataire : lecteur suisse (associés, banques)", "Réserves latentes **interdites**", "Prudence **raisonnable**, sans matelas caché"]}, {"title": "IFRS", "color": "indigo", "items": ["Image fidèle + **décision utile** à l'investisseur", "Destinataire : **investisseur** sur les marchés", "Réserves latentes **interdites**", "**Neutralité** ; penche vers la pertinence (juste valeur)"]}], "caption": "Tout part du DESTINATAIRE privilégié : c'est lui qui détermine la logique d'évaluation. Attention : « image fidèle » (RPC + IFRS) ≠ « juste valeur généralisée » (IFRS seule)."}]}, {"title": "🏛️ Qui applique quoi — la cartographie", "blocks": [{"type": "intro", "text": "Avant le **comment**, le **qui**. Le raisonnement se fait **en deux temps** : (1) *un référentiel reconnu est-il exigé ?* (critère de **statut/demande**, CO art. 962) ; (2) *si oui, lequel ?* (choix **RPC ou IFRS**, US GAAP dans certains segments SIX). Une entité non concernée reste au **CO** seul."}, {"type": "table", "title": "Cartographie : quel référentiel pour quel type d'entité", "headers": ["Profil d'entité", "Référentiel applicable", "Pourquoi"], "rows": [["**PME** non cotée, sous les seuils, sans demande qualifiée", "**CO** seul (socle légal)", "Aucun référentiel reconnu exigé (art. 962) ; RPC possible **volontairement**."], ["**Société moyenne** / groupe non coté qui veut crédibilité", "**Swiss GAAP RPC** (souvent)", "Image fidèle sans la lourdeur IFRS ; ancrage suisse, annexe proportionnée."], ["**Grande coopérative** (≥ 2 000 membres), **fondation** en contrôle ordinaire", "**Référentiel reconnu** : RPC **ou** IFRS", "Obligation légale (CO art. 962) ; en pratique souvent **RPC**."], ["**Société cotée au SIX**", "**RPC ou IFRS** (au choix ; US GAAP admis dans certains segments)", "Règlement de cotation SIX impose un **référentiel reconnu**."], ["**Multinationale** / grand groupe international", "**IFRS** (le plus souvent)", "Comparabilité mondiale, accès aux marchés de capitaux étrangers."]]}, {"type": "keypoints", "title": "Les seuils à ne JAMAIS confondre", "accent": "amber", "items": ["**RPC 1 : 10 / 20 / 50** (bilan mio / CA mio / EPT) = bascule **RPC fondamentales (core) → RPC complet**.", "**CO art. 727 : 20 / 40 / 250** = déclenchement de la **révision ordinaire**.", "**CO art. 963a : 20 / 40 / 250** = seuil de **dispense de consolidation** (mêmes chiffres que la révision ordinaire).", "Mémo : **« RPC = moitié du CO »** sur le bilan (10 vs 20) et le CA (20 vs 40) ; partout **2 critères sur 2 ans**.", "**Statut puis seuils** : le **statut/demande** (art. 962) déclenche l'obligation de référentiel reconnu ; les **seuils RPC 1** décident ensuite core vs complet."]}, {"type": "callout", "tone": "info", "title": "Une cotée a souvent DEUX jeux de comptes", "text": "Le référentiel reconnu (RPC/IFRS) **ne remplace pas** le CO : il **s'ajoute**. Une société cotée tient ses **comptes statutaires au CO** (base du **dividende** distribuable et de l'**impôt**) **et** publie des **comptes consolidés** en RPC ou IFRS (image fidèle pour le marché). Ne jamais dire « la cotée abandonne le CO » : elle l'applique **en parallèle**."}, {"type": "diagram", "kind": "flow", "title": "Quel référentiel pour quel profil d'entreprise ?", "steps": [{"label": "PME non cotée", "sub": "sous les seuils, sans demande qualifiée → **CO seul** (socle légal)"}, {"label": "Société moyenne / groupe non coté", "sub": "veut de la crédibilité → **Swiss GAAP RPC** (souvent)"}, {"label": "Cotée SIX / grande coopérative / fondation", "sub": "référentiel reconnu exigé → **RPC ou IFRS** (au choix)"}, {"label": "Multinationale / grand groupe", "sub": "comparabilité mondiale, marchés étrangers → **IFRS**"}], "accent": "violet", "caption": "Raisonnement en 2 temps : (1) un référentiel reconnu est-il EXIGÉ (statut/demande, CO art. 962) ? (2) si oui, lequel ? Le CO subsiste toujours en parallèle (base impôt + dividende)."}]}, {"title": "🔗 Consolidation — CO 963 vs RPC 30 vs IFRS 10/3/11/IAS 28", "blocks": [{"type": "intro", "text": "La **consolidation** est le terrain où les trois référentiels divergent le plus visiblement. Le **déclencheur est partout le contrôle**, mais les **dispenses**, les **méthodes** disponibles et le **traitement du goodwill** diffèrent.\n\n- **CO (art. 963 / 963a)** : pose l'**obligation** d'établir des comptes de groupe dès qu'une entité en **contrôle** d'autres, mais **dispense** les petits groupes (seuils 20/40/250) et les **sous-groupes** (sous-consolidation déjà incluse dans une consolidation supérieure reconnue). Le CO **n'impose pas** de méthode technique détaillée : il **renvoie** de fait à un référentiel reconnu pour le « comment ».\n- **RPC 30** : régit le **périmètre** et offre **trois méthodes** — **intégration globale** (contrôle), **intégration proportionnelle** (contrôle conjoint, **option**) et **mise en équivalence (MEE)** (influence notable / sociétés associées). Le **goodwill** est **amorti** (≤ 5 ans, max **20** si justifié) **OU** imputé aux **fonds propres**.\n- **IFRS** : un **arsenal de normes** — **IFRS 10** (contrôle → intégration globale), **IFRS 3** (méthode de l'acquisition, goodwill), **IFRS 11** (partenariats : *joint operation* vs *joint venture*) et **IAS 28** (MEE pour entreprises associées **et** coentreprises). Particularité forte : **pas d'intégration proportionnelle** (supprimée avec IAS 31) et **goodwill non amorti**."}, {"type": "compare", "title": "Consolidation : CO vs RPC 30 vs IFRS (10/3/11/IAS 28)", "rows": [{"crit": "Déclencheur de la conso", "ifrs": "**Contrôle** (IFRS 10.7 : pouvoir + exposition aux rendements + lien)", "rpc": "**Contrôle** (intégration globale) ; influence notable (MEE)", "co": "**Contrôle** d'une ou plusieurs entités (art. 963)"}, {"crit": "Dispenses / exemptions", "ifrs": "Sous-groupe exempté si conso supérieure conforme IFRS (IFRS 10)", "rpc": "Petits groupes ; sous-groupes ; exemptions de taille (RPC 30)", "co": "**Petits groupes 20/40/250** (art. 963a) ; **sous-groupes**"}, {"crit": "Filiale contrôlée", "ifrs": "**Intégration globale** (IFRS 10) + **NCI**", "rpc": "**Intégration globale** + intérêts minoritaires", "co": "Renvoi au référentiel ; intégration globale en pratique"}, {"crit": "Contrôle conjoint (coentreprise)", "ifrs": "**MEE obligatoire** (IAS 28) ; **proportionnelle INTERDITE**", "rpc": "**Intégration proportionnelle AUTORISÉE** **ou** MEE", "co": "Selon référentiel reconnu retenu"}, {"crit": "Influence notable (associée)", "ifrs": "**Mise en équivalence** (IAS 28)", "rpc": "**Mise en équivalence**", "co": "Selon référentiel reconnu retenu"}, {"crit": "Goodwill", "ifrs": "**Non amorti** + test de dépréciation annuel (IAS 36)", "rpc": "**Amorti ≤ 5 ans (max 20)** **OU** imputé aux **fonds propres**", "co": "Pas de standard détaillé ; généralement **amorti** (prudence)"}, {"crit": "Méthode d'acquisition", "ifrs": "**IFRS 3** : *purchase method*, JV des actifs/passifs identifiables", "rpc": "Méthode de l'acquisition (différence imputée goodwill)", "co": "Non détaillé"}]}, {"type": "keypoints", "title": "Les 3 divergences de conso qui rapportent", "accent": "violet", "items": ["**Intégration proportionnelle** : *autorisée en RPC 30* pour les coentreprises **vs** *INTERDITE en IFRS* (IFRS 11 → MEE imposée depuis la fin d'IAS 31). **LE** piège conso classique.", "**Goodwill** : *amorti ou imputé aux fonds propres en RPC* **vs** *non amorti + test annuel en IFRS* **vs** *pas de standard au CO*.", "**Dispense de taille** : le **CO 963a (20/40/250)** dispense les petits groupes — une exemption **propre au droit suisse** qui n'a pas d'équivalent chiffré direct en IFRS."]}, {"type": "callout", "tone": "warn", "title": "Piège : appliquer l'intégration proportionnelle « partout »", "text": "L'**intégration proportionnelle** survit en **RPC 30** (option pour les coentreprises) mais a **disparu en IFRS** (suppression d'IAS 31 ; IFRS 11 impose la **MEE** pour les *joint ventures*). Ne **jamais** proposer l'intégration proportionnelle dans une réponse **IFRS**. À l'inverse, en RPC, c'est une **option valable** — précise alors qu'elle est **alternative** à la MEE."}, {"type": "callout", "tone": "info", "title": "Le CO consolide, mais délègue le « comment »", "text": "Le **CO art. 963** **impose** des comptes de groupe au contrôle, et **963a** en **dispense** les petits groupes (20/40/250) — mais le CO **ne décrit pas** la mécanique technique (méthodes, goodwill). En pratique, un groupe qui consolide le fait **selon un référentiel reconnu** (RPC ou IFRS). Le CO fixe donc **l'obligation et les dispenses** ; RPC/IFRS fixent **la technique**."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["**Art. 963** : oblig. de comptes de groupe au contrôle", "**Art. 963a** : dispense petits groupes **20/40/250** + sous-groupes", "Renvoie le **« comment »** à un référentiel reconnu", "Goodwill : pas de standard détaillé"]}, {"title": "Swiss GAAP RPC 30", "color": "emerald", "items": ["**Globale** (contrôle) + intérêts minoritaires", "**Proportionnelle AUTORISÉE** (contrôle conjoint) ou MEE", "**MEE** (influence notable / associées)", "Goodwill : **amorti ≤ 5 ans (max 20)** OU imputé aux FP"]}, {"title": "IFRS 10/3/11/IAS 28", "color": "indigo", "items": ["**Globale** (IFRS 10) + NCI ; méthode d'acquisition (IFRS 3)", "**Proportionnelle INTERDITE** → MEE imposée (IFRS 11)", "**MEE** associées ET coentreprises (IAS 28)", "Goodwill : **non amorti** + test annuel (IAS 36)"]}], "caption": "Déclencheur partout = le CONTRÔLE. LE piège conso : l'intégration proportionnelle survit en RPC mais a DISPARU en IFRS (fin d'IAS 31). Ne jamais la proposer en réponse IFRS."}]}, {"title": "💠 Goodwill — le tableau dédié", "blocks": [{"type": "intro", "text": "Le **goodwill** (écart d'acquisition) cristallise à lui seul l'écart de philosophie. Il naît lors d'un regroupement : c'est l'**excédent du prix payé** sur la **juste valeur des actifs nets identifiables** acquis. Sa **vie ultérieure** diffère radicalement selon le référentiel — c'est l'un des points les plus testés."}, {"type": "table", "title": "Goodwill : traitement comparé CO vs RPC vs IFRS", "headers": ["Aspect", "CO", "Swiss GAAP RPC", "IFRS"], "rows": [["**Reconnaissance**", "Pas de standard de conso détaillé", "Goodwill = prix − JV actifs nets identifiables", "**IFRS 3** : goodwill à l'acquisition (JV des actifs/passifs)"], ["**Suivi ultérieur**", "Généralement **amorti** (prudence)", "**Amorti ≤ 5 ans** (max **20** si justifié)", "**Non amorti** : test de dépréciation **annuel**"], ["**Option capitaux propres**", "—", "**OUI** : imputation **directe aux fonds propres** possible", "**Non** : toujours porté à l'actif"], ["**Dépréciation**", "Si valeur durablement inférieure", "Test si **indice** (et obligatoire si imputé FP : *shadow accounting* en annexe)", "**IAS 36** : test annuel obligatoire ; **reprise INTERDITE** sur goodwill"], ["**Effet sur le résultat**", "Charge d'amortissement", "Charge d'amortissement (sauf option FP : pas d'amortissement)", "**Pas de charge récurrente** ; à-coups en cas de dépréciation"]]}, {"type": "callout", "tone": "key", "title": "La triple option à retenir", "text": "**Goodwill = la divergence-vitrine.**\n- **CO** : pas de cadre détaillé, en pratique **amortissement** par prudence.\n- **RPC** : **deux options** — soit **amortissement** systématique (≤ 5 ans, max 20), soit **imputation immédiate aux fonds propres** (le goodwill disparaît de l'actif, mais l'effet **comme s'il avait été activé et amorti/déprécié** doit être présenté en **annexe**).\n- **IFRS** : **non amorti**, **test annuel** (IAS 36), **pas de reprise** de la dépréciation du goodwill.\n\nRetiens le contraste : **IFRS ne charge pas le résultat tant qu'il n'y a pas de dépréciation** ; **RPC charge** régulièrement (ou a sorti le goodwill des FP)."}, {"type": "callout", "tone": "warn", "title": "Piège : « le goodwill s'amortit en IFRS »", "text": "**Faux.** Depuis 2004, le goodwill **ne s'amortit pas** en IFRS : il subit un **test de dépréciation annuel** (IAS 36). À l'inverse, en **RPC**, il **s'amortit** (≤ 5 ans, max 20) **ou** est **imputé aux fonds propres**. Et la **dépréciation du goodwill ne se reprend jamais** (ni IFRS, ni RPC). Mélanger amortissement IFRS / reprise est une faute fréquente."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["Pas de standard de conso détaillé", "En pratique **amorti** (prudence)", "Pas d'option fonds propres", "Dépréciation si valeur durablement inférieure"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["Goodwill = prix − JV actifs nets identifiables", "**Amorti ≤ 5 ans** (max **20** si justifié)…", "…**OU** imputé **directement aux fonds propres**", "Si imputé FP : effet « comme si » activé/amorti en **annexe**"]}, {"title": "IFRS", "color": "indigo", "items": ["**IFRS 3** : goodwill à la JV des actifs/passifs", "**Non amorti** : pas de charge récurrente", "Toujours porté à l'**actif** (pas d'option FP)", "**IAS 36** : test annuel ; **reprise INTERDITE**"]}], "caption": "La divergence-vitrine. Contraste clé : IFRS ne charge PAS le résultat sans dépréciation, alors que RPC charge régulièrement (option amortissement) — ou a sorti le goodwill des FP. Piège classique : « le goodwill s'amortit en IFRS » = FAUX (depuis 2004)."}]}, {"title": "📈 Réévaluation & juste valeur", "blocks": [{"type": "intro", "text": "La place faite à la **juste valeur** (valeur de marché) est le **meilleur thermomètre** du continuum. On passe du **plafond du coût** (CO) à une **valeur actuelle ciblée** (RPC) puis à une **juste valeur généralisée** (IFRS), avec une question constante : **où va la variation de valeur — résultat ou capitaux propres (OCI) ?**"}, {"type": "compare", "title": "Réévaluation & juste valeur : CO vs RPC vs IFRS", "rows": [{"crit": "Règle générale des actifs", "ifrs": "Coût **ou** réévaluation / juste valeur selon la norme", "rpc": "**Coût** + **valeurs actuelles ciblées**", "co": "**Coût d'acquisition au maximum** (art. 960a)"}, {"crit": "Immobilisations corporelles", "ifrs": "**Coût amorti OU modèle de réévaluation** (IAS 16, OCI)", "rpc": "**Coût amorti** (pas de réévaluation systématique)", "co": "Coût amorti ; réévaluation très restreinte (art. 670)"}, {"crit": "Immeubles de placement", "ifrs": "**Juste valeur** ou coût, au choix (IAS 40)", "rpc": "**Valeur de marché** possible (ou coût amorti)", "co": "**Coût amorti** ; pas de modèle juste valeur"}, {"crit": "Titres cotés / placements", "ifrs": "**Juste valeur** (IFRS 9 : FVPL ou FVOCI)", "rpc": "**Valeur actuelle = cours de bourse** (variations au résultat)", "co": "Cours **autorisé** pour titres cotés (art. 960b), sinon coût"}, {"crit": "Réévaluation AU-DESSUS du coût", "ifrs": "**Possible** (IAS 16 → OCI ; IAS 40 / IFRS 9 → résultat)", "rpc": "**Limitée** : titres cotés / immeubles de placement (résultat)", "co": "**Exceptionnelle** (art. 670 : combler un découvert)"}, {"crit": "Gains non réalisés", "ifrs": "**Reconnus** (résultat ou OCI selon la norme)", "rpc": "**Possibles** sur titres cotés / immeubles de placement", "co": "**Interdits** (plafond du coût ; réserves latentes)"}]}, {"type": "keypoints", "title": "Le curseur de la juste valeur", "accent": "violet", "items": ["**CO** : la valeur au bilan ne **dépasse jamais le coût** ⇒ pas de profit latent, des **réserves latentes** fréquentes.", "**RPC** : valeur actuelle **ciblée** (titres cotés au cours, immeubles de placement à la valeur de marché) ⇒ un profit latent **peut** apparaître, mais **pas** de modèle de réévaluation généralisé.", "**IFRS** : juste valeur **largement étendue** ⇒ profits latents fréquents, avec un partage **résultat vs OCI** selon la norme (IAS 16 → OCI ; IAS 40 / IFRS 9 FVPL → résultat).", "**Question-réflexe** : à chaque réévaluation, demande-toi **où passe la variation** (résultat ou OCI) — c'est ce que l'examen attend."]}, {"type": "callout", "tone": "warn", "title": "Piège : le stock ne se réévalue jamais au-dessus du coût", "text": "Même en RPC et en IFRS, un **stock** reste **plafonné au plus faible du coût et de la VNR** (IAS 2 / *lower of cost or market*). La logique « valeur actuelle » ne vaut **que** pour les **titres cotés** et **immeubles de placement** (RPC), ou selon la norme applicable (IFRS). Ne jamais inscrire un stock au-dessus de son coût, quel que soit le référentiel."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["Règle : **coût d'acquisition au maximum** (art. 960a)", "Titres cotés : cours **autorisé** (art. 960b), sinon coût", "Immeuble de placement : **coût amorti** (pas de JV)", "Gains non réalisés **interdits** → réserves latentes"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["Coût + **valeurs actuelles ciblées**", "Titres cotés : **cours de bourse** (variations au résultat)", "Immeuble de placement : **valeur de marché** possible", "Pas de modèle de réévaluation généralisé"]}, {"title": "IFRS", "color": "indigo", "items": ["Coût **ou** réévaluation / juste valeur selon la norme", "Titres : **juste valeur** (IFRS 9 — FVPL ou **FVOCI**)", "Immeuble de placement : **JV** ou coût (IAS 40)", "Corporelles : modèle de réévaluation **IAS 16 → OCI**"]}], "caption": "La juste valeur est le THERMOMÈTRE du continuum : du plafond du coût (CO) → valeur actuelle ciblée (RPC) → juste valeur étendue (IFRS). Question-réflexe : où passe la variation — RÉSULTAT ou OCI ? Et : un STOCK n'est jamais au-dessus du coût (plafond VNR), nulle part."}]}, {"title": "🧾 Impôts différés, leasing & instruments financiers", "blocks": [{"type": "intro", "text": "Trois thèmes techniques où le **degré de sophistication** monte nettement le long de l'axe. Ils illustrent que, plus on va vers IFRS, plus on **active au bilan** ce que le CO laisse hors bilan (ou ignore)."}, {"type": "heading", "text": "Impôts différés"}, {"type": "compare", "title": "Impôts différés : CO vs RPC vs IFRS", "rows": [{"crit": "Principe", "ifrs": "**IAS 12** : approche **bilancielle** complète (*temporary differences*)", "rpc": "Approche **bilancielle** (différences temporaires)", "co": "Notion **rare** ; pas d'impôt différé systématique"}, {"crit": "Différences couvertes", "ifrs": "Toutes différences temporaires actif/passif + reports déficitaires", "rpc": "Différences temporaires significatives", "co": "Provision pour impôts sur le résultat exigible surtout"}, {"crit": "Actif d'impôt différé", "ifrs": "Reconnu si **probable** récupération (bénéfices futurs)", "rpc": "Reconnu avec prudence (probabilité de récupération)", "co": "Quasi inexistant en comptes statutaires"}]}, {"type": "heading", "text": "Leasing (contrats de location)"}, {"type": "compare", "title": "Leasing : CO vs RPC vs IFRS", "rows": [{"crit": "Leasing financier", "ifrs": "**Au bilan** (droit d'utilisation + dette) — **IFRS 16**", "rpc": "**Leasing financier au bilan** (actif + dette de leasing)", "co": "Souvent **hors bilan** ; mention en annexe (engagements)"}, {"crit": "Leasing d'exploitation", "ifrs": "**Aussi au bilan** (IFRS 16 supprime la distinction côté preneur)", "rpc": "Charges de loyer ; distinction financier / exploitation maintenue", "co": "Charges de loyer (hors bilan)"}, {"crit": "Logique", "ifrs": "**Substance** : presque **tout au bilan** côté preneur", "rpc": "Substance pour le **financier** ; classement financier vs exploitation", "co": "**Forme juridique** : propriété → bilan ; sinon charges"}]}, {"type": "heading", "text": "Instruments financiers"}, {"type": "compare", "title": "Instruments financiers : CO vs RPC vs IFRS", "rows": [{"crit": "Cadre", "ifrs": "**IFRS 9** : classement (coût amorti / FVOCI / FVPL), dérivés, couverture", "rpc": "Recommandation dédiée aux instruments financiers (dont dérivés)", "co": "Pas de cadre dédié ; **prudence** (coût, provisions)"}, {"crit": "Dépréciation", "ifrs": "**Pertes de crédit attendues (ECL)** — modèle prospectif", "rpc": "Dépréciation sur pertes **avérées/probables**", "co": "Correction de valeur prudente (pertes probables)"}, {"crit": "Dérivés", "ifrs": "**Juste valeur** au bilan (résultat ou OCI si couverture)", "rpc": "Comptabilisés (valeur actuelle) ; comptabilité de couverture possible", "co": "Souvent hors bilan ; mention si engagements significatifs"}]}, {"type": "callout", "tone": "tip", "title": "Le fil conducteur de ces trois thèmes", "text": "Même tendance partout : **plus on monte vers IFRS, plus on inscrit au bilan**. Le **leasing** passe de **hors bilan** (CO) à **financier au bilan** (RPC 13) puis à **presque tout au bilan** (IFRS 16). Les **impôts différés** passent de **rares** (CO) à **bilanciels** (RPC, IAS 12). Les **instruments financiers** passent d'une **prudence** sans cadre (CO) à un modèle **ECL prospectif** (IFRS 9). Retiens la **trajectoire**, pas seulement les cases."}, {"type": "callout", "tone": "warn", "title": "Piège : IFRS 16 efface la distinction côté preneur, pas RPC", "text": "**IFRS 16** supprime, **côté preneur**, la distinction entre leasing financier et d'exploitation : **presque tout** entre au bilan (droit d'utilisation + dette de loyer). La **RPC**, elle, **conserve** la distinction et n'inscrit au bilan que le **leasing financier**. Le **CO** laisse, lui, le leasing largement **hors bilan**. Ne pas transposer IFRS 16 à une réponse RPC ou CO."}, {"type": "diagram", "kind": "columns", "cols": [{"title": "CO", "color": "amber", "items": ["Impôts différés : notion **rare**, non systématique", "Leasing : largement **hors bilan** (mention annexe)", "Instruments financiers : **prudence** (coût, provisions)", "Logique : **forme juridique**"]}, {"title": "Swiss GAAP RPC", "color": "emerald", "items": ["Impôts différés : approche **bilancielle**", "Leasing : **financier au bilan** (RPC 13)", "Instruments financiers : recommandation dédiée", "Dépréciation sur pertes **avérées/probables**"]}, {"title": "IFRS", "color": "indigo", "items": ["Impôts différés : **IAS 12** bilanciel complet", "Leasing : **tout au bilan** côté preneur (**IFRS 16**)", "Instruments financiers : **IFRS 9** (coût amorti / FVOCI / FVPL)", "Dépréciation : pertes de crédit **attendues (ECL)**"]}], "caption": "Fil conducteur : plus on monte vers IFRS, plus on INSCRIT AU BILAN ce que le CO laisse hors bilan. Trajectoire du leasing : hors bilan (CO) → financier au bilan (RPC) → presque tout au bilan (IFRS 16). Retiens la trajectoire, pas seulement les cases."}]}, {"title": "📋 Présentation & annexe — le volume croît", "blocks": [{"type": "intro", "text": "Dernier marqueur du continuum : le **volume d'information** publié. Il **croît** mécaniquement le long de l'axe, car plus le destinataire est éloigné de l'entité (du créancier proche à l'investisseur mondial), plus il faut **expliciter** les choix comptables."}, {"type": "compare", "title": "Présentation & annexe : CO vs RPC vs IFRS", "rows": [{"crit": "Étendue de l'annexe", "ifrs": "**Très étendue** (notes massives, jugements, hypothèses)", "rpc": "**Allégée / proportionnée**", "co": "**Minimale** (art. 959c)"}, {"crit": "Tableau de financement", "ifrs": "**Obligatoire** (IAS 7)", "rpc": "**Obligatoire** au complet (recommandation dédiée)", "co": "Exigé pour les **grandes entreprises** ; sinon non"}, {"crit": "Variation des capitaux propres", "ifrs": "**Obligatoire** (état dédié)", "rpc": "**Obligatoire** en comptes complets", "co": "Non requis en tant qu'état séparé"}, {"crit": "Information sectorielle", "ifrs": "**IFRS 8** (segments) pour les cotées", "rpc": "Requise pour les **cotées** (module sociétés cotées)", "co": "Non requise"}, {"crit": "Comparatifs & permanence", "ifrs": "Exigés, très détaillés", "rpc": "Exigés (permanence des méthodes)", "co": "Comparatif exercice précédent (socle)"}]}, {"type": "keypoints", "title": "À retenir sur la transparence", "accent": "violet", "items": ["**Plus on va vers IFRS, plus l'annexe gonfle** : minimal (CO) → proportionné (RPC) → massif (IFRS).", "**Tableau de financement** : obligatoire en RPC complet et IFRS ; au CO, seulement pour les **grandes entreprises**.", "**Information sectorielle** : réservée aux **cotées** (RPC module cotées ; IFRS 8).", "Le **CO** vise l'**essentiel pour le créancier** ; **IFRS** vise la **transparence totale pour l'investisseur**."]}]}, {"title": "🔢 Exemple — choisir le bon référentiel (corrigé masqué)", "blocks": [{"type": "intro", "text": "Le réflexe d'examen : pour une entreprise donnée, **(1)** dire **si** un référentiel reconnu est exigé, **(2)** dire **lequel**, **(3)** en tirer les **conséquences** concrètes (goodwill, leasing, réévaluation, conso). Traite l'énoncé avant d'ouvrir le corrigé."}, {"type": "example", "title": "Le groupe « Léman Industries » — quel référentiel, quelles conséquences ?", "statement": "Le groupe **Léman Industries** vous consulte (CHF mio). Tête de groupe : **Léman Holding SA**, **cotée au SIX Swiss Exchange**. Bilan consolidé **180**, CA **300**, **620 EPT**. Le groupe :\n\n- **contrôle** 4 filiales (détention 100 % et 80 %) ;\n- détient une **coentreprise** 50/50 avec un partenaire (contrôle conjoint) ;\n- détient **30 %** d'une société **associée** (influence notable) ;\n- a réalisé une **acquisition** générant un **goodwill de 60** ;\n- loue son siège via un **contrat de location** de longue durée (leasing) ;\n- possède un **immeuble de placement** (valeur de marché 45, coût 30) et un **portefeuille de titres cotés** (cours 22, coût 18).\n\n**Travail demandé :** (1) un référentiel reconnu est-il exigé, et lequel est envisageable ? (2) Sous **IFRS**, comment traiter la coentreprise, le goodwill, le leasing du siège, l'immeuble de placement et les titres cotés ? (3) Quelles seraient les **différences clés** si le groupe avait choisi **Swiss GAAP RPC** ? (4) Et que dirait le **CO** sur ces mêmes éléments ?", "solution": "**(1) Référentiel exigé**\nLéman Holding est **cotée au SIX** ⇒ le règlement de cotation **exige un référentiel reconnu** : **RPC ou IFRS** (US GAAP admis dans certains segments). Vu la taille (180/300/620, très au-dessus de tous les seuils) et le profil industriel/coté, **IFRS** est un choix naturel (comparabilité internationale) ; **RPC** resterait possible (ancrage suisse, moindre lourdeur). Le groupe **contrôle** des filiales ⇒ **comptes consolidés obligatoires** (CO art. 963 ; aucune dispense car coté et bien au-dessus de 20/40/250). Rappel : les **comptes statutaires CO** subsistent (base impôt + dividende).\n\n---\n\n**(2) Sous IFRS**\n- **Coentreprise 50/50 (contrôle conjoint)** : c'est une *joint venture* ⇒ **mise en équivalence obligatoire (IAS 28)**. **Intégration proportionnelle INTERDITE** (IFRS 11, depuis la fin d'IAS 31).\n- **Associée 30 %** : influence notable ⇒ **mise en équivalence (IAS 28)**.\n- **Goodwill 60** : **non amorti** ; **test de dépréciation annuel (IAS 36)** ; **pas de reprise** possible.\n- **Leasing du siège** : **IFRS 16** ⇒ **droit d'utilisation à l'actif + dette de loyer au passif** (presque tout au bilan côté preneur).\n- **Immeuble de placement (45 vs 30)** : **IAS 40** ⇒ option **juste valeur** : porté à **45**, **gain de +15** (en résultat sous le modèle juste valeur).\n- **Titres cotés (22 vs 18)** : **IFRS 9** ⇒ **juste valeur** : portés à **22**, gain latent **+4** en **résultat (FVPL)** ou en **OCI (FVOCI)** selon le classement.\n\n---\n\n**(3) Différences clés si Swiss GAAP RPC**\n- **Coentreprise** : la RPC **autorise l'intégration proportionnelle** (reprise ligne à ligne de 50 %) **ou** la MEE — au choix, contrairement à IFRS.\n- **Goodwill 60** : **amorti** ≤ 5 ans (max 20) **OU** **imputé aux fonds propres** (avec présentation en annexe de l'effet « comme si » activé/amorti). Le résultat RPC **supporte une charge** (option amortissement), là où IFRS n'en supporte aucune sans dépréciation.\n- **Leasing du siège** : **au bilan seulement si financier** (RPC 13) ; un leasing d'exploitation reste en **charges de loyer**.\n- **Immeuble de placement** : **valeur de marché possible** (45) — proche d'IFRS.\n- **Titres cotés** : **valeur actuelle = cours** (22), gain **+4 au résultat**.\n\n---\n\n**(4) Au CO (comptes statutaires)**\n- **Goodwill** : pas de standard détaillé, **amortissement** par prudence.\n- **Leasing** : largement **hors bilan**, simple mention en annexe (engagements).\n- **Immeuble de placement** : **coût amorti** (≈ 30) — **pas** de réévaluation à 45 (plafond du coût) ⇒ **réserve latente ≈ 15**.\n- **Titres cotés** : le cours est **autorisé** (art. 960b) mais beaucoup restent au **coût** (18) par prudence ⇒ **réserve latente ≈ 4** si maintien au coût.\n- **Conso** : **obligatoire** (art. 963) car contrôle ; le **comment** suit le référentiel reconnu.\n\n---\n\n**Synthèse :** un même groupe affiche un patrimoine **croissant** du CO (réserves latentes ≈ 19 sur ces deux postes) vers la RPC/IFRS (valeur actuelle reconnue). La divergence la plus visible reste la **coentreprise** (MEE imposée en IFRS, proportionnelle possible en RPC) et le **goodwill** (non amorti IFRS vs amorti/FP RPC vs amorti CO)."}, {"type": "callout", "tone": "key", "title": "Lecture de l'exemple", "text": "Trois enseignements transversaux : **(1)** le **statut coté** déclenche le référentiel reconnu (RPC/IFRS), pas la taille seule ; **(2)** la **coentreprise** et le **goodwill** sont les deux postes où RPC et IFRS divergent le plus ; **(3)** le **CO** fait réapparaître des **réserves latentes** (immeuble de placement, titres) que RPC et IFRS suppriment en reconnaissant la valeur actuelle/juste valeur."}]}, {"title": "🗂️ Tableau de synthèse globale", "blocks": [{"type": "intro", "text": "La **vue d'ensemble** : tous les thèmes sur une seule grille. À mémoriser ligne par ligne — c'est le **cœur** de toute question comparative à l'examen."}, {"type": "table", "title": "Synthèse globale : CO vs Swiss GAAP RPC vs IFRS", "headers": ["Thème", "CO", "Swiss GAAP RPC", "IFRS"], "rows": [["**Philosophie**", "Prudence, créanciers, réserves latentes", "Image fidèle pragmatique", "Image fidèle + juste valeur, décision investisseur"], ["**Réserves latentes**", "**Permises** (art. 960a)", "**Interdites**", "**Interdites**"], ["**Qui l'applique**", "Toutes les entités (socle)", "Moyennes, groupes, cotées suisses", "Multinationales, grands groupes cotés"], ["**Consolidation**", "Art. 963 (oblig.) ; 963a dispense 20/40/250", "RPC 30 : globale / proportionnelle / MEE", "IFRS 10/3/11 + IAS 28 ; **pas de proportionnelle**"], ["**Goodwill**", "— (amorti par prudence)", "Amorti ≤ 5 ans (max 20) **ou** imputé FP", "Non amorti + test annuel (IAS 36)"], ["**Réévaluation / JV**", "Coût max ; réserves latentes", "Valeurs actuelles **ciblées**", "Modèle de réévaluation (IAS 16/40, IFRS 9)"], ["**Impôts différés**", "Rares", "Bilanciel", "IAS 12 complet"], ["**Leasing**", "— (hors bilan)", "RPC 13 : **financier au bilan**", "IFRS 16 : **tout au bilan** (preneur)"], ["**Instruments financiers**", "Prudence (coût, provisions)", "Recommandation dédiée", "IFRS 9 (ECL, FVPL/FVOCI)"], ["**Présentation / annexe**", "**Minimale** (art. 959c)", "**Proportionnée**", "**Très étendue**"]]}, {"type": "callout", "tone": "info", "title": "Comment utiliser ce tableau le jour J", "text": "Quelle que soit la question (« quel référentiel… ? », « comparez le traitement de X »), **balaie cette grille mentalement** : repère la **ligne** du thème, lis les **trois colonnes** de gauche (CO) à droite (IFRS), et énonce le **contraste** en plaçant la **RPC au milieu**. Cette discipline garantit une réponse **complète et ordonnée**."}]}, {"title": "⚠️ Pièges de comparaison à éviter", "blocks": [{"type": "callout", "tone": "warn", "title": "Confondre « image fidèle » et « juste valeur généralisée »", "text": "RPC **et** IFRS visent l'**image fidèle**, mais seule l'**IFRS** généralise la **juste valeur**. La RPC atteint l'image fidèle **surtout par le coût** (en supprimant les réserves latentes), avec la valeur actuelle **uniquement** sur quelques postes. Ne pas prêter à la RPC une « juste valeur partout »."}, {"type": "callout", "tone": "warn", "title": "Mélanger les jeux de seuils", "text": "**RPC 1 = 10 itres cotés réévaluables.", "**Où va la variation de juste valeur ?** résultat (IAS 40 / IFRS 9 FVPL ; RPC titres et immeubles de placement) **ou** OCI (IAS 16 réévaluation ; IFRS 9 FVOCI). Toujours le préciser.", "**Impôts différés** : présents en **RPC** (bilanciel) et **IFRS** (IAS 12), **quasi absents** des comptes **CO** statutaires."]}]}, {"title": "🧠 Mnémo & réflexes capstone", "blocks": [{"type": "mnemo", "code": "PRIME", "phrase": "« **PRIME** range les trois référentiels » : **P**rudence (CO) à gauche, **I**mage fidèle (RPC) au **M**ilieu, **E**xtension de la juste valeur (IFRS) à droite — le **R**éférentiel se lit sur un seul axe.", "items": [{"l": "P", "t": "**Prudence** — le **CO** : coût max, **réserves latentes**, protection du créancier (et base fiscale)."}, {"l": "R", "t": "**Référentiel sur un axe** — toujours **CO → RPC → IFRS**, exigence et juste valeur croissantes."}, {"l": "I", "t": "**Image fidèle** — partagée par **RPC et IFRS** ; le clivage avec le CO, c'est la **fin des réserves latentes**."}, {"l": "M", "t": "**Milieu = RPC** — « IFRS light suisse » : coût + **valeur actuelle ciblée**, goodwill **amorti ou imputé FP**, **proportionnelle autorisée**."}, {"l": "E", "t": "**Extension juste valeur = IFRS** — réévaluation (IAS 16/40, IFRS 9), goodwill **non amorti**, **tout au bilan** (IFRS 16), annexe massive."}]}, {"type": "keypoints", "title": "Structurer une réponse comparative (ce qui paie)", "accent": "emerald", "items": ["**Ouvrir par l'axe** : « CO (prudence) → RPC (image fidèle) → IFRS (juste valeur étendue) », RPC **au milieu**.", "**Annoncer le clivage central** : réserves latentes **permises au CO**, **interdites en RPC/IFRS**.", "**Décliner le thème** : pour le sujet posé (goodwill, leasing, conso…), donner les **trois colonnes** avec les **§/articles sûrs**.", "**Citer les divergences-vitrine** : **intégration proportionnelle** (RPC oui / IFRS non) et **goodwill** (RPC amorti-ou-FP / IFRS non amorti).", "**Préciser le sort des variations** de juste valeur : **résultat ou OCI**.", "**Conclure sur le destinataire** : CO = créancier/fisc, RPC = lecteur suisse, IFRS = investisseur mondial."]}, {"type": "callout", "tone": "key", "title": "Citations & repères sûrs", "text": "**CO** : art. **957 ss** (socle), **959c** (annexe minimale), **960a** (coût max, réserves latentes), **960b** (titres cotés au cours), **670** (réévaluation immeubles/participations), **727** (révision ordinaire 20/40/250), **962 / 962a** (référentiel reconnu), **963 / 963a** (conso + dispense 20/40/250). \n**Swiss GAAP RPC** : **RPC 1** (seuils 10/20/50), **RPC 30** (consolidation : globale / proportionnelle / MEE ; goodwill amorti ≤ 5 ans, max 20, ou imputé FP), **RPC 31** (sociétés cotées), **RPC 13** (leasing financier au bilan), + recommandations stocks / corporelles / immeubles / titres / instruments financiers / prévoyance (**RPC 16**). \n**IFRS** : **IFRS 10** (contrôle), **IFRS 3** (regroupements, goodwill), **IFRS 11** (partenariats), **IAS 28** (MEE), **IAS 36** (dépréciation, goodwill), **IAS 16 / IAS 40 / IFRS 9** (réévaluation, juste valeur), **IAS 12** (impôts différés), **IFRS 16** (leasing), **IAS 2** (stocks), **IAS 7** (flux de trésorerie). \n*(Si un numéro de RPC est incertain, citer la notion sans le numéro.)*"}, {"type": "callout", "tone": "tip", "title": "Le réflexe « curseur »", "text": "Devant toute question comparative, imagine un **curseur** glissant de la **prudence** (CO) vers la **juste valeur** (IFRS). Demande-toi : *où se place ce thème pour chaque référentiel ?* La réponse tombe presque toujours en **plaçant la RPC entre les deux** — c'est l'automatisme capstone à entraîner."}, {"type": "diagram", "kind": "pyramid", "title": "Du moins au plus exigeant (juste valeur croissante)", "levels": [{"t": "IFRS — juste valeur étendue", "d": "Sommet : réévaluation (IAS 16/40, IFRS 9), goodwill non amorti, tout au bilan (IFRS 16), annexe massive — pour l'investisseur mondial"}, {"t": "Swiss GAAP RPC — image fidèle pragmatique", "d": "Milieu : coût + valeur actuelle ciblée, goodwill amorti ou imputé FP, proportionnelle autorisée — « IFRS light suisse »"}, {"t": "CO — prudence & coût", "d": "Socle : coût max, réserves latentes permises, leasing hors bilan, annexe minimale — pour le créancier (et base fiscale)"}], "accent": "violet", "caption": "Mnémo PRIME : Prudence (CO) → Image fidèle au Milieu (RPC) → Extension de la juste valeur (IFRS). Un seul axe d'exigence, du socle légal au sommet international."}]}, {"title": "🧪 Quiz transversal", "blocks": [{"type": "quiz", "title": "Quel référentiel… ? (10 questions transversales)", "questions": [{"q": "Quel référentiel AUTORISE les réserves latentes (sous-évaluation volontaire) ?", "options": ["Les IFRS", "Les Swiss GAAP RPC", "Le Code des obligations (CO)", "Aucun des trois"], "answer": 2, "explain": "Seul le CO (art. 960a al. 4) permet les réserves latentes, par prudence et protection des créanciers. RPC et IFRS les interdisent au nom de l'image fidèle. C'est le clivage fondateur du continuum."}, {"q": "Pour une coentreprise (contrôle conjoint), quel référentiel INTERDIT l'intégration proportionnelle et impose la mise en équivalence ?", "options": ["Le CO", "Les Swiss GAAP RPC (RPC 30)", "Les IFRS (IFRS 11 / IAS 28)", "Les trois l'interdisent"], "answer": 2, "explain": "Les IFRS interdisent l'intégration proportionnelle des coentreprises (IFRS 11 → MEE obligatoire IAS 28, depuis la suppression d'IAS 31). La RPC 30, elle, l'AUTORISE encore comme option. Piège souvent inversé par les candidats."}, {"q": "Quel référentiel laisse le goodwill NON amorti, avec un test de dépréciation annuel ?", "options": ["Les IFRS (IAS 36)", "Les Swiss GAAP RPC", "Le CO", "RPC et CO"], "answer": 0, "explain": "En IFRS, le goodwill n'est pas amorti : test de dépréciation annuel (IAS 36), sans reprise possible. En RPC, il est amorti (≤ 5 ans, max 20) OU imputé aux fonds propres ; au CO, généralement amorti par prudence."}, {"q": "Quel référentiel offre l'option d'imputer le goodwill directement aux fonds propres ?", "options": ["Les IFRS", "Les Swiss GAAP RPC (RPC 30)", "Le CO uniquement", "Aucun"], "answer": 1, "explain": "La RPC 30 permet, au choix, d'amortir le goodwill (≤ 5 ans, max 20) ou de l'imputer immédiatement aux fonds propres (avec présentation en annexe de l'effet « comme si » activé/amorti). Les IFRS l'interdisent (goodwill toujours à l'actif)."}, {"q": "Côté preneur, quel référentiel met PRESQUE TOUS les contrats de location au bilan (droit d'utilisation + dette) ?", "options": ["Le CO", "Les Swiss GAAP RPC (RPC 13)", "Les IFRS (IFRS 16)", "Aucun : le leasing reste toujours hors bilan"], "answer": 2, "explain": "IFRS 16 supprime, côté preneur, la distinction financier / exploitation : presque tout entre au bilan. La RPC (RPC 13) n'inscrit que le leasing financier ; le CO laisse le leasing largement hors bilan (mention en annexe)."}, {"q": "Quel référentiel applique un modèle de pertes de crédit ATTENDUES (ECL) sur les instruments financiers ?", "options": ["Le CO", "Les Swiss GAAP RPC", "Les IFRS (IFRS 9)", "Les trois"], "answer": 2, "explain": "IFRS 9 impose le modèle prospectif des pertes de crédit attendues (ECL). La RPC et le CO retiennent une dépréciation sur pertes avérées/probables, sans modèle ECL prospectif."}, {"q": "Une PME suisse non cotée, sous les seuils, sans demande qualifiée d'associés : quel référentiel est-elle TENUE d'appliquer ?", "options": ["Les Swiss GAAP RPC obligatoirement", "Les IFRS obligatoirement", "Le CO seul (référentiel reconnu non exigé)", "RPC et IFRS en parallèle"], "answer": 2, "explain": "Aucun référentiel reconnu n'est exigé (CO art. 962) : la PME tient sa comptabilité au CO. Elle peut adopter les RPC volontairement, mais n'y est pas tenue. Le statut/demande déclenche l'obligation, pas la simple activité."}, {"q": "Quels seuils déclenchent le passage des RPC fondamentales (core) au RPC complet (RPC 1) ?", "options": ["Bilan 20 mio / CA 40 mio / 250 EP <script type="text/babel" data-type="module" data-presets="react">
import React from "react";
import { createRoot } from "react-dom/client";
import { useState } from "react";
import { Building2, Calculator, Layers, ListChecks, Info, AlertTriangle, CheckCircle2, ArrowRight, ArrowLeft, Network, Banknote, RotateCcw, GitBranch, Coins, Scale, FileText, TrendingDown, BookOpen, Search, ChevronDown, Compass, Workflow, Receipt, Table, Boxes, Globe, Repeat, Package, GraduationCap, Plus, Trash2 } from "lucide-react";

/* ===================== helpers ===================== */
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "–";
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
};

/* ===================== atoms ===================== */
function Field({ label, hint, value, onChange, suffix = "CHF" }) {
  return (
    <label className="flex items-center justify-between gap-3 py-1.5 border-b border-slate-100 last:border-0">
      <span className="text-sm text-slate-600 leading-tight">
        {label}{hint && <span className="block text-xs text-slate-400">{hint}</span>}
      </span>
      <span className="flex items-center gap-1 shrink-0">
        <input type="number" value={value} onChange={(e) => onChange(e.target.value)}
          className="w-28 rounded-md border border-slate-300 px-2 py-1 text-right text-sm tabular-nums focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" />
        <span className="text-xs text-slate-400 w-10">{suffix}</span>
      </span>
    </label>
  );
}
function Card({ title, icon, children, accent = "slate" }) {
  const ring = { indigo: "border-indigo-100", red: "border-red-100", emerald: "border-emerald-100", slate: "border-slate-200", amber: "border-amber-100" }[accent];
  return (
    <div className={`rounded-xl border ${ring} bg-white shadow-sm p-5`}>
      {title && <div className="flex items-center gap-2 mb-3 text-slate-800 font-semibold">{icon}{title}</div>}
      {children}
    </div>
  );
}
function Note({ children, type = "info" }) {
  const map = {
    info: ["bg-slate-50 border-slate-200 text-slate-500", <Info size={16} className="shrink-0 mt-0.5 text-slate-400" />],
    warn: ["bg-amber-50 border-amber-200 text-amber-800", <AlertTriangle size={16} className="shrink-0 mt-0.5 text-amber-500" />],
    tip: ["bg-indigo-50 border-indigo-200 text-indigo-700", <ArrowRight size={16} className="shrink-0 mt-0.5" />],
  }[type];
  return <div className={`flex items-start gap-2 text-xs border rounded-lg p-3 ${map[0]} mt-3`}>{map[1]}<span>{children}</span></div>;
}

/* ===================== diagrams ===================== */
function GroupSchema({ pct, kind }) {
  const minor = 100 - pct;
  const sub = { exclusif: "Intégration globale", notable: "Mise en équivalence", conjoint: "Contrôle conjoint" }[kind];
  return (
    <svg viewBox="0 0 420 215" className="w-full max-w-md mx-auto">
      <rect x="150" y="8" width="120" height="50" rx="8" fill="#4f46e5" />
      <text x="210" y="30" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="600">Société Mère</text>
      <text x="210" y="46" textAnchor="middle" fill="#e0e7ff" fontSize="10">Consolidante</text>
      <line x1="210" y1="58" x2="210" y2="148" stroke="#818cf8" strokeWidth="2" />
      <rect x="176" y="92" width="68" height="20" rx="4" fill="#fff" stroke="#a5b4fc" />
      <text x="210" y="106" textAnchor="middle" fill="#4338ca" fontSize="11" fontWeight="700">{pct} %</text>
      <rect x="150" y="148" width="120" height="52" rx="8" fill="#334155" />
      <text x="210" y="170" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="600">{kind === "conjoint" ? "Coentreprise" : "Filiale"}</text>
      <text x="210" y="187" textAnchor="middle" fill="#cbd5e1" fontSize="10">{sub}</text>
      {kind === "exclusif" && (<>
        <rect x="308" y="148" width="104" height="52" rx="8" fill="#fef3c7" stroke="#fcd34d" strokeDasharray="4" />
        <text x="360" y="170" textAnchor="middle" fill="#92400e" fontSize="11" fontWeight="600">Minoritaires</text>
        <text x="360" y="187" textAnchor="middle" fill="#b45309" fontSize="11">{minor} %</text>
        <line x1="308" y1="174" x2="270" y2="174" stroke="#fbbf24" strokeWidth="2" strokeDasharray="4" />
      </>)}
    </svg>
  );
}
function SplitBar({ left, right, lLabel, rLabel, lColor = "indigo", rColor = "amber" }) {
  const tot = left + right || 1;
  const lp = Math.max(4, Math.min(96, (left / tot) * 100));
  const cl = { indigo: "bg-indigo-500", amber: "bg-amber-400", emerald: "bg-emerald-500", slate: "bg-slate-400" };
  return (
    <div>
      <div className="flex h-12 rounded-lg overflow-hidden text-white text-xs font-semibold">
        <div className={`${cl[lColor]} flex items-center justify-center`} style={{ width: `${lp}%` }}>{fmt(left)}</div>
        <div className={`${cl[rColor]} flex items-center justify-center`} style={{ width: `${100 - lp}%` }}>{fmt(right)}</div>
      </div>
      <div className="flex justify-between text-xs text-slate-500 mt-1"><span>{lLabel}</span><span>{rLabel}</span></div>
    </div>
  );
}

/* ===================== journal entry ===================== */
function Journal({ n, title, note, lines }) {
  const d = lines.reduce((a, l) => a + (l.debit || 0), 0);
  const c = lines.reduce((a, l) => a + (l.credit || 0), 0);
  return (
    <div className="rounded-lg border border-slate-200 overflow-hidden">
      <div className="bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-700 flex items-center gap-2">
        <span className="w-5 h-5 rounded bg-indigo-600 text-white text-xs flex items-center justify-center shrink-0">{n}</span>{title}
      </div>
      <table className="w-full text-sm">
        <thead><tr className="text-xs text-slate-400 border-b border-slate-100">
          <th className="text-left px-3 py-1 font-medium">Compte</th>
          <th className="text-right px-3 py-1 font-medium w-20">Débit</th>
          <th className="text-right px-3 py-1 font-medium w-20">Crédit</th>
        </tr></thead>
        <tbody>
          {lines.map((l, i) => (
            <tr key={i} className="border-b border-slate-50">
              <td className={`px-3 py-1.5 ${l.credit ? "pl-8 text-slate-500" : "text-slate-700"}`}>{l.compte}</td>
              <td className="px-3 py-1.5 text-right tabular-nums">{l.debit ? fmt(l.debit) : ""}</td>
              <td className="px-3 py-1.5 text-right tabular-nums">{l.credit ? fmt(l.credit) : ""}</td>
            </tr>
          ))}
          <tr className="font-semibold text-slate-800 bg-slate-50">
            <td className="px-3 py-1.5">Total</td>

/* ===================== data & compute ===================== */
const PRESET = {
  pctMere: "80", prix: "800", fCap: "500", fResAcq: "300", ecart: "100", jvNci: "190",
  fActifs: "1400", fResClot: "450", fDettes: "450", mActifs: "1700", mCap: "1000", mRes: "700", mDettes: "800",
  creanceIG: "120", margeStock: "20", taux: "0",
};
function compute(d, opt) {
  const pct = num(d.pctMere) / 100;
  const t = num(d.taux) / 100;
  const ecart = num(d.ecart);
  const DTL = ecart * t;
  const ecartNet = ecart - DTL;
  const prix = num(d.prix);
  const X = num(d.fCap) + num(d.fResAcq) + ecartNet;
  const deltaR = num(d.fResClot) - num(d.fResAcq);
  const qpGroupe = X * pct;
  const qpNci = X * (1 - pct);
  const gwPartial = prix - qpGroupe;
  const gwFull = prix + num(d.jvNci) - X;
  const full = opt.method === "full";
  const gw = full ? gwFull : gwPartial;
  const gwEmbeddedME = prix - qpGroupe;
  const nciAcq = full ? num(d.jvNci) : qpNci;
  const nci = nciAcq + (1 - pct) * deltaR;
  const marge = num(d.margeStock);
  const resConso = num(d.mRes) + pct * deltaR - marge;
  const ic = num(d.creanceIG);
  const compense = opt.ref === "swissgaap" && opt.gwTreat === "compense";
  const badwill = gw < 0;
  const gwActif = (compense || badwill) ? 0 : gw;
  const resConsoFinal = (compense || badwill) ? resConso - gw : resConso;
  const cActifs = num(d.mActifs) + num(d.fActifs) + ecart - ic - marge;
  const totActif = gwActif + cActifs;
  const totPassif = num(d.mCap) + resConsoFinal + nci + (num(d.mDettes) + num(d.fDettes) - ic) + DTL;
  const okBilan = Math.abs(totActif - totPassif) < 0.5;
  const amortAnnual = opt.amort > 0 ? gw / opt.amort : 0;
  const valME = prix + pct * deltaR;
  return { pct, t, DTL, ecart, ecartNet, prix, X, deltaR, qpGroupe, qpNci, gwPartial, gwFull, full, gw, gwEmbeddedME, nciAcq, nci, marge, resConso, ic, compense, gwActif, resConsoFinal, cActifs, totActif, totPassif, okBilan, amortAnnual, valME };
}

        <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-4">
          <div className="text-xs font-semibold uppercase text-emerald-600">Méthode complète (option IFRS)</div>
          <div className="flex justify-between items-baseline mt-1"><span className="text-sm text-emerald-800">Goodwill</span><span className="text-2xl font-bold tabular-nums text-emerald-700">{fmt(gwFull)}</span></div>
          <div className="flex justify-between text-xs text-emerald-700 mt-1"><span>Minoritaires (JV)</span><span className="tabular-nums font-semibold">{fmt(num(s.nci))}</span></div>

const CHAIN_PRESET = { mf: "80", fpf: "60", mpf: "0" };
function ChainTab() {
  const [s, setS] = useState(CHAIN_PRESET);
  const u = (k) => (v) => setS((p) => ({ ...p, [k]: v }));
  const mf = num(s.mf), fpf = num(s.fpf), mpf = num(s.mpf);
  const method = (p) => (p > 50 ? "Intégration globale" : p >= 20 ? "Mise en équivalence" : "Actif financier");
  const mColor = (p) => (p > 50 ? "text-indigo-700 bg-indigo-50" : p >= 20 ? "text-emerald-700 bg-emerald-50" : "text-slate-500 bg-slate-100");
  const controlF = mf > 50;
  const ctrlPF = mpf + (controlF ? fpf : 0);
  const intF = mf;
  const intPF = mpf + (mf / 100) * fpf;
  const broken = !controlF && fpf > 0;
  const diverge = Math.abs(ctrlPF - intPF) > 0.5;
  const rows = [{ e: "Filiale (F)", ctrl: mf, int: intF }, { e: "Petite-fille (PF)", ctrl: ctrlPF, int: intPF }];
  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <div className="space-y-4">
        <Card title="Chaîne de participation" icon={<Workflow size={18} className="text-indigo-600" />} accent="indigo">

        </Card>
        <Card title="Pourcentages détenus" icon={<Calculator size={18} className="text-indigo-600" />}>
          <Field label="M détient dans F" value={s.mf} onChange={u("mf")} suffix="%" />
          <Field label="F détient dans PF" value={s.fpf} onChange={u("fpf")} suffix="%" />
          <Field label="M détient directement dans PF" hint="participation directe (souvent 0)" value={s.mpf} onChange={u("mpf")} suffix="%" />

        </Card>
      </div>
      <div className="space-y-4">
        <div className="grid sm:grid-cols-2 gap-3">
          <Card accent="indigo"><div className="text-xs font-semibold uppercase text-indigo-500">% de contrôle</div><p className="text-xs text-slate-500 mt-1">Détermine la <strong>méthode</strong>. Binaire à chaque maillon : on additionne les droits de vote détenus directement et via les sociétés <strong>sous contrôle</strong>. Si un maillon n'est pas contrôlé, la chaîne se rompt.</p></Card>
          <Card accent="emerald"><div className="text-xs font-semibold uppercase text-emerald-600">% d'intérêt</div><p className="text-xs text-slate-500 mt-1">Détermine la <strong>part économique</strong> (quote-part des capitaux propres et du résultat). <strong>Multiplicatif</strong> le long de la chaîne.</p></Card>
        </div>
        <div className="rounded-xl border border-slate-200 overflow-hidden shadow-sm overflow-x-auto">
          <table className="w-full text-sm min-w-max">
            <thead><tr className="bg-slate-800 text-white text-left text-xs">
              <th className="px-3 py-2">Entité</th><th className="px-3 py-2 text-right">% contrôle</th><th className="px-3 py-2">Méthode</th><th className="px-3 py-2 text-right">% intérêt</th><th className="px-3 py-2 text-right">% minorit.</th>
            </tr></thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-t border-slate-100">
                  <td className="px-3 py-2 font-medium text-slate-700">{r.e}</td>
                  <td className="px-3 py-2 text-right tabular-nums">{fmt(r.ctrl)} %</td>
                  <td className="px-3 py-2"><span className={`text-xs px-2 py-0.5 rounded ${mColor(r.ctrl)}`}>{method(r.ctrl)}</span></td>
                  <td className="px-3 py-2 text-right tabular-nums">{fmt(r.int)} %</td>
                  <td className="px-3 py-2 text-right tabular-nums text-slate-400">{fmt(100 - r.int)} %</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {!broken && diverge && <Note type="tip">Pour <strong>PF</strong> : % de contrôle = <strong>{fmt(ctrlPF)} %</strong> mais % d'intérêt = <strong>{fmt(intPF)} %</strong>. La <strong>méthode</strong> ({method(ctrlPF).toLowerCase()}) suit le contrôle ; le <strong>partage des capitaux propres</strong> (groupe {fmt(intPF)} % / minoritaires {fmt(100 - intPF)} %) suit l'intérêt.</Note>}
        {broken && <Note type="warn"><strong>Rupture de chaîne</strong> : M ne contrôle pas F ({fmt(mf)} % ≤ 50 %). Les {fmt(fpf)} % détenus par F dans PF ne s'ajoutent donc <strong>pas</strong> au contrôle de M sur PF. M ne conserve qu'un intérêt économique de {fmt(intPF)} % dans PF.</Note>}
        <Note type="info">On consolide les sous-groupes du bas vers le haut. Le contrôle peut exister avec un intérêt &lt; 50 % (ici {fmt(ctrlPF)} % de contrôle pour {fmt(intPF)} % d'intérêt) : d'où des intérêts minoritaires importants.</Note>
      </div>
    </div>
  );
}

const RES_PRESET = { pct: "80", caM: "2000", chargesM: "1700", caF: "1200", chargesF: "1050", vi: "400", marge: "20", amort: "16" };
function ResultatTab() {
  const [s, setS] = useState(RES_PRESET);

          <Field label="Charges" value={s.chargesM} onChange={u("chargesM")} />
          <div className="text-xs font-semibold text-slate-400 uppercase pt-2">Filiale (résultat {fmt(rF)})</div>

        </Card>
      </div>
      <div className="space-y-4">
        <div className="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

          <div className="p-4 text-sm space-y-1">
            <div className="flex justify-between py-1"><span className="text-slate-700">Produits (CA)</span><span className="tabular-nums font-medium">{fmt(caConso)}</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont élimination des ventes internes</span><span className="tabular-nums">−{fmt(vi)}</span></div>
            <div className="flex justify-between py-1"><span className="text-slate-700">Charges</span><span className="tabular-nums font-medium">({fmt(chargesConso)})</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont élimination des ventes internes</span><span className="tabular-nums">−{fmt(vi)}</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont marge interne sur stock</span><span className="tabular-nums">+{fmt(marge)}</span></div>
            <div className="flex justify-between text-xs text-slate-400 pl-3"><span>dont amortissement du goodwill</span><span className="tabular-nums">+{fmt(amort)}</span></div>
            <div className="flex justify-between py-2 mt-1 border-t-2 border-slate-300 font-bold text-slate-900"><span>Résultat net consolidé</span><span className="tabular-nums">{fmt(resNet)}</span></div>
          </div>
        </div>
        <Card title="Partage du résultat net" icon={<GitBranch size={18} className="text-indigo-600" />} accent="indigo">
          <SplitBar left={resGroupe} right={resMino} lLabel="Part du groupe" rLabel="Part des minoritaires" lColor="indigo" rColor="amber" />
