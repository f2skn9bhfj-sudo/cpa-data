", "examples": [{"fr": "J'ai un mentor au sein du département IFRS.", "en": "I have a mentor in the IFRS department."}]}, {"id": "en_v_biz_074", "domain": "business", "level": "B1", "fr": "coach", "en": "coach", "notes": "Référent principal pour le développement et l'évaluation.", "examples": [{"fr": "Mon coach valide mon plan de développement.", "en": "My coach approves my development plan."}]}, {"id": "en_v_biz_075", "domain": "business", "level": "B1", "fr": "parrain", "en": "buddy", "notes": "Collègue référent désigné à l'arrivée (onboarding).", "examples": [{"fr": "Mon buddy m'a aidé pendant les premières semaines.", "en": "My buddy helped me during the first weeks."}]}, {"id": "en_v_biz_076", "domain": "business", "level": "B2", "fr": "détachement", "en": "secondment", "ipa": "sɪˈkɒndmənt", "notes": "Affectation temporaire chez un client ou dans un autre bureau.", "examples": [{"fr": "Je pars en détachement à Londres pour 6 mois.", "en": "I'm going on secondment to London for 6 months."}]}, {"id": "en_v_biz_077", "domain": "business", "level": "B2", "fr": "rotation", "en": "rotation", "notes": "Changement de portefeuille client ou de département.", "examples": [{"fr": "Une rotation vers le département Banking est possible.", "en": "A rotation to the Banking department is possible."}]}, {"id": "en_v_biz_078", "domain": "business", "level": "B1", "fr": "validation finale", "en": "sign-off", "notes": "Approbation formelle d'un document ou d'une étape.", "examples": [{"fr": "J'attends le sign-off du manager sur ma section.", "en": "I'm waiting for the manager's sign-off on my section."}]}, {"id": "en_v_biz_079", "domain": "business", "level": "B1", "fr": "clôture", "en": "wrap-up", "notes": "Finalisation d'une mission ou tâche.", "examples": [{"fr": "Le wrap-up de la mission prend deux jours.", "en": "The engagement wrap-up takes two days."}]}, {"id": "en_v_biz_080", "domain": "business", "level": "B2", "fr": "s'opposer poliment", "en": "to push back", "notes": "Verbe transitif / phrasal verb. Très utile en réunion EY.", "examples": [{"fr": "J'ai dû push back sur la deadline proposée par le client.", "en": "I had to push back on the deadline proposed by the client."}]}, {"id": "en_v_day_051", "domain": "daily", "level": "A2", "fr": "sur site", "en": "on-site", "notes": "Travail dans les locaux du client.", "examples": [{"fr": "Nous sommes on-site trois jours par semaine.", "en": "We're on-site three days a week."}]}, {"id": "en_v_day_052", "domain": "daily", "level": "A2", "fr": "à distance", "en": "remote", "notes": "Travail depuis chez soi ou ailleurs.", "examples": [{"fr": "Le mercredi est généralement remote.", "en": "Wednesday is typically remote."}]}, {"id": "en_v_day_053", "domain": "daily", "level": "A2", "fr": "hybride", "en": "hybrid", "notes": "Mélange présentiel/distance. Standard post-COVID.", "examples": [{"fr": "Le travail est hybride : 3 jours bureau, 2 jours maison.", "en": "Work is hybrid: 3 days office, 2 days home."}]}, {"id": "en_v_day_054", "domain": "daily", "level": "A2", "fr": "open space", "en": "open space", "notes": "Bureau ouvert sans cloisons. Standard EY.", "examples": [{"fr": "L'open space EY est au 5e étage.", "en": "The EY open space is on the 5th floor."}]}, {"id": "en_v_day_055", "domain": "daily", "level": "A2", "fr": "salle de pause", "en": "break room", "notes": "Espace détente avec café, eau, snacks.", "examples": [{"fr": "Retrouvons-nous dans la salle de pause à 11h.", "en": "Let's meet in the break room at 11."}]}, {"id": "en_v_day_056", "domain": "daily", "level": "A2", "fr": "cantine", "en": "canteen", "ipa": "kænˈtiːn", "notes": "Restaurant d'entreprise.", "examples": [{"fr": "La cantine sert un menu différent chaque jour.", "en": "The canteen serves a different menu every day."}]}, {"id": "en_v_day_057", "domain": "daily", "level": "A2", "fr": "pause café", "en": "coffee break", "notes": "Moment informel de socialisation.", "examples": [{"fr": "On prend une coffee break à 15h ?", "en": "Shall we take a coffee break at 3?"}]}, {"id": "en_v_day_058", "domain": "daily", "level": "B1", "fr": "déjeuner de travail", "en": "working lunch", "notes": "Lunch + sujet professionnel à aborder.", "examples": [{"fr": "Un working lunch est organisé avec le client jeudi.", "en": "A working lunch is organised with the client on Thursday."}]}, {"id": "en_v_day_059", "domain": "daily", "level": "B1", "fr": "afterwork", "en": "happy hour", "notes": "Verre entre collègues après le travail.", "examples": [{"fr": "Happy hour ce vendredi à 18h au bar du coin.", "en": "Happy hour this Friday at 6 at the local bar."}]}, {"id": "en_v_day_060", "domain": "daily", "level": "B1", "fr": "activité de cohésion", "en": "team building", "notes": "Évènement d'équipe (sport, escape game, dîner).", "examples": [{"fr": "Le team building annuel est prévu en mai.", "en": "The annual team building is planned for May."}]}, {"id": "en_v_day_061", "domain": "daily", "level": "B1", "fr": "journée de cohésion", "en": "away day", "notes": "Journée entière hors bureau, focus équipe/stratégie.", "examples": [{"fr": "L'away day du département se tient à Montreux.", "en": "The department away day takes place in Montreux."}]}, {"id": "en_v_day_062", "domain": "daily", "level": "A2", "fr": "vacances", "en": "holiday", "notes": "UK English. US English : vacation.", "examples": [{"fr": "Je suis en holiday la semaine prochaine.", "en": "I'm on holiday next week."}]}, {"id": "en_v_day_063", "domain": "daily", "level": "B1", "fr": "congés annuels", "en": "annual leave", "notes": "Vocabulaire RH formel.", "examples": [{"fr": "Mon solde de congés annuels est de 12 jours.", "en": "My annual leave balance is 12 days."}]}, {"id": "en_v_day_064", "domain": "daily", "level": "B1", "fr": "arrêt maladie", "en": "sick leave", "notes": "Absence pour raison médicale.", "examples": [{"fr": "Sarah est en arrêt maladie aujourd'hui.", "en": "Sarah is on sick leave today."}]}, {"id": "en_v_day_065", "domain": "daily", "level": "B1", "fr": "note de frais", "en": "expense claim", "notes": "Remboursement des dépenses professionnelles.", "examples": [{"fr": "J'ai soumis ma note de frais hier soir.", "en": "I submitted my expense claim yesterday evening."}]}, {"id": "en_v_day_066", "domain": "daily", "level": "B2", "fr": "indemnité journalière", "en": "per diem", "ipa": "pər ˈdiːəm", "notes": "Indemnité fixe par jour de déplacement (latin, gardé en anglais).", "examples": [{"fr": "Le per diem couvre les repas et petits frais.", "en": "The per diem covers meals and incidentals."}]}, {"id": "en_v_day_067", "domain": "daily", "level": "B2", "fr": "indemnité de déplacement", "en": "travel allowance", "notes": "Forfait pour les frais de déplacement.", "examples": [{"fr": "L'indemnité de déplacement est de CHF 80 par jour.", "en": "The travel allowance is CHF 80 per day."}]}, {"id": "en_v_day_068", "domain": "daily", "level": "B1", "fr": "tenue vestimentaire", "en": "dress code", "notes": "Code vestimentaire attendu.", "examples": [{"fr": "Le dress code EY est business casual.", "en": "The EY dress code is business casual."}]}, {"id": "en_v_day_069", "domain": "daily", "level": "B1", "fr": "business casual", "en": "business casual", "notes": "Tenue professionnelle décontractée (sans cravate, pas de jean).", "examples": [{"fr": "Le business casual est la norme au bureau.", "en": "Business casual is the norm at the office."}]}, {"id": "en_v_day_070", "domain": "daily", "level": "B1", "fr": "tenue formelle", "en": "business formal", "notes": "Costume cravate, requis avec certains clients.", "examples": [{"fr": "Le business formal est requis avec ce client bancaire.", "en": "Business formal is required with this banking client."}]}], "phrases": [{"id": "en_p_open_002", "category": "email_opening", "level": "A2", "fr": "Cher Monsieur Smith,", "en": "Dear Mr Smith,", "context": "Email formel, première prise de contact ou client externe."}, {"id": "en_p_open_004", "category": "email_opening", "level": "A2", "fr": "J'espère que ce courriel vous trouvera en bonne santé.", "en": "I hope this email finds you well.", "context": "Formule d'ouverture standard en anglais professionnel."}, {"id": "en_p_open_005", "category": "email_opening", "level": "B1", "fr": "Merci pour votre rapide réponse.", "en": "Thank you for your quick reply.", "context": "Ouverture quand on répond à un email reçu récemment."}, {"id": "en_p_open_006", "category": "email_opening", "level": "B1", "fr": "Je me permets de vous contacter au sujet de…", "en": "I am writing to you regarding…", "context": "Ouverture formelle, annonce le motif du message."}, {"id": "en_p_open_007", "category": "email_opening", "level": "A2", "fr": "Suite à notre conversation,", "en": "Following our conversation,", "context": "Référence à un échange antérieur (téléphonique ou en réunion)."}, {"id": "en_p_open_008", "category": "email_opening", "level": "B1", "fr": "Merci de m'avoir répondu si rapidement.", "en": "Thanks for getting back to me so quickly.", "context": "Email informel-professionnel, pour remercier d'un retour rapide."}, {"id": "en_p_close_001", "category": "email_closing", "level": "A2", "fr": "Cordialement,", "en": "Best regards,", "context": "Formule de clôture standard professionnelle."}, {"id": "en_p_close_002", "category": "email_closing", "level": "A2", "fr": "Cordialement,", "en": "Kind regards,", "context": "Variante légèrement plus chaleureuse de 'Best regards'."}, {"id": "en_p_close_003", "category": "email_closing", "level": "B1", "fr": "Dans l'attente de votre retour,", "en": "Looking forward to hearing from you,", "context": "Clôture qui invite à une réponse."}, {"id": "en_p_close_004", "category": "email_closing", "level": "A2", "fr": "Dites-moi si vous avez des questions.", "en": "Let me know if you have any questions.", "context": "Clôture pour rester ouvert au dialogue."}, {"id": "en_p_close_005", "category": "email_closing", "level": "A2", "fr": "Merci d'avance pour votre aide.", "en": "Thank you in advance for your help.", "context": "Clôture quand on attend une action de la part du destinataire."}, {"id": "en_p_close_006", "category": "email_closing", "level": "B1", "fr": "N'hésitez pas à revenir vers moi.", "en": "Please don't hesitate to get back to me.", "context": "Clôture invitant à une suite si besoin."}, {"id": "en_p_close_008", "category": "email_closing", "level": "B1", "fr": "Je reste à votre disposition.", "en": "I remain at your disposal.", "context": "Clôture formelle classique en anglais d'affaires."}, {"id": "en_p_mtg_001", "category": "meeting", "level": "A2", "fr": "Pourrions-nous fixer une réunion?", "en": "Could we schedule a meeting?", "context": "Demande de planification d'un rendez-vous."}, {"id": "en_p_mtg_002", "category": "meeting", "level": "A2", "fr": "Je voudrais ajouter un point à l'ordre du jour.", "en": "I'd like to add an item to the agenda.", "context": "Avant ou pendant une réunion, demande d'ajout."}, {"id": "en_p_mtg_003", "category": "meeting", "level": "A2", "fr": "Passons au point suivant.", "en": "Let's move on to the next point.", "context": "Pour faire avancer la réunion (animateur)."}, {"id": "en_p_mtg_004", "category": "meeting", "level": "B1", "fr": "Je ferai un suivi par e-mail.", "en": "I'll follow up by email.", "context": "Engagement à clôturer un sujet après la réunion."}, {"id": "en_p_mtg_005", "category": "meeting", "level": "A2", "fr": "Pouvez-vous répéter, s'il vous plaît?", "en": "Could you repeat that, please?", "context": "Demande de clarification quand on n'a pas compris."}, {"id": "en_p_mtg_006", "category": "meeting", "level": "B1", "fr": "Je suis tout à fait d'accord avec ça.", "en": "I completely agree with that.", "context": "Pour exprimer un accord clair."}, {"id": "en_p_mtg_007", "category": "meeting", "level": "B1", "fr": "Je vois ce que vous voulez dire, mais…", "en": "I see your point, but…", "context": "Désaccord poli, transition vers contre-argument."}, {"id": "en_p_mtg_008", "category": "meeting", "level": "A2", "fr": "Récapitulons les actions à mener.", "en": "Let's recap the action items.", "context": "Fin de réunion, pour clôturer."}, {"id": "en_p_idm_001", "category": "idiom", "level": "B1", "fr": "briser la glace", "en": "to break the ice", "context": "Démarrer une conversation dans un contexte tendu ou nouveau."}, {"id": "en_p_idm_002", "category": "idiom", "level": "B1", "fr": "penser autrement / sortir des sentiers battus", "en": "to think outside the box", "context": "Trouver une idée originale, hors cadre habituel."}, {"id": "en_p_idm_003", "category": "idiom", "level": "B1", "fr": "la balle est dans votre camp", "en": "the ball is in your court", "context": "C'est à l'autre de prendre la décision ou d'agir."}, {"id": "en_p_idm_004", "category": "idiom", "level": "B1", "fr": "arrêter pour aujourd'hui", "en": "to call it a day", "context": "Décider de mettre fin à la journée de travail."}, {"id": "en_p_idm_005", "category": "idiom", "level": "B1", "fr": "faire un point ensemble", "en": "to touch base", "context": "Reprendre contact rapidement avec quelqu'un."}, {"id": "en_p_idm_006", "category": "idiom", "level": "B1", "fr": "revenir vers (qqn) plus tard", "en": "to circle back", "context": "Reprendre un sujet plus tard quand on aura plus d'infos."}, {"id": "en_p_idm_007", "category": "idiom", "level": "B1", "fr": "laisser tomber la balle / merder", "en": "to drop the ball", "context": "Échouer à tenir un engagement, oublier une tâche."}, {"id": "en_p_idm_008", "category": "idiom", "level": "B1", "fr": "être sur la même longueur d'onde", "en": "to be on the same page", "context": "Confirmer qu'on partage la même compréhension."}, {"id": "en_p_trn_001", "category": "transition", "level": "A2", "fr": "Cependant,", "en": "However,", "context": "Connecteur d'opposition, en début de phrase écrite ou orale."}, {"id": "en_p_trn_002", "category": "transition", "level": "A2", "fr": "De plus,", "en": "In addition,", "context": "Pour ajouter un argument ou une information."}, {"id": "en_p_trn_003", "category": "transition", "level": "B1", "fr": "D'autre part,", "en": "On the other hand,", "context": "Présenter un point de vue différent ou complémentaire."}, {"id": "en_p_trn_004", "category": "transition", "level": "B1", "fr": "Par conséquent,", "en": "As a result,", "context": "Conséquence ou conclusion d'un raisonnement."}, {"id": "en_p_pol_001", "category": "politeness", "level": "B1", "fr": "Pourriez-vous éventuellement…?", "en": "Could you possibly…?", "context": "Demande très polie, registre formel."}, {"id": "en_p_pol_002", "category": "politeness", "level": "B1", "fr": "Cela vous dérangerait-il de…?", "en": "Would you mind…?", "context": "Demande polie suivie d'un verbe en -ing."}, {"id": "en_p_pol_003", "category": "politeness", "level": "B1", "fr": "Je vous serais reconnaissant si…", "en": "I'd appreciate it if…", "context": "Demande très formelle, ton professionnel."}, {"id": "en_p_pol_004", "category": "politeness", "level": "A2", "fr": "Désolé de vous déranger, mais…", "en": "Sorry to bother you, but…", "context": "Pour interrompre poliment quelqu'un."}, {"id": "en_p_open_009", "category": "email_opening", "level": "B1", "fr": "Cher Monsieur Smith,", "en": "Dear Mr Smith,", "context": "Email formel, première communication. Toujours 'Dear' + titre + nom de famille."}, {"id": "en_p_open_010", "category": "email_opening", "level": "B1", "fr": "Chère Madame Brown,", "en": "Dear Ms Brown,", "context": "'Ms' par défaut pour les femmes (neutre sur statut marital)."}, {"id": "en_p_open_011", "category": "email_opening", "level": "B2", "fr": "À qui de droit,", "en": "To whom it may concern,", "context": "Très formel, destinataire inconnu (lettre ouverte, certification)."}, {"id": "en_p_open_012", "category": "email_opening", "level": "B1", "fr": "J'espère que vous allez bien.", "en": "I hope this email finds you well.", "context": "Phrase d'introduction standard en début d'email. Très utilisée en contexte client."}, {"id": "en_p_open_013", "category": "email_opening", "level": "B1", "fr": "Suite à notre échange d'hier,", "en": "Further to our discussion yesterday,", "context": "Référence à une conversation antérieure — utile en suivi de réunion."}, {"id": "en_p_open_014", "category": "email_opening", "level": "B1", "fr": "Je reviens vers vous au sujet de...", "en": "I'm getting back to you regarding...", "context": "Reprise d'un sujet déjà discuté."}, {"id": "en_p_open_015", "category": "email_opening", "level": "B2", "fr": "Je me permets de vous contacter au sujet de...", "en": "I'm reaching out regarding...", "context": "Formel mais moderne. Ouverture pour un nouveau sujet."}, {"id": "en_p_open_016", "category": "email_opening", "level": "B1", "fr": "Comme convenu lors de notre appel,", "en": "As discussed during our call,", "context": "Référence à une décision prise oralement."}, {"id": "en_p_open_018", "category": "email_opening", "level": "B1", "fr": "Merci de votre réponse rapide.", "en": "Thank you for your prompt reply.", "context": "Reconnaît la réactivité du destinataire."}, {"id": "en_p_open_019", "category": "email_opening", "level": "B1", "fr": "Pardon de revenir vers vous,", "en": "Apologies for circling back,", "context": "Pour relancer poliment sur un sujet pendant."}, {"id": "en_p_open_020", "category": "email_opening", "level": "B2", "fr": "Pardon de vous solliciter à nouveau,", "en": "Apologies for bothering you again,", "context": "Très utilisé en audit pour relancer un client sur des PBC en retard."}, {"id": "en_p_close_010", "category": "email_closing", "level": "B1", "fr": "Cordialement,", "en": "Kind regards,", "context": "Légèrement plus chaleureux que 'Best regards'."}, {"id": "en_p_close_012", "category": "email_closing", "level": "B2", "fr": "Veuillez agréer mes salutations distinguées,", "en": "Yours sincerely,", "context": "Très formel UK. Quand on connaît le nom du destinataire."}, {"id": "en_p_close_013", "category": "email_closing", "level": "B2", "fr": "Veuillez agréer mes salutations,", "en": "Yours faithfully,", "context": "Très formel UK. Quand on ne connaît pas le nom (Dear Sir/Madam)."}, {"id": "en_p_close_014", "category": "email_closing", "level": "B1", "fr": "N'hésitez pas si vous avez la moindre question.", "en": "Please don't hesitate to reach out if you have any questions.", "context": "Invitation classique en fin d'email."}, {"id": "en_p_close_015", "category": "email_closing", "level": "B1", "fr": "Restant à votre disposition,", "en": "I remain at your disposal,", "context": "Formule formelle de disponibilité."}, {"id": "en_p_close_016", "category": "email_closing", "level": "B2", "fr": "Dans l'attente de votre retour,", "en": "Looking forward to hearing from you,", "context": "Très commune — incite à une réponse."}, {"id": "en_p_close_017", "category": "email_closing", "level": "B2", "fr": "Merci pour votre attention sur ce sujet.", "en": "Thanks for your attention on this matter.", "context": "Clôture pour un sujet sensible ou urgent."}, {"id": "en_p_close_020", "category": "email_closing", "level": "B2", "fr": "Merci d'avance pour votre aide,", "en": "Thanks in advance for your help,", "context": "À utiliser avec parcimonie — peut sembler présomptueux."}, {"id": "en_p_mtg_009", "category": "meeting", "level": "B1", "fr": "Commençons.", "en": "Let's get started.", "context": "Démarrer une réunion. Très courant."}, {"id": "en_p_mtg_010", "category": "meeting", "level": "B1", "fr": "Faisons un tour de table.", "en": "Let's do a round of introductions.", "context": "Présentations en début de réunion (kick-off, premier appel)."}, {"id": "en_p_mtg_011", "category": "meeting", "level": "B1", "fr": "Pouvez-vous vous présenter brièvement ?", "en": "Could you briefly introduce yourself?", "context": "Demande de présentation individuelle."}, {"id": "en_p_mtg_012", "category": "meeting", "level": "B1", "fr": "Récapitulons l'ordre du jour.", "en": "Let's go through the agenda.", "context": "Présenter le programme de la réunion."}, {"id": "en_p_mtg_013", "category": "meeting", "level": "B1", "fr": "Je propose qu'on commence par...", "en": "I suggest we start with...", "context": "Structurer l'ordre de discussion."}, {"id": "en_p_mtg_014", "category": "meeting", "level": "B2", "fr": "Pour gagner du temps, passons directement au point clé.", "en": "To save time, let's jump straight to the key point.", "context": "Très utile quand la réunion s'étire."}, {"id": "en_p_mtg_015", "category": "meeting", "level": "B1", "fr": "Pouvez-vous parler un peu plus lentement, s'il vous plaît ?", "en": "Could you slow down a bit, please?", "context": "Phrase de survie EN tant que non-natif. Pas honteux du tout."}, {"id": "en_p_mtg_016", "category": "meeting", "level": "B1", "fr": "Désolé, vous avez coupé une seconde.", "en": "Sorry, you broke up for a second.", "context": "Pour Teams/Zoom — quelqu'un a un problème de connexion."}, {"id": "en_p_mtg_017", "category": "meeting", "level": "B1", "fr": "On vous entend mal.", "en": "We can't hear you very well.", "context": "Problème audio sur le call."}, {"id": "en_p_mtg_018", "category": "meeting", "level": "B1", "fr": "Vous êtes mute.", "en": "You're on mute.", "context": "Phrase la plus utile de l'ère post-COVID."}, {"id": "en_p_mtg_019", "category": "meeting", "level": "B2", "fr": "Permettez-moi d'enchaîner sur ce point.", "en": "Let me build on that point.", "context": "Rebondir sur l'intervention d'un collègue."}, {"id": "en_p_mtg_020", "category": "meeting", "level": "B2", "fr": "Je vais jouer l'avocat du diable.", "en": "Let me play devil's advocate.", "context": "Avant de soulever une objection constructive."}, {"id": "en_p_mtg_021", "category": "meeting", "level": "B2", "fr": "Pour rebondir sur ce que vient de dire Marc,", "en": "Building on what Mark just said,", "context": "Reconnaître une intervention avant d'enchérir."}, {"id": "en_p_mtg_022", "category": "meeting", "level": "B1", "fr": "Je n'ai pas tout à fait suivi — pouvez-vous reformuler ?", "en": "I didn't quite follow — could you rephrase?", "context": "Demander une reformulation sans dire qu'on n'a pas compris l'anglais."}, {"id": "en_p_mtg_023", "category": "meeting", "level": "B2", "fr": "On s'éloigne un peu du sujet.", "en": "We're drifting off topic.", "context": "Recentrer poliment la discussion."}, {"id": "en_p_mtg_024", "category": "meeting", "level": "B2", "fr": "Mettons cela en parking et reprenons-le après.", "en": "Let's park that and circle back to it later.", "context": "Différer un sujet sans l'enterrer."}, {"id": "en_p_mtg_025", "category": "meeting", "level": "B1", "fr": "On en reparle hors-ligne.", "en": "Let's take it offline.", "context": "Reporter une discussion bilatérale après la réunion."}, {"id": "en_p_mtg_026", "category": "meeting", "level": "B2", "fr": "Faisons un point intermédiaire.", "en": "Let's do a quick check-in.", "context": "Pause au milieu d'une longue réunion."}, {"id": "en_p_mtg_027", "category": "meeting", "level": "B1", "fr": "On a 5 minutes de retard sur le timing.", "en": "We're 5 minutes behind schedule.", "context": "Signaler un dérapage temporel."}, {"id": "en_p_mtg_028", "category": "meeting", "level": "B1", "fr": "Récapitulons les points d'action.", "en": "Let's recap the action items.", "context": "Conclusion structurée de réunion. À faire systématiquement."}, {"id": "en_p_mtg_029", "category": "meeting", "level": "B2", "fr": "Qui se charge de cela ?", "en": "Who's taking that one?", "context": "Assigner un point d'action à quelqu'un."}, {"id": "en_p_mtg_030", "category": "meeting", "level": "B2", "fr": "On se recale la semaine prochaine, même heure ?", "en": "Shall we sync again next week, same time?", "context": "Planifier la prochaine itération."}, {"id": "en_p_idm_009", "category": "idiom", "level": "B2", "fr": "Tuer deux oiseaux d'une pierre.", "en": "To kill two birds with one stone.", "context": "Régler deux problèmes en une action."}, {"id": "en_p_idm_010", "category": "idiom", "level": "B2", "fr": "Faire une montagne d'une taupinière.", "en": "To make a mountain out of a molehill.", "context": "Exagérer l'importance d'un problème."}, {"id": "en_p_idm_011", "category": "idiom", "level": "B2", "fr": "L'éléphant dans la pièce.", "en": "The elephant in the room.", "context": "Un sujet évident que personne n'aborde."}, {"id": "en_p_idm_012", "category": "idiom", "level": "B2", "fr": "Toucher du bois.", "en": "Fingers crossed.", "context": "Souhaiter bonne chance — geste possible aussi."}, {"id": "en_p_idm_013", "category": "idiom", "level": "B2", "fr": "On verra bien.", "en": "Let's see how it pans out.", "context": "Attendre de voir comment évolue une situation."}, {"id": "en_p_idm_014", "category": "idiom", "level": "B2", "fr": "Le diable se cache dans les détails.", "en": "The devil is in the details.", "context": "Très utilisé en audit IFRS — chaque clause compte."}, {"id": "en_p_idm_015", "category": "idiom", "level": "B2", "fr": "Cela se résume à ceci.", "en": "It boils down to this.", "context": "Synthétiser un problème complexe."}, {"id": "en_p_idm_016", "category": "idiom", "level": "B2", "fr": "Prendre quelque chose à bras-le-corps.", "en": "To get to grips with something.", "context": "S'attaquer sérieusement à un sujet."}, {"id": "en_p_idm_017", "category": "idiom", "level": "B2", "fr": "C'est dans les cordes.", "en": "It's in the pipeline.", "context": "Quelque chose est en préparation."}, {"id": "en_p_idm_018", "category": "idiom", "level": "B2", "fr": "Toutes les options sont sur la table.", "en": "All options are on the table.", "context": "Rien n'est exclu — phase de réflexion ouverte."}, {"id": "en_p_idm_019", "category": "idiom", "level": "B2", "fr": "Sortir du cadre.", "en": "To think outside the box.", "context": "Idée créative."}, {"id": "en_p_idm_020", "category": "idiom", "level": "B2", "fr": "C'est dans tes cordes / Tu peux le faire.", "en": "You've got this.", "context": "Encouragement informel."}, {"id": "en_p_trn_005", "category": "transition", "level": "B1", "fr": "Cela étant dit,", "en": "That being said,", "context": "Nuancer après avoir présenté un point."}, {"id": "en_p_trn_006", "category": "transition", "level": "B1", "fr": "Plus important encore,", "en": "More importantly,", "context": "Souligner le point critique."}, {"id": "en_p_trn_007", "category": "transition", "level": "B1", "fr": "Sur une note différente,", "en": "On a different note,", "context": "Changer de sujet poliment."}, {"id": "en_p_trn_008", "category": "transition", "level": "B1", "fr": "En revanche,", "en": "On the other hand,", "context": "Présenter un contraste ou alternative."}, {"id": "en_p_trn_009", "category": "transition", "level": "B2", "fr": "Par conséquent,", "en": "Consequently,", "context": "Conséquence logique."}, {"id": "en_p_trn_010", "category": "transition", "level": "B2", "fr": "Néanmoins,", "en": "Nevertheless,", "context": "Opposition formelle, soutenue."}, {"id": "en_p_pol_006", "category": "politeness", "level": "B1", "fr": "Si cela ne vous dérange pas trop,", "en": "If it's not too much trouble,", "context": "Atténuer une demande."}, {"id": "en_p_pol_007", "category": "politeness", "level": "B1", "fr": "Auriez-vous un moment ?", "en": "Would you have a minute?", "context": "Demander un temps de discussion."}, {"id": "en_p_pol_008", "category": "politeness", "level": "B1", "fr": "Quand cela vous convient,", "en": "At your convenience,", "context": "Ne pas imposer de timing."}, {"id": "en_p_pol_009", "category": "politeness", "level": "B1", "fr": "Désolé pour la gêne occasionnée.", "en": "Sorry for the inconvenience.", "context": "S'excuser d'une demande qui dérange."}, {"id": "en_p_pol_010", "category": "politeness", "level": "B1", "fr": "J'apprécierais beaucoup votre aide.", "en": "I would really appreciate your help.", "context": "Formelle, fait plaisir au destinataire."}, {"id": "en_p_pol_011", "category": "politeness", "level": "B2", "fr": "Si ": "client_request", "level": "B1", "fr": "Auriez-vous la dernière version du fichier ?", "en": "Would you have the latest version of the file?", "context": "Vérifier qu'on a la bonne version."}, {"id": "en_p_req_004", "category": "client_request", "level": "B2", "fr": "Serait-il possible de planifier un appel cette semaine ?", "en": "Would it be possible to schedule a call this week?", "context": "Demander un créneau."}, {"id": "en_p_req_005", "category": "client_request", "level": "B1", "fr": "Quand pensez-vous pouvoir nous fournir cette information ?", "en": "When do you think you'll be able to provide this information?", "context": "Demander un timing — pression douce."}, {"id": "en_p_req_006", "category": "client_request", "level": "B2", "fr": "Cela vous gênerait-il de nous envoyer également... ?", "en": "Would you mind also sending us...?", "context": "Demande supplémentaire à une demande déjà en cours."}, {"id": "en_p_req_007", "category": "client_request", "level": "B2", "fr": "Pour vous aider, voici un modèle de fichier.", "en": "To help you, here is a template file.", "context": "Faciliter la tâche du client en fournissant un format."}, {"id": "en_p_req_008", "category": "client_request", "level": "B1", "fr": "Merci d'inclure les pièces justificatives.", "en": "Please include the supporting documentation.", "context": "Demande de pièces justificatives — vocabulaire audit."}, {"id": "en_p_req_009", "category": "client_request", "level": "B2", "fr": "Pouvez-vous confirmer que le solde correspond à votre relevé bancaire ?", "en": "Can you confirm the balance ties to your bank statement?", "context": "Demande de confirmation chiffrée."}, {"id": "en_p_req_010", "category": "client_request", "level": "B2", "fr": "Pourriez-vous nous fournir un détail par poste ?", "en": "Could you provide a breakdown by line item?", "context": "Demander la décomposition d'un montant."}, {"id": "en_p_req_011", "category": "client_request", "level": "B1", "fr": "Avez-vous une date à nous proposer ?", "en": "Do you have a date to suggest?", "context": "Solliciter une proposition de timing."}, {"id": "en_p_req_012", "category": "client_request", "level": "B2", "fr": "Idéalement, nous aurions besoin de cela d'ici vendredi.", "en": "Ideally, we would need this by Friday.", "context": "Donner un timing souhaité sans imposer."}, {"id": "en_p_req_013", "category": "client_request", "level": "B2", "fr": "Pour information, ceci est urgent pour la finalisation.", "en": "For your information, this is urgent for the wrap-up.", "context": "Justifier l'urgence."}, {"id": "en_p_req_014", "category": "client_request", "level": "B1", "fr": "Pourriez-vous m'orienter vers la bonne personne ?", "en": "Could you point me to the right person?", "context": "Quand le destinataire n'est pas la bonne personne."}, {"id": "en_p_req_015", "category": "client_request", "level": "B2", "fr": "Auriez-vous une explication concernant l'écart de CHF 50'000 ?", "en": "Would you have an explanation regarding the CHF 50,000 variance?", "context": "Demander une justification d'écart."}, {"id": "en_p_req_016", "category": "client_request", "level": "B1", "fr": "Pouvez-vous valider le tableau ci-joint ?", "en": "Could you validate the attached spreadsheet?", "context": "Demander une approbation de fichier."}, {"id": "en_p_req_017", "category": "client_request", "level": "B2", "fr": "Nous aimerions clarifier un point sur les amortissements.", "en": "We would like to clarify a point on depreciation.", "context": "Annoncer une demande de précision technique."}, {"id": "en_p_req_018", "category": "client_request", "level": "B2", "fr": "Quel est le traitement comptable retenu pour cette opération ?", "en": "What is the accounting treatment applied to this transaction?", "context": "Question technique fréquente en audit."}, {"id": "en_p_req_019", "category": "client_request", "level": "B2", "fr": "Disposez-vous d'une documentation interne sur ce sujet ?", "en": "Do you have any internal documentation on this matter?", "context": "Demander des supports écrits."}, {"id": "en_p_req_020", "category": "client_request", "level": "B2", "fr": "Merci de copier votre contrôleur de gestion sur la réponse.", "en": "Please cc your controller on your reply.", "context": "Inclure une partie prenante dans la boucle."}, {"id": "en_p_esc_001", "category": "escalation", "level": "B2", "fr": "Je souhaitais attirer votre attention sur un point bloquant.", "en": "I wanted to bring to your attention a blocking issue.", "context": "Ouvrir une escalade en restant courtois."}, {"id": "en_p_esc_002", "category": "escalation", "level": "B2", "fr": "Malgré plusieurs relances, nous n'avons toujours pas reçu...", "en": "Despite several follow-ups, we still haven't received...", "context": "Décrire factuellement la situation."}, {"id": "en_p_esc_003", "category": "escalation", "level": "B2", "fr": "Cela commence à impacter notre planning.", "en": "This is starting to impact our timeline.", "context": "Articuler la conséquence concrète."}, {"id": "en_p_esc_004", "category": "escalation", "level": "B2", "fr": "Pourriez-vous nous aider à débloquer cette situation ?", "en": "Could you help us unblock this situation?", "context": "Demander de l'aide hiérarchique — formule polie."}, {"id": "en_p_esc_005", "category": "escalation", "level": "B2", "fr": "Je préfère vous prévenir en amont plutôt que tard.", "en": "I'd rather flag this early than late.", "context": "Justifier l'escalade préventive."}, {"id": "en_p_esc_006", "category": "escalation", "level": "B2", "fr": "Sans réponse d'ici demain, nous devrons réviser notre planning.", "en": "Without a response by tomorrow, we'll have to revise our timeline.", "context": "Poser une échéance ferme."}, {"id": "en_p_esc_007", "category": "escalation", "level": "B2", "fr": "J'ai besoin de votre soutien sur ce sujet.", "en": "I need your support on this matter.", "context": "Demande directe à un manager/partner."}, {"id": "en_p_esc_008", "category": "escalation", "level": "B2", "fr": "Le sujet mérite une discussion au niveau des associés.", "en": "This matter warrants a partner-level discussion.", "context": "Suggérer une escalade hiérarchique."}, {"id": "en_p_esc_009", "category": "escalation", "level": "B2", "fr": "Je vous propose d'organiser un appel à trois.", "en": "I suggest we set up a three-way call.", "context": "Élargir le cercle de décision."}, {"id": "en_p_esc_010", "category": "escalation", "level": "B2", "fr": "Je voulais vous tenir informé de l'évolution.", "en": "I wanted to keep you in the loop on the developments.", "context": "Tenir un destinataire informé sans demande explicite."}, {"id": "en_p_push_001", "category": "pushback", "level": "B2", "fr": "Je comprends votre point de vue, cependant...", "en": "I understand your point, however...", "context": "Reconnaître avant de désaccord — sandwich classique."}, {"id": "en_p_push_002", "category": "pushback", "level": "B2", "fr": "Avec tout le respect que je vous dois, je ne suis pas d'accord.", "en": "With all due respect, I disagree.", "context": "Désaccord formel mais clair."}, {"id": "en_p_push_003", "category": "pushback", "level": "B2", "fr": "Je vois les choses différemment.", "en": "I see things differently.", "context": "Désaccord doux, ouvre la discussion."}, {"id": "en_p_push_004", "category": "pushback", "level": "B2", "fr": "Permettez-moi de vous proposer une perspective alternative.", "en": "Let me offer an alternative perspective.", "context": "Annoncer une vision différente, posée."}, {"id": "en_p_push_005", "category": "pushback", "level": "B2", "fr": "Je ne suis pas certain que ce soit la meilleure approche.", "en": "I'm not sure this is the best approach.", "context": "Exprimer un doute constructif."}, {"id": "en_p_push_006", "category": "pushback", "level": "B2", "fr": "Nous avons quelques préoccupations sur cette approche.", "en": "We have some concerns about this approach.", "context": "Soulever des inquiétudes — auditeur typique."}, {"id": "en_p_push_007", "category": "pushback", "level": "B2", "fr": "Je suis d'accord en principe, mais...", "en": "I agree in principle, but...", "context": "Demi-accord — préfigure une nuance importante."}, {"id": "en_p_push_008", "category": "pushback", "level": "B2", "fr": "Cela ne reflète pas notre interprétation de la norme.", "en": "That doesn't reflect our reading of the standard.", "context": "Désaccord technique IFRS/audit."}, {"id": "en_p_push_009", "category": "pushback", "level": "B2", "fr": "Nous ne pouvons pas valider cette position en l'état.", "en": "We cannot validate this position as it stands.", "context": "Refus motivé — formule auditeur."}, {"id": "en_p_push_010", "category": "pushback", "level": "B2", "fr": "Cela nécessitera des éléments probants supplémentaires.", "en": "This will require additional audit evidence.", "context": "Conditionner une validation à plus de preuves."}, {"id": "en_p_clar_001", "category": "clarification", "level": "A2", "fr": "Pouvez-vous préciser ?", "en": "Could you clarify?", "context": "Demande de clarification simple et directe."}, {"id": "en_p_clar_002", "category": "clarification", "level": "B1", "fr": "Je ne suis pas sûr d'avoir bien compris.", "en": "I'm not sure I follow.", "context": "Avouer une incompréhension sans gêne."}, {"id": "en_p_clar_003", "category": "clarification", "level": "B1", "fr": "Pour être sûr d'avoir bien compris,", "en": "Just to make sure I understand correctly,", "context": "Reformuler avant de valider."}, {"id": "en_p_clar_004", "category": "clarification", "level": "B1", "fr": "Cela veut-il dire que... ?", "en": "Does that mean that...?", "context": "Vérifier une interprétation."}, {"id": "en_p_clar_005", "category": "clarification", "level": "B2", "fr": "Pouvez-vous illustrer avec un exemple concret ?", "en": "Could you give me a concrete example?", "context": "Demander une illustration pratique."}, {"id": "en_p_clar_006", "category": "clarification", "level": "B1", "fr": "Qu'entendez-vous par... ?", "en": "What do you mean by...?", "context": "Préciser un terme ambigu."}, {"id": "en_p_clar_007", "category": "clarification", "level": "B2", "fr": "Si je vous résume,", "en": "Let me summarise what I heard,", "context": "Reformulation active — outil puissant."}, {"id": "en_p_clar_008", "category": "clarification", "level": "B2", "fr": "Corrigez-moi si je me trompe,", "en": "Correct me if I'm wrong,", "context": "Vérifier sa compréhension en laissant la porte ouverte."}, {"id": "en_p_clar_009", "category": "clarification", "level": "B2", "fr": "Y a-t-il un contexte qui m'aurait échappé ?", "en": "Is there any context I might be missing?", "context": "Demander du contexte sans s'auto-dévaluer."}, {"id": "en_p_clar_010", "category": "clarification", "level": "B1", "fr": "Pour le compte-rendu, je note donc que...", "en": "For the record, I'm noting that...", "context": "Formaliser ce qui a été dit."}, {"id": "en_p_aud_001", "category": "audit_specific", "level": "B1", "fr": "Nous démarrons notre audit la semaine prochaine.", "en": "We are starting our audit next week.", "context": "Communication client — annonce de phase."}, {"id": "en_p_aud_002", "category": "audit_specific", "level": "B2", "fr": "Nous aurons besoin de l'accès au système ERP.", "en": "We will need access to the ERP system.", "context": "Demande d'accès IT — standard."}, {"id": "en_p_aud_003", "category": "audit_specific", "level": "B2", "fr": "Pouvez-vous nous proposer une personne référente IT ?", "en": "Could you suggest an IT contact person?", "context": "Désigner un interlocuteur IT chez le client."}, {"id": "en_p_aud_004", "category": "audit_specific", "level": "B2", "fr": "Nous souhaiterions effectuer un walkthrough du cycle achats.", "en": "We'd like to perform a walkthrough of the purchase cycle.", "context": "Planifier un walkthrough avec le client."}, {"id": "en_p_aud_005", "category": "audit_specific", "level": "B2", "fr": "Sommes-nous d'accord sur le périmètre de la mission ?", "en": "Are we aligned on the scope of the engagement?", "context": "Confirmer l'alignement sur le scope."}, {"id": "en_p_aud_006", "category": "audit_specific", "level": "B2", "fr": "Nous avons identifié un risque significatif sur cette zone.", "en": "We've identified a significant risk in this area.", "context": "Communication d'un risque au client."}, {"id": "en_p_aud_007", "category": "audit_specific", "level": "B2", "fr": "Nous devons obtenir des éléments probants supplémentaires.", "en": "We need to obtain additional audit evidence.", "context": "Annoncer un besoin de preuves."}, {"id": "en_p_aud_008", "category": "audit_specific", "level": "B2", "fr": "Pouvez-vous nous expliquer la méthodologie utilisée ?", "en": "Could you walk us through the methodology used?", "context": "Demander un explication d'approche au client."}, {"id": "en_p_aud_009", "category": "audit_specific", "level": "B2", "fr": "Nous devons recouper cela avec le grand livre.", "en": "We need to reconcile this with the general ledger.", "context": "Vocabulaire de réconciliation."}, {"id": "en_p_aud_010", "category": "audit_specific", "level": "B2", "fr": "Cela a-t-il fait l'objet d'une revue interne ?", "en": "Has this been subject to an internal review?", "context": "Vérifier la gouvernance interne."}, {"id": "en_p_aud_011", "category": "audit_specific", "level": "B2", "fr": "Qui a approuvé cette écriture ?", "en": "Who approved this journal entry?", "context": "Tracer une autorisation — anti-fraude."}, {"id": "en_p_aud_012", "category": "audit_specific", "level": "B2", "fr": "Existe-t-il une piste d'audit complète ?", "en": "Is there a full audit trail available?", "context": "Vérifier la traçabilité d'une transaction."}, {"id": "en_p_aud_013", "category": "audit_specific", "level": "B2", "fr": "Avez-vous identifié des changements de méthode cette année ?", "en": "Have you identified any changes in accounting policy this year?", "context": "Question IAS 8 classique."}, {"id": "en_p_aud_014", "category": "audit_specific", "level": "B2", "fr": "Le test de dépréciation a-t-il été mis à jour ?", "en": "Has the impairment test been updated?", "context": "Vérifier le statut d'un test IAS 36."}, {"id": "en_p_aud_015", "category": "audit_specific", "level": "B2", "fr": "Nous proposons un ajustement d'audit de CHF X.", "en": "We propose an audit adjustment of CHF X.", "context": "Communication d'un AJE (audit journal entry)."}, {"id": "en_p_aud_016", "category": "audit_specific", "level": "B2", "fr": "Cet écart serait-il au-dessus du seuil de signification ?", "en": "Would this misstatement exceed materiality?", "context": "Évaluation de matérialité."}, {"id": "en_p_aud_017", "category": "audit_specific", "level": "B2", "fr": "Nous avons besoin de la confirmation directe de votre banque.", "en": "We need direct confirmation from your bank.", "context": "Procédure de confirmation externe."}, {"id": "en_p_aud_018", "category": "audit_specific", "level": "B2", "fr": "Pouvez-vous signer la lettre de représentation finale ?", "en": "Could you sign the final management representation letter?", "context": "Demande finale du LOR (Letter of Representation)."}, {"id": "en_p_aud_019", "category": "audit_specific", "level": "B2", "fr": "Nous prévoyons d'émettre le rapport le 31 mars.", "en": "We plan to issue the report on 31 March.", "context": "Communication du timing du rapport."}, {"id": "en_p_aud_020", "category": "audit_specific", "level": "B2", "fr": "Sous réserve de la finalisation de nos travaux,", "en": "Subject to the completion of our work,", "context": "Précaution standard avant le sign-off."}, {"id": "en_p_stat_001", "category": "status_update", "level": "B1", "fr": "Voici un point d'avancement rapide.", "en": "Here's a quick status update.", "context": "Ouverture d'un email/réunion de status."}, {"id": "en_p_stat_002", "category": "status_update", "level": "B1", "fr": "Nous sommes dans les temps.", "en": "We're on track.", "context": "Statut positif standard."}, {"id": "en_p_stat_003", "category": "status_update", "level": "B1", "fr": "Nous avons un léger retard de 2 jours.", "en": "We're slightly behind by 2 days.", "context": "Annoncer un retard sans dramatiser."}, {"id": "en_p_stat_004", "category": "status_update", "level": "B2", "fr": "Le cycle achats est terminé et validé.", "en": "The purchase cycle is complete and signed off.", "context": "Statut de cycle audit."}, {"id": "en_p_stat_005", "category": "status_update", "level": "B1", "fr": "Nous sommes en attente du retour client sur 3 sujets.", "en": "We're awaiting client feedback on 3 items.", "context": "Identifier les points pending."}, {"id": "en_p_stat_006", "category": "status_update", "level": "B2", "fr": "Le principal risque sur le planning est l'accès IT.", "en": "The main risk to the timeline is IT access.", "context": "Communiquer un risque planning."}, {"id": "en_p_stat_007", "category": "status_update", "level": "B2", "fr": "Nous avons besoin d'une décision d'ici vendredi.", "en": "We need a decision by Friday.", "context": "Demande de décision avec échéance."}, {"id": "en_p_stat_008", "category": "status_update", "level": "B2", "fr": "Pas de blocage à signaler à ce stade.", "en": "No blockers to flag at this stage.", "context": "Confirmation d'absence de problème."}, {"id": "en_p_stat_009", "category": "status_update", "level": "B2", "fr": "Voici les trois points clés à retenir.", "en": "Here are the three key takeaways.", "context": "Conclusion structurée — pattern Big 4."}, {"id": "en_p_stat_010", "category": "status_update", "level": "B2", "fr": "Prochaine étape : revue par le partner vendredi.", "en": "Next step: partner review on Friday.", "context": "Annoncer la prochaine étape."}, {"id": "en_p_open_021", "category": "email_opening", "level": "B2", "fr": "Suite à mon précédent email,", "en": "Following up on my previous email,", "context": "Re-relance professionnelle d'un sujet ouvert."}, {"id": "en_p_open_022", "category": "email_opening", "level": "B2", "fr": "Je reviens vers vous sur ce sujet.", "en": "I wanted to circle back on this.", "context": "Re-engager un sujet pendant — formule très utilisée en Big 4."}, {"id": "en_p_open_023", "category": "email_opening", "level": "B2", "fr": "Comme convenu lors de notre échange,", "en": "As per our discussion,", "context": "Référence à une décision orale, ton formel — fréquent en audit."}, {"id": "en_p_close_021", "category": "email_closing", "level": "B2", "fr": "Pour lever toute ambiguïté, voici la clarification :", "en": "For the avoidance of doubt, please find clarification below:", "context": "Formule très professionnelle pour préciser un point sensible."}, {"id": "en_p_close_022", "category": "email_closing", "level": "B2", "fr": "Si vous avez besoin de précisions complémentaires, n'hésitez pas.", "en": "Should you require further information, please don't hesitate to reach out.", "context": "Clôture formelle — registre soutenu adapté au client ou au partner."}, {"id": "en_p_close_023", "category": "email_closing", "level": "B2", "fr": "Nous serions reconnaissants d'avoir votre retour.", "en": "We would be grateful for your input on this matter.", "context": "Demande de feedback formelle — formule polie soutenue."}, {"id": "en_p_clar_011", "category": "clarification", "level": "B2", "fr": "Je me ferais un plaisir de vous expliquer notre raisonnement.", "en": "I'd be happy to walk you through our reasoning.", "context": "Offre proactive d'explication — utile en revue partner / client."}, {"id": "en_p_stat_011", "category": "status_update", "level": "B2", "fr": "Je voulais signaler un point en suspens.", "en": "I wanted to flag one outstanding item.", "context": "Annoncer un sujet pending sans alarmer — communication interne."}, {"id": "en_p_close_024", "category": "email_closing", "level": "B2", "fr": "Au plaisir d'échanger très prochainement,", "en": "Looking forward to our next exchange,", "context": "Clôture orientée action — engage la suite sans sembler informelle."}, {"id": "en_p_close_025", "category": "email_closing", "level": "B2", "fr": "Je reviens vers vous d'ici la fin de la semaine.", "en": "I'll get back to you by the end of the week.", "context": "Engagement de réponse avec timing — utile en audit."}], "patterns": [{"id": "pat_af_001", "category": "audit_findings", "level": "B2", "fr_template": "Sur la base de nos procédures, nous avons constaté que {x}.", "en_template": "Based on our procedures, we noted that {x}.", "context": "Phrase d'ouverture d'une constatation d'audit. Très utilisée dans les mémos.", "examples": [{"fr": "trois écritures manuelles n'avaient pas été autorisées", "en": "three journal entries had not been authorised"}, {"fr": "le rapprochement bancaire de décembre n'avait pas été effectué", "en": "the December bank reconciliation had not been performed"}, {"fr": "la séparation des tâches était inadéquate sur le cycle achats", "en": "segregation of duties was inadequate on the purchase cycle"}]}, {"id": "pat_af_002", "category": "audit_findings", "level": "B2", "fr_template": "Nos tests ont révélé {x}.", "en_template": "Our testing revealed {x}.", "context": "Communication factuelle d'un résultat de test.", "examples": [{"fr": "une anomalie de 80 000 CHF sur les stocks", "en": "a misstatement of CHF 80,000 on inventories"}, {"fr": "plusieurs incohérences dans la séquence numérique des factures", "en": "several gaps in the invoice sequence"}, {"fr": "aucune exception sur les 30 éléments testés", "en": "no exceptions on the 30 items tested"}]}, {"id": "pat_af_003", "category": "audit_findings", "level": "B2", "fr_template": "Le contrôle {ctrl} ne fonctionnait pas efficacement car {x}.", "en_template": "The {ctrl} was not operating effectively because {x}.", "context": "Conclusion sur une déficience de contrôle.", "examples": [{"fr": "ctrl=contrôle d'approbation / x=aucune piste d'audit n'a été conservée", "en": "ctrl=approval control / x=no audit trail was retained"}, {"fr": "ctrl=rapprochement mensuel / x=il n'a pas été effectué sur trois mois", "en": "ctrl=monthly reconciliation / x=it was not performed for three months"}]}, {"id": "pat_af_004", "category": "audit_findings", "level": "B2", "fr_template": "Nous n'avons pas pu obtenir d'éléments probants suffisants concernant {x}.", "en_template": "We were unable to obtain sufficient audit evidence regarding {x}.", "context": "Formule indiquant une limitation — peut mener à une réserve.", "examples": [{"fr": "la valorisation du goodwill au 31 décembre", "en": "the valuation of goodwill at 31 December"}, {"fr": "l'existence des stocks dans l'entrepôt italien", "en": "the existence of inventories at the Italian warehouse"}]}, {"id": "pat_af_005", "category": "audit_findings", "level": "B2", "fr_template": "Sous réserve de la finalisation de nos travaux, {x}.", "en_template": "Subject to the completion of our work, {x}.", "context": "Précaution standard avant un sign-off préliminaire.", "examples": [{"fr": "nous n'avons pas identifié d'autres ajustements significatifs", "en": "we have not identified further material adjustments"}, {"fr": "nous prévoyons d'émettre une opinion sans réserve", "en": "we plan to issue an unqualified opinion"}]}, {"id": "pat_af_006", "category": "audit_findings", "level": "B2", "fr_template": "Nous recommandons que {x}.", "en_template": "We recommend that {x}.", "context": "Recommandation dans une lettre de recommandations.", "examples": [{"fr": "la séparation des tâches soit renforcée sur le cycle paie", "en": "segregation of duties be strengthened on the payroll cycle"}, {"fr": "les rapprochements soient effectués mensuellement", "en": "reconciliations be performed on a monthly basis"}]}, {"id": "pat_aq_001", "category": "audit_questions", "level": "B2", "fr_template": "Pouvez-vous m'expliquer le processus pour {x} ?", "en_template": "Could you walk me through the process for {x}?", "context": "Demande de walkthrough — phrase clé du métier.", "examples": [{"fr": "approuver une nouvelle facture fournisseur", "en": "approving a new supplier invoice"}, {"fr": "clôturer les comptes en fin de mois", "en": "closing the books at month-end"}, {"fr": "évaluer les stocks à la fin de l'exercice", "en": "valuing inventories at year-end"}]}, {"id": "pat_aq_002", "category": "audit_questions", "level": "B2", "fr_template": "Quelle est la justification de {x} ?", "en_template": "What is the rationale behind {x}?", "context": "Demander la raison d'une décision comptable ou opérationnelle.", "examples": [{"fr": "ce changement de taux d'amortissement", "en": "this change in depreciation rate"}, {"fr": "la décision de capitaliser ces coûts", "en": "the decision to capitalise these costs"}]}, {"id": "pat_aq_003", "category": "audit_questions", "level": "B2", "fr_template": "Qui est responsable de {x} ?", "en_template": "Who is responsible for {x}?", "context": "Identifier le propriétaire d'un processus ou contrôle.", "examples": [{"fr": "l'approbation des écritures manuelles", "en": "approving manual journal entries"}, {"fr": "le rapprochement bancaire mensuel", "en": "the monthly bank reconciliation"}]}, {"id": "pat_aq_004", "category": "audit_questions", "level": "B2", "fr_template": "À quelle fréquence {x} ?", "en_template": "How often does {x} occur?", "context": "Évaluer la fréquence d'un événement ou contrôle.", "examples": [{"fr": "ce contrôle est-il effectué", "en": "this control take place"}, {"fr": "la direction revoit-elle les comptes intermédiaires", "en": "management review interim accounts"}]}, {"id": "pat_aq_005", "category": "audit_questions", "level": "B2", "fr_template": "Existe-t-il une documentation justifiant {x} ?", "en_template": "Is there any documentation supporting {x}?", "context": "Demande de pièces justificatives.", "examples": [{"fr": "ce calcul de provision", "en": "this provision calculation"}, {"fr": "le test de dépréciation effectué", "en": "the impairment test performed"}]}, {"id": "pat_aq_006", "category": "audit_questions", "level": "B2", "fr_template": "Comment vous êtes-vous assuré que {x} ?", "en_template": "How did you make sure that {x}?", "context": "Forcer le client à expliquer son contrôle qualité.", "examples": [{"fr": "toutes les ventes ont été correctement comptabilisées", "en": "all sales were properly recognised"}, {"fr": "le montant retenu est exhaustif", "en": "the amount captured is complete"}]}, {"id": "pat_ep_001", "category": "email_pro", "level": "B1", "fr_template": "Veuillez trouver en pièce jointe {x}.", "en_template": "Please find attached {x}.", "context": "Formule standard pour annoncer une pièce jointe.", "examples": [{"fr": "le mémo IFRS 15 finalisé", "en": "the finalised IFRS 15 memo"}, {"fr": "la lettre de mission signée", "en": "the signed engagement letter"}, {"fr": "notre proposition d'honoraires révisée", "en": "our revised fee proposal"}]}, {"id": "pat_ep_002", "category": "email_pro", "level": "B2", "fr_template": "Je vous serais reconnaissant de bien vouloir {x}.", "en_template": "I would appreciate it if you could {x}.", "context": "Demande polie et formelle.", "examples": [{"fr": "nous transmettre la balance générale d'ici jeudi", "en": "send us the general ledger by Thursday"}, {"fr": "nous communiquer le nom du référent IT", "en": "share with us the name of the IT contact"}, {"fr": "confirmer la disponibilité de votre équipe la semaine prochaine", "en": "confirm your team's availability next week"}]}, {"id": "pat_ep_003", "category": "email_pro", "level": "B1", "fr_template": "À toutes fins utiles, {x}.", "en_template": "For your information, {x}.", "context": "Transmettre une information sans demander d'action.", "examples": [{"fr": "nous démarrons l'audit lundi 8 janvier", "en": "we are starting the audit on Monday, 8 January"}, {"fr": "le partner a validé l'approche", "en": "the partner has approved the approach"}]}, {"id": "pat_ep_004", "category": "email_pro", "level": "B2", "fr_template": "Dans l'attente de {x},", "en_template": "Looking forward to {x},", "context": "Clôture d'email orientée action.", "examples": [{"fr": "votre retour sur ce sujet", "en": "your feedback on this matter"}, {"fr": "notre prochain échange", "en": "our next discussion"}, {"fr": "vous rencontrer la semaine prochaine", "en": "meeting with you next week"}]}, {"id": "pat_ep_005", "category": "email_pro", "level": "B1", "fr_template": "N'hésitez pas à me faire savoir si {x}.", "en_template": "Please let me know if {x}.", "context": "Invitation à donner suite.", "examples": [{"fr": "vous avez besoin de précisions supplémentaires", "en": "you need any further clarification"}, {"fr": "le timing ne vous convient pas", "en": "the timing does not work for you"}]}, {"id": "pat_ep_006", "category": "email_pro", "level": "B2", "fr_template": "Pour donner suite à notre échange, {x}.", "en_template": "Further to our discussion, {x}.", "context": "Reprendre un sujet déjà discuté.", "examples": [{"fr": "voici les points convenus", "en": "please find below the points agreed"}, {"fr": "nous avons révisé notre approche", "en": "we have revised our approach"}]}, {"id": "pat_mt_001", "category": "meeting", "level": "B1", "fr_template": "Je voudrais revenir sur {x}.", "en_template": "I'd like to follow up on {x}.", "context": "Reprendre un point précédent en réunion.", "examples": [{"fr": "la question soulevée la semaine dernière", "en": "the question raised last week"}, {"fr": "le point d'action numéro trois", "en": "action item number three"}]}, {"id": "pat_mt_002", "category": "meeting", "level": "B2", "fr_template": "Pour résumer, les points clés sont : {x}.", "en_template": "To summarise, the key points are: {x}.", "context": "Synthèse en fin de réunion — pattern Big 4.", "examples": [{"fr": "nous avons besoin d'un partner sign-off d'ici vendredi", "en": "we need partner sign-off by Friday"}, {"fr": "le client doit nous fournir trois documents supplémentaires", "en": "the client must provide three additional documents"}]}, {"id": "pat_mt_003", "category": "meeting", "level": "B2", "fr_template": "Revenons à {x} après la réunion.", "en_template": "Let's circle back to {x} after the meeting.", "context": "Différer un sujet en parking.", "examples": [{"fr": "la question de la valorisation des stocks", "en": "the inventory valuation question"}, {"fr": "la révision du planning", "en": "the timeline review"}]}, {"id": "pat_mt_004", "category": "meeting", "level": "B1", "fr_template": "Pouvons-nous passer à {x} ?", "en_template": "Could we move on to {x}?", "context": "Faire avancer la réunion vers le point suivant.", "examples": [{"fr": "le point suivant", "en": "the next item"}, {"fr": "la revue des recommandations", "en": "the review of recommendations"}]}, {"id": "pat_mt_005", "category": "meeting", "level": "B2", "fr_template": "Je souhaiterais soulever une préoccupation sur {x}.", "en_template": "I'd like to raise a concern about {x}.", "context": "Formule diplomatique pour exprimer un désaccord.", "examples": [{"fr": "le niveau de détail des justifications", "en": "the level of detail of the supporting evidence"}, {"fr": "la qualification du risque proposée", "en": "the proposed risk rating"}]}, {"id": "pat_mt_006", "category": "meeting", "level": "B2", "fr_template": "Êtes-vous d'accord pour que {x} ?", "en_template": "Are you OK if {x}?", "context": "Vérifier un consensus avant d'agir.", "examples": [{"fr": "nous finalisions le mémo d'ici vendredi", "en": "we finalise the memo by Friday"}, {"fr": "je prenne la rédaction de la section IFRS 15", "en": "I take ownership of the IFRS 15 section"}]}, {"id": "pat_ie_001", "category": "ifrs_explanations", "level": "B2", "fr_template": "Selon IFRS {n}, {x}.", "en_template": "Under IFRS {n}, {x}.", "context": "Citer une norme spécifique.", "examples": [{"fr": "n=15 / x=la reconnaissance du revenu suit un modèle en cinq étapes", "en": "n=15 / x=revenue recognition follows a five-step model"}, {"fr": "n=16 / x=tous les contrats de location sont comptabilisés au bilan du preneur", "en": "n=16 / x=all leases are recognised on the lessee's balance sheet"}]}, {"id": "pat_ie_002", "category": "ifrs_explanations", "level": "B2", "fr_template": "{Element} doit être comptabilisé à {base d'évaluation}.", "en_template": "{Element} should be recognised at {measurement basis}.", "context": "Décrire une base d'évaluation IFRS.", "examples": [{"fr": "Element=Le stock / base=la plus faible du coût et de la valeur nette de réalisation", "en": "Element=Inventory / basis=the lower of cost and net realisable value"}, {"fr": "Element=Le passif de location / base=la valeur actualisée des paiements futurs", "en": "Element=The lease liability / basis=the present value of future payments"}]}, {"id": "pat_ie_003", "category": "ifrs_explanations", "level": "B2", "fr_template": "La valeur comptable de {actif} est réduite lorsque {condition}.", "en_template": "The carrying amount of {asset} is reduced when {condition}.", "context": "Décrire un mécanisme de dépréciation IAS 36.", "examples": [{"fr": "actif=du goodwill / condition=la valeur recouvrable est inférieure", "en": "asset=goodwill / condition=the recoverable amount is lower"}, {"fr": "actif=des créances clients / condition=les pertes de crédit attendues augmentent", "en": "asset=trade receivables / condition=expected credit losses increase"}]}, {"id": "pat_ie_004", "category": "ifrs_explanations", "level": "B2", "fr_template": "Le traitement comptable dépend de {x}.", "en_template": "The accounting treatment depends on {x}.", "context": "Annoncer un cas à scénarios multiples.", "examples": [{"fr": "la nature du contrôle obtenu", "en": "the nature of control obtained"}, {"fr": "la durée résiduelle du contrat", "en": "the remaining contract term"}, {"fr": "l'existence d'une obligation actuelle", "en": "whether a present obligation exists"}]}, {"id": "pat_ie_005", "category": "ifrs_explanations", "level": "B2", "fr_template": "Cela générerait {x}.", "en_template": "This would give rise to {x}.", "context": "Décrire la conséquence comptable d'une transaction.", "examples": [{"fr": "un passif d'impôt différé", "en": "a deferred tax liability"}, {"fr": "un gain reconnu en autres éléments du résultat global", "en": "a gain recognised in other comprehensive income"}, {"fr": "une perte de valeur de 1,5 million de CHF", "en": "an impairment loss of CHF 1.5 million"}]}, {"id": "pat_ie_006", "category": "ifrs_explanations", "level": "B2", "fr_template": "Cela répond aux critères de {x}.", "en_template": "This meets the criteria for {x}.", "context": "Conclure une analyse IFRS positive.", "examples": [{"fr": "reconnaissance d'un actif incorporel", "en": "intangible asset recognition"}, {"fr": "capitalisation des coûts d'emprunt", "en": "borrowing cost capitalisation"}, {"fr": "comptabilisation en tant que produit", "en": "revenue recognition"}]}, {"id": "pat_cc_001", "category": "client_communication", "level": "B1", "fr_template": "Petit rappel : {x}.", "en_template": "Just a gentle reminder that {x}.", "context": "Relance douce mais claire.", "examples": [{"fr": "le mémo est attendu pour vendredi", "en": "the memo is due by Friday"}, {"fr": "nous attendons la confirmation bancaire", "en": "we are still waiting for the bank confirmation"}]}, {"id": "pat_cc_002", "category": "client_communication", "level": "B2", "fr_template": "Veuillez nous excuser pour {x}.", "en_template": "Apologies for {x}.", "context": "Excuse formelle.", "examples": [{"fr": "le délai de réponse", "en": "the delay in responding"}, {"fr": "toute gêne occasionnée par ce changement", "en": "any inconvenience caused by this change"}]}, {"id": "pat_cc_003", "category": "client_communication", "level": "B2", "fr_template": "Nous en aurons besoin avant {date} pour {raison}.", "en_template": "We will need this by {deadline} in order to {purpose}.", "context": "Justifier un timing avec la raison.", "examples": [{"fr": "date=vendredi 18h / raison=finaliser le mémo", "en": "deadline=Friday 6 p.m. / purpose=finalise the memo"}, {"fr": "date=lundi prochain / raison=respecter le calendrier de revue partner", "en": "deadline=next Monday / purpose=meet the partner review schedule"}]}, {"id": "pat_cc_004", "category": "client_communication", "level": "B2", "fr_template": "Pouvez-vous confirmer si {x} ?", "en_template": "Could you confirm whether {x}?", "context": "Demande de validation formelle.", "examples": [{"fr": "la facture jointe a déjà été comptabilisée", "en": "the attached invoice has already been booked"}, {"fr": "le contrat ci-joint est la dernière version", "en": "the attached contract is the latest version"}]}, {"id": "pat_cc_005", "category": "client_communication", "level": "B2", "fr_template": "Pour faciliter le traitement, {x}.", "en_template": "To help us process this faster, {x}.", "context": "Inviter le client à structurer sa réponse.", "examples": [{"fr": "merci de répondre directement dans le tableau ci-joint", "en": "please reply directly within the attached table"}, {"fr": "merci d'inclure les références pièces dans votre réponse", "en": "please include the document references in your reply"}]}, {"id": "pat_cc_006", "category": "client_communication", "level": "B2", "fr_template": "Si {condition}, alors {action}.", "en_template": "If {condition}, then {action}.", "context": "Conditionner une action — fréquent en communication client.", "examples": [{"fr": "condition=l'audit s'étend au-delà du périmètre / action=nous devrons réviser nos honoraires", "en": "condition=the audit extends beyond the agreed scope / action=we will need to revise our fees"}, {"fr": "condition=vous ne pouvez pas fournir le détail / action=nous mentionnerons cette limitation", "en": "condition=you cannot provide the breakdown / action=we will flag this limitation"}]}, {"id": "pat_dec_001", "category": "decline", "level": "B2", "fr_template": "J'apprécie l'urgence, mais réalistiquement, {x} sans compromettre la qualité.", "en_template": "I appreciate the urgency, but realistically, {x} without compromising on quality.", "context": "Décliner une demande pressante sans casser la relation.", "examples": [{"fr": "nous ne pouvons pas livrer cela d'ici demain", "en": "we can't deliver this by tomorrow"}, {"fr": "nous ne pouvons pas étendre le périmètre", "en": "we can't extend the scope"}]}, {"id": "pat_dec_002", "category": "decline", "level": "B2", "fr_template": "Je ne suis malheureusement pas en mesure de {x}, mais je peux {y}.", "en_template": "I'm unfortunately not in a position to {x}, but I can {y}.", "context": "Refus avec alternative concrète.", "examples": [{"fr": "x=signer ce document avant la revue partner / y=organiser cette revue dès demain", "en": "x=sign this document before partner review / y=organise that review for tomorrow"}, {"fr": "x=accepter ce périmètre dans nos honoraires actuels / y=préparer un addendum pour le scope additionnel", "en": "x=accept this scope within our current fees / y=prepare an addendum for the additional scope"}]}, {"id": "pat_dec_003", "category": "decline", "level": "B2", "fr_template": "C'est un point juste, néanmoins {x}.", "en_template": "That's a fair point, however {x}.", "context": "Reconnaître l'argument avant de refuser — sandwich diplomatique.", "examples": [{"fr": "notre méthodologie nous impose de tester un échantillon plus large", "en": "our methodology requires testing a larger sample"}, {"fr": "la matérialité ne nous permet pas d'ignorer cet écart", "en": "materiality doesn't allow us to ignore this variance"}]}, {"id": "pat_dec_004", "category": "decline", "level": "B2", "fr_template": "Je préférerais ne pas {x} sans en avoir d'abord discuté avec {y}.", "en_template": "I'd rather not {x} without discussing it first with {y}.", "context": "Décliner en pointant vers une validation hiérarchique nécessaire.", "examples": [{"fr": "x=valider cette position / y=mon manager", "en": "x=sign off on this position / y=my manager"}, {"fr": "x=engager ce changement / y=l'équipe IFRS technique", "en": "x=commit to this change / y=the technical IFRS team"}]}, {"id": "pat_neg_001", "category": "negotiate", "level": "B2", "fr_template": "Pourrions-nous trouver un accord sur {x} ?", "en_template": "Could we reach an agreement on {x}?", "context": "Ouverture de négociation neutre et constructive.", "examples": [{"fr": "un délai en deux temps : synthèse vendredi, détail mardi", "en": "a two-step timeline: summary by Friday, full version Tuesday"}, {"fr": "une révision des honoraires reflétant le scope additionnel", "en": "a fee revision reflecting the additional scope"}]}, {"id": "pat_neg_002", "category": "negotiate", "level": "B2", "fr_template": "Si {condition}, alors {contre-proposition}.", "en_template": "If {condition}, then {counter-proposal}.", "context": "Lier une concession à une contrepartie.", "examples": [{"fr": "condition=vous avez besoin du rapport pour lundi / contre-proposition=nous aurons besoin de tous les documents d'ici jeudi midi", "en": "condition=you need the report by Monday / counter-proposal=we'll need all documents by Thursday noon"}, {"fr": "condition=vous voulez l'opinion sans réserve / contre-proposition=la documentation sur ce point devra être renforcée", "en": "condition=you want an unqualified opinion / counter-proposal=the documentation on this point will need to be strengthened"}]}, {"id": "pat_neg_003", "category": "negotiate", "level": "B2", "fr_template": "Ce qui marcherait pour nous, c'est {x}.", "en_template": "What would work on our side is {x}.", "context": "Affirmer ce dont on a besoin sans agressivité.", "examples": [{"fr": "recevoir la balance avant le 15 janvier", "en": "receiving the trial balance before 15 January"}, {"fr": "avoir un point de mi-parcours en février", "en": "having a mid-engagement check-in in February"}]}, {"id": "pat_neg_004", "category": "negotiate", "level": "B2", "fr_template": "Pouvons-nous nous mettre d'accord sur {x} et revoir {y} ensuite ?", "en_template": "Can we agree on {x} and revisit {y} later?", "context": "Découper un sujet pour avancer.", "examples": [{"fr": "x=le périmètre de base / y=les éventuelles extensions", "en": "x=the core scope / y=any potential extensions"}, {"fr": "x=le mémo sur l'impairment / y=le test de sensibilité", "en": "x=the impairment memo / y=the sensitivity test"}]}, {"id": "pat_def_001", "category": "defend_position", "level": "B2", "fr_template": "Notre position s'appuie sur {x}.", "en_template": "Our position is based on {x}.", "context": "Ancrer une conclusion sur une référence solide.", "examples": [{"fr": "le paragraphe 31 d'IFRS 15", "en": "paragraph 31 of IFRS 15"}, {"fr": "les éléments probants détaillés en section 4 du mémo", "en": "the audit evidence detailed in section 4 of the memo"}]}, {"id": "pat_def_002", "category": "defend_position", "level": "B2", "fr_template": "Nous avons considéré {alternative}, mais conclu que {raison}.", "en_template": "We considered {alternative} but concluded that {reason}.", "context": "Montrer qu'on a évalué d'autres pistes avant de conclure.", "examples": [{"fr": "alternative=la position du client / raison=elle ne reflète pas la substance de la transaction", "en": "alternative=the client's view / reason=it does not reflect the substance of the transaction"}, {"fr": "alternative=un retraitement prospectif / raison=l'erreur est antérieure à la période courante", "en": "alternative=a prospective restatement / reason=the error predates the current period"}]}, {"id": "pat_def_003", "category": "defend_position", "level": "B2", "fr_template": "L'analyse de sensibilité confirme que {x}.", "en_template": "The sensitivity analysis confirms that {x}.", "context": "Soutenir une position par un test chiffré.", "examples": [{"fr": "la conclusion tient même avec un taux d'actualisation 200bps plus faible", "en": "the conclusion holds even with a discount rate 200bps lower"}, {"fr": "l'impairment demeure significatif dans tous les scénarios testés", "en": "the impairment remains material under all scenarios tested"}]}, {"id": "pat_def_004", "category": "defend_position", "level": "B2", "fr_template": "Je suis ouvert à reconsidérer si {nouvelle information}.", "en_template": "I'm open to reconsidering if {new information}.", "context": "Défendre tout en gardant la porte ouverte — très professionnel.", "examples": [{"fr": "vous pouvez fournir des éléments factuels supplémentaires", "en": "you can provide additional factual evidence"}, {"fr": "le scope est étendu et formellement documenté", "en": "the scope is extended and formally documented"}]}, {"id": "pat_del_001", "category": "request_delay", "level": "B2", "fr_template": "Compte tenu de {raison}, pourrions-nous viser {nouveau délai} au lieu de {ancien délai} ?", "en_template": "Given {reason}, could we aim for {new deadline} instead of {old deadline}?", "context": "Demande de délai justifiée et chiffrée.", "examples": [{"fr": "raison=la complexité de l'analyse IFRS 9 / nouveau=jeudi soir / ancien=mercredi midi", "en": "reason=the complexity of the IFRS 9 analysis / new=Thursday evening / old=Wednesday noon"}, {"fr": "raison=la réception tardive des documents / nouveau=mardi prochain / ancien=vendredi", "en": "reason=the late receipt of documents / new=next Tuesday / old=Friday"}]}, {"id": "pat_del_002", "category": "request_delay", "level": "B2", "fr_template": "J'aurais besoin d'un délai supplémentaire de {durée} pour {raison}.", "en_template": "I'd need an additional {duration} to {reason}.", "context": "Demande de délai concise et précise.", "examples": [{"fr": "durée=deux jours / raison=incorporer le retour du partner", "en": "duration=two days / reason=incorporate the partner's feedback"}, {"fr": "durée=une semaine / raison=finaliser le test de matérialité", "en": "duration=one week / reason=finalise the materiality test"}]}, {"id": "pat_del_003", "category": "request_delay", "level": "B2", "fr_template": "Pour livrer du travail de qualité, nous aurions besoin de {x}.", "en_template": "To deliver quality work, we would need {x}.", "context": "Justifier un délai par la qualité (argument valorisant).", "examples": [{"fr": "48 heures supplémentaires", "en": "an additional 48 hours"}, {"fr": "trois jours ouvrés après réception des derniers éléments", "en": "three working days after receiving the final documents"}]}, {"id": "pat_del_004", "category": "request_delay", "level": "B2", "fr_template": "Si nous fixons {nouveau délai}, nous pouvons garantir {résultat}.", "en_template": "If we set {new deadline}, we can guarantee {outcome}.", "context": "Échanger un délai contre un engagement de qualité.", "examples": [{"fr": "nouveau délai=vendredi 18h / résultat=un premier draft revu par le manager", "en": "new deadline=Friday 6pm / outcome=a manager-reviewed first draft"}, {"fr": "nouveau délai=lundi midi / résultat=un mémo prêt pour la revue partner", "en": "new deadline=Monday noon / outcome=a memo ready for partner review"}]}, {"id": "pat_cau_001", "category": "express_caution", "level": "B2", "fr_template": "Je voudrais signaler une réserve sur {x}.", "en_template": "I'd like to flag a reservation about {x}.", "context": "Exprimer une prudence sans bloquer.", "examples": [{"fr": "la méthodologie retenue par le client", "en": "the methodology applied by the client"}, {"fr": "la qualité des données sous-jacentes", "en": "the quality of the underlying data"}]}, {"id": "pat_cau_002", "category": "express_caution", "level": "B2", "fr_template": "Avant d'aller plus loin, il faudrait clarifier {x}.", "en_template": "Before moving forward, we should clarify {x}.", "context": "Mettre une pause prudente sans paraître obstructionniste.", "examples": [{"fr": "le périmètre exact de la mission", "en": "the exact scope of the engagement"}, {"fr": "la position du comité technique sur ce point", "en": "the technical committee's view on this point"}]}, {"id": "pat_cau_003", "category": "express_caution", "level": "B2", "fr_template": "Cette conclusion repose sur l'hypothèse que {x}.", "en_template": "This conclusion relies on the assumption that {x}.", "context": "Rendre explicite une hypothèse clé.", "examples": [{"fr": "le client maintient ses prévisions de croissance", "en": "the client maintains its growth forecasts"}, {"fr": "aucun changement majeur n'intervient avant la clôture", "en": "no material change occurs before year-end"}]}, {"id": "pat_cau_004", "category": "express_caution", "level": "B2", "fr_template": "Il convient de noter que {x}.", "en_template": "It is worth noting that {x}.", "context": "Pointer une nuance importante sans alarmer.", "examples": [{"fr": "cette méthode présuppose la stabilité du marché", "en": "this method assumes market stability"}, {"fr": "la jurisprudence sur ce sujet est limitée", "en": "case law on this matter is limited"}]}, {"id": "pat_ack_001", "category": "acknowledge_constraint", "level": "B2", "fr_template": "Je comprends la contrainte de {x} de votre côté.", "en_template": "I understand the {x} constraint on your side.", "context": "Reconnaître une contrainte du client — désamorce les tensions.", "examples": [{"fr": "timing", "en": "timing"}, {"fr": "budget", "en": "budget"}, {"fr": "ressources", "en": "resourcing"}]}, {"id": "pat_ack_002", "category": "acknowledge_constraint", "level": "B2", "fr_template": "Travaillons ensemble pour trouver un terrain d'entente sur {x}.", "en_template": "Let's work together to find common ground on {x}.", "context": "Inviter à la collaboration plutôt qu'au conflit.", "examples": [{"fr": "le périmètre des travaux", "en": "the scope of work"}, {"fr": "le planning de revue", "en": "the review timeline"}]}, {"id": "pat_ack_003", "category": "acknowledge_constraint", "level": "B2", "fr_template": "Je reconnais que {x} n'est pas idéal, mais {raison}.", "en_template": "I recognise that {x} isn't ideal, but {reason}.", "context": "Admettre une friction sans renoncer à sa position.", "examples": [{"fr": "x=le timing demandé / raison=la qualité doit primer sur la rapidité", "en": "x=the requested timing / reason=quality must come before speed"}, {"fr": "x=le périmètre élargi / raison=il est nécessaire pour conclure", "en": "x=the expanded scope / reason=it's necessary to conclude"}]}, {"id": "pat_ack_004", "category": "acknowledge_constraint", "level": "B2", "fr_template": "Compte tenu des circonstances, je propose {x}.", "en_template": "Given the circumstances, I suggest {x}.", "context": "Proposer une voie pragmatique face à un contexte difficile.", "examples": [{"fr": "un point intermédiaire dès demain matin", "en": "a check-in tomorrow morning"}, {"fr": "de redéfinir nos priorités sur le cycle achats", "en": "redefining our priorities on the purchase cycle"}]}], "videos": [{"id": "yt_ch_001", "kind": "channel", "theme": "channels", "title": "IFRS Foundation (officielle)", "url": "https://www.youtube.com/@IFRSFoundation", "description": "Chaîne officielle de l'IFRS Foundation. Webcasts, board meetings, introductions techniques aux nouvelles normes. La référence absolue.", "level": "B2"}, {"id": "yt_ch_002", "kind": "channel", "theme": "channels", "title": "EY Global", "url": "https://www.youtube.com/@EYGlobal", "description": "Chaîne globale d'EY. Témoignages, insights métier, culture du cabinet — utile pour comprendre la culture EY avant ton arrivée.", "level": "B1"}, {"id": "yt_ch_003", "kind": "channel", "theme": "channels", "title": "PwC", "url": "https://www.youtube.com/@PwC", "description": "Chaîne du concurrent direct PwC. Insights audit/conseil et tendances IFRS. Comparer les approches entre Big 4.", "level": "B1"}, {"id": "yt_ch_004", "kind": "channel", "theme": "channels", "title": "KPMG", "url": "https://www.youtube.com/@KPMG", "description": "Chaîne KPMG. Webcasts techniques sur les normes IFRS et l'audit.", "level": "B1"}, {"id": "yt_ch_005", "kind": "channel", "theme": "channels", "title": "Deloitte", "url": "https://www.youtube.com/@Deloitte", "description": "Chaîne
