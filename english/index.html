: "vérification de l'enregistrement", "en": "tracing", "notes": "Suivre un document vers l'écriture comptable (validation exhaustivité).", "examples": [{"fr": "Le tracing des bons de livraison teste l'exhaustivité des ventes.", "en": "Tracing of delivery notes tests the completeness of sales."}]}, {"id": "en_v_aud_055", "domain": "audit", "level": "B1", "fr": "procédures de fin d'exercice", "en": "year-end procedures", "notes": "Travaux concentrés à la clôture (confirmations, coupure, inventaire).", "examples": [{"fr": "Les procédures de fin d'exercice débutent mi-décembre.", "en": "Year-end procedures start in mid-December."}]}, {"id": "en_v_aud_056", "domain": "audit", "level": "B2", "fr": "taille d'échantillon", "en": "sample size", "notes": "Dépend du risque, de la matérialité et de la confiance désirée.", "examples": [{"fr": "La taille d'échantillon retenue est de 60 éléments.", "en": "The sample size used is 60 items."}]}, {"id": "en_v_aud_057", "domain": "audit", "level": "B2", "fr": "risque d'échantillonnage", "en": "sampling risk", "notes": "Risque que la conclusion sur l'échantillon diffère de celle sur la population.", "examples": [{"fr": "Un échantillon plus grand réduit le risque d'échantillonnage.", "en": "A larger sample reduces sampling risk."}]}, {"id": "en_v_aud_058", "domain": "audit", "level": "B2", "fr": "échantillonnage par unités monétaires", "en": "monetary unit sampling (MUS)", "notes": "Probabilité proportionnelle à la valeur — favorise les montants élevés.", "examples": [{"fr": "MUS est privilégié pour tester l'existence des créances.", "en": "MUS is preferred for testing existence of receivables."}]}, {"id": "en_v_aud_059", "domain": "audit", "level": "B2", "fr": "extrapolation des anomalies", "en": "projection of misstatements", "notes": "Projeter les anomalies de l'échantillon à la population entière.", "examples": [{"fr": "L'extrapolation montre une anomalie probable totale de CHF 80'000.", "en": "The projection shows a likely total mi : "Attire l'attention sur un point déjà correctement présenté dans les EF.", "examples": [{"fr": "Un paragraphe d'observation a été ajouté sur la continuité.", "en": "An emphasis of matter paragraph was added on going concern."}]}, {"id": "en_v_aud_072", "domain": "audit", "level": "B2", "fr": "paragraphe autre point", "en": "other matter paragraph", "notes": "Communique un point pertinent non présenté dans les EF.", "examples": [{"fr": "Le paragraphe autre point réfère au rapport de l'année précédente.", "en": "The other matter paragraph refers to the prior year report."}]}, {"id": "en_v_aud_073", "domain": "audit", "level": "B2", "fr": "continuité d'exploitation", "en": "going concern", "ipa": "ˌɡəʊɪŋ kənˈsɜːn", "notes": "Hypothèse fondamentale des EF. Évaluation sur 12 mois minimum.", "examples": [{"fr": "L'évaluation de la continuité d'exploitation est cruciale en période de crise.", "en": "Going concern assessment is critical in times of crisis."}]}, {"id": "en_v_aud_074", "domain": "audit", "level": "B2", "fr": "norme de gestion de qualité ISQM 1", "en": "ISQM 1", "notes": "Norme cabinet — système de gestion de qualité (remplace ISQC 1).", "examples": [{"fr": "ISQM 1 impose une évaluation annuelle du système de qualité.", "en": "ISQM 1 requires an annual evaluation of the quality system."}]}, {"id": "en_v_aud_075", "domain": "audit", "level": "B2", "fr": "revue qualité de mission", "en": "engagement quality review (EQR)", "notes": "Revue indépendante par un associé non impliqué, avant émission du rapport.", "examples": [{"fr": "La revue qualité (EQR) est obligatoire sur les entités cotées.", "en": "EQR is mandatory for listed entities."}]}, {"id": "en_v_aud_076", "domain": "audit", "level": "B2", "fr": "menaces à l'indépendance", "en": "independence threats", "notes": "5 catégories : auto-révision, intérêt personnel, plaidoyer, familiarité, intimidation.", "examples": [{"fr": "Les menaces à l'indépendance doivent être réduites par des mesures de sauvegarde.",  les efforts là où le risque d'anomalie est le plus élevé.", "examples": [{"fr": "L'approche par les risques optimise l'allocation des heures.", "en": "The risk-based approach optimises hours allocation."}]}, {"id": "en_v_ifrs_001", "domain": "ifrs", "level": "A2", "fr": "états financiers", "en": "financial statements", "notes": "IAS 1. Comprend bilan, CR, état des CP, tableau de flux, annexes.", "examples": [{"fr": "Les états financiers sont présentés conformément à IAS 1.", "en": "The financial statements are presented in accordance with IAS 1."}]}, {"id": "en_v_ifrs_002", "domain": "ifrs", "level": "B1", "fr": "état de la situation financière", "en": "statement of financial position", "notes": "= bilan. Terminologie officielle IAS 1.", "examples": [{"fr": "L'état de la situation financière au 31 décembre.", "en": "The statement of financial position as at 31 December."}]}, {"id": "en_v_ifrs_003", "domain": "ifrs", "level": "B1", "fr": "compte de résultat", "en": "statement of profit or loss", "notes": "Aussi appelé income statement.", "examples": [{"fr": "Le compte de résultat présente les produits et charges de la période.", "en": "The statement of profit or loss presents income and expenses for the period."}]}, {"id": "en_v_ifrs_004", "domain": "ifrs", "level": "B2", "fr": "état du résultat global", "en": "statement of comprehensive income", "notes": "= P&L + autres éléments du résultat global (OCI).", "examples": [{"fr": "L'état du résultat global inclut les écarts de réévaluation.", "en": "The statement of comprehensive income includes revaluation gains."}]}, {"id": "en_v_ifrs_005", "domain": "ifrs", "level": "B1", "fr": "état des variations des capitaux propres", "en": "statement of changes in equity", "notes": "Mouvements sur chaque composante des CP entre N-1 et N.", "examples": [{"fr": "L'état des variations montre la distribution du dividende.", "en": "The statement of changes in equity shows the dividend distribution."}]}, {"id": "en_v_ifrs_006", "domain": "ifrs", "level": "B1", "fr": "tableau des flux de trésorerie", "en": "statement of cash flows", "notes": "IAS 7. Trois sections : exploitation, investissement, financement.", "examples": [{"fr": "Le tableau des flux distingue trois types d'activités.", "en": "The statement of cash flows distinguishes three types of activities."}]}, {"id": "en_v_ifrs_007", "domain": "ifrs", "level": "B1", "fr": "continuité d'exploitation", "en": "going concern", "notes": "Hypothèse de base IAS 1.25. Sinon, base liquidative.", "examples": [{"fr": "La direction confirme l'hypothèse de continuité d'exploitation.", "en": "Management confirms the going concern assumption."}]}, {"id": "en_v_ifrs_008", "domain": "ifrs", "level": "B1", "fr": "méthodes comptables", "en": "accounting policies", "notes": "Choix d'application des normes. Doivent être cohérentes et divulguées.", "examples": [{"fr": "Les méthodes comptables sont décrites en note 2.", "en": "The accounting policies are described in note 2."}]}, {"id": "en_v_ifrs_009", "domain": "ifrs", "level": "A2", "fr": "informations comparatives", "en": "comparative information", "notes": "N-1 obligatoirement présenté à côté de N.", "examples": [{"fr": "Les informations comparatives ont été retraitées.", "en": "The comparative information has been restated."}]}, {"id": "en_v_ifrs_010", "domain": "ifrs", "level": "B1", "fr": "annexes aux états financiers", "en": "notes to the financial statements", "notes": "Détaillent et expliquent les chiffres des états primaires.", "examples": [{"fr": "La note 12 détaille les immobilisations corporelles.", "en": "Note 12 details property, plant and equipment."}]}, {"id": "en_v_ifrs_011", "domain": "ifrs", "level": "A2", "fr": "stocks", "en": "inventory", "ipa": "ˈɪnvəntri", "notes": "IAS 2. Matières premières, en-cours, produits finis.", "examples": [{"fr": "Les stocks sont évalués au plus bas du coût et de la VNR.", "en": "Inventories are measured at the lower of cost and NRV."}]}, {"id": "en_v_ifrs_012", "domain": "ifrs", "level": "B1", "fr": "valeur nette de réalisation", "en": "net realisable value (NRV)", "notes": "Prix de vente estimé moins coûts d'achèvement et de vente.", "examples": [{"fr": "La VNR a chuté en dessous du coût pour les stocks obsolètes.", "en": "NRV dropped below cost for obsolete inventory."}]}, {"id": "en_v_ifrs_013", "domain": "ifrs", "level": "B1", "fr": "premier entré premier sorti", "en": "first-in first-out (FIFO)", "notes": "Méthode d'évaluation des sorties — autorisée par IAS 2.", "examples": [{"fr": "L'entité applique la méthode FIFO sur les matières premières.", "en": "The entity applies FIFO on raw materials."}]}, {"id": "en_v_ifrs_014", "domain": "ifrs", "level": "B1", "fr": "coût moyen pondéré", "en": "weighted average cost", "notes": "Méthode autorisée IAS 2. Recalculé à chaque entrée.", "examples": [{"fr": "Le coût moyen pondéré est appliqué aux produits finis.", "en": "The weighted average cost is applied to finished goods."}]}, {"id": "en_v_ifrs_015", "domain": "ifrs", "level": "B2", "fr": "coût d'acquisition des stocks", "en": "cost of inventories", "notes": "Inclut achat + coûts de transformation + coûts pour amener au lieu/état.", "examples": [{"fr": "Le coût des stocks inclut les frais de transport entrants.", "en": "The cost of inventories includes inbound freight."}]}, {"id": "en_v_ifrs_016", "domain": "ifrs", "level": "B1", "fr": "activités opérationnelles", "en": "operating activities", "notes": "Principales activités génératrices de revenus.", "examples": [{"fr": "Les flux des activités opérationnelles sont positifs.", "en": "Cash flows from operating activities are positive."}]}, {"id": "en_v_ifrs_017", "domain": "ifrs", "level": "B1", "fr": "activités d'investissement", "en": "investing activities", "notes": "Acquisitions/cessions d'actifs long terme et participations.", "examples": [{"fr": "Les activités d'investissement reflètent l'acquisition d'une machine.", "en": "Investing activities reflect the acquisition of a machine."}]}, {"id": "en_v_ifrs_018", "domain": "ifrs", "level": "B1", "fr": "activités de financement", "en": "financing activities", "notes": "Mouvements sur capital et dettes financières.", "examples": [{"fr": "L'émission d'obligations apparaît en activités de financement.", "en": "The bond issuance appears under financing activities."}]}, {"id": "en_v_ifrs_019", "domain": "ifrs", "level": "A2", "fr": "trésorerie et équivalents de trésorerie", "en": "cash and cash equivalents", "notes": "Placements à court terme, très liquides (≤ 3 mois).", "examples": [{"fr": "La trésorerie et équivalents s'élèvent à CHF 5 millions.", "en": "Cash and cash equivalents amount to CHF 5 million."}]}, {"id": "en_v_ifrs_020", "domain": "ifrs", "level": "B2", "fr": "méthode directe", "en": "direct method", "notes": "Présentation alternative des flux opérationnels (par catégorie).", "examples": [{"fr": "La méthode directe est encouragée mais peu utilisée.", "en": "The direct method is encouraged but rarely used."}]}, {"id": "en_v_ifrs_021", "domain": "ifrs", "level": "B1", "fr": "méthode comptable", "en": "accounting policy", "notes": "Principes, bases, conventions, règles d'application.", "examples": [{"fr": "Le changement de méthode comptable a été appliqué rétrospectivement.", "en": "The change in accounting policy was applied retrospectively."}]}, {"id": "en_v_ifrs_022", "domain": "ifrs", "level": "B2", "fr": "changement d'estimation", "en": "change in accounting estimate", "notes": "Application prospective. Ne pas confondre avec changement de méthode.", "examples": [{"fr": "La révision de la durée d'utilité est un changement d'estimation.", "en": "Revising the useful life is a change in accounting estimate."}]}, {"id": "en_v_ifrs_023", "domain": "ifrs", "level": "B2", "fr": "erreur de période antérieure", "en": "prior period error", "notes": "Application rétrospective. Retraite N-1 et CP d'ouverture.", "examples": [{"fr": "L'erreur de période antérieure a été corrigée par retraitement.", "en": "The prior period error was corrected by restatement."}]}, {"id": "en_v_ifrs_024", "domain": "ifrs", "level": "B2", "fr": "application rétrospective", "en": "retrospective application", "notes": "Comme si la nouvelle méthode avait toujours été appliquée.", "examples": [{"fr": "L'application rétrospective requiert le retraitement des comparatives.", "en": "Retrospective application requires restating the comparatives."}]}, {"id": "en_v_ifrs_025", "domain": "ifrs", "level": "B2", "fr": "application prospective", "en": "prospective application", "notes": "À partir de la date de changement, sans retraiter le passé.", "examples": [{"fr": "Les changements d'estimation suivent une application prospective.", "en": "Changes in estimate follow prospective application."}]}, {"id": "en_v_ifrs_026", "domain": "ifrs", "level": "B2", "fr": "événements ajustant les EF", "en": "adjusting events", "notes": "Confirment une situation existant à la clôture. Ajuster les comptes.", "examples": [{"fr": "La faillite d'un client en janvier est un événement ajustant.", "en": "A customer's bankruptcy in January is an adjusting event."}]}, {"id": "en_v_ifrs_027", "domain": "ifrs", "level": "B2", "fr": "événements non ajustants", "en": "non-adjusting events", "notes": "Postérieurs à la clôture mais sans lien avec la situation existante. Disclosure.", "examples": [{"fr": "L'incendie d'un site en janvier est un événement non ajustant.", "en": "A site fire in January is a non-adjusting event."}]}, {"id": "en_v_ifrs_028", "domain": "ifrs", "level": "B2", "fr": "date d'autorisation de publication", "en": "date of authorisation for issue", "notes": "Date jusqu'à laquelle les événements postérieurs sont considérés.", "examples": [{"fr": "La date d'autorisation de publication est le 28 février.", "en": "The date of authorisation for issue is 28 February."}]}, {"id": "en_v_ifrs_029", "domain": "ifrs", "level": "B1", "fr": "impôt courant", "en": "current tax", "notes": "Impôt dû ou récupérable sur le résultat fiscal de la période.", "examples": [{"fr": "L'impôt courant représente CHF 1.2 million.", "en": "Current tax amounts to CHF 1.2 million."}]}, {"id": "en_v_ifrs_030", "domain": "ifrs", "level": "B1", "fr": "impôt différé", "en": "deferred tax", "notes": "Impôt futur résultant des différences temporelles.", "examples": [{"fr": "L'impôt différé est calculé au taux attendu de réversion.", "en": "Deferred tax is computed at the expected reversal rate."}]}, {"id": "en_v_ifrs_031", "domain": "ifrs", "level": "B2", "fr": "actif d'impôt différé", "en": "deferred tax asset (DTA)", "notes": "Reconnu si probable que des bénéfices futurs absorberont la différence.", "examples": [{"fr": "Un actif d'impôt différé est reconnu sur les pertes reportables.", "en": "A deferred tax asset is recognised on carry-forward losses."}]}, {"id": "en_v_ifrs_032", "domain": "ifrs", "level": "B2", "fr": "passif d'impôt différé", "en": "deferred tax liability (DTL)", "notes": "Impôt futur à payer (ex: réévaluations, différences amortissements).", "examples": [{"fr": "Le passif d'impôt différé provient de la réévaluation des immeubles.", "en": "The deferred tax liability arises from buildings revaluation."}]}, {"id": "en_v_ifrs_033", "domain": "ifrs", "level": "B2", "fr": "différence temporelle", "en": "temporary difference", "notes": "Écart entre VC comptable et base fiscale d'un actif/passif.", "examples": [{"fr": "Les amortissements génèrent des différences temporelles.", "en": "Depreciation creates temporary differences."}]}, {"id": "en_v_ifrs_034", "domain": "ifrs", "level": "B2", "fr": "différence temporelle imposable", "en": "taxable temporary difference", "notes": "Générera un impôt à payer dans le futur — donne un DTL.", "examples": [{"fr": "Une différence temporelle imposable produit un passif d'impôt différé.", "en": "A taxable temporary difference produces a deferred tax liability."}]}, {"id": "en_v_ifrs_035", "domain": "ifrs", "level": "B2", "fr": "différence temporelle déductible", "en": "deductible temporary difference", "notes": "Réduira l'impôt futur — donne un DTA.", "examples": [{"fr": "Les provisions non déductibles créent des différences déductibles.", "en": "Non-deductible provisions create deductible differences."}]}, {"id": "en_v_ifrs_036", "domain": "ifrs", "level": "B2", "fr": "base fiscale", "en": "tax base", "notes": "Valeur attribuée à un actif/passif aux fins fiscales.", "examples": [{"fr": "La base fiscale du goodwill est zéro en Suisse.", "en": "The tax base of goodwill is zero in Switzerland."}]}, {"id": "en_v_ifrs_037", "domain": "ifrs", "level": "B2", "fr": "pertes fiscales reportables", "en": "unused tax losses", "notes": "Donnent un DTA si la récupération future est probable.", "examples": [{"fr": "Les pertes fiscales reportables expirent après 7 ans.", "en": "Unused tax losses expire after 7 years."}]}, {"id": "en_v_ifrs_038", "domain": "ifrs", "level": "B2", "fr": "taux d'impôt effectif", "en": "effective tax rate (ETR)", "notes": "Impôt total / résultat avant impôts. À rapprocher du taux nominal.", "examples": [{"fr": "Le taux d'impôt effectif s'établit à 18%.", "en": "The effective tax rate stands at 18%."}]}, {"id": "en_v_ifrs_039", "domain": "ifrs", "level": "A2", "fr": "immobilisations corporelles", "en": "property, plant and equipment (PP&E)", "notes": "IAS 16. Actifs corporels détenus pour usage > 1 période.", "examples": [{"fr": "Les immobilisations corporelles incluent les machines et bâtiments.", "en": "Property, plant and equipment include machinery and buildings."}]}, {"id": "en_v_ifrs_040", "domain": "ifrs", "level": "B1", "fr": "modèle du coût", "en": "cost model", "notes": "Coût - amortissements cumulés - dépréciations cumulées.", "examples": [{"fr": "L'entité applique le modèle du coût aux machines.", "en": "The entity applies the cost model to machinery."}]}, {"id": "en_v_ifrs_041", "domain": "ifrs", "level": "B2", "fr": "modèle de la réévaluation", "en": "revaluation model", "notes": "Juste valeur en date de réévaluation. OCI pour les gains.", "examples": [{"fr": "Le modèle de la réévaluation est appliqué aux terrains.", "en": "The revaluation model is applied to land."}]}, {"id": "en_v_ifrs_042", "domain": "ifrs", "level": "A2", "fr": "amortissement (corporel)", "en": "depreciation", "ipa": "ˌdɪpriːʃiˈeɪʃn", "notes": "Allocation systématique du coût sur la durée d'utilité.", "examples": [{"fr": "L'amortissement annuel s'élève à CHF 150'000.", "en": "Annual depreciation amounts to CHF 150,000."}]}, {"id": "en_v_ifrs_043", "domain": "ifrs", "level": "B1", "fr": "durée d'utilité", "en": "useful life", "notes": "Période pendant laquelle l'actif sera utilisé. Revue chaque année.", "examples": [{"fr": "La durée d'utilité du véhicule est de 5 ans.", "en": "The useful life of the vehicle is 5 years."}]}, {"id": "en_v_ifrs_044", "domain": "ifrs", "level": "B1", "fr": "valeur résiduelle", "en": "residual value", "notes": "Montant estimé recouvrable en fin de durée d'utilité.", "examples": [{"fr": "La valeur résiduelle est estimée à 10% du coût.", "en": "The residual value is estimated at 10% of cost."}]}, {"id": "en_v_ifrs_045", "domain": "ifrs", "level": "B2", "fr": "approche par composants", "en": "component approach", "notes": "Chaque composant significatif amorti séparément.", "examples": [{"fr": "L'approche par composants distingue la structure du toit.", "en": "The component approach separates the building structure from the roof."}]}, {"id": "en_v_ifrs_046", "domain": "ifrs", "level": "B1", "fr": "valeur comptable", "en": "carrying amount", "notes": "Coût - amortissements cumulés - pertes de valeur cumulées.", "examples": [{"fr": "La valeur comptable de la machine au 31 décembre est CHF 800'000.", "en": "The carrying amount of the machine at 31 December is CHF 800,000."}]}, {"id": "en_v_ifrs_047", "domain": "ifrs", "level": "B2", "fr": "décomptabilisation", "en": "derecognition", "notes": "Retrait de l'actif/passif du bilan lors de cession ou perte d'usage.", "examples": [{"fr": "La décomptabilisation génère un résultat de cession.", "en": "Derecognition generates a gain or loss on disposal."}]}, {"id": "en_v_ifrs_048", "domain": "ifrs", "level": "B1", "fr": "amortissements cumulés", "en": "accumulated depreciation", "notes": "Total des amortissements depuis l'acquisition.", "examples": [{"fr": "Les amortissements cumulés réduisent la valeur brute.", "en": "Accumulated depreciation reduces the gross value."}]}, {"id": "en_v_ifrs_049", "domain": "ifrs", "level": "B2", "fr": "régime à prestations définies", "en": "defined benefit plan", "notes": "L'employeur garantit la prestation. Risque actuariel chez l'employeur.", "examples": [{"fr": "Le régime à prestations définies génère un passif actuariel.", "en": "The defined benefit plan generates an actuarial liability."}]}, {"id": "en_v_ifrs_050", "domain": "ifrs", "level": "B2", "fr": "régime à cotisations définies", "en": "defined contribution plan", "notes": "Cotisation fixe — pas d'engagement sur la prestation finale.", "examples": [{"fr": "Le régime à cotisations définies est comptabilisé en charge.", "en": "The defined contribution plan is recognised as an expense."}]}, {"id": "en_v_ifrs_051", "domain": "ifrs", "level": "B2", "fr": "écarts actuariels", "en": "actuarial gains and losses", "notes": "Variations dues aux hypothèses (taux, mortalité). Reconnus en OCI.", "examples": [{"fr": "Les écarts actuariels sont reconnus en OCI sans recyclage.", "en": "Actuarial gains and losses are recognised in OCI without recycling."}]}, {"id": "en_v_ifrs_052", "domain": "ifrs", "level": "B2", "fr": "coût des services passés", "en": "past service cost", "notes": "Impact d'une modification du plan sur les droits acquis. Reconnu immédiatement.", "examples": [{"fr": "Le coût des services passés est reconnu intégralement en P&L.", "en": "Past service cost is fully recognised in P&L."}]}, {"id": "en_v_ifrs_053", "domain": "ifrs", "level": "B2", "fr": "méthode des unités de crédit projetées", "en": "projected unit credit method", "notes": "Méthode actuarielle requise par IAS 19 pour les régimes DB.", "examples": [{"fr": "La méthode des unités de crédit projetées est utilisée par l'actuaire.", "en": "The projected unit credit method is used by the actuary."}]}, {"id": "en_v_ifrs_054", "domain": "ifrs", "level": "B2", "fr": "monnaie fonctionnelle", "en": "functional currency", "notes": "Monnaie de l'environnement économique principal de l'entité.", "examples": [{"fr": "La monnaie fonctionnelle de la filiale est l'euro.", "en": "The functional currency of the subsidiary is the euro."}]}, {"id": "en_v_ifrs_055", "domain": "ifrs", "level": "B2", "fr": "monnaie de présentation", "en": "presentation currency", "notes": "Monnaie dans laquelle les EF sont présentés. Peut différer de la fonctionnelle.", "examples": [{"fr": "La monnaie de présentation du groupe est le franc suisse.", "en": "The presentation currency of the group is the Swiss franc."}]}, {"id": "en_v_ifrs_056", "domain": "ifrs", "level": "B2", "fr": "écarts de change", "en": "exchange differences", "notes": "Différences résultant de la conversion. P&L ou OCI selon la nature.", "examples": [{"fr": "Les écarts de change de conversion sont reconnus en OCI.", "en": "Translation exchange differences are recognised in OCI."}]}, {"id": "en_v_ifrs_057", "domain": "ifrs", "level": "B2", "fr": "coûts d'emprunt", "en": "borrowing costs", "notes": "Intérêts et frais liés à un emprunt. Capitalisés si actif éligible.", "examples": [{"fr": "Les coûts d'emprunt liés à la construction sont capitalisés.", "en": "Borrowing costs relating to construction are capitalised."}]}, {"id": "en_v_ifrs_058", "domain": "ifrs", "level": "B2", "fr": "actif éligible", "en": "qualifying asset", "notes": "Actif nécessitant une longue période de préparation pour être prêt.", "examples": [{"fr": "Le bâtiment en construction est un actif éligible.", "en": "The building under construction is a qualifying asset."}]}, {"id": "en_v_ifrs_059", "domain": "ifrs", "level": "B1", "fr": "partie liée", "en": "related party", "notes": "Personne/entité ayant un lien proche avec l'entité.", "examples": [{"fr": "Les filiales et associés sont des parties liées.", "en": "Subsidiaries and associates are related parties."}]}, {"id": "en_v_ifrs_060", "domain": "ifrs", "level": "B2", "fr": "transaction avec partie liée", "en": "related party transaction", "notes": "Doit être divulguée même si réalisée à des conditions de marché.", "examples": [{"fr": "Toutes les transactions avec parties liées sont divulguées en note 24.", "en": "All related party transactions are disclosed in note 24."}]}, {"id": "en_v_ifrs_061", "domain": "ifrs", "level": "B2", "fr": "principaux dirigeants", "en": "key management personnel", "notes": "Personnes ayant autorité et responsabilité de planifier/diriger/contrôler.", "examples": [{"fr": "La rémunération des principaux dirigeants est divulguée.", "en": "Key management personnel compensation is disclosed."}]}, {"id": "en_v_ifrs_062", "domain": "ifrs", "level": "B2", "fr": "mise en équivalence", "en": "equity method", "notes": "Évaluation initiale au coût, ajustée pour la quote-part de résultat.", "examples": [{"fr": "La participation est comptabilisée selon la mise en équivalence.", "en": "The investment is accounted for using the equity method."}]}, {"id": "en_v_ifrs_063", "domain": "ifrs", "level": "B2", "fr": "influence notable", "en": "significant influence", "notes": "Présumée à partir de 20% des droits de vote. Donne le statut d'associée.", "examples": [{"fr": "Une participation de 25% confère une influence notable.", "en": "A 25% interest grants significant influence."}]}, {"id": "en_v_ifrs_064", "domain": "ifrs", "level": "B1", "fr": "actif financier", "en": "financial asset", "notes": "Cash, créances, titres de capitaux propres, instruments dérivés.", "examples": [{"fr": "Les créances clients sont des actifs financiers.", "en": "Trade receivables are financial assets."}]}, {"id": "en_v_ifrs_065", "domain": "ifrs", "level": "B1", "fr": "passif financier", "en": "financial liability", "notes": "Obligation contractuelle de livrer du cash ou un autre actif financier.", "examples": [{"fr": "Les dettes fournisseurs sont des passifs financiers.", "en": "Trade payables are financial liabilities."}]}, {"id": "en_v_ifrs_066", "domain": "ifrs", "level": "B1", "fr": "instrument de capitaux propres", "en": "equity instrument", "notes": "Représente un intérêt résiduel dans les actifs après déduction des passifs.", "examples": [{"fr": "Les actions ordinaires sont des instruments de capitaux propres.", "en": "Ordinary shares are equity instruments."}]}, {"id": "en_v_ifrs_067", "domain": "ifrs", "level": "B2", "fr": "coût amorti", "en": "amortised cost", "notes": "Méthode d'évaluation utilisant le taux d'intérêt effectif (TIE).", "examples": [{"fr": "Les obligations sont évaluées au coût amorti.", "en": "The bonds are measured at amortised cost."}]}, {"id": "en_v_ifrs_068", "domain": "ifrs", "level": "B2", "fr": "juste valeur par résultat", "en": "fair value through profit or loss (FVTPL)", "notes": "Variations directement en P&L. Trading + désignés.", "examples": [{"fr": "Les dérivés sont obligatoirement à la juste valeur par résultat.", "en": "Derivatives are mandatorily at FVTPL."}]}, {"id": "en_v_ifrs_069", "domain": "ifrs", "level": "B2", "fr": "juste valeur par OCI", "en": "fair value through OCI (FVOCI)", "notes": "Variations en OCI. Recyclage en P&L pour debt, pas pour equity.", "examples": [{"fr": "Les obligations d'État sont classées FVOCI.", "en": "Government bonds are classified as FVOCI."}]}, {"id": "en_v_ifrs_070", "domain": "ifrs", "level": "B2", "fr": "pertes de crédit attendues", "en": "expected credit losses (ECL)", "notes": "Modèle forward-looking IFRS 9. Trois étapes (12-mois, lifetime non-impaired, lifetime impaired).", "examples": [{"fr": "Les ECL sont calculés sur toutes les créances.", "en": "ECL are calculated on all receivables."}]}, {"id": "en_v_ifrs_071", "domain": "ifrs", "level": "B2", "fr": "ECL à 12 mois", "en": "12-month ECL", "notes": "Stage 1 — risque de crédit faible. ECL basé sur défaut dans les 12 prochains mois.", "examples": [{"fr": "Les créances saines suivent le modèle ECL 12 mois.", "en": "Performing receivables follow the 12-month ECL model."}]}, {"id": "en_v_ifrs_072", "domain": "ifrs", "level": "B2", "fr": "ECL sur durée de vie", "en": "lifetime ECL", "notes": "Stages 2 et 3 — augmentation significative du risque ou défaut.", "examples": [{"fr": "Les créances en retard suivent l'ECL durée de vie.", "en": "Past-due receivables follow lifetime ECL."}]}, {"id": "en_v_ifrs_073", "domain": "ifrs", "level": "B1", "fr": "risque de crédit", "en": "credit risk", "notes": "Risque qu'une contrepartie ne paie pas ses engagements.", "examples": [{"fr": "Le risque de crédit est divulgué selon IFRS 7.", "en": "Credit risk is disclosed under IFRS 7."}]}, {"id": "en_v_ifrs_074", "domain": "ifrs", "level": "B2", "fr": "comptabilité de couverture", "en": "hedge accounting", "notes": "Option permettant de neutraliser la volatilité P&L des dérivés.", "examples": [{"fr": "La comptabilité de couverture nécessite une documentation formelle.", "en": "Hedge accounting requires formal documentation."}]}, {"id": "en_v_ifrs_075", "domain": "ifrs", "level": "B2", "fr": "couverture de juste valeur", "en": "fair value hedge", "notes": "Couvre la variation de JV d'un actif/passif reconnu.", "examples": [{"fr": "Le swap couvre la juste valeur de l'obligation à taux fixe.", "en": "The swap is a fair value hedge of the fixed-rate bond."}]}, {"id": "en_v_ifrs_076", "domain": "ifrs", "level": "B2", "fr": "couverture de flux de trésorerie", "en": "cash flow hedge", "notes": "Couvre la variabilité de flux futurs. Partie efficace en OCI.", "examples": [{"fr": "La couverture de flux est appliquée aux achats futurs en USD.", "en": "Cash flow hedging is applied to forecast USD purchases."}]}, {"id": "en_v_ifrs_077", "domain": "ifrs", "level": "B2", "fr": "dérivé incorporé", "en": "embedded derivative", "notes": "Composante dérivée intégrée à un contrat hôte. À séparer si conditions remplies.", "examples": [{"fr": "Le contrat contient un dérivé incorporé sur l'inflation.", "en": "The contract includes an embedded derivative on inflation."}]}, {"id": "en_v_ifrs_078", "domain": "ifrs", "level": "B2", "fr": "test SPPI", "en": "SPPI test", "notes": "Solely Payments of Principal and Interest. Critère IFRS 9 pour coût amorti.", "examples": [{"fr": "Le test SPPI conditionne le classement au coût amorti.", "en": "The SPPI test conditions classification at amortised cost."}]}, {"id": "en_v_ifrs_079", "domain": "ifrs", "level": "B2", "fr": "regroupement d'entreprises", "en": "business combination", "notes": "Acquisition du contrôle d'un business (≠ acquisition d'actifs).", "examples": [{"fr": "Le regroupement d'entreprises est comptabilisé selon IFRS 3.", "en": "The business combination is accounted for under IFRS 3."}]}, {"id": "en_v_ifrs_080", "domain": "ifrs", "level": "B2", "fr": "acquéreur", "en": "acquirer", "notes": "Entité qui obtient le contrôle de l'acquise. À identifier.", "examples": [{"fr": "L'acquéreur applique la méthode de l'acquisition.", "en": "The acquirer applies the acquisition method."}]}, {"id": "en_v_ifrs_081", "domain": "ifrs", "level": "B2", "fr": "allocation du prix d'acquisition", "en": "purchase price allocation (PPA)", "notes": "Répartir le prix payé entre actifs et passifs identifiables à la juste valeur.", "examples": [{"fr": "L'allocation du prix d'acquisition révèle un goodwill de CHF 12 millions.", "en": "The purchase price allocation reveals goodwill of CHF 12 million."}]}, {"id": "en_v_ifrs_082", "domain": "ifrs", "level": "A2", "fr": "goodwill", "en": "goodwill", "ipa": "ˈɡʊdwɪl", "notes": "Écart d'acquisition. Non amortissable, testé annuellement pour dépréciation.", "examples": [{"fr": "Le goodwill résulte de l'acquisition de la filiale italienne.", "en": "Goodwill arises from the acquisition of the Italian subsidiary."}]}, {"id": "en_v_ifrs_083", "domain": "ifrs", "level": "B2", "fr": "acquisition à conditions avantageuses", "en": "bargain purchase", "notes": "Prix payé inférieur à la JV des actifs nets. Gain en P&L.", "examples": [{"fr": "L'acquisition à conditions avantageuses génère un gain en P&L.", "en": "The bargain purchase generates a gain in P&L."}]}, {"id": "en_v_ifrs_084", "domain": "ifrs", "level": "B2", "fr": "détenu en vue de la vente", "en": "held for sale", "notes": "Actif disponible immédiatement, vente probable < 12 mois.", "examples": [{"fr": "L'usine est classée détenue en vue de la vente.", "en": "The factory is classified as held for sale."}]}, {"id": "en_v_ifrs_085", "domain": "ifrs", "level": "B2", "fr": "activité abandonnée", "en": "discontinued operation", "notes": "Composante cédée ou détenue en vue de la vente. Présentation séparée.", "examples": [{"fr": "L'activité retail est présentée comme activité abandonnée.", "en": "The retail business is presented as a discontinued operation."}]}, {"id": "en_v_ifrs_086", "domain": "ifrs", "level": "B2", "fr": "juste valeur diminuée des coûts de cession", "en": "fair value less costs to sell", "notes": "Base d'évaluation pour les actifs détenus en vue de la vente.", "examples": [{"fr": "L'actif est évalué au minimum entre VC et juste valeur diminuée.", "en": "The asset is measured at the lower of carrying amount and FVLCS."}]}, {"id": "en_v_ifrs_087", "domain": "ifrs", "level": "B2", "fr": "risque de liquidité", "en": "liquidity risk", "notes": "Risque de ne pouvoir honorer ses engagements à l'échéance.", "examples": [{"fr": "Le risque de liquidité est géré par des lignes de crédit.", "en": "Liquidity risk is managed through credit lines."}]}, {"id": "en_v_ifrs_088", "domain": "ifrs", "level": "B2", "fr": "risque de marché", "en": "market risk", "notes": "Inclut risque de change, de taux d'intérêt, de prix.", "examples": [{"fr": "Le risque de marché est mesuré par la VaR.", "en": "Market risk is measured through VaR."}]}, {"id": "en_v_ifrs_089", "domain": "ifrs", "level": "B2", "fr": "analyse de sensibilité", "en": "sensitivity analysis", "notes": "Impact d'une variation hypothétique d'un paramètre clé.", "examples": [{"fr": "Une analyse de sensibilité montre l'impact d'une hausse de 100 bps.", "en": "A sensitivity analysis shows the impact of a 100 bps increase."}]}, {"id": "en_v_ifrs_090", "domain": "ifrs", "level": "B2", "fr": "secteur opérationnel", "en": "operating segment", "notes": "Composante générant des revenus, examinée séparément par le CODM.", "examples": [{"fr": "Le groupe identifie trois secteurs opérationnels.", "en": "The group identifies three operating segments."}]}, {"id": "en_v_ifrs_091", "domain": "ifrs", "level": "B2", "fr": "principal décideur opérationnel", "en": "chief operating decision maker (CODM)", "notes": "Souvent le CEO ou le comité exécutif. Allocation des ressources et performance.", "examples": [{"fr": "Le CODM revoit les segments mensuellement.", "en": "The CODM reviews segments monthly."}]}, {"id": "en_v_ifrs_092", "domain": "ifrs", "level": "B1", "fr": "contrôle", "en": "control", "notes": "Pouvoir + exposition aux rendements variables + capacité d'influencer ceux-ci.", "examples": [{"fr": "Le contrôle est apprécié sur la base des trois critères IFRS 10.", "en": "Control is assessed based on the three IFRS 10 criteria."}]}, {"id": "en_v_ifrs_093", "domain": "ifrs", "level": "A2", "fr": "filiale", "en": "subsidiary", "ipa": "ˈsʌbsɪdiəri", "notes": "Entité contrôlée par la société mère. Intégration globale.", "examples": [{"fr": "La filiale brésilienne est consolidée par intégration globale.", "en": "The Brazilian subsidiary is fully consolidated."}]}, {"id": "en_v_ifrs_094", "domain": "ifrs", "level": "B2", "fr": "participations ne donnant pas le contrôle", "en": "non-controlling interest (NCI)", "notes": "Part des minoritaires dans les capitaux propres et le résultat.", "examples": [{"fr": "Le NCI s'élève à 15% du capital de la filiale.", "en": "NCI amounts to 15% of the subsidiary's capital."}]}, {"id": "en_v_ifrs_095", "domain": "ifrs", "level": "B1", "fr": "états financiers consolidés", "en": "consolidated financial statements", "notes": "Présentent groupe + filiales comme une entité économique unique.", "examples": [{"fr": "Les états financiers consolidés sont publiés en avril.", "en": "The consolidated financial statements are published in April."}]}, {"id": "en_v_ifrs_096", "domain": "ifrs", "level": "B2", "fr": "transactions intragroupe", "en": "intragroup transactions", "notes": "Éliminées en consolidation (créances/dettes, ventes, marges).", "examples": [{"fr": "Les transactions intragroupe sont éliminées au passage.", "en": "Intragroup transactions are eliminated on consolidation."}]}, {"id": "en_v_ifrs_097", "domain": "ifrs", "level": "B2", "fr": "activité conjointe", "en": "joint operation", "notes": "Droits sur les actifs et obligations sur les passifs. Comptab. en proportion.", "examples": [{"fr": "L'activité conjointe est comptabilisée ligne à ligne.", "en": "The joint operation is accounted for line by line."}]}, {"id": "en_v_ifrs_098", "domain": "ifrs", "level": "B2", "fr": "coentreprise", "en": "joint venture", "notes": "Droits sur l'actif net. Mise en équivalence.", "examples": [{"fr": "La coentreprise est mise en équivalence.", "en": "The joint venture is equity-accounted."}]}, {"id": "en_v_ifrs_099", "domain": "ifrs", "level": "B1", "fr": "juste valeur", "en": "fair value", "notes": "Prix de sortie sur un marché ordonné. Hypothèses des intervenants du marché.", "examples": [{"fr": "La juste valeur est déterminée selon la hiérarchie IFRS 13.", "en": "Fair value is determined per the IFRS 13 hierarchy."}]}, {"id": "en_v_ifrs_100", "domain": "ifrs", "level": "B2", "fr": "donnée d'entrée niveau 1", "en": "level 1 input", "notes": "Prix coté sur un marché actif pour un actif identique.", "examples": [{"fr": "Les actions cotées utilisent des données niveau 1.", "en": "Listed shares use level 1 inputs."}]}, {"id": "en_v_ifrs_101", "domain": "ifrs", "level": "B2", "fr": "donnée d'entrée niveau 2", "en": "level 2 input", "notes": "Données observables directement ou indirectement (taux, spreads).", "examples": [{"fr": "Les swaps standards sont évalués avec des données niveau 2.", "en": "Plain vanilla swaps are valued with level 2 inputs."}]}, {"id": "en_v_ifrs_102", "domain": "ifrs", "level": "B2", "fr": "donnée d'entrée niveau 3", "en": "level 3 input", "notes": "Données non observables. Jugement managérial important.", "examples": [{"fr": "Les actifs niveau 3 nécessitent des disclosures détaillées.", "en": "Level 3 assets require detailed disclosures."}]}, {"id": "en_v_ifrs_103", "domain": "ifrs", "level": "B2", "fr": "marché principal", "en": "principal market", "notes": "Marché avec le plus grand volume pour l'actif/passif.", "examples": [{"fr": "Le marché principal pour cette action est la SIX.", "en": "The principal market for this share is the SIX."}]}, {"id": "en_v_ifrs_104", "domain": "ifrs", "level": "B2", "fr": "obligation de prestation", "en": "performance obligation", "notes": "Promesse distincte de transférer un bien/service au client.", "examples": [{"fr": "Le contrat identifie deux obligations de prestation distinctes.", "en": "The contract identifies two distinct performance obligations."}]}, {"id": "en_v_ifrs_105", "domain": "ifrs", "level": "B2", "fr": "prix de transaction", "en": "transaction price", "notes": "Montant attendu en échange du transfert des biens/services.", "examples": [{"fr": "Le prix de transaction inclut une contrepartie variable.", "en": "The transaction price includes variable consideration."}]}, {"id": "en_v_ifrs_106", "domain": "ifrs", "level": "B2", "fr": "contrepartie variable", "en": "variable consideration", "notes": "Bonus, remises, retours. À estimer (expected value ou most likely).", "examples": [{"fr": "La contrepartie variable est plafonnée selon le constraint.", "en": "Variable consideration is capped under the constraint."}]}, {"id": "en_v_ifrs_107", "domain": "ifrs", "level": "B2", "fr": "prix de vente spécifique", "en": "stand-alone selling price (SSP)", "notes": "Prix auquel l'entité vendrait le bien/service séparément.", "examples": [{"fr": "Le SSP est estimé en l'absence de prix observable.", "en": "The SSP is estimated in the absence of observable price."}]}, {"id": "en_v_ifrs_108", "domain": "ifrs", "level": "B2", "fr": "actif sur contrat", "en": "contract asset", "notes": "Droit conditionnel à un paiement (livraison sans facturation).", "examples": [{"fr": "L'actif sur contrat est reclassé en créance après facturation.", "en": "The contract asset is reclassified to receivable after invoicing."}]}, {"id": "en_v_ifrs_109", "domain": "ifrs", "level": "B2", "fr": "passif sur contrat", "en": "contract liability", "notes": "Obligation de transférer suite à un paiement reçu (avance client).", "examples": [{"fr": "Les acomptes reçus sont un passif sur contrat.", "en": "Customer prepayments are a contract liability."}]}, {"id": "en_v_ifrs_110", "domain": "ifrs", "level": "B2", "fr": "produit comptabilisé progressivement", "en": "revenue recognised over time", "notes": "Critères : actif non substituable + droit au paiement, OU client bénéficie au fur et à mesure.", "examples": [{"fr": "Les services de construction sont comptabilisés progressivement.", "en": "Construction services are recognised over time."}]}, {"id": "en_v_ifrs_111", "domain": "ifrs", "level": "B2", "fr": "produit comptabilisé à un moment précis", "en": "revenue recognised at a point in time", "notes": "Lors du transfert du contrôle au client.", "examples": [{"fr": "La vente de marchandises est comptabilisée à un moment précis.", "en": "Goods sales are recognised at a point in time."}]}, {"id": "en_v_ifrs_112", "domain": "ifrs", "level": "B2", "fr": "principal ou mandataire", "en": "principal versus agent", "notes": "Principal : contrôle avant transfert (revenu brut). Agent : revenu net.", "examples": [{"fr": "L'analyse principal vs agent détermine la présentation brute/nette.", "en": "The principal versus agent analysis determines gross/net presentation."}]}, {"id": "en_v_ifrs_113", "domain": "ifrs", "level": "B2", "fr": "modèle en cinq étapes", "en": "five-step model", "notes": "1. Contrat 2. POs 3. Prix 4. Allocation 5. Reconnaissance.", "examples": [{"fr": "Le modèle en cinq étapes s'applique à tous les contrats clients.", "en": "The five-step model applies to all customer contracts."}]}, {"id": "en_v_ifrs_114", "domain": "ifrs", "level": "A2", "fr": "contrat de location", "en": "lease", "ipa": "liːs", "notes": "Droit d'utiliser un actif identifié pour une période en échange de paiements.", "examples": [{"fr": "Le contrat de location porte sur 5 ans.", "en": "The lease has a 5-year term."}]}, {"id": "en_v_ifrs_115", "domain": "ifrs", "level": "B1", "fr": "preneur", "en": "lessee", "ipa": "lesˈiː", "notes": "Partie qui obtient le droit d'utilisation. Reconnaît ROU + dette.", "examples": [{"fr": "Le preneur reconnaît un droit d'utilisation au bilan.", "en": "The lessee recognises a right-of-use asset on the balance sheet."}]}, {"id": "en_v_ifrs_116", "domain": "ifrs", "level": "B1", "fr": "bailleur", "en": "lessor", "ipa": "ˈlesə", "notes": "Partie qui accorde le droit. Classement opérationnel ou financier.", "examples": [{"fr": "Le bailleur classe le contrat comme location-financement.", "en": "The lessor classifies the contract as a finance lease."}]}, {"id": "en_v_ifrs_117", "domain": "ifrs", "level": "B2", "fr": "droit d'utilisation", "en": "right-of-use asset (ROU)", "notes": "Actif reconnu par le preneur. Amorti sur la durée du contrat.", "examples": [{"fr": "Le ROU est amorti linéairement sur la durée du bail.", "en": "The ROU is depreciated straight-line over the lease term."}]}, {"id": "en_v_ifrs_118", "domain": "ifrs", "level": "B2", "fr": "passif de location", "en": "lease liability", "notes": "Valeur actualisée des paiements futurs. Intérêts en P&L.", "examples": [{"fr": "Le passif de location est actualisé au taux marginal d'emprunt.", "en": "The lease liability is discounted at the incremental borrowing rate."}]}, {"id": "en_v_ifrs_119", "domain": "ifrs", "level": "B2", "fr": "durée du contrat de location", "en": "lease term", "notes": "Période non résiliable + options raisonnablement certaines.", "examples": [{"fr": "La durée inclut l'option de renouvellement raisonnablement certaine.", "en": "The lease term includes the reasonably certain renewal option."}]}, {"id": "en_v_ifrs_120", "domain": "ifrs", "level": "B2", "fr": "taux d'emprunt marginal", "en": "incremental borrowing rate (IBR)", "notes": "Taux que paierait le preneur pour emprunter sur durée similaire.", "examples": [{"fr": "Le taux d'emprunt marginal retenu est de 3.5%.", "en": "The incremental borrowing rate used is 3.5%."}]}, {"id": "en_v_ifrs_121", "domain": "ifrs", "level": "B2", "fr": "contrat de location de courte durée", "en": "short-term lease", "notes": "≤ 12 mois. Exemption : pas de ROU/dette, charge linéaire.", "examples": [{"fr": "Le contrat de 9 mois bénéficie de l'exemption short-term.", "en": "The 9-month contract benefits from the short-term exemption."}]}, {"id": "en_v_ifrs_122", "domain": "ifrs", "level": "B2", "fr": "location de faible valeur", "en": "low-value lease", "notes": "Actif neuf < ~5'000 USD (ex: ordinateur, mobilier). Exemption.", "examples": [{"fr": "Les ordinateurs portables sont en exemption low-value.", "en": "Laptops fall under the low-value exemption."}]}, {"id": "en_v_ifrs_123", "domain": "ifrs", "level": "B2", "fr": "paiements variables", "en": "variable lease payments", "notes": "Liés à l'indice ou taux : inclus dans le passif. Liés à l'usage : en P&L.", "examples": [{"fr": "Les paiements indexés sur l'inflation entrent dans le passif.", "en": "Inflation-indexed payments are included in the liability."}]}, {"id": "en_v_ifrs_124", "domain": "ifrs", "level": "A2", "fr": "dépréciation", "en": "impairment", "ipa": "ɪmˈpeəmənt", "notes": "Reconnaissance d'une perte de valeur quand VC > valeur recouvrable.", "examples": [{"fr": "Le test de dépréciation est obligatoire en cas d'indice.", "en": "The impairment test is mandatory if an indicator exists."}]}, {"id": "en_v_ifrs_125", "domain": "ifrs", "level": "B1", "fr": "perte de valeur", "en": "impairment loss", "notes": "Excédent de la VC sur la valeur recouvrable. Reconnu en P&L.", "examples": [{"fr": "Une perte de valeur de CHF 2 millions a été comptabilisée.", "en": "An impairment loss of CHF 2 million was recognised."}]}, {"id": "en_v_ifrs_126", "domain": "ifrs", "level": "B2", "fr": "unité génératrice de trésorerie", "en": "cash-generating unit (CGU)", "notes": "Plus petit groupe d'actifs générant des flux largement indépendants.", "examples": [{"fr": "Chaque magasin constitue une UGT distincte.", "en": "Each store is a separate cash-generating unit."}]}, {"id": "en_v_ifrs_127", "domain": "ifrs", "level": "B2", "fr": "valeur recouvrable", "en": "recoverable amount", "notes": "Maximum entre VIU et FVLCD.", "examples": [{"fr": "La valeur recouvrable retient la VIU plus élevée que la FVLCD.", "en": "The recoverable amount uses VIU, higher than FVLCD."}]}, {"id": "en_v_ifrs_128", "domain": "ifrs", "level": "B2", "fr": "valeur d'utilité", "en": "value in use (VIU)", "notes": "Valeur actualisée des flux futurs attendus de l'usage continu.", "examples": [{"fr": "La VIU est calculée sur la base d'un plan à 5 ans.", "en": "VIU is computed based on a 5-year plan."}]}, {"id": "en_v_ifrs_129", "domain": "ifrs", "level": "B2", "fr": "juste valeur diminuée des coûts de cession", "en": "fair value less costs of disposal (FVLCD)", "notes": "Prix de vente moins coûts directement attribuables.", "examples": [{"fr": "La FVLCD est dérivée d'une transaction comparable récente.", "en": "FVLCD is derived from a recent comparable transaction."}]}, {"id": "en_v_ifrs_130", "domain": "ifrs", "level": "B2", "fr": "indice de dépréciation", "en": "indicator of impairment", "notes": "Externe (marché, taux) ou interne (obsolescence, performance).", "examples": [{"fr": "La chute du chiffre d'affaires constitue un indice de dépréciation.", "en": "The drop in revenue is an indicator of impairment."}]}, {"id": "en_v_ifrs_131", "domain": "ifrs", "level": "B2", "fr": "reprise de dépréciation", "en": "reversal of impairment", "notes": "Possible (sauf goodwill). Plafonné à ce qu'aurait été la VC sans dépréciation.", "examples": [{"fr": "La reprise de dépréciation est interdite pour le goodwill.", "en": "Impairment reversal is prohibited for goodwill."}]}, {"id": "en_v_ifrs_132", "domain": "ifrs", "level": "B2", "fr": "taux d'actualisation", "en": "discount rate", "notes": "Taux avant impôts reflétant la valeur temps et risques spécifiques.", "examples": [{"fr": "Le taux d'actualisation retenu est le WACC après ajustements.", "en": "The discount rate used is the WACC after adjustments."}]}, {"id": "en_v_ifrs_133", "domain": "ifrs", "level": "B2", "fr": "projection de flux de trésorerie", "en": "cash flow projection", "notes": "Maximum 5 ans (sauf justification). Au-delà : taux de croissance terminal.", "examples": [{"fr": "La projection de flux couvre cinq ans plus une valeur terminale.", "en": "The cash flow projection covers five years plus a terminal value."}]}, {"id": "en_v_ifrs_134", "domain": "ifrs", "level": "B1", "fr": "provision", "en": "provision", "notes": "Passif d'échéance ou montant incertain. Critères : obligation actuelle + sortie probable + estimation fiable.", "examples": [{"fr": "Une provision pour litige a été reconnue.", "en": "A provision for litigation has been recognised."}]}, {"id": "en_v_ifrs_135", "domain": "ifrs", "level": "B2", "fr": "passif éventuel", "en": "contingent liability", "notes": "Obligation possible OU non probable OU non mesurable. Disclosure seulement.", "examples": [{"fr": "Le passif éventuel est divulgué en note 21.", "en": "The contingent liability is disclosed in note 21."}]}, {"id": "en_v_ifrs_136", "domain": "ifrs", "level": "B2", "fr": "actif éventuel", "en": "contingent asset", "notes": "Actif potentiel dépendant d'événements futurs. Disclosure si probable.", "examples": [{"fr": "L'actif éventuel issu du litige n'est pas reconnu.", "en": "The contingent asset from the litigation is not recognised."}]}, {"id": "en_v_ifrs_137", "domain": "ifrs", "level": "B2", "fr": "contrat déficitaire", "en": "onerous contract", "notes": "Coûts inévitables > avantages économiques attendus. Provisionner la perte.", "examples": [{"fr": "Le contrat déficitaire fait l'objet d'une provision.", "en": "The onerous contract is provisioned."}]}, {"id": "en_v_ifrs_138", "domain": "ifrs", "level": "B2", "fr": "restructuration", "en": "restructuring", "notes": "Provision dès qu'un plan détaillé est annoncé créant une attente justifiée.", "examples": [{"fr": "La provision pour restructuration est reconnue en décembre.", "en": "The restructuring provision is recognised in December."}]}, {"id": "en_v_ifrs_139", "domain": "ifrs", "level": "B1", "fr": "immobilisation incorporelle", "en": "intangible asset", "notes": "Actif non monétaire identifiable sans substance physique.", "examples": [{"fr": "Les brevets sont des immobilisations incorporelles.", "en": "Patents are intangible assets."}]}, {"id": "en_v_ifrs_140", "domain": "ifrs", "level": "B2", "fr": "phase de recherche", "en": "research phase", "notes": "Dépenses systématiquement passées en charges.", "examples": [{"fr": "Les dépenses de recherche sont en charges.", "en": "Research expenditure is expensed."}]}, {"id": "en_v_ifrs_141", "domain": "ifrs", "level": "B2", "fr": "phase de développement", "en": "development phase", "notes": "Capitalisable si 6 critères réunis (faisabilité, intention, ressources...).", "examples": [{"fr": "Les coûts de développement sont capitalisés sous conditions.", "en": "Development costs are capitalised under conditions."}]}, {"id": "en_v_ifrs_142", "domain": "ifrs", "level": "B2", "fr": "durée d'utilité indéterminée", "en": "indefinite useful life", "notes": "Pas d'amortissement, test de dépréciation annuel (ex: marques).", "examples": [{"fr": "La marque a une durée d'utilité indéterminée.", "en": "The brand has an indefinite useful life."}]}, {"id": "en_v_ifrs_143", "domain": "ifrs", "level": "B1", "fr": "amortissement (incorporel)", "en": "amortisation", "notes": "Allocation systématique du coût d'un incorporel à durée finie.", "examples": [{"fr": "L'amortissement du logiciel s'étale sur 5 ans.", "en": "Software amortisation is spread over 5 years."}]}, {"id": "en_v_ifrs_144", "domain": "ifrs", "level": "B2", "fr": "immeuble de placement", "en": "investment property", "notes": "Détenu pour louer ou pour plus-value (≠ usage propre = IAS 16).", "examples": [{"fr": "L'immeuble loué à des tiers est classé immeuble de placement.", "en": "The building leased to third parties is investment property."}]}, {"id": "en_v_ifrs_145", "domain": "ifrs", "level": "B2", "fr": "modèle de la juste valeur", "en": "fair value model", "notes": "Évaluation à JV avec variations en P&L (IAS 40).", "examples": [{"fr": "L'entité applique le modèle de la juste valeur aux immeubles.", "en": "The entity applies the fair value model to properties."}]}, {"id": "en_v_ifrs_146", "domain": "ifrs", "level": "B2", "fr": "contrat d'assurance", "en": "insurance contract", "notes": "Transfert d'un risque significatif de l'assuré à l'assureur.", "examples": [{"fr": "Les contrats d'assurance sont évalués selon IFRS 17.", "en": "Insurance contracts are measured under IFRS 17."}]}, {"id": "en_v_ifrs_147", "domain": "ifrs", "level": "B2", "fr": "marge sur services contractuels", "en": "contractual service margin (CSM)", "notes": "Profit non gagné, libéré sur la durée du service.", "examples": [{"fr": "La CSM est libérée linéairement sur la durée du contrat.", "en": "The CSM is released straight-line over the contract term."}]}, {"id": "en_v_ifrs_148", "domain": "ifrs", "level": "B2", "fr": "ajustement pour risque", "en": "risk adjustment", "notes": "Compensation exigée par l'assureur pour supporter l'incertitude.", "examples": [{"fr": "L'ajustement pour risque reflète l'aversion à l'incertitude.", "en": "The risk adjustment reflects aversion to uncertainty."}]}, {"id": "en_v_ifrs_149", "domain": "ifrs", "level": "B2", "fr": "résultat par action", "en": "earnings per share (EPS)", "notes": "Résultat net / nombre moyen pondéré d'actions ordinaires.", "examples": [{"fr": "Le résultat par action s'établit à CHF 3.20.", "en": "Earnings per share stands at CHF 3.20."}]}, {"id": "en_v_ifrs_150", "domain": "ifrs", "level": "B2", "fr": "résultat dilué par action", "en": "diluted EPS", "notes": "Inclut l'effet dilutif des stock-options, obligations convertibles.", "examples": [{"fr": "Le résultat dilué par action tient compte des stock-options.", "en": "Diluted EPS takes into account stock options."}]}, {"id": "en_v_biz_031", "domain": "business", "level": "A2", "fr": "collaborateur junior", "en": "associate", "notes": "Niveau d'entrée Big 4. Exécution sur le terrain.", "examples": [{"fr": "Je rejoins EY comme collaborateur junior en octobre.", "en": "I'm joining EY as an associate in October."}]}, {"id": "en_v_biz_032", "domain": "business", "level": "A2", "fr": "collaborateur senior", "en": "senior", "notes": "Encadre les juniors, gère des cycles. Typiquement après 2-3 ans.", "examples": [{"fr": "Le senior revoit le travail des juniors.", "en": "The senior reviews the juniors' work."}]}, {"id": "en_v_biz_033", "domain": "business", "level": "A2", "fr": "manager", "en": "manager", "ipa": "ˈmænɪdʒə", "notes": "Responsable de la mission au quotidien. Gère le budget et l'équipe.", "examples": [{"fr": "Le manager fait le point quotidien avec l'équipe.", "en": "The manager holds the daily catch-up with the team."}]}, {"id": "en_v_biz_034", "domain": "business", "level": "B1", "fr": "senior manager", "en": "senior manager", "notes": "Étape intermédiaire vers partner. Plusieurs missions en parallèle.", "examples": [{"fr": "Le senior manager supervise trois engagements.", "en": "The senior manager oversees three engagements."}]}, {"id": "en_v_biz_035", "domain": "business", "level": "B1", "fr": "directeur", "en": "director", "notes": "Niveau alternatif à partner. Expert technique souvent.", "examples": [{"fr": "Le directeur intervient sur les sujets IFRS complexes.", "en": "The director steps in on complex IFRS topics."}]}, {"id": "en_v_biz_036", "domain": "business", "level": "A2", "fr": "associé", "en": "partner", "ipa": "ˈpɑːtnə", "notes": "Actionnaire du cabinet. Signe l'opinion d'audit.", "examples": [{"fr": "L'associé signe le rapport d'audit final.", "en": "The partner signs off the final audit report."}]}, {"id": "en_v_biz_037", "domain": "business", "level": "B2", "fr": "associé responsable de la mission", "en": "engagement partner", "notes": "Responsable global de la qualité et de l'opinion.", "examples": [{"fr": "L'associé responsable se réunit mensuellement avec l'équipe.", "en": "The engagement partner meets the team monthly."}]}, {"id": "en_v_biz_038", "domain": "business", "level": "B2", "fr": "expert métier", "en": "subject matter expert (SME)", "notes": "Spécialiste consulté ponctuellement (fiscalité, IFRS 9, valuation).", "examples": [{"fr": "Un expert métier IFRS 9 a été consulté.", "en": "An IFRS 9 subject matter expert was consulted."}]}, {"id": "en_v_biz_039", "domain": "business", "level": "A2", "fr": "mission", "en": "engagement", "ipa": "ɪnˈɡeɪdʒmənt", "notes": "Terme Big 4 pour un projet client. = audit, advisory, etc.", "examples": [{"fr": "J'ai été staffé sur trois missions ce trimestre.", "en": "I was staffed on three engagements this quarter."}]}, {"id": "en_v_biz_040", "domain": "business", "level": "B2", "fr": "lettre de mission", "en": "engagement letter", "notes": "Contrat formel définissant le périmètre, honoraires, responsabilités.", "examples": [{"fr": "La lettre de mission a été signée la semaine dernière.", "en": "The engagement letter was signed last week."}]}, {"id": "en_v_biz_041", "domain": "business", "level": "B1", "fr": "périmètre des travaux", "en": "scope of work", "notes": "Limites précises de ce que couvre la mission.", "examples": [{"fr": "Le périmètre des travaux exclut la filiale chinoise.", "en": "The scope of work excludes the Chinese subsidiary."}]}, {"id": "en_v_biz_042", "domain": "business", "level": "A2", "fr": "livrables", "en": "deliverables", "ipa": "dɪˈlɪvərəblz", "notes": "Documents/produits formellement attendus par le client.", "examples": [{"fr": "Les livrables incluent le rapport et la lettre de recommandations.", "en": "Deliverables include the report and the management letter."}]}, {"id": "en_v_biz_043", "domain": "business", "level": "B1", "fr": "jalon", "en": "milestone", "ipa": "ˈmaɪlstəʊn", "notes": "Étape clé du projet avec date butoir.", "examples": [{"fr": "Le prochain jalon est la revue intermédiaire.", "en": "The next milestone is the interim review."}]}, {"id": "en_v_biz_044", "domain": "business", "level": "B1", "fr": "réunion de lancement", "en": "kick-off meeting", "notes": "Première réunion formelle de la mission.", "examples": [{"fr": "Le kick-off est prévu lundi à 9h chez le client.", "en": "The kick-off is scheduled Monday at 9 a.m. at the client's office."}]}, {"id": "en_v_biz_045", "domain": "business", "level": "B1", "fr": "point d'avancement", "en": "status update", "notes": "Brief régulier sur l'état du projet (souvent hebdo).", "examples": [{"fr": "Le point d'avancement hebdomadaire a lieu vendredi.", "en": "The weekly status update takes place on Friday."}]}, {"id": "en_v_biz_046", "domain": "business", "level": "B2", "fr": "réunion de clôture", "en": "closure meeting", "notes": "Bilan de fin de mission, restitution des conclusions.", "examples": [{"fr": "La réunion de clôture est planifiée le 15 mars.", "en": "The closure meeting is scheduled for 15 March."}]}, {"id": "en_v_biz_047", "domain": "business", "level": "B2", "fr": "debriefing", "en": "debrief", "notes": "Retour d'expérience post-mission ou post-réunion.", "examples": [{"fr": "Le debrief post-fieldwork dure 30 minutes.", "en": "The post-fieldwork debrief lasts 30 minutes."}]}, {"id": "en_v_biz_048", "domain": "business", "level": "B2", "fr": "dérive du périmètre", "en": "scope creep", "notes": "Élargissement progressif et non facturé des travaux.", "examples": [{"fr": "Le manager surveille tout signe de scope creep.", "en": "The manager watches out for any signs of scope creep."}]}, {"id": "en_v_biz_049", "domain": "business", "level": "B1", "fr": "préparé par le client", "en": "prepared by client (PBC)", "notes": "Documents que le client doit fournir.", "examples": [{"fr": "Cette analyse est PBC, je relance le client.", "en": "This analysis is PBC; I'll follow up with the client."}]}, {"id": "en_v_biz_050", "domain": "business", "level": "B1", "fr": "liste de documents demandés", "en": "PBC list", "notes": "Liste structurée des éléments à fournir par le client.", "examples": [{"fr": "La PBC list a été envoyée au CFO.", "en": "The PBC list was sent to the CFO."}]}, {"id": "en_v_biz_051", "domain": "business", "level": "A2", "fr": "demande client", "en": "client request", "notes": "Information ou document sollicité auprès du client.", "examples": [{"fr": "J'ai trois demandes clients en attente.", "en": "I have three client requests pending."}]}, {"id": "en_v_biz_052", "domain": "business", "level": "A2", "fr": "relance", "en": "follow-up", "notes": "Rappel pour obtenir une réponse ou un document.", "examples": [{"fr": "Une relance est nécessaire sur la confirmation bancaire.", "en": "A follow-up is needed on the bank confirmation."}]}, {"id": "en_v_biz_053", "domain": "business", "level": "B1", "fr": "escalade", "en": "escalation", "notes": "Remontée hiérarchique d'un problème (au manager, g is done every Friday evening."}]}, {"id": "en_v_biz_060", "domain": "business", "level": "B1", "fr": "facturation", "en": "billing", "notes": "Émission des factures au client.", "examples": [{"fr": "La facturation mensuelle est gérée par le manager.", "en": "Monthly billing is managed by the manager."}]}, {"id": "en_v_biz_061", "domain": "business", "level": "B2", "fr": "abandon de créance", "en": "write-off", "notes": "Heures travaillées non facturées au client (par décision interne).", "examples": [{"fr": "Le write-off sur cette mission est de 15%.", "en": "The write-off on this engagement is 15%."}]}, {"id": "en_v_biz_062", "domain": "business", "level": "B2", "fr": "taux de recouvrement", "en": "recovery rate", "notes": "% des heures facturables effectivement facturées. KPI managers.", "examples": [{"fr": "Le taux de recouvrement cible est de 90%.", "en": "The target recovery rate is 90%."}]}, {"id": "en_v_biz_063", "domain": "business", "level": "B2", "fr": "dépassement de budget", "en": "budget overrun", "notes": "Heures consommées au-delà du budget initial.", "examples": [{"fr": "Le dépassement de budget de 20 heures sera discuté.", "en": "The 20-hour budget overrun will be discussed."}]}, {"id": "en_v_biz_064", "domain": "business", "level": "B1", "fr": "haute saison", "en": "busy season", "notes": "Période de pic d'activité (janvier-mars pour les audits année calendaire).", "examples": [{"fr": "La busy season commence en janvier.", "en": "Busy season starts in January."}]}, {"id": "en_v_biz_065", "domain": "business", "level": "A2", "fr": "présentation", "en": "deck", "ipa": "dek", "notes": "Argot Big 4 pour un PowerPoint.", "examples": [{"fr": "Peux-tu m'envoyer le deck de la dernière réunion ?", "en": "Can you send me the deck from the last meeting?"}]}, {"id": "en_v_biz_066", "domain": "business", "level": "A2", "fr": "diapositive", "en": "slide", "notes": "Une page d'un deck.", "examples": [{"fr": "La slide 12 résume nos conclusions.", "en": "Slide 12
