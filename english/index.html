: [{"id": "conv_001", "title": "Kick-off avec un nouveau client", "level": "B1", "context": "Premier appel Teams avec John, le CFO d'un nouveau client retail. Tu accompagnes ton manager Sarah. Objectif : présenter l'équipe et le planning. Tu es associate first-year.", "duration_min": 5, "turns": [{"speaker": "client", "name": "John (CFO)", "en": "Hi everyone, thanks for joining. Welcome aboard!", "fr": "Bonjour à tous, merci d'être là. Bienvenue !"}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "Thanks John. Let me quickly introduce the team.", "fr": "Merci John. Je vais rapidement présenter l'équipe."}, {"speaker": "you", "type": "choice", "prompt_fr": "Sarah te passe la parole pour te présenter. Quelle est la meilleure ouverture ?", "options": [{"en": "Hi John, I'm thrilled to be working with you. I'll be focusing on the revenue and inventory cycles.", "correct": true, "feedback_fr": "Parfait : chaleureux, professionnel, et tu cadres déjà ton périmètre. C'est exactement ce qu'attend un CFO."}, {"en": "Hello. My name is Vincent. I am from Switzerland.", "correct": false, "feedback_fr": "Trop scolaire — Évite les phrases canon de manuel. Sois plus naturel et professionnel."}, {"en": "Hey, I'm Vincent, I'm new so bear with me.", "correct": false, "feedback_fr": "Évite de t'auto-dévaluer dès la première impression. Le CFO doit te faire confiance."}]}, {"speaker": "client", "name": "John (CFO)", "en": "Great. So what's the timeline looking like?", "fr": "Parfait. Et ça donne quoi côté planning ?"}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "We're aiming to start fieldwork on 15 January and wrap up by mid-March.", "fr": "Nous visons un démarrage terrain le 15 janvier et une finalisation à la mi-mars."}, {"speaker": "you", "type": "choice", "prompt_fr": "John semble préoccupé par le timing. Quelle question poses-tu pour clarifier ?", "options": [{"en": "Are there any specific dates we should be aware of on your side?", "correct": true, "feedback_fr": "Excellente question — proactive, montre que tu penses à leurs contraintes (conseil d'administration, ad hoc reports)."}, {"en": "Will you give us everything fast?", "correct": false, "feedback_fr": "Trop direct et un peu agressif. Préfère une formulation collaborative."}, {"en": "OK no problem we will manage.", "correct": false, "feedback_fr": "Tu rates l'occasion de clarifier — un audit mal cadré dérape vite."}]}, {"speaker": "client", "name": "John (CFO)", "en": "Our board meeting is on 22 March, so we'd need the report a few days before.", "fr": "Notre conseil d'administration est le 22 mars, on aurait besoin du rapport quelques jours avant."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu pour clore la réunion proprement ?", "options": [{"en": "Noted. I'll make sure that's reflected in our planning and we'll keep you posted on any risks to that date.", "correct": true, "feedback_fr": "Idéal : tu confirmes, tu engages et tu ouvres la porte à une communication continue."}, {"en": "OK no problem we will be done.", "correct": false, "feedback_fr": "Trop léger — ne promets jamais sans nuances dans un audit."}, {"en": "Yeah, we'll see.", "correct": false, "feedback_fr": "Très peu engageant et peu professionnel."}]}]}, {"id": "conv_002", "title": "Question client — IFRS 16 leases", "level": "B2", "context": "Tu auditionnes le contrôleur de gestion Maria sur le traitement IFRS 16 des contrats de location. Tu veux comprendre pourquoi certains contrats ne sont pas au bilan.", "duration_min": 6, "turns": [{"speaker": "client", "name": "Maria (Controller)", "en": "You wanted to discuss the lease portfolio?", "fr": "Tu voulais parler du portefeuille de baux ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu l'entretien sans donner l'impression d'un interrogatoire ?", "options": [{"en": "Yes, thanks for making the time. Could you walk me through how you've identified leases under IFRS 16?", "correct": true, "feedback_fr": "Parfait : tu remercies, tu utilises 'walk me through' (formule auditeur classique) et tu cadres le périmètre."}, {"en": "Yes, why are some leases not on the balance sheet?", "correct": false, "feedback_fr": "Trop frontal — laisse au client le temps de t'expliquer son raisonnement avant de challenger."}, {"en": "Sure, give me everything you have.", "correct": false, "feedback_fr": "Trop directif et vague — Maria ne saura pas par où commencer."}]}, {"speaker": "client", "name": "Maria (Controller)", "en": "Sure. We applied the short-term and low-value exemptions for many contracts.", "fr": "Bien sûr. Nous avons appliqué les exemptions short-term et low-value pour beaucoup de contrats."}, {"speaker": "you", "type": "choice", "prompt_fr": "Maria mentionne les exemptions. Quelle relance technique pertinente ?", "options": [{"en": "Got it. Could you share how you determined which leases qualified as short-term?", "correct": true, "feedback_fr": "Bonne question technique : tu vérifies la méthodologie sans accuser. 'Got it' montre que tu écoutes."}, {"en": "OK that's fine.", "correct": false, "feedback_fr": "Trop passif — l'auditeur doit creuser, surtout sur les exemptions qui réduisent le bilan."}, {"en": "That's wrong, you can't do that.", "correct": false, "feedback_fr": "Tu n'as pas encore les éléments — ne juge pas avant d'avoir compris."}]}, {"speaker": "client", "name": "Maria (Controller)", "en": "We checked the original lease term — if it was 12 months or less without renewal options, we treated it as short-term.", "fr": "On a regardé la durée initiale — si elle était de 12 mois ou moins sans option de renouvellement, on l'a traitée en short-term."}, {"speaker": "you", "type": "choice", "prompt_fr": "Tu repères un point sensible. Que demandes-tu pour creuser ?", "options": [{"en": "Did you also consider whether the renewal options were reasonably certain to be exercised?", "correct": true, "feedback_fr": "Excellent : tu pointes le critère IFRS 16.B37 sans agressivité, en utilisant 'reasonably certain' (terminologie exacte)."}, {"en": "That's not enough. Show me everything.", "correct": false, "feedback_fr": "Tu mets Maria sur la défensive sans préciser ce que tu cherches."}, {"en": "OK that sounds fine, let's move on.", "correct": false, "feedback_fr": "Tu rates le point clé : les options de renouvellement font basculer la classification."}]}, {"speaker": "client", "name": "Maria (Controller)", "en": "Honestly, we didn't formally assess that. Should we have?", "fr": "Honnêtement, on n'a pas fait d'analyse formelle là-dessus. On aurait dû ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Maria admet une lacune. Comment réagis-tu professionnellement ?", "options": [{"en": "It's worth a closer look. Could you send me the lease contracts and we'll review the renewal terms together?", "correct": true, "feedback_fr": "Idéal : tu valides le besoin sans la juger, tu proposes une approche collaborative."}, {"en": "Yes, you should have. This is a finding.", "correct": false, "feedback_fr": "Trop tranchant — même si c'est probablement une déficience, le ton crée du défensif inutile."}, {"en": "No worries, we'll figure it out.", "correct": false, "feedback_fr": "Tu minimises un point qui pourrait être un ajustement significatif."}]}]}, {"id": "conv_003", "title": "Point d'avancement avec ton manager", "level": "B1", "context": "15h, vendredi. Ton manager Sarah te demande un point sur tes cycles. Tu as deux blocages en attente. Sois honnête et structuré.", "duration_min": 4, "turns": [{"speaker": "manager", "name": "Sarah (Manager)", "en": "Quick check-in — where are we on the receivables and revenue cycles?", "fr": "Point rapide — où en es-tu sur les créances et le revenu ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment commences-tu ton point d'avancement ?", "options": [{"en": "Receivables is largely complete. Revenue is about 60% done — I'll get to the highlights and blockers.", "correct": true, "feedback_fr": "Parfait : tu donnes une vue globale, un % d'avancement, et tu annonces la structure de ton point."}, {"en": "Receivables done. Revenue not finished.", "correct": false, "feedback_fr": "Trop sec et flou — Sarah ne sait pas où sont les vrais sujets."}, {"en": "Yes I am working on it.", "correct": false, "feedback_fr": "Tu n'as donné aucune information utile à Sarah."}]}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "OK go ahead.", "fr": "OK vas-y."}, {"speaker": "you", "type": "choice", "prompt_fr": "Tu signales tes deux blocages. Quelle formulation est la plus pro ?", "options": [{"en": "I have two blockers: client hasn't sent the sales contracts yet, and I'm unsure how to test variable consideration. Could you help on the second?", "correct": true, "feedback_fr": "Excellent : factuel, précis sur les blocages, et tu demandes de l'aide ciblée. C'est ce qu'un manager attend."}, {"en": "Everything is fine but slow.", "correct": false, "feedback_fr": "Vague et non actionnable — Sarah ne peut pas t'aider."}, {"en": "There is a problem but I don't know how to solve it.", "correct": false, "feedback_fr": "Trop vague — précise quel problème, sur quel sujet, et ce que tu as déjà essayé."}]}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "Sure, let's grab 30 minutes Monday morning. Anything else?", "fr": "Bien sûr, prenons 30 minutes lundi matin. Autre chose ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment clos-tu le point ?", "options": [{"en": "That's it for now. I'll send you the updated planning by end of day.", "correct": true, "feedback_fr": "Idéal : tu confirmes et tu engages sur un livrable concret."}, {"en": "No, that's all bye.", "correct": false, "feedback_fr": "Trop bref et tu ne proposes aucun follow-up tangible."}, {"en": "Yes a lot more but never mind.", "correct": false, "feedback_fr": "N'écarte pas des sujets en réunion — soit tu les remontes, soit ils n'existent pas."}]}]}, {"id": "conv_004", "title": "Revue partner — défendre un ajustement", "level": "B2", "context": "Le partner James revoit ton mémo sur un ajustement de CHF 1.2M. Il challenge ta conclusion. Tu dois défendre ta position calmement.", "duration_min": 6, "turns": [{"speaker": "partner", "name": "James (Partner)", "en": "I'm not entirely convinced by your conclusion on the inventory provision. Walk me through it.", "fr": "Je ne suis pas tout à fait convaincu par ta conclusion sur la provision stocks. Explique-moi."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu ta défense ?", "options": [{"en": "Sure, happy to walk you through it. The key driver is the slow-moving inventory aged over 12 months — let me show you the analysis.", "correct": true, "feedback_fr": "Parfait : tu acceptes le challenge sereinement, tu donnes le 'key driver' et tu engages avec la preuve."}, {"en": "My conclusion is right.", "correct": false, "feedback_fr": "Trop frontal — un partner attend une argumentation, pas une déclaration."}, {"en": "Sarah told me to do that.", "correct": false, "feedback_fr": "Ne renvoie jamais la responsabilité sur ton manager — défends ta propre analyse."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "But the client argues these items are still saleable.", "fr": "Mais le client soutient que ces articles sont toujours vendables."}, {"speaker": "you", "type": "choice", "prompt_fr": "James pousse l'argument du client. Comment maintiens-tu ta position ?", "options": [{"en": "That's a fair point, but our testing showed only 8% of the aged items were sold in the last 6 months — well below their forecast.", "correct": true, "feedback_fr": "Excellent : 'fair point' montre du respect, puis tu apportes une donnée chiffrée pour étayer ta position."}, {"en": "They are wrong.", "correct": false, "feedback_fr": "Ne juge pas le client — apporte des éléments objectifs."}, {"en": "Maybe I should change my conclusion then.", "correct": false, "feedback_fr": "Évite de céder à la première pression — défends d'abord ton analyse avec des faits."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Did you discuss this with the client's commercial team?", "fr": "Tu en as parlé à l'équipe commerciale du client ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Tu n'as parlé qu'au CFO. Comment le formules-tu ?", "options": [{"en": "Not directly. I focused on the CFO and finance team. Would it strengthen our position to get the commercial perspective?", "correct": true, "feedback_fr": "Idéal : tu admets l'omission factuellement, puis tu retournes la question pour faire avancer la décision."}, {"en": "No, I didn't think it was necessary.", "correct": false, "feedback_fr": "Tu fermes la porte — un partner cherche à voir comment tu enrichis ton analyse."}, {"en": "Yes I did.", "correct": false, "feedback_fr": "Ne mens jamais à un partner. La vérité finit toujours par sortir."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Yes, let's add that. Otherwise, your analysis is solid. Push on the commercial team and let me know by Wednesday.", "fr": "Oui, ajoutons ça. Sinon ton analyse tient la route. Pousse côté commercial et reviens vers moi mercredi."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment clos-tu cette revue partner ?", "options": [{"en": "Thanks for the feedback — I'll set up the meeting with the commercial team this afternoon.", "correct": true, "feedback_fr": "Parfait : remerciement (le feedback est précieux) + engagement concret avec timing."}, {"en": "OK fine.", "correct": false, "feedback_fr": "Trop léger pour clore une revue partner — laisse une impression d'engagement faible."}, {"en": "This was hard.", "correct": false, "feedback_fr": "Pas le moment de partager une émotion — sois professionnel et orienté action."}]}]}, {"id": "conv_005", "title": "Discussion informelle à la pause café", "level": "A2", "context": "Pause café. Tu rencontres pour la première fois un collègue, Tom (senior). Conversation informelle — sois naturel.", "duration_min": 3, "turns": [{"speaker": "colleague", "name": "Tom (Senior)", "en": "Hey, you must be the new joiner. I'm Tom.", "fr": "Hé, tu dois être le nouveau ! Moi c'est Tom."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment te présentes-tu naturellement ?", "options": [{"en": "Hi Tom, nice to meet you. I'm Vincent — just started last week. How long have you been here?", "correct": true, "feedback_fr": "Parfait : chaleureux, tu te présentes, et tu ouvres la conversation."}, {"en": "My name is Vincent. I am from Switzerland and I work here.", "correct": false, "feedback_fr": "Trop scolaire — fais plus naturel."}, {"en": "Hi.", "correct": false, "feedback_fr": "Trop court — manque de chaleur pour une première rencontre."}]}, {"speaker": "colleague", "name": "Tom (Senior)", "en": "Three years now. Welcome aboard! How are you settling in?", "fr": "Trois ans. Bienvenue ! Tu t'acclimates bien ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Tom te demande comment se passe ton intégration. Réponse positive et brève ?", "options": [{"en": "Pretty well, thanks! Everyone's been very welcoming. Still finding my way around the systems though.", "correct": true, "feedback_fr": "Idéal : positif sincère, reconnaissance + une touche d'humilité naturelle."}, {"en": "Yes good.", "correct": false, "feedback_fr": "Beaucoup trop court — coupe la conversation."}, {"en": "It is very hard. I don't know what to do.", "correct": false, "feedback_fr": "Trop négatif pour une première rencontre — garde ça pour ton coach ou ton buddy."}]}, {"speaker": "colleague", "name": "Tom (Senior)", "en": "Sounds familiar! Let me know if you need any help with the audit tools.", "fr": "Ça me parle ! Dis-moi si tu as besoin d'aide avec les outils d'audit."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment clos-tu la conversation chaleureusement ?", "options": [{"en": "That's really kind of you, thanks. I'll definitely take you up on that.", "correct": true, "feedback_fr": "Parfait : 'take you up on that' = je vais accepter ton offre. Très naturel en anglais."}, {"en": "OK.", "correct": false, "feedback_fr": "Très froid pour quelqu'un qui vient de te proposer son aide."}, {"en": "No I don't need help, thanks.", "correct": false, "feedback_fr": "Évite de refuser une offre d'aide — c'est un beau geste à entretenir."}]}]}, {"id": "conv_006", "title": "Demander de l'aide à un senior", "level": "B1", "context": "Tu es bloqué depuis 1h sur un test de matérialité. Un senior, Anna, est dispo. Comment l'aborder sans paraître perdu ?", "duration_min": 4, "turns": [{"speaker": "you", "type": "choice", "prompt_fr": "Tu approches Anna. Quelle ouverture est la plus pro ?", "options": [{"en": "Hey Anna, do you have 5 minutes? I'm stuck on materiality and I want to make sure I'm not going down the wrong path.", "correct": true, "feedback_fr": "Idéal : tu demandes un temps borné, tu cadres le sujet, tu montres que tu réfléchis (pas juste 'aide-moi')."}, {"en": "Anna I don't understand anything, can you help me?", "correct": false, "feedback_fr": "Trop vague et auto-dévaluant — tu donnes l'impression d'être perdu."}, {"en": "Anna, do this for me please.", "correct": false, "feedback_fr": "Tu demandes à Anna de faire le travail — un senior aide à débloquer, pas à exécuter."}]}, {"speaker": "colleague", "name": "Anna (Senior)", "en": "Sure, what's the issue?", "fr": "Bien sûr, c'est quoi le souci ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment exposes-tu ton blocage de manière structurée ?", "options": [{"en": "I computed performance materiality at 70% of overall, but I'm not sure that's appropriate given the listed entity context. What's your view?", "correct": true, "feedback_fr": "Parfait : tu donnes ton calcul, ton doute précis et tu demandes une opinion. Anna n'a qu'à confirmer ou nuancer."}, {"en": "It is too difficult.", "correct": false, "feedback_fr": "Vague — Anna ne peut pas t'aider sans contexte."}, {"en": "I tried everything but nothing works.", "correct": false, "feedback_fr": "Tu n'as donné aucune information actionnable."}]}, {"speaker": "colleague", "name": "Anna (Senior)", "en": "For listed entities we usually go to 50%. Did you document why you chose 70%?", "fr": "Pour les entités cotées on est plutôt à 50%. Tu as documenté pourquoi tu as choisi 70% ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Anna te corrige et te pose une question. Réponse honnête ?", "options": [{"en": "Not formally — I'll redo it at 50% and document the rationale today. Thanks Anna, that's really helpful.", "correct": true, "feedback_fr": "Idéal : tu acceptes la correction, tu t'engages sur l'action, tu remercies."}, {"en": "Yes I did.", "correct": false, "feedback_fr": "Ne mens pas à un senior — la documentation se vérifie en 5 minutes."}, {"en": "OK I'll change it.", "correct": false, "feedback_fr": "Trop sec — Anna t'a aidé, remercie et engage-toi clairement."}]}]}, {"id": "conv_007", "title": "Décliner une demande client de dernière minute", "level": "B2", "context": "Jeudi 17h. Le client te demande un rapport complémentaire pour vendredi matin. Tu sais que c'est impossible sans déborder. Tu dois décliner sans casser la relation.", "duration_min": 4, "turns": [{"speaker": "client", "name": "Maria (CFO)", "en": "I know it's short notice, but could you send a detailed analysis of the inventory variances by tomorrow morning?", "fr": "Je sais que c'est court, mais pourrais-tu envoyer une analyse détaillée des écarts stocks d'ici demain matin ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu ta réponse pour décliner sans froisser ?", "options": [{"en": "I appreciate the urgency, but realistically we can't deliver something meaningful by tomorrow without compromising on quality.", "correct": true, "feedback_fr": "Excellent : reconnaissance + raison concrète (qualité) + pas d'engagement creux."}, {"en": "No, that's impossible.", "correct": false, "feedback_fr": "Trop frontal et sans nuance — tu fermes la conversation."}, {"en": "OK we'll try.", "correct": false, "feedback_fr": "Tu t'engages sur l'impossible — recette pour décevoir vendredi matin."}]}, {"speaker": "client", "name": "Maria (CFO)", "en": "I understand, but the board meeting is Monday and I really need something.", "fr": "Je comprends, mais le conseil est lundi et j'ai vraiment besoin de quelque chose."}, {"speaker": "you", "type": "choice", "prompt_fr": "Maria insiste. Comment proposes-tu un compromis ?", "options": [{"en": "Could we agree on a short summary by Friday end of day, with the detailed version early next week?", "correct": true, "feedback_fr": "Parfait : tu proposes une alternative concrète qui sert les deux parties."}, {"en": "Fine, I'll do it.", "correct": false, "feedback_fr": "Tu cèdes — et tu vas livrer quelque chose de bâclé."}, {"en": "Sorry, no.", "correct": false, "feedback_fr": "Tu rates l'opportunité de trouver un compromis professionnel."}]}, {"speaker": "client", "name": "Maria (CFO)", "en": "That works. Let's do that.", "fr": "Ça marche. Faisons comme ça."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment closes-tu cet échange ?", "options": [{"en": "Thank you for understanding. I'll send the summary by 5pm Friday and the full analysis by Tuesday.", "correct": true, "feedback_fr": "Idéal : tu remercies, tu confirmes les deux dates précises."}, {"en": "OK bye.", "correct": false, "feedback_fr": "Trop léger pour une négociation aboutie — laisse une impression non pro."}, {"en": "Yeah we'll see how it goes.", "correct": false, "feedback_fr": "Tu sapes l'accord que tu viens d'obtenir avec une formule peu engageante."}]}]}, {"id": "conv_008", "title": "Demander une extension de délai au partner", "level": "B2", "context": "Tu réalises que ton mémo ne sera pas prêt pour la deadline de demain — le client a tardé à fournir des éléments clés. Tu dois en parler au partner James maintenant, pas demain.", "duration_min": 4, "turns": [{"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu la conversation avec James ?", "options": [{"en": "James, do you have a quick minute? I wanted to flag a timing issue on the impairment memo before the end of the day.", "correct": true, "feedback_fr": "Excellent : demande un temps court, signale l'enjeu, et tu remontes proactivement — c'est ce qu'un partner attend."}, {"en": "James I have a problem, the memo won't be ready.", "correct": false, "feedback_fr": "Trop direct sans cadrage — tu mets James sur la défensive."}, {"en": "Sorry to disturb but I'm late.", "correct": false, "feedback_fr": "Trop auto-dévaluant et flou — ne donne pas l'information clé."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Sure. What's going on?", "fr": "Bien sûr. Que se passe-t-il ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Explique factuellement la situation.", "options": [{"en": "The client only sent the supporting valuation files this afternoon, so I won't have time to finalise the memo by tomorrow's deadline. I'd need until Thursday end of day to do it properly.", "correct": true, "feedback_fr": "Parfait : factuel (cause), impact (pas demain), proposition (jeudi). Tout ce qu'il faut."}, {"en": "It's the client's fault, they were late.", "correct": false, "feedback_fr": "Ne rejette pas la faute — décris factuellement et propose une solution."}, {"en": "I need more time but I don't know how much.", "correct": false, "feedback_fr": "Demander une extension sans préciser combien = inacceptable pour un partner."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Thursday is tight given the review timeline. Could you get me a first draft by Wednesday and we'll iterate from there?", "fr": "Jeudi est juste vu le timing de revue. Tu peux me fournir un premier draft mercredi et on itère ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "James propose une contre-offre. Comment réponds-tu ?", "options": [{"en": "That works. I'll send a draft by Wednesday end of day and we can refine after your review.", "correct": true, "feedback_fr": "Idéal : tu acceptes clairement, tu confirmes le timing et la suite."}, {"en": "OK.", "correct": false, "feedback_fr": "Trop court pour un accord important — confirme et précise."}, {"en": "That's still tight for me.", "correct": false, "feedback_fr": "Tu rejettes la contre-offre du partner — tu perds tout terrain négocié."}]}]}, {"id": "conv_009", "title": "Conf call avec EY India GDS", "level": "B1", "context": "Premier appel avec ton homologue Priya à Bangalore (EY India GDS). Elle va t'aider sur les tests de procédure stocks. Accent indien à anticiper, communication efficace requise.", "duration_min": 4, "turns": [{"speaker": "colleague", "name": "Priya (EY India GDS)", "en": "Hi Vincent, very nice to meet you. I'll be supporting you on the inventory testing this year.", "fr": "Bonjour Vincent, ravie de te rencontrer. Je vais t'aider sur les tests stocks cette année."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu pour bien démarrer la relation à distance ?", "options": [{"en": "Hi Priya, great to e-meet you too. Thanks for joining the team. Could we start by walking through the scope of your support?", "correct": true, "feedback_fr": "Excellent : chaleureux, professionnel, et tu cadres directement le scope — efficace pour des missions distribuées."}, {"en": "Hello yes do the testing.", "correct": false, "feedback_fr": "Trop directif et impersonnel — tue la relation dès le départ."}, {"en": "Hi Priya. Bye.", "correct": false, "feedback_fr": "Sans intérêt — Priya va se sentir ignorée."}]}, {"speaker": "colleague", "name": "Priya (EY India GDS)", "en": "Sure. As I understand, I'll be doing the analytical procedures and you'll review my work. Is that correct?", "fr": "Bien sûr. Si j'ai bien compris, je fais les procédures analytiques et tu revois mon travail. C'est bien ça ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment confirmes-tu et ajoutes le timing ?", "options": [{"en": "That's right. We'd typically need the analytics two days before our team review — does that fit your bandwidth?", "correct": true, "feedback_fr": "Parfait : confirmation + question sur sa capacité. Montre que tu respectes son temps."}, {"en": "Yes, just do it.", "correct": false, "feedback_fr": "Trop directif — tu donnes l'impression qu'elle n'a pas de marge."}, {"en": "Yes, finish quickly.", "correct": false, "feedback_fr": "Pression sans cadrage utile — peu professionnel."}]}, {"speaker": "colleague", "name": "Priya (EY India GDS)", "en": "Sorry, could you repeat — the connection broke up for a second?", "fr": "Désolée, peux-tu répéter — la connexion a coupé une seconde ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu naturellement à un problème de connexion ?", "options": [{"en": "Of course, no worries. I was asking whether two days before the team review works on your side.", "correct": true, "feedback_fr": "Idéal : tu réassures et tu reformules sans irritation."}, {"en": "I said it already.", "correct": false, "feedback_fr": "Impolice — ne refais pas porter le poids du problème à Priya."}, {"en": "Never mind.", "correct": false, "feedback_fr": "Tu coupes la conversation alors qu'elle posait une vraie question."}]}]}, {"id": "conv_010", "title": "Recevoir un feedback critique en évaluation", "level": "B2", "context": "Évaluation semestrielle avec ton coach Anna. Elle te remonte un point de friction sur la communication client. Ne te défends pas — écoute, comprends, engage-toi.", "duration_min": 4, "turns": [{"speaker": "manager", "name": "Anna (Coach)", "en": "Overall your technical work has been strong. There's one area I'd like to discuss — the client mentioned your emails have come across as too brief at times.", "fr": "Globalement ton travail technique est solide. Il y a un point à discuter — le client a remonté que tes emails étaient parfois perçus comme trop secs."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment accueilles-tu ce retour critique ?", "options": [{"en": "Thanks for the candid feedback. Could you give me a specific example so I can understand what's coming across that way?", "correct": true, "feedback_fr": "Excellent : tu remercies (pas évident sous critique), tu demandes un exemple concret. Posture pro."}, {"en": "That's not true, my emails are fine.", "correct": false, "feedback_fr": "Tu te défends immédiatement — bloque tout apprentissage et frustre Anna."}, {"en": "OK noted, anything else?", "correct": false, "feedback_fr": "Tu fermes la conversation — pas une vraie réflexion."}]}, {"speaker": "manager", "name": "Anna (Coach)", "en": "For example, when the controller asked about the goodwill calculation, your reply was three lines. The client felt rushed.", "fr": "Par exemple, quand le contrôleur a demandé sur le calcul du goodwill, ta réponse faisait 3 lignes. Le client s'est senti expédié."}, {"speaker": "you", "type": "choice", "prompt_fr": "Anna t'a donné un exemple concret. Comment réagis-tu ?", "options": [{"en": "I see — I was probably trying to be efficient but came across as curt. I'll add more context and a friendly opening on technical replies going forward.", "correct": true, "feedback_fr": "Idéal : tu acceptes, tu reformules ce que tu vas changer concrètement. Anna voit que tu prends ça en main."}, {"en": "OK I'll write longer emails.", "correct": false, "feedback_fr": "Trop superficiel — Anna ne saura pas si tu as vraiment compris."}, {"en": "It was only three lines because the answer was simple.", "correct": false, "feedback_fr": "Justification défensive — tu n'as pas entendu le retour."}]}, {"speaker": "manager", "name": "Anna (Coach)", "en": "Great. Let's check in on this in two months. Anything else you'd like to discuss?", "fr": "Parfait. On en reparle dans deux mois. Autre chose à aborder ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment clos-tu en orientant vers tes propres objectifs ?", "options": [{"en": "I'd like to take more ownership on IFRS 16 topics next quarter. Could you help me get exposure on the lease portfolio of client X?", "correct": true, "feedback_fr": "Parfait : tu transformes la conversation en plan de développement actif. Très EY."}, {"en": "No that's all thanks.", "correct": false, "feedback_fr": "Tu rates l'opportunité de positionner tes propres objectifs."}, {"en": "I don't know.", "correct": false, "feedback_fr": "Évite l'incertitude en évaluation — prépare toujours un objectif."}]}]}, {"id": "conv_011", "title": "Présenter une finding au comité d'audit", "level": "B2", "context": "Comité d'audit semestriel. James (le partner) t'a demandé de présenter brièvement une déficience identifiée sur le contrôle des achats. 5 minutes max, devant 6 personnes.", "duration_min": 5, "turns": [{"speaker": "partner", "name": "James (Partner)", "en": "Vincent will now walk you through the key finding on the purchase cycle. Vincent, over to you.", "fr": "Vincent va maintenant vous présenter la principale constatation sur le cycle achats. Vincent, à toi."}, {"speaker": "you", "type": "choice", "prompt_fr": "Ton ouverture devant le comité — quelle phrase ?", "options": [{"en": "Thank you, James. The finding I'd like to highlight concerns a segregation of duties weakness in the purchase approval process — let me walk you through what we observed.", "correct": true, "feedback_fr": "Excellent : remerciement bref, titre clair de la finding, annonce de structure. Standard de comité."}, {"en": "Yeah hi, so we found something.", "correct": false, "feedback_fr": "Inacceptable devant un comité d'audit — tu perds toute crédibilité."}, {"en": "OK so I will tell you what is wrong.", "correct": false, "feedback_fr": "Vague et peu structuré — un comité veut une présentation rigoureuse."}]}, {"speaker": "client", "name": "Board chair", "en": "Could you quantify the financial impact?", "fr": "Pouvez-vous chiffrer l'impact financier ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Question chiffrée du président du conseil. Comment cadres-tu la réponse ?", "options": [{"en": "Based on our testing, the gross exposure is approximately CHF 850,000, though the actual loss risk is lower as compensating controls partially mitigate it.", "correct": true, "feedback_fr": "Idéal : tu donnes le chiffre brut puis nuances avec les contrôles compensatoires. Réponse pondérée pro."}, {"en": "It's a lot.", "correct": false, "feedback_fr": "Inacceptable devant un comité — ils attendent un chiffre précis."}, {"en": "I don't have the exact figure.", "correct": false, "feedback_fr": "Si tu ne sais pas, prépare avant. Mais si tu le sais, donne-le."}]}, {"speaker": "client", "name": "Board chair", "en": "What's your recommendation?", "fr": "Quelle est votre recommandation ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Recommande concrètement.", "options": [{"en": "We recommend implementing a dual-approval requirement for purchases above CHF 50,000 and a quarterly review of override transactions by internal audit.", "correct": true, "feedback_fr": "Excellent : recommandation chiffrée, opérationnelle, en deux temps. Très pro."}, {"en": "Improve the controls.", "correct": false, "feedback_fr": "Trop vague — un comité ne peut rien faire avec ça."}, {"en": "Maybe think about it.", "correct": false, "feedback_fr": "Inacceptable comme recommandation devant un comité."}]}, {"speaker": "client", "name": "Board chair", "en": "Thank you, that's clear. We'll follow up with management.", "fr": "Merci, c'est clair. Nous suivrons avec la direction."}, {"speaker": "you", "type": "choice", "prompt_fr": "Phrase de clôture devant le comité ?", "options": [{"en": "Thank you for your time. I'm happy to provide further detail offline if useful.", "correct": true, "feedback_fr": "Parfait : remerciement bref + porte ouverte sans s'imposer."}, {"en": "OK bye.", "correct": false, "feedback_fr": "Inacceptable devant un comité."}, {"en": "I hope I was clear.", "correct": false, "feedback_fr": "Question fermée en sortie — laisse une impression d'insécurité."}]}]}, {"id": "conv_012", "title": "Demander une rotation à son coach", "level": "B2", "context": "Après 18 mois en audit retail, tu veux découvrir l'industrie financière. Tu en parles à ton coach Anna. Sois clair sur ce que tu veux et pourquoi, sans dénigrer ta mission actuelle.", "duration_min": 3, "turns": [{"speaker": "manager", "name": "Anna (Coach)", "en": "Anything you'd like to discuss before we wrap up?", "fr": "Quelque chose à aborder avant de clôturer ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu le sujet rotation ?", "options": [{"en": "Yes — I wanted to discuss my development plan. I've enjoyed the retail audits, and I'd like to broaden my exposure with a rotation into the banking team next year.", "correct": true, "feedback_fr": "Idéal : tu remercies le présent (retail), tu cadres comme développement (pas fuite), tu es spécifique (banking)."}, {"en": "I want to leave retail, I'm tired.", "correct": false, "feedback_fr": "Trop négatif — donne l'impression que tu fuis, pas que tu construis."}, {"en": "I want to do something else.", "correct": false, "feedback_fr": "Trop vague — Anna ne peut rien proposer de concret."}]}, {"speaker": "manager", "name": "Anna (Coach)", "en": "That's a fair ambition. Why banking specifically?", "fr": "C'est une ambition légitime. Pourquoi banking spécifiquement ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Justifie ta motivation banking.", "options": [{"en": "IFRS 9 and the credit risk side really interest me — and I'd like to see how regulated industries handle audit differently from retail.", "correct": true, "feedback_fr": "Parfait : tu donnes une raison technique (IFRS 9) ET une raison métier (régulation). Très solide."}, {"en": "Because it pays more.", "correct": false, "feedback_fr": "Réponse maladroite — Anna pensera que tu chasses la rémunération."}, {"en": "I don't know really, it just seems interesting.", "correct": false, "feedback_fr": "Sans justification structurée — tu perds le terrain gagné."}]}, {"speaker": "manager", "name": "Anna (Coach)", "en": "Let me see what openings are coming up. I'll talk to the banking team partner.", "fr": "Je vois ce qui s'ouvre. Je vais parler au partner banking."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment clos-tu pour engager la suite ?", "options": [{"en": "Thanks Anna, I really appreciate it. Please let me know if there's anything I should do on my side — for example, joining a banking pitch as observer.", "correct": true, "feedback_fr": "Excellent : tu remercies + tu proposes proactivement ton aide. Anna voit que tu es engagé."}, {"en": "OK thanks.", "correct": false, "feedback_fr": "Trop léger — ne traduit pas l'engagement attendu."}, {"en": "So you'll get back to me?", "correct": false, "feedback_fr": "Manque d'engagement de ta part — Anna pourrait douter de ta motivation."}]}]}, {"id": "conv_013", "title": "Appel de clôture avec le client", "level": "B1", "context": "Dernier appel de l'audit. John, le CFO, te remercie. C'est ta chance de consolider la relation pour l'année prochaine.", "duration_min": 3, "turns": [{"speaker": "client", "name": "John (CFO)", "en": "Vincent, thanks for everything this year. The team has appreciated your responsiveness.", "fr": "Vincent, merci pour tout cette année. L'équipe a apprécié ta réactivité."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu chaleureusement et professionnellement ?", "options": [{"en": "Thank you, John — that means a lot. It was a pleasure working with your team, especially the controllers' group who made our job much easier.", "correct": true, "feedback_fr": "Idéal : remerciement personnel + reconnaissance d'une partie spécifique (renforce la relation)."}, {"en": "Yes thanks I tried my best.", "correct": false, "feedback_fr": "Trop centré sur toi — manque de chaleur envers John."}, {"en": "Yeah cool.", "correct": false, "feedback_fr": "Totalement inadéquat pour un wrap-up client."}]}, {"speaker": "client", "name": "John (CFO)", "en": "Any feedback for us on how we could make next year smoother?", "fr": "Un retour pour nous sur comment rendre l'année prochaine plus fluide ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Que proposes-tu de constructif ?", "options": [{"en": "One small suggestion: if the PBC list could be uploaded to your shared folder one week earlier, it would let us plan fieldwork more efficiently.", "correct": true, "feedback_fr": "Parfait : suggestion concrète, mesurable, et bénéfique aux deux parties."}, {"en": "Nothing really.", "correct": false, "feedback_fr": "Tu rates l'occasion de faciliter l'année suivante."}, {"en": "Everything was perfect.", "correct": false, "feedback_fr": "Trop générique — ne renforce pas la relation pro."}]}, {"speaker": "client", "name": "John (CFO)", "en": "Noted, that's a good idea. We'll plan for that.", "fr": "Noté, bonne idée. On planifiera ça."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment clos-tu pour préparer l'année prochaine ?", "options": [{"en": "Great. I'll be in touch in Q4 to kick off the planning. Wishing you a great quarter ahead.", "correct": true, "feedback_fr": "Parfait : engagement de suite + souhait personnel. Très pro."}, {"en": "OK bye.", "correct": false, "feedback_fr": "Inacceptable comme clôture d'un audit annuel."}, {"en": "See you next year maybe.", "correct": false, "feedback_fr": "'Maybe' sape la relation — tu dois projeter de la confiance."}]}]}, {"id": "conv_014", "title": "Year-end celebration informelle", "level": "A2", "context": "Fin d'année — afterwork au bar avec ton équipe d'audit. Tu rencontres un partner que tu connais peu, James. Conversation détendue mais qui peut compter.", "duration_min": 3, "turns": [{"speaker": "partner", "name": "James (Partner)", "en": "Vincent! Glad you could make it. How was the year for you?", "fr": "Vincent ! Content que tu sois là. C'était comment cette année ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu chaleureusement à un partner que tu connais peu ?", "options": [{"en": "Thanks James, glad to be here. It's been a really intense year but I learned a huge amount — particularly on the IFRS 16 side.", "correct": true, "feedback_fr": "Idéal : positif, spécifique, montre ce que tu as appris. James s'en souviendra."}, {"en": "Tired, very tired.", "correct": false, "feedback_fr": "Trop négatif pour un partner — donne une mauvaise impression."}, {"en": "It was OK.", "correct": false, "feedback_fr": "Vague — tu rates une occasion de marquer un partner."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Anything you'd like to do more of next year?", "fr": "Quelque chose que tu aimerais faire plus l'an prochain ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Saisis cette occasion informelle pour te positionner.", "options": [{"en": "I'd love to get more exposure on financial instruments. If there's a pitch coming up where I could observe, I'd be happy to volunteer.", "correct": true, "feedback_fr": "Excellent : c'est exactement ce que James veut entendre informellement. Volonté + proposition concrète."}, {"en": "I don't know really.", "correct": false, "feedback_fr": "Tu rates une occasion en or — informel ne veut pas dire vague."}, {"en": "Less hours please.", "correct": false, "feedback_fr": "Maladroit avec un partner — humour mal placé."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Good to know. Let's grab a coffee in January and we can chat properly.", "fr": "Bon à savoir. On prend un café en janvier et on en discute calmement."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu pour engager le suivi ?", "options": [{"en": "Absolutely, I'd appreciate that. I'll send you a couple of slots on Monday.", "correct": true, "feedback_fr": "Parfait : tu acceptes avec enthousiasme + engagement concret de ta part. James voit que tu suis."}, {"en": "OK we'll see.", "correct": false, "feedback_fr": "'We'll see' = laisser passer l'opportunité. Très mauvais signal."}, {"en": "Yes maybe.", "correct": false, "feedback_fr": "Hésitation — pas adapté quand un partner propose un suivi."}]}]}, {"id": "conv_015", "title": "Pitch d'engagement à un prospect", "level": "B2", "context": "Tu accompagnes un partner sur un pitch pour devenir l'auditeur d'une scale-up tech. Tu interviens sur la partie IT/processus. 10 minutes au CFO et au COO.", "duration_min": 4, "turns": [{"speaker": "client", "name": "Sophie (CFO prospect)", "en": "What sets EY apart from the other Big 4 for a company our size?", "fr": "Qu'est-ce qui distingue EY des autres Big 4 pour une entreprise de notre taille ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment positionnes-tu EY sans dénigrer les concurrents ?", "options": [{"en": "For scale-ups, our investment in technology — data analytics on full populations rather than samples — and a senior-led team that scales with you. We see ourselves as a long-term partner.", "correct": true, "feedback_fr": "Idéal : différenciants tangibles (data analytics, équipe senior) + positionnement partenaire. Pro."}, {"en": "We are the best, others are worse.", "correct": false, "feedback_fr": "Inacceptable en pitch — dénigrement de concurrents direct."}, {"en": "We just do our work well.", "correct": false, "feedback_fr": "Trop générique — n'importe quel Big 4 dirait ça."}]}, {"speaker": "client", "name": "Sophie (CFO prospect)", "en": "How would you handle the audit of our cloud-based revenue platform?", "fr": "Comment géreriez-vous l'audit de notre plateforme revenue cloud ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Question technique IT/processus. Comment réponds-tu ?", "options": [{"en": "We'd start with an IT general controls review of the platform, run substantive procedures using data extracts on the full transaction population, and reconcile to the GL through automated routines.", "correct": true, "feedback_fr": "Excellent : approche structurée, vocabulaire technique précis, ton confiant."}, {"en": "Normally, like other audits.", "correct": false, "feedback_fr": "Trop vague — Sophie cherche du concret pour décider."}, {"en": "It depends on many things.", "correct": false, "feedback_fr": "Réponse fuyante — tu perds en crédibilité."}]}, {"speaker": "client", "name": "Sophie (COO prospect)", "en": "And what about transition? We've used another firm for three years.", "fr": "Et la transition ? On utilise un autre cabinet depuis 3 ans."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment gères-tu la question transition ?", "options": [{"en": "Transitions are common. We'd dedicate the first month to understanding your processes and reviewing the prior auditor's working papers under the access protocols — you won't feel a productivity drop on your side.", "correct": true, "feedback_fr": "Parfait : tu reconnais la friction implicite (transitions, productivity drop) et tu rassures avec un plan concret."}, {"en": "It's no problem.", "correct": false, "feedback_fr": "Trop léger — un client cherche du confort sur ce point sensible."}, {"en": "You'll have to help us a lot.", "correct": false, "feedback_fr": "Inverse l'attente — le client veut être rassuré, pas alerté."}]}]}, {"id": "conv_016", "title": "Onboarding lunch avec ton partner", "level": "B2", "context": "Première semaine. Le partner du portfolio t'invite à déjeuner. Conversation détendue mais qui forge ta réputation. Sois curieux et bien préparé.", "duration_min": 3, "turns": [{"speaker": "partner", "name": "James (Partner)", "en": "How's the first week been? Anything surprising so far?", "fr": "C'est comment cette première semaine ? Quelque chose qui te surprend ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu avec sincérité mais maturité ?", "options": [{"en": "It's been intense in a good way. I'm surprised by how much autonomy juniors get — it's a steep learning curve but I appreciate the trust.", "correct": true, "feedback_fr": "Idéal : honnête (intense, learning curve) + positif (appreciate the trust). Mature."}, {"en": "It's hard, I don't know if I can do it.", "correct": false, "feedback_fr": "Trop négatif en présence d'un partner — donne l'impression que tu doutes."}, {"en": "Easy, no problem.", "correct": false, "feedback_fr": "Faux et présomptueux — un partner verra à travers."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "Any questions for me about the team or how things work here?", "fr": "Des questions pour moi sur l'équipe ou comment ça marche ici ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Pose une question qui montre que tu réfléchis à long terme.", "options": [{"en": "How do you think about technical specialisation versus generalist tracks early in the career?", "correct": true, "feedback_fr": "Excellent : question intelligente, structurante, qui montre ta réflexion carrière."}, {"en": "When can I become manager?", "correct": false, "feedback_fr": "Trop direct sur la promotion — pas adapté à un lunch d'onboarding."}, {"en": "None really.", "correct": false, "feedback_fr": "Énorme occasion manquée — un partner offre du mentoring informel."}]}]}, {"id": "conv_017", "title": "Demander conseil à un manager sur un dilemme", "level": "B2", "context": "Tu hésites entre signaler un point ambigu (gris) ou laisser passer. Tu veux l'avis d'un manager sans paraître naïf.", "duration_min": 3, "turns": [{"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu sur un dilemme professionnel ?", "options": [{"en": "Sarah, do you have 10 minutes? I'd like your view on a judgment call I'm wrestling with on the goodwill allocation.", "correct": true, "feedback_fr": "Idéal : temps borné, sujet précis ('judgment call'), tu reconnais que tu cherches un input."}, {"en": "Sarah I have a problem help me.", "correct": false, "feedback_fr": "Trop dramatique et vague."}, {"en": "Should I tell or not?", "correct": false, "feedback_fr": "Question fermée sans contexte — Sarah ne pourra rien dire d'utile."}]}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "Sure, what's the issue?", "fr": "Bien sûr, c'est quoi ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Présente le dilemme de façon équilibrée.", "options": [{"en": "The client's allocation has a CHF 200k gap that's below materiality but doesn't reconcile cleanly. Technically it's immaterial, but I'm not comfortable signing off without flagging it.", "correct": true, "feedback_fr": "Excellent : tu donnes le chiffre, le contexte materialité, ET ton ressenti. Sarah peut t'aider."}, {"en": "There's a problem I don't know what to do.", "correct": false, "feedback_fr": "Sans contexte — inutilisable pour Sarah."}, {"en": "Should I just sign it off?", "correct": false, "feedback_fr": "Tu demandes une autorisation sans présenter le dilemme — Sarah ne peut pas répondre."}]}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "Good instinct — let's add a one-paragraph memo documenting the gap and your conclusion. It protects us if questions come up later.", "fr": "Bon instinct — ajoute un mémo d'un paragraphe documentant l'écart et ta conclusion. Ça nous protège si des questions remontent."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment confirmes-tu et engages-tu ?", "options": [{"en": "Got it. I'll draft the memo today and send it for your review by end of day.", "correct": true, "feedback_fr": "Idéal : tu acceptes + tu engages avec un timing concret."}, {"en": "OK.", "correct": false, "feedback_fr": "Trop sec — ne traduit pas l'engagement."}, {"en": "Are you sure?", "correct": false, "feedback_fr": "Tu doutes après le conseil de Sarah — bizarre et peu confiant."}]}]}, {"id": "conv_018", "title": "Gérer une question piège du partner en revue", "level": "B2", "context": "Revue de mémo avec le partner. Il te pose une question pour tester ta réflexion — pas pour piéger, mais pour voir si tu réfléchis. Garde ton calme.", "duration_min": 3, "turns": [{"speaker": "partner", "name": "James (Partner)", "en": "Why did you use 12% as the discount rate and not 10% as the client proposed?", "fr": "Pourquoi avez-vous utilisé 12% comme taux d'actualisation et pas 10% comme le client proposait ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "James teste ta réflexion. Comment réponds-tu ?", "options": [{"en": "The client's 10% reflects their cost of debt, but for IAS 36 we need a pre-tax discount rate reflecting risk specific to the asset. Adjusting for the equity beta of comparables led us to 12%.", "correct": true, "feedback_fr": "Excellent : tu donnes le raisonnement IAS 36 précis, les inputs concrets. Très professionnel."}, {"en": "Because 12% is what we always use.", "correct": false, "feedback_fr": "Réponse paresseuse — un partner ne tolère pas ça en revue."}, {"en": "Sarah told me to use 12%.", "correct": false, "feedback_fr": "Ne défausse jamais sur ton manager — assume tes choix."}]}, {"speaker": "partner", "name": "James (Partner)", "en": "And how sensitive is the conclusion to that assumption?", "fr": "Et la conclusion est-elle sensible à cette hypothèse ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Question de sensibilité — typique en audit IFRS.", "options": [{"en": "A 200bps decrease in the rate would push the VIU above carrying amount and remove the impairment. So yes, it's sensitive — I've included a sensitivity analysis in section 4 of the memo.", "correct": true, "feedback_fr": "Parfait : chiffré, conclusion claire (oui sensible), et tu références ta documentation. Exactement ce qu'on attend."}, {"en": "Not really sensitive.", "correct": false, "feedback_fr": "Faux et trop rapide — un partner va creuser."}, {"en": "I don't know.", "correct": false, "feedback_fr": "Inacceptable sur une décision aussi clé."}]}]}, {"id": "conv_019", "title": "Apologise for a mistake to a client", "level": "B2", "context": "Tu as envoyé un document avec une erreur au client. Tu dois t'excuser et corriger sans dramatiser.", "duration_min": 2, "turns": [{"speaker": "you", "type": "choice", "prompt_fr": "Comment ouvres-tu l'email d'excuse ?", "options": [{"en": "Apologies — I just realised there was a calculation error in the table I sent you this morning. Please find the corrected version attached.", "correct": true, "feedback_fr": "Idéal : excuse immédiate + cause précise + solution attachée. Tout en une phrase."}, {"en": "Sorry, sorry, sorry, I'm so sorry.", "correct": false, "feedback_fr": "Trop dramatique — disproportionné à l'erreur."}, {"en": "There might be an issue with the table.", "correct": false, "feedback_fr": "Tu minimise — le client pense que tu n'es pas sûr."}]}, {"speaker": "client", "name": "Maria (Controller)", "en": "No problem, these things happen. Thanks for the quick fix.", "fr": "Pas de souci, ça arrive. Merci pour la correction rapide."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu sans en faire trop ?", "options": [{"en": "Thanks for understanding. Let me know if you spot anything else.", "correct": true, "feedback_fr": "Idéal : remerciement bref + porte ouverte. Tu fermes le sujet proprement."}, {"en": "Thank you, I'm really sorry again.", "correct": false, "feedback_fr": "Tu re-actives l'embarras — le client est passé à autre chose."}, {"en": "OK.", "correct": false, "feedback_fr": "Trop sec après une excuse — pas merci ferme la boucle."}]}]}, {"id": "conv_020", "title": "Reporting up the chain in a daily stand-up", "level": "B1", "context": "Daily stand-up à 9h avec ton équipe. 60 secondes pour donner un point fait/à faire/blocage. Précis et concis.", "duration_min": 2, "turns": [{"speaker": "manager", "name": "Sarah (Manager)", "en": "Vincent, your turn — quick update.", "fr": "Vincent, à toi — point rapide."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment structures-tu un stand-up update en 30 sec ?", "options": [{"en": "Yesterday I finished the inventory walkthrough. Today I'm starting the cut-off testing. Blocker: I'm waiting on the client to share the December receiving reports.", "correct": true, "feedback_fr": "Idéal : structure classique fait/à faire/blocage en 3 phrases. Parfait pour un stand-up."}, {"en": "Yesterday inventory, today cut-off, that's it.", "correct": false, "feedback_fr": "Trop minimal — Sarah ne saura pas s'il y a un blocage."}, {"en": "I worked yesterday and I will work today.", "correct": false, "feedback_fr": "Vide — aucun signal utile à l'équipe."}]}, {"speaker": "manager", "name": "Sarah (Manager)", "en": "OK — I'll follow up with the client myself to unblock the receiving reports.", "fr": "OK — je relance le client moi-même pour débloquer les receiving reports."}, {"speaker": "you", "type": "choice", "prompt_fr": "Réponds brièvement et engage-toi sur la suite.", "options": [{"en": "Thanks Sarah. I'll start drafting the cut-off testing plan while we wait so I can hit the ground running once we have the reports.", "correct": true, "feedback_fr": "Excellent : tu remercies + tu indiques que tu utilises le temps d'attente productivement. Très bon signal."}, {"en": "OK thanks bye.", "correct": false, "feedback_fr": "Trop sec — un stand-up est un échange, pas un monologue."}, {"en": "OK so I just wait.", "correct": false, "feedback_fr": "Tu te poses en passif — pas la posture d'un audit pro."}]}]}, {"id": "conv_021", "title": "Coffee chat avec un manager d'un autre département", "level": "B1", "context": "Café spontané avec Tom, manager Tax. Il connaît bien la fiscalité corporate. Tu veux apprendre et bâtir un réseau interne.", "duration_min": 3, "turns": [{"speaker": "manager", "name": "Tom (Tax Manager)", "en": "I hear you're working on the impairment side. Anything tax-related coming up?", "fr": "Tu travailles sur l'impairment ? Quelque chose côté fiscal qui arrive ?"}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment réponds-tu et amorces-tu un échange technique ?", "options": [{"en": "Yes — we're booking a CHF 4M impairment loss. I'd like to understand the deferred tax implications. Could you point me to a quick primer?", "correct": true, "feedback_fr": "Idéal : contexte + question concrète + demande modeste. Tom va volontiers t'aider."}, {"en": "Yes there's some tax thing.", "correct": false, "feedback_fr": "Trop vague — Tom ne sait pas par où t'aider."}, {"en": "I don't know anything about tax.", "correct": false, "feedback_fr": "Auto-dévaluant — laisse une mauvaise première impression."}]}, {"speaker": "manager", "name": "Tom (Tax Manager)", "en": "Sure. The impairment is non-deductible in most jurisdictions so it usually creates a temporary difference. I can send you a one-pager.", "fr": "Bien sûr. L'impairment n'est pas déductible dans la plupart des juridictions donc ça crée une différence temporelle. Je peux t'envoyer un one-pager."}, {"speaker": "you", "type": "choice", "prompt_fr": "Comment closes-tu pour cultiver le contact ?", "options": [{"en": "That would be perfect, thank you. If it ever helps, I'm happy to walk you through the IFRS 16 lessons we learned this year — could be useful for your DTA work.", "correct": true, "feedback_fr": "Excellent : remerciement + tu offres quelque chose en retour (réciprocité). C'est comme ça qu'on bâtit un réseau interne."}, {"en": "OK thanks bye.", "correct": false, "feedback_fr": "Tu rates l'occasion de bâtir une relation pro."}, {"en": "Cool that's it.", "correct": false, "feedback_fr": "Trop léger — Tom oubliera ton nom dans 24h."}]}]}], "email_templates": [{"id": "tpl_001", "label_fr": "Accusé de réception", "scenario_fr": "Confirmer la bonne réception d'un document client.", "subject": "Receipt confirmation — [document name]", "body": "Dear [Name],\n\nThank you for sending the [document]. I confirm receipt and we will review it as part of our audit procedures.\n\nI'll get back to you should we have any follow-up questions.\n\nBest regards,\n[Your name]"}, {"id": "tpl_002", "label_fr": "Relance polie sur PBC", "scenario_fr": "Relancer un client en retard sur un document demandé.", "subject": "Gentle reminder — PBC item [reference]", "body": "Dear [Name],\n\nI hope this email finds you well. Just a gentle reminder that we are still awaiting the [document] requested on [date].\n\nWe would appreciate receiving it by [deadline] to keep the audit on track. Please let me know if you anticipate any difficulty.\n\nThanks in advance,\n[Your name]"}, {"id": "tpl_003", "label_fr": "Question technique IFRS", "scenario_fr": "Demander des explications sur un point technique IFRS.", "subject": "Technical clarification — [IFRS topic]", "body": "Dear [Name],\n\nWe would like to clarify a few points on the accounting treatment of [item] under IFRS [n].\n\nSpecifically:\n  - [question 1]\n  - [question 2]\n\nCould you share the underlying documentation and walk us through your rationale? A short call could also work — please let me know what suits you best.\n\nBest regards,\n[Your name]"}, {"id": "tpl_004", "label_fr": "Demande de réunion", "scenario_fr": "Proposer un créneau pour une réunion avec le client.", "subject": "Meeting request — [topic]", "body": "Dear [Name],\n\nI'd like to set up a meeting to discuss [topic]. Would any of the following slots work on your side?\n\n  - [option 1]\n  - [option 2]\n  - [option 3]\n\nEstimated duration: [X] minutes. Feel free to suggest another time if none of these work.\n\nBest regards,\n[Your name]"}, {"id": "tpl_005", "label_fr": "Confirmation de réunion", "scenario_fr": "Confirmer un créneau et envoyer l'ordre du jour.", "subject": "Confirmation — meeting on [date]", "body": "Dear [Name],\n\nI confirm our meeting on [date] at [time] (CET). Please find the draft agenda below:\n\n  1. [item 1]\n  2. [item 2]\n  3. [item 3]\n\nLet me know if you'd like to add anything. Looking forward to it.\n\nBest regards,\n[Your name]"}, {"id": "tpl_006", "label_fr": "Communiquer un ajustement d'audit", "scenario_fr": "Annoncer une proposition d'ajustement au client.", "subject": "Proposed audit adjustment — [topic]", "body": "Dear [Name],\n\nBased on our procedures, we have identified an issue regarding [topic] that we would like to discuss.\n\nWe propose an audit adjustment of [amount] to [account]. The rationale is summarised below:\n\n  [brief rationale — IFRS reference, key facts, conclusion]\n\nWe are happy to walk you through the analysis and address any questions. Could we set up a call this week?\n\nBest regards,\n[Your name]"}, {"id": "tpl_007", "label_fr": "Premier contact", "scenario_fr": "Premier email à un nouveau client.", "subject": "Introduction — [Audit firm] / [Client name]", "body": "Dear [Name],\n\nI'm reaching out as part of the audit team that will be working with you this year. By way of introduction, I'm [Your role] in the [team] at [firm].\n\nI look forward to working with you. Please don't hesitate to contact me directly should you need anything from our side.\n\nBest regards,\n[Your name]\n[Phone] | [Email]"}, {"id": "tpl_008", "label_fr": "Clôture de mission", "scenario_fr": "Email de clôture une fois l'audit terminé.", "subject": "Wrap-up — [Audit year] audit", "body": "Dear [Name],\n\nI'm writing to wrap up the [year] audit. The final report was issued on [date] and we have closed all open items on our side.\n\nThank you very much for your collaboration throughout the engagement. It was a pleasure working with your team.\n\nWe will be in touch in due course to plan the next audit cycle. In the meantime, please don't hesitate to reach out should anything come up.\n\nBest regards,\n[Your name]"}], "essentials": [{"id": "ess_001", "group": "survival", "kind": "vocab", "fr": "mission", "en": "engagement", "why_fr": "C'est LE mot qu'on entend toute la journée. 'I'm staffed on three engagements' = on m'a affecté à 3 missions."}, {"id": "ess_002", "group": "survival", "kind": "vocab", "fr": "lettre de mission", "en": "engagement letter", "why_fr": "Contrat formel avec le client. Tu en croiseras une copie dès la première semaine."}, {"id": "ess_003", "group": "survival", "kind": "vocab", "fr": "livrables", "en": "deliverables", "why_fr": "Tout ce que tu DOIS produire pour le client : rapport, lettre de recommandation, présentation."}, {"id": "ess_004", "group": "survival", "kind": "vocab", "fr": "période de pic", "en": "busy season", "why_fr": "Janvier-mars : la période la plus intense. Prépare-toi mentalement."}, {"id": "ess_005", "group": "survival", "kind": "vocab", "fr": "préparé par le client", "en": "prepared by client (PBC)", "why_fr": "Documents que tu vas demander au client. 'Is this PBC?' = est-ce qu'on attend le client ?"}, {"id": "ess_006", "group": "survival", "kind": "phrase", "fr": "C'est noté.", "en": "Noted.", "why_fr": "Mot magique en email pour confirmer brièvement sans relancer la conversation."}, {"id": "ess_007", "group": "survival", "kind": "phrase", "fr": "Pas de souci.", "en": "No worries.", "why_fr": "Très utilisé entre collègues. Plus chaleureux que 'OK' sans être trop familier."}, {"id": "ess_008", "group": "survival", "kind": "phrase", "fr": "Vous êtes en sourdine.", "en": "You're on mute.", "why_fr": "Phrase la plus utile de l'ère Teams/Zoom. Tu vas la dire et l'entendre 100 fois."}, {"id": "ess_009", "group": "survival", "kind": "vocab", "fr": "point d'action", "en": "action item", "why_fr": "Tâche concrète assignée en réunion. Tu en récupères toujours après un meeting."}, {"id": "ess_010", "group": "survival", "kind": "vocab", "fr": "validation finale", "en": "sign-off", "why_fr": "L'approbation finale de ton manager/partner. 'I'm waiting for sign-off' = j'attends la valid."}, {"id": "ess_011", "group": "survival", "kind": "vocab", "fr": "feedback", "en": "feedback", "why_fr": "Culture EY = demande du feedback systématiquement après chaque tâche/mission."}, {"id": "ess_012", "group": "meetings", "kind": "phrase", "fr": "On commence.", "en": "Let's get started.", "why_fr": "Phrase de démarrage standard. Utile si tu animes ou si tu observes."}, {"id": "ess_013", "group": "meetings", "kind": "phrase", "fr": "Faisons un tour de table.", "en": "Let's do a round of introductions.", "why_fr": "Si tu intègres une nouvelle équipe/projet, tu vas l'entendre / le proposer."}, {"id": "ess_014", "group": "meetings", "kind": "phrase", "fr": "Pouvez-vous reformuler ?", "en": "Could you rephrase?", "why_fr": "À utiliser sans honte si tu n'as pas compris. Plus élégant que 'I don't understand'."}, {"id": "ess_015", "group": "meetings", "kind": "phrase", "fr": "Désolé, vous avez coupé.", "en": "Sorry, you broke up.", "why_fr": "Problème de connexion. Indispensable en remote."}, {"id": "ess_016", "group": "meetings", "kind": "phrase", "fr": "On en reparle hors-ligne.", "en": "Let's take it offline.", "why_fr": "Pour différer une discussion bilatérale après la réunion."}, {"id": "ess_017", "group": "meetings", "kind": "phrase", "fr": "Pour rebondir sur ce que Marc vient de dire,", "en": "Building on what Mark just said,", "why_fr": "Très EY — reconnaître un collègue avant d'enchérir = bon ton."}, {"id": "ess_018", "group": "meetings", "kind": "phrase", "fr": "Récapitulons les points d'action.", "en": "Let's recap the action items.", "why_fr": "Fin de réunion. Toujours faire (ou demander) ce récap — c'est pro."}, {"id": "ess_019", "group": "meetings", "kind": "phrase", "fr": "Qui prend ce point ?", "en": "Who's taking that one?", "why_fr": "Pour assigner un action item. Court et efficace."}, {"id": "ess_020", "group": "meetings", "kind": "phrase", "fr": "On se recale la semaine prochaine ?", "en": "Shall we sync again next week?", "why_fr": "Pour planifier le prochain point. 'Sync' = se synchroniser, très EY."}, {"id": "ess_021", "group": "meetings", "kind": "phrase", "fr": "Permettez-moi d'enchaîner sur ce point.", "en": "Let me build on that point.", "why_fr": "Pour ajouter de la valeur sans interrompre. Posture de junior pro."}, {"id": "ess_022", "group": "email", "kind": "phrase", "fr": "Cher Monsieur Smith,", "en": "Dear Mr Smith,", "why_fr": "Formel avec un client. Toujours 'Dear' + titre + nom de famille pour un premier email."}, {"id": "ess_023", "group": "email", "kind": "phrase", "fr": "Suite à notre échange,", "en": "Further to our discussion,", "why_fr": "Pour faire suite à un appel ou réunion. Très professionnel."}, {"id": "ess_024", "group": "email", "kind": "phrase", "fr": "Je reviens vers vous sur ce sujet.", "en": "I wanted to circle back on this.", "why_fr": "Re-engager un sujet pendant. Formule EY classique."}, {"id": "ess_025", "group": "email", "kind": "phrase", "fr": "Veuillez trouver en pièce jointe...", "en": "Please find attached...", "why_fr": "Phrase la plus utilisée pour annoncer un PJ."}, {"id": "ess_026", "group": "email", "kind": "phrase", "fr": "Je vous serais reconnaissant de bien vouloir...", "en": "I would appreciate it if you could...", "why_fr": "Demande polie et formelle au client."}, {"id": "ess_027", "group": "email", "kind": "phrase", "fr": "Petit rappel : ...", "en": "Just a gentle reminder that...", "why_fr": "Relance douce pour PBC en retard. Toujours bien doser."}, {"id": "ess_028", "group": "email", "kind": "phrase", "fr": "N'hésitez pas si vous avez besoin de précisions.", "en": "Please let me know if you have any questions.", "why_fr": "Phrase standard en fin d'email — invitation à répondre."}, {"id": "ess_029", "group": "email", "kind": "phrase", "fr": "Bien cordialement,", "en": "Best regards,", "why_fr": "Clôture standard tous contextes professionnels."}, {"id": "ess_030", "group": "email", "kind": "phrase", "fr": "Dans l'attente de votre retour,", "en": "Looking forward to hearing from you,", "why_fr": "Pour pousser à une réponse. À doser : pas dans tous les emails."}, {"id": "ess_031", "group": "email", "kind": "phrase", "fr": "Pour information,", "en": "For your information,", "why_fr": "Annoncer une info qui ne demande pas d'action. 'FYI' en court."}, {"id": "ess_032", "group": "fieldwork", "kind": "vocab", "fr": "test de cheminement", "en": "walkthrough", "why_fr": "Suivre une transaction de bout en bout. EXERCICE CENTRAL des juniors EY."}, {"id": "ess_033", "group": "fieldwork", "kind": "vocab", "fr": "papiers de travail", "en": "working papers", "why_fr": "Documentation de chaque procédure. Si ce n'est pas documenté, ça n'existe pas."}, {"id": "ess_034", "group": "fieldwork", "kind": "vocab", "fr": "seuil de signification", "en": "materiality", "why_fr": "Concept clé d'audit. Tu vas l'entendre tous les jours."}, {"id": "ess_035", "group": "fieldwork", "kind": "vocab", "fr": "élément probant", "en": "audit evidence", "why_fr": "Tout ce qui justifie ta conclusion. 'Insufficient evidence' = il en faut plus."}, {"id": "ess_036", "group": "fieldwork", "kind": "vocab", "fr": "ajustement d'audit", "en": "audit adjustment", "why_fr": "Correction proposée au client. 'Booking an AJE' = on enregistre l'ajustement."}, {"id": "ess_037", "group": "fieldwork", "kind": "vocab", "fr": "déficience de contrôle", "en": "control deficiency", "why_fr": "Faiblesse identifiée. Sera communiquée au management."}, {"id": "ess_038", "group": "fieldwork", "kind": "phrase", "fr": "Nous démarrons notre audit la semaine prochaine.", "en": "We are starting our audit next week.", "why_fr": "Communication client de planning standard."}, {"id": "ess_039", "group": "fieldwork", "kind": "phrase", "fr": "Pouvez-vous m'expliquer le processus pour... ?", "en": "Could you walk me through the process for...?", "why_fr": "Question la plus utile en walkthrough. 'Walk me through' = formule auditeur."}, {"id": "ess_040", "group": "fieldwork", "kind": "phrase", "fr": "Nous proposons un ajustement de CHF X.", "en": "We propose an audit adjustment of CHF X.", "why_fr": "Communication d'un AJE au client."}, {"id": "ess_041", "group": "fieldwork", "kind": "phrase", "fr": "Sous réserve de la finalisation de nos travaux,", "en": "Subject to the completion of
