ois": "990.–"}], "comptes": [{"num": "5200", "nom": "Salaires"}, {"num": "5700", "nom": "Charges AVS / AC"}, {"num": "5710", "nom": "Charges allocations familiales"}, {"num": "5720", "nom": "Charges LPP"}, {"num": "5730", "nom": "Charges LAA"}, {"num": "5740", "nom": "Charges IJ maladie"}, {"num": "5800", "nom": "Frais forfaitaires"}, {"num": "2270", "nom": "Compte courant caisse AVS"}, {"num": "2271", "nom": "Compte courant caisse LPP"}, {"num": "2279", "nom": "Compte courant impôt à la source"}, {"num": "2300", "nom": "Compte courant Office des poursuites"}, {"num": "1020", "nom": "Banque"}]}, "sections": [{"id": "contrat", "icon": "📄", "titre": "Le contrat de travail", "intro": "Tout salaire versé repose sur un contrat qui lie l'employé à l'entreprise. Ce chapitre déroule le cadre légal suisse du travail : du jeu des conventions collectives jusqu'au calcul du salaire en nature pour l'AVS, en passant par les délais de congé et la protection contre les licenciements. C'est la base de tout décompte de salaire en comptabilité.", "lecons": [{"titre": "CCT et CTT : les deux cadres collectifs", "contenu": "Avant même de parler du contrat individuel, il faut comprendre les deux instruments qui peuvent l'encadrer par le haut. La **convention collective de travail (CCT)** est un contrat passé entre des employeurs (ou leurs associations) d'un côté, et des syndicats de travailleurs de l'autre. Seules des associations de salariés formées en syndicats peuvent en conclure une (art. 356 al. 1 CO). La CCT règle avant tout les conditions de travail — le salaire, la durée du travail, les vacances — pour toute une branche professionnelle, et c'est elle qui assure la fameuse « paix du travail » en Suisse : le droit de grève existe, mais il est rarement utilisé car la paix du travail est prévue dans chaque convention. Les règles figurent aux art. 356 à 358 CO.\n\nUn point crucial concerne la **force obligatoire**. Par défaut, une CCT ne lie que les employeurs et travailleurs affiliés à une association signataire (ou ceux qui ont signé une déclaration de soumission). Mais les autorités fédérales ou cantonales peuvent décider d'**étendre** son champ d'application à TOUS les employeurs et travailleurs de la branche : on parle alors de force obligatoire, et la CCT devient applicable à chacun, même non syndiqué.\n\nQuand une branche n'a PAS de CCT, les autorités peuvent édicter un **contrat-type de travail (CTT)**, notamment pour imposer des salaires minimaux contraignants en cas de sous-enchère répétée. Le CTT établit des clauses sur la conclusion, l'objet et la fin de divers contrats (art. 359 CO). Les cantons sont d'ailleurs tenus d'en édicter pour les travailleurs agricoles et le service de maison. L'exemple classique est le CTT pour l'économie domestique. Les règles vont des art. 359 à 360f CO.", "cle": "CCT = accord négocié employeurs/syndicats (art. 356-358). CTT = imposé par l'autorité là où il n'y a pas de CCT (art. 359-360f). La CCT « étendue » devient obligatoire pour toute la branche.", "exemple": "Une CCT du second œuvre romand est étendue par le Conseil fédéral : un peintre non syndiqué travaillant dans une PME de la branche y est quand même soumis. Sans extension, seul un peintre membre du syndicat signataire le serait.", "piege": "Ne pas confondre la portée par défaut (seulement les affiliés/signataires) et la portée étendue (toute la branche). C'est l'extension par l'autorité qui crée la force obligatoire générale.", "ref": "CO art. 356 à 358 (CCT), art. 356a-356b (affiliation), art. 359 à 360f (CTT)"}, {"titre": "Le droit impératif l'emporte toujours", "contenu": "Une règle simple structure toute la hiérarchie : ni une CCT ni un CTT ne peuvent déroger au **droit impératif** de la Confédération et des cantons. L'art. 358 CO le dit clairement : le droit impératif l'emporte sur la convention.\n\nMais il y a une nuance essentielle, et c'est tout l'esprit du droit du travail : les dérogations stipulées **en faveur des travailleurs** restent valables, sauf si le droit impératif s'y oppose expressément. Autrement dit, une CCT peut toujours faire mieux que le minimum légal (plus de vacances, un salaire plus élevé, des délais de congé plus protecteurs), mais jamais moins bien au détriment du salarié.\n\nC'est pour cela que les CCT améliorent « très souvent largement » les bases fédérales en faveur des travailleurs. Quand vous lisez un article du CO, posez-vous toujours la question : est-il impératif, ou peut-on y déroger ? Beaucoup d'articles protecteurs (heures supplémentaires art. 321c, cession/gage art. 325) sont impératifs, et toute clause contraire est purement et simplement nulle.", "cle": "Le droit impératif est un plancher : on peut faire mieux pour le travailleur, jamais moins bien. Une clause qui déroge au détriment du salarié est nulle.", "exemple": "Une CCT prévoyant 5 semaines de vacances pour tous est valable (mieux que les 4 semaines légales). Une CCT qui tenterait d'imposer 3 semaines serait nulle car elle déroge en défaveur du travailleur.", "piege": "Croire qu'une signature dans la CCT « efface » la loi. Si la clause est moins favorable que le minimum impératif, elle ne s'applique pas, même si les deux parties l'ont acceptée.", "ref": "CO art. 358 (primauté du droit impératif), art. 321c et 325 (dispositions impératives)"}, {"titre": "Définition et 4 éléments essentiels du contrat", "contenu": "Le contrat de travail est régi par le **Code des obligations (art. 319 à 362)** et par la Loi fédérale sur le travail (LTr). C'est un contrat **bilatéral**, à titre **onéreux**, avec des obligations réciproques entre l'employeur et l'employé : la manifestation de volonté concordante des deux parties.\n\nIl se reconnaît à **quatre éléments essentiels** qui doivent tous être réunis :\n\n**1. Une prestation de travail** — l'employé met sa force de travail au service de l'employeur.\n**2. Un rapport de subordination** — l'employé est soumis aux instructions et à l'organisation de l'employeur (c'est ce qui distingue le salarié de l'indépendant).\n**3. Un élément temporel (la durée)** — le travail s'inscrit dans le temps, qu'il soit déterminé ou non.\n**4. Une rémunération** — la prestation est toujours fournie contre salaire ; le travail n'est jamais gratuit.\n\nEn comptabilité, le contrat est l'élément de base de tout : il fixe le montant du salaire et le 13e, sert aux décomptes salaires et aux décomptes finaux à la résiliation, et détermine la répartition des cotisations sociales entre employé et employeur.", "cle": "Quatre éléments essentiels, à mémoriser dans l'ordre : Prestation, Subordination, Durée (élément temporel), Rémunération. C'est le test pour qualifier un vrai contrat de travail.", "exemple": "Un livreur reçoit des horaires imposés, utilise le matériel de l'entreprise et touche un salaire mensuel : prestation + subordination + durée + rémunération sont réunis, c'est un contrat de travail (et non un mandat d'indépendant).", "piege": "Oublier la subordination, qui est le critère décisif face au statut d'indépendant. Un prestataire libre de son organisation et travaillant pour plusieurs clients n'est pas un salarié, même rémunéré régulièrement.", "ref": "CO art. 319 ss ; Loi fédérale sur le travail (LTr)"}, {"titre": "Forme, types particuliers et durée du contrat", "contenu": "**La forme.** En principe, la loi ne prescrit aucune forme : un contrat de travail peut être conclu oralement (art. 320 al. 1 CO), même si l'écrit reste de loin le plus fréquent. La **forme écrite est obligatoire** dans trois cas seulement, à bien retenir : le contrat d'**apprentissage** (art. 344a al. 1 CO), le contrat d'engagement des **voyageurs de commerce** (art. 347a al. 1 CO), et le contrat de travail **temporaire/intérim** conclu entre le travailleur et le bailleur de service (art. 19 al. 1 LSE).\n\n**Les types particuliers.** Le contrat d'apprentissage est traité aux art. 344 à 346a CO, mais ce sont surtout les CCT de chaque profession qui en précisent les droits et devoirs. Les voyageurs de commerce relèvent des art. 347 à 350a CO (avec leur système de rémunération à la provision). Le travail à domicile est régi par la Loi fédérale sur le travail à domicile (LTrD) et par les art. 351 à 354 CO.\n\n**La durée.** On distingue le **CDD** (contrat à durée déterminée) du **CDI** (durée indéterminée). Le CDD fixe d'avance soit un terme (une date), soit une durée (4 mois, 1 an), soit un laps de temps clair (« pendant les récoltes »). Il prend fin **automatiquement** à l'échéance (art. 334 al. 1 CO), sans qu'il faille donner congé. Le CDI, lui, est conclu sans limite de durée et doit être résilié en respectant le délai de congé (art. 335 CO).", "cle": "Forme écrite obligatoire = apprentissage, voyageurs de commerce, intérim (LSE). Sinon, l'écrit n'est qu'une bonne pratique. CDD = fin automatique ; CDI = résiliation avec délai de congé.", "exemple": "Un contrat « pour la durée de l'exposition d'automne » est un CDD : il s'éteint tout seul à la fin de l'expo, sans lettre de congé. Un employé engagé « dès le 1er avril, durée indéterminée » est en CDI.", "piege": "Enchaîner les CDD successifs (contrats « à la chaîne », typiquement dès le 3e d'affilée) constitue un abus de droit : l'employeur contourne ainsi la protection contre les congés, le maintien du salaire en cas d'empêchement et la LPP.", "ref": "CO art. 320 al. 1 (forme), art. 344a/347a, LSE art. 19 al. 1 (écrit obligatoire) ; CO art. 334-335"}, {"titre": "Temps d'essai et délais de congé", "contenu": "**Le temps d'essai** (art. 335b CO) sert à se tester mutuellement. Par défaut, il correspond au **premier mois** de travail. Il peut être prolongé par accord écrit, CTT ou CCT, mais **ne peut jamais dépasser trois mois**. Pendant l'essai, chaque partie peut résilier à tout moment moyennant un délai de **7 jours**. Si le travail est interrompu par maladie, accident ou obligation légale, l'essai est prolongé d'autant (la liste est exhaustive : une grossesse, par exemple, ne prolonge PAS l'essai). En CDD, il n'y a pas d'essai sauf clause expresse, et sa durée doit rester proportionnelle au contrat.\n\n**Les délais de congé après l'essai** (art. 335c CO) augmentent avec l'ancienneté, toujours « pour la fin d'un mois ». Ils doivent être identiques pour les deux parties (art. 335a) ; si un accord prévoit des délais différents, c'est le plus long qui s'applique aux deux. La partie qui résilie doit motiver sa décision par écrit si l'autre le demande (art. 335).", "cle": "Essai = 1 mois par défaut, 3 mois maximum, congé de 7 jours. Après l'essai : 1 mois (1re année), 2 mois (2e-9e année), 3 mois (dès la 10e), pour la fin d'un mois.", "exemple": "Un employé dans sa 4e année reçoit son congé le 15 juin. Délai de 2 mois pour la fin d'un mois : le contrat prend fin le 31 août (et non le 15 août).", "piege": "Un employeur ne peut pas fixer un temps d'essai de 5 mois : le plafond légal absolu est de 3 mois (art. 335b al. 2). Toute durée supérieure est ramenée à 3 mois.", "ref": "CO art. 335a (égalité des délais), art. 335b (essai), art. 335c (délais après essai)", "tableau": {"titre": "Délais de congé selon l'ancienneté (CDI, art. 335b-335c CO)", "entetes": ["Période", "Délai de congé", "Échéance"], "lignes": [["Temps d'essai (1 mois, max 3)", "7 jours", "À tout moment"], ["1re année de service", "1 mois", "Pour la fin d'un mois"], ["2e à 9e année de service", "2 mois", "Pour la fin d'un mois"], ["Dès la 10e année de service", "3 mois", "Pour la fin d'un mois"]]}}, {"titre": "Protection contre les congés et licenciement immédiat", "contenu": "Après l'essai, la loi protège le travailleur contre le congé pendant certaines **périodes de protection** (art. 336c CO). L'employeur ne peut PAS résilier : pendant un service militaire/civil/protection civile obligatoire (et les 4 semaines avant et après s'il a duré plus de 11 jours) ; pendant une incapacité pour maladie ou accident non fautifs, durant **30 jours** la 1re année, **90 jours** de la 2e à la 5e année, **180 jours** dès la 6e année ; pendant la grossesse et les **16 semaines** suivant l'accouchement ; et pendant un service d'aide à l'étranger ordonné par l'autorité.\n\nDeux mécanismes selon le moment du congé. Si le congé est donné **pendant** la période, il est **nul** : l'employeur doit le redonner après. Si le congé a été donné **avant** la période et que celle-ci survient ensuite, le congé n'est pas annulé mais le **délai est suspendu** puis reprend après, et il est prolongé jusqu'au prochain terme (fin du mois).\n\nLe **licenciement immédiat pour justes motifs** (art. 337 CO) reste toujours réservé : il met fin au contrat sur-le-champ, en dehors de tout délai, lorsqu'un motif grave rend la poursuite des rapports insupportable.", "cle": "Congé pendant la période protégée = nul (à redonner). Congé donné avant = suspendu puis prolongé jusqu'au prochain terme. Le licenciement immédiat pour justes motifs (art. 337) reste possible en tout temps.", "exemple": "Travailleur de moins d'un an d'ancienneté : congé reçu le 31 mars pour le 30 avril. Malade du 10 au 24 avril (15 jours), le délai est reporté au 15 mai, donc le contrat prend fin au terme suivant, le 31 mai.", "piege": "La protection de l'art. 336c ne joue PAS pendant le temps d'essai, ni pour un CDD (qui s'éteint à l'échéance même en cas de maladie ou de grossesse).", "ref": "CO art. 336c (protection contre les congés), art. 337 (résiliation immédiate pour justes motifs)", "tableau": {"titre": "Durée de protection pour maladie/accident non fautifs (art. 336c al. 1 let. b)", "entetes": ["Ancienneté", "Période de protection"], "lignes": [["1re année de service", "30 jours"], ["2e à 5e année de service", "90 jours"], ["Dès la 6e année de service", "180 jours"]]}}, {"titre": "Temps de travail, heures supp. et travail supp.", "contenu": "Voici une distinction très souvent demandée à l'examen, car les deux notions se ressemblent mais répondent à des règles différentes.\n\nLes **heures supplémentaires** (art. 321c CO, impératif) sont les heures qui dépassent les **heures convenues** dans le contrat, dans la CCT ou les heures usuelles, mais qui restent **sous** le maximum légal. Le travailleur a l'obligation d'en effectuer si l'employeur le demande de bonne foi. Elles sont soit compensées par un congé de durée égale, soit payées avec une **majoration d'un quart au moins (25 %)**.\n\nLe **travail supplémentaire** (art. 9 à 13 LTr) commence là où l'on **dépasse la durée hebdomadaire maximale légale** : **45 heures** (industrie, bureaux, commerce, banques) ou **50 heures** (restauration, hôpitaux, construction). Il est strictement encadré : pas plus de 2 heures par jour, et au maximum 140 h/an si le plafond est de 50 h, ou 170 h/an si le plafond est de 45 h. Il se paie aussi avec un supplément de 25 % ou se compense par un congé de même durée.\n\nCôté repos : un relevé du temps de travail doit être tenu par jour et par employé, et conservé 5 ans. Les pauses minimales (art. 15 LTr) sont d'1/4 d'heure au-delà de 5h30, 1/2 heure au-delà de 7h, et 1 heure au-delà de 9h.", "cle": "Heures supp = dépassent les heures du CONTRAT (sous le max légal). Travail supp = dépasse le MAXIMUM LÉGAL (45 ou 50 h/sem). Les deux : +25 % ou congé compensatoire.", "exemple": "Un employé de banque a un contrat à 40 h. S'il fait 44 h une semaine, ce sont 4 heures supplémentaires (sous le max de 45 h). S'il atteint 48 h, les 3 heures au-delà de 45 h deviennent du travail supplémentaire.", "piege": "Confondre les deux : le critère n'est pas « beaucoup d'heures » mais quel seuil est franchi — celui du contrat (heures supp.) ou celui de la loi (travail supp.).", "ref": "CO art. 321c (heures supplémentaires, impératif) ; LTr art. 9 à 13 (travail supplémentaire), art. 15 (pauses)"}, {"titre": "Vacances, jours fériés et congés usuels", "contenu": "**Les vacances** (art. 329 CO) : tout travailleur de plus de 20 ans a droit à **4 semaines** de vacances payées par an ; les jeunes de **moins de 20 ans** ont droit à **5 semaines**. Les vacances sont calculées au prorata (pro rata temporis) si l'année de service est incomplète, et doivent comprendre au moins deux semaines consécutives (art. 329c). L'employeur fixe la date en tenant compte des souhaits du travailleur.\n\n**La réduction** (art. 329b) n'est possible que pour des mois ENTIERS d'absence, selon trois seuils à retenir : dès le **1er mois** s'il y a faute du travailleur (prison, grève, congé non payé), dès le **2e mois** sans faute (maladie, accident, service militaire), et dès le **3e mois** en cas de grossesse/maternité. La réduction est d'1/12 par mois complet.\n\n**Les jours fériés** : seul le **1er août (Fête nationale)** est un jour férié fédéral obligatoire ET indemnisé (art. 110 al. 3 Cst). Chaque canton peut fixer au plus 8 autres jours fériés assimilés au dimanche (art. 20a LTr), soit 9 maximum par an. Pour tous les fériés autres que le 1er août, aucune obligation légale d'indemnisation (les CCT améliorent souvent ce point). Les fériés ne se compensent pas.\n\n**Les congés usuels** : la jurisprudence admet notamment 3 jours pour le mariage de l'employé, 1 à 3 jours pour le décès d'un proche (selon le lien et le lieu), 1 jour pour un déménagement. Liés à un événement ponctuel, ils ne se reportent pas, et l'employeur n'a pas d'obligation légale de les payer (même si c'est l'usage).", "cle": "4 semaines de vacances (5 si <20 ans). Réduction : faute dès le 1er mois, sans faute dès le 2e, grossesse dès le 3e. Seul le 1er août est un férié fédéral indemnisé.", "exemple": "Une employée enceinte est absente 1 mois pour cause de grossesse : ses vacances ne peuvent PAS être réduites (la réduction grossesse ne commence qu'au 3e mois). Pour un payé à l'heure, l'indemnité de vacances est de 8,33 % du gain pour 4 semaines.", "piege": "Comptabiliser l'indemnité de congés payés sur l'exercice où elle est VERSÉE plutôt que celui où elle est ACQUISE est une irrégularité comptable : les vacances acquises mais non prises doivent figurer en passifs de régularisation.", "ref": "CO art. 329 (vacances/congés usuels), art. 329b (réduction), art. 329c (continuité) ; Cst art. 110 al. 3, LTr art. 20a (jours fériés)", "tableau": {"titre": "Réduction des vacances : à partir de quand ? (art. 329b CO)", "entetes": ["Cause de l'absence", "Réduction possible dès"], "lignes": [["Faute du travailleur (prison, grève, congé non payé)", "1er mois complet"], ["Sans faute (maladie, accident, service militaire)", "2e mois complet"], ["Grossesse / maternité", "3e mois complet"]]}}, {"titre": "Le salaire : types, paiement, 13e, gratifications, retenues", "contenu": "La rémunération repose sur la liberté contractuelle, restreinte par les salaires minimaux d'une CCT ou d'un CTT. On distingue plusieurs **types de rémunération** : le **salaire au temps** (horaire, mensuel… indépendant de la quantité produite, c'est la forme la plus courante), le **salaire à la pièce/à la tâche** (lié au rendement), le **salaire en nature** (nourriture, logement, véhicule, actions…), la **participation au résultat d'exploitation**, et la **provision** (« commission », rémunération principale du voyageur de commerce).\n\n**Le paiement** (art. 323 CO) : sauf usage ou accord contraire, le salaire est payé **à la fin de chaque mois** ; la provision aussi ; la participation au résultat est payée dès qu'il est constaté, au plus tard 6 mois après la clôture. L'employé peut demander une **avance** proportionnelle au travail déjà fourni (art. 323 al. 4), déduite du prochain salaire sans intérêt.\n\n**13e salaire** : il n'est PAS prévu par le droit suisse. Il n'existe que si les parties l'ont convenu ou qu'une CCT le prévoit. S'il est prévu, il devient obligatoire, est calculé au prorata de la durée des rapports, et ne dépend ni des prestations ni du résultat de l'entreprise. **Gratification** : c'est une rétribution spéciale (prime, bonus, cadeau) ; elle n'est PAS un salaire car elle n'a pas de caractère obligatoire. Mais attention : versée sans réserve plus de trois années consécutives, elle est considérée comme acquise — d'où l'importance de préciser à chaque fois qu'il s'agit d'un versement volontaire.\n\n**Retenues** (art. 323a) : elles ne peuvent excéder le dixième du salaire dû, ni au total le salaire d'une semaine. **Cession et gage** (art. 325) : le travailleur ne peut céder ou mettre en gage son salaire futur que dans la mesure saisissable (au-delà du minimum vital), et uniquement pour une obligation d'entretien du droit de la famille ; toute autre cession/gage de salaire futur est nulle. Cette disposition est impérative.", "cle": "13e salaire = non prévu par la loi, obligatoire seulement s'il est convenu. Gratification = volontaire, mais devient un droit acquis après 3 ans sans réserve. Retenues plafonnées à 1/10 du salaire (art. 323a).", "exemple": "Un employeur verse chaque décembre un « bonus » sans jamais préciser qu'il est volontaire. La 4e année, le salarié peut l'exiger : faute de réserve écrite répétée, la gratification est devenue un droit acquis.", "piege": "Confondre 13e salaire et gratification : le 13e est dû dès qu'il est convenu (proportionnel et indépendant du résultat) ; la gratification reste en principe libre tant que l'employeur formule une réserve à chaque versement.", "ref": "CO art. 322 ss, art. 323 (paiement), art. 323a (retenues), art. 325 (cession/gage, impératif)"}, {"titre": "Salaire déterminant AVS et salaire en nature", "contenu": "Le **salaire déterminant** (art. 5 al. 2 LAVS) est le salaire sur lequel se calculent les cotisations sociales. La règle de base : en font partie **tous les revenus** provenant d'une activité salariée. Concrètement, on **inclut** : le salaire de base sous toutes ses formes, les primes et indemnités pour heures supplémentaires ou travail de nuit, les **gratifications, cadeaux d'ancienneté et primes de fidélité**, les provisions et commissions, les tantièmes et jetons de présence, les indemnités de vacances et jours fériés, le salaire maintenu en cas de maladie/accident, et les **prestations en nature régulières** (nourriture, logement, usage privé d'une voiture de service).\n\nÀ l'inverse, on **exclut** notamment : les prestations d'assurance (accident, maladie, invalidité), les **allocations familiales**, la solde militaire/PC, les prestations d'aide sociale, les contributions de l'employeur aux primes maladie/accidents (si versées à l'assureur et tous traités pareil), les indemnités de déménagement professionnel, les cadeaux de mariage/fiançailles, les primes de réussite d'examens jusqu'à 500 fr., et les cadeaux en nature jusqu'à 500 fr./an.\n\n**Le salaire en nature** est la part du salaire non versée en espèces. Lorsqu'un employé (ou le personnel de maison) reçoit nourriture et logement, ils s'évaluent selon un barème forfaitaire : petit-déjeuner 3.50, repas de midi 10.–, repas du soir 8.–, logement 11.50, soit **nourriture + logement = 33.– par jour, ou 990.– par mois**. Si la famille du salarié en bénéficie aussi, on ajoute le même montant par adulte et la moitié par enfant.", "cle": "Salaire déterminant AVS (art. 5 LAVS) = tout le revenu du travail, y compris gratifications, heures supp. et prestations en nature régulières. Sont exclus les allocations familiales et les prestations d'assurance. Nourriture + logement = 33.–/jour, 990.–/mois.", "exemple": "Un employé logé et nourri par son employeur pendant 30 jours : 30 × 33.– = 990.– ajoutés à son salaire déterminant AVS pour le mois. Ses allocations familiales, elles, n'y sont PAS soumises.", "piege": "Croire que les allocations familiales font partie du salaire déterminant : elles en sont EXCLUES. Inversement, oublier que les heures supplémentaires et les gratifications, elles, y sont bien INCLUSES.", "ref": "LAVS art. 5 al. 2 (salaire déterminant) ; Mémento AVS 2.01 (barème du salaire en nature)", "tableau": {"titre": "Barème du salaire en nature (Mémento AVS 2.01)", "entetes": ["Prestation en nature", "CHF / jour", "CHF / mois"], "lignes": [["Petit-déjeuner", "3.50", "105.–"], ["Repas de midi", "10.–", "300.–"], ["Repas du soir", "8.–", "240.–"], ["Logement", "11.50", "345.–"], ["Nourriture + logement", "33.–", "990.–"]]}}], "pieges": [{"titre": "Heures supplémentaires ≠ travail supplémentaire", "texte": "Les heures supplémentaires dépassent les heures du CONTRAT (mais restent sous le plafond légal) ; le travail supplémentaire dépasse le MAXIMUM LÉGAL (45 ou 50 h/semaine selon la branche). Les deux se paient à +25 % ou se compensent en congé, mais la qualification dépend du seuil franchi, pas du nombre d'heures."}, {"titre": "13e salaire ≠ gratification", "texte": "Le 13e salaire n'est pas prévu par la loi, mais devient obligatoire et proportionnel dès qu'il est convenu, indépendamment du résultat de l'entreprise. La gratification reste volontaire — sauf si elle est versée sans réserve plus de trois années consécutives, auquel cas elle devient un droit acquis."}, {"titre": "Temps d'essai plafonné à 3 mois", "texte": "Un employeur ne peut PAS imposer un temps d'essai de 5 mois : le maximum légal absolu est de 3 mois (art. 335b al. 2 CO). L'essai par défaut n'est que d'un mois. Il ne se prolonge qu'en cas de maladie, accident ou obligation légale — jamais pour une grossesse (liste exhaustive)."}, {"titre": "Allocations familiales hors du salaire déterminant AVS", "texte": "Les allocations familiales NE font PAS partie du salaire déterminant AVS et ne sont pas soumises aux cotisations. À l'inverse, les heures supplémentaires, les gratifications et les prestations en nature régulières (nourriture, logement, voiture privée) en font bien partie."}, {"titre": "Un seul férié fédéral indemnisé : le 1er août", "texte": "Seul le 1er août est un jour férié fédéral obligatoire ET indemnisé (art. 110 al. 3 Cst). Pour tous les autres fériés cantonaux (jusqu'à 8, assimilés au dimanche), aucune obligation légale d'indemnisation — même si les CCT améliorent souvent la situation. Les jours fériés ne se compensent pas."}, {"titre": "CDD : fin automatique, pas de protection contre les congés", "texte": "Le CDD prend fin automatiquement à l'échéance (art. 334 al. 1 CO), sans qu'il faille donner congé, et MÊME en cas de maladie, d'accident ou de grossesse. Le salarié ne peut pas invoquer la protection de l'art. 336c. Enchaîner des CDD à la chaîne (dès le 3e) est un abus de droit."}], "points_cles": ["Contrat de travail = 4 éléments essentiels : prestation, subordination, durée, rémunération (art. 319 ss CO).", "Délais de congé après l'essai : 1 mois (1re année), 2 mois (2e-9e), 3 mois (dès la 10e), pour la fin d'un mois ; 7 jours pendant l'essai (max 3 mois).", "Vacances : 4 semaines, 5 semaines si moins de 20 ans ; réduction par mois entier (faute dès le 1er, sans faute dès le 2e, grossesse dès le 3e).", "Seul le 1er août est un jour férié fédéral obligatoire et indemnisé ; les autres fériés cantonaux ne sont pas légalement indemnisés.", "Salaire en nature pour l'AVS : nourriture + logement = 33.–/jour, soit 990.–/mois (petit-déj 3.50, midi 10.–, soir 8.–, logement 11.50).", "Le droit impératif l'emporte sur CCT et CTT, sauf dérogation en faveur du travailleur (art. 358 CO)."]}, {"id": "assurances", "icon": "🛡️", "titre": "Les assurances sociales suisses", "intro": "La Suisse protège ses habitants contre les grands risques de la vie (vieillesse, décès, invalidité, maladie, accident, chômage, famille) grâce à un édifice à trois piliers et une dizaine d'assurances coordonnées. Pour chaque assurance, trois questions reviennent toujours : qui cotise, qui est couvert, et quelles prestations sont versées. Ce chapitre vous donne les taux, les seuils et les mécanismes pour répondre les yeux fermés. Toutes les valeurs sont celles des barèmes 2024 du manuel — vérifiez toujours les « Valeurs actuelles » avant un examen, car elles sont régulièrement adaptées.", "lecons": [{"titre": "Le système des 3 piliers : la colonne vertébrale", "contenu": "Toute la prévoyance suisse repose sur un principe inscrit dans la Constitution (art. 111 Cst), adopté par le peuple en 1972 : **trois piliers** qui se complètent.\n\nLe **1er pilier** est la prévoyance publique : c'est l'**AVS** (vieillesse et survivants) et l'**AI** (invalidité), complétées par les **prestations complémentaires (PC)**. Son but est d'assurer les **besoins vitaux** — le minimum pour vivre. C'est un monopole d'État : personne d'autre ne peut offrir ces prestations.\n\nLe **2e pilier** est la prévoyance professionnelle : c'est la **LPP**, à laquelle on rattache aussi la **LAA** (assurance-accidents). Son objectif est de **maintenir le niveau de vie antérieur**, en se rapprochant du salaire d'avant la retraite. Elle est liée à l'exercice d'une profession et exige la participation de l'employeur pour au moins la moitié des cotisations.\n\nLe **3e pilier** est la prévoyance individuelle, **facultative**, laissée au libre choix de chacun. Il se divise en **3a** (prévoyance liée, fiscalement privilégiée) et **3b** (prévoyance libre). C'est un complément personnel aux deux premiers piliers.\n\nUne idée clé à retenir : le 1er et le 2e pilier réunis visent à assurer environ **60% du dernier salaire** à la retraite. C'est pour combler le reste que le 3e pilier existe.", "cle": "1er pilier = besoins vitaux (AVS/AI/PC, public, répartition) ; 2e pilier = maintien du niveau de vie (LPP/LAA, professionnel, capitalisation) ; 3e pilier = complément individuel facultatif (3a liée / 3b libre).", "exemple": "Un cadre gagnant 100'000.- par an touchera à la retraite environ 60'000.- des 1er + 2e piliers. S'il veut maintenir son train de vie complet, il devra avoir alimenté un 3e pilier (3a) pendant sa carrière pour combler les 40'000.- manquants.", "piege": "Ne pas confondre les modes de financement : le 1er pilier fonctionne par RÉPARTITION (les actifs paient pour les rentiers d'aujourd'hui), tandis que les 2e et 3e piliers fonctionnent par CAPITALISATION (chacun épargne son propre capital).", "ref": "Art. 111 Cst ; système des 3 piliers (manuel pp. 13-16)", "astuce": "Mémo des piliers : 1 = État/Vital, 2 = Travail/Niveau de vie, 3 = Individu/Complément. Et « répartition pour le 1, capitalisation pour les 2 autres »."}, {"titre": "La LPGA : le chef d'orchestre qui coordonne tout", "contenu": "Avant de plonger dans chaque assurance, il faut connaître la **LPGA** (Loi fédérale sur la partie générale du droit des assurances sociales), entrée en vigueur le 1er janvier 2003. Son rôle : **harmoniser et coordonner** le droit fédéral des assurances sociales — définir des principes communs, fixer les procédures judiciaires et coordonner les prestations.\n\nElle s'applique à presque toutes les assurances : **AVS, AI, PC, APG, AC, AMal, AM, AA et AFam**. Attention, point d'examen classique : la **LPGA ne s'applique PAS directement à la LPP** (2e pilier).\n\nPourquoi est-elle si utile ? Parce que rares sont les cas où une seule assurance verse des prestations : en général au moins deux sont impliquées. Il faut donc une hiérarchie claire pour éviter qu'un assuré soit sur-indemnisé. La règle d'or est le **plafond de 90% du gain assuré**, avec un ordre de priorité strict.\n\nLa hiérarchie de versement des rentes est : d'abord l'**AVS/AI** (qui ne diminue jamais sa rente), puis l'**AA ou l'AM** (qui réduisent leur rente pour ne pas dépasser 90% du gain), enfin la **PP** (qui intervient seulement si les 90% ne sont pas atteints).", "cle": "La LPGA coordonne toutes les assurances sociales SAUF la LPP. Règle de surindemnisation : l'ensemble des rentes ne doit pas dépasser 90% du gain assuré, dans l'ordre AVS/AI → AA/AM → PP.", "exemple": "Suite à un accident, un assuré reçoit sa rente AI (qui ne bouge jamais). La LAA vient compléter jusqu'à 90% du gain assuré, puis réduit sa propre rente pour ne pas dépasser ce plafond. La LPP n'intervient que si les 90% ne sont toujours pas atteints — mais une rente de vieillesse LPP ne peut jamais, elle, être réduite.", "piege": "Erreur fréquente : croire que la LPGA s'applique à la LPP. Elle ne s'y applique PAS directement. De même, l'AVS/AI ne réduit JAMAIS sa rente — c'est toujours aux assurances « du dessous » de s'adapter.", "ref": "LPGA du 6 octobre 2000 (entrée en vigueur 01.01.2003)", "astuce": "Pour la hiérarchie : « AVS d'abord, AA au milieu, PP en dernier » — l'AVS est intouchable, la PP est la variable d'ajustement."}, {"titre": "AVS/AI/APG : financement par répartition et taux paritaire de 5,3%", "contenu": "L'AVS, l'AI et les APG forment un bloc financé par **répartition** : les cotisations des actifs paient directement les rentes des bénéficiaires d'aujourd'hui (retraités, survivants, invalides). On ne constitue donc aucun capital individuel, contrairement à la LPP.\n\nDans la pratique, les taux AVS, AI et APG sont **additionnés en un taux unique**, car ils sont uniformes dans toute la Suisse et s'appliquent sur l'**ensemble du salaire brut** (pas de plafond, contrairement à l'AC ou la LAA). Le salaire déterminant comprend tout : 13e salaire, gratifications, commissions, primes de fidélité, prestations en nature converties en numéraire.\n\nLe taux total salarié est de **10,6%**, partagé **paritairement** : 5,3% retenu sur le salaire de l'employé, 5,3% à la charge de l'employeur. L'employeur prélève la part de l'employé, y ajoute la sienne et verse le tout à sa **caisse de compensation AVS**.\n\nL'obligation de cotiser débute le **1er janvier suivant le 20e anniversaire** (ou le 1er janvier suivant le 17e anniversaire en cas d'activité lucrative avant 20 ans) et se termine à la fin du mois où l'on atteint l'âge de référence.\n\nLes indépendants paient 10% au maximum (barème dégressif en dessous de 58'800.-/an, minimum 514.-/an). Les personnes sans activité lucrative paient au minimum 514.-/an, calculés sur leur fortune et leurs revenus de rente.", "cle": "AVS/AI/APG : financement par RÉPARTITION, sur le salaire brut SANS plafond. Taux salarié 10,6% partagé 50/50 → 5,3% employé + 5,3% employeur. Cotisation dès le 1er janvier suivant les 20 ans (ou 17 ans si activité lucrative).", "exemple": "Salaire brut mensuel de 6'000.-. L'employeur retient 5,3% = 318.- sur la fiche de salaire de l'employé, ajoute sa propre part de 318.-, et verse 636.- à la caisse de compensation au titre AVS/AI/APG.", "piege": "Ne pas additionner l'AC et les AF au taux AVS/AI/APG : l'AC a un salaire PLAFONNÉ (148'200.-) et les AF dépendent du canton. Seuls AVS+AI+APG fusionnent en un taux unique.", "ref": "LAVS art. 1a ; barèmes 2024 ; Mémento AVS 2.01", "tableau": {"titre": "Taux de cotisations AVS/AI/APG (barèmes 2024)", "entetes": ["Branche", "Total (salarié+employeur)", "Part travailleur (½)", "Part employeur (½)", "Indépendant (max)"], "lignes": [["AVS", "8,7%", "4,35%", "4,35%", "8,1%"], ["AI", "1,4%", "0,7%", "0,7%", "1,4%"], ["APG", "0,5%", "0,25%", "0,25%", "0,5%"], ["TOTAL", "10,6%", "5,3%", "5,3%", "10% (min 514.-/an)"]]}}, {"titre": "AVS : âge de référence 65, franchise des retraités et n° AVS", "contenu": "Avec la réforme **AVS 21** (en vigueur dès 2024), l'**âge de référence** (ex « âge ordinaire de la retraite ») est fixé à **65 ans pour les hommes**. Celui des femmes est relevé progressivement de 64 à 65 ans par paliers de 3 mois selon l'année de naissance : 64 ans pour 1960, 64 ans et 3 mois pour 1961, et ainsi de suite jusqu'à 65 ans pour les femmes nées en 1964. **Dès 2028, l'âge de référence sera donc identique (65 ans) pour tous.**\n\nLa rente peut être **anticipée** (jusqu'à 2 ans, avec réduction de 6,8% par année d'anticipation) ou **ajournée** (de 1 à 5 ans, avec supplément). Important : les rentes ne sont **jamais versées automatiquement**, il faut les demander auprès de la dernière caisse de compensation où l'on a cotisé.\n\nLa **franchise AVS** concerne les personnes qui continuent à travailler après l'âge de référence. Elles continuent de cotiser à l'AVS (mais plus à l'AC). Une partie de leur salaire — la franchise de **16'800.-/an (1'400.-/mois)** — n'est pas soumise à cotisation. Depuis AVS 21, cette franchise est **facultative** : le rentier peut y renoncer pour verser des cotisations supplémentaires et revaloriser sa rente (si elle est inférieure au maximum).\n\nLe **numéro AVS** compte 13 chiffres depuis 2008 : le code pays 756, neuf chiffres anonymes propres à la personne, et une clé de contrôle. Il sert d'identifiant pour toutes les assurances sociales, les impôts, l'assurance militaire et la formation.", "cle": "Âge de référence : 65 ans (hommes ; femmes relevées par paliers de 3 mois jusqu'à 65 ans pour celles nées en 1964 — uniformisation en 2028). Franchise du retraité actif : 16'800.-/an non soumis, désormais facultative. N° AVS = 756 + 9 chiffres + clé de contrôle (13 chiffres).", "exemple": "Jules, 65 ans, continue à travailler à 6'000.-/mois et garde la franchise. Sur son salaire annuel de 72'000.-, il ne cotise à l'AVS que sur 72'000 − 16'800 = 55'200.-. S'il réduit son taux à 1'200.-/mois (14'400.-/an, sous la franchise de 16'800.-), il ne paie plus aucune cotisation AVS.", "piege": "Après l'âge de référence, on cotise encore à l'AVS mais PLUS à l'AC (pas de prestations chômage possibles). Et attention : la franchise AVS (16'800.-) n'a rien à voir avec une « franchise » d'assurance-maladie — ici c'est la part de salaire exonérée de cotisation.", "ref": "LAVS ; réforme AVS 21 ; franchise 16'800.-/an (1'400.-/mois)"}, {"titre": "AVS/AI : qui est couvert et quelles prestations", "contenu": "L'AVS/AI couvre **toute la population résidente**, et pas seulement les actifs : enfants, étudiants, hommes et femmes au foyer, personnes atteintes d'infirmités congénitales, et même les bébés dès la naissance. Sont obligatoirement assurées toutes les personnes domiciliées en Suisse (quelle que soit leur nationalité) et toutes celles qui y exercent une activité lucrative, y compris frontaliers et saisonniers.\n\nLes **prestations de vieillesse** comprennent la **rente de vieillesse** (versée dès l'âge de référence) et la **rente pour enfant** de retraité (**40% de la rente de vieillesse**, jusqu'à 18 ans ou 25 ans si en formation). Le cumul des rentes d'un couple marié est plafonné à **150% de la rente maximale**.\n\nLes **prestations de survivants** protègent la famille en cas de décès : la **rente de veuve/veuf** vaut **80% de la rente de vieillesse** (sous conditions : avoir un enfant, ou avoir plus de 45 ans avec au moins 5 ans de mariage). La **rente d'orphelin** vaut **40%** de la rente (60% si les deux parents décèdent).\n\nLes **prestations de l'AI** suivent le principe « **la réadaptation prime la rente** » : on cherche d'abord à rétablir la capacité de gain. La rente n'est versée que si la réadaptation échoue : **dès 40% d'invalidité (25% de rente)**, progression linéaire entre 41-49%, taux = degré d'invalidité entre 50-69%, et **rente entière dès 70%**. S'ajoutent la rente pour enfant d'invalide (40% de la rente AI) et l'allocation pour impotent.", "cle": "L'AVS/AI couvre TOUTE la population résidente (même les non-actifs). Rente d'orphelin = 40% (60% si double orphelin), rente de veuve/veuf = 80%, rente pour enfant = 40%. AI : pas de rente sous 40%, rente entière dès 70%, « la réadaptation prime la rente ».", "exemple": "M. Pierrot a un taux d'invalidité de 46%, ce qui lui donne droit à une rente partielle de 40%. Avec un revenu moyen de 55'860.- (échelle 44 → rente de 2'019.-), sa rente partielle est : 2'019 × 40% = 807.60 par mois.", "piege": "Les rentes ne sont JAMAIS versées automatiquement : c'est toujours à l'assuré de les demander à sa dernière caisse de compensation. Et entre 40% et 49% d'invalidité, la rente n'égale pas le taux (on part de 25% à 40% puis +2,5% par point), contrairement à la zone 50-69% où rente = taux.", "ref": "LAVS ; LAI art. 28, 36 ; échelle linéaire des rentes (dès 2022)", "tableau": {"titre": "Rente AI selon le taux d'invalidité", "entetes": ["Taux d'invalidité", "Droit à la rente (% d'une rente entière)"], "lignes": [["Jusqu'à 39%", "Pas de rente"], ["40%", "25%"], ["41% à 49%", "+2,5% par point d'invalidité (ex. 46% → 40%)"], ["50% à 69%", "= taux d'invalidité (ex. 60% → 60%)"], ["70% à 100%", "100% (rente entière)"]]}}, {"titre": "LPP : capitalisation et salaire coordonné (le cœur du 2e pilier)", "contenu": "La LPP fonctionne par **capitalisation** : chaque assuré accumule son propre **avoir de vieillesse**, contrairement à la répartition du 1er pilier. Elle est gérée par des **institutions de prévoyance juridiquement indépendantes** de l'entreprise (le plus souvent des fondations), surveillées par l'OFAS.\n\n**Qui est assuré obligatoirement ?** Tout salarié cotisant à l'AVS, travaillant en Suisse et réalisant chez le même employeur un salaire dépassant le **seuil d'entrée de 22'680.-** (= 75% de la rente AVS maximale). La couverture des risques **décès et invalidité** commence le 1er janvier suivant le 17e anniversaire ; la **prévoyance vieillesse** (épargne) ne démarre que le 1er janvier suivant les **24 ans**.\n\n**Qui cotise ?** Employeur et salarié, **50/50 au minimum** (l'employeur peut verser plus). Les cotisations financent trois choses : les bonifications de vieillesse (épargne), les primes de risque (décès/invalidité) et les frais de gestion.\n\nLe concept central est le **salaire coordonné** : c'est la part du salaire assurée. On part du salaire annuel brut, on retranche la **déduction de coordination de 26'460.-** (= 7/8 de la rente AVS max). Le salaire pris en compte est plafonné au **maximum LPP de 90'720.-** (= 3× la rente AVS max). Le salaire coordonné est donc compris entre un **minimum de 3'780.-** et un **maximum de 64'260.-** (90'720 − 26'460).", "cle": "LPP = capitalisation. Seuil d'entrée 22'680.-, déduction de coordination 26'460.-, plafond 90'720.-. Salaire coordonné = salaire (plafonné à 90'720) − 26'460, entre 3'780.- (min) et 64'260.- (max). Risques décès/invalidité dès 17 ans, épargne vieillesse dès 24 ans. Cotisations 50/50.", "exemple": "Trois salaires annuels : 60'000.- → 60'000 − 26'460 = 33'540.- coordonné. 120'000.- → dépasse le plafond, donc coordonné = 64'260.- (le maximum). 23'000.- → 23'000 − 26'460 est négatif, donc relevé au minimum de 3'780.-. Et 20'000.- → en dessous du seuil de 22'680.-, donc PAS soumis à la LPP obligatoire.", "piege": "Ne pas confondre seuil d'entrée (22'680.-, condition pour être assuré) et déduction de coordination (26'460.-, montant soustrait du salaire). Et le plafond 90'720.- s'applique AVANT la déduction de coordination, pas après.", "ref": "LPP art. 2, 7, 8 ; OPP 2 ; valeurs 2026", "tableau": {"titre": "Les seuils LPP 2024 (basés sur la rente AVS max de 29'400.-)", "entetes": ["Notion", "Définition", "Montant annuel", "Mensuel"], "lignes": [["Rente AVS maximale", "Base de calcul", "29'400.-", "2'450.-"], ["Seuil d'entrée LPP", "6/8 (75%) de la rente AVS max", "22'680.-", "1'837.50"], ["Déduction de coordination", "7/8 (87,5%) de la rente AVS max", "26'460.-", "2'143.75"], ["Plafond LPP", "3× la rente AVS max", "90'720.-", "7'350.-"], ["Salaire coordonné maximum", "90'720 − 26'460", "64'260.-", "5'355.00"], ["Salaire coordonné minimum", "Plancher (12,5% rente max)", "3'780.-", "306.25"]]}}, {"titre": "LPP : bonifications de vieillesse, primes de risque et prestations", "contenu": "Les cotisations vieillesse sont appelées **bonifications de vieillesse** : elles alimentent le compte d'épargne de l'assuré. Le taux dépend de l'**âge** (la différence entre l'année civile en cours et l'année de naissance) et grimpe par tranches : **7% de 25 à 34 ans, 10% de 35 à 44 ans, 15% de 45 à 54 ans, 18% de 55 ans jusqu'à l'âge de référence**. Plus on vieillit, plus on épargne — pour rattraper le temps.\n\nLes **primes de risque** financent les prestations en cas de décès et d'invalidité. Leur montant dépend de l'âge et du sexe, et le taux varie selon la caisse. Comme pour les bonifications, l'employeur verse au moins 50%.\n\nÀ la retraite, la **rente de vieillesse** se calcule en multipliant l'avoir de vieillesse accumulé (capital + intérêts) par le **taux de conversion** (6,8% au minimum en 2026).\n\nLes prestations de **décès** : rente de conjoint survivant (**60%** de la rente de vieillesse ou d'invalidité du défunt) et rente d'orphelin (**20%**). Les prestations d'**invalidité** suivent le même calcul de taux que l'AI, avec un délai d'attente de 2 ans.", "cle": "Bonifications de vieillesse par tranches d'âge : 25→7%, 35→10%, 45→15%, 55→18% (du salaire coordonné). Rente = avoir de vieillesse × taux de conversion (6,8% min). Décès LPP : conjoint 60%, orphelin 20%.", "exemple": "Dès le 1er janvier de ses 30 ans, salaire annuel 60'000.- → salaire coordonné 33'540.- × 7% = 2'399.- de bonification annuelle. Avoir de vieillesse de 383'000.- à la retraite → 383'000 × 6,8% = 26'044.- de rente annuelle viagère.", "piege": "Le taux de bonification s'applique au SALAIRE COORDONNÉ, jamais au salaire brut. Et l'âge déterminant n'est pas l'âge exact mais « année en cours − année de naissance ». Avant l'année des 25 ans, aucune bonification de vieillesse n'est prélevée (même si décès/invalidité sont déjà couverts dès 17 ans).", "ref": "LPP art. 16 ; OPP 2 art. 13 ; taux de conversion min 6,8%", "tableau": {"titre": "Bonifications de vieillesse LPP (% du salaire coordonné)", "entetes": ["Âge", "Bonification minimale"], "lignes": [["25 – 34 ans", "7%"], ["35 – 44 ans", "10%"], ["45 – 54 ans", "15%"], ["55 ans → âge de référence", "18%"]]}}, {"titre": "LPP : libre passage, EPL et surobligatoire", "contenu": "Quand un salarié quitte son employeur, il quitte aussi sa caisse de pension. Son avoir de vieillesse lui revient sous forme de **prestation de sortie**, qu'on appelle le **libre passage** (loi LFLP en vigueur depuis 1995). Cet avoir doit rester dédié à la prévoyance : s'il reprend un emploi, il est transféré à la nouvelle caisse ; s'il est sans emploi, il va sur un **compte de libre passage (banque)** ou une **police de libre passage (assurance)**. Le versement en espèces n'est possible que dans des cas précis : départ définitif de Suisse (hors UE/AELE), début d'activité indépendante, ou montant très faible.\n\nL'**EPL** (encouragement à la propriété du logement) permet d'utiliser sa prévoyance pour **acquérir ou construire sa résidence principale, acheter des parts de propriété, ou rembourser un prêt hypothécaire**. Règles principales : versement anticipé minimum **20'000.-**, possible tous les 5 ans seulement, jusqu'à 3 ans avant la retraite. Après 50 ans, le montant retirable est limité. L'argent va directement au vendeur, à l'entrepreneur ou au notaire — **jamais en mains de l'assuré**.\n\nLe **surobligatoire** désigne tout ce qui dépasse le minimum légal : assurer la part du salaire sous le seuil d'entrée (22'680.-) ou au-dessus du coordonné maximum (64'260.-), augmenter les bonifications, ou ajouter un capital-décès. C'est l'entreprise et le règlement de la caisse qui décident de l'étendue de cette couverture étendue.", "cle": "Libre passage = avoir transféré à la nouvelle caisse ou sur un compte/police de libre passage. EPL : retrait min 20'000.-, tous les 5 ans, versé directement au vendeur/notaire. Surobligatoire = au-delà du minimum légal (sous le seuil ou au-dessus du coordonné max).", "exemple": "À la fin de son contrat, un salarié sans emploi a accumulé 80'000.- d'avoir de vieillesse. Faute de nouvel employeur immédiat, cet avoir part sur un compte de libre passage en banque. Il reste couvert encore 1 mois pour les risques décès et invalidité.", "piege": "Le versement EPL ne passe jamais par les mains de l'assuré : il est versé directement au vendeur ou au notaire. Et le libre passage ne peut être touché en espèces que dans les 3 cas légaux — sinon il doit rester affecté à la prévoyance.", "ref": "LFLP (1995) ; loi EPL (01.01.1995) ; LPP surobligatoire"}, {"titre": "LAA : accidents pro à l'employeur, non-pro à l'employé", "contenu": "La LAA (en vigueur depuis 1984) rend l'assurance-accidents **obligatoire pour tous les salariés** travaillant en Suisse, sans seuil d'âge ni de salaire (contrairement à la LPP). Elle couvre **trois risques distincts** : accidents professionnels (AAP), maladies professionnelles, et accidents non professionnels (AANP).\n\nLe partage des cotisations est la clé : l'employeur paie l'**ensemble** des primes, mais peut **répercuter sur le salarié uniquement la prime accident NON professionnel**. La prime **accident et maladie professionnels reste entièrement à la charge de l'employeur**. Le salaire maximal assuré est de **148'200.- (valeur 2024)**.\n\nLa couverture dépend des **heures travaillées** : plus de 8 h/semaine chez le même employeur → couvert pour AAP, maladies pro ET AANP ; moins de 8 h/semaine → couvert seulement pour les accidents et maladies professionnels (l'accident non pro doit être inclus dans l'assurance-maladie). Pour ces travailleurs à temps partiel, l'accident sur le trajet domicile-travail est considéré comme professionnel.\n\nLes **prestations** couvrent les soins (sans franchise), l'indemnité journalière (**80% du gain assuré dès le 3e jour**, après 2 jours d'attente), la rente d'invalidité (80% du gain en cas d'invalidité totale, dès 10% d'invalidité), et les rentes de survivants (veuve/veuf 40%, orphelin 15% ou 25%).\n\nL'assureur peut être de droit public (la **Suva**, obligatoire pour les secteurs à risque comme le bâtiment, l'industrie, les transports) ou privé. La **CLAA** (complémentaire LAA) permet à l'employeur d'améliorer la couverture : 100% dès le 3e jour, couverture dès le 1er jour, ou la part du salaire dépassant 148'200.-.", "cle": "LAA obligatoire pour tous les salariés, sans seuil. Accident/maladie PRO = 100% employeur ; accident NON-PRO = répercuté sur l'employé. Seuil des 8 h/semaine pour la couverture non-pro. Salaire max assuré 148'200.-. IJ = 80% dès le 3e jour. Suva pour les secteurs à risque.", "exemple": "Gain journalier max assuré : 148'200 / 365 = 406.-. Indemnité journalière maximale (80%) : 406 × 80% = 324.80 par jour. Un employé blessé en faisant du ski (accident non professionnel) est couvert s'il travaille plus de 8 h/semaine ; sinon ce risque relève de son assurance-maladie.", "piege": "Bien retenir le sens : la prime ACCIDENT PROFESSIONNEL est payée par l'employeur, la prime ACCIDENT NON PROFESSIONNEL est à la charge de l'employé (mais prélevée par l'employeur). Et sous 8 h/semaine, l'AANP n'est PAS couvert par l'employeur — sauf l'accident de trajet, requalifié en professionnel.", "ref": "LAA (1984) art. 1a, 7, 9, 66 ; OLAA ; salaire max 148'200.-"}, {"titre": "IJM : l'assurance perte de gain maladie, facultative", "contenu": "Contrairement à la LAA, il n'existe **aucune obligation légale** de souscrire une assurance d'indemnités journalières en cas de maladie. L'**IJM** (souvent appelée « assurance perte de gain maladie ») est donc **facultative** — l'employeur décide librement. À ne pas confondre avec les APG de la LAPG (service, maternité).\n\nS'il ne s'assure pas, l'employeur doit appliquer le **Code des obligations** (art. 324a CO) : verser le salaire pendant une durée croissante avec l'ancienneté. En Suisse romande, on utilise l'**échelle de Berne** : 3 semaines la 1re année, 1 mois la 2e, 2 mois les 3e-4e, 3 mois les 5e-9e, etc. C'est très limité — d'où l'intérêt de l'IJM.\n\nL'IJM existe sous deux formes : sous la **LAMal** (assurance sociale collective, mais non obligatoire) ou sous la **LCA** (assurance privée). Lorsque l'employeur conclut une telle assurance, il transfère son obligation de payer le salaire à l'assureur.\n\nSelon la jurisprudence du Tribunal fédéral (ATF 128 II 13), pour être équivalente au CO, l'IJM doit en général : verser l'indemnité **720 à 730 jours sur une période de 900 jours**, couvrir au moins **80% du salaire**, avec l'employeur prenant en charge au moins **50% de la prime**, et un délai de carence de 2 à 3 jours maximum.", "cle": "L'IJM (perte de gain maladie) est FACULTATIVE, contrairement à la LAA. Sans elle, l'employeur applique le CO art. 324a (échelle de Berne). Standard équivalent : 80% du salaire, 720-730 jours sur 900, prime ≥50% employeur.", "exemple": "Un employé non assuré, en poste depuis 6 mois, tombe malade un mois. Selon l'échelle de Berne (moins d'un an de service), l'employeur ne doit verser le 100% du salaire que pendant 3 semaines, puis plus rien. Avec une IJM, l'assureur prendrait le relais à 80%.", "piege": "Ne pas confondre l'IJM (indemnités journalières MALADIE, facultative) avec les APG (allocations pour perte de gain, service/maternité, obligatoires via la LAPG). Et l'indépendant ne bénéficie pas du CO art. 324a : sans IJM privée, il n'a aucun revenu en cas de maladie.", "ref": "CO art. 324a et 324b ; échelle de Berne ; LAMal / LCA ; ATF 128 II 13"}, {"titre": "Assurance-chômage (AC) : 1,1% chacun jusqu'à 148'200.-", "contenu": "L'AC (loi LACI) garantit une compensation du manque à gagner en cas de chômage, de réduction de l'horaire de travail, d'intempéries ou d'insolvabilité de l'employeur. L'État exerce un monopole via les caisses de chômage et les **offices régionaux de placement (ORP)**.\n\n**Qui est assuré ?** Tous les salariés travaillant en Suisse, **sauf les frontaliers**. Ne sont pas assurés : les indépendants, les retraités qui continuent à travailler, et les sociétaires d'une SA/Sàrl participant à la direction.\n\n**Qui cotise ?** Tous les salariés soumis à l'AVS et leurs employeurs. Le salaire soumis est le « salaire AVS », **plafonné à 148'200.-/an** (12'350.-/mois). Le taux est de **2,2% au total, partagé 50/50** : 1,1% employé + 1,1% employeur. Depuis le 1er janvier 2023, il n'y a plus de cotisation de solidarité au-delà de 148'201.-. Les salaires « minimes » sous 2'300.-/an ne sont pas soumis.\n\n**Prestations :** l'indemnité de chômage, versée sous forme de 5 indemnités journalières par semaine. Le montant est de **70% du salaire assuré**, porté à **80%** dans trois cas : obligation d'entretien envers des enfants de moins de 25 ans, gain assuré ne dépassant pas 3'797.-/mois, ou rente d'invalidité d'au moins 40%.\n\n**Conditions du droit (cumulatives) :** être sans emploi, domicilié en Suisse, avoir cotisé au moins **12 mois dans les 2 ans** précédant l'inscription (délai-cadre), être apte au placement, et satisfaire aux exigences de contrôle.", "cle": "AC : assurés = salariés en Suisse SAUF frontaliers. Taux 2,2% partagé 50/50 (1,1% chacun) sur le salaire plafonné à 148'200.-. Indemnité = 70% du salaire (80% si enfant à charge, petit salaire, ou invalidité ≥40%). Droit : ≥12 mois de cotisation sur 2 ans.", "exemple": "Un employé célibataire sans enfant gagnant 6'000.-/mois et licencié touchera 70% de son salaire assuré comme indemnité. Un parent avec un enfant de moins de 25 ans, à salaire égal, touchera lui 80%.", "piege": "Le taux usuel attendu est souvent énoncé « 1,1% chacun » (soit 2,2% au total) sur la part jusqu'à 148'200.- — ne pas oublier que la cotisation de solidarité (1% au-dessus) a été SUPPRIMÉE dès 2023. Et les frontaliers, bien que travaillant en Suisse, ne sont pas assurés à l'AC suisse.", "ref": "LACI art. 1a, 7, 8, 13-15, 18c ; valeurs 2026 ; plafond 148'200.-"}, {"titre": "APG service et APG maternité/parent/adoption/prise en charge", "contenu": "Le régime des **APG** (loi LAPG) couvre la perte de gain dans plusieurs situations, financé par **répartition** comme l'AVS. La cotisation APG (**0,5%** en 2026) est intégrée au taux AVS/AI/APG et concerne salariés, employeurs, indépendants et non-actifs domiciliés en Suisse.\n\n**APG service :** versée à ceux qui servent l'État — armée, protection civile, Croix-Rouge, service civil, cours Jeunesse+Sport, moniteurs de jeunes tireurs. L'allocation de base vaut **80% du revenu moyen, plafonnée à 220.-/jour** (forfait de 69.-/jour pour les recrues). S'y ajoutent des suppléments : allocation pour enfant (22.-/enfant), d'exploitation, et pour frais de garde.\n\n**APG maternité :** introduite en 2005, elle indemnise un congé de **14 semaines (98 jours)** à **80% du revenu**, plafonné à **220.-/jour**. Conditions : avoir été assurée AVS pendant les 9 mois précédant la naissance et avoir exercé une activité lucrative au moins 5 mois durant cette période. (Genève prolonge à 16 semaines.)\n\n**APG à l'autre parent :** depuis 2024, le « congé paternité » devient le congé de **l'autre parent** (père légal ou épouse de la mère) : **2 semaines (14 indemnités)** à prendre dans les 6 mois suivant la naissance, à 80%.\n\n**APG adoption :** depuis 2023, **2 semaines (14 indemnités)** pour l'accueil d'un enfant de moins de 4 ans, à 80%, dans un délai-cadre d'un an.\n\n**APG de prise en charge :** depuis 2021, **14 semaines** partageables entre les deux parents pour s'occuper d'un enfant gravement atteint dans sa santé, à 80%.", "cle": "APG financées par répartition (cotisation 0,5% dans l'AVS/AI/APG). Toutes les allocations = 80% du revenu, plafond 220.-/jour. Maternité = 14 semaines, autre parent = 2 semaines, adoption = 2 semaines, prise en charge = 14 semaines (partageable).", "exemple": "Une jeune mère salariée gagnant 6'000.-/mois (72'000.-/an, soit 200.-/jour sur 360 jours) touche pendant 14 semaines une indemnité de 80% × 200 = 160.-/jour. Pour un haut salaire, l'indemnité serait plafonnée : gain max assuré 99'000.-/an → 220.-/jour maximum.", "piege": "Toutes ces APG plafonnent à 220.-/jour, pas seulement la maternité. Et le congé de « l'autre parent » (2 semaines) ne doit pas être confondu avec le congé de prise en charge (14 semaines, enfant gravement malade) ni avec la maternité (14 semaines).", "ref": "LAPG art. 16i-16k ; CO art. 329f, 329g ; allocation 80%, max 220.-/jour"}, {"titre": "Allocations familiales : min 200.-/enfant, financées par l'employeur", "contenu": "Les allocations familiales (loi LAFam, en vigueur depuis 2009) sont une contribution versée aux parents pour compenser partiellement la charge financière des enfants. C'est une **loi-cadre** : chaque canton peut prévoir des montants plus généreux, d'où des prestations variant d'un canton à l'autre.\n\n**Qui cotise ?** Les cotisations sont **entièrement à la charge de l'employeur** (sauf exception, comme le Valais). Elles se calculent sur l'ensemble des salaires soumis à l'AVS — **y compris les salaires des travailleurs sans enfant**. Le taux dépend du canton et des prestations offertes. Toutes les entreprises occupant des salariés doivent s'affilier à une caisse d'allocations familiales du canton de leur siège.\n\n**Qui est couvert ?** Les salariés hors agriculture (allocation entière dès 7'350.-/an de revenu), les indépendants (depuis 2013), et les personnes sans activité lucrative à revenu modeste (revenu imposable max 44'100.-/an, 58'800.- dans le canton de Vaud).\n\n**Les montants minimaux fédéraux :**\n- **Allocation pour enfant : au moins 200.-/mois**, de la naissance jusqu'à 16 ans (20 ans si l'enfant ne peut travailler pour cause de maladie/handicap).\n- **Allocation de formation professionnelle : au moins 250.-/mois**, dès 16 ans (ou dès le début de la formation postobligatoire) jusqu'à la fin de la formation, au plus tard 25 ans.\n\nÀ retenir : les montants versés au titre des allocations familiales ne font **pas partie du salaire déterminant AVS**.", "cle": "Allocations familiales : cotisation 100% EMPLOYEUR, sur tous les salaires AVS (même sans enfant). Minimums fédéraux : 200.-/mois par enfant (jusqu'à 16 ans), 250.-/mois en formation (16 à 25 ans). Loi-cadre → cantons peuvent faire plus.", "exemple": "Une entreprise verse des salaires totaux de 1'000'000.-/an. Elle paie la cotisation AF (à 100%) sur l'ensemble de cette masse salariale, même pour les employés sans enfant. Un de ses employés, père de deux enfants (10 et 17 ans en apprentissage), reçoit au minimum 200.- + 250.- = 450.-/mois d'allocations.", "piege": "Contrairement à l'AVS ou la LPP, les allocations familiales sont financées UNIQUEMENT par l'employeur (pas de part salariale, sauf cas valaisan). Et l'allocation de formation (250.-) remplace l'allocation pour enfant (200.-) dès le début de la formation postobligatoire — elles ne se cumulent pas pour le même enfant.", "ref": "LAFam (01.01.2009) art. 2 ; min 200.-/enfant, 250.-/formation"}], "pieges": [{"titre": "Répartition ou capitalisation : ne pas mélanger", "texte": "Le 1er pilier (AVS/AI/APG) fonctionne par RÉPARTITION : les actifs paient les rentes des retraités d'aujourd'hui, sans constitution de capital. Les 2e et 3e piliers fonctionnent par CAPITALISATION : chacun épargne son propre avoir. Confondre les deux est l'erreur conceptuelle la plus pénalisante."}, {"titre": "Seuils LPP : entrée, déduction, plafond", "texte": "Trois montants à ne jamais confondre en 2026 : le seuil d'entrée 22'680.- (condition pour être assuré), la déduction de coordination 26'460.- (montant soustrait du salaire), et le plafond 90'720.- (salaire max pris en compte AVANT déduction). Le salaire coordonné qui en résulte va de 3'780.- à 64'260.-."}, {"titre": "LAA : sens du partage accident pro / non-pro", "texte": "L'accident et la maladie PROFESSIONNELS sont à 100% à la charge de l'employeur. L'accident NON PROFESSIONNEL est à la charge de l'employé (mais prélevé par l'employeur). Sous 8 h/semaine, l'accident non pro n'est même pas couvert — sauf le trajet, requalifié en professionnel."}, {"titre": "IJM facultative vs LAA obligatoire vs APG", "texte": "L'assurance perte de gain MALADIE (IJM) est facultative ; la LAA (accidents) est obligatoire ; les APG (service, maternité, etc.) sont obligatoires via la LAPG. Ces trois familles couvrent des risques différents et ne doivent pas être confondues malgré le terme commun « perte de gain »."}, {"titre": "Plafonds : AVS sans plafond, AC et LAA plafonnées", "texte": "L'AVS/AI/APG se calcule sur le salaire brut SANS aucun plafond. L'AC et la LAA sont plafonnées à 148'200.-/an. C'est précisément pour cela que les taux AC et AF ne peuvent pas être simplement additionnés au taux AVS/AI/APG."}, {"titre": "Rentes jamais automatiques", "texte": "Qu'il s'agisse de la rente de vieillesse, d'invalidité ou de survivants, l'AVS/AI ne verse RIEN automatiquement. C'est toujours à l'assuré (ou à ses survivants) de déposer une demande auprès de la dernière caisse de compensation où il a cotisé."}], "points_cles": ["Système des 3 piliers : 1er (AVS/AI/PC, public, répartition, besoins vitaux), 2e (LPP/LAA, professionnel, capitalisation, niveau de vie), 3e (individuel facultatif, 3a liée / 3b libre). Objectif des piliers 1+2 : ~60% du dernier salaire.", "AVS/AI/APG : répartition, sur salaire brut sans plafond, taux total 10,6% partagé 50/50 (5,3% employé + 5,3% employeur). Âge de référence 65 ans (uniformisation H/F en 2028). Couvre toute la population résidente. Rentes : veuve/veuf 80%, orphelin 40% (60% double), enfant 40%.", "LPP : capitalisation, seuil d'entrée 22'680.-, déduction de coordination 26'460.-, plafond 90'720.-, salaire coordonné 3'780.- à 64'260.-. Bonifications par âge : 25→7%, 35→10%, 45→15%, 55→18%. Cotisations 50/50. Libre passage et EPL (retrait min 20'000.-).", "LAA : obligatoire pour tous les salariés sans seuil. Accident/maladie PRO = 100% employeur, accident NON-PRO = employé. Seuil des 8 h/semaine. Salaire max 148'200.-, indemnité 80% dès le 3e jour. Suva pour les secteurs à risque, CLAA en complément.", "AC : salariés en Suisse sauf frontaliers, taux 2,2% partagé 50/50 (1,1% chacun) jusqu'à 148'200.-, indemnité 70% (80% si enfant/petit salaire/invalidité). Droit : ≥12 mois cotisés sur 2 ans, apte au placement.", "APG (répartition, 0,5%) : toutes les allocations à 80% du revenu, plafond 220.-/jour — maternité 14 semaines, autre parent 2 semaines, adoption 2 semaines, prise en charge 14 semaines. Allocations familiales : 100% employeur, min 200.-/enfant et 250.-/formation. LPGA coordonne tout sauf la LPP (plafond 90% du gain)."]}, {"id": "remuneration", "icon": "💵", "titre": "Rémunération : décompte de salaire et charges sociales", "intro": "Établir une fiche de paie correcte, c'est savoir empiler les bons taux dans le bon ordre, puis traduire le tout en écritures comptables propres. Ce chapitre te donne les valeurs 2026, la mécanique brut → déductions → net, la répartition employé/employeur et les écritures de fin de mois. Maîtrise-le et tu seras capable de monter un décompte de salaire de A à Z et de le journaliser sans hésiter.", "points_cles": ["Taux 2024 employé ET employeur identiques pour l'AVS/AI/APG (5,3%) et l'AC (1,1% jusqu'à 148'200), mais la répartition diffère pour la LPP (au moins 50% employeur), la LAA (la prime non professionnelle peut être 100% à charge de l'employé), l'IJM (au moins 50% employeur) et les allocations familiales (100% employeur).", "Chaque assurance a sa propre base de calcul : AVS illimitée, AC plafonnée à 148'200, LPP sur le salaire coordonné (max 64'260), LAA plafonnée à 148'200. Ne calcule jamais toutes les déductions sur le même montant.", "Le salaire coordonné LPP = salaire AVS borné, moins la déduction de coordination 26'460, avec un seuil d'entrée à 22'680, un minimum coordonné de 3'780 et un maximum de 64'260 (revenu max pris en compte 90'720).", "Les bonifications de vieillesse LPP montent avec l'âge : 7% dès 25 ans, 10% dès 35, 15% dès 45, 18% dès 55 ; au moins la moitié est payée par l'employeur.", "Côté écritures, on crédite les comptes de bilan 2270 (caisse AVS), 2271 (caisse LPP), 2279 (impôt source), 2300 (OP) au moment du salaire, et la prime LAA/IJM payée d'avance est créditée directement aux comptes de charge 5730/5740.", "Les primes LAA et IJM sont réglées d'avance (souvent annuellement) : les charges patronales correspondantes ne sont donc PAS comptabilisées chaque mois."], "lecons": [{"titre": "Les valeurs et taux 2024 à connaître par cœur", "contenu": "Tout part de quelques chiffres qu'il faut avoir en tête. Pour l'**AVS/AI/APG**, le taux est de **5,3%** côté employé comme côté employeur, sur un salaire **illimité**. L'**assurance chômage (AC)** prélève **1,1%**, mais uniquement jusqu'à **CHF 148'200.– par an** (soit CHF 12'350.– par mois) ; au-delà, plus de cotisation AC. La **LAA** assure le salaire jusqu'au même plafond de **CHF 148'200.–** par an.\n\nLa **prévoyance professionnelle (LPP)** est plus subtile car elle ne se calcule pas sur le salaire brut mais sur le **salaire coordonné**. Retiens les bornes 2024 : **seuil d'entrée CHF 22'680.–** (en dessous, pas d'assujettissement), **déduction de coordination CHF 26'460.–**, **revenu maximum LPP CHF 90'720.–**, **salaire coordonné maximum CHF 64'260.–** et **minimum CHF 3'780.–**. Les **bonifications de vieillesse** (la part épargne) augmentent avec l'âge : **7% dès 25 ans, 10% dès 35 ans, 15% dès 45 ans, 18% dès 55 ans**, dont au minimum la moitié est prise en charge par l'employeur.\n\nEnfin, les **allocations familiales (AFam)** sont financées par une cotisation employeur comprise entre **0,64% et 3,5%** selon la caisse et le canton, et les **frais administratifs AVS** sont variables selon la caisse de compensation. L'idée à intégrer : un même salaire ne sert jamais de base à toutes les assurances en même temps, chacune a son propre plafond.", "exemple": "Pierre, 46 ans, gagne CHF 6'000.– par mois. Sa déduction AVS/AI/APG : 6'000 × 5,3% = CHF 318.–. Son AC : 6'000 × 1,1% = CHF 66.–. Comme il a 46 ans, son taux LPP est de 15%, dont la moitié (7,5%) à sa charge.", "piege": "Calculer l'AC sur le salaire complet d'un cadre bien payé. Pour Paul (15'000.–/mois), l'AC ne se calcule que sur le plafond mensuel de 12'350.– (148'200 / 12), soit 12'350 × 1,1% = CHF 135.85, pas sur 15'000.–.", "cle": "Cinq nombres à mémoriser : 5,3% (AVS), 1,1% (AC), 148'200 (plafond AC et LAA), 26'460 (coordination LPP), 64'260 (coordonné max LPP).", "ref": "Valeurs des assurances sociales 2024 ; LAVS, LACI, LPP, LAA", "astuce": "Pour les bonifications LPP, retiens la suite 7-10-15-18 calée sur les décennies 25-35-45-55. Chaque tranche d'âge fait un saut net.", "tableau": {"titre": "Taux et valeurs 2026 (assurances sociales)", "entetes": ["Assurance", "Taux", "Base / plafond"], "lignes": [["AVS/AI/APG", "5,3%", "Salaire illimité"], ["AC (chômage)", "1,1%", "Jusqu'à CHF 148'200.–/an"], ["LAA", "selon prime", "Salaire max CHF 148'200.–/an"], ["LPP — seuil d'entrée", "—", "CHF 22'680.–"], ["LPP — déduction coordination", "—", "CHF 26'460.–"], ["LPP — coordonné min / max", "—", "CHF 3'780.– / 64'260.–"], ["LPP — revenu max pris en compte", "—", "CHF 90'720.–"], ["LPP — bonification vieillesse", "7 / 10 / 15 / 18%", "dès 25 / 35 / 45 / 55 ans"], ["Allocations familiales", "0,64% à 3,5%", "À charge employeur"]]}}, {"titre": "Calculer le salaire coordonné LPP", "contenu": "La LPP mérite une leçon à elle seule car c'est là que les erreurs se nichent. La cotisation ne porte pas sur le salaire brut, mais sur le **salaire coordonné**. Le principe : on part du salaire AVS annuel, on lui retire la **déduction de coordination de CHF 26'460.–** (qui correspond à la part déjà couverte par l'AVS), et ce qui reste est assuré au 2e pilier.\n\nMais plusieurs bornes encadrent ce calcul. D'abord, si le salaire annuel est inférieur au **seuil d'entrée de CHF 22'680.–**, l'employé n'est pas assujetti à la LPP obligatoire. Ensuite, le revenu pris en compte est plafonné à **CHF 90'720.–** : au-delà, le salaire coordonné reste bloqué à son **maximum de CHF 64'260.–** (soit 90'720 − 26'460). À l'autre extrémité, si le calcul donne un coordonné très faible mais que l'employé est assujetti, on applique le **minimum coordonné de CHF 3'780.–**.\n\nUne fois le salaire coordonné déterminé, on lui applique le **taux de bonification selon l'âge** (7/10/15/18%), puis on partage : au minimum la moitié pour l'employeur, le reste pour l'employé. L'astuce mentale : salaire coordonné = (salaire AVS borné entre 22'680 et 90'720) − 26'460, puis borné entre 3'780 et 64'260.", "exemple": "Gérard, 34 ans, salaire annuel 60'000.–. Coordonné = 60'000 − 26'460 = CHF 33'540.– (soit 2'795.–/mois). Taux à 34 ans = 7%, dont la moitié (3,5%) employé : 2'795.– × 3,5% = CHF 97.83/mois.", "piege": "Oublier le plafonnement à 64'260. Pour Alain (110'000.–/an > 90'720.–), le coordonné est plafonné à 64'260.–, PAS à 110'000 − 26'460. À 40 ans (taux 10%, part employé 5%) : 64'260 / 12 × 5% = CHF 267.75/mois.", "cle": "Salaire coordonné = salaire AVS (borné 22'680–90'720) moins 26'460, le résultat étant lui-même borné entre 3'780 et 64'260.", "ref": "LPP art. 8 (salaire coordonné) ; valeurs 2026", "astuce": "Pour Pierre à temps partiel (26'400.–/an) : 26'400 − 26'460 = −60 (négatif), inférieur au minimum 3'780. On retient donc 3'780 : 3'780 / 12 × 5% = CHF 15.75/mois. Le plancher prime sur le calcul brut."}, {"titre": "Déductions à charge de l'employé", "contenu": "L'employeur est responsable du versement de la **totalité** des cotisations aux institutions d'assurance. Concrètement, il **déduit** d'abord du salaire de chaque employé sa part personnelle, puis verse l'ensemble aux caisses. Six retenues peuvent figurer sur la fiche côté employé.\n\nLa part **AVS/AI/APG (5,3%)** et la part **AC (1,1%)** sont systématiques (sauf cas particuliers d'âge). La **part employé de la LPP** représente au maximum 50% de la cotisation totale. Pour la **LAA**, c'est la **prime accidents non professionnels (LAAnp)** qui est typiquement mise à la charge de l'employé, soit en totalité, soit selon la décision de l'employeur. L'**assurance indemnités journalières maladie (IJM)** — souvent appelée « perte de gain maladie », à ne pas confondre avec les APG service/maternité — est facultative ; quand l'employeur la met en place, la part employé est au maximum 50% de la cotisation. Enfin, pour les travailleurs sans permis C ou domiciliés à l'étranger, l'employeur retient l'**impôt à la source**.\n\nAttention aux deux exceptions liées à l'âge : une personne ayant atteint l'âge de référence de la retraite bénéficie d'une **franchise AVS de CHF 1'400.–/mois** (16'800.–/an), à laquelle elle peut renoncer ; et elle **ne cotise plus à l'AC**.", "exemple": "Sur un salaire AVS mensuel de 14'400.– : AVS 14'400 × 5,3% = 763.20 ; AC 12'350 × 1,1% = 135.85 ; IJM 14'400 × 1% = 144.00 ; LPP 5'355.00 × 8% = 428.40 ; LAAnp 12'350 × 1,45% = 179.10. Total déductions sociales employé = CHF 1'650.55.", "piege": "Confondre l'IJM (perte de gain maladie, assurance privée facultative) avec les APG (allocations pour perte de gain en cas de service militaire, maternité, paternité). Ce sont deux choses totalement distinctes.", "cle": "L'employé supporte sa part AVS/AC, sa moitié de LPP et d'IJM, souvent la totalité de la LAA non professionnelle, plus l'impôt à la source le cas échéant.", "ref": "LAVS art. 5 ; LACI ; LPP ; LAA ; LIFD (impôt à la source)", "astuce": "Jacques, 67 ans : AVS calculée sur 5'000 − 1'400 (franchise) = 3'600 × 5,3% = 190.80, et AC = 0 (retraité). Deux réflexes pour l'âge de référence : franchise AVS + plus d'AC."}, {"titre": "Charges à la charge de l'employeur", "contenu": "En miroir des retenues, l'employeur supporte ses propres cotisations. Certaines sont symétriques à celles de l'employé, d'autres lui sont exclusives. C'est ce qu'on appelle le « coût employeur » qui s'ajoute au salaire brut.\n\nL'employeur paie sa part **AVS/AI/APG (5,3%)** et **AC (1,1%)**, exactement aux mêmes taux que l'employé (cotisations paritaires). Pour la **LPP**, il prend en charge **au minimum 50%** de la cotisation totale, et peut décider d'en assumer davantage. Côté **LAA**, il supporte **entièrement** la prime pour accidents et maladies **professionnels** (LAApro) ; il ne participe à la prime non professionnelle que s'il le décide. Pour l'**IJM**, sa part est d'au moins 50%. Deux charges sont à 100% à sa charge et n'apparaissent jamais côté employé : les **allocations familiales** (cotisation totale, taux 0,64% à 3,5%) et les **frais administratifs AVS** (totalité, taux variable selon la caisse).\n\nLe point pédagogique clé : pour un salaire donné, le total des charges employeur est du même ordre de grandeur que les retenues employé, parfois un peu plus élevé à cause des AFam et frais administratifs entièrement patronaux.", "exemple": "Sur le même salaire (base AVS 14'400.–) : AVS 763.20 + AC 135.85 + IJM 144.00 + LPP 428.40 + LAApro 12'350 × 0,12% = 14.80 + AFam 14'400 × 2% = 288.00 + frais admin AVS 14'400 × 0,3% = 43.20. Total charges employeur = CHF 1'817.45.", "piege": "Croire que l'employeur partage la prime LAA non professionnelle. Par défaut, la LAAnp est à la charge de l'employé ; l'employeur ne supporte que la LAApro, sauf décision contraire de sa part.", "cle": "L'employeur paie sa moitié AVS/AC/LPP/IJM, la LAA professionnelle en totalité, et assume seul les allocations familiales et les frais administratifs AVS.", "ref": "LAFam (allocations familiales) ; LAA art. 91 ; LPP art. 66", "astuce": "Deux charges « 100% patron » à ne jamais oublier : allocations familiales et frais administratifs AVS. Si tu les vois côté employé, c'est une erreur."}, {"titre": "Établir un décompte de salaire complet (brut → net)", "contenu": "Le décompte se construit en trois étages bien séparés. **Étage 1 — le revenu brut** : on additionne le salaire de base, les éventuelles heures supplémentaires, le remboursement de frais et les allocations familiales. Attention, tout n'est pas soumis aux cotisations : le **remboursement de frais** (un défraiement, pas un revenu) et les **allocations familiales** ne sont pas soumis aux assurances sociales. C'est pourquoi la base de calcul AVS est souvent inférieure au total brut.\n\n**Étage 2 — les déductions sociales** : on applique chaque taux sur sa propre base (AVS sur le salaire soumis, AC et LAA sur le plafond mensuel 12'350, LPP sur le coordonné mensuel). **Étage 3 — les autres retenues** : remboursement d'avance ou de prêt, saisie sur salaire (OP) et impôt à la source. Le **net versé** = total brut − déductions sociales − autres retenues.\n\nL'erreur la plus fréquente consiste à appliquer un seul et même montant comme base de tous les prélèvements. Le bon réflexe : pour chaque ligne, se demander « quelle est la base correcte pour CETTE assurance ? ». Dans l'exemple ci-dessous, l'AVS et l'IJM portent sur 14'400 (le salaire et heures supp., hors frais et allocations), l'AC et la LAA sur 12'350 (plafond), la LPP sur 5'355.00 (coordonné mensuel max).", "exemple": "Total brut 15'800.– ; déductions sociales 1'650.55 ; autres retenues 1'300.– (avance 500 + saisie OP 350 + impôt source 450). Net versé = 15'800 − 1'650.55 − 1'300 = CHF 12'849.45.", "piege": "Inclure le remboursement de frais (1'200.–) et les allocations familiales (200.–) dans la base AVS. La base soumise n'est que 14'400.– (12'000 salaire + 2'400 heures supp.), pas 15'800.–.", "cle": "Trois étages : brut → déductions sociales (chacune sur sa base) → autres retenues → net. Frais et allocations gonflent le brut mais ne sont pas soumis aux cotisations.", "ref": "CO art. 322 ss (salaire) ; valeurs 2026", "astuce": "Repère mémo : « frais et allocs, je verse mais je ne cotise pas ». Ils montent dans le brut et ressortent au net sans jamais passer par les taux.", "tableau": {"titre": "Décompte de salaire mensuel complet", "entetes": ["Rubrique", "Taux", "Base CHF", "Montant CHF"], "lignes": [["Salaire mensuel", "", "", "12'000.00"], ["Heures supplémentaires (48 h à 50.–)", "", "", "2'400.00"], ["Remboursement des frais", "", "", "1'200.00"], ["Allocation familiale", "", "", "200.00"], ["TOTAL BRUT", "", "", "15'800.00"], ["Cotisation AVS/AI/APG", "5,3%", "14'400.00", "763.20"], ["Cotisation AC", "1,10%", "12'350.00", "135.85"], ["Cotisation IJM", "1,00%", "14'400.00", "144.00"], ["Cotisation LPP", "8,00%", "5'355.00", "428.40"], ["Cotisation LAAnp", "1,45%", "12'350.00", "179.10"], ["Sous-total déductions sociales", "", "", "1'650.55"], ["Remboursement avance sur salaire", "", "", "500.00"], ["Saisie selon OP", "", "", "350.00"], ["Impôt à la source", "", "", "450.00"], ["Sous-total autres déductions", "", "", "1'300.00"], ["MONTANT NET VERSÉ PAR BANQUE", "", "", "12'849.45"]]}}, {"titre": "Le traitement comptable des salaires et charges sociales", "contenu": "Comptabiliser un salaire, c'est traduire le décompte en écritures. On débite les **comptes de charges 5xxx** (salaires et charges patronales), on crédite les **comptes de bilan 22xx** (dettes envers les institutions) et la **banque** pour le net. Les comptes utilisés dans le manuel : **5200 Salaires**, **5700 Charges AVS/AI/APG et AC** (y compris frais administratifs), **5710 Charges allocations familiales**, **5720 Charges LPP**, **5730 Charges LAA**, **5740 Charges IJM**, **5800 Frais forfaitaires** ; côté bilan **2270 caisse AVS**, **2271 caisse LPP**, **2279 impôt à la source**, **2300 Office des poursuites**.\n\nÉtape 1, **l'enregistrement du salaire** : on débite 5200 (salaire + heures supp.), 5800 (frais) et le compte d'allocations ; on crédite les retenues vers chaque institution et la banque pour le net. Point subtil : les retenues LAA et IJM sont créditées **directement au compte de charge** (5730, 5740) et non à un compte de dette, car la prime a été **payée d'avance** par l'entreprise — la retenue vient simplement réduire la charge déjà comptabilisée.\n\nÉtape 2, **les charges patronales AVS/AC/LPP/AFam** : on débite 5700/5720/5710 par le crédit de 2270/2271. Étape 3, **les paiements** : on solde 2270 et 2271 par la banque. Comme indiqué dans le manuel, les charges patronales LAA et IJM ne sont pas comptabilisées chaque mois puisque la prime annuelle a déjà été passée en charge lors de son paiement d'avance.", "exemple": "Au paiement final, le compte 2270 (caisse AVS) cumule les retenues employé AVS+AC (763.20+135.85) et les charges patronales AVS+AC+AFam+frais (763.20+135.85+288.00+43.20) = CHF 2'129.30, viré par banque. Le compte 2271 (LPP) cumule 428.40 (employé) + 428.40 (employeur) = CHF 856.80.", "piege": "Créditer la retenue LAA/IJM dans un compte de dette 22xx. Non : la prime étant payée d'avance, la retenue de la part employé se passe au crédit du co
