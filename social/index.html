mpte de charge 5730/5740 pour diminuer la charge déjà enregistrée.", "cle": "Salaire : débit charges 5xxx, crédit dettes 22xx + banque. Les retenues LAA/IJM créditent directement la charge (prime payée d'avance), pas une dette.", "ref": "Plan comptable général suisse (PME) ; CO art. 957 ss", "astuce": "Pense au compte 2270 comme à un « pot commun AVS » : on y verse les retenues employé ET les charges patronales, puis on vide le pot par un seul virement à la caisse de compensation.", "tableau": {"titre": "Écritures du salaire (plan comptable général)", "entetes": ["Débit", "Crédit", "Libellé", "Somme CHF"], "lignes": [["5200", "", "Salaire + heures supplémentaires", "14'400.00"], ["5800", "", "Remboursement de frais", "1'200.00"], ["5850", "", "Allocations familiales", "200.00"], ["", "2270", "Retenue AVS/AI/APG", "763.20"], ["", "2270", "Retenue AC", "135.85"], ["", "5740", "Retenue IJM (prime payée d'avance)", "144.00"], ["", "2271", "Retenue LPP", "428.40"], ["", "5730", "Retenue LAA (prime payée d'avance)", "179.10"], ["", "2300", "Retenue OP (saisie)", "350.00"], ["", "1440", "Remboursement prêt", "500.00"], ["", "2279", "Retenue impôt à la source", "450.00"], ["", "1020", "Paiement salaire net", "12'849.45"], ["5700", "2270", "Charges AVS/AI/APG", "763.20"], ["5700", "2270", "Charges AC", "135.85"], ["5720", "2271", "Charges LPP", "428.40"], ["5710", "2270", "Charges allocations familiales", "288.00"], ["5700", "2270", "Frais administratifs AVS", "43.20"], ["2270", "1020", "Paiement caisse de compensation", "2'129.30"], ["2271", "1020", "Paiement LPP", "856.80"]]}}, {"titre": "Les autres retenues : impôt source, saisie, prêt", "contenu": "Au-delà des assurances sociales, trois retenues spécifiques peuvent grever la fiche. Elles ont en commun que l'employeur joue un rôle d'**intermédiaire** : il retient un montant sur le net et le reverse à un tiers.\n\nL'**impôt à la source (IS)** concerne les travailleurs domiciliés ou en séjour en Suisse sans permis d'établissement (permis C), ainsi que ceux domiciliés à l'étranger, quelle que soit leur nationalité. L'employeur retient le montant dû et le verse directement à l'administration fiscale cantonale. Comptablement, on ouvre un compte du **groupe 220** (par exemple 2279 ou 2201 « Impôt à la source dû »).\n\nLa **saisie sur salaire** intervient lorsqu'une personne, après une saisie n'ayant pas désintéressé ses créanciers, est soumise par l'**office des poursuites (OP)** à une retenue mensuelle. L'employeur est responsable d'effectuer la retenue fixée dans la décision juridique et de la verser à l'office. On utilise un compte du groupe 220 (par exemple 2202 « Saisie sur salaire à payer » ou 2300 OP).\n\nLe **remboursement d'un prêt** accordé par l'employeur se fait souvent par retenue sur salaire. L'écriture vient au **crédit du compte qui avait enregistré le prêt** (par exemple 1445 ou 1440 « Prêt accordé au personnel »), ce qui diminue la créance de l'entreprise — il ne s'agit donc ni d'une charge ni d'une dette envers un tiers.", "exemple": "Sur le décompte type : impôt à la source 450.– (crédit 2279), saisie OP 350.– (crédit 2300), remboursement avance/prêt 500.– (crédit 1440). Ces 1'300.– viennent réduire le net versé sans affecter les comptes de charges.", "piege": "Passer le remboursement de prêt en produit ou en charge. C'est faux : il éteint une créance existante, donc il se crédite au compte d'actif où le prêt avait été enregistré (1440/1445).", "cle": "Impôt source et saisie OP = dettes envers un tiers (groupe 220/2300) ; remboursement de prêt = crédit du compte d'actif du prêt. L'employeur n'est qu'un intermédiaire.", "ref": "LIFD / LHID (impôt à la source) ; LP (saisie, office des poursuites) ; CO (prêt)", "astuce": "Trois destinations différentes : le fisc (2279), l'office des poursuites (2300), et… l'entreprise elle-même pour le prêt (1440). Suis l'argent pour trouver le bon compte."}, {"titre": "Le remboursement par les institutions d'assurance", "contenu": "Quand un employé est absent (service militaire, maternité, maladie, accident), une assurance ou les APG versent des indemnités. Le traitement comptable dépend de **qui reçoit l'argent** et de **qui assume le risque salarial**. Trois cas se présentent.\n\n**Cas 1 — salaire payé intégralement par l'entreprise.** L'entreprise continue de verser le plein salaire ; les indemnités lui appartiennent. Or certaines de ces prestations (allocations maladie ou accident) ne sont pas soumises aux cotisations sociales, ce qui devrait donner lieu à un décompte de correction des retenues. En pratique, beaucoup d'entreprises y renoncent en sachant que leurs charges ont été plus élevées que nécessaire. Comptablement, le remboursement reçu est porté **en diminution des salaires** si un décompte est établi, ou dans un **compte spécifique** sinon.\n\n**Cas 2 — salaire avancé par l'entreprise.** L'entreprise ne fait qu'avancer les indemnités : elles ne sont pas comptabilisées comme salaire mais comme un **prêt accordé au collaborateur**. Au remboursement par l'assurance, l'entreprise se rembourse et verse l'éventuelle différence à l'employé.\n\n**Cas 3 — indemnités reçues sans intervention de l'entreprise.** L'entreprise ne verse pas le salaire et ne fait aucune avance ; elle reverse simplement aux salariés le montant reçu. Comptablement, ce montant ne fait que **transiter** : il est passé directement dans un **compte de dettes envers le personnel**.", "exemple": "Une entreprise reçoit par banque les APG de cours de répétition militaire pour CHF 24'000.– (le salaire ayant été versé intégralement). Écriture : débit 1020 Banque / crédit 5700 (ou 5200) 24'000.–, ce qui réduit la charge de salaires de l'entreprise.", "piege": "Comptabiliser une avance de salaire (cas 2) comme une charge de salaire. Ce n'est pas une charge mais un prêt (actif) : tant que l'assurance n'a pas remboursé, le montant reste une créance sur le collaborateur.", "cle": "Salaire payé intégralement → l'indemnité diminue les salaires (ou compte spécifique) ; salaire avancé → prêt ; aucune intervention → simple transit via dette envers le personnel.", "ref": "LAPG ; LAMal (IJM) ; LAA ; CO art. 324a-324b", "astuce": "Demande-toi toujours : « l'argent reste-t-il à l'entreprise ou ne fait-il que passer ? ». S'il reste (salaire payé) il réduit les charges ; s'il passe (sans intervention) il transite par une dette."}], "pieges": [{"titre": "Une seule base pour toutes les déductions", "texte": "L'erreur reine : appliquer chaque taux sur le même montant. Chaque assurance a sa propre base. L'AVS porte sur le salaire soumis (sans frais ni allocations), l'AC et la LAA sur le plafond mensuel de 12'350.– (148'200/12), la LPP sur le salaire coordonné mensuel. Vérifie toujours la base ligne par ligne avant de multiplier."}, {"titre": "Frais et allocations dans la base de cotisation", "texte": "Le remboursement de frais et les allocations familiales gonflent le total brut mais ne sont PAS soumis aux assurances sociales. Dans le décompte type, le brut est de 15'800.– mais la base AVS n'est que de 14'400.–. Les inclure dans la base de calcul fausse toutes les déductions."}, {"titre": "Plafond LPP oublié pour les hauts salaires", "texte": "Au-delà d'un revenu de 90'720.–, le salaire coordonné reste bloqué à son maximum de 64'260.– et ne suit plus le salaire réel. Pour Alain (110'000.–/an), ne calcule jamais la LPP sur 110'000 − 26'460 ; le coordonné est plafonné à 64'260.–. À l'inverse, applique le plancher de 3'780.– quand le coordonné calculé est trop faible."}, {"titre": "Retenue LAA/IJM créditée comme une dette", "texte": "Comme la prime LAA et IJM est payée d'avance (souvent annuellement) par l'entreprise, la retenue de la part employé se passe au CRÉDIT du compte de charge 5730/5740 pour diminuer la charge déjà comptabilisée, et non au crédit d'un compte de dette 22xx. Conséquence : les charges patronales LAA/IJM ne se comptabilisent pas chaque mois."}, {"titre": "Confondre IJM et APG", "texte": "L'IJM (indemnités journalières en cas de maladie, souvent dite « perte de gain maladie ») est une assurance privée facultative. Les APG (allocations pour perte de gain) couvrent le service militaire, la maternité et la paternité. Ce sont deux dispositifs distincts qui ne se comptabilisent pas de la même façon."}, {"titre": "Allocations familiales et frais admin mis à charge de l'employé", "texte": "Les allocations familiales (0,64% à 3,5%) et les frais administratifs AVS sont intégralement à la charge de l'employeur. Ils n'apparaissent jamais comme retenue côté employé. Si tu les vois sur la fiche de paie côté salarié, c'est une erreur de répartition."}]}], "quiz": [{"section": "contrat", "q": "Selon le manuel, quels sont les quatre elements essentiels qui caracterisent un contrat de travail ?", "choix": ["Une prestation de travail, un rapport de subordination, un element temporel et une remuneration", "Un salaire, des vacances, un horaire et un lieu de travail", "Une offre, une acceptation, une cause et un objet", "Un employeur, un employe, un syndicat et une caisse"], "correct": 0, "explication": "Le contrat de travail est un contrat bilateral a titre onereux qui repose sur quatre piliers : la prestation de travail fournie, le rapport de subordination (l'employe est soumis aux instructions de l'employeur), un element temporel (la duree de l'engagement) et la remuneration versee en contrepartie."}, {"section": "contrat", "q": "Une convention collective de travail (CCT) est conclue entre des employeurs (ou leurs associations) et, du cote des travailleurs, qui exactement ?", "choix": ["N'importe quel groupe de travailleurs reunis ponctuellement", "Des associations de travailleurs formees en syndicats", "L'office cantonal du travail", "Chaque travailleur a titre individuel"], "correct": 1, "explication": "Selon l'art. 356 al. 1 CO, seules des associations d'employes formees en syndicats peuvent conclure une CCT. La convention regle avant tout les conditions de travail, en particulier le salaire, et les relations entre les parties."}, {"section": "contrat", "q": "Quelle est la duree maximale du temps d'essai prevue par l'art. 335b CO pour un contrat de duree indeterminee ?", "choix": ["Un mois", "Deux mois", "Trois mois", "Six mois"], "correct": 2, "explication": "Par defaut, le temps d'essai correspond au premier mois de travail, mais il peut etre porte par accord ecrit, CTT ou CCT jusqu'a un maximum de trois mois. En cas de maladie, d'accident ou d'obligation legale, il est prolonge de la duree de l'absence."}, {"section": "contrat", "q": "Apres le temps d'essai, quel est le delai de conge legal (art. 335c CO) entre la 2e et la 9e annee de service ?", "choix": ["Un mois pour la fin d'un mois", "Deux mois pour la fin d'un mois", "Trois mois pour la fin d'un mois", "Sept jours"], "correct": 1, "explication": "L'art. 335c CO fixe un delai de conge d'un mois pendant la premiere annee de service, de deux mois de la deuxieme a la neuvieme annee, puis de trois mois des la dixieme annee. Le conge est donne pour la fin d'un mois."}, {"section": "contrat", "q": "Combien de semaines de vacances l'art. 329 CO garantit-il au minimum a un travailleur de plus de 20 ans ?", "choix": ["Trois semaines", "Quatre semaines", "Cinq semaines", "Six semaines"], "correct": 1, "explication": "L'art. 329 CO prevoit quatre semaines de vacances pour tous les travailleurs de plus de 20 ans, et cinq semaines pour les jeunes travailleurs de moins de 20 ans. Les CCT prevoient souvent des conditions plus avantageuses, notamment des 50 ans."}, {"section": "contrat", "q": "Pour un employe paye a l'heure, quel pourcentage du gain represente l'indemnite de vacances correspondant a 4 semaines de vacances ?", "choix": ["6,25 %", "8,33 %", "10,64 %", "13,04 %"], "correct": 1, "explication": "L'indemnite de vacances pour un salarie paye a l'heure est de 8,33 % pour 4 semaines (4/48, l'annee comptant 52 semaines), 10,64 % pour 5 semaines et 13,04 % pour 6 semaines. Pour un salarie mensualise, ce calcul n'est pas necessaire car l'employeur continue de verser le salaire normal."}, {"section": "contrat", "q": "Selon le manuel, comment les heures supplementaires (depassant les heures convenues mais pas le maximum legal) doivent-elles etre traitees ?", "choix": ["Elles sont obligatoirement payees sans aucune majoration", "Elles sont soit compensees par un conge de duree egale, soit payees avec une majoration d'un quart au moins", "Elles sont toujours perdues", "Elles sont payees avec une majoration de 50 % au minimum"], "correct": 1, "explication": "Selon l'art. 321c CO, les heures supplementaires peuvent etre compensees par un conge d'une duree egale, ou payees avec une majoration d'un quart (25 %) au moins. Cet article est imperatif : on ne peut pas y deroger au detriment du travailleur ou de l'employeur."}, {"section": "contrat", "q": "Quel est, selon la loi, le seul jour ferie federal obligatoire en Suisse ?", "choix": ["Le 1er janvier", "Le 1er aout (Fete nationale)", "Le 25 decembre", "L'Ascension"], "correct": 1, "explication": "Selon l'art. 110 al. 3 Cst, seul le 1er aout est un jour ferie federal obligatoire et indemnise. Chaque canton peut fixer au plus huit autres jours feries assimiles a un dimanche, soit au maximum 9 jours feries par an."}, {"section": "assurances", "q": "De quoi est constitue le 1er pilier du systeme suisse de prevoyance ?", "choix": ["De la prevoyance professionnelle (LPP) et de l'assurance-accidents", "De l'AVS et de l'AI, complete par les prestations complementaires (PC)", "De la prevoyance individuelle 3a et 3b", "De l'assurance-maladie (LAMal) uniquement"], "correct": 1, "explication": "Le 1er pilier est constitue de l'AVS (vieillesse et survivants) et de l'AI (invalidite), complete par les prestations complementaires (PC). Il vise a couvrir les besoins vitaux et fonctionne selon le systeme de repartition : les cotisations des actifs financent immediatement les rentes des beneficiaires."}, {"section": " const SEC_COLOR = { contrat: "#4f46e5", assurances: "#0d9488", remuneration: "#d97706" };
const money = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "–";
  const neg = n < 0; n = Math.abs(n);
  let [a, b] = n.toFixed(2).split(".");
  a = a.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (neg ? "-" : "") + a + "." + b;
};

/* ── markdown léger ── */
function MdInline({ text }) {
  const s = String(text || "");
  const parts = s.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  return parts.map((p, i) => {
    if (/^\*\*[^*]+\*\*$/.test(p)) return <strong key={i} className="font-semibold text-slate-900">{p.slice(2, -2)}</strong>;
    if (/^`[^`]+`$/.test(p)) return <code key={i} className="bg-slate-100 rounded px-1 text-[0.9em] font-mono">{p.slice(1, -1)}</code>;
    return <React.Fragment key={i}>{p}</React.Fragment>;
  });
}
function MdBlock({ text }) {
  const blocks = String(text || "").trim().split(/\n\s*\n/);
  return blocks.map((bl, i) => {
    const lines = bl.split("\n").map((l) => l.trim()).filter(Boolean);
    const bullets = lines.filter((l) => /^[-•·]\s+/.test(l));
    if (bullets.length && bullets.length === lines.length) {
      return <ul key={i} className="list-disc pl-5 space-y-1 my-2.5">{lines.map((l, j) => <li key={j} className="text-[13.5px] text-slate-700 leading-relaxed"><MdInline text={l.replace(/^[-•·]\s+/, "")} /></li>)}</ul>;
    }
    return <p key={i} className="text-[13.5px] text-slate-700 leading-relaxed my-2.5 first:mt-0"><MdInline text={bl.replace(/\n/g, " ")} /></p>;
  });
}

const CALLOUTS = {
  cle: { icon: "🎯", label: "À retenir", cls: "border-violet-200 bg-violet-50", lc: "text-violet-700" },
  exemple: { icon: "🧮", label: "Exemple", cls: "border-sky-200 bg-sky-50", lc: "text-sky-700" },
  piege: { icon: "⚠️", label: "Piège", cls: "border-amber-200 bg-amber-50", lc: "text-amber-700" },
  astuce: { icon: "💡", label: "Astuce", cls: "border-emerald-200 bg-emerald-50", lc: "text-emerald-700" },
};
function Callout({ type, children }) {

  return (
    <div className={"rounded-xl border px-3.5 py-2.5 my-2 " + c.cls}>

}
function LTable({ t }) {

}

function LessonCard({ l, color }) {

/* ════════ Calculateur de fiche de salaire ════════ */
function calcPaie(inp, P) {
  const brut = Math.max(0, +inp.brut || 0);     // salaire soumis (frais exclus)
  const frais = Math.max(0, +inp.frais || 0);
  const age = +inp.age || 0;
  const retraite = !!inp.retraite;
  const r = {};
  // base AVS : franchise pour les retraités
  const baseAvs = retraite ? Math.max(0, brut - (P.franchise_retraite_mensuelle || 1400)) : brut;
  r.avs = baseAvs * (P.avs.taux / 100);
  // AC : plafonnée, nulle après l'âge de référence
  const acBase = retraite ? 0 : Math.min(brut, P.ac.plafond_mensuel);
  r.ac = acBase * (P.ac.taux / 100);
  // LAA non prof (part employé), plafonnée
  const laaBase = Math.min(brut, P.laa.max_mensuel);
  r.laaNp = laaBase * ((+inp.laaNp || 0) / 100);
  // IJM (part employé)
  r.ijm = brut * ((+inp.ijm || 0) / 100);
  // LPP
  r.coord = 0; r.bonif = 0; r.lppEmp = 0;
  const annual = brut * 12;
  const maxAge = P.lpp.bonifications[P.lpp.bonifications.length - 1].max;
  if (!retraite && annual >= P.lpp.seuil_entree && age >= 25 && age <= maxAge) {
    r.coord = Math.min(Math.max(annual - P.lpp.deduction_coordination, P.lpp.coord_min), P.lpp.coord_max);
    const b = P.lpp.bonifications.find((x) => age >= x.min && age <= x.max);
    r.bonif = b ? b.taux : 0;
    const lppAnnual = r.coord * (r.bonif / 100);
    r.lppEmp = (lppAnnual / 2) / 12;             // moitié employé, mensuel
  }
  r.totalDeduc = r.avs + r.ac + r.laaNp + r.ijm + r.lppEmp;
  r.net = brut - r.totalDeduc + frais;
  // charges employeur
  r.avsEr = baseAvs * (P.avs.taux / 100);
  r.acEr = r.ac;
  r.afEr = brut * ((+inp.af || 0) / 100);
  r.laaApEr = laaBase * ((+inp.laaAp || 0) / 100);
  r.ijmEr = r.ijm;
  r.lppEr = r.lppEmp;
  r.totalEr = r.avsEr + r.acEr + r.afEr + r.laaApEr + r.ijmEr + r.lppEr;
  r.coutTotal = brut + frais + r.totalEr;
  r.brut = brut; r.frais = frais;
  return r;
}
function NumField({ label, value, onChange, step, suffix, hint }) {

}
function Row({ label, taux, base, montant, strong, color }) {
  return (
    <div className={"flex items-center gap-2 py-1.5 " + (strong ? "border-t-2 border-slate-300" : "border-b border-slate-50")}>

      {base != null && <span className="w-24 text-right text-[12px] text-slate-400 tabular-nums hidden sm:block">{base}</span>}
      <span className={"w-28 text-right tabular-nums " + (strong ? "font-bold text-[14px]" : "text-[13px] text-slate-700")} style={strong && color ? { color } : {}}>{montant}</span>
    </div>
  );
}
function SalaryCalculator({ params }) {
  const P = params || {};
  const [inp, setInp] = useState({ brut: 6000, frais: 0, age: 40, retraite: false, af: 1.5, laaNp: (P.laa && P.laa.np_taux_defaut) || 1.4, laaAp: 0.5, ijm: 0 });
  const set = (k) => (v) => setInp((s) => ({ ...s, [k]: v }));
  const r = useMemo(() => calcPaie(inp, P), [inp, P]);

  if (!P.avs) return <div className="text-slate-400 text-sm py-10 text-center">Paramètres indisponibles.</div>;

  // écritures
  const ecr = [];
  ecr.push(["5200", "Salaires (brut soumis)", money(r.brut), ""]);
  if (r.frais > 0) ecr.push(["5800", "Frais forfaitaires", money(r.frais), ""]);
  ecr.push(["2270", "Retenue AVS/AI/APG + AC", "", money(r.avs + r.ac)]);
  if (r.lppEmp > 0) ecr.push(["2271", "Retenue LPP (part employé)", "", money(r.lppEmp)]);
  if (r.laaNp > 0) ecr.push(["5730", "Retenue LAA non prof.", "", money(r.laaNp)]);
  if (r.ijm > 0) ecr.push(["5740", "Retenue IJ maladie", "", money(r.ijm)]);
  ecr.push(["1020", "Net versé par la banque", "", money(r.net)]);

  return (
    <div>
      <div className="rounded-xl border border-cyan-200 bg-cyan-50/60 p-4 mb-4 max-w-[74ch]">
        <div className="text-[10.5px] font-bold uppercase tracking-[0.09em] text-cyan-700 mb-1">🧮 Calculateur de fiche de salaire {P.annee}</div>
        <p className="text-[13px] text-slate-700 leading-relaxed">Saisis un salaire et observe en direct les déductions de l'employé, le salaire net, les charges de l'employeur et les écritures comptables. Les frais remboursés ne sont pas soumis aux charges sociales.</p>
      </div>

      <div className="grid lg:grid-cols-[300px_1fr] gap-4 items-start">
        {/* entrées */}
        <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
          <div className="text-[11px] font-bold uppercase tracking-wide text-slate-400">Paramètres</div>
          <NumField label="Salaire brut mensuel (soumis)" value={inp.brut} onChange={set("brut")} step={100} suffix="CHF" />
          <NumField label="Frais remboursés (non soumis)" value={inp.frais} onChange={set("frais")} step={50} suffix="CHF" hint="Ajoutés au net, hors charges sociales." />
          <NumField label="Âge" value={inp.age} onChange={set("age")} suffix="ans" hint="Détermine la bonification LPP." />
          <label className="flex items-center gap-2 text-[12.5px] text-slate-700 cursor-pointer">
            <input type="checkbox" checked={inp.retraite} onChange={(e) => set("retraite")(e.target.checked)} className="rounded" />
            Retraité (franchise AVS, sans AC ni LPP)
          </label>
          <div className="pt-2 border-t border-slate-100 grid grid-cols-2 gap-2">
            <NumField label="LAA non prof." value={inp.laaNp} onChange={set("laaNp")} step={0.1} suffix="%" />
            <NumField label="LAA prof. (empl.)" value={inp.laaAp} onChange={set("laaAp")} step={0.1} suffix="%" />
            <NumField label="IJM (part empl.)" value={inp.ijm} onChange={set("ijm")} step={0.1} suffix="%" />
            <NumField label="Alloc. fam. (empl.)" value={inp.af} onChange={set("af")} step={0.01} suffix="%" />
          </div>
        </div>

        {/* sorties */}
        <div className="space-y-3">
          {/* fiche employé */}
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-800 text-white text-[13px] font-bold flex items-center justify-between">
              <span>Décompte de salaire</span>
              <span className="text-[11px] font-normal text-slate-300">part employé</span>
            </div>
            <div className="px-4 py-2">
              <div className="flex items-center gap-2 text-[10px] font-bold uppercase tracking-wide text-slate-400 pb-1 border-b border-slate-200">
                <span className="flex-1">Élément</span><span className="w-16 text-right">Taux</span><span className="w-24 text-right hidden sm:block">Base</span><span className="w-28 text-right">Montant</span>
              </div>
              <Row label="Salaire brut soumis" montant={money(r.brut)} />
              <Row label="AVS / AI / APG" taux={P.avs.taux + "%"} base={money(inp.retraite ? Math.max(0, r.brut - P.franchise_retraite_mensuelle) : r.brut)} montant={"− " + money(r.avs)} />
              <Row label="Assurance chômage (AC)" taux={inp.retraite ? "—" : P.ac.taux + "%"} base={money(inp.retraite ? 0 : Math.min(r.brut, P.ac.plafond_mensuel))} montant={"− " + money(r.ac)} />
              <Row label="LAA non professionnelle" taux={(+inp.laaNp || 0) + "%"} base={money(Math.min(r.brut, P.laa.max_mensuel))} montant={"− " + money(r.laaNp)} />
              {(+inp.ijm > 0) && <Row label="IJ maladie (part empl.)" taux={(+inp.ijm) + "%"} base={money(r.brut)} montant={"− " + money(r.ijm)} />}
              <Row label={"LPP" + (r.bonif ? " (bonif. " + r.bonif + "%, ½)" : "")} taux={r.bonif ? "" : "—"} base={r.coord ? money(r.coord) + "/an" : "hors LPP"} montant={"− " + money(r.lppEmp)} />
              <Row label="Total des déductions" montant={"− " + money(r.totalDeduc)} strong color="#dc2626" />
              {r.frais > 0 && <Row label="+ Frais remboursés" montant={"+ " + money(r.frais)} />}
              <Row label="Salaire net versé" montant={money(r.net)} strong color="#059669" />
            </div>
          </div>

          {/* charges employeur */}
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-100 text-slate-700 text-[13px] font-bold">Charges de l'employeur</div>
            <div className="px-4 py-2">
              <Row label="AVS / AI / APG" taux={P.avs.taux + "%"} montant={money(r.avsEr)} />
              <Row label="Assurance chômage (AC)" taux={inp.retraite ? "—" : P.ac.taux + "%"} montant={money(r.acEr)} />
              <Row label="Allocations familiales" taux={(+inp.af || 0) + "%"} montant={money(r.afEr)} />
              <Row label="LAA professionnelle" taux={(+inp.laaAp || 0) + "%"} montant={money(r.laaApEr)} />
              {(+inp.ijm > 0) && <Row label="IJ maladie (part empl.)" montant={money(r.ijmEr)} />}
              <Row label="LPP (part employeur, ≥ ½)" montant={money(r.lppEr)} />
              <Row label="Total charges employeur" montant={money(r.totalEr)} strong color="#0891b2" />
              <Row label="Coût total employeur" montant={money(r.coutTotal)} strong color="#0f172a" />
            </div>
          </div>

          {/* écritures */}
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-100 text-slate-700 text-[13px] font-bold">Écriture du salaire (journal)</div>
            <div className="px-4 py-2 overflow-x-auto">
              <table className="w-full border-collapse text-[12.5px]">
                <thead><tr className="text-[10px] font-bold uppercase tracking-wide text-slate-400">
                  <th className="text-left pb-1 border-b border-slate-200">Cpte</th><th className="text-left pb-1 border-b border-slate-200">Libellé</th><th className="text-right pb-1 border-b border-slate-200">Débit</th><th className="text-right pb-1 border-b border-slate-200">Crédit</th>
                </tr></thead>
                <tbody>
                  {ecr.map((e, i) => <tr key={i} className="border-b border-slate-50 last:border-0">
                    <td className="py-1 pr-2 font-mono text-slate-500">{e[0]}</td>
                    <td className="py-1 pr-2 text-slate-700">{e[1]}</td>
                    <td className="py-1 text-right tabular-nums text-slate-700">{e[2]}</td>
                    <td className="py-1 text-right tabular-nums text-slate-700">{e[3]}</td>
                  </tr>)}
                </tbody>
              </table>
              <div className="text-[10.5px] text-slate-400 mt-1.5">Méthode du manuel : les retenues LAA/IJM sont créditées aux comptes de charges correspondants. Les charges patronales font l'objet d'une écriture distincte.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════ Quiz ════════ */
function QuizView({ quiz }) {
  const [ans, setAns] = useState({});
  const total = quiz.length;
  const score = quiz.reduce((a, q, i) => a + (ans[i] === q.correct ? 1 : 0), 0);
  const done = Object.keys(ans).length;
  if (!total) return <div className="text-slate-400 text-sm py-10 text-center">Quiz indisponible.</div>;
  return (
    <div>
      <div className="sticky top-0 z-10 -mx-4 px-4 py-2 bg-slate-100/95 backdrop-blur border-b border-slate-200 mb-4 flex items-center justify-between">
        <span className="text-[13px] font-semibold text-slate-600">Quiz · {done}/{total} répondu{done > 1 ? "es" : "e"}</span>
        <span className="text-[13px] font-bold" style={{ color: score === done && done ? "#059669" : "#0891b2" }}>Score : {score}/{total}</span>
      </div>
      <div className="space-y-3">
        {quiz.map((q, i) => {
          const picked = ans[i];
          const answered = picked !== undefined;
          return (
            <div key={i} className="bg-white rounded-2xl border border-slate-200 p-4">
              <div className="flex gap-2">
                <span className="text-[11px] font-bold text-slate-300">{String(i + 1).padStart(2, "0")}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-[13.5px] text-slate-800 leading-snug">{q.q}</div>
                  <div className="mt-2 space-y-1.5">
                    {q.choix.map((c, j) => {
                      let cls = "border-slate-200 bg-white hover:border-cyan-300 text-slate-700";
                      if (answered && j === q.correct) cls = "border-emerald-300 bg-emerald-50 text-emerald-800";
                      else if (answered && j === picked) cls = "border-rose-300 bg-rose-50 text-rose-800";
                      return (
                        <button key={j} disabled={answered} onClick={() => setAns((s) => ({ ...s, [i]: j }))}
                          className={"w-full text-left text-[12.5px] rounded-lg border px-3 py-1.5 transition-colors " + cls}>
                          {answered && j === q.correct ? "✓ " : answered && j === picked ? "✗ " : ""}{c}
                        </button>
                      );
                    })}
                  </div>
                  {answered && q.explication && <div className="mt-2 text-[12px] text-slate-500 leading-snug bg-slate-50 rounded-lg px-3 py-2"><span className="font-semibold text-slate-600">Explication : </span><MdInline text={q.explication} /></div>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ════════ Shell ════════ */
function SocialApp() {
  const data = (typeof window !== "undefined" && window.__SOCIAL__) || {};
  const sections = data.sections || [];
  const params = data.parametres_2026 || data.parametres_2024 || {};
  const quiz = data.quiz || [];
  const tabs = [
    ...sections.map((s) => ({ k: s.id, label: (s.icon ? s.icon + " " : "") + s.titre })),
    { k: "calc", label: "🧮 Calculateur" },
    { k: "quiz", label: "🎯 Quiz" },
  ];
  const [view, setView] = useState(sections.length ? sections[0].id : "calc");
  const cur = sections.find((s) => s.id === view);

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      <header className="text-white" style={{ background: "linear-gradient(135deg,#0f172a 0%,#0e4f56 60%,#0891b2 100%)" }}>
        <div className="max-w-[940px] mx-auto px-4 py-5">
          <div className="flex items-center gap-2 text-[10.5px] font-mono uppercase tracking-[0.18em] text-cyan-200 mb-1.5">🤝 Droit social · paie suisse</div>
          <h1 className="text-2xl font-bold leading-tight">Social — travail, assurances sociales & rémunération</h1>
          <p className="text-[13px] text-slate-300 mt-1.5 max-w-[70ch] leading-relaxed">Le cours complet, un calculateur de fiche de salaire interactif et des quiz. Trois chapitres : contrat de travail, assurances sociales, et calcul de la paie.</p>
          {data.source && <p className="text-[11px] text-cyan-200/80 mt-2">Source : {data.source}</p>}
        </div>
      </header>

      <div className="sticky top-0 z-20 bg-slate-100/95 backdrop-blur border-b border-slate-200">
        <div className="max-w-[940px] mx-auto px-4 py-2 flex gap-1.5 overflow-x-auto">
          {tabs.map((t) => (
            <button key={t.k} onClick={() => { setView(t.k); try { window.scrollTo(0, 0); } catch (e) {} }}
              className={"text-[12.5px] font-semibold px-3 py-1.5 rounded-lg whitespace-nowrap transition-colors " + (view === t.k ? "bg-slate-800 text-white" : "bg-white border border-slate-200 text-slate-600 hover:border-cyan-300")}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      <main className="max-w-[940px] mx-auto px-4 py-6">
        {cur ? <ChapterView section={cur} />
          : view === "calc" ? <SalaryCalculator params={params} />
          : view === "quiz" ? <QuizView quiz={quiz} />
          : <div className="text-slate-400 text-sm py-10 text-center">Contenu en préparation…</div>}
        {!sections.length && cur === undefined && view !== "calc" && view !== "quiz" && (
          <div className="text-slate-400 text-sm py-10 text-center">Le cours est en cours de chargement…</div>
        )}
      </main>
      <footer className="max-w-[940px] mx-auto px-4 py-6 text-center text-xs text-slate-400">Outil pédagogique — valeurs {params.annee || "2024"}, à vérifier avec les barèmes officiels en vigueur.</footer>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<SocialApp />);

</script>
</body>
</html>
