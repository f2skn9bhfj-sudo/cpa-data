ues**.\",\n      \"example\": \"**Quality of earnings** — au cœur de la DD financière : on cherche à savoir si l'EBITDA affiché est **récurrent et soutenable**, ou gonflé par des éléments **non récurrents** (plus-values, reprises de provisions, produits exceptionnels). Un EBITDA « normatif » plus bas → VE plus basse → prix plus bas. C'est exactement là que se joue une partie de la négociation du bridge.\",\n      \"info\": \"**Conditions suspensives (CPs / Conditions Precedent)** — identifiées notamment par la DD juridique : tant qu'elles ne sont pas levées (ex. autorisation de l'Autorité de la concurrence, absence de clause de **changement de contrôle**), l'acquisition ne peut se réaliser. Elles figurent dans le **SPA (Share Purchase Agreement)**.\"\n    },\n    {\n      \"anchor\": \"s3-6\",\n      \"title\": \"6️⃣ Structuration juridique : du NDA au closing, SPA, GAP & concurrence\",\n      \"content\": \"L'opération est **structurée par une série de contrats** dont la forme varie selon la nature (actions vs actifs), le caractère coté ou non, et le mode (gré à gré vs enchères).\\n\\n**🗓️ Le déroulé d'un process d'enchères** :\\n\\n*Phase 1 — de l'Info Memo à la sélection* :\\n1. 📨 **Teaser** (approche informelle préalable)\\n2. ✍️ **NDA** (Non-Disclosure Agreement) signé par chaque acheteur potentiel + ses conseils\\n3. 📕 **Information Memorandum** (Info Memo) envoyé après réception du NDA\\n4. 📝 **Lettre d'offre indicative** (NBO — non-binding offer) : 1re estimation de VE, financement, calendrier, points de DD, conseils, CPs. **Non contraignante** → l'acheteur peut se retirer sans engager sa responsabilité.\\n5. ✅ **1re sélection** des acheteurs par le vendeur\\n\\n*Phase 2 — de la Data Room au finaliste* :\\n6. 📑 **Lettre de process** (dates Data Room, date butoir des offres fermes)\\n7. 🔏 **Lettres d'offre fermes (BO — binding offers)** + **mark-up du SPA** : engagent leur auteur (retrait uniquement avec motif justifié, sinon responsabilité pour **rupture abusive de pourparlers**). Contenu **bien plus précis** que la NBO (DD réalisées).\\n\\n*Phase 3 — de l'exclusivité au signing/closing* :\\n8. 🔐 **Lettre d'exclusivité** (Exclusivity Letter) au candidat retenu (≤ 3 mois en principe)\\n9. 🧾 **Négociation des clauses du SPA** (multiples réunions et mark-up) + DD complémentaires (Q&A)\\n10. ✒️ **Signing** du SPA — attention, si rupture : **break-up fees** possibles. Le signing **ne transfère pas** la propriété.\\n11. 🤝 **Closing** : transfert de propriété, après **levée de toutes les CPs**.\\n\\n**📜 Structure type d'un SPA** : parties · préambule (contexte) · périmètre de cession (nb d'actions, % capital, démembrement nue-propriété/usufruit) · **conditions suspensives (CPs)** · **clause de prix** (comptes de clôture OU locked box + éventuel earn-out).\\n\\n**🛡️ La Garantie d'Actif et de Passif (GAP / Reps & Warranties)** : indemnise l'acheteur de toute **perte d'actif ou passif nouveau** non révélé lors des DD. Le vendeur cherche à la **limiter** via 4 paramètres clés :\\n\\n| Clause | Définition |\\n|---|---|\\n| 🔹 **De minimis** (seuil unitaire) | Montant qu'une demande **individuelle** doit atteindre pour être prise en compte |\\n| 🪣 **Basket** (franchise) | Montant que doit atteindre le **cumul** des demandes (≥ de minimis) pour déclencher la GAP |\\n| 🧱 **Cap** (plafond) | Montant **maximum** d'indemnisation à la charge du vendeur |\\n| ⏱️ **Durée** | Durée de la garantie (souvent calée sur la **prescription fiscale** : exercice en cours + 3 précédents en droit français) |\\n\\n➕ **Compléments** : **specific indemnities** (indemnisation hors GAP pour un risque identifié, ex. schéma fiscal agressif) · **procédure de mise en œuvre** · **« garantie de la garantie »** (séquestre d'une partie du prix, ou **assurance** — pratique en plein essor) · **gestion de la période intercalaire** (autorisation préalable de l'acheteur pour les investissements significatifs entre signing et closing).\\n\\n**⚖️ Focus contrôle de la concurrence** : le droit de la concurrence contrôle les opérations porteuses de risque de **position dominante**. En France, **seuils de notification cumulatifs** à l'Autorité de la concurrence : CA mondial total HT des parties **> 150 M€** · CA HT en France réalisé par **au moins deux** des parties **> 50 M€** · l'opération **ne relève pas** de la Commission européenne. Délai d'examen : **25 jours ouvrés** (phase 1) → autorisation, autorisation sous engagements, ou examen approfondi de **65 jours ouvrés** (phase 2 : autorisation conditionnelle ou **interdiction**).\",\n      \"warning\": \"**Gun-jumping** ☠️ : réaliser l'opération **sans** notification (alors qu'elle entre dans le champ de l'Autorité) ou **avant** autorisation. Sanction en droit français : jusqu'à **5 % du CA HT réalisé en France** lors du dernier exercice clos, **majoré** du CA France de la cible. À anticiper absolument : le contrôle de concurrence peut retarder l'opération de plusieurs mois.\",\n      \"key_point\": \"**Signing ≠ Closing.** La signature du SPA cristallise l'accord mais **ne transfère pas** la propriété : celle-ci n'a lieu qu'au closing, **une fois toutes les CPs levées**. Entre les deux, la GAP, la clause de gestion raisonnable et la gestion de la période intercalaire protègent l'acheteur.\",\n      \"legal_quote\": \"**Seuils de notification (Autorité de la concurrence, France — cumulatifs)** : (1) CA total mondial HT de l'ensemble des parties **> 150 M€** ; (2) CA total HT en France réalisé par **au moins deux** des parties **> 50 M€** ; (3) l'opération **ne relève pas** de la compétence de la Commission européenne au titre du règlement sur le contrôle des concentrations.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Quelle est la formule fondamentale qui relie la valeur d'entreprise (VE) au prix des titres, et de quoi se compose le « bridge » ?\",\n      \"a\": \"**Valeur des capitaux propres = VE − Bridge.** Le **bridge** se décompose en deux grandes catégories : (1) la **dette financière nette retenue** (avec la problématique du BFR et la définition du cash) et (2) les **autres ajustements** (engagements retraites, intérêts minoritaires, engagements hors-bilan, autres provisions comme la dépollution, impôts différés…). Mémo **DBPM** : Dette, BFR, Provisions/retraites, Minoritaires. Chaque € concédé sur le bridge se répercute à 100 % sur le prix payé pour les actions.\"\n    },\n    {\n      \"q\": \"Pourquoi le BFR peut-il fausser la dette nette de clôture, et comment neutraliser ce biais ?\",\n      \"a\": \"Un BFR **anormalement faible** en fin d'année consomme **moins** de cash que la normale → il **minore** mécaniquement la dette nette constatée (et gonfle le prix des titres). Un BFR **anormalement élevé** fait l'inverse. Pour neutraliser ce biais saisonnier, les parties peuvent retenir un **BFR normatif** (normalisé) ou un **BFR moyen** de l'année (souvent retenu), ignorer le sujet d'un commun accord, ou prévoir un **ajustement automatique post-closing** sur états confirmatoires.\"\n    },\n    {\n      \"q\": \"Reconstituez la valeur des capitaux propres à partir d'une VE de 650 M€, d'une dette nette retenue de 335 M€ et de 80 M€ d'autres ajustements.\",\n      \"a\": \"**Bridge = 335 + 80 = 415 M€.** Donc **Valeur des capitaux propres = 650 − 415 = 235 M€.** Détail des 80 M€ d'autres ajustements dans l'exemple du cours : intérêts minoritaires 20 + dépollution de sols 10 + engagements retraites 50. Et la dette nette retenue de 335 part d'une dette nette comptable de 285, majorée de 20 (décote 50 % sur cash bloqué d'une filiale étrangère) et de 30 (ajustement BFR vs BFR normatif).\"\n    },\n    {\n      \"q\": \"Quelle est la différence entre la formule « Locked Box » et la formule « Comptes de clôture » ? Où chacune domine-t-elle géographiquement ?\",\n      \"a\": \"**Locked Box** : le prix est **gelé** dans une « boîte fermée » au signing, avec des ajustements ultérieurs très limités (souvent juste le « prix du temps »). **Comptes de clôture (completion accounts)** : le prix est calculé sur des **comptes à une date de référence** (avant ou au closing), généralement **audités**, et peut être **substantiellement ajusté**. Tendances : la **locked box gagne du terrain en Europe**, les **comptes de clôture sont quasi systématiques aux USA**. Pour une OPA sur titres cotés, la locked box s'impose presque (on ne peut pas réviser le prix au gré de comptes de clôture).\"\n    },\n    {\n      \"q\": \"Quels sont les principaux motifs d'un délai entre signing et closing, et quelles clauses protègent l'acheteur pendant cette période ?\",\n      \"a\": \"Motifs **externes** : autorisations de **concurrence** (raison n°1), autres autorisations réglementaires (investissements étrangers, secteurs sensibles), assemblées générales, financement non sécurisé, évolution des cours de bourse, changement macro/politique (clause MAC). Motifs **internes** : besoin de comptes plus récents, droit social (loi Hamon), risque de modification de l'exploitation. Protections : **clause de gestion raisonnable** (le vendeur gère prudemment jusqu'au closing), **MAC clause**, et **gestion de la période intercalaire** dans le SPA (autorisation préalable des investissements significatifs).\"\n    },\n    {\n      \"q\": \"Citez les types de due diligence et expliquez l'intérêt et les limites d'une Vendor Due Diligence (VDD).\",\n      \"a\": \"Types de DD : **stratégique/opérationnelle** (forces/faiblesses, synergies — Bain, Roland Berger…), **comptable & financière** (quality of earnings, bridge, dette nette, BFR — PwC, EY, Deloitte, Eight Advisory), **technique** (IT, RGPD), **ESG** (pollution, diversité, éthique…), **juridique & fiscale** (contrats, liasses, CPs). La **VDD** est préparée par les conseils du **vendeur** : elle fait gagner du temps, présente une info pré-formatée et aide le vendeur à anticiper les questions. **Limites** : un acquéreur avisé s'en méfie (conseil payé par le vendeur), demandera l'accès aux informations sous-jacentes ; un industriel du secteur peut s'en satisfaire, pas un fonds novice ; et aucune DD n'identifie **tous** les risques.\"\n    },\n    {\n      \"q\": \"Qu'est-ce que la GAP et quels sont ses quatre paramètres de limitation ? À quoi correspond le « gun-jumping » ?\",\n      \"a\": \"La **GAP (Garantie d'Actif et de Passif / Reps & Warranties)** indemnise l'acheteur de toute perte d'actif ou passif nouveau **non révélé** lors des DD. Le vendeur cherche à la limiter via : **de minimis** (seuil qu'une demande individuelle doit atteindre), **basket / franchise** (montant cumulé déclenchant la GAP), **cap / plafond** (indemnisation maximale du vendeur) et la **durée** (souvent calée sur la prescription fiscale : exercice en cours + 3 précédents en France). Le **gun-jumping** = réaliser l'opération sans notification à l'Autorité de la concurrence (alors qu'elle est requise) ou avant son autorisation ; sanction en France : jusqu'à **5 % du CA HT France** du dernier exercice, majoré du CA France de la cible.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Fusions-Acquisitions (M&A)\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (bridge VE→titres, composantes du bridge, délai signing/closing, locked box vs comptes de clôture, leviers & due diligences, structuration juridique/SPA/GAP/concurrence) + 7 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_2_iccf2_ma/semaine_4.json": "{\n  \"code\": \"ICCF2 M&A — Semaine 4\",\n  \"title\": \"🟥 Semaine 4 — Offres publiques & conclusion sur le M&A\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 2 (M&A)\",\n  \"ref_msa\": \"Cours ICCF2 — Fusions-Acquisitions (M&A)\",\n  \"bases_legales\": \"Règlement général AMF — offres publiques (France)\",\n  \"normes\": \"Cadre M&A coté (Vernimmen)\",\n  \"niveau\": \"Intermédiaire — M&A\",\n  \"summary\": \"Quand la cible est **cotée**, on ne peut plus négocier de gré à gré avec un vendeur identifié : il faut passer par une **offre publique**, sous le contrôle de l'**AMF**, en s'adressant à une foule d'actionnaires anonymes. Cette semaine couvre : la **définition** et les spécificités de l'offre publique, le **choix tactique** (amicale/hostile, volontaire/obligatoire, OPA/OPE/mixte, simplifiée/normale, OPRA, squeeze-out), les **règles juridiques** anti-prise-de-contrôle-rampante (déclarations de franchissement de seuils, **seuil des 30 %** déclenchant l'offre obligatoire, garantie de cours, *put up or shut up*), le **déroulé** (note d'information, visa AMF, calendrier, surenchère), les **défenses anti-OPA**, les **aspects financiers** (prime ≈ 30 %, prime ≤ synergies, comportement des cours), le **retrait obligatoire** (squeeze-out à 90 %), et enfin une **conclusion** sur le financement du M&A et la **PMI** (intégration post-acquisition).\",\n  \"mnemonics\": \"**Les seuils à graver — « 30 / 50 / 90 »** : 🔔 **30 %** → dépôt d'une **offre publique obligatoire** sur 100 % ; 🛑 **50 %** → seuil de **caducité** de l'offre obligatoire (loi Florange) ET seuil au-delà duquel l'offre devient **simplifiée** ; 🔒 **90 %** → **retrait obligatoire** (squeeze-out) des minoritaires. **Les 4 axes du choix tactique — « A-V-O-S »** : **A**micale/hostile · **V**olontaire/obligatoire · paiement (**O**PA cash / OPE titres / mixte) · **S**implifiée/normale. **Règle d'or de la prime** : *la prime ne doit jamais dépasser la valeur des synergies* — sinon le deal détruit de la valeur.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s4-1\",\n      \"title\": \"1️⃣ L'offre publique : définition & spécificités\",\n      \"content\": \"Sur une cible **non cotée**, on négocie avec un vendeur identifié, on signe une **garantie d'actif et de passif (GAP)**, bref un face-à-face. Mais dès que les titres sont **cotés**, tout change : les vendeurs potentiels sont **anonymes** et innombrables. Il faut donc passer par une **offre publique**.\\n\\n**📖 Définition** — l'offre publique consiste, de la part d'une personne appelée l'**initiateur** (*bidder*), agissant seule ou **de concert**, sous le contrôle de l'**autorité de marché**, à faire connaître **publiquement** aux actionnaires d'une société **cible** (*target*) qu'elle se porte acquéreur de leurs titres cotés (admis sur un marché réglementé type **Euronext Paris**, ou un système multilatéral organisé type **Euronext Growth**) à un prix déterminé, réglé :\\n\\n- 💵 soit en **espèces** → **OPA** (offre publique d'achat)\\n- 🔄 soit par remise d'**actions ou obligations** → **OPE** (offre publique d'échange)\\n\\n**🔑 Les spécificités qui découlent de cette définition** :\\n\\n| Spécificité | Conséquence pratique |\\n|---|---|\\n| 🕵️ **Anonymat** des actionnaires | Impossible d'identifier ni de négocier individuellement avec chaque vendeur |\\n| 🏛️ **Rôle central de l'AMF** | L'AMF édicte les règles, accorde le **visa**, contrôle et sanctionne |\\n| 🚫 **Pas de GAP** | Avec une multitude d'actionnaires anonymes, négocier une garantie d'actif/passif est impossible |\\n| 🤝 **Action de concert** | Si on agit de concert, tous sont tenus par les obligations de l'offre |\\n\\n**🤝 L'action de concert** = accord (écrit ou verbal) en vue d'acquérir, céder ou exercer des droits de vote, pour mettre en œuvre une **politique commune** vis-à-vis de la cible ou en obtenir le **contrôle**. Sont aussi réputées de concert les personnes ayant conclu un accord avec la cible **pour faire échouer** l'offre. En pratique, la preuve est difficile : elle s'établit par la méthode du **« faisceau d'indices »** (parallélisme de comportements de plusieurs investisseurs).\",\n      \"key_point\": \"**La cotation change tout.** Sur du coté, le vendeur n'est pas une personne mais une **foule anonyme**. D'où : pas de négociation individuelle, pas de GAP, et un **gendarme** (l'AMF) qui encadre tout. C'est ce qui justifie l'existence d'un régime juridique spécifique des offres publiques.\",\n      \"info\": \"**L'AMF (Autorité des Marchés Financiers)** est une autorité publique indépendante dotée de la personnalité morale. Sa mission : protéger l'**épargne** investie en instruments financiers, garantir l'**information** des investisseurs et le **bon fonctionnement** des marchés. Pour cela elle édicte des règles, accorde des autorisations (notamment le **visa** sur la note d'information), contrôle les intervenants et **sanctionne** les manquements.\",\n      \"tip\": \"**OPA vs OPE — moyen de paiement** : **OP-A**chat = **A**rgent (cash) ; **OP-É**change = **É**change de titres. L'offre **mixte** combine les deux (ex. « 8 actions pour 10 + 20 € par action »).\"\n    },\n    {\n      \"anchor\": \"s4-2\",\n      \"title\": \"2️⃣ Le choix tactique : amicale/hostile, OPA/OPE, simplifiée/normale\",\n      \"content\": \"Avant de lancer son offre, l'initiateur doit choisir sa **physionomie** parmi plusieurs axes, car chaque choix détermine les règles applicables.\\n\\n**🟢 Amicale vs 🔴 hostile** — l'offre est **amicale** si elle est **recommandée** par les organes de direction de la cible, **hostile** en cas de recommandation inverse (ne pas apporter ses titres). La nature peut **changer** en cours de route : aux États-Unis, il n'est pas rare qu'une offre démarre hostile puis devienne amicale après que l'initiateur a **relevé son prix**.\\n\\n| Critère | 🟢 Amicale | 🔴 Hostile |\\n|---|---|---|\\n| Préparation | Plusieurs mois | Plus rapide |\\n| Période d'offre (réglementation) | — | Plus longue |\\n| Post Merger Integration | Souvent plus longue | Peut être rapide |\\n| Prime payée | — | Souvent plus forte |\\n| Interférence de tiers | Peu probable | Plus probable |\\n| Acceptabilité | « Politiquement correct » | « Politiquement incorrect » |\\n| Culture | Souvent mix (consensus) | L'acheteur est dominant |\\n\\n**Les autres axes du choix tactique** :\\n\\n- ⚖️ **Volontaire vs obligatoire** : volontaire = l'initiateur lance librement ; obligatoire = déclenchée par le **franchissement d'un seuil** (cf. section 3).\\n- 💵🔄 **OPA / OPE / mixte** : selon qu'on propose espèces, titres, ou les deux.\\n- 📊 **Simplifiée vs normale** : si l'initiateur détient déjà **plus de 50 %** du capital et des droits de vote **avant** l'offre → offre **simplifiée** ; sinon → offre **normale**.\\n\\n**🔧 Types d'offre liés à des situations particulières** (qui ne relèvent pas à proprement parler du M&A) :\\n- **OPRA** (offre publique de rachat d'actions) : dans le cadre d'une **réduction de capital** de la cible.\\n- **OPRO / squeeze-out** (offre publique de retrait obligatoire) : permet à un actionnaire détenant **plus de 90 %** du capital et des droits de vote d'**obliger les minoritaires** à lui céder leurs titres.\",\n      \"comparison\": \"**🟢 Amicale = mariage négocié** : longue préparation, consensus culturel, intégration soignée, peu d'interférence. **🔴 Hostile = passage en force** : exécution rapide, prime souvent plus forte (il faut convaincre malgré la direction), risque d'un tiers qui s'invite, acheteur dominant. Mais rien n'est figé : une offre hostile bien revalorisée peut « passer amicale ».\",\n      \"tip\": \"**Simplifiée vs normale, le repère = 50 %.** Si l'initiateur contrôle déjà la majorité (> 50 %) avant de lancer, l'offre est **simplifiée** (procédure allégée, calendrier raccourci) — il ne s'agit plus de prendre le contrôle, juste de ramasser le solde.\"\n    },\n    {\n      \"anchor\": \"s4-3\",\n      \"title\": \"3️⃣ Aspects juridiques : montée au capital, seuils & offre obligatoire (AMF)\",\n      \"content\": \"Avant même toute offre, **monter au capital** d'une cotée est encadré pour empêcher les **prises de contrôle rampantes** (prendre le contrôle en douce sans que le marché soit informé).\\n\\n**📣 Obligation de transparence** — toute société cotée doit tenir un **document d'enregistrement universel** et révéler **toute information** susceptible d'influencer son cours (ex. une offre en préparation). Dérogation possible (différer une information) si la confidentialité est assurée et que le public n'est pas induit en erreur. L'information doit être **exacte, précise, sincère** et **la même pour tous** (égalité de traitement).\\n\\n**📋 Déclaration de franchissement de seuils** — en franchissant certains seuils en capital **ou** en droits de vote, l'investisseur doit déclarer dans un **délai de 4 jours de bourse**.\\n\\n| Type de seuils | Valeurs |\\n|---|---|\\n| 📊 **Seuils légaux** | 5 % · 10 % · 15 % · 20 % · 25 % · **30 %** · 1/3 · 50 % · 2/3 · 90 % · 95 % |\\n| 📝 **Seuils statutaires** | de 0,5 % à 5 % (prévus par les statuts de la société) |\\n| 🗣️ **Déclaration d'intention** | aux seuils 10/15/20/25 % : déclarer ses **objectifs** pour les 6 prochains mois |\\n\\n**🔔 LA règle centrale — l'offre publique OBLIGATOIRE (seuil des 30 %)** :\\n\\nL'actionnaire doit **déposer une offre obligatoire sur 100 %** du capital et des droits de vote dans deux cas :\\n1. **Franchissement du seuil de 30 %** du capital ou des droits de vote ; ou\\n2. Détention **entre 30 % et 50 %** + augmentation de la participation de **plus de 1 %** sur **12 mois consécutifs** (« vitesse » d'acquisition).\\n\\nSauf **dispense** (ex. relution passive consécutive à un rachat par la société de ses propres actions).\\n\\n**🔧 Autres garde-fous** :\\n- **« Put up or shut up »** : si des rumeurs affectent le cours, l'AMF peut sommer toute personne soupçonnée de préparer une offre de **révéler ses intentions** (qui l'engagent **6 mois**).\\n- **Pactes d'actionnaires** : toute clause de conditions préférentielles de cession/acquisition portant sur ≥ **0,5 %** doit être transmise à la société **et** à l'AMF.\\n\\n**⚠️ Sanctions** : défaut de déclaration de seuil → **privation des droits de vote** des actions au-delà du seuil non déclaré ; défaut de transmission d'une clause de pacte → **suspension** de cette clause en période d'offre.\",\n      \"warning\": \"**On ne « ramasse » pas une cotée en bourse.** À cause de l'empilement des déclarations de seuils **et** de l'obligation de déposer une offre dès **30 %**, il est irréaliste de prendre le contrôle d'une société cotée à capital dispersé par simple ramassage en bourse. Dans ce cas, **le lancement d'une offre publique s'impose**.\",\n      \"key_point\": \"**Le seuil des 30 % est le point de bascule.** En dessous : montée libre (mais déclarée). À 30 % (ou en accélérant entre 30 et 50 %) : **dépôt obligatoire** d'une offre sur 100 %, au moins au prix le plus élevé payé sur 12 mois. C'est le mécanisme qui protège les minoritaires : on ne prend pas le contrôle sans leur offrir une sortie.\"\n    },\n    {\n      \"anchor\": \"s4-4\",\n      \"title\": \"4️⃣ Lancement, déroulé & défenses anti-OPA\",\n      \"content\": \"**📄 Étape 1 — Projet de note d'information** : préparé par l'initiateur, il contient les **caractéristiques** de l'offre (OPA/OPE, volontaire/obligatoire…), la **stratégie et les intentions** envers la cible, la **justification du prix** et les **conditions de financement**.\\n\\n**✅ Étape 2 — Visa de l'AMF & note en réponse** : l'AMF examine le projet et, si elle décide d'autoriser, remet une **déclaration de conformité valant visa**. La note doit être publiée sur les sites de l'initiateur et de l'AMF. La **cible** prépare une **note en réponse**, publiée au plus tard la **veille de l'ouverture** (en cas d'offre amicale, une **note conjointe** est possible).\\n\\n**⏱️ Étape 3 — Déroulé** (calendrier strict, en principe **10 à 25 jours de bourse**) :\\n- Les actionnaires **attendent souvent la fin** pour décider (contre-offres / surenchères possibles).\\n- **Surenchère** : une contre-offre doit relever d'au moins **+2 %** et être déposée au plus tard **5 jours de bourse** avant la clôture de l'offre initiale.\\n- **Prix identique pour tous** (égalité de traitement).\\n- Offre sur **100 %** du capital non détenu, en principe **irrévocable** → d'où la nécessité d'un **financement sécurisé par garantie bancaire**.\\n\\n**🎯 Seuils de succès / caducité** :\\n\\n| Type d'offre | Règle |\\n|---|---|\\n| **Volontaire** | Peut prévoir un **seuil de succès** jusqu'à **2/3** (sinon caduque) + conditions suspensives (ex. feu vert concurrence) |\\n| **Obligatoire** | Depuis la **loi Florange (29/03/2014)** : seuil de **caducité de 50 %** (restitution des titres apportés si non atteint). Prix ≥ prix le plus élevé payé par l'initiateur sur les **12 mois** précédents |\\n\\n👥 L'initiateur doit transmettre la note à son **CSE** et à celui de la cible ; le CSE de la cible peut l'obliger à venir présenter l'offre et ses **répercussions sur l'emploi** (l'avis ne lie pas l'initiateur, mais la communication sociale peut servir de **défense anti-OPA**).\\n\\n**🛡️ Les défenses anti-OPA** — depuis la loi Florange, le conseil d'administration de la cible peut prendre toute décision susceptible de faire échouer l'offre, **sauf** ce qui relève de l'AG (ex. augmentation de capital nécessitant une modification des statuts, sauf délégation préalable de l'AG), et dans la limite de l'**intérêt social**.\\n\\n| 🧊 Défenses « à froid » (préventives) | 🔥 Défenses « à chaud » (en période d'offre) |\\n|---|---|\\n| Délégation à l'AG pour augmenter le capital ; modification des statuts pour **plafonner les droits de vote** d'un seul actionnaire | **Chevalier blanc** (offre concurrente amicale) ; défense **Pacman** (la cible lance une offre sur l'initiateur) ; vente / **sanctuarisation** d'actifs stratégiques (ex. Suez 2020, fondation de droit néerlandais pour l'eau, face à Veolia) |\\n\\n⚖️ Une défense **trop agressive** peut engager la **responsabilité des dirigeants** (contrariété avec l'intérêt social), comme soulevé par Veolia contre Suez en 2020. Et les recours en justice ne sont souvent que des **manœuvres dilatoires**.\",\n      \"example\": \"**Veolia / Suez (2020)** — face à l'offre de Veolia, les dirigeants de Suez ont envisagé de **sanctuariser** leurs activités françaises dans l'eau au sein d'une **fondation de droit néerlandais**, soulevant la question de la conformité à l'**intérêt social** de Suez. Veolia a invoqué l'**engagement de la responsabilité des dirigeants**. Illustration parfaite des limites des défenses « à chaud ».\",\n      \"key_point\": \"**La meilleure défense anti-OPA = une bonne gestion.** L'histoire montre que les mécanismes de défense ne sont pas spectaculairement efficaces : face à une offre solide et à un prix attractif, **ce sont les actionnaires de la cible qui décident, pas les dirigeants**. Une bonne gestion soutient le cours et réduit le risque d'offre hostile.\"\n    },\n    {\n      \"anchor\": \"s4-5\",\n      \"title\": \"5️⃣ Aspects financiers : OPA/OPE, primes, synergies & cours de bourse\",\n      \"content\": \"**💵 OPA vs 🔄 OPE — deux esprits opposés** :\\n- L'offre en **cash** apporte du **confort** : les actionnaires de la cible **sortent** → esprit d'une **acquisition**.\\n- L'offre en **titres** les embarque dans un **projet commun** (ils deviennent actionnaires du nouvel ensemble) → esprit d'une **fusion**.\\n\\n| Implication | 💵 Offre CASH | 🔄 Offre TITRES |\\n|---|---|---|\\n| Projet & synergies | N/A pour le vendeur (il sort) | **Clé** pour les deux parties |\\n| Psychologie | Crédibilité / certitude | Nouveau projet (clé pour les *jumbo deals*) |\\n| Capi boursière combinée | Inchangée | Augmentée |\\n| Structure financière | **Hausse du levier** de l'acheteur | Dépend de la structure du deal |\\n| Actionnariat | RAS pour l'initiateur | Fusion & poids des **collèges** |\\n| BPA | Relution / dilution | Relution / dilution |\\n| PER | Combinaison des PER | Combinaison des PER |\\n| Impact cours | Hausse du cours cible (prime) | Lien **permanent** entre les deux cours |\\n\\n💡 Dans les **jumbo deals**, les opérations sont le plus souvent en **titres** : l'acquéreur ne peut pas s'endetter massivement. *Rappels relution : (1) cash → relution si 1/PER cible (prime incluse) > coût net après impôt de la dette ; (2) titres → relution si PER acquéreur > PER cible (prime incluse) ; (3) PER post-deal = moyenne pondérée des deux PER.*\\n\\n**🤝 Les leviers de la négociation** :\\n- **Prix / parité** : pas de Valeur d'Entreprise intermédiaire, l'offre est directement en **prix des titres** (OPA = € par action ; OPE = **parité**, ex. « 1 for 1 »). Un **conseil indépendant** peut produire une **attestation d'équité** (*fairness opinion*).\\n- **Poids des collèges d'actionnaires** : le « poids » de chaque groupe initial dans le capital élargi (uniquement OPE/mixte). Dans les **fusions entre égaux**, on vise souvent **50/50**, quitte à verser un **dividende exceptionnel** pour égaliser les valeurs.\\n- **Le sens de la fusion** : qui lance l'offre sur qui ? Financièrement **indifférent** (ex. PSA/FCA), mais dicté par des raisons **fiscales/juridiques** ou **psychologiques** (signal de pouvoir).\\n\\n**🎁 La prime** — écart entre le prix offert et le cours **avant annonce**. Calculée sur le **spot** (veille), ou en **moyenne 1 mois / 3 mois** (les 3 figurent dans les prospectus). En Europe, **≈ 30 %** en moyenne (sur le spot). Rien ne la justifie financièrement — on **paie plus que la valeur** pour assurer le succès.\\n\\n**⭐ RÈGLE D'OR** : *la prime doit être **au plus égale** à la valeur des synergies du rapprochement.*\\n\\n**📈 Comportement des cours** :\\n- **Cours de l'initiateur** : monte si commentaires favorables, baisse si défavorables (doutes industriels, synergies jugées insuffisantes ou irréalistes vs prime).\\n- **Cours de la cible (OPA)** : 🟢 monte **juste en dessous** du prix (légère décote = prix de l'incertitude) = bon signe ; 🔴 **dépasse** le prix = le marché juge le prix insuffisant et anticipe relèvement ou contre-offre.\\n- **Cours de la cible (OPE)** : lié à celui de l'initiateur par la **parité** — même raisonnement, le cas idéal étant un cours juste **sous** la parité théorique.\",\n      \"example\": \"**Prime vs synergies (chiffré)** — synergies après impôts : 0 (an 1), 8 (an 2), 14 (an 3), puis 22 M€/an à perpétuité. Valeur actualisée à 8 % (WACC) : 0 + 8/1,08² + 14/1,08³ + (22/8 %)/1,08³ ≈ **236 M€**. Or la cible cote 30 € (30 M titres) et l'initiateur offre 45 €/action → prime = (45 − 30) × 30 M = **450 M€**. 450 > 236 : **deal financièrement inacceptable** ! Sanction prévisible si l'initiateur est coté : **baisse de son cours** dès l'annonce.\\n\\n**OPE — lecture du cours (chiffré)** — initiateur 100 €, cible 300 € avant annonce, parité **4 pour 1** (prime de 33 %, soit 4 × 100 = 400 vs 300). Si la cible cote **390 €** post-annonce : 🟢 bon signe (juste sous la parité théorique de 400 €). Si elle cote **420 €** : 🔴 mauvais signe — le marché anticipe une parité plus favorable ou une contre-offre. Les deux cours doivent être surveillés **en permanence** jusqu'au terme.\",\n      \"tip\": \"**Décote = bon signe, prime sur le prix = mauvais signe.** Une cible qui s'installe **juste sous** le prix d'offre (ou la parité) signale que le marché **croit** au succès. Une cible **au-dessus** crie « le prix est trop bas, ça va surenchérir ».\"\n    },\n    {\n      \"anchor\": \"s4-6\",\n      \"title\": \"6️⃣ Conclusion : financer le M&A & réussir l'intégration (PMI)\",\n      \"content\": \"**💰 Les deux règles d'or du financement** :\\n\\n1. **Séparer le financement de la décision d'investissement** — on ne fait pas un deal *parce qu'*on a trouvé un financement bon marché ; on décide **d'abord** de faire l'opération, **puis** on réfléchit à son financement.\\n2. **Sécuriser le financement** — pour un vendeur, un « bon prix » ne vaut rien si l'acheteur **n'est pas financé**. La **sécurité** de la transaction est aussi importante que le prix. Participer à un process de vente sans financement sécurisé, *c'est perdre à tous les coups* (en France, **garantie bancaire** obligatoire pour les offres publiques).\\n\\n**🏦 La palette de financement** (rien de spécifique au M&A — c'est du financement d'investissement classique) :\\n\\n| Bloc | Exemples |\\n|---|---|\\n| 🪙 **Capitaux propres / quasi-FP** | Augmentation de capital, equity-linked (convertibles) |\\n| 🏢 **Corporate classique** | Crédit bancaire, emprunts obligataires |\\n| 🔧 **Financements d'acquisition / structurés** (souvent **sans recours**) | Financements d'acquisition corporate, **financements LBO** |\\n\\nDeux techniques spécifiques : le **bridge loan** (prêt-relais ~1 an, pour payer vite et refinancer ensuite) et le **vendor loan** (crédit-vendeur). Les DAF regardent surtout la **structure combinée pro forma** (dette nette / EBITDA) et l'**impact sur le BPA**.\\n\\n**🧩 La PMI (Post Merger Integration) — un sujet vital** :\\n\\nPas un enjeu pour le Private Equity (LBO autonomes, durée de vie courte), mais **central** pour les **acheteurs industriels** : détention sans limite, volonté d'**intégration complète**, besoin de **tracer les synergies** promises au marché. Or les statistiques suggèrent que **plus de la moitié** des opérations n'ont pas été des « succès » — l'échec est plus fréquent qu'on ne le dit, mais discret et difficile à mesurer. Les processus d'intégration restent encore **artisanaux et empiriques**.\\n\\n**⚠️ Les grands risques post-acquisition que la PMI cherche à prévenir** :\\n- 💸 **Acquisition plus coûteuse que prévu** (compléments de prix, capex plus lourds, restructurations mal calibrées)\\n- 📑 **Conséquences de la GAP** (mauvaises surprises actif/passif insuffisamment couvertes)\\n- ⚖️ **Risques mal évalués** (juridiques, fiscaux, litiges, ESG, politique) → ex. **Bayer/Monsanto**, **Holcim/Lafarge**\\n- 📉 **Performances décevantes** (sous-performance, business plan trop optimiste)\\n- 👥 **Intégration humaine imparfaite** (ressentiment des équipes, « chapelles » internes, bonnes pratiques non diffusées)\\n- 🔗 **Difficulté à générer les synergies promises**\",\n      \"key_point\": \"**Le prix n'est qu'une partie de l'histoire.** Le M&A réussit (ou échoue) après le closing : un financement sécurisé, puis une **PMI** maîtrisée font la différence entre une acquisition créatrice de valeur et un deal qui figure parmi la **moitié** d'opérations ratées. La discipline PMI devrait se professionnaliser dans les années à venir.\",\n      \"info\": \"**Bridge loan vs vendor loan** — le **bridge** (prêt-relais bancaire ~1 an) permet de **payer immédiatement** l'acquisition et de prendre le temps de la refinancer proprement. Le **vendor loan** (crédit-vendeur) consiste à faire financer une partie du prix par le vendeur lui-même : levier de négociation déjà vu en semaine 3.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Pourquoi ne peut-on pas négocier une cible cotée comme on négocie une cible non cotée ?\",\n      \"a\": \"Parce que les actionnaires d'une cotée sont **anonymes** et **innombrables** : impossible de les identifier ou de négocier individuellement avec eux. On ne peut donc pas signer de **garantie d'actif et de passif (GAP)**. Il faut passer par une **offre publique**, encadrée par l'**AMF**, qui s'adresse publiquement à tous les actionnaires au **même prix**. L'AMF accorde le **visa**, contrôle et sanctionne.\"\n    },\n    {\n      \"q\": \"Quels sont les axes du choix tactique d'une offre publique ?\",\n      \"a\": \"Quatre axes : (1) **Amicale vs hostile** (recommandée ou non par la direction de la cible) ; (2) **Volontaire vs obligatoire** (déclenchée par un franchissement de seuil) ; (3) **Moyen de paiement** : **OPA** (cash), **OPE** (titres) ou **mixte** ; (4) **Simplifiée vs normale** (simplifiée si l'initiateur détient déjà > 50 % avant l'offre). Cas particuliers hors M&A : **OPRA** (rachat dans une réduction de capital) et **OPRO / squeeze-out** (retrait obligatoire à > 90 %).\"\n    },\n    {\n      \"q\": \"Que se passe-t-il au franchissement du seuil de 30 % ? Et quels sont les autres seuils clés ?\",\n      \"a\": \"Au franchissement de **30 %** du capital ou des droits de vote (ou entre 30 et 50 % avec une hausse > 1 % sur 12 mois consécutifs), l'actionnaire doit **déposer une offre publique obligatoire sur 100 %**, au prix ≥ au plus haut payé sur les 12 derniers mois (sauf dispense). Autres seuils : **50 %** = caducité de l'offre obligatoire (loi Florange) et bascule en offre simplifiée ; **90 %** = retrait obligatoire (squeeze-out). Les franchissements (5/10/15/20/25/30 %, 1/3, 50 %, 2/3, 90/95 %) se déclarent sous **4 jours de bourse**.\"\n    },\n    {\n      \"q\": \"Quelle est la règle d'or reliant prime et synergies ? Illustrez par les chiffres du cours.\",\n      \"a\": \"**La prime doit être au plus égale à la valeur des synergies du rapprochement.** Exemple : synergies actualisées à 8 % ≈ **236 M€** ; or une cible à 30 € (30 M titres) achetée à 45 € donne une prime de (45−30)×30 = **450 M€**. 450 > 236 → le deal **détruit de la valeur** et le cours de l'initiateur (s'il est coté) **baissera** à l'annonce. En Europe, la prime moyenne sur le spot tourne autour de **30 %**.\"\n    },\n    {\n      \"q\": \"Comment lire le cours de bourse de la cible pendant une offre ?\",\n      \"a\": \"**Bon signe** : le cours monte et s'installe **juste en dessous** du prix offert (OPA) ou de la parité théorique (OPE) — la légère décote reflète le **prix de l'incertitude** sur le succès, le marché croit l'offre crédible. **Mauvais signe** : le cours **dépasse** le prix / la parité — le marché juge le prix **insuffisant** et anticipe un relèvement ou une **contre-offre**. En OPE, les cours initiateur/cible sont liés par la parité et doivent être surveillés en permanence.\"\n    },\n    {\n      \"q\": \"Quelles sont les principales défenses anti-OPA, et laquelle est la plus efficace ?\",\n      \"a\": \"**« À froid »** (préventives) : délégation à l'AG pour augmenter le capital, plafonnement statutaire des droits de vote. **« À chaud »** (en période d'offre) : **chevalier blanc** (offre concurrente amicale), défense **Pacman** (la cible attaque l'initiateur), vente ou **sanctuarisation** d'actifs (ex. Suez/Veolia 2020). Mais elles sont peu efficaces et peuvent engager la **responsabilité des dirigeants**. **La meilleure défense reste une bonne gestion** : elle soutient le cours et réduit le risque d'offre hostile — au final ce sont les **actionnaires** qui décident.\"\n    },\n    {\n      \"q\": \"Quelles sont les deux règles d'or du financement du M&A et pourquoi la PMI est-elle cruciale ?\",\n      \"a\": \"**Règle 1** : séparer le financement de la décision d'investissement (on décide d'abord du deal, le financement vient après). **Règle 2** : sécuriser le financement (pour le vendeur, la **sécurité** vaut autant que le prix ; en France, **garantie bancaire** obligatoire). La **PMI (Post Merger Integration)** est cruciale car **plus de la moitié** des opérations ne sont pas des succès : elle prévient les risques post-acquisition (surcoûts, surprises de la GAP, risques mal évalués type Bayer/Monsanto ou Holcim/Lafarge, sous-performance, résistances culturelles, synergies non délivrées).\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Fusions-Acquisitions (M&A)\",\n    \"Règlement général de l'AMF\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (définition & spécificités, choix tactique, aspects juridiques/seuils AMF, déroulé & défenses anti-OPA, aspects financiers/primes/cours, conclusion financement & PMI) + 7 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_3_iccf2_capital/_sommaire.md": "# Sommaire — ICCF2 Cours 3 : Capital & Ingénierie Financière\n\n🎓 **HEC Paris — ICCF2 · Capital et Ingénierie Financière**\n📅 Synthèse complète du Cours 3 — 4 semaines en un coup d'œil\n\n---\n\n## 🗺️ Ce que tu vas trouver\n\n- 🟦 **SEMAINE 1** — Gérer le capital : actionnariat, distribution & levée de fonds\n- 🟩 **SEMAINE 2** — Private Equity & LBO\n- 🟧 **SEMAINE 3** — L'introduction en bourse (IPO)\n- 🟥 **SEMAINE 4** — Optimiser la structure de son groupe\n\nÀ chaque section : concepts-clés, exemples réels (LVMH, Apple, B&B Hotels, Elis, Porsche/VW…), tableaux, calculs et astuces mnémotechniques.\n\n---\n\n## 🟦 [SEMAINE 1 — Gérer le capital : structure, distribution & levée de fonds](semaine_1.json)\n\nConnaître ses actionnaires et les **pactes** qui déconnectent pouvoir et capital, choisir sa politique de **distribution** (dividendes, rachats d'actions), et **lever des fonds** via l'augmentation de capital (DPS, dilution).\n\n- [1️⃣ Connaître ses actionnaires : qui détient le capital ?](semaine_1.json#s1-1)\n- [2️⃣ Pactes d'actionnaires & contrôle](semaine_1.json#s1-2)\n- [3️⃣ Distribuer aux actionnaires : pourquoi et combien ?](semaine_1.json#s1-3)\n- [4️⃣ Le rachat d'actions (buyback)](semaine_1.json#s1-4)\n- [5️⃣ Lever des fonds : l'augmentation de capital](semaine_1.json#s1-5)\n- [6️⃣ Le DPS : l'arme anti-échec de l'augmentation cotée](semaine_1.json#s1-6)\n\n---\n\n## 🟩 [SEMAINE 2 — Private Equity & LBO](semaine_2.json)\n\nLe monde des fonds d'investissement : leur **typologie** (venture, growth, LBO), le mécanisme du **LBO** (effet de levier, holding, dette d'acquisition), le cycle de création de valeur et la sortie, l'**industrie** (GP/LP, carried interest, J-curve) et le management package.\n\n- [1️⃣ Typologie & positionnement des fonds d'investissement](semaine_2.json#s2-1)\n- [2️⃣ Qu'est-ce qu'un LBO ? Montage & effet de levier](semaine_2.json#s2-2)\n- [3️⃣ Le cycle du LBO : optimisation puis sortie](semaine_2.json#s2-3)\n- [4️⃣ Les cibles & la dette d'acquisition](semaine_2.json#s2-4)\n- [5️⃣ L'industrie PE : GP, LP, carried interest & J-curve](semaine_2.json#s2-5)\n- [6️⃣ Le management package : aligner les dirigeants](semaine_2.json#s2-6)\n\n---\n\n## 🟧 [SEMAINE 3 — L'introduction en bourse (IPO)](semaine_3.json)\n\nPourquoi et comment introduire une société en bourse : les choix préalables (bon candidat, marché de cotation, formes d'IPO), le calendrier et l'origination, la documentation **AMF** et le pre-marketing, puis le déroulement (road-show, **book-building**, fixation du prix, allocations, stabilisation).\n\n- [1️⃣ Pourquoi aller en bourse & être un bon candidat](semaine_3.json#s3-1)\n- [2️⃣ Choix du marché de cotation & formes d'IPO](semaine_3.json#s3-2)\n- [3️⃣ Calendrier-type, origination & préparation](semaine_3.json#s3-3)\n- [4️⃣ Documentation / AMF & pre-marketing (analystes)](semaine_3.json#s3-4)\n- [5️⃣ Déroulement : road-show, book-building, prix & allocations](semaine_3.json#s3-5)\n- [6️⃣ Première cotation, stabilisation, IPO alternatives & conclusion](semaine_3.json#s3-6)\n\n---\n\n## 🟥 [SEMAINE 4 — Optimiser la structure de son groupe](semaine_4.json)\n\nL'ingénierie financière au niveau du groupe : pourquoi optimiser (décote de holding, fiscalité), les techniques (**equity carve-out**, sortie de bourse, **spin-off** / scission), et la gestion de l'**organigramme financier** (remontée de cash, intégration fiscale, alignement avec l'organisation opérationnelle).\n\n- [1️⃣ Pourquoi optimiser ? Contexte & motivations](semaine_4.json#s4-1)\n- [2️⃣ Ouvrir le capital d'une filiale (equity carve-out)](semaine_4.json#s4-2)\n- [3️⃣ Sortir de la bourse (squeeze-out / OPR-RO)](semaine_4.json#s4-3)\n- [4️⃣ Scinder une activité : le spin-off (demerger)](semaine_4.json#s4-4)\n- [5️⃣ Gérer l'organigramme : leviers, contraintes & cash](semaine_4.json#s4-5)\n- [6️⃣ Aligner organigramme juridique & organisation opérationnelle ?](semaine_4.json#s4-6)\n\n---\n\n*Synthèse du Cours 3 ICCF2 — HEC Paris. Même mise en forme que les fiches Audit (callouts colorés, mnémoniques, auto-test). 4 fiches complètes.*\n\n*Statut : ✅ **COMPLET — 4 / 4 fiches**.*\n", "cours_3_iccf2_capital/semaine_1.json": "{\n  \"code\": \"ICCF2 Capital — Semaine 1\",\n  \"title\": \"🟦 Semaine 1 — Gérer le capital : structure, distribution & levée de fonds\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 3 (Capital & Ingénierie financière)\",\n  \"ref_msa\": \"Cours ICCF2 — Capital et Ingénierie Financière\",\n  \"bases_legales\": \"Droit des sociétés (actions de préférence, DVD, SCA), pactes d'actionnaires, réglementation AMF (DPS, OPRA, prospectus)\",\n  \"normes\": \"Finance d'entreprise (Vernimmen)\",\n  \"niveau\": \"Intermédiaire — finance d'entreprise\",\n  \"summary\": \"Tout part des **actionnaires** : ce sont eux qui définissent la stratégie et valident les grands choix de politique financière. Cette semaine pose donc deux questions de fond. D'abord **qui sont-ils** et comment **conforter le contrôle** du capital — familles, fonds, institutionnels, particuliers… puis les outils juridiques (pactes d'actionnaires, actions sans/à droits de vote multiples, commandite, structures en cascade) qui permettent de **déconnecter le pouvoir de l'intérêt capitalistique**. Ensuite, les **flux d'argent** dans les deux sens : **distribuer** (dividende ordinaire, dividende exceptionnel, rachat d'actions / buyback) et **lever** des fonds (augmentation de capital, mécanisme du **DPS**, dilution). Idée maîtresse à graver : en théorie financière, **rendre de l'argent à l'actionnaire ne l'enrichit pas** (transfert de liquidités), et le **DPS est neutre** pour tous.\",\n  \"mnemonics\": \"**Les 3 façons de RENDRE de l'argent — D-D-R** : **D**ividende ordinaire, **D**ividende exceptionnel, **R**achat d'actions (buyback). · **Tout € distribué** → dette nette ⬆️ + capitaux propres ⬇️ (vrai pour dividende ET rachat). · **DPS = neutralité totale** : « décote apparente, pas réelle » — le droit compense exactement la décote. **TERP = Cours – valeur du DPS**. · **Contrôle sans capital — les 4 leviers** : actions sans droit de vote · droits de vote multiples (DVD) · commandite (SCA) · cascade de holdings.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s1-1\",\n      \"title\": \"1️⃣ Connaître ses actionnaires : qui détient le capital ?\",\n      \"content\": \"Avant toute politique financière, une question : **qui sont les actionnaires ?** Car ce sont eux qui **définissent la stratégie** et **valident les grands choix** (capitaux propres, affectation du résultat, M&A, endettement). Leur implication varie selon la **taille** de l'entreprise, le **niveau de participation** et le fait que la société soit **cotée ou non**.\\n\\n**🗂️ La typologie des actionnaires** :\\n\\n| 👥 Catégorie | 🎯 Logique & motivation |\\n|---|---|\\n| 👨‍👩‍👧 **Familles** | Contrôle de droit ou de fait. Pérennité & gestion patrimoniale LT priment sur le retour CT. Ex : Mulliez, L'Oréal, LVMH, Hermès, Dassault, Wendel |\\n| 🚀 **Entrepreneurs & business angels** | Le fondateur est l'actionnaire de contrôle (dilué au fil des levées). Le *business angel* investit en *seed* (cash + carnet d'adresses) |\\n| 💼 **Fonds d'investissement** | Gèrent pour compte de tiers ET exercent une influence (LBO, capital-risque, développement, retournement). Horizon court (qq années) |\\n| 🏦 **Investisseurs institutionnels** | Fonds de pension, SICAV/FCP, assureurs. Placements < quelques % (souvent <1 %), passifs, *marked to market*. Constituent le **flottant** |\\n| 🧑 **Particuliers** | < 10 % du capital en France (plus dans le monde anglo-saxon). Très sensibles au **dividende**, faible culture financière |\\n| 🌐 **Autres** | Groupes industriels (*corporate venture*), holdings (Eurazeo, Wendel), *family offices*, fonds **activistes** (Elliott, Third Point), États (EDF, Renault), fonds souverains (Norvège, GIC, ADIA), **actionnariat-salarié** (~5 %) |\\n\\nLe poids des **institutionnels** est considérable : jusqu'à **80-90 %** du capital de certaines grandes cotées. BlackRock annonçait fin 2021 gérer **> 10 000 milliards $**. Les 6 premiers mondiaux (≥ 3 000 Md$) : BlackRock, Vanguard, UBS, State Street, Fidelity, Allianz ; premier français : Amundi (~2 000 Md$).\",\n      \"info\": \"**Flottant vs capital stable.** Les investisseurs institutionnels + les particuliers forment le **« flottant »** : la part du capital susceptible de « tourner » au gré des achats/ventes, par opposition au capital **stable** (familles, fondateurs, blocs de contrôle). Beaucoup de très grandes cotées ont un flottant proche de **100 %**, ce qui empêche d'identifier précisément les actionnaires et complexifie la relation.\",\n      \"example\": \"**Structure actionnariale de BNP Paribas (2022)** : institutionnels européens **43,8 %**, institutionnels hors Europe **30,5 %**, État belge (SFPI) **7,8 %**, BlackRock **5,9 %**, salariés **4,3 %**, actionnaires individuels **4,0 %**, Luxembourg **1,0 %**, divers/non identifiés **2,7 %**. Illustration typique d'un capital ultra-dominé par les institutionnels.\",\n      \"tip\": \"**Activistes vs passifs** : les institutionnels classiques sont **passifs** (attentifs au cours, aux dividendes/rachats, aux notes de brokers), mais deviennent parfois actifs (votes en AG sur la rémunération, exigences **ESG**). Les fonds **activistes** (nés aux USA) prennent au contraire des minorités pour **réclamer bruyamment** des changements de gestion.\"\n    },\n    {\n      \"anchor\": \"s1-2\",\n      \"title\": \"2️⃣ Pactes d'actionnaires & contrôle : déconnecter le pouvoir du capital\",\n      \"content\": \"Au-delà des **statuts** (qui fixent déjà droits de vote, quorums, négociabilité), le **pacte d'actionnaires** régit plus finement les relations entre signataires. Rédigé par un avocat, négocié, signé pour une durée convenue. Surtout pour les **sociétés non cotées** (où il est **confidentiel**) — **systématiquement exigé** quand un investisseur professionnel prend une **minorité** aux côtés d'un majoritaire. Pour une cotée, il est transmis à l'**AMF**, rendu public, et peut constituer une **« action de concert »**.\\n\\n**🔑 Les clauses classiques d'un pacte** :\\n\\n| Domaine | Clauses-types |\\n|---|---|\\n| 🏛️ **Gouvernance & info** | Répartition des administrateurs, nomination Président/CAC, périodicité de l'information, exclusivité & non-concurrence du dirigeant |\\n| ✅ **Décisions importantes** | Droit de veto du minoritaire sur : gros investissements, **IPO**, augmentation de capital, endettement au-delà d'un seuil, M&A |\\n| 🔒 **Liquidité des titres** | *Lock-up* (interdiction de vendre X ans), **agrément** d'un entrant, **préemption**, sortie conjointe (*tag along*), sortie forcée (*drag along*) |\\n\\n**🛡️ Tag along vs drag along** (à ne pas confondre) :\\n- **Tag along** (sortie *conjointe*) : si le majoritaire vend, le minoritaire peut **se joindre** aux mêmes conditions → protège le minoritaire.\\n- **Drag along** (sortie *forcée*) : le majoritaire peut **forcer** le minoritaire à vendre → permet d'offrir **100 %** à un repreneur.\\n\\n**👑 Conforter le contrôle — déroger au « 1 action = 1 voix »** :\\n\\n| Mécanisme | Effet |\\n|---|---|\\n| **Actions sans droit de vote** (actions de préférence / ADP, *preferred shares*) | Vote supprimé, compensé par un dividende prioritaire. Ex : **IPO Porsche 2022** (12,5 % du capital en actions sans droit de vote) |\\n| **Droits de vote multiples** (en France : DVD = vote **double** pour les SA) | Après 2 ans au nominatif. Permet la majorité des voix avec une minorité du capital |\\n| **Commandite (SCA)** | Pouvoir aux *commandités* (gérants, responsables indéfiniment), capital aux *commanditaires* (sans pouvoir). Ex : Michelin, Hermès, Financière Agache (Arnault, 2022) |\\n| **Structures en cascade** | Chaîne de holdings détenues à ~51 % chacune : contrôle de fait avec un investissement minimal |\",\n      \"key_point\": \"**Le DVD, démonstration chiffrée.** Un actionnaire qui détient **35 %** du capital depuis > 2 ans et est seul à avoir des droits de vote doubles pèse en voix : 35×2 / (100+35) = 70/135 = **51,8 %** → la **majorité** des droits de vote avec une **minorité** du capital. La cession des titres fait perdre le vote double.\",\n      \"example\": \"**La cascade de holdings.** Un investisseur met **10 M€** pour 51 % de H1, qui détient 51 % de H2, etc. Par des détentions successives à 51 % il **contrôle de fait** la société B en bas de chaîne (qui vaut **290 M€**), alors qu'il n'en détient économiquement que **3,5 %** (51 %⁵). Montages réalisés par les groupes Frère, Bolloré, Arnault. Aux USA, structure A/B (Alphabet, Meta) : les fondateurs gardent le contrôle en étant très minoritaires en capital.\",\n      \"warning\": \"**Les citadelles juridiques tombent parfois.** La SCA passe pour « inexpugnable », mais **Lagardère** a dû abandonner ce statut en 2021 sous la pression des commanditaires, avant de passer sous contrôle de Vivendi. Les droits de vote multiples se heurtent aussi à la **réticence des investisseurs** (entorse au « 1 action = 1 voix ») et sont **interdits** en Allemagne, Belgique et Europe du Sud.\"\n    },\n    {\n      \"anchor\": \"s1-3\",\n      \"title\": \"3️⃣ Distribuer aux actionnaires : pourquoi et combien ?\",\n      \"content\": \"**💡 Le principe contre-intuitif à retenir** : en bonne théorie financière, **rendre de l'argent à l'actionnaire ne modifie pas son patrimoine**. Chaque € rendu **baisse les capitaux propres** de la société : ce n'est qu'un **transfert de liquidités** entre les caisses de l'entreprise et l'actionnaire.\\n\\n👉 **Exemple** : action à **100 €** juste avant un coupon de **3 €** → elle vaut **97 €** juste après. L'actionnaire détient une action de 97 € **+** 3 € de cash = **100 €**. Ni appauvri, ni enrichi. La distribution **n'est donc pas** le « revenu du capital » : le vrai rendement = plus/moins-value **+** distributions sur toute la durée de détention.\\n\\n**Pourquoi distribuer malgré tout ?**\\n- 💰 **Économique** : inutile de laisser dormir un cash qui ne rapporte rien.\\n- 🛡️ **Gouvernance** : un excès de cash peut pousser le dirigeant à des investissements injustifiés (« l'argent qui brûle les doigts »).\\n- ⚙️ **Pilotage de la structure** : tout € distribué fait ⬆️ la dette nette et ⬇️ les capitaux propres → outil de modulation.\\n- 🤝 **Attente actionnariale** : l'actionnaire le demandera tôt ou tard (liquidité, conformité aux pratiques de marché).\\n\\n**📊 Le dividende ordinaire & le pay-out** :\\n- Le **DPA** (Dividende Par Action) est relié au **BPA** (Bénéfice Par Action). Un dividende de l'année *n* est payé en *n+1* (délais d'arrêté + AG).\\n- **Pay-out** (taux de distribution) = part du résultat versée en dividendes. Sur longue période, CAC 40 ≈ **40-55 %** (moyenne peu signifiante, écarts énormes selon les secteurs).\\n- Juridiquement, l'AG vote une **fraction des réserves distribuables** (résultat de l'exercice **+** réserves passées) → une société **en perte** peut quand même verser un dividende.\\n- Pay-out **faible/nul** pour les start-up et fortes croissances ; **fort (50-100 %)** pour les matures (télécom, immobilier, énergie, banques).\\n\\n**Le dividende exceptionnel** : techniquement un dividende, mais lié à un **événement** (gros montant, présenté à part). Ex : LVMH 2014, **> 7 Md€** rendus aux actionnaires sous forme de **23 % du capital d'Hermès** (suite à la prise de contrôle ratée).\",\n      \"info\": \"**Le dividende comme signal.** Le marché n'aime pas les dividendes **erratiques**. Une politique régulière **réduit la volatilité** du cours (utile pour les cycliques) et **véhicule un signal** implicite sur la rentabilité future attendue. La politique doit être validée par le conseil, ni trop précise ni trop vague (souvent un **pay-out cible**, ex : « ~50 % pour les 5 ans à venir »), et stable pour rester crédible.\",\n      \"tip\": \"**Mode de paiement.** Les dividendes sont **le plus souvent en cash**, mais peuvent parfois être payés **en actions** (modalité plus ou moins utilisée selon les époques). Le dividende exceptionnel peut même être payé **en titres** d'une autre société (cas LVMH/Hermès).\",\n      \"comparison\": \"**🎯 Le retour à l'actionnaire ≠ enrichissement.** Beaucoup de particuliers croient que le dividende est « leur revenu ». Faux : c'est un transfert qui **baisse mécaniquement la valeur de l'action** du même montant. La performance d'un placement actions ne se juge qu'en **rendement total** = appréciation du cours **+** somme des distributions, sur toute la durée de détention.\"\n    },\n    {\n      \"anchor\": \"s1-4\",\n      \"title\": \"4️⃣ Le rachat d'actions (buyback) : l'autre façon de rendre du cash\",\n      \"content\": \"Le **rachat d'actions** (*buy-back*) : l'entreprise rachète **en cash ses propres actions**, soit par un **programme** au fil de l'eau, soit par une **offre ponctuelle**.\\n\\n**⚖️ Impact identique au dividende sur la structure** : ⬇️ capitaux propres consolidés, ⬆️ dette nette. **MAIS**, contrairement au dividende, le rachat agit sur l'**actionnariat** : les actions auto-détenues **perdent leur droit de vote et leur droit au dividende**, le nombre d'actions « en circulation » baisse → la capitalisation boursière baisse aussi.\\n\\n**📋 Programme de rachat (au fil de l'eau)** :\\n- Achats sur le marché, en général jusqu'à **10 % du capital** sur **18 mois**, autorisé par l'AG, mis en œuvre par le management.\\n- Actions rachetées = **« actions auto-détenues »**, encadrées par des règles strictes (cours limite, quantités) + communication régulière.\\n- **Réversible** : on peut les revendre plus tard (si non annulées) → elles **récupèrent** vote et dividende, et l'effet s'inverse (⬆️ capitaux propres, ⬇️ dette nette, ⬆️ capitalisation).\\n\\n**📢 Offre de rachat (OPRA pour une cotée)** :\\n- Offre **ponctuelle**, sur une **part significative** (souvent **> 10 %**), avec une **prime** sur le cours.\\n- Mêmes conséquences que le programme, mais plus marquées → peut **modifier sensiblement l'actionnariat**.\\n- Les actions rachetées peuvent être **annulées** (= réduction de capital juridique) ou non (réduction de capital **économique** par baisse des capitaux propres et du nombre d'actions).\\n- Ex : **Linedata** (ETI cotée à Paris), OPRA en oct. 2002 sur **17 %** du capital, **55 M€**, prime de **45 %**.\\n\\n**🔀 Arbitrer dividendes vs rachats** :\\n- **Souplesse** : un rachat se module plus facilement qu'un DPA (délicat à faire varier).\\n- **Signal & perception** : le rachat envoie un signal **moins fort** et a une perception sociétale/politique **moins sensible** (surtout dans les pays latins).\\n- **Fiscalité** : neutre pour les particuliers en France (flat tax **30 %**).\\n- **Impacts** sur l'actionnariat et sur la valeur des **stock-options** des dirigeants.\",\n      \"key_point\": \"**Dividende et rachat : même effet « caisse », effet « actionnariat » différent.** Les deux font ⬇️ capitaux propres et ⬆️ dette nette à l'identique. La différence-clé : le **rachat réduit le nombre d'actions et les droits de vote** (concentration du contrôle), le dividende non. C'est le critère discriminant à dégainer en examen.\",\n      \"example\": \"**Apple, recordman mondial du retour aux actionnaires.** Sur FY'12 → Q4'22, Apple a rendu **715,2 Md$** : **554,3 Md$** de rachats (dont 442,4 *open market* + 112,0 *accelerated share repurchase*) et **131,9 Md$** de dividendes. Illustration de la **domination des rachats** dans la culture anglo-saxonne (vs dividende encore majoritaire en Europe).\",\n      \"info\": \"**Europe vs USA.** Le dividende reste **majoritaire en Europe** ; les rachats (introduits plus tard qu'aux USA) **gagnent du terrain** depuis le début des années 2000 mais restent **moins développés** qu'outre-Atlantique.\"\n    },\n    {\n      \"anchor\": \"s1-5\",\n      \"title\": \"5️⃣ Lever des fonds : l'augmentation de capital\",\n      \"content\": \"L'**augmentation de capital en numéraire** propose de souscrire des **actions nouvelles**, **sans obligation** de participer : c'est une **offre de vente de titres neufs** dont le produit revient à l'entreprise, et qui **partage** la société entre anciens et nouveaux actionnaires. *(Les augmentations par échange de titres — OPE, fusion, apport — relèvent du cours M&A ; les levées de start-up, du cours private equity.)*\\n\\n**🔄 Dilution ≠ perte de valeur** : si les actions nouvelles sont émises à leur **juste prix**, **aucune dilution ni relution en valeur** — mais une **dilution en % du capital** pour qui ne souscrit pas.\\n- 👉 **Exemple** : un actionnaire à **25 %** d'une société qui **double** son capital et ne participe pas tombe à **12,5 %** en capital, **mais sa valeur est intacte** : deux fois moins d'une société deux fois plus grosse.\\n- Valeur des capitaux propres **après** = valeur **avant** **+** montant levé. Pour une cotée : capi après = capi avant + montant levé.\\n\\n**💸 La ressource la plus coûteuse et la plus exigeante** :\\n- **Coût** = rentabilité attendue par les actionnaires, soit le coût des capitaux propres via le **MEDAF** : *Taux sans risque + Bêta × Prime de marché*.\\n- Il ne faut **pas décevoir** ensuite (risque de fragiliser les dirigeants si le cours baisse).\\n- Exige une **communication intense** (roadshows, réunions analystes) et un fort **pouvoir de conviction**.\\n\\n**⚙️ Effets mécaniques** :\\n- ⬆️ Capitaux propres, ⬇️ dette nette immédiate (apport de cash, en attente de remploi).\\n- **Relution ou dilution du BPA** : relution si **1/PER < rentabilité économique** de l'investissement financé. Mais relution/dilution du BPA **n'est pas** synonyme de création/destruction de valeur (effet inverse possible sur le PER). Conseil : lever **quand le PER est élevé** (valorisation haute).\",\n      \"comparison\": \"**🏆 Hiérarchie des ressources de financement.** L'augmentation de capital est la **levée la plus délicate** : la plus **coûteuse** (coût des capitaux propres > coût de la dette, car les actionnaires exigent une prime de risque) et la plus **exigeante** en communication et conviction. C'est pourquoi elle n'arrive en général qu'après la dette dans l'ordre des préférences de financement.\",\n      \"tip\": \"**Relution du BPA, pas de la valeur.** Une augmentation de capital peut **relutter le BPA** (si 1/PER < rentabilité de l'investissement) sans pour autant **créer de la valeur**, car le PER peut bouger en sens inverse. Ne jamais conclure « BPA en hausse = valeur créée ». En revanche, lever en période de **PER fort** reste mécaniquement avantageux.\",\n      \"warning\": \"**Décevoir après une augmentation de capital fragilise les dirigeants.** Comme les actionnaires ont payé au juste prix sur la base d'attentes de rentabilité, une **baisse ultérieure du cours** met directement en cause la direction. La crédibilité du management est en jeu sur la promesse de rentabilité future.\"\n    },\n    {\n      \"anchor\": \"s1-6\",\n      \"title\": \"6️⃣ Le DPS : l'arme anti-échec de l'augmentation de capital cotée\",\n      \"content\": \"**Pour une société non cotée**, augmenter le capital est simple (pas de cours de référence, peu d'actionnaires, prix à convenir en petit comité). **Pour une cotée, c'est un casse-tête** : l'AMF exige que le **prix soit connu dès le lancement**, alors que le placement s'étale sur **plusieurs semaines** (prospectus, visa). Or :\\n- prix **< cours** → pénalise les actionnaires actuels ;\\n- prix **> cours** → échec garanti (personne ne souscrit plus cher que le marché) ;\\n- prix **= cours** → menacé si le cours **baisse** pendant le placement.\\n\\n**🎟️ La solution : le Droit Préférentiel de Souscription (DPS)** :\\n- On émet **avec une décote** (un « coussin » contre une baisse du cours).\\n- Cette décote est **seulement apparente** : elle est **compensée par le DPS**.\\n- **À chaque action ancienne est attaché 1 DPS**, qui se **détache** au lancement et se **cote séparément** sur un marché éphémère.\\n- L'actionnaire qui **ne souscrit pas** **vend** ses DPS (compensé) ; celui qui **souscrit** les **utilise** ; le **nouvel entrant** doit d'abord **acheter** des DPS (la décote n'est qu'optique).\\n\\n**🧮 L'exemple chiffré de référence** :\\n- Cours **100 €** · **10 M** d'actions · capi **1 Md€**. Augmentation de **150 M€** : **2 M** d'actions nouvelles à **75 €** → parité **1 nouvelle pour 5 anciennes**, décote apparente de **25 %**.\\n- **Valeur théorique du DPS** = (Cours – Prix d'émission) / (1 + actions existantes/actions nouvelles) = (100 – 75) / (1 + 5) = 25/6 = **4,17 €**.\\n- **TERP** (cours ex-droit, *Theoretical Ex-Right Price*) = 100 – 4,17 = **95,83 €**.\\n\\n**✅ Vérification de la neutralité (3 profils)** :\\n\\n| Profil | Calcul | Résultat |\\n|---|---|---|\\n| Actionnaire qui **souscrit** (5 actions) | (5×100 + 75) / 6 = 575/6 | **95,83 €/action** = TERP |\\n| Actionnaire qui **ne participe pas** | action 95,83 € + DPS vendu 4,17 € | **100 €** (inchangé) |\\n| **Nouvel entrant** | 5 DPS × 4,17 + 75 = 20,8 + 75 | **95,8 €** = cours ex-droit |\\n\\n**Bilan** : tant que le cours **reste > 75 €** pendant le placement, le DPS a une valeur et l'opération a toutes les chances d'être souscrite. C'est la **technique de référence** des cotées en France/Europe. Les grosses opérations sont souvent **« garanties »** par le syndicat bancaire (la « colle » : les banques souscrivent le résidu non placé).\\n\\n**Autres techniques** (surtout cotées) : augmentation **au cours de bourse** (sans DPS, décote ≤ **5 %**, souvent en **placement privé**), augmentations **réservées** (un investisseur, les salariés), **equity lines** (au fil de l'eau, petites cotées à faible flottant), produits **equity-linked** (obligations convertibles — autre cours).\",\n      \"key_point\": \"**Le DPS est NEUTRE pour tout le monde.** Souscripteur, vendeur de droits, nouvel entrant : tous se retrouvent exactement au **TERP** (95,83 €). La « décote » de 25 % n'est qu'un **artifice optique** intégralement compensé par la valeur du droit. C'est tout l'objet du mécanisme : sécuriser le placement **sans léser personne**.\",\n      \"example\": \"**Le calcul du TERP, pas à pas.** Valeur DPS = (100 – 75)/(1+5) = **4,17 €**. TERP = cours – DPS = 100 – 4,17 = **95,83 €**. Un actionnaire à 5 actions qui souscrit dépense 5×100 + 75 = 575 € pour 6 actions, soit **95,83 €** chacune : il atterrit **pile** au cours ex-droit. La neutralité est exacte, pas approximative.\",\n      \"info\": \"**La « colle » bancaire.** Sur les grandes opérations à DPS, un **syndicat bancaire** garantit le placement : si une partie des titres n'est pas souscrite par le marché, **les banques s'engagent à les souscrire elles-mêmes**. C'est ce filet de sécurité, combiné à la décote, qui fait du DPS la technique la plus fiable pour les cotées européennes.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Pourquoi connaître ses actionnaires est-il un préalable à toute politique financière ? Citez 3 grandes catégories.\",\n      \"a\": \"Parce que ce sont **les actionnaires qui définissent la stratégie et valident les grands choix** (capitaux propres, affectation du résultat, M&A, endettement). Catégories : **familles** (pérennité & patrimoine LT), **fonds d'investissement** (influence active, horizon court : LBO, capital-risque…), **investisseurs institutionnels** (fonds de pension, SICAV, assureurs ; passifs, < quelques %), plus particuliers, États, fonds souverains, activistes, actionnariat-salarié. Institutionnels + particuliers = le **flottant**.\"\n    },\n    {\n      \"q\": \"Tag along vs drag along : quelle est la différence et qui chacune protège-t-elle ?\",\n      \"a\": \"**Tag along (sortie conjointe)** : si le majoritaire vend, le minoritaire peut **se joindre** à la vente aux **mêmes conditions** → protège le **minoritaire**. **Drag along (sortie forcée)** : le majoritaire peut **forcer** le minoritaire à céder → permet d'offrir **100 % du capital** à un repreneur, donc sert le **majoritaire / l'opération de cession**.\"\n    },\n    {\n      \"q\": \"Comment un actionnaire peut-il détenir la majorité des droits de vote avec une minorité du capital ? Donnez l'exemple chiffré du DVD.\",\n      \"a\": \"Via des **droits de vote multiples**. En France, les SA peuvent émettre des **droits de vote doubles (DVD)**, attribués après **2 ans** au nominatif. Exemple : un actionnaire à **35 %** du capital, seul à détenir des DVD, pèse 35×2/(100+35) = 70/135 = **51,8 %** des voix → la **majorité** avec une minorité du capital. Autres leviers : actions sans droit de vote, commandite (SCA), structures en cascade.\"\n    },\n    {\n      \"q\": \"Vrai ou faux : le versement d'un dividende enrichit l'actionnaire. Justifiez avec un exemple.\",\n      \"a\": \"**Faux.** Rendre de l'argent ne fait que **transférer des liquidités** : chaque € versé **baisse les capitaux propres** (et le cours) d'autant. Exemple : action à **100 €**, coupon de **3 €** → après détachement l'action vaut **97 €**, l'actionnaire a 97 € + 3 € cash = **100 €**. Le dividende n'est donc **pas le revenu du capital** ; le vrai rendement = plus/moins-value + distributions sur la durée.\"\n    },\n    {\n      \"q\": \"Dividende et rachat d'actions : quel effet commun et quelle différence majeure ?\",\n      \"a\": \"**Effet commun (structure)** : tous deux ⬇️ les **capitaux propres** consolidés et ⬆️ la **dette nette** (sortie de cash). **Différence majeure** : le **rachat agit sur l'actionnariat** — il réduit le nombre d'actions en circulation, les actions auto-détenues **perdent vote et dividende**, la capitalisation baisse et le contrôle se **concentre**. Le dividende n'a aucun effet sur le nombre d'actions ni les droits de vote.\"\n    },\n    {\n      \"q\": \"Pourquoi le mécanisme du DPS est-il dit « neutre » ? Calculez la valeur du DPS et le TERP à partir de l'exemple du cours.\",\n      \"a\": \"Parce que la **décote du prix d'émission est compensée exactement par la valeur du DPS** : souscripteur, vendeur de droits et nouvel entrant atterrissent tous au **même cours ex-droit (TERP)**. Exemple : cours 100 €, émission à 75 €, parité 1 pour 5. **Valeur DPS** = (100 – 75)/(1 + 5) = 25/6 = **4,17 €**. **TERP** = 100 – 4,17 = **95,83 €**. L'actionnaire à 5 actions qui souscrit : (5×100 + 75)/6 = **95,83 €/action** → neutralité exacte.\"\n    },\n    {\n      \"q\": \"Pourquoi une augmentation de capital cotée a-t-elle besoin du DPS, et qu'est-ce que la « colle » bancaire ?\",\n      \"a\": \"Parce que l'AMF exige un **prix fixé dès le lancement** alors que le placement dure **plusieurs semaines** : un prix au cours risque l'**échec** si le cours baisse entre-temps. Le DPS permet d'émettre **avec une décote (coussin)** compensée par le droit, sécurisant l'opération tant que le cours reste **> prix d'émission**. La **« colle »** : sur les grandes opérations, le **syndicat bancaire garantit** le placement en souscrivant lui-même les titres non placés par le marché.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Capital et Ingénierie Financière\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (actionnaires ; pactes & contrôle ; distribuer ; rachat d'actions ; augmentation de capital ; DPS) + 7 auto-tests. Couvre l'intégralité de la Semaine 01 (pages 1 à 57).\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_3_iccf2_capital/semaine_2.json": "{\n  \"code\": \"ICCF2 Capital — Semaine 2\",\n  \"title\": \"🟩 Semaine 2 — Private Equity & LBO\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 3 (Capital & Ingénierie financière)\",\n  \"ref_msa\": \"Cours ICCF2 — Capital et Ingénierie Financière\",\n  \"bases_legales\": \"Le monde du Private Equity / LBO — fonds d'investissement, montage LBO, industrie PE\",\n  \"normes\": \"Private Equity / LBO (Vernimmen)\",\n  \"niveau\": \"Intermédiaire — finance d'entreprise\",\n  \"summary\": \"Plonger dans l'univers du **Private Equity** : d'abord la **typologie des fonds** (amorçage → capital-risque → capital-développement → LBO), classés selon le **stade de maturité** des entreprises. Ensuite le cœur technique du cours, le **LBO** (Leveraged Buy-Out) : son **effet de levier** (acheter avec beaucoup de dette pour doper la rentabilité des capitaux propres), son **cycle en 3 temps** (montage → optimisation opérationnelle → sortie), et ses mesures de performance (**TRI** et **multiple de l'argent / MoM**). Enfin, l'**industrie du PE** : comment un fonds lève de l'argent auprès des **LP**, comment les **GP** sont rémunérés (management fee + **carried interest**), et pourquoi le LBO est un monde radicalement différent du capital-risque. 💡 *Le LBO est une technique ; le Private Equity est une industrie.*\",\n  \"mnemonics\": \"**Le LBO sur 3 pieds — MOS** : **M**ontage (effet de levier au départ) → **O**ptimisation (performance opérationnelle pendant 3-5 ans) → **S**ortie (revente qui concrétise le TRI). **L-B-O littéralement** : **L**everage (dette ≈ x6 EBITDA) · **B**uy (rachat majoritaire d'une cible mature) · **O**ut (sortie en 3-5 ans). **Les acteurs — GP vs LP** : **GP** = General Partners = ceux qui **G**èrent (touchent le carried) ; **LP** = Limited Partners = ceux qui **L**ivrent l'argent (responsabilité **L**imitée). **2-20-7** : management fee **2%** · carried interest **20%** · hurdle rate **7-8%**.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s2-1\",\n      \"title\": \"1️⃣ Typologie & positionnement des fonds d'investissement\",\n      \"content\": \"Le mot « **fonds** » est trompeur : un fonds d'investissement gère, comme d'autres, des **actifs pour compte de tiers** — mais il n'a **rien à voir** avec une SICAV, un fonds commun de placement, un hedge fund, un fonds activiste ou un fonds souverain. ⚠️ Ne pas confondre.\\n\\nLes fonds d'investissement se **spécialisent par stade de développement** de l'entreprise. C'est l'axe de classification central :\\n\\n| 🌱 Stade | Type de fonds | Cible | Position au capital |\\n|---|---|---|---|\\n| Idée / projet | 🥚 **Amorçage** (Seed / early stage) | Toute jeune pousse | Minoritaire |\\n| Premières ventes | 🚀 **Capital-risque** (Venture Capital) | Start-up qui démarre | Minoritaire (accompagne le fondateur) |\\n| Croissance établie, parfois rentable | 📈 **Capital-développement** (Growth) | Entreprise en croissance | Le plus souvent minoritaire |\\n| Maturité, génération de cash | 🏭 **LBO** (Private Equity) | Entreprise mature | **Majoritaire** (contrôle) |\\n\\n**Le fil conducteur** : plus l'entreprise est jeune et risquée, plus le fonds est minoritaire et accompagne ; plus elle est mature et génère du cash, plus le fonds prend le **contrôle** (LBO). Les business angels expérimentés sont d'ailleurs très attractifs pour les managers de toutes jeunes pousses.\\n\\n**Le modèle actionnarial commun à tous** : ces fonds interviennent en général dans des **sociétés non cotées**, en **actionnaires actifs** qui mettent une forte pression sur les dirigeants pour créer de la valeur. Horizon **court (3-5 ans)**, rendement obtenu **essentiellement par la plus-value à la sortie** (peu de dividendes).\\n\\n**Des volumes considérables, dominés par le LBO** :\\n- 💰 Plus de **1 000 milliards de $** d'investissement annuel mondial à la fin des années 2020 (en valeur d'entreprise), avec une hypertrophie en 2021 puis un tassement en 2022.\\n- 🏭 Les **LBO ≈ 2/3** des volumes totaux du private equity.\\n- 🌍 Marché LBO dominé par les **USA (≈ 50%)**, Europe **≈ 30%** (dont France 2-3% du total mondial), Asie **≈ 15%** en montée en puissance.\\n- 📊 Les LBO pèsent **≈ 20% des volumes M&A mondiaux** (poids en progression constante).\",\n      \"key_point\": \"**On classe les fonds selon le STADE de maturité de la cible**, pas selon le secteur. Amorçage et capital-risque ciblent les start-ups (minoritaire) ; le LBO cible les entreprises matures qui génèrent du cash (majoritaire). C'est la grille de lecture à avoir en tête.\",\n      \"info\": \"Les grands acteurs se sont **spécialisés par segment** : rares sont les fonds à la fois actifs en capital-risque ET en LBO (exception dans les pays émergents). Un fonds de capital-risque et un fonds de LBO sont deux métiers différents.\",\n      \"example\": \"**Quelques LBO géants récents** (valeur, en Mds $) : Atlantia 62 (Blackstone + famille Benetton), Medline 30 (Blackstone/Carlyle/H&F), Thyssenkrupp 20,4 (Advent/Cinven), Citrix 16 (Elliott/Vista), division Skin Health de **Nestlé 10,5 (EQT)** 🇨🇭. Côté France : Pages Jaunes (5,6 Mds, 2006), Legrand (5 Mds, 2002), Cerba (4,5 Mds, 2021).\"\n    },\n    {\n      \"anchor\": \"s2-2\",\n      \"title\": \"2️⃣ Qu'est-ce qu'un LBO ? Le montage & l'effet de levier\",\n      \"content\": \"**Un LBO**, c'est : ① **acquérir** une entreprise (le plus souvent par un fonds, le *Private Equity Sponsor*) ② **avec effet de levier** (donc beaucoup de **dette**) ③ pour **créer de la valeur** (optimisations, croissance interne et externe) ④ puis la **céder** en délivrant un **TRI élevé** aux investisseurs (les LP).\\n\\n📌 Vocabulaire : **LBO** (« Leveraged Buy-Out ») = une **technique** ; **Private Equity** = l'**industrie**.\\n\\n**Le montage type — schéma d'un LBO de 100 M€** :\\n\\n```\\n   INVESTISSEURS (fonds) + MANAGERS\\n            │ Capital 30 M€\\n            ▼\\n      🏢 HOLDING (« Holdco » / « Newco »)  ◄── Prêt 70 M€ (PRÊTEURS : banques senior, mezzaneur)\\n            │ détient 100%\\n            ▼\\n      🏭 SOCIÉTÉ CIBLE (« Opco »)\\n```\\n\\n- **Capital de la Holdco** : 30 M€ apportés essentiellement par le fonds (et un peu par le management).\\n- **Dette levée au niveau de la Holdco** : 70 M€.\\n- L'ensemble (100 M€) sert à racheter **100% du capital de la cible** (l'Opco) au vendeur.\\n\\n**Pourquoi interposer une holding ?** ✅ Elle **sépare** les parties prenantes du montage financier (fonds, management, prêteurs) de l'activité opérationnelle. ✅ Elle **permet de porter la dette** d'acquisition, ce qui ne serait pas toujours possible directement au niveau de l'Opco.\\n\\n**Fonctionnement d'ensemble** : Holdco + Opco forment **un seul groupe**, géré par les mêmes équipes. En France, si la Holdco détient **> 95%** de l'Opco → **intégration fiscale** : les intérêts payés « en haut » (Holdco) deviennent déductibles des résultats imposables « en bas » (Opco) → LBO plus efficient (l'absence d'intégration ne l'interdit pas, elle le rend juste moins efficient). La dette existante de l'Opco est en général refinancée pour éviter la subordination structurelle, et un système de flux internes (remontée de dividendes) permet à la Holdco d'honorer sa dette.\\n\\n**L'effet de levier — le moteur** : quand la **rentabilité économique (ROCE) > coût de la dette**, l'écart favorable bénéficie à l'actionnaire et **augmente la rentabilité des capitaux propres**. Le LBO est l'**archétype de l'effet de levier poussé à l'extrême**.\\n\\n**📊 Illustration chiffrée** (Actif éco 100 M€, Rex 15 M€, impôt 1/3 → ROCE 10% ; dette 70 M€ à 6% avant impôt = 4% après) :\\n\\n| | SANS dette | AVEC dette (LBO) |\\n|---|---|---|\\n| Capitaux propres | 100 | **30** |\\n| Dette nette | 0 | **70** |\\n| Résultat net | 10 (= Rex net) | 10 − (4% × 70) = **7,2** |\\n| **Rentabilité des CP** | 10/100 = **10%** | 7,2/30 = **24%** |\\n\\n👉 La rentabilité des capitaux propres passe de **10% à 24%** grâce au levier.\",\n      \"key_point\": \"**L'effet de levier en lui-même ne CRÉE pas de valeur** — il transfère et amplifie. Il ne peut donc pas expliquer à lui seul l'essor du private equity : la création de valeur opérationnelle (optimisation, croissance) reste indispensable.\",\n      \"example\": \"**Approche par le « deleveraging »** (mêmes hypothèses, revente à 100 M€ au bout de 5 ans, cash généré 7,2/an réinvesti dans le remboursement) : dette nette finale = 70 − (5 × 7,2) = **34 M€**. Valeur des CP à la revente = 100 − 34 = **66 M€**. Soit **30 → 66 = x2,2 ; TRI ≈ 17%**. Pour comparaison, la société non endettée : 100 → 150 = x1,5 ; TRI ≈ 9%. Le levier double quasiment la performance.\",\n      \"warning\": \"**Le levier peut se RETOURNER.** En cas de baisse de performance ou d'incapacité à faire face à la dette, la valeur des capitaux propres peut chuter fortement — l'actionnaire pouvant **perdre tout ou partie de sa mise**. Le levier augmente dans TOUS les cas le risque des capitaux propres : c'est pourquoi le LBO est une **classe d'actifs à part**, sur laquelle les fonds exigent un **TRI ≈ 20%**.\"\n    },\n    {\n      \"anchor\": \"s2-3\",\n      \"title\": \"3️⃣ Le cycle du LBO : optimisation puis sortie\",\n
