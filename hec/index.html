n- [4️⃣ Dilution / relution du BPA, PER & goodwill](semaine_2.json#s2-4)\n- [5️⃣ Cas Dupont & Cie : combiner les impacts](semaine_2.json#s2-5)\n- [6️⃣ Les synergies : fondement, mesure & partage](semaine_2.json#s2-6)\n\n---\n\n## 🟧 [SEMAINE 3 — Les grands enjeux de la négociation](semaine_3.json)\n\nLe passage de la **valeur d'entreprise au prix des titres** (le « bridge »), le délai signing/closing, les ajustements de prix (locked box vs comptes de clôture), les **due diligences** et la structuration juridique (NDA, SPA, GAP).\n\n- [1️⃣ De la valeur d'entreprise au prix des titres : le « bridge »](semaine_3.json#s3-1)\n- [2️⃣ Composantes du bridge : dette nette, BFR & ajustements](semaine_3.json#s3-2)\n- [3️⃣ Signing → Closing : le délai et ses conséquences](semaine_3.json#s3-3)\n- [4️⃣ Ajustements de prix : Locked Box vs Comptes de clôture](semaine_3.json#s3-4)\n- [5️⃣ Autres leviers de négociation & due diligences](semaine_3.json#s3-5)\n- [6️⃣ Structuration juridique : du NDA au closing, SPA, GAP](semaine_3.json#s3-6)\n\n---\n\n## 🟥 [SEMAINE 4 — Offres publiques & conclusion sur le M&A](semaine_4.json)\n\nLes opérations sur titres cotés : définition et choix tactique de l'**offre publique** (OPA/OPE, amicale/hostile), le cadre **AMF** (seuils, offre obligatoire), les défenses anti-OPA, les aspects financiers (primes, synergies, cours), et la conclusion sur le M&A (intégration / PMI).\n\n- [1️⃣ L'offre publique : définition & spécificités](semaine_4.json#s4-1)\n- [2️⃣ Choix tactique : amicale/hostile, OPA/OPE, simplifiée/normale](semaine_4.json#s4-2)\n- [3️⃣ Aspects juridiques : seuils & offre obligatoire (AMF)](semaine_4.json#s4-3)\n- [4️⃣ Lancement, déroulé & défenses anti-OPA](semaine_4.json#s4-4)\n- [5️⃣ Aspects financiers : primes, synergies & cours de bourse](semaine_4.json#s4-5)\n- [6️⃣ Conclusion : financer le M&A & réussir l'intégration (PMI)](semaine_4.json#s4-6)\n\n---\n\n*Synthèse du Cours 2 ICCF2 — HEC Paris. Même mise en forme que les fiches Audit (callouts colorés, mnémoniques, auto-test). 4 fiches complètes.*\n\n*Statut : ✅ **COMPLET — 4 / 4 fiches**.*\n", "cours_2_iccf2_ma/semaine_1.json": "{\n  \"code\": \"ICCF2 M&A — Semaine 1\",\n  \"title\": \"🟦 Semaine 1 — Introduction au M&A, négociation & valorisation\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 2 (M&A)\",\n  \"ref_msa\": \"Cours ICCF2 — Fusions-Acquisitions (M&A)\",\n  \"bases_legales\": \"Finance d'entreprise — opérations de croissance externe\",\n  \"normes\": \"Cadre standard M&A (Vernimmen)\",\n  \"niveau\": \"Intermédiaire — finance d'entreprise / M&A\",\n  \"summary\": \"Première plongée dans le monde du **M&A** (Mergers & Acquisitions = fusions-acquisitions). Une opération de M&A, c'est l'achat ou la cession d'un **contrôle** (d'une société, d'actifs), via une **négociation** menant à des accords documentés. On découvre d'abord un **marché gigantesque** (~4 000 Md$/an, record à ~6 000 Md€ en 2021), **cyclique**, **global** (USA ~la moitié) et peuplé d'**intervenants** très variés (conseils financiers, avocats, autorités…). On comprend ensuite que la vente d'une société suit un **process** orchestré par le vendeur — soit le **gré à gré** (discret, rapide), soit l'**enchère** (concurrence, meilleur prix). Enfin, on aborde la **valorisation** : comparables, DCF et autres méthodes. Message-clé à graver : en M&A, **le bon prix n'est pas dicté par un rapport de valorisation, il résulte d'une négociation**. La valorisation est une *arme de négociation*, pas une science exacte.\",\n  \"mnemonics\": \"**Le M&A en 3 actes — M·A·V** : le **M**arché (qui ? combien ? pourquoi ?), l'**A**ctivité de vente (gré à gré vs enchère, le vendeur est le patron), la **V**alorisation (comparables + DCF → une fourchette, pas un chiffre). \\n\\n**Pour la valo — « 4 routes, 2 voies »** : en théorie 4 méthodes (DCF, DDM, comparables, patrimoniale) mais en pratique **2 reines** : **DCF** (flux futurs actualisés) + **Comparables** (multiples PER, VE/EBITDA). Et le réflexe **GIGO** : « *Garbage In, Garbage Out* » — données fausses = valeur fausse.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s1-1\",\n      \"title\": \"1️⃣ Qu'est-ce que le M&A — et la croissance externe ?\",\n      \"content\": \"**M&A** = *Mergers & Acquisitions* = **fusions-acquisitions**. Concrètement, une transaction de M&A consiste à **acquérir ou céder un contrôle** (d'une société, d'actifs) — ou a minima une **participation influente** — ce qui implique une **négociation** (avec une contrepartie identifiée ou avec « le marché ») et mène à des **accords structurés et documentés** entre acheteur et vendeur.\\n\\n**⛔ Ce qui n'est PAS du M&A** :\\n- 📉 Les achats/cessions de blocs **en bourse sans interaction** avec la contrepartie (même les blocs importants)\\n- 🆕 Les **introductions en bourse (IPO)**\\n- ↩️ Les opérations particulières type OPRA, retraits de cote ou demergers (vues dans un autre cours)\\n\\nLa **frontière est parfois floue** : par exemple l'acquisition initiale par **Veolia auprès d'Engie en 2021 de 30 % de Suez** — un achat de bloc hors bourse avec négociation, mais sans conférer le contrôle ni conduire à des accords documentés.\\n\\n**🥊 Croissance interne vs croissance externe** — quand l'alternative existe, choisir le M&A, c'est choisir la **croissance externe** :\\n\\n| | ✅ Atouts | ⚠️ Limites |\\n|---|---|---|\\n| 🌱 **Croissance INTERNE** | Investissements maîtrisés (savoir-faire, coûts), étalés dans le temps (usine, R&D, recrutements) | Délais de réalisation plus longs ; incertitude sur le résultat final |\\n| 🚀 **Croissance EXTERNE (M&A)** | Atteindre **beaucoup plus vite** son objectif | Investissement **soudain et important** (opération possiblement transformante) ; enjeux sur le nouveau groupe élargi (finances, pouvoir, actionnariat, culture, intégration) |\",\n      \"key_point\": \"**Le cœur du M&A = un changement de contrôle, négocié et documenté.** Si l'opération n'implique pas de négociation avec une contrepartie (ex : ramassage de titres en bourse) ou ne confère pas de contrôle, ce n'est généralement pas du M&A.\",\n      \"example\": \"**Air Liquide**, championne de la croissance **interne** et maîtrisée pendant des décennies, a fini par réaliser une **acquisition majeure de 13 Md$ aux USA en 2015 (Airgas)**. Morale : les décideurs n'ont **jamais tranché pour toujours** — la décision M&A est souvent **opportuniste**.\",\n      \"info\": \"Croissance externe = acheter une activité déjà constituée. Croissance interne (« organique ») = la développer soi-même. Le M&A est l'instrument privilégié de la première.\"\n    },\n    {\n      \"anchor\": \"s1-2\",\n      \"title\": \"2️⃣ Un marché vaste, cyclique et global\",\n      \"content\": \"Le marché du M&A est **considérable, en croissance de long terme, mais très cyclique et mondialisé**.\\n\\n**📏 Taille du marché** :\\n- Environ **4 000 Md$ de transactions par an** dans le monde depuis les années 2000 — soit près de **2 fois le PIB français**.\\n- Croissance de long terme : ~**2 000 Md€** au début des années 2000 → **2 fois plus (~4 000 Md€)** au début des années 2020.\\n- ⚠️ Subtilité-clé : les volumes M&A s'entendent en **valeur d'entreprise** (dette des sociétés rachetées **incluse**), pas seulement le montant payé pour les actions.\\n\\n**🎢 Un marché cyclique** — variations annuelles énormes, **du simple au quasi-quintuple** :\\n- **Record historique en 2021** : près de **6 000 Md€** (rebond des bourses + taux bas).\\n- **Forte baisse en 2022** : ~**3 600 Md€** (1 200 Md€ au plus bas), repli attendu encore en 2023 (tensions géopolitiques, crise énergétique).\\n- Points très bas historiques en **2002 et 2009** ; transactions **non affectées** par le Covid en 2020-2021.\\n\\n**🌍 Un marché global** (par nationalité des cibles, est. 2021-2022) :\\n\\n| Zone | Part du marché mondial |\\n|---|---|\\n| 🇺🇸 **USA** | **~47 %** (≈ la moitié) |\\n| 🌍 **APAC** (Asie-Pacifique) | **~27 %** |\\n| 🌐 **EMEA** (Europe, Moyen-Orient, Afrique) | **~26 %** |\\n\\n- L'Asie (APAC) est devenue **aussi importante que l'Europe** (chacune ~1/4 du total).\\n- Le marché **français** (~300 Md$ en 2021, ~160 Md$ en 2022) pèse en moyenne **~5 %** du mondial.\\n- ⚠️ Lire ces stats avec prudence à cause des opérations **cross-border** (acheteur/vendeur d'un pays différent de la cible).\",\n      \"info\": \"**EMEA** = Europe + Middle East + Africa. **APAC** = Asia-Pacific. Vocabulaire standard des banques pour découper le marché mondial.\",\n      \"key_point\": \"Trois mots à retenir sur le marché : **vaste** (~4 000 Md$/an), **cyclique** (de 1 200 à ~6 000 Md€ selon l'année) et **global** (USA ~la moitié, APAC ≈ EMEA ≈ 1/4 chacun).\"\n    },\n    {\n      \"anchor\": \"s1-3\",\n      \"title\": \"3️⃣ Pourquoi acheter ? Opérateurs & moteurs de la décision\",\n      \"content\": \"**🧑‍💼 Qui fait du M&A ?** Des **opérateurs variés** :\\n- Les **opérateurs stratégiques** (acquéreurs/vendeurs sectoriels, non purement financiers) restent **majoritaires — plus des 2/3 des volumes**.\\n- Mais le poids des **investisseurs financiers** augmente. Les opérations des fonds de **Private Equity (LBO)** représentent **~20 %** du marché en moyenne, tendance historique à la hausse.\\n\\n**🌐 Facteurs MACROéconomiques** qui déclenchent la décision :\\n- ⚙️ **Défis technologiques** : être plus fort à deux pour financer des investissements lourds → fusion **PSA + FCA = Stellantis (2019)**, pour financer l'électrique.\\n- ⚖️ **(Dé)réglementation** : vague de M&A dans les **télécoms** depuis les années 90 suite à la dérégulation ; à l'inverse, en **1911** l'antitrust américain ordonne l'éclatement de **Standard Oil** (empire Rockefeller).\\n- 📈 **Santé des marchés & taux bas** : bourses hautes → acheteurs entreprenants + vendeurs tentés ; taux bas → financement « bon marché » (cf. record **2021**).\\n- 🛡️ **Pression de l'environnement & des concurrents** : ex. bancaire, la **double OPE de la BNP sur la SocGen et sur Paribas (1999)**, en réaction au mariage prévu SocGen-Paribas.\\n- 🧰 **Développement de techniques** : **LBO (Private Equity) et SPAC** ont gonflé (voire hypertrophié) le marché en 2021 — et leur contraction en 2022-2023 explique largement la baisse.\\n\\n**🔬 Facteurs MICROéconomiques** (propres à l'entreprise) :\\n- 📉 **Économies d'échelle / baisse des coûts unitaires** : rapprochements en pharma, services informatiques.\\n- 🌎 **Course à la taille / leadership / international** : **Veolia–Suez (2022)** pour le leadership ; **Eutelsat–OneWeb (2022, satellites)** ; méga-offre **Microsoft sur Activision (2022)** pour créer le n°3 mondial du jeu vidéo.\\n- 🛒 **Acquérir une part de marché / un produit** : **Danone–WhiteWave (2017, bio)**.\\n- ✂️ **Recentrages stratégiques** : **ThyssenKrupp** cède ses ascenseurs (2020) ; **Nestlé** cède ses « soins de la peau » (2019) ; cession des annuaires télécom (Pages Jaunes, Seat Pagine Gialle, Yell).\\n- 💳 **Pression financière / désendettement** : **Altice** cède 50 % de ses « tours » télécom à **KKR (2018)**.\\n- 👥 **Facteurs humains/managériaux** (successions, difficultés) : **Vivendi–Lagardère (2021)**.\",\n      \"comparison\": \"**Stratégiques vs financiers** — les **stratégiques** (industriels du secteur) cherchent des **synergies** et restent majoritaires (>2/3). Les **financiers** (fonds de Private Equity, via LBO) achètent pour faire fructifier puis revendre : ~20 % du marché, en hausse.\",\n      \"tip\": \"Pour mémoriser les moteurs MACRO : **« Techno, Régul, Marchés, Concurrence, Techniques »**. Pour les MICRO, pense **« grandir, recentrer, monétiser »** (économies d'échelle, leadership / part de marché, recentrages, pression financière, facteurs humains).\",\n      \"example\": \"**SPAC** = *Special Purpose Acquisition Company* : société-coquille cotée qui lève des fonds en bourse pour ensuite racheter une cible. Avec les LBO, elles ont alimenté le pic de 2021.\"\n    },\n    {\n      \"anchor\": \"s1-4\",\n      \"title\": \"4️⃣ Les intervenants — qui est autour de la table ?\",\n      \"content\": \"**🤝 Le cadre relationnel du M&A** : le plus souvent **au moins deux camps face à face**, en position de négociation. **Peu d'intervenants neutres.**\\n\\n**💼 Les conseils financiers** — l'acteur pivot. Ils conseillent leur client (côté acheteur OU vendeur) **de la conception jusqu'à la réalisation finale** : définition du process, documentation (ex. rédaction de l'*info memo*), valorisation, *intelligence*, lettres d'offres, tactique de négociation (voire négociation directe), relations avec les contreparties, coordination des intervenants (audits, due diligence), structuration, modélisation financière, parfois financement, relations avec les autorités, communication.\\n- Présence **d'autant plus probable que le deal est gros** (souvent plusieurs conseils par camp dans les très grosses opérations).\\n- **De facto requis** sur sociétés cotées (ex. offre publique).\\n- 🎯 **Alignement des intérêts** : rémunération **essentiellement « au succès »**.\\n\\n**Qui sont-ils en France ?**\\n\\n| Catégorie | Exemples |\\n|---|---|\\n| 🏦 Banques généralistes FR | BNP Paribas, Société Générale, CA-CIB, Natixis |\\n| 🎩 Banques très spécialisées M&A | Rothschild, Lazard |\\n| 🇺🇸 *Investment banks* (surtout US) | Goldman Sachs, Morgan Stanley, JP Morgan Chase, Citi, BofA, Deutsche, Barclays |\\n| 🧩 « Boutiques » / conseils indépendants | Messier & Associés, Leonardo, Moelis, Perella Weinberg, Lincoln |\\n\\n📊 **Classement français 2021 (pic du marché, en Md$ de transactions)** : BNP Paribas **128,5** · Lazard **119,2** · Rothschild & Co **105,5** · Goldman Sachs **94,3** · Morgan Stanley **81,6** · JP Morgan **75,2** · Société Générale **69,7** · Crédit Agricole CIB **56,7** · Natixis **48,5** · Crédit Suisse **48,4**.\\n\\n**⚖️ Les conseils juridiques (avocats)** — rôle majeur, **toujours de chaque côté** : formalisation des accords tout au long (surtout en fin de process) et rôle pivot sur les **aspects concurrence** ; souvent des avocats **spécialisés en fiscalité**.\\n\\n**🔧 Les autres conseils** : stratégie, due diligence financières, immobilier, droit social, environnement, conseil management (ex. LBO), agences de communication. **Banques de financement** : pour financer l'acquéreur ou refinancer la cible.\\n\\n**🏛️ Intervenants parfois neutres** : **experts indépendants** (attestations d'équité), **autorités** (AMF en France, autorités réglementaires/administratives/politiques pour secteurs sensibles, autorités de la concurrence FR ou européennes).\",\n      \"key_point\": \"**Le conseil financier est rémunéré « au succès ».** Son intérêt est donc aligné avec celui du client : le deal doit se faire (et au meilleur prix pour son camp).\",\n      \"info\": \"Une **grosse opération** peut mobiliser jusqu'à ~**une dizaine d'intervenants par camp**, soit ~**une cinquantaine de personnes** étroitement impliquées dans l'exécution — hors équipes internes de l'acheteur et du vendeur.\"\n    },\n    {\n      \"anchor\": \"s1-5\",\n      \"title\": \"5️⃣ Vendre une société : gré à gré vs enchères\",\n      \"content\": \"Vendre une société suit un **process**. Deux grandes familles : le **gré à gré** (discret) et l'**enchère** (concurrentiel) — avec de multiples variantes entre les deux.\\n\\n**🤫 LE GRÉ À GRÉ (négociation privée)** — généralement **deux parties seulement** (le vendeur ↔ un candidat-acheteur). Étapes habituelles :\\n1. **NDA** (*Non Disclosure Agreement* / accord de confidentialité) : préparé par les avocats, imposé à l'acheteur pour protéger le vendeur (confidentialité, destruction/retour des documents si abandon, non-débauchage du personnel).\\n2. **MOU / Term Sheet** (*Memorandum of Understanding*) : reprise des termes économiques principaux ; document **synthétique de 2-3 pages**, équivalent d'un *term sheet* de prêt bancaire.\\n3. **Formalisation juridique** : rédaction des actes engageants par les avocats.\\n4. **Signing puis Closing**.\\n\\n**✍️ Signing ≠ Closing** (distinction capitale) :\\n- **Signing** = la **signature** des accords… mais **pas encore** leur réalisation.\\n- **Closing** = la **réalisation effective** : le vendeur transmet la propriété des titres, l'acheteur paie le prix.\\n- ⚠️ Beaucoup de deals sont **signés mais jamais « closés »** (souvent à cause des règles de **concurrence**). **Un deal terminé, c'est un deal « closé », pas « signé ».**\\n\\n| Gré à gré | ✅ Avantages | ⚠️ Inconvénients |\\n|---|---|---|\\n| | **Confidentialité** ; **vitesse d'exécution** | Pas d'assurance que l'acheteur ira au bout ; pas d'assurance de vendre **au meilleur prix** |\\n\\n**📣 L'ENCHÈRE (*auction*)** — **un vendeur face à de multiples acheteurs**. Idée centrale : faire **« parler le marché »** pour espérer le **meilleur prix** et **maximiser les chances de succès**. Processus **long et très organisé**, en **deux tours** (Phase I / Phase II), avec de nombreuses variantes et possibilités d'**accélération / préemption**.\\n\\n**📅 Déroulé type (~3 mois)** : `Kick-off (J)` → `1er tour / Phase I → LOI (J+20)` → `2ème tour / Phase II → Offre ferme (J+90)` → `Signing`.\\n\\n**Étapes-clés de l'enchère** :\\n- 📑 **VDD** (*Vendor Due Diligence*) — souvent : rapport comptable/financier sur la cible, commandé et payé par le **vendeur**, remis aux acheteurs (souvent au 2ème tour).\\n- 📄 **Teaser** : page de présentation **anonyme** de la cible pour tester l'intérêt ; **jusqu'à 30-50 teasers** envoyés.\\n- 🔒 **NDA** : qui refuse de le signer **n'entre pas** dans le process.\\n- 📚 **Info Memo** (*Information Memorandum*) : document de **50-100 pages** présentant la société (activités, organisation, performances passées, actionnariat, éventuel business plan) + **lettre de procédure** (instructions et calendrier).\\n- 💌 **LOI / NBO** (*Lettre d'Offre Indicative / Non-Binding Offer*) : offres **non engageantes** sous 2-3 semaines (fondées sur le seul Info Memo). Une *auction* large reçoit souvent **15-20 offres indicatives** → fin de la **Phase I**.\\n- 🎯 **Sélection pour la Phase II** : décidée par le **vendeur** (sur recommandation de sa banque), sur le **prix** et la **crédibilité** de l'offre. Typiquement **4-6 candidats** retenus (assez pour garder la concurrence, pas trop pour rester gérable).\\n- 🔬 **Phase II** : 1 à plusieurs mois — due diligence approfondies, **data room**, contacts management, visites de sites → **offres fermes (engageantes)** en fin de tour.\\n- 📝 **SPA** (*Share Purchase Agreement*) : contrat d'acquisition des titres, reflète l'offre ferme acceptée. **Signing** = signature du SPA ; **Closing** concomitant ou plusieurs mois après.\\n\\n| Enchère | ✅ Avantages | ⚠️ Inconvénients |\\n|---|---|---|\\n| | **Meilleur prix** et offre la plus crédible (concurrence) ; **risque d'échec minimisé** (plusieurs acheteurs) | Process plus **complexe** ; généralement plus **long** ; **confidentialité** plus difficile à préserver |\",\n      \"warning\": \"**Ne JAMAIS confondre *signing* et *closing*.** Le *signing* engage juridiquement, mais le deal n'est réellement bouclé qu'au *closing* (transfert des titres + paiement). Entre les deux, l'obstacle n°1 est l'autorisation des **autorités de concurrence**.\",\n      \"tip\": \"Mémo du choix de process : **prix avant tout → enchère** ; **harmonie + confidentialité → gré à gré**. Et règle empirique : **plus l'entreprise est grosse, plus l'enchère est probable.**\",\n      \"example\": \"**LOI/NBO** mentionne typiquement : un ordre de grandeur de **prix**, le projet de rapprochement, le sort du **management**, le **financement** prévu, les **conditions** souhaitées (garanties…) et le **calendrier** envisagé par l'acheteur.\"\n    },\n    {\n      \"anchor\": \"s1-6\",\n      \"title\": \"6️⃣ La dynamique du process : le vendeur est le patron\",\n      \"content\": \"Un process de vente **n'est pas rigide** et peut évoluer en cours de route :\\n- Démarrer en **gré à gré** puis se transformer en **enchère**.\\n- Voire **s'accélérer** avec une **préemption** avant la fin du calendrier prévu.\\n\\n**👑 Le vendeur est le « patron » du deal.** Sauf le cas particulier des **offres publiques** (traité plus tard), les process de vente :\\n- **Ne sont pas codifiés** par une autorité extérieure.\\n- Sont **décidés par le vendeur** : il choisit le **type de process** et son déroulement, décide de **vendre à qui il veut, quand il veut**, voire **de ne plus vendre** (interrompre le process).\\n\\n**🎚️ De multiples variantes** existent entre le gré à gré pur et l'enchère large — par exemple un process **intermédiaire** avec un **nombre réduit de candidats** admis.\\n\\nCe rôle central impose au vendeur d'être **au clair sur la hiérarchie de ses propres objectifs** (plus facile à dire qu'à faire…) :\\n- Priorité au **prix** avant tout → **l'enchère s'impose**.\\n- Priorité à l'**harmonie** avec l'acheteur + fort impératif de **confidentialité** → **le gré à gré** est privilégié.\\n- Dans tous les cas : prendre le temps, avec sa banque-conseil, de **définir le bon process**.\",\n      \"key_point\": \"**C'est le VENDEUR qui maîtrise le process** (hors offres publiques) : type, calendrier, choix de l'acheteur, et même la décision d'arrêter. Bien hiérarchiser ses objectifs en amont est donc décisif.\",\n      \"info\": \"Règle empirique : **plus l'entreprise est de taille importante, plus la probabilité de l'enchère est forte** — gros deal = plus d'acheteurs potentiels à mettre en concurrence.\"\n    },\n    {\n      \"anchor\": \"s1-7\",\n      \"title\": \"7️⃣ Valoriser : pourquoi, pour qui, et les paramètres-clés\",\n      \"content\": \"**🎯 Pourquoi et pour qui valoriser ?** La valorisation est **utile mais pas au cœur** de la transaction :\\n- Pour le **vendeur** : un ordre de grandeur du prix espéré au moment de mettre en vente.\\n- Pour l'**acheteur** : une référence (forcément théorique) du prix à attendre pour l'emporter.\\n- Sur **titres cotés** : parfois une **attestation d'équité** exigée (offres publiques).\\n\\n🧠 **Le message central** : en M&A, le prix **n'est pas dicté** par une étude théorique de valorisation. Les études ne sont que des **références établies par chacun pour son propre compte** (rarement échangées/débattues). **Le bon prix est celui sur lequel acheteur et vendeur se mettent d'accord.** *(La valorisation sert aussi hors M&A : IPO, recommandations d'analystes, gestion interne des groupes.)*\\n\\n**📐 Quelques paramètres boursiers à maîtriser** :\\n- **Capitalisation boursière** = cours de bourse × nombre d'actions en circulation (≠ montant comptable des capitaux propres).\\n- **Valeur d'Entreprise (VE)** = valeur de **tout** l'actif économique = **Capitalisation boursière + Dette Nette**.\\n- **BPA** (Bénéfice Par Action) = Résultat net / nombre d'actions.\\n- **PER** (*Price Earning Ratio*) = Cours / BPA → combien de fois le cours « contient » le bénéfice. Le PER **monte avec la croissance attendue**, **baisse avec le risque et les taux d'intérêt** ; la plupart des sociétés cotées ont un PER entre **~8 et 30+**.\\n- **Multiples de VE** : **VE/EBITDA** et **VE/EBIT** — gros avantage sur le PER : ils **font abstraction de la structure financière** (l'endettement).\\n\\n**🧮 Exemple chiffré — société DUPONT** (cours 50 €, 10 M d'actions, RN 40 M€, EBITDA 70 M€, dette nette 80 M€) :\\n\\n| Indicateur | Calcul | Résultat |\\n|---|---|---|\\n| **BPA** | 40 M€ / 10 M actions | **4 €/action** |\\n| **Capi boursière** | 50 € × 10 M | **500 M€** |\\n| **VE** | 500 (capi) + 80 (dette nette) | **580 M€** |\\n| **PER** | 50 € / 4 € | **12,5×** |\\n| **VE/EBITDA** | 580 / 70 | **8,3×** |\",\n      \"key_point\": \"**En M&A, le prix résulte d'une NÉGOCIATION, pas d'un rapport de valorisation.** La valo donne une fourchette de référence ; l'accord acheteur-vendeur donne le prix.\",\n      \"tip\": \"**VE/EBITDA et VE/EBIT > PER** pour comparer des sociétés à structures financières différentes : ces multiples gomment l'effet de l'endettement, là où le PER (sur le résultat net, après frais financiers) le subit.\",\n      \"comparison\": \"**VE vs capitaux propres** : la **VE** valorise l'**ensemble** de l'actif économique (toute l'entreprise) ; les **capitaux propres** valorisent ce qui revient aux **actionnaires**. Passage : **Capitaux propres = VE – Dette nette**.\"\n    },\n    {\n      \"anchor\": \"s1-8\",\n      \"title\": \"8️⃣ Les méthodes de valorisation : comparables, DCF & autres\",\n      \"content\": \"**🎯 L'objectif ultime** : un rachat = l'acquisition d'actions (majorité, souvent 100 %). Il faut donc aboutir à une **valeur des capitaux propres** (un **prix par action**).\\n\\n**Deux approches** :\\n- **Directe** : calcul direct de la valeur des **capitaux propres**.\\n- **Indirecte** : d'abord la **VE**, puis **VE – Dette nette = capitaux propres**.\\n\\n**Croisées avec deux grandes familles de méthodes** :\\n- 🔬 **Intrinsèque / fondamentale** : la valeur actuelle des **flux futurs** → surtout le **DCF**, parfois le **DDM**.\\n- 📊 **Comparative / analogique** : comparaison avec des sociétés **comparables** via des **multiples**.\\n\\n👉 En théorie **4 routes**, mais en pratique **2 voies reines** : le **DCF** et les **Comparables**.\\n\\n---\\n\\n**📊 LES COMPARABLES (« comps »)** — déterminer une VE (ou directement les capitaux propres) en appliquant à la cible les **ratios observés** sur des sociétés comparables.\\n- **Échantillon pertinent** — critères : secteur, profil de croissance, taille, géographie, spécificités du modèle, structure financière.\\n- **Ratios** : PER, VE/EBITDA, VE/EBIT… + choisir les bonnes **années de référence** ; moyennes, médianes ou **régressions** (souvent une régression).\\n- **Deux types** : **multiples de marché** (ratios boursiers d'un échantillon de cotées) et **multiples de transactions** (multiples de cessions/acquisitions comparables, *si l'info est disponible*).\\n- *Exemple illustratif du cours : comparables boursiers de **Beneteau, fin 2019**.*\\n\\n| Comparables | ✅ Avantages | ⚠️ Inconvénients |\\n|---|---|---|\\n| | Souvent **facile** à calculer ; références **concrètes** (boursières et/ou M&A) | Choix d'un **échantillon pertinent** complexe ; **ne tient pas compte des spécificités** de l'entreprise (business plan…) |\\n\\n---\\n\\n**💸 LE DCF (*Discounted Cash Flow*)** — actualiser les **Free Cash Flows (FCF)** futurs.\\n- **Étape 1** : VE = **Valeur actuelle des FCF** sur un horizon défini **+ Valeur actuelle de la Valeur Terminale**.\\n- **Étape 2** : **Capitaux propres = VE – Dette nette**.\\n- **FCF** = EBIT (après impôts théoriques) + Amortissements ± Variation du BFR – **Capex**.\\n- **Horizon** : ni trop long ni trop court, **souvent 10 ans** ; business plan indispensable, plusieurs simulations.\\n- **Valeur Terminale** : VE en fin d'horizon = **FCF normalisé / (r − g)** où **r** = taux d'actualisation et **g** = croissance à l'infini (méthode du *cash flow fade*).\\n- **Taux d'actualisation** = le **WACC** (CMPC — Coût Moyen Pondéré du Capital), généralement **celui de la cible**, pas de l'acheteur.\\n- *Exemple illustratif du cours : DCF de la société **Médica, en 2009**.*\\n\\n| DCF | ✅ Avantages | ⚠️ Inconvénients |\\n|---|---|---|\\n| | Conceptuellement **pertinent** (l'entreprise vaut ses flux futurs) ; « **on ouvre le capot** » → on se pose les bonnes questions ; simulations possibles | Moins **aisé** à appréhender ; business plan **difficile** à établir ; résultats parfois **artificiels** (très sensibles au WACC et à la valeur terminale) |\\n\\n---\\n\\n**🧩 LES AUTRES MÉTHODES** (moins universelles, en complément/remplacement) :\\n- **DDM** (*Dividend Discount Model*) : valeur actuelle des **dividendes** futurs (au lieu des FCF). Méthode intrinsèque mais **directe** (donne directement les capitaux propres). Adaptée aux rendements prévisibles (**Utilities**).\\n- **ANR** (Actif Net Réévalué, *NAV*) : valeur estimée de chaque actif/passif. Adapté aux **holdings**, sociétés de portefeuille, fonds d'investissement.\\n- **SOTP** (*Sum Of The Parts*) : évaluer **chaque activité séparément** (avec la méthode adaptée) puis sommer. Idéal pour les **groupes diversifiés**.\",\n      \"info\": \"**FCF** (Free Cash Flow) = flux de trésorerie disponible **avant frais financiers**. **WACC** (Weighted Average Cost of Capital) = coût moyen pondéré de toutes les sources de financement de la firme.\",\n      \"key_point\": \"**4 routes en théorie, 2 voies en pratique : DCF + Comparables.** Le DCF regarde l'**intérieur** (flux futurs propres à la cible) ; les comparables regardent l'**extérieur** (le marché). Les deux convergent rarement vers le même chiffre.\"\n    },\n    {\n      \"anchor\": \"s1-9\",\n      \"title\": \"9️⃣ Synthèse : combiner les méthodes & enjeux de négociation\",\n      \"content\": \"**🌉 Du VE à la valeur des capitaux propres — le « bridge »** : ce passage est **plus complexe qu'il n'y paraît**.\\n- La **valeur** de la dette nette ≠ toujours son **montant comptable** (en pratique on retient souvent le dernier montant comptable connu — « impasse » assumée).\\n- Le passage complet (le **bridge**) dépend aussi d'autres éléments **donnant lieu à négociation** : provisions, **intérêts minoritaires**, impact de la **saisonnalité** de l'activité…\\n- **Primes de contrôle** (cession majoritaire) ou **décotes** (cession minoritaire, illiquidité du titre, décote de holding) : **non intégrées** explicitement dans les méthodes, sans fondement théorique précis → **affaire de négociation**.\\n\\n**🧪 Savoir comparer, combiner et conclure** :\\n- **Rester maître de ses outils** : dans le DCF, vérifier la plausibilité des hypothèses/prévisions ; dans les comparables, vérifier que l'échantillon est **vraiment représentatif** (erreur fréquente : utiliser le PER d'une société qui croît bien plus — ou bien moins — vite que la cible). **GIGO** : *Garbage In, Garbage Out* — données fausses = chiffrage faux.\\n- **Analyser les écarts** : les techniques **convergent rarement** vers un chiffre unique → il faut **croiser** les méthodes, **expliquer les écarts**, éventuellement **privilégier** une méthodologie, et **simuler des fourchettes** par méthode.\\n\\n**🏈 Conclure — le « Football Field »** :\\n- Visualisation pratique des résultats de chaque méthode (barres de fourchettes superposées). *Exemple du cours : Française des Jeux, 2020.*\\n- Conclure sur une **fourchette de confort** avec un **écart d'environ 20-25 % maximum** entre le bas et le haut.\\n- Exemple : valeur de 100 % des actions entre **400 et 500 M€** (soit **40 à 50 € par action**).\\n\\n**⚔️ L'évaluation n'est PAS une science exacte** :\\n- Une valorisation **ne se résume pas à un chiffre** : c'est un ordre de grandeur, une **fourchette de confort**.\\n- En M&A, elle constitue une **arme de négociation** : il n'y a pas d'analyse objective de bonne foi — les **DCF du vendeur et de l'acheteur** ne diront jamais la même chose !\",\n      \"warning\": \"**« Garbage In, Garbage Out » (GIGO)** : des hypothèses ou données erronées mènent mécaniquement à une valorisation fausse — quelle que soit la sophistication du modèle. Toujours challenger l'échantillon de comparables et les hypothèses du DCF.\",\n      \"tip\": \"Le **football field** est l'outil de synthèse à connaître : il superpose les fourchettes de chaque méthode (DCF, comps de marché, comps de transactions…) pour faire émerger une **zone de chevauchement** = la fourchette de confort (écart ~20-25 % max).\",\n      \"key_point\": \"**La valorisation est une ARME de négociation, pas un verdict.** On conclut sur une **fourchette** (≈ 20-25 % d'amplitude), pas sur un chiffre unique — et chaque camp défend la sienne.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Qu'est-ce qui caractérise une opération de M&A, et qu'est-ce qui en est exclu ?\",\n      \"a\": \"Une opération de **M&A** = acquérir/céder un **contrôle** (ou une participation influente), via une **négociation** avec une contrepartie identifiée ou « le marché », menant à des **accords structurés et documentés**. Sont **exclus** : les achats/cessions de blocs **en bourse sans interaction** avec la contrepartie, les **IPO**, et les opérations type OPRA / retraits de cote / demergers. La frontière est floue (ex. **Veolia–30 % de Suez en 2021** : bloc hors bourse négocié, mais sans contrôle ni accords documentés).\"\n    },\n    {\n      \"q\": \"Donne les grands ordres de grandeur du marché du M&A : taille, cyclicité, géographie.\",\n      \"a\": \"**Taille** : ~**4 000 Md$/an** depuis les années 2000 (≈ 2× le PIB français), en croissance de LT (2 000 → 4 000 Md€ entre les années 2000 et 2020). Attention : volumes en **valeur d'entreprise** (dette incluse). **Cyclicité** : du simple au quasi-quintuple — **record ~6 000 Md€ en 2021**, chute à ~**3 600 Md€ en 2022**. **Géographie** (cibles 2021-2022) : **USA ~47 %**, **APAC ~27 %**, **EMEA ~26 %** ; la France ~5 % du mondial.\"\n    },\n    {\n      \"q\": \"Croissance interne vs croissance externe : avantages et inconvénients ?\",\n      \"a\": \"**Interne** : investissements maîtrisés et étalés (usine, R&D, recrutements) ✅, mais **délais longs** et **incertitude** sur le résultat ⚠️. **Externe (M&A)** : on atteint l'objectif **beaucoup plus vite** ✅, mais **investissement soudain et important** + enjeux sur le groupe élargi (finances, pouvoir, actionnariat, culture, intégration) ⚠️. La décision M&A est souvent **opportuniste** (ex. Air Liquide–Airgas, 13 Md$, 2015).\"\n    },\n    {\n      \"q\": \"Pourquoi le conseil financier est-il l'intervenant pivot, et comment est-il rémunéré ?\",\n      \"a\": \"Il accompagne son client (acheteur OU vendeur) **de la conception à la réalisation** : définition du process, info memo, valorisation, lettres d'offres, tactique/négociation, coordination des audits/due diligence, structuration, modélisation, parfois financement et communication. Il est **de facto requis** sur sociétés cotées et d'autant plus présent que le deal est gros. Sa rémunération est **essentiellement « au succès »**, ce qui **aligne ses intérêts** sur ceux du client.\"\n    },\n    {\n      \"q\": \"Gré à gré vs enchère : compare le principe et les avantages/inconvénients.\",\n      \"a\": \"**Gré à gré** = négociation privée à **2 parties** (vendeur ↔ un acheteur). ✅ Confidentialité, vitesse ; ⚠️ pas d'assurance d'aller au bout ni d'obtenir le meilleur prix. **Enchère** = **un vendeur face à plusieurs acheteurs** pour « faire parler le marché », en **2 tours** (Phase I = LOI/NBO non engageantes, ~15-20 reçues → 4-6 retenus ; Phase II = due diligence + offres fermes). ✅ Meilleur prix + risque d'échec minimisé ; ⚠️ plus complexe, plus long, confidentialité difficile. Règle : **plus la cible est grosse, plus l'enchère est probable.**\"\n    },\n    {\n      \"q\": \"Quelle est la différence entre signing et closing — et qui pilote le process ?\",\n      \"a\": \"**Signing** = **signature** des accords (engagement juridique), mais pas la réalisation. **Closing** = **réalisation effective** : transfert des titres + paiement du prix. Beaucoup de deals sont **signés mais jamais closés** (souvent à cause des autorités de **concurrence**) — un deal terminé est « closé », pas « signé ». Et hors offres publiques, c'est **le VENDEUR qui est le patron** : il choisit le type de process, le calendrier, l'acheteur, et peut même tout arrêter.\"\n    },\n    {\n      \"q\": \"Cite les deux méthodes de valorisation reines, leur logique, et comment passer de la VE aux capitaux propres.\",\n      \"a\": \"Les **2 voies** (sur 4 théoriques) : le **DCF** — actualisation des **Free Cash Flows** futurs au **WACC** (VE = VA des FCF + VA de la valeur terminale = FCF normalisé/(r−g)) — qui regarde l'**intérieur** ; et les **Comparables** (multiples PER, VE/EBITDA, VE/EBIT, marché ou transactions) qui regardent l'**extérieur**. Passage : **Capitaux propres = VE – Dette nette**. Autres méthodes : **DDM**, **ANR/NAV**, **SOTP**.\"\n    },\n    {\n      \"q\": \"En M&A, qu'est-ce qui détermine vraiment le prix, et que représente une valorisation ?\",\n      \"a\": \"Le prix résulte d'une **NÉGOCIATION**, pas d'un rapport de valorisation : « le bon prix est celui sur lequel acheteur et vendeur se mettent d'accord ». Une valorisation n'est **pas un chiffre unique** mais une **fourchette de confort** (écart ~20-25 % max, visualisée via le **football field**) et constitue une **arme de négociation** — les DCF du vendeur et de l'acheteur ne diront jamais la même chose. Attention aussi au **bridge** VE → capitaux propres (provisions, minoritaires, saisonnalité, primes de contrôle/décotes) et au principe **GIGO**.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Fusions-Acquisitions (M&A)\",\n    \"Vernimmen — Finance d'entreprise\",\n    \"Les Échos / Refinitiv (volumes et classements de banques d'affaires)\",\n    \"Bain & Company — Global M&A Report 2023\"\n  ],\n  \"statut\": \"✅ Complet — 9 sections (marché, moteurs, intervenants, process gré à gré/enchères, dynamique, valorisation comparables/DCF/autres, synthèse) + 8 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_2_iccf2_ma/semaine_2.json": "{\n  \"code\": \"ICCF2 M&A — Semaine 2\",\n  \"title\": \"🟩 Semaine 2 — Typologie des opérations & schémas de rapprochement\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 2 (M&A)\",\n  \"ref_msa\": \"Cours ICCF2 — Fusions-Acquisitions (M&A)\",\n  \"bases_legales\": \"Structuration des opérations de M&A · régime « de faveur » des fusions · cadre cross-border (Société européenne)\",\n  \"normes\": \"Cadre M&A (Vernimmen) · consolidation par intégration globale (goodwill)\",\n  \"niveau\": \"Intermédiaire — M&A\",\n  \"summary\": \"Toute opération de M&A est un **rapprochement d'entreprises**, mais sa nature dépend de **deux questions seulement** : *qu'achète-t-on* (les **actions** de la cible ou ses **actifs** ?) et *comment paie-t-on* (en **cash** ou en **actions** émises par l'acquéreur ?). Le **facteur différenciant essentiel entre fusion et acquisition est la monnaie de paiement**, pas la fusion juridique qui n'est qu'une technicalité seconde. Un paiement **cash = acquisition** (la cible devient filiale, le vendeur est taxé sur sa plus-value, la **dette nette** grimpe) ; un paiement **en titres = fusion** (échange de titres, **augmentation de capital** de l'acquéreur réservée aux vendeurs, **report d'imposition**, mais **dilution** des actionnaires existants). Chaque structure produit des impacts **contradictoires** sur la valorisation, l'actionnariat, le levier (**dette nette / EBITDA**) et le **BPA/PER** (dilution-relution). Le tout doit *in fine* être justifié par des **synergies** : en M&A, **1 + 1 doit faire plus que 2**.\",\n  \"mnemonics\": \"**La matrice 2×2 du M&A — « SUBSTANCE × PAIEMENT »** : ce qu'on achète (Actions / Actifs) croisé avec comment on paie (Cash / Titres). 👉 Actions + **Cash** = **Acquisition** · Actions + **Titres** = **Fusion** · Actifs + Cash = **Acquisition d'actifs** · Actifs + Titres = **Apport d'actifs**.\\n\\n**Cash vs Titres — l'arbitrage « DILEV »** : le **CASH dilue le LEVier** (alourdit la dette nette) mais **protège** l'actionnariat ; les **TITRES protègent le LEVier** mais **DILuent** les actionnaires. Les deux jouent toujours en sens opposé.\\n\\n**Relution du BPA** : *cash* → relutif si **1/PER cible > coût de la dette après impôt** · *titres* → relutif si **PER acquéreur > PER d'acquisition de la cible**.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s2-1\",\n      \"title\": \"1️⃣ Définitions & typologie : la matrice 2×2 des opérations\",\n      \"content\": \"Dans **tous** les cas de figure, une opération de M&A est un **rapprochement d'entreprises**. Le mot **« fusion »** (en anglais *merger*) n'a toutefois pas le même sens selon l'interlocuteur :\\n\\n| 👤 Interlocuteur | Sens donné à « fusion » |\\n|---|---|\\n| 📰 **Journaliste** | Combinaison de deux sociétés ; mot utilisé indifféremment avec « rapprochement » |\\n| ⚖️ **Avocat** | Combinaison **avec absorption juridique de la cible** (la cible disparaît en tant qu'entité juridique) — point de vue purement juridique |\\n| 💼 **Financier** | Combinaison **en titres**, que la cible soit juridiquement absorbée ou pas — point de vue économique et financier global |\\n\\n👉 **Règle de l'ICCF2** : sauf aspects juridiques ou fiscaux spécifiques, on utilise prioritairement le sens **financier et économique global** du mot « fusion ».\\n\\n**La classification d'ensemble — 4 grandes façons de faire un rapprochement.** Tout se résume à croiser **2 axes** :\\n- 🧱 **Substance rachetée** : la **société-cible elle-même** (on achète ses **actions**) *ou* les **actifs** qui sont dans la cible.\\n- 💳 **Mode de paiement** : en **cash** *ou* en **actions émises par l'acquéreur**.\\n\\n| SUBSTANCE ↓ \\\\ PAIEMENT → | 💵 CASH | 📜 ACTIONS (titres de l'acquéreur) |\\n|---|---|---|\\n| **ACTIONS de la cible** | « **ACQUISITION** » | « **FUSION** » (opération en titres) |\\n| **ACTIFS de la cible** | **Acquisition d'actifs** | **Apport (partiel) d'actifs** |\\n\\nLes structures **les plus courantes** rachètent la cible elle-même (ses **actions**). Les schémas sur **actifs** existent mais sont **moins fréquents**.\",\n      \"key_point\": \"**Le facteur différenciant essentiel entre fusion et acquisition, c'est la monnaie de paiement** (le mode de rémunération du vendeur) : **actions ou cash**. La fusion juridique éventuelle (au sens strictement juridique) est une considération **un peu seconde**. Nb : une fusion peut ne pas être à 100 % en titres et inclure une **composante cash**.\",\n      \"example\": \"🔵 **LVMH rachète Tiffany & Co (début 2021)** : payé principalement en cash → on parle d'**acquisition**.\\n🟢 **Worldline prend le contrôle d'Ingenico (annonce fin 2020)** : actionnaires d'Ingenico payés principalement en **titres Worldline** → on parle de **fusion**.\",\n      \"tip\": \"Pour ne jamais te tromper : pose-toi **deux questions seulement** — *qu'est-ce que j'achète* (actions vs actifs) et *comment je paie* (cash vs titres) ? Les deux réponses te donnent directement la case de la matrice 2×2.\"\n    },\n    {\n      \"anchor\": \"s2-2\",\n      \"title\": \"2️⃣ Les grands schémas de rapprochement (cash, titres & autres)\",\n      \"content\": \"**🅰️ Les opérations en cash (les acquisitions).**\\n- L'acquisition est **payée en cash** pour prendre le contrôle (jusqu'à **100 %** du capital) ; la société rachetée devient **filiale** du groupe acquéreur.\\n- L'**expression du prix est simple** : un montant absolu (*ex. 500 M€ pour tout le capital*) ou un prix par action (*ex. 78 € par action*).\\n- **Conséquences** : transfert de cash de l'acheteur au vendeur, opération habituellement **taxable** pour le vendeur (impôt sur les plus-values).\\n- **En pratique** : schéma habituel des acquisitions **petites/moyennes** (add-on acquisitions, programmes de **build-up**) par rapport à la taille de l'acquéreur, et des **LBO**.\\n\\n**🅱️ Les opérations en titres (fusions — *mergers*).**\\n- Le vendeur **apporte la cible** à l'acheteur ; le prix **n'est plus un montant fixe** car la rémunération se fait en **actions nouvelles** émises par l'acheteur (**échange de titres**).\\n- Financièrement, une opération en titres ≡ une **acquisition en cash + augmentation de capital simultanée** de l'acquéreur, réservée aux actionnaires vendeurs de la cible.\\n- Transaction **équivalente** pour les actionnaires de A et de B : *que A absorbe B ou que B absorbe A, le résultat est le même* (en théorie).\\n- **Pas d'impact fiscal immédiat** pour le vendeur (pas de cash reçu) → **report d'imposition**.\\n- **En pratique** : schéma habituel des **grandes opérations** (*jumbo deals*) — territoire privilégié des **offres publiques** (traitées plus tard).\\n\\n```\\nINITIALEMENT : Acquéreur — — — Cible (100% aux actionnaires initiaux de la cible)\\nACQUISITION  : Acquéreur ──cash──▶ détient 100% de la Cible (filiale)\\nFUSION       : Acquéreur émet des actions ──▶ ex-actionnaires de la cible deviennent actionnaires de l'Acquéreur ; la Cible est intégrée\\n```\\n\\n**©️ Les autres schémas possibles.**\\n- **Fusion-absorption dès le rapprochement** : économiquement/financièrement **équivalente** à une opération en titres, mais la cible n'est **pas** détenue à 100 % comme filiale — elle est **immédiatement absorbée** (l'acquéreur intègre directement actifs et passifs de l'ex-cible). Bénéfice fréquent du **régime « de faveur »** des fusions.\\n- **Apport d'actifs** : apport d'**actifs** (et non d'actions) rémunéré en **titres de l'acquéreur** ; **équivalent à une fusion**. Utilisé surtout dans les **fusions partielles** et les **restructurations internes** (création d'une holding de tête, filialisation d'activités). Habituellement **neutre fiscalement** (régime de faveur, report d'imposition).\",\n      \"info\": \"**Détenir 100 % vs absorber : une technicalité seconde.** Économiquement et financièrement, détenir 100 % du capital d'une filiale ou détenir directement ses actifs et passifs **ne change strictement rien**. La fusion juridique post-rapprochement peut intervenir **immédiatement, plus tard ou jamais** — choix guidé surtout par des considérations de **gestion interne** (notamment fiscales).\",\n      \"comparison\": \"**Cash vs Titres — fiscalité du vendeur.** En **cash** : opération **taxable** (impôt sur la plus-value du vendeur). En **titres** : pas de cash reçu → **report d'imposition** (le plus souvent **régime de faveur** des fusions). C'est l'une des raisons pour lesquelles les vendeurs n'ont pas toujours la même préférence que les acheteurs.\"\n    },\n    {\n      \"anchor\": \"s2-3\",\n      \"title\": \"3️⃣ Impacts essentiels : valorisation, actionnariat & levier financier\",\n      \"content\": \"**💰 Impact sur la valorisation et la taille.**\\n- **En cash** : la valorisation de la cible **en stand-alone** est essentielle ; le prix s'exprime en montant absolu ou par action ; la valorisation de l'**acquéreur n'entre pas** dans la transaction. À la valeur de marché et hors synergies, la **valeur des capitaux propres** de l'acquéreur est **inchangée** avant/après : le groupe a plus d'actif économique, mais aussi **plus de dette nette** (l'acquisition a été financée par du cash). ⚠️ On raisonne ici en **valeur**, pas en montants comptables.\\n- **En titres** : c'est le **poids relatif** des deux sociétés qui compte ; les valorisations individuelles pèsent moins, et c'est la **parité d'échange** qui devient clé. A ne paie pas « 100 € par action B » : A crée **X actions de A** pour **Y actions de B** → la **parité « X pour Y »**. Une composante cash redonne de l'importance aux valeurs stand-alone. Contrairement à l'acquisition, la valeur des capitaux propres de l'acquéreur **augmente mécaniquement** (création d'actions nouvelles = **augmentation de capital**).\\n\\n**👥 Impact sur l'actionnariat.**\\n- **Acquisition en cash** : **aucun changement** — les actionnaires de la cible ne reçoivent que du cash, le capital de l'acquéreur reste inchangé.\\n- **Fusion (titres)** : **nouvelle structure actionnariale** — les ex-actionnaires de la cible rejoignent le groupe combiné. Les actionnaires de l'acquéreur sont **forcément dilués**. Le **poids relatif** des deux collèges d'actionnaires est **négocié en tant que tel** et peut **bouleverser le contrôle** du nouveau groupe.\\n\\n**🏦 Impact sur la situation financière (endettement).**\\n\\n| Structure | Nouvelle dette nette du groupe combiné |\\n|---|---|\\n| 💵 **Cash** | Σ dettes nettes des deux sociétés **+ cash déboursé** pour l'acquisition |\\n| 📜 **Titres (pur)** | Σ dettes nettes des deux sociétés (**pas d'impact** du fait du paiement en titres) |\\n| 🔀 **Titres + composante cash** | Σ dettes nettes des deux sociétés **+ composante cash** |\\n\\n- Le **ratio clé** de pilotage du DAF : **dette nette / EBITDA** (base **pro forma** du nouveau groupe combiné).\\n- Une opération très importante peut **exclure une structure 100 % cash** si le levier attendu se dégrade trop (ou si l'acquéreur ne peut mobiliser assez de cash/dette). 👉 C'est pourquoi **la plupart des jumbo deals se font essentiellement en titres**.\",\n      \"key_point\": \"**Dilution actionnariale et levier financier jouent toujours en sens OPPOSÉ.** Le **cash** protège l'actionnariat mais **alourdit le levier** ; les **titres** préservent le levier mais **diluent** les actionnaires. Toute la structuration consiste à arbitrer entre ces deux contraintes.\",\n      \"warning\": \"Attention à ne pas confondre **valeur des capitaux propres** et **capitaux propres comptables**. Dans toute cette analyse, on raisonne sur l'**évolution de la valeur** des capitaux propres (logique de marché), pas sur l'impact comptable de l'acquisition sur les capitaux propres consolidés.\"\n    },\n    {\n      \"anchor\": \"s2-4\",\n      \"title\": \"4️⃣ Dilution / relution du BPA, impact sur le PER & goodwill\",\n      \"content\": \"**📈 Dilution / relution du BPA.**\\n- **Opération en cash** : toutes choses égales par ailleurs, il y a **relution** (hausse) du BPA pro forma si **1/PER d'acquisition de la cible > coût de la dette après impôt**.\\n  - *Exemple* : cible achetée à un **PER de 18** → **1/PER = 5,6 %**. Acquéreur emprunte à **7 %**, soit **7 % × (1 − 30 %) = 4,9 %** après impôt (IS à 30 %). Comme **5,6 % > 4,9 %**, le BPA pro forma **monte** (relution).\\n- **Opération en titres (fusion)** : relution du BPA si **PER de l'acquéreur > PER d'acquisition de la cible**.\\n  - *Exemple* : société cotée à un **PER de 25** qui rachète une société à un **PER de 18** → le BPA pro forma **monte automatiquement**.\\n\\n**🪞 Impact sur le PER — le piège de la communication.**\\n- La relution du BPA est **souvent communiquée** dans les annonces de deals (« opération relutive » = présentée comme attractive). ⚠️ Mais ce **n'est PAS** la preuve d'une opération **créatrice de valeur**.\\n- En opération en titres, si le BPA monte **parce que le PER de l'acquéreur > celui de la cible**, alors le **PER pro forma combiné BAISSE** par rapport au PER initial de l'acquéreur. C'est logique : une société en **forte croissance** qui rachète une société en croissance **plus faible** obtient un profil **intermédiaire** → un PER **entre les deux**.\\n- 🧮 **Calcul simple** (titres, hors synergies) : le **PER du groupe combiné = moyenne pondérée des PER** des deux sociétés, pondérée au **prorata des résultats nets** (le PER de la cible étant calculé sur le **prix d'offre**).\\n- 👉 La relution du BPA « oublie soigneusement » de dire que le **PER combiné baisse**. Le mérite de la relution n'a de sens, en bonne finance, **que si le PER du nouveau groupe est maintenu** — ce qui n'est pas garanti.\\n\\n**📒 Aspects juridiques & comptables.**\\n- Le **prix de transaction** et la **valeur comptable** retenue dans les comptes ne sont pas forcément identiques : valeur d'entrée ≈ **prix de transaction** quand les actionnaires de l'acquéreur et de la cible **diffèrent** ; sinon on retient la **valeur comptable des fonds propres** de la cible (cas des opérations **intra-groupes**).\\n- Les **fusions cross-border** sont juridiquement **plus problématiques** ; un cadre européen progresse (statut de **« Société européenne »**).\\n- **🧾 Goodwill (écart d'acquisition)** dans les comptes consolidés (intégration globale) = différence (à certains ajustements de réévaluation près) entre le **prix payé** et la **valeur comptable des capitaux propres** de la cible :\\n  - différence **positive** (cas général) → **goodwill** à l'**actif** ;\\n  - différence **négative** → **badwill** au **passif**.\\n  - Les CAC peuvent imposer une **dépréciation** du goodwill (impact négatif au résultat, en général en « exceptionnel ») si la cible **ne vaut plus son prix**.\",\n      \"tip\": \"**Mémo relution** : en **cash**, on compare **1/PER cible** au **coût de la dette après impôt** ; en **titres**, on compare directement les **deux PER** (acquéreur vs cible). Si le « rendement » de ce qu'on achète dépasse le coût de ce avec quoi on paie → **relution**.\",\n      \"info\": \"**Lecture d'un bilan en audit/analyse** : des **goodwills importants** témoignent d'une politique active de **croissance externe** ; des **dépréciations de goodwill** trahissent des acquisitions **décevantes** ou **payées trop cher**.\",\n      \"warning\": \"**Relutif ≠ créateur de valeur.** Les calculs de relution/dilution du BPA, aussi **partiels et inexacts** soient-ils pris isolément, restent **incontournables** en pratique — surtout pour leur **usage médiatique**. Ne jamais conclure à la création de valeur sur ce seul critère.\"\n    },\n    {\n      \"anchor\": \"s2-5\",\n      \"title\": \"5️⃣ Cas Dupont & Cie : combiner les impacts (cash vs titres)\",\n      \"content\": \"Madame **Dupont**, CEO de **DUPONT S.A.** (elle détient **25 %**, flottant 75 %), envisage un rapprochement avec son concurrent **DURAND S.A.** (détenu à **50 %** par M. Durand, flottant 50 %). Hypothèses simplificatrices : opération **au cours de bourse** (100 %, **sans prime**), **pas de synergies**, DUPONT emprunte à **4 % après impôt**.\\n\\n**Chiffres-clés (en M€ sauf mention) :**\\n\\n| Donnée | DUPONT | DURAND |\\n|---|---|---|\\n| Cours action (€) | 10 | 50 |\\n| # actions (millions) | 100 | 10 |\\n| Capitalisation boursière | 1 000 | 500 |\\n| Dette financière nette | (10) | 80 |\\n| Valeur d'Entreprise (VE) | 990 | 580 |\\n| EBITDA | 90 | 70 |\\n| Résultat Net | 50 | 40 |\\n| BPA (€) | 0,5 | 4 |\\n| **PER** | **×20** | **×12,5** |\\n\\n**Comparatif des deux structures :**\\n\\n| Critère | 💵 **CASH (acquisition)** | 📜 **TITRES (fusion)** |\\n|---|---|---|\\n| **Expression du prix** | 50 € par action DURAND | **5 actions DUPONT pour 1 action DURAND** (DUPONT cote 10 €, DURAND 50 €) |\\n| **Capi boursière DUPONT** | Inchangée = **1 000 M€** (DUPONT paie 500 M€ en cash) | DUPONT crée **5 × 10 = 50 M** actions nouvelles → **150 M** actions ; capi = **1 500 M€** |\\n| **Actionnariat** | **Aucun changement** | Mme Dupont **25/150 = 16,7 %** · M. Durand **(5×5)/150 = 16,7 %** · Marché **66,6 %** |\\n| **Dette nette pro forma** | (10) + 80 + **500** = **570 M€** | (10) + 80 = **70 M€** |\\n| **Levier (DN/EBITDA)**, EBITDA pf = 160 | 570/160 = **×3,6** | 70/160 = **×0,4** |\\n| **BPA pro forma** | (50 + 40 − 500×4 %)/100 = **0,7 €** → relution **+40 %** | (50 + 40)/150 = **0,6 €** → relution **+20 %** |\\n| **PER pro forma** | 1 000/70 = **×14,3** → **−29 %** vs ×20 | 1 500/90 = **×16,7** → **−17 %** vs ×20 |\\n\\n**🎯 Grands enseignements.**\\n- Le **100 % cash** **protège** la position de premier actionnaire de Mme Dupont (**25 %**) mais **alourdit fortement le levier** (**≈ ×4**), niveau qui peut être **rédhibitoire**.\\n- Le **100 % titres** a les effets **inverses** : levier très faible (**×0,4**) mais met Mme Dupont **à égalité** avec M. Durand (16,7 % chacun) — perte de leadership, envisageable **seulement** s'ils acceptent de **partager le pouvoir**.\\n- 👉 **Dilution actionnariale et levier jouent de façon opposée** dans les deux structures.\\n\\n**🔀 Le compromis mixte.** Ex. **2 actions DUPONT + 30 € cash par action DURAND** → revient toujours à 50 €/action, soit **40 % titres / 60 % cash**. Résultat : Mme Dupont **20,8 %** (25/120), M. Durand **8,3 %** ((5×2)/120), **levier = ((10)+80+300)/160 = ×2,3**. 👉 Mme Dupont **reste clairement le premier actionnaire** et le levier reste **acceptable**.\",\n      \"example\": \"**🧾 Le goodwill est identique dans les deux structures.** En supposant que DURAND a des **capitaux propres comptables de 300 M€**, le goodwill dans les comptes consolidés de DUPONT serait de **500 − 300 = 200 M€** — quelle que soit la façon de payer (cash, titres ou mixte).\",\n      \"key_point\": \"Le cas Dupont-Durand est la **synthèse chiffrée** de la semaine : une même cible, deux structures, des impacts **diamétralement opposés** sur actionnariat (25 % vs 16,7 %) et levier (×3,6 vs ×0,4). La **structure mixte** est souvent le **point d'équilibre** entre contrôle préservé et endettement maîtrisé.\"\n    },\n    {\n      \"anchor\": \"s2-6\",\n      \"title\": \"6️⃣ Les synergies : fondement, mesure & partage\",\n      \"content\": \"Le principe industriel de base : le **nouveau groupe élargi doit fonctionner plus efficacement** que la somme des deux entités prises isolément. En M&A, **1 + 1 doit être supérieur à 2** ! Au plan financier, les synergies sont le plus souvent **indispensables** pour justifier la **prime** payée aux actionnaires de la cible (sujet développé plus tard, dans les offres publiques).\\n\\n**🔬 Deux grands types de synergies :**\\n\\n| Type | Définition | Caractère |\\n|---|---|---|\\n| 📈 **Synergies de revenus** | Chiffre d'affaires **supplémentaire** annuel (au-delà de la somme des deux CA initiaux) que le rapprochement peut générer | Le plus **délicat à justifier/prévoir** ; généralement la **part la moins importante** du total |\\n| 💸 **Synergies de coûts** | **Économies** annuelles de coûts générées par le rapprochement (*ex. une seule Direction Financière suffit*) | En général la **part principale** et la **moins complexe** à prévoir |\\n\\n**📐 Nature et mesure.**\\n- Tout rapprochement significatif exige un **calendrier annuel précis** de génération des synergies (revenus + coûts), souvent **rendu public**.\\n- On calcule ensuite habituellement la **valeur actuelle** des synergies annuelles futures attendues (mode de calcul détaillé plus tard, avec les offres publiques).\\n- 💎 **Grand précepte** : **la valeur des synergies doit être au moins égale à la prime payée**.\\n\\n**🤝 Le partage des synergies.**\\n- Il faut s'accorder sur **à qui revient le bénéfice** des synergies : acheteur ou vendeur ?\\n- La **reconnaissance de leur origine** pendant la négociation (viennent-elles de la cible ? de l'acquéreur ?) **impacte directement le prix ou la parité** négociée.\\n- Le partage est un **élément complémentaire de négociation important**, surtout dans les transactions sur **titres cotés** (offres publiques).\",\n      \"key_point\": \"**La valeur des synergies doit être au moins égale à la prime payée.** C'est le pivot financier de tout rapprochement : sans synergies suffisantes, la prime versée aux actionnaires de la cible **détruit de la valeur** pour l'acquéreur.\",\n      \"tip\": \"**Mémo synergies** : **coûts = gros & sûr** (part principale, plus facile à prévoir) ; **revenus = petit & incertain** (part minoritaire, le plus dur à justifier). En audit/diligence, soyez les plus sceptiques sur les **synergies de revenus** annoncées.\",\n      \"info\": \"L'**origine** des synergies est un enjeu de négociation : si elles proviennent majoritairement de la **cible**, le vendeur tentera de capter une partie de leur valeur via une **prime plus élevée** ; si elles proviennent de l'**acquéreur**, ce dernier cherchera à les **garder** pour lui.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Quel est le facteur différenciant essentiel entre une « fusion » et une « acquisition » au sens financier ?\",\n      \"a\": \"C'est la **monnaie de paiement** (le mode de rémunération du vendeur) : **cash → acquisition**, **actions/titres → fusion**. La fusion juridique éventuelle (absorption de la cible) n'est qu'une **considération seconde**. Selon l'interlocuteur, « fusion » varie : combinaison vague (journaliste), absorption juridique (avocat), opération en titres au sens économique (financier). Une fusion peut d'ailleurs inclure une **composante cash**.\"\n    },\n    {\n      \"q\": \"Décris la matrice 2×2 des types d'opérations (substance × paiement).\",\n      \"a\": \"On croise **ce qu'on achète** (les **actions** de la cible vs ses **actifs**) avec **comment on paie** (**cash** vs **titres**). Résultat : Actions+Cash = **Acquisition** · Actions+Titres = **Fusion** (opération en titres) · Actifs+Cash = **Acquisition d'actifs** · Actifs+Titres = **Apport (partiel) d'actifs**. Les schémas sur **actions** sont les plus courants ; les schémas sur **actifs** existent mais sont plus rares.\"\n    },\n    {\n      \"q\": \"Quel est l'impact d'une opération en cash vs en titres sur la dette nette et le levier du groupe combiné ?\",\n      \"a\": \"**Cash** : nouvelle dette nette = Σ dettes nettes des deux sociétés **+ cash déboursé** → le **levier (dette nette/EBITDA) augmente**. **Titres (pur)** : **pas d'impact** sur la dette nette → nouvelle dette nette = Σ des deux dettes nettes (levier préservé). **Titres + composante cash** : Σ des deux dettes nettes **+ composante cash**. Le ratio de pilotage du DAF est la **dette nette/EBITDA pro forma**. C'est pourquoi les **jumbo deals** se font surtout **en titres** (sinon levier rédhibitoire).\"\n    },\n    {\n      \"q\": \"Quand une opération est-elle relutive sur le BPA, en cash puis en titres ?\",\n      \"a\": \"**En cash** : relution si **1/PER d'acquisition de la cible > coût de la dette après impôt**. Ex. cible à PER 18 → 1/PER = 5,6 % ; dette à 7 % soit 7 %×(1−30 %) = 4,9 % après impôt → 5,6 % > 4,9 % donc **relutif**. **En titres** : relution si **PER de l'acquéreur > PER d'acquisition de la cible** (ex. acquéreur à ×25 rachetant une cible à ×18).\"\n    },\n    {\n      \"q\": \"Pourquoi une opération relutive sur le BPA n'est-elle pas forcément créatrice de valeur ?\",\n      \"a\": \"Parce qu'en opération en titres, si le BPA monte **parce que le PER de l'acquéreur > celui de la cible**, le **PER pro forma combiné BAISSE** (profil de croissance intermédiaire). Le PER combiné ≈ **moyenne pondérée des PER** au prorata des **résultats nets**. La relution n'a de sens **que si le PER du nouveau groupe est maintenu**, ce qui n'est pas garanti. La relution du BPA est surtout un **argument de communication**, incontournable mais **partiel**.\"\n    },\n    {\n      \"q\": \"Cas Dupont-Durand : compare actionnariat et levier en 100 % cash vs 100 % titres.\",\n      \"a\": \"**100 % cash** : actionnariat **inchangé** (Mme Dupont reste à **25 %**) mais dette nette = (10)+80+500 = **570 M€**, levier **570/160 = ×3,6** (≈4, potentiellement rédhibitoire). **100 % titres** : DUPONT crée 50 M actions (5 pour 1) → 150 M actions ; Mme Dupont tombe à **16,7 %** (à égalité avec M. Durand), mais dette nette = **70 M€**, levier **70/160 = ×0,4**. Conclusion : **dilution et levier jouent en sens opposé** ; une structure **mixte** (ex. 2 actions + 30 € cash → 40 % titres/60 % cash) donne Mme Dupont à 20,8 % et levier ×2,3 — bon compromis.\"\n    },\n    {\n      \"q\": \"Qu'est-ce que le goodwill, et combien vaut-il dans le cas Dupont-Durand ?\",\n      \"a\": \"Le **goodwill** (écart d'acquisition) en comptes consolidés (intégration globale) = différence (hors ajustements de réévaluation) entre le **prix payé** et la **valeur comptable des capitaux propres** de la cible. Positif → **goodwill à l'actif** ; négatif → **badwill au passif**. Il peut être **déprécié** par les CAC si la cible ne vaut plus son prix. Cas Dupont-Durand : DURAND racheté **500 M€** avec capitaux propres comptables **300 M€** → goodwill = **500 − 300 = 200 M€**, **identique** quelle que soit la structure (cash, titres ou mixte).\"\n    },\n    {\n      \"q\": \"Quels sont les deux types de synergies et quel est le grand précepte financier qui les gouverne ?\",\n      \"a\": \"**Synergies de revenus** (CA supplémentaire au-delà de la somme des deux CA — les plus **difficiles à justifier**, part **minoritaire**) et **synergies de coûts** (économies, ex. une seule Direction Financière — part **principale** et plus facile à prévoir). On en calcule la **valeur actuelle** des flux annuels futurs. Grand précepte : **la valeur des synergies doit être au moins égale à la prime payée**. Leur **partage** (acheteur/vendeur) et leur **origine** sont des enjeux de négociation qui impactent le prix ou la parité. En M&A, **1 + 1 doit faire plus que 2**.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Fusions-Acquisitions (M&A)\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (typologie, schémas de rapprochement, impacts valo/actionnariat/levier, BPA-PER & goodwill, cas Dupont-Durand, synergies) + 8 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_2_iccf2_ma/semaine_3.json": "{\n  \"code\": \"ICCF2 M&A — Semaine 3\",\n  \"title\": \"🟧 Semaine 3 — Les grands enjeux de la négociation\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 2 (M&A)\",\n  \"ref_msa\": \"Cours ICCF2 — Fusions-Acquisitions (M&A)\",\n  \"bases_legales\": \"Pratique contractuelle M&A (SPA, GAP) · droit français de la concurrence (Autorité de la concurrence)\",\n  \"normes\": \"Cadre M&A (Vernimmen)\",\n  \"niveau\": \"Intermédiaire — M&A\",\n  \"summary\": \"Le prix d'une opération de M&A ne tombe **jamais** du ciel : il se construit **progressivement** au fil du process, depuis une **Valeur d'Entreprise (VE)** approximative jusqu'au **prix des titres** (valeur des capitaux propres) effectivement payé. Cette semaine décortique cette mécanique : le fameux **« bridge »** entre VE et valeur des titres (dette nette, BFR, retraites, minoritaires…), le **délai entre signing et closing** et ses risques, les **mécanismes d'ajustement de prix** (locked box vs comptes de clôture), les **autres leviers** (earn-out, vendor loan, paiement en titres…), les **due diligences** (audit d'acquisition) qui objectivent le débat, et enfin la **structuration juridique** des accords (NDA → Info Memo → SPA → GAP → signing/closing) avec le **contrôle de la concurrence** en toile de fond. Le fil rouge : *chaque euro concédé sur le bridge se répercute à 100 % sur le prix payé pour les actions.*\",\n  \"mnemonics\": \"**VE → Titres, le bridge en 1 ligne** : `Valeur des CP = VE − Bridge`, où **Bridge = Dette nette retenue + Autres ajustements** (retraites, minoritaires, dépollution, provisions, hors-bilan…). 🎯 **Mémo « DBPM »** des 4 grands postes du bridge : **D**ette nette · **B**FR (normatif) · **P**rovisions/retraites · **M**inoritaires. 🔒 **Locked box vs Completion accounts** : *box fermée* = prix gelé au signing (Europe) ; *comptes de clôture* = prix ajustable a posteriori (USA). ⚖️ **GAP = « DBC + durée »** : **D**e minimis (seuil unitaire) · **B**asket (franchise globale) · **C**ap (plafond) · + **durée** de garantie.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s3-1\",\n      \"title\": \"1️⃣ De la valeur d'entreprise au prix des titres : le « bridge »\",\n      \"content\": \"Dans un process de vente, **le prix se fixe de manière très progressive** — il ne sort pas d'un chapeau. 🎩\\n\\n**📈 La cascade du prix** :\\n\\n| Étape | Ce qu'on a | Précision |\\n|---|---|---|\\n| 1. Offre préliminaire (LOI / NBO) | **VE indicative** (ou fourchette) | Approximative — issue de l'Info Memo |\\n| 2. Due diligences (2e tour) | **VE finale** | Affinée, incluse dans l'offre ferme |\\n| 3. Calcul du **bridge** | **Valeur des titres** = VE − bridge | Pont VE → capitaux propres |\\n| 4. Signing / post-closing | **Prix définitif** | Après ajustements éventuels |\\n\\n**⚠️ Sur les fourchettes** : les vendeurs n'apprécient **pas** les fourchettes de VE dans les lettres d'offre indicatives… et quand ils en reçoivent une, ils ne retiennent que le **bas** de la fourchette ! Au nom de la transparence, le vendeur demande aussi presque toujours à l'acheteur de détailler son **bridge**.\\n\\n**🌉 Qu'est-ce que le bridge ?** C'est le pont qui fait passer de la **VE** (chiffre global) à la **valeur des capitaux propres** (= le prix des actions, base 100 % du capital). Formule fondamentale :\\n\\n```\\nValeur des capitaux propres = VE − Bridge\\n```\\n\\nLe bridge se décompose en **2 grandes catégories** :\\n1. 🏦 Le calcul de la **dette financière nette** elle-même (avec la problématique du **BFR**)\\n2. ➕ Les **autres facteurs** (provisions retraites, minoritaires, hors-bilan, etc.)\",\n      \"key_point\": \"**Tout € concédé sur le bridge a un impact entier et direct sur le prix payé pour les actions.** Le bridge peut sembler « technique », mais il fait l'objet d'une **négociation âpre** avec des enjeux financiers potentiellement énormes. À ne JAMAIS sous-estimer au plus haut niveau.\",\n      \"info\": \"**VE vs valeur des titres** — la VE (Enterprise Value) valorise l'**actif économique** (l'outil opérationnel), indépendamment de la façon dont il est financé. La valeur des titres (Equity Value) est ce qui revient aux **actionnaires**, une fois la dette nette et les autres ajustements déduits. Le bridge est littéralement le passage de l'une à l'autre.\",\n      \"tip\": \"**Mémo bridge** : `Valeur des CP = VE − (Dette nette retenue + Autres ajustements)`. Si on te donne la VE et qu'on te demande le prix des titres, cherche systématiquement les 4 postes **DBPM** : Dette, BFR, Provisions/retraites, Minoritaires.\"\n    },\n    {\n      \"anchor\": \"s3-2\",\n      \"title\": \"2️⃣ Les composantes du bridge : dette nette, BFR & autres ajustements\",\n      \"content\": \"Ici, **rien ne coule de source** : chaque ligne se négocie, souvent durement, car les points de vue acheteur/vendeur sont opposés. 🥊\\n\\n**🏦 Ajustements de la dette financière nette** :\\n- **Date de référence** : derniers comptes connus ? date à convenir ensemble ?\\n- **Dette brute** : en bonne finance, **toutes** les dettes financières (y compris **leasing**).\\n- **Définition du cash** (puisque dette nette = dette brute − cash) : le cash pur (liquidités bancaires) ? + les titres de placement « liquides » ? Et le **cash bloqué dans une filiale étrangère** non rapatriable ? → tout est interprétation et négociation.\\n\\n**🔄 La problématique du BFR** — le BFR peut **fausser** la dette nette de clôture :\\n\\n| Situation | Effet sur le cash | Effet sur la dette nette constatée |\\n|---|---|---|\\n| BFR anormalement **faible** en fin d'année | consomme **moins** de cash | dette nette **minorée** (artificiellement) |\\n| BFR anormalement **élevé** en fin d'année | consomme **plus** de cash | dette nette **majorée** |\\n\\n➡️ Solutions négociées : retenir un **BFR normatif** (normalisé), un **BFR moyen** de l'année (souvent retenu), ignorer le sujet d'un commun accord, ou prévoir un **ajustement automatique post-closing** sur états confirmatoires.\\n\\n**➕ Autres ajustements habituels du bridge** :\\n- 🧓 **Engagements retraites** (sujet souvent le **plus important**) : provisions existantes **+ insuffisances** → considérées comme de la **dette** (dépenses futures) → à déduire du prix des titres.\\n- 👥 **Intérêts minoritaires** : la VE est globale (minoritaires inclus) → on **ajoute** leur valeur au bridge pour aboutir aux CP de la maison-mère.\\n- 📑 **Engagements hors-bilan** : garanties données/reçues, **put options**… à intégrer.\\n- ⚖️ **Autres provisions** (fiscalité, restructuration, **dépollution de sites**, mises aux normes…) : à analyser comme probabilité de dépense future.\\n- 🧮 **Et bien d'autres** : impôts différés, immobilier, instruments dilutifs… La liste est longue.\",\n      \"example\": \"**📊 Exemple chiffré complet (M€, signing fin mai)** :\\n\\n| Poste | Montant | Note |\\n|---|---|---|\\n| **Valeur d'entreprise** | **650** | Telle qu'approuvée dans la négo |\\n| Dette bancaire CT + LT | 400 | Comptes 31/12 |\\n| Obligations | 35 | Idem |\\n| Cash et équivalents | (150) | Idem |\\n| = Dette nette comptable | **285** | |\\n| Ajustement cash bloqué | 20 | 50 % de décote sur cash filiale étrangère |\\n| Ajustement BFR | 30 | Écart BFR constaté vs BFR « normatif » |\\n| **= Dette nette retenue** | **335** | Après négo |\\n| Intérêts minoritaires | 20 | 20 % d'un minoritaire (filiale italienne) |\\n| Dépollution de sols | 10 | Tel que convenu |\\n| Engagements retraites | 50 | Provisions 31/12 + insuffisance |\\n| = Total autres ajustements | **80** | |\\n| **= Total Bridge VE / Valeur CP** | **415** | 335 + 80 |\\n| **➡️ Valeur des capitaux propres** | **235** | **650 − 415** |\\n\",\n      \"warning\": \"**Les points de vue acheteur et vendeur sont diamétralement opposés** sur chaque poste du bridge. Le vendeur veut une dette nette basse et peu d'ajustements (prix des titres élevé) ; l'acheteur veut l'inverse. Ce sont les **conclusions de la due diligence** qui permettent d'objectiver les arguments et d'éclairer le débat.\"\n    },\n    {\n      \"anchor\": \"s3-3\",\n      \"title\": \"3️⃣ Signing → Closing : le délai et ses conséquences\",\n      \"content\": \"Le **signing** (signature du SPA) et le **closing** (transfert effectif de propriété) ne sont **pas toujours simultanés** : un délai peut s'intercaler, avec des conséquences sur le **calendrier** ET sur le **prix final**.\\n\\n**🌍 Motifs EXTERNES du délai** :\\n- 🏛️ **Concurrence** : autorisations préalables des autorités → **raison n°1** des décalages.\\n- 📋 Autres autorisations réglementaires (ex. investissements étrangers en France, secteurs sensibles).\\n- 🗳️ **Assemblées générales** : accord des actionnaires si nécessaire.\\n- 💶 **Financement** : si non sécurisé au signing.\\n- 📉 Évolutions divergentes des **cours de bourse** (titres cotés, si protocolé).\\n- 🌐 Changement macroéconomique/politique → cas typique d'une **clause MAC**.\\n\\n**🏠 Motifs INTERNES du délai** :\\n- 🧾 Besoin de **comptes plus récents** (si prévu aux accords).\\n- 👷 Contraintes du **droit social** (ex. **loi Hamon** en France : information préalable des salariés).\\n- ⚠️ Risque perçu de modification des conditions d'exploitation ou de la situation financière.\\n\\n**🤝 Simultanéité possible** : signing/closing simultanés restent fréquents pour les **transactions privées (non cotées) et midcap** ; plus rares pour les **grandes opérations** (contraintes de concurrence). Dans tous les cas, acheteur et vendeur conviennent **avant le signing** du type de calendrier de fin d'opération.\",\n      \"info\": \"**MAC clause (Material Adverse Change)** — clause protectrice pour l'acheteur lui permettant de **ne pas réaliser l'achat** en cas d'événement « matériel » défavorable dans l'environnement général entre signing et closing. Très **délicate à imposer** au vendeur. Si l'acheteur abandonne, le vendeur peut chercher à imposer une **break-up fee** (commission d'indemnisation).\",\n      \"key_point\": \"**Le délai signing/closing crée une zone de risque** : pendant cette période, le vendeur est encore aux manettes mais l'acheteur a déjà engagé sa parole. D'où la nécessité de clauses de protection (gestion raisonnable, MAC, contrôle de la période intercalaire dans le SPA).\"\n    },\n    {\n      \"anchor\": \"s3-4\",\n      \"title\": \"4️⃣ Ajustements de prix : Locked Box vs Comptes de clôture\",\n      \"content\": \"Deux grandes philosophies pour figer (ou non) le prix entre signing et closing. 🔒 vs 📐\\n\\n**⚖️ Comparatif des deux formules** :\\n\\n| | 🔒 **Locked Box** | 📐 **Comptes de clôture** |\\n|---|---|---|\\n| Principe | Prix **gelé** dans une « boîte fermée » au signing | Prix calculé sur **comptes à une date de référence** (avant ou au closing) |\\n| Ajustements ultérieurs | **Limités** entre signing et closing (souvent juste le « prix du temps ») | Prix **substantiellement ajustable** |\\n| Comptes audités | Pas forcément | **Habituellement requis** (au moins pour la dette nette) |\\n| Date des ajustements | n/a (prix figé) | **Au closing** (si comptes de réf. avant closing) ou **après closing** (si comptes à la date du closing) |\\n\\n**🤔 Comment choisir ?**\\n- ⚖️ Arbitrage entre **confiance** (qualité de l'info, risques signing→closing) et **rapidité d'exécution**.\\n- 🔍 **Accès à l'information** : ex. dans une **OPA**, difficile de changer le prix selon des comptes de clôture.\\n- 🌍 **Tendances** : la **locked box gagne du terrain en Europe** ; les **comptes de clôture sont quasi systématiques aux USA**.\\n- 🤝 **À négocier impérativement** entre acheteur et vendeur.\\n\\n**🛡️ Autres mécanismes liés au calendrier d'exécution** :\\n- 👨‍👧 **Clause de « gestion raisonnable »** (ex-« gestion en bon père de famille ») : oblige le vendeur (encore aux manettes) à gérer la société de façon **courante et raisonnable** jusqu'au closing. Sanction : baisse de prix voire annulation. **À imposer à tout prix** par l'acheteur quand signing et closing sont déconnectés (clause de bon sens, généralement acceptée).\\n- 🌐 **MAC clause** : voir ci-dessus.\",\n      \"comparison\": \"**🔒 Locked Box** = sécurité et rapidité pour le vendeur (prix figé, pas de mauvaise surprise post-closing) ; l'acheteur supporte le risque économique dès la date de la « box ». **📐 Comptes de clôture** = précision pour l'acheteur (le prix reflète la réalité au closing) ; en contrepartie, plus long et plus disputé (audit, calcul de la dette nette à la clôture).\",\n      \"tip\": \"**Réflexe géographique** : deal européen → pense **locked box** ; deal américain → pense **completion / closing accounts**. Et pour une **OPA** sur titres cotés → locked box quasi obligé (on ne peut pas réviser le prix au gré de comptes de clôture).\"\n    },\n    {\n      \"anchor\": \"s3-5\",\n      \"title\": \"5️⃣ Autres leviers de négociation & due diligences\",\n      \"content\": \"**🎛️ Les autres leviers qui rapprochent acheteur et vendeur** — leur but est de **lever des barrières** (obstacles légaux, financiers, fiscaux ou… psychologiques !) et de débloquer une négociation enlisée. ⚠️ **Limite** : ils ne changent généralement **ni la valeur réelle payée**, ni ne transforment un mauvais deal en bon deal.\\n\\n| Levier | Mécanisme |\\n|---|---|\\n| 💵 **Paiement en titres** | Contourne les valorisations individuelles ; aide l'acheteur à se financer |\\n| ⏳ **Paiement différé (vendor loan / crédit vendeur)** | Le vendeur **finance** de facto une partie du prix → permet d'afficher un prix apparent plus élevé |\\n| 📊 **Earn-out** | Prix initial **+ complément** selon la performance future de la cible (ex. secteur Publicité) |\\n| 🔗 **Indexation** | Prix indexé sur l'occurrence d'un événement futur |\\n\\n👉 Autres facteurs à impact **indirect** sur le prix (développés ailleurs) : l'**exclusivité**, la **certitude** de la transaction, les **garanties**, les considérations **ESG**, les termes du **pacte d'actionnaires**.\\n\\n**🔬 LES DUE DILIGENCES (audit d'acquisition)** :\\n\\nExploitation **pluridisciplinaire** par l'acheteur des informations disponibles sur la cible, pour se forger une **opinion sur l'opportunité et les risques** de l'acquisition.\\n\\n**📂 Sources d'information** : domaine public (comptes déposés au greffe) + ce que dévoile le vendeur via la **Data Room** (le plus souvent **virtuelle**), la **management presentation**, les **visites de sites** et les séances de **Q&A**. L'acheteur s'entoure de conseils (banquiers d'affaires, auditeurs, avocats) qui remettent leurs rapports.\\n\\n**🧰 Les différents types de due diligence** :\\n\\n| Type | Objet | Conseils cités |\\n|---|---|---|\\n| 🎯 **Stratégique & opérationnelle** | Forces/faiblesses, marché, synergies | Bain, Mercer, OCC, Roland Berger |\\n| 💰 **Comptable & financière** | Quality of earnings, bridge/VE, dette nette, BFR, validation budget/business plan | PwC, EY, Deloitte, Eight Advisory |\\n| 🖥️ **Technique** | Architecture IT, protection des données (RGPD) | Experts spécialisés |\\n| 🌱 **ESG** | Pollution des sols, diversité, éthique, travail des enfants, climat social… | — |\\n| ⚖️ **Juridique & fiscale** | Contrats clients/fournisseurs/salariés, liasses fiscales, schémas « agressifs », conditions suspensives (CPs) | Avocats |\\n\\n**📦 La Vendor Due Diligence (VDD)** : due diligence préparée par les conseils du **vendeur** et remise aux acquéreurs. Avantages : gain de temps, info pré-formatée, le vendeur anticipe les questions. ⚠️ Limites : un acquéreur avisé **se méfie** d'une DD payée par le vendeur et demandera l'accès aux informations sous-jacentes. Un industriel du secteur peut s'en satisfaire ; un **fonds novice** du secteur, beaucoup moins. Et **aucune DD, si poussée soit-elle, n'identifie tous les risq
