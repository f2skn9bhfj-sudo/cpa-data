      \"content\": \"Le succès d'un LBO repose sur **3 pieds**, correspondant aux 3 grandes étapes : ① **montage** (effet de levier — vu en section 2) ② **optimisation** opérationnelle et financière ③ **sortie** qui assure le TRI.\\n\\n**② L'OPTIMISATION** (pendant 3-5 ans de détention) — le fonds reste actionnaire majoritaire et suit de très près sa participation :\\n- 🎯 **Optimisation opérationnelle** : contrôle des coûts, revue des process ; des consultants spécialisés « chassent » dès le départ les coûts inutiles.\\n- 💰 **Discipline financière** : reportings **mensuels** pointus exigés, rôle pivot du DAF de la cible, optimisation du **BFR** pour générer du cash.\\n- 🔀 **Stratégie & périmètre** : cession d'activités peu rentables, et surtout acquisitions **« add-on »** (les fonds de PE **raffolent** des acquisitions additionnelles pour compléter produits ou géographies).\\n- 🥕 **Gouvernance — « le bâton et la carotte »** : un LBO est avant tout un **« contrat »** fonds/management fondé sur la confiance et la loyauté (non négociables). Le **bâton** = pression managériale + poids de la dette ; la **carotte** = le *management package* (partage de valeur, voir section 5). Une rupture de confiance expose à un changement managérial. C'est pourquoi les fonds **n'aiment pas les OPA hostiles**.\\n\\n**③ LA SORTIE** — critique à anticiper **dès l'entrée** (détention courte, TRI concrétisé surtout à la sortie, peu de dividendes pendant le portage). **Trois grandes voies** :\\n\\n| 🚪 Voie de sortie | Fréquence (Europe) | Commentaire |\\n|---|---|---|\\n| 🏢 **Cession industrielle** (à un groupe) | ≈ 1/4 | Valorise l'utilité « sociétale » du fonds, mais souvent peu probable (raisons sectorielles structurelles) |\\n| 📈 **IPO** (introduction en bourse) | ≈ 20% (très variable) | Pas privilégiée : marchés versatiles, difficulté de céder 100% d'un coup. Ex : Legrand, Elis, Europcar |\\n| 🔄 **LBO secondaire** (vente à un autre fonds) | **Majorité** | Un fonds vend à un autre fonds qui re-structure un LBO. Une société peut enchaîner 2, 3, 4 tours et rester sous LBO très longtemps |\\n\\n*(+ la **« leverage recap »** : dividende exceptionnel financé par une nouvelle dette qui « recharge » le LBO — forme de cession partielle, traitée ailleurs.)*\\n\\n**Mesurer le succès** : le **TRI** (taux de rendement interne annualisé) et le **multiple de l'argent** (*Multiple of Money*, **MoM**) = produit de cession en equity ÷ capital investi. 📐 Repère clé : faire **« x2 sa mise » en 5 ans ≈ TRI de 17%/an**.\",\n      \"comparison\": \"**LBO primaire vs secondaire.** **Primaire** = la société passe sous LBO pour la **première fois**. **Secondaire** (tertiaire…) = un fonds vend à un **autre fonds** de LBO. Les secondaires sont la **majorité des sorties** en Europe : incontournables vu la rotation nécessaire des actifs et la masse de fonds levés disponibles. ✅ Partisans : seule compte la capacité de la cible à supporter un nouveau tour. ❌ Détracteurs : peu de potentiel de création de valeur résiduel, dérive de la technique.\",\n      \"example\": \"**Cas B&B Hotels — un LBO exceptionnel.** Chaîne d'hôtels économiques. **Mars 2016** : PAI Partners rachète à Carlyle pour **790 M€** (x11 EBITDA), 4ᵉ LBO. En 3 ans : +140 hôtels (≈ 500 au total), 6 nouveaux pays, 3 add-on, **quasi-doublement de l'EBITDA**. **Fin 2019** : cession à Goldman Sachs PE pour **1,9 Md€** (≈ x15 EBITDA). Equity de départ ≈ 440 M€ → equity de sortie ≈ 1 550 M€ : **MoM ≈ 3,5x, TRI ≈ 45%/an**. Tout a joué : levier + hausse de l'EBITDA + hausse du multiple (achat x11, vente x15).\"\n    },\n    {\n      \"anchor\": \"s2-4\",\n      \"title\": \"4️⃣ Les cibles & la dette d'acquisition\",\n      \"content\": \"**Les cibles LBO** : potentiellement **toutes les entreprises**, de quelques M€ aux LBO géants (dizaines de Mds €). Le **secteur n'est pas prépondérant** (industrie, santé, télécom, chimie, services…), même si les secteurs **cycliques** (automobile, conseil IT) sont plus difficiles à monter.\\n\\n**Les vrais critères** :\\n- 💵 **Maturité / capacité à générer du cash** — contrairement au capital-risque, la **croissance n'est PAS impérative** (souhaitable mais pas obligatoire).\\n- 🏦 **Capacité à porter une dette LBO** — *un LBO sans dette d'acquisition n'est pas un LBO, par définition !*\\n- 🤝 Un **management motivé et aligné**.\\n- 🎯 Des **perspectives de création de valeur et de sortie** clairement identifiées.\\n\\n**Origine des transactions** : entreprises familiales, divisions de grands groupes, **LBO secondaires** (la part dominante), offres publiques avec sortie de cote (**P2P** — *Public to Private*, moins fréquentes).\\n\\n**La dette d'acquisition — le carburant du levier** :\\n- 📏 En moyenne **≈ x6 EBITDA** en Europe ces dernières années.\\n- 🚫 Dette **« sans recours »** : le prêteur n'a **aucune garantie sur le fonds** (qui ne reprendra pas la dette en cas de défaut). Le prêteur parie uniquement sur la **capacité du LBO à générer les flux** nécessaires → dette **risquée et donc coûteuse**.\\n\\n**Les types de dette LBO** :\\n\\n| 🏦 Type | Source | Caractéristiques |\\n|---|---|---|\\n| **Dette senior** | Banque(s) | Taux variable, marge ≈ 400-500 bp, rang prioritaire |\\n| **Dette mezzanine** | Mezzaneurs (institutions spé.) | **Subordonnée** à la senior → plus coûteuse |\\n| **High Yield** | Marché obligataire | « Haut rendement », *non investment grade*, taux fixe, *in fine*, ≈ 500-600 bp au-dessus des taux d'État, émissions ≥ 150-200 M€, *pari passu* ou subordonnée |\\n| **Unitranche** | Fonds de dette | Produit synthétique combinant senior + subordonné |\\n\\n**Un marché structurellement volatile** : tendance longue à la **désintermédiation** (le marché High Yield grignote la dette bancaire, à l'instar des USA), émergence des **fonds de dette** qui prêtent directement. Très sensible au contexte : il existe des périodes où les banques **ne prêtent quasiment plus** et où le High Yield est fermé (subprimes 2007, crise ukrainienne 2022-2023). 👉 **C'est cette instabilité de la dette qui explique largement la cyclicité du marché du LBO.**\",\n      \"key_point\": \"**Pas de dette d'acquisition = pas de LBO.** Le critère n°1 d'une cible n'est pas la croissance mais la **capacité à générer du cash pour porter une dette élevée** (≈ x6 EBITDA). C'est la différence radicale avec le capital-risque.\",\n      \"info\": \"**Dette « sans recours »** : le prêteur ne peut se retourner ni sur le fonds, ni sur les LP — il ne compte que sur les flux de trésorerie de la cible. C'est pourquoi cette dette est intrinsèquement risquée, donc chère, et fortement encadrée par des covenants.\",\n      \"warning\": \"Un marché de la dette qui se **tarit** (banques « collées » avec des engagements non syndiqués, High Yield fermé) bloque non seulement les **nouveaux LBO** mais aussi le **refinancement des LBO existants** — d'où des situations de stress et de restructuring en période de crise.\"\n    },\n    {\n      \"anchor\": \"s2-5\",\n      \"title\": \"5️⃣ L'industrie PE : GP, LP, carried interest & J-curve\",\n      \"content\": \"**Des gestionnaires d'actifs pour compte de tiers.** Les fonds de LBO lèvent des sommes considérables, surtout auprès des **investisseurs institutionnels** (le « carburant » de leur activité). Ces institutionnels n'allouent qu'une **faible part** (≈ **3-5%**) à la « gestion alternative » dont fait partie le PE : plus risqué (dette) mais avec une **espérance de rendement à deux chiffres** vs 7-8%/an des marchés actions. S'y ajoutent assureurs, banques, family offices, parfois particuliers (avec prudence).\\n\\n**L'organisation à 2 niveaux du *Private Equity Sponsor*** :\\n\\n| Niveau | Rôle | Acteurs |\\n|---|---|---|\\n| 🪣 **Le « fonds »** (le réceptacle) | Reçoit l'argent des investisseurs et investit en capital dans les LBO. Taille : 100 M€ à 10 Mds €+ | Statut de **Limited Partnership** (≈ société en commandite) |\\n| 🏢 **La société de gestion** | Regroupe les responsables et leurs équipes ; encaisse les commissions | **3 à 100+ partners**, présence mondiale |\\n\\n**Le rôle des acteurs** :\\n- 👥 **LP (Limited Partners)** = les **investisseurs**. Ils signent des **« commitments »** (engagements d'apport à première demande, ex. 50 M€). **Responsabilité limitée** à leur engagement. Ils **n'interviennent ni dans la gestion ni dans les décisions**.\\n- 🎩 **GP (General Partners)** = les partners qui **dirigent** : toute la gestion et le pouvoir de décision. Contrairement aux LP, ils sont **responsables sur leurs biens propres**.\\n\\n**Le « fonds » est une poche transparente, sans trésorerie** : l'argent ne fait que transiter.\\n- Nouveau LBO → les GP procèdent à des **appels de fonds** auprès des LP (tirage sur les commitments) → l'argent transite un instant et est aussitôt investi.\\n- Revente → le produit de cession transite et est aussitôt **reversé aux LP** (et aux GP au titre de leur rémunération).\\n- ➡️ Le fonds n'accumule **jamais de réserve** : structure financièrement ET fiscalement **transparente**.\\n\\n**Cycle de vie d'un fonds** : investit dans **≈ 10 LBO** (assez pour diversifier, mais suffisamment peu pour suivre chacun — ce n'est pas une SICAV). Totalement investi en **≈ 3 ans**, durée de vie juridique **≈ 10 ans**, puis devient une « coquille vide ». Les GP doivent donc **lever sans cesse de nouveaux fonds** (Fonds 1, 2, 3…), une levée prenant 6 à 18 mois. ⛽ *Les levées sont le carburant du PE* (CVC 28 Mds €, Advent 25 Mds $).\\n\\n**💸 La rémunération des partners — 2 composantes** :\\n1. **Management fee** : **1,5-2%/an** des fonds levés, encaissée par la société de gestion.\\n2. **Carried interest** : **≈ 20% des plus-values** totales du fonds, versé aux GP. **Mais 2 garde-fous imposés par les LP** :\\n   - Les GP doivent investir **1-2% du fonds** sur leurs deniers personnels (alignement).\\n   - Le carried n'est exigible qu'**après** que les LP ont touché un **TRI prioritaire** (« **hurdle rate** ») de **7-8%/an**. Performance médiocre → **zéro carried**.\\n\\n📉 **La J-curve** (implicite dans ce mécanisme) : en début de vie, le fonds appelle du cash et porte les frais → rendement **négatif** ; puis les cessions arrivent et le rendement remonte fortement → la courbe dessine un **« J »**.\",\n      \"key_point\": \"**GP vs LP, à ne jamais confondre.** **LP** = investisseurs passifs, responsabilité **limitée** à leur engagement, ne décident de rien. **GP** = gestionnaires actifs, responsables sur leurs biens propres, touchent le **carried interest**. Le fonds lui-même (Limited Partnership) est une poche transparente sans trésorerie.\",\n      \"example\": \"**Calcul du carried.** Un fonds de 1 Md € rend 2,5 Mds € aux LP. Plus-value = 1,5 Md €. Hurdle de 8% d'abord servi aux LP, puis le carried = 20% × plus-value ≈ **300 M€** pour les GP — à condition d'avoir préalablement franchi le hurdle. Si le fonds n'avait rendu que le capital + 5%, hurdle non atteint → **carried = 0**.\",\n      \"comparison\": \"**LBO vs capital-risque — deux mondes opposés.** En **capital-risque** : la **dette est bannie** (pas de cash généré, gâchis fiscal, risque excessif), financement par **tours de table successifs** en capital, indicateur clé = le **cash burn rate**, fonds **minoritaire** aux côtés du fondateur, **pacte d'actionnaire crucial**, « partage de goodwill » à chaque levée. En **LBO** : structure financière **fixée au départ** (beaucoup de dette), indicateur clé = la **génération de cash**, fonds **majoritaire** qui contrôle et décide de la sortie, gouvernance sans ambiguïté.\"\n    },\n    {\n      \"anchor\": \"s2-6\",\n      \"title\": \"6️⃣ Le management package : aligner les dirigeants\",\n      \"content\": \"Le **management package** est l'outil central par lequel le fonds de LBO s'assure de la **motivation** et de l'**alignement d'intérêts** de l'équipe dirigeante de la société sous LBO. C'est la « **carotte** » évoquée dans la gouvernance.\\n\\n**Les 2 principes fondateurs** :\\n- 🤝 **Alignement** : les managers bénéficiaires doivent **investir à titre personnel** dans le capital du LBO (ils mettent leur propre argent en jeu).\\n- 🚀 **Sur-rendement** : la perspective d'obtenir, à la sortie, un **TRI supérieur** à celui du fonds — récompense de la prise de risque et de la performance.\\n\\nLe package est **formalisé et négocié avant le démarrage** du LBO entre le fonds et l'équipe.\\n\\n**Les cercles de bénéficiaires** (du plus restreint au plus large) :\\n\\n```\\n  Membres du Comex\\n        └─> Autres catégories de managers\\n                └─> Parfois une très large partie du personnel\\n```\\n\\n**Les mécanismes techniques du sur-rendement** :\\n- 🎟️ Combinaison d'**actions + BSA** (Bons de Souscription d'Actions) donnant droit à des actions complémentaires **si le TRI du fonds dépasse un certain seuil**.\\n- 🔁 **Obligations convertibles** ou produits dérivés similaires.\\n\\n**En cas de LBO secondaire** : si le management veut rester, il devra **réinvestir** — pratique de marché d'imposer le réinvestissement d'**au moins la moitié** de ce qu'il a gagné au tour précédent. (Modalités particulières aussi en cas d'IPO, sortie partielle du fonds.)\\n\\n📌 Note de vocabulaire : un fonds est réticent à racheter une entreprise **sans son management** — on parle alors de **Management Buy-In** (et non plus de Management Buy-Out).\",\n      \"key_point\": \"**Alignement + sur-rendement = le cœur du management package.** Les managers mettent leur propre argent (alignement) pour pouvoir viser un TRI supérieur à celui du fonds (sur-rendement). Le levier financier et le partage de la valeur sont au centre du dispositif.\",\n      \"tip\": \"**Mémo MBO vs MBI** : **M**anagement **B**uy-**O**ut = on rachète **avec** l'équipe déjà en place (le cas privilégié). **M**anagement **B**uy-**I**n = on fait **entrer** une nouvelle équipe de management (cas que les fonds aiment moins, car il manque l'historique et la confiance).\",\n      \"info\": \"Le **« contrat » fonds / management** repose sur un haut niveau de confiance et de loyauté. Le package financier scelle cet alignement : si tout va bien, managers et fonds gagnent ensemble ; le sur-rendement récompense spécifiquement la performance de l'équipe au-delà du retour du fonds.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Selon quel critère classe-t-on les fonds d'investissement, et quels sont les 4 grands types ?\",\n      \"a\": \"On classe selon le **stade de maturité** de l'entreprise cible : (1) **Amorçage / Seed** (idée-projet, minoritaire), (2) **Capital-risque / Venture** (start-up, premières ventes, minoritaire), (3) **Capital-développement / Growth** (entreprise en croissance établie, le plus souvent minoritaire), (4) **LBO / Private Equity** (entreprise mature générant du cash, **majoritaire / contrôle**). Plus la cible est jeune et risquée, plus le fonds est minoritaire ; plus elle est mature, plus il prend le contrôle.\"\n    },\n    {\n      \"q\": \"Définis un LBO en une phrase, et explique la différence entre « LBO » et « Private Equity ».\",\n      \"a\": \"Un **LBO** = **acquérir une entreprise** (souvent par un fonds), **avec effet de levier** (beaucoup de dette), pour **créer de la valeur**, puis la **céder** en délivrant un **TRI élevé** aux investisseurs (LP). Distinction : le **LBO** (Leveraged Buy-Out) est une **technique** de montage ; le **Private Equity** est l'**industrie** (les fonds, leur organisation, leurs métiers).\"\n    },\n    {\n      \"q\": \"Pourquoi interpose-t-on une holding (« Holdco »/« Newco ») entre le fonds et la cible, et qu'apporte l'intégration fiscale ?\",\n      \"a\": \"La **holding** ① **sépare** les parties prenantes du montage (fonds, management, prêteurs) de l'activité opérationnelle ; ② **permet de porter la dette** d'acquisition, ce qui ne serait pas toujours possible directement au niveau de l'Opco. En France, si la Holdco détient **> 95%** de l'Opco → **intégration fiscale** : les **intérêts payés par la Holdco deviennent déductibles** des résultats imposables de l'Opco, rendant le LBO **plus efficient**. Son absence ne l'interdit pas, elle le rend juste moins efficient.\"\n    },\n    {\n      \"q\": \"Avec ROCE 10%, dette 70 (coût 4% après impôt) et capitaux propres 30, montre l'effet de levier sur la rentabilité des CP.\",\n      \"a\": \"Société **sans dette** : RN = 10, CP = 100 → rentabilité des CP = 10/100 = **10%**. Société **avec dette** (LBO) : RN = 10 − (4% × 70) = **7,2**, CP = 30 → rentabilité des CP = 7,2/30 = **24%**. Le levier fait passer la rentabilité des capitaux propres de **10% à 24%** — car la rentabilité économique (10%) est supérieure au coût de la dette (4%).\"\n    },\n    {\n      \"q\": \"Quelles sont les 3 voies de sortie d'un LBO, et laquelle domine en Europe ?\",\n      \"a\": \"(1) **Cession industrielle** à un groupe (≈ 1/4 des sorties), (2) **IPO** (≈ 20%, très variable), (3) **LBO secondaire** = vente à un autre fonds de LBO. C'est le **LBO secondaire qui domine** (majorité des sorties en Europe), du fait de la rotation nécessaire des actifs et de la masse de fonds disponibles. (Une 4ᵉ voie partielle : la *leverage recap*.) On mesure le succès par le **TRI** et le **multiple de l'argent (MoM)** ; faire x2 en 5 ans ≈ TRI 17%/an.\"\n    },\n    {\n      \"q\": \"Qui sont les GP et les LP, et comment les GP sont-ils rémunérés ?\",\n      \"a\": \"**LP (Limited Partners)** = les **investisseurs** : ils apportent l'argent (commitments), ont une **responsabilité limitée** à leur engagement, et n'interviennent ni dans la gestion ni dans les décisions. **GP (General Partners)** = les partners qui **gèrent et décident**, responsables sur leurs biens propres. Rémunération des GP : ① **management fee** ≈ **1,5-2%/an** des fonds levés ; ② **carried interest** ≈ **20% des plus-values**, mais seulement après que les LP ont touché le **hurdle rate** (TRI prioritaire de **7-8%**), et à condition que les GP aient eux-mêmes investi **1-2%** du fonds.\"\n    },\n    {\n      \"q\": \"Quels sont les principaux types de dette LBO et le niveau de levier moyen ?\",\n      \"a\": \"Levier moyen ≈ **x6 EBITDA** en Europe, dette **sans recours** (le prêteur parie sur les flux de la cible, pas sur le fonds). Types : **dette senior** bancaire (taux variable, marge 400-500 bp, prioritaire) ; **dette mezzanine** (subordonnée, plus chère) ; **High Yield** de marché (non investment grade, taux fixe, in fine, +500-600 bp vs taux d'État, ≥ 150-200 M€) ; **Unitranche** (produit hybride senior + subordonné porté par des fonds de dette). L'instabilité de ce marché explique largement la cyclicité du LBO.\"\n    },\n    {\n      \"q\": \"Sur quels 2 principes repose le management package, et en quoi le LBO diffère-t-il du capital-risque ?\",\n      \"a\": \"Management package : ① **alignement** (les managers investissent leur propre argent dans le capital) ; ② **sur-rendement** (perspective d'un TRI supérieur à celui du fonds), via actions + BSA ou obligations convertibles. **LBO vs capital-risque** : en LBO, structure financière fixée au départ avec **beaucoup de dette**, fonds **majoritaire**, indicateur = génération de cash ; en capital-risque, la **dette est bannie**, financement par tours de table successifs en capital, fonds **minoritaire** aux côtés du fondateur, indicateur = cash burn rate, pacte d'actionnaire crucial.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Capital et Ingénierie Financière\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (typologie des fonds, montage & effet de levier, cycle/optimisation/sortie, cibles & dette d'acquisition, industrie PE/GP-LP-carried, management package) + 8 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_3_iccf2_capital/semaine_3.json": "{\n  \"code\": \"ICCF2 Capital — Semaine 3\",\n  \"title\": \"🟧 Semaine 3 — L'introduction en bourse (IPO)\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 3 (Capital & Ingénierie financière)\",\n  \"ref_msa\": \"Cours ICCF2 — Capital et Ingénierie Financière\",\n  \"bases_legales\": \"Règlement général AMF — IPO (France) · « appel public à l'épargne »\",\n  \"normes\": \"Marchés actions (Vernimmen) · pratiques de place Euronext Paris\",\n  \"niveau\": \"Intermédiaire — finance de marché\",\n  \"summary\": \"Une **IPO** (*Initial Public Offering*) consiste à faire le choix qu'à l'avenir les actions d'une société seront **négociables sur un marché boursier**. Cette semaine décortique le processus de bout en bout : **pourquoi** y aller (motivations différentes selon vendeur, société, actionnaire non-vendeur), comment être un **bon candidat** (equity story, taille/flottant, levier), le **choix du marché** et les **formes d'IPO** (primaire/secondaire), le **calendrier-type** d'environ 6 mois (origination → préparation → documentation → pre-marketing → déroulement), la **relation avec l'AMF**, le rôle des **analystes**, puis le **déroulement** final (road-shows, book-building, fixation du prix, allocations, greenshoe & stabilisation). 💡 Message-clé : **une IPO est un processus COMMERCIAL avant d'être technique** — il s'agit de convaincre le marché, pas de remplir des cases réglementaires.\",\n  \"mnemonics\": \"**Les 5 grandes phases — « O.P.D.P.D » (≈ 6 mois)** : **O**rigination (choix banques, kick-off) → **P**réparation (gouvernance, due diligence, equity story) → **D**ocumentation (Document de Base + AMF) → **P**re-marketing (analystes, Early Look, PDIE, ITF) → **D**éroulement (road-show, book-building, prix, allocation, stabilisation).\\n\\n**Primaire vs Secondaire — « P = Pour l'entreprise »** : IPO **P**rimaire = actions **nouvelles** → l'argent va à l'entreprise (augmentation de capital). IPO **S**econdaire = titres **existants** → l'argent va aux actionnaires cédants.\\n\\n**3 critères de bon candidat — « E.T.L »** : **E**quity story (l'histoire à raconter) · **T**aille/flottant (viser plusieurs centaines de M€) · **L**evier (Dette nette/EBITDA ≤ 3).\",\n  \"sections\": [\n    {\n      \"anchor\": \"s3-1\",\n      \"title\": \"1️⃣ Pourquoi aller en bourse & être un bon candidat\",\n      \"content\": \"Aller en bourse, c'est décider que les actions de la société seront désormais **négociables sur un marché**. Les motivations diffèrent radicalement selon **qui** pousse l'opération.\\n\\n**🎯 Des motivations différentes selon les parties** :\\n\\n| Partie concernée | Ce qu'elle cherche |\\n|---|---|\\n| 🧑‍💼 **Actionnaire vendeur** | Monétiser une participation **sans vendre toute l'entreprise** ; ou céder le **contrôle** (alternative au M&A) |\\n| 🧑‍💼 **Actionnaire partiel / non-vendeur** | **Valoriser** l'entreprise ; pour un groupe coté, **extraire de la valeur** d'une pépite non reconnue |\\n| 🏢 **La société elle-même** | **Lever du capital** (cas des start-ups) ; visibilité, respectabilité, appui commercial |\\n\\n**📌 Exemples concrets** :\\n- **KKR** cédant sa participation de 50 % dans **Tarkett** via IPO — la famille majoritaire ne vendant **pas** de titres pour garder le contrôle (IPO secondaire partielle).\\n- **Porsche** introduit en bourse par sa maison-mère **Volkswagen en 2022** — extraire la valeur d'une activité jugée prometteuse, mal reconnue à travers la cotation de la mère.\\n\\n**✅ Être un bon candidat — c'est avant tout un acte de VENTE** :\\n\\nIl faut **convaincre le marché** (= les investisseurs) que les actions sont attractives. Les contraintes réglementaires d'éligibilité existent (flottants minimaux), mais **ce ne sont PAS les plus importantes**.\\n\\nLes 4 dimensions appréciées par le marché :\\n\\n1. 🏭 **Le secteur d'activité** — pas de secteur privilégié par principe, mais marché **très versatile** : certains secteurs plébiscités, d'autres délaissés, avec des inversions soudaines et inexpliquées. → **Ne jamais aller contre le marché** : ce qui compte n'est pas sa propre conviction, c'est ce que le marché pense.\\n2. 📖 **L'equity story** — concept **central** : il faut une « histoire à raconter » (ce qui ne veut PAS dire raconter des histoires). La **croissance** est naturellement appréciée, mais on peut aussi vendre de la **stabilité/résilience**, de la **rentabilité**, du **rendement**.\\n3. 📏 **La taille / le flottant** — pas de taille minimale absolue, mais viser un **flottant de plusieurs centaines de M€**. Le flottant assure la **liquidité** (l'investisseur doit pouvoir acheter/vendre facilement).\\n4. ⚖️ **Le levier financier** — norme de marché : ne pas introduire avec un ratio **Dette nette / EBITDA > 3**. Norme moyenne, variable selon les secteurs.\",\n      \"key_point\": \"**Une IPO est un processus COMMERCIAL avant d'être technique.** Tout découle de là : il s'agit de séduire le marché, pas de cocher des cases légales. Les contraintes réglementaires d'éligibilité ne sont pas le sujet central.\",\n      \"example\": \"**Le piège du flottant trop faible** : une société capitalisée 100 M€ qui ne place que 30 % en bourse aura un flottant de seulement **30 M€** (en volume). Très peu d'actions s'échangeront chaque jour → titre **irrémédiablement illiquide**, progressivement délaissé, destin boursier médiocre. Beaucoup de petites IPO opportunistes finissent ainsi.\",\n      \"tip\": \"**Levier acceptable, c'est selon le secteur** : un ratio Dette nette/EBITDA de **3,5x** peut être toléré à l'IPO pour une société **Telecom**, réputée résiliente. La norme des 3x n'est qu'une moyenne de pratique.\"\n    },\n    {\n      \"anchor\": \"s3-2\",\n      \"title\": \"2️⃣ Choix du marché de cotation & formes d'IPO\",\n      \"content\": \"**🔔 Attention au contresens le plus répandu** : la **« première cotation »** (la fameuse cloche que l'on fait sonner, ce que voient la presse et le grand public) n'intervient qu'**à la toute fin** du processus. Une IPO réussie, c'est avant tout **placer des actions en sécurité et à un prix optimal** — pas la cérémonie de cotation.\\n\\n**🌍 Le choix de la place de cotation** : souvent central dans l'esprit des dirigeants au départ, mais en réalité d'importance **assez relative** (ce n'est que le lieu où s'échangeront les titres).\\n\\n- **Proximité géographique = bon sens** : une société française se cote sur Euronext Paris, une italienne à Milan… logique de commodité et de proximité avec les autorités boursières. Impact principal : les **règles boursières** à respecter.\\n- ⚠️ **Se méfier des faux raisonnements** : se coter sur le Nasdaq ne fait PAS de vous une valeur de croissance — *c'est l'entreprise qu'on évalue, pas son marché de cotation*. Les institutionnels savent intervenir sur la plupart des grands marchés mondiaux.\\n- 💧 **Liquidité = critère-clé** : les investisseurs préfèrent un titre coté sur **un seul marché** (liquidité concentrée). Les **dual listings** sont largement passés de mode en Europe. Certaines très grosses sociétés non-US se cotent aux USA (profondeur du marché), en direct ou via **ADRs** (*American Depositary Receipts* — ex. Total, Sanofi, ArcelorMittal), mais procédures US **extrêmement lourdes**.\\n\\n**🇫🇷 Les compartiments d'Euronext Paris** :\\n\\n| Marché | Pour qui | Exigence d'accès |\\n|---|---|---|\\n| **Euronext** (réglementé, 3 compartiments A/B/C selon la taille) | Grosses & moyennes sociétés | IPO d'au moins **25 %** du capital, ou 5 % représentant **≥ 5 M€** |\\n| **Euronext Growth** | ETI | Process simplifié ; **≥ 2,5 M€** dans le public |\\n| **Euronext Access** | Petites entreprises en forte croissance | Flottant **≥ 1 M€** ; **non réglementé** — plutôt une « acclimatation » boursière |\\n\\n👉 Chaque compartiment a ses règles (prospectus, visa exigé ou non, fréquence des comptes, franchissements de seuil). Au début des années 2020 : un peu plus de **800 sociétés** cotées sur ces trois compartiments, dont ~la moitié sur Euronext.\\n\\n**🔀 Les formes d'IPO** :\\n\\n- **IPO secondaire** : titres vendus par des **actionnaires existants** → le produit va aux **cédants**, pas à l'entreprise.\\n- **IPO primaire** : **actions nouvelles** émises par la société (augmentation de capital) → le produit va à **l'entreprise**.\\n- **Combinaison primaire + secondaire** : très fréquent ; le partage est décidé **collégialement** entre la société et ses actionnaires.\\n\\nLes IPO sont **classées selon le montant du placement** réalisé (et non la capitalisation post-IPO).\",\n      \"comparison\": \"**Primaire vs Secondaire — qui touche l'argent ?** IPO **primaire** = actions **nouvelles** → cash pour **l'entreprise** (besoins de financement). IPO **secondaire** = titres **existants** → cash pour les **actionnaires cédants** (monétisation/sortie). La plupart des opérations combinent les deux.\",\n      \"info\": \"**Le palmarès des plus grosses IPO de l'histoire** (par montant placé) : Saudi Aramco 25,6 Md$ (Tadawul, 2019), Alibaba 25 Md$ (NYSE, 2014), Agricultural Bank of China 22,1 Md$ (HK & Shanghai, 2011), ICBC 21,9 Md$ (2006), AIA Group 20 Md$ (HK, 2010), Visa 19,6 Md$ (NYSE, 2018), General Motors 18,1 Md$ (NYSE, 2010), Facebook 16 Md$ (Nasdaq, 2012).\",\n      \"warning\": \"**Cotation ≠ IPO.** Ne jamais confondre le **processus** d'introduction (le vrai travail de placement) avec la **cotation elle-même**, qui n'en est que l'ultime étape. Si le placement échoue, il n'y aura tout simplement **aucune** première cotation.\"\n    },\n    {\n      \"anchor\": \"s3-3\",\n      \"title\": \"3️⃣ Calendrier-type, origination & préparation\",\n      \"content\": \"**📅 Un délai de préparation et de réalisation d'environ 6 mois est classique.** Le calendrier-type s'enchaîne ainsi :\\n\\n| Phase | Durée indicative | Contenu-clé |\\n|---|---|---|\\n| **Kick-off → Préparation** | ~4 sem. puis 5-10 sem. | Présentation du management au Syndicat, gouvernance, **due diligence**, comptes & business plan, **valorisation**, equity story, **Early Look I**, début de rédaction du Prospectus |\\n| **Documentation (finalisation)** | ~4 sem. | Enregistrement / publication du **Document de Base (DDB)**, présentation analystes, *cornerstones* le cas échéant |\\n| **Pre-marketing « PDIE »** | ~4 sem. | Publication des recherches d'analystes, les analystes rencontrent les investisseurs, feedback pour la **fourchette**, enregistrement de la Note d'Opération, **Intention To Float (ITF)** |\\n| **Road-show & Book-building** | ~2 sem. | **Go/No Go**, fourchette de prix, **Visa AMF** sur le Prospectus, road-show du management, book-building institutionnel, offre aux particuliers / salariés |\\n| **Pricing → Cotation** | 10 j à 2 sem. | **Pricing final**, allocations, **première cotation**, stabilisation par le Syndicat |\\n\\n**🏦 L'origination — sélection des banques** :\\n\\n- Effort commercial amont des banques sur **plusieurs années**.\\n- Sélection finale par **appel d'offres (« RFP » — Request For Proposal)**, souvent avec l'aide d'un **« IPO advisor »**.\\n- Chaque banque invitée fait un **pitch** écrit et oral : equity story, valorisation, exécution, services annexes (parfois avec l'analyste, dans un meeting séparé).\\n- L'appel d'offres désigne un ou plusieurs **« coordinateurs globaux »** : la **tête** du syndicat, seuls impliqués dès le départ et qui assurent la coordination du début à la fin.\\n\\n**Rôle du syndicat bancaire** (de 2 à 20 banques ou +) — deux grands rôles :\\n1. **Organisation & coordination** : essentiellement les coordinateurs globaux.\\n2. **Vente des titres** lors du placement actif : toutes les banques ; certaines seront **teneurs de livre (« bookrunners »)**.\\n\\n💰 **Commissions** : ~**2 %** du montant placé (jusqu'à **4 %+** pour les IPO spécifiques type start-ups). Le démarrage formel = le **kick-off meeting**.\\n\\n**🛠️ La préparation — rendre la société « bourse-compatible »** :\\n- **Gouvernance** : toilettage des statuts, administrateurs indépendants (voire référents), comités du Conseil, structuration d'une tête de groupe.\\n- **Due diligences** complètes, pilotées par les avocats.\\n- **Comptes** (semestriels a minima, voire trimestriels), **Business Plan** confidentiel (partagé uniquement avec les banques de tête), **valorisation** interne par les banques.\\n- Construction de l'**equity story** et supports marketing (Early Look, présentations analystes).\\n- Rédaction préliminaire du **Document de Base** (souvent avec visites préalables à l'**AMF**).\",\n      \"info\": \"**Pas de véritable « underwriting » dans une IPO.** Le syndicat ne **garantit pas** le placement : si l'IPO ne se place pas (ou partiellement), les banques **ne se substituent pas** au marché défaillant. L'IPO sera alors un échec. C'est une différence majeure avec une augmentation de capital garantie.\",\n      \"warning\": \"**Les banques travaillent en « success fee » pur** : **aucune** rémunération en cas d'échec. En plus de la perte sèche de temps, l'échec d'une IPO porte un **risque réputationnel et relationnel** lourd (perte de confiance du client). D'où leur sélectivité.\",\n      \"example\": \"**IPO d'Elis (2015) — parties prenantes types** : la **Société / Actionnaires** (Eurazeo via Legendre Holding 27) d'un côté ; le **syndicat bancaire** (coordinateurs globaux + joint bookrunners) de l'autre ; et les **conseils** (avocats des deux côtés, auditeurs, agence de communication). Un casting récurrent sur toutes les grandes opérations.\"\n    },\n    {\n      \"anchor\": \"s3-4\",\n      \"title\": \"4️⃣ Documentation / AMF & pre-marketing (analystes)\",\n      \"content\": \"**📄 La documentation — un « appel public à l'épargne »** :\\n\\nPar opposition à un **placement privé** (nombre limité d'investisseurs), l'IPO s'adresse au public et exige une documentation complète :\\n- **Le Document de Base (DDB)** : document de fonds, **volumineux**, qui présente la société sous toutes ses coutures — présentation générale, organisation, management, stratégie, produits, **comptes consolidés sur ~3 ans**, **facteurs de risques**, tendances et perspectives (**mais pas de business plan détaillé**).\\n- **La Note d'Opération** : les **termes** de l'opération envisagée.\\n\\n**🏛️ La relation avec l'AMF** (Autorité des Marchés Financiers) :\\n- **Dépôt** à l'AMF → **revue complète** par ses services spécialisés.\\n- Approbation = **enregistrement du DDB**.\\n- Dès l'enregistrement, le DDB est rendu **accessible au public** (site AMF) : c'est le **premier signal tangible** d'une IPO possible.\\n- Plus tard, l'AMF appose son **Visa** sur le **Prospectus** (incluant la Note d'Opération) au moment du lancement effectif.\\n\\n**🔬 Les notes de recherche des analystes financiers** :\\n- Outil **essentiel** de promotion et de commercialisation de l'IPO.\\n- Rédigées par les analystes des banques du Syndicat (puis, plus tard, par l'ensemble des analystes de la Place qui le souhaitent).\\n- Elles comprennent en général une **valorisation indépendante**, sous la responsabilité de l'analyste, qui **n'engage ni la société ni les vendeurs**.\\n- Les analystes écrivent en **toute indépendance** des vendeurs, de la société et des banquiers d'affaires de leur **propre** banque → **« Murailles de Chine »** très strictes au sein des banques.\\n\\n**📣 Le pre-marketing** — tester l'appétit du marché **avant** toute décision officielle :\\n1. **Early Look** : contacts en amont entre le **management** et les investisseurs institutionnels.\\n2. **Diffusion mondiale** des notes de recherche auprès des institutionnels.\\n3. **PDIE (« Pre Deal Investor Education »)** : les **analystes** rencontrent individuellement les institutionnels et leur présentent leurs notes.\\n\\n👉 Cette campagne fournit des **feedbacks précieux** pour décider de la suite et fixer la **fourchette de prix**. Si tout se passe bien, elle débouche sur une déclaration publique d'**« Intention To Float » (ITF)** : simple indication de principe (sans modalités ni calendrier), mais qui envoie un **message fort** d'IPO probable à court terme.\",\n      \"key_point\": \"**Le DDB contient les comptes mais PAS de business plan détaillé.** Le business plan reste **confidentiel** et n'est partagé qu'avec les banques de tête. Le public n'a droit qu'aux « tendances et perspectives ». Distinction classique à connaître.\",\n      \"legal_quote\": \"Les **« Murailles de Chine »** imposent une étanchéité stricte entre les analystes financiers (recherche) et les banquiers d'affaires d'une même banque. L'analyste produit sa valorisation **en toute indépendance** : elle n'engage ni la société ni les vendeurs.\",\n      \"tip\": \"**Repère l'ordre des « signaux publics »** : (1) **enregistrement du DDB** = premier signal tangible → (2) **ITF** = message fort d'IPO probable → (3) **Visa AMF sur le Prospectus** = lancement effectif. Une bonne façon de situer où en est une opération dans la presse.\"\n    },\n    {\n      \"anchor\": \"s3-5\",\n      \"title\": \"5️⃣ Déroulement : road-show, book-building, prix & allocations\",\n      \"content\": \"**🚦 La décision de lancement** :\\n- **Go / No Go** interne.\\n- Obtention du **Visa AMF** sur le Prospectus (Note d'Opération incluse) + communiqué de lancement.\\n\\n**📐 Le lancement se fait sur une base préliminaire** :\\n- **Taille approximative** indiquée (avec répartition **primaire / secondaire**) en montant et/ou nombre de titres, avec de nombreuses flexibilités.\\n- **Lock-up** vendeurs/émetteurs : en général **6 mois** (levée ultérieure possible).\\n- **Fourchette de prix indicative** : écartement d'environ **± 10 %** autour du milieu de fourchette (ex. **[10–12] €/action**). En France, possibilité juridique de lancer sur un simple **« prix maximum »** jusqu'à 3 jours avant le pricing, puis fourchette avec écartement maximal de **± 15 %**.\\n\\n**🎯 Les types d'offres** :\\n\\n| Offre | Caractéristiques |\\n|---|---|\\n| 🏛️ **Institutionnels** | **Déterminants** pour le prix et le succès ; placement de **7 à 10 jours** ; cadre US spécifique du placement privé (**« 144A »**, réservé aux **QIBs**) |\\n| 👤 **Particuliers** | Norme depuis France Telecom (1998) : **Offre à Prix Ouvert (OPO)**, **≥ 10 %** de la taille ; **clawback** possible (report sur l'offre institutionnelle si sous-souscrite) |\\n| 👷 **Salariés** | Offre distincte possible |\\n\\n**🌐 Road-shows** (~10 jours, mondiaux pour les grosses IPO) : plusieurs **centaines** d'investisseurs institutionnels rencontrés par le **management** à Paris, Londres, New-York, autres villes US, Europe, voire Asie.\\n\\n**📚 Book-building** (~10 jours) — gestion active du livre d'ordres :\\n- Les ordres institutionnels sont collectés (forces de vente des banques) et **centralisés par les teneurs de livre (bookrunners)**, en général les coordinateurs globaux.\\n- Possibilité de **resserrer la fourchette** en cours de route et de communiquer sur la **« couverture »** du livre (effet favorable pour la dynamique).\\n- Les bookrunners analysent la **demande** (long only, hedge funds, rating investisseurs, split par pays) et surtout la **sensibilité au prix**.\\n- Les ordres des **particuliers** sont collectés par les réseaux bancaires et centralisés par **Euronext**.\\n\\n**💶 Prix final & allocations** :\\n- C'est le **placement global** qui conditionne le prix final.\\n- Clôture du livre institutionnel et de l'OPO → décision de prix par l'émetteur/vendeur → communiqué (prix + dimensionnement final) → les ordres deviennent **irrévocables**.\\n- **Allocations institutionnelles** par les bookrunners (en accord avec la société) selon un principe **discrétionnaire mais non arbitraire**.\\n- **Allocations particuliers** : règles d'ordres prioritaires par taille (ordres A1…).\",\n      \"example\": \"**IPO d'Elis (2015) — termes au lancement** : offre de **750 M€** (854 M€ post-greenshoe) ; base deal 700 M€ primaire + 50 M€ secondaire ; **greenshoe 15 %** (100 % secondaire), exercé à 93 % ; prix final **13,00 €** (fourchette initiale 12–19 €, resserrée à 13–16,50 € le 4 février selon les nouvelles règles AMF) ; free-float 57,6 % ; capitalisation 1 482 M€ post-money ; multiple 117x EBIT 2015e ; lock-up **180 jours** ; *use of proceeds* : réduire la dette pour un levier post-IPO **< 3x**.\",\n      \"tip\": \"**Le book-building, c'est un thermomètre.** Communiquer que le livre est « couvert N fois » nourrit la dynamique de l'offre. Et un **clawback** permet de transférer vers les institutionnels les titres non absorbés par l'OPO des particuliers — un amortisseur précieux.\",\n      \"key_point\": \"**Les institutionnels font le prix.** Le placement institutionnel (7-10 j) est *déterminant* pour le prix et le succès. L'OPO des particuliers (≥ 10 %) est importante symboliquement et commercialement, mais c'est la demande institutionnelle qui pilote la fixation du prix.\"\n    },\n    {\n      \"anchor\": \"s3-6\",\n      \"title\": \"6️⃣ Première cotation, stabilisation, IPO alternatives & conclusion\",\n      \"content\": \"**🔔 La première cotation** (en général **dès le lendemain** des allocations) :\\n- Cérémonie traditionnelle chez Euronext — la **cloche qui sonne**.\\n- De **très gros volumes** les premiers jours.\\n- Le comportement boursier dépend souvent du **taux de sursouscription** :\\n  - Une IPO sursouscrite **10 fois** → cours qui **monte** (les investisseurs faiblement alloués complètent leurs lignes).\\n  - Une IPO **tout juste souscrite** → **déception**, cours sous pression.\\n- ⚠️ Si l'offre n'est **pas suffisamment souscrite**, l'IPO peut être **annulée** (ou reportée) : aucune cotation → **échec**.\\n\\n**🛡️ La période de stabilisation** :\\n- Le syndicat fait face aux secousses des premiers jours, notamment en cas de **retour de papier (« flowback »)** et de pression excessive sur le cours.\\n- Un **agent-stabilisateur** est choisi parmi les coordinateurs globaux / bookrunners ; il intervient sur le marché pour le compte du syndicat (notamment en **achetant** des actions si nécessaire).\\n- Technique-clé : le **« Greenshoe »** (clause d'**option de sur-allocation**).\\n- Durée **théorique** de plusieurs semaines, **en pratique** quelques jours.\\n\\n**🔀 Les IPO alternatives** :\\n\\n| Mode | Principe |\\n|---|---|\\n| **Cotation directe** | Cotation **sans placement de titres** — quand la société a déjà des actionnaires privés et ne veut **pas** lever de fonds. Ex. : **Spotify**, **UMG** (Universal Music Group), ou **TaTaTu** à Paris |\\n| **SPAC** (*Special Purpose Acquisition Company*) | **IPO indirecte** inventée aux USA. Une **coquille** cotée (fonds limités), créée par une personnalité financière, promet d'apporter ensuite une société opérationnelle (« **chèque en blanc** »). Le rapprochement = **« de-SPACing »** ; le nouvel ensemble reste coté. A fait fureur début 2020s puis **soufflet retombé** (méfiance réglementaire, déceptions) |\\n| **Scissions (spin-offs)** | Peuvent aussi constituer une forme d'IPO — traitées spécifiquement plus loin |\\n\\n**🎓 Conclusion sur les IPO** :\\n- La décision doit résulter d'une réflexion **structurée et non opportuniste**.\\n- Processus **long et chronophage** (~6 mois).\\n- Succès **tributaire des conditions de marché** : une excellente société, parfaitement exécutée, peut **échouer** si les bourses baissent fortement pendant le book-building.\\n- Le marché des IPO est un marché à **« fenêtres »** qui s'ouvrent et se referment sans préavis.\\n- ✨ Une IPO réussie n'est **pas la fin** d'une histoire, mais son **début** : la nouvelle vie de corporate coté, avec ses opportunités (accès au capital, visibilité) **et ses contraintes** (gouvernance, communication, pression des marchés).\",\n      \"info\": \"**Le greenshoe, comment ça marche ?** L'option de sur-allocation permet au syndicat de placer plus de titres que prévu, puis, selon l'évolution du cours, soit de racheter sur le marché pour soutenir le titre (stabilisation), soit d'exercer l'option auprès de l'émetteur/vendeur. Chez Elis, le greenshoe représentait 15 % du base deal, exercé à 93 %.\",\n      \"example\": \"**Porsche (2022) — le contre-exemple exceptionnel** : un très grand succès dans un marché boursier pourtant difficile (marché des IPO quasiment **fermé** en Europe). Cas **rare** qui confirme que la qualité de l'actif peut parfois ouvrir une fenêtre même par gros temps — mais à ne surtout pas ériger en règle.\",\n      \"warning\": \"**Une bonne exécution ne garantit RIEN.** Le facteur décisif reste le **comportement des bourses pendant le book-building**. Même une société de grande qualité, parfaitement préparée, verra son placement échouer si les marchés décrochent durant le placement. Le timing prime.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Quelle est la différence entre une IPO primaire et une IPO secondaire ? Qui touche le produit de l'opération ?\",\n      \"a\": \"**IPO primaire** = la société émet des **actions nouvelles** (augmentation de capital) → le produit va à **l'entreprise**. **IPO secondaire** = des actionnaires existants vendent leurs **titres existants** → le produit va aux **actionnaires cédants**, pas à l'entreprise. Beaucoup d'opérations **combinent** les deux, le partage étant décidé collégialement entre la société et ses actionnaires.\"\n    },\n    {\n      \"q\": \"Pourquoi dit-on qu'une IPO est « un processus commercial avant d'être technique » ?\",\n      \"a\": \"Parce qu'une IPO est avant tout un **acte de vente** : il faut **convaincre le marché** (les investisseurs) que les actions sont attractives, donc séduire en remplissant les critères appréciés (equity story, croissance/résilience, flottant suffisant, levier maîtrisé). Les contraintes réglementaires d'éligibilité existent (flottants minimaux) mais ne sont **pas les plus importantes**. C'est ce que pense le marché qui compte, pas la conviction propre de l'actionnaire.\"\n    },\n    {\n      \"q\": \"Quels sont les trois compartiments d'Euronext Paris et leurs exigences d'accès ?\",\n      \"a\": \"**Euronext** (réglementé, 3 compartiments A/B/C selon la taille) : pour grosses/moyennes sociétés — IPO d'au moins **25 % du capital**, ou 5 % représentant **≥ 5 M€**. **Euronext Growth** : pour les ETI — process simplifié, **≥ 2,5 M€** dans le public. **Euronext Access** : petites entreprises en forte croissance — flottant **≥ 1 M€**, **non réglementé** (acclimatation boursière). Au début des années 2020, ~800 sociétés cotées au total, ~la moitié sur Euronext.\"\n    },\n    {\n      \"q\": \"Que sont les « Murailles de Chine » et pourquoi sont-elles importantes pour les notes des analystes ?\",\n      \"a\": \"Ce sont des séparations **étanches et strictes** mises en place au sein des banques entre les **analystes financiers (recherche)** et les **banquiers d'affaires**. Elles garantissent que l'analyste rédige sa note — y compris sa **valorisation indépendante** — en **toute indépendance** des vendeurs, de la société et des banquiers de sa propre banque. Cette valorisation n'engage ni la société ni les vendeurs. Les notes sont un outil essentiel de commercialisation (diffusées mondialement, présentées lors du PDIE).\"\n    },\n    {\n      \"q\": \"Décris les grandes étapes du déroulement final, du lancement à la première cotation.\",\n      \"a\": \"(1) **Go/No Go** interne + **Visa AMF** sur le Prospectus ; (2) **lancement** sur taille préliminaire + fourchette indicative (± 10 %, ou prix max puis ± 15 % en France) + lock-up ~6 mois ; (3) **road-shows** mondiaux (~10 j) du management ; (4) **book-building** (~10 j) — collecte et centralisation des ordres par les bookrunners ; (5) **clôture du livre**, décision de **prix final** par l'émetteur, communiqué, ordres irrévocables ; (6) **allocations** (institutionnels discrétionnaires mais non arbitraires ; particuliers par ordres prioritaires) ; (7) **première cotation** dès le lendemain ; (8) **stabilisation** via greenshoe si nécessaire.\"\n    },\n    {\n      \"q\": \"Qu'est-ce que le greenshoe et à quoi sert la période de stabilisation ?\",\n      \"a\": \"Le **greenshoe** est une **clause d'option de sur-allocation**, principal outil de la **stabilisation**. Après la première cotation, le syndicat (via un **agent-stabilisateur** choisi parmi les coordinateurs globaux/bookrunners) intervient sur le marché — notamment en **achetant** des actions — pour absorber le **retour de papier (« flowback »)** et soutenir le cours en cas de pression excessive. Durée théorique de plusieurs semaines, en pratique quelques jours. Exemple Elis : greenshoe de 15 % du base deal, exercé à 93 %.\"\n    },\n    {\n      \"q\": \"Pourquoi une excellente société peut-elle quand même rater son IPO, et que sont les « fenêtres » d'IPO ?\",\n      \"a\": \"Parce que le succès est **tributaire des conditions de marché**, surtout du comportement des bourses **pendant le book-building**. Si les marchés baissent fortement durant le placement, même une société de grande qualité parfaitement exécutée verra son placement — donc son IPO — **échouer** (l'opération peut être annulée ou reportée, sans cotation). Le marché des IPO est un marché à **« fenêtres »** qui s'ouvrent et se referment régulièrement, parfois sans préavis. Le **timing** prime (Porsche 2022 fut un contre-exemple rare).\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Capital et Ingénierie Financière\",\n    \"Règlement général de l'AMF\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (pourquoi & bon candidat ; marché & formes d'IPO ; calendrier & origination ; documentation/AMF & pre-marketing ; déroulement road-show/book-building/prix/allocation ; cotation/stabilisation/alternatives & conclusion) + 7 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n", "cours_3_iccf2_capital/semaine_4.json": "{\n  \"code\": \"ICCF2 Capital — Semaine 4\",\n  \"title\": \"🟥 Semaine 4 — Optimiser la structure de son groupe\",\n  \"category\": \"HEC Paris — ICCF2 · Cours 3 (Capital & Ingénierie financière)\",\n  \"ref_msa\": \"Cours ICCF2 — Capital et Ingénierie Financière\",\n  \"bases_legales\": \"Organigramme financier d'un groupe · OPR-RO (retrait obligatoire ≥ 90 %) · régime mère-fille (remontée de dividendes)\",\n  \"normes\": \"Ingénierie financière (Vernimmen)\",\n  \"niveau\": \"Intermédiaire — finance d'entreprise\",\n  \"summary\": \"Un groupe, ce n'est presque jamais **une seule société** : c'est un **organigramme financier**, c'est-à-dire un empilement d'entités juridiques reliées entre elles. Cette semaine répond à 3 questions : (1) **pourquoi** faut-il en permanence adapter et optimiser cette structure (pressions externes des actionnaires/analystes/activistes, motivations internes d'intégration et de révélation de valeur, lutte contre la **décote de holding**) ; (2) **avec quels outils** d'ingénierie financière la transformer — **ouvrir le capital d'une filiale**, **sortir de la bourse** (squeeze-out / OPR-RO), **scinder** une activité via un **spin-off** ; (3) **comment gérer au quotidien** l'organigramme — fiscalité, localisation de la dette et du cash, intégration fiscale, minoritaires, et la grande question : **faut-il faire coïncider** l'organigramme juridique avec l'organisation opérationnelle ? L'idée maîtresse : **l'organigramme financier n'est jamais figé** — il s'adapte à une stratégie et à des besoins financiers à un instant donné.\",\n  \"mnemonics\": \"**Les 3 modèles de groupe — D-I-D** : **D**iversifié (juxtaposition d'activités sans synergies, holding patrimoniale légère → décote quasi inévitable) · **I**ntégré (filiales à 100 %, synergies max, organigramme purement technique → la référence des grands groupes mondiaux) · **D**émultiplié (minoritaires/partenaires au capital → « morceau d'Emmental » à trous). **Les 3 techniques — OSS** : **O**uvrir le capital (fonds propres « par le bas ») · **S**ortir de bourse (OPR-RO, seuil **90 %**) · **S**cinder (spin-off = dividende payé en actions de la filiale). **Décote de holding** : un conglomérat vaut **MOINS** que la somme de ses parties (décote ~20–50 %).\",\n  \"sections\": [\n    {\n      \"anchor\": \"s4-1\",\n      \"title\": \"1️⃣ Pourquoi optimiser ? Le contexte & les motivations\",\n      \"content\": \"**La structure d'un groupe = son organigramme financier** : la façon dont sont organisées et reliées entre elles toutes les entités juridiques qui le composent. Dès qu'une entreprise grandit, elle cesse d'être **une seule société** : un groupe présenté comme « 3 divisions produits » peut en réalité cacher **des dizaines, voire des centaines** d'entités juridiques aux liens complexes. ⚠️ Les comptes consolidés (qui présentent le groupe *comme s'il* n'était qu'une seule entité) ne doivent **jamais** dispenser de s'interroger sur la pertinence réelle de la structure.\\n\\nCette structure doit être **adaptée et optimisée en permanence** : à l'évolution du périmètre produit/géographique, à la stratégie financière et aux impératifs de **création de valeur**. Elle subit deux familles de pressions.\\n\\n**🌍 Motivations EXTERNES** (surtout pour les sociétés cotées) :\\n\\n| Partie prenante | Ce qu'elle veut |\\n|---|---|\\n| 👥 **Actionnaires & analystes** | Simplification & transparence : mieux comprendre le groupe et **révéler de la valeur** occultée par une structure trop complexe. Méfiants vis-à-vis de la **diversification** (conglomérats « passés de mode » : ex. General Electric, Siemens, ThyssenKrupp) |\\n| 🏦 **Prêteurs** | Une structure plus simple pour mesurer la **répartition de l'endettement** et le levier au sein du groupe |\\n| ⚔️ **Fonds activistes** | Importance croissante (USA d'abord, puis monde). Ont visé Lagardère, Danone, Pernod Ricard, Club Med, Saint-Gobain… |\\n\\n**🏠 Motivations INTERNES** :\\n- **Intégration opérationnelle & humaine** : contrôle optimal des filiales, empêcher les « **baronnies** », aligner tout le monde sur la stratégie.\\n- **Optimisation financière** : sur filiales à 100 %, accès effectif à **tous les cash-flows** + souplesse pour localiser la dette voire les résultats.\\n- **Maximisation des synergies** (industrielles, opérationnelles, commerciales).\\n- **Révéler des valeurs « cachées »** : introduire en bourse ou scinder une activité méconnue et donc sous-valorisée.\\n\\n🌍 Nuance géographique : la diversification reste **comprise et admise** dans les pays émergents, mais beaucoup moins dans les pays développés.\",\n      \"key_point\": \"**L'organigramme financier n'est PAS figé.** Il s'adapte avant tout à une stratégie et à des besoins financiers à un moment donné — et il évolue avec eux. C'est un objet de pilotage permanent, pas une photo juridique gravée dans le marbre.\",\n      \"info\": \"**La décote de holding** 📉 — En bonne finance, un groupe **vraiment diversifié** vaut MOINS que la somme des valeurs de ses activités. Pourquoi ? La vraie diversification implique l'**absence de synergies** : le marché y voit un **conglomérat** et applique une décote. Phénomène observé depuis toujours et partout : les holdings cotées (type Eurazeo, Wendel) subissent des décotes boursières d'environ **20 % à 50 %** selon les périodes.\",\n      \"comparison\": \"**Les 3 modèles-types d'organigramme** :\\n\\n| Modèle | Principe | Mérites | Inconvénients |\\n|---|---|---|---|\\n| 🧩 **Diversifié** | Juxtaposition d'activités économiquement différentes, holding de tête légère, optique **patrimoniale**, peu/pas de synergies (ex. Bouygues, Eurazeo, Wendel, family offices type FFP-Peugeot) | **Souplesse** : chaque activité cédable facilement, pas de problème de « détourage » (carve-out), management intéressé séparément | Absence de synergies + **décote de holding** quasi inévitable |\\n| 🔗 **Intégré** | Filiales détenues (in)directement à **100 %**, organigramme purement technique, divisions transcendant le juridique (ex. grands groupes US, banques européennes) | Alignement intra-groupe, synergies max, accès au cash, centralisation de trésorerie : le groupe fonctionne **comme une seule entité** | S'accommode parfois mal de partenariats industriels/financiers |\\n| 🧀 **Démultiplié** | Le groupe fait entrer des **minoritaires/partenaires** → organigramme « morceau d'Emmental » à trous | Lève des fonds en interne, noue des partenariats, révèle de la valeur masquée | Limite les synergies et la flexibilité (droits des tiers à respecter) |\\n\\n👉 **Tendance** dans les pays développés : vers les modèles **intégrés** (professionnalisation des actionnaires : institutionnels, activistes, private equity). Le modèle **diversifié** est le plus durablement remis en cause. Mais rien n'est manichéen : un groupe peut être intégré sur l'essentiel et faire entrer un minoritaire sur une activité ciblée (ex. **Renault** ouvrant le capital de ses activités électriques).\"\n    },\n    {\n      \"anchor\": \"s4-2\",\n      \"title\": \"2️⃣ Ouvrir le capital d'une filiale (equity carve-out)\",\n      \"content\": \"Ouvrir le capital d'une filiale, c'est **lever des fonds propres « par le bas »** sans toucher au capital de la maison-mère. 🪜 Mécanisme clé : la filiale **reste consolidée**, mais des tiers entrent à son capital.\\n\\n**📊 Effet comptable (à connaître par cœur) :**\\n- ➕ Les **fonds propres totaux** consolidés du groupe **augmentent**.\\n- ➖ Les **capitaux propres part du groupe** restent **inchangés**.\\n- 🆕 Apparition d'une ressource « **intérêts minoritaires** » dans le total des capitaux propres consolidés.\\n- 🔒 Le capital de la **maison-mère est inchangé**.\\n\\nTechnique précieuse quand le groupe a besoin de capitaux propres neufs mais que la maison-mère **ne veut ou ne peut pas** émettre d'actions nouvelles (ex. cotation de **Vilmorin** par sa maison-mère, la coopérative **Limagrain**).\\n\\n**🎯 Pourquoi créer un minoritaire dans une filiale ?**\\n- 🤝 **Concrétiser un partenariat** : s'appuyer sur un partenaire local (pays mal connu, ou détention 100 % interdite → ex. filiale commune en Chine).\\n- 🔬 **Bénéficier d'une expertise** industrielle/technologique (ex. **Vallourec** faisant entrer l'allemand **Salzgitter** à 45 % au capital de sa filiale V&M).\\n- 💎 **Extérioriser la valeur** d'une filiale pour la faire rejaillir sur le groupe (ex. **IPO de Porsche en 2022** : capitalisation à l'IPO ≈ **2× celle** de sa maison-mère Volkswagen).\\n- 🎁 Autres : partager le risque, favoriser l'actionnariat-salarié.\\n\\n**🛠️ Comment procéder ?**\\n\\n| Voie | Mécanisme |\\n|---|---|\\n| 📈 **IPO de la filiale** | Introduction en bourse d'une minorité. Soit **IPO secondaire** (la maison-mère cède une partie de ses titres → fonds chez la mère), soit **IPO primaire** (augmentation de capital de la filiale → fonds chez la filiale). Le choix dépend de **où** l'on veut que l'argent atterrisse |\\n| 🤝 **Partenaire identifié** | Cession d'une minorité (augmentation de capital souscrite par le partenaire, ou cession de titres de la mère). S'apparente à du **M&A** ; le **pacte d'actionnaires** est central dans la négociation |\",\n      \"tip\": \"**Deux bonnes pratiques** ✌️ : (1) **Éviter de multiplier** les ouvertures de capital de filiales — sinon « effet Emmental » qui pèse sur la valeur (décote de holding) et sur la flexibilité de gestion. (2) **Prévoir dès le départ le débouclement futur** : en cas d'IPO, anticiper une éventuelle sortie de bourse ; avec un partenaire, soigner les **conditions de sortie** (sa liquidité) car les partenariats sont rarement éternels et leur dénouement est difficile à protocoler à l'avance.\",\n      \"example\": \"**IPO de Porsche (2022)** 🏎️ — Volkswagen introduit en bourse une minorité du capital de Porsche. Résultat spectaculaire : la **capitalisation boursière de Porsche à l'IPO valait près de 2 fois celle de sa propre maison-mère**, Volkswagen. Illustration parfaite de l'extériorisation d'une valeur jusque-là « cachée » dans le groupe.\"\n    },\n    {\n      \"anchor\": \"s4-3\",\n      \"title\": \"3️⃣ Sortir de la bourse (squeeze-out / OPR-RO)\",\n      \"content\": \"Quitter la cote, c'est parfois l'opération inverse de l'ouverture de capital : **éliminer un minoritaire** pour mieux intégrer une filiale.\\n\\n**🤔 Pourquoi vouloir quitter la bourse ?**\\n- 🔗 **Mieux intégrer son groupe** : supprimer l'intérêt minoritaire d'une filiale.\\n- 🎯 **Parachever une prise de contrôle** : ex. **KKR** retire **Albioma** (énergies renouvelables) de la cote en 2022 juste après en avoir pris le contrôle en LBO.\\n- 🚪 **Cotation devenue incompatible** avec la gestion : ex. procédure de **retrait de cote d'EDF en 2022**.\\n- 😞 **Déception** : cours jugé décevant et/ou absence de besoin financier.\\n\\n**🚨 La règle d'or : on ne quitte PAS la bourse unilatéralement.** Un actionnaire ou la société ne peuvent décider seuls et sans condition. L'idée implicite : la cotation ne peut disparaître que lorsque la **liquidité boursière est devenue insignifiante**. Pour forcer un retrait de cote (**squeeze-out**), il faut détenir **au moins 90 % du capital ET des droits de vote**.\\n\\n**⚙️ La procédure courante : l'OPR-RO** (Offre Publique de Retrait avec Retrait Obligatoire) :\\n\\n| Étape | Contenu |\\n|---|---|\\n| **1. OPR** | Un actionnaire lance une **Offre Publique de Retrait** pour atteindre **≥ 90 %** du capital. Si le seuil n'est pas atteint → **pas de retrait de cote** |\\n| **2. RO** | L'OPR est en général **immédiatement suivie** d'un **Retrait Obligatoire**. Le prix du RO doit être **≥** au prix de l'OPR, et quasi-systématiquement accompagné d'une **attestation d'équité** (le prix est souvent contesté par les minoritaires) |\\n| **3. Effet** | C'est une **expropriation** : l'actionnaire est réputé détenir **100 %**, la cotation **disparaît**. Les minoritaires n'ayant pas apporté leurs titres sont **indemnisés** (somme bloquée à la **Caisse des Dépôts**) |\",\n      \"key_point\": \"**Le seuil magique : 90 %.** Pour forcer une sortie de bourse (squeeze-out), il faut détenir **au moins 90 % du capital ET des droits de vote**. En dessous, le retrait obligatoire est impossible — la minorité résiduelle bloque l'opération.\",\n      \"warning\": \"**Le RO est juridiquement une EXPROPRIATION.** Les minoritaires perdent leurs titres de force, d'où l'**attestation d'équité** quasi-systématique et les contestations fréquentes sur le prix. Ceux qui n'apportent pas leurs titres ne sont pas spoliés pour autant : ils sont indemnisés, la somme étant bloquée à la **Caisse des Dépôts** en attendant qu'ils la réclament.\"\n    },\n    {\n      \"anchor\": \"s4-4\",\n      \"title\": \"4️⃣ Scinder une activité : le spin-off (demerger)\",\n      \"content\": \"Économiquement, **scinder** une filiale, c'est **s'en séparer** (demerger). Par extension, une IPO ou une cession en M&A en est aussi une forme. Le mécanisme le plus courant aujourd'hui est le **spin-off**.\\n\\n**⚙️ Le mécanisme du spin-off** : la société-mère verse à ses actionnaires un **dividende payé NON pas en cash, mais en actions de la filiale** qu'elle souhaite scinder. 💡 Conséquence magique : la société scindée hérite, le jour J, **exactement du même actionnariat** que la maison-mère (un actionnaire à 15 % du groupe devient automatiquement actionnaire à 15 % de la filiale scindée).\\n\\n**Pourquoi scinder ?** Raisons **stratégiques** (actif non-core, pas de synergies, virer vers un modèle moins diversifié), **financières** (limiter la décote de holding, mieux allouer le capital), **actionnariales** (révéler une valeur sous-estimée), **humaines** (managers insuffisamment motivés) ou **techniques** (faire une IPO **sans placement**).\\n\\n**📉 Conséquences pour la maison-mère :**\\n- Diminution de taille (et de capitalisation si cotée) car, contrairement à une cession, le groupe **ne reçoit AUCUNE contrepartie** financière.\\n- ✅ Donc **pas de cash reçu, pas de plus-value, pas d'impôt** à payer par le groupe.\\n- Si le spin-off porte sur **100 %**, la filiale **disparaît** de l'organigramme.\\n\\n**📈 Conséquences pour la société scindée :**\\n- En spin-off à 100 %, elle devient **totalement indépendante**.\\n- Si la mère est cotée, le spin-off s'accompagne **simultanément** d'une cotation de la scindée : cela revient à l'**introduire directement en bourse sans placement effectif** (le placement est automatique puisque les titres sont donnés aux actionnaires de la mère).\\n\\n**💰 Création de valeur** : il y a gain pour les actionnaires si **cours du groupe AVANT spin-off < (cours du groupe APRÈS) + (cours de la société scindée)**. Un spin-off convaincant se traduit souvent par une **hausse du cours dès l'annonce** (le marché anticipe le gain).\\n\\n**Pour mémoire — variantes rares** : le **split-up** (la maison-mère est dissoute) et le **split-off** (rachat d'actions payé en titres d'une filiale plutôt qu'en cash).\",\n      \"example\": \"**L'exemple chiffré canonique** 🧮 — Le groupe A cote **100 €** et distribue 100 % des actions de sa filiale B (1 action B pour 1 action A). Après le spin-off, A cote **80 €** et B (nouvellement cotée) cote **40 €**. Le patrimoine de l'actionnaire vaut désormais **80 + 40 = 120 €** contre 100 € avant → le spin-off a **révélé 20 € de valeur** par action.\",\n      \"info\": \"**Une technique en plein boom** 🚀 — Opérations récentes de très grande taille : spin-off de **Daimler Truck** par Daimler en 2021 (≈ **25 Md€**), spin-off de 60 % du capital d'**UMG** (droits musicaux) par Vivendi, et une vague dans la pharma : **Haleon** (santé grand public de GSK, ≈ **30 Md£** à Londres), **EuroAPI** (principes actifs de Sanofi), spin-off de **Sandoz** (génériques)… (Source : Lettre Vernimmen, sept. 2023).\",\n      \"tip\": \"**Conditions d'un spin-off réussi** : (1) la société scindée doit pouvoir **assumer son indépendance** — taille suffisante, activité/perspectives/management convaincants pour le marché ; (2) sa situation financière doit être **viable** — d'où une **répartition préalable de la dette** entre la mère et la scindée, et un **accord des prêteurs** (attention aux covenants type clause de changement de contrôle).\"\n    },\n    {\n      \"anchor\": \"s4-5\",\n      \"title\": \"5️⃣ Gérer l'organigramme : leviers, contraintes & cash\",\n      \"content\": \"Hors grandes opérations ponctuelles (IPO, spin-off…), l'organigramme se **pilote en continu**. Le DAF jongle avec plusieurs leviers et contraintes.\\n\\n**🧰 Les leviers & contraintes principaux :**\\n\\n| Levier / Contrainte | Enjeu |\\n|---|---|\\n| 🧾 **Fiscalité** | Gérer la charge fiscale globale du groupe (disparités de taux d'IS pays par pays), **prix de transfert** entre filiales, retenues à la source sur les flux intra-groupe. Tout en restant dans les normes d'**acceptabilité sociale** (débats sur la taxation des multinationales) |\\n| 🌍 **Répartition géographique des actifs** | Un organigramme **déconnecté de la réalité géographique** de l'activité finit par attirer l'attention et générer des **risques fiscaux** |\\n| ⚖️ **Contraintes légales/réglementaires** | Obligation de structures juridiques autonomes bien capitalisées (ex. métier bancaire aux USA pour une banque étrangère), contrôle des changes, restrictions au rapatriement de capitaux |\\n| 👥 **Minoritaires** | Respecter les droits des actionnaires externes des filiales **limite l'optimisation globale** : les comptes de la filiale doivent refléter une réalité satisfaisante pour eux, et les systèmes d'intéressement réduisent encore la marge de manœuvre |\\n\\n**🔄 La remontée de cash & l'intégration fiscale** : les **dividendes** d'une filiale **française** vers une mère **française** ne sont quasiment **pas imposés** chez la mère (**régime mère-fille**). Mais dès que la filiale est **étrangère**, surgissent les **retenues à la source** (très variables d'un pays à l'autre) — ce qui explique parfois des organigrammes complexes.\\n\\n**🏗️ La gestion concrète au quotidien :**\\n- **Optimiser les modes de détention** : dans un groupe intégré, les filiales n'ont pas besoin d'être détenues « **en râteau** » par la mère — elles peuvent **se détenir entre elles**. Une filiale riche en fonds propres/liquidités peut souscrire au capital d'autres filiales (⚠️ avec circonspection : respect de l'objet social et des minoritaires, surtout si l'entité est cotée).\\n- **Localiser la dette intelligemment** : une dette déconnectée de l'activité et des cash-flows est une **inefficience grave**. Risque : des entités très bénéficiaires payant beaucoup d'impôts à côté d'entités en pertes (les pertes fiscales des unes ne s'imputant pas sur les gains des autres → **taux d'imposition effectif anormalement élevé**). Le groupe garde une **marge de manœuvre** pour loger la dette là où il y a de la matière imposable, structurer des prêts **sans recours**, ou établir une **hiérarchie** entre dettes (un prêt logé dans la **holding de tête** est structurellement **subordonné** à une dette située dans la filiale opérationnelle).\\n- **Optimiser la trésorerie** : plus la structure est complexe (entités à l'étranger, minoritaires fréquents), plus le **cash pooling** (centralisation de trésorerie) est difficile. Recours possible aux **prêts intra-groupe** pour atténuer les inégalités de situations de trésorerie.\\n- **Nettoyer régulièrement** : les vieux groupes accumulent des **holdings/sous-holdings inutiles et coûteuses**. Les **fusions intra-groupe** (faciles et peu chères, surtout entre entités à 100 % d'un même pays) réduisent le nombre d'entités et simplifient la structure.\",\n      \"warning\": \"**Le piège de la dette mal localisée et des minoritaires** ⚠️ — Si la dette est logée dans des entités à 100 % peu rentables, tandis que des entités **avec minoritaires** affichent un cash net positif, les **banques ne raisonneront PAS en consolidé global**. Elles regarderont le levier du **seul sous-groupe intégré** (le groupe n'ayant pas accès aux cash-flows des filiales avec minoritaires). Ce levier apparaît alors **fortement dégradé**, ce qui peut **brider la capacité du groupe à se refinancer**.\",\n      \"tip\": \"**Le DAF n'a pas besoin d'être fiscaliste**, mais il doit avoir les **bons réflexes** pour s'entourer des experts fiscaux indispensables. En matière d'organigramme, l'erreur fiscale coûte cher et se voit dans la durée.\"\n    },\n    {\n      \"anchor\": \"s4-6\",\n      \"title\": \"6️⃣ Faut-il aligner organigramme juridique & organisation opérationnelle ?\",\n      \"content\": \"La **tentation** existe de bâtir un organigramme juridique qui **reflète exactement** l'organisation opérationnelle du groupe.\\n\\n**✅ Les avantages en théorie :**\\n- Une **holding de tête** regroupant la direction générale et les services centraux (communication, direction financière groupe, juridique…).\\n- Des **sous-holdings** par métier (pour les groupes organisés par métier) ou par pays/zone (pour les groupes organisés par géographie).\\n- **Comptabilité analytique simplifiée**, voire inexistante : les états comptables de chaque sous-ensemble reflètent à peu près la performance économique de chaque division.\\n- **Responsabilisation** et mesure de la performance des dirigeants de division **facilitées**.\\n\\n**🚧 Mais les obstacles sont importants :**\\n- Beaucoup de groupes ont des organisations **matricielles** (mix métier × géographie) pour garder flexibilité, optimisation des coûts et synergies — incompatibles avec un alignement strict.\\n- ⚖️ **Deux logiques antagonistes** : l'organigramme **financier** sert l'optimisation **financière, juridique et fiscale** ; l'organigramme **opérationnel** sert la **stratégie, la conduite des affaires et l'efficacité opérationnelle**. Les concilier durablement n'est ni sain ni facile.\\n- 🖥️ Les **outils modernes de comptabilité analytique** mesurent aujourd'hui très bien la performance opérationnelle — **sans avoir besoin** de se servir de la comptabilité juridique des sociétés.\\n\\n**🎯 Conclusion** : en tout état de cause, l'**alignement** des organisations juridique et opérationnelle semble **plus naturellement adapté** aux groupes à modèle **« diversifié »** voire **« démultiplié »** (filiales autonomes, minoritaires) **qu'aux groupes « intégrés »**.\",\n      \"comparison\": \"**Organigramme financier vs organigramme opérationnel** — deux objets, deux finalités :\\n\\n| | 🧾 Organigramme **financier** (juridique) | 🏭 Organigramme **opérationnel** |\\n|---|---|---|\\n| **Sert** | Optimisation financière, juridique, **fiscale** | Stratégie, conduite des affaires, **efficacité** |\\n| **Logique** | Entités juridiques, détention, flux de capitaux | Divisions, métiers, zones, équipes |\\n| **Mesure de perf.** | Comptes sociaux | Comptabilité **analytique** (suffit aujourd'hui) |\\n\\n👉 Vouloir les superposer de force est rarement tenable dans la durée — la comptabilité analytique moderne rend l'alignement juridique inutile pour le pilotage opérationnel.\",\n      \"key_point\": \"**Ne pas chercher à tout prix la coïncidence.** Organigramme financier et organigramme opérationnel répondent à des impératifs **différents**. L'alignement convient surtout aux modèles **diversifié/démultiplié** ; pour un groupe **intégré**, mieux vaut laisser l'organigramme juridique purement technique et piloter l'opérationnel via la comptabilité analytique.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Qu'est-ce que la « décote de holding » et pourquoi existe-t-elle ?\",\n      \"a\": \"C'est le fait qu'un groupe **véritablement diversifié vaut MOINS que la somme des valeurs de ses activités**. Cause : la vraie diversification implique l'**absence de synergies** entre activités → le marché y voit un **conglomérat** et applique une décote sur la capitalisation. Phénomène universel et ancien : les holdings cotées (ex. Eurazeo, Wendel) subissent des décotes d'environ **20 % à 50 %** selon les périodes.\"\n    },\n    {\n      \"q\": \"Citez les 3 modèles-types d'organigramme et leur trait principal.\",\n      \"a\": \"**Diversifié** : juxtaposition d'activités sans synergies, holding patrimoniale légère, souplesse de cession mais **décote** quasi inévitable (ex. Eurazeo, Wendel, Bouygues). **Intégré** : filiales détenues (in)directement à **100 %**, synergies max, organigramme purement technique, le groupe fonctionne comme une seule entité (ex. grands groupes US) — c'est la référence et la tendance dominante. **Démultiplié** : entrée de **minoritaires/partenaires** → organigramme « morceau d'Emmental » à trous, qui lève des fonds et noue des partenariats mais limite synergies et flexibilité.\"\n    },\n    {\n      \"q\": \"Quel est l'effet comptable de l'ouverture du capital d'une filiale (carve-out) ?\",\n      \"a\": \"C'est une levée de fonds propres « **par le bas** ». La filiale **reste consolidée**. Les **fonds propres totaux** du groupe **augmentent**, mais les **capitaux propres part du groupe** restent **inchangés** ; apparaît une ressource « **intérêts minoritaires** ». Le **capital de la maison-mère est inchangé**. Technique précieuse quand la mère ne veut/peut pas émettre d'actions nouvelles (ex. cotation de Vilmorin par Limagrain).\"\n    },\n    {\n      \"q\": \"Quelle est la condition impérative pour forcer une sortie de bourse, et quelle est la procédure ?\",\n      \"a\": \"Il faut détenir **au moins 90 % du capital ET des droits de vote** pour un **squeeze-out**. Procédure : l'**OPR** (Offre Publique de Retrait) vise à atteindre ce seuil de 90 % ; si atteint, elle est suivie d'un **RO** (Retrait Obligatoire) au prix ≥ celui de l'OPR, avec **attestation d'équité**. Le RO est une **expropriation** : l'actionnaire est réputé détenir 100 %, la cotation disparaît, et les minoritaires non apporteurs sont indemnisés (fonds bloqués à la **Caisse des Dépôts**). Ex. KKR/Albioma (2022), EDF (2022).\"\n    },\n    {\n      \"q\": \"Décrivez le mécanisme du spin-off et l'exemple chiffré canonique.\",\n      \"a\": \"La société-mère verse un **dividende payé en actions de la filiale** à scinder (au lieu de cash). La société scindée hérite alors **du même actionnariat** que la mère. Le groupe ne reçoit **aucune contrepartie** → pas de cash, pas de plus-value, **pas d'impôt**. Exemple : A cote **100 €** et distribue 100 % de B (1 action B pour 1 A). Après : A = **80 €**, B = **40 €** → patrimoine = **120 €** contre 100 € avant → le spin-off a **révélé 20 € de valeur**. Souvent une hausse du cours **dès l'annonce**.\"\n    },\n    {\n      \"q\": \"Spin-off vs cession en M&A : quelle différence de trésorerie et d'impôt pour le groupe ?\",\n      \"a\": \"Contrairement à une **cession** (qui apporte du **cash** et peut dégager une **plus-value imposable**), le **spin-off** ne procure **aucune contrepartie financière** : pas de cash reçu, pas de plus-value, donc **pas d'impôt** à payer par le groupe. En revanche le groupe **diminue de taille** (et de capitalisation s'il est coté). C'est l'outil pour révéler de la valeur **sans** chercher de trésorerie.\"\n    },\n    {\n      \"q\": \"Pourquoi une dette mal localisée peut-elle dégrader la capacité de refinancement d'un groupe ?\",\n      \"a\": \"Si la dette est logée dans des entités à 100 % **peu rentables**, alors que des entités **avec minoritaires** détiennent le cash net positif, les **banques ne raisonnent pas en consolidé global** : elles regardent le levier du **seul sous-groupe intégré** (le groupe n'a pas accès aux cash-flows des filiales avec minoritaires). Ce levier apparaît **fortement dégradé**, ce qui peut **brider l'accès à de nouveaux financements**. D'où l'intérêt de loger la dette dans les entités générant une matière imposable suffisante.\"\n    },\n    {\n      \"q\": \"Faut-il faire coïncider organigramme juridique et organisation opérationnelle ?\",\n      \"a\": \"Pas nécessairement. Les deux répondent à des **impératifs différents** : le financier sert l'optimisation **fiscale/juridique**, l'opérationnel sert la **stratégie et l'efficacité**. Beaucoup de groupes sont **matriciels** (métier × géographie). De plus, la **comptabilité analytique** moderne mesure très bien la performance opérationnelle **sans** recourir aux comptes juridiques. L'alignement convient surtout aux modèles **diversifié/démultiplié**, beaucoup moins aux groupes **intégrés**.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF2 — HEC Paris — Capital et Ingénierie Financière\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 6 sections (contexte & motivations, ouverture de capital, sortie de bourse, spin-off, gestion de l'organigramme, alignement juridique/opérationnel) + 8 auto-tests.\",\n  \"maj\": \"2026-06-15\"\n}\n"}};
  window.addEventListener('error', function (e) {
    var el = document.getElementById('cw-error');
    if (el) { el.hidden = false; el.textContent = 'Erreur : ' + (e.message || e); }
  });
</script>
<script type="text/babel" data-type="module" data-presets="react">
import React from "react";
import { useState, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";
import { GraduationCap, ArrowLeft } from "lucide-react";

/* ============================================================
   HEC — Cours certifiants : app React (même template que Conso /
   Audit / Anglais / Références). Visualiseur de cours HEC :
   grille de cours → cours avec onglets (Sommaire + fiches),
   fiches JSON rendues en DA soignée (header, mnémo, sections +
   callouts colorés, auto-test, sources), liens du sommaire vers
   les fiches/ancres, export PDF.
   Données inlinées par build_hec.py dans window.__HEC__ :
     { manifest, files: { "<rel_path>": "<contenu brut>" } }
   ============================================================ */

const HEC = (typeof window !== "undefined" && window.__HEC__) || { manifest: {}, files: {} };
const HEC_FILES = HEC.files || {};
const HEC_MAN = HEC.manifest || {};
const HEC_ACCENT = "#8B1A2E";   // bordeaux HEC

/* ── helpers ── */
function hEsc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function hInline(s) {
  let h = hEsc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
