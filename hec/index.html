 que tu vas trouver\n\n- 📊 **SEMAINE 1** — Les 4 boîtes du bilan économique & la structure financière optimale\n- 🏦 **SEMAINE 2** — Comment structurer sa dette + crédits bancaires + financements adossés\n- 📈 **SEMAINE 3** — Obligations, hybrides et finance verte/durable\n- 🚑 **SEMAINE 4** — Restructuration : quand ça tourne mal\n\nÀ chaque section : concepts-clés, exemples concrets, tableaux et astuces mnémotechniques.\n\n---\n\n## 🟦 [SEMAINE 1 — Les grands équilibres du bilan](semaine_1.json) ✅\n\nComprendre le **bilan économique** (vs comptable), les 4 grandes composantes, la structure financière optimale (spoiler : elle n'existe pas), et la cartographie d'ensemble des financements.\n\n- [1️⃣ Les 4 composantes-clés du bilan économique](semaine_1.json#s1-1)\n- [2️⃣ Existe-t-il une structure financière optimale ?](semaine_1.json#s1-2)\n- [3️⃣ Les critères de choix + le ratio Dette nette / EBITDA](semaine_1.json#s1-3)\n- [4️⃣ Cartographie d'ensemble des financements en dette](semaine_1.json#s1-4)\n\n---\n\n## 🟩 [SEMAINE 2 — Structurer sa dette + Crédits bancaires + Financements dédiés](semaine_2.json) ✅\n\nLe gros morceau : les **8 leviers de structuration** d'une dette, les crédits bancaires MLT (Term Loan, RCF), et les financements adossés (immobilier, project finance, **LBO**, etc.).\n\n- [1️⃣ Les 8 leviers pour structurer sa dette](semaine_2.json#s2-1)\n- [2️⃣ Les crédits bancaires à moyen/long terme (TL, RCF)](semaine_2.json#s2-2)\n- [3️⃣ Le Term Sheet — document-clé](semaine_2.json#s2-3)\n- [4️⃣ Les financements adossés/dédiés (immo, project, LBO)](semaine_2.json#s2-4)\n\n---\n\n## 🟧 [SEMAINE 3 — Obligations, hybrides & finance durable](semaine_3.json) ✅\n\nMaîtriser le **marché obligataire** : paramètres-clés, notation (Investment Grade vs High Yield), grands types, déroulement d'une émission, puis les **titres hybrides** (OC, OCEANE, ORNANE, TSS...) et la finance verte/ESG.\n\n- [1️⃣ Les paramètres-clés d'une obligation](semaine_3.json#s3-1)\n- [2️⃣ La notation (rating) — IG vs High Yield](semaine_3.json#s3-2)\n- [3️⃣ Les grands types d'obligations + déroulement émission](semaine_3.json#s3-3)\n- [4️⃣ Les titres hybrides (OC, OCEANE, ORNANE, OBSA, ORA, TSS)](semaine_3.json#s3-4)\n- [5️⃣ Finance verte, responsable et durable (ESG)](semaine_3.json#s3-5)\n\n---\n\n## 🟥 [SEMAINE 4 — Restructuration du passif](semaine_4.json) ✅\n\nDistinguer la **renégociation courante** (gestion active de la dette) de la **restructuration de crise**. Cadres juridiques français (mandat ad hoc, sauvegarde, RJ), leviers de négociation (haircut, debt-equity swap, new money), et le cas pratique emblématique **Europcar 2020**.\n\n- [1️⃣ La renégociation courante](semaine_4.json#s4-1)\n- [2️⃣ La restructuration (restructuring) — situation de crise](semaine_4.json#s4-2)\n- [3️⃣ Les cadres juridiques français (mandat ad hoc, sauvegarde, RJ)](semaine_4.json#s4-3)\n- [4️⃣ Les remèdes — leviers de négociation](semaine_4.json#s4-4)\n- [5️⃣ Cas pratique — Europcar Mobility Group 2020](semaine_4.json#s4-5)\n\n---\n\n*Synthèse du Cours 1 ICCF — HEC Paris. Reproduit dans la même DA que les fiches Audit (callouts colorés, mnémoniques, auto-test). 4 fiches complètes.*\n\n*Dernière mise à jour : 2026-05-22 — Statut : ✅ **COMPLET — 4 / 4 fiches**.*\n", "cours_1_iccf_structure_financiere/semaine_1.json": "{\n  \"code\": \"ICCF — Semaine 1\",\n  \"title\": \"🟦 Semaine 1 — Les grands équilibres du bilan & typologies de dette\",\n  \"category\": \"HEC Paris — ICCF Cours 1\",\n  \"ref_msa\": \"Cours ICCF — Structure Financière & Financements\",\n  \"bases_legales\": \"Comptabilité économique vs comptable\",\n  \"normes\": \"Cadre standard finance d'entreprise (Vernimmen, Brealey-Myers)\",\n  \"niveau\": \"Initiation finance d'entreprise\",\n  \"summary\": \"Comprendre comment lire le bilan d'une entreprise en mode **bilan économique** (les 4 grandes boîtes), savoir s'il existe une structure financière optimale (spoiler : non), maîtriser les concepts de **liquidité vs solvabilité** et de **Free Cash-Flow**, et avoir une vue d'ensemble des financements en dette possibles. C'est la **fondation** sur laquelle tout le reste du cours s'appuie.\",\n  \"mnemonics\": \"**Bilan économique en 4 boîtes — IBC D** : **I**mmobilisations + **B**FR (à gauche, actif éco) = **C**apitaux propres + **D**ette financière nette (à droite, financement). Par construction : Actif éco = Capitaux investis 🟰. **BFR** : « Stocks + Clients moins Fournisseurs » → **S + C – F**.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s1-1\",\n      \"title\": \"1️⃣ Les 4 composantes-clés du bilan économique\",\n      \"content\": \"Le **bilan comptable**, c'est sympa, mais c'est **patrimonial** : il dit *qui possède quoi*. Le **bilan économique**, lui, regroupe tout en **4 grandes boîtes** pour répondre à 2 questions essentielles :\\n\\n1. Combien d'argent est **investi dans l'activité** ?\\n2. Comment est-il **financé** ?\\n\\n**Les 4 boîtes** :\\n\\n| 📦 ACTIF ÉCONOMIQUE (gauche) | 💰 CAPITAUX INVESTIS (droite) |\\n|---|---|\\n| 🏭 **Actifs immobilisés** (corporels, incorporels, financiers) | 🪙 **Capitaux propres** (capital + réserves) |\\n| 🔄 **BFR** = Stocks + Clients – Fournisseurs | 🏦 **Dette financière nette** = Dette brute – Trésorerie |\\n\\n**Règles d'or** :\\n- ✅ Actif économique = Actifs immobilisés + BFR\\n- ✅ Capitaux investis = Capitaux propres + Dette financière nette\\n- ✅ Par construction : **Actif économique = Capitaux investis** 🟰\\n\\n**Cas particuliers à connaître** :\\n- 🔹 **Dette nette négative** = cash net positif (entreprise « surcapitalisée »)\\n- 🔹 **BFR négatif** = sociétés type grande distribution (Carrefour, Lidl…) ou jouets : les clients paient cash mais les fournisseurs sont payés à 60-90 jours → c'est un **FINANCEMENT**, pas un besoin\\n- 🔹 **BFR saisonnier** = fabricants de jouets, agriculture, événementiel\",\n      \"key_point\": \"**BFR négatif = ressource gratuite de financement.** C'est exactement pour ça que la grande distribution peut tourner avec des marges fines : le BFR négatif finance une partie des immobilisations sans coût.\",\n      \"info\": \"**Bilan comptable vs économique** — le bilan comptable suit la logique patrimoniale (actif/passif au sens juridique). Le bilan économique reclasse pour faire ressortir 2 blocs : ce qui est INVESTI dans l'exploitation (gauche) vs comment c'est FINANCÉ (droite). C'est ce dernier qui sert à analyser la structure financière.\",\n      \"tip\": \"**Mnémonique BFR** : « **S**tocks + **C**lients moins **F**ournisseurs » → **S + C – F**. C'est l'argent immobilisé dans le cycle d'exploitation.\"\n    },\n    {\n      \"anchor\": \"s1-2\",\n      \"title\": \"2️⃣ Existe-t-il une structure financière optimale ?\",\n      \"content\": \"**Spoiler : NON !** ❌ Il n'y a pas de recette magique. Mais il faut quand même piloter sa structure selon **DEUX approches complémentaires**.\\n\\n**Approche MICRO** (court terme) :\\n- Pouvoir payer ses fournisseurs, impôts, salaires **à tout moment**\\n- C'est le job du **TRÉSORIER** au quotidien\\n- Risque : défaut de paiement → faillite 💀\\n\\n**Approche MACRO** (long terme) :\\n- Financer le **développement** de l'entreprise **dans la durée**\\n- C'est le job du **DAF** (Directeur Administratif et Financier)\\n- Ressources : capitaux propres, dette LT, cessions…\\n\\n**💎 Liquidité ≠ Solvabilité** (à ne JAMAIS confondre) :\\n\\n- 💧 **LIQUIDITÉ** = capacité à payer ses dettes **à tout moment** (avoir du cash dispo)\\n- 🏛️ **SOLVABILITÉ** = avoir assez d'**actifs** pour rembourser TOUS ses créanciers in fine\\n\\n**🎬 Parabole pour mémoriser** : un milliardaire arrêté par la police américaine qui a oublié son portefeuille à l'hôtel : il est **SOLVABLE** (riche) mais **ILLIQUIDE** (pas de cash sur lui) → on lui confisque sa voiture 🚗.\\n\\nÀ l'inverse : une startup qui vient de lever des fonds = **LIQUIDE** (plein de cash) mais peut être **INSOLVABLE** (pertes accumulées, fonds propres insuffisants).\\n\\n**💸 Le Free Cash-Flow (FTD) — la clé de tout** :\\n\\n```\\n  Résultat net\\n+ Dotations aux amortissements (charge sans débours de cash → on l'extourne)\\n- Variation du BFR (Δ BFR sur l'année)\\n- Dépenses d'investissements (CAPEX)\\n= 💰 FTD\\n```\\n\\n- 👉 Si **FTD positif** : on rembourse de la dette ou on verse des dividendes\\n- 👉 Si **FTD négatif** : il faut TROUVER du cash (augmentation de capital ou nouvelle dette)\\n\\n**4 facteurs qui influencent les FTD** :\\n1. Croissance de l'activité\\n2. Évolution des marges\\n3. Gestion du BFR\\n4. Ampleur des investissements\",\n      \"warning\": \"**Une entreprise peut être profitable au P&L mais MOURIR par manque de cash.** En période de crise ou de forte croissance, c'est le cash qui prime. *Cash is King* — mantra à graver.\",\n      \"example\": \"**Exemple parlant** : une startup qui vient de lever 5 M€ = très LIQUIDE. Mais si elle accumule 10 M€ de pertes sur 3 ans avant d'atteindre le break-even, elle peut devenir INSOLVABLE (capitaux propres négatifs) tout en restant liquide quelques mois. À surveiller en audit !\"\n    },\n    {\n      \"anchor\": \"s1-3\",\n      \"title\": \"3️⃣ Les critères de choix + le ratio Dette nette / EBITDA\",\n      \"content\": \"Pas de structure optimale unique, mais des **critères de choix** :\\n\\n**🏠 Critères INTERNES** :\\n- Situation dans le cycle de vie (startup vs mature)\\n- Nature de l'entreprise (cyclique ? résiliente ?)\\n- Structure des coûts\\n- Flexibilité voulue\\n- Goût des actionnaires pour le risque\\n\\n**🌍 Critères EXTERNES** :\\n- Environnement économique\\n- Benchmark concurrents\\n- Disponibilité des marchés\\n- Avis des analystes\\n- **Notation** (rating)\\n\\n**⭐ LE RATIO ROI : Dette nette / EBITDA**\\n\\nC'est **LE** ratio universel utilisé par TOUS les financiers (banquiers, agences de notation, analystes…).\\n\\n**📊 Repères pratiques** :\\n\\n| Ratio | Interprétation |\\n|---|---|\\n| 🟢 **< 1,5x** | Levier FAIBLE — entreprise peu endettée |\\n| 🟡 **1,5x – 3x** | Levier MODÉRÉ — zone confortable |\\n| 🟠 **3x – 4x** | Levier ÉLEVÉ — attention ! difficile d'entrer en bourse au-dessus de 3x |\\n| 🔴 **> 4x** | Levier PRÉOCCUPANT (hors LBO) |\\n| 💀 **6x ou plus** | Niveau typique d'un LBO |\\n\\n**Interprétation** : ce ratio dit combien d'**années d'EBITDA** seraient nécessaires pour rembourser toute la dette nette.\\n\\n⚠️ Quand **dette nette < 0** (cash net positif), le ratio devient négatif → on ne le produit pas.\",\n      \"comparison\": \"**🎯 L'effet de levier — concept fondamental.**\\n\\nQuand la rentabilité économique > coût de la dette, l'endettement **AUGMENTE** la rentabilité des capitaux propres (ROE).\\n\\n- ✅ Avantage : dope la rentabilité actionnaire\\n- ⚠️ Revers : amplifie aussi les **pertes** en cas de retournement = la dette accroît le **RISQUE** des capitaux propres\\n\\n👉 La structure de financement est donc un **CHOIX FONDAMENTAL D'ACTIONNAIRE**.\",\n      \"tip\": \"**Pour l'examen** : connaître par cœur les seuils 1,5x / 3x / 4x / 6x. Quand on te montre un ratio Dette nette/EBITDA, tu dois immédiatement positionner l'entreprise (modérée / inquiétante / LBO).\"\n    },\n    {\n      \"anchor\": \"s1-4\",\n      \"title\": \"4️⃣ Cartographie d'ensemble des financements en dette\",\n      \"content\": \"Schématiquement, on classe les financements selon **3 critères** :\\n\\n1. 🎯 **Financement GÉNÉRAL** (crédit à l'entreprise) **vs DÉDIÉ/ADOSSÉ** (lié à un actif spécifique)\\n2. ⏱️ **Maturité** : COURT TERME (≤ 1 an) vs MOYEN/LONG TERME (jusqu'à 5-7 ans, voire +)\\n3. 🏦 **Source** : BANCAIRE vs OBLIGATAIRE (marché financier)\\n\\n**Matrice complète** :\\n\\n| | **COURT TERME (≤ 1 an)** | **MOYEN/LONG TERME** |\\n|---|---|---|\\n| **🏢 CRÉDIT À L'ENTREPRISE** *(général, avec recours)* | 🏦 *Bancaire* : Facilité de caisse / Découvert, Crédit de campagne, Crédit-relais, Avances en devises, RCF<br>📈 *Marché* : Papier commercial (NEU CP), Euro CP / US CP | 🏦 *Bancaire* : Prêt à terme (Term Loan), RCF, PGE (Covid), Titres hybrides (TSS, prêts participatifs)<br>📈 *Marché* : Obligations IG / High Yield, EMTN, Placements privés (Euro PP, Schuldschein, US PP), Equity-linked (OC, échangeables), Crowdlending |\\n| **🔗 FINANCEMENT DÉDIÉ/ADOSSÉ** *(sans recours, sur actif)* | 🏦 *Bancaire* : Escompte, Dailly, Financement sur stocks, Affacturage (factoring), Crédits documentaires (export)<br>📈 *Marché* : Titrisation CT | 🏦 *Bancaire* : Crédit-bail (leasing) mobilier/immobilier, Crédit hypothécaire, Sale & Lease Back, Crédit acheteur (export), Project finance, Dette LBO, Financement avions/navires…<br>📈 *Marché* : Émissions High Yield pour LBO, Titrisation |\\n\\n**🎓 À retenir pour l'examen** :\\n- **AVEC RECOURS** = le prêteur peut se retourner contre toute la surface financière de l'emprunteur\\n- **SANS RECOURS** = le prêteur ne peut compter que sur l'actif financé\\n- Le crédit **dédié** est en général **plus cher** (plus de risque pour le prêteur)\\n- Le crédit **général** est **plus rapide** à mettre en place pour les bons clients (approche relationnelle)\",\n      \"key_point\": \"**Cette matrice est le squelette de toute la finance d'entreprise.** Chaque mode de financement étudié dans les semaines suivantes se range dans une case. Toujours te demander : avec ou sans recours ? court ou long terme ? banque ou marché ?\",\n      \"info\": \"**Désintermédiation** : tendance lourde où les marchés financiers (obligations) prennent la place des banques. Aux USA : ~2/3 marché, 1/3 bancaire. En Europe : ~80 % bancaire encore, en glissement vers le marché. France : 70/30.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Quelles sont les 4 composantes du bilan économique et comment se rangent-elles ?\",\n      \"a\": \"**Gauche (Actif économique)** : (1) **Actifs immobilisés** (corporels, incorporels, financiers) + (2) **BFR** (Stocks + Clients – Fournisseurs). **Droite (Capitaux investis)** : (3) **Capitaux propres** (capital + réserves) + (4) **Dette financière nette** (Dette brute – Trésorerie). Par construction : Actif économique = Capitaux investis.\"\n    },\n    {\n      \"q\": \"Quelle est la différence entre liquidité et solvabilité ?\",\n      \"a\": \"**Liquidité** = capacité à payer ses dettes À TOUT MOMENT (avoir du cash dispo). C'est une question de timing/trésorerie. **Solvabilité** = avoir assez d'ACTIFS pour rembourser TOUS ses créanciers in fine. C'est une question patrimoniale. Le milliardaire au portefeuille oublié est solvable mais illiquide. La startup qui vient de lever est liquide mais peut être insolvable (pertes accumulées).\"\n    },\n    {\n      \"q\": \"Formule du Free Cash-Flow (FTD) ?\",\n      \"a\": \"**FTD = Résultat net + Dotations aux amortissements – Variation du BFR – CAPEX**. On extourne les amortissements (charge non cash), on retranche la variation de BFR et les investissements. Si FTD > 0 : on rembourse de la dette ou on verse des dividendes. Si FTD < 0 : il faut trouver du cash (augmentation de capital ou nouvelle dette).\"\n    },\n    {\n      \"q\": \"Quel est LE ratio universel pour mesurer le levier financier et quels sont les seuils-clés ?\",\n      \"a\": \"**Dette nette / EBITDA**. Seuils : **< 1,5x** levier faible · **1,5x – 3x** modéré (zone confortable) · **3x – 4x** élevé (difficile d'entrer en bourse au-dessus de 3x) · **> 4x** préoccupant hors LBO · **6x+** niveau typique LBO. Interprétation : nombre d'années d'EBITDA pour rembourser la dette nette.\"\n    },\n    {\n      \"q\": \"Différence entre financement avec recours et sans recours ?\",\n      \"a\": \"**AVEC RECOURS** = le prêteur peut se retourner contre **toute la surface financière** de l'emprunteur (crédit à l'entreprise général). **SANS RECOURS** = le prêteur ne peut compter que sur **l'actif financé** (crédit dédié/adossé). Conséquences : sans recours = plus risqué pour le prêteur = généralement plus cher. Mais permet de **déconsolider** dans certains cas (offrir une capacité d'endettement complémentaire).\"\n    },\n    {\n      \"q\": \"Pourquoi un BFR négatif est-il une bonne nouvelle ?\",\n      \"a\": \"Parce que **les clients paient AVANT que l'entreprise paie ses fournisseurs**. C'est une **ressource gratuite de financement** : l'entreprise dispose temporairement du cash de ses clients. Cas classique : **grande distribution** (Carrefour, Lidl, Aldi) — encaissement immédiat des clients, paiement fournisseurs à 60-90 jours. Le BFR négatif finance une partie des immobilisations sans coût.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF — HEC Paris — Initiation à la Comptabilité et la Finance\",\n    \"Vernimmen — Finance d'entreprise (référence académique française)\",\n    \"Brealey, Myers, Allen — Principles of Corporate Finance\"\n  ],\n  \"statut\": \"✅ Complet — 4 sections (bilan économique, structure optimale, ratio levier, cartographie financements) + 6 auto-tests.\",\n  \"maj\": \"2026-05-22\"\n}\n", "cours_1_iccf_structure_financiere/semaine_2.json": "{\n  \"code\": \"ICCF — Semaine 2\",\n  \"title\": \"🟩 Semaine 2 — Structurer sa dette + Crédits bancaires + Financements dédiés\",\n  \"category\": \"HEC Paris — ICCF Cours 1\",\n  \"ref_msa\": \"Cours ICCF — Structure Financière & Financements\",\n  \"bases_legales\": \"Term Sheet · LMA Loan Market Association · Bâle 3\",\n  \"normes\": \"Cadres-types LMA Londres\",\n  \"niveau\": \"Initiation finance d'entreprise\",\n  \"summary\": \"Le **gros morceau** du cours : on apprend à **structurer un emprunt** sur **8 dimensions** (les 8 leviers négociés dans un Term Sheet), à maîtriser les **crédits bancaires MLT** (Term Loan, RCF), à comprendre le **Term Sheet** et ses 3 modes de mise en place (bilatéral, club deal, syndiqué), puis à découvrir les **financements adossés/dédiés** : immobilier, project finance et surtout la **dette LBO** (le cas extrême du levier).\",\n  \"mnemonics\": \"**Les 8 leviers de structuration — A-B-M-D-T-S-C-C** : **A**dosser ou non · **B**anque ou marché · **M**aturité et remboursement · **D**evise · **T**aux fixe ou variable · **S**éniorité · **C**ovenants · **C**oût total. Tout endettement se construit en arbitrant ces 8 dimensions dans le Term Sheet.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s2-1\",\n      \"title\": \"1️⃣ Les 8 leviers pour structurer sa dette\",\n      \"content\": \"Tout endettement se construit en arbitrant sur **8 dimensions**. C'est exactement ce que tu négocies dans un **Term Sheet** bancaire.\\n\\n**🧰 La checklist des 8 leviers** :\\n\\n1. **ADOSSER ou non** sa dette (avec ou sans recours ?)\\n2. **BANQUE ou MARCHÉ** (financement bancaire vs obligataire) ?\\n3. **MATURITÉ** et échéances de remboursement ?\\n4. **DEVISE** d'emprunt ?\\n5. **TAUX FIXE ou TAUX VARIABLE** ?\\n6. **SÉNIORITÉ** (rang) : senior ou subordonnée ?\\n7. **COVENANTS** : quelle politique d'engagements ?\\n8. **COÛT global** du crédit et impact sur la structure ?\\n\\n---\\n\\n**🔗 Levier 1 — Adosser ou non ?**\\n\\n| Crédit À L'ENTREPRISE (avec recours) | Financement DÉDIÉ/ADOSSÉ (sans recours) |\\n|---|---|\\n| 👍 Rapidité d'octroi · Adaptable · Coût faible pour bonnes signatures | 👍 Capacité d'endettement complémentaire · Permet de financer quand surface globale ne suit plus · Possibilité de déconsolider |\\n| 👎 Peu adapté à des projets spécifiques | 👎 Complexité mise en œuvre · Coûts élevés (analyse risque) · Restructuration coûteuse |\\n\\n**🏦 Levier 2 — Banque ou marché ?**\\n\\n- 🇺🇸 USA : ~2/3 marché obligataire, 1/3 bancaire\\n- 🇪🇺 Europe : ~80 % bancaire, 20 % obligataire (France : 70/30)\\n\\n| 🏦 BANQUE | 📈 MARCHÉ |\\n|---|---|\\n| Relationnel, flexible, tirage progressif, dette **amortissable**, pas de rating obligatoire, discrétion | Maturités plus longues, dette **bullet** (in fine), moins de covenants, mais : taille mini ~200-300 M€, rating requis, dette tirée d'emblée, reporting public |\\n\\n**⏱️ Levier 3 — Maturité et remboursement** :\\n\\n⚠️ Le risque MAJEUR : le **« MUR DE DETTE »** = un montant énorme exigible au même moment, impossible à couvrir.\\n\\n📐 Règle de bon sens : un **actif long se finance par une dette longue** (pas par du CT renouvelable, risque de non-renouvellement).\\n\\n**🔄 Modes de remboursement** :\\n- **AMORTISSABLE** : remboursé progressivement (capital constant, annuités constantes…) → typique du **bancaire**\\n- **BULLET / IN FINE** : tout remboursé à l'échéance → typique de l'**obligataire**\\n\\n⚠️ Attention au **« coût de portage »** : avec une dette bullet, si l'entreprise accumule du cash inutilisé, elle paye des intérêts sur la totalité alors que son cash dort.\\n\\n**💱 Levier 4 — Devise** :\\n\\nFinancer un actif **dans la même monnaie** qu'il génère ses cash-flows, pour limiter le risque de change. Attention à l'illusion d'une devise « pas chère » en taux : l'appréciation future peut anéantir l'économie. Gestion possible via **swaps de change**.\\n\\n**📊 Levier 5 — Taux fixe ou variable ?**\\n\\n| 🔒 TAUX FIXE | 〰️ TAUX VARIABLE |\\n|---|---|\\n| Taux figé pour toute la durée. ✅ Privilégier pour : activités cycliques / faible visibilité, entreprises à fort levier (Utilities, LBOs), sécurité du budget intérêt | Taux de référence (Euribor, Libor) + marge en **bps** (100 bps = 1 %). ✅ Privilégier pour : activité protégée contre l'inflation, anticipation baisse des taux |\\n\\n**🔄 Le SWAP de taux — couteau suisse** : permet d'échanger des flux d'intérêts entre 2 contreparties. Tu peux changer de profil de taux à tout moment SANS renégocier ta dette de base. 🪄\\n\\n**🪜 Levier 6 — Séniorité de la dette** :\\n\\n- 🥇 **DETTE SENIOR** = remboursée en premier en cas de liquidation → moins risquée → moins chère\\n- 🥈 **DETTE SUBORDONNÉE** = remboursée APRÈS la senior → plus risquée → plus chère\\n\\n**2 types de subordination** :\\n- 🔹 **CONTRACTUELLE** : définie dans le contrat (clauses *pari passu*)\\n- 🔹 **STRUCTURELLE** : une dette à la **holding** est de facto subordonnée à une dette logée dans une **filiale** opérationnelle (la holding n'a pas de revenus directs)\\n\\n**📜 Levier 7 — Les COVENANTS** :\\n\\n**Définition** : engagements, règles et ratios que l'emprunteur doit respecter pendant toute la durée du prêt, faute de quoi la dette devient **immédiatement exigible**.\\n\\n🎯 Objectif pour le prêteur : surveiller le risque comme un « thermomètre » → alerte précoce en cas de dégradation.\\n\\n| 📊 Covenants FINANCIERS | 🏗️ Covenants STRUCTURELS | 🎭 Clauses SPÉCIALES |\\n|---|---|---|\\n| Dette nette / EBITDA · EBITDA / Charges d'intérêts · Cash-flow / Service de la dette · Dette nette / Capitaux propres (gearing) | Non-cession d'actifs significatifs · Limitation M&A · Nantissements (pledge) · Limitation dividendes (classique en LBO) | Cross default · Pari passu · Negative pledge · MAC (Material Adverse Change) · Change of control |\\n\\n💥 **Le BRIS DE COVENANT** — rarement l'exigibilité immédiate. C'est un rendez-vous obligatoire avec la banque qui peut aboutir à :\\n- Un **RELÂCHEMENT** (waiver, desserrement) – contre commission/marge\\n- Une renégociation plus sérieuse\\n- Voire un **RESTRUCTURING** (cf. Semaine 4)\\n\\n🆕 Tendance récente : les crédits **« COV-LITE »** (covenant light) – covenants ultra-souples, surtout en LBO et placements privés.\\n\\n**💰 Levier 8 — Coût total du crédit** :\\n\\nLe coût n'est PAS que le taux d'intérêt facial ! Le **TAUX EFFECTIF** intègre :\\n- Le taux d'intérêt\\n- Les commissions bancaires (arrangement, garantie, engagement/non-utilisation, agent…)\\n- La prime de remboursement éventuelle\\n- Les assurances\\n\\n⚖️ **Le coût n'est pas le seul critère** : maturité, taille, subordination, garanties, recours, équilibre marges/covenants (parfois on accepte de payer plus cher pour éviter des covenants contraignants), flexibilité, rapidité, diversification des sources…\",\n      \"warning\": \"**MUR DE DETTE** = risque majeur. Si toute ta dette arrive à échéance la même année, tu es à la merci du marché. Toujours **étaler** les maturités, lisser le profil. Audit : examiner le tableau des échéances de dette.\",\n      \"key_point\": \"**Term Sheet = la convergence des 8 leviers.** Quand tu négocies une dette, tu négocies ces 8 dimensions. Maîtriser ces 8 leviers = maîtriser 90 % de la finance de la dette.\"\n    },\n    {\n      \"anchor\": \"s2-2\",\n      \"title\": \"2️⃣ Les crédits bancaires à moyen/long terme (Term Loan & RCF)\",\n      \"content\": \"**🎯 TERM LOAN (TL)** :\\n- Durée 2-7 ans (voire 10+)\\n- Montant pouvant atteindre **plusieurs milliards €**\\n- Tirage en une fois ou par tranches\\n- Amortissable OU bullet\\n- Pas de commission de non-utilisation\\n\\n**🔄 REVOLVING CREDIT FACILITY (RCF)** :\\n- Ligne **CONFIRMÉE** moyenne/longue durée\\n- Tirage et remboursement **à la main de l'emprunteur** (flexible)\\n- **Commission d'engagement** (commitment fee) sur la partie non tirée\\n- En forte croissance car très flexible\\n\\n**Différence essentielle** :\\n- TL = enveloppe tirée d'un coup (ou par tranches programmées), utilisable une fois\\n- RCF = enveloppe rechargeable, tu tires/rembourses comme tu veux dans la limite du plafond (comme un découvert mais à long terme)\\n\\nLes RCF servent souvent de **back-up de trésorerie** : sécurité de liquidité pour parer aux imprévus. En cas de Covid-style, on tire massivement sur la RCF pour avoir du cash.\\n\\n**⚙️ Le marché du crédit bancaire est CYCLIQUE.** Il dépend de :\\n- L'**appétit des banques** pour le risque\\n- La **liquidité** des marchés de refinancement\\n- Les **ratios réglementaires** (Bâle 3 : ~10 % de fonds propres minimum sur les encours pondérés)\\n- La capacité à **syndiquer** (Originate to Distribute)\\n- Les **politiques monétaires** et de soutien (ex : PGE Covid)\",\n      \"info\": \"**Bâle 3** impose aux banques européennes de détenir ~10 % de fonds propres sur les encours pondérés selon le risque. Conséquence directe : une banque ne peut pas prêter sans limite — chaque crédit consomme du capital réglementaire. C'est aussi pour ça que la syndication existe : partager le risque entre plusieurs banques pour économiser le capital.\"\n    },\n    {\n      \"anchor\": \"s2-3\",\n      \"title\": \"3️⃣ Le Term Sheet — document-clé + 3 modes de mise en place\",\n      \"content\": \"**📋 Le Term Sheet en 60 secondes** :\\n\\n- ✏️ Document d'environ **10 pages** qui résume les principales dispositions commerciales et juridiques\\n- 🏛️ Cadres-types définis par la **LMA** (Loan Market Association) de Londres\\n- ⚖️ En théorie **non engageant** juridiquement, mais en pratique : signé, marque la fin de la négociation\\n- 👨‍⚖️ Ensuite : documentation juridique détaillée rédigée par des **avocats spécialisés**\\n\\n**📝 Les rubriques d'un Term Sheet** (à connaître par cœur) :\\n\\n- ✅ Emprunteur (désignation)\\n- ✅ Banques mandatées (**Mandated Lead Arrangers**) + Agent\\n- ✅ Nature (TL, RCF, multi-tranches, multidevises)\\n- ✅ Montant\\n- ✅ Maturité + échéances\\n- ✅ Objet du crédit\\n- ✅ Conditions de tirage\\n- ✅ Rang (senior / subordonné)\\n- ✅ Taux d'intérêt + marges (parfois variables selon rating, levier, **critères ESG**)\\n- ✅ Commissions (arrangement, non-utilisation, garantie, agent)\\n- ✅ Remboursement (amortissable linéaire, profil custom, in fine bullet)\\n- ✅ Remboursement anticipé + pénalités\\n- ✅ **Covenants**\\n- ✅ Garanties éventuelles\\n- ✅ Cas de défaut\\n- ✅ Pari passu, cross default, negative pledge, MAC, KYC\\n- ✅ Modifications du contrat (quorum + majorité requise pour waivers)\\n- ✅ Juridiction et tribunaux compétents\\n\\n---\\n\\n**🏗️ Mise en place du crédit — 3 modes** :\\n\\n| 1️⃣ BILATÉRAL | 2️⃣ CLUB DEAL | 3️⃣ SYNDIQUÉ |\\n|---|---|---|\\n| UNE banque face au client. ✅ Adapté aux petites tailles, urgence, confidentialité. | Petit groupe de banques (3-6). ✅ Tailles moyennes, mise en place rapide, relation bancaire forte. | Pool large de banques avec hiérarchie. **MLA** structure et coordonne · **Underwriting** = MLA garantit la bonne fin du crédit · **Bookrunner** constitue le syndicat (1-2 mois) · **Take and hold** = prise finale de chaque banque. ✅ Très grosses tailles, partage de risque |\\n\\n**⏰ Timing d'une syndication** :\\n- 📋 Term Sheet : **2 à 3 semaines**\\n- 🏗️ Syndication + documentation juridique : **3 à 4 semaines**\\n- 🎯 Total : **1 à 2 mois** entre désignation du MLA et déblocage des fonds\",\n      \"tip\": \"**LMA Loan Market Association** = référence de marché à Londres. Les Term Sheets bancaires européens suivent largement ces cadres-types. C'est l'équivalent finance de ce que la SIA Société des Ingénieurs Architectes est pour les contrats de construction en Suisse.\"\n    },\n    {\n      \"anchor\": \"s2-4\",\n      \"title\": \"4️⃣ Les financements adossés/dédiés — Immo, Project Finance, LBO\",\n      \"content\": \"**🏠 Les financements immobiliers** :\\n\\n| 🏛️ Crédit HYPOTHÉCAIRE | 🤝 Crédit-BAIL immobilier | 🔄 Sale & LEASE BACK |\\n|---|---|---|\\n| Hypothèque sur le bien · LTV ~50-60 % · Maturité ~7 ans · Plus SOUPLE (rachat anticipé facile) · Frais d'enregistrement importants · Souvent en club deal | L'établissement financier est PROPRIÉTAIRE · L'entreprise loue avec option d'achat finale · Maturité 10-20 ans · LTV 80-90 % · Sécurité supérieure pour le bailleur · Moins flexible · Avantage fiscal | L'entreprise VEND son immobilier puis le LOUE à long terme · Extériorisation de valeur · Cash immédiat → baisse de la dette nette · Mais sorties de cash futures (loyers) |\\n| Utilisé par PME/PMI, foncières | ⚠️ IFRS 16 : bilan affecté (actif + dette) — pas de déconsolidation | 🎬 Cas célèbre : **ACCOR** vendant les murs de ses hôtels (modèle « asset-light ») |\\n\\n---\\n\\n**🏗️ Le PROJECT FINANCE** :\\n\\n**Principe** : financer un projet d'infrastructure ou énergétique de **GRANDE TAILLE** (> 500 M€) via une **structure ad hoc (SPV)** qui isole le risque du groupe initiateur. Toutes les parties prenantes (prêteurs, partenaires, actionnaires) se retrouvent dans la SPV. La dette est **SANS RECOURS** : les prêteurs ne comptent que sur les **cash-flows du projet**.\\n\\n**Les 3 grands types de projets** :\\n1. Projets industriels\\n2. Exploitation de ressources naturelles (accords gouvernementaux)\\n3. **Partenariats Public-Privé (PPP)** : Tour Eiffel 🗼, Stade de France, Viaduc de Millau, autoroutes…\\n\\n**📦 3 contrats-clés** :\\n- Contrat de construction\\n- Contrat de concession\\n- Contrats commerciaux long terme (**take or pay** / **take and pay**)\\n\\n**Caractéristiques typiques** :\\n- Répartition **Dette/Capitaux propres ≈ 80/20**\\n- Dette SENIOR, maturité **> 10 ans**\\n- Source principalement bancaire, mais émissions obligataires possibles\\n- Marge moyenne ≈ 100 bps\\n- Bullet le plus souvent\\n- Marché mondial **> 300 milliards $ par an**\\n- Cas de défaut RARES en pratique\\n- 🔧 Souvent organisé avec **AssetCo** (qui détient l'actif) + **OpCo** (qui exploite)\\n\\n---\\n\\n**💎 La DETTE LBO — le cas extrême du levier** :\\n\\n**🎯 LBO = Leveraged Buy-Out** :\\n- 🏢 Acquisition (en général majoritaire) par un **FONDS DE PRIVATE EQUITY**\\n- 💸 Financement principalement par **DETTE** (souvent + de 50 % du prix)\\n- 📊 Levier moyen LBO européen : **~x6 EBITDA**\\n- 🎯 La participation est revendue après quelques années\\n\\n**🏗️ Montage** : **HOLDING D'ACQUISITION** = capital (fonds) + dette d'acquisition.\\n⚖️ **INTÉGRATION FISCALE** = déductibilité des intérêts (effet de levier fiscal).\\n\\n**🪜 Les tranches de dette LBO** :\\n\\n- 🥇 **DETTE SENIOR** (bancaire) :\\n  - Tranche A : amortissable 6/7 ans\\n  - Tranche B : 7/8 ans\\n  - Tranche C : 8/9 ans (amortissable ou bullet)\\n  - Marges 400-500 bps\\n  - Souvent swapée à taux fixe\\n\\n- 🥈 **DETTE MEZZANINE** (privée, subordonnée) :\\n  - Souscrite par fonds spécialisés (mezzaneurs)\\n  - Intérêts faibles + intérêts **PIK** (Paid In Kind) capitalisés\\n  - Avec ou sans warrants\\n  - Coût global ~10-12 %\\n\\n- 📈 **DETTE HIGH YIELD** (marché) :\\n  - Obligations à haut rendement, bullet, taux fixe\\n  - Coût 500-600 bps au-dessus des taux d'état\\n  - Taille minimum ~150-200 M€\\n\\n- 🔧 **UNITRANCHE** : produit synthétique combinant senior + subordonnée (fonds de dette)\\n\\n---\\n\\n**🚢 Les autres financements dédiés** :\\n- 🚢 Financement aéronautique, maritime, pétrolier (sectoriels)\\n- 📤 **Crédit acheteur (export)** — garanti par **COFACE** ou **Bpifrance**\\n- 📊 **La TITRISATION** — conversion d'actifs illiquides en titres négociables (**ABS, CDO, CLO**). Cédés à une SPV qui émet des titres aux investisseurs institutionnels. ⚠️ Origine de la crise des **subprimes 2007**\\n- 💼 **Margin loans** — prêts adossés sur titres cotés (ex : Elon Musk projetant le rachat de Twitter sur sa participation Tesla)\",\n      \"warning\": \"**Titrisation = arme à double tranchant.** Outil utile pour le financement (transformer des créances en cash immédiat). Mais cause profonde de la crise des subprimes 2007 : titres adossés à des prêts immobiliers risqués, AAA-isés artificiellement par les agences, ramassés par investisseurs institutionnels qui ne comprenaient pas le risque sous-jacent.\",\n      \"example\": \"**Cas ACCOR Sale & Lease Back** — Accor a cédé les **murs** de ses hôtels tout en conservant l'**exploitation** et la **marque** (modèle dit **« asset-light »**). Avantages : extériorisation de valeur, cash immédiat pour désendettement / acquisitions. Coût : loyers futurs à payer.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Quels sont les 8 leviers pour structurer une dette ?\",\n      \"a\": \"**(1) ADOSSER ou non** (avec/sans recours) · **(2) BANQUE ou MARCHÉ** · **(3) MATURITÉ et remboursement** · **(4) DEVISE** · **(5) TAUX FIXE ou VARIABLE** · **(6) SÉNIORITÉ** (senior/subordonnée) · **(7) COVENANTS** · **(8) COÛT global** (taux + commissions + primes + assurances). C'est exactement ce qu'on négocie dans un Term Sheet.\"\n    },\n    {\n      \"q\": \"Différence Term Loan vs RCF ?\",\n      \"a\": \"**Term Loan** = enveloppe **tirée d'un coup** (ou par tranches programmées), utilisable une fois, durée 2-7 ans, amortissable ou bullet, pas de commission de non-utilisation. **RCF** = ligne **CONFIRMÉE** rechargeable, tu tires/rembourses comme tu veux dans la limite du plafond (comme un découvert MLT), avec **commission d'engagement** sur la partie non tirée. Très flexible — sert souvent de back-up de trésorerie (Covid).\"\n    },\n    {\n      \"q\": \"Que se passe-t-il en cas de bris de covenant ?\",\n      \"a\": \"**Rarement l'exigibilité immédiate.** C'est un rendez-vous obligatoire avec la banque qui peut aboutir à : (1) un **RELÂCHEMENT (waiver)** des contraintes contre commission/marge ; (2) une **renégociation** plus sérieuse ; (3) voire un **RESTRUCTURING** (cf. Semaine 4). Tendance récente : crédits **COV-LITE** (covenant light) — covenants ultra-souples, surtout en LBO et placements privés.\"\n    },\n    {\n      \"q\": \"Différence entre les 3 modes de mise en place d'un crédit (bilatéral / club deal / syndiqué) ?\",\n      \"a\": \"**BILATÉRAL** : 1 banque face au client. Petites tailles, urgence, confidentialité. **CLUB DEAL** : 3-6 banques. Tailles moyennes, mise en place rapide, relation bancaire forte. **SYNDIQUÉ** : pool large de banques avec hiérarchie — MLA (Mandated Lead Arranger) structure et coordonne, Underwriting (MLA garantit la bonne fin), Bookrunner constitue le syndicat, Take and hold = prise finale de chaque banque. Très grosses tailles. Timing : 1-2 mois entre désignation MLA et déblocage.\"\n    },\n    {\n      \"q\": \"Qu'est-ce que le project finance et son ratio Dette/Capital typique ?\",\n      \"a\": \"**Project Finance** = financement d'un projet d'infrastructure / énergie de **GRANDE TAILLE** (> 500 M€) via une **SPV ad hoc** isolant le risque. **Dette SANS RECOURS** sur les cash-flows du projet. **Répartition Dette/Capitaux propres ≈ 80/20** — très endetté. Dette senior, maturité > 10 ans, marge ~100 bps, bullet le plus souvent. 3 types : industriels, ressources naturelles, **PPP** (Tour Eiffel, Stade de France, autoroutes). 3 contrats-clés : construction, concession, commerciaux LT (take or pay).\"\n    },\n    {\n      \"q\": \"Quel est le levier moyen d'un LBO européen et les tranches de dette LBO ?\",\n      \"a\": \"**Levier moyen LBO européen : ~x6 EBITDA**. **Tranches** : (1) **Dette SENIOR** bancaire — Tranche A amortissable 6-7 ans, Tranche B 7-8 ans, Tranche C 8-9 ans, marges 400-500 bps ; (2) **Dette MEZZANINE** subordonnée — intérêts cash faibles + **PIK** (Paid In Kind) capitalisés, coût global 10-12 % ; (3) **Dette HIGH YIELD** obligataire — bullet taux fixe, 500-600 bps au-dessus des taux d'état, taille min ~150-200 M€ ; (4) **UNITRANCHE** — produit synthétique senior + subordonné par fonds de dette. **Intégration fiscale** = déductibilité des intérêts (levier fiscal).\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF — HEC Paris — Initiation à la Comptabilité et la Finance\",\n    \"LMA Loan Market Association — modèles Term Sheets : https://www.lma.eu.com\",\n    \"Bâle 3 — exigences fonds propres bancaires (~10 % encours pondérés)\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 4 sections (8 leviers, crédits bancaires MLT, Term Sheet et syndication, financements adossés/LBO) + 6 auto-tests.\",\n  \"maj\": \"2026-05-22\"\n}\n", "cours_1_iccf_structure_financiere/semaine_3.json": "{\n  \"code\": \"ICCF — Semaine 3\",\n  \"title\": \"🟧 Semaine 3 — Obligations, hybrides & finance durable\",\n  \"category\": \"HEC Paris — ICCF Cours 1\",\n  \"ref_msa\": \"Cours ICCF — Structure Financière & Financements\",\n  \"bases_legales\": \"AMF · règles ratings S&P / Moody's / Fitch\",\n  \"normes\": \"EMTN · LMA · classement IG/HY\",\n  \"niveau\": \"Initiation finance d'entreprise\",\n  \"summary\": \"Maîtriser les financements de **MARCHÉ** : les **obligations** classiques (paramètres-clés, notation, types, déroulement d'émission), les **titres hybrides** entre dette et capital (convertibles **OC**, **OCEANE**, **ORNANE**, **OBSA**, **ORA**, **TSS**…), et la **finance verte/durable** qui transforme la finance d'entreprise (green bonds, social bonds, sustainability-linked).\",\n  \"mnemonics\": \"**Frontière critique du marché obligataire — IG vs HY** : **I**nvestment **G**rade = ≥ **BBB-** (S&P) → grand marché, spreads bas, accessibles aux institutionnels. **H**igh **Y**ield = < BBB- → marché spécialisé, spreads élevés. Certains investisseurs (assurances) ne PEUVENT pas juridiquement acheter du non-IG !\",\n  \"sections\": [\n    {\n      \"anchor\": \"s3-1\",\n      \"title\": \"1️⃣ Les paramètres-clés d'une obligation\",\n      \"content\": \"**🧱 L'obligation en 4 lignes** :\\n- Une **valeur mobilière** (titre de créance) à plus d'un an\\n- Émise par État, entreprise privée/publique ou collectivité\\n- Souscrite par des **investisseurs** (pas les banques)\\n- **Négociable en bourse**\\n\\n🌍 Marché en **désintermédiation** : phénomène mondial où les marchés financiers prennent la place des banques.\\n\\n**🔑 Les paramètres-clés** :\\n\\n| 💵 PRIX & MONTANT | ⏰ DURÉE & RBT | 💸 RÉMUNÉRATION |\\n|---|---|---|\\n| Taille mini ~100 M€ (jusqu'à plusieurs Md€) · Toutes grandes devises · Prix d'émission = **% du pair** : au-dessus (>100 %), au pair (100 %), en-dessous (<100 %) ex. Ahold 99,63 % | 2 à 30 ans · Voire perpétuelles · Remboursement **IN FINE (bullet)** le plus souvent · Prime de remboursement possible · Clauses de remboursement anticipé (call émetteur) | **COUPON** = taux d'intérêt facial · Annuel (EUR), semestriel (USD), trimestriel (FRN) · Zéro coupon possible · Prime d'émission / de remboursement |\\n\\n**🧮 Taux de rendement actuariel (Yield to Maturity)** :\\n\\nC'est le **VRAI coût** pour l'émetteur (et le rendement attendu de l'investisseur s'il garde jusqu'au remboursement).\\n\\nIl intègre :\\n- ✅ Le taux d'intérêt facial\\n- ✅ La prime d'émission (baisse le rendement)\\n- ✅ La prime de remboursement (augmente le rendement)\\n- ✅ Les décalages temporels\\n\\n⚖️ Si émis au pair ET remboursé au pair → **taux actuariel = taux facial**.\\n\\n**🎬 Exemple Ahold (mars 2021)** : coupon 0,375 % mais émise à 99,63 % → **YTM = 0,417 %**\\n\\n---\\n\\n**📊 Le SPREAD (ou marge actuarielle)** :\\n\\n```\\nSpread = Taux de rendement actuariel – Taux SANS RISQUE de même maturité\\n```\\n\\n**📐 Référence taux sans risque (zone €)** :\\n- **OAT** (obligations assimilables du Trésor français)\\n- **Mid-swap (MS)** = moyenne taux prêteur / emprunteur sur le marché des swaps\\n\\n**🎯 Le spread dépend de** :\\n- Le **RISQUE DE CRÉDIT** (rating de l'emprunteur) → **CLÉ**\\n- Les garanties éventuelles\\n- Le rang\\n- L'échéance\\n\\n📉 Évolutions extrêmes pendant les crises : subprime 2009, crise euro 2011, Covid 2020.\\n\\n**💡 Formule magique** : **Taux de rendement = Taux de référence + Marge de crédit**\",\n      \"info\": \"**Bullet vs Amortissable** — en obligataire, on rembourse **in fine (bullet)** quasi-systématiquement. Pourquoi ? Parce que la base d'investisseurs (gestionnaires d'actifs, fonds de pension, assureurs) veut un coupon stable et un remboursement final clair. Amortissable ferait éclater la séquence de coupons, peu pratique pour gérer en portefeuille.\",\n      \"example\": \"**Exemple YTM** : tu émets une obligation 10 ans, nominal 100 €, coupon 2 %, prix d'émission 98 %. Tu reçois 98 € à l'émission. Tu paies 2 € de coupon chaque année. À l'échéance, tu rembourses 100 €. Le YTM ≈ 2,23 % (≈ taux facial + amortissement de la prime d'émission sur 10 ans). C'est ton **vrai coût d'emprunt**.\"\n    },\n    {\n      \"anchor\": \"s3-2\",\n      \"title\": \"2️⃣ La notation (rating) — IG vs High Yield\",\n      \"content\": \"**🏢 Les 3 grandes agences de notation** :\\n- 🇺🇸 **S&P Global** (Standard & Poors)\\n- 🇺🇸 **Moody's**\\n- 🇺🇸 **Fitch**\\n\\nAussi : Banque de France, assureurs-crédit (Euler Hermès).\\n\\n💰 **Modèle** : payé par l'**EMPRUNTEUR** (conflit d'intérêt souvent critiqué — surtout depuis la crise 2008).\\n\\n⚠️ La notation porte sur un **INSTRUMENT spécifique**, pas sur l'entreprise globalement.\\n\\n**📊 Échelle de notation** :\\n\\n| Moody's | S&P / Fitch | Signification |\\n|---|---|---|\\n| **Aaa** | **AAA** | Meilleure qualité (Allemagne) |\\n| **Aa** | **AA** | Haute qualité (Nestlé, Sanofi) |\\n| **Baa** | **BBB** | Qualité moyenne (Orange, Italie) |\\n| **Ba** | **BB** | Spéculatif (Nexans) |\\n| **B** | **B** | Faible capacité (Casino) |\\n| **Caa** | **CCC** | Danger sur les intérêts (CGG, Congo) |\\n| **Ca** | **C** | Hautement spéculatif |\\n| **C** | **C** | Proche du dépôt de bilan |\\n\\n---\\n\\n**🎯 La grande frontière : INVESTMENT GRADE vs HIGH YIELD**\\n\\n- 🟢 **INVESTMENT GRADE** = **≥ BBB-** (S&P) → accès au grand marché, spreads bas\\n- 🔴 **NON INVESTMENT GRADE** = **< BBB-** → marché **High Yield**, spreads élevés\\n\\n⚠️ Certains investisseurs institutionnels (assureurs LPP, fonds pension, certains fonds monétaires) ne **PEUVENT PAS juridiquement** acheter du non-IG ! Conséquence : tomber de BBB- à BB+ = **chute brutale des prix** car force-selling.\\n\\n💸 **Coûts d'une notation** : ~500 000 € initial + cher psychologiquement en cas de **downgrading**.\",\n      \"warning\": \"**Effet « falling angels »** — quand une entreprise IG est rétrogradée en HY (passage BBB- → BB+), les investisseurs institutionnels obligés de vendre = chute brutale du prix de l'obligation. Cas typique en crise : Ford 2005, plusieurs européens 2020. Surveiller en audit les ratios proches du seuil IG/HY.\",\n      \"info\": \"**Conflit d'intérêt agences de notation** — les agences sont payées par l'émetteur (celui qu'elles notent !). Crise des subprimes : les agences ont noté AAA des paquets de prêts pourris pour faire plaisir aux émetteurs et toucher les commissions. Réformes post-2008 mais le modèle de financement reste critiqué.\"\n    },\n    {\n      \"anchor\": \"s3-3\",\n      \"title\": \"3️⃣ Les grands types d'obligations + déroulement émission\",\n      \"content\": \"**📚 Les grands types d'obligations** :\\n\\n| Type | Caractéristiques | Quand l'utiliser |\\n|---|---|---|\\n| 🔒 **Taux fixe** | Le plus classique. In fine au pair. 2-30 ans. Coupon fixe. | Émetteur veut figer son coût |\\n| 〰️ **Taux variable (FRN)** | Indexé Euribor 3 ou 6 mois. Prix de marché stable. | Si on anticipe baisse des taux |\\n| 📈 **Indexée inflation** | OATi (inflation FR) ou OATe (inflation EUR). Surtout pour les ÉTATS. | Protection contre l'inflation |\\n| 💥 **High Yield** | Non-IG. Taux fixe, bullet. Marges 500-600 bps. LBOs+++ | Émetteurs spéculatifs / LBO |\\n| 🤝 **Placement privé** | US PP / Schuldschein (Allemagne) / Euro PP. Pas de rating obligatoire. 5-12 ans. | Petits montants, sans rating |\\n| 💼 **Covered bonds** | Garanties par un pool d'actifs (banques). Notation excellente. | Refinancement bancaire |\\n| 🎫 **Zéro coupon** | Pas d'intérêt. Seul gain = prime de remboursement. | Cas particulier |\\n\\n---\\n\\n**🚀 Émission obligataire — déroulement type** :\\n\\n**📅 Préparation (~6 semaines)** :\\n- Sélection des **banques chefs de file**\\n- Rédaction du **prospectus** + accord **AMF**\\n- **Due diligence**\\n\\n**🚀 Lancement (en 1 journée !)** :\\n- **9h** : annonce fourchette de prix/taille\\n- **9h-12h** : **bookbuilding** (construction du livre d'ordres)\\n- **12h** : **guidance** (nouvelle indication de prix)\\n- **12h30** : clôture + annonce **prix final**\\n- **Début après-midi** : allocations aux investisseurs\\n- **16h** : publication des conditions finales\\n\\n💡 **Programme EMTN (Euro Medium Term Notes)** : documentation chapeau pour émettre rapidement plusieurs fois sans refaire tout le prospectus.\",\n      \"tip\": \"**Schuldschein** (Allemagne) = format de placement privé spécifique au marché allemand. Très utilisé par les **Mittelstand** (PME industrielles allemandes). Pas de rating obligatoire, taille 50-500 M€, maturité 5-7 ans. Format simple, juridiquement entre prêt et obligation. Apprécié des assureurs et fonds de pension allemands.\"\n    },\n    {\n      \"anchor\": \"s3-4\",\n      \"title\": \"4️⃣ Les titres hybrides (OC, OCEANE, ORNANE, OBSA, ORA, TSS)\",\n      \"content\": \"**🦄 Pourquoi « hybride » ?**\\n\\nCes titres se situent dans une **ZONE GRISE** entre la dette pure et les capitaux propres. Ils combinent :\\n- Caractéristiques **obligataires** (intérêts, maturité, remboursement)\\n- Caractéristiques **actions** (option de conversion, subordination, durée perpétuelle…)\\n\\n👉 Le mode de comptabilisation reflète cette ambiguïté : au bilan, la valeur de l'option est en **CAPITAUX PROPRES**, le reste en **DETTE**.\\n\\n---\\n\\n**🔄 L'OBLIGATION CONVERTIBLE (OC) — la reine des hybrides** :\\n\\n**💎 Comment ça marche ?**\\n\\nUne obligation (taux fixe en général) qui donne à son porteur le **DROIT (pas l'obligation) de la convertir en actions** à tout moment jusqu'à l'échéance.\\n\\n- 🎯 Conversion souvent 1 pour 1 (1 OC → 1 action)\\n- 🎯 Maturité : 3-7 ans\\n- 🎯 Cotée en bourse après émission\\n\\n💡 Vu par le souscripteur = **OBLIGATION + OPTION D'ACHAT (call) implicite** (non détachable)\\n\\n| 👔 Pour l'ÉMETTEUR | 💼 Pour l'INVESTISSEUR |\\n|---|---|\\n| ✅ Alternative à augmentation de capital (pas de dilution immédiate) · ✅ Placement rapide, marché moins volatile · ✅ Variété de structures possibles · ✅ Si pas converti : financement à **coût RÉDUIT** vs obligation classique | ✅ Possibilité de **plus-value** si l'action monte · ✅ **Protection à la baisse** (plancher actuariel) |\\n| ❌ Pas de certitude de conversion · ❌ Si l'action monte fort : avoir levé du capital à un prix inférieur au futur | ❌ Doit payer la **PRIME DE CONVERSION** à la souscription · ❌ Taux d'intérêt **RÉDUIT** (vs obligation classique) |\\n\\n**🎬 Exemple concret : Schneider Electric (nov 2020)** :\\n- 🏢 Émetteur : Schneider Electric SE (rating A3/A-)\\n- 💰 Taille : 650 M€\\n- 📅 Maturité : 5,6 ans\\n- 🎯 Prime de conversion : 50 %\\n- 💵 Prix d'émission : 107,75 % (au-dessus du pair)\\n- 🎁 Remboursement : au pair (100 %)\\n- 🎫 **COUPON ZÉRO + YTM négatif de -1,33 %** !!!\\n\\n👉 Schneider a EMPRUNTÉ à TAUX NÉGATIF — les investisseurs ont accepté de **PAYER pour prêter**, uniquement à cause de la valeur de l'option de conversion ! 🤯\\n\\n---\\n\\n**🧬 La famille des equity-linked** :\\n\\n| Produit | Caractéristique distinctive | Effet |\\n|---|---|---|\\n| 🔄 **OC classique** | Conversion en actions **nouvelles** | Augmentation de capital |\\n| 🔀 **OCEANE** | Conversion au choix de l'émetteur en actions **NOUVELLES OU EXISTANTES** (auto-détenues) | Flexibilité (évite dilution si possible) |\\n| 💱 **ORNANE** | Comme OCEANE + possibilité de remboursement en **CASH** | Flexibilité maximale, limite la dilution |\\n| 🎁 **OBSA** | Obligation + **bon de souscription SÉPARABLE** | Le bon se cote séparément |\\n| 🔁 **ORA** | Obligation Remboursable en Actions **AUTOMATIQUEMENT** | Pas optionnel = quasi-capital différé |\\n| 🔄 **Obligation ÉCHANGEABLE** | Échange en actions d'une **AUTRE société** (portefeuille détenu) | Cession à terme d'une participation. Ex : Eurazeo échangeable en Danone |\\n| 🪞 **Obligation SYNTHÉTIQUE** | OC + Call miroir → annule l'effet d'option | Aboutit à une pure obligation moins chère |\\n\\n---\\n\\n**🏛️ Le Titre Super Subordonné (TSS)** :\\n- Obligation à durée très longue (30, 50 ans voire perpétuelle)\\n- Rang **SUPER-subordonné** = remboursé juste avant les capitaux propres en cas de liquidation\\n- Reste juridiquement de la DETTE, mais traité comme du **quasi-capital** par les agences\\n\\n**🎬 Exemple** : **SUEZ** a émis en 2017 un TSS de 600 M€ pour acquérir GE Waters → comptabilisé en **CAPITAUX PROPRES IFRS**, Moody's considère **50 % comme fonds propres**.\\n\\n**🇫🇷 Le Prêt Participatif** :\\n- Emprunt subordonné de **DERNIER RANG**\\n- Créé par l'État français en 1978\\n- Réactivé en 2008 (crise financière) et 2021 (label « Relance » Covid) pour PME/ETI\",\n      \"key_point\": \"**L'OC est un outil ultra-puissant pour les émetteurs** : leur taux est réduit (de 1 à 3 points typiquement vs obligation pure) car les investisseurs ont l'option de conversion. Si l'action monte → dilution mais le capital aura été levé à un bon prix initial. Si l'action baisse → pas de conversion mais on a payé un taux faible.\",\n      \"comparison\": \"**OC vs OCEANE vs ORNANE — quelle différence ?**\\n\\n| | OC classique | OCEANE | ORNANE |\\n|---|---|---|---|\\n| **Choix de conversion** | Investisseur | **Émetteur** choisit nouvelles ou existantes | **Émetteur** choisit cash, nouvelles ou existantes |\\n| **Dilution** | Toujours, si conversion | Limitée si actions existantes | Quasi-éliminée si cash |\\n| **Flexibilité émetteur** | Faible | Moyenne | **Maximale** |\\n\\nL'**ORNANE** est devenue la **forme dominante** depuis 2010 — flexibilité maximale pour l'émetteur (peut éviter la dilution en payant cash). Tendance France/Europe.\"\n    },\n    {\n      \"anchor\": \"s3-5\",\n      \"title\": \"5️⃣ Finance verte, responsable et durable 🌱\",\n      \"content\": \"**🌍 Le contexte ESG (Environnement, Social, Gouvernance)** :\\n\\n**🌿 ENVIRONNEMENTAUX** :\\n- Réduction des émissions de gaz à effet de serre\\n- Recyclage des déchets\\n- Gestion de l'eau et des matières premières\\n- Prévention des risques environnementaux\\n\\n**🤝 SOCIAUX** :\\n- Conditions de travail / sécurité\\n- Santé et droits des employés\\n- Diversité et égalité des chances\\n- Dialogue social\\n\\n**⚖️ GOUVERNANCE** :\\n- Indépendance du conseil d'administration\\n- Transparence des rémunérations\\n- Féminisation des organes sociaux\\n- Lutte contre la corruption\\n\\n**📉 Pourquoi les marchés s'y intéressent** : les sociétés notées ESG fortes ont **SURPERFORMÉ** en bourse pendant la crise sanitaire (étude Morningstar : 90 % des indices ESG > indices traditionnels). Les sociétés à risques ESG sous-performent durablement : Volkswagen après **Dieselgate** (2015), Tepco après **Fukushima** (2011), Bayer après acquisition Monsanto (2018).\\n\\n---\\n\\n**🌳 Les 3 grandes catégories d'obligations vertes/durables** :\\n\\n| 🌿 **Green Bonds** | 🤝 **Social Bonds** | ♻️ **Sustainability-Linked Bonds (SLB)** |\\n|---|---|---|\\n| Engagement de financer des **INVESTISSEMENTS VERTS spécifiques** (usage des fonds). Catégories définies avec aide d'un cabinet indépendant. Suivi de l'usage des fonds requis. Marché ~700 Md€ début 2020. Coût légèrement plus attractif (~5-10 bps d'économie). | Financements à connotation sociale. **🎬 Ex CADES (2022)** : 6 Md€, 10 ans, taux 0,465 % (+18 bps OAT), demande > 25 Md€. | **Pas de restriction d'usage des fonds**, MAIS le **taux varie selon des KPI ESG**. **🎬 Ex HLD Europe (mai 2022)** : Euro PP 47 M€, 4,20 %, modulation selon réduction 4 % empreinte carbone/an. **🎬 Ex AHOLD** : taux 0,375 % → 0,625 % en 2025 si émissions carbone ne baissent pas de 29 %. |\\n\\n---\\n\\n**🏦 Les prêts verts (green loans) et durables (sustainability-linked loans)** :\\n\\nMêmes principes côté bancaire :\\n- **GREEN LOANS** : Term Loans ou RCF dédiés à un projet vert (**Danone** précurseur en France)\\n- **SUSTAINABILITY-LINKED LOANS** : taux indexé sur des KPI ESG/RSE\\n\\n**💰 Économie typique** : 5 à 10 bps moins cher (0,05-0,1 %)\\n**💸 Pénalité** si non-atteinte des objectifs : +25 bps (0,25 %)\\n\\n⚠️ **Limites** : volatilité du coût encore limitée, présomption de **GREENWASHING** parfois.\\n🎯 **Prédiction** : tant les obligations que les prêts ESG vont devenir **LA NORME**.\",\n      \"warning\": \"**Greenwashing** = risque majeur pour les émetteurs ESG. Les KPI doivent être **ambitieux, mesurables, vérifiables**. Sinon l'obligation perd son label, et c'est un scandale réputationnel. AMF, ESMA et la nouvelle taxonomie européenne durcissent les exigences depuis 2022.\",\n      \"tip\": \"**Lien avec ton métier** : en tant que futur auditeur EY, les **rapports ESG/durabilité** seront probablement audités sous référentiel **ISAE 3000** ou nouveau référentiel **ISSA 5000** (en cours de finalisation chez l'IAASB). EY a une équipe **Sustainability Assurance** dédiée.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Formule du Yield to Maturity (YTM) et différence avec le taux facial ?\",\n      \"a\": \"Le **YTM** (taux de rendement actuariel) est le **VRAI coût** pour l'émetteur. Il intègre : le taux d'intérêt facial + la prime d'émission (baisse le rendement) + la prime de remboursement (augmente le rendement) + les décalages temporels. **Si émis au pair ET remboursé au pair → YTM = taux facial**. Exemple Ahold (mars 2021) : coupon 0,375 % mais émise à 99,63 % → YTM = 0,417 %.\"\n    },\n    {\n      \"q\": \"Quelle est la frontière IG vs High Yield et pourquoi est-elle critique ?\",\n      \"a\": \"**IG (Investment Grade) = ≥ BBB-** (S&P) → accès grand marché, spreads bas. **HY (High Yield) = < BBB-** → marché spécialisé, spreads élevés. **Critique** parce que certains investisseurs institutionnels (assureurs LPP, fonds pension, monétaires) ne **PEUVENT PAS juridiquement** acheter du non-IG. Conséquence : tomber de BBB- à BB+ = **chute brutale du prix** (effet « falling angels » — force-selling).\"\n    },\n    {\n      \"q\": \"Différence entre OC, OCEANE et ORNANE ?\",\n      \"a\": \"**OC classique** : conversion en actions **nouvelles** (toujours dilutif). **OCEANE** : émetteur choisit d'utiliser actions **nouvelles OU EXISTANTES** (auto-détenues) — limite la dilution. **ORNANE** : émetteur peut aussi rembourser en **CASH** — flexibilité maximale, quasi-élimine la dilution. L'**ORNANE** est devenue la forme dominante depuis 2010 en France/Europe — flexibilité maximale pour l'émetteur.\"\n    },\n    {\n      \"q\": \"Pourquoi Schneider Electric a-t-il pu emprunter à TAUX NÉGATIF en novembre 2020 ?\",\n      \"a\": \"Grâce à une **OC à coupon zéro avec prix d'émission > 100 %**. Schneider Electric a émis une OC de 650 M€, coupon 0 %, prix d'émission **107,75 %** (au-dessus du pair), remboursement au pair (100 %). YTM résultant = **-1,33 %**. Les investisseurs ont accepté de **PAYER pour prêter** — uniquement à cause de la **valeur de l'option de conversion** (action Schneider en hausse + volatilité). Logique : sur le segment OC à prime, le rendement obligataire seul est négatif mais l'option de conversion vaut plus.\"\n    },\n    {\n      \"q\": \"Déroulement type d'une émission obligataire publique ?\",\n      \"a\": \"**📅 Préparation (~6 semaines)** : sélection banques chefs de file, rédaction prospectus + accord AMF, due diligence. **🚀 Lancement (1 journée)** : 9h annonce fourchette prix/taille → 9h-12h **bookbuilding** (construction du livre d'ordres) → 12h **guidance** (nouvelle indication) → 12h30 clôture + annonce prix final → après-midi allocations aux investisseurs → 16h publication conditions finales. **Programme EMTN** = documentation chapeau pour émettre rapidement plusieurs fois.\"\n    },\n    {\n      \"q\": \"Différence Green Bonds vs Sustainability-Linked Bonds (SLB) ?\",\n      \"a\": \"**Green Bonds** : usage des fonds RESTREINT à des investissements verts spécifiques (catégories définies, suivi requis, cabinet indépendant). Marché ~700 Md€ début 2020. **SLB** : usage des fonds LIBRE, MAIS le taux varie selon des KPI ESG (réduction émissions carbone, etc.). Ex AHOLD : 0,375 % qui passe à 0,625 % si émissions ne baissent pas de 29 %. **Green** = quoi tu fais avec l'argent. **SLB** = quel résultat global tu atteins. Économie typique : 5-10 bps moins cher si objectifs atteints, +25 bps pénalité si manqués.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF — HEC Paris — Initiation à la Comptabilité et la Finance\",\n    \"AMF — Autorité des marchés financiers (FR) : https://www.amf-france.org\",\n    \"S&P / Moody's / Fitch — méthodologies de rating publiques\",\n    \"ICMA — International Capital Market Association (Green Bond Principles, Social Bond Principles)\",\n    \"Vernimmen — Finance d'entreprise\"\n  ],\n  \"statut\": \"✅ Complet — 5 sections (paramètres obligataires, notation IG/HY, types + émission, hybrides OC/OCEANE/ORNANE/OBSA/ORA/TSS, finance ESG) + 6 auto-tests.\",\n  \"maj\": \"2026-05-22\"\n}\n", "cours_1_iccf_structure_financiere/semaine_4.json": "{\n  \"code\": \"ICCF — Semaine 4\",\n  \"title\": \"🟥 Semaine 4 — Restructuration du passif & de la dette\",\n  \"category\": \"HEC Paris — ICCF Cours 1\",\n  \"ref_msa\": \"Cours ICCF — Structure Financière & Financements\",\n  \"bases_legales\": \"Code de commerce FR · Loi sauvegarde 2005 · PACTE 2019\",\n  \"normes\": \"Cadres juridiques restructuration FR (mandat ad hoc, conciliation, sauvegarde, RJ)\",\n  \"niveau\": \"Initiation finance d'entreprise\",\n  \"summary\": \"Distinguer la **renégociation courante** (gestion active de la dette par le DAF — refinancement, waivers, swaps, debt push down…) de la **RESTRUCTURATION de crise** (situation de détresse financière). Maîtriser les **cadres juridiques français** (mandat ad hoc, conciliation, sauvegarde, redressement judiciaire), les **leviers de négociation** avec les créanciers (haircut, debt-equity swap, new money, return-to-better-fortune) et le **cas pratique emblématique Europcar 2020** (1,1 Md€ de conversion dette→capital).\",\n  \"mnemonics\": \"**Cadres juridiques FR — 4 niveaux d'escalation** : **(1) Mandat ad hoc** (préventif amiable, confidentiel) · **(2) Conciliation** (préventif amiable, plus grave) · **(3) Sauvegarde** (collectif avant cessation, ≈ Chapter 11) · **(4) Redressement judiciaire** (après cessation paiement, période d'observation 18 mois) · **(5) Liquidation** quand le redressement est impossible. **Restructuration ≠ Réorganisation** : la restructuration intervient en CRISE.\",\n  \"sections\": [\n    {\n      \"anchor\": \"s4-1\",\n      \"title\": \"1️⃣ La renégociation courante — gestion active de la dette\",\n      \"content\": \"Même **hors crise**, la dette se gère ACTIVEMENT par les DAF pour l'optimiser :\\n\\n- Changer de structure financière globale\\n- Arbitrer un mode de financement contre un autre\\n- Rallonger la maturité\\n- Bénéficier de meilleures conditions (taux, covenants)\\n\\n---\\n\\n**Leviers par type de dette** :\\n\\n| Dette **BANCAIRE MT/LT** | Dette **OBLIGATAIRE** | Dette **LBO** |\\n|---|---|---|\\n| 🔓 Relâchement des covenants à froid (**waiver**) en cas de bris attendu · 💸 Remboursement anticipé (avec éventuelle **make-whole provision**) · 📅 Modification des termes (maturité, taux…) → Quorum 2/3 souvent requis en RCF → Souvent + simple : **REFINANCEMENT complet** | 🤝 Offre publique de **RACHAT** (prime à payer) · 🔄 Offre d'**ÉCHANGE** contre nouvelles obligations · 🗳️ Vote en assemblée des porteurs (**consent fee**) · 📞 **Call émetteur** (remboursement anticipé avec prime) · 🔄 **Forçage** pour OC | ⬇️ **DEBT PUSH DOWN** : descendre la dette dans la société opérationnelle (si conso fiscale impossible) · 💰 **LEVERAGE RECAP** : recharger en dette pour payer un dividende exceptionnel à l'actionnaire (si désendettement plus rapide que prévu) · 🔁 Refinancement à meilleures conditions |\\n\\n---\\n\\n**🔄 Le SWAP sans renégociation** :\\n\\nTu veux passer de taux fixe à taux variable (ou inverse) ? **Pas besoin de toucher au prêt !**\\n\\nTu signes un swap de gré à gré avec une banque sur le « notionnel ». Le créancier final continue à recevoir ses intérêts à taux fixe, c'est l'entreprise qui troque ses flux avec la banque.\\n\\n✨ Marché très large : **swaps de taux**, **swaps de change**, **swaptions** (options de swap)…\",\n      \"tip\": \"**Make-whole provision** = clause qui oblige l'emprunteur, en cas de remboursement anticipé, à dédommager le prêteur de la perte de coupons futurs (actualisée). Permet au prêteur de récupérer son rendement attendu si l'emprunteur veut sortir avant échéance. Coûteux pour l'emprunteur — à arbitrer.\"\n    },\n    {\n      \"anchor\": \"s4-2\",\n      \"title\": \"2️⃣ La RESTRUCTURATION — situation de crise\",\n      \"content\": \"**⚠️ Restructuring ≠ Réorganisation**\\n\\nLa restructuration intervient en situation de **CRISE / DÉTRESSE FINANCIÈRE**. Elle exige presque toujours :\\n- **Modification profonde** de la stratégie et du périmètre\\n- **Refonte profonde** du PASSIF (notamment de la dette)\\n- Volet **économique, juridique, social ET financier**\\n\\n🇫🇷 **Cas français célèbres** : Saur, Solocal (ex-Pages Jaunes), Europcar, Camaïeu, Lafarge…\\n\\n---\\n\\n**🔍 Causes & symptômes de la détresse** :\\n\\n| 🌪️ **CAUSES** possibles | 🚨 **SYMPTÔMES** classiques |\\n|---|---|\\n| • Stratégie agressive au mauvais moment (ex: Lafarge rachetant Eurascom 9 Md€ en 2008) · • Lente décrue du secteur (ex: annuaires Pages Jaunes) · • Crise soudaine (ex: Europcar pendant le Covid) · • Endettement excessif (en général conséquence, pas cause) | **OPÉRATIONNELS** : • Chute des ventes · • Déclin des marges · • Pertes abyssales · • Cash-flow libre négatif<br><br>**FINANCIERS** (gravité croissante) : • Bris de covenants · • Défaut de paiement (partiel) · • **Cessation des paiements** (général) → faillite · • Cours de bourse → penny stock |\\n\\n---\\n\\n**💡 Le mantra : « Cash is King »**\\n\\nEn période de détresse, ce n'est PAS le résultat comptable qui compte, c'est la **GÉNÉRATION DE CASH**.\\n\\nUne entreprise peut être en pertes et **survivre** (si elle a du cash). Mais une entreprise sans cash **MEURT en quelques semaines**, même profitable sur le papier.\",\n      \"warning\": \"**Cessation des paiements = faillite imminente.** Définition légale FR : impossibilité de faire face au passif exigible avec l'actif disponible. Dès cette définition juridique remplie, le dirigeant a **45 jours** pour déclarer au tribunal (sinon : faute de gestion, responsabilité personnelle). C'est ici que tout bascule du monde amiable au monde collectif.\"\n    },\n    {\n      \"anchor\": \"s4-3\",\n      \"title\": \"3️⃣ Les cadres juridiques français (mandat ad hoc, sauvegarde, RJ)\",\n      \"content\": \"**4 niveaux d'escalation** selon la gravité de la situation :\\n\\n---\\n\\n**🤫 Procédures PRÉVENTIVES AMIABLES (confidentielles)** :\\n\\n**📋 MANDAT AD HOC** :\\n- **AVANT** cessation de paiements\\n- Mandataire ad hoc nommé par tribunal **sur demande du dirigeant**\\n- Aide à négocier avec créanciers\\n- **Confidentiel** (essentiel pour préserver les relations clients/fournisseurs)\\n- Durée : libre, généralement 3-6 mois renouvelables\\n\\n**🤝 CONCILIATION** :\\n- Cas plus graves (cessation récente possible)\\n- Conciliateur nommé par tribunal\\n- **4 mois** (prorogeables)\\n- **Confidentiel** également\\n- Permet la signature d'un **accord amiable** homologué (force exécutoire)\\n\\n---\\n\\n**🛡️ Procédures COLLECTIVES (avant cessation)** :\\n\\n**🏛️ SAUVEGARDE** :\\n- **AVANT** cessation\\n- Ouverte par tribunal **sur demande du dirigeant**\\n- **6 mois renouvelables**\\n- **Administrateur judiciaire** + **représentant des créanciers**\\n- **Gel de la dette** (« automatic stay »)\\n- ≈ **Chapter 11 américain**\\n\\n**⚡ SAUVEGARDE FINANCIÈRE ACCÉLÉRÉE** :\\n- Accord **2/3 des créanciers** suffit (au lieu de l'unanimité)\\n- Permet de boucler vite quand la base d'accord est large\\n\\n---\\n\\n**⚖️ Procédures COLLECTIVES (après cessation)** :\\n\\n**🚨 REDRESSEMENT JUDICIAIRE (RJ)** :\\n- **APRÈS** cessation des paiements (« dépôt de bilan »)\\n- Initiative créancier, entreprise ou tribunal\\n- **Période d'observation 18 mois max**\\n- **Issues** :\\n  - Plan de continuation\\n  - Plan de cession\\n  - Liquidation\\n\\n**💀 LIQUIDATION JUDICIAIRE** :\\n- Quand le redressement est impossible\\n- Vente des actifs, paiement des créanciers selon le rang, fin de l'entité.\",\n      \"comparison\": \"**Tableau récap des 4 niveaux** :\\n\\n| Niveau | Confidentialité | Cessation paiements ? | Durée | Initiative | Issue typique |\\n|---|---|---|---|---|---|\\n| **Mandat ad hoc** | Confidentiel | Avant | 3-6 mois | Dirigeant | Accord amiable |\\n| **Conciliation** | Confidentiel | Avant ou récente | 4 mois | Dirigeant | Accord homologué |\\n| **Sauvegarde** | **Public** | **Avant** | 6 mois renouv. | Dirigeant | Plan de sauvegarde |\\n| **Redressement judiciaire** | **Public** | **Après** | 18 mois max | Tous | Plan continuation/cession/liquidation |\",\n      \"info\": \"**Sauvegarde Financière Accélérée (SFA)** — variante apparue après 2010 pour les LBO en difficulté. L'idée : quand 2/3 des créanciers sont déjà d'accord (négociation amiable poussée), on bascule en sauvegarde pour **imposer** l'accord au 1/3 restant (« cram-down »). Très utile pour les holdings LBO où les minoritaires bloquent.\"\n    },\n    {\n      \"anchor\": \"s4-4\",\n      \"title\": \"4️⃣ Les remèdes — leviers de négociation\",\n      \"content\": \"**🎯 Deux objectifs majeurs en matière de dette** :\\n\\n1. **REPOUSSER LE MUR DE LA DETTE** (éviter la crise aiguë de liquidité)\\n2. Atteindre un **LEVIER SOUTENABLE** (Dette nette/EBITDA cohérent avec les nouvelles perspectives)\\n\\n---\\n\\n**💪 Les leviers actionnables avec les créanciers** :\\n\\n- ⏸️ **Différé de remboursement** du principal\\n- ⏰ **Extensions de maturités** (rallonger)\\n- 📉 **Taux d'intérêt RÉDUITS** pendant X années\\n- 🔓 **Covenants fortement RELÂCHÉS**\\n- 🔁 **DEBT EQUITY SWAP** : conversion d'une partie de la dette en **ACTIONS NOUVELLES**\\n- ✂️ **HAIRCUT** : abandons de créances purs et simples\\n\\n**💡 Exemple haircut** : ratio Dette/EBITDA à **8x** → les prêteurs choisissent entre :\\n- a) Accepter un **haircut de 50 %** (ramener le levier à 4x)\\n- b) Exiger le remboursement → liquidation → récupérer **< 50 %** du prêt\\n\\n→ La a) est en général la meilleure option même pour les créanciers !\\n\\n- 🌅 **Clauses de RETOUR À MEILLEURE FORTUNE** : **BSA gratuits** aux créanciers ou récupération des abandons en cas de retournement\\n\\n---\\n\\n**💰 La restructuration du CAPITAL** :\\n\\n🪦 **« OLD MONEY »** = anciens actionnaires :\\n- Leur valeur résiduelle est souvent proche de **ZÉRO**\\n- Logique : les capitaux propres sont la composante la plus risquée du passif (« first loss »)\\n\\n💵 **« NEW MONEY »** = capitaux propres NOUVEAUX en cash :\\n- Souvent **exigés** par les créanciers\\n- Augmentations de capital MASSIVES avec DPS et décote considérable\\n- **DILUTION MASSIVE** des anciens actionnaires\\n\\n🤝 Les **CRÉANCIERS** deviennent souvent les nouveaux **ACTIONNAIRES** via les debt equity swaps + BSA.\\n\\n---\\n\\n**🧑‍💼 L'entourage de l'entreprise en restructuration** :\\n\\n- 🏦 **BANQUES D'AFFAIRES** qui conseillent (rarement prêteuses pour éviter conflits d'intérêt) — Rothschild, Lazard, Houlihan Lokey, PJT Partners…\\n- 🔍 **CABINETS SPÉCIALISÉS INDÉPENDANTS** qui valident le nouveau plan d'affaires → **IBR** (Independent Business Review) — typiquement les Big 4 (EY, Deloitte, KPMG, PwC) ou Eight Advisory, Accuracy\",\n      \"key_point\": \"**Logique économique du haircut** : un créancier qui a face à lui une entreprise au levier 8x EBITDA a 2 options. (a) Accepter 50 % de haircut → ramener à 4x soutenable → l'entreprise survit → récupérer 50 % au final. (b) Refuser → liquidation → vendre les actifs à prix de feu → récupérer ~30-40 % du prêt seulement. **(a) est généralement la meilleure stratégie**, même pour les créanciers. D'où la pression pour négocier.\",\n      \"tip\": \"**Lien direct avec ton métier EY** : sur des dossiers de restructuration, EY (et particulièrement les équipes Transaction Advisory Services / Turnaround & Restructuring Strategy) est souvent mandaté pour produire l'**IBR**. C'est exactement ce que tu pourrais faire après quelques années d'audit !\"\n    },\n    {\n      \"anchor\": \"s4-5\",\n      \"title\": \"5️⃣ Cas pratique — Europcar Mobility Group (2020)\",\n      \"content\": \"**📖 Le contexte** :\\n\\n- 🏢 **Europcar** = leader européen location de véhicules (créé 1949)\\n- 💼 Racheté par **Eurazeo** au Groupe Volkswagen en 2007 (3 Md€ VE)\\n- 📈 **IPO en 2015** (Eurazeo conserve 30 %)\\n- 😷 **Crise sanitaire 2020** : CA quasi à 0 au Q1, EBITDA Corporate négatif > 200 M€\\n- 📉 Cours sept. 2020 : 0,30 € (capitalisation boursière : 50 M€)\\n\\n---\\n\\n**🛠️ La restructuration de novembre 2020** :\\n\\n- ⚖️ **Mandataire ad hoc** puis **conciliateur** nommés\\n- 🏦 **Rothschild** conseil de la société\\n\\n✅ Accord des porteurs de dette (obligations, facilité corporate Crédit Suisse, RCF) pour :\\n- Conversion MASSIVE en actions nouvelles (**debt equity swaps**)\\n- Attribution gratuite de **BSA** aux prêteurs\\n- Augmentation de capital garantie par les prêteurs\\n- Refinancement de la flotte\\n- Nouvelle RCF\\n\\n**💰 Au total** : **1,1 Md€ de conversion de dette en capital** + nouvelles liquidités\\n**📊 Levier financier attendu** : **< 2x en 2022**\\n\\n---\\n\\n**📊 Évolution capital et dette AVANT → APRÈS** :\\n\\n| | AVANT | APRÈS |\\n|---|---|---|\\n| **Eurazeo** | 31 % | **3 %** 😱 |\\n| **Public existant** | 57 % | **5 %** 😱 |\\n| **Autres (créanciers convertis)** | 12 % | **92 %** 🎯 |\\n| **Nombre d'actions** | 164 millions | **5 257 millions** (×32 !!!) |\\n| **DETTE BRUTE** | **2 018 M€** | **918 M€** (÷ 2 !) |\\n\\n👋 **Fin de l'histoire** : **Volkswagen rachète Europcar en 2022** via OPA + retrait de cote. Boucle complète : VW → Eurazeo (2007) → public (2015) → créanciers (2020) → VW (2022).\\n\\n---\\n\\n**🎬 Les sorties de crise possibles** :\\n\\n| 🌟 RÉUSSIE | 🔄 À RÉPÉTITION | 💀 LIQUIDATION |\\n|---|---|---|\\n| **SAUR (eau)** : ex-LBO en grande difficulté début 2010s · Restructuration massive + banques prennent le contrôle (2013) · Rachetée par fonds EQT (2018) · Valorisée > 3 Md€ début 2020s | **SOLOCAL (ex-Pages Jaunes)** : plusieurs restructurations successives · Échec du LBO KKR (2007) · Modèle en érosion continue (annuaires papier dépassés) · Difficulté à valoriser le digital | **CAMAÏEU** : enseigne célèbre de prêt-à-porter · Liquidation en 2022 · Une restructuration peut échouer, surtout quand le modèle économique lui-même est obsolète |\",\n      \"example\": \"**Europcar — illustration parfaite de TOUS les leviers** :\\n- ✅ **Cadre juridique** : mandat ad hoc → conciliation (procédures amiables, confidentielles initialement)\\n- ✅ **Debt equity swap** : 1,1 Md€ de dette converti en capital (créanciers → actionnaires)\\n- ✅ **BSA gratuits** aux prêteurs (clauses de retour à meilleure fortune)\\n- ✅ **New money** : augmentation de capital garantie par les prêteurs\\n- ✅ **Refinancement** : nouvelle RCF + financement flotte\\n- ✅ **Dilution massive** : Eurazeo et public existants laminés (31 % → 3 % et 57 % → 5 %)\\n- ✅ **Désendettement** : dette ÷ 2 (2 018 → 918 M€)\\n- ✅ **Sortie réussie** : rachat VW 2022 — happy end pour les nouveaux actionnaires (créanciers convertis)\",\n      \"key_point\": \"**Europcar = le cas d'école** : sur 1 dossier, on retrouve TOUS les outils de la restructuration. À mémoriser pour l'examen, et idéal pour structurer ta réponse oralement. Aussi cas pratique parlant pour des conversations EY.\"\n    }\n  ],\n  \"auto_test\": [\n    {\n      \"q\": \"Quelle est la différence entre renégociation courante et restructuration ?\",\n      \"a\": \"**Renégociation courante** = gestion active de la dette **HORS CRISE** par les DAF pour l'optimiser (refinancement, waivers, swaps, debt push down, leverage recap…). **Restructuration (restructuring)** = situation de **CRISE / DÉTRESSE FINANCIÈRE** exigeant : modification profonde de la stratégie, refonte du passif, volet économique + juridique + social + financier. Cas français : Saur, Solocal, Europcar, Camaïeu, Lafarge.\"\n    },\n    {\n      \"q\": \"Quels sont les 4 niveaux de cadres juridiques français en restructuration ?\",\n      \"a\": \"**(1) MANDAT AD HOC** : préventif amiable, **avant cessation paiements**, confidentiel, sur demande dirigeant. **(2) CONCILIATION** : préventif amiable, plus grave, 4 mois prorogeables, confidentiel, accord homologué possible. **(3) SAUVEGARDE** : collectif **avant cessation**, public, 6 mois renouvelables, administrateur judiciaire + représentant créanciers, gel dette, ≈ Chapter 11 US. **(4) REDRESSEMENT JUDICIAIRE** : collectif **après cessation paiements** (dépôt de bilan), période observation 18 mois max, issues = plan continuation/cession/liquidation. **(5) LIQUIDATION** quand redressement impossible.\"\n    },\n    {\n      \"q\": \"Pourquoi un haircut de 50 % est-il rationnel pour un créancier ?\",\n      \"a\": \"**Logique économique** : un créancier face à une entreprise au levier 8x EBITDA a 2 options. **(a)** Accepter 50 % de haircut → ramène à 4x soutenable → entreprise survit → récupère 50 % au final. **(b)** Refuser → liquidation → vente actifs à prix de feu → récupère ~30-40 % seulement. **(a) est généralement meilleure stratégie**, même pour les créanciers. D'où la pression pour négocier en amiable. Souvent complété par clauses **retour à meilleure fortune** (BSA gratuits aux créanciers ou récupération des abandons en cas de retournement).\"\n    },\n    {\n      \"q\": \"Qu'est-ce qu'un debt equity swap et pourquoi les créanciers deviennent actionnaires ?\",\n      \"a\": \"**Debt equity swap** = conversion d'une partie de la dette en **ACTIONS NOUVELLES**. Les créanciers (banques, porteurs obligataires) deviennent **actionnaires**. **Pourquoi ?** En crise, les anciens actionnaires (« **OLD MONEY** ») ont une valeur résiduelle proche de zéro (logique first-loss). Les créanciers acceptent d'échanger une partie de leur dette contre du capital pour : (1) ramener le levier à un niveau soutenable, (2) éviter la liquidation, (3) profiter du retournement futur s'il a lieu. **DILUTION MASSIVE** des anciens actionnaires. Souvent combiné avec **NEW MONEY** (augmentation capital cash) + BSA aux créanciers.\"\n    },\n    {\n      \"q\": \"Le cas Europcar 2020 — quels chiffres marquants retenir ?\",\n      \"a\": \"**Contexte** : Covid → CA quasi à 0 au Q1 2020, EBITDA Corporate négatif > 200 M€. **Action 11/2020** : mandat ad hoc → conciliation, conseil Rothschild. **Mécanique** : debt equity swap massif, BSA gratuits aux prêteurs, augmentation capital garantie, refinancement flotte, nouvelle RCF. **Chiffres** : **1,1 Md€** de dette convertie en capital, **dette brute 2 018 M€ → 918 M€** (÷ 2), **nombre d'actions 164M → 5 257M** (×32 !), **Eurazeo 31% → 3%**, **public 57% → 5%**, **créanciers convertis : 92% du capital**. **Fin** : **Volkswagen rachète Europcar en 2022** via OPA. Boucle complète VW → Eurazeo (2007) → public (2015) → créanciers (2020) → VW (2022).\"\n    },\n    {\n      \"q\": \"Qu'est-ce qu'un IBR (Independent Business Review) et qui le produit ?\",\n      \"a\": \"**IBR** = **Independent Business Review** = revue indépendante du **nouveau plan d'affaires** d'une entreprise en restructuration. Producteurs typiques : **cabinets spécialisés indépendants** (Big 4 — EY, Deloitte, KPMG, PwC, équipes Transaction Advisory Services / Turnaround & Restructuring) ou cabinets indépendants français (Eight Advisory, Accuracy). Objectif : **valider la crédibilité** du plan présenté par la direction aux créanciers — projections de cash flow, mesures opérationnelles, sensibilités, atteignabilité. Document central de la négociation. Lien direct avec le futur métier EY post-audit.\"\n    }\n  ],\n  \"sources\": [\n    \"Cours ICCF — HEC Paris — Initiation à la Comptabilité et la Finance\",\n    \"Code de commerce FR — Livre VI (Difficultés des entreprises)\",\n    \"Loi sauvegarde 2005 · Loi PACTE 2019 (transposition directive insolvabilité 2019/1023)\",\n    \"Cas Europcar 2020 — Rothschild & Co + communiqués officiels Europcar Mobility Group\",\n    \"Vernimmen — Finance d'entreprise (chapitre Restructuration)\"\n  ],\n  \"statut\": \"✅ Complet — 5 sections (renégociation courante, restructuration vs réorganisation, cadres juridiques FR, leviers négociation haircut/swap/BSA, cas pratique Europcar 2020) + 6 auto-tests.\",\n  \"maj\": \"2026-05-22\"\n}\n", "cours_2_iccf2_ma/_sommaire.md": "# Sommaire — ICCF2 Cours 2 : Fusions-Acquisitions (M&A)\n\n🎓 **HEC Paris — ICCF2 · Fusions-Acquisitions**\n📅 Synthèse complète du Cours 2 — 4 semaines en un coup d'œil\n\n---\n\n## 🗺️ Ce que tu vas trouver\n\n- 🟦 **SEMAINE 1** — Le marché du M&A, le process de cession & la valorisation\n- 🟩 **SEMAINE 2** — Typologie des opérations & schémas de rapprochement\n- 🟧 **SEMAINE 3** — Les grands enjeux de la négociation (prix, due diligence, SPA)\n- 🟥 **SEMAINE 4** — Les offres publiques (OPA/OPE) & conclusion sur le M&A\n\nÀ chaque section : concepts-clés, exemples réels (Veolia/Suez, LVMH/Tiffany, cas Dupont, Europcar…), tableaux et astuces mnémotechniques.\n\n---\n\n## 🟦 [SEMAINE 1 — Introduction au M&A, négociation & valorisation](semaine_1.json)\n\nComprendre ce qu'est le M&A, la taille et les cycles du marché, qui sont les intervenants, comment se déroule une cession (gré à gré vs enchères), et les grandes méthodes de **valorisation** (comparables, DCF).\n\n- [1️⃣ Qu'est-ce que le M&A — et la croissance externe ?](semaine_1.json#s1-1)\n- [2️⃣ Un marché vaste, cyclique et global](semaine_1.json#s1-2)\n- [3️⃣ Pourquoi acheter ? Opérateurs & moteurs de la décision](semaine_1.json#s1-3)\n- [4️⃣ Les intervenants — qui est autour de la table ?](semaine_1.json#s1-4)\n- [5️⃣ Vendre une société : gré à gré vs enchères](semaine_1.json#s1-5)\n- [6️⃣ La dynamique du process : le vendeur est le patron](semaine_1.json#s1-6)\n- [7️⃣ Valoriser : pourquoi, pour qui, paramètres-clés](semaine_1.json#s1-7)\n- [8️⃣ Les méthodes : comparables, DCF & autres](semaine_1.json#s1-8)\n- [9️⃣ Synthèse : combiner les méthodes & négociation](semaine_1.json#s1-9)\n\n---\n\n## 🟩 [SEMAINE 2 — Typologie des opérations & schémas de rapprochement](semaine_2.json)\n\nLa matrice des opérations (substance × paiement), les schémas cash / titres / apport, et leurs **impacts** : valorisation, actionnariat, levier, dilution/relution du BPA, goodwill et synergies.\n\n- [1️⃣ Définitions & typologie : la matrice 2×2](semaine_2.json#s2-1)\n- [2️⃣ Les grands schémas de rapprochement (cash, titres…)](semaine_2.json#s2-2)\n- [3️⃣ Impacts : valorisation, actionnariat & levier](semaine_2.json#s2-3)\
